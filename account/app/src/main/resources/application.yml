# ADR-0093 — account: member + wishlist 통합 설정.
# commerce 에 있던 두 도메인 구간을 그대로 옮겼다 — 키·기본값 무변경이라 재분리도 그대로다.
server:
  port: 8093
  shutdown: graceful

spring:
  application:
    name: account-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    # member 전용 (스키마 격리). 이 호스트에서는 member 가 primary 다.
    member:
      master:
        jdbc-url: jdbc:mysql://${MEMBER_DB_MASTER:localhost:3356}/member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${MEMBER_MYSQL_USER:member_user}
        password: ${MEMBER_MYSQL_PASSWORD:member_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${MEMBER_DB_REPLICA:localhost:3357}/member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${MEMBER_MYSQL_USER:member_user}
        password: ${MEMBER_MYSQL_PASSWORD:member_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
    # wishlist 전용 (스키마 격리, Kafka consumer)
    wishlist:
      master:
        jdbc-url: jdbc:mysql://${WISHLIST_DB_MASTER:localhost:3366}/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${WISHLIST_MYSQL_USER:wishlist_user}
        password: ${WISHLIST_MYSQL_PASSWORD:wishlist_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${WISHLIST_DB_REPLICA:localhost:3367}/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${WISHLIST_MYSQL_USER:wishlist_user}
        password: ${WISHLIST_MYSQL_PASSWORD:wishlist_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kgd:
  common:
    redis:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # member·wishlist 는 Redis 를 쓰지 않는다 — 코드에 RedisTemplate 사용이 0건이고
    # kgd.common.redis 도 꺼져 있다. 그런데 common 이 spring-boot-starter-data-redis 를
    # 끌고 와서 Boot 의 헬스 인디케이터만 살아 있고, 그게 기본값 localhost:6379 로 붙다
    # 실패해 **전체 health 가 503** 이 됐다(파드는 Ready 라 트래픽에는 영향 없음).
    # commerce 시절에는 호스트가 redis-1 을 설정해 줘서 가려져 있던 것이라, 폴드가
    # 드러낸 것이다. 안 쓰는 연결을 새로 여는 대신 인디케이터를 끈다.
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
