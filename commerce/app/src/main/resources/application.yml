spring:
  application:
    name: inventory-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    master:
      jdbc-url: jdbc:mysql://localhost:3328/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQL_USER:inventory_user}
      password: ${MYSQL_PASSWORD:inventory_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
    replica:
      jdbc-url: jdbc:mysql://localhost:3329/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQL_USER:inventory_user}
      password: ${MYSQL_PASSWORD:inventory_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
    # ADR-0058: commerce 폴드 — warehouse 도메인 전용 datasource(스키마 격리). env 는 inventory 와 분리.
    warehouse:
      master:
        jdbc-url: jdbc:mysql://${WAREHOUSE_DB_MASTER:localhost:3332}/warehouse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${WAREHOUSE_MYSQL_USER:warehouse_user}
        password: ${WAREHOUSE_MYSQL_PASSWORD:warehouse_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${WAREHOUSE_DB_REPLICA:localhost:3333}/warehouse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${WAREHOUSE_MYSQL_USER:warehouse_user}
        password: ${WAREHOUSE_MYSQL_PASSWORD:warehouse_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
    # ADR-0058: commerce 폴드 — fulfillment 도메인 전용 datasource(스키마 격리, 전용 outbox/idempotency).
    fulfillment:
      master:
        jdbc-url: jdbc:mysql://${FULFILLMENT_DB_MASTER:localhost:3330}/fulfillment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${FULFILLMENT_MYSQL_USER:fulfillment_user}
        password: ${FULFILLMENT_MYSQL_PASSWORD:fulfillment_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${FULFILLMENT_DB_REPLICA:localhost:3331}/fulfillment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${FULFILLMENT_MYSQL_USER:fulfillment_user}
        password: ${FULFILLMENT_MYSQL_PASSWORD:fulfillment_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
    # ADR-0058: commerce 폴드 — order 도메인 전용 datasource(스키마 격리, 전용 outbox/idempotency).
    order:
      master:
        jdbc-url: jdbc:mysql://${ORDER_DB_MASTER:localhost:3326}/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${ORDER_MYSQL_USER:order_user}
        password: ${ORDER_MYSQL_PASSWORD:order_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${ORDER_DB_REPLICA:localhost:3327}/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${ORDER_MYSQL_USER:order_user}
        password: ${ORDER_MYSQL_PASSWORD:order_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
    # ADR-0093 ② — deal 도메인 전용 datasource(deal_db).
    # 원래 code-dictionary 스키마를 공유했고, 파드가 갈리면서 자기 스키마로 뗐다.
    # 이 키가 있으면 DealDataSourceConfig 가 켜진다 — code-dictionary 에는 이 키가 없어
    # 거기서는 기존처럼 호스트 EMF 를 쓴다(전환 기간 동안 둘 다 서빙).
    deal:
      url: jdbc:mysql://${DEAL_DB_HOST:localhost:3338}/deal_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
      username: ${DEAL_MYSQL_USER:deal_user}
      password: ${DEAL_MYSQL_PASSWORD:deal_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 3
        minimum-idle: 1
    # ADR-0099 — seller 도메인 전용 datasource(seller_db). 인스턴스는 order 와 같고 스키마만 분리한다.
    # 풀 크기 키는 hikari. 하위가 아니라 여기 바로 둔다 — DataSourceBuilder 가 만든 HikariDataSource 에
    # 직접 바인딩되므로 hikari. 하위 키는 적용되지 않는다(컨텍스트 로드 spec 이 실제 값 3 을 확인).
    seller:
      master:
        jdbc-url: jdbc:mysql://${SELLER_DB_MASTER:localhost:3326}/seller_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${SELLER_MYSQL_USER:seller_user}
        password: ${SELLER_MYSQL_PASSWORD:seller_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 3
        minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${SELLER_DB_REPLICA:localhost:3327}/seller_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${SELLER_MYSQL_USER:seller_user}
        password: ${SELLER_MYSQL_PASSWORD:seller_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 3
        minimum-idle: 1
    # ADR-0099 — payment 도메인 전용 datasource(payment_db). seller 와 같이 order 인스턴스에 스키마만 분리한다.
    # 풀 크기 키는 hikari. 하위가 아니라 여기 바로 둔다(seller 와 같은 이유 — 컨텍스트 로드 spec 이 실제 값 3 을 확인).
    payment:
      master:
        jdbc-url: jdbc:mysql://${PAYMENT_DB_MASTER:localhost:3326}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${PAYMENT_MYSQL_USER:payment_user}
        password: ${PAYMENT_MYSQL_PASSWORD:payment_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 3
        minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${PAYMENT_DB_REPLICA:localhost:3327}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${PAYMENT_MYSQL_USER:payment_user}
        password: ${PAYMENT_MYSQL_PASSWORD:payment_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 3
        minimum-idle: 1
    # ADR-0093 — product 도메인 전용 datasource(카탈로그 SSOT, 스키마 격리).
    product:
      master:
        jdbc-url: jdbc:mysql://${PRODUCT_DB_MASTER:localhost:3316}/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${PRODUCT_MYSQL_USER:product_user}
        password: ${PRODUCT_MYSQL_PASSWORD:product_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 5
          minimum-idle: 2
      replica:
        jdbc-url: jdbc:mysql://${PRODUCT_DB_REPLICA:localhost:3317}/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${PRODUCT_MYSQL_USER:product_user}
        password: ${PRODUCT_MYSQL_PASSWORD:product_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 5
          minimum-idle: 2
    # ADR-0058 round 2 — member 도메인 전용 datasource(스키마 격리).
    member:
      master:
        jdbc-url: jdbc:mysql://${MEMBER_DB_MASTER:localhost:3356}/member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${MEMBER_MYSQL_USER:member_user}
        password: ${MEMBER_MYSQL_PASSWORD:member_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${MEMBER_DB_REPLICA:localhost:3357}/member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${MEMBER_MYSQL_USER:member_user}
        password: ${MEMBER_MYSQL_PASSWORD:member_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
    # ADR-0058 round 2 — wishlist 도메인 전용 datasource(스키마 격리, Kafka consumer).
    wishlist:
      master:
        jdbc-url: jdbc:mysql://${WISHLIST_DB_MASTER:localhost:3366}/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${WISHLIST_MYSQL_USER:wishlist_user}
        password: ${WISHLIST_MYSQL_PASSWORD:wishlist_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
      replica:
        jdbc-url: jdbc:mysql://${WISHLIST_DB_REPLICA:localhost:3367}/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${WISHLIST_MYSQL_USER:wishlist_user}
        password: ${WISHLIST_MYSQL_PASSWORD:wishlist_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 3
          minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  # ADR-0029 PR-3a: Flyway baseline. Hibernate ddl-auto=validate 와 결합해 스키마 변경은 Flyway 단독 책임.
  # baseline-on-migrate=true + baseline-version=1 로 기존 운영 DB(이미 ddl-auto 가 만든 테이블 보유) 보호.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  # 도메인마다 아웃박스 릴레이·정리·예약 만료 등 @Scheduled 가 여럿이다. 기본 1스레드면 긴 배치 하나가
  # 아웃박스 발행을 통째로 멈춘다.
  task:
    scheduling:
      pool:
        size: 4
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8085
  shutdown: graceful

kafka:
  topics:
    stock-reserved: inventory.stock.reserved
    stock-released: inventory.stock.released
    stock-confirmed: inventory.stock.confirmed
    reservation-expired: inventory.reservation.expired
    # ADR-0058: order 도메인 폴드 — order 발행 토픽
    order-completed: order.order.completed
    order-cancelled: order.order.cancelled
    # ADR-0093: product 도메인 폴드 — 카탈로그 발행 토픽.
    # search-consumer 가 이 둘을 소비해 색인한다 — 이름을 바꾸면 색인이 끊긴다.
    product-created: product.item.created
    product-updated: product.item.updated

# ADR-0058: order 도메인이 호출하는 외부 서비스 URL (commerce 폴드)
product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:9090}
  # ADR-0099 — 결제 도메인. PG 는 mock(기본, 서버 승인·항상 승인) | toss(토스페이먼츠 v1).
  # 운영(oci-arm)은 mock — commerce 상시 파드에 외부 egress 가 없다. toss 로 바꾸려면 egress 예외 ADR 이 먼저다.
  pg: ${PAYMENT_PG:mock}
  flyway:
    enabled: true
  toss:
    # **기본값을 두지 않는다.** pg=toss 일 때만 읽히고, 그때 없으면 기동하지 않는다(pg=mock 은 읽지 않는다).
    secret-key: ${TOSS_SECRET_KEY}
    webhook-secret: ${TOSS_WEBHOOK_SECRET}

outbox:
  polling:
    enabled: ${OUTBOX_POLLING_ENABLED:true}

# ADR-0099 — 판매자 도메인.
seller:
  flyway:
    enabled: true
  account:
    # 정산 계좌 AES-256-GCM 키(hex 64자). **기본값을 두지 않는다** — 없으면 commerce 가 기동하지 않는다.
    # 값은 Secret `seller-account-enc` 에서 온다(seller/CLAUDE.md). 키를 잃으면 저장된 계좌를 못 푼다 — 백업 대상.
    enc-key: ${SELLER_ACCOUNT_ENC_KEY}
    key-version: 1

inventory:
  reservation:
    ttl-minutes: 30
  reconciliation:
    interval-ms: 300000
  admission:
    max-concurrent-reservations: ${INVENTORY_MAX_CONCURRENT_RESERVATIONS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
