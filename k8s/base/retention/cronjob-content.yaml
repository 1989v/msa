apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention-content
  namespace: commerce
  labels:
    # retention 과 같은 이유로 :443 egress 화이트리스트에 **없다** — DB 만 만진다.
    app.kubernetes.io/name: retention-content
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: retention
spec:
  # ADR-0077 / ADR-0093 — content 파드가 가진 원장 정리 (party_friend_group 365일).
  #
  # code-dictionary 의 retention 에서 갈라져 나왔다. game 이 content 로 옮겨가면서
  # 그 이미지에는 party_friend_group 을 아는 코드가 없다 — 원장이 사는 이미지가 정리한다.
  #
  # 일요일 05:30 UTC = 14:30 KST. retention(05:00)보다 30분 뒤에 둔다 — 단일 노드에서
  # 배치 둘이 겹치면 메모리가 함께 뛴다.
  schedule: "30 5 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      # ImagePullBackOff 는 backoffLimit 의 실패로 안 잡혀 Job 이 Running 인 채로 남고,
      # Forbid 가 그 뒤 실행을 전부 막는다. 시간으로 끊는다.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retention-content
            # part-of 누락 시 default-deny 에서 egress 미허용 → MySQL 접근조차 불가
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: retention
              # 새 이미지를 만들지 않는다 — content 앱을 웹서버 없이 띄웠다가 끝나면 내린다.
              image: commerce/content:latest
              imagePullPolicy: IfNotPresent
              args:
                - "--spring.main.web-application-type=none"
                # retention 프로파일이 GameRetentionRunner 를 켠다.
                - "--spring.profiles.active=kubernetes,retention"
              env:
                # content 컨텍스트를 그대로 띄우므로 이 키가 필요하다 (ADR-0092).
                # 배치는 좌석 토큰을 안 쓰지만, 서명 컴포넌트가 키 없이는 안 뜬다.
                - name: GAME_HMAC_SECRET
                  valueFrom:
                    secretKeyRef: { name: game-hmac, key: secret }
                - name: GAME_DB_MASTER
                  value: "mysql-code-dictionary-master:3306"
                - name: GAME_DB_REPLICA
                  value: "mysql-code-dictionary-master:3306"
              resources:
                requests: { cpu: 100m, memory: 384Mi }
                limits:   { memory: 640Mi }
