apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention
  namespace: commerce
  labels:
    # 이 이름은 :443 egress 화이트리스트(network-policy/11)에 **없다** — 의도적이다.
    # 이 배치는 DB 만 만지므로 외부 노출면을 늘리지 않는다.
    app.kubernetes.io/name: retention
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: retention
spec:
  # ADR-0077 — 원장 보존기간 정리 (blog_post_view 90일, resume_access_log 365일).
  #
  # 일요일 05:00 UTC = 14:00 KST. deal-linkcheck(04:00 UTC)보다 한 시간 뒤에 둔다 —
  # 같은 이미지를 띄우는 배치 둘이 겹치면 단일 노드에서 메모리가 함께 뛴다.
  # 게임 주간 통계 리셋(월요일 00:00 KST = 일요일 15:00 UTC)과도 떨어뜨렸다.
  schedule: "0 5 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retention
            # part-of 누락 시 default-deny 에서 egress 미허용 → MySQL 접근조차 불가
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: retention
              # 새 이미지를 만들지 않는다 — 호스트 앱을 웹서버 없이 띄웠다가 끝나면 내린다.
              image: commerce/code-dictionary:latest
              imagePullPolicy: IfNotPresent
              args:
                # 웹서버를 띄우지 않는다. ApplicationRunner 가 끝나면 컨텍스트가 닫히고 종료된다.
                - "--spring.main.web-application-type=none"
                # retention 프로파일이 RetentionRunner 를 켠다.
                - "--spring.profiles.active=kubernetes,retention"
              env:
                # DB 자격증명은 application.yml 기본값을 쓴다(oci-arm 은 그 값으로 프로비저닝됨).
                # prod-k8s 로 올릴 때는 Deployment 와 같은 Secret 주입 패치를 이 CronJob 에도 걸 것.
                - name: GAME_DB_MASTER
                  value: "mysql-code-dictionary-master:3306"
                - name: GAME_DB_REPLICA
                  value: "mysql-code-dictionary-master:3306"
              resources:
                requests: { cpu: 100m, memory: 384Mi }
                limits:   { memory: 640Mi }
