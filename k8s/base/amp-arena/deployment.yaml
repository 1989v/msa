# AMP ARENA — 8인 실시간 대전 액션. Node 22 한 프로세스가 정적 클라와 WebSocket(/ws)을 같이 낸다.
# 방마다 60틱 시뮬이 돌아 CPU 는 방 수에 비례한다. 무료 티어라 1 파드·작은 한도로 시작하고 실측 뒤 조정.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amp-arena
  namespace: commerce
  labels:
    app.kubernetes.io/name: amp-arena
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 1
  # 방 상태가 메모리에 있어 두 파드가 동시에 살면 방 목록이 갈린다 — 교체 시 옛 파드를 먼저 내린다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: amp-arena
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amp-arena
        app.kubernetes.io/part-of: commerce-platform
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: commerce/amp-arena:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 30m
              memory: 96Mi
            limits:
              memory: 256Mi
