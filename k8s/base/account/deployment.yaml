# ADR-0093 — account: member + wishlist 폴드. commerce 에서 떼어 온 두 도메인이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
  namespace: commerce
  labels:
    app.kubernetes.io/name: account
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account
        app.kubernetes.io/part-of: commerce-platform
    spec:
      serviceAccountName: account
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: commerce/account:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8093
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
