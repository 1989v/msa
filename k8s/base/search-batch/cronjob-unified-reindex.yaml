apiVersion: batch/v1
kind: CronJob
metadata:
  name: unified-reindex
  namespace: commerce
  labels:
    app.kubernetes.io/name: search-batch
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: reindex
spec:
  # ADR-0090 D6 — 관광지를 뺀 타입(글·게임·개념·혜택·서비스·상품)의 통합 인덱스 재색인 (alias swap).
  # 원천은 각 호스트의 공개 API 풀스캔이고 합쳐야 수백 건이라 매일 한 번이면 된다.
  # 관광지 재색인(04:30 KST) 뒤에 둔다 — 같은 OpenSearch 에 bulk 를 겹치지 않게.
  #   kubectl -n commerce create job --from=cronjob/unified-reindex unified-reindex-manual
  #
  # **관광지 재색인이 끝난 뒤에 돈다.** 그쪽은 04:30 에 시작해 6만 건을 싣느라 23분쯤 걸리는데,
  # 04:45 는 그 한가운데였다 — 같은 단일 노드의 OpenSearch 와 원천 파드를 함께 누른다.
  schedule: "10 20 * * *"   # 05:10 KST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      # ImagePullBackOff 는 실패로 안 잡혀 Job 이 Running 인 채로 남고 Forbid 가 그 뒤 실행을 막는다.
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: search-batch
            # part-of 누락 시 default-deny 에서 egress 미허용 → opensearch/호스트 접근 불가
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: reindex
        spec:
          # 재시도마다 **새 파드**를 만든다. OnFailure 는 같은 파드에서 컨테이너만 다시 띄워
          # 첫 시도의 로그가 덮이고, 파드가 사라지면 실패 원인이 통째로 사라진다.
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: reindex
              image: commerce/search-batch:latest
              imagePullPolicy: IfNotPresent
              args:
                - "--spring.batch.job.enabled=true"
                - "--spring.batch.job.name=unifiedReindexJob"
              env:
                - name: OPENSEARCH_URIS
                  value: "http://opensearch:9200"
                # 글·게임은 content, 개념·전시 서비스는 atlas, 혜택·상품은 commerce (ADR-0093 배분)
                - name: PLACE_SERVICE_URL
                  value: "http://content:8097"
                - name: ATLAS_SERVICE_URL
                  value: "http://atlas:8089"
                - name: PRODUCT_SERVICE_URL
                  value: "http://commerce:8085"
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits:   { memory: 1Gi }
