apiVersion: batch/v1
kind: CronJob
metadata:
  name: attraction-reindex
  namespace: commerce
  labels:
    app.kubernetes.io/name: search-batch
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: reindex
spec:
  # ADR-0065 — 관광지 전체 재색인(alias swap). attractionApiReindexJob 이 place API 를
  # 페이지네이션 풀-스캔하여 attractions 인덱스를 재구축한다.
  #
  # ADR-0070 — place-ingest-overview(KST 04:00) 가 매일 개요를 채우므로 재색인도 매일 돈다.
  # 30분 간격을 두는 이유: 개요 잡이 외부 API 한도에 걸려 느려져도 재색인이 앞지르지 않게 한다.
  #   온디맨드:  kubectl -n commerce create job --from=cronjob/attraction-reindex attraction-reindex-manual
  suspend: false
  # 매일 UTC 19:30 = KST 04:30
  schedule: "30 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # 새로 뜬 파드는 첫 몇 초간 DNS egress 가 막힌다 — k3s 가 netpol 에 파드 IP 를
      # 등록하기 전이라 CoreDNS 로 못 나가고 `UnknownHostException: opensearch` 로 죽는다.
      # 노드가 포화(대량 롤아웃)면 이 창이 1분 넘게 벌어져 2회로는 못 넘긴다.
      # 재색인은 멱등(alias swap)이라 재시도에 부작용이 없다.
      backoffLimit: 4
      # 시간이 지나면 Job 을 끊는다. backoffLimit 은 실패 횟수를 세는데 ImagePullBackOff 는
      # 실패로 안 잡혀 Job 이 Running 인 채로 남고, Forbid 가 그 뒤 실행을 전부 막는다.
      # 관측 소요 125~157초.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: search-batch
            # part-of 누락 시 default-deny 에서 egress 미허용 → opensearch/place 접근 불가
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: reindex
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: reindex
              image: commerce/search-batch:latest
              imagePullPolicy: IfNotPresent
              args:
                # 기본값(enabled=false)이면 웹서버만 뜨고 잡이 실행되지 않는다
                - "--spring.batch.job.enabled=true"
                - "--spring.batch.job.name=attractionApiReindexJob"
              env:
                - name: OPENSEARCH_URIS
                  value: "http://opensearch:9200"
                - name: PLACE_SERVICE_URL
                  value: "http://place:8096"
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits:   { memory: 1Gi }
