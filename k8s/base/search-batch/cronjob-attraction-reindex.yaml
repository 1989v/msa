apiVersion: batch/v1
kind: CronJob
metadata:
  name: attraction-reindex
  namespace: commerce
  labels:
    app.kubernetes.io/name: search-batch
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: reindex
spec:
  # ADR-0065 — 관광지 전체 재색인(alias swap). attractionApiReindexJob 이 place API 를
  # 페이지네이션 풀-스캔하여 attractions 인덱스를 재구축한다.
  #
  # ADR-0070 — place-ingest-overview(KST 04:00) 가 매일 개요를 채우므로 재색인도 매일 돈다.
  # 새벽 수집이 전부 끝난 뒤에 돈다 — 마지막 수집은 사진·반복정보(media, KST 06:00, 실측 6분)다.
  # 04:30 에 돌던 때는 이용정보(05:00)·사진(06:00)이 하루 늦게 화면에 올라갔다. 30분 여유는 수집이 한도에 걸려 느려져도
  # 재색인이 앞지르지 않게 둔 것이다.
  #   온디맨드:  kubectl -n commerce create job --from=cronjob/attraction-reindex attraction-reindex-manual
  suspend: false
  # 매일 UTC 21:30 = KST 06:30
  schedule: "30 21 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # 새로 뜬 파드는 첫 몇 초간 DNS egress 가 막힌다 — k3s 가 netpol 에 파드 IP 를
      # 등록하기 전이라 CoreDNS 로 못 나가고 `UnknownHostException: opensearch` 로 죽는다.
      # 노드가 포화(대량 롤아웃)면 이 창이 1분 넘게 벌어져 2회로는 못 넘긴다.
      # 재색인은 멱등(alias swap)이라 재시도에 부작용이 없다.
      backoffLimit: 4
      # 시간이 지나면 Job 을 끊는다. backoffLimit 은 실패 횟수를 세는데 ImagePullBackOff 는
      # 실패로 안 잡혀 Job 이 Running 인 채로 남고, Forbid 가 그 뒤 실행을 전부 막는다.
      # 관측 소요 125~157초.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: search-batch
            # part-of 누락 시 default-deny 에서 egress 미허용 → opensearch/place 접근 불가
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: reindex
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: reindex
              image: commerce/search-batch:latest
              imagePullPolicy: IfNotPresent
              args:
                # 기본값(enabled=false)이면 웹서버만 뜨고 잡이 실행되지 않는다
                - "--spring.batch.job.enabled=true"
                - "--spring.batch.job.name=attractionApiReindexJob"
              env:
                - name: OPENSEARCH_URIS
                  value: "http://opensearch:9200"
                - name: PLACE_SERVICE_URL
                  value: "http://content:8097"
                # 이 값이 비면 벡터 없이 색인한다(첫 채움 전 정상 상태).
                # search:app 의 search.query-vector.model-ref 와 **한 글자도 달라선 안 된다.**
                - name: SEARCH_EMBEDDING_MODEL_REF
                  value: "microsoft/harrier-oss-v1-270m@31de22b#d640"
                # 클릭 신호 — analytics 집계 표를 직접 읽는다(ADR-0095 §6, 네트워크 정책 09 가 search-batch 를 허용).
                # 빠지면 기본값 localhost 로 가서 매일 「읽기 실패 → 필드 비움」이 된다 — 로그의 「클릭 신호」 줄로 확인한다.
                # 계정은 analytics Deployment 와 같은 값이다(ClickHouse 계정은 Secret 없이 평문으로 배포돼 있다).
                - name: CLICKHOUSE_JDBC_URL
                  value: "jdbc:clickhouse://clickhouse:8123/analytics"
                - name: CLICKHOUSE_USER
                  value: "analytics"
                - name: CLICKHOUSE_PASSWORD
                  value: "analytics"
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits:   { memory: 1Gi }
