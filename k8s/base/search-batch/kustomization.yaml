apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commerce
# ADR-0058 — 상주 Deployment 제거. batch 는 CronJob 으로만 구동(idle 메모리 0).
resources:
  - serviceaccount.yaml
  # search-eval-daily(상품 기준선 평가)는 2026-09-27 제거 — 판정 0행으로 매일 건너뛰기만 했다.
  # 검색 품질 평가는 search-eval (관광지 판정 150쿼리 · 6,530쌍 · 3구성 nDCG@10, 스크립트·판정은 eval/).
  - cronjob-eval.yaml
  - cronjob-reindex.yaml
  - cronjob-attraction-reindex.yaml
  - cronjob-region-reindex.yaml
  - cronjob-unified-reindex.yaml

# 평가 스크립트·판정 세트 — 파일이 바뀌면 이름 해시가 바뀌어 CronJob 이 새 것을 가리킨다
configMapGenerator:
  - name: search-eval
    files:
      - eval/live-eval.py
      - eval/judgments-attractions-2026-10-05.json
