apiVersion: batch/v1
kind: CronJob
metadata:
  name: search-eval
  namespace: commerce
  labels:
    app.kubernetes.io/name: search-eval
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: eval
spec:
  # 관광지 검색 품질 회귀 감시 — 판정 세트 v3(9,692쌍, 쿼리 228) 으로 3구성 nDCG@10 과 의도별 표를 매일 잰다.
  # 하이브리드+쿼리 언더스탠딩(C, 라이브 API) 이 기준선보다 EVAL_TOLERANCE 넘게 떨어지면 Job 이 Failed 로 남는다.
  # 기록 표와 결과는 scripts/search-eval/README.md.
  #   온디맨드:  kubectl -n commerce create job --from=cronjob/search-eval search-eval-manual
  # 매일 UTC 22:30 = KST 07:30 — attraction-reindex(KST 06:30, 5~10분) 가 끝난 색인을 잰다.
  # 재색인 시각을 옮기면 이것도 옮긴다 — 앞서 돌면 전날 색인을 재고 통과한다.
  schedule: "30 22 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # 회귀 판정도 종료 코드 1 이라 재시도하면 같은 결과를 네 번 잰다 — 재시도하지 않는다.
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: search-eval
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: eval
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: eval
              # 인코더 이미지를 그대로 쓴다 — 파이썬이 이미 있고 노드에 받아져 있다. 스크립트는 표준 라이브러리만 쓴다.
              image: commerce/search-embed:latest
              imagePullPolicy: IfNotPresent
              # 새 파드는 첫 몇 초간 DNS egress 가 막힌다(attraction-reindex 참고) — 기다렸다 시작한다.
              command: ["sh", "-c", "sleep 20 && exec python3 /eval/live-eval.py /eval/judgments-attractions-2026-10-11.json"]
              env:
                # search:app 의 search.query-vector.model-ref 와 같아야 한다
                - name: EVAL_MODEL_REF
                  value: "microsoft/harrier-oss-v1-270m@31de22b#d640"
                # 판정 세트 v3(2026-10-11, 228쿼리)로 잰 C — NO_ANSWER 13 질의는 빼고 낸 평균.
                # 배포 뒤 이 CronJob 과 같은 Job 으로 잰 값(2026-10-11 12:26 KST). v2 기준선(ko .7767 · en .7140)은 눈금이 달라 비교하지 않는다.
                # 색인 드리프트로 ±0.02 움직인 적이 있어 허용폭은 0.03.
                # 판정 세트를 바꾸면 점수 눈금이 바뀐다 — 옛 기준선을 그대로 두면 게이트가 사실상 열린다.
                - name: EVAL_BASELINE_KO
                  value: "0.7428"
                - name: EVAL_BASELINE_EN
                  value: "0.7216"
                - name: EVAL_TOLERANCE
                  value: "0.03"
              volumeMounts:
                - name: eval
                  mountPath: /eval
                  readOnly: true
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { memory: 256Mi }
          volumes:
            - name: eval
              configMap:
                name: search-eval
