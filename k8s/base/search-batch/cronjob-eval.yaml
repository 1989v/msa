apiVersion: batch/v1
kind: CronJob
metadata:
  name: search-eval-daily
  namespace: commerce
  labels:
    app.kubernetes.io/name: search-batch
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: eval
spec:
  # ADR-0050 Phase 4 — 매일 02:00 UTC (KST 11:00) 검색 ranking 오프라인 평가
  schedule: "0 2 * * *"
  # 2026-09-22 중단. 이 잡은 상품 검색 기준선(products 인덱스 name match)이고 판정을 analytics.search_judgments
  # 에서 읽는데 그 표가 0행이라 매일 "No judgments found — skipping eval" 로 COMPLETED 만 찍었다 — 재는 게 없는
  # 초록불. 지금 검색 품질 근거는 관광지 판정 2,141건과 scripts/search-eval/ 이다. 이 잡을 되살리려면
  # 실행기를 관광지 하이브리드(앱 API)로 바꾸고 판정을 ClickHouse 에 적재한 뒤 suspend 를 푼다.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      # 시간이 지나면 Job 을 끊는다. backoffLimit 은 실패 횟수를 세는데 ImagePullBackOff 는
      # 실패로 안 잡혀 Job 이 Running 인 채로 남고, Forbid 가 그 뒤 실행을 전부 막는다.
      # 관측 소요 성공 이력 없음초.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: search-batch
            # part-of 누락 시 default-deny 에서 egress 미허용 → opensearch/clickhouse 접근 불가
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: eval
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: eval
              image: commerce/search-batch:latest
              imagePullPolicy: IfNotPresent
              args:
                # 기본값(enabled=false)이면 웹서버만 뜨고 잡이 실행되지 않는다
                - "--spring.batch.job.enabled=true"
                - "--spring.batch.job.name=searchEvaluationJob"
                - "--search.eval.enabled=true"
                - "--search.eval.variant=baseline"
              env:
                - name: OPENSEARCH_URIS
                  value: "http://opensearch:9200"
                - name: SEARCH_EVAL_CLICKHOUSE_URL
                  value: "jdbc:clickhouse://clickhouse:8123/analytics"
                - name: SEARCH_EVAL_CLICKHOUSE_USER
                  value: "analytics"
                - name: SEARCH_EVAL_CLICKHOUSE_PASSWORD
                  value: "analytics"
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits:   { memory: 1Gi }
