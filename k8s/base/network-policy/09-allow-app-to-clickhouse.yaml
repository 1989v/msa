# ADR-0031 §1 (table) — {analytics, quant, quant-ingest, recommendation} → ClickHouse (8123 HTTP)
#
# ClickHouse 호출 서비스:
#   - analytics      events 적재/조회
#   - quant          OHLCV 차트 read (ChartController)
#   - quant-ingest   OHLCV write (yfinance/FDR sidecar)
#   - recommendation ADR-0045 Phase 1 — analytics DB 의 recommendation_events MV read + raw insert
# 다른 서비스가 추가로 필요해지면 ingress.from.podSelector matchExpressions 에 추가.
#
# 라벨 선택 근거:
#   - k8s/infra/local/clickhouse/service.yaml:8 (app.kubernetes.io/name=clickhouse)
#   - k8s/base/analytics/deployment.yaml:7 (app.kubernetes.io/name=analytics)
#
# 포트 비고: ClickHouse 의 HTTP interface = 8123 (default). Native TCP = 9000 (미사용).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-clickhouse
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  # search-batch 는 검색 평가 잡(search-eval-daily)이 ClickHouse 의 클릭 로그를 읽어
  # 랭킹 지표를 낸다. 목록에 없어 그 잡은 만들어진 뒤 **한 번도 성공한 적이 없었다** —
  # 연결 거부가 방화벽 때문인데 앱 오류처럼 보여 오래 묻혀 있었다 (2026-08-22 규명).
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [analytics, quant, quant-ingest, recommendation, recommendation-ml, search-batch] }
      ports:
        - { port: 8123, protocol: TCP }   # HTTP — recommendation 등이 사용
        - { port: 9000, protocol: TCP }   # Native TCP — recommendation-ml (clickhouse_driver) 가 사용
