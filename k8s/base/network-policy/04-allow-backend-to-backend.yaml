# ADR-0031 §5.5 — 백엔드 ↔ 백엔드 (제한적)
#
# 직접 백엔드-백엔드 호출은 의도적으로 마찰을 둔다 (Saga / 이벤트 기반 권장).
# 현재 허용되는 페어:
#   - search-batch → commerce (productApiReindexJob 페이지 스캔 + seed Job bulk 적재, ADR-0056/0058)
#   - auth → commerce         (SSO 회원 조회/생성)
#
# ADR-0093: order → product 는 **규칙이 필요 없어졌다** — 둘 다 commerce 안이라 프로세스 내부
# 호출이다. product 를 가리키던 두 규칙은 파드가 사라져 아무것도 선택하지 않는 채로 남아 있었고,
# search-batch 쪽은 그래서 **실제로 막힌 상태**였다(대상 CronJob 이 suspend 라 안 드러났을 뿐).
# 라벨을 따라가지 않으면 규칙은 에러 없이 무효가 된다.
#   - search-batch → content  (attractionApiReindexJob 페이지 풀스캔, ADR-0065)
#   - search → content        (질의 이해가 쓰는 분류 코드표 조회, ADR-0090 D8)
#     ADR-0093: place 는 content 파드로 폴드됐다.
#
# 새 백엔드-백엔드 호출이 추가되면 별도 NetworkPolicy 를 추가한다.
# 공유 manifest 한 파일에 모아두고 ingress 를 늘리는 방식 (per-target)으로 관리.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-search-batch-to-commerce
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: commerce
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search-batch
      ports:
        - { port: http, protocol: TCP }
---
# auth → commerce : SSO 로그인 시 회원 조회/생성(POST /api/members/sso).
# default-deny 아래서 백엔드 간 통신은 명시 허용이 없으면 막힌다 — gateway→백엔드만 열려 있어
# auth 가 commerce 로 나가지 못했고, 구글 인증을 통과하고도 콜백에서 로그인이 실패했다
# (2026-08-09. 증상은 Connection refused 라 앱 장애처럼 보였다).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-to-commerce
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: commerce
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
      ports:
        - { port: http, protocol: TCP }
---
# search-batch → place : attractionApiReindexJob 이 관광지 SSOT 를 페이지 풀스캔 (ADR-0065).
# place-ingest → place : 개요·링크 수집이 큐 조회/적재를 place API 로 한다 (ADR-0070/0071).
#   빠뜨리면 k3s netpol 이 REJECT 라 CronJob 이 "Connection refused" 로 죽는다 — 지금까지
#   수동 적재가 됐던 건 kubectl port-forward 가 NetworkPolicy 를 우회하기 때문이었다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-search-batch-to-place
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: content
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search-batch
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: place-ingest
        # search → place : 질의 이해가 분류 코드표를 기동 시 받아 캐시한다 (ADR-0090 D8).
        #   빠뜨리면 "Connection refused" 만 남고 **검색은 멀쩡히 돈다** — 사전이 빈 채로
        #   의도어가 검색어로 남을 뿐이라 장애로 안 보인다. 그래서 더 늦게 발견된다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search
      ports:
        - { port: http, protocol: TCP }
---
# ranking-ingest → code-dictionary : 주유소 적재와 보드 스냅샷 생성이 `/internal` 을 부른다 (ADR-0081).
#   빠뜨리면 k3s netpol 이 REJECT 라 CronJob 이 "Connection refused" 로 죽는다.
#   (수집기는 새 파드 IP 가 허용 목록에 오르는 수 초~수십 초를 재시도로 견딘다 —
#    그래도 정책 자체가 없으면 재시도가 전부 실패한다.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ranking-ingest-to-code-dictionary
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: code-dictionary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ranking-ingest
      ports:
        - { port: http, protocol: TCP }
