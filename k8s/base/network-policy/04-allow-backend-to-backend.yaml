# ADR-0031 §5.5 — 백엔드 ↔ 백엔드 (제한적)
#
# 직접 백엔드-백엔드 호출은 의도적으로 마찰을 둔다 (Saga / 이벤트 기반 권장).
# 현재 허용되는 페어:
#   - order → product         (order/.../WebClientConfig.kt:14-18)
#   - search-batch → product  (productApiReindexJob 페이지 스캔 + seed Job bulk 적재, ADR-0056/0058)
#   - auth → commerce         (SSO 회원 조회/생성)
#   - search-batch → place    (attractionApiReindexJob 페이지 풀스캔, ADR-0065)
#
# 새 백엔드-백엔드 호출이 추가되면 별도 NetworkPolicy 를 추가한다.
# 공유 manifest 한 파일에 모아두고 ingress 를 늘리는 방식 (per-target)으로 관리.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-to-product
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order
      ports:
        - { port: http, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-search-batch-to-product
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search-batch
      ports:
        - { port: http, protocol: TCP }
---
# auth → commerce : SSO 로그인 시 회원 조회/생성(POST /api/members/sso).
# default-deny 아래서 백엔드 간 통신은 명시 허용이 없으면 막힌다 — gateway→백엔드만 열려 있어
# auth 가 commerce 로 나가지 못했고, 구글 인증을 통과하고도 콜백에서 로그인이 실패했다
# (2026-08-09. 증상은 Connection refused 라 앱 장애처럼 보였다).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-to-commerce
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: commerce
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
      ports:
        - { port: http, protocol: TCP }
---
# search-batch → place : attractionApiReindexJob 이 관광지 SSOT 를 페이지 풀스캔 (ADR-0065).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-search-batch-to-place
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: place
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search-batch
      ports:
        - { port: http, protocol: TCP }
