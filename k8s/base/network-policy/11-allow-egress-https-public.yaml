# ADR-0031 §5.10 — 외부 HTTPS egress (제한된 서비스만)
#
# 외부 인터넷 :443 호출이 필요한 서비스 화이트리스트:
#   - auth         OAuth 토큰 검증 (Google/Apple/Kakao 등)
#   - quant        거래소 API (Binance/Upbit/Bithumb), Telegram, KMS (OCI Vault — ADR-0027)
#   - quant-ingest yfinance / FinanceDataReader (Yahoo / Naver) OHLCV 시세 수집 sidecar
#   - gifticon     외부 OCR API
#   - deal-linkcheck  혜택 링크 생존 점검 CronJob (ADR-0069) — 주 1회 HEAD/GET.
#                     상시 파드인 code-dictionary 에는 열지 않는다: 배치가 필요로 하는
#                     외부 접근 때문에 상시 노출면을 늘리지 않기 위해서다.
#   - place-ingest    TourAPI(개요) + YouTube/네이버 콘텐츠 + Google Places(place_id) 수집
#                     CronJob (ADR-0070, data-sources.md §7).
#                     상시 파드인 place 에는 열지 않는다 — deal 과 같은 이유.
# (charting 은 ADR-0036 P2-T20 에서 Hard remove 되어 제외됨, 2026-05-02.)
# 다른 서비스는 외부 :443 차단된 상태 (default-deny + DNS only).
#
# CIDR 정책: 0.0.0.0/0 - RFC1918 (클러스터 내부) - link-local.
# 새 KMS / 외부 API 사용 서비스가 추가되면 matchExpressions.values 에 추가한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-https-public
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [auth, quant, quant-ingest, gifticon, deal-linkcheck, place-ingest] }
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8                  # 클러스터/사설망
              - 172.16.0.0/12               # 클러스터/사설망
              - 192.168.0.0/16              # 클러스터/사설망
              - 169.254.0.0/16              # link-local (cloud metadata 차단)
      ports:
        - { port: 443, protocol: TCP }
