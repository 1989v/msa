apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-mysql
  namespace: commerce
  labels:
    app.kubernetes.io/name: db-backup
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: backup
spec:
  # 03:00 UTC = 12:00 KST. 04:00 UTC 의 deal-linkcheck·05:00 의 retention 앞에 둔다 —
  # 정리 배치가 지운 뒤가 아니라 지우기 전 상태를 남긴다.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
            # part-of 누락 시 default-deny 에서 egress 미허용 → MySQL 접근조차 불가
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: mysqldump
              # 서버와 같은 이미지라 클라이언트 버전이 어긋날 일이 없고 노드에 이미 받아져 있다.
              image: mysql:8.0
              imagePullPolicy: IfNotPresent
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-root
                      key: MYSQL_ROOT_PASSWORD
                - name: RETENTION_DAYS
                  value: "7"
                # PAR 만료 2027-09-13. 만료되면 업로드가 404 로 죽는다 — Job 을 실패시켜 드러낸다.
                - name: PAR_EXPIRES
                  value: "2027-09-13"
              command: ["/bin/bash", "-eo", "pipefail", "-c"]
              args:
                - |
                  target=/backup/mysql-$(date -u +%Y%m%dT%H%M%SZ).sql.gz

                  mysqldump --host=mysql-headless --user=root \
                    --all-databases --single-transaction --routines --triggers --events \
                    --set-gtid-purged=OFF --no-tablespaces \
                    | gzip -c > "$target"

                  # 덤프가 중간에 끊겨도 gzip 은 유효할 수 있다. mysqldump 가 끝까지 돈 경우에만
                  # 남기는 완료 표식을 확인해야 "파일이 있다" 가 아니라 "복구할 수 있다" 가 된다.
                  gzip -t "$target"
                  gzip -dc "$target" | tail -5 | grep -q '^-- Dump completed'

                  ln -sfn "$(basename "$target")" /backup/mysql-latest.sql.gz
                  find /backup -name 'mysql-*.sql.gz' -type f -mtime "+${RETENTION_DAYS}" -delete

                  echo "backup ok $(basename "$target") $(stat -c%s "$target") bytes"
                  ls -la /backup

                  # 오프노드 사본. local-path 가 유일한 StorageClass 라 백업 PVC 가 데이터와
                  # 같은 물리 디스크에 놓인다 — 여기까지만 하면 노드 손실에 둘 다 잃는다.
                  #
                  # PAR 은 쓰기 전용이라 올린 것을 되읽어 대조할 수 없다. 대신 Content-MD5 를
                  # 실으면 오라클이 받은 바이트를 대조해 틀리면 400 UnmatchedContentMD5 로
                  # 거부한다 — 읽기 권한 없이 종단 간 무결성이 확인된다.
                  par=$(tr -d '\r\n' < /par/url)
                  md5=$(openssl dgst -md5 -binary "$target" | base64)

                  # -T 는 스트리밍 업로드다. --data-binary 는 파일 전체를 메모리에 올려
                  # 182 MiB 덤프가 512Mi 한도를 밀어낸다.
                  code=$(curl -sS -o /tmp/upload.err -w '%{http_code}' \
                    -T "$target" -H "Content-MD5: ${md5}" \
                    --retry 3 --retry-delay 10 --max-time 900 \
                    "${par}$(basename "$target")")

                  if [ "$code" != "200" ]; then
                    echo "오프노드 업로드 실패 HTTP ${code} — PAR 만료(${PAR_EXPIRES})·권한·egress 순으로 본다" >&2
                    cat /tmp/upload.err >&2
                    exit 1
                  fi
                  echo "upload ok $(basename "$target") md5=${md5}"
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: par
                  mountPath: /par
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: db-backup
            # PAR URL 자체가 자격증명이라 레포에 두지 않는다. 수동 생성:
            #   kubectl -n commerce create secret generic db-backup-par --from-file=url=<파일>
            - name: par
              secret:
                secretName: db-backup-par
