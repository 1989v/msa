apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commerce
        app.kubernetes.io/part-of: commerce-platform
    spec:
      serviceAccountName: commerce
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: commerce/commerce:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            # 판매자 정산 계좌 AES-256-GCM 키 (ADR-0099).
            #
            # optional: false — 없으면 파드가 뜨지 않는다. 설정 파일에도 기본값이 없어
            # 평문 저장이나 약한 기본 키로 조용히 뜨는 경로가 없다.
            #
            # 이 레포는 공개라 키를 매니페스트에 두지 않는다:
            #   kubectl -n commerce create secret generic seller-account-enc \
            #     --from-literal=key="$(openssl rand -hex 32)"
            #
            # **키를 잃으면 저장된 판매자 계좌를 풀 수 없다** — AUTH_SUBJECT_HASH_KEY 와 같은 백업 대상.
            # 교체 절차는 seller/CLAUDE.md 참조.
            - name: SELLER_ACCOUNT_ENC_KEY
              valueFrom:
                secretKeyRef: { name: seller-account-enc, key: key }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            # ADR-0058 R2: 6-도메인 commerce 모놀리스(order+inventory+fulfillment+warehouse+member+wishlist)
            # — 6 EMF/풀 워킹셋. 제거된 6개 Deployment 메모리에서 충당(순감).
            requests:
              cpu: 200m
              memory: 896Mi
            limits:
              memory: 1792Mi
