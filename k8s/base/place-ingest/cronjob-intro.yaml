# ADR-0070 — TourAPI 이용정보(detailIntro2) 하루치 수집 CronJob.
#
# 이용시간·휴무일·요금·주차·문의처. 개요와 마찬가지로 **건당 1콜**이라 전량이 며칠 걸린다.
# 한도는 (서비스 × 오퍼레이션)별로 따로라 detailCommon2(개요)와 예산을 나눠 쓰지 않는다.
#
# **예산을 정하는 것은 원천 한도가 아니라 Job 의 실행 시간이다.**
# 개발계정일 때는 포털에 10만이라 적혀 있어도 999건 뒤로 전부 429 였다(2026-09-08 실측).
# 운영계정 승인(2026-09-11) 뒤로는 그 벽이 없다 — 하루 2,198콜을 429 없이 넘겼다(2026-09-13 실측).
# 그래서 지금 상한은 `activeDeadlineSeconds` 안에 끝나느냐다. 그런데 그 시간을 정하던 것은
# **순차 호출**이었다 — 요청 1건이 약 0.14초라 하나씩 부르면 초당 5건이 천장이고, 10만/일을
# 다 쓰기 한참 전에 1시간에 걸렸다. 동시 호출(WORKERS)을 넣어 초당 32건이 됐다.
# 대기 시간이지 계산이 아니라 무료 단일 노드에서도 싸다.
#
# **전 유형·전 레코드를 받는다** — 유형을 골라 받으면 나중에 필요해졌을 때 원천 한도를
# 다시 써야 한다 (data-sources.md §0 ①). 응답은 introRaw 에 통째로 남기고 화면용은 파생 컬럼.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: place-ingest-intro
  namespace: commerce
  labels:
    app.kubernetes.io/name: place-ingest
    app.kubernetes.io/part-of: commerce-platform
    place.kgd.io/job: "intro"
spec:
  # 매일 UTC 20:00 = KST 05:00 — 개요(04:00)·재색인(04:30) 뒤에 둔다.
  # 같은 시각에 돌리면 4 OCPU 노드에서 둘이 서로를 굶긴다.
  schedule: "0 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 일일 한도(429)는 수집기가 안에서 흡수하고 exit 0 으로 끝난다 — Job 실패로 잡히지 않는다.
      # 그래서 여기 남는 실패는 "시작조차 못한" 경우(DNS·연결)뿐이고, 그건 재시도가 정답이다.
      # 하루 1회라 한 번 놓치면 그날 치를 통째로 잃는다 (실제로 롤아웃 중 노드 포화로 잃었다).
      backoffLimit: 2
      # 시간이 지나면 Job 을 끊는다. backoffLimit 은 실패 횟수를 세는데 ImagePullBackOff 는
      # 실패로 안 잡혀 Job 이 Running 인 채로 남고, Forbid 가 그 뒤 실행을 전부 막는다.
      # 관측 소요 676~698초 (언어당).
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: place-ingest
            app.kubernetes.io/part-of: commerce-platform
            place.kgd.io/job: "intro"
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: ingest
              image: commerce/place-ingest:latest
              imagePullPolicy: IfNotPresent
              args: ["--job=intro"]
              env:
                - name: PLACE_API
                  value: "http://content:8097"
                # ADR-0082 — JVM 과 같은 제공자 단위 쿼터 장부
                - name: REDIS_HOST
                  value: "redis"
                # ADR-0070 — 동시 호출 수. 요청 1건이 약 0.14초라 하나씩 부르면 초당 5건이
                # 천장이고, 오퍼레이션당 10만/일 한도를 다 쓰기 전에 실행 시간에 먼저 걸린다.
                # 실측(2026-09-14): 1→4.9건/초, 6→32.3건/초, 12→35.1건/초 (429·타임아웃 0).
                # 12 는 6 대비 9% 밖에 못 벌어 원천이 그 근처에서 포화한다 — 6 으로 둔다.
                - name: WORKERS
                  value: "6"
                - name: BUDGET
                  value: "20000"
                - name: TOUR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: place-ingest-secrets
                      key: tour-api-key
                      optional: true
              resources:
                # 전량(약 6만 행) 페이지 스캔을 메모리에 올린다 — 파이썬 dict 기준 ~100Mi.
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { memory: 768Mi }
