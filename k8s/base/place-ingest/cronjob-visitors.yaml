# 지역 방문자 수집 CronJob — 한국관광공사 빅데이터 DataLabService (data.go.kr 15101972).
#
# 기초(시군구 269 × 현지인·외지인·외국인 = 하루 807행)와 광역(시도 16 × 3 = 48행)을 일자별로 쌓는다(region_visitor_daily).
# 공개 지연이 30일이라(2026-10-02 실측: 가장 최근 날 09-02) 매일 D-37 ~ D-28 열흘 창을 받는다 — 한 날을 여러 번 다시 받아
# 하루이틀 실패해도 메워진다. (지역, 날짜, 구분) 키 upsert 라 다시 받아도 행이 늘지 않는다.
# 하루 호출: 기초 1 + 광역 1 = 2 (한도 1,000, 예산 상수 src/visitors.py DAILY_BUDGET=4).
# 한도 초과(429 · resultCode=22)면 그날 멈추고 받은 몫만 반영한다. 창 안에 공개된 날이 없으면 exit 1(지연이 창보다 길어졌다).
#
# place 가 적재와 함께 받은 지역의 허브 캐시(레디스 placeRegionVisitors)를 다시 채운다 — 재색인과 무관하다.
# 백필(12개월, 약 48콜)은 한 번만 — CronJob 틀에서 인자만 바꿔 Job 하나를 띄운다:
#   kubectl -n commerce create job visitors-backfill --from=cronjob/place-ingest-visitors --dry-run=client -o json \
#     | jq '.spec.template.spec.containers[0].args=["--job=visitors","--from=2025-09"] | .spec.activeDeadlineSeconds=3600' \
#     | kubectl apply -f -
#   (마감을 늘리는 이유: 달마다 기초 약 2만 5천 행을 2,000행씩 보내고 place 가 지역마다 캐시를 다시 채운다 — 600초로는 모자랄 수 있다)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: place-ingest-visitors
  namespace: commerce
  labels:
    app.kubernetes.io/name: place-ingest
    app.kubernetes.io/part-of: commerce-platform
    place.kgd.io/job: "visitors"
spec:
  # 매일 UTC 17:30 = KST 02:30. 02:40 관광지 부가 정보 · 03:10 행사·숙박 목록보다 앞이다.
  schedule: "30 17 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: place-ingest
            app.kubernetes.io/part-of: commerce-platform
            place.kgd.io/job: "visitors"
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: ingest
              image: commerce/place-ingest:latest
              imagePullPolicy: IfNotPresent
              args: ["--job=visitors"]
              env:
                - name: PLACE_API
                  value: "http://content:8097"
                - name: TOUR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: place-ingest-secrets
                      key: tour-api-key
                      optional: true
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { memory: 512Mi }
