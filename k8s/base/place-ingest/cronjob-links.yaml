# ADR-0070 — 관광지 외부 콘텐츠(유튜브·네이버 블로그) 수집 CronJob.
#
# 전량 사전수집을 하지 않는다. YouTube `search.list` 는 건당 100 units 이고 일일 쿼터가
# 10,000 units 라 하루 100 관광지가 상한 — ko 44,912건이면 450일이다. 그래서 **실제로 열어본
# 곳부터** 채운다(place 의 우선순위 큐).
#
# 시간당 1회 × 10건인 이유: 일일 예산은 place 가 세므로 여기서 지킬 필요는 없지만, 한 번에
# 100건을 몰아 쓰면 자정 직후 큐에 있던 것만 채워지고 낮에 조회된 곳은 다음 날로 밀린다.
# 조금씩 나눠 써야 온디맨드가 실제로 온디맨드로 동작한다.
#
# 10분 주기로 하지 않는 이유: 예산이 하루 100건이라 대부분의 실행이 0건을 받는데,
# free-tier 단일 노드에서 하루 144번 파드를 띄우는 값을 하지 못한다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: place-ingest-links
  namespace: commerce
  labels:
    app.kubernetes.io/name: place-ingest
    app.kubernetes.io/part-of: commerce-platform
    place.kgd.io/job: "links"
spec:
  # 2026-08-21 YOUTUBE_API_KEY 등록으로 가동. 네이버 키는 아직 없고, 키 없는 소스는
  # 수집기가 건너뛰므로 잡은 정상 종료한다. 키를 전부 지우게 되면 다시 suspend 로 —
  # 동작할 수 없는 배치가 매시 실패 잡을 쌓으면 알람 피로로 진짜 실패를 놓친다.
  suspend: false
  schedule: "17 * * * *"       # 매시 17분 — 정각 몰림(다른 배치들)을 피한다
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 재시도하지 않는다. 단, 이유는 "쿼터" 가 아니다 — 쿼터 소진은 수집기가 안에서 흡수하고
      # exit 0 으로 끝나 Job 실패로 잡히지 않는다. 여기 남는 실패는 시작조차 못한 경우다
      # (place 롤아웃 중 엔드포인트 공백 → Connection refused, 2026-08-21 실측).
      #
      # 그래도 재시도하지 않는 건 **시간당 실행이고 큐가 그대로 남기 때문**이다. 죽은 회차는
      # 아무것도 건드리지 않았고 next_attempt_at 도 그대로라 다음 시간이 이어받는다.
      # 하루 1회인 개요 잡은 사정이 달라 거기만 재시도를 켰다.
      # 다른 place-ingest 잡과 같은 2회. 0 이면 netpol 등록 경합 한 번에 그 시간
      # 수집이 통째로 날아간다 — 수집기 안에 연결 재시도가 있어도 그것을 넘긴
      # 실패(외부 API 일시 오류 등)에는 잡 레벨 재시도가 마지막 방어선이다.
      backoffLimit: 2
      # 시간이 지나면 Job 을 끊는다. backoffLimit 은 실패 횟수를 세는데 ImagePullBackOff 는
      # 실패로 안 잡혀 Job 이 Running 인 채로 남고, Forbid 가 그 뒤 실행을 전부 막는다.
      # 관측 소요 51초.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: place-ingest
            app.kubernetes.io/part-of: commerce-platform
            place.kgd.io/job: "links"
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: ingest
              image: commerce/place-ingest:latest
              imagePullPolicy: IfNotPresent
              args: ["--job=links"]   # 키가 있는 소스만 돈다
              env:
                - name: PLACE_API
                  value: "http://place:8096"
                # ADR-0082 — JVM 과 같은 제공자 단위 쿼터 장부
                - name: REDIS_HOST
                  value: "redis"
                - name: LINK_LIMIT
                  value: "10"
                - name: YOUTUBE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: place-ingest-secrets
                      key: youtube-api-key
                      optional: true
                # 네이버는 일 25,000콜이라 사실상 제약이 없다 — 그래도 예산 경로는 같이 쓴다.
                - name: NAVER_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: place-ingest-secrets
                      key: naver-client-id
                      optional: true
                - name: NAVER_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: place-ingest-secrets
                      key: naver-client-secret
                      optional: true
              resources:
                # 개요 잡과 달리 전량 스캔이 없다 — 큐에서 받은 10건만 다룬다.
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { memory: 256Mi }
