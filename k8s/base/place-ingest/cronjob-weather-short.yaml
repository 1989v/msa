# 단기예보 수집 CronJob — 기상청 VilageFcstInfoService_2.0 getVilageFcst (data.go.kr 15084084).
#
# 시군구 대표점 → 기상청 격자: 시군구 269(좌표 있는 267) → 고유 격자 243 (2026-10-02 운영 값). 회차마다 격자당 1콜.
# 발표 05시·17시 두 번만 받는다(예보 기간이 가장 긴 둘) — 발표 25분 뒤에 돈다(API 제공은 발표 10분 뒤).
# 하루 호출: 243 × 2 = 486 (한도 1,000, 회차 예산 상수 src/weather.py SHORT_BUDGET=270). 쪽 크기 1,500 — 17시 발표가 1,052행이라
# 1,000 이면 격자마다 두 콜이 된다. 한도 초과(429 · resultCode=22)면 그 회차를 멈추고 받은 몫만 보낸다.
# 받은 격자의 발표본만 바꾼다(실패한 격자는 이전 발표본이 남고, 화면은 발표 24시간이 지나면 그 날들을 숨긴다).
#
# 회차 시작에 place 시군구 대표점으로 격자·중기 구역 매핑을 다시 계산해 보낸다(PUT /internal/weather/areas).
# place 가 적재와 함께 받은 격자를 쓰는 시군구의 날씨 캐시(레디스 placeWeather)를 다시 채운다 — 재색인과 무관하다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: place-ingest-weather-short
  namespace: commerce
  labels:
    app.kubernetes.io/name: place-ingest
    app.kubernetes.io/part-of: commerce-platform
    place.kgd.io/job: "weather-short"
spec:
  # 매일 UTC 20:25 · 08:25 = KST 05:25 · 17:25. 05:00 이용정보(TourAPI) 와 오퍼레이션·한도가 다르다.
  schedule: "25 8,20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: place-ingest
            app.kubernetes.io/part-of: commerce-platform
            place.kgd.io/job: "weather-short"
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: ingest
              image: commerce/place-ingest:latest
              imagePullPolicy: IfNotPresent
              args: ["--job=weather-short"]
              env:
                - name: PLACE_API
                  value: "http://content:8097"
                - name: TOUR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: place-ingest-secrets
                      key: tour-api-key
                      optional: true
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { memory: 512Mi }
