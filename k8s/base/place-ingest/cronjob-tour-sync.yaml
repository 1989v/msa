# TourAPI 축제·공연·행사 · 숙박 · 여행코스 목록 수집 CronJob (ADR-0104).
#
# 기존 5개 분류(관광지·문화시설·레포츠·쇼핑·음식점)는 목록 동기화 잡이 따로 없고 수동으로만 돈다.
# 이 잡은 새 세 유형만 매일 받는다 — 행사는 일정이 바뀌고 새로 생기는 속도가 빨라서다.
#   행사  searchFestival2 (국·영) — eventStartDate = KST 오늘 − 365일. 이 값은 「종료일 ≥ 값」으로 걸러,
#         진행 중·예정 행사와 지난 1년 안에 끝난 행사를 함께 준다
#   숙박  searchStay2 (국·영) — 유형 32·80 만 싣는다(목록에 다른 유형이 섞여 온다)
#   코스  areaBasedList2 contentTypeId=25 (국문만 — 영문 서비스에 코스 유형이 없다)
# 하루 호출 약 56회(행사 12쪽 + 숙박 33쪽 + 코스 11쪽, 100건씩). 2026-10-02 표본 기준.
#
# 전체 동기화 경로(bulk_upsert)를 쓰므로 레코드를 통째로 보낸다 (data-sources.md §0 ③).
# 유형·언어 하나가 실패해도 나머지는 받고 exit 1 로 끝난다 — 빠진 유형이 성공 기록에 묻히지 않게.
# 재시도는 같은 호출을 다시 쓰고 마감 시간도 같이 쓰므로 두지 않는다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: place-ingest-tour-sync
  namespace: commerce
  labels:
    app.kubernetes.io/name: place-ingest
    app.kubernetes.io/part-of: commerce-platform
    place.kgd.io/job: "tour-sync"
spec:
  # 매일 UTC 18:10 = KST 03:10. 구글 place_id 보강(03:20)보다 먼저 끝나야 한다 —
  # 두 잡이 같은 행을 전체 동기화로 덮어쓰면 늦게 끝난 쪽이 이긴다.
  schedule: "10 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app.kubernetes.io/name: place-ingest
            app.kubernetes.io/part-of: commerce-platform
            place.kgd.io/job: "tour-sync"
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: ingest
              image: commerce/place-ingest:latest
              imagePullPolicy: IfNotPresent
              args: ["--job=tour-portal-sync"]
              env:
                - name: PLACE_API
                  value: "http://content:8097"
                - name: REDIS_HOST
                  value: "redis"
                - name: TOUR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: place-ingest-secrets
                      key: tour-api-key
                      optional: true
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { memory: 768Mi }
