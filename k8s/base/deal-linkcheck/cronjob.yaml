apiVersion: batch/v1
kind: CronJob
metadata:
  name: deal-linkcheck
  namespace: commerce
  labels:
    # 이 이름이 곧 egress 허용 대상이다 (network-policy/11-allow-egress-https-public.yaml).
    # 상시 파드인 code-dictionary 에는 외부 :443 을 열지 않고, 이 배치 파드에만 연다.
    app.kubernetes.io/name: deal-linkcheck
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: linkcheck
spec:
  # ADR-0069 — 혜택 링크 생존 점검 + 클릭 로그 보존기간(90일) 정리.
  #
  # 일요일 04:00 UTC = 13:00 KST. **이 시각을 옮길 때 주의** — code-dictionary 이미지를
  # 그대로 띄우므로 폴드된 game 의 @Scheduled 도 같은 JVM 에 산다. 게임 주간 통계 리셋이
  # 월요일 00:00 KST 라, 배치 창이 그 시각과 겹치면 주간 리셋이 두 번 돈다.
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: deal-linkcheck
            # part-of 누락 시 default-deny 에서 egress 미허용 → MySQL 접근조차 불가
            app.kubernetes.io/part-of: commerce-platform
            app.kubernetes.io/component: linkcheck
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: linkcheck
              # 새 이미지를 만들지 않는다 — 호스트 앱을 웹서버 없이 띄웠다가 끝나면 내린다.
              image: commerce/code-dictionary:latest
              imagePullPolicy: IfNotPresent
              args:
                # 웹서버를 띄우지 않는다. ApplicationRunner 가 끝나면 컨텍스트가 닫히고 종료된다.
                - "--spring.main.web-application-type=none"
                # linkcheck 프로파일이 DealLinkCheckRunner 를 켠다.
                - "--spring.profiles.active=kubernetes,linkcheck"
              env:
                # DB 자격증명은 application.yml 기본값을 쓴다(oci-arm 은 그 값으로 프로비저닝됨).
                # prod-k8s 로 올릴 때는 Deployment 와 같은 Secret 주입 패치를 이 CronJob 에도 걸 것.
                - name: GAME_DB_MASTER
                  value: "mysql-code-dictionary-master:3306"
                - name: GAME_DB_REPLICA
                  value: "mysql-code-dictionary-master:3306"
              resources:
                requests: { cpu: 100m, memory: 384Mi }
                limits:   { memory: 640Mi }
