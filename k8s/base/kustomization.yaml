apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Aggregates every Spring Boot app module's base manifests.
# Environment-specific patches (replicas, resources, HPA, PDB, Secret
# injection, Redis cluster->standalone rewrite for k3s-lite) live in
# k8s/overlays/<env>/ and reference this directory as their base.
# DO NOT apply this directory directly for a real environment; use an
# overlay instead.
namespace: commerce
resources:
  - gateway
  # ADR-0058: order 는 inventory(commerce) 로 폴드 — 별도 Deployment 없음 (스키마 order_db·토픽 유지)
  - search
  - search-consumer
  - search-batch
  - auth
  - gifticon
  - commerce
  # ADR-0058: warehouse·fulfillment 는 inventory(commerce) 로 폴드 — 별도 Deployment 없음
  # (스키마 warehouse_db/fulfillment_db 는 유지, fulfillment.order.* 토픽도 commerce 가 발행)
  - analytics
  - chatbot
  - code-dictionary
  - quant
  - quant-ingest
  # ADR-0093 ①-B1: sideapp 을 먼저 띄운다. quant·chatbot·gifticon 제거는
  # 게이트웨이가 sideapp 을 가리키는 이미지로 바뀐 뒤(①-B3)다.
  - sideapp
  - account     # ADR-0093: member + wishlist 폴드 (commerce 에서 이동)
  - engagement  # ADR-0093: recommendation + experiment 폴드
  - recommendation-ann
  - place
  # ADR-0070: 관광지 개요/콘텐츠 수집 배치 (외부 :443 을 부르는 유일한 place 계열 파드)
  - place-ingest
  - ranking-ingest
  # ADR-0069: 혜택 링크 생존 점검 배치 (code-dictionary 이미지 재사용, 상주 파드 없음)
  - deal-linkcheck
  # ADR-0077: 원장 보존기간 정리 배치 (같은 이미지 재사용, 외부 egress 없음)
  - retention
  # Frontend + non-JVM services (Phase 7 extension)
  - portal-fe
  - gifticon-fe
  - admin-fe
  - quant-fe
  # AMP ARENA (Node + WebSocket, 8787) — arena.1989v.com, ingress 는 oci-arm overlay
  - amp-arena
  - frontend-ingress.yaml

patches:
  # Pod 하드닝 (모든 환경 공통). JVM 은 Jib user 1000 전제로 runAsNonRoot,
  # nginx FE / 비 JVM 은 최소 capability 집합. 대상은 anchored regex 매칭.
  - path: patches/securitycontext-jvm.yaml
    target:
      kind: Deployment
      name: "(gateway|search|search-consumer|auth|gifticon|commerce|analytics|engagement|account|sideapp|chatbot|code-dictionary|quant|place)"
  - path: patches/securitycontext-web.yaml
    target:
      kind: Deployment
      name: "(portal-fe|gifticon-fe|admin-fe|quant-fe|recommendation-ann)"
