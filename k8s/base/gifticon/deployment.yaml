apiVersion: apps/v1
kind: Deployment
metadata:
  name: gifticon
  namespace: commerce
  labels:
    app.kubernetes.io/name: gifticon
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gifticon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gifticon
        app.kubernetes.io/part-of: commerce-platform
    spec:
      serviceAccountName: gifticon
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: commerce/gifticon:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            # auth 가 발급한 JWT 를 검증하려면 auth 와 같은 키여야 한다 (optional — 없으면 로컬 기본값)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: platform-jwt, key: secret, optional: true }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
