apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-fe
  namespace: commerce
  labels:
    app.kubernetes.io/name: portal-fe
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-fe
        app.kubernetes.io/part-of: commerce-platform
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: app
          image: commerce/portal-fe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # IndexNow 키 — 이미지의 15-indexnow-key.sh 가 32자 소문자 hex 일 때만 place 호스트 /{key}.txt 를 연다.
            # Secret 은 레포에 두지 않는다(운영은 ssh msa-oci 에서 수동 생성). 없으면 키 파일 없이 뜬다.
            # place-ingest-indexnow 와 같은 Secret 이다 — 바꾸면 이 파드를 재시작해야 새 키 파일이 나간다.
            - name: INDEXNOW_KEY
              valueFrom:
                secretKeyRef:
                  name: place-indexnow
                  key: key
                  optional: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
