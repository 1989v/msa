apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: commerce
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: commerce-platform
spec:
  serviceName: opensearch-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Single-node OpenSearch 도 ES 와 동일하게 vm.max_map_count 하한이 필요.
        - name: increase-vm-max-map
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
          securityContext:
            privileged: true
            runAsUser: 0
      containers:
        - name: opensearch
          # ADR-0055 — ES 9.0.0 에서 전환. 3.8.0 은 Lucene 1-bit 양자화(3.6+) 때문 — docker/opensearch/Dockerfile 참고.
          image: opensearchproject/opensearch:3.8.0
          imagePullPolicy: IfNotPresent
          # Korean nori analyzer 플러그인 보장 — search(products) + code-dictionary 공용
          command:
            - bash
            - -c
            - |
              if ! /usr/share/opensearch/bin/opensearch-plugin list | grep -q analysis-nori; then
                /usr/share/opensearch/bin/opensearch-plugin install --batch analysis-nori
              fi
              exec /usr/share/opensearch/opensearch-docker-entrypoint.sh opensearch
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: discovery.type
              value: "single-node"
            # 로컬 단일노드 — security plugin off (ES 의 xpack.security.enabled=false 등가)
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            # 힙은 512 MB 로 고정. NMT 는 힙 밖(direct·metaspace·스레드·GC)을 쪼개 보려고 —
            # 2026-09-21 실측 RssAnon 1.52 GB 중 힙이 512 뿐이라 나머지 1 GB 의 내역이 없었다. jcmd 1 VM.native_memory summary
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m -XX:NativeMemoryTracking=summary"
            - name: cluster.name
              value: "commerce-local"
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 90
            periodSeconds: 30
          # 한도 = 힙 512 + JVM 네이티브 ≈ 1,000 + 페이지 캐시. Lucene 은 색인을 힙이 아니라 mmap(페이지 캐시)으로
          # 읽고 그 캐시는 이 cgroup 한도에 같이 잡힌다. 1536Mi 일 때 anon 이 1,480 MB 를 먹어 캐시가 4 MB 뿐이었고
          # 관광지 벡터 파일(272 MB)이 매 질의마다 디스크에서 읽혀 kNN 이 112초, 09-13 엔 OOMKilled(137).
          # 2560Mi 는 살아 있는 색인 한 벌 + 재색인 순간 겹치는 한 벌이 캐시에 남는 하한 근처다 (노드 available 10 GB).
          resources:
            requests:
              cpu: 200m
              memory: 1536Mi
            limits:
              memory: 2560Mi
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi
