# place (ADR-0056) — 단일 datasource 라 master/replica 구분 없음
apiVersion: v1
kind: Service
metadata:
  name: mysql-place
  namespace: commerce
spec:
  selector: { app.kubernetes.io/name: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
---
# 단일 MySQL 인스턴스라 master/replica 는 같은 파드를 가리키는 별칭이다. 그래도 Service 를
# 만들어야 하는 이유: commerce 앱이 이 호스트명으로 replica DataSource 를 구성하고,
# 이름이 없으면 UnknownHostException 으로 **앱 기동 자체가 실패**한다.
# member/wishlist 두 개만 누락돼 있었고, 2026-08-09 재시작 폭풍에서 commerce 가
# 완전히 못 뜨는 원인이 됐다(그 전에는 부분 동작으로 가려져 있었다).
apiVersion: v1
kind: Service
metadata:
  name: mysql-member-replica
  namespace: commerce
spec:
  selector: { app.kubernetes.io/name: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-wishlist-replica
  namespace: commerce
spec:
  selector: { app.kubernetes.io/name: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
