apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-logs
  namespace: commerce
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: commerce-platform
data:
  # ClickHouse 자체 진단 로그에는 기본 TTL 이 없다. 앱 테이블이 한 건도 없는 인스턴스가
  # 로그만으로 12.8 GiB 를 썼고 그중 text_log 가 9.49 GiB 였다 (96G 노드 디스크의 13%).
  # PVC 는 2Gi 지만 local-path 라 쿼터가 안 먹어 한도 없이 자란다.
  logs.xml: |
    <clickhouse>
        <!-- 서버 내부 로그 본문. 파일 로그로 충분하고 테이블로 쌓을 이유가 없다 -->
        <text_log remove="1"/>

        <metric_log>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </metric_log>
        <asynchronous_metric_log>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </asynchronous_metric_log>
        <query_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </query_log>
        <trace_log>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </trace_log>
        <processors_profile_log>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </processors_profile_log>
        <part_log>
            <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </part_log>
    </clickhouse>
