apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: commerce
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: commerce-platform
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: bitnamilegacy/kafka:3.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: internal
              containerPort: 29092
            - name: controller
              containerPort: 9093
            - name: client
              containerPort: 9092
            # EXTERNAL listener for host-machine clients (kcat, Kafka UI, etc.).
            # Advertised as localhost:19092 so producers/consumers reconnect to
            # the loopback port mapped by k3d. LOCAL-ONLY.
            - name: external
              containerPort: 19092
          env:
            # KRaft mode (no ZooKeeper). Single-node controller + broker.
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CFG_LISTENERS
              value: "CLIENT://:9092,INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:19092"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "CLIENT://kafka:9092,INTERNAL://kafka:29092,EXTERNAL://localhost:19092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            # 이미지 기본값은 -Xmx1024m -Xms1024m 이라 힙 1Gi 를 처음부터 다 잡는다. 힙 밖(약 220MB)을 더하면
            # 한도 1536Mi 에 RSS 1.29Gi 로 붙어 있었고 2026-09-25 에 OOMKilled 됐다. Full GC 뒤 살아 있는
            # 데이터는 약 225MB(2026-10-20 실측)라 640Mi 로 줄인다. 페이지 캐시는 힙이 아니라 커널 몫이다.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx640m -Xms640m"
          readinessProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi
