# Topics matching docs/architecture/kafka-convention.md and the
# publish/consume references in each service's application.yml.
# Strimzi Topic Operator reconciles these into real Kafka topics.
#
# commerce 주문 흐름(ADR-0099): 사가 명령·답 · 읽기 모델 · 정산 원천. 키는 orderId(사가) 또는 엔티티 id.
# order.order.completed / order.order.cancelled 는 은퇴해 선언하지 않는다(이름을 되살리면 옛 의미로 읽힌다).
#
# DLT: commerce 컨슈머가 처리에 실패한 레코드는 `<원 토픽>.DLT` 의 **같은 파티션 번호**로 간다
# (common DltKafka.deadLetterRecoverer). 그래서 DLT 파티션 수는 원 토픽 이상이어야 한다 — 원 토픽과 같은 6.
# `.DLT` 의 대문자는 Kubernetes 리소스 이름에 쓸 수 없어 metadata.name 은 `-dlt`, 실제 이름은 spec.topicName.
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: product.item.created
  namespace: commerce
  labels:
    strimzi.io/cluster: commerce
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "604800000"
    min.insync.replicas: "2"
---
