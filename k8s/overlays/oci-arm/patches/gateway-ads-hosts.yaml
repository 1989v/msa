# 광고 공개 라우트가 받는 Host (kgd.gateway.ads.allowed-hosts) — k3s-lite 값을 덮는다.
# AOP 가 걸린 proxied 호스트 중 광고 지면·콘솔이 있는 곳만 적는다. rt 는 Cloudflare 를
# 거치지 않아 CF-Connecting-IP 를 위조할 수 있으므로 넣지 않고, 와일드카드도 쓰지 않는다
# (*.1989v.com 은 rt 를 포함한다). 이 방어는 origin-lockdown(AOP)이 켜져 있다는 전제다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: KGD_GATEWAY_ADS_ALLOWED_HOSTS
              value: "1989v.com,blog.1989v.com,game.1989v.com,place.1989v.com,ads.1989v.com"
