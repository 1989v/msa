# recommendation-ann 전용 — Tier S(512Mi)를 공유하기엔 실사용이 너무 작다(60Mi).
# 같은 티어의 auth/chatbot 은 360~380Mi 를 쓰므로 티어 값을 내릴 수는 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-ann
spec:
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi   # 실사용 60Mi (8.5배 여유)
