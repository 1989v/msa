# 롤아웃 훈련 표식 (ADR-0075) — 값을 바꾸면 **전 Deployment 가 동시에 롤아웃된다.**
#
# 왜 이런 손잡이를 두는가: 무중단 전환과 엣지 보호는 "전 서비스가 한꺼번에 도는" 최악
# 부하에서만 진짜로 검증된다. 평소 배포는 이미지 1~2종이라 웨이브 하나로 끝나 그 압력을
