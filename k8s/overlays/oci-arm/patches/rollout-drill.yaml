# 521 이 났고, 그 조치(우선순위·CPU 상향)를 검증할 방법이 필요했다.
#
# 사용법: 날짜를 오늘로 바꿔 커밋 → Argo 동기화 → 1초 간격 카나리로 non-200 을 센다.
# 훈련이 아니면 건드리지 않는다 — 이 값이 바뀔 때마다 운영 전체가 재기동한다.
apiVersion: apps/v1
