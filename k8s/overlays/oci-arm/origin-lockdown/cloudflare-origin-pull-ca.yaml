# Cloudflare Authenticated Origin Pull (AOP) CA — origin 이 "이 요청이 정말
# Cloudflare 엣지에서 왔는지" 를 mTLS 로 검증하는 데 쓰는 신뢰 앵커.
#
# 왜 source IP 화이트리스트가 아니라 mTLS 인가:
#   k3s 기본 ServiceLB(klipper-lb)가 LoadBalancer 트래픽을 MASQUERADE 하므로
#   ingress-nginx 가 보는 $remote_addr 이 클라이언트 IP 라는 보장이 없다.
#   whitelist-source-range 는 그 전제가 깨지면 전 host 를 막아버린다.
#   mTLS 는 source IP 보존 여부와 무관하게 동작한다.
#
# 이 인증서는 Cloudflare 가 공개 배포하는 값이라 git 에 담아도 무방하다.
#   출처: https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
#   유효기간: 2019-10-10 ~ 2029-11-01 (만료 전 교체 필요)
#
# Secret 만 적용해도 동작 변화는 없다. 실제 검증은 origin-lockdown/aop-patch.yaml
# 이 Ingress 에 붙을 때 시작된다 — 활성화 순서는 이 디렉토리의 README.md 참조.
apiVersion: v1
kind: Secret
metadata:
  name: cf-origin-pull-ca
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
    app.kubernetes.io/component: origin-lockdown
type: Opaque
