apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OCI Ampere A1 (arm64) single-node overlay.
#
# 베이스: k3s-lite (이미 리소스 절감 + Redis standalone + ClickHouse 메모리 상향 적용)
# 위에 다음을 더 얹는다:
#   - 커스텀 도메인 기반 host 라우팅 (FE 별 subdomain — admin/quant/gft/game/api)
#   - cert-manager + Let's Encrypt HTTP01 challenge
#   - 24GB / 4 OCPU 안에서 전체 서비스 셋 가동
#
# 멀티 아키텍처 (arm64): 사용 중인 컨테이너 이미지가 전부 multi-arch 인지 확인.
#   - 인프라(MySQL/Kafka/Redis/ES/ClickHouse): 공식 이미지 multi-arch ✅
#   - JVM 서비스: Jib 빌드는 빌드 호스트 아키텍처 따라감.
#     로컬이 Apple Silicon 이면 그대로 arm64. Intel Mac 이면 platforms 추가 필요.
#   - FE: docker buildx build --platform linux/arm64
#
# 적용 절차 (요약):
#   1. DNS 레코드 등록 → OCI public IP
#      - proxied (orange cloud) 7종: @(root), admin, quant, gft, game, place, api
#        Cloudflare 를 반드시 경유해야 WAF/rate limit 가 걸린다.
#      - DNS-only (gray cloud) 1종: rt — WS/SSE 가 CF 100s timeout 을 피해야 해서
#        의도적으로 우회. 이 레코드가 origin IP 를 공개하므로 origin-lockdown
#        (Authenticated Origin Pull) 이 필요하다 → origin-lockdown/README.md
#      - argocd 는 origin IP 를 가리키는 A 레코드를 두지 않는다. GitOps 콘솔은
#        Cloudflare Zero Trust Tunnel 뒤에서만 접근 (k8s/argocd/README.md).
#        터널 Public Hostname 등록 시 Cloudflare 가 자동 생성하는 CNAME
#        (<tunnel-id>.cfargotunnel.com, proxied) 은 정상이며 필수 — 지우지 말 것.
#   2. ./k8s/overlays/oci-arm/scripts/render.sh <DOMAIN> <LE_EMAIL> | kubectl apply -f -
#      (또는 Argo CD 사용 시 ./k8s/argocd/install.sh ... <DOMAIN>)
#   3. cert-manager 가 ClusterIssuer 로 letsencrypt-prod 발급 (수 초~수 분, host 마다 별개 cert)
#   4. https://<DOMAIN> 접속 가능 (portal-fe 메인)
#
# 자세한 사전 작업(k3s 설치, 방화벽, ingress-nginx, cert-manager 설치)은 README 참조.
namespace: commerce
resources:
  - ../k3s-lite
  - cert-manager/cluster-issuer-staging.yaml
  - cert-manager/cluster-issuer-prod.yaml
  # Ingress 2개:
  # - commerce-proxied: 6 host (root + admin/quant/gft/game/api) — CF proxy
  #   활성, secretName 은 수동 등록한 cf-origin-ca-tls (CF Origin CA 15년 cert).
  # - commerce-rt: rt.* — CF proxy 미사용 (WS/SSE bypass), Let's Encrypt HTTP01.
  # base 의 단일 path-routed Ingress 2개 (frontend, gateway) 는 아래 $patch:
  # delete 로 무력화.
  - ingresses/commerce-platform.yaml
  # cloudflared — Zero Trust Tunnel connector. Public Hostname / TCP route /
  # Access policy 는 Cloudflare dashboard 에서 관리. tunnel 토큰 Secret 은
  # cf-origin-ca-tls 와 동일하게 OCI 에서 수동 등록 (git 미포함).
  - cloudflared
  # Cloudflare Authenticated Origin Pull 용 CA. Secret 만으로는 동작 변화 없음
  # (검증은 아래 patches 의 aop-patch 가 붙을 때 시작). origin-lockdown/README.md
  - origin-lockdown/cloudflare-origin-pull-ca.yaml
patches:
  # ─── Origin lockdown (Cloudflare 우회 차단) — 활성 (2026-08-06) ────────────
  # 선행 조건 충족: Cloudflare SSL/TLS > Origin Server > Authenticated Origin
  # Pulls 의 **전역(Global)** 이 ON — CF 가 공유 클라이언트 인증서를 제시하며,
  # 아래 패치가 origin 에서 그걸 검증한다. 전역을 끄면 proxied host 6종이 전부
  # 400 이 되므로 대시보드와 이 패치는 항상 같이 켜고 같이 끈다.
  # 커스텀 인증서(존 레벨/호스트명별)로 올릴 때는 origin-lockdown 의 CA Secret 도
  # 본인 CA 로 교체해야 한다. 검증/롤백 → origin-lockdown/README.md
  - path: origin-lockdown/aop-patch.yaml
    target: {kind: Ingress, name: commerce-proxied}
  # 모든 Deployment — 단일 노드라 surge 불가: 자리 비운 뒤 교체
  - path: patches/rolling-no-surge.yaml
    target:
      kind: Deployment
  # ─── Kafka EXTERNAL listener — WARP 통한 외부 접근용 (kafka-ui macOS docker 등) ─
  # base 의 advertised 는 host-access(k3s-lite) 검증용 localhost:19092.
  # oci-arm 에선 외부 client 가 reconnect 시 사용할 public hostname 으로 교체.
  # CLIENT/INTERNAL listener 는 cluster-internal 그대로 (Spring Boot 서비스 영향 없음).
  - target:
      kind: StatefulSet
      name: kafka
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: kafka
      spec:
        template:
          spec:
            containers:
              - name: kafka
                env:
                  - name: KAFKA_CFG_ADVERTISED_LISTENERS
                    value: "CLIENT://kafka:9092,INTERNAL://kafka:29092,EXTERNAL://kafka.1989v.com:19092"
  # Kafka service 에 19092 port 추가 (Cloudflare Tunnel → cloudflared → kafka:19092).
  - target:
      kind: Service
      name: kafka
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: external
          port: 19092
          targetPort: 19092
  # ─── base 의 path-routed Ingress 2개 제거 (subdomain 라우팅으로 대체) ────────
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: frontend
        namespace: commerce
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: gateway
        namespace: commerce
  # ─── JVM tuning (모든 Deployment 에 주입, nginx 컨테이너는 무시함) ────────
  - path: patches/java-tool-options.yaml
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=commerce-platform"
  # ─── 운영은 Hibernate 가 스키마를 만지지 않는다 (k3s-lite 의 update 를 덮어쓴다) ──
  - path: patches/ddl-auto-none.yaml
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=commerce-platform"
  # ─── OCIR pull secret (모든 앱 Pod spec 에 명시) ───────────────────────────
  - path: patches/image-pull-secret-deployment.yaml
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=commerce-platform"
  - path: patches/image-pull-secret-cronjob.yaml
    target:
      kind: CronJob
      labelSelector: "app.kubernetes.io/part-of=commerce-platform"
  - path: patches/image-pull-secret-job.yaml
    target:
      kind: Job
      labelSelector: "app.kubernetes.io/part-of=commerce-platform"
  # ─── Tier XL (1.2Gi) — analytics: Kafka Streams + RocksDB state store ────
  - path: patches/resources-xl-1200mi.yaml
    target:
      kind: Deployment
      name: analytics
  # ─── Tier L (1Gi) — quant: Phase 3 실시간 트레이딩 엔진 ──────────────────
  # code-dictionary 는 k3s-lite 베이스 패치에서 이미 1Gi 로 설정됨.
  - path: patches/resources-l-1gi.yaml
    target:
      kind: Deployment
      name: quant
  # ─── Tier S (512Mi) — Kafka consumer + 경량 JPA ─────────────────────────
  - path: patches/resources-s-512mi.yaml
    # ─── Tier M (768Mi) — k3s-lite 글로벌 기본값으로 충분, 별도 패치 없음 ────
    #     적용 대상: gateway, product, order, search, gifticon, fulfillment
    #     (gifticon/fulfillment 는 k3s-lite 의 동일값 명시 패치 보유)

    target: {kind: Deployment, name: experiment}
  # ADR-0058 — search-batch 는 CronJob(Deployment 아님). resource 패치 대상 제외.
  - path: patches/resources-s-512mi.yaml
    target: {kind: Deployment, name: search-consumer}
  - path: patches/resources-s-512mi.yaml
    target: {kind: Deployment, name: recommendation}
  - path: patches/resources-s-512mi.yaml
    target: {kind: Deployment, name: recommendation-ann}
  - path: patches/resources-s-512mi.yaml
    target: {kind: Deployment, name: auth}
  - path: patches/resources-s-512mi.yaml
    target: {kind: Deployment, name: chatbot}
  # ─── Tier XS (384Mi) — 최소 CRUD ─────────────────────────────────────────
  # ADR-0058: commerce(4-도메인 모놀리스)는 XL — 단일 inventory 의 xs(384Mi)로는 즉시 OOM.
  - path: patches/resources-xl-1200mi.yaml
    target: {kind: Deployment, name: commerce}
  # ─── Tier FE (96Mi) — nginx static ────────────────────────────────────────
  - path: patches/resources-fe-96mi.yaml
    target: {kind: Deployment, name: portal-fe}
  - path: patches/resources-fe-96mi.yaml
    target: {kind: Deployment, name: admin-fe}
  - path: patches/resources-fe-96mi.yaml
    target: {kind: Deployment, name: quant-fe}
  - path: patches/resources-fe-96mi.yaml
    target: {kind: Deployment, name: gifticon-fe}
  # ─── CPU 상한 (tier memory 패치 뒤에 적용 — limits 맵 병합) ────────────────
  - path: patches/cpu-cap.yaml
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=commerce-platform"
  # ─── Argo sync wave — 전체 롤아웃을 배치로 직렬화 ─────────────────────────
  # 공유 의존성(common/) 변경이나 version tag 푸시는 전 서비스의 이미지 태그를 한
  # 커밋에 올린다. 웨이브가 없으면 20개가 동시에 재기동해 단일 노드가 죽는다.
  # Argo 는 웨이브 N 이 Healthy 가 될 때까지 N+1 을 시작하지 않으므로, 변경 규모와
  # 무관하게 동시 기동 수가 웨이브 크기로 묶인다.
  # 변경 없는 리소스는 즉시 Healthy 라 평소 단일 서비스 배포에는 영향이 없다.
  # wave 0(기본) = 인프라 StatefulSet + cloudflared.
  #
  # **웨이브 크기 = 무료 티어 예산에서 역산한다.** 4 OCPU 중 인프라 StatefulSet 6종과
  # k3s/kubelet/ingress 가 상시 쓰는 몫을 빼면 롤아웃에 쓸 수 있는 건 약 2 코어.
  # cpu 상한이 1 코어이므로 **JVM 은 웨이브당 2개**가 상한이다.
  # 2026-08-09 실측: 웨이브당 4개(=4코어, 100%)로 잡았더니 CoreDNS 가 굶어
  # UnknownHostException → crashloop. 사이트는 살아 있었지만 롤아웃이 정체했다.
  # nginx(FE) 는 기동 비용이 무시할 수준이라 한 웨이브에 묶어도 된다.
  - target: {kind: Deployment, name: "^(gateway|portal-fe)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "1"
  - target: {kind: Deployment, name: "^(code-dictionary|commerce)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  # nginx 3종 — 기동 비용 미미
  - target: {kind: Deployment, name: "^(admin-fe|quant-fe|gifticon-fe|agent-viewer-fe)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "3"
  - target: {kind: Deployment, name: "^(auth|product)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "4"
  - target: {kind: Deployment, name: "^(search|gifticon)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "5"
  - target: {kind: Deployment, name: "^(experiment|place|agent-viewer-api)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "6"
  # 무거운 백그라운드 — 마지막에 둬서 늦거나 실패해도 트래픽 경로를 막지 않는다
  - target: {kind: Deployment, name: "^(analytics|quant)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "7"
  - target: {kind: Deployment, name: "^(chatbot|recommendation)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "8"
  - target: {kind: Deployment, name: "^(recommendation-ann|search-consumer)$"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          argocd.argoproj.io/sync-wave: "9"
    # ─── place (ADR-0056) — DB provisioning 전까지 비활성 가드 ─────────────────
    # OCIR 이미지·images: 항목은 CI 가 등재 완료. 남은 활성화 절차:
    #   1) place_db / place_user — **완료 (2026-08-09)**. 수동 생성 유저는 반드시 native
    #      password 로 만들 것: 서버 플래그 없는 세션은 caching_sha2 로 만들어져
    #      mysql-connector 8 이 못 붙는다.
    #        CREATE USER 'place_user'@'%' IDENTIFIED WITH mysql_native_password BY '...'
    #   2) OCIR 이미지 — CI 에 place 등록 완료(2026-08-09). 그 전까지 images: 항목이 없어
    #      commerce/place:latest 를 Docker Hub 에서 당기려다 실패하는 상태였다.
    #      비활성 가드(replicas: 0)는 이미지가 올라온 뒤 제거했다 — 순서를 바꾸면
    #      ImagePullBackOff 로 해당 sync-wave 가 멈춰 뒤 웨이브까지 정지한다.
    #   3) NetworkPolicy 는 라벨 기반이라 place 를 자동 포함하고, mysql-place Service 와
    #      게이트웨이 place 라우트도 이미 있다 (별도 조치 불필요).
images:
  - name: commerce/admin-fe
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/admin-fe
    newTag: b0cbf1d
  - name: commerce/analytics
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/analytics
    newTag: 3d19d63
  - name: commerce/auth
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/auth
    newTag: 1b9189b
  - name: commerce/chatbot
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/chatbot
    newTag: 3d19d63
  - name: commerce/code-dictionary
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/code-dictionary
    newTag: 0dde350
  - name: commerce/commerce
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/commerce
    newTag: 3d19d63
  - name: commerce/experiment
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/experiment
    newTag: 3d19d63
  - name: commerce/gateway
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/gateway
    newTag: 3d19d63
  - name: commerce/gifticon
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/gifticon
    newTag: 1b9189b
  - name: commerce/gifticon-fe
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/gifticon-fe
    newTag: 6a1889c
  - name: commerce/place
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/place
    newTag: 3d19d63
  - name: commerce/portal-fe
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/portal-fe
    newTag: 0dde350
  - name: commerce/product
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/product
    newTag: 3d19d63
  - name: commerce/quant
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/quant
    newTag: 3d19d63
  - name: commerce/quant-fe
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/quant-fe
    newTag: 6a1889c
  - name: commerce/quant-ingest
    newName: ap-chuncheon-1.ocir.io/axyooxbyk5yv/quant-ingest
