apiVersion: batch/v1
kind: CronJob
metadata: { name: woodland-backup, namespace: commerce }
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: woodland-backup
            app.kubernetes.io/part-of: commerce-platform
        spec:
          restartPolicy: OnFailure
          imagePullSecrets: [{name: ocir-pull-secret}]
          enableServiceLinks: false
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: { matchLabels: { app.kubernetes.io/name: woodland } }
                  topologyKey: kubernetes.io/hostname
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
          containers:
            - name: backup
              image: commerce/woodland:pending
              command: [node, backup.mjs]
              env: [{ name: WOODLAND_DATA_DIR, value: /data }]
              securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
              volumeMounts:
                - { name: world, mountPath: /data }
                - { name: par, mountPath: /par, readOnly: true }
          volumes:
            - { name: world, persistentVolumeClaim: { claimName: woodland-world } }
            - { name: par, secret: { secretName: db-backup-par } }
