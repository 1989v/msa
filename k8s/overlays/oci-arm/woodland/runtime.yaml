apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woodland-world
  namespace: commerce
  # local-path 는 WaitForFirstConsumer 라 파드가 생겨야 Bound 된다. 파드(Deployment, wave 5)보다
  # 앞 wave 에 두면 Argo 가 Pending PVC 의 health 를 기다리며 뒤 wave 전체가 멈춘다 — 같은 wave 로 둔다.
  annotations: { argocd.argoproj.io/sync-wave: "5" }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: woodland
  namespace: commerce
spec:
  selector: { app.kubernetes.io/name: woodland }
  ports: [{ name: http, port: 8349, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodland
  namespace: commerce
  annotations: { argocd.argoproj.io/sync-wave: "5" }
spec:
  replicas: 1
  strategy: { type: Recreate }
  progressDeadlineSeconds: 600
  selector:
    matchLabels: { app.kubernetes.io/name: woodland }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woodland
        app.kubernetes.io/part-of: commerce-platform
    spec:
      imagePullSecrets: [{name: ocir-pull-secret}]
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: app
          image: commerce/woodland:pending
          ports: [{ name: http, containerPort: 8349 }]
          env:
            - { name: WOODLAND_PORT, value: "8349" }
            - { name: WOODLAND_ORIGINS, value: "https://game.1989v.com,https://1989v.com" }
            - { name: WOODLAND_REDEEM_URL, value: "http://content:8097/internal/games/woodland/tickets/redeem" }
            - name: WOODLAND_BRIDGE_SECRET
              valueFrom: { secretKeyRef: { name: woodland-bridge, key: secret } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          startupProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, failureThreshold: 24 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          volumeMounts: [{ name: world, mountPath: /data }]
      volumes:
        - { name: world, persistentVolumeClaim: { claimName: woodland-world } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-woodland-to-content, namespace: commerce }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: content } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: woodland } } }]
      ports: [{ port: http, protocol: TCP }]
