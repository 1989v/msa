# commerce 플랫폼 Ingress — proxied 6 host + rt bypass host.
#
# 구조 분리 이유:
# 1) commerce-proxied — 6 host (root + admin/quant/gft/agent/api), CF proxy 활성.
#    secretName: cf-origin-ca-tls (수동 생성, Cloudflare Origin CA 15년 cert).
#    cert-manager annotation 없음 → cert-manager 가 이 cert 를 관리하지 않음.
#    SSL/TLS mode = Full (strict) 일 때 CF ↔ origin 검증 통과.
#
# 2) commerce-rt — rt.<DOMAIN>, CF proxy 미사용 (DNS only).
#    secretName: rt-tls (cert-manager 가 letsencrypt-prod HTTP01 으로 발급).
#    WebSocket / SSE bypass — CF 100s timeout + SSE 버퍼링 회피.
#
# host 매핑:
#   <DOMAIN>            (root)  → portal-fe   [proxied]
#   admin.<DOMAIN>              → admin-fe    [proxied]
#   quant.<DOMAIN>              → quant-fe    [proxied]
#   gft.<DOMAIN>                → gifticon-fe [proxied]
#   api.<DOMAIN>                → gateway (REST 위주) [proxied]
#   rt.<DOMAIN>                 → gateway (WS+SSE) [bypass]
#
# FE host (proxied) 의 /api · /ws · /sse · /svc 는 모두 gateway 로 proxy
# (same-origin 호출 유지). FE 코드가 WS/SSE 만 rt.<DOMAIN> 직접 호출 하려면
# VITE_WS_URL / VITE_SSE_URL 환경변수 설정 (Phase 4).
#
# `/actuator` 는 어느 host 에도 두지 않는다 — 익명에게 /actuator/prometheus 전량과
# 내부 클래스명이 새기 때문. Prometheus 는 ServiceMonitor 로 cluster-internal
# scrape 하고(k8s/infra/prod/monitoring), probe 는 Pod IP 로 직접 친다.
# portal-fe 서비스 카탈로그가 쓰는 헬스 표시는 gateway 의 `/svc/<service>/actuator/health`
# 라우트가 담당 — health 한 endpoint 만 노출하므로 이건 의도적으로 유지.
#
# 도메인은 실값(1989v.com)으로 커밋한다 — GitOps 표준(환경별 overlay 에 concrete 값).
# 과거 1989v.com 템플릿 + Application 인라인 인덱스 패치 방식은 host 추가 시
# 인덱스 드리프트로 sync 침묵 정지를 2회 유발해 폐기 (2026-08-05).
# host 추가 절차: 이 파일에 append → push → Argo 자동 반영 (Application 수정 불필요).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commerce-proxied
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager annotation 없음 — secretName cf-origin-ca-tls 는 수동 등록.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 1989v.com
        - admin.1989v.com
        - quant.1989v.com
        - gft.1989v.com
        - api.1989v.com
        - game.1989v.com
        - resume.1989v.com
      secretName: cf-origin-ca-tls
  rules:
    # ─── portal-fe (root) ───
    - host: 1989v.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /sse
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /svc
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: portal-fe, port: { name: http } } }
    # ─── admin-fe ───
    - host: admin.1989v.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /sse
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /svc
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: admin-fe, port: { name: http } } }
    # ─── quant-fe ───
    - host: quant.1989v.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /sse
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /svc
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: quant-fe, port: { name: http } } }
    # ─── gifticon-fe (gft.<DOMAIN>) ───
    - host: gft.1989v.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /sse
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /svc
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: gifticon-fe, port: { name: http } } }
    # ─── gateway API 전용 host (REST 위주) ───
    # root catch-all 대신 명시 prefix — `/` 로 열어두면 /actuator 가 다시 노출된다.
    - host: api.1989v.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /sse
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /svc
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
    # ─── resume (resume.<DOMAIN>) — portal-fe 가 host 인식해 이력서 화면 렌더 (ADR-0064) ───
    # 새 Deployment 를 만들지 않는다. 무료 티어 단일 노드라 파드 증설이 곧 용량 압박이다.
    - host: resume.1989v.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: portal-fe, port: { name: http } } }
    # ─── game (game.<DOMAIN>) — portal-fe 가 host 인식해 루트에서 게임 허브 렌더 ───
    - host: game.1989v.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /sse
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /svc
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: portal-fe, port: { name: http } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commerce-rt
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [rt.1989v.com]
      secretName: rt-tls
  rules:
    # ─── gateway WS/SSE bypass host (Cloudflare proxy OFF) ───
    - host: rt.1989v.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
