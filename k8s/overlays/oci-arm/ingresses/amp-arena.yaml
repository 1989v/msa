# arena.1989v.com — AMP ARENA (정적 클라 + WebSocket /ws 를 같은 서비스가 낸다).
# 별도 Ingress 로 두는 이유: WebSocket 은 유휴 60초에 끊기므로 read/send 타임아웃을 늘려야 하는데,
# 그 어노테이션은 Ingress 오브젝트 전체에 걸린다 — commerce-platform 의 다른 host 에 묻히지 않게 분리.
# TLS 는 `cf-origin-ca-tls` (*.1989v.com 와일드카드 Origin CA) 그대로. DNS 는 Cloudflare 에 proxied(orange) A/CNAME 이 있어야 한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amp-arena
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - arena.1989v.com
      secretName: cf-origin-ca-tls
  rules:
    - host: arena.1989v.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: amp-arena, port: { name: http } } }
