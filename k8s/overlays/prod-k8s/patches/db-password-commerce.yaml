# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# ADR-0058: 폴드된 6개 도메인이 각자 스키마를 쓰므로 도메인별 비밀번호를 주입한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: INVENTORY_PASSWORD
            - name: ORDER_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: ORDER_PASSWORD
            - name: FULFILLMENT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: FULFILLMENT_PASSWORD
            - name: WAREHOUSE_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: WAREHOUSE_PASSWORD
            - name: MEMBER_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: MEMBER_PASSWORD
            - name: WISHLIST_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: WISHLIST_PASSWORD
