# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# 폴드된 도메인마다 스키마가 달라 도메인별 비밀번호를 주입한다. 기본 datasource(MYSQL_PASSWORD)는 inventory_db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: INVENTORY_PASSWORD
            - name: ORDER_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: ORDER_PASSWORD
            - name: FULFILLMENT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: FULFILLMENT_PASSWORD
            - name: WAREHOUSE_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: WAREHOUSE_PASSWORD
            - name: PRODUCT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: PRODUCT_PASSWORD
            - name: DEAL_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: DEAL_PASSWORD
            - name: SELLER_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: SELLER_PASSWORD
            - name: PAYMENT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: PAYMENT_PASSWORD
            - name: PROMOTION_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: PROMOTION_PASSWORD
            - name: SETTLEMENT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: SETTLEMENT_PASSWORD
