# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# 기본 datasource(MYSQL_PASSWORD)는 experiment_db, ADS_MYSQL_PASSWORD 는 ads_db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: EXPERIMENT_PASSWORD
            - name: ADS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: ADS_PASSWORD
