# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# experiment 는 engagement 에 폴드돼 있다 (ADR-0093). engagement 의 기본 datasource(experiment_db)가 MYSQL_PASSWORD 를 읽는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: EXPERIMENT_PASSWORD
