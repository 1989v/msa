# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: EXPERIMENT_PASSWORD
