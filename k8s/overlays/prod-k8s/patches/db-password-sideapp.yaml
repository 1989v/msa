# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# chatbot·gifticon 스키마 비밀번호. quant(DB_PASSWORD)는 init Job 에 계정이 없어 base 값 그대로다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sideapp
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: CHATBOT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: CHATBOT_PASSWORD
            - name: GIFTICON_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: GIFTICON_PASSWORD
