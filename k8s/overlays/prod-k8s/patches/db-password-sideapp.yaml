# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# quant·chatbot·gifticon 스키마 비밀번호. base 의 DB_PASSWORD 평문(value)은 null 로 지워야
# valueFrom 과 함께 남지 않는다(둘 다 있으면 API 서버가 거부한다).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sideapp
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: DB_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: QUANT_PASSWORD
            - name: CHATBOT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: CHATBOT_PASSWORD
            - name: GIFTICON_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: GIFTICON_PASSWORD
