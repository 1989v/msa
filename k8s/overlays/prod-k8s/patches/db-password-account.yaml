# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# 환경변수 이름은 account 호스트 application.yml 이 읽는 이름이다 (member·wishlist).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: MEMBER_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: MEMBER_PASSWORD
            - name: WISHLIST_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: WISHLIST_PASSWORD
