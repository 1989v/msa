# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# game·ranking·blog 스키마 비밀번호. 기본 datasource(place_db, MYSQL_PASSWORD)는 init Job 에 계정이 없어 여기서 주입하지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: GAME_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: GAME_PASSWORD
            - name: RANKING_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: RANKING_PASSWORD
            - name: BLOG_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: BLOG_PASSWORD
