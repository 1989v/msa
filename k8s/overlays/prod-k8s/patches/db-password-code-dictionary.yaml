# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값 유지 (init Job 이 동일 이름으로 생성).
# ADR-0059: code_dictionary_db + game_db 두 스키마를 쓰므로 비밀번호도 2개.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-dictionary
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: CODE_DICTIONARY_PASSWORD
            - name: GAME_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: GAME_PASSWORD
