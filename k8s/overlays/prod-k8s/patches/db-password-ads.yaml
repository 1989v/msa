# prod DB 비밀번호 주입 — 사용자명은 application.yml 기본값(ads_user) 유지 (init Job 이 동일 이름으로 생성).
# ads 는 engagement 에 폴드돼 있다 (ADR-0098).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: ADS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commerce-app-db-secrets
                  key: ADS_PASSWORD
