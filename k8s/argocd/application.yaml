# Argo CD Application — commerce 플랫폼 단일 앱.
# install.sh 가 repo URL 과 OCI 환경별 값(IP/email)을 치환한 뒤 apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commerce
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: __GITHUB_REPO_URL__
    targetRevision: main
    path: k8s/overlays/oci-arm
    kustomize:
      # Argo CD 는 overlay 의 scripts/render.sh 를 실행하지 않는다.
      # 환경별 도메인 host / Let's Encrypt email 은 Application-level
      # inline patches 로 주입한다. install.sh 가 __DOMAIN__ /
      # __OCI_LE_EMAIL__ / __GITHUB_REPO_URL__ 를 sed 로 치환.
      patches:
        # 도메인(host)은 ingress 에 실값으로 커밋 (2026-08-05) — 과거의 인덱스 결합
        # 인라인 패치는 host 추가 시 sync 침묵 정지를 유발해 폐기. 클러스터에 남아 있는
        # 구버전 Application 의 ingress 패치는 동일 값 치환(no-op)이라 무해하며,
        # 본 파일을 다음 재적용할 때 자연 정리된다.
        - target:
            group: cert-manager.io
            kind: ClusterIssuer
            name: letsencrypt-prod
          patch: |-
            - op: replace
              path: /spec/acme/email
              value: __OCI_LE_EMAIL__
        - target:
            group: cert-manager.io
            kind: ClusterIssuer
            name: letsencrypt-staging
          patch: |-
            - op: replace
              path: /spec/acme/email
              value: __OCI_LE_EMAIL__

  destination:
    server: https://kubernetes.default.svc
    namespace: commerce   # 대부분 commerce ns 로 떨어짐. ClusterIssuer 는 cluster-scoped.

  syncPolicy:
    automated:
      prune: true        # git 에서 사라진 리소스를 클러스터에서도 삭제
      selfHeal: true     # 수동 kubectl edit 등을 git 상태로 자동 되돌림
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true       # kustomize 매니페스트 크기 회피
      - PruneLast=true             # 의존 순서 유지
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
      # 바뀐 리소스만 apply. 없으면 태그 한 줄 bump 에도 매니페스트 전체(~25종)를 훑어
      # 한 서비스의 문제가 동기화 전체를 붙잡는다 — 2026-08-21 정지 사고의 확대 경로였다.
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  # 운영에 영향 없는 cosmetic drift 무시 — sync 상태를 Healthy 로 유지.
  ignoreDifferences:
    # cert-manager 가 자동 채우는 secret(*-tls) 의 diff
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    # K8s 가 StatefulSet 적용 시 자동 추가하는 기본 필드 (volumeClaimTemplates
    # 의 volumeMode/creationTimestamp/status 등). 6 StatefulSet (mysql, redis,
    # kafka, opensearch, clickhouse, quant-postgres) 가 영구 OutOfSync 표시
    # 되는 원인. volumeClaimTemplates 자체 변경 (PVC 사이즈 등) 은 Argo CD
    # 가 못 잡으므로 변경 시엔 수동 kubectl apply 필요.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
