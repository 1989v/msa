spring:
  application:
    name: product-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    master:
      jdbc-url: jdbc:mysql://localhost:3316/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQL_USER:product_user}
      password: ${MYSQL_PASSWORD:product_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
    replica:
      jdbc-url: jdbc:mysql://localhost:3317/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQL_USER:product_user}
      password: ${MYSQL_PASSWORD:product_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  # ADR-0029 PR-7: Flyway baseline 도입. Hibernate ddl-auto=validate 와 결합해 스키마 변경은 Flyway 단독 책임.
  # baseline-on-migrate 로 기존 운영 DB(ddl-auto 가 만든 products 테이블 보유)를 기준선으로 삼는다.
  # 신규 마이그레이션:
  #   - V1__create_products_table.sql                    (legacy baseline, IF NOT EXISTS 로 신규 DB 호환)
  #   - V20260502_010__create_processed_event.sql        (ADR-0029 PR-7, §6 표준 스키마 — product 측 신규 도입)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 운영 스키마는 Hibernate ddl-auto=update 가 만든 것이라 Flyway 이력이 없다
    # (Boot 4 에서 자동설정 모듈이 분리된 걸 놓쳐 마이그레이션이 실행된 적이 없었다 —
    #  docs/conventions/jpa-persistence.md). 실제 스키마가 **전 마이그레이션 적용 상태와
    # 동일함을 대조 확인**했으므로 최신 버전을 기준선으로 잡고 이후 버전부터 적용한다.
    # baseline-version 은 이력 테이블이 없을 때 한 번만 쓰인다 — 이후엔 무시되므로 갱신 불필요.
    baseline-version: "20260703.001"   # 따옴표 필수 — YAML 이 숫자로 읽으면 지수표기(2.02607E7)가 돼 Flyway 가 거부한다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8081
  shutdown: graceful

kafka:
  topics:
    product-created: product.item.created
    product-updated: product.item.updated

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
