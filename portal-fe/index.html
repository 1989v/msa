<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Google Analytics (GA4) — SPA 라우트 전환은 향상된 측정(History API)이 자동 집계.
         game.1989v.com 도 같은 번들이라 hostname 차원으로 분리 조회 가능.

         resume 호스트에서는 싣지 않는다. 이력서는 토큰 게이트로 닫고 noindex 로 둔 개인정보
         문서인데(ADR-0064), 열람 기록을 토큰·경로·시각으로 한정해 놓고 같은 페이지에서 GA 가
         기기·유입 정보를 내보내면 그 결정이 무의미해진다. 문서 경로(/d/<slug>)까지 리포트에
         남는다. 한 벌의 index.html 이 모든 호스트를 서빙하므로 여기서 갈라야 한다. -->
    <script>
      (function () {
        var host = location.hostname;
        // 개발 중 클릭이 실제 리포트에 섞이면 유입 분석이 흐려진다
        if (host === "localhost" || host === "127.0.0.1") return;
        if (host.split(".")[0] === "resume") return;
        var id = "G-5EE8XW7JHN";
        var tag = document.createElement("script");
        tag.async = true;
        tag.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(tag);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", id);
      })();
    </script>

    <!-- 모바일 브라우저가 주소창을 이 색으로 칠한다 — 아래 스크립트가 톤에 맞춰 바꾼다 -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- 삼성 인터넷은 CSS 의 color-scheme 보다 이 메타 태그를 신호로 읽는다. 선언이 없으면
         자체 강제 다크 변환을 적용해, 사이트가 라이트인데 화면만 어둡게 뒤집힌다.
         값은 아래 스크립트가 고른 정경에 맞춰 덮어쓴다. -->
    <meta name="color-scheme" content="only light" />

    <!-- 첫 페인트 전에 톤을 확정한다. 번들이 뜬 뒤 칠하면 정적 HTML 이 먼저 그려지면서
         라이트를 고른 사람에게 다크가 한 번 번쩍인다. 판정 규칙의 원본은
         src/hooks/useHeritageSurface.ts 이고 여기는 같은 규칙의 최소 사본이다. -->
    <script>
      (function () {
        var KEY = "kh-theme";
        function stored() {
          var hit = document.cookie.split("; ").find(function (c) {
            return c.indexOf(KEY + "=") === 0;
          });
          var v = hit && hit.slice(KEY.length + 1);
          if (v === "light" || v === "dark") return v;
          try {
            v = localStorage.getItem(KEY);
          } catch (e) {
            v = null;
          }
          return v === "light" || v === "dark" ? v : null;
        }
        var root = document.documentElement;
        var theme;
        // /tech 만 브랜드 면이 아니다 — dark-trading 팔레트를 전제로 그려진 화면이라 다크 고정.
        if (location.pathname === "/tech") {
          theme = "dark";
        } else {
          theme =
            stored() ||
            (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          root.setAttribute("data-surface", "heritage");
        }
        root.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#131313" : "#f9f8f2");
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", "only " + theme);
      })();
    </script>

    <!-- scripts/prerender-seo.mjs 가 이 블록을 페이지별 메타로 통째 교체한다.
         마커를 지우면 프리렌더가 조용히 무력화되므로 유지할 것. -->
    <!--seo:start-->
    <title>kgd.dev — IT 개념 사전 · 백엔드 포트폴리오</title>
    <meta
      name="description"
      content="코드베이스에서 추출한 IT 개념 사전, 백엔드 아키텍처 포트폴리오, MSA 서비스 카탈로그를 한곳에."
    />
    <link rel="canonical" href="https://1989v.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="kgd.dev" />
    <meta property="og:title" content="kgd.dev — IT 개념 사전 · 백엔드 포트폴리오" />
    <meta
      property="og:description"
      content="코드 딕셔너리 · 포트폴리오 · MSA 서비스 카탈로그"
    />
    <meta property="og:url" content="https://1989v.com/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="kgd.dev — IT 개념 사전 · 백엔드 포트폴리오" />
    <meta
      name="twitter:description"
      content="코드 딕셔너리 · 포트폴리오 · MSA 서비스 카탈로그"
    />
    <!--seo:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
