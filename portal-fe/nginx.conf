# 색인하지 않는 호스트. robots.txt 와 별개로 헤더로도 막는다 — robots 를 무시하는 수집기가 있다.
#
#   resume  실명·연락처가 들어간다. 크롤 자체를 막는다 (ADR-0064).
#   ads     광고주 콘솔 — 로그인한 광고주의 작업 화면이다 (ADR-0098).
#
# deal 은 2026-08-24 에 이 목록에서 빠졌다 (ADR-0069 개정). thin affiliate 방어는 색인 차단이
# 아니라 **아웃바운드에 rel="sponsored nofollow" + /go/ 크롤 차단**이 하고, 그 둘은 그대로다.
map $host $host_robots_tag {
    default          "";
    resume.1989v.com "noindex, nofollow";
    ads.1989v.com    "noindex, nofollow";
}

# apex 전용 화면(/tech·/portfolio·/shop 과 흡수 sub-app)을 그대로 서빙하면 안 되는 호스트.
#
# 한 벌의 번들이 모든 호스트를 서빙하므로 `game.1989v.com/shop` 이 스토어를 200 으로 연다.
# canonical 은 apex 를 가리키지만 **canonical 은 보조 수단이지 대체재가 아니다** — 크롤 예산은
# 이미 쓰이고, 실제로 `site:game.1989v.com` 상위에 게임과 무관한 `/shop`·`/portfolio` 가
# 섞여 나왔다 (2026-09-10 실측: 둘 다 200 + canonical=1989v.com). 그래서 301 로 넘긴다.
#
# 목록에 없는 호스트(apex·localhost·프리뷰)는 0 이라 지금 동작 그대로다.
map $host $apex_only_host {
    default          0;
    game.1989v.com   1;
    place.1989v.com  1;
    blog.1989v.com   1;
    deal.1989v.com   1;
    rank.1989v.com   1;
    resume.1989v.com 1;
    ads.1989v.com    1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 텍스트 자산 압축. 없으면 메인 번들이 원본 그대로(696KB) 나간다 — Cloudflare 가 대신 압축해 주지 않는 것을
    # 실측했다(2026-09-03, Accept-Encoding: br 로 받아도 content-encoding 없이 696,423B). gzip 6 이면 177KB.
    # 미리 gzip 으로 구운 유니티 산출물은 아래 location 들이 gzip off 로 따로 다룬다.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    add_header X-Robots-Tag $host_robots_tag always;

    # ── SEO 정적 자산 (scripts/prerender-seo.mjs 산출물) ─────────────────────
    # portal-fe 한 벌이 여러 호스트를 서빙하므로 robots/sitemap/llms/허브는 $host 로
    # 갈라 준다. 매칭 실패 시 SPA 로 폴백.
    #
    # Cache-Control 을 반드시 명시한다. 비워 두면 Cloudflare 가 기본 4시간을 붙여
    # 배포 후에도 옛 robots 를 계속 내보낸다 — 호스트를 새로 붙였을 때 그 호스트가
    # 몇 시간 동안 apex 폴백 robots 를 받는 사고가 실제로 났다(2026-08-20).
    # 크롤러가 자주 읽는 파일이 아니라 짧은 TTL 의 비용은 사실상 없다.

    location = /robots.txt {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /seo/$host/robots.txt /seo/1989v.com/robots.txt =404;
    }

    # 행사 sitemap (ADR-0103) — 정적 파일이 아니라 search 가 요청 시점의 오늘(KST)로 만든다.
    # place sitemap 인덱스가 이 주소를 가리킨다. 정확 일치(=)라 아래 sitemap 정규식보다 먼저 잡힌다 —
    # 정규식이 잡으면 없는 정적 파일을 찾아 404 가 난다.
    #
    # - place 호스트에서만 연다. 다른 호스트에 같은 경로를 열면 남의 sitemap 에 place URL 이 실린다.
    # - upstream 경로는 고정 문자열이다. $request_uri·쿼리를 넘기지 않는다(변수 proxy_pass 에 URI 를
    #   적으면 원래 요청 URI 가 통째로 그 값으로 바뀐다).
    # - 상세 렌더 location 을 베끼지 않는다. 그쪽은 5xx 를 SPA 셸 200 으로 바꾸는 폴백이 있는데,
    #   sitemap 자리에 HTML 200 이 나가면 크롤러가 URL 이 모두 사라졌다고 읽는다. 그래서
    #   proxy_intercept_errors·error_page 를 두지 않고 search 의 503 을 그대로 낸다.
    # - Cache-Control 은 성공 응답에만 붙는다(always 없음) — 503 은 search 가 단 no-store 로 나간다.
    location = /sitemap-places-events.xml {
        if ($host != "place.1989v.com") {
            return 404;
        }
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        resolver_timeout 1s;
        set $render_upstream http://search.commerce.svc.cluster.local:8083;
        proxy_pass $render_upstream/internal/render/sitemap/events.xml;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 5s;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
    }

    # sitemap.xml 과 분할본(sitemap-places-1.xml 등) 모두 호스트별로 가른다.
    # place 는 6만 URL 이라 파일당 상한(50,000)에 걸려 인덱스 + 분할 구조다.
    location ~ ^/(sitemap[a-z0-9.\-]*\.xml)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /seo/$host/$1 =404;
    }

    # 답변형 검색(AEO) 진입 문서. 호스트마다 다른 서비스를 설명한다.
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /seo/$host/llms.txt =404;
    }

    # ads.txt — 이 도메인의 광고 재고를 팔 권한이 있는 판매자 선언 (ADR-0076).
    # 반드시 명시 route 여야 한다: 아래 `location /` 폴백이 잡으면 크롤러가 판매자
    # 목록 대신 index.html 을 받고, 그 응답은 파싱 실패가 아니라 '유효한 줄 0개'로
    # 읽혀 도메인 전체 입찰이 끊긴다. 승인 전(게시자 ID 미주입)에는 파일이 없으므로 404.
    location = /ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /seo/$host/ads.txt =404;
    }

    # game.1989v.com 루트 = 게임 허브, 1989v.com 루트 = 포털 SPA
    # add_header 는 하위 레벨에 하나라도 있으면 상위 것을 상속하지 않는다.
    # 아래 블록들은 Cache-Control 을 직접 넣으므로 X-Robots-Tag 도 함께 적어 준다.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /prerender/_hosts/$host.html /index.html;
    }

    # /en 도 호스트로 갈라야 한다 — place 호스트의 영문 홈에 게임 허브가 나가면
    # canonical 까지 game.1989v.com 을 가리켜 place 영문 페이지가 통째로 오색인된다.
    location = /en {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /prerender/_hosts/$host.en.html /prerender/en/index.html /index.html;
    }

    # 개인정보처리방침만 호스트를 가리지 않는다 — 어느 호스트로 들어와도 방침이 그 자리에서
    # 열려야 한다(광고 심사·이용자 모두 그 호스트에서 확인한다). canonical 은 apex 를
    # 가리키므로 색인은 한 장으로 합쳐진다. 정확 매칭이라 아래 정규식보다 먼저 잡힌다.
    location = /privacy {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /prerender/privacy.html /index.html;
    }

    # 분류별 용어집 (`/tech/data-structure` 등). 아래 apex 정적 페이지보다 먼저 적어야
    # `^/(tech|…)$` 가 아닌 하위 경로가 여기로 온다. 서브도메인에서는 apex 로 넘긴다.
    location ~ ^/tech/([a-z][a-z-]*)$ {
        if ($apex_only_host) { return 301 https://1989v.com$request_uri; }
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /prerender/tech/$1.html /index.html;
    }

    # apex 정적 페이지 — 초기 HTML 이 전부 같은 타이틀이면 비 JS 크롤러가 넷을 구분하지 못한다
    location ~ ^/(tech|portfolio|shop)$ {
        if ($apex_only_host) { return 301 https://1989v.com$request_uri; }
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /prerender/$1.html /index.html;
    }

    # 하위 경로와 흡수 sub-app — 프리렌더가 없어 SPA 셸로 가지만, 서브도메인에서 열리면
    # 안 되는 것은 위와 같다. nginx 는 location 사이를 흘려보내지 않으므로 이 블록이
    # 두 동작을 함께 갖는다.
    location ~ ^/(shop|quant|gifticon|agent-viewer|admin)(/|$) {
        if ($apex_only_host) { return 301 https://1989v.com$request_uri; }
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files $uri /index.html;
    }

    # 관광지 상세 서버 렌더 (ADR-0103) — search:app 이 셸에 관광지 메타·본문을 넣어 낸다.
    # 응답의 `X-Render: ssr` 이 서버 렌더 표지고, 프리렌더 파일은 거치지 않는다.
    #
    # - 숫자 id(1~12자리)만 받고 upstream 주소는 캡처한 값으로만 만든다. $request_uri 를
    #   넘기면 쿼리·인코딩된 문자가 그대로 search 로 간다.
    # - 이름은 요청 때 푼다(변수 + resolver). 정적 proxy_pass 는 기동 때 풀어서 search 가
    #   없는 환경(docker run 단독 등)에서 nginx 가 안 뜨고 모든 호스트가 같이 내려간다.
    #   resolver 주소는 기동 때 /etc/resolv.conf 에서 읽는다(Dockerfile 의 템플릿 치환).
    # - 시간 초과는 층을 둔다: 연결 0.5초 · 읽기 3초. search 가 셸을 받는 한도(1초)가 읽기
    #   한도보다 작아야 셸 캐시가 만료된 요청도 서버 렌더로 나간다.
    # - 로그인 쿠키(.1989v.com 도메인)·Authorization 은 넘기지 않는다 — 렌더에 필요 없고
    #   search 의 로그·예외에 토큰이 남는다.
    # - search 의 404 는 그대로 낸다. 가로채는 것은 5xx·시간 초과·연결 실패뿐이고, 그때는
    #   SPA 셸이 200 으로 나가 화면은 클라이언트가 그린다.
    location ~ "^/(?<render_lang>en/)?attractions/(?<render_id>[0-9]{1,12})$" {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        resolver_timeout 1s;
        set $render_upstream http://search.commerce.svc.cluster.local:8083;
        proxy_pass $render_upstream/internal/render/${render_lang}attractions/$render_id;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 3s;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @attraction_shell;
    }

    location @attraction_shell {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        # search 가 내는 shell-fallback(색인 조회 실패)과 가른다 — 운영 확인에서 어느 층이
        # 셸로 떨어졌는지 응답만 보고 알 수 있게.
        add_header X-Render proxy-fallback always;
        try_files /index.html =404;
    }

    # 숫자가 아닌 관광지 id 는 없는 페이지다. 위 블록보다 뒤에 둬야 숫자 id 를 가로채지 않는다.
    location ~ ^/(en/)?attractions/[^/]+$ {
        return 404;
    }

    # 광주(29)·전남(46)은 전남광주통합특별시(12)로 합쳐졌다 — 원천도 12 로만 주고 29·46 행은 없다.
    # 옛 주소는 SPA 폴백으로 빈 지역 페이지를 200 으로 내므로 통합시 허브로 넘긴다.
    # 시군구는 시도 허브로만 보낸다: 새 코드가 접두 치환으로 맞지 않는다
    # (광주 동구 29110 → 12210, 광양 46230 → 12190 이고 12110 은 목포다).
    # 아래 지역 location 보다 앞에 둬야 한다 — 정규식 location 은 먼저 맞은 것이 이긴다.
    location ~ "^/(?<legacy_region_lang>en/)?regions/(29|46)([0-9]{3})?$" {
        return 301 https://$host/${legacy_region_lang}regions/12;
    }

    # 지역 상세 프리렌더 (ADR-0062 §8 개정) — 개요 있는 문서만 파일이 있고
    # 나머지는 SPA 폴백. 이 경로는 어느 호스트로 오든 같은 place 콘텐츠에 canonical 이
    # place 호스트를 가리키므로 경로 키로 충분하다 — _hosts/$host 키가 필요한 것은
    # 호스트마다 내용이 갈리는 / 와 /en 뿐이다.
    location ~ ^/(en/)?(regions)/([A-Za-z0-9][A-Za-z0-9._-]*)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files /prerender/$1$2/$3.html /index.html;
    }

    # 유니티 프로젝트 원본은 서빙하지 않는다. .dockerignore 가 이미지에서 빼지만,
    # 한 겹 더 막아 둔다 — 한쪽만 풀려도 소스가 공개되면 안 된다.
    location ^~ /games/_src { return 404; }

    # Skybound retired by owner on 2026-09-27. Do not fall back to the SPA.
    location ~ ^/(en/)?games/skybound(/|$) {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store" always;
        return 410;
    }

    # 게임 허브 (/games, /en/games)
    location ~ ^/(en/)?games/?$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /prerender/$1games/index.html /index.html;
    }

    # 장르 랜딩 · 게임 상세 (/games/genre/puzzle, /games/spud-arena, /en/... )
    location ~ ^/(en/)?games/(genre/[a-z0-9-]+|[a-z0-9][a-z0-9-]*)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /prerender/$1games/$2.html /index.html;
    }

    # 원시 게임 프레임은 상세 페이지가 iframe 으로 물고 있는 소스다. 단독 색인되면
    # 설명·평점·내부링크가 없는 얇은 페이지가 상세 페이지와 경합하므로 색인만 막는다
    # (follow 는 유지 — 프레임 안의 링크는 계속 따라가게).
    location ~ ^/games/[a-z0-9][a-z0-9-]*/index\.html$ {
        add_header X-Robots-Tag "noindex, follow";
        add_header Cache-Control "no-cache, must-revalidate";
        # 외부 사이트가 게임을 iframe 으로 감싸 자기 광고를 붙이는 것을 브라우저 수준에서 차단
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.1989v.com" always;
        try_files $uri /index.html;
    }

    # ── Unity WebGL 산출물 (ADR: docs/plans/2026-08-27-unity-web-game-pipeline.md) ──
    # 압축 폴백을 꺼 둔 채 Gzip 으로 굽는다. 서버가 Content-Encoding 과 **원래 MIME** 을 붙여야
    # 브라우저가 푼다 — 이게 틀리면 게임이 로딩 0% 에서 멈추고, 게임 버그로 오진하기 딱 좋다.
    # 폴백을 켜면 설정이 틀려도 JS 가 대신 풀어 줘서 오류가 숨는다. 그래서 끈 채로 둔다.
    # `types { }` 로 이 location 의 확장자 매핑을 비워야 default_type 이 먹는다
    # (안 비우면 nginx 가 .gz 를 application/gzip 으로 보내고 wasm 파서가 거부한다).
    # 파일명이 콘텐츠 해시라 배포마다 URL 이 바뀐다 — 그래서 immutable 로 영구 캐시한다.
    location ~* ^/games/[a-z0-9][a-z0-9-]*/Build/.+\.wasm\.gz$ {
        types { }
        default_type application/wasm;
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* ^/games/[a-z0-9][a-z0-9-]*/Build/.+\.js\.gz$ {
        types { }
        default_type text/javascript;
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* ^/games/[a-z0-9][a-z0-9-]*/Build/.+\.(data|symbols\.json)\.gz$ {
        types { }
        default_type application/octet-stream;
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # 로더만 압축하지 않는다 — <script src> 로 그냥 받는다. 이름은 해시라 영구 캐시.
    location ~* ^/games/[a-z0-9][a-z0-9-]*/Build/.+\.loader\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Native ES modules need an explicit MIME type on nginx versions whose mime.types omit mjs.
    location ~* ^/games/.+\.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 게임 스크립트/스타일은 파일명에 해시가 없어 배포해도 URL 이 그대로다. Cache-Control 을
    # 주지 않으면 CDN 이 자체 기본 TTL(4h)을 붙여 배포 후에도 구버전이 계속 나간다.
    # ETag 가 있으므로 재검증은 대부분 304 로 끝난다. (해시가 붙는 /assets/ 는 immutable 유지)
    location ~* ^/games/.+\.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── SPA ────────────────────────────────────────────────────────────────
    # root 기준 모든 path 가 index.html 로 리다이렉트.
    # /api/* / /sse/* / /ws/* 같은 백엔드 path 는 ingress 가 gateway 로 먼저 라우팅하므로
    # 본 nginx 까지 도달하지 않는다. nginx 가 직접 프록시하는 곳은 위의 관광지 상세 서버 렌더뿐이다.
    # `$uri/` 디렉토리 매칭은 제외 — 정적 게임 자산 디렉토리(/games/*)가 SPA 라우트 /games 와
    # 겹칠 때 403 이 나므로, 디렉토리 요청은 전부 SPA 로 보낸다 (게임은 full 파일 경로로 접근).
    location / {
        try_files $uri /index.html;
    }

    # HTML 은 항상 재검증 — 게임/SPA 엔트리가 배포 직후에도 브라우저 캐시로 이전 버전을 재사용하지 않게.
    # (fallback 내부 리다이렉트도 이 블록을 타므로 SPA 셸에도 적용된다)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $host_robots_tag always;
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
