<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>모바일 조작부 진단</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f1420; color: #e8eaf0; font: 14px/1.6 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 12px; }
  h2 { font-size: 14px; margin: 18px 12px 6px; color: #9fb0d8; }
  table { width: 100%; border-collapse: collapse; font: 12px/1.5 ui-monospace, monospace; }
  td { padding: 4px 12px; border-bottom: 1px solid #1e2537; vertical-align: top; }
  td:first-child { color: #8b95ad; white-space: nowrap; width: 44%; }
  .ok { color: #66bb6a; } .bad { color: #ef5350; } .warn { color: #ffb74d; }
  #frameBox { border: 2px solid #ef5350; margin: 8px 12px; position: relative; }
  #frameBox iframe { width: 100%; height: 100%; border: 0; display: block; }
  #bottomMark { position: fixed; left: 0; right: 0; height: 28px; background: #ef5350; color: #fff;
    font: bold 12px/28px monospace; text-align: center; z-index: 99999; }
  #copy { margin: 14px 12px 40px; padding: 10px 16px; font-size: 14px; }
</style>
</head>
<body>
<h1>모바일 조작부 진단</h1>
<h2>이 빨간 띠가 보이나요?</h2>
<table><tr><td>빨간 띠</td><td>화면 맨 아래에 붙어 있습니다. <b>안 보이면</b> 브라우저 툴바가 그 자리를 덮고 있다는 뜻입니다.</td></tr></table>

<h2>뷰포트</h2><table id="vp"></table>
<h2>서빙 파일 버전 (캐시 확인)</h2><table id="ver"></table>
<h2>실제 게임 iframe 측정</h2><table id="game"></table>
<div id="frameBox"></div>
<button id="copy">결과 전부 복사</button>
<div id="bottomMark">↓ 화면 맨 아래 ↓</div>

<script>
(function () {
  var rows = [];
  function put(tableId, k, v, cls) {
    var t = document.getElementById(tableId);
    var tr = t.insertRow();
    tr.insertCell().textContent = k;
    var c = tr.insertCell();
    c.textContent = v;
    if (cls) c.className = cls;
    rows.push(k + ' = ' + v);
  }
  function probe(unit) {
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;visibility:hidden;height:100' + unit;
    document.body.appendChild(d);
    var h = d.getBoundingClientRect().height;
    d.remove();
    return Math.round(h);
  }

  var vv = window.visualViewport;
  put('vp', 'origin (캐시는 호스트별로 따로)', location.origin);
  put('vp', 'userAgent', navigator.userAgent);
  put('vp', 'screen', screen.width + 'x' + screen.height + ' dpr=' + devicePixelRatio);
  put('vp', 'innerWidth/Height (레이아웃)', innerWidth + 'x' + innerHeight);
  put('vp', 'visualViewport (보이는 영역)', vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) +
    ' offTop=' + Math.round(vv.offsetTop) + ' scale=' + vv.scale : '미지원');
  var lay = innerHeight, vis = vv ? Math.round(vv.height) : innerHeight;
  put('vp', '레이아웃 - 보이는 높이', (lay - vis) + 'px',
    lay - vis > 0 ? 'bad' : 'ok');
  put('vp', '100dvh / 100svh / 100lvh', probe('dvh') + ' / ' + probe('svh') + ' / ' + probe('lvh'));
  put('vp', 'pointer: coarse', String(matchMedia('(pointer: coarse)').matches),
    matchMedia('(pointer: coarse)').matches ? 'ok' : 'bad');
  put('vp', 'orientation', innerWidth > innerHeight ? 'landscape' : 'portrait');

  // ── 서빙 파일이 새 버전인지 (브라우저 캐시 vs 네트워크) ──
  function check(label, opts) {
    return fetch('/games/lib/touch.js', opts)
      .then(function (r) { return r.text().then(function (t) { return { s: r.status, t: t }; }); })
      .then(function (r) {
        var isNew = r.t.indexOf('flex-start') >= 0 && r.t.indexOf('safe center') < 0;
        var rest = /opacity:\.5;transition:opacity \.12s/.test(r.t);
        put('ver', label, 'HTTP ' + r.s + ' · ' + r.t.length + 'B · ' +
          (isNew ? '신버전(상단정렬)' : '구버전(가운데정렬)') + ' · ' +
          (rest ? '조이스틱 상시노출 O' : '조이스틱 상시노출 X'),
          isNew && rest ? 'ok' : 'bad');
      })
      .catch(function (e) { put('ver', label, 'FAIL ' + e); });
  }

  // ── 실제 게임을 호스트와 같은 방식으로 띄워 측정 ──
  function measureGame() {
    var box = document.getElementById('frameBox');
    var h = vv ? Math.round(vv.height) : innerHeight;
    box.style.height = Math.round(h * 0.55) + 'px';
    var f = document.createElement('iframe');
    f.src = '/games/overworld-quest/index.html';
    box.appendChild(f);
    return new Promise(function (res) {
      f.addEventListener('load', function () {
        setTimeout(function () {
          var d, w;
          try { d = f.contentDocument; w = f.contentWindow; } catch (e) { put('game', 'iframe', '접근불가 ' + e); return res(); }
          var btns = [].slice.call(d.querySelectorAll('button'));
          var start = btns.filter(function (b) { return /모험 시작/.test(b.textContent); })[0];
          if (start) start.click();
          setTimeout(function () {
            var cv = d.querySelector('canvas'), base = d.getElementById('vt-base');
            var fh = f.getBoundingClientRect().height;
            var cr = cv && cv.getBoundingClientRect(), br = base && base.getBoundingClientRect();
            put('game', 'iframe 높이', Math.round(fh) + 'px');
            put('game', '게임이 본 뷰포트', w.innerWidth + 'x' + w.innerHeight);
            put('game', 'body 정렬', w.getComputedStyle(d.body).justifyContent,
              w.getComputedStyle(d.body).justifyContent === 'flex-start' ? 'ok' : 'bad');
            put('game', '캔버스', cr ? Math.round(cr.width) + 'x' + Math.round(cr.height) + ' @y' + Math.round(cr.top) : '없음');
            put('game', '조이스틱 hidden', base ? String(base.hasAttribute('hidden')) : '요소없음');
            put('game', '조이스틱 opacity', base ? w.getComputedStyle(base).opacity : '-');
            put('game', '조이스틱 위치', br ? Math.round(br.top) + '~' + Math.round(br.bottom) : '-');
            put('game', '조이스틱이 iframe 안에 들어옴', br ? String(br.bottom <= fh + 1) : '-',
              br && br.bottom <= fh + 1 ? 'ok' : 'bad');
            res();
          }, 1500);
        }, 800);
      });
    });
  }

  check('브라우저 캐시 그대로', {}).then(function () {
    return check('캐시 무시(no-store)', { cache: 'no-store' });
  }).then(measureGame).then(function () {
    document.getElementById('copy').onclick = function () {
      var txt = rows.join('\n');
      if (navigator.clipboard) navigator.clipboard.writeText(txt);
      this.textContent = '복사됨 — 붙여넣어 주세요';
    };
  });

  function syncMark() {
    var m = document.getElementById('bottomMark');
    if (vv) m.style.top = Math.round(vv.offsetTop + vv.height - 28) + 'px';
    else m.style.bottom = '0';
  }
  syncMark();
  if (vv) { vv.addEventListener('resize', syncMark); vv.addEventListener('scroll', syncMark); }
  addEventListener('resize', syncMark);
})();
</script>
</body>
</html>
