<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>진단</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f1420; color: #e8eaf0; font: 14px/1.6 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 12px; }
  h2 { font-size: 14px; margin: 18px 12px 6px; color: #9fb0d8; }
  p { margin: 8px 12px; }
  table { width: 100%; border-collapse: collapse; font: 12px/1.5 ui-monospace, monospace; }
  td { padding: 4px 12px; border-bottom: 1px solid #1e2537; vertical-align: top; }
  td:first-child { color: #8b95ad; white-space: nowrap; width: 44%; }
  .ok { color: #66bb6a; } .bad { color: #ef5350; }
  #bottomMark { position: fixed; left: 0; right: 0; height: 30px; background: #ef5350; color: #fff;
    font: bold 12px/30px monospace; text-align: center; z-index: 99999; }
  #copy { margin: 14px 12px 60px; padding: 12px 18px; font-size: 15px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  // 공개 사이트에 뜨는 페이지다. 토큰 없이는 아무것도 그리지 않는다 — 떠돌다 발견되는
  // 디버그 화면을 남기지 않기 위한 것이고, 원인 확인 후 파일째 지운다.
  var TOKEN = 'COmzINbkze';
  if (new URLSearchParams(location.search).get('k') !== TOKEN) {
    document.getElementById('root').textContent = '';
    return;
  }

  var rows = [];
  var root = document.getElementById('root');
  function h(tag, text) { var e = document.createElement(tag); if (text) e.textContent = text; root.appendChild(e); return e; }
  function table(id) { var t = document.createElement('table'); t.id = id; root.appendChild(t); return t; }
  function put(tableId, k, v, cls) {
    var tr = document.getElementById(tableId).insertRow();
    tr.insertCell().textContent = k;
    var c = tr.insertCell();
    c.textContent = v;
    if (cls) c.className = cls;
    rows.push(k + ' = ' + v);
  }
  function probe(unit) {
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;visibility:hidden;height:100' + unit;
    document.body.appendChild(d);
    var h2 = d.getBoundingClientRect().height;
    d.remove();
    return Math.round(h2);
  }

  h('h1', '모바일 조작부 진단');
  h('h2', '1. 화면 맨 아래 빨간 띠가 보이나요?');
  h('p', '안 보이면 브라우저 툴바가 그 자리를 덮고 있다는 뜻입니다 — 조이스틱이 정확히 거기 있습니다.');
  h('h2', '2. 뷰포트'); table('vp');
  h('h2', '3. 브라우저가 지금 쥐고 있는 파일 버전'); table('ver');

  var vv = window.visualViewport;
  put('vp', 'origin', location.origin);
  put('vp', 'userAgent', navigator.userAgent);
  put('vp', 'screen', screen.width + 'x' + screen.height + ' dpr=' + devicePixelRatio);
  put('vp', 'innerWidth/Height (레이아웃)', innerWidth + 'x' + innerHeight);
  put('vp', 'visualViewport (보이는 영역)', vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) +
    ' offTop=' + Math.round(vv.offsetTop) + ' scale=' + vv.scale : '미지원');
  var diff = innerHeight - (vv ? Math.round(vv.height) : innerHeight);
  put('vp', '레이아웃 - 보이는 높이', diff + 'px', diff > 0 ? 'bad' : 'ok');
  put('vp', '100dvh / 100svh / 100lvh', probe('dvh') + ' / ' + probe('svh') + ' / ' + probe('lvh'));
  put('vp', 'pointer: coarse', String(matchMedia('(pointer: coarse)').matches),
    matchMedia('(pointer: coarse)').matches ? 'ok' : 'bad');
  put('vp', 'orientation', innerWidth > innerHeight ? 'landscape' : 'portrait');

  // 읽기만 한다 — 게임을 띄우지 않으므로 플레이 세션·랭킹 기록이 생기지 않는다.
  function check(label, opts) {
    return fetch('/games/lib/touch.js', opts)
      .then(function (r) { return r.text().then(function (t) { return { s: r.status, t: t }; }); })
      .then(function (r) {
        var top = r.t.indexOf('flex-start') >= 0 && r.t.indexOf('safe center') < 0;
        var rest = /opacity:\.5;transition:opacity \.12s/.test(r.t);
        put('ver', label, 'HTTP ' + r.s + ' · ' + r.t.length + 'B · ' +
          (top ? '상단정렬 O' : '상단정렬 X(구버전)') + ' · ' +
          (rest ? '조이스틱 상시노출 O' : '조이스틱 상시노출 X(구버전)'),
          top && rest ? 'ok' : 'bad');
      })
      .catch(function (e) { put('ver', label, 'FAIL ' + e); });
  }

  check('브라우저 캐시 그대로', {})
    .then(function () { return check('캐시 무시(no-store)', { cache: 'no-store' }); })
    .then(function () {
      var b = document.createElement('button');
      b.id = 'copy';
      b.textContent = '결과 전부 복사';
      b.onclick = function () {
        if (navigator.clipboard) navigator.clipboard.writeText(rows.join('\n'));
        b.textContent = '복사됨 — 붙여넣어 주세요';
      };
      root.appendChild(b);
    });

  var mark = document.createElement('div');
  mark.id = 'bottomMark';
  mark.textContent = '↓ 여기가 화면 맨 아래 ↓';
  document.body.appendChild(mark);
  function syncMark() {
    if (vv) mark.style.top = Math.round(vv.offsetTop + vv.height - 30) + 'px';
    else mark.style.bottom = '0';
  }
  syncMark();
  if (vv) { vv.addEventListener('resize', syncMark); vv.addEventListener('scroll', syncMark); }
  addEventListener('resize', syncMark);
})();
</script>
</body>
</html>
