<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">태엽 포탑</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0f0d14; color:#e6e0f0; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #2c2440; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.7); }
  canvas { display:block; background:#1c1826; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:12px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(10,8,16,.65); padding:3px 10px; border-radius:10px; }
  #hud .grow { flex:1; }
  #bar { position:absolute; left:0; right:0; bottom:0; display:flex; gap:6px; padding:7px 9px; background:rgba(10,8,16,.9);
         font-size:11px; align-items:center; flex-wrap:wrap; }
  #bar button { background:#2c2440; color:#e6e0f0; border:1px solid #453a63; padding:6px 10px; border-radius:6px;
                cursor:pointer; font-family:inherit; font-size:11px; font-weight:bold; }
  #bar button.on { background:#b08fd6; color:#1a1226; border-color:#d6bcf0; }
  #bar button:disabled { opacity:.35; cursor:default; }
  #banner { position:absolute; top:40%; left:0; right:0; text-align:center; font-size:26px; font-weight:bold;
            color:#d6bcf0; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .3s; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(12,10,18,.96); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:12px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#d6bcf0; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#c2bad4; line-height:1.75; max-width:520px; }
  .panel button { background:#b08fd6; color:#1a1226; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#2c2440; color:#e6e0f0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #saveStatus { font-size:10.5px; color:#8a83a0; }
  #info { margin-top:9px; font-size:11px; color:#665f78; text-align:center; line-height:1.7; }
  input { background:#171320; border:1px solid #2c2440; color:#e6e0f0; border-radius:6px; padding:6px 9px;
          font-family:inherit; font-size:12px; letter-spacing:1px; width:165px; text-transform:uppercase; }

  /* 모바일 — 캔버스를 화면 폭에 맞추고 오버레이 UI 를 키운다 */
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width: 100vw; max-width: 100vw; border-width: 0; border-radius: 0; }
    canvas { width: 100%; height: auto; }
    #info { display: none; }
    #bar button, .panel button { padding: 10px 14px; font-size: 13px; }
  }
</style>
<script src="../lib/i18n.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="840" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="goldTxt"></span>
    <span class="tag" id="waveTxt"></span>
    <span class="grow"></span>
    <span class="tag" id="lifeTxt"></span>
  </div>
  <div id="banner"></div>
  <div id="bar" hidden>
    <button id="tBolt"></button>
    <button id="tCannon"></button>
    <button id="tFrost"></button>
    <button id="tSpark"></button>
    <span style="flex:1"></span>
    <span id="selInfo" style="font-size:10.5px;color:#c2bad4"></span>
    <button id="upBtn" hidden></button>
    <button id="sellBtn" hidden></button>
    <button id="waveBtn"></button>
  </div>
  <div class="panel" id="menu">
    <h1 data-i18n="menu.title">⚙ 태엽 포탑</h1>
    <p><span data-i18n="menu.d1">태엽 골렘 군단이 정해진 길을 따라 요새로 행진한다. 길가에 </span><b data-i18n="menu.d2">포탑을 세워</b><span data-i18n="menu.d3"> 통과를 막아라.
       </span><b data-i18n="menu.d4">비행 골렘은 길을 무시하고 직선으로</b><span data-i18n="menu.d5"> 날아온다 — 대공이 되는 포탑을 섞어야 한다. </span><b data-i18n="menu.d6">25웨이브</b><span data-i18n="menu.d7">를 막으면 승리.</span></p>
    <p style="font-size:11px" data-i18n="menu.tips">🔩 볼트: 빠른 단발(대공 O) · 💣 캐넌: 범위 폭발(대공 X) · ❄ 서리: 감속(대공 O) · ⚡ 스파크: 3연쇄(대공 O)</p>
    <div id="saveStatus"></div>
    <div class="row">
      <input id="codeInput" placeholder="이어하기 코드" data-i18n-ph="ph.code" maxlength="18" autocomplete="off">
      <button id="codeLoadBtn" class="ghost" data-i18n="btn.codeLoad">🔑 코드로 불러오기</button>
    </div>
    <div class="row"><span id="codeShow" style="font-size:11px;color:#d6bcf0;letter-spacing:2px"></span></div>
    <div class="row"><span id="bestTxt" style="font-size:12px;color:#8a83a0"></span></div>
    <button id="startBtn" data-i18n="btn.start">▶ 방어 시작</button>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <button id="backBtn" data-i18n="btn.back">처음으로</button>
  </div>
</div>
<div id="info" data-i18n="info">포탑 종류 선택 후 빈 칸 클릭 → 건설 · 지은 포탑 클릭 → 강화/판매 · 골렘이 끝까지 가면 생명 -1 (거대 골렘 -5)</div>

    't.spark': '스파크',
    'up.bolt': '공 {d} · 연사 {r}s',

  },
  en: {
    'title': 'Gear Bastion',
    'menu.title': '⚙ Gear Bastion',
    'menu.d1': 'A legion of clockwork golems marches along a fixed path toward the fortress. ',

    'menu.d3': ' and stop them. ',
    'menu.d4': 'Flying golems ignore the path and cut straight across',

    'menu.tips': '🔩 Bolt: fast single shot (anti-air) · 💣 Cannon: splash blast (ground only) · ❄ Frost: slows (anti-air) · ⚡ Spark: 3-target chain (anti-air)',

    'btn.codeLoad': '🔑 Load by code',
    'btn.start': '▶ Start defense',
    'btn.back': 'Back to menu',
    'info': 'Pick a turret, click an empty tile → build · Click a built turret → upgrade/sell · A golem reaching the end costs 1 life (colossus 5)',
    'save.server': '☁ Server save (v{n})',
    'save.fail': 'Save load failed: {n}',
    'save.local': 'Browser save — saving issues a continue code',
    'best': 'Best: wave {n}',
    't.bolt': 'Bolt',
    't.cannon': 'Cannon',
    't.frost': 'Frost',
    't.spark': 'Spark',
    'up.bolt': 'ATK {d} · rate {r}s',
    'up.cannon': 'ATK {d} · radius {r}',
    'up.frost': 'Range {r} · slow {s}% · {t}s',
    'up.spark': 'ATK {d} · chain {c}',
    'foe.crawler': 'Crawler',
    'foe.swift': 'Sprinter',
    'foe.husk': 'Husk',
    'foe.wing': 'Winged',
    'foe.colossus': 'Colossus',
    'wave.start': 'Wave {n}',

    'wave.clear': 'Wave cleared! +${n}',
    'map.exit': 'Fortress →',
    'hud.prep': '⏳ Wave {n} in {s}s',
    'hud.wave': '⚙ Wave {n}/{m} — golems left {c}',
    'btn.up': '⬆ Upgrade ${c}',
    'btn.sell': 'Sell +${c}',
    'btn.waveNow': '▶ Summon now +$12',
    'btn.waveOn': '⚙ In combat',
    'banner.start': 'Line the path with turrets!',
    'end.win': '🏆 Fortress held!',
    'end.lose': '💥 Fortress overrun…',
    'end.winDesc': 'You stopped all 25 waves!',
    'end.loseDesc': 'The line broke on wave {n}.',
    'end.best': ' Best: wave {n}',
    'end.clears': ' · {n} clears',
    'rank.applied': ' 🏆 Rank #{n}!',
  },
});
const TR = GameI18n.t;
const API = '/api/v1/games/gear-bastion';
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = cv.width, VH = cv.height, T = 40, COLS = 21, ROWS = 12;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random();

/* ── 플랫폼 연동 (이어하기 코드 세이브) ── */
const token = () => localStorage.getItem('portal_access_token');
function deviceId() {
  let id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
async function api(path, opt = {}) {
  const headers = { 'Content-Type':'application/json', 'X-Device-Id':deviceId(), ...(opt.headers || {}) };
  const tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
  const res = await fetch(API + path, { ...opt, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.success === false) throw new Error(body?.error?.code || res.status);
  return body.data;
}
const CODE_KEY = 'gear_bastion_code', LOCAL_KEY = 'gear_bastion_save';
let saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
const fmtCode = c => c ? c.replace(/(.{4})(?=.)/g, '$1-') : '';
let meta = { best: 0, clears: 0 };
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }
async function loadMeta(codeOverride) {
  const code = codeOverride || saveCode;
  if (token() || code) {
    try {
      const s = await api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''));
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (s.data) meta = { best:0, clears:0, ...s.data };
      $('saveStatus').textContent = TR('save.server').replace('{n}', saveVersion);
      showCode(); return true;
    } catch (e) { $('saveStatus').textContent = TR('save.fail').replace('{n}', e.message); if (codeOverride) return false; }
  }
  try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d) meta = { ...meta, ...d }; } catch (_) {}
  $('saveStatus').textContent = TR('save.local');
  showCode(); return true;
}
async function persistMeta() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(meta));
  try {
    const s = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
    saveVersion = s.version;
    if (s.code && s.code !== saveCode) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
    showCode();
  } catch (e) {
    if (e.message === 'INVALID_INPUT') {
      try {
        const re = await api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''));
        saveVersion = re.version;
        const s2 = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
        saveVersion = s2.version;
      } catch (_) {}
    }
  }
}

/* ── 경로 ── */
const WAYPOINTS = [[-1,2],[17,2],[17,5],[3,5],[3,9],[21,9]];   // 타일 좌표
const pathTiles = new Set();
for (let i = 1; i < WAYPOINTS.length; i++) {
  const [ax, ay] = WAYPOINTS[i-1], [bx, by] = WAYPOINTS[i];
  for (let x = Math.min(ax,bx); x <= Math.max(ax,bx); x++)
    for (let y = Math.min(ay,by); y <= Math.max(ay,by); y++)
      if (x >= 0 && x < COLS && y >= 0 && y < ROWS) pathTiles.add(x + ',' + y);
}
const wpPix = WAYPOINTS.map(([x, y]) => ({ x: x * T + T/2, y: y * T + T/2 }));

/* ── 포탑 정의 ── */
/**
 * 강화(★)는 포탑마다 다른 축이 자란다:
 *   볼트 = 공격력 + 연사속도 · 캐넌 = 공격력 + 폭발 반경 · 서리 = 사거리 + 감속 강도/지속 · 스파크 = 연쇄 수
 */
const TURRETS = {
  bolt:   { name:TR('t.bolt'),   emoji:'🔩', cost:70,  dmg:8,  rate:0.45, range:130, air:true,  color:'#8fb8d6',
            up: lv => ({ dmg: 8 * Math.pow(1.45, lv), rate: 0.45 * Math.pow(0.86, lv) }),
            upDesc: lv => TR('up.bolt').replace('{d}', Math.round(8 * Math.pow(1.45, lv))).replace('{r}', (0.45 * Math.pow(0.86, lv)).toFixed(2)) },
  cannon: { name:TR('t.cannon'), emoji:'💣', cost:120, dmg:24, rate:1.35, range:140, air:false, splash:55, color:'#d69a5a',
            up: lv => ({ dmg: 24 * Math.pow(1.5, lv), splash: 55 + lv * 16 }),
            upDesc: lv => TR('up.cannon').replace('{d}', Math.round(24 * Math.pow(1.5, lv))).replace('{r}', 55 + lv * 16) },
  frost:  { name:TR('t.frost'),  emoji:'❄',  cost:90,  dmg:4,  rate:0.8,  range:125, air:true,  slow:0.45, slowT:1.6, color:'#9adcf0',
            up: lv => ({ dmg: 4 + lv, range: 125 * (1 + lv * 0.22), slowMul: 0.55 - lv * 0.07, slowT: 1.6 + lv * 0.5 }),
            upDesc: lv => TR('up.frost').replace('{r}', Math.round(125 * (1 + lv * 0.22))).replace('{s}', Math.round((1 - (0.55 - lv * 0.07)) * 100)).replace('{t}', (1.6 + lv * 0.5).toFixed(1)) },
  spark:  { name:TR('t.spark'),  emoji:'⚡', cost:140, dmg:13, rate:0.9,  range:130, air:true,  chain:3, color:'#f0e08a',
            up: lv => ({ dmg: 13 * Math.pow(1.25, lv), chain: 3 + lv }),
            upDesc: lv => TR('up.spark').replace('{d}', Math.round(13 * Math.pow(1.25, lv))).replace('{c}', 3 + lv) },
};
const turretStat = t => ({ ...TURRETS[t.kind], ...TURRETS[t.kind].up(t.lv) });
const FOES = {
  crawler:  { name:TR('foe.crawler'),  hp:30, spd:68,  bounty:6,  r:12, color:'#8a7a5c' },
  swift:    { name:TR('foe.swift'),    hp:19, spd:122, bounty:7,  r:10, color:'#6ab88a' },
  husk:     { name:TR('foe.husk'),     hp:95, spd:44,  bounty:14, r:15, color:'#7a6a8c' },
  wing:     { name:TR('foe.wing'),     hp:42, spd:82,  bounty:12, r:11, color:'#b58fd6', air:true },
  colossus: { name:TR('foe.colossus'), hp:750, spd:32, bounty:120, r:20, color:'#c25a3a' },
};
const MAX_WAVE = 25;
/* ── 골렘 픽셀 스프라이트 ── */
const SPR = new Map();
function spr(key, w, h, paint) {
  let c = SPR.get(key); if (c) return c;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d')); SPR.set(key, c); return c;
}
const px = (g, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
const shade2 = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, v + amt)));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
};
function golemSprite(kind) {
  const d = FOES[kind];
  return spr('g' + kind, 32, 32, g => {
    const body = d.color, dark = shade2(body, -40), light = shade2(body, 36);
    px(g, 7, 29, 18, 3, 'rgba(0,0,0,.35)');
    if (kind === 'wing') {
      px(g, 3, 8, 9, 6, light); px(g, 20, 8, 9, 6, light);                  // 날개
      px(g, 5, 12, 7, 4, shade2(body, 12)); px(g, 20, 12, 7, 4, shade2(body, 12));
      px(g, 10, 8, 12, 12, body); px(g, 10, 8, 12, 3, light);
      px(g, 13, 12, 2, 3, '#ffe08a'); px(g, 18, 12, 2, 3, '#ffe08a');
      px(g, 12, 20, 3, 4, dark); px(g, 17, 20, 3, 4, dark);
    } else if (kind === 'colossus') {
      px(g, 5, 1, 22, 15, body); px(g, 5, 1, 22, 4, light);
      px(g, 9, 6, 5, 5, '#ffd54a'); px(g, 19, 6, 5, 5, '#ffd54a');
      px(g, 11, 8, 2, 2, '#1b0e0a'); px(g, 21, 8, 2, 2, '#1b0e0a');
      px(g, 3, 16, 26, 10, dark); px(g, 7, 18, 18, 3, shade2(body, -12));
      px(g, 1, 6, 5, 14, body); px(g, 26, 6, 5, 14, body);                  // 팔
      px(g, 6, 26, 8, 5, dark); px(g, 18, 26, 8, 5, dark);
      px(g, 14, 2, 4, 3, '#66e0ff');                                        // 코어
    } else {
      const w2 = kind === 'husk' ? 20 : kind === 'swift' ? 12 : 16;
      const x0 = (32 - w2) / 2;
      px(g, x0, 6, w2, 16, body); px(g, x0, 6, w2, 4, light); px(g, x0, 18, w2, 4, dark);
      px(g, x0 + 2, 11, 2, 3, '#ffe08a'); px(g, x0 + w2 - 4, 11, 2, 3, '#ffe08a');
      // 리벳
      px(g, x0 + 1, 8, 1, 1, dark); px(g, x0 + w2 - 2, 8, 1, 1, dark);
      px(g, x0 + 1, 16, 1, 1, light); px(g, x0 + w2 - 2, 16, 1, 1, light);
      if (kind === 'husk') { px(g, x0 - 3, 9, 4, 10, shade2(body, -20)); px(g, x0 + w2 - 1, 9, 4, 10, shade2(body, -20)); }
      px(g, x0 + 2, 22, 4, 6, dark); px(g, x0 + w2 - 6, 22, 4, 6, dark);
      if (kind === 'swift') { px(g, x0 + 2, 28, 4, 2, light); px(g, x0 + w2 - 6, 28, 4, 2, light); }
    }
  });
}
let G = null, running = false, buildKind = 'bolt', selected = null;
let bannerT = 0, shake = 0;

function newGame() {
  G = { gold: 200, lives: 20, wave: 0, phase:'prep', prepT: 6,
    turrets: [], foes: [], shots: [], parts: [], spawnQueue: [], spawnT: 0 };
}
function banner(text) { $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1600; }
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, s = spd * (0.4 + rnd() * 0.8);
    G.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color, size:2 + rnd()*3 });
  }
}
function popText(x, y, text, color) { G.parts.push({ x, y, vx:0, vy:-28, life:1, text, color }); }

function startWave() {
  G.wave++; G.phase = 'wave';
  const w = G.wave, q = [];
  const n = 9 + w * 3;
  for (let i = 0; i < n; i++) {
    let kind = 'crawler';
    const r = rnd();
    if (w >= 3 && r < 0.25) kind = 'swift';
    else if (w >= 5 && r < 0.42) kind = 'husk';
    else if (w >= 7 && r < 0.58) kind = 'wing';
    q.push(kind);
  }
  if (w % 5 === 0) q.push('colossus');
  G.spawnQueue = q; G.spawnT = 0;
  banner(TR('wave.start').replace('{n}', w) + (w % 5 === 0 ? TR('wave.boss') : ''));
}
function spawnFoe(kind) {
  const d = FOES[kind], sc = 1 + (G.wave - 1) * 0.24;
  const f = { kind, hp: Math.round(d.hp * sc), maxHp: Math.round(d.hp * sc), spd: d.spd, baseSpd: d.spd,
    bounty: d.bounty, r: d.r, air: !!d.air, wp: 1, slowT: 0, hurt: 0 };
  if (f.air) { f.x = -14; f.y = 40 + rnd() * (VH - 120); }     // 비행 — 출구로 직선
  else { f.x = wpPix[0].x; f.y = wpPix[0].y; }
  G.foes.push(f);
}

/* ── 갱신 ── */
function update(dt) {
  if (G.phase === 'prep') { G.prepT -= dt; if (G.prepT <= 0) startWave(); }
  else if (G.spawnQueue.length) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) { G.spawnT = 0.5; spawnFoe(G.spawnQueue.shift()); }
  } else if (!G.foes.length) {
    const bonus = 24 + G.wave * 6;
    G.gold += bonus; popText(VW/2, 200, TR('wave.clear').replace('{n}', bonus), '#d6bcf0');
    if (G.wave >= MAX_WAVE) { endGame(true); return; }
    G.phase = 'prep'; G.prepT = 8;
  }
  // 골렘 이동
  for (const f of [...G.foes]) {
    f.hurt = Math.max(0, f.hurt - dt);
    if (f.slowT > 0) { f.slowT -= dt; f.spd = f.baseSpd * (f.slowMul || 0.55); } else f.spd = f.baseSpd;
    let target;
    if (f.air) target = { x: VW + 20, y: wpPix[wpPix.length-1].y };
    else target = wpPix[f.wp];
    const dx = target.x - f.x, dy = target.y - f.y, d = Math.hypot(dx, dy) || 1;
    f.x += dx / d * f.spd * dt; f.y += dy / d * f.spd * dt;
    if (!f.air && d < 6) { f.wp++; if (f.wp >= wpPix.length) leak(f); }
    else if (f.air && f.x > VW + 10) leak(f);
  }
  // 포탑 사격
  for (const t of G.turrets) {
    t.cd -= dt;
    if (t.cd > 0) continue;
    const st = turretStat(t);
    const range = st.range;
    let best = null, bd = range * range, bestProg = -1;
    for (const f of G.foes) {
      if (f.air && !def.air) continue;
      const q = (f.x - t.x) ** 2 + (f.y - t.y) ** 2;
      if (q > bd) continue;
      const prog = f.air ? f.x : f.wp * 1000 - Math.hypot(wpPix[f.wp].x - f.x, wpPix[f.wp].y - f.y);
      if (prog > bestProg) { bestProg = prog; best = f; }
    }
    if (best) {
      t.cd = st.rate;
      t.angle = Math.atan2(best.y - t.y, best.x - t.x);
      G.shots.push({ x:t.x, y:t.y, target:best, spd:460, dmg: Math.round(st.dmg), kind:t.kind, def: st });
    }
  }
  // 탄 — 유도
  for (const s of [...G.shots]) {
    if (!G.foes.includes(s.target)) { G.shots = G.shots.filter(o => o !== s); continue; }
    const dx = s.target.x - s.x, dy = s.target.y - s.y, d = Math.hypot(dx, dy) || 1;
    if (d < 10) {
      G.shots = G.shots.filter(o => o !== s);
      hitFoe(s.target, s.dmg, s.def);
      if (s.def.splash) for (const f of [...G.foes]) {
        if (f !== s.target && !f.air && (f.x - s.target.x) ** 2 + (f.y - s.target.y) ** 2 < s.def.splash ** 2)
          hitFoe(f, Math.round(s.dmg * 0.6), s.def);
      }
      if (s.def.chain) {
        let from = s.target, hit = new Set([s.target]);
        for (let i = 1; i < s.def.chain; i++) {
          let next = null, nd = 90 * 90;
          for (const f of G.foes) { if (hit.has(f)) continue;
            const q = (f.x - from.x) ** 2 + (f.y - from.y) ** 2; if (q < nd) { nd = q; next = f; } }
          if (!next) break;
          hit.add(next);
          G.parts.push({ x:from.x, y:from.y, vx:0, vy:0, life:0.4, bolt:{ tx:next.x, ty:next.y }, color:'#f0e08a' });
          hitFoe(next, Math.round(s.dmg * 0.7), s.def);
          from = next;
        }
      }
      continue;
    }
    s.x += dx / d * s.spd * dt; s.y += dy / d * s.spd * dt;
  }
  for (const q of [...G.parts]) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.text || q.bolt ? 0 : 170) * dt;
    q.life -= dt * (q.text ? 1.05 : q.bolt ? 2.4 : 1.9);
    if (q.life <= 0) G.parts = G.parts.filter(o => o !== q);
  }
  shake = Math.max(0, shake - dt * 30);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}
function hitFoe(f, dmg, def) {
  f.hp -= dmg; f.hurt = 0.14;
  if (def.slow) { f.slowT = def.slowT; f.slowMul = def.slowMul || 0.55; }
  if (f.hp <= 0 && G.foes.includes(f)) {
    G.gold += f.bounty;
    burst(f.x, f.y, FOES[f.kind].color, 10, 130);
    popText(f.x, f.y - 14, '+' + f.bounty, '#d6bcf0');
    G.foes = G.foes.filter(o => o !== f);
  }
}
function leak(f) {
  G.foes = G.foes.filter(o => o !== f);
  const cost = f.kind === 'colossus' ? 5 : 1;
  G.lives -= cost; shake = 8;
  popText(VW - 60, f.y, '-' + cost + ' ❤', '#ff6b6b');
  if (G.lives <= 0) { G.lives = 0; endGame(false); }
}

/* ── 렌더 ── */
function draw() {
  const sx = shake ? (rnd() - 0.5) * shake : 0, sy = shake ? (rnd() - 0.5) * shake : 0;
  cx.save(); cx.translate(sx, sy);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const isPath = pathTiles.has(x + ',' + y);
    cx.fillStyle = isPath ? '#3c3450' : ((x + y) & 1) ? '#211c2e' : '#251f33';
    cx.fillRect(x * T, y * T, T, T);
    if (isPath) { cx.fillStyle = 'rgba(214,188,240,.07)'; cx.fillRect(x * T + 3, y * T + 3, T - 6, T - 6); }
  }
  // 출구
  cx.fillStyle = '#b08fd6'; cx.fillRect(VW - 8, 9 * T, 8, T);
  cx.font = 'bold 11px monospace'; cx.textAlign = 'center'; cx.fillStyle = '#d6bcf0';
  cx.fillText(TR('map.exit'), VW - 34, 9 * T - 6);
  // 포탑
  for (const t of G.turrets) {
    const def = TURRETS[t.kind];
    if (t === selected) {
      cx.strokeStyle = 'rgba(214,188,240,.4)'; cx.lineWidth = 1.5;
      cx.beginPath(); cx.arc(t.x, t.y, turretStat(t).range, 0, 7); cx.stroke();
    }
    cx.fillStyle = '#3c3450'; cx.fillRect(t.x - 15, t.y - 15, 30, 30);
    cx.fillStyle = def.color; cx.fillRect(t.x - 11, t.y - 11, 22, 22);
    cx.save(); cx.translate(t.x, t.y); cx.rotate(t.angle || 0);
    cx.fillStyle = '#1c1826'; cx.fillRect(0, -3, 16, 6);
    cx.restore();
    cx.font = '13px monospace'; cx.textAlign = 'center'; cx.fillStyle = '#1c1826';
    cx.fillText(def.emoji, t.x, t.y + 1);
    if (t.lv) { cx.font = 'bold 9px monospace'; cx.fillStyle = '#ffd98a'; cx.fillText('★'.repeat(t.lv), t.x, t.y - 18); }
  }
  // 골렘
  for (const f of G.foes) {
    cx.save(); if (f.hurt > 0) cx.filter = 'brightness(2.3)';
    const sc2 = f.kind === 'colossus' ? 1.7 : 1;
    const bobY = f.air ? Math.sin(performance.now() / 180 + f.x) * 3 : 0;
    cx.drawImage(golemSprite(f.kind), f.x - 16 * sc2, f.y - 17 * sc2 + bobY, 32 * sc2, 32 * sc2);
    if (f.slowT > 0) { cx.fillStyle = 'rgba(154,220,240,.4)'; cx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2); }
    cx.restore();
    if (f.hp < f.maxHp) {
      const w = f.kind === 'colossus' ? 56 : 24;
      cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(f.x - w/2, f.y - f.r - 9, w, 4);
      cx.fillStyle = '#e05c4a'; cx.fillRect(f.x - w/2, f.y - f.r - 9, w * (f.hp / f.maxHp), 4);
    }
  }
  // 탄 / 파티클
  for (const s of G.shots) { cx.fillStyle = s.def.color; cx.beginPath(); cx.arc(s.x, s.y, 4, 0, 7); cx.fill(); }
  for (const q of G.parts) {
    cx.globalAlpha = clamp(q.life, 0, 1);
    if (q.bolt) { cx.strokeStyle = q.color; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(q.x, q.y); cx.lineTo(q.bolt.tx, q.bolt.ty); cx.stroke(); }
    else if (q.text) { cx.font = 'bold 12px monospace'; cx.textAlign = 'center'; cx.fillStyle = q.color; cx.fillText(q.text, q.x, q.y); }
    else { cx.fillStyle = q.color; cx.fillRect(q.x, q.y, q.size, q.size); }
    cx.globalAlpha = 1;
  }
  cx.restore();
  // HUD
  $('goldTxt').textContent = '💰 ' + Math.floor(G.gold) + '$';
  $('waveTxt').textContent = G.phase === 'prep'
    ? TR('hud.prep').replace('{n}', G.wave + 1).replace('{s}', Math.ceil(G.prepT))
    : TR('hud.wave').replace('{n}', G.wave).replace('{m}', MAX_WAVE).replace('{c}', G.foes.length + G.spawnQueue.length);
  $('lifeTxt').textContent = '❤ ' + G.lives;
  Object.entries(TURRETS).forEach(([k, d]) => {
    const b = $('t' + k[0].toUpperCase() + k.slice(1));
    b.textContent = d.emoji + ' ' + d.name + ' ' + d.cost + '$';
    b.classList.toggle('on', buildKind === k && !selected);
    b.disabled = G.gold < d.cost;
  });
  if (selected) {
    const def = TURRETS[selected.kind];
    const upCost = Math.round(def.cost * 0.7 * (selected.lv + 1));
    $('selInfo').textContent = def.emoji + ' ' + def.name + ' ★' + selected.lv +
      ' · ' + def.upDesc(selected.lv) + (selected.lv < 3 ? '  →  ' + def.upDesc(selected.lv + 1) : '');
    $('upBtn').hidden = false; $('sellBtn').hidden = false;
    $('upBtn').textContent = selected.lv >= 3 ? 'MAX' : TR('btn.up').replace('{c}', upCost);
    $('upBtn').disabled = selected.lv >= 3 || G.gold < upCost;
    $('sellBtn').textContent = TR('btn.sell').replace('{c}', sellValue(selected));
  } else { $('selInfo').textContent = ''; $('upBtn').hidden = true; $('sellBtn').hidden = true; }
  $('waveBtn').textContent = G.phase === 'prep' ? TR('btn.waveNow') : TR('btn.waveOn');
  $('waveBtn').disabled = G.phase !== 'prep';
}
const sellValue = t => Math.round(TURRETS[t.kind].cost * 0.7 * (1 + t.lv * 0.6));

/* ── 입력 ── */
Object.keys(TURRETS).forEach(k => {
  $('t' + k[0].toUpperCase() + k.slice(1)).onclick = () => { buildKind = k; selected = null; };
});
$('upBtn').onclick = () => {
  if (!selected || selected.lv >= 3) return;
  const cost = Math.round(TURRETS[selected.kind].cost * 0.7 * (selected.lv + 1));
  if (G.gold < cost) return;
  G.gold -= cost; selected.lv++;
};
$('sellBtn').onclick = () => {
  if (!selected) return;
  G.gold += sellValue(selected);
  G.turrets = G.turrets.filter(t => t !== selected);
  selected = null;
};
$('waveBtn').onclick = () => { if (G.phase === 'prep') { G.gold += 12; G.prepT = 0; } };
cv.addEventListener('click', ev => {
  if (!running) return;
  const r = cv.getBoundingClientRect();
  const mx = (ev.clientX - r.left) * (VW / r.width), my = (ev.clientY - r.top) * (VH / r.height);
  const gx = Math.floor(mx / T), gy = Math.floor(my / T);
  const hit = G.turrets.find(t => Math.abs(t.x - mx) < 18 && Math.abs(t.y - my) < 18);
  if (hit) { selected = hit; return; }
  selected = null;
  if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return;
  if (pathTiles.has(gx + ',' + gy)) return;
  if (G.turrets.some(t => t.gx === gx && t.gy === gy)) return;
  const def = TURRETS[buildKind];
  if (G.gold < def.cost) return;
  G.gold -= def.cost;
  G.turrets.push({ kind:buildKind, gx, gy, x: gx * T + T/2, y: gy * T + T/2, lv:0, cd:0, angle:0 });
  burst(gx * T + T/2, gy * T + T/2, def.color, 8, 90);
});

/* ── 시작/종료 ── */
function startGame() {
  newGame(); running = true; selected = null;
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false; $('bar').hidden = false;
  banner(TR('banner.start'));
}
async function endGame(win) {
  running = false; $('hud').hidden = true; $('bar').hidden = true;
  meta.best = Math.max(meta.best, G.wave);
  if (win) meta.clears = (meta.clears || 0) + 1;
  GameRank.submit('gear-bastion', G.wave * 1000 + (win ? 500 : 0), '웨이브 ' + G.wave + (win ? ' 클리어' : ''))
    .then(r => { if (r && r.applied) $('endDesc').textContent += TR('rank.applied').replace('{n}', r.rank); });
  $('endTitle').textContent = win ? TR('end.win') : TR('end.lose');
  $('endDesc').textContent = (win ? TR('end.winDesc') : TR('end.loseDesc').replace('{n}', G.wave)) +
    TR('end.best').replace('{n}', meta.best) + (meta.clears ? TR('end.clears').replace('{n}', meta.clears) : '');
  $('endPanel').hidden = false;
  await persistMeta();
}
let last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!running || !G) return;
  update(dt);
  if (running && G) draw();
}
requestAnimationFrame(loop);
$('startBtn').onclick = startGame;
$('backBtn').onclick = () => { $('endPanel').hidden = true; $('menu').hidden = false;
  $('bestTxt').textContent = meta.best ? TR('best').replace('{n}', meta.best) : ''; };
$('codeLoadBtn').onclick = async () => {
  const raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  if (await loadMeta(raw)) { saveCode = raw; localStorage.setItem(CODE_KEY, raw);
    $('bestTxt').textContent = meta.best ? TR('best').replace('{n}', meta.best) : ''; showCode(); }
};
loadMeta().then(() => { $('bestTxt').textContent = meta.best ? TR('best').replace('{n}', meta.best) : ''; });
</script>
<script src="../lib/rank.js"></script>
<script>
GameRank.autoPanel('gear-bastion');
GameRank.copyButton(function(){ return typeof saveCode !== 'undefined' ? saveCode : null; });
</script>
