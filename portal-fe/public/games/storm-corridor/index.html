<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뇌우 회랑</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#05070f; color:#dce4f5; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1a2140; border-radius:10px; overflow:hidden; box-shadow:0 0 52px rgba(20,40,110,.5); }
  canvas { display:block; background:#080b16; max-width:100%; touch-action:none; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:13px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(8,12,26,.62); padding:3px 11px; border-radius:10px; }
  #hud .grow { flex:1; }
  #banner { position:absolute; top:38%; left:0; right:0; text-align:center; font-size:30px; font-weight:bold;
            color:#8fd8ff; text-shadow:0 0 18px rgba(90,180,255,.8), 3px 3px 0 #000; pointer-events:none;
            opacity:0; transition:opacity .25s; letter-spacing:2px; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(6,9,20,.94); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:11px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#8fd8ff; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#b6c2dc; line-height:1.75; max-width:500px; }
  .panel button { background:#4a7ad6; color:#06101f; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1a2140; color:#dce4f5; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #info { margin-top:9px; font-size:11px; color:#5a688a; text-align:center; line-height:1.7; }
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width:100vw; max-width:100vw; border-width:0; border-radius:0; }
    canvas { width:100%; height:auto; }
    #info { display:none; }
    .panel button { padding:10px 16px; font-size:13px; }
  }
</style>
<link rel="stylesheet" href="../lib/menu.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="860" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="shieldTxt"></span>
    <span class="tag" id="phaseTxt"></span>
    <span class="grow"></span>
    <span class="tag" id="timeTxt"></span>
  </div>
  <div id="banner"></div>
  <div class="panel" id="menu">
    <h1 data-i18n="menuTitle">⚡ 뇌우 회랑</h1>
    <p><b data-i18n="menuLead">방향키 / WASD 로 8방향 이동 — 회랑을 채우는 뇌격 탄막을 피하라.</b>
       <span data-i18n="menuDesc">실드는 3개다.</span></p>
    <div class="row"><span id="bestTxt" style="font-size:12px;color:#7c8ab0"></span></div>
    <button id="startBtn" data-i18n="startBtn">▶ 회랑 진입</button>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <div class="row">
      <button id="againBtn" data-i18n="againBtn">🔁 재도전</button>
      <button id="backBtn" class="ghost" data-i18n="backBtn">처음으로</button>
    </div>
  </div>
</div>
<div id="info" data-i18n="info">이동: 방향키 / WASD · 붉은 경고선 뒤엔 레이저 · 호박색 구체는 끝까지 쫓아온다</div>
<script>
'use strict';

GameI18n.init({
  ko: {
    gameTitle: '뇌우 회랑',
    menuTitle: '⚡ 뇌우 회랑',
    menuLead: '방향키 / WASD 로 8방향 이동 — 회랑을 채우는 뇌격 탄막을 피하라.',
    menuDesc: '실드는 3개. 맞으면 하나가 깨지고 1.5초 무적으로 점멸한다. 실드 없이 맞으면 그대로 소멸. ' +
              '20초마다 폭풍이 한 단계 거세지고(페이즈 상승) 패턴이 겹치기 시작한다. ' +
              '가끔 떨어지는 실드 조각을 주우면 최대 3개까지 회복된다.',
    startBtn: '▶ 회랑 진입',
    againBtn: '🔁 재도전',
    backBtn: '처음으로',
    info: '이동: 방향키 / WASD · 붉은 경고선 뒤엔 레이저 · 호박색 구체는 끝까지 쫓아온다',
    phase: '페이즈',
    phaseUp: '페이즈 {n}',
    shardGet: '실드 +1',
    endDead: '💀 회로 소멸…',
    endBest: '🏆 신기록!',
    endDesc: '{s}초 생존 · 페이즈 {p} → 점수 {v}',
    endBestSuffix: ' (이번 세션 최고 {b})',
    rankApplied: ' 🏆 랭킹 {n}위!',
    bestTxt: '이번 세션 최고 점수 {b}',
  },
  en: {
    gameTitle: 'Storm Corridor',
    menuTitle: '⚡ Storm Corridor',
    menuLead: 'Move in 8 directions with the arrow keys or WASD — dodge the lightning barrage flooding the corridor.',
    menuDesc: 'You carry 3 shields. A hit shatters one and leaves you blinking invulnerable for 1.5s. ' +
              'Take a hit with none left and you are gone. Every 20 seconds the storm climbs a phase and the ' +
              'patterns start stacking. Shield shards drop now and then — grab one to refill, up to 3.',
    startBtn: '▶ Enter the Corridor',
    againBtn: '🔁 Retry',
    backBtn: 'Main menu',
    info: 'Move: Arrows / WASD · A red warning line means a laser is next · Amber orbs hunt you down',
    phase: 'Phase',
    phaseUp: 'Phase {n}',
    shardGet: 'Shield +1',
    endDead: '💀 Circuit Lost…',
    endBest: '🏆 New Record!',
    endDesc: 'Survived {s}s · Phase {p} → Score {v}',
    endBestSuffix: ' (session best {b})',
    rankApplied: ' 🏆 Rank #{n}!',
    bestTxt: 'Session best {b}',
  },
});
var TR = GameI18n.t;
document.title = TR('gameTitle');

const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = cv.width, VH = cv.height;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random(), ri = n => Math.floor(Math.random() * n);
const d2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

const WALL = 30;                                   // 회랑 양옆 기둥 두께
const PR = 5;                                      // 피탄 반경 — 스프라이트보다 작다(탄막 관례)
const MINX = WALL + 11, MAXX = VW - WALL - 11, MINY = 17, MAXY = VH - 17;
const SPD = 196;
const PHASE_SEC = 20;
const OUT = '#070a14';                             // 픽셀 외곽선

/* ── 발광 스프라이트 — 탄환마다 그라데이션을 새로 만들지 않고 한 번만 굽는다 ── */
function glowSprite(core, glow, r) {
  const c = document.createElement('canvas'), s = Math.ceil(r * 4);
  c.width = c.height = s;
  const g = c.getContext('2d'), m = s / 2;
  const grad = g.createRadialGradient(m, m, 0, m, m, m);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.20, core);
  grad.addColorStop(0.48, glow);
  grad.addColorStop(1, 'rgba(8,11,22,0)');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  return c;
}
const BT = {
  straight: { hr: 5.2, sp: glowSprite('#a6ecff', 'rgba(60,150,255,.55)', 7) },
  aimed:    { hr: 5.2, sp: glowSprite('#ffb4e6', 'rgba(225,70,190,.55)', 7) },
  radial:   { hr: 4.8, sp: glowSprite('#cbb2ff', 'rgba(130,80,255,.55)', 6.4) },
};
const ORB_SPR = glowSprite('#ffd68a', 'rgba(255,140,40,.5)', 11);
const SHARD_SPR = glowSprite('#9dffd0', 'rgba(50,220,150,.5)', 9);
const CORE_SPR = glowSprite('#a8f4ff', 'rgba(60,180,255,.55)', 4);

/* ── 뇌수정 수호자 — [x, y, w, h, color], 외곽선은 실루엣 1패스로 먼저 깐다 ── */
const BODY = [
  [-1, -19, 2, 3, '#e2fcff'], [-2, -16, 4, 3, '#8ff4ff'], [-3, -13, 6, 3, '#5fd8f0'],   // 머리 위 수정 첨탑
  [-6, -10, 12, 7, '#8fa9f5'],                                                           // 투구
  [-4, -8, 8, 3, '#16203c'], [-4, -8, 8, 1, '#7ff0ff'],                                  // 바이저
  [-11, -3, 4, 5, '#6f8ee0'], [7, -3, 4, 5, '#6f8ee0'],                                  // 어깨
  [-10, 2, 3, 7, '#4a63ab'], [7, 2, 3, 7, '#4a63ab'],                                    // 팔
  [-7, -3, 14, 12, '#5f7fd8'],                                                           // 몸통
  [-7, -3, 3, 12, '#8fa9f5'], [4, -3, 3, 12, '#3d569a'],                                 // 좌 하이라이트 / 우 음영
  [-7, 7, 14, 2, '#2c3c72'],                                                             // 벨트
  [-3, 0, 6, 5, '#20356a'], [-2, 1, 4, 3, '#a8f4ff'],                                    // 가슴 코어
  [-6, 9, 4, 5, '#3d569a'], [2, 9, 4, 5, '#3d569a'],                                     // 다리
  [-7, 13, 5, 3, '#2c3c72'], [2, 13, 5, 3, '#2c3c72'],                                   // 발
];

let G = null, running = false, shake = 0, bannerT = 0, best = 0;

function newGame() {
  G = {
    px: VW / 2, py: VH - 90, vx: 0, time: 0, phase: 1, shield: 3, inv: 1.4, grace: 1.1,
    over: false, ended: false, dying: 0,
    bul: [], orbs: [], lasers: [], seeds: [], shards: [], parts: [], rings: [], floats: [],
    bolts: null, boltT: 0, flash: 0,
    tm: { straight: 0.7, aimed: 1.5, radial: 2.6, laser: 3.4, homing: 4.2, shard: 10 },
  };
}

/* ═══════════ 탄막 패턴 5종 ═══════════ */
function bullet(x, y, vx, vy, kind) { G.bul.push({ x, y, vx, vy, k: kind }); }

/** 화면 밖 가장자리의 한 점 + 안쪽을 향하는 단위 방향 */
function edgePoint() {
  const side = ri(4);
  if (side === 0) return { x: -22, y: 30 + rnd() * (VH - 60), dx: 1, dy: 0 };
  if (side === 1) return { x: VW + 22, y: 30 + rnd() * (VH - 60), dx: -1, dy: 0 };
  if (side === 2) return { x: 60 + rnd() * (VW - 120), y: -22, dx: 0, dy: 1 };
  return { x: 60 + rnd() * (VW - 120), y: VH + 22, dx: 0, dy: -1 };
}

/** ① 가장자리 직선탄 — 한 변에서 나란히 밀려온다 */
function patStraight(d) {
  const e = edgePoint(), n = 2 + Math.floor(d * 4), speed = 155 + d * 140;
  const ang = Math.atan2(e.dy, e.dx) + (rnd() - 0.5) * 0.22;
  const perpX = -e.dy, perpY = e.dx;
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * 36;
    bullet(e.x + perpX * off, e.y + perpY * off, Math.cos(ang) * speed, Math.sin(ang) * speed, 'straight');
  }
}

/** ② 조준탄 — 발사 시점의 플레이어를 노린다 */
function patAimed(d, ph) {
  const e = edgePoint(), n = 1 + Math.floor(ph / 3), speed = 205 + d * 130;
  const base = Math.atan2(G.py - e.y, G.px - e.x);
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * 0.13;
    bullet(e.x, e.y, Math.cos(a) * speed, Math.sin(a) * speed, 'aimed');
  }
}

/** ③ 원형 방사탄 — 씨앗이 0.45초 맥동한 뒤 사방으로 터진다 */
function patRadial(d) {
  let x = 0, y = 0;
  for (let k = 0; k < 12; k++) {
    x = 110 + rnd() * (VW - 220); y = 70 + rnd() * (VH - 140);
    if (d2(x, y, G.px, G.py) > 120 * 120) break;
  }
  G.seeds.push({ x, y, life: 0.45, n: 10 + Math.floor(d * 14), speed: 118 + rnd() * 30 + d * 90, off: rnd() * 6.283 });
}
function seedBurst(s) {
  for (let i = 0; i < s.n; i++) {
    const a = s.off + i / s.n * Math.PI * 2;
    bullet(s.x, s.y, Math.cos(a) * s.speed, Math.sin(a) * s.speed, 'radial');
  }
  G.rings.push({ x: s.x, y: s.y, r: 6, max: 70, life: 1, c: '160,110,255' });
  shake = Math.max(shake, 3);
}

/** ④ 경고선 → 레이저 기둥 */
function patLaser(d, ph) {
  const cnt = ph >= 5 ? 2 : 1;
  for (let i = 0; i < cnt; i++) {
    const vert = rnd() < 0.5;
    const pos = vert ? clamp(G.px + (rnd() - 0.5) * 200, WALL + 34, VW - WALL - 34)
                     : clamp(G.py + (rnd() - 0.5) * 180, 44, VH - 44);
    G.lasers.push({ vert, pos, life: 0, warn: 0.8, fire: 0.45, w: 26 + d * 14 });
  }
}

/** ⑤ 느린 유도 구체 */
function patHoming(d) {
  const e = edgePoint();
  G.orbs.push({ x: e.x, y: e.y, a: Math.atan2(G.py - e.y, G.px - e.x),
    speed: 76 + d * 44, turn: 1.3 + d * 0.55, life: 10, r: 9 });
}

function spawnShard() {
  G.shards.push({ x: MINX + 40 + rnd() * (MAXX - MINX - 80), y: 70 + rnd() * (VH - 140), life: 11, born: G.time });
}

/* ═══════════ 이펙트 ═══════════ */
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, s = spd * (0.3 + rnd() * 0.9);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: color, size: 1 + rnd() * 3 });
  }
}
function spark(x, y, color) {
  G.parts.push({ x, y, vx: (rnd() - 0.5) * 60, vy: (rnd() - 0.5) * 60, life: 0.6, c: color, size: 1 + rnd() * 2 });
}
function strike() {                                  // 배경 번개 — 섬광 + 갈래진 줄기
  const main = [];
  let x = 60 + rnd() * (VW - 120), y = -12;
  while (y < VH + 10) { main.push([x, y]); y += 24 + rnd() * 30; x += (rnd() - 0.5) * 78; }
  const bolts = [main];
  for (let b = 0; b < 2; b++) {
    const i0 = 1 + ri(Math.max(1, main.length - 2)), br = [main[i0]];
    let bx = main[i0][0], by = main[i0][1];
    for (let k = 0; k < 3; k++) { bx += (rnd() - 0.5) * 90; by += 18 + rnd() * 26; br.push([bx, by]); }
    bolts.push(br);
  }
  G.bolts = bolts; G.boltT = 0.32; G.flash = Math.max(G.flash, 0.8);
}
function banner(text) { $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1.3; }

function onPhaseUp() {
  banner(TR('phaseUp').replace('{n}', G.phase));
  strike(); shake = Math.max(shake, 8);
  G.rings.push({ x: G.px, y: G.py, r: 10, max: 150, life: 1, c: '120,200,255' });
}

function hit() {
  if (G.inv > 0 || G.over) return;
  shake = Math.max(shake, 10);
  G.rings.push({ x: G.px, y: G.py, r: 8, max: 60, life: 1, c: '255,120,160' });
  if (G.shield <= 0) { die(); return; }
  G.shield--; G.inv = 1.5;
  burst(G.px, G.py, '#7ff0ff', 20, 190);
  burst(G.px, G.py, '#ffffff', 8, 120);
}

function die() {
  G.over = true; G.dying = 0.9;
  G.flash = Math.max(G.flash, 0.9); shake = 18;
  burst(G.px, G.py, '#a8f4ff', 44, 270);
  burst(G.px, G.py, '#ffffff', 20, 170);
  burst(G.px, G.py, '#5f7fd8', 24, 130);
  G.rings.push({ x: G.px, y: G.py, r: 10, max: 190, life: 1, c: '150,220,255' });
}

function endRun() {
  G.ended = true; running = false;
  const sec = Math.floor(G.time), score = sec + G.phase * 100;
  const isBest = score > best;
  best = Math.max(best, score);
  $('endTitle').textContent = isBest ? TR('endBest') : TR('endDead');
  $('endDesc').textContent = TR('endDesc')
    .replace('{s}', sec).replace('{p}', G.phase).replace('{v}', score.toLocaleString()) +
    TR('endBestSuffix').replace('{b}', best.toLocaleString());
  $('endPanel').hidden = false; $('hud').hidden = true;
  $('banner').classList.remove('on');
  GameRank.submit('storm-corridor', score, '페이즈 ' + G.phase)
    .then(r => { if (r && r.applied) $('endDesc').textContent += TR('rankApplied').replace('{n}', r.rank); });
}

/* ═══════════ 갱신 ═══════════ */
const keys = new Set();
function spawner(dt, d, ph) {
  const TM = G.tm;
  TM.straight -= dt;
  if (TM.straight <= 0) { patStraight(d); TM.straight = (1.25 - d * 0.7) * (0.8 + rnd() * 0.5); }
  TM.aimed -= dt;
  if (TM.aimed <= 0) { patAimed(d, ph); TM.aimed = (2.0 - d * 0.95) * (0.8 + rnd() * 0.5); }
  if (ph >= 2) { TM.radial -= dt; if (TM.radial <= 0) { patRadial(d); TM.radial = (3.6 - d * 1.5) * (0.8 + rnd() * 0.45); } }
  if (ph >= 3) { TM.laser -= dt; if (TM.laser <= 0) { patLaser(d, ph); TM.laser = (4.4 - d * 1.9) * (0.8 + rnd() * 0.45); } }
  if (ph >= 4) { TM.homing -= dt; if (TM.homing <= 0) { patHoming(d); TM.homing = (3.4 - d * 1.2) * (0.8 + rnd() * 0.5); } }
  TM.shard -= dt;
  if (TM.shard <= 0) { if (G.shield < 3 && !G.shards.length) spawnShard(); TM.shard = 8 + rnd() * 7; }
}

function update(dt) {
  if (!G.over) {
    G.time += dt;
    const ph = 1 + Math.floor(G.time / PHASE_SEC);
    if (ph !== G.phase) { G.phase = ph; onPhaseUp(); }
    const d = Math.min(1, (G.phase - 1) / 6);
    G.inv = Math.max(0, G.inv - dt);
    // 이동 — 8방향, 대각 보정
    let mx = 0, my = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) mx -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) mx += 1;
    if (keys.has('ArrowUp') || keys.has('KeyW')) my -= 1;
    if (keys.has('ArrowDown') || keys.has('KeyS')) my += 1;
    if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
    G.px = clamp(G.px + mx * SPD * dt, MINX, MAXX);
    G.py = clamp(G.py + my * SPD * dt, MINY, MAXY);
    G.vx += (mx * SPD - G.vx) * Math.min(1, dt * 11);
    if ((mx || my) && rnd() < dt * 26) spark(G.px - mx * 8, G.py + 14, '#4a7ad6');
    if (G.grace > 0) G.grace -= dt; else spawner(dt, d, G.phase);
    if (rnd() < dt * 0.5) strike();
  } else {
    G.dying -= dt;
    if (G.dying <= 0 && !G.ended) endRun();
  }
  const live = !G.over && G.inv <= 0;

  // 직선/조준/방사탄
  for (let i = G.bul.length - 1; i >= 0; i--) {
    const b = G.bul[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -60 || b.x > VW + 60 || b.y < -60 || b.y > VH + 60) { G.bul.splice(i, 1); continue; }
    if (live) {
      const hr = BT[b.k].hr + PR;
      if (d2(b.x, b.y, G.px, G.py) < hr * hr) { G.bul.splice(i, 1); hit(); }
    }
  }
  // 방사탄 씨앗
  for (let i = G.seeds.length - 1; i >= 0; i--) {
    const s = G.seeds[i];
    s.life -= dt;
    if (s.life <= 0) { seedBurst(s); G.seeds.splice(i, 1); }
  }
  // 유도 구체
  for (let i = G.orbs.length - 1; i >= 0; i--) {
    const o = G.orbs[i];
    o.life -= dt;
    let da = Math.atan2(G.py - o.y, G.px - o.x) - o.a;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    o.a += clamp(da, -o.turn * dt, o.turn * dt);
    o.x += Math.cos(o.a) * o.speed * dt; o.y += Math.sin(o.a) * o.speed * dt;
    if (rnd() < dt * 26) spark(o.x, o.y, '#ff9a3c');
    if (o.life <= 0) { burst(o.x, o.y, '#ffd68a', 10, 120); G.orbs.splice(i, 1); continue; }
    if (live && d2(o.x, o.y, G.px, G.py) < (o.r + PR) * (o.r + PR)) {
      burst(o.x, o.y, '#ffd68a', 16, 160); G.orbs.splice(i, 1); hit();
    }
  }
  // 레이저 — 경고 후 발사
  for (let i = G.lasers.length - 1; i >= 0; i--) {
    const lz = G.lasers[i];
    const wasWarn = lz.life < lz.warn;
    lz.life += dt;
    if (wasWarn && lz.life >= lz.warn) {
      shake = Math.max(shake, 7); G.flash = Math.max(G.flash, 0.35);
      for (let k = 0; k < 26; k++) {
        const at = rnd() * (lz.vert ? VH : VW);
        spark(lz.vert ? lz.pos : at, lz.vert ? at : lz.pos, '#bfe4ff');
      }
    }
    if (lz.life >= lz.warn && lz.life < lz.warn + lz.fire && !G.over && G.inv <= 0) {
      const gap = lz.vert ? Math.abs(G.px - lz.pos) : Math.abs(G.py - lz.pos);
      if (gap < lz.w / 2 + PR) hit();
    }
    if (lz.life >= lz.warn + lz.fire) G.lasers.splice(i, 1);
  }
  // 실드 조각
  for (let i = G.shards.length - 1; i >= 0; i--) {
    const s = G.shards[i];
    s.life -= dt;
    if (s.life <= 0) { G.shards.splice(i, 1); continue; }
    if (!G.over && d2(s.x, s.y, G.px, G.py) < 21 * 21) {
      G.shards.splice(i, 1);
      G.shield = Math.min(3, G.shield + 1);
      G.floats.push({ x: s.x, y: s.y, life: 1.1, text: TR('shardGet') });
      burst(s.x, s.y, '#9dffd0', 18, 155);
      G.rings.push({ x: s.x, y: s.y, r: 6, max: 46, life: 1, c: '110,255,190' });
    }
  }
  // 파티클 / 링 / 떠오르는 글자
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - dt * 1.6; q.vy *= 1 - dt * 1.6;
    q.life -= dt * 1.7;
    if (q.life <= 0) G.parts.splice(i, 1);
  }
  for (let i = G.rings.length - 1; i >= 0; i--) {
    const rg = G.rings[i];
    rg.r += (rg.max - rg.r) * Math.min(1, dt * 7); rg.life -= dt * 2.2;
    if (rg.life <= 0) G.rings.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--) {
    const f = G.floats[i];
    f.y -= dt * 26; f.life -= dt * 1.1;
    if (f.life <= 0) G.floats.splice(i, 1);
  }
  G.boltT = Math.max(0, G.boltT - dt);
  G.flash = Math.max(0, G.flash - dt * 2.6);
  shake = Math.max(0, shake - dt * 34);
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
}

/* ═══════════ 렌더 ═══════════ */
function strokePath(pts) {
  cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]);
  cx.stroke();
}
function drawBg(now) {
  cx.fillStyle = '#080b16'; cx.fillRect(-20, -20, VW + 40, VH + 40);
  const drift = (G.time * 26) % 44;
  cx.strokeStyle = 'rgba(90,130,220,.07)'; cx.lineWidth = 1;
  cx.beginPath();
  for (let y = -44 + drift; y < VH; y += 44) { cx.moveTo(0, y + 0.5); cx.lineTo(VW, y + 0.5); }
  for (let x = 0; x <= VW; x += 44) { cx.moveTo(x + 0.5, 0); cx.lineTo(x + 0.5, VH); }
  cx.stroke();
  // 폭풍 구름 — 상단에 걸린 어두운 띠
  for (let i = 0; i < 5; i++) {
    const bx = ((i * 210 + now * 9) % (VW + 260)) - 130;
    cx.fillStyle = 'rgba(40,58,110,.20)';
    cx.beginPath(); cx.ellipse(bx, 22 + (i % 3) * 12, 130, 30, 0, 0, 7); cx.fill();
  }
  // 번개 줄기
  if (G.bolts && G.boltT > 0) {
    const a = clamp(G.boltT / 0.32, 0, 1);
    cx.lineCap = 'round'; cx.lineJoin = 'round';
    for (const pts of G.bolts) {
      cx.strokeStyle = 'rgba(110,165,255,' + (a * 0.26) + ')'; cx.lineWidth = 9; strokePath(pts);
      cx.strokeStyle = 'rgba(190,225,255,' + (a * 0.7) + ')'; cx.lineWidth = 3; strokePath(pts);
      cx.strokeStyle = 'rgba(255,255,255,' + a + ')'; cx.lineWidth = 1; strokePath(pts);
    }
  }
  if (G.flash > 0) {
    cx.fillStyle = 'rgba(150,195,255,' + (G.flash * 0.17) + ')';
    cx.fillRect(-20, -20, VW + 40, VH + 40);
  }
}
function drawWalls(now) {
  const gl = cx.createLinearGradient(0, 0, WALL, 0);
  gl.addColorStop(0, '#0b0f1e'); gl.addColorStop(1, '#182242');
  cx.fillStyle = gl; cx.fillRect(-20, -20, WALL + 20, VH + 40);
  const gr = cx.createLinearGradient(VW - WALL, 0, VW, 0);
  gr.addColorStop(0, '#182242'); gr.addColorStop(1, '#0b0f1e');
  cx.fillStyle = gr; cx.fillRect(VW - WALL, -20, WALL + 20, VH + 40);
  for (let i = 0; i < 10; i++) {                                  // 벽면 수정 룬 — 위로 흐른다
    const y = ((i * 58 - G.time * 34) % (VH + 58) + VH + 58) % (VH + 58) - 29;
    const pulse = 0.3 + 0.3 * Math.sin(now * 3 + i);
    cx.fillStyle = 'rgba(120,200,255,' + pulse + ')';
    cx.fillRect(WALL - 8, y, 3, 15);
    cx.fillRect(VW - WALL + 5, y + 26, 3, 15);
  }
  cx.fillStyle = 'rgba(130,190,255,.45)';
  cx.fillRect(WALL - 2, 0, 2, VH); cx.fillRect(VW - WALL, 0, 2, VH);
}
function drawLasers(now) {
  for (const lz of G.lasers) {
    const warn = lz.life < lz.warn;
    if (warn) {
      const p = lz.life / lz.warn, a = 0.30 + 0.45 * Math.abs(Math.sin(now * 16));
      cx.fillStyle = 'rgba(255,90,120,' + (a * 0.30) + ')';
      if (lz.vert) cx.fillRect(lz.pos - lz.w / 2, 0, lz.w, VH); else cx.fillRect(0, lz.pos - lz.w / 2, VW, lz.w);
      cx.fillStyle = 'rgba(255,150,180,' + (0.45 + p * 0.5) + ')';
      if (lz.vert) cx.fillRect(lz.pos - 1, 0, 2, VH); else cx.fillRect(0, lz.pos - 1, VW, 2);
    } else {
      const p = clamp((lz.life - lz.warn) / lz.fire, 0, 1);
      const w = lz.w * (1 - p * p) * (0.9 + rnd() * 0.2);
      const grad = lz.vert ? cx.createLinearGradient(lz.pos - w, 0, lz.pos + w, 0)
                           : cx.createLinearGradient(0, lz.pos - w, 0, lz.pos + w);
      grad.addColorStop(0, 'rgba(90,150,255,0)');
      grad.addColorStop(0.34, 'rgba(120,190,255,.75)');
      grad.addColorStop(0.5, 'rgba(240,250,255,.95)');
      grad.addColorStop(0.66, 'rgba(120,190,255,.75)');
      grad.addColorStop(1, 'rgba(90,150,255,0)');
      cx.fillStyle = grad;
      if (lz.vert) cx.fillRect(lz.pos - w, 0, w * 2, VH); else cx.fillRect(0, lz.pos - w, VW, w * 2);
      cx.fillStyle = 'rgba(255,255,255,' + (0.85 - p * 0.6) + ')';
      if (lz.vert) cx.fillRect(lz.pos - 2, 0, 4, VH); else cx.fillRect(0, lz.pos - 2, VW, 4);
    }
  }
}
function hexPath(r, rot) {
  cx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = rot + i * Math.PI / 3, hx = Math.cos(a) * r, hy = Math.sin(a) * r;
    if (i) cx.lineTo(hx, hy); else cx.moveTo(hx, hy);
  }
  cx.closePath();
}
function drawPlayer(now) {
  cx.fillStyle = 'rgba(0,0,0,.42)';
  cx.beginPath(); cx.ellipse(G.px, G.py + 20, 12, 4.5, 0, 0, 7); cx.fill();
  cx.save();
  cx.translate(G.px, G.py + Math.sin(now * 6) * 1.2);
  // 실드 육각 링 — 남은 실드 수만큼
  for (let i = 0; i < G.shield; i++) {
    cx.strokeStyle = 'rgba(130,225,255,' + (0.34 - i * 0.07) + ')'; cx.lineWidth = 1.5;
    hexPath(20 + i * 5, now * (0.5 + i * 0.2)); cx.stroke();
  }
  if (G.inv > 0 && Math.floor(G.inv * 14) % 2) cx.globalAlpha = 0.35;
  cx.rotate(clamp(G.vx / 300, -1, 1) * 0.24);
  cx.fillStyle = OUT;
  for (const q of BODY) cx.fillRect(q[0] - 1, q[1] - 1, q[2] + 2, q[3] + 2);
  for (const q of BODY) { cx.fillStyle = q[4]; cx.fillRect(q[0], q[1], q[2], q[3]); }
  cx.globalAlpha *= 0.45 + 0.3 * Math.sin(now * 7);          // 가슴 코어 맥동
  cx.drawImage(CORE_SPR, -CORE_SPR.width / 2, 2 - CORE_SPR.height / 2);
  cx.restore();
  if (G.inv > 0) {                                       // 무적 중 방전 아크
    cx.save(); cx.translate(G.px, G.py);
    cx.strokeStyle = 'rgba(165,235,255,.8)'; cx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      let ax = (rnd() - 0.5) * 28, ay = -18 + rnd() * 36;
      cx.beginPath(); cx.moveTo(ax, ay);
      for (let j = 0; j < 3; j++) { ax += (rnd() - 0.5) * 15; ay += (rnd() - 0.5) * 15; cx.lineTo(ax, ay); }
      cx.stroke();
    }
    cx.restore();
  }
}
function draw(now) {
  const sx = shake ? (rnd() - 0.5) * shake : 0, sy = shake ? (rnd() - 0.5) * shake : 0;
  cx.save(); cx.translate(sx, sy);
  drawBg(now);
  drawWalls(now);
  drawLasers(now);
  // 실드 조각
  for (const s of G.shards) {
    if (s.life < 3 && Math.floor(s.life * 8) % 2) continue;
    const fy = s.y + Math.sin(now * 3.4 + s.x) * 4;
    cx.drawImage(SHARD_SPR, s.x - SHARD_SPR.width / 2, fy - SHARD_SPR.height / 2);
    cx.fillStyle = '#e6fff4';
    cx.beginPath(); cx.moveTo(s.x, fy - 8); cx.lineTo(s.x + 6, fy); cx.lineTo(s.x, fy + 8); cx.lineTo(s.x - 6, fy); cx.fill();
    cx.fillStyle = '#3ad9a0'; cx.fillRect(s.x - 1, fy - 4, 2, 8);
  }
  // 방사탄 씨앗 — 터질 자리를 미리 알린다
  for (const s of G.seeds) {
    const p = 1 - s.life / 0.45;
    cx.strokeStyle = 'rgba(170,120,255,' + (0.35 + p * 0.5) + ')'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(s.x, s.y, 34 * (1 - p) + 7, 0, 7); cx.stroke();
    cx.fillStyle = 'rgba(220,200,255,' + (0.4 + p * 0.6) + ')';
    cx.fillRect(s.x - 3, s.y - 3, 6, 6);
  }
  if (!G.over) drawPlayer(now);
  for (const b of G.bul) {
    const sp = BT[b.k].sp;
    cx.drawImage(sp, b.x - sp.width / 2, b.y - sp.height / 2);
  }
  cx.fillStyle = '#ffffff';                              // 발광 위에 또렷한 코어 픽셀
  for (const b of G.bul) cx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3);
  for (const o of G.orbs) {
    cx.drawImage(ORB_SPR, o.x - ORB_SPR.width / 2, o.y - ORB_SPR.height / 2);
    cx.fillStyle = '#fff2d0'; cx.fillRect(o.x - 2, o.y - 2, 4, 4);
  }
  for (const q of G.parts) {
    cx.globalAlpha = clamp(q.life, 0, 1);
    cx.fillStyle = q.c; cx.fillRect(q.x, q.y, q.size, q.size);
  }
  cx.globalAlpha = 1;
  for (const rg of G.rings) {
    cx.strokeStyle = 'rgba(' + rg.c + ',' + clamp(rg.life, 0, 1) * 0.75 + ')';
    cx.lineWidth = 2 + rg.life * 2;
    cx.beginPath(); cx.arc(rg.x, rg.y, rg.r, 0, 7); cx.stroke();
  }
  cx.font = 'bold 13px monospace'; cx.textAlign = 'center';
  for (const f of G.floats) {
    cx.globalAlpha = clamp(f.life, 0, 1);
    cx.fillStyle = '#9dffd0'; cx.fillText(f.text, f.x, f.y);
  }
  cx.globalAlpha = 1; cx.textAlign = 'left';
  cx.restore();
  $('shieldTxt').textContent = '🛡 ' + '◆'.repeat(G.shield) + '◇'.repeat(3 - G.shield);
  $('phaseTxt').textContent = '⚡ ' + TR('phase') + ' ' + G.phase;
  $('timeTxt').textContent = '⏱ ' + Math.floor(G.time) + 's';
}

/* ═══════════ 입력 ═══════════ */
const MOVE = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space']);
addEventListener('keydown', ev => { if (MOVE.has(ev.code)) ev.preventDefault(); keys.add(ev.code); });
addEventListener('keyup', ev => keys.delete(ev.code));
addEventListener('blur', () => keys.clear());

/* ═══════════ 루프 / 시작 ═══════════ */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!running || !G) return;
  update(dt);
  if (G) draw(now / 1000);
}
requestAnimationFrame(loop);

function startGame() {
  newGame(); running = true; keys.clear();
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false;
}
$('startBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('backBtn').onclick = () => {
  $('endPanel').hidden = true; $('menu').hidden = false;
  $('bestTxt').textContent = best ? TR('bestTxt').replace('{b}', best.toLocaleString()) : '';
};
</script>
<script src="../lib/touch.js"></script>
<script src="../lib/rank.js"></script>
<script>
GameRank.autoPanel('storm-corridor');
</script>
