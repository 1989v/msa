<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }

         flex-direction:column; align-items:center; min-height:100vh; user-select:none; padding:14px 10px 30px; }
  h1.top { font-size:19px; color:#0ea5e9; margin:6px 0 2px; text-shadow:1px 1px 0 #000; }
  .sub { font-size:11px; color:#8e9db0; margin-bottom:10px; text-align:center; }

  #gameArea { display:flex; flex-direction:column; align-items:center; width:100%; }
  #roundLabel { font-size:13px; color:#c2cedc; margin:6px 0 8px; text-align:center; }
  #roundLabel b { color:#0ea5e9; }
  .bar { width:100%; max-width:640px; height:8px; background:#1a2238; border-radius:4px;
         overflow:hidden; margin-bottom:16px; }
  .bar i { display:block; height:100%; width:0; background:#0ea5e9; border-radius:4px; transition:width .3s; }

  #arena { display:flex; gap:14px; width:100%; max-width:640px; align-items:stretch; }
  .card { flex:1 1 0; min-width:0; background:#1a2238; border:2px solid #2c3550; border-radius:14px;
          padding:24px 14px 20px; cursor:pointer; text-align:center; display:flex; flex-direction:column;
          align-items:center; gap:8px; animation:deal .28s ease;
          transition:transform .3s, opacity .3s, border-color .3s, background-color .15s; }
  .card:hover { background:#222b44; border-color:#0ea5e9; }
  .card .em { font-size:52px; line-height:1.15; }
  .card .nm { font-size:18px; }
  .card .nm2 { font-size:11px; color:#8e9db0; }
  .card .ds { font-size:12px; color:#c2cedc; line-height:1.5; }
  .card.win { border-color:#22c55e; background:#1a2238; transform:scale(1.07); }
  .card.lose { opacity:.12; transform:scale(.9); }
  @keyframes deal { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .vs { width:46px; height:46px; border-radius:50%; background:#eab308; color:#241c02; font-weight:bold;
        display:flex; align-items:center; justify-content:center; align-self:center; flex:0 0 auto;
        font-size:15px; box-shadow:0 0 14px rgba(234,179,8,.35); }
  .hint { font-size:11px; color:#8e9db0; margin-top:14px; }

  .panel { position:fixed; inset:0; background:rgba(9,13,24,.97); display:flex; z-index:10;
           overflow:auto; padding:20px; }
  .pwrap { margin:auto; display:flex; flex-direction:column; align-items:center; gap:13px;
           text-align:center; width:100%; max-width:540px; }
  .pwrap h1 { color:#0ea5e9; font-size:25px; text-shadow:2px 2px 0 #000; }
  .pwrap p { font-size:12.5px; color:#c2cedc; line-height:1.8; max-width:480px; }
  .pwrap p.small { font-size:11px; color:#8e9db0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button.act { background:#0ea5e9; color:#04121c; border:0; padding:12px 18px; font-weight:bold;
               font-size:13px; border-radius:8px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#222b44; color:#e6ecf2; }

  .packs { display:grid; grid-template-columns:repeat(2, minmax(140px, 220px)); gap:10px;
           justify-content:center; width:100%; }
  button.pack { background:#1a2238; border:2px solid #2c3550; border-radius:12px; padding:14px 10px;
                cursor:pointer; color:#e6ecf2; font-family:inherit; display:flex; flex-direction:column;

  button.pack:hover { background:#222b44; border-color:#0ea5e9; }
  .pack .pk-em { font-size:30px; }
  .pack b { font-size:14px; }
  .pack .pk-en { font-size:10.5px; color:#8e9db0; }
  .pack .pk-n { font-size:10.5px; color:#0ea5e9; }

  .hof { background:#1a2238; border-radius:10px; padding:10px 16px 12px; min-width:250px; max-width:100%; }
  .hof h2 { font-size:12.5px; color:#eab308; margin-bottom:7px; }
  .hof-row { font-size:12px; color:#c2cedc; line-height:1.9; display:flex; gap:6px;

  .hof-row em { color:#8e9db0; font-style:normal; }
  .hof-empty { font-size:11.5px; color:#8e9db0; line-height:1.7; }

  #champNm { font-size:22px; color:#22c55e; font-weight:bold; }
  #champSub { font-size:11.5px; color:#8e9db0; }
  #champDs { font-size:12.5px; color:#c2cedc; }
  .medal { font-size:12.5px; color:#c2cedc; }
  .medal b { color:#eab308; }
  .pathBox { background:#1a2238; border-radius:10px; padding:10px 16px 12px; font-size:12px;
             max-width:100%; }
  .pathBox b { color:#0ea5e9; display:block; margin-bottom:6px; font-size:12px; }
  #pathList { color:#c2cedc; line-height:1.9; }

    #arena { flex-direction:column; gap:10px; }
    .vs { margin:-4px auto; width:40px; height:40px; font-size:13px; }
    .card { padding:16px 12px 14px; }
    .card .em { font-size:44px; }
    .hint { display:none; }

function readHof() {
  try { return JSON.parse(localStorage.getItem(HOF_KEY) || '{}'); } catch (e) { return {}; }
}
function writeHof(o) {
  try { localStorage.setItem(HOF_KEY, JSON.stringify(o)); } catch (e) { /* 저장 불가 환경 무시 */ }
}

var pack, cur, nxt, mi, log, curA, curB, locked = false, finalChamp, finalRunner;

function nameOf(it) { return GameI18n.lang === 'ko' ? it[0] : it[1]; }
function subNameOf(it) { return GameI18n.lang === 'ko' ? it[1] : it[0]; }
function packNameOf(p) { return GameI18n.lang === 'ko' ? p.ko : p.en; }
function roundTag(size) {
  if (size === 2) return TR('final');
  return GameI18n.lang === 'ko' ? size + '강' : 'Round of ' + size;
}

function begin(p) {
  pack = p;
  cur = GameDaily.shuffle(p.items.slice(), Math.random);
  nxt = []; mi = 0; log = []; locked = false;
  document.getElementById('menu').hidden = true;
  document.getElementById('endPanel').hidden = true;
  document.getElementById('gameArea').hidden = false;
  showMatch();
}

function renderCard(el, it) {
  el.className = 'card';
  el.innerHTML = '<span class="em">' + it[2] + '</span>' +
    '<b class="nm">' + nameOf(it) + '</b>' +
    '<span class="nm2">' + subNameOf(it) + '</span>' +
    '<span class="ds">' + it[3] + '</span>';
  // 같은 keyframes 재생을 위해 애니메이션 리셋
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

function showMatch() {
  curA = cur[mi * 2];
  curB = cur[mi * 2 + 1];
  renderCard(document.getElementById('card0'), curA);
  renderCard(document.getElementById('card1'), curB);
  document.getElementById('roundLabel').innerHTML =
    pack.em + ' ' + packNameOf(pack) + ' · <b>' + roundTag(cur.length) + '</b> ' +
    (mi + 1) + '/' + (cur.length / 2);
  document.getElementById('barFill').style.width = Math.round(log.length / 31 * 100) + '%';
}

function pick(i) {
  if (locked || document.getElementById('gameArea').hidden) return;
  locked = true;
  var winner = i === 0 ? curA : curB;
  var loser = i === 0 ? curB : curA;
  log.push({ r: cur.length, w: winner, l: loser });
  document.getElementById('card' + i).className = 'card win';
  document.getElementById('card' + (1 - i)).className = 'card lose';
  setTimeout(function () {
    nxt.push(winner);
    mi++;
    if (mi * 2 >= cur.length) { cur = nxt; nxt = []; mi = 0; }
    if (cur.length === 1) { finish(cur[0]); return; }
    locked = false;
    showMatch();
  }, 550);
}

function finish(champ) {
  finalChamp = champ;
  finalRunner = log[log.length - 1].l;
  document.getElementById('gameArea').hidden = true;

  var hof = readHof();
  var key = pack.id + '|' + champ[0];
  hof[key] = (hof[key] || 0) + 1;
  writeHof(hof);

  document.getElementById('champEm').textContent = champ[2];
  document.getElementById('champNm').textContent = nameOf(champ);
  document.getElementById('champSub').textContent = subNameOf(champ);
  document.getElementById('champDs').textContent = champ[3];
  document.getElementById('runnerLine').innerHTML =
    '<b>' + TR('runnerUp') + '</b> — ' + finalRunner[2] + ' ' + nameOf(finalRunner);

  var semis = [];
  for (var i = 0; i < log.length; i++) {
    if (log[i].r === 4) semis.push(log[i].l[2] + ' ' + nameOf(log[i].l));
  }
  document.getElementById('semiLine').innerHTML = '<b>' + TR('semi') + '</b> — ' + semis.join(' · ');

  var lines = [];
  for (var j = 0; j < log.length; j++) {
    if (log[j].w === champ) {
      lines.push(roundTag(log[j].r) + ' vs ' + log[j].l[2] + ' ' + nameOf(log[j].l));
    }
  }
  document.getElementById('pathList').innerHTML = lines.join('<br>');
  document.getElementById('endPanel').hidden = false;
}

function shareText() {
  if (GameI18n.lang === 'ko') {
    return '🏆 급식 대전 [' + pack.ko + '] 우승: ' + finalChamp[0] +
      ' (준우승 ' + finalRunner[0] + ')\n' + SHARE_URL;
  }
  return '🏆 Bracket Battle [' + pack.en + '] Champion: ' + finalChamp[1] +
    ' (Runner-up ' + finalRunner[1] + ')\n' + SHARE_URL;
}

function renderHof() {
  var el = document.getElementById('hofList');
  var hof = readHof();
  var keys = Object.keys(hof);
  keys.sort(function (a, b) { return hof[b] - hof[a]; });
  keys = keys.slice(0, 5);
  if (!keys.length) {
    el.innerHTML = '<div class="hof-empty">' + TR('hofEmpty') + '</div>';
    return;
  }
  var medals = ['🥇', '🥈', '🥉', '🏅', '🏅'];
  var html = '';
  for (var i = 0; i < keys.length; i++) {
    var sep = keys[i].indexOf('|');
    var pid = keys[i].slice(0, sep), ko = keys[i].slice(sep + 1);
    var p = null, it = null;
    for (var a = 0; a < PACKS.length; a++) if (PACKS[a].id === pid) p = PACKS[a];
    if (!p) continue;
    for (var b = 0; b < p.items.length; b++) if (p.items[b][0] === ko) it = p.items[b];
    if (!it) continue;
    html += '<div class="hof-row">' + medals[i] + ' ' + it[2] + ' <b>' + nameOf(it) + '</b>' +
      ' ×' + hof[keys[i]] + TR('winCnt') + ' <em>(' + packNameOf(p) + ')</em></div>';
  }
  el.innerHTML = html || '<div class="hof-empty">' + TR('hofEmpty') + '</div>';
}

function buildMenu() {
  var g = document.getElementById('packGrid');
  g.innerHTML = '';
  for (var i = 0; i < PACKS.length; i++) {
    (function (p) {
      var btn = document.createElement('button');
      btn.className = 'pack';
      btn.innerHTML = '<span class="pk-em">' + p.em + '</span><b>' + packNameOf(p) + '</b>' +
        '<span class="pk-en">' + (GameI18n.lang === 'ko' ? p.en : p.ko) + '</span>' +
        '<span class="pk-n">' + TR('items32') + '</span>';
      btn.onclick = function () { begin(p); };
      g.appendChild(btn);
    })(PACKS[i]);
  }
  renderHof();
}

document.getElementById('card0').onclick = function () { pick(0); };
document.getElementById('card1').onclick = function () { pick(1); };
document.addEventListener('keydown', function (e) {
  if (document.getElementById('gameArea').hidden) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); pick(0); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); pick(1); }
});
document.getElementById('againBtn').onclick = function () { begin(pack); };
document.getElementById('backBtn').onclick = function () {
  document.getElementById('endPanel').hidden = true;
  document.getElementById('gameArea').hidden = true;
  document.getElementById('menu').hidden = false;
  buildMenu();
};
document.getElementById('shareBtn').onclick = function () {
  GameDaily.share(shareText(), this);
};

buildMenu();
</script>
