<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <rect width="320" height="180" fill="#0c1424"/>
  <rect y="0" width="320" height="12" fill="#1a2238"/>
  <rect y="11" width="320" height="2" fill="#2c3550"/>
  <!-- 잔별 -->
  <g fill="#dde6f2" opacity=".28">
    <rect x="30" y="30" width="2" height="2"/><rect x="96" y="52" width="2" height="2"/>
    <rect x="58" y="88" width="2" height="2"/><rect x="132" y="34" width="2" height="2"/>
    <rect x="20" y="128" width="2" height="2"/><rect x="112" y="112" width="2" height="2"/>
  </g>
  <!-- 절벽 — 본벽 + 처마 선반 + 상단 벽 -->
  <rect x="250" y="60" width="70" height="120" fill="#3a4763"/>
  <rect x="250" y="60" width="70" height="4" fill="#4d5c80"/>
  <rect x="270" y="34" width="50" height="50" fill="#3a4763"/>
  <rect x="270" y="34" width="50" height="4" fill="#4d5c80"/>
  <!-- 빙벽 패치 -->
  <rect x="256" y="112" width="8" height="60" fill="#0ea5e9" opacity=".28"/>
  <!-- 처마(오버행) 선반 -->
  <rect x="196" y="84" width="124" height="14" fill="#3a4763"/>
  <rect x="196" y="84" width="124" height="3" fill="#4d5c80"/>
  <!-- 정상 깃발 -->
  <rect x="294" y="8" width="2.6" height="28" fill="#cbd5e1"/>
  <path d="M297 9 L316 16 L297 23 Z" fill="#22c55e"/>
  <text x="248" y="44" font-family="monospace" font-size="9" fill="#dde6f2" opacity=".4" text-anchor="end">300m</text>
  <!-- 고도선 -->
  <g stroke="#dde6f2" opacity=".1">
    <line x1="0" y1="98" x2="196" y2="98"/>
    <line x1="0" y1="146" x2="160" y2="146"/>
  </g>
  <!-- 등반가 — 처마 립에 피켈을 걸고 매달림 -->
  <path d="M178 138 Q192 122 198 96" stroke="#94a3b8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <line x1="192" y1="102" x2="198" y2="83" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="192" y1="79" x2="206" y2="88" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="193" cy="101" r="2.6" fill="#ef4444"/>
  <circle cx="198" cy="84" r="5" fill="none" stroke="#eab308" stroke-width="1.6" opacity=".8"/>
  <circle cx="172" cy="146" r="11" fill="#eab308" stroke="#8a6d06" stroke-width="2"/>
  <path d="M163 145 a9 9 0 0 1 18 0 Z" fill="#0ea5e9"/>
  <rect x="172" y="147" width="2.6" height="3" fill="#0c1424"/>
  <rect x="177" y="147" width="2.6" height="3" fill="#0c1424"/>
  <!-- 낙하 궤적 잔상 -->
  <line x1="170" y1="162" x2="170" y2="176" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 4" opacity=".45"/>
  <rect y="172" width="320" height="8" fill="#1a2238"/>
  <text x="88" y="160" font-family="monospace" font-size="19" font-weight="bold" fill="#eab308"
        text-anchor="middle">절벽 등반가</text>
</svg>
