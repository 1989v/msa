<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <rect width="320" height="180" fill="#0c1424"/>
  <!-- 배경 노드맵 (순례길) -->
  <g stroke="#2c3550" stroke-width="1.5" fill="none">
    <path d="M36 160 L52 128 L40 96 L58 64 L48 32"/>
    <path d="M36 160 L70 132 L84 100 L70 68 L48 32"/>
    <path d="M282 168 L268 136 L280 104 L264 72 L276 40"/>
  </g>
  <path d="M36 160 L52 128 L40 96 L58 64 L48 32" stroke="#0ea5e9" stroke-width="2" fill="none" opacity=".85"/>
  <g fill="#1a2238" stroke="#2c3550" stroke-width="1.5">
    <circle cx="36" cy="160" r="6"/><circle cx="52" cy="128" r="6"/><circle cx="70" cy="132" r="6"/>
    <circle cx="40" cy="96" r="6"/><circle cx="84" cy="100" r="6"/><circle cx="58" cy="64" r="6"/>
    <circle cx="70" cy="68" r="6"/><circle cx="282" cy="168" r="6"/><circle cx="268" cy="136" r="6"/>
    <circle cx="280" cy="104" r="6"/><circle cx="264" cy="72" r="6"/><circle cx="276" cy="40" r="6"/>
  </g>
  <circle cx="48" cy="32" r="8" fill="#1a2238" stroke="#eab308" stroke-width="2"/>
  <circle cx="52" cy="128" r="3" fill="#0ea5e9"/>
  <circle cx="40" cy="96" r="3" fill="#0ea5e9"/>
  <!-- 4원소 문양 (다이아몬드 배치) -->
  <g transform="translate(160,62)">
    <circle r="34" fill="none" stroke="#222b44" stroke-width="1.5"/>
    <!-- 화염 -->
    <g transform="translate(0,-34)">
      <rect x="-13" y="-13" width="26" height="26" rx="5" transform="rotate(45)" fill="#1a2238" stroke="#f97316" stroke-width="2.5"/>
      <path d="M0 -8 L7 6 L-7 6 Z" fill="#f97316"/>
    </g>
    <!-- 서리 -->
    <g transform="translate(34,0)">
      <rect x="-13" y="-13" width="26" height="26" rx="5" transform="rotate(45)" fill="#1a2238" stroke="#38bdf8" stroke-width="2.5"/>
      <g stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round">
        <line x1="0" y1="-8" x2="0" y2="8"/><line x1="-7" y1="-4" x2="7" y2="4"/><line x1="-7" y1="4" x2="7" y2="-4"/>
      </g>
    </g>
    <!-- 대지 -->
    <g transform="translate(0,34)">
      <rect x="-13" y="-13" width="26" height="26" rx="5" transform="rotate(45)" fill="#1a2238" stroke="#a3e635" stroke-width="2.5"/>
      <path d="M-8 6 L-2 -6 L2 0 L5 -4 L8 6 Z" fill="#a3e635"/>
    </g>
    <!-- 공허 -->
    <g transform="translate(-34,0)">
      <rect x="-13" y="-13" width="26" height="26" rx="5" transform="rotate(45)" fill="#1a2238" stroke="#a855f7" stroke-width="2.5"/>
      <circle r="7" fill="none" stroke="#a855f7" stroke-width="2.2"/>
      <circle r="2.4" fill="#a855f7"/>
    </g>
    <circle r="5" fill="#0ea5e9"/>
  </g>
  <!-- 타이틀 -->
  <text x="160" y="139" font-family="monospace" font-size="26" font-weight="bold" fill="#000" text-anchor="middle" transform="translate(2,2)">원소 순례자</text>
  <text x="160" y="139" font-family="monospace" font-size="26" font-weight="bold" fill="#e6ecf2" text-anchor="middle">원소 순례자</text>
  <text x="160" y="160" font-family="monospace" font-size="11" fill="#0ea5e9" text-anchor="middle">4원소 덱빌딩 로그라이크</text>
</svg>
