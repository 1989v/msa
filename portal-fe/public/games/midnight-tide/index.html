<html lang="ko">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#d8e4f2; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; -webkit-user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:10px; overflow:hidden;

  canvas { display:block; background:#0a111f; max-width:100%; touch-action:none; }
  #hud { position:absolute; top:0; left:0; right:0; pointer-events:none; }
  #xpWrap { height:7px; background:rgba(10,17,31,.85); }
  #xpFill { height:100%; width:0%; background:linear-gradient(90deg,#0ea5e9,#7dd3fc);
            box-shadow:0 0 8px rgba(14,165,233,.8); transition:width .15s; }

  .grow { flex:1; }
  #timeTxt { font-size:15px; color:#7dd3fc; }
  #hpTxt { color:#fca5a5; }
  #icons { display:flex; gap:4px; padding:0 10px; flex-wrap:wrap; }
  #icons .ic { background:rgba(10,16,30,.55); border:1px solid rgba(14,165,233,.25); border-radius:6px;
               font-size:13px; padding:1px 5px; }
  #icons .ic b { font-size:10px; color:#7dd3fc; }
  #icons .ic.evo { border-color:#eab308; }
  #icons .ic.evo b { color:#fde68a; }
  #banner { position:absolute; top:34%; left:0; right:0; text-align:center; font-size:27px; font-weight:bold;
            color:#7dd3fc; text-shadow:0 0 18px rgba(14,165,233,.85), 3px 3px 0 #000; pointer-events:none;
            opacity:0; transition:opacity .25s; letter-spacing:2px; }
  #banner.on { opacity:1; }
  #banner.warn { color:#fca5a5; text-shadow:0 0 18px rgba(239,68,68,.85), 3px 3px 0 #000; }
  .panel { position:absolute; inset:0; background:rgba(9,14,26,.93); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:11px; text-align:center; z-index:10; padding:20px;
           overflow-y:auto; }

  .panel h2 { color:#7dd3fc; font-size:19px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#9fb2cc; line-height:1.75; max-width:540px; }
  .panel button { background:#0ea5e9; color:#06121f; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1a2238; color:#d8e4f2; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #wpnRow { font-size:19px; letter-spacing:6px; }
  #cards { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #cards .card { width:196px; background:#1a2238; border:1px solid rgba(14,165,233,.35); border-radius:10px;

var TR = GameI18n.t;
document.title = TR('gameTitle');

/* ═══════════ 기본 유틸 ═══════════ */
var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var VW = cv.width, VH = cv.height;
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd() { return Math.random(); }
function ri(n) { return Math.floor(Math.random() * n); }
function d2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function fmt(key, o) { var s = TR(key), k; for (k in o) s = s.replace('{' + k + '}', o[k]); return s; }
function fmtTime(sec) { sec = Math.floor(sec); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
var OUT = '#070c18';

/* ═══════════ 스프라이트 베이커리 — 프레임마다 그리지 않고 한 번만 굽는다 ═══════════ */
function glowSprite(core, glow, r) {
  var c = document.createElement('canvas'), s = Math.ceil(r * 4);
  c.width = c.height = s;
  var g = c.getContext('2d'), m = s / 2;
  var grad = g.createRadialGradient(m, m, 0, m, m, m);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.22, core);
  grad.addColorStop(0.5, glow);
  grad.addColorStop(1, 'rgba(10,17,31,0)');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  return { c: c, ax: m, ay: m };
}

/** [x,y,w,h,color] 픽셀 사각형 배열 → 외곽선 1패스 + (선택) 발광 후광을 깔아 굽는다 */
function bakeRects(rects, s, glow) {
  var minX = 999, minY = 999, maxX = -999, maxY = -999, i, q;
  for (i = 0; i < rects.length; i++) {
    q = rects[i];
    if (q[0] < minX) minX = q[0];
    if (q[1] < minY) minY = q[1];
    if (q[0] + q[2] > maxX) maxX = q[0] + q[2];
    if (q[1] + q[3] > maxY) maxY = q[1] + q[3];
  }
  var pad = glow ? 14 : 3;
  var c = document.createElement('canvas');
  c.width = Math.ceil((maxX - minX) * s) + pad * 2;
  c.height = Math.ceil((maxY - minY) * s) + pad * 2;
  var g = c.getContext('2d');
  var ax = pad - minX * s, ay = pad - minY * s;
  if (glow) {
    var gr = Math.max(c.width, c.height) * 0.62;
    var grad = g.createRadialGradient(c.width / 2, c.height / 2, 0, c.width / 2, c.height / 2, gr);
    grad.addColorStop(0, glow);
    grad.addColorStop(1, 'rgba(10,17,31,0)');
    g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  }
  g.fillStyle = OUT;
  for (i = 0; i < rects.length; i++) {
    q = rects[i];
    g.fillRect(ax + (q[0] - 0.8) * s, ay + (q[1] - 0.8) * s, (q[2] + 1.6) * s, (q[3] + 1.6) * s);
  }
  for (i = 0; i < rects.length; i++) {
    q = rects[i];
    g.fillStyle = q[4];
    g.fillRect(ax + q[0] * s, ay + q[1] * s, q[2] * s, q[3] * s);
  }
  return { c: c, ax: ax, ay: ay };
}
function makeWhite(spr) {
  var c = document.createElement('canvas');
  c.width = spr.c.width; c.height = spr.c.height;
  var g = c.getContext('2d');
  g.drawImage(spr.c, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  return { c: c, ax: spr.ax, ay: spr.ay };
}
function flipSpr(spr) {
  var c = document.createElement('canvas');
  c.width = spr.c.width; c.height = spr.c.height;
  var g = c.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1);
  g.drawImage(spr.c, 0, 0);
  return { c: c, ax: c.width - spr.ax, ay: spr.ay };
}

/* ── 플레이어: 달빛 잠수사 (우향 원본 + 좌향 + 피격 백색) ── */
var P_BODY = [

  [-7, -6, 4, 12, '#2e5e8a'],
  [3, -6, 4, 12, '#152b47'],

var SPR = {};
function regEnemy(key, rects, s, glow, flip) {

  var white = makeWhite(bakeRects(rects, s, null));
  SPR[key] = { b: body, w: white, bl: null, wl: null };
  if (flip) { SPR[key].bl = flipSpr(body); SPR[key].wl = flipSpr(white); }
}

/* ═══════════ 적 — 심해 괴수 4종 + 보스 4종 ═══════════ */

  var px = G.px + ox, py = G.py + oy + Math.sin(now * 5) * 1.5;
  if (G.inv > 0 && Math.floor(G.inv * 14) % 2) cx.globalAlpha = 0.4;
  var spr = G.fx < 0 ? P_L : P_R;
  cx.drawImage(spr.c, px - spr.ax, py - spr.ay);
  cx.globalAlpha *= 0.5 + 0.3 * Math.sin(now * 6);       // 가슴 랜턴 맥동
  cx.drawImage(LANT.c, px - LANT.ax, py - LANT.ay + 1);
  cx.globalAlpha = 1;
}
function draw(now) {
  camX = G.px - VW / 2; camY = G.py - VH / 2;
  var sx = shake ? (rnd() - 0.5) * shake : 0;
  var sy = shake ? (rnd() - 0.5) * shake : 0;
  var ox = -camX + sx, oy = -camY + sy;
  drawBg(now, ox, oy);
  drawWorld(now, ox, oy);
  cx.drawImage(VIG, 0, 0);
  if (!G.over && G.hp / G.hpMax < 0.3) {                 // 빈사 경고 테두리
    cx.strokeStyle = 'rgba(239,68,68,' + (0.25 + 0.2 * Math.sin(now * 6)) + ')';
    cx.lineWidth = 10;
    cx.strokeRect(5, 5, VW - 10, VH - 10);
  }
}

/* ═══════════ 입력 ═══════════ */
var MOVE = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, Space: 1 };
addEventListener('keydown', function (ev) {
  if (MOVE[ev.code]) ev.preventDefault();
  keys[ev.code] = true;
});
addEventListener('keyup', function (ev) { keys[ev.code] = false; });
addEventListener('blur', function () { keys = {}; });

/* ═══════════ 루프 / 시작 ═══════════ */
var last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!running || !G) return;
  if (!G.choosing) update(dt);
  draw(now / 1000);
}
requestAnimationFrame(loop);

function startGame() {
  newGame(); running = true; keys = {};
  $('menu').hidden = true; $('endPanel').hidden = true; $('lvlPanel').hidden = true;
  $('hud').hidden = false;
  refreshIcons(); refreshHud();
}
$('startBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('backBtn').onclick = function () {
  $('endPanel').hidden = true; $('menu').hidden = false;
  $('bestTxt').textContent = best ? fmt('bestTxt', { b: best.toLocaleString() }) : '';
};
</script>

<script src="../lib/rank.js"></script>

GameRank.autoPanel('midnight-tide');
</script>
