<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뱀 군단전</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dce4f5; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:10px; overflow:hidden; box-shadow:0 0 52px rgba(14,165,233,.22); }
  canvas { display:block; background:#0c1424; max-width:100%; touch-action:none; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:10px; display:flex; gap:8px; font-size:13px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(26,34,56,.72); padding:3px 11px; border-radius:10px; }
  #lb { position:absolute; top:8px; right:10px; width:172px; background:rgba(26,34,56,.72); border-radius:9px;
        padding:7px 9px; font-size:11px; pointer-events:none; text-shadow:1px 1px 0 #000; }
  #lb .lbTitle { font-weight:bold; font-size:11px; margin-bottom:4px; color:#7dd3fc; }
  #lb .lbRow { display:flex; align-items:center; gap:5px; line-height:1.75; color:#b6c2dc; }
  #lb .lbRow.me { color:#eab308; font-weight:bold; }
  #lb .dot { width:7px; height:7px; border-radius:50%; flex:none; }
  #lb .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #feed { position:absolute; left:10px; bottom:10px; display:flex; flex-direction:column-reverse; gap:2px;
          font-size:11px; pointer-events:none; text-shadow:1px 1px 0 #000; }
  #feed .feedRow { background:rgba(26,34,56,.6); padding:2px 8px; border-radius:7px; color:rgba(220,230,250,.78); }
  #feed .feedRow.hot { color:#eab308; font-weight:bold; }
  #banner { position:absolute; top:34%; left:0; right:0; text-align:center; font-size:30px; font-weight:bold;
            color:#eab308; text-shadow:0 0 18px rgba(234,179,8,.7), 3px 3px 0 #000; pointer-events:none;
            opacity:0; transition:opacity .25s; letter-spacing:2px; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(12,20,36,.94); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:11px; text-align:center; z-index:10; padding:20px; overflow-y:auto; }
  .panel h1 { color:#7dd3fc; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#b6c2dc; line-height:1.75; max-width:520px; }
  .panel button { background:#0ea5e9; color:#06121f; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1a2238; color:#dce4f5; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #info { margin-top:9px; font-size:11px; color:#5a688a; text-align:center; line-height:1.7; }
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width:100vw; max-width:100vw; border-width:0; border-radius:0; }
    canvas { width:100%; height:auto; }
    #info { display:none; }
    #lb { width:148px; font-size:10px; top:34px; }
    .panel button { padding:10px 16px; font-size:13px; }
  }
</style>
<link rel="stylesheet" href="../lib/menu.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="860" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="lenTxt"></span>
    <span class="tag" id="killTxt"></span>
    <span class="tag" id="rankTxt"></span>
  </div>
  <div id="lb" hidden></div>
  <div id="feed" hidden></div>
  <div id="banner"></div>
  <div class="panel" id="menu">
    <h1 data-i18n="menuTitle">🐍 뱀 군단전</h1>
    <p><b data-i18n="menuLead">마우스가 가리키는 방향으로 미끄러진다 — 16마리 군단전에서 최후의 왕이 되어라.</b>
       <span data-i18n="menuDesc">빛 알갱이를 먹으면 길어진다.</span><br>
       <span data-i18n="menuTouch" style="color:#7dd3fc"></span></p>
    <div class="row"><span id="bestTxt" style="font-size:12px;color:#7c8ab0"></span></div>
    <button id="startBtn" data-i18n="startBtn">▶ 군단전 입장</button>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <div class="row">
      <button id="againBtn" data-i18n="againBtn">🔁 재도전</button>
      <button id="backBtn" class="ghost" data-i18n="backBtn">처음으로</button>
    </div>
  </div>
</div>
<div id="info" data-i18n="info">조향: 마우스 · 부스트: 클릭/스페이스 홀드 · 붉은 경계 링에 닿으면 즉사</div>
<script>
'use strict';

GameI18n.init({
  ko: {
    gameTitle: '뱀 군단전',
    menuTitle: '🐍 뱀 군단전',
    menuLead: '마우스가 가리키는 방향으로 미끄러진다 — 16마리 군단전에서 최후의 왕이 되어라.',
    menuDesc: '빛 알갱이를 먹으면 길어지고, 머리가 다른 뱀의 몸에 닿으면 그 자리에서 소멸한다. ' +
              '반대로 상대의 진로를 몸으로 가로막으면 잘라낼 수 있다 — 쓰러진 뱀은 알갱이 무더기로 변한다. ' +
              '클릭/스페이스 홀드 부스트는 길이를 태우며 가속하고, 맵 끝의 붉은 경계 링에 닿으면 즉사. ' +
              '점수 = 최종 길이 + 킬×300 + 1위 등극 보너스 3000.',
    menuTouch: '📱 모바일: 터치한 방향으로 조향 · 더블탭 홀드로 부스트',
    startBtn: '▶ 군단전 입장',
    againBtn: '🔁 재도전',
    backBtn: '처음으로',
    info: '조향: 마우스 · 부스트: 클릭/스페이스 홀드 · 붉은 경계 링에 닿으면 즉사',
    hudLen: '길이',
    hudKill: '킬',
    hudRank: '순위',
    lbTitle: '👑 실시간 TOP 5',
    lbMe: '{r}위 · 나',
    you: '나',
    feedWall: '경계 링',
    crowned: '👑 1위 등극!',
    endDead: '💀 군단에서 탈락…',
    endCrown: '👑 한때 왕좌에 올랐다!',
    endBest: '🏆 신기록!',
    endDesc: '길이 {l} · {k}킬 · 최고 {r}위 → 점수 {v}',
    endBestSuffix: ' (이번 세션 최고 {b})',
    rankApplied: ' 🏆 랭킹 {n}위!',
    bestTxt: '이번 세션 최고 점수 {b}',
  },
  en: {
    gameTitle: 'Serpent Legion',
    menuTitle: '🐍 Serpent Legion',
    menuLead: 'You glide wherever the mouse points — outlive 16 serpents and claim the crown.',
    menuDesc: 'Eat light pellets to grow. If your head touches another serpent\'s body you dissolve on the spot — ' +
              'but block their path with your own body and you cut them down. Fallen serpents burst into pellet piles. ' +
              'Hold click/space to boost: it burns your length for speed. Touch the red boundary ring and you die instantly. ' +
              'Score = final length + kills×300 + a 3000 bonus for reaching #1.',
    menuTouch: '📱 Mobile: steer toward your touch · double-tap and hold to boost',
    startBtn: '▶ Join the Legion',
    againBtn: '🔁 Retry',
    backBtn: 'Main menu',
    info: 'Steer: mouse · Boost: hold click/space · The red boundary ring kills on contact',
    hudLen: 'LEN',
    hudKill: 'KILLS',
    hudRank: 'RANK',
    lbTitle: '👑 LIVE TOP 5',
    lbMe: '#{r} · me',
    you: 'You',
    feedWall: 'boundary ring',
    crowned: '👑 You are #1!',
    endDead: '💀 Cut from the Legion…',
    endCrown: '👑 You once held the throne!',
    endBest: '🏆 New Record!',
    endDesc: 'Length {l} · {k} kills · best #{r} → Score {v}',
    endBestSuffix: ' (session best {b})',
    rankApplied: ' 🏆 Rank #{n}!',
    bestTxt: 'Session best {b}',
  },
});
var TR = GameI18n.t;
document.title = TR('gameTitle');

var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var VW = cv.width, VH = cv.height;
var TAU = Math.PI * 2;
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd() { return Math.random(); }
function d2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function angNorm(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }

/* ── 월드 상수 ── */
var WORLD_R = 3000;                                 // 원형 맵 반경 — 경계는 위험 링
var N_BOTS = 15;                                    // 항상 유지되는 봇 수 (플레이어 포함 16마리)
var AMBIENT = 900, MAX_PELLETS = 2600;
var GAP = 7;                                        // 몸통 세그먼트 고정 간격
var CELL = 64;                                      // 충돌 공간 그리드 셀 크기
var SPD = 150, BSPD = 256;
var START_MASS = 10, BOOST_MIN = 14;                // 이 길이 밑으로는 부스트 불가

function segsFor(m) { return Math.min(520, 12 + Math.floor(m * 1.05)); }
function radiusFor(m) { return Math.min(17, 5 + Math.sqrt(m) * 0.34); }
function turnFor(m) { return Math.max(2.0, 4.0 - Math.sqrt(m) * 0.045); }

/* ── 뱀 스킨 6색 — [0]은 플레이어 전용, 봇은 1~5 ── */
var SKINS = [
  { a: '#38bdf8', b: '#0369a1' },
  { a: '#4ade80', b: '#15803d' },
  { a: '#facc15', b: '#a16207' },
  { a: '#f87171', b: '#b91c1c' },
  { a: '#c084fc', b: '#7e22ce' },
  { a: '#fb923c', b: '#c2410c' },
];

var BOT_NAMES = {
  ko: ['독사 노장', '초록 질풍', '황금 비늘', '밤그림자', '붉은 맹독', '회색 도살자', '새벽 살모사',
       '강철 또아리', '모래 유령', '검은 송곳니', '천둥 꼬리', '서리 독니', '진홍 채찍', '늪지 왕뱀',
       '바람 혓바닥', '은빛 사신', '불꽃 허물', '심연 구렁이', '가시 넝쿨', '달빛 코브라', '폭풍 비단뱀',
       '옥빛 자객', '핏빛 올가미', '안개 방울뱀', '청동 살무사', '흑요석 킹', '들불 아나콘다', '얼음 독사'],
  en: ['Viper Vet', 'Emerald Gale', 'Gilded Scale', 'Night Shade', 'Red Venom', 'Gray Butcher', 'Dawn Mamba',
       'Steel Coil', 'Dune Ghost', 'Black Fang', 'Thunder Tail', 'Frost Fang', 'Crimson Whip', 'Swamp King',
       'Wind Tongue', 'Silver Reaper', 'Ember Shed', 'Abyss Serpent', 'Thorn Vine', 'Moon Cobra', 'Storm Python',
       'Jade Assassin', 'Blood Noose', 'Mist Rattler', 'Bronze Adder', 'Obsidian King', 'Wildfire Boa', 'Ice Viper'],
};

/* ── 스프라이트 베이킹 — 세그먼트 볼/발광은 매 프레임 그라데이션 대신 한 번만 굽는다 ── */
function hexRgb(h) {
  return parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' + parseInt(h.slice(5, 7), 16);
}
function ballSprite(col) {
  var R = 20, c = document.createElement('canvas');
  c.width = c.height = R * 2 + 4;
  var g = c.getContext('2d'), m = R + 2;
  g.fillStyle = '#081120';
  g.beginPath(); g.arc(m, m, R + 1.8, 0, TAU); g.fill();          // 다크 네이비 외곽선
  g.fillStyle = col;
  g.beginPath(); g.arc(m, m, R, 0, TAU); g.fill();
  var hi = g.createRadialGradient(m - R * 0.4, m - R * 0.45, 1, m, m, R * 1.05);
  hi.addColorStop(0, 'rgba(255,255,255,.55)');
  hi.addColorStop(0.42, 'rgba(255,255,255,.07)');
  hi.addColorStop(1, 'rgba(0,0,0,.30)');
  g.fillStyle = hi;
  g.beginPath(); g.arc(m, m, R, 0, TAU); g.fill();
  return c;
}
function glowSprite(col, r) {
  var c = document.createElement('canvas'), s = Math.ceil(r * 4);
  c.width = c.height = s;
  var g = c.getContext('2d'), m = s / 2;
  var grad = g.createRadialGradient(m, m, 0, m, m, m);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.28, col);
  grad.addColorStop(1, 'rgba(' + hexRgb(col) + ',0)');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  return c;
}
var SPR = [];
for (var si0 = 0; si0 < SKINS.length; si0++) {
  SPR.push({ a: ballSprite(SKINS[si0].a), b: ballSprite(SKINS[si0].b), g: glowSprite(SKINS[si0].a, 13) });
}
var PSPR = {};
function pspr(col) {
  if (!PSPR[col]) PSPR[col] = glowSprite(col, 7);
  return PSPR[col];
}
var PELLET_COLORS = ['#7dd3fc', '#4ade80', '#facc15', '#f472b6', '#c084fc'];

/* ── 상태 ── */
var G = null, running = false, best = 0, shake = 0, bannerT = 0;
var aimX = VW / 2, aimY = VH / 3, mDown = false, sDown = false, tBoost = false, lastTap = 0;

function pcell(x, y) { return (((x + 3200) / CELL) | 0) * 4096 + (((y + 3200) / CELL) | 0); }

/* ═══════════ 알갱이 — 정적 그리드 + 흡입(비행) 리스트 ═══════════ */
function addPellet(x, y, v, col, kind) {
  if (kind !== 'a' && G.pel.length >= MAX_PELLETS) return;
  var p = { x: x, y: y, v: v, c: col, k: kind, r: 2 + Math.min(3.2, v * 0.7), ph: rnd() * 6, pi: G.pel.length, ck: 0 };
  p.ck = pcell(x, y);
  G.pel.push(p);
  (G.pgrid[p.ck] || (G.pgrid[p.ck] = [])).push(p);
}
function removePellet(p) {
  var arr = G.pgrid[p.ck], i = arr.indexOf(p);
  arr[i] = arr[arr.length - 1]; arr.pop();
  var last = G.pel[G.pel.length - 1];
  G.pel[p.pi] = last; last.pi = p.pi; G.pel.pop();
}
function spawnAmbient() {
  var x, y;
  if (rnd() < 0.55 && G.clusters.length) {                        // 군집 — 밭처럼 몰려 있어야 동선이 생긴다
    var c = G.clusters[(rnd() * G.clusters.length) | 0];
    x = c.x + (rnd() + rnd() - 1) * 300; y = c.y + (rnd() + rnd() - 1) * 300;
  } else {
    var a = rnd() * TAU, d = Math.sqrt(rnd()) * (WORLD_R - 90);
    x = Math.cos(a) * d; y = Math.sin(a) * d;
  }
  var dd = Math.sqrt(x * x + y * y);
  if (dd > WORLD_R - 90) { x *= (WORLD_R - 90) / dd; y *= (WORLD_R - 90) / dd; }
  addPellet(x, y, 1 + rnd() * 2, PELLET_COLORS[(rnd() * PELLET_COLORS.length) | 0], 'a');
}
function corpseToPellets(s) {
  var pts = s.pts, step = 2;
  var v = clamp(s.mass / (pts.length / step) * 0.9, 1, 8);
  for (var i = 0; i < pts.length; i += step) {
    addPellet(pts[i].x + (rnd() - 0.5) * 10, pts[i].y + (rnd() - 0.5) * 10, v, SKINS[s.skin].a, 'c');
  }
}

/* ═══════════ 뱀 생성 / 스폰 ═══════════ */
function makeSnake(bot, name, skin, ai, x, y, mass) {
  var dir = rnd() * TAU;
  var s = { bot: bot, name: name, skin: skin, ai: ai, dir: dir, want: dir, mass: mass,
            alive: true, grace: bot ? 1.5 : 2.5, kills: 0, boost: false, wantBoost: false,
            think: rnd() * 0.15, seed: rnd() * 100, dropT: 0, pts: [] };
  var n = segsFor(mass);
  for (var i = 0; i < n; i++) s.pts.push({ x: x - Math.cos(dir) * GAP * i, y: y - Math.sin(dir) * GAP * i });
  return s;
}
function safeSpawn(minDist) {
  var x = 0, y = 0;
  for (var t = 0; t < 14; t++) {
    var a = rnd() * TAU, d = Math.sqrt(rnd()) * (WORLD_R - 700);
    x = Math.cos(a) * d; y = Math.sin(a) * d;
    var ok = true;
    for (var i = 0; i < G.snakes.length; i++) {
      var o = G.snakes[i];
      if (d2(x, y, o.pts[0].x, o.pts[0].y) < minDist * minDist) { ok = false; break; }
    }
    if (ok) break;
  }
  return { x: x, y: y };
}
function nextBotName() {
  var pool = BOT_NAMES[GameI18n.lang] || BOT_NAMES.ko;
  var i = G.nameIdx++;
  var gen = (i / pool.length) | 0;
  return pool[G.nameOrder[i % pool.length]] + (gen > 0 ? ' ' + (gen + 1) : '');
}
function spawnBot(mass) {
  var pos = safeSpawn(600);
  var s = makeSnake(true, nextBotName(), 1 + ((rnd() * 5) | 0), (rnd() * 3) | 0, pos.x, pos.y, mass);
  G.snakes.push(s);
}

function newGame() {
  var pool = BOT_NAMES[GameI18n.lang] || BOT_NAMES.ko;
  var order = [];
  for (var i = 0; i < pool.length; i++) order.push(i);
  for (var j = order.length - 1; j > 0; j--) {                    // 셔플 — 매판 다른 군단
    var k = (rnd() * (j + 1)) | 0, tmp = order[j]; order[j] = order[k]; order[k] = tmp;
  }
  G = { time: 0, over: false, ended: false, dying: 0,
        snakes: [], pel: [], pgrid: {}, fly: [], parts: [], rings: [],
        feed: [], respawn: [], grid: {}, clusters: [],
        zoom: 1.05, camx: 0, camy: 0, deathPos: null, finalLen: 0,
        bestRank: 16, myRank: 16, crowned: false, leader: null,
        nameIdx: 0, nameOrder: order, player: null,
        lbT: 0, hudT: 0 };
  for (var c = 0; c < 26; c++) {
    var a = rnd() * TAU, d = Math.sqrt(rnd()) * (WORLD_R - 500);
    G.clusters.push({ x: Math.cos(a) * d, y: Math.sin(a) * d });
  }
  var pa = rnd() * TAU, pd = rnd() * 900;
  var me = makeSnake(false, localStorage.getItem('game_nickname') || TR('you'), 0, -1,
                     Math.cos(pa) * pd, Math.sin(pa) * pd, START_MASS);
  G.player = me; G.snakes.push(me);
  for (var b = 0; b < N_BOTS; b++) spawnBot(10 + rnd() * rnd() * 140);
  for (var p0 = 0; p0 < AMBIENT; p0++) spawnAmbient();
  G.camx = me.pts[0].x; G.camy = me.pts[0].y;
  aimX = VW / 2 + Math.cos(me.dir) * 120; aimY = VH / 2 + Math.sin(me.dir) * 120;
}

/* ═══════════ 세그먼트 공간 그리드 — 머리 vs 몸통 충돌 전용 ═══════════ */
function buildGrid() {
  var g = {};
  for (var si = 0; si < G.snakes.length; si++) {
    var s = G.snakes[si];
    if (s.grace > 0) continue;                                    // 무적 중엔 남을 자를 수도 없다
    var pts = s.pts;
    for (var i = 0; i < pts.length; i++) {
      var k = pcell(pts[i].x, pts[i].y);
      (g[k] || (g[k] = [])).push(si * 1024 + i);
    }
  }
  G.grid = g;
}
/** 충돌 검사 — 벽이면 -2, 충돌 없음 -1, 그 외 가해자 뱀 인덱스 */
function checkHit(s, si) {
  var h = s.pts[0], hr = radiusFor(s.mass);
  if (h.x * h.x + h.y * h.y > (WORLD_R - hr) * (WORLD_R - hr)) return -2;
  var cx0 = ((h.x + 3200) / CELL) | 0, cy0 = ((h.y + 3200) / CELL) | 0;
  for (var dx = -1; dx <= 1; dx++) {
    for (var dy = -1; dy <= 1; dy++) {
      var arr = G.grid[(cx0 + dx) * 4096 + (cy0 + dy)];
      if (!arr) continue;
      for (var j = 0; j < arr.length; j++) {
        var osi = (arr[j] / 1024) | 0;
        if (osi === si) continue;                                 // 자기 몸은 통과
        var o = G.snakes[osi], op = o.pts[arr[j] & 1023];
        var rr = hr + radiusFor(o.mass) * 0.85;
        if (d2(h.x, h.y, op.x, op.y) < rr * rr) return osi;
      }
    }
  }
  return -1;
}

/* ═══════════ 봇 AI — 3계층 성격 ═══════════ */
function clearAhead(s, ang, look) {
  var h = s.pts[0], rr = radiusFor(s.mass) + 20;
  for (var t = 0.5; t <= 1.001; t += 0.5) {
    var px = h.x + Math.cos(ang) * look * t, py = h.y + Math.sin(ang) * look * t;
    if (px * px + py * py > (WORLD_R - 70) * (WORLD_R - 70)) return false;
    var cx0 = ((px + 3200) / CELL) | 0, cy0 = ((py + 3200) / CELL) | 0;
    for (var dx = -1; dx <= 1; dx++) {
      for (var dy = -1; dy <= 1; dy++) {
        var arr = G.grid[(cx0 + dx) * 4096 + (cy0 + dy)];
        if (!arr) continue;
        for (var j = 0; j < arr.length; j++) {
          var osi = (arr[j] / 1024) | 0;
          if (osi === s.gi) continue;
          var op = G.snakes[osi].pts[arr[j] & 1023];
          if (d2(px, py, op.x, op.y) < rr * rr) return false;
        }
      }
    }
  }
  return true;
}
function nearestHead(s, range) {
  var h = s.pts[0], bd = range * range, found = null;
  for (var i = 0; i < G.snakes.length; i++) {
    var o = G.snakes[i];
    if (o === s || o.grace > 0) continue;
    var dd = d2(h.x, h.y, o.pts[0].x, o.pts[0].y);
    if (dd < bd) { bd = dd; found = o; }
  }
  return found ? { s: found, d: Math.sqrt(bd) } : null;
}
function bestPellet(s, range) {
  var h = s.pts[0], cells = (range / CELL) | 0;
  var cx0 = ((h.x + 3200) / CELL) | 0, cy0 = ((h.y + 3200) / CELL) | 0;
  var bestP = null, bestScore = 0;
  for (var dx = -cells; dx <= cells; dx++) {
    for (var dy = -cells; dy <= cells; dy++) {
      var arr = G.pgrid[(cx0 + dx) * 4096 + (cy0 + dy)];
      if (!arr) continue;
      for (var j = 0; j < arr.length; j++) {
        var p = arr[j];
        var score = p.v / (Math.sqrt(d2(h.x, h.y, p.x, p.y)) + 60);
        if (score > bestScore) { bestScore = score; bestP = p; }
      }
    }
  }
  return bestP;
}
function farmerThink(s) {
  var h = s.pts[0];
  var p = bestPellet(s, 640);
  if (p) {
    var dd = Math.sqrt(d2(h.x, h.y, p.x, p.y));
    s.want = Math.atan2(p.y - h.y, p.x - h.x);
    s.wantBoost = s.ai === 2 && s.mass > 45 && dd > 500 && rnd() < 0.25;
  } else {
    s.want = s.dir + Math.sin(G.time * 0.7 + s.seed) * 0.7;      // 어슬렁 배회
    if (h.x * h.x + h.y * h.y > WORLD_R * WORLD_R * 0.5) s.want = Math.atan2(-h.y, -h.x) + (rnd() - 0.5);
    s.wantBoost = false;
  }
}
function cowardThink(s) {
  var th = nearestHead(s, 460);
  if (th) {
    var h = s.pts[0];
    s.want = Math.atan2(h.y - th.s.pts[0].y, h.x - th.s.pts[0].x) + (rnd() - 0.5) * 0.6;
    s.wantBoost = th.d < 240 && s.mass > 26;                     // 겁먹고 내빼기
  } else {
    farmerThink(s);
    s.wantBoost = false;
  }
}
function hunterThink(s) {
  var h = s.pts[0], target = null, bd = 1e18;
  for (var i = 0; i < G.snakes.length; i++) {
    var o = G.snakes[i];
    if (o === s || o.grace > 0) continue;
    if (o.bot && o.mass >= s.mass * 1.35) continue;              // 큰 봇은 건드리지 않는다
    var dd = d2(h.x, h.y, o.pts[0].x, o.pts[0].y) * (o.bot ? 1 : 0.55); // 플레이어 우선 표적
    if (dd < bd) { bd = dd; target = o; }
  }
  if (!target || bd > 700 * 700) { farmerThink(s); return; }
  var vh = target.pts[0], dd2v = Math.sqrt(d2(h.x, h.y, vh.x, vh.y));
  var lead = clamp(dd2v * 0.6, 60, 260);                         // 진행 방향 앞을 노리는 컷인 좌표
  s.want = Math.atan2(vh.y + Math.sin(target.dir) * lead - h.y, vh.x + Math.cos(target.dir) * lead - h.x);
  s.wantBoost = dd2v < 430 && s.mass > 28;
}
function botThink(s, dt) {
  s.think -= dt;
  if (s.think > 0) return;
  s.think = 0.11 + rnd() * 0.08;
  var h = s.pts[0], hr = radiusFor(s.mass);
  var dc = Math.sqrt(h.x * h.x + h.y * h.y);
  if (dc > WORLD_R - 380 - hr * 6) {                             // ① 경계 링이 최우선
    s.want = Math.atan2(-h.y, -h.x) + (rnd() - 0.5) * 0.5;
    s.wantBoost = dc > WORLD_R - 190;
    return;
  }
  var look = 70 + (s.boost ? BSPD : SPD) * 0.30 + hr * 2;        // ② 전방 위험 감지 → 좌우 회피
  if (!clearAhead(s, s.dir, look)) {
    var opts = [0.65, -0.65, 1.3, -1.3, 2.2, -2.2], esc = null;
    for (var i = 0; i < opts.length; i++) {
      if (clearAhead(s, s.dir + opts[i], look * 0.9)) { esc = s.dir + opts[i]; break; }
    }
    s.want = esc === null ? s.dir + Math.PI : esc;
    s.wantBoost = false;
    return;
  }
  if (s.ai === 0) cowardThink(s);                                // ③ 성격별 행동
  else if (s.ai === 1) hunterThink(s);
  else farmerThink(s);
}

/* ═══════════ 이동 / 성장 ═══════════ */
function moveSnake(s, dt) {
  s.boost = s.wantBoost && s.mass > BOOST_MIN;
  var spd = s.boost ? BSPD : SPD;
  if (s.boost) {                                                 // 부스트는 길이를 태운다 — 방울을 흘리며
    s.dropT -= dt;
    if (s.dropT <= 0) {
      s.dropT = 0.18; s.mass -= 0.6;
      var tl = s.pts[s.pts.length - 1];
      addPellet(tl.x + (rnd() - 0.5) * 8, tl.y + (rnd() - 0.5) * 8, 0.5, SKINS[s.skin].b, 'c');
    }
  }
  var tr = turnFor(s.mass) * dt;
  s.dir += clamp(angNorm(s.want - s.dir), -tr, tr);
  var h = s.pts[0];
  h.x += Math.cos(s.dir) * spd * dt;
  h.y += Math.sin(s.dir) * spd * dt;
  var pts = s.pts;                                               // 고정 간격 follow-the-leader 보간
  for (var i = 1; i < pts.length; i++) {
    var dx = pts[i - 1].x - pts[i].x, dy = pts[i - 1].y - pts[i].y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > GAP) { var t = (d - GAP) / d; pts[i].x += dx * t; pts[i].y += dy * t; }
  }
  var want = segsFor(s.mass);
  if (pts.length < want) {
    var tail = pts[pts.length - 1];
    while (pts.length < want) pts.push({ x: tail.x, y: tail.y });
  } else {
    while (pts.length > want) pts.pop();
  }
  s.grace = Math.max(0, s.grace - dt);
  if (s.boost && rnd() < dt * 26) {                              // 부스트 잔광
    G.parts.push({ x: h.x - Math.cos(s.dir) * 14 + (rnd() - 0.5) * 8, y: h.y - Math.sin(s.dir) * 14 + (rnd() - 0.5) * 8,
                   vx: (rnd() - 0.5) * 40, vy: (rnd() - 0.5) * 40, life: 0.5, c: SKINS[s.skin].a, size: 2 + rnd() * 2 });
  }
}
function eatPellets(s) {
  var h = s.pts[0], hr = radiusFor(s.mass);
  var ar = hr + (s.bot ? 16 : 26) + (s.boost ? 8 : 0);
  var cx0 = ((h.x + 3200) / CELL) | 0, cy0 = ((h.y + 3200) / CELL) | 0;
  for (var dx = -1; dx <= 1; dx++) {
    for (var dy = -1; dy <= 1; dy++) {
      var arr = G.pgrid[(cx0 + dx) * 4096 + (cy0 + dy)];
      if (!arr) continue;
      for (var j = arr.length - 1; j >= 0; j--) {
        var p = arr[j];
        if (d2(h.x, h.y, p.x, p.y) < ar * ar) {
          var wasAmbient = p.k === 'a';
          removePellet(p);
          G.fly.push({ x: p.x, y: p.y, v: p.v, c: p.c, t: s });  // 머리로 빨려 들어간다
          if (wasAmbient) spawnAmbient();
        }
      }
    }
  }
}

/* ═══════════ 사망 처리 ═══════════ */
function burst(x, y, color, n, spd) {
  for (var i = 0; i < n; i++) {
    var a = rnd() * TAU, sp = spd * (0.3 + rnd() * 0.9);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: color, size: 1 + rnd() * 3 });
  }
}
function feedPush(text, hot) {
  G.feed.unshift({ t: text, life: 5, hot: hot });
  if (G.feed.length > 5) G.feed.pop();
}
function killSnake(s, killer) {
  s.alive = false;
  var h = s.pts[0];
  corpseToPellets(s);
  burst(h.x, h.y, SKINS[s.skin].a, 26, 220);
  burst(h.x, h.y, '#ffffff', 10, 140);
  G.rings.push({ x: h.x, y: h.y, r: 10, max: 90 + radiusFor(s.mass) * 4, life: 1, c: hexRgb(SKINS[s.skin].a) });
  var mine = !s.bot || (killer && !killer.bot);
  if (killer) {
    killer.kills++;
    feedPush(killer.name + ' ✂ ' + s.name, mine);
  } else {
    feedPush(s.name + ' ⚡ ' + TR('feedWall'), mine);
  }
  if (s.bot) {
    G.respawn.push(2 + rnd() * 2);                               // 새 이름으로 리스폰 — 15마리 유지
  } else {
    G.over = true; G.dying = 1.4;
    G.finalLen = Math.floor(s.mass);
    G.deathPos = { x: h.x, y: h.y };
    shake = 14;
  }
  if (killer && !killer.bot) shake = Math.max(shake, 5);
}

function endRun() {
  G.ended = true; running = false;
  var score = G.finalLen + G.player.kills * 300 + (G.bestRank === 1 ? 3000 : 0);
  var isBest = score > best;
  best = Math.max(best, score);
  $('endTitle').textContent = isBest ? TR('endBest') : (G.bestRank === 1 ? TR('endCrown') : TR('endDead'));
  $('endDesc').textContent = TR('endDesc')
    .replace('{l}', G.finalLen.toLocaleString()).replace('{k}', G.player.kills)
    .replace('{r}', G.bestRank).replace('{v}', score.toLocaleString()) +
    TR('endBestSuffix').replace('{b}', best.toLocaleString());
  $('endPanel').hidden = false;
  $('hud').hidden = true; $('lb').hidden = true; $('feed').hidden = true;
  $('banner').classList.remove('on');
  GameRank.submit('serpent-legion', score, '길이 ' + G.finalLen + ', ' + G.player.kills + '킬, 최고 ' + G.bestRank + '위')
    .then(function (r) { if (r && r.applied) $('endDesc').textContent += TR('rankApplied').replace('{n}', r.rank); });
}

/* ═══════════ HUD / 리더보드 / 킬 피드 ═══════════ */
function banner(text) { $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1.5; }
function updateLb() {
  var arr = G.snakes.slice().sort(function (a, b) { return b.mass - a.mass; });
  G.leader = arr[0] || null;
  var p = G.player, my = arr.indexOf(p);
  if (my >= 0) {
    G.myRank = my + 1;
    if (G.myRank < G.bestRank) G.bestRank = G.myRank;
    if (G.myRank === 1 && !G.crowned) { G.crowned = true; banner(TR('crowned')); }
  }
  var el = $('lb');
  el.innerHTML = '';
  var t = document.createElement('div');
  t.className = 'lbTitle'; t.textContent = TR('lbTitle');
  el.appendChild(t);
  var n = Math.min(5, arr.length);
  for (var i = 0; i < n; i++) {
    var s = arr[i], row = document.createElement('div');
    row.className = 'lbRow' + (s === p ? ' me' : '');
    var dot = document.createElement('span');
    dot.className = 'dot'; dot.style.background = SKINS[s.skin].a;
    var nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = (i === 0 ? '👑 ' : (i + 1) + '. ') + s.name;
    var vv = document.createElement('span');
    vv.textContent = Math.floor(s.mass).toLocaleString();
    row.appendChild(dot); row.appendChild(nm); row.appendChild(vv);
    el.appendChild(row);
  }
  if (my >= 5) {                                                 // TOP5 밖이면 내 순위 별도 표기
    var meRow = document.createElement('div');
    meRow.className = 'lbRow me';
    var dot2 = document.createElement('span');
    dot2.className = 'dot'; dot2.style.background = SKINS[p.skin].a;
    var nm2 = document.createElement('span');
    nm2.className = 'nm'; nm2.textContent = TR('lbMe').replace('{r}', G.myRank);
    var vv2 = document.createElement('span');
    vv2.textContent = Math.floor(p.mass).toLocaleString();
    meRow.appendChild(dot2); meRow.appendChild(nm2); meRow.appendChild(vv2);
    el.appendChild(meRow);
  }
}
function refreshHud() {
  var p = G.player;
  $('lenTxt').textContent = '📏 ' + TR('hudLen') + ' ' + Math.floor(p.mass).toLocaleString();
  $('killTxt').textContent = '🗡 ' + TR('hudKill') + ' ' + p.kills;
  $('rankTxt').textContent = '👑 ' + TR('hudRank') + ' ' + G.myRank + '/' + G.snakes.length;
  var el = $('feed');
  el.innerHTML = '';
  for (var i = 0; i < G.feed.length; i++) {
    var f = G.feed[i], row = document.createElement('div');
    row.className = 'feedRow' + (f.hot ? ' hot' : '');
    row.style.opacity = clamp(f.life / 1.2, 0, 1);
    row.textContent = f.t;
    el.appendChild(row);
  }
}

/* ═══════════ 갱신 ═══════════ */
function updatePlayerInput() {
  var p = G.player, h = p.pts[0];
  var hx = (h.x - G.camx) * G.zoom + VW / 2, hy = (h.y - G.camy) * G.zoom + VH / 2;
  var dx = aimX - hx, dy = aimY - hy;
  if (dx * dx + dy * dy > 170) p.want = Math.atan2(dy, dx);      // 데드존 — 머리 바로 위 포인터 떨림 방지
  p.wantBoost = mDown || sDown || tBoost;
}

function update(dt) {
  var p = G.player;
  if (!G.over) {
    G.time += dt;
    updatePlayerInput();
  } else {
    G.dying -= dt;
    if (G.dying <= 0 && !G.ended) endRun();
  }
  for (var i = 0; i < G.snakes.length; i++) {
    var s = G.snakes[i];
    s.gi = i;                                                    // clearAhead의 자기 몸 제외용 인덱스
    if (s.bot) botThink(s, dt);
    moveSnake(s, dt);
  }
  buildGrid();
  var deaths = [];                                               // 동시 판정 — 죽음은 모아서 처리
  for (var ci = 0; ci < G.snakes.length; ci++) {
    var cs = G.snakes[ci];
    if (cs.grace > 0) continue;
    var hitR = checkHit(cs, ci);
    if (hitR === -2) deaths.push({ s: cs, killer: null });
    else if (hitR >= 0) deaths.push({ s: cs, killer: G.snakes[hitR] });
  }
  for (var di = 0; di < deaths.length; di++) killSnake(deaths[di].s, deaths[di].killer);
  if (deaths.length) {
    var next = [];
    for (var fi = 0; fi < G.snakes.length; fi++) { if (G.snakes[fi].alive) next.push(G.snakes[fi]); }
    G.snakes = next;
  }
  for (var ei = 0; ei < G.snakes.length; ei++) eatPellets(G.snakes[ei]);
  for (var yi = G.fly.length - 1; yi >= 0; yi--) {               // 흡입 중인 알갱이 → 머리 도착 시 성장
    var fp = G.fly[yi], tgt = fp.t;
    if (!tgt.alive) { G.fly.splice(yi, 1); continue; }
    var th = tgt.pts[0], fdx = th.x - fp.x, fdy = th.y - fp.y;
    var fd = Math.sqrt(fdx * fdx + fdy * fdy);
    var step = (520 + fd * 6) * dt;
    if (fd < Math.max(step, radiusFor(tgt.mass))) {
      tgt.mass += fp.v;
      G.fly.splice(yi, 1);
      continue;
    }
    fp.x += fdx / fd * step; fp.y += fdy / fd * step;
  }
  for (var ri = G.respawn.length - 1; ri >= 0; ri--) {
    G.respawn[ri] -= dt;
    if (G.respawn[ri] <= 0) { G.respawn.splice(ri, 1); spawnBot(10 + rnd() * 30); }
  }
  for (var pi = G.parts.length - 1; pi >= 0; pi--) {
    var q = G.parts[pi];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - dt * 1.6; q.vy *= 1 - dt * 1.6;
    q.life -= dt * 1.7;
    if (q.life <= 0) G.parts.splice(pi, 1);
  }
  for (var gi = G.rings.length - 1; gi >= 0; gi--) {
    var rg = G.rings[gi];
    rg.r += (rg.max - rg.r) * Math.min(1, dt * 7); rg.life -= dt * 2.2;
    if (rg.life <= 0) G.rings.splice(gi, 1);
  }
  for (var ki = G.feed.length - 1; ki >= 0; ki--) {
    G.feed[ki].life -= dt;
    if (G.feed[ki].life <= 0) G.feed.splice(ki, 1);
  }
  // 카메라 — 플레이어 추적 + 길이에 따른 줌 아웃
  var focus = p.alive ? p.pts[0] : G.deathPos;
  if (focus) {
    G.camx += (focus.x - G.camx) * Math.min(1, dt * 5);
    G.camy += (focus.y - G.camy) * Math.min(1, dt * 5);
  }
  var zt = clamp(1.12 - Math.sqrt(p.mass) * 0.022, 0.55, 1.05);
  G.zoom += (zt - G.zoom) * Math.min(1, dt * 1.8);
  G.lbT -= dt;
  if (G.lbT <= 0) { G.lbT = 0.25; updateLb(); }
  G.hudT -= dt;
  if (G.hudT <= 0) { G.hudT = 0.15; refreshHud(); }
  shake = Math.max(0, shake - dt * 34);
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
}

/* ═══════════ 렌더 ═══════════ */
function drawSnake(s, now, vx0, vx1, vy0, vy1) {
  var r = radiusFor(s.mass), skin = SKINS[s.skin], spr = SPR[s.skin];
  var blink = s.grace > 0 && Math.floor(now * 10) % 2 === 0;
  var baseA = blink ? 0.45 : 1;
  cx.globalAlpha = baseA;
  var h = s.pts[0];
  if (s.boost) {
    var gw = r * 6;
    cx.globalAlpha = (0.32 + 0.14 * Math.sin(now * 18)) * baseA;
    cx.drawImage(spr.g, h.x - gw / 2, h.y - gw / 2, gw, gw);
    cx.globalAlpha = baseA;
  }
  var d = r * 2 + 2, pts = s.pts;
  for (var i = pts.length - 1; i >= 1; i--) {                    // 꼬리→머리 순서로 겹쳐 그린다
    var q = pts[i];
    if (q.x < vx0 || q.x > vx1 || q.y < vy0 || q.y > vy1) continue;
    cx.drawImage(((i / 4) | 0) % 2 === 0 ? spr.a : spr.b, q.x - r - 1, q.y - r - 1, d, d);
  }
  var hr = r * 1.12;
  cx.drawImage(spr.a, h.x - hr - 1, h.y - hr - 1, hr * 2 + 2, hr * 2 + 2);
  var ex = Math.cos(s.dir), ey = Math.sin(s.dir);
  var er = Math.max(2.1, r * 0.36);
  for (var k = -1; k <= 1; k += 2) {                             // 진행 방향을 보는 눈
    var exx = h.x + ex * r * 0.42 - ey * r * 0.52 * k, eyy = h.y + ey * r * 0.42 + ex * r * 0.52 * k;
    cx.fillStyle = '#f5f9ff';
    cx.beginPath(); cx.arc(exx, eyy, er, 0, TAU); cx.fill();
    cx.fillStyle = '#0a0f1c';
    cx.beginPath(); cx.arc(exx + ex * er * 0.4, eyy + ey * er * 0.4, er * 0.48, 0, TAU); cx.fill();
  }
  var fs = 11 / G.zoom;
  cx.font = 'bold ' + fs.toFixed(1) + 'px monospace';
  cx.textAlign = 'center';
  cx.fillStyle = s.bot ? 'rgba(225,235,255,.62)' : '#eab308';
  cx.fillText((s === G.leader ? '👑 ' : '') + s.name, h.x, h.y - r - 9 / G.zoom);
  cx.globalAlpha = 1;
}

function draw(now) {
  var sx = shake ? (rnd() - 0.5) * shake : 0, sy = shake ? (rnd() - 0.5) * shake : 0;
  cx.fillStyle = '#0c1424';
  cx.fillRect(0, 0, VW, VH);
  cx.save();
  cx.translate(VW / 2 + sx, VH / 2 + sy);
  cx.scale(G.zoom, G.zoom);
  cx.translate(-G.camx, -G.camy);
  var vw2 = VW / (2 * G.zoom) + 50, vh2 = VH / (2 * G.zoom) + 50;
  var vx0 = G.camx - vw2, vx1 = G.camx + vw2, vy0 = G.camy - vh2, vy1 = G.camy + vh2;
  // 바닥 그리드 + 별점 노이즈
  cx.strokeStyle = 'rgba(120,150,220,.055)';
  cx.lineWidth = 1.4;
  cx.beginPath();
  var gx0 = Math.floor(vx0 / 130) * 130;
  for (var gx = gx0; gx < vx1; gx += 130) { cx.moveTo(gx, vy0); cx.lineTo(gx, vy1); }
  var gy0 = Math.floor(vy0 / 130) * 130;
  for (var gy = gy0; gy < vy1; gy += 130) { cx.moveTo(vx0, gy); cx.lineTo(vx1, gy); }
  cx.stroke();
  cx.fillStyle = 'rgba(150,190,255,.10)';
  var nx0 = Math.floor(vx0 / 260) * 260;
  var ny0 = Math.floor(vy0 / 260) * 260;
  for (var nx = nx0; nx < vx1; nx += 260) {
    for (var ny = ny0; ny < vy1; ny += 260) {
      var hsh = Math.sin(nx * 127.1 + ny * 311.7) * 43758.5453;
      hsh -= Math.floor(hsh);
      if (hsh > 0.5) cx.fillRect(nx + hsh * 200, ny + hsh * 140, 3, 3);
    }
  }
  // 경계 밖 위험 지대 + 맥동하는 위험 링
  cx.beginPath();
  cx.rect(vx0 - 60, vy0 - 60, (vx1 - vx0) + 120, (vy1 - vy0) + 120);
  cx.arc(0, 0, WORLD_R, 0, TAU, true);
  cx.fillStyle = 'rgba(239,68,68,.08)';
  cx.fill();
  cx.strokeStyle = 'rgba(239,68,68,' + (0.5 + 0.25 * Math.sin(now * 3)) + ')';
  cx.lineWidth = 6;
  cx.beginPath(); cx.arc(0, 0, WORLD_R, 0, TAU); cx.stroke();
  // 알갱이 — 화면 안만
  for (var i = 0; i < G.pel.length; i++) {
    var p = G.pel[i];
    if (p.x < vx0 || p.x > vx1 || p.y < vy0 || p.y > vy1) continue;
    cx.globalAlpha = 0.62 + 0.38 * Math.sin(now * 2.4 + p.ph);
    var sz = p.r * 3.4, sp = pspr(p.c);
    cx.drawImage(sp, p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  cx.globalAlpha = 1;
  for (var fi = 0; fi < G.fly.length; fi++) {
    var fp = G.fly[fi], fsz = fp.v * 2 + 5;
    cx.drawImage(pspr(fp.c), fp.x - fsz / 2, fp.y - fsz / 2, fsz, fsz);
  }
  // 뱀 — 작은 놈부터, 플레이어는 맨 위
  var ordered = G.snakes.slice().sort(function (a, b) { return a.mass - b.mass; });
  for (var oi = 0; oi < ordered.length; oi++) {
    if (!ordered[oi].bot) continue;
    drawSnake(ordered[oi], now, vx0, vx1, vy0, vy1);
  }
  if (G.player.alive) drawSnake(G.player, now, vx0, vx1, vy0, vy1);
  for (var qi = 0; qi < G.parts.length; qi++) {
    var q = G.parts[qi];
    cx.globalAlpha = clamp(q.life, 0, 1);
    cx.fillStyle = q.c;
    cx.fillRect(q.x, q.y, q.size, q.size);
  }
  cx.globalAlpha = 1;
  for (var gi = 0; gi < G.rings.length; gi++) {
    var rg = G.rings[gi];
    cx.strokeStyle = 'rgba(' + rg.c + ',' + clamp(rg.life, 0, 1) * 0.75 + ')';
    cx.lineWidth = 2 + rg.life * 2;
    cx.beginPath(); cx.arc(rg.x, rg.y, rg.r, 0, TAU); cx.stroke();
  }
  cx.textAlign = 'left';
  cx.restore();
  // 미니맵 — 스크린 공간, 우하단
  var mr = 44, mcx = VW - 58, mcy = VH - 58;
  cx.globalAlpha = 0.88;
  cx.fillStyle = 'rgba(10,17,32,.8)';
  cx.beginPath(); cx.arc(mcx, mcy, mr + 3, 0, TAU); cx.fill();
  cx.strokeStyle = 'rgba(239,68,68,.7)';
  cx.lineWidth = 1.5;
  cx.beginPath(); cx.arc(mcx, mcy, mr, 0, TAU); cx.stroke();
  for (var mi = 0; mi < G.snakes.length; mi++) {
    var ms = G.snakes[mi];
    if (!ms.bot) continue;
    cx.fillStyle = ms === G.leader ? '#eab308' : 'rgba(180,200,235,.55)';
    cx.beginPath();
    cx.arc(mcx + ms.pts[0].x / WORLD_R * mr, mcy + ms.pts[0].y / WORLD_R * mr, ms === G.leader ? 2.4 : 1.7, 0, TAU);
    cx.fill();
  }
  if (G.player.alive) {
    var ph = G.player.pts[0];
    cx.fillStyle = '#38bdf8';
    cx.beginPath(); cx.arc(mcx + ph.x / WORLD_R * mr, mcy + ph.y / WORLD_R * mr, 3, 0, TAU); cx.fill();
    cx.strokeStyle = '#f5f9ff';
    cx.lineWidth = 1;
    cx.beginPath(); cx.arc(mcx + ph.x / WORLD_R * mr, mcy + ph.y / WORLD_R * mr, 4.2, 0, TAU); cx.stroke();
  }
  cx.globalAlpha = 1;
}

/* ═══════════ 입력 — 데스크톱: 마우스 조향 + 클릭/스페이스 부스트, 모바일: 터치 조향 + 더블탭 부스트 ═══════════ */
function canvasPos(clientX, clientY) {
  var r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) * cv.width / r.width, y: (clientY - r.top) * cv.height / r.height };
}
cv.addEventListener('mousemove', function (ev) {
  var q = canvasPos(ev.clientX, ev.clientY);
  aimX = q.x; aimY = q.y;
});
cv.addEventListener('mousedown', function (ev) { ev.preventDefault(); mDown = true; });
addEventListener('mouseup', function () { mDown = false; });
cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
addEventListener('keydown', function (ev) {
  if (ev.code === 'Space') { ev.preventDefault(); sDown = true; }
});
addEventListener('keyup', function (ev) { if (ev.code === 'Space') sDown = false; });
addEventListener('blur', function () { mDown = false; sDown = false; tBoost = false; });
cv.addEventListener('touchstart', function (ev) {
  ev.preventDefault();
  var t = ev.touches[0], q = canvasPos(t.clientX, t.clientY);
  aimX = q.x; aimY = q.y;
  var nowT = performance.now();
  if (nowT - lastTap < 300) tBoost = true;                       // 더블탭 홀드 = 부스트
  lastTap = nowT;
}, { passive: false });
cv.addEventListener('touchmove', function (ev) {
  ev.preventDefault();
  var t = ev.touches[0], q = canvasPos(t.clientX, t.clientY);
  aimX = q.x; aimY = q.y;
}, { passive: false });
addEventListener('touchend', function (ev) { if (ev.touches.length === 0) tBoost = false; });

/* ═══════════ 루프 / 시작 ═══════════ */
var last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!running || !G) return;
  update(dt);
  if (G) draw(now / 1000);
}
requestAnimationFrame(loop);

function startGame() {
  newGame();
  running = true;
  mDown = false; sDown = false; tBoost = false;
  $('menu').hidden = true; $('endPanel').hidden = true;
  $('hud').hidden = false; $('lb').hidden = false; $('feed').hidden = false;
  updateLb(); refreshHud();
}
$('startBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('backBtn').onclick = function () {
  $('endPanel').hidden = true; $('menu').hidden = false;
  $('bestTxt').textContent = best ? TR('bestTxt').replace('{b}', best.toLocaleString()) : '';
};
</script>

     입력 방식은 게임이 이미 가진 것을 그대로 둔다. -->

GameRank.autoPanel('serpent-legion');
