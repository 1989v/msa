<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레이징 피스트 사가 — Raging Fist Saga</title>
<meta name="description" content="벨트스크롤 액션 + 커맨드 격투. 순수 HTML/JS/Canvas.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%23140d1c%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%2212%22%20width%3D%2212%22%20height%3D%229%22%20fill%3D%22%23e6b183%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%2212%22%20width%3D%2212%22%20height%3D%223%22%20fill%3D%22%23f2cda6%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2213%22%20width%3D%226%22%20height%3D%227%22%20fill%3D%22%23e04434%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2221%22%20width%3D%2210%22%20height%3D%223%22%20fill%3D%22%23a8663f%22%2F%3E%3C%2Fsvg%3E">
<style>
  @font-face {
    font-family: 'Galmuri11';
    src: url('assets/fonts/Galmuri11.woff2') format('woff2');
    font-weight: 400; font-display: block;
  }
  @font-face {
    font-family: 'Galmuri14';
    src: url('assets/fonts/Galmuri14.woff2') format('woff2');
    font-weight: 400; font-display: block;
  }

  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #07060c;
    font-family: 'Galmuri11', system-ui, sans-serif;
    color: #e8dcc0;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, #1a1226 0%, #0a0810 55%, #06050a 100%);
  }
  #stage-wrap {
    position: relative;
    filter: drop-shadow(0 12px 40px rgba(0,0,0,0.7));
  }
  canvas#screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border: 2px solid #2a2436;
    border-radius: 2px;
    outline: none;
  }
  #boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: #07060c; z-index: 10;
    font-size: 14px; letter-spacing: 0.06em; color: #c8bfa8;
  }
  #boot b { color: #ffdf8a; font-size: 22px; font-family: 'Galmuri14', sans-serif; }
</style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="screen" width="1440" height="810" tabindex="0"></canvas>
  </div>
  <div id="boot"><b>레이징 피스트 사가</b><span>불러오는 중…</span></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
