<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title data-i18n="title">절벽 등반가</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dbe4f0; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.7); }
  canvas { display:block; background:#0c1424; touch-action:none; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:13px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; align-items:center; }
  #hud .tag { background:rgba(10,16,30,.62); padding:3px 11px; border-radius:10px; }
  #hud .grow { flex:1; }
  #giveUpBtn { pointer-events:auto; background:rgba(239,68,68,.14); border:1px solid rgba(239,68,68,.55); color:#ef4444;
               border-radius:10px; padding:3px 11px; font-family:inherit; font-size:11.5px; font-weight:bold; cursor:pointer; }
  #toast { position:absolute; top:52px; left:50%; transform:translateX(-50%); background:rgba(26,34,56,.93);
           border:1px solid #0ea5e9; color:#dbe4f0; padding:9px 16px; border-radius:8px; font-size:12px;
           max-width:78%; text-align:center; z-index:5; opacity:0; transition:opacity .45s; pointer-events:none; }
  .panel { position:absolute; inset:0; background:rgba(9,15,28,.94); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:11px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#7dd0f7; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#b8c6da; line-height:1.75; max-width:470px; }
  .panel p.warn { color:#eab308; font-size:11.5px; }
  .panel button { background:#0ea5e9; color:#06202e; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1a2238; color:#dbe4f0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #bestTxt { font-size:12px; color:#93a3b8; }
  #info { margin-top:9px; font-size:11px; color:#8e9db0; text-align:center; }
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width: 100vw; border-width: 0; border-radius: 0; }
    canvas { width: 100%; height: auto; }
    #info { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="840" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="altTxt"></span>
    <span class="tag" id="peakTxt"></span>
    <span class="tag" id="fallTxt"></span>
    <span class="tag" id="timeTxt"></span>
    <span class="grow"></span>
    <button id="giveUpBtn" data-i18n="hudGiveUp">🏳 포기</button>
  </div>
  <div id="toast" hidden></div>
  <div class="panel" id="menu">
    <h1 data-i18n="h1">⛏ 절벽 등반가</h1>
    <p><b data-i18n="desc1">드래그로 피켈을 휘둘러 절벽에 걸고, 몸을 끌어올려라.</b><span data-i18n="desc2"> 걸리지
       않으면 떨어진다. 바위 초입을 지나 처마·빙벽·굴뚝을 넘어 폭풍의 정상까지 약 300m.</span></p>
    <p class="warn" data-i18n="desc3">체크포인트도, 세이브도 없다. 잃을 것은 고도뿐.</p>
    <div class="row"><span id="bestTxt"></span></div>
    <button id="startBtn" data-i18n="btnStart">▶ 등반 시작</button>
  </div>
  <div class="panel" id="endPanel" hidden>

    <div class="row">

</div>
<div id="info" data-i18n="info">마우스/터치 드래그 = 피켈 · 바위에 걸고 끌어올리기 · 위로 튕기면 피켈 회수 · Esc = 포기</div>
<script>

    secChimney: '좁은 굴뚝',

    q6: '길은 놓친 홀드 바로 옆에 있었다. 늘 그렇듯이.',
    q7: '피켈은 팔의 연장이 아니라 마음의 연장이다.',

    q9: '그대가 놓친 것은 바위가 아니라 호흡이었다.',
  },
  en: {

    h1: '⛏ Cliff Climber',

    desc2: ' Miss the hook and you fall. Past the lower crags, over the roof, the ice wall and the chimney — about 300m to the storm-swept summit.',

    info: 'Mouse / touch drag = axe · hook rock and pull up · flick upward to unhook · Esc = give up',

    confirmGiveUp: 'Really give up? Your best altitude will be submitted.',
    endSummit: '🏔 Summit!',
    endGiveUp: '🏳 Descent…',
    endDescSummit: 'Summit {a}m · ⏱ {t} · total falls {f}m → score {s}',
    endDescGiveUp: 'Best {a}m · ⏱ {t} · total falls {f}m → score {s}',
    detailSummit: 'Summited {t}',
    detailBest: 'Best {m}m',
    bestLine: 'Best {a}m · top score {s} · {c} summits · {r} attempts',
    rankMsg: ' 🏆 Rank #{n}!',
    toastFall: '↘ Fell {m}m',
    secIntro: 'Lower Crags',
    secOverhang: 'The Roof',
    secIce: 'Ice Wall',
    secChimney: 'The Chimney',
    secStorm: 'Storm Crest',
    q0: 'The rock is the same as yesterday. What changed is your fingertips.',
    q1: 'Every meter fallen is a meter of this wall learned.',
    q2: 'The summit does not run away. Only haste slips the hand.',
    q3: 'A fall is not a record but a memory. Fingertips learn by memory.',
    q4: 'Do not blame the wind. The wind blows on everyone.',
    q5: 'The cliff seen from the lowest point is the most honest one.',
    q6: 'The route was right beside the hold you missed. As always.',
    q7: 'The axe is not an extension of the arm, but of the mind.',
    q8: 'A hand-span of retreat leaves two hand-spans of skill.',
    q9: 'What you lost was not the rock, but your breathing.',
  },
});
var TR = GameI18n.t;
var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var VW = cv.width, VH = cv.height;
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function hyp(x, y) { return Math.sqrt(x * x + y * y); }
function lcg(seed) {
  var s = seed >>> 0;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* ── 상수 ── */
var WORLD_H = 14400;                 // 절벽 전체 높이(px) ≈ 30화면
var GROUND_Y = 14280;                // 바닥(고도 0m)
var PXM = 46;                        // 1m = 46px
var ROD = 118;                       // 몸-피켈 고정 막대 길이 = 도달 반경
var BR = 15;                         // 몸통 반지름
var GRAV = 1350;
var K_SPR = 34;                      // 드래그 스프링 강성
var FMAX = 4300;                     // 드래그 힘 상한
var DAMP_A = 3.4;                    // 앵커 중 감쇠
var DRAG_AIR = 0.16;
var TIPV = 2600;                     // 피켈 이동 속도 상한
var SNAP = 15;                       // 모서리 스냅 반경(관대)
var ICE_SLIP = 75;                   // 빙벽 측면 앵커 미끄러짐(px/s)
var REST = 0.1;
var FR_ROCK = 0.14, FR_ICE = 0.012;  // 접촉 마찰
var HARD_LAND = 320;
var WIND_ALT = 245;                  // 폭풍 시작 고도(m)
var STORM_Y = GROUND_Y - WIND_ALT * PXM;
var STEP = 1 / 120;                  // 물리 서브스텝(반명시적 오일러)
var SPAWN_X = 430;

/* ── 상태 ── */
var running = false;
var bx = SPAWN_X, by = GROUND_Y - BR, bvx = 0, bvy = 0;   // 몸
var tx = bx, ty = by - ROD;                                // 피켈 끝
var anch = false, ax = 0, ay = 0, aNx = 0, aNy = -1, aIce = false, aRect = null;
var noGrab = 0, bodyContact = false, summitHit = false;
var airborne = false, airPeak = 0, peakAlt = 0, cumFall = 0;
var timeS = 0, simT = 0, gWind = 0;
var camY = WORLD_H - VH;
var qIdx = 0, toastT1 = 0, toastT2 = 0;
var rocks = [], stars = [], flakes = [], parts = [];
var mcx = VW / 2, mcy = 0;
var accT = 0, lastTs = 0;

/* ── 지형 — 고정 시드 절벽: 매 도전 같은 산 ── */
var SECTIONS = [
  { a: 3, k: 'secIntro' }, { a: 65, k: 'secOverhang' }, { a: 125, k: 'secIce' },
  { a: 185, k: 'secChimney' }, { a: 245, k: 'secStorm' },
];
function addR(x, y, w, h, ice, summit) {
  rocks.push({ x: x, y: y, w: w, h: h, ice: !!ice, summit: !!summit });
}
function buildTerrain() {
  rocks.length = 0; stars.length = 0;
  var r = lcg(20260807);
  var i, x, y, w;
  // 바닥 베이스캠프
  addR(-60, GROUND_Y, VW + 120, 220);
  // ① 바위 초입 (0~65m) — 관대한 지그재그 렛지 계단
  y = GROUND_Y - 150;
  var leftSide = true;
  while (y > GROUND_Y - 65 * PXM) {
    w = 210 + r() * 130;
    x = leftSide ? 40 + r() * 110 : VW - w - 40 - r() * 110;
    addR(x, y, w, 50 + r() * 26);
    if (r() < 0.4) addR(320 + r() * 140, y - 84, 110 + r() * 70, 26);
    leftSide = !leftSide;
    y -= 148 + r() * 55;
  }
  // ② 처마 오버행 (65~125m) — 왼쪽 척추벽 + 돌출 처마 선반
  var oTop = GROUND_Y - 125 * PXM, oBot = GROUND_Y - 65 * PXM;
  addR(16, oTop, 100, oBot - oTop + 40);
  y = oBot - 90;
  while (y > oTop + 90) {
    w = 240 + r() * 210;
    addR(16, y, w + 100, 32);
    if (r() < 0.5) addR(620 + r() * 110, y - 40 - r() * 80, 100 + r() * 80, 26);
    y -= 205 + r() * 75;
  }
  // ③ 빙벽 (125~185m) — 저마찰 빙판 슬랩 + 좌우 바위 홈
  var iTop = GROUND_Y - 185 * PXM, iBot = GROUND_Y - 125 * PXM;
  addR(300, iTop, 300, iBot - iTop, true);
  addR(140, iBot + 30, 100, 26);           // 척추벽 → 빙벽 디딤돌
  y = iBot - 130; i = 0;
  while (y > iTop + 60) {
    if (i % 2 === 0) addR(264, y, 38, 16);
    else addR(598, y, 38, 16);
    if (r() < 0.4) addR(i % 2 === 0 ? 700 + r() * 60 : 60 + r() * 60, y - 40, 90 + r() * 50, 24);
    i++;
    y -= 155 + r() * 65;
  }
  // ④ 좁은 굴뚝 (185~245m) — 두 기둥 사이 수직 샤프트 + 쐐기 돌기
  var cTop = GROUND_Y - 245 * PXM, cBot = GROUND_Y - 185 * PXM;
  addR(240, cTop, 130, cBot - cTop);
  addR(490, cTop, 130, cBot - cTop);
  y = cBot - 170; i = 0;
  while (y > cTop + 80) {
    if (i % 2 === 0) addR(368, y, 30, 15);
    else addR(462, y, 30, 15);
    i++;
    y -= 185 + r() * 60;
  }
  // ⑤ 폭풍 마루 (245m~) — 떠 있는 슬랩 지그재그 + 중앙 쐐기
  y = cTop - 150;
  var leftS = true;
  while (y > 640) {
    w = 140 + r() * 80;
    x = leftS ? 190 + r() * 70 : VW - w - 190 - r() * 70;
    addR(x, y, w, 28);
    if (r() < 0.5) addR(390 + r() * 60, y + 80, 60, 18);
    leftS = !leftS;
    y -= 165 + r() * 55;
  }
  // 정상
  addR(180, 560, 120, 26);                 // 어프로치 렛지
  addR(280, 380, 280, 70, false, true);    // 정상 플랫폼
  // 별 (패럴랙스 배경)
  for (i = 0; i < 150; i++) {
    stars.push({ x: r() * VW, y: r() * 7400, s: r() < 0.25 ? 2 : 1, a: 0.08 + r() * 0.3 });
  }
}
function rockAt(px, py) {
  for (var i = 0; i < rocks.length; i++) {
    var r = rocks[i];
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r;
  }
  return null;
}
/* ── 물리 — 반명시적 오일러 + 고정 막대/지형 제약 반복 ── */
function windAt(t, alt) {
  if (alt < WIND_ALT) return 0;
  return (Math.sin(t * 0.6) + Math.sin(t * 1.7 + 1.3) * 0.5) * 300;
}
function spark() {
  for (var k = 0; k < 7; k++) {
    parts.push({ x: ax, y: ay, vx: (Math.random() - 0.5) * 220, vy: -Math.random() * 160,
      life: 0.7, c: k % 2 ? '#eab308' : '#7dd0f7' });
  }
}
function dust() {
  for (var k = 0; k < 6; k++) {
    parts.push({ x: bx + (Math.random() - 0.5) * 14, y: by + BR, vx: (Math.random() - 0.5) * 160,
      vy: -Math.random() * 90, life: 0.8, c: '#6b7a99' });
  }
}
function rodProject() {
  var rx = bx - ax, ry = by - ay, d = hyp(rx, ry);
  if (d < 0.0001) { by = ay + ROD; return; }
  var s = ROD / d;
  bx = ax + rx * s; by = ay + ry * s;
  var rux = (bx - ax) / ROD, ruy = (by - ay) / ROD;
  var vr = bvx * rux + bvy * ruy;      // 강체 막대 — 반경 방향 속도 제거(진자화)
  bvx -= vr * rux; bvy -= vr * ruy;
}
function collideBody(h) {
  for (var i = 0; i < rocks.length; i++) {
    var r = rocks[i];
    if (r.y > by + 200 || r.y + r.h < by - 200) continue;
    var px = clamp(bx, r.x, r.x + r.w), py = clamp(by, r.y, r.y + r.h);
    var ddx = bx - px, ddy = by - py, d2 = ddx * ddx + ddy * ddy;
    if (d2 >= BR * BR) continue;
    var nx, ny, d;
    if (d2 > 0.000001) { d = Math.sqrt(d2); nx = ddx / d; ny = ddy / d; }
    else {                               // 중심이 내부 — 최소 침투축으로 탈출
      var lP = bx - r.x, rP = r.x + r.w - bx, tP = by - r.y, bP = r.y + r.h - by;
      var mP = Math.min(Math.min(lP, rP), Math.min(tP, bP));
      nx = 0; ny = 0;
      if (mP === tP) ny = -1; else if (mP === bP) ny = 1;
      else if (mP === lP) nx = -1; else nx = 1;
      d = -mP;
    }
    bx += nx * (BR - d); by += ny * (BR - d);
    var vn = bvx * nx + bvy * ny;
    if (vn < 0) {
      if (vn < -HARD_LAND) dust();
      bvx -= nx * vn * (1 + REST);
      bvy -= ny * vn * (1 + REST);
    }
    var tx2 = -ny, ty2 = nx;
    var vt = bvx * tx2 + bvy * ty2;
    var keep = Math.max(0, 1 - (r.ice ? FR_ICE : FR_ROCK) * 60 * h);
    var dv = vt * (1 - keep);
    bvx -= tx2 * dv; bvy -= ty2 * dv;
    bodyContact = true;
    if (r.summit && ny < -0.5) summitHit = true;
  }
}
function tryAnchor(cxp, cyp, r) {
  // 면 판정 — 직전 샘플(tx,ty)이 바깥에 있던 면 기준. 밑면은 걸 수 없다.
  var nx = 0, ny = 0, axx = cxp, ayy = cyp;
  if (ty <= r.y) { ny = -1; ayy = r.y; axx = clamp(cxp, r.x + 1, r.x + r.w - 1); }
  else if (ty >= r.y + r.h) return;
  else if (tx <= r.x) { nx = -1; axx = r.x; ayy = clamp(cyp, r.y + 2, r.y + r.h - 2); }
  else { nx = 1; axx = r.x + r.w; ayy = clamp(cyp, r.y + 2, r.y + r.h - 2); }
  // 모서리 스냅(관대) — 윗모서리 근처면 립 위에 건다
  if (hyp(axx - r.x, ayy - r.y) < SNAP) { axx = r.x + 1; ayy = r.y; nx = 0; ny = -1; }
  else if (hyp(axx - (r.x + r.w), ayy - r.y) < SNAP) { axx = r.x + r.w - 1; ayy = r.y; nx = 0; ny = -1; }
  anch = true; ax = axx; ay = ayy; aNx = nx; aNy = ny;
  aIce = r.ice; aRect = r;
  tx = ax; ty = ay;
  spark();
}
function moveTip(ttx, tty, h) {
  var dx = ttx - tx, dy = tty - ty, dl = hyp(dx, dy);
  if (dl < 0.001) return;
  var maxD = TIPV * h;
  if (dl > maxD) { dx *= maxD / dl; dy *= maxD / dl; dl = maxD; }
  var steps = Math.max(1, Math.ceil(dl / 5));   // 얇은 돌기 관통 방지 샘플링
  var sx = dx / steps, sy = dy / steps;
  for (var s = 0; s < steps; s++) {
    var nx = tx + sx, ny = ty + sy;
    var hit = rockAt(nx, ny);
    if (hit) {
      if (noGrab <= 0) tryAnchor(nx, ny, hit);
      return;                                    // 표면에서 정지
    }
    tx = nx; ty = ny;
  }
}
function physicsStep(h) {
  simT += h;
  var mwx = mcx, mwy = mcy + camY;               // 마우스 → 월드 좌표(카메라 x 고정)
  var dx = mwx - bx, dy = mwy - by, L = hyp(dx, dy);
  if (L < 1) { dx = 0; dy = 1; L = 1; }
  var ux = dx / L, uy = dy / L;
  var ttx = bx + ux * ROD, tty = by + uy * ROD;  // 피켈 목표점(고정 막대 = 도달 반경)
  bodyContact = false;
  if (noGrab > 0) noGrab -= h;
  var alt = (GROUND_Y - by) / PXM;
  gWind = windAt(simT, alt);

  if (anch) {
    // 해제 — 면 바깥으로 뽑거나(위쪽 성분 동반) 강하게 위로 튕길 때
    var pdx = ttx - ax, pdy = tty - ay, pl = hyp(pdx, pdy);
    if (pl > 26) {
      var pux = pdx / pl, puy = pdy / pl;
      var outd = pux * aNx + puy * aNy;
      if ((outd > 0.4 && puy < 0.1) || puy < -0.75) { anch = false; noGrab = 0.1; }
    }
    if (anch && aIce && aNy === 0) {             // 빙벽 측면 — 피켈이 서서히 미끄러진다
      ay += ICE_SLIP * h;
      if (aRect && ay > aRect.y + aRect.h) { anch = false; noGrab = 0.12; }
    }
  }

  if (anch) {
    // 앵커 고정: 몸 = 입력 스프링(힘 상한) + 중력, 이후 막대/지형 제약 반복
    var wantX = ax - ux * ROD, wantY = ay - uy * ROD;
    var fx = (wantX - bx) * K_SPR, fy = (wantY - by) * K_SPR;
    var fl = hyp(fx, fy);
    if (fl > FMAX) { fx *= FMAX / fl; fy *= FMAX / fl; }
    bvx += (fx + gWind * 0.4) * h;
    bvy += (fy + GRAV) * h;
    var dm = Math.exp(-DAMP_A * h);
    bvx *= dm; bvy *= dm;
    bx += bvx * h; by += bvy * h;
    for (var it = 0; it < 3; it++) { rodProject(); collideBody(h); }
    tx = ax; ty = ay;
  } else {
    // 자유 낙하/지상 — 피켈은 목표점을 향해 스윙하다 걸리면 앵커
    bvy += GRAV * h;
    bvx += gWind * h;
    var am = Math.exp(-DRAG_AIR * h);
    bvx *= am; bvy *= am;
    bx += bvx * h; by += bvy * h;
    collideBody(h); collideBody(h);
    moveTip(ttx, tty, h);
  }

  // 경계
  if (bx < BR) { bx = BR; if (bvx < 0) bvx = 0; }
  if (bx > VW - BR) { bx = VW - BR; if (bvx > 0) bvx = 0; }
  if (by < 40) { by = 40; if (bvy < 0) bvy = 0; }

  // 고도/낙하 추적 — 지지 회복 시점에 낙하 확정
  alt = (GROUND_Y - by) / PXM;
  if (alt < 0) alt = 0;
  if (alt > peakAlt) peakAlt = alt;
  var supported = anch || bodyContact;
  if (supported) {
    if (airborne) {
      var drop = airPeak - alt;
      if (drop >= 5) {
        cumFall += drop;
        if (drop >= 15) showQuote(drop);
      }
      airborne = false;
    }
  } else if (!airborne) { airborne = true; airPeak = alt; }
  else if (alt > airPeak) airPeak = alt;
}
/* ── 렌더 ── */
function drawWorld(tNow, dtDraw) {
  var i, r, sy;
  // 카메라 — 몸을 화면 58% 지점에 두고 부드럽게 추적
  var target = clamp(by - VH * 0.58, 0, WORLD_H - VH);
  camY += (target - camY) * Math.min(1, dtDraw * 8);
  var alt = (GROUND_Y - by) / PXM;

  cx.fillStyle = '#0c1424';
  cx.fillRect(0, 0, VW, VH);

  // 별 (패럴랙스)
  cx.fillStyle = '#dde6f2';
  for (i = 0; i < stars.length; i++) {
    var st = stars[i];
    sy = st.y - camY * 0.45;
    if (sy < -2 || sy > VH + 2) continue;
    cx.globalAlpha = st.a;
    cx.fillRect(st.x, sy, st.s, st.s);
  }
  cx.globalAlpha = 1;

  // 고도선(25m) + 구간 라벨
  cx.font = '11px "Courier New",monospace';
  for (var m2 = 25; m2 <= 300; m2 += 25) {
    var wy = GROUND_Y - m2 * PXM - camY;
    if (wy < -10 || wy > VH + 10) continue;
    cx.fillStyle = 'rgba(219,228,240,.07)';
    cx.fillRect(0, wy, VW, 1);
    cx.fillStyle = 'rgba(219,228,240,.3)';
    cx.fillText(m2 + 'm', VW - 46, wy - 4);
  }
  cx.font = 'bold 13px "Courier New",monospace';
  for (i = 0; i < SECTIONS.length; i++) {
    sy = GROUND_Y - SECTIONS[i].a * PXM - camY;
    if (sy < -10 || sy > VH + 10) continue;
    cx.fillStyle = 'rgba(219,228,240,.22)';
    cx.fillText('· ' + TR(SECTIONS[i].k), 14, sy);
  }

  // 지형
  for (i = 0; i < rocks.length; i++) {
    r = rocks[i];
    sy = r.y - camY;
    if (sy > VH || sy + r.h < 0) continue;
    if (r.ice) {
      cx.fillStyle = '#153649';
      cx.fillRect(r.x, sy, r.w, r.h);
      cx.fillStyle = 'rgba(14,165,233,.22)';
      cx.fillRect(r.x + 5, sy, 7, r.h);
      cx.fillRect(r.x + r.w - 16, sy, 5, r.h);
      cx.fillStyle = '#7dd0f7';
      cx.fillRect(r.x, sy, r.w, 3);
    } else {
      cx.fillStyle = '#3a4763';
      cx.fillRect(r.x, sy, r.w, r.h);
      cx.fillStyle = '#4d5c80';
      cx.fillRect(r.x, sy, r.w, 5);
      if (r.h > 14) {
        cx.fillStyle = '#2b3550';
        cx.fillRect(r.x, sy + r.h - 5, r.w, 5);
      }
    }
    if (r.summit) {
      var fx2 = r.x + r.w / 2;
      cx.fillStyle = '#cbd5e1';
      cx.fillRect(fx2 - 1, sy - 58, 3, 58);
      cx.fillStyle = '#22c55e';
      cx.beginPath();
      cx.moveTo(fx2 + 2, sy - 58);
      cx.lineTo(fx2 + 40 + Math.sin(tNow * 5) * 4, sy - 48);
      cx.lineTo(fx2 + 2, sy - 38);
      cx.closePath();
      cx.fill();
    }
  }

  // 고고도 어둠 (폭풍 접근)
  var deep = clamp(1 - camY / (WORLD_H - VH), 0, 1);
  if (deep > 0.55) {
    cx.fillStyle = 'rgba(4,8,18,' + ((deep - 0.55) * 0.5).toFixed(3) + ')';
    cx.fillRect(0, 0, VW, VH);
  }

  // 베이스캠프
  var gy = GROUND_Y - camY;
  if (gy < VH + 40) {
    cx.fillStyle = '#1a2238';
    cx.beginPath(); cx.moveTo(120, gy); cx.lineTo(160, gy - 52); cx.lineTo(200, gy); cx.closePath(); cx.fill();
    cx.strokeStyle = '#0ea5e9'; cx.lineWidth = 2; cx.stroke();
    var flick = 0.75 + Math.sin(tNow * 9) * 0.25;
    cx.fillStyle = 'rgba(234,179,8,' + (0.5 * flick).toFixed(3) + ')';
    cx.beginPath(); cx.arc(250, gy - 8, 10 * flick + 4, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#ef4444';
    cx.fillRect(246, gy - 11, 8, 8);
  }

  // 파티클 (월드 좌표)
  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life -= dtDraw * 1.6;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dtDraw; p.y += p.vy * dtDraw; p.vy += 700 * dtDraw;
    cx.globalAlpha = clamp(p.life, 0, 1);
    cx.fillStyle = p.c;
    cx.fillRect(p.x, p.y - camY, 3, 3);
  }
  cx.globalAlpha = 1;

  // 폭풍 구간 — 눈보라 + 돌풍 줄무늬
  if (camY < STORM_Y) {
    while (flakes.length < 90) flakes.push({ x: Math.random() * VW, y: Math.random() * VH, v: 60 + Math.random() * 90 });
    cx.fillStyle = '#dde6f2';
    cx.globalAlpha = 0.55;
    for (i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.x += gWind * 0.55 * dtDraw; f.y += f.v * dtDraw;
      if (f.y > VH) { f.y = -3; f.x = Math.random() * VW; }
      if (f.x > VW) f.x -= VW;
      if (f.x < 0) f.x += VW;
      cx.fillRect(f.x, f.y, 2, 2);
    }
    cx.globalAlpha = 1;
    if (Math.abs(gWind) > 170) {
      cx.strokeStyle = 'rgba(125,208,247,.12)';
      cx.lineWidth = 1.5;
      for (i = 0; i < 6; i++) {
        var lx = (tNow * 260 + i * 149) % (VW + 120) - 60;
        var ly = (i * 83 + 40) % VH;
        cx.beginPath(); cx.moveTo(lx, ly); cx.lineTo(lx + gWind * 0.3, ly + 7); cx.stroke();
      }
    }
  } else if (flakes.length) flakes.length = 0;

  // 등반가
  var sbx = bx, sby = by - camY;
  var stx = tx, sty = ty - camY;
  var adx = stx - sbx, ady = sty - sby, al = hyp(adx, ady) || 1;
  var aux = adx / al, auy = ady / al;
  var pux = -auy, puy = aux;
  if (puy > 0) { pux = -pux; puy = -puy; }       // 팔꿈치는 위쪽으로 굽힘
  var ex = (sbx + stx) / 2 + pux * 12, ey = (sby + sty) / 2 + puy * 12;
  cx.lineCap = 'round';
  cx.strokeStyle = '#94a3b8'; cx.lineWidth = 3.5;
  cx.beginPath();
  cx.moveTo(sbx + aux * 10, sby + auy * 10);
  cx.lineTo(ex, ey);
  cx.lineTo(stx - aux * 16, sty - auy * 16);
  cx.stroke();
  cx.strokeStyle = '#cbd5e1'; cx.lineWidth = 3;  // 피켈 자루 + 날
  cx.beginPath(); cx.moveTo(stx - aux * 22, sty - auy * 22); cx.lineTo(stx, sty); cx.stroke();
  cx.beginPath(); cx.moveTo(stx - pux * 9, sty - puy * 9); cx.lineTo(stx + pux * 5, sty + puy * 5); cx.stroke();
  cx.fillStyle = '#ef4444';                      // 그립 테이프
  cx.fillRect(stx - aux * 22 - 2, sty - auy * 22 - 2, 4, 4);
  if (anch) {
    cx.beginPath(); cx.arc(stx, sty, 5.5, 0, Math.PI * 2);
    cx.strokeStyle = 'rgba(234,179,8,.8)'; cx.lineWidth = 2; cx.stroke();
  }
  cx.beginPath(); cx.arc(sbx, sby, BR, 0, Math.PI * 2);   // 몸통(재킷)
  cx.fillStyle = '#eab308'; cx.fill();
  cx.lineWidth = 2; cx.strokeStyle = '#8a6d06'; cx.stroke();
  cx.beginPath(); cx.arc(sbx, sby - 1, BR - 2, Math.PI * 1.02, Math.PI * 1.98);  // 헬멧
  cx.fillStyle = '#0ea5e9'; cx.fill();
  var edx = mcx - sbx, edy = mcy - sby, el = hyp(edx, edy) || 1;   // 시선 = 마우스 방향
  var eux = edx / el, euy = edy / el;
  cx.fillStyle = '#0c1424';
  cx.fillRect(sbx + eux * 5 - 4, sby + euy * 4 + 0.5, 3, 3.5);
  cx.fillRect(sbx + eux * 5 + 2, sby + euy * 4 + 0.5, 3, 3.5);

  // 피켈 목표 표식
  if (running) {
    var gdx = mcx - sbx, gdy = mcy - sby, gl = hyp(gdx, gdy) || 1;
    cx.beginPath();
    cx.arc(sbx + gdx / gl * ROD, sby + gdy / gl * ROD, 5, 0, Math.PI * 2);
    cx.strokeStyle = 'rgba(14,165,233,.35)'; cx.lineWidth = 1.5; cx.stroke();
  }

  // HUD
  if (running) {
    $('altTxt').textContent = '⛏ ' + Math.round(alt) + 'm';
    $('peakTxt').textContent = '▲ ' + Math.round(peakAlt) + 'm';
    $('fallTxt').textContent = '↘ ' + Math.round(cumFall) + 'm';
    $('timeTxt').textContent = '⏱ ' + mmss(timeS);
  }
}

/* ── 입력 — 마우스/터치 포인터 통일 ── */
function toCanvas(e) {
  var r = cv.getBoundingClientRect();
  mcx = (e.clientX - r.left) * (VW / r.width);
  mcy = (e.clientY - r.top) * (VH / r.height);
}
cv.addEventListener('pointermove', function (e) { e.preventDefault(); toCanvas(e); });
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); toCanvas(e); });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ── 낙하 명언 토스트 ── */
function showQuote(drop) {
  var el = $('toast');
  el.textContent = TR('toastFall').replace('{m}', String(Math.round(drop))) + ' — ' + TR('q' + qIdx);
  qIdx = (qIdx + 1) % 10;
  el.hidden = false;
  el.style.opacity = '1';
  clearTimeout(toastT1); clearTimeout(toastT2);
  toastT1 = setTimeout(function () { el.style.opacity = '0'; }, 3800);
  toastT2 = setTimeout(function () { el.hidden = true; }, 4400);
}

/* ── 기록 ── */
var BEST_KEY = 'cliff_climber_best';
function loadBest() {
  try {
    var b = JSON.parse(localStorage.getItem(BEST_KEY));
    if (b) return { alt: b.alt || 0, score: b.score || 0, summits: b.summits || 0, runs: b.runs || 0 };
  } catch (e) {}
  return { alt: 0, score: 0, summits: 0, runs: 0 };
}
var best = loadBest();
function saveBest() { try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {} }
function refreshMenuBest() {
  $('bestTxt').textContent = best.runs > 0
    ? TR('bestLine').replace('{a}', String(Math.round(best.alt))).replace('{s}', best.score.toLocaleString())
        .replace('{c}', String(best.summits)).replace('{r}', String(best.runs))
    : '';
}
function mmss(t) {
  var m = Math.floor(t / 60), s = Math.floor(t) % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

/* ── 시작/종료 ── */
function start() {
  bx = SPAWN_X; by = GROUND_Y - BR; bvx = 0; bvy = 0;
  tx = bx; ty = by - ROD;
  anch = false; noGrab = 0; bodyContact = false; summitHit = false;
  airborne = false; airPeak = 0; peakAlt = 0; cumFall = 0;
  timeS = 0; simT = 0; gWind = 0; accT = 0;
  parts.length = 0;
  qIdx = Math.floor(Math.random() * 10);
  camY = WORLD_H - VH;
  mcx = VW / 2; mcy = 0;
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false;
  running = true;
}
function finish(summit) {
  running = false;
  var sc = Math.round(peakAlt * 10) + (summit ? 20000 : 0) - Math.floor(timeS / 2);
  if (sc < 0) sc = 0;
  best.runs++;
  if (summit) best.summits++;
  if (peakAlt > best.alt) best.alt = peakAlt;
  if (sc > best.score) best.score = sc;
  saveBest();
  $('endTitle').textContent = TR(summit ? 'endSummit' : 'endGiveUp');
  $('endDesc').textContent = TR(summit ? 'endDescSummit' : 'endDescGiveUp')
    .replace('{a}', String(Math.round(peakAlt))).replace('{t}', mmss(timeS))
    .replace('{f}', String(Math.round(cumFall))).replace('{s}', sc.toLocaleString());
  $('hud').hidden = true; $('endPanel').hidden = false;
  var tEl = $('toast'); tEl.hidden = true; tEl.style.opacity = '0';
  var detail = summit
    ? TR('detailSummit').replace('{t}', mmss(timeS))
    : TR('detailBest').replace('{m}', String(Math.round(peakAlt)));
  GameRank.submit('cliff-climber', sc, detail).then(function (res) {
    if (res && res.applied) $('endDesc').textContent += TR('rankMsg').replace('{n}', res.rank);
  });
}
function askGiveUp() {
  if (running && confirm(TR('confirmGiveUp'))) finish(false);
}
$('startBtn').onclick = start;
$('againBtn').onclick = start;
$('giveUpBtn').onclick = askGiveUp;
$('backBtn').onclick = function () {
  $('endPanel').hidden = true; $('menu').hidden = false;
  refreshMenuBest();
};
addEventListener('keydown', function (ev) { if (ev.key === 'Escape') askGiveUp(); });

/* ── 메인 루프 — 60fps 렌더 + 120Hz 물리 서브스텝 ── */
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  var dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (running) {
    timeS += dt;
    accT += dt;
    var n = 0;
    while (accT >= STEP && n < 6) { physicsStep(STEP); accT -= STEP; n++; }
    if (summitHit && running) finish(true);
  }
  drawWorld(ts / 1000, dt);
}
buildTerrain();
refreshMenuBest();
requestAnimationFrame(frame);
</script>
<!-- 레이아웃 전용: 조이스틱 없이 상단 정렬 + 하단 여백 + 캔버스 비율 맞춤만 쓴다.
     입력 방식은 게임이 이미 가진 것을 그대로 둔다. -->
<script src="../lib/touch.js" data-stick="off"></script>
<script src="../lib/rank.js"></script>
<script>
GameRank.autoPanel('cliff-climber');
</script>
</body>
