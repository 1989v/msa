<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강철 결사대</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0a0e14 ; color:#e2e8f0; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1f2a3a; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.7); }
  canvas { display:block; background:#182030; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:12px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(6,10,18,.65); padding:3px 10px; border-radius:10px; }
  #hud .grow { flex:1; }
  #banner { position:absolute; top:40%; left:0; right:0; text-align:center; font-size:26px; font-weight:bold;
            color:#8fd0ff; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .3s; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(8,12,20,.96); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:12px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#8fd0ff; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#bccadc; line-height:1.75; max-width:520px; }
  .panel button { background:#4a9ad6; color:#0a1420; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1f2a3a; color:#e2e8f0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #saveStatus { font-size:10.5px; color:#7a8aa0; }
  #info { margin-top:9px; font-size:11px; color:#5a6a80; text-align:center; line-height:1.7; }
  input { background:#121a28; border:1px solid #1f2a3a; color:#e2e8f0; border-radius:6px; padding:6px 9px;
          font-family:inherit; font-size:12px; letter-spacing:1px; width:165px; text-transform:uppercase; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="840" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="stageTxt"></span>
    <span class="tag" id="foeCnt"></span>
    <span class="grow"></span>
    <span class="tag" id="unitTxt"></span>
  </div>
  <div id="banner"></div>
  <div class="panel" id="menu">
    <h1>⚔ 강철 결사대</h1>
    <p>보급도 지원도 없다 — <b>주어진 넷</b>으로 몰려오는 무리를 잡아내라.
       <b>유닛을 클릭(또는 1~4)해 선택</b>하고, 땅을 클릭해 움직인다. 서 있는 유닛은 사거리 안 적을 자동 공격한다.
       궁수는 <b>치고 빠지고</b>, 기사가 막고, 사제가 살린다. 죽은 대원은 돌아오지 않는다. <b>10스테이지</b>.</p>
    <div id="saveStatus"></div>
    <div class="row">
      <input id="codeInput" placeholder="이어하기 코드" maxlength="18" autocomplete="off">
      <button id="codeLoadBtn" class="ghost">🔑 코드로 불러오기</button>
    </div>
    <div class="row"><span id="codeShow" style="font-size:11px;color:#8fd0ff;letter-spacing:2px"></span></div>
    <div class="row"><span id="bestTxt" style="font-size:12px;color:#7a8aa0"></span></div>
    <button id="startBtn">▶ 출정</button>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <button id="backBtn">처음으로</button>
  </div>
</div>
<div id="info">유닛 클릭/1~4 = 선택 · 땅 클릭 = 이동 (이동 중엔 공격 불가 — 멈춰야 쏜다) · Esc = 선택 해제<br>
  스테이지 사이에 생존자는 절반 회복 · 🛡 기사: 근접 방벽 · 🏹 궁수 ×2: 원거리 · ✚ 사제: 주변 치유</div>
<script>
'use strict';
const API = '/api/v1/games/iron-vanguard';
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = cv.width, VH = cv.height;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random(), ri = n => Math.floor(Math.random() * n);

/* ── 플랫폼 연동 (이어하기 코드 세이브) ── */
const token = () => localStorage.getItem('portal_access_token');
function deviceId() {
  let id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
async function api(path, opt = {}) {
  const headers = { 'Content-Type':'application/json', 'X-Device-Id':deviceId(), ...(opt.headers || {}) };
  const tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
  const res = await fetch(API + path, { ...opt, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.success === false) throw new Error(body?.error?.code || res.status);
  return body.data;
}
const CODE_KEY = 'iron_vanguard_code', LOCAL_KEY = 'iron_vanguard_save';
let saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
const fmtCode = c => c ? c.replace(/(.{4})(?=.)/g, '$1-') : '';
let meta = { best: 0, clears: 0 };
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }
async function loadMeta(codeOverride) {
  const code = codeOverride || saveCode;
  if (token() || code) {
    try {
      const s = await api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''));
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (s.data) meta = { best:0, clears:0, ...s.data };
      $('saveStatus').textContent = '☁ 서버 세이브 (v' + saveVersion + ')';
      showCode(); return true;
    } catch (e) { $('saveStatus').textContent = '세이브 로드 실패: ' + e.message; if (codeOverride) return false; }
  }
  try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d) meta = { ...meta, ...d }; } catch (_) {}
  $('saveStatus').textContent = '브라우저 저장 — 저장하면 이어하기 코드가 발급됩니다';
  showCode(); return true;
}
async function persistMeta() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(meta));
  try {
    const s = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
    saveVersion = s.version;
    if (s.code && s.code !== saveCode) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
    showCode();
  } catch (e) {
    if (e.message === 'INVALID_INPUT') {
      try {
        const re = await api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''));
        saveVersion = re.version;
        const s2 = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
        saveVersion = s2.version;
      } catch (_) {}
    }
  }
}

/* ── 유닛 정의 ── */
const ALLY_DEFS = {
  knight: { name:'기사',  emoji:'🛡', hp:240, dmg:15, rate:0.85, range:30,  spd:96,  r:14, color:'#8fa8c8' },
  archer: { name:'궁수',  emoji:'🏹', hp:85,  dmg:11, rate:0.62, range:195, spd:108, r:11, color:'#8fc89a' },
  priest: { name:'사제',  emoji:'✚',  hp:95,  dmg:0,  rate:0.8,  range:150, spd:102, r:11, color:'#e8d48a', heal:13 },
};
const FOE_DEFS = {
  wolf:    { name:'늑대',   hp:26,  dmg:6,  rate:0.8, range:24, spd:130, r:12, color:'#7a7268' },
  spear:   { name:'창병',   hp:55,  dmg:9,  rate:0.9, range:34, spd:78,  r:13, color:'#a8825a' },
  berserk: { name:'광전사', hp:110, dmg:16, rate:1.0, range:28, spd:88,  r:14, color:'#c25a4a' },
  shaman:  { name:'무당',   hp:45,  dmg:10, rate:1.7, range:170, spd:60, r:12, color:'#9a6ac8', shoot:true },
  giant:   { name:'거인',   hp:600, dmg:30, rate:1.4, range:40, spd:52,  r:22, color:'#6a5a48' },
};
const STAGES = [
  { wolf:5 },
  { wolf:6, spear:2 },
  { wolf:4, spear:4, shaman:1 },
  { spear:5, berserk:2, shaman:2 },
  { giant:1, wolf:6 },
  { wolf:8, berserk:3, shaman:2 },
  { spear:6, berserk:4, shaman:3 },
  { berserk:6, shaman:4 },
  { wolf:10, berserk:4, shaman:3, spear:4 },
  { giant:2, berserk:4, shaman:4 },
];
let G = null, running = false, selectedIdx = -1;
let bannerT = 0, shake = 0;

function mkAlly(kind, x, y) {
  const d = ALLY_DEFS[kind];
  return { kind, ...d, x, y, hp:d.hp, maxHp:d.hp, cd:0, hurt:0, order:null };
}
function newGame() {
  G = { stage: 0, allies: [
      mkAlly('knight', 380, 240), mkAlly('archer', 320, 190),
      mkAlly('archer', 320, 290), mkAlly('priest', 280, 240),
    ], foes: [], shots: [], parts: [], spawnQueue: [], spawnT: 0, stageClearT: 0 };
}
function banner(text) { $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1600; }
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, s = spd * (0.4 + rnd() * 0.8);
    G.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color, size:2 + rnd()*3 });
  }
}
function popText(x, y, text, color) { G.parts.push({ x, y, vx:0, vy:-28, life:1, text, color }); }

function startStage() {
  G.stage++;
  const comp = STAGES[G.stage - 1], q = [];
  Object.entries(comp).forEach(([k, n]) => { for (let i = 0; i < n; i++) q.push(k); });
  // 스폰 순서 섞기
  for (let i = q.length - 1; i > 0; i--) { const j = ri(i + 1); [q[i], q[j]] = [q[j], q[i]]; }
  G.spawnQueue = q; G.spawnT = 0.5;
  banner('스테이지 ' + G.stage + ' / ' + STAGES.length);
}
function spawnFoe(kind) {
  const d = FOE_DEFS[kind], sc = 1 + (G.stage - 1) * 0.09;
  // 가장자리 4방향 중 무작위
  const side = ri(4);
  const x = side === 0 ? -16 : side === 1 ? VW + 16 : rnd() * VW;
  const y = side === 2 ? -16 : side === 3 ? VH + 16 : rnd() * VH;
  G.foes.push({ kind, x, y, hp: Math.round(d.hp * sc), maxHp: Math.round(d.hp * sc),
    dmg: Math.round(d.dmg * sc), rate: d.rate, range: d.range, spd: d.spd, r: d.r,
    shoot: !!d.shoot, cd: rnd() * 0.5, hurt: 0 });
}

/* ── 갱신 ── */
function update(dt) {
  if (G.spawnQueue.length) {
    G.spawnT -= dt;
    if (G.spawnT <= 0) { G.spawnT = 0.7; spawnFoe(G.spawnQueue.shift()); }
  } else if (!G.foes.length && running) {
    if (G.stage >= STAGES.length) { endGame(true); return; }
    G.stageClearT += dt;
    if (G.stageClearT > 1.4) {
      G.stageClearT = 0;
      G.allies.forEach(a => { a.hp = Math.min(a.maxHp, a.hp + a.maxHp * 0.5); a.order = null; });
      popText(VW/2, 180, '생존자 절반 회복', '#8fc89a');
      startStage();
    }
  }
  // 아군
  for (const a of [...G.allies]) {
    a.hurt = Math.max(0, a.hurt - dt); a.cd = Math.max(0, a.cd - dt);
    if (a.order) {                                        // 이동 명령 — 이동 중엔 공격하지 않는다
      const dx = a.order.x - a.x, dy = a.order.y - a.y, d = Math.hypot(dx, dy);
      if (d < 5) a.order = null;
      else { a.x += dx / d * a.spd * dt; a.y += dy / d * a.spd * dt; continue; }
    }
    if (a.kind === 'priest') {                             // 사제 — 가장 아픈 아군 치유
      if (a.cd <= 0) {
        let best = null, worst = 1;
        for (const o of G.allies) { if (o === a) continue;
          const ratio = o.hp / o.maxHp;
          if (ratio < worst && (o.x - a.x) ** 2 + (o.y - a.y) ** 2 < a.range ** 2) { worst = ratio; best = o; } }
        if (best) { a.cd = a.rate;
          best.hp = Math.min(best.maxHp, best.hp + a.heal);
          G.parts.push({ x:a.x, y:a.y, vx:0, vy:0, life:0.45, bolt:{ tx:best.x, ty:best.y }, color:'#e8d48a' });
          burst(best.x, best.y - 10, '#e8d48a', 3, 40);
        }
      }
      continue;
    }
    if (a.cd <= 0) {                                       // 자동 공격
      let best = null, bd = a.range * a.range;
      for (const f of G.foes) { const q = (f.x - a.x) ** 2 + (f.y - a.y) ** 2; if (q < bd) { bd = q; best = f; } }
      if (best) {
        a.cd = a.rate;
        if (a.range > 60) {
          const ang = Math.atan2(best.y - a.y, best.x - a.x);
          G.shots.push({ x:a.x, y:a.y, vx:Math.cos(ang)*420, vy:Math.sin(ang)*420, dmg:a.dmg, life:0.8, ally:true });
        } else {
          best.hp -= a.dmg; best.hurt = 0.15;
          burst(best.x, best.y, '#e2e8f0', 5, 90);
          if (best.hp <= 0) killFoe(best);
        }
      }
    }
  }
  // 적
  for (const f of [...G.foes]) {
    f.hurt = Math.max(0, f.hurt - dt); f.cd = Math.max(0, f.cd - dt);
    let target = null, bd = Infinity;
    for (const a of G.allies) { const q = (a.x - f.x) ** 2 + (a.y - f.y) ** 2; if (q < bd) { bd = q; target = a; } }
    if (!target) break;
    const d = Math.sqrt(bd);
    if (f.shoot && d < f.range) {
      if (f.cd <= 0) { f.cd = f.rate;
        const ang = Math.atan2(target.y - f.y, target.x - f.x);
        G.shots.push({ x:f.x, y:f.y, vx:Math.cos(ang)*260, vy:Math.sin(ang)*260, dmg:f.dmg, life:1.6, ally:false }); }
    } else if (d > f.range) {
      f.x += (target.x - f.x) / d * f.spd * dt; f.y += (target.y - f.y) / d * f.spd * dt;
    } else if (f.cd <= 0) {
      f.cd = f.rate;
      hurtAlly(target, f.dmg, f.x, f.y);
    }
  }
  // 탄
  for (const s of [...G.shots]) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) { G.shots = G.shots.filter(o => o !== s); continue; }
    if (s.ally) {
      const f = G.foes.find(o => (o.x - s.x) ** 2 + (o.y - s.y) ** 2 < (o.r + 4) ** 2);
      if (f) { f.hp -= s.dmg; f.hurt = 0.14; burst(s.x, s.y, '#8fc89a', 4, 70);
        G.shots = G.shots.filter(o => o !== s); if (f.hp <= 0) killFoe(f); }
    } else {
      const a = G.allies.find(o => (o.x - s.x) ** 2 + (o.y - s.y) ** 2 < (o.r + 4) ** 2);
      if (a) { G.shots = G.shots.filter(o => o !== s); hurtAlly(a, s.dmg, s.x, s.y); }
    }
  }
  for (const q of [...G.parts]) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.text || q.bolt ? 0 : 170) * dt;
    q.life -= dt * (q.text ? 1.05 : q.bolt ? 2.2 : 1.9);
    if (q.life <= 0) G.parts = G.parts.filter(o => o !== q);
  }
  shake = Math.max(0, shake - dt * 30);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}
function killFoe(f) {
  if (!G.foes.includes(f)) return;
  burst(f.x, f.y, FOE_DEFS[f.kind].color, 12, 140);
  G.foes = G.foes.filter(o => o !== f);
}
function hurtAlly(a, dmg, fx, fy) {
  a.hp -= dmg; a.hurt = 0.2;
  burst(a.x, a.y, '#ff6b6b', 6, 100);
  if (a.hp <= 0) {
    burst(a.x, a.y, '#ffffff', 18, 160); shake = 10;
    popText(a.x, a.y - 16, a.name + ' 전사…', '#ff6b6b');
    const idx = G.allies.indexOf(a);
    G.allies = G.allies.filter(o => o !== a);
    if (selectedIdx === idx) selectedIdx = -1;
    if (!G.allies.length) endGame(false);
  }
}

/* ── 렌더 ── */
function draw() {
  const sx = shake ? (rnd() - 0.5) * shake : 0, sy = shake ? (rnd() - 0.5) * shake : 0;
  cx.save(); cx.translate(sx, sy);
  cx.fillStyle = '#182030'; cx.fillRect(-8, -8, VW + 16, VH + 16);
  for (let y = 0; y < VH; y += 40) for (let x = 0; x < VW; x += 40)
    if (((x + y) / 40) % 2 === 0) { cx.fillStyle = 'rgba(255,255,255,.018)'; cx.fillRect(x, y, 40, 40); }
  // 이동 명령 마커
  for (const a of G.allies) if (a.order) {
    cx.strokeStyle = 'rgba(143,208,255,.4)'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.arc(a.order.x, a.order.y, 8, 0, 7); cx.stroke();
  }
  // 아군
  G.allies.forEach((a, i) => {
    if (i === selectedIdx) {
      cx.strokeStyle = '#8fd0ff'; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(a.x, a.y, a.r + 6, 0, 7); cx.stroke();
      if (a.range > 60) { cx.strokeStyle = 'rgba(143,208,255,.16)';
        cx.beginPath(); cx.arc(a.x, a.y, a.range, 0, 7); cx.stroke(); }
    }
    cx.save(); if (a.hurt > 0) cx.filter = 'brightness(2.3)';
    cx.fillStyle = a.color;
    cx.beginPath(); cx.arc(a.x, a.y, a.r, 0, 7); cx.fill();
    cx.restore();
    cx.font = (a.r + 4) + 'px monospace'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(a.emoji, a.x, a.y + 1);
    cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(a.x - 15, a.y - a.r - 10, 30, 4);
    cx.fillStyle = a.hp / a.maxHp > 0.35 ? '#6bd18a' : '#e0913f';
    cx.fillRect(a.x - 15, a.y - a.r - 10, 30 * (a.hp / a.maxHp), 4);
    cx.font = 'bold 9px monospace'; cx.fillStyle = '#8fd0ff'; cx.fillText(String(i + 1), a.x, a.y - a.r - 16);
  });
  // 적
  for (const f of G.foes) {
    cx.save(); if (f.hurt > 0) cx.filter = 'brightness(2.3)';
    const d = FOE_DEFS[f.kind];
    cx.fillStyle = d.color;
    if (f.kind === 'wolf') { cx.beginPath(); cx.ellipse(f.x, f.y, f.r + 3, f.r - 2, 0, 0, 7); cx.fill(); }
    else { cx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2); }
    cx.fillStyle = '#ffd54a'; cx.fillRect(f.x - 4, f.y - 4, 3, 3); cx.fillRect(f.x + 2, f.y - 4, 3, 3);
    cx.restore();
    if (f.hp < f.maxHp) {
      const w = f.kind === 'giant' ? 52 : 24;
      cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(f.x - w/2, f.y - f.r - 9, w, 4);
      cx.fillStyle = '#e05c4a'; cx.fillRect(f.x - w/2, f.y - f.r - 9, w * (f.hp / f.maxHp), 4);
    }
  }
  // 탄 / 파티클
  for (const s of G.shots) {
    cx.fillStyle = s.ally ? '#c8e8a0' : '#c89aff';
    cx.save(); cx.translate(s.x, s.y); cx.rotate(Math.atan2(s.vy, s.vx)); cx.fillRect(-5, -1.5, 9, 3); cx.restore();
  }
  for (const q of G.parts) {
    cx.globalAlpha = clamp(q.life, 0, 1);
    if (q.bolt) { cx.strokeStyle = q.color; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(q.x, q.y); cx.lineTo(q.bolt.tx, q.bolt.ty); cx.stroke(); }
    else if (q.text) { cx.font = 'bold 12px monospace'; cx.textAlign = 'center'; cx.fillStyle = q.color; cx.fillText(q.text, q.x, q.y); }
    else { cx.fillStyle = q.color; cx.fillRect(q.x, q.y, q.size, q.size); }
    cx.globalAlpha = 1;
  }
  cx.restore();
  $('stageTxt').textContent = '⚔ 스테이지 ' + G.stage + '/' + STAGES.length;
  $('foeCnt').textContent = '👹 ' + (G.foes.length + G.spawnQueue.length);
  $('unitTxt').textContent = G.allies.map((a, i) =>
    (i === selectedIdx ? '[' : '') + a.emoji + Math.ceil(a.hp) + (i === selectedIdx ? ']' : '')).join(' ');
}

/* ── 입력 ── */
cv.addEventListener('click', ev => {
  if (!running) return;
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) * (VW / r.width), y = (ev.clientY - r.top) * (VH / r.height);
  const idx = G.allies.findIndex(a => (a.x - x) ** 2 + (a.y - y) ** 2 < (a.r + 8) ** 2);
  if (idx >= 0) { selectedIdx = idx; return; }
  if (selectedIdx >= 0 && G.allies[selectedIdx]) {
    G.allies[selectedIdx].order = { x, y };
  }
});
addEventListener('keydown', ev => {
  if (!running) return;
  const c = ev.code || '';
  const n = c.startsWith('Digit') ? +c.slice(5) : NaN;
  if (n >= 1 && n <= G.allies.length) selectedIdx = n - 1;
  if (ev.key === 'Escape') selectedIdx = -1;
});

/* ── 시작/종료 ── */
function startGame() {
  newGame(); running = true; selectedIdx = -1;
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false;
  startStage();
}
async function endGame(win) {
  running = false; $('hud').hidden = true;
  meta.best = Math.max(meta.best, G.stage);
  if (win) meta.clears = (meta.clears || 0) + 1;
  $('endTitle').textContent = win ? '🏆 결사대 개선!' : '💀 결사대 전멸…';
  $('endDesc').textContent = (win ? STAGES.length + '스테이지를 모두 돌파했다!' : '스테이지 ' + G.stage + ' 에서 전멸했다.') +
    ' 최고 기록 스테이지 ' + meta.best + (meta.clears ? ' · 클리어 ' + meta.clears + '회' : '');
  $('endPanel').hidden = false;
  await persistMeta();
}
let last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!running || !G) return;
  update(dt);
  if (running && G) draw();
}
requestAnimationFrame(loop);
$('startBtn').onclick = startGame;
$('backBtn').onclick = () => { $('endPanel').hidden = true; $('menu').hidden = false;
  $('bestTxt').textContent = meta.best ? '최고 기록 스테이지 ' + meta.best : ''; };
$('codeLoadBtn').onclick = async () => {
  const raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  if (await loadMeta(raw)) { saveCode = raw; localStorage.setItem(CODE_KEY, raw);
    $('bestTxt').textContent = meta.best ? '최고 기록 스테이지 ' + meta.best : ''; showCode(); }
};
loadMeta().then(() => { $('bestTxt').textContent = meta.best ? '최고 기록 스테이지 ' + meta.best : ''; });
</script>
</body>
