<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">족보 연성소</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:radial-gradient(1100px 560px at 50% -10%, #131d33, #0c1424) #0c1424; color:#e6ecf2;
         font-family:'Courier New',monospace; display:flex; flex-direction:column; align-items:center;
         min-height:100vh; user-select:none; -webkit-user-select:none; touch-action:manipulation;
         padding:12px 10px 30px; overflow-x:hidden; }
  #game { width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; }

  /* ── HUD ── */
  #hud { width:100%; background:#1a2238; border:1px solid #2c3550; border-radius:10px; padding:8px 10px 9px; }
  .hrow { display:flex; align-items:center; gap:8px; }
  .ante { color:#d4a24e; font-weight:bold; font-size:14px; }
  .goldtxt { color:#eab308; font-weight:bold; font-size:13px; }
  .sp { flex:1; }
  button.mini { background:#222b44; color:#c2cedc; border:0; border-radius:6px; padding:5px 9px;
                font-size:11px; cursor:pointer; font-family:inherit; }
  .bar-bg { height:13px; background:#0c1424; border:1px solid #2c3550; border-radius:7px;
            overflow:hidden; margin:7px 0 4px; }
  #scoreBar { height:100%; width:0%; background:linear-gradient(90deg,#0ea5e9,#22c55e); transition:width .4s; }
  .score-nums { font-size:12px; color:#8e9db0; }
  #scoreTxt { color:#e6ecf2; font-weight:bold; font-size:15px; }
  .pills { margin-top:5px; flex-wrap:wrap; }
  .pill { background:#0c1424; border:1px solid #2c3550; border-radius:12px; padding:3px 10px; font-size:11px; color:#8e9db0; }
  .pill b { font-size:12px; }
  .p-play b { color:#0ea5e9; } .p-disc b { color:#eab308; } .p-deck b { color:#c2cedc; }

  /* ── 시약 슬롯 ── */
  #rgRow { display:flex; gap:6px; justify-content:center; margin:8px 0 3px; }
  .rg-slot { width:46px; height:46px; background:#1a2238; border:1px solid #2c3550; border-radius:9px;
             display:flex; align-items:center; justify-content:center; font-size:21px; cursor:pointer; position:relative; }
  .rg-slot.empty { border-style:dashed; opacity:.32; cursor:default; }
  .rg-slot .stk { position:absolute; bottom:0; right:3px; font-size:9.5px; color:#d4a24e; font-weight:bold; }
  #rgTip { font-size:11px; color:#c2cedc; background:#10182b; border:1px solid #3a4763; border-radius:7px;
           padding:6px 10px; margin:3px 0 2px; max-width:480px; line-height:1.55; text-align:center; }
  #rgTip b { color:#d4a24e; }

  /* ── 연성대(계산 영역) ── */
  #playArea { width:100%; min-height:122px; border:1px dashed #2c3550; border-radius:10px; padding:7px 8px;
              margin:6px 0; display:flex; flex-direction:column; gap:5px; align-items:center; cursor:pointer; }
  #playedCards { display:flex; gap:4px; min-height:0; }
  .pcard { width:38px; height:52px; background:linear-gradient(160deg,#f4f7fb,#dce4ef); border-radius:5px;
           display:flex; flex-direction:column; align-items:center; justify-content:center;
           font-weight:bold; font-size:13px; line-height:1.1; box-shadow:0 2px 5px rgba(0,0,0,.45); }
  .pcard span { font-size:12px; }
  #calcSteps { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; }
  .stepc { font-size:10.5px; padding:2px 7px; border-radius:4px; background:#0c1424; border:1px solid #2c3550;
           opacity:0; transform:translateY(5px); transition:opacity .25s, transform .25s; }
  .stepc.on { opacity:1; transform:none; }
  .c-base { color:#e6ecf2; border-color:#d4a24e; }
  .c-pts { color:#0ea5e9; } .c-mult { color:#ef4444; } .c-times { color:#d4a24e; }
  .c-gold { color:#eab308; } .c-rank { color:#22c55e; }
  #calcOut { min-height:26px; font-size:14px; display:flex; align-items:baseline; gap:8px; }
  #calcExpr { color:#c2cedc; }
  #calcTotal { color:#d4a24e; font-size:21px; font-weight:bold; }

  /* ── 족보 미리보기 ── */
  #previewBar { width:100%; min-height:33px; display:flex; align-items:center; justify-content:center; gap:9px;
                font-size:12px; color:#c2cedc; background:#10182b; border:1px solid #2c3550; border-radius:8px;
                padding:5px 10px; text-align:center; flex-wrap:wrap; }
  .pv-name { color:#d4a24e; font-weight:bold; }
  .pv-tot { color:#22c55e; font-weight:bold; }
  .dim { color:#8e9db0; }

  /* ── 손패 부채꼴 ── */
  #handFan { position:relative; height:152px; width:100%; margin-top:3px; }
  .card { position:absolute; bottom:10px; width:64px; height:92px;
          background:linear-gradient(160deg,#f4f7fb,#dce4ef); border:2px solid #9aa5ba; border-radius:8px;
          cursor:pointer; transition:transform .16s, box-shadow .16s, border-color .16s;
          box-shadow:0 3px 10px rgba(0,0,0,.5); }
  .card .rk { position:absolute; top:4px; left:6px; font-size:15px; font-weight:bold; line-height:1.05; text-align:center; }
  .card .rk span { display:block; font-size:11px; }
  .card .big { position:absolute; bottom:5px; right:7px; font-size:24px; }
  .cR { color:#ef4444; } .cB { color:#232a3d; }
  .card.sel { border-color:#d4a24e; box-shadow:0 0 14px rgba(212,162,78,.55), 0 3px 10px rgba(0,0,0,.5); }
  .card .gem { position:absolute; top:5px; right:6px; width:9px; height:9px; border-radius:50%; box-shadow:0 0 5px currentColor; }
  .gem.gild { background:#d4a24e; color:#d4a24e; }
  .gem.seal { background:#ef4444; color:#ef4444; }
  .gem.holy { background:#22c55e; color:#22c55e; }

  /* ── 액션 버튼 ── */
  .acts { display:flex; gap:10px; margin-top:5px; }
  button.act { background:#0ea5e9; color:#04121c; border:0; padding:12px 20px; font-weight:bold;
               font-size:13px; border-radius:8px; cursor:pointer; font-family:inherit; }
  button.act:disabled { opacity:.35; cursor:default; }
  button.act.ghost { background:#222b44; color:#e6ecf2; }
  .act.play { background:#0ea5e9; }
  .act.disc { background:#eab308; color:#241c02; }

  /* ── 토스트 ── */
  #toast { position:fixed; top:52px; left:50%; transform:translateX(-50%); background:rgba(20,26,44,.96);
           border:1px solid #d4a24e; color:#ffe0a3; padding:6px 15px; border-radius:8px; font-size:12px;
           z-index:60; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
  #toast.on { opacity:1; }

  /* ── 패널 공통 ── */
  .panel { position:fixed; inset:0; background:rgba(9,13,24,.97); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:12px; text-align:center; z-index:10;
           padding:20px 14px; overflow:auto; }
  .panel h1 { color:#d4a24e; font-size:24px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#c2cedc; line-height:1.8; max-width:480px; }
  .panel p.small { font-size:11px; color:#8e9db0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .stat { background:#1a2238; border-radius:8px; padding:8px 14px; font-size:11.5px; color:#8e9db0; }
  .stat b { color:#0ea5e9; font-size:17px; display:block; }

  /* ── 상점 ── */
  .gbreak { font-size:12px; color:#c2cedc; line-height:1.9; background:#1a2238; border-radius:8px; padding:7px 16px; }
  .gbreak b { color:#eab308; }
  .shop-gold { font-size:16px; color:#eab308; font-weight:bold; }
  .shop-sec { font-size:11px; color:#8e9db0; }
  .rg-chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:520px; }
  .own-rg { background:#1a2238; border:1px solid #2c3550; border-radius:8px; padding:6px 10px; font-size:11px;
            cursor:pointer; display:flex; gap:6px; align-items:center; }
  .own-rg b { color:#d4a24e; }
  .own-rg i { color:#8e9db0; font-style:normal; }
  .offer-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:520px; }
  .offer { width:152px; background:#1a2238; border:1px solid #3a4763; border-radius:10px; padding:9px 8px;
           display:flex; flex-direction:column; gap:4px; align-items:center; text-align:center; }
  .offer .ic { font-size:22px; }
  .offer .nm { font-size:12px; font-weight:bold; color:#d4a24e; }
  .offer .ds { font-size:10.5px; color:#c2cedc; line-height:1.45; min-height:30px; }
  .offer button { background:#0ea5e9; color:#04121c; border:0; border-radius:6px; padding:6px 12px;
                  font-size:11px; font-weight:bold; cursor:pointer; font-family:inherit; }
  .offer button:disabled { opacity:.35; cursor:default; }
  .shop-msg { min-height:17px; font-size:11.5px; color:#eab308; }

  /* ── 기록서 ── */
  #bookTable { width:100%; max-width:360px; background:#1a2238; border-radius:8px; padding:9px 14px; }
  .bkrow { display:grid; grid-template-columns:1fr 30px 92px 44px; gap:4px; font-size:11.5px; line-height:2;
           align-items:center; }
  .bkrow span:first-child { text-align:left; }
  .bkrow span { text-align:right; }
  .bk-h span { color:#8e9db0; border-bottom:1px solid #2c3550; }
  .bkrow b { color:#d4a24e; }

  @media (max-width:520px) {
    .card { width:56px; height:80px; }
    .card .rk { font-size:13px; } .card .rk span { font-size:10px; }
    .card .big { font-size:20px; }
    #handFan { height:134px; }
    button.act { padding:11px 16px; font-size:12px; }
    .offer { width:140px; }
  }
</style>
</head>
<body>

<div id="game" hidden>
  <div id="hud">
    <div class="hrow">
      <span id="anteTxt" class="ante"></span>
      <span id="goldTxt" class="goldtxt"></span>
      <span class="sp"></span>
      <button class="mini" id="bookBtn">📖</button>
      <button class="mini" id="sortBtn"></button>
    </div>
    <div class="bar-bg"><div id="scoreBar"></div></div>
    <div class="hrow score-nums"><span id="scoreTxt">0</span><span id="targetTxt"></span></div>
    <div class="hrow pills">
      <span class="pill p-play"><span data-i18n="handsLbl">연성</span> <b id="handsTxt">4</b></span>
      <span class="pill p-disc"><span data-i18n="discardsLbl">폐기</span> <b id="discTxt">3</b></span>
      <span class="pill p-deck">🎴 <b id="deckTxt">44</b></span>
    </div>
  </div>

  <div id="rgRow"></div>
  <div id="rgTip" hidden></div>

  <div id="playArea">
    <div id="playedCards"></div>
    <div id="calcSteps"></div>
    <div id="calcOut"><span id="calcExpr"></span><span id="calcTotal"></span></div>
  </div>

  <div id="previewBar"></div>
  <div id="handFan"></div>

  <div class="acts">
    <button class="act play" id="playBtn" data-i18n="playBtn">⚗ 연성</button>
    <button class="act disc" id="discardBtn" data-i18n="discardBtn">♻ 폐기</button>
  </div>
</div>

<div class="panel" id="menu">
  <h1 data-i18n="menuTitle">⚗ 족보 연성소</h1>
  <p data-i18n="menuDesc">52장의 덱, 8장의 손패. 최대 5장을 골라 족보를 연성해 안테마다 치솟는 목표 점수를 넘겨라.</p>
  <p class="small" data-i18n="menuSub">라운드당 연성 4회 · 폐기 3회 · 시약 슬롯 5칸</p>
  <div class="row">
    <button class="act" id="startBtn" data-i18n="startBtn">▶ 연성 시작</button>
  </div>
</div>

<div class="panel" id="shopPanel" hidden>
  <h1 data-i18n="shopTitle">⚗ 연금 상점</h1>
  <div id="goldBreak" class="gbreak"></div>
  <div class="shop-gold">🪙 <b id="shopGoldTxt">0</b></div>
  <div class="shop-sec" data-i18n="ownedLbl">보유 시약 (탭하면 판매)</div>
  <div id="ownRow" class="rg-chips"></div>
  <div class="shop-sec" data-i18n="offerLbl">시약 진열대</div>
  <div id="offerRow" class="offer-row"></div>
  <div class="row">
    <button class="act ghost" id="packBtn"></button>
    <button class="act ghost" id="rerollBtn"></button>
  </div>
  <div id="packRow" class="offer-row" hidden></div>
  <div id="shopMsg" class="shop-msg"></div>
  <button class="act" id="nextBtn" data-i18n="nextBtn">다음 안테 ▶</button>
</div>

<div class="panel" id="bookPanel" hidden>
  <h1 data-i18n="bookTitle">📖 연성 기록서</h1>
  <p class="small" data-i18n="bookHint">같은 족보를 3회 연성할 때마다 레벨 +1 — 기본점과 배수가 성장한다</p>
  <div id="bookTable"></div>
  <button class="act ghost" id="bookClose" data-i18n="close">닫기</button>
</div>

<div class="panel" id="winPanel" hidden>
  <h1 data-i18n="winTitle">🏆 안테 8 완수!</h1>
  <p data-i18n="winDesc">연성의 대가에 올랐다. 엔드리스로 더 갈 것인가, 여기서 기록을 남길 것인가.</p>
  <div class="row">
    <button class="act" id="endlessBtn" data-i18n="endlessBtn">♾ 엔드리스 계속</button>
    <button class="act ghost" id="finishBtn" data-i18n="finishBtn">🏁 기록 남기기</button>
  </div>
</div>

<div class="panel" id="endPanel" hidden>
  <h1 id="endTitle"></h1>
  <p id="endDesc" class="small"></p>
  <div class="row">
    <div class="stat"><b id="endAnte">0</b><span data-i18n="statAnte">도달 안테</span></div>
    <div class="stat"><b id="endBest">0</b><span data-i18n="statBest">최고 연성</span></div>
    <div class="stat"><b id="endScore">0</b><span data-i18n="statScore">최종 점수</span></div>
  </div>
  <div class="row">
    <button class="act" id="againBtn" data-i18n="againBtn">🔄 다시 도전</button>
    <button class="act ghost" id="backBtn" data-i18n="backBtn">처음으로</button>
  </div>
</div>

<div id="toast"></div>

<script>

GameI18n.init({

function hasRg(id) {

function handLevel(i) { return 1 + Math.floor(S.playCounts[i] / 3); }

function makeDeck() {
  var d = [], id = 0, s, r;
  for (s = 0; s < 4; s++) for (r = 2; r <= 14; r++) d.push({ id: id++, suit: s, rank: r, enh: null });
  return d;
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function evalHand(cards) {
  var i, cnt = {}, suits = {}, ranks = [];
  for (i = 0; i < cards.length; i++) {
    cnt[cards[i].rank] = (cnt[cards[i].rank] || 0) + 1;
    suits[cards[i].suit] = (suits[cards[i].suit] || 0) + 1;
  }
  var groups = [], k;
  for (k in cnt) { groups.push(cnt[k]); ranks.push(+k); }
  groups.sort(function (a, b) { return b - a; });
  ranks.sort(function (a, b) { return a - b; });
  var flush = false;
  if (cards.length === 5) for (k in suits) if (suits[k] === 5) flush = true;
  var straight = false;
  if (cards.length === 5 && ranks.length === 5) {
    if (ranks[4] - ranks[0] === 4) straight = true;
    else if (ranks[0] === 2 && ranks[1] === 3 && ranks[2] === 4 && ranks[3] === 5 && ranks[4] === 14) straight = true; // A-2-3-4-5
  }
  if (straight && flush) return 8;
  if (groups[0] === 4) return 7;
  if (groups[0] === 3 && groups[1] === 2) return 6;
  if (flush) return 5;
  if (straight) return 4;
  if (groups[0] === 3) return 3;
  if (groups[0] === 2 && groups[1] === 2) return 2;
  if (groups[0] === 2) return 1;
  return 0;
}

// 점수 = floor(기본점 × 배수 × 곱배수) + 랭크 합. 상태를 바꾸지 않아 미리보기에도 그대로 쓴다.
function computePlay(cards) {
  var hIdx = evalHand(cards), h = HANDS[hIdx], lv = handLevel(hIdx);
  var steps = [];
  var ctx = {
    cards: cards, hIdx: hIdx, lv: lv,
    pts: h.base + (lv - 1) * h.lvB, mult: h.mult + (lv - 1) * h.lvM, times: 1, gold: 0,
    handsLeft: S.handsLeft, discardsLeft: S.discardsLeft, handsUsed: S.handsUsed,
    crucible: S.crucible, usedCrucible: false, step: null,
  };
  ctx.step = function (txt, cls) { steps.push({ t: txt, c: cls, p: ctx.pts, m: ctx.mult, x: ctx.times }); };
  ctx.step(TR('h' + hIdx) + ' Lv' + lv, 'base');
  var rankSum = 0, i, g = 0, sl = 0, ho = 0;
  for (i = 0; i < cards.length; i++) {
    rankSum += cards[i].rank;
    if (cards[i].enh === 'gild') g++;
    else if (cards[i].enh === 'seal') sl++;
    else if (cards[i].enh === 'holy') ho++;
  }
  if (g) { ctx.pts += 30 * g; ctx.step('✨ ' + TR('stPts') + ' +' + (30 * g), 'pts'); }
  if (sl) { ctx.mult += 3 * sl; ctx.step('🔻 ' + TR('stMult') + ' +' + (3 * sl), 'mult'); }
  if (ho) { ctx.gold += ho; ctx.step('🪙 ' + TR('stGold') + ' +' + ho, 'gold'); }
  for (i = 0; i < S.owned.length; i++) if (S.owned[i].fx) S.owned[i].fx(ctx);
  var subtotal = Math.floor(ctx.pts * ctx.mult * ctx.times);
  var total = subtotal + rankSum;
  steps.push({ t: TR('stRank') + ' +' + rankSum, c: 'rank', p: ctx.pts, m: ctx.mult, x: ctx.times });
  return {
    hIdx: hIdx, lv: lv, pts: ctx.pts, mult: ctx.mult, times: ctx.times, gold: ctx.gold,
    rankSum: rankSum, subtotal: subtotal, total: total, steps: steps, usedCrucible: ctx.usedCrucible,
  };
}

  }, 300);
  anim = { skip: function () {
    clearInterval(iv);
    for (var j = 0; j < chips.length; j++) if (chips[j].className.indexOf(' on') < 0) chips[j].className += ' on';
    if (res.steps.length) setExpr(res.steps[res.steps.length - 1]);
    if (finished) return;
    finished = true;
    tot.textContent = '= ' + res.total.toLocaleString();
    setTimeout(fin, 150);
  } };
}

// ==== flow: round lifecycle · play/discard · run end ====

function targetFor(ante) {
  if (ante <= 8) return TARGETS[ante - 1];
  var t = TARGETS[7];
  for (var i = 8; i < ante; i++) t = Math.round(t * 1.8 / 500) * 500; // 엔드리스: ×1.8, 500 단위 반올림
  return t;
}

function startRun() {
  S = {
    ante: 1, cleared: 0, gold: 4, bestPlay: 0, endless: false, submitted: false,
    playCounts: [0, 0, 0, 0, 0, 0, 0, 0, 0], owned: [], deck: makeDeck(),
    target: 0, roundScore: 0, handsLeft: 0, discardsLeft: 0, handsUsed: 0, crucible: 0,
    drawPile: [], hand: [], sel: [], sortMode: 'rank', lock: false,
    offers: [], rerollCost: 2, lastBreak: null, packChoices: null, packRowOpen: false,
  };
  el('menu').hidden = true;
  el('endPanel').hidden = true;
  el('winPanel').hidden = true;
  el('shopPanel').hidden = true;
  el('bookPanel').hidden = true;
  el('game').hidden = false;
  startRound();
}

function startRound() {
  S.target = targetFor(S.ante);
  S.roundScore = 0;
  S.handsLeft = PLAYS;
  S.discardsLeft = DISCARDS;
  S.handsUsed = 0;
  S.crucible = 0;
  S.drawPile = shuffle(S.deck.slice());
  S.hand = [];
  S.sel = [];
  S.lock = false;
  if (hasRg('homunc')) S.gold += 2;
  draw(HAND_SIZE);
  el('rgTip').hidden = true;
  tipId = null;
  clearCalc();
  renderAll();
  toast(fmt(TR('roundIntro'), { a: S.ante, t: S.target.toLocaleString() }));
}

function draw(n) {
  while (n-- > 0 && S.drawPile.length && S.hand.length < HAND_SIZE) S.hand.push(S.drawPile.pop());
  sortHand();
}
function sortHand() {
  S.hand.sort(function (a, b) {
    if (S.sortMode === 'rank') return b.rank - a.rank || a.suit - b.suit;
    return a.suit - b.suit || b.rank - a.rank;
  });
}
function removeSel() {
  var keep = [], i;
  for (i = 0; i < S.hand.length; i++) if (S.sel.indexOf(S.hand[i].id) < 0) keep.push(S.hand[i]);
  S.hand = keep;
  S.sel = [];
}

function doPlay() {
  if (S.lock || !S.handsLeft) return;
  var cards = selCards();
  if (!cards.length) { toast(TR('needSel')); return; }
  S.lock = true;
  renderHud();
  var res = computePlay(cards);
  removeSel();
  renderHand();
  renderPreview();
  showPlayAnim(cards, res, function () {
    S.roundScore += res.total;
    S.gold += res.gold;
    if (res.usedCrucible) S.crucible = 0;
    S.playCounts[res.hIdx]++;
    var nl = handLevel(res.hIdx);
    if (nl > res.lv) toast(fmt(TR('levelUp'), { h: TR('h' + res.hIdx), lv: nl }));
    if (res.total > S.bestPlay) S.bestPlay = res.total;
    S.handsUsed++;
    S.handsLeft--;
    draw(cards.length);
    renderAll();
    if (S.roundScore >= S.target) roundClear();
    else if (!S.handsLeft) endRun(false);
    else { S.lock = false; renderHud(); }
  });
}

function doDiscard() {
  if (S.lock || !S.discardsLeft) return;
  var cards = selCards();
  if (!cards.length) { toast(TR('needSel')); return; }
  S.discardsLeft--;
  if (hasRg('crucible')) { S.crucible++; toast(TR('crucibleProc')); }
  if (hasRg('ash')) { S.roundScore += 30; toast(TR('ashProc')); }
  removeSel();
  draw(cards.length);
  renderAll();
  if (S.roundScore >= S.target) roundClear();
}

function roundClear() {
  S.lock = true;
  renderHud();
  S.cleared++;
  toast(TR('targetMet'));
  var base = 6, hb = S.handsLeft * 2, itr = Math.min(5, Math.floor(S.gold / 5));
  S.gold += base + hb + itr;
  S.lastBreak = { base: base, hands: hb, interest: itr };
  setTimeout(function () {
    if (S.ante === 8 && !S.endless) el('winPanel').hidden = false;
    else openShop();
  }, 900);
}

function endRun(won) {
  S.lock = true;
  var score = S.cleared * 5000 + S.bestPlay;
  el('endTitle').textContent = TR(won ? 'endWin' : 'endLose');
  el('endDesc').textContent = won ? '' : fmt(TR('endLoseDesc'), { a: S.ante });
  el('endAnte').textContent = S.cleared;
  el('endBest').textContent = S.bestPlay.toLocaleString();
  el('endScore').textContent = score.toLocaleString();
  if (!S.submitted && score > 0) {
    S.submitted = true;
    GameRank.submit(SLUG, score, fmt(TR('detail'), { a: S.cleared, b: S.bestPlay }));
  }
  el('winPanel').hidden = true;
  el('endPanel').hidden = false;
}

// ==== shop · panels · wiring ====

function shopMsg(t) { el('shopMsg').textContent = t; }

function openShop() {
  var b = S.lastBreak;
  function line(l, v) { return '<div>' + l + ' <b>+' + v + '🪙</b></div>'; }
  el('goldBreak').innerHTML = line(TR('brBase'), b.base) + line(TR('brHands'), b.hands) +
    (b.interest ? line(TR('brInterest'), b.interest) : '');
  S.rerollCost = hasRg('aeon') ? 0 : 2;
  S.offers = rollOffers();
  S.packChoices = null;
  S.packRowOpen = false;
  el('packRow').hidden = true;
  shopMsg('');
  renderShop();
  el('shopPanel').hidden = false;
}

function rollOffers() {
  var pool = [], i;
  for (i = 0; i < REAGENTS.length; i++) if (!hasRg(REAGENTS[i].id)) pool.push(REAGENTS[i]);
  return shuffle(pool).slice(0, 2);
}

function renderShop() {
  el('shopGoldTxt').textContent = S.gold;
  var own = el('ownRow'), i;
  own.innerHTML = '';
  for (i = 0; i < S.owned.length; i++) {
    (function (r, idx) {
      var d = document.createElement('div');
      d.className = 'own-rg';
      d.innerHTML = r.icon + ' <b>' + TR('rg_' + r.id) + '</b><i>' + TR('sell') + ' +' + Math.floor(r.price / 2) + '🪙</i>';
      d.title = TR('rgd_' + r.id);
      d.onclick = function () { sellOwned(idx); };
      own.appendChild(d);
    })(S.owned[i], i);
  }
  var off = el('offerRow');
  off.innerHTML = '';
  for (i = 0; i < S.offers.length; i++) {
    (function (r, idx) {
      var d = document.createElement('div');
      d.className = 'offer';
      d.innerHTML = '<div class="ic">' + r.icon + '</div><div class="nm">' + TR('rg_' + r.id) + '</div>' +
        '<div class="ds">' + TR('rgd_' + r.id) + '</div>';
      var b = document.createElement('button');
      b.textContent = TR('buy') + ' ' + r.price + '🪙';
      b.disabled = S.gold < r.price;
      b.onclick = function () { buyOffer(idx); };
      d.appendChild(b);
      off.appendChild(d);
    })(S.offers[i], i);
  }
  el('packBtn').textContent = TR('packBtn') + ' ' + PACK_COST + '🪙';
  el('rerollBtn').textContent = TR('rerollBtn') + ' ' + S.rerollCost + '🪙';
  if (S.packRowOpen) renderPack();
}

function buyOffer(idx) {
  var r = S.offers[idx];
  if (S.owned.length >= SLOTS) { shopMsg(TR('slotsFull')); return; }
  if (S.gold < r.price) { shopMsg(TR('noGold')); return; }
  S.gold -= r.price;
  S.owned.push(r);
  S.offers.splice(idx, 1);
  if (r.id === 'aeon') S.rerollCost = 0;
  shopMsg('');
  renderShop();
}
function sellOwned(idx) {
  var r = S.owned[idx];
  S.gold += Math.floor(r.price / 2);
  S.owned.splice(idx, 1);
  if (r.id === 'aeon' && S.rerollCost === 0) S.rerollCost = 2;
  renderShop();
}
function reroll() {
  if (S.gold < S.rerollCost) { shopMsg(TR('noGold')); return; }
  S.gold -= S.rerollCost;
  if (S.rerollCost > 0) S.rerollCost++;
  S.offers = rollOffers();
  renderShop();
}

// 강화팩 — 무작위 카드 3장 × 강화 3종 조합 중 하나를 골라 부여
function openPack() {
  S.packRowOpen = !S.packRowOpen;
  el('packRow').hidden = !S.packRowOpen;
  if (S.packRowOpen) {
    if (!S.packChoices) S.packChoices = rollPack();
    renderPack();
    shopMsg(TR('packPick'));
  } else shopMsg('');
}
function rollPack() {
  var free = [], i;
  for (i = 0; i < S.deck.length; i++) if (!S.deck[i].enh) free.push(S.deck[i]);
  shuffle(free);
  var enhs = shuffle(['gild', 'seal', 'holy']);
  var out = [];
  for (i = 0; i < 3 && i < free.length; i++) out.push({ enh: enhs[i % 3], card: free[i] });
  return out;
}
function renderPack() {
  var pr = el('packRow'), i;
  pr.innerHTML = '';
  if (!S.packChoices.length) { pr.innerHTML = '<div class="shop-msg">' + TR('packNone') + '</div>'; return; }
  for (i = 0; i < S.packChoices.length; i++) {
    (function (ch, idx) {
      var d = document.createElement('div');
      d.className = 'offer';
      d.innerHTML = '<div class="ic ' + (SUIT_RED[ch.card.suit] ? 'cR' : '') + '">' + cardLabel(ch.card) + '</div>' +
        '<div class="nm">' + TR('enh_' + ch.enh) + '</div>' +
        '<div class="ds">' + TR('enhd_' + ch.enh) + '</div>';
      var b = document.createElement('button');
      b.textContent = TR('buy') + ' ' + PACK_COST + '🪙';
      b.disabled = S.gold < PACK_COST;
      b.onclick = function () { pickPack(idx); };
      d.appendChild(b);
      pr.appendChild(d);
    })(S.packChoices[i], i);
  }
}
function pickPack(idx) {
  if (S.gold < PACK_COST) { shopMsg(TR('noGold')); return; }
  var ch = S.packChoices[idx];
  S.gold -= PACK_COST;
  ch.card.enh = ch.enh;
  shopMsg(fmt(TR('packDone'), { c: cardLabel(ch.card), e: TR('enh_' + ch.enh) }));
  S.packChoices = rollPack();
  renderShop();
}

function nextRound() {
  el('shopPanel').hidden = true;
  S.ante++;
  startRound();
}

function renderBook() {
  var html = '<div class="bkrow bk-h"><span>' + TR('bkHand') + '</span><span>Lv</span><span>' +
    TR('bkPow') + '</span><span>' + TR('bkCnt') + '</span></div>';
  for (var i = 8; i >= 0; i--) {
    var lv = handLevel(i);
    var b = HANDS[i].base + (lv - 1) * HANDS[i].lvB;
    var m = HANDS[i].mult + (lv - 1) * HANDS[i].lvM;
    html += '<div class="bkrow"><span>' + TR('h' + i) + '</span><b>' + lv + '</b><span>' +
      b + ' × ' + m + '</span><span>' + S.playCounts[i] + '</span></div>';
  }
  el('bookTable').innerHTML = html;
}

el('startBtn').onclick = startRun;
el('againBtn').onclick = startRun;
el('backBtn').onclick = function () {
  el('endPanel').hidden = true;
  el('game').hidden = true;
  el('menu').hidden = false;
};
el('playBtn').onclick = doPlay;
el('discardBtn').onclick = doDiscard;
el('sortBtn').onclick = function () {
  S.sortMode = S.sortMode === 'rank' ? 'suit' : 'rank';
  sortHand();
  renderHand();
  renderHud();
};
el('bookBtn').onclick = function () { renderBook(); el('bookPanel').hidden = false; };
el('bookClose').onclick = function () { el('bookPanel').hidden = true; };
el('endlessBtn').onclick = function () {
  S.endless = true;
  el('winPanel').hidden = true;
  openShop();
};
el('finishBtn').onclick = function () { endRun(true); };
el('nextBtn').onclick = nextRound;
el('packBtn').onclick = openPack;
el('rerollBtn').onclick = reroll;
el('playArea').onclick = function () { if (anim) anim.skip(); };
window.addEventListener('resize', function () { if (S && !el('game').hidden) renderHand(); });
</script>
<script src="../lib/rank.js"></script>
