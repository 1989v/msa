<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>균열 전선</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#08060f; color:#e6e2f4; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #241a3c; border-radius:10px; overflow:hidden; box-shadow:0 0 52px rgba(0,0,0,.75); }
  canvas { display:block; background:#100a1c; image-rendering:pixelated; max-width:100%; }

  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:7px; font-size:12px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(10,7,20,.68); padding:3px 9px; border-radius:10px; white-space:nowrap; }
  #hud .grow { flex:1; }
  #hud .ally { color:#8fd4ff; }
  #hud .foe { color:#ff9d7a; }

  #bars { position:absolute; top:34px; left:10px; width:194px; pointer-events:none; }
  #bars .bar { position:relative; height:11px; border-radius:5px; background:rgba(8,6,14,.78);
               border:1px solid #2c2444; overflow:hidden; margin-bottom:3px; }
  #bars .bar i { position:absolute; inset:0; width:0; display:block; transition:width .1s linear; }
  #hpFill { background:linear-gradient(#7ae08a,#3fae63); }
  #xpFill { background:linear-gradient(#ffd85c,#e0a020); }
  #bars .bar.xp { height:6px; }
  #bars span { position:absolute; left:0; right:0; top:-1px; text-align:center; font-size:9px; font-weight:bold;
               color:#eaf4ff; text-shadow:1px 1px 0 rgba(0,0,0,.9); }

  #skills { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:12px; pointer-events:none; }
  .sk { position:relative; width:46px; height:46px; border-radius:11px; background:rgba(12,8,22,.78);
        border:1px solid #3a2f60; display:flex; align-items:center; justify-content:center; font-size:21px;
        box-shadow:0 2px 0 rgba(0,0,0,.5); }
  .sk .cdmask { position:absolute; inset:0; border-radius:10px;
                background:conic-gradient(rgba(4,3,10,.8) 0deg, rgba(4,3,10,.8) var(--a,0deg), transparent var(--a,0deg)); }
  .sk .key { position:absolute; top:-7px; left:-5px; font-size:9.5px; font-weight:bold; color:#0b0716;
             background:#8fd4ff; border-radius:4px; padding:1px 4px; }
  .sk .left { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
              font-size:15px; font-weight:bold; color:#fff; text-shadow:1px 1px 0 #000; }
  .sk .nm { position:absolute; bottom:-14px; left:50%; transform:translateX(-50%); font-size:9px;
            color:#a79ec8; white-space:nowrap; text-shadow:1px 1px 0 #000; }
  .sk.ready { border-color:#8fd4ff; }

  #banner { position:absolute; top:26%; left:0; right:0; text-align:center; font-size:25px; font-weight:bold;
            color:#c8a4ff; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .3s; }
  #banner.on { opacity:1; }

  .panel { position:absolute; inset:0; background:rgba(9,6,16,.95); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:12px; text-align:center; z-index:10; padding:20px; overflow-y:auto; }
  .panel h1 { color:#c8a4ff; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#bdb4d4; line-height:1.75; max-width:540px; }
  .panel button { background:#7c5cd6; color:#0b0716; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#241a3c; color:#e6e2f4; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #info { margin-top:9px; font-size:11px; color:#645a86; text-align:center; line-height:1.7; max-width:660px; }

  /* 모바일 — 캔버스를 화면 폭에 맞추고, 스킬 아이콘을 가상 패드와 겹치지 않게 위로 올린다 */
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width:100vw; max-width:100vw; border-width:0; border-radius:0; }
    canvas { width:100%; height:auto; }
    #info { display:none; }
    #skills { left:auto; right:10px; bottom:auto; top:34px; transform:none; }
    .sk .nm { display:none; }
    .panel button { padding:10px 16px; font-size:13px; }
  }
</style>

</head>
<body>

  <canvas id="cv" width="860" height="480"></canvas>

  <div id="hud" hidden>

    <div class="row">

</div>
<div id="info"><span data-i18n="info1">방향키 / WASD 이동 · 사거리 안의 적은 자동 공격</span><br>
  <span data-i18n="info2">Q 균열 폭발 · E 재생 오라 · 수호탑은 크립을 먼저 노린다</span></div>

<script>
'use strict';

GameI18n.init({
  ko: {
    title: '균열 전선',
    menuDesc: '세계를 가르는 균열 위로 단 하나의 전선이 열렸다. 양 진영은 6초마다 크립을 밀어 보내고, 영웅은 그 뒤를 따른다. ' +
      '수호탑 2기를 바깥부터 차례로 무너뜨리고 적의 균열 첨탑을 부숴라. 크립을 잡아 레벨을 올리되, ' +
      '크립 없이 탑에 뛰어들면 순식간에 재가 된다.',
    startBtn: '▶ 전선 진입',
    againBtn: '↻ 다시 도전',
    backBtn: '처음으로',
    info1: '방향키 / WASD 이동 · 사거리 안의 적은 자동 공격 · 본진 근처에서는 빠르게 회복',
    info2: 'Q 균열 폭발(전방 부채꼴 광역, 쿨 6초) · E 재생 오라(3초간 회복, 쿨 12초) · 수호탑은 크립을 먼저 노린다',
    allyNexus: '아군 첨탑',
    foeNexus: '적 첨탑',
    lvFmt: 'Lv.%n',
    killFmt: '⚔ %n킬',
    waveFmt: '🌊 %n파',
    respawnFmt: '☠ 부활 %n초',
    skillQ: '균열 폭발',
    skillE: '재생 오라',
    bStart: '전선이 열렸다!',
    bLevelUp: '레벨 업!',
    bAllyTower: '아군 수호탑 파괴!',
    bFoeTower: '적 수호탑 격파!',
    bFoeHero: '적 영웅 처치!',
    bHeroDown: '영웅 전사…',
    bAllyExposed: '아군 첨탑이 드러났다!',
    bFoeExposed: '적 첨탑이 드러났다! 밀어붙여라!',
    fLevelUp: '레벨 업',
    fDown: '전사',
    winTitle: '🏆 균열 봉인!',
    loseTitle: '💀 전선 붕괴…',
    winDesc: '적 균열 첨탑을 부쉈다! Lv.%l · %k킬 · 수호탑 %w기 격파 · 점수 %s',
    loseDesc: '아군 균열 첨탑이 무너졌다. Lv.%l · %k킬 · 수호탑 %w기 격파 · 점수 %s',
    rankLine: ' 🏆 랭킹 %n위!',
  },
  en: {
    title: 'Rift Front',
    menuDesc: 'One lane has opened across the rift that splits the world. Both camps push creeps every 6 seconds, and the heroes ' +
      'follow behind them. Break the two guard towers from the outside in, then shatter the enemy Rift Spire. Farm creeps to ' +
      'level up — but dive a tower without creeps and you burn.',
    startBtn: '▶ Enter the front',
    againBtn: '↻ Try again',
    backBtn: 'Back to menu',
    info1: 'Arrow keys / WASD to move · auto-attack anything in range · heal fast near your own spire',
    info2: 'Q Rift Burst (frontal cone AoE, 6s CD) · E Mending Aura (3s regen, 12s CD) · towers shoot creeps first',
    allyNexus: 'Our Spire',
    foeNexus: 'Enemy Spire',
    lvFmt: 'Lv.%n',
    killFmt: '⚔ %n kills',
    waveFmt: '🌊 wave %n',
    respawnFmt: '☠ respawn %ns',
    skillQ: 'Rift Burst',
    skillE: 'Mending Aura',
    bStart: 'The front is open!',
    bLevelUp: 'LEVEL UP!',
    bAllyTower: 'Our guard tower fell!',
    bFoeTower: 'Enemy guard tower down!',
    bFoeHero: 'Enemy hero slain!',
    bHeroDown: 'You have fallen…',
    bAllyExposed: 'Our Spire is exposed!',
    bFoeExposed: 'Enemy Spire is exposed — push!',
    fLevelUp: 'LEVEL UP',
    fDown: 'DOWN',
    winTitle: '🏆 Rift Sealed!',
    loseTitle: '💀 Front Collapsed…',
    winDesc: 'The enemy Rift Spire is shattered! Lv.%l · %k kills · %w towers destroyed · score %s',
    loseDesc: 'Our Rift Spire has fallen. Lv.%l · %k kills · %w towers destroyed · score %s',
    rankLine: ' 🏆 Rank #%n!',
  },
});
var TR = GameI18n.t;
document.title = TR('title');

const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = cv.width, VH = cv.height;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random();
const ri = n => Math.floor(Math.random() * n);
const fmt = (key, map) => { let out = TR(key); for (const k in map) out = out.split(k).join(map[k]); return out; };

/* ── 전장 좌표 ── */
const ALLY = 1, FOE = -1;
const HORIZON = 300;                 // 하늘/지형 경계
const ROAD_TOP = 336, ROAD_BOT = 414; // 균열 위 석조 가도
const TOWER_Y = 334, BASE_Y = 330;    // 구조물 발밑
const LANE_TOP = 346, LANE_BOT = 392; // 크립이 걷는 띠
const HERO_TOP = 338, HERO_BOT = 404;
const ALLY_BASE_X = 58, FOE_BASE_X = 802;
const STRUCT_LAYOUT = [
  { side: ALLY, kind: 'tower', x: 312, order: 0 },
  { side: ALLY, kind: 'tower', x: 186, order: 1 },
  { side: ALLY, kind: 'base',  x: ALLY_BASE_X, order: 2 },
  { side: FOE,  kind: 'tower', x: 548, order: 0 },
  { side: FOE,  kind: 'tower', x: 674, order: 1 },
  { side: FOE,  kind: 'base',  x: FOE_BASE_X, order: 2 },
];
const TOWER_HP = 790, TOWER_DMG = 44, TOWER_RANGE = 168, TOWER_RATE = 1.05;
const BASE_HP = 600;
const WAVE_GAP = 6;

/* ── 팔레트 ── */
const PAL = {
  1: { armor:'#5b86d6', armorHi:'#a9c9f6', armorLo:'#2f4d86', cloth:'#3d5fa8', clothLo:'#22376a',
       skin:'#e9c39c', skinLo:'#c09368', metal:'#c6d4e8', metalLo:'#78899f', glow:'#7ce8ff', crest:'#ffd24a',
       stone:'#59607e', stoneHi:'#7d86a6', stoneLo:'#363c56' },
  '-1': { armor:'#cf6450', armorHi:'#f6a88e', armorLo:'#7d3128', cloth:'#8e3348', clothLo:'#571d2b',
       skin:'#cfa27c', skinLo:'#a37655', metal:'#dcc3b1', metalLo:'#997e6d', glow:'#ff9a5c', crest:'#c07cff',
       stone:'#6e5560', stoneHi:'#94737f', stoneLo:'#43323c' },
};
const OUTLINE = '#0a0713';

/* ── 스프라이트 (1px 외곽선 자동 생성 + 캐시) ── */
const SPRITES = new Map();
const px = (g, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
function sprite(key, w, h, paint) {
  let done = SPRITES.get(key);
  if (done) return done;
  const body = document.createElement('canvas'); body.width = w; body.height = h;
  paint(body.getContext('2d'));
  const sil = document.createElement('canvas'); sil.width = w; sil.height = h;
  const sg = sil.getContext('2d');
  sg.drawImage(body, 0, 0);
  sg.globalCompositeOperation = 'source-in';
  sg.fillStyle = OUTLINE; sg.fillRect(0, 0, w, h);
  const out = document.createElement('canvas'); out.width = w + 2; out.height = h + 2;
  const og = out.getContext('2d');
  const ring = [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2]];
  for (const off of ring) og.drawImage(sil, off[0], off[1]);
  og.drawImage(body, 1, 1);
  SPRITES.set(key, out);
  return out;
}

/** 근접 크립 — 파쇄병 */
function meleeSprite(side, frame) {
  return sprite('m' + side + frame, 24, 26, g => {
    const p = PAL[side];
    // 뒤쪽 방패
    px(g, 1, 13, 5, 9, p.metalLo); px(g, 2, 14, 3, 7, p.cloth); px(g, 3, 16, 1, 3, p.metal);
    // 다리
    if (frame === 0) {
      px(g, 8, 20, 4, 5, p.clothLo); px(g, 13, 20, 4, 5, p.cloth);
      px(g, 8, 25, 4, 1, OUTLINE); px(g, 13, 25, 4, 1, OUTLINE);
    } else {
      px(g, 7, 20, 4, 4, p.clothLo); px(g, 14, 20, 4, 4, p.cloth);
      px(g, 7, 24, 5, 1, OUTLINE); px(g, 14, 24, 4, 1, OUTLINE);
    }
    // 몸통
    px(g, 6, 12, 13, 8, p.armor);
    px(g, 6, 12, 13, 2, p.armorHi);
    px(g, 6, 18, 13, 2, p.armorLo);
    px(g, 6, 19, 13, 2, p.clothLo);
    px(g, 11, 14, 3, 4, p.armorHi);
    // 어깨
    px(g, 3, 12, 5, 5, p.metal); px(g, 3, 16, 5, 1, p.metalLo);
    // 목/투구
    px(g, 9, 11, 7, 1, p.metalLo);
    px(g, 8, 1, 10, 6, p.metal); px(g, 9, 1, 8, 1, '#eef3fb');
    px(g, 10, 5, 8, 2, '#141a26');
    px(g, 12, 5, 2, 1, p.glow); px(g, 15, 5, 2, 1, p.glow);
    // 얼굴
    px(g, 10, 7, 7, 4, p.skin); px(g, 10, 10, 7, 1, p.skinLo);
    // 앞쪽 팔 + 검
    px(g, 17, 13, 4, 4, p.armor); px(g, 17, 16, 4, 1, p.armorLo);
    px(g, 20, 3, 3, 12, p.metal); px(g, 22, 3, 1, 12, p.metalLo); px(g, 20, 3, 1, 12, '#eef3fb');
    px(g, 19, 15, 5, 2, p.crest);
  });
}

/** 원거리 크립 — 주술 사수 */
function rangedSprite(side, frame) {
  return sprite('r' + side + frame, 24, 26, g => {
    const p = PAL[side];
    const bob = frame ? 1 : 0;
    // 지팡이
    px(g, 19, 4, 2, 21, '#6a4a2e'); px(g, 20, 4, 1, 21, '#48311e');
    px(g, 18, 1 + bob, 4, 4, p.glow); px(g, 19, 2 + bob, 2, 2, '#ffffff');
    px(g, 17, 2 + bob, 1, 2, p.glow); px(g, 22, 2 + bob, 1, 2, p.glow);
    // 로브 아랫단
    if (frame === 0) { px(g, 5, 20, 14, 5, p.clothLo); px(g, 6, 25, 12, 1, OUTLINE); }
    else { px(g, 6, 20, 13, 4, p.clothLo); px(g, 6, 24, 13, 1, OUTLINE); }
    // 로브
    px(g, 6, 11, 12, 10, p.cloth);
    px(g, 6, 11, 12, 2, p.armorHi);
    px(g, 6, 16, 12, 2, p.armor);
    px(g, 8, 13, 3, 3, p.clothLo);
    // 후드
    px(g, 10, 0, 5, 2, p.cloth);
    px(g, 7, 2, 11, 6, p.cloth); px(g, 8, 2, 9, 1, p.armorHi);
    px(g, 6, 7, 13, 2, p.clothLo);
    // 그림자 진 얼굴 + 빛나는 눈
    px(g, 9, 6, 7, 4, '#100c1a');
    px(g, 10, 7, 2, 2, p.glow); px(g, 13, 7, 2, 2, p.glow);
    // 팔
    px(g, 4, 13, 4, 4, p.cloth); px(g, 3, 15, 3, 3, p.skin);
    px(g, 16, 13, 4, 3, p.cloth);
  });
}

/** 영웅 — 균열 기사 / 적 영웅 */
function heroSprite(side, frame) {
  return sprite('h' + side + frame, 28, 34, g => {
    const p = PAL[side];
    const sway = frame ? 1 : 0;
    // 망토
    px(g, 3, 11, 8, 17, p.cloth); px(g, 3, 11, 2, 17, p.clothLo);
    px(g, 2 - sway, 26, 8, 4, p.clothLo); px(g, 3 - sway, 30, 6, 1, OUTLINE);
    // 다리
    if (frame === 0) {
      px(g, 10, 26, 4, 6, p.armorLo); px(g, 15, 26, 4, 6, p.armorLo);
      px(g, 10, 31, 4, 2, p.metalLo); px(g, 15, 31, 4, 2, p.metalLo);
    } else {
      px(g, 9, 26, 4, 5, p.armorLo); px(g, 16, 26, 4, 5, p.armorLo);
      px(g, 8, 30, 5, 2, p.metalLo); px(g, 16, 30, 5, 2, p.metalLo);
    }
    // 몸통
    px(g, 8, 13, 12, 13, p.armor);
    px(g, 8, 13, 12, 2, p.armorHi);
    px(g, 8, 22, 12, 2, p.armorLo);
    px(g, 8, 24, 12, 2, p.clothLo);
    px(g, 9, 16, 2, 6, p.armorHi);
    // 가슴의 균열 파편
    px(g, 12, 16, 4, 5, '#100c1a');
    px(g, 13, 17, 2, 3, p.glow); px(g, 13, 18, 2, 1, '#ffffff');
    // 견갑
    px(g, 5, 13, 5, 6, p.metal); px(g, 5, 18, 5, 1, p.metalLo); px(g, 5, 13, 5, 1, '#eef3fb');
    px(g, 18, 13, 5, 6, p.metal); px(g, 18, 18, 5, 1, p.metalLo);
    // 목
    px(g, 12, 11, 5, 2, p.metalLo);
    // 투구
    px(g, 10, 4, 9, 8, p.metal);
    px(g, 10, 4, 9, 1, '#eef3fb');
    px(g, 10, 10, 2, 2, p.metalLo); px(g, 17, 10, 2, 2, p.metalLo);
    px(g, 10, 7, 9, 3, '#100c1a');
    px(g, 11, 8, 7, 1, p.glow);
    // 볏
    px(g, 13, 0, 3, 5, p.crest); px(g, 13, 0, 1, 5, '#ffffff');
    px(g, 12, 2, 1, 3, p.crest); px(g, 16, 1, 1, 4, p.crest);
    // 대검
    px(g, 22, 2, 4, 22, p.metal);
    px(g, 22, 2, 1, 22, '#eef3fb');
    px(g, 25, 2, 1, 22, p.metalLo);
    px(g, 23, 5, 1, 16, '#8d9db5');
    px(g, 20, 24, 8, 2, p.crest);
    px(g, 23, 26, 2, 5, p.cloth);
    px(g, 22, 31, 4, 2, p.crest);
    // 검을 쥔 손

function drawSprite(img, x, y, flip, bright) {

}
function shadow(x, y, w) {

/* ── 배경 (정적 레이어 1회 렌더 + 부유 파편은 매 프레임) ── */
let bgSeed = 20260806;
function srnd() { bgSeed = (bgSeed * 1664525 + 1013904223) >>> 0; return bgSeed / 4294967296; }
const bgFar = document.createElement('canvas');   // 하늘 ~ 가도
const bgNear = document.createElement('canvas');  // 유닛 앞 전경 낭떠러지
const debris = [];

function buildBackground() {
  bgFar.width = VW; bgFar.height = VH;
  bgNear.width = VW; bgNear.height = ROAD_BOT + 80;
  const g = bgFar.getContext('2d');

  // 하늘
  const sky = g.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#100a20'); sky.addColorStop(0.55, '#1b1236'); sky.addColorStop(1, '#2c1b46');
  g.fillStyle = sky; g.fillRect(0, 0, VW, HORIZON);
  for (let i = 0; i < 130; i++) {
    const sx = srnd() * VW, sy = srnd() * (HORIZON - 40), a = 0.15 + srnd() * 0.5;
    g.fillStyle = 'rgba(220,210,255,' + a.toFixed(2) + ')';
    g.fillRect(sx | 0, sy | 0, 1, 1);
  }

  // 하늘을 가르는 균열 — 글로우 + 톱니 심지 + 잔가지
  const tear = [];
  for (let x = -10; x <= VW + 10; x += 26) tear.push([x, 96 + Math.sin(x * 0.012) * 26 + (srnd() - 0.5) * 22]);
  const strokeTear = (width, color, alpha) => {
    g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = width; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(tear[0][0], tear[0][1]);
    for (let i = 1; i < tear.length; i++) g.lineTo(tear[i][0], tear[i][1]);
    g.stroke(); g.globalAlpha = 1;
  };
  strokeTear(22, '#7a3fd0', 0.20);
  strokeTear(11, '#b06ae8', 0.35);
  strokeTear(4, '#e6b6ff', 0.75);
  strokeTear(1.4, '#ffffff', 0.9);
  for (let i = 2; i < tear.length - 2; i += 3) {
    const bx = tear[i][0], by = tear[i][1], dir = srnd() < 0.5 ? -1 : 1;
    g.globalAlpha = 0.5; g.strokeStyle = '#c58bf0'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(bx, by);
    g.lineTo(bx + 14, by + dir * 20); g.lineTo(bx + 6, by + dir * 42);
    g.stroke(); g.globalAlpha = 1;
  }

  // 먼 산 실루엣 2겹
  const ridge = (baseY, height, color) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, baseY);
    for (let x = 0; x <= VW; x += 34) g.lineTo(x, baseY - height * (0.35 + srnd() * 0.65));
    g.lineTo(VW, baseY); g.lineTo(VW, HORIZON); g.lineTo(0, HORIZON); g.closePath(); g.fill();
  };
  ridge(HORIZON - 34, 62, '#241a3e');
  ridge(HORIZON - 8, 46, '#181030');

  // 균열 협곡 (가도 뒤편)
  const chasm = g.createLinearGradient(0, HORIZON - 12, 0, ROAD_TOP + 6);
  chasm.addColorStop(0, '#3a1d52'); chasm.addColorStop(0.5, '#8a3fb0'); chasm.addColorStop(1, '#1a0f26');
  g.fillStyle = chasm; g.fillRect(0, HORIZON - 12, VW, ROAD_TOP - HORIZON + 18);
  for (let i = 0; i < 26; i++) {
    const cxp = srnd() * VW, cyp = HORIZON - 6 + srnd() * 30, w = 6 + srnd() * 26;
    g.fillStyle = 'rgba(255,214,255,' + (0.08 + srnd() * 0.14).toFixed(2) + ')';
    g.fillRect(cxp | 0, cyp | 0, w | 0, 2);
  }

  // 석조 가도
  g.fillStyle = '#3f3a55'; g.fillRect(0, ROAD_TOP - 6, VW, 8);
  g.fillStyle = '#585272'; g.fillRect(0, ROAD_TOP, VW, ROAD_BOT - ROAD_TOP);
  g.fillStyle = '#4d4767'; g.fillRect(0, ROAD_TOP + 4, VW, ROAD_BOT - ROAD_TOP - 4);
  for (let y = ROAD_TOP + 4; y < ROAD_BOT; y += 13) {
    const shift = ((y - ROAD_TOP) / 13) % 2 ? 17 : 0;
    for (let x = -20 + shift; x < VW; x += 34) {
      g.fillStyle = 'rgba(255,255,255,.045)'; g.fillRect(x + 1, y + 1, 31, 1);
      g.fillStyle = 'rgba(0,0,0,.30)'; g.fillRect(x, y + 11, 34, 2);
      g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(x + 32, y, 2, 12);
      if ((x * 7 + y * 5) % 11 === 0) { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x + 6, y + 4, 9, 3); }
    }
  }
  // 가도를 타고 흐르는 균열 실금
  g.strokeStyle = 'rgba(200,140,255,.45)'; g.lineWidth = 1.4;
  for (let i = 0; i < 7; i++) {
    let cxp = srnd() * VW, cyp = ROAD_TOP + 6;
    g.beginPath(); g.moveTo(cxp, cyp);
    while (cyp < ROAD_BOT - 4) { cxp += (srnd() - 0.5) * 22; cyp += 9 + srnd() * 8; g.lineTo(cxp, cyp); }
    g.stroke();
  }
  // 가도 가장자리 난간 돌기
  for (let x = 6; x < VW; x += 46) {
    g.fillStyle = '#6b6488'; g.fillRect(x, ROAD_TOP - 12, 9, 12);
    g.fillStyle = '#847ca8'; g.fillRect(x, ROAD_TOP - 12, 9, 2);
    g.fillStyle = '#2f2a44'; g.fillRect(x, ROAD_TOP - 1, 9, 2);
  }

  // 전경 낭떠러지 (유닛 뒤에 그려질 부분은 위에서 끝나고, 아래는 bgNear)
  const ng = bgNear.getContext('2d');
  ng.fillStyle = '#2c2740'; ng.fillRect(0, ROAD_BOT, VW, 6);
  const deep = ng.createLinearGradient(0, ROAD_BOT, 0, VH);
  deep.addColorStop(0, '#241c34'); deep.addColorStop(0.35, '#120b1e'); deep.addColorStop(1, '#08050f');
  ng.fillStyle = deep; ng.fillRect(0, ROAD_BOT + 4, VW, VH - ROAD_BOT);
  for (let i = 0; i < 34; i++) {
    const cxp = srnd() * VW, cyp = ROAD_BOT + 8 + srnd() * 54, w = 8 + srnd() * 34;
    ng.fillStyle = 'rgba(190,110,255,' + (0.06 + srnd() * 0.13).toFixed(2) + ')';
    ng.fillRect(cxp | 0, cyp | 0, w | 0, 2);
  }
  for (let x = 0; x < VW; x += 7) {
    const h = 3 + Math.abs(Math.sin(x * 0.21)) * 6 + srnd() * 4;
    ng.fillStyle = '#191228'; ng.fillRect(x, ROAD_BOT + 5, 7, h);
  }

  for (let i = 0; i < 16; i++) {
    debris.push({
      x: srnd() * VW, y: 40 + srnd() * (HORIZON - 70),
      w: 5 + srnd() * 16, layer: srnd() < 0.5 ? 0 : 1,
      vx: (0.5 + srnd()) * (srnd() < 0.5 ? -1 : 1) * 5, phase: srnd() * 6.28,

  }
}
function drawDebris(now) {

function structBar(s, bx, by, w) {
  const ratio = clamp(s.hp / s.maxHp, 0, 1);
  cx.fillStyle = 'rgba(4,3,10,.8)'; cx.fillRect(bx - w / 2 - 1, by - 1, w + 2, 8);
  cx.fillStyle = '#1c1730'; cx.fillRect(bx - w / 2, by, w, 6);
  cx.fillStyle = ratio > 0.4 ? (s.side === ALLY ? '#5fd0ff' : '#ff8a5c') : '#e0563f';
  cx.fillRect(bx - w / 2, by, w * ratio, 6);
  cx.fillStyle = 'rgba(255,255,255,.28)'; cx.fillRect(bx - w / 2, by, w * ratio, 2);
  if (!isTargetable(s)) {   // 앞선 구조물이 살아있으면 보호막 표시
    cx.strokeStyle = 'rgba(160,220,255,.55)'; cx.lineWidth = 1;
    cx.strokeRect(bx - w / 2 - 2.5, by - 2.5, w + 5, 11);
  }
}

/* ── 상태 ── */
let G = null, running = false, bannerT = 0, shake = 0;
const keys = Object.create(null);

const XP_NEED = lv => 105 + (lv - 1) * 88;
const heroMaxHp = lv => 340 + (lv - 1) * 60;
const heroDmg = (lv, base) => base + (lv - 1) * 6;

function mkHero(side) {
  return {
    side, kind: 'hero', level: 1, xp: 0,
    x: side === ALLY ? ALLY_BASE_X + 26 : FOE_BASE_X - 26, y: 372,
    hp: heroMaxHp(1), maxHp: heroMaxHp(1),
    baseDmg: side === ALLY ? 24 : 19,
    range: side === ALLY ? 74 : 70, rate: side === ALLY ? 0.72 : 0.82,
    spd: side === ALLY ? 122 : 112, r: 13,
    atkCd: 0, hurt: 0, anim: 0, moving: false, facing: side,
    dead: false, respawn: 0, auraT: 0, qCd: 0, eCd: 0, think: 0, retreat: false,
  };
}
function creepStats(side, kind, wave) {
  // 양측 다 완만히 강해지되 적 쪽이 더 가파르고 더 오래 오른다 —
  // 손을 놓거나 교착에 빠지면 결국 밀린다 (무한 교착 방지)
  const scale = side === FOE ? Math.min(2.3, 1 + wave * 0.020) : Math.min(1.45, 1 + wave * 0.014);
  if (kind === 'melee') {
    return { hp: Math.round(96 * scale), dmg: Math.round(9 * scale), range: 27, rate: 0.9,
      spd: 47, r: 10, aggro: 152, xp: 46 };
  }
  return { hp: Math.round(62 * scale), dmg: Math.round(12 * scale), range: 132, rate: 1.25,
    spd: 44, r: 9, aggro: 168, xp: 62 };
}
function spawnWave() {
  G.wave++;
  for (const side of [ALLY, FOE]) {
    const kinds = ['melee', 'melee', 'ranged'];
    kinds.forEach((kind, i) => {
      G.spawnQueue.push({ side, kind, delay: 0.3 + i * 0.34 });
    });
  }
}
function pushCreep(side, kind) {
  const st = creepStats(side, kind, G.wave);
  G.units.push({
    side, kind, hp: st.hp, maxHp: st.hp, dmg: st.dmg, range: st.range, rate: st.rate,
    spd: st.spd, r: st.r, aggro: st.aggro, xp: st.xp,
    x: side === ALLY ? ALLY_BASE_X + 34 : FOE_BASE_X - 34,
    y: LANE_TOP + rnd() * (LANE_BOT - LANE_TOP),
    laneY: LANE_TOP + rnd() * (LANE_BOT - LANE_TOP),
    atkCd: rnd() * 0.4, hurt: 0, anim: rnd() * 3, moving: true, facing: side, dead: false,
  });
}

function newGame() {
  G = {
    time: 0, wave: 0, waveT: 1.2, kills: 0, towerKills: 0,
    units: [], structs: [], shots: [], parts: [], fx: [], spawnQueue: [],
  };
  for (const layout of STRUCT_LAYOUT) {
    const hp = layout.kind === 'tower' ? TOWER_HP : BASE_HP;
    G.structs.push({ side: layout.side, kind: layout.kind, x: layout.x, order: layout.order,
      hp, maxHp: hp, atkCd: 0, streak: 0, streakOn: null });
  }
  G.hero = mkHero(ALLY);
  G.foeHero = mkHero(FOE);
  G.units.push(G.hero, G.foeHero);
}

function isTargetable(s) {
  if (s.hp <= 0) return false;
  for (const o of G.structs) if (o.side === s.side && o.order < s.order && o.hp > 0) return false;
  return true;
}
function frontStruct(side) {
  let best = null;
  for (const s of G.structs) if (s.side === side && s.hp > 0 && (!best || s.order < best.order)) best = s;
  return best;
}

/* ── 연출 헬퍼 ── */
function banner(text) { $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1700; }
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, s = spd * (0.35 + rnd() * 0.85);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color, size: 2 + rnd() * 3 });
  }
}
function popText(x, y, text, color) { G.parts.push({ x, y, vx: (rnd() - 0.5) * 10, vy: -30, life: 1, text, color }); }
function addFx(o) { G.fx.push(o); }

/* ── 전투 ── */
function unitTop(u) { return u.kind === 'hero' ? 34 : 26; }

function dealDamage(target, dmg, src) {
  if (target.hp <= 0) return;
  target.hp -= dmg;
  target.hurt = 0.16;
  if (target.hp <= 0) killUnit(target, src);
}
function killUnit(u, src) {
  u.hp = 0;
  const p = PAL[u.side];
  burst(u.x, u.y - 10, p.armor, u.kind === 'hero' ? 22 : 12, u.kind === 'hero' ? 170 : 120);
  burst(u.x, u.y - 10, p.glow, 6, 90);
  if (u.kind === 'hero') {
    // 적 영웅은 조금 더 오래 눕는다 — 처치가 곧 공성 기회가 되도록
    u.dead = true; u.respawn = u === G.hero ? 8 : 11; shake = Math.max(shake, 9);
    popText(u.x, u.y - 30, TR('fDown'), '#ff7a6a');
    if (u === G.hero) banner(TR('bHeroDown'));
    else {
      banner(TR('bFoeHero'));
      if (src === G.hero) { G.kills++; gainXp(260, { x: u.x, y: u.y - 40 }); }
    }
    return;
  }
  G.units = G.units.filter(o => o !== u);
  if (u.side === FOE) {
    if (src === G.hero) { G.kills++; gainXp(u.xp, { x: u.x, y: u.y - 26 }); }
    else if (Math.abs(G.hero.x - u.x) < 230 && !G.hero.dead) gainXp(Math.round(u.xp * 0.45), null);
  }
}
/** at: 경험치 팝업을 띄울 위치 (없으면 팝업 없음) — 영웅 머리 위 표식과 겹치지 않게 처치 지점에 띄운다 */
function gainXp(amount, at) {
  const h = G.hero;
  if (h.level >= 10) return;
  h.xp += amount;
  if (at) popText(at.x, at.y, '+' + amount, '#8fd4ff');
  while (h.level < 10 && h.xp >= XP_NEED(h.level)) {
    h.xp -= XP_NEED(h.level);
    h.level++;
    h.maxHp = heroMaxHp(h.level);
    h.hp = h.maxHp;
    addFx({ kind: 'levelup', x: h.x, y: h.y - 14, age: 0, life: 0.8 });
    burst(h.x, h.y - 14, '#ffd85c', 20, 150);
    popText(h.x, h.y - 80, TR('fLevelUp'), '#ffd85c');
    banner(TR('bLevelUp'));
  }
  if (h.level >= 10) h.xp = 0;
}
function foeHeroLevel() {
  const h = G.foeHero;
  // 플레이어를 두 레벨 뒤에서 따라간다 — 계속 견제는 되지만 벽이 되지는 않는다
  const want = Math.min(10, Math.max(1 + Math.floor(G.time / 55), G.hero.level - 2));
  if (want > h.level) {
    const ratio = h.hp / h.maxHp;
    h.level = want; h.maxHp = heroMaxHp(want); h.hp = h.maxHp * Math.min(1, ratio + 0.25);
    addFx({ kind: 'levelup', x: h.x, y: h.y - 14, age: 0, life: 0.8 });
  }
}

function shootAt(from, target, dmg, side, kind) {
  G.shots.push({ x: from.x, y: from.y - (kind === 'tower' ? 0 : 12), target, dmg, side, kind, life: 2.2 });
}
function meleeHit(u, target, dmg) {
  const tx = target.x;
  const ty = target.y !== undefined ? target.y - 12 : (target.kind === 'base' ? BASE_Y : TOWER_Y) - 30;
  addFx({ kind: 'slash', x: (u.x + tx) / 2, y: (u.y - 12 + ty) / 2, dir: u.facing, age: 0, life: 0.18 });
  burst(tx, ty, '#f4ecff', 4, 70);
  if (target.kind === 'tower' || target.kind === 'base') hitStruct(target, dmg, u);
  else dealDamage(target, dmg, u);
}
function hitStruct(s, dmg, src) {
  if (s.hp <= 0 || !isTargetable(s)) return;
  s.hp -= dmg;
  burst(s.x + (rnd() - 0.5) * 24, (s.kind === 'base' ? BASE_Y : TOWER_Y) - 34, PAL[s.side].stoneHi, 4, 80);
  if (s.hp <= 0) {
    s.hp = 0;
    shake = Math.max(shake, 14);
    const yTop = (s.kind === 'base' ? BASE_Y : TOWER_Y) - 46;
    addFx({ kind: 'boom', x: s.x, y: yTop, age: 0, life: 0.9 });
    burst(s.x, yTop, PAL[s.side].stone, 30, 190);
    burst(s.x, yTop, PAL[s.side].glow, 16, 150);
    if (s.kind === 'tower') {
      if (s.side === FOE) {
        G.towerKills++; banner(TR('bFoeTower'));
        gainXp(src === G.hero ? 180 : 120, { x: s.x, y: yTop + 20 });
        if (!frontStruct(FOE) || frontStruct(FOE).kind === 'base') setTimeout(() => { if (running) banner(TR('bFoeExposed')); }, 1500);
      } else {
        banner(TR('bAllyTower'));
        if (!frontStruct(ALLY) || frontStruct(ALLY).kind === 'base') setTimeout(() => { if (running) banner(TR('bAllyExposed')); }, 1500);
      }
    } else {
      endGame(s.side === FOE);
    }
  }
}

/** 유닛의 목표 — 사거리 안 적 유닛 우선, 없으면 전진해서 앞선 구조물 */
function acquire(u) {
  let best = null, bd = Infinity;
  for (const o of G.units) {
    if (o.side === u.side || o.hp <= 0 || o.dead) continue;
    const d = Math.hypot(o.x - u.x, o.y - u.y);
    if (d < bd) { bd = d; best = o; }
  }
  if (best && bd <= u.aggro) return { obj: best, dist: bd, isUnit: true };
  const s = frontStruct(-u.side);
  if (!s) return null;
  const sy = (s.kind === 'base' ? BASE_Y : TOWER_Y) - 30;
  return { obj: s, dist: Math.hypot(s.x - u.x, sy - u.y), isUnit: false };
}

function updateCreep(u, dt) {
  u.hurt = Math.max(0, u.hurt - dt);
  u.atkCd = Math.max(0, u.atkCd - dt);
  const aim = acquire(u);
  u.moving = false;
  if (!aim) return;
  const ty = aim.isUnit ? aim.obj.y : (aim.obj.kind === 'base' ? BASE_Y : TOWER_Y) - 30;
  const reach = u.range + (aim.isUnit ? aim.obj.r : 26);
  if (aim.dist > reach) {
    // 전진 — 앞으로 밀되 자기 레인 높이로 수렴한다
    const dx = aim.obj.x - u.x, dy = ty - u.y;
    const d = Math.hypot(dx, dy) || 1;
    u.x += dx / d * u.spd * dt;
    u.y += (aim.isUnit ? dy / d : (u.laneY - u.y) * 0.9) * u.spd * dt * (aim.isUnit ? 1 : 0.02);
    u.y = clamp(u.y, LANE_TOP, LANE_BOT);
    u.facing = dx >= 0 ? 1 : -1;
    u.moving = true;
    u.anim += dt;
  } else if (u.atkCd <= 0) {
    u.atkCd = u.rate;
    u.facing = aim.obj.x >= u.x ? 1 : -1;
    if (u.kind === 'ranged') shootAt(u, aim.obj, u.dmg, u.side, 'bolt');
    else meleeHit(u, aim.obj, u.dmg);
  }
}

function updatePlayerHero(dt) {
  const h = G.hero;
  h.hurt = Math.max(0, h.hurt - dt);
  h.atkCd = Math.max(0, h.atkCd - dt);
  h.qCd = Math.max(0, h.qCd - dt);
  h.eCd = Math.max(0, h.eCd - dt);
  if (h.dead) {
    h.respawn -= dt;
    if (h.respawn <= 0) {
      h.dead = false; h.hp = h.maxHp;
      h.x = ALLY_BASE_X + 26; h.y = 372;
      addFx({ kind: 'levelup', x: h.x, y: h.y - 14, age: 0, life: 0.7 });
      burst(h.x, h.y - 14, '#8fd4ff', 18, 140);
    }
    return;
  }
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.KeyA) mx -= 1;
  if (keys.ArrowRight || keys.KeyD) mx += 1;
  if (keys.ArrowUp || keys.KeyW) my -= 1;
  if (keys.ArrowDown || keys.KeyS) my += 1;
  h.moving = !!(mx || my);
  if (h.moving) {
    const d = Math.hypot(mx, my) || 1;
    h.x = clamp(h.x + mx / d * h.spd * dt, 22, VW - 22);
    h.y = clamp(h.y + my / d * h.spd * dt, HERO_TOP, HERO_BOT);
    if (mx) h.facing = mx > 0 ? 1 : -1;
    h.anim += dt;
  }
  // 회복 — 상시 소량 + 본진 근처 대량 + 재생 오라
  h.hp = Math.min(h.maxHp, h.hp + 1.6 * dt);
  if (Math.abs(h.x - ALLY_BASE_X) < 74) h.hp = Math.min(h.maxHp, h.hp + 24 * dt);
  if (h.auraT > 0) {
    h.auraT -= dt;
    const heal = (16 + h.level * 3) * dt;
    h.hp = Math.min(h.maxHp, h.hp + heal);
    for (const o of G.units) {
      if (o.side !== ALLY || o === h || o.hp <= 0) continue;
      if (Math.hypot(o.x - h.x, o.y - h.y) < 92) o.hp = Math.min(o.maxHp, o.hp + heal * 0.5);
    }
  }
  // 자동 평타
  if (h.atkCd <= 0) {
    let best = null, bd = Infinity;
    for (const o of G.units) {
      if (o.side === ALLY || o.hp <= 0 || o.dead) continue;
      const d = Math.hypot(o.x - h.x, o.y - h.y);
      if (d < bd) { bd = d; best = o; }
    }
    if (best && bd <= h.range + best.r) {
      h.atkCd = h.rate; h.facing = best.x >= h.x ? 1 : -1;
      meleeHit(h, best, heroDmg(h.level, h.baseDmg));
    } else {
      const s = frontStruct(FOE);
      if (s && Math.abs(s.x - h.x) <= h.range + 24) {
        h.atkCd = h.rate; h.facing = s.x >= h.x ? 1 : -1;
        meleeHit(h, s, heroDmg(h.level, h.baseDmg));
      }
    }
  }
}

function castRiftBurst(h) {
  if (h.dead || h.qCd > 0) return;
  h.qCd = 6;
  const dmg = 34 + h.level * 9;
  const reach = 142, half = Math.PI * 0.28;
  addFx({ kind: 'burst', x: h.x, y: h.y - 14, dir: h.facing, age: 0, life: 0.45, reach });
  shake = Math.max(shake, 5);
  for (const o of G.units) {
    if (o.side === h.side || o.hp <= 0 || o.dead) continue;
    const dx = o.x - h.x, dy = (o.y - 12) - (h.y - 14);
    const d = Math.hypot(dx, dy);
    if (d > reach) continue;
    const ang = Math.atan2(dy, dx * h.facing);
    if (Math.abs(ang) > half) continue;
    dealDamage(o, dmg, h);
    burst(o.x, o.y - 12, '#d9a4ff', 6, 110);
  }
  const s = frontStruct(-h.side);
  if (s && Math.abs(s.x - h.x) < reach && (s.x - h.x) * h.facing > 0) hitStruct(s, Math.round(dmg * 0.6), h);
}
function castMendAura(h) {
  if (h.dead || h.eCd > 0) return;
  h.eCd = 12;
  h.auraT = 3;
  burst(h.x, h.y - 12, '#8fe8a4', 14, 70);
}

function updateFoeHero(dt) {
  const h = G.foeHero;
  h.hurt = Math.max(0, h.hurt - dt);
  h.atkCd = Math.max(0, h.atkCd - dt);
  h.qCd = Math.max(0, h.qCd - dt);
  h.eCd = Math.max(0, h.eCd - dt);
  if (h.dead) {
    h.respawn -= dt;
    if (h.respawn <= 0) {
      h.dead = false; h.hp = h.maxHp; h.retreat = false;
      h.x = FOE_BASE_X - 26; h.y = 372;
      burst(h.x, h.y - 14, '#ff9a5c', 16, 130);
    }
    return;
  }
  foeHeroLevel();
  h.hp = Math.min(h.maxHp, h.hp + 1.6 * dt);
  if (Math.abs(h.x - FOE_BASE_X) < 74) h.hp = Math.min(h.maxHp, h.hp + 15 * dt);
  if (h.auraT > 0) { h.auraT -= dt; h.hp = Math.min(h.maxHp, h.hp + (16 + h.level * 3) * dt); }

  // 판단은 0.35초마다 — 즉각 반응하지 않아 상대하기 편하다
  h.think -= dt;
  if (h.think <= 0) {
    h.think = 0.35;
    const ratio = h.hp / h.maxHp;
    if (ratio < 0.34) h.retreat = true;
    else if (ratio > 0.72) h.retreat = false;
    if (h.eCd <= 0 && ratio < 0.58) castMendAura(h);
  }
  // 자기 크립 최전선 뒤에 선다
  let front = null;
  for (const o of G.units) {
    if (o.side !== FOE || o.kind === 'hero' || o.hp <= 0) continue;
    if (front === null || o.x < front) front = o.x;
  }
  let want;
  if (h.retreat) want = FOE_BASE_X - 30;
  else if (front !== null) want = front + 30;
  else {
    const own = frontStruct(FOE);
    want = own ? own.x + 26 : FOE_BASE_X - 30;
  }
  // 아군 수호탑 사거리 안으로는 크립 없이 들어가지 않는다
  const allyTower = G.structs.find(s => s.side === ALLY && s.kind === 'tower' && s.hp > 0 && isTargetable(s));
  if (allyTower && front === null) want = Math.max(want, allyTower.x + TOWER_RANGE + 26);
  want = clamp(want, 30, VW - 30);

  let target = null, bd = Infinity;
  for (const o of G.units) {
    if (o.side === FOE || o.hp <= 0 || o.dead) continue;
    const d = Math.hypot(o.x - h.x, o.y - h.y);
    if (d < bd) { bd = d; target = o; }
  }
  const inRange = target && bd <= h.range + target.r;
  h.moving = false;
  if (!inRange) {
    const dx = want - h.x;
    let dy = 0;
    if (target && !h.retreat && Math.abs(target.x - h.x) < 140) dy = target.y - h.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
      const d = Math.hypot(dx, dy) || 1;
      h.x = clamp(h.x + dx / d * h.spd * dt, 22, VW - 22);
      h.y = clamp(h.y + dy / d * h.spd * dt, HERO_TOP, HERO_BOT);
      h.facing = dx >= 0 ? 1 : -1;
      h.moving = true; h.anim += dt;
    }
  } else if (h.atkCd <= 0) {
    h.atkCd = h.rate; h.facing = target.x >= h.x ? 1 : -1;
    meleeHit(h, target, heroDmg(h.level, h.baseDmg));
  }
  // 전방 부채꼴에 둘 이상 걸리면 균열 폭발
  if (h.qCd <= 0 && !h.retreat) {
    let hit = 0;
    for (const o of G.units) {
      if (o.side === FOE || o.hp <= 0 || o.dead) continue;
      const dx = o.x - h.x, dy = o.y - h.y, d = Math.hypot(dx, dy);
      if (d < 140 && Math.abs(Math.atan2(dy, dx * h.facing)) < Math.PI * 0.28) hit++;
    }
    if (hit >= 2) castRiftBurst(h);
  }
  // 구조물 공격
  if (!inRange && h.atkCd <= 0) {
    const s = frontStruct(ALLY);
    if (s && Math.abs(s.x - h.x) <= h.range + 24) {
      h.atkCd = h.rate; h.facing = -1;
      meleeHit(h, s, heroDmg(h.level, h.baseDmg));
    }
  }
}

function updateTowers(dt) {
  for (const s of G.structs) {
    if (s.kind !== 'tower' || s.hp <= 0) continue;
    s.atkCd = Math.max(0, s.atkCd - dt);
    if (s.atkCd > 0) continue;
    const ty = TOWER_Y - 58;
    let creep = null, cd2 = TOWER_RANGE * TOWER_RANGE, hero = null;
    for (const o of G.units) {
      if (o.side === s.side || o.hp <= 0 || o.dead) continue;
      const q = (o.x - s.x) * (o.x - s.x) + (o.y - ty) * (o.y - ty) * 0.35;
      if (q > TOWER_RANGE * TOWER_RANGE) continue;
      if (o.kind === 'hero') { hero = o; continue; }
      if (q < cd2) { cd2 = q; creep = o; }
    }
    const target = creep || hero;
    if (!target) { s.streak = 0; s.streakOn = null; continue; }
    s.atkCd = TOWER_RATE;
    if (s.streakOn === target) s.streak = Math.min(4, s.streak + 1);
    else { s.streakOn = target; s.streak = 0; }
    const dmg = Math.round(TOWER_DMG * (1 + s.streak * 0.25));
    G.shots.push({ x: s.x, y: ty, target, dmg, side: s.side, kind: 'tower', life: 2.2 });
  }
}

function updateShots(dt) {
  for (const sh of [...G.shots]) {
    sh.life -= dt;
    const alive = sh.target && sh.target.hp > 0 && !sh.target.dead;
    const tx = alive ? sh.target.x : sh.lastX !== undefined ? sh.lastX : sh.x;
    const ty = alive ? (sh.target.y !== undefined ? sh.target.y - 12 : (sh.target.kind === 'base' ? BASE_Y : TOWER_Y) - 34)
      : (sh.lastY !== undefined ? sh.lastY : sh.y);
    sh.lastX = tx; sh.lastY = ty;
    const spd = sh.kind === 'tower' ? 470 : 350;
    const dx = tx - sh.x, dy = ty - sh.y, d = Math.hypot(dx, dy) || 1;
    sh.ang = Math.atan2(dy, dx);
    sh.x += dx / d * spd * dt; sh.y += dy / d * spd * dt;
    if (d < 9 || sh.life <= 0) {
      if (d < 9 && alive) {
        if (sh.target.kind === 'tower' || sh.target.kind === 'base') hitStruct(sh.target, sh.dmg, null);
        else dealDamage(sh.target, sh.dmg, null);
        burst(sh.x, sh.y, sh.kind === 'tower' ? '#ffe08a' : PAL[sh.side].glow, 5, 80);
      }
      G.shots = G.shots.filter(o => o !== sh);
    }
  }
}

function update(dt) {
  G.time += dt;
  G.waveT -= dt;
  if (G.waveT <= 0) { G.waveT = WAVE_GAP; spawnWave(); }
  for (const q of [...G.spawnQueue]) {
    q.delay -= dt;
    if (q.delay <= 0) { pushCreep(q.side, q.kind); G.spawnQueue = G.spawnQueue.filter(o => o !== q); }
  }
  for (const u of [...G.units]) {
    if (u.kind === 'hero') continue;
    if (u.hp > 0) updateCreep(u, dt);
  }
  updatePlayerHero(dt);
  if (!running) return;
  updateFoeHero(dt);
  updateTowers(dt);
  updateShots(dt);

  for (const fx of [...G.fx]) {
    fx.age += dt;
    if (fx.age >= fx.life) G.fx = G.fx.filter(o => o !== fx);
  }
  for (const q of [...G.parts]) {
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vy += (q.text ? 0 : q.drift ? -20 : 190) * dt;
    q.life -= dt * (q.text ? 0.95 : 1.85);
    if (q.life <= 0) G.parts = G.parts.filter(o => o !== q);
  }
  shake = Math.max(0, shake - dt * 32);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}

/* ── 렌더 ── */
function unitBar(u) {
  const w = u.kind === 'hero' ? 40 : 22;
  const top = u.y - unitTop(u) - 7;
  cx.fillStyle = 'rgba(4,3,10,.72)'; cx.fillRect(u.x - w / 2 - 1, top - 1, w + 2, 6);
  cx.fillStyle = u.side === ALLY ? '#5fd07a' : '#e0563f';
  cx.fillRect(u.x - w / 2, top, w * clamp(u.hp / u.maxHp, 0, 1), 4);
  cx.fillStyle = 'rgba(255,255,255,.25)'; cx.fillRect(u.x - w / 2, top, w * clamp(u.hp / u.maxHp, 0, 1), 1);
}

function drawUnit(u, now) {
  if (u.hp <= 0 || u.dead) return;
  const frame = u.moving ? (Math.floor(u.anim * 7) % 2) : 0;
  let img;
  if (u.kind === 'hero') img = heroSprite(u.side, frame);
  else if (u.kind === 'melee') img = meleeSprite(u.side, frame);
  else img = rangedSprite(u.side, frame);
  shadow(u.x, u.y + 1, u.kind === 'hero' ? 13 : 10);
  // 내 영웅은 난전 속에서도 바로 찾을 수 있어야 한다 — 발밑 링 + 머리 위 표식
  if (u === G.hero) {
    const pulse = 0.5 + Math.sin(now * 0.006) * 0.5;
    cx.save();
    cx.strokeStyle = 'rgba(8,5,16,.7)'; cx.lineWidth = 4;
    cx.beginPath(); cx.ellipse(u.x, u.y, 15, 5.5, 0, 0, 7); cx.stroke();
    cx.globalAlpha = 0.55 + pulse * 0.45;
    cx.strokeStyle = '#7ce8ff'; cx.lineWidth = 2;
    cx.beginPath(); cx.ellipse(u.x, u.y, 15, 5.5, 0, 0, 7); cx.stroke();
    cx.restore();
    const bob = Math.sin(now * 0.005) * 2, my = u.y - 64 + bob;
    cx.fillStyle = OUTLINE;
    cx.beginPath(); cx.moveTo(u.x - 7, my); cx.lineTo(u.x + 7, my); cx.lineTo(u.x, my + 9); cx.fill();
    cx.fillStyle = '#7ce8ff';
    cx.beginPath(); cx.moveTo(u.x - 5, my + 1); cx.lineTo(u.x + 5, my + 1); cx.lineTo(u.x, my + 7); cx.fill();
  }
  // 재생 오라 링
  if (u.auraT > 0) {
    cx.save();
    for (let i = 0; i < 2; i++) {
      const phase = ((now * 0.0011 + i * 0.5) % 1);
      cx.globalAlpha = (1 - phase) * 0.55;
      cx.strokeStyle = '#8fe8a4'; cx.lineWidth = 2;
      cx.beginPath(); cx.ellipse(u.x, u.y - 4, 12 + phase * 30, (12 + phase * 30) * 0.36, 0, 0, 7); cx.stroke();
    }
    cx.restore();
    if (rnd() < 0.35) G.parts.push({ x: u.x + (rnd() - 0.5) * 26, y: u.y - 2, vx: 0, vy: -34,
      life: 0.8, color: '#8fe8a4', size: 2, drift: true });
  }
  drawSprite(img, u.x, u.y, u.facing < 0, u.hurt > 0);
  unitBar(u);
  if (u.kind === 'hero') {
    cx.font = 'bold 9px monospace'; cx.textAlign = 'center';
    cx.fillStyle = u.side === ALLY ? '#8fd4ff' : '#ff9d7a';
    cx.fillText((u.side === ALLY ? '★' : '☠') + 'Lv' + u.level, u.x, u.y - unitTop(u) - 11);
  }
}

function drawFx(fx) {
  const k = fx.age / fx.life;
  if (fx.kind === 'burst') {
    const reach = fx.reach * (0.35 + k * 0.75);
    const half = Math.PI * 0.28;
    const a0 = fx.dir > 0 ? -half : Math.PI - half;
    const a1 = fx.dir > 0 ? half : Math.PI + half;
    cx.save();
    cx.globalAlpha = (1 - k) * 0.55;
    const grad = cx.createRadialGradient(fx.x, fx.y, 6, fx.x, fx.y, reach);
    grad.addColorStop(0, 'rgba(255,240,255,.9)');
    grad.addColorStop(0.5, 'rgba(200,120,255,.55)');
    grad.addColorStop(1, 'rgba(120,50,200,0)');
    cx.fillStyle = grad;
    cx.beginPath(); cx.moveTo(fx.x, fx.y); cx.arc(fx.x, fx.y, reach, a0, a1); cx.closePath(); cx.fill();
    // 톱니 균열선
    cx.globalAlpha = (1 - k) * 0.95;
    cx.strokeStyle = '#f0d4ff'; cx.lineWidth = 2; cx.lineJoin = 'round';
    for (let i = 0; i < 5; i++) {
      const ang = a0 + (a1 - a0) * ((i + 0.5) / 5);
      cx.beginPath(); cx.moveTo(fx.x, fx.y);
      let rr = 0, ox = fx.x, oy = fx.y;
      while (rr < reach) {
        rr += reach / 4;
        const jitter = (i % 2 ? 1 : -1) * (rr * 0.09);
        ox = fx.x + Math.cos(ang) * rr - Math.sin(ang) * jitter;
        oy = fx.y + Math.sin(ang) * rr + Math.cos(ang) * jitter;
        cx.lineTo(ox, oy);
      }
      cx.stroke();
    }
    cx.globalAlpha = (1 - k) * 0.8;
    cx.strokeStyle = '#ffffff'; cx.lineWidth = 2.5;
    cx.beginPath(); cx.arc(fx.x, fx.y, reach, a0, a1); cx.stroke();
    cx.restore();
  } else if (fx.kind === 'slash') {
    cx.save();
    cx.globalAlpha = 1 - k;
    cx.strokeStyle = '#fdf6ff'; cx.lineWidth = 3;
    cx.beginPath();
    cx.arc(fx.x, fx.y, 14, fx.dir > 0 ? -0.9 : Math.PI - 0.9, fx.dir > 0 ? 0.9 : Math.PI + 0.9);
    cx.stroke();
    cx.restore();
  } else if (fx.kind === 'levelup') {
    cx.save();
    for (let i = 0; i < 2; i++) {
      const kk = clamp(k + i * 0.25, 0, 1);
      cx.globalAlpha = (1 - kk) * 0.9;
      cx.strokeStyle = '#ffd85c'; cx.lineWidth = 3 - i;
      cx.beginPath(); cx.ellipse(fx.x, fx.y + 14, 10 + kk * 46, (10 + kk * 46) * 0.34, 0, 0, 7); cx.stroke();
    }
    cx.restore();
  } else if (fx.kind === 'boom') {
    cx.save();
    cx.globalAlpha = (1 - k) * 0.85;
    cx.strokeStyle = '#ffe3a8'; cx.lineWidth = 4;
    cx.beginPath(); cx.arc(fx.x, fx.y, 12 + k * 80, 0, 7); cx.stroke();
    cx.globalAlpha = (1 - k) * 0.5;
    cx.strokeStyle = '#c88bff'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(fx.x, fx.y, 6 + k * 120, 0, 7); cx.stroke();
    cx.restore();
  }
}

function draw(now) {
  const sx = shake ? (rnd() - 0.5) * shake : 0, sy = shake ? (rnd() - 0.5) * shake : 0;
  cx.save(); cx.translate(sx, sy);
  cx.drawImage(bgFar, 0, 0);
  drawDebris(now);

  // 구조물 — 뒤쪽(y 작은 순)
  for (const s of G.structs) {
    if (s.hp <= 0) continue;
    if (s.kind === 'base') drawBaseStruct(s, now); else drawTowerStruct(s, now);
  }
  // 파괴된 자리엔 잔해
  for (const s of G.structs) {
    if (s.hp > 0) continue;
    const bx = Math.round(s.x), by = s.kind === 'base' ? BASE_Y : TOWER_Y;
    shadow(bx, by + 2, s.kind === 'base' ? 32 : 24);
    px(cx, bx - 22, by - 12, 44, 12, '#241d33');
    px(cx, bx - 22, by - 12, 44, 2, '#3a2f50');
    px(cx, bx - 13, by - 22, 15, 10, '#2c2440');
    px(cx, bx + 5, by - 18, 11, 6, '#2c2440');
    px(cx, bx - 13, by - 22, 15, 2, '#3f3459');
    if (rnd() < 0.1) G.parts.push({ x: bx + (rnd() - 0.5) * 34, y: by - 12, vx: (rnd() - 0.5) * 6,
      vy: -14 - rnd() * 10, life: 1, color: 'rgba(80,70,100,.7)', size: 3, drift: true });
  }

  // 유닛 — y 순 정렬
  const sorted = G.units.filter(u => u.hp > 0 && !u.dead).sort((a, b) => a.y - b.y);
  for (const u of sorted) drawUnit(u, now);

  // 투사체
  for (const sh of G.shots) {
    cx.save(); cx.translate(sh.x, sh.y); cx.rotate(sh.ang || 0);
    if (sh.kind === 'tower') {
      cx.fillStyle = '#1a1206'; cx.fillRect(-8, -4, 16, 8);
      cx.fillStyle = '#ffd85c'; cx.fillRect(-7, -3, 14, 6);
      cx.fillStyle = '#fff6d0'; cx.fillRect(-2, -2, 6, 4);
    } else {
      const p = PAL[sh.side];
      cx.fillStyle = OUTLINE; cx.fillRect(-7, -3, 14, 6);
      cx.fillStyle = p.glow; cx.fillRect(-6, -2, 12, 4);
      cx.fillStyle = '#ffffff'; cx.fillRect(0, -1, 5, 2);
    }
    cx.restore();
  }

  for (const fx of G.fx) drawFx(fx);

  for (const q of G.parts) {
    cx.globalAlpha = clamp(q.life, 0, 1);
    if (q.text) {
      cx.font = 'bold 12px monospace'; cx.textAlign = 'center';
      cx.fillStyle = '#000'; cx.fillText(q.text, q.x + 1, q.y + 1);
      cx.fillStyle = q.color; cx.fillText(q.text, q.x, q.y);
    } else { cx.fillStyle = q.color; cx.fillRect(q.x, q.y, q.size, q.size); }
    cx.globalAlpha = 1;
  }

  // 유닛 앞 전경 낭떠러지
  cx.drawImage(bgNear, 0, 0);
  cx.restore();

  // 부활 카운트
  if (G.hero.dead) {
    cx.save();
    cx.font = 'bold 22px monospace'; cx.textAlign = 'center';
    cx.fillStyle = 'rgba(0,0,0,.75)';
    cx.fillText(fmt('respawnFmt', { '%n': Math.ceil(G.hero.respawn) }), VW / 2 + 2, 200 + 2);
    cx.fillStyle = '#ff8a7a';
    cx.fillText(fmt('respawnFmt', { '%n': Math.ceil(G.hero.respawn) }), VW / 2, 200);
    cx.restore();
  }
  syncHud();
}

function syncHud() {
  const h = G.hero;
  const allyBase = G.structs.find(s => s.side === ALLY && s.kind === 'base');
  const foeBase = G.structs.find(s => s.side === FOE && s.kind === 'base');
  $('allyBaseTxt').textContent = '🔷 ' + TR('allyNexus') + ' ' + Math.max(0, Math.ceil(allyBase.hp));
  $('foeBaseTxt').textContent = '🔶 ' + TR('foeNexus') + ' ' + Math.max(0, Math.ceil(foeBase.hp));
  $('lvTxt').textContent = fmt('lvFmt', { '%n': h.level });
  $('killTxt').textContent = fmt('killFmt', { '%n': G.kills });
  $('waveTxt').textContent = fmt('waveFmt', { '%n': G.wave });
  const hpRatio = clamp(h.hp / h.maxHp, 0, 1);
  $('hpFill').style.width = (hpRatio * 100) + '%';
  $('hpTxt').textContent = Math.max(0, Math.ceil(h.hp)) + ' / ' + h.maxHp;
  const need = XP_NEED(h.level);
  $('xpFill').style.width = (h.level >= 10 ? 100 : clamp(h.xp / need, 0, 1) * 100) + '%';
  skillIcon($('skQ'), h.qCd, 6);
  skillIcon($('skE'), h.eCd, 12);
}
function skillIcon(el, cd, max) {
  el.classList.toggle('ready', cd <= 0);
  el.querySelector('.cdmask').style.setProperty('--a', (cd / max) * 360 + 'deg');
  el.querySelector('.left').textContent = cd > 0 ? Math.ceil(cd) : '';
}

/* ── 입력 ── */
addEventListener('keydown', ev => {
  const c = ev.code;
  if (c === 'ArrowUp' || c === 'ArrowDown' || c === 'ArrowLeft' || c === 'ArrowRight' || c === 'Space') ev.preventDefault();
  keys[c] = true;
  if (!running || ev.repeat) return;
  if (c === 'KeyQ') castRiftBurst(G.hero);
  if (c === 'KeyE') castMendAura(G.hero);
});
addEventListener('keyup', ev => { keys[ev.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ── 시작 / 종료 ── */
function startGame() {
  newGame();
  running = true;
  for (const k in keys) keys[k] = false;
  $('menu').hidden = true; $('endPanel').hidden = true;
  $('hud').hidden = false; $('bars').hidden = false; $('skills').hidden = false;
  banner(TR('bStart'));
}
function endGame(win) {
  if (!running) return;
  running = false;
  $('hud').hidden = true; $('bars').hidden = true; $('skills').hidden = true;
  $('banner').classList.remove('on');
  const score = G.kills * 50 + G.towerKills * 500 + G.hero.level * 100 + (win ? 3000 : 0);
  const detail = 'Lv.' + G.hero.level + ' ' + G.kills + '킬';
  $('endTitle').textContent = TR(win ? 'winTitle' : 'loseTitle');
  $('endDesc').textContent = fmt(win ? 'winDesc' : 'loseDesc', {
    '%l': G.hero.level, '%k': G.kills, '%w': G.towerKills, '%s': score,
  });
  $('endPanel').hidden = false;
  GameRank.submit('rift-front', score, detail).then(r => {
    if (r && r.applied) $('endDesc').textContent += fmt('rankLine', { '%n': r.rank });
  });
}

let last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  moveDebris(dt);
  if (!G) return;
  if (running) update(dt);
  if (G) draw(now);
}

buildBackground();
newGame();
$('startBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('backBtn').onclick = () => { $('endPanel').hidden = true; $('menu').hidden = false; };
requestAnimationFrame(loop);
</script>
<script src="../lib/touch.js" data-actions="KeyQ:💥,KeyE:✚"></script>
<script src="../lib/rank.js"></script>
<script>
GameRank.autoPanel('rift-front');
</script>
