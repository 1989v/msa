<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">별빛 온실</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dbe4f2; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:flex-start; min-height:100vh; user-select:none; padding:14px 0 22px; }
  #wrap { width:min(460px, 100vw); padding:0 10px; }
  h1 { color:#a855f7; font-size:22px; text-align:center; text-shadow:2px 2px 0 #000; margin:4px 0 2px; }
  #sub { text-align:center; font-size:11px; color:#8b98b8; margin-bottom:10px; line-height:1.6; }
  #sky { display:block; width:100%; border:3px solid #1a2238; border-radius:12px; background:#0c1424; }
  #hud { display:flex; gap:6px; justify-content:center; margin:10px 0; font-size:12.5px; font-weight:bold; flex-wrap:wrap; }
  #hud span { background:#1a2238; border:1px solid #263050; padding:4px 10px; border-radius:9px; }
  #dustTxt { color:#eab308; }
  #visitor { display:flex; align-items:center; gap:8px; background:rgba(168,85,247,.12); border:1px dashed #a855f7;
             border-radius:9px; padding:8px 10px; margin-bottom:9px; font-size:11.5px; line-height:1.55; }
  #visTxt { flex:1; text-align:left; }
  #visitor button { background:#1a2238; color:#8b98b8; border:1px solid #263050; border-radius:6px; padding:5px 9px;
                    cursor:pointer; font-family:inherit; font-size:10.5px; white-space:nowrap; }
  #farm { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px; }
  .plot { position:relative; background:#1a2238; border:1px solid #263050; border-radius:10px; min-height:88px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
          font-family:inherit; color:inherit; touch-action:manipulation; padding:7px 4px; }
  .plot.empty { border-style:dashed; color:#8b98b8; background:rgba(26,34,56,.55); }
  .plot .pe { font-size:26px; line-height:1.15; }
  .plot.grow .pe { filter:saturate(.8); }
  .plot.ready { border-color:#22c55e; animation:pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 8px rgba(34,197,94,.25); } 50% { box-shadow:0 0 17px rgba(34,197,94,.5); } }
  .plot .pbar { width:74%; height:5px; background:#0c1424; border-radius:3px; overflow:hidden; }
  .plot .pfill { display:block; height:100%; width:0; background:#0ea5e9; border-radius:3px; transition:width .6s linear; }
  .plot .plabel { font-size:10px; color:#8b98b8; }
  .plot.ready .plabel { color:#22c55e; font-weight:bold; }
  .float { position:absolute; top:6px; left:50%; transform:translateX(-50%); color:#eab308; font-weight:bold;
           font-size:12px; animation:rise 1.1s forwards; pointer-events:none; text-shadow:1px 1px 0 #000; }
  @keyframes rise { to { transform:translate(-50%, -24px); opacity:0; } }
  .shop { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .shop button, #seedList button { display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:left;
    background:#1a2238; border:1px solid #263050; color:#dbe4f2; padding:9px 12px; border-radius:8px;
    cursor:pointer; font-family:inherit; font-size:12px; }
  .shop button:disabled, #seedList button:disabled { opacity:.38; cursor:default; }
  .shop button b, #seedList button b { display:block; font-size:13px; }
  .shop button small, #seedList button small { color:#8b98b8; font-size:10.5px; }
  .shop button .price, #seedList button .price { color:#eab308; font-weight:bold; white-space:nowrap; font-size:11.5px; }
  .btnRow { display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
  .btnRow button, .panel .row button { background:#0ea5e9; color:#06121f; border:0; padding:9px 18px; border-radius:7px;
    cursor:pointer; font-family:inherit; font-weight:bold; font-size:12.5px; }
  button.ghost { background:#1a2238 !important; color:#dbe4f2 !important; border:1px solid #263050 !important; }
  #saveRow { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin:12px 0 4px; }
  #saveRow input { background:#1a2238; border:1px solid #263050; color:#dbe4f2; border-radius:6px; padding:6px 9px;
                   font-family:inherit; font-size:12px; letter-spacing:1px; width:160px; text-transform:uppercase; }
  #saveRow button { background:#263050; color:#dbe4f2; border:0; padding:7px 12px; border-radius:6px;
                    cursor:pointer; font-family:inherit; font-size:11px; }
  #saveStatus, #codeShow { text-align:center; font-size:10.5px; color:#8b98b8; margin-top:3px; }
  #codeShow { color:#eab308; letter-spacing:2px; }
  #menu { justify-content:center; }
  .panel { position:fixed; inset:0; background:rgba(12,20,36,.97); z-index:20; overflow-y:auto; display:flex;
           flex-direction:column; align-items:center; padding:26px 14px 32px; text-align:center; }
  .panel h1 { margin-bottom:8px; }
  .panel p { font-size:12.5px; color:#b7c3da; line-height:1.8; max-width:430px; margin-bottom:5px; }
  .panel p.small { font-size:11px; color:#8b98b8; }
  .panel .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  #seedList { width:min(430px, 94vw); display:flex; flex-direction:column; gap:6px; margin:12px 0 8px; }
  #dexGrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:min(430px, 94vw); margin:12px 0 4px; }
  .dexCard { background:#1a2238; border:1px solid #263050; border-radius:9px; padding:9px 4px 7px; font-size:9.5px;
             color:#8b98b8; display:flex; flex-direction:column; gap:3px; align-items:center; line-height:1.35; }
  .dexCard .de { font-size:22px; }
  .dexCard.got { color:#dbe4f2; border-color:#0ea5e9; }
  .dexCard.varc { border-color:#a855f7; }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:rgba(12,20,36,.94);
           border:1px solid #263050; padding:8px 18px; border-radius:9px; font-size:12px; opacity:0;
           transition:opacity .3s; pointer-events:none; z-index:99; max-width:92vw; text-align:center; }
</style>

<body>
<div id="wrap">
  <h1 data-i18n="h1">🌌 별빛 온실</h1>
  <div id="sub" data-i18n="sub">밤하늘 아래, 서두르지 않아도 되는 작은 온실 — 자리를 비워도 별빛이 작물을 키운다</div>
  <canvas id="sky" width="430" height="150"></canvas>
  <div id="hud">
    <span id="dustTxt"></span><span id="dexTxt"></span><span id="harvTxt"></span><span id="nightTxt"></span>
  </div>
  <div id="visitor" hidden>
    <span id="visTxt"></span>
    <button id="visBye" data-i18n="visBye">다음에</button>
  </div>
  <div id="farm"></div>
  <div class="shop" id="shop"></div>
  <div class="btnRow"><button id="dexBtn" data-i18n="dexBtn">📖 별빛 도감</button></div>
  <div id="saveRow">
    <input id="codeInput" placeholder="이어하기 코드" data-i18n-ph="phCode" maxlength="18" autocomplete="off">
    <button id="codeLoadBtn" data-i18n="btnCodeLoad">🔑 코드로 불러오기</button>
  </div>
  <div id="codeShow"></div>
  <div id="saveStatus"></div>
</div>

<div class="panel" id="menu">
  <h1 data-i18n="menuTitle">🌌 별빛 온실</h1>
  <p data-i18n="menuDesc">별빛을 머금은 씨앗을 심고, 기다리고, 거둔다.</p>
  <p class="small" data-i18n="menuTip1">🌱 밭을 탭해 심고 · 다 자라면 탭해서 수확</p>
  <p class="small" data-i18n="menuTip2">💞 이웃한 두 밭이 함께 여물면, 드물게 변종 씨앗이 맺힌다</p>
  <p class="small" data-i18n="menuTip3">🧚 가끔 별 정령이 들러 작물을 부탁한다 — 급할 건 없다</p>
  <div class="row"><button id="startBtn" data-i18n="startBtn">🌱 온실 들어가기</button></div>
</div>

<div class="panel" id="seedPanel" hidden>
  <h1 data-i18n="seedTitle">🌱 씨앗 고르기</h1>
  <p class="small" id="seedDust"></p>
  <div id="seedList"></div>
  <p class="small" data-i18n="seedHint">💞 변종 씨앗: 이웃 밭도 여문 상태에서 수확하면 가끔 얻는다</p>
  <div class="row"><button id="seedClose" class="ghost" data-i18n="seedClose">닫기</button></div>
</div>

<div class="panel" id="dexPanel" hidden>
  <h1 data-i18n="dexTitle">📖 별빛 도감</h1>
  <p class="small" id="dexSum"></p>
  <div id="dexGrid"></div>
  <div class="row">
    <button id="dexClose" data-i18n="dexClose">🌿 온실로 돌아가기</button>
    <button id="backBtn" class="ghost" data-i18n="backBtn">처음으로</button>
  </div>
</div>

<div id="toast"></div>

for (var ci = 0; ci < CROPS.length; ci++) CROPS[ci].n = 'c' + ci;
var DEX_MAX = 20, MAX_PLOTS = 12, MAX_WATER = 8, LAMP_COST = 500;

/* ── 플랫폼 연동 (이어하기 코드 세이브 — golden-forge 동일 패턴) ── */
var API = '/api/v1/games/starlight-farm';
function token() { return localStorage.getItem('portal_access_token'); }
function deviceId() {
  var id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
function api(path, opt) {
  opt = opt || {};
  var headers = { 'Content-Type': 'application/json', 'X-Device-Id': deviceId() };
  var tk = token();
  if (tk) headers['Authorization'] = 'Bearer ' + tk;
  var o = { method: opt.method, body: opt.body, headers: headers };
  return fetch(API + path, o).then(function (res) {
    return res.json().catch(function () { return null; }).then(function (body) {
      if (!res.ok || !body || body.success === false) {
        throw new Error((body && body.error && body.error.code) || res.status);
      }
      return body.data;
    });
  });
}
var CODE_KEY = 'starlight_farm_code', LOCAL_KEY = 'starlight_farm_save';
var saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
function fmtCode(c) { return c ? c.replace(/(.{4})(?=.)/g, '$1-') : ''; }
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }
var toastT = null;
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.style.opacity = 0; }, 2600);
}

/* ── 상태 ── */
var S = null;
function fresh() {
  return { v: 1, dust: 25, harvests: 0, water: 0, lamp: false, plots: 6,
    field: [null, null, null, null, null, null],
    dex: {}, seeds: {}, unlocked: { 0: 1, 1: 1 }, visitor: null, lastTs: Date.now() };
}
function dexCount() {
  var n = 0;
  for (var i = 0; i < CROPS.length; i++) if (S.dex[i] > 0) n++;
  return n;
}
function score() { return dexCount() * 1000 + S.harvests; }
function waterTimeMul() { return 1 / (1 + 0.08 * S.water); }
function waterCost() { return Math.ceil(60 * Math.pow(2.3, S.water)); }
function mutChance() { return Math.min(0.25, 0.05 + 0.02 * S.water); }
function isNight() { var h = new Date().getHours(); return h >= 20 || h < 6; }
function fmt(n) {
  return n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M'
       : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : Math.floor(n).toString();
}
function fmtDur(sec) {
  if (sec >= 3600) {
    var h = Math.round(sec / 360) / 10;
    return (h % 1 === 0 ? h.toFixed(0) : h.toFixed(1)) + TR('unitH');
  }
  if (sec >= 60) return Math.round(sec / 60) + TR('unitM');
  return sec + TR('unitS');
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtLeft(ms) {
  var s = Math.max(0, Math.ceil(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h > 0 ? h + ':' + pad2(m) + ':' + pad2(sec) : m + ':' + pad2(sec);
}

/* ── 세이브 ── */
function localFallback() {
  try {
    var d = JSON.parse(localStorage.getItem(LOCAL_KEY));
    return d && d.v === 1 ? d : null;
  } catch (e) { return null; }
}
function loadSave(codeOverride) {
  var code = codeOverride || saveCode;
  if (token() || code) {
    return api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''))
      .then(function (s) {
        saveVersion = s.version;
        if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
        $('saveStatus').textContent = TX('saveCloud', { v: saveVersion });
        showCode();
        if (s.data && s.data.v === 1) return s.data;
        if (codeOverride) toast(TR('saveNoCode'));
        return null;
      })
      .catch(function (e) {
        $('saveStatus').textContent = TX('saveFail', { e: e.message });
        if (codeOverride) return null;
        return localFallback();
      });
  }
  $('saveStatus').textContent = TR('saveLocal');
  showCode();
  return Promise.resolve(localFallback());
}
function persist() {
  if (!S) return;
  S.lastTs = Date.now();
  localStorage.setItem(LOCAL_KEY, JSON.stringify(S));
  var hadCode = !!saveCode;
  api('/save', { method: 'PUT', body: JSON.stringify({ data: S, version: saveVersion, code: saveCode }) })
    .then(function (s) {
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (!hadCode && saveCode) toast(TX('codeIssued', { c: fmtCode(saveCode) }));
      showCode();
    })
    .catch(function (e) {
      if (e.message !== 'INVALID_INPUT') return;
      // 버전 충돌 — 서버 버전 재동기화 후 1회 재시도
      api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''))
        .then(function (re) {
          saveVersion = re.version;
          return api('/save', { method: 'PUT', body: JSON.stringify({ data: S, version: saveVersion, code: saveCode }) });
        })
        .then(function (s2) { saveVersion = s2.version; })
        .catch(function () {});
    });
}
var persistTimer = null;
function persistSoon() { clearTimeout(persistTimer); persistTimer = setTimeout(persist, 2500); }

/* ── 랭킹 — 점수 = 도감 완성도 × 1000 + 누적 수확 ── */
function submitRank() {
  if (S && score() > 0 && window.GameRank) {
    GameRank.submit('starlight-farm', score(), TX('rankDetail', { n: dexCount() }));
  }
}

/* ── 밤하늘 캔버스 — 별 반짝임 + 온실 실루엣 (가벼운 장식) ── */
var sky = $('sky'), sx = sky.getContext('2d');
var stars = [], glints = [], shoot = null;
for (var si = 0; si < 46; si++) {
  stars.push({ x: Math.random() * 430, y: Math.random() * 100 + 4, r: Math.random() < 0.2 ? 2 : 1,
    sp: 0.5 + Math.random() * 1.6, ph: Math.random() * 6.28 });
}
function drawSky(ts) {
  requestAnimationFrame(drawSky);
  var t = ts / 1000;
  var g = sx.createLinearGradient(0, 0, 0, 150);
  g.addColorStop(0, '#0c1424'); g.addColorStop(1, '#1a2238');
  sx.fillStyle = g; sx.fillRect(0, 0, 430, 150);
  // 별 — 파스텔 반짝임
  for (var i = 0; i < stars.length; i++) {
    var st = stars[i];
    sx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(t * st.sp + st.ph));
    sx.fillStyle = i % 7 === 0 ? '#a855f7' : i % 5 === 0 ? '#eab308' : '#dbe4f2';
    sx.fillRect(st.x, st.y, st.r, st.r);
  }
  sx.globalAlpha = 1;
  // 초승달
  sx.fillStyle = 'rgba(234,179,8,.8)';
  sx.beginPath(); sx.arc(384, 27, 11, 0, 6.29); sx.fill();
  sx.fillStyle = '#0d1628';
  sx.beginPath(); sx.arc(389, 23, 10, 0, 6.29); sx.fill();
  // 별똥별 — 드물게
  if (!shoot && Math.random() < 0.003) shoot = { x: 60 + Math.random() * 280, y: 8 + Math.random() * 40, life: 1 };
  if (shoot) {
    shoot.x += 6; shoot.y += 2.4; shoot.life -= 0.03;
    sx.strokeStyle = 'rgba(219,228,242,' + Math.max(0, shoot.life) + ')';
    sx.beginPath(); sx.moveTo(shoot.x, shoot.y); sx.lineTo(shoot.x - 26, shoot.y - 10); sx.stroke();
    if (shoot.life <= 0) shoot = null;
  }
  // 땅
  sx.fillStyle = '#101a30'; sx.fillRect(0, 128, 430, 22);
  // 온실 — 보랏빛 유리 돔
  var gl = sx.createRadialGradient(215, 122, 6, 215, 122, 78);
  gl.addColorStop(0, 'rgba(168,85,247,.3)'); gl.addColorStop(1, 'rgba(168,85,247,0)');
  sx.fillStyle = gl; sx.fillRect(137, 44, 156, 90);
  sx.beginPath(); sx.ellipse(215, 128, 65, 58, 0, Math.PI, 0);
  sx.closePath();
  sx.fillStyle = 'rgba(168,85,247,.14)'; sx.fill();
  sx.strokeStyle = 'rgba(219,228,242,.35)'; sx.stroke();
  sx.beginPath();
  sx.moveTo(180, 128); sx.lineTo(184, 82);
  sx.moveTo(215, 128); sx.lineTo(215, 70);
  sx.moveTo(250, 128); sx.lineTo(246, 82);
  sx.strokeStyle = 'rgba(219,228,242,.18)'; sx.stroke();
  sx.fillStyle = '#1a2238'; sx.fillRect(207, 104, 16, 24);
  sx.font = '13px serif';
  sx.fillText('🌱', 184, 125); sx.fillText('🌼', 208, 121); sx.fillText('🌿', 232, 125);
  // 돔에서 피어오르는 별가루
  if (Math.random() < 0.06) glints.push({ x: 185 + Math.random() * 60, y: 118, life: 1 });
  glints = glints.filter(function (p) { return (p.life -= 0.012) > 0; });
  glints.forEach(function (p) {
    p.y -= 0.35;
    sx.globalAlpha = p.life * 0.8;
    sx.fillStyle = '#a855f7';
    sx.fillRect(p.x, p.y, 2, 2);
    sx.globalAlpha = 1;
  });
}

/* ── 밭 ── */
var farmCells = [];
function buildFarm() {
  var farm = $('farm');
  farm.innerHTML = '';
  farmCells = [];
  for (var i = 0; i < S.plots; i++) {
    (function (idx) {
      var b = document.createElement('button');
      b.className = 'plot empty';
      b.innerHTML = '<span class="pe">➕</span><span class="pbar"><span class="pfill"></span></span><span class="plabel"></span>';
      b.onclick = function () { onPlot(idx); };
      $('farm').appendChild(b);
      farmCells.push({ el: b, pe: b.children[0], bar: b.children[1], fill: b.children[1].children[0], lab: b.children[2] });
    })(i);
  }
  updateFarm();
}
function updateFarm() {
  if (!S) return;
  var now = Date.now();
  for (var i = 0; i < S.plots; i++) {
    var cell = farmCells[i];
    if (!cell) continue;
    var p = S.field[i];
    if (!p) {
      cell.el.className = 'plot empty';
      cell.pe.textContent = '➕';
      cell.bar.style.visibility = 'hidden';
      cell.lab.textContent = TR('plant');
    } else if (now >= p.t1) {
      cell.el.className = 'plot ready';
      cell.pe.textContent = CROPS[p.c].e;
      cell.bar.style.visibility = 'hidden';
      cell.lab.textContent = TR('harvest');
    } else {
      cell.el.className = 'plot grow';
      var pr = (now - p.t0) / (p.t1 - p.t0);
      cell.pe.textContent = pr < 0.34 ? '🌱' : pr < 0.7 ? '🌿' : CROPS[p.c].e;
      cell.bar.style.visibility = 'visible';
      cell.fill.style.width = (pr * 100).toFixed(1) + '%';
      cell.lab.textContent = fmtLeft(p.t1 - now);
    }
  }
}
function addFloat(cellEl, text) {
  var f = document.createElement('span');
  f.className = 'float';
  f.textContent = text;
  cellEl.appendChild(f);
  setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1100);
}
function onPlot(idx) {
  var p = S.field[idx];
  if (!p) { openSeed(idx); return; }
  var now = Date.now();
  if (now >= p.t1) { harvestPlot(idx); return; }
  var c = CROPS[p.c];
  toast(TX('growingToast', { name: c.e + ' ' + TR(c.n), t: fmtLeft(p.t1 - now) }));
}

/* ── 수확 + 교배(변종) + 정령 납품 ── */
function tryMutation(i) {
  var now = Date.now(), p = S.field[i];
  var ns = [], col = i % 3;
  if (col > 0) ns.push(i - 1);
  if (col < 2) ns.push(i + 1);
  ns.push(i - 3, i + 3);
  function tierOf(c) { return c >= 16 ? [3, 7, 11, 15][c - 16] : c; }
  for (var k = 0; k < ns.length; k++) {
    var j = ns[k];
    if (j < 0 || j >= S.plots) continue;
    var q = S.field[j];
    if (q && now >= q.t1) {
      if (Math.random() < mutChance()) {
        var tier = Math.max(tierOf(p.c), tierOf(q.c));
        var v = tier <= 3 ? 16 : tier <= 7 ? 17 : tier <= 11 ? 18 : 19;
        S.seeds[v] = (S.seeds[v] || 0) + 1;
        toast(TX('mutToast', { name: CROPS[v].e + ' ' + TR(CROPS[v].n) }));
      }
      return;  // 여문 이웃당 판정은 수확 1회에 한 번만
    }
  }
}
function harvestPlot(i) {
  var p = S.field[i];
  if (!p || Date.now() < p.t1) return;
  var c = CROPS[p.c];
  var mul = (S.lamp && isNight()) ? 1.3 : 1;
  var gained = Math.round(c.sell * mul);
  S.dust += gained;
  S.harvests++;
  var first = !(S.dex[p.c] > 0);
  S.dex[p.c] = (S.dex[p.c] || 0) + 1;
  tryMutation(i);
  if (S.visitor && S.visitor.c === p.c) {
    S.visitor.got++;
    if (S.visitor.got >= S.visitor.need) {
      S.dust += S.visitor.reward;
      toast(TX('visDone', { r: fmt(S.visitor.reward) }));
      S.visitor = null;
    }
    renderVisitor();
  }
  S.field[i] = null;
  addFloat(farmCells[i].el, '+' + fmt(gained) + '✨');
  if (first) { toast(TX('newDex', { name: c.e + ' ' + TR(c.n) })); submitRank(); }
  updateFarm(); updateHud(); renderUpgrades(); persistSoon();
}

/* ── 씨앗 패널 ── */
var seedTarget = -1;
function openSeed(idx) {
  seedTarget = idx;
  renderSeed();
  $('seedPanel').hidden = false;
}
function closeSeed() { $('seedPanel').hidden = true; }
function plantAt(idx, cropIdx, useSeed) {
  if (idx < 0 || idx >= S.plots || S.field[idx]) { closeSeed(); return; }
  var c = CROPS[cropIdx];
  if (useSeed) {
    if (!(S.seeds[cropIdx] > 0)) return;
    S.seeds[cropIdx]--;
  } else {
    if (S.dust < c.cost) { toast(TR('noDust')); return; }
    S.dust -= c.cost;
  }
  var now = Date.now();
  S.field[idx] = { c: cropIdx, t0: now, t1: now + Math.round(c.t * 1000 * waterTimeMul()) };
  closeSeed();
  updateFarm(); updateHud(); persistSoon();
}
function unlockCrop(i) {
  var c = CROPS[i], cost = c.cost * 2;
  if (S.unlocked[i] || dexCount() < c.req || S.dust < cost) return;
  S.dust -= cost;
  S.unlocked[i] = 1;
  toast(TX('unlockToast', { name: c.e + ' ' + TR(c.n) }));
  renderSeed(); updateHud(); persistSoon();
}
function renderSeed() {
  $('seedDust').textContent = TX('seedDust', { d: fmt(S.dust) });
  var list = $('seedList');
  list.innerHTML = '';
  var dc = dexCount();
  for (var i = 0; i < CROPS.length; i++) {
    (function (idx) {
      var c = CROPS[idx];
      var b = document.createElement('button');
      var meta = TX('seedGrow', { t: fmtDur(c.t) }) + ' · ' + TX('seedSell', { s: fmt(c.sell) });
      if (c.v) {
        var have = S.seeds[idx] || 0;
        var known = have > 0 || S.dex[idx] > 0;
        b.innerHTML = '<span><b>' + (known ? c.e + ' ' + TR(c.n) : '💞 ' + TR('dexUnknown')) + '</b><small>' +
          meta + '</small></span><span class="price">' +
          (have > 0 ? TX('seedFree', { n: have }) : TR('seedNoSeed')) + '</span>';
        b.disabled = !(have > 0);
        b.onclick = function () { plantAt(seedTarget, idx, true); };
      } else if (S.unlocked[idx]) {
        b.innerHTML = '<span><b>' + c.e + ' ' + TR(c.n) + '</b><small>' + meta + '</small></span>' +
          '<span class="price">' + fmt(c.cost) + '✨</span>';
        b.disabled = S.dust < c.cost;
        b.onclick = function () { plantAt(seedTarget, idx, false); };
      } else if (dc >= c.req) {
        b.innerHTML = '<span><b>' + c.e + ' ' + TR(c.n) + '</b><small>' + meta + '</small></span>' +
          '<span class="price">' + TX('seedUnlock', { c: fmt(c.cost * 2) }) + '</span>';
        b.disabled = S.dust < c.cost * 2;
        b.onclick = function () { unlockCrop(idx); };
      } else {
        b.innerHTML = '<span><b>🔒 ' + TR('dexUnknown') + '</b><small>' +
          TX('seedLockReq', { n: c.req }) + '</small></span><span class="price"></span>';
        b.disabled = true;
      }
      list.appendChild(b);
    })(i);
  }
}

/* ── 업그레이드 ── */
function renderUpgrades() {
  if (!S) return;
  var shop = $('shop');
  shop.innerHTML = '';
  var w = document.createElement('button');
  var wc = waterCost();
  w.innerHTML = '<span><b>' + TX('upWater', { n: S.water }) + '</b><small>' + TR('upWaterDesc') + '</small></span>' +
    '<span class="price">' + (S.water >= MAX_WATER ? TR('upMax') : fmt(wc) + '✨') + '</span>';
  w.disabled = S.water >= MAX_WATER || S.dust < wc;
  w.onclick = function () {
    if (S.water >= MAX_WATER || S.dust < waterCost()) return;
    S.dust -= waterCost();
    S.water++;
    renderUpgrades(); updateHud(); persistSoon();
  };
  shop.appendChild(w);
  var l = document.createElement('button');
  l.innerHTML = '<span><b>' + TR('upLamp') + '</b><small>' + TR('upLampDesc') + '</small></span>' +
    '<span class="price">' + (S.lamp ? TR('upLampOwned') : fmt(LAMP_COST) + '✨') + '</span>';
  l.disabled = S.lamp || S.dust < LAMP_COST;
  l.onclick = function () {
    if (S.lamp || S.dust < LAMP_COST) return;
    S.dust -= LAMP_COST;
    S.lamp = true;
    renderUpgrades(); updateHud(); persistSoon();
  };
  shop.appendChild(l);
  var x = document.createElement('button');
  var full = S.plots >= MAX_PLOTS, xc = full ? 0 : EXPAND_COST[S.plots - 6];
  x.innerHTML = '<span><b>' + TX('upExpand', { n: S.plots }) + '</b><small>' + TR('upExpandDesc') + '</small></span>' +
    '<span class="price">' + (full ? TR('upMax') : fmt(xc) + '✨') + '</span>';
  x.disabled = full || S.dust < xc;
  x.onclick = function () {
    if (S.plots >= MAX_PLOTS) return;
    var cost = EXPAND_COST[S.plots - 6];
    if (S.dust < cost) return;
    S.dust -= cost;
    S.plots++;
    S.field.push(null);
    buildFarm(); renderUpgrades(); updateHud(); persistSoon();
  };
  shop.appendChild(x);
}

/* ── HUD / 방문 정령 / 도감 ── */
function updateHud() {
  if (!S) return;
  $('dustTxt').textContent = '✨ ' + fmt(S.dust);
  $('dexTxt').textContent = TX('hudDex', { n: dexCount() });
  $('harvTxt').textContent = TX('hudHarv', { n: fmt(S.harvests) });
  $('nightTxt').textContent = isNight() ? (S.lamp ? TR('nightOn') : TR('nightIdle')) : TR('dayTxt');
}
function spawnVisitor() {
  var cands = [];
  for (var i = 0; i < 16; i++) if (S.unlocked[i]) cands.push(i);
  if (!cands.length) return;
  var c = cands[Math.floor(Math.random() * cands.length)];
  var need = 2 + Math.floor(Math.random() * 3);
  S.visitor = { c: c, need: need, got: 0, reward: CROPS[c].sell * need };
  renderVisitor();
}
function renderVisitor() {
  var el = $('visitor');
  var v = S && S.visitor;
  if (!v) { el.hidden = true; return; }
  var c = CROPS[v.c];
  $('visTxt').textContent = TX('visWant', { name: c.e + ' ' + TR(c.n), need: v.need, got: v.got, r: fmt(v.reward) });
  el.hidden = false;
}
function renderDex() {
  $('dexSum').textContent = TX('dexSummary', { n: dexCount(), h: fmt(S.harvests), s: fmt(score()) });
  var grid = $('dexGrid');
  grid.innerHTML = '';
  for (var i = 0; i < CROPS.length; i++) {
    var c = CROPS[i], got = S.dex[i] > 0;
    var d = document.createElement('div');
    d.className = 'dexCard' + (got ? ' got' : '') + (c.v ? ' varc' : '');
    d.innerHTML = '<span class="de">' + (got ? c.e : '❓') + '</span>' +
      '<span>' + (got ? TR(c.n) : TR('dexUnknown')) + '</span>' +
      '<span>' + (got ? TX('dexCount', { n: S.dex[i] }) : (c.v ? TR('dexVariantTag') : fmtDur(c.t))) + '</span>';
    grid.appendChild(d);
  }
}

/* ── 루프 ── */
var tickN = 0;
setInterval(function () {
  if (!S) return;
  tickN++;
  updateFarm();
  updateHud();
  if (!S.visitor && Math.random() < 1 / 480) { spawnVisitor(); persistSoon(); }  // 평균 8분에 한 번
  if (tickN % 4 === 0) renderUpgrades();
}, 1000);
setInterval(function () { if (S) persist(); }, 30000);
setInterval(function () { submitRank(); }, 120000);
addEventListener('beforeunload', function () {
  if (S) { S.lastTs = Date.now(); localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); }
});

/* ── 시작 (오프라인 성장 유지 — 심은 시각 기준이라 자연 반영) ── */
$('startBtn').onclick = function () { $('menu').hidden = true; };
$('dexBtn').onclick = function () { renderDex(); $('dexPanel').hidden = false; };
$('dexClose').onclick = function () { $('dexPanel').hidden = true; };
$('backBtn').onclick = function () { $('dexPanel').hidden = true; $('menu').hidden = false; };
$('seedClose').onclick = closeSeed;
$('visBye').onclick = function () { S.visitor = null; renderVisitor(); persistSoon(); };
$('codeLoadBtn').onclick = function () {
  var raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  loadSave(raw).then(function (d) {
    if (d) { saveCode = raw; localStorage.setItem(CODE_KEY, raw); boot(d); }
  });
};
function boot(saved) {
  S = saved || fresh();
  while (S.field.length < S.plots) S.field.push(null);
  if (saved && saved.lastTs) {
    var now = Date.now(), matured = 0;
    for (var i = 0; i < S.field.length; i++) {
      var p = S.field[i];
      if (p && p.t1 <= now && p.t1 > saved.lastTs) matured++;
    }
    if (matured > 0) toast(TX('offline', { n: matured }));
  }
  buildFarm(); updateHud(); renderUpgrades(); renderVisitor();
}
loadSave().then(boot);
requestAnimationFrame(drawSky);
