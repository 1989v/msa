<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성문 사수</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0d1117; color:#e8e2d4; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #2a3040; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.7); }
  canvas { display:block; background:#3d4a35; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:12px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(8,12,20,.6); padding:3px 10px; border-radius:10px; }
  #hud .grow { flex:1; }
  #bar { position:absolute; left:0; right:0; bottom:0; display:flex; gap:6px; padding:7px 9px; background:rgba(8,12,20,.88);
         font-size:11px; align-items:center; flex-wrap:wrap; }
  #bar button { background:#2a3040; color:#e8e2d4; border:1px solid #3d4a60; padding:6px 10px; border-radius:6px;
                cursor:pointer; font-family:inherit; font-size:11px; font-weight:bold; }
  #bar button.on { background:#c9a441; color:#1a1408; border-color:#e8cc70; }
  #bar button:disabled { opacity:.35; cursor:default; }
  #banner { position:absolute; top:40%; left:0; right:0; text-align:center; font-size:26px; font-weight:bold;
            color:#ffd98a; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .3s; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(10,13,20,.96); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:12px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#ffd98a; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#c8c2b0; line-height:1.75; max-width:520px; }
  .panel button { background:#c9a441; color:#1a1408; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#2a3040; color:#e8e2d4; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #saveStatus { font-size:10.5px; color:#8a93a8; }
  #info { margin-top:9px; font-size:11px; color:#667; text-align:center; line-height:1.7; }
  input { background:#161c28; border:1px solid #2a3040; color:#e8e2d4; border-radius:6px; padding:6px 9px;
          font-family:inherit; font-size:12px; letter-spacing:1px; width:165px; text-transform:uppercase; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="840" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="goldTxt"></span>
    <span class="tag" id="waveTxt"></span>
    <span class="grow"></span>
    <span class="tag" id="gateTxt"></span>
  </div>
  <div id="banner"></div>
  <div id="bar" hidden>
    <button id="mBuild">🏰 망루 120$</button>
    <button id="mArcher">🏹 궁수 55$</button>
    <button id="mRepair">🔧 수리 지정</button>
    <span style="flex:1"></span>
    <button id="upDmg"></button>
    <button id="upGate"></button>
    <button id="waveBtn"></button>
  </div>
  <div class="panel" id="menu">
    <h1>🏰 성문 사수</h1>
    <p>야만족 무리가 성문으로 몰려온다. 길목에 <b>망루를 세우고 궁수를 채워</b> 막아라.
       망루는 부서진다 — <b>수리공을 지정해</b> 버티는 것이 핵심이다. 성문이 뚫리면 끝. <b>20라운드</b>를 버티면 승리.</p>
    <div id="saveStatus"></div>
    <div class="row">
      <input id="codeInput" placeholder="이어하기 코드" maxlength="18" autocomplete="off">
      <button id="codeLoadBtn" class="ghost">🔑 코드로 불러오기</button>
    </div>
    <div class="row"><span id="codeShow" style="font-size:11px;color:#ffd98a;letter-spacing:2px"></span></div>
    <div class="row"><span id="bestTxt" style="font-size:12px;color:#8a93a8"></span></div>
    <button id="startBtn">▶ 방어 시작</button>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <button id="backBtn">처음으로</button>
  </div>
</div>
<div id="info">🏰 망루 모드로 빈 터 클릭 → 건설 · 🏹 궁수 모드로 망루 클릭 → 배치(최대 4) · 🔧 수리 모드로 망루 클릭 → 수리공 파견<br>
  수리는 초당 3$ 를 쓴다 · 파쇄자는 건물에 2배 피해 · 라운드 사이에 정비하라</div>
<script>
'use strict';
const API = '/api/v1/games/gate-holdout';
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = cv.width, VH = cv.height;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random(), ri = n => Math.floor(Math.random() * n);

/* ── 플랫폼 연동 (이어하기 코드 세이브) ── */
const token = () => localStorage.getItem('portal_access_token');
function deviceId() {
  let id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
async function api(path, opt = {}) {
  const headers = { 'Content-Type':'application/json', 'X-Device-Id':deviceId(), ...(opt.headers || {}) };
  const tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
  const res = await fetch(API + path, { ...opt, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.success === false) throw new Error(body?.error?.code || res.status);
  return body.data;
}
const CODE_KEY = 'gate_holdout_code', LOCAL_KEY = 'gate_holdout_save';
let saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
const fmtCode = c => c ? c.replace(/(.{4})(?=.)/g, '$1-') : '';
let meta = { best: 0, clears: 0 };
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }
async function loadMeta(codeOverride) {
  const code = codeOverride || saveCode;
  if (token() || code) {
    try {
      const s = await api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''));
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (s.data) meta = { best:0, clears:0, ...s.data };
      $('saveStatus').textContent = '☁ 서버 세이브 (v' + saveVersion + ')';
      showCode(); return true;
    } catch (e) { $('saveStatus').textContent = '세이브 로드 실패: ' + e.message; if (codeOverride) return false; }
  }
  try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d) meta = { ...meta, ...d }; } catch (_) {}
  $('saveStatus').textContent = '브라우저 저장 — 저장하면 이어하기 코드가 발급됩니다';
  showCode(); return true;
}
async function persistMeta() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(meta));
  try {
    const s = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
    saveVersion = s.version;
    if (s.code && s.code !== saveCode) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
    showCode();
  } catch (e) {
    if (e.message === 'INVALID_INPUT') {
      try {
        const re = await api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''));
        saveVersion = re.version;
        const s2 = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
        saveVersion = s2.version;
      } catch (_) {}
    }
  }
}

/* ── 스프라이트 ── */
const cache = new Map();
function sprite(key, w, h, paint) {
  let c = cache.get(key); if (c) return c;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d')); cache.set(key, c); return c;
}
const px = (g, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
const towerSprite = () => sprite('tower', 46, 58, g => {
  px(g, 6, 54, 34, 4, 'rgba(0,0,0,.35)');
  px(g, 8, 14, 30, 42, '#7a7f8c');
  px(g, 8, 14, 30, 4, '#5d6270');
  for (let i = 0; i < 4; i++) px(g, 6 + i * 9, 6, 7, 9, '#8d93a2');
  px(g, 18, 36, 10, 20, '#3a3f4c');                       // 문
  px(g, 12, 22, 6, 8, '#2a2e38'); px(g, 28, 22, 6, 8, '#2a2e38'); // 총안
});
const goblinSprite = kind => sprite('g' + kind, 30, 30, g => {
  px(g, 6, 27, 18, 3, 'rgba(0,0,0,.3)');
  const skin = kind === 'brute' ? '#7a9448' : kind === 'boss' ? '#9c4444' : '#8fb054';
  if (kind === 'runner') {
    px(g, 10, 6, 10, 8, skin); px(g, 12, 9, 2, 2, '#2a1a0a'); px(g, 16, 9, 2, 2, '#2a1a0a');
    px(g, 11, 14, 8, 8, '#5a4028'); px(g, 8, 22, 5, 6, skin); px(g, 17, 22, 5, 6, skin);
    px(g, 6, 4, 4, 5, skin); px(g, 20, 4, 4, 5, skin);      // 큰 귀
  } else if (kind === 'brute') {
    px(g, 6, 4, 18, 12, skin); px(g, 10, 8, 3, 3, '#2a1a0a'); px(g, 18, 8, 3, 3, '#2a1a0a');
    px(g, 4, 15, 22, 10, '#4a3a24'); px(g, 6, 25, 7, 5, skin); px(g, 17, 25, 7, 5, skin);
    px(g, 24, 8, 6, 14, '#6b6455');                         // 몽둥이
  } else if (kind === 'lobber') {
    px(g, 9, 5, 12, 9, skin); px(g, 12, 8, 2, 2, '#2a1a0a'); px(g, 17, 8, 2, 2, '#2a1a0a');
    px(g, 8, 14, 14, 9, '#3f5a6b'); px(g, 9, 23, 5, 6, skin); px(g, 16, 23, 5, 6, skin);
    px(g, 22, 10, 6, 6, '#b04a2a');                          // 폭탄
  } else if (kind === 'boss') {
    px(g, 4, 2, 22, 14, skin); px(g, 9, 7, 4, 4, '#ffd54a'); px(g, 18, 7, 4, 4, '#ffd54a');
    px(g, 2, 16, 26, 10, '#5a2a2a'); px(g, 5, 26, 8, 4, skin); px(g, 17, 26, 8, 4, skin);
    px(g, 2, 0, 5, 6, '#e8cc70'); px(g, 23, 0, 5, 6, '#e8cc70');  // 뿔
  } else {
    px(g, 9, 5, 12, 9, skin); px(g, 12, 8, 2, 2, '#2a1a0a'); px(g, 17, 8, 2, 2, '#2a1a0a');
    px(g, 9, 14, 12, 9, '#5a4028'); px(g, 9, 23, 5, 6, skin); px(g, 16, 23, 5, 6, skin);
    px(g, 22, 12, 6, 3, '#8a8578');                          // 단검
  }
});
const workerSprite = () => sprite('worker', 22, 26, g => {
  px(g, 4, 23, 14, 3, 'rgba(0,0,0,.3)');
  px(g, 6, 0, 10, 5, '#e0b83c');                             // 안전모
  px(g, 7, 5, 8, 6, '#f0c49a'); px(g, 9, 7, 2, 2, '#241a0e'); px(g, 13, 7, 2, 2, '#241a0e');
  px(g, 6, 11, 10, 8, '#4a6a8a'); px(g, 7, 19, 4, 5, '#3a3524'); px(g, 12, 19, 4, 5, '#3a3524');
  px(g, 16, 12, 5, 3, '#8a8578');                            // 렌치
});

/* ── 상태 ── */
const SLOTS = [
  { x:470, y:110 }, { x:470, y:250 }, { x:470, y:390 },
  { x:590, y:170 }, { x:590, y:320 },
  { x:680, y:110 }, { x:680, y:250 }, { x:680, y:390 },
];
const GATE_X = 800;
const FOE_DEFS = {
  grunt:  { name:'그런트',  hp:26, spd:62, dmg:7,  bounty:8,  r:13 },
  runner: { name:'질주자',  hp:15, spd:118, dmg:5, bounty:6,  r:12 },
  brute:  { name:'파쇄자',  hp:95, spd:38, dmg:16, bounty:26, r:15, wreck:2 },   // 건물 2배
  lobber: { name:'투척병',  hp:36, spd:52, dmg:9,  bounty:18, r:13, range:150, cd:2.1 },
  boss:   { name:'전쟁군주', hp:650, spd:34, dmg:34, bounty:280, r:20, wreck:2 },
};
const MAX_WAVE = 20;
let G = null, running = false, mode = 'archer';
let bannerT = 0, shake = 0;

function newGame() {
  G = {
    gold: 260, wave: 0, phase: 'prep', prepT: 6,
    gateHp: 300, gateMax: 300,
    dmgLv: 0, gateLv: 0,
    towers: [], foes: [], shots: [], bombs: [], parts: [],
    worker: { x: 760, y: 440, tx: 760, ty: 440, target: null },
    spawnQueue: [], spawnT: 0,
  };
}
const arrowDmg = () => 6 + G.dmgLv * 3;
const dmgCost = () => Math.floor(150 * Math.pow(1.6, G.dmgLv));
const gateCost = () => Math.floor(180 * Math.pow(1.6, G.gateLv));
function banner(text) { $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1600; }
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, s = spd * (0.4 + rnd() * 0.8);
    G.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color, size:2 + rnd()*3 });
  }
}
function popText(x, y, text, color) { G.parts.push({ x, y, vx:0, vy:-30, life:1, text, color }); }

/* ── 웨이브 ── */
function startWave() {
  G.wave++; G.phase = 'wave';
  const w = G.wave, q = [];
  const n = 6 + w * 2;
  for (let i = 0; i < n; i++) {
    let kind = 'grunt';
    const r = rnd();
    if (w >= 3 && r < 0.22) kind = 'runner';
    else if (w >= 5 && r < 0.38) kind = 'lobber';
    else if (w >= 7 && r < 0.52) kind = 'brute';
    q.push(kind);
  }
  if (w % 10 === 0) q.push('boss');
  G.spawnQueue = q; G.spawnT = 0;
  banner('제' + w + '라운드' + (w % 10 === 0 ? ' — 전쟁군주 출현!' : ''));
}
function spawnFoe(kind) {
  const d = FOE_DEFS[kind], sc = 1 + (G.wave - 1) * 0.13;
  G.foes.push({ kind, x: -20, y: 60 + rnd() * (VH - 150),
    hp: Math.round(d.hp * sc), maxHp: Math.round(d.hp * sc),
    dmg: Math.round(d.dmg * (1 + (G.wave - 1) * 0.06)), spd: d.spd, r: d.r,
    bounty: Math.round(d.bounty * (1 + G.wave * 0.08)), wreck: d.wreck || 1,
    range: d.range || 0, cd: rnd(), atkCd: 0, hurt: 0 });
}

/* ── 갱신 ── */
function update(dt) {
  if (G.phase === 'prep') {
    G.prepT -= dt;
    if (G.prepT <= 0) startWave();
  } else {
    if (G.spawnQueue.length) {
      G.spawnT -= dt;
      if (G.spawnT <= 0) { G.spawnT = 0.55; spawnFoe(G.spawnQueue.shift()); }
    } else if (!G.foes.length) {
      const bonus = 45 + G.wave * 12;
      G.gold += bonus; popText(VW/2, 200, '라운드 정리! +' + bonus + '$', '#ffd98a');
      if (G.wave >= MAX_WAVE) { endGame(true); return; }
      G.phase = 'prep'; G.prepT = 9;
    }
  }

  // 적
  for (const f of [...G.foes]) {
    f.hurt = Math.max(0, f.hurt - dt); f.atkCd = Math.max(0, f.atkCd - dt);
    // 목표: 가장 가까운 망루, 없으면 성문
    let target = null, bd = Infinity;
    for (const t of G.towers) { const q = (t.x - f.x) ** 2 + (t.y - f.y) ** 2; if (q < bd) { bd = q; target = t; } }
    const gateD = GATE_X - f.x;
    if (!target || Math.sqrt(bd) > gateD + 120) target = { gate:true, x:GATE_X, y:f.y, r:16 };
    const dx = target.x - f.x, dy = target.y - f.y, dist = Math.hypot(dx, dy) || 1;

    if (f.range && !target.gate && dist < f.range) {          // 투척병 — 정지 후 폭탄
      f.cd -= dt;
      if (f.cd <= 0) { f.cd = FOE_DEFS.lobber.cd;
        G.bombs.push({ x:f.x, y:f.y, tx:target.x, ty:target.y, t:0, dmg:f.dmg, target }); }
    } else if (dist > f.r + (target.gate ? 6 : 26)) {
      f.x += dx / dist * f.spd * dt; f.y += dy / dist * f.spd * dt;
    } else if (f.atkCd <= 0) {
      f.atkCd = 0.85;
      if (target.gate) { damageGate(f.dmg); burst(GATE_X - 10, f.y, '#c9a441', 6, 100); }
      else damageTower(target, f.dmg * f.wreck);
    }
  }
  // 망루 사격
  for (const t of G.towers) {
    if (!t.archers) continue;
    t.cd -= dt;
    if (t.cd <= 0) {
      let best = null, bd = 210 * 210;
      for (const f of G.foes) { const q = (f.x - t.x) ** 2 + (f.y - t.y) ** 2; if (q < bd) { bd = q; best = f; } }
      if (best) { t.cd = 0.75;
        for (let i = 0; i < t.archers; i++) {
          const ang = Math.atan2(best.y - t.y, best.x - t.x) + (rnd() - 0.5) * 0.12;
          G.shots.push({ x:t.x, y:t.y - 20, vx:Math.cos(ang)*380, vy:Math.sin(ang)*380, dmg:arrowDmg(), life:0.9 });
        }
      }
    }
  }
  // 화살
  for (const s of [...G.shots]) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) { G.shots = G.shots.filter(o => o !== s); continue; }
    const f = G.foes.find(o => (o.x - s.x) ** 2 + (o.y - s.y) ** 2 < (o.r + 4) ** 2);
    if (f) {
      f.hp -= s.dmg; f.hurt = 0.15;
      G.shots = G.shots.filter(o => o !== s);
      if (f.hp <= 0) {
        G.gold += f.bounty; popText(f.x, f.y - 14, '+' + f.bounty + '$', '#ffd98a');
        burst(f.x, f.y, '#8fb054', 10, 140);
        G.foes = G.foes.filter(o => o !== f);
      }
    }
  }
  // 폭탄 (투척병)
  for (const b of [...G.bombs]) {
    b.t += dt * 1.4;
    if (b.t >= 1) {
      G.bombs = G.bombs.filter(o => o !== b);
      burst(b.tx, b.ty, '#ff9a3c', 10, 130); shake = 5;
      if (b.target.gate) damageGate(b.dmg);
      else if (G.towers.includes(b.target)) damageTower(b.target, b.dmg);
    }
  }
  // 수리공
  const w = G.worker;
  if (w.target && !G.towers.includes(w.target)) w.target = null;
  const wt = w.target ? { x:w.target.x + 34, y:w.target.y } : { x:760, y:440 };
  const wd = Math.hypot(wt.x - w.x, wt.y - w.y);
  if (wd > 4) { w.x += (wt.x - w.x) / wd * 120 * dt; w.y += (wt.y - w.y) / wd * 120 * dt; }
  else if (w.target && w.target.hp < w.target.maxHp && G.gold >= 3 * dt) {
    G.gold -= 3 * dt;
    w.target.hp = Math.min(w.target.maxHp, w.target.hp + 15 * dt);
  }
  for (const q of [...G.parts]) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 180 * dt; q.life -= dt * (q.text ? 1.05 : 1.8);
    if (q.life <= 0) G.parts = G.parts.filter(o => o !== q);
  }
  shake = Math.max(0, shake - dt * 30);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}
function damageTower(t, dmg) {
  t.hp -= dmg; shake = Math.max(shake, 3);
  if (t.hp <= 0) {
    burst(t.x, t.y, '#7a7f8c', 20, 170); shake = 9;
    popText(t.x, t.y - 30, '망루 붕괴!', '#ff6b6b');
    G.towers = G.towers.filter(o => o !== t);
  }
}
function damageGate(dmg) {
  G.gateHp -= dmg; shake = Math.max(shake, 5);
  if (G.gateHp <= 0) { G.gateHp = 0; endGame(false); }
}

/* ── 렌더 ── */
function draw() {
  const sx = shake ? (rnd() - 0.5) * shake : 0, sy = shake ? (rnd() - 0.5) * shake : 0;
  cx.save(); cx.translate(sx, sy);
  cx.fillStyle = '#3d4a35'; cx.fillRect(-8, -8, VW + 16, VH + 16);
  for (let y = 0; y < VH; y += 40) for (let x = 0; x < VW; x += 40)
    if ((x / 40 + y / 40) % 2 === 0) { cx.fillStyle = '#42502f' + ''; cx.fillStyle = 'rgba(0,0,0,.05)'; cx.fillRect(x, y, 40, 40); }
  // 길 느낌 — 왼쪽 진입로
  cx.fillStyle = 'rgba(120,100,70,.25)'; cx.fillRect(0, 40, VW - 30, VH - 80);
  // 성문
  cx.fillStyle = '#6b4a2c'; cx.fillRect(GATE_X - 12, 0, 40, VH);
  cx.fillStyle = '#57391f';
  for (let y = 0; y < VH; y += 34) cx.fillRect(GATE_X - 12, y, 40, 4);
  cx.fillStyle = '#8a6a3c'; cx.fillRect(GATE_X - 12, 0, 5, VH);
  // 빈 슬롯
  for (const s of SLOTS) {
    if (G.towers.some(t => t.slot === s)) continue;
    cx.strokeStyle = mode === 'build' ? 'rgba(255,217,138,.75)' : 'rgba(255,255,255,.2)';
    cx.lineWidth = 2; cx.setLineDash([5, 4]);
    cx.strokeRect(s.x - 24, s.y - 28, 48, 56); cx.setLineDash([]);
  }
  // 망루
  for (const t of G.towers) {
    cx.drawImage(towerSprite(), t.x - 23, t.y - 30);
    cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(t.x - 22, t.y - 38, 44, 5);
    cx.fillStyle = t.hp / t.maxHp > 0.4 ? '#6bd18a' : '#e0913f';
    cx.fillRect(t.x - 22, t.y - 38, 44 * (t.hp / t.maxHp), 5);
    cx.font = 'bold 11px monospace'; cx.textAlign = 'center'; cx.fillStyle = '#ffd98a';
    cx.fillText('🏹'.repeat(t.archers) || '—', t.x, t.y - 44);
  }
  // 수리공
  cx.drawImage(workerSprite(), G.worker.x - 11, G.worker.y - 14);
  if (G.worker.target) {
    cx.strokeStyle = 'rgba(224,184,60,.6)'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(G.worker.x, G.worker.y); cx.lineTo(G.worker.target.x + 34, G.worker.target.y); cx.stroke();
  }
  // 적
  for (const f of G.foes) {
    cx.save(); if (f.hurt > 0) cx.filter = 'brightness(2.4)';
    const sc = f.kind === 'boss' ? 1.9 : 1;
    cx.drawImage(goblinSprite(f.kind), f.x - 15 * sc, f.y - 17 * sc, 30 * sc, 30 * sc);
    cx.restore();
    if (f.hp < f.maxHp) {
      const w = f.kind === 'boss' ? 70 : 26;
      cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(f.x - w/2, f.y - 22 * sc, w, 4);
      cx.fillStyle = '#e05c4a'; cx.fillRect(f.x - w/2, f.y - 22 * sc, w * (f.hp / f.maxHp), 4);
    }
  }
  // 화살 / 폭탄
  cx.fillStyle = '#e8e2d4';
  for (const s of G.shots) { cx.save(); cx.translate(s.x, s.y); cx.rotate(Math.atan2(s.vy, s.vx)); cx.fillRect(-6, -1, 9, 2); cx.restore(); }
  for (const b of G.bombs) {
    const bx = b.x + (b.tx - b.x) * b.t, by = b.y + (b.ty - b.y) * b.t - Math.sin(b.t * Math.PI) * 46;
    cx.fillStyle = '#b04a2a'; cx.beginPath(); cx.arc(bx, by, 5, 0, 7); cx.fill();
  }
  for (const q of G.parts) {
    cx.globalAlpha = clamp(q.life, 0, 1);
    if (q.text) { cx.font = 'bold 13px monospace'; cx.textAlign = 'center'; cx.fillStyle = q.color; cx.fillText(q.text, q.x, q.y); }
    else { cx.fillStyle = q.color; cx.fillRect(q.x, q.y, q.size, q.size); }
    cx.globalAlpha = 1;
  }
  cx.restore();
  // HUD
  $('goldTxt').textContent = '💰 ' + Math.floor(G.gold) + '$';
  $('waveTxt').textContent = G.phase === 'prep'
    ? '⏳ 제' + (G.wave + 1) + '라운드까지 ' + Math.ceil(G.prepT) + 's'
    : '⚔ 제' + G.wave + '라운드 — 남은 적 ' + (G.foes.length + G.spawnQueue.length);
  $('gateTxt').textContent = '🚪 성문 ' + Math.ceil(G.gateHp) + '/' + G.gateMax;
  $('upDmg').textContent = '⚔ 화살 Lv.' + G.dmgLv + ' (' + dmgCost() + '$)';
  $('upDmg').disabled = G.gold < dmgCost();
  $('upGate').textContent = '🚪 성문 보강 (' + gateCost() + '$)';
  $('upGate').disabled = G.gold < gateCost();
  $('waveBtn').textContent = G.phase === 'prep' ? '▶ 바로 시작 +15$' : '⚔ 교전 중';
  $('waveBtn').disabled = G.phase !== 'prep';
}

/* ── 입력 ── */
function setMode(m) {
  mode = m;
  $('mBuild').classList.toggle('on', m === 'build');
  $('mArcher').classList.toggle('on', m === 'archer');
  $('mRepair').classList.toggle('on', m === 'repair');
}
$('mBuild').onclick = () => setMode('build');
$('mArcher').onclick = () => setMode('archer');
$('mRepair').onclick = () => setMode('repair');
$('upDmg').onclick = () => { if (G.gold >= dmgCost()) { G.gold -= dmgCost(); G.dmgLv++; } };
$('upGate').onclick = () => { if (G.gold >= gateCost()) { G.gold -= gateCost(); G.gateLv++;
  G.gateMax += 120; G.gateHp = Math.min(G.gateMax, G.gateHp + 160); } };
$('waveBtn').onclick = () => { if (G.phase === 'prep') { G.gold += 15; G.prepT = 0; } };
cv.addEventListener('click', ev => {
  if (!running) return;
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) * (VW / r.width), y = (ev.clientY - r.top) * (VH / r.height);
  if (mode === 'build') {
    const s = SLOTS.find(s => Math.abs(s.x - x) < 30 && Math.abs(s.y - y) < 34 && !G.towers.some(t => t.slot === s));
    if (s && G.gold >= 120) {
      G.gold -= 120;
      G.towers.push({ slot:s, x:s.x, y:s.y, hp:180, maxHp:180, archers:0, cd:0 });
      burst(s.x, s.y, '#7a7f8c', 10, 90);
    }
  } else {
    const t = G.towers.find(t => Math.abs(t.x - x) < 30 && Math.abs(t.y - y) < 36);
    if (!t) return;
    if (mode === 'archer' && t.archers < 4 && G.gold >= 55) { G.gold -= 55; t.archers++; popText(t.x, t.y - 52, '🏹 배치', '#ffd98a'); }
    if (mode === 'repair') { G.worker.target = t; popText(t.x, t.y - 52, '🔧 수리 지정', '#e0b83c'); }
  }
});

/* ── 시작/종료 ── */
async function startGame() {
  newGame(); running = true; setMode('archer');
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false; $('bar').hidden = false;
  banner('길목에 망루를 세워라!');
}
async function endGame(win) {
  running = false; $('hud').hidden = true; $('bar').hidden = true;
  meta.best = Math.max(meta.best, G.wave);
  if (win) meta.clears = (meta.clears || 0) + 1;
  $('endTitle').textContent = win ? '🏆 성문 사수!' : '💥 성문 함락…';
  $('endDesc').textContent = (win ? '20라운드를 모두 버텨냈다!' : '제' + G.wave + '라운드에서 성문이 뚫렸다.') +
    ' 최고 기록 제' + meta.best + '라운드' + (meta.clears ? ' · 클리어 ' + meta.clears + '회' : '');
  $('endPanel').hidden = false;
  await persistMeta();
}
let last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!running || !G) return;
  update(dt);
  if (running && G) draw();
}
requestAnimationFrame(loop);
$('startBtn').onclick = startGame;
$('backBtn').onclick = () => { $('endPanel').hidden = true; $('menu').hidden = false;
  $('bestTxt').textContent = meta.best ? '최고 기록 제' + meta.best + '라운드' : ''; };
$('codeLoadBtn').onclick = async () => {
  const raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  if (await loadMeta(raw)) { saveCode = raw; localStorage.setItem(CODE_KEY, raw);
    $('bestTxt').textContent = meta.best ? '최고 기록 제' + meta.best + '라운드' : ''; showCode(); }
};
loadMeta().then(() => { $('bestTxt').textContent = meta.best ? '최고 기록 제' + meta.best + '라운드' : ''; });
</script>
