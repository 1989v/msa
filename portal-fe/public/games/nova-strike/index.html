<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA STRIKE — 노바 스트라이크</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23090a1a'/%3E%3Cpath d='M3 13 8 2l5 11-5-3z' fill='%2338e0ff'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060f; overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 42%, #0d1030 0%, #05060f 68%);
  }
  #stage {
    position: relative;
    box-shadow: 0 0 0 1px #1b2150, 0 0 60px rgba(56, 224, 255, .09), 0 30px 80px rgba(0,0,0,.6);
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #05060f;
  }
  #ui {
    position: absolute; inset: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <canvas id="ui"></canvas>
  </div>
</div>
<script src="../lib/rank.js"></script>
<script src="../lib/platform.js"></script>
<script>PlatformAdapter.init({ slug: 'nova-strike', title: '노바 스트라이크', saveKeys: ['nova-strike-save-v1'] });</script>
<script src="js/core.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/sprites.js"></script>

<script src="js/level.js"></script>
<script src="js/stages.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/bosses.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
