<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">말꼬리 잡기</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { background:#0c1424; color:#e6ecf2; font-family:'Courier New',monospace; user-select:none; }
  #game { display:flex; flex-direction:column; height:100vh; height:100dvh;
          max-width:560px; margin:0 auto; padding:10px 10px 12px; }
  .hud { display:flex; gap:8px; align-items:center; padding-right:52px; }
  .tag { background:#1a2238; border-radius:7px; padding:5px 10px; font-size:12px; color:#c2cedc; }
  .tag b { color:#0ea5e9; }
  .tag.hearts { color:#ef4444; letter-spacing:2px; margin-left:auto; }
  #needWrap { text-align:center; margin:8px 0 4px; }
  #needWrap .lbl { font-size:10.5px; color:#8e9db0; display:block; }
  #needTxt { font-size:34px; font-weight:bold; color:#0ea5e9; text-shadow:2px 2px 0 #000; line-height:1.25; }
  #needTxt.free { font-size:17px; color:#22c55e; padding:8px 0; }
  #chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
          background:#0e1729; border:1px solid #1a2238; border-radius:10px; padding:12px 10px; }
  .bub { max-width:78%; padding:8px 13px; border-radius:13px; font-size:16px; word-break:keep-all; }
  .bub b { text-decoration:underline; text-underline-offset:3px; }
  .bub.me { align-self:flex-end; background:#0ea5e9; color:#04121c; border-bottom-right-radius:3px; }
  .bub.ai { align-self:flex-start; background:#1a2238; border:1px solid #2c3550; border-bottom-left-radius:3px; }
  .bub.talk { font-size:13px; color:#c2cedc; }
  .sys { align-self:center; font-size:11px; color:#8e9db0; background:rgba(255,255,255,.05);
         padding:3px 11px; border-radius:10px; text-align:center; }
  .sys.bad { color:#ef4444; }
  #timerWrap { height:6px; background:#1a2238; border-radius:3px; margin:10px 0 8px; overflow:hidden; }
  #timerBar { height:100%; width:100%; background:#0ea5e9; }
  #inRow { display:flex; gap:8px; }
  #wordIn { flex:1; min-width:0; height:46px; background:#1a2238; border:2px solid #0ea5e9; border-radius:9px;
            color:#e6ecf2; font-size:16px; padding:0 12px; font-family:inherit; }
  #wordIn:disabled { opacity:.35; border-color:#2c3550; }
  button.act { background:#0ea5e9; color:#04121c; border:0; padding:12px 18px; font-weight:bold;
               font-size:13px; border-radius:9px; cursor:pointer; font-family:inherit; }
  button.act:disabled { opacity:.35; cursor:default; }
  button.ghost { background:#222b44; color:#e6ecf2; }
  .panel { position:fixed; inset:0; background:rgba(9,13,24,.97); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:13px; text-align:center; z-index:10;
           padding:20px; overflow:auto; }
  .panel h1 { color:#0ea5e9; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#c2cedc; line-height:1.8; max-width:480px; }
  .panel p.small { font-size:11px; color:#8e9db0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button.diff { background:#1a2238; color:#c2cedc; border:2px solid #2c3550; padding:10px 14px;
                font-size:13px; border-radius:9px; cursor:pointer; font-family:inherit; }
  button.diff:hover { background:#222b44; }
  button.diff.sel { border-color:#0ea5e9; color:#0ea5e9; font-weight:bold; }
  .scoreBig { font-size:38px; font-weight:bold; color:#eab308; text-shadow:2px 2px 0 #000; }
  #newBestTag { color:#22c55e !important; font-weight:bold; }
  #endDetail { background:#1a2238; border-radius:9px; padding:10px 16px; font-size:12px;
               color:#c2cedc; line-height:2; text-align:left; }
  #endDetail b { color:#0ea5e9; }
</style>
<link rel="stylesheet" href="../lib/menu.css">
</head>
<body>

<div id="game">
  <div class="hud">
    <span class="tag" id="diffTag"></span>
    <span class="tag"><span data-i18n="usedLabel">단어</span> <b id="usedTxt">0</b></span>
    <span class="tag hearts" id="heartTxt">❤❤❤</span>
  </div>
  <div id="needWrap">
    <span class="lbl" data-i18n="needLabel">이어야 할 글자</span>
    <div id="needTxt" class="free"></div>
  </div>
  <div id="chat"></div>
  <div id="timerWrap"><div id="timerBar"></div></div>
  <div id="inRow">
    <input id="wordIn" autocomplete="off" data-i18n-ph="ph" disabled>
    <button class="act" id="sendBtn" data-i18n="send" disabled>보내기</button>
  </div>
</div>

<div class="panel" id="menu">
  <h1 data-i18n="menuTitle">⛓ 말꼬리 잡기</h1>
  <p data-i18n="menuDesc">AI와 끝말잇기 한판 승부. 내장 사전에 있는 단어만 인정 — 두음법칙 OK(력→역), 제한시간 15초, 기회는 3번. 플레이어 선공!</p>
  <p class="small"><span data-i18n="dictLabel">내장 사전</span> <b id="dictCnt">0</b><span data-i18n="dictUnit">단어</span></p>
  <div class="row" id="diffRow">
    <button class="diff" data-d="0" data-i18n="diff0">😌 여유</button>
    <button class="diff sel" data-d="1" data-i18n="diff1">🙂 보통</button>
    <button class="diff" data-d="2" data-i18n="diff2">🔥 승부사</button>
  </div>
  <p class="small" id="diffHint"></p>
  <p class="small"><span data-i18n="bestLabel">최고 기록</span>: <b id="menuBest">—</b></p>
  <button class="act" id="startBtn" data-i18n="startBtn">▶ 대결 시작</button>
</div>

<div class="panel" id="endPanel" hidden>
  <h1 id="endTitle"></h1>
  <div class="scoreBig" id="endScore">0</div>
  <p class="small" id="newBestTag" data-i18n="newBest" hidden>🏅 신기록!</p>
  <div id="endDetail"></div>
  <p class="small"><span data-i18n="bestLabel">최고 기록</span>: <b id="endBest">—</b></p>
  <div class="row">
    <button class="act" id="againBtn" data-i18n="againBtn">⚔ 다시 도전</button>
    <button class="act ghost" id="backBtn" data-i18n="backBtn">처음으로</button>
  </div>
</div>

  var pool = alive.length ? alive : scored;
  if (diff === 0) return pool[rand(pool.length)].w;
  // 보통: 절반은 무작위, 절반은 이어가기 어려운(적은) 쪽 하위 절반에서
  if (Math.random() < 0.5) return pool[rand(pool.length)].w;
  var half = pool.slice(0, Math.max(1, Math.ceil(pool.length / 2)));
  return half[rand(half.length)].w;
}

// ── 채팅 UI ──
function bubble(word, side) {
  var div = document.createElement('div');
  div.className = 'bub ' + side;
  div.innerHTML = esc(word.slice(0, -1)) + '<b>' + esc(word.slice(-1)) + '</b>';
  appendChat(div);
}
function aiSay(text) {
  var div = document.createElement('div');
  div.className = 'bub ai talk';
  div.textContent = text;
  appendChat(div);
}
function sysBubble(text, bad) {
  var div = document.createElement('div');
  div.className = 'sys' + (bad ? ' bad' : '');
  div.textContent = text;
  appendChat(div);
}
function appendChat(node) {
  var c = el('chat');
  c.appendChild(node);
  c.scrollTop = c.scrollHeight;
}

function renderHud() {
  el('usedTxt').textContent = usedCount;
  var h = '';
  for (var i = 0; i < MAX_CHANCE; i++) h += i < chances ? '❤' : '🖤';
  el('heartTxt').textContent = h;
  var nd = el('needTxt');
  if (!need) { nd.textContent = TR('firstFree'); nd.className = 'free'; return; }
  var d = dueum(need);
  nd.textContent = need + (d && d !== need ? '(→' + d + ')' : '');
  nd.className = '';
}

// ── 타이머 (플레이어 턴 15초) ──
function startTimer() {
  deadline = Date.now() + TURN_MS;
  clearInterval(timerId);
  el('timerBar').style.width = '100%';
  el('timerBar').style.background = '#0ea5e9';
  timerId = setInterval(tick, 100);
}
function stopTimer() { clearInterval(timerId); timerId = null; }
function tick() {
  var lft = deadline - Date.now();
  if (lft <= 0) {
    stopTimer();
    el('timerBar').style.width = '0%';
    loseChance(TR('timeout') + ' — ' + TR('chanceDown'));
    if (turn === 'player') startTimer();
    return;
  }
  var pct = lft / TURN_MS * 100;
  var bar = el('timerBar');
  bar.style.width = pct + '%';
  bar.style.background = pct < 25 ? '#ef4444' : pct < 50 ? '#eab308' : '#0ea5e9';
}

// ── 턴 진행 ──
function loseChance(msg) {
  chances--;
  sysBubble(msg, true);
  renderHud();
  if (chances <= 0) gameOver(false);
}

function playerSubmit() {
  if (turn !== 'player') return;
  var inp = el('wordIn');
  var w = inp.value.trim();
  if (!w) return;
  inp.value = '';
  var reason = null;
  if (!DICT[w]) reason = TR('errNotDict');
  else if (used[w]) reason = TR('errUsed');
  else if (need && startsFor(need).indexOf(w.charAt(0)) < 0) reason = TR('errStart');
  if (reason) {
    loseChance('「' + w + '」 ' + reason + ' — ' + TR('chanceDown'));
    if (turn === 'player') inp.focus();
    return;
  }
  stopTimer();
  used[w] = true; usedCount++; rounds++;
  bubble(w, 'me');
  need = last(w);
  renderHud();
  turn = 'ai';
  inp.disabled = true;
  el('sendBtn').disabled = true;
  setTimeout(aiTurn, 550 + rand(650));
}

function aiTurn() {
  if (turn !== 'ai') return;
  var w = aiPick();
  if (!w) {
    aiSay(TR('aiNoWord'));
    gameOver(true);
    return;
  }
  used[w] = true; usedCount++;
  bubble(w, 'ai');
  need = last(w);
  renderHud();
  turn = 'player';
  var inp = el('wordIn');
  inp.disabled = false;
  el('sendBtn').disabled = false;
  inp.focus();
  startTimer();
}

// ── 시작 / 종료 ──
function begin() {
  used = {}; usedCount = 0; rounds = 0; chances = MAX_CHANCE; need = null;
  el('chat').innerHTML = '';
  el('menu').hidden = true;
  el('endPanel').hidden = true;
  el('diffTag').textContent = TR('diff' + diff);
  sysBubble(TR('introSys'));
  renderHud();
  turn = 'player';
  var inp = el('wordIn');
  inp.disabled = false;
  el('sendBtn').disabled = false;
  inp.value = '';
  inp.focus();
  startTimer();
}

function loadBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY)); } catch (e) { return null; }
}
function bestText(b) {
  if (!b || !(b.score > 0)) return TR('noBest');
  return b.score.toLocaleString() + ' (' + DIFF_KO[b.diff] + ' ' + b.rounds + 'R)';
}

function gameOver(won) {
  stopTimer();
  turn = 'over';
  el('wordIn').disabled = true;
  el('sendBtn').disabled = true;
  var base = rounds * 200 + chances * 500 + (won ? WIN_BONUS : 0);
  var score = Math.round(base * MULT[diff]);

  el('endTitle').textContent = won ? TR('win') : TR('lose');
  el('endTitle').style.color = won ? '#22c55e' : '#ef4444';
  el('endScore').textContent = score.toLocaleString();
  el('endDetail').innerHTML =
    TR('brRounds') + ' <b>' + rounds + '</b> × 200 = ' + (rounds * 200).toLocaleString() + '<br>' +
    TR('brChance') + ' <b>' + chances + '</b> × 500 = ' + (chances * 500).toLocaleString() + '<br>' +
    (won ? TR('brBonus') + ' <b>+' + WIN_BONUS.toLocaleString() + '</b><br>' : '') +
    TR('brMult') + ' <b>' + DIFF_KO[diff] + ' ×' + MULT[diff] + '</b>';

  var best = loadBest();
  var isNew = score > 0 && (!best || score > best.score);
  if (isNew) {
    best = { score: score, diff: diff, rounds: rounds };
    localStorage.setItem(BEST_KEY, JSON.stringify(best));
  }
  el('newBestTag').hidden = !isNew;
  el('endBest').textContent = bestText(best);

  if (score > 0) GameRank.submit(SLUG, score, DIFF_KO[diff] + ' ' + rounds + '라운드');
  setTimeout(function () { el('endPanel').hidden = false; }, 700);
}

// ── 메뉴 / 이벤트 ──
function selectDiff(d) {
  diff = d;
  var btns = el('diffRow').children;
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = 'diff' + (Number(btns[i].getAttribute('data-d')) === d ? ' sel' : '');
  }
  el('diffHint').textContent = TR('hint' + d);
}
(function bindDiff() {
  var btns = el('diffRow').children;
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = (function (d) { return function () { selectDiff(d); }; })(Number(btns[i].getAttribute('data-d')));
  }
})();

el('startBtn').onclick = begin;
el('againBtn').onclick = begin;
el('backBtn').onclick = function () {
  el('endPanel').hidden = true;
  el('menu').hidden = false;
  el('menuBest').textContent = bestText(loadBest());
};
el('sendBtn').onclick = playerSubmit;
el('wordIn').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); playerSubmit(); }
});

el('dictCnt').textContent = WORDS.length.toLocaleString();
el('menuBest').textContent = bestText(loadBest());
selectDiff(1);
renderHud();
</script>
<script src="../lib/rank.js"></script>
<script>GameRank.autoPanel('word-chain');</script>
</body>
