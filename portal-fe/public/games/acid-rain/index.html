<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">산성비</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#e6ecf2; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; padding-bottom:76px; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.72); }
  canvas { display:block; background:#0c1424; max-width:100%; touch-action:manipulation; }
  #hud { position:absolute; top:8px; left:10px; right:56px; display:flex; gap:8px; font-size:12px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; flex-wrap:wrap; }
  #hud .tag { background:rgba(12,20,36,.72); padding:3px 10px; border-radius:10px; white-space:nowrap; }
  #hud .grow { flex:1; }
  #hud #slowTag { color:#7dd3fc; }
  #hud #floodTxt { color:#a3e635; }
  #banner { position:absolute; top:36%; left:0; right:0; text-align:center; font-size:26px; font-weight:bold;
            color:#a3e635; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .3s; padding:0 12px; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(12,20,36,.96); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:12px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#a3e635; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#c2cedc; line-height:1.75; max-width:540px; }
  .panel p.small { font-size:11px; color:#8e9db0; }
  .panel button { background:#0ea5e9; color:#04121c; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.alt { background:#22c55e; color:#04180b; }
  .panel button.ghost { background:#2c3550; color:#e6ecf2; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #bestLine { color:#eab308; }
  #info { margin-top:9px; font-size:11px; color:#8fa0b4; text-align:center; line-height:1.7; padding:0 12px; }
  /* 하단 고정 입력줄 — 게임 중 항상 떠 있어 모바일 키보드가 유지된다 */
  #inputBar { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center;
              background:#1a2238; border-top:2px solid #0ea5e9;
              padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  #typeBox { width:min(420px, 100%); background:#0c1424; color:#e6ecf2; border:1px solid #2c3550; border-radius:8px;
             padding:10px 14px; font:bold 16px 'Courier New',monospace; text-align:center; outline:none; }
  #typeBox:focus { border-color:#0ea5e9; }
  #typeBox.err { border-color:#ef4444; color:#ef4444; animation:shakeX .2s; }
  @keyframes shakeX { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }

  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width:100vw; max-width:100vw; border-width:0; border-radius:0; }
    canvas { width:100%; height:auto; }
    #info { display:none; }
    .panel button { padding:10px 14px; font-size:13px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="720" height="520"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="scoreTxt"></span>
    <span class="tag" id="waveTxt"></span>
    <span class="grow"></span>
    <span class="tag" id="slowTag" hidden></span>
    <span class="tag" id="comboTxt"></span>
    <span class="tag" id="floodTxt"></span>
  </div>
  <div id="banner"></div>
  <div class="panel" id="menu">
    <h1 data-i18n="menuTitle">☔ 산성비</h1>
    <p data-i18n="menuDesc">독성 단어 비가 하늘에서 쏟아진다.</p>
    <p class="small" data-i18n="menuSpecial">💧 회복 · ⚡ 번개 · 🐌 슬로우</p>
    <p class="small" data-i18n="menuCombo">콤보 ×2 ·×3</p>
    <div class="row">
      <button id="startKoBtn" data-i18n="startKo">▶ 한글 모드</button>
      <button id="startEnBtn" class="alt" data-i18n="startEn">▶ 영문 모드</button>
    </div>
    <p class="small" id="bestLine"></p>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endScore"></p>
    <p class="small" id="endStats"></p>
    <div class="row">
      <button id="againBtn" data-i18n="againBtn">☔ 다시 도전</button>
      <button id="backBtn" class="ghost" data-i18n="backBtn">처음으로</button>
    </div>
  </div>
</div>
<div id="info" data-i18n="infoLine">단어 입력 후 Enter/스페이스 = 제거</div>
<div id="inputBar" hidden>
  <input id="typeBox" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
         data-i18n-ph="typePh">
</div>
<script>
'use strict';
GameI18n.init({
  ko: {
    title: '산성비',
    menuTitle: '☔ 산성비',
    menuDesc: '독성 단어 비가 하늘에서 쏟아진다. 땅에 닿기 전에 단어를 그대로 입력해 지워라. ' +
              '단어가 바닥에 떨어질 때마다 산성 풀이 차오르고, 5번 침수되면 끝장이다. ' +
              '15초마다 웨이브가 올라 비는 점점 빠르고 길어진다.',
    menuSpecial: '💧 회복 — 침수 1 회복 · ⚡ 번개 — 화면 전체 제거 · 🐌 슬로우 — 5초 감속',
    menuCombo: '미스 없이 연속 처치 시 콤보 ×2 · ×3 — 오타를 내면 콤보가 끊긴다',
    startKo: '▶ 한글 모드',
    startEn: '▶ 영문 모드',
    bestLine: '최고 기록 — 한글 {ko} · 영문 {en}',
    typePh: '단어 입력 후 Enter / 스페이스',
    infoLine: '단어 입력 후 Enter/스페이스 = 제거 · 💧 침수 회복 · ⚡ 전체 제거 · 🐌 5초 감속',
    hudScore: '⭐ {s}',
    hudWave: '☔ 웨이브 {n}',
    hudCombo: '🔥 콤보 {c} ×{m}',
    hudFlood: '☣ 침수 {n}/{max}',
    hudSlow: '🐌 감속!',
    waveBanner: '웨이브 {n}',
    lullBanner: '잠깐의 소강…',
    startBanner: '산성비가 몰려온다 — 타이핑 개시!',
    boltBanner: '⚡ 번개 — 화면 정리!',
    healPop: '💧 침수 -1',
    slowPop: '🐌 감속 5초',
    floodPop: '☣ 침수!',
    endTitle: '☣ 완전히 침수됐다…',
    endScore: '점수 {score}',
    endStats: '웨이브 {w} · 최대 콤보 {c} · WPM {wpm} · 정확도 {acc}%',
    newBest: ' — 🏆 최고 기록 갱신!',
    rankMsg: ' 🏆 랭킹 {n}위!',
    againBtn: '☔ 다시 도전',
    backBtn: '처음으로',
  },
  en: {
    title: 'Acid Rain',
    menuTitle: '☔ Acid Rain',
    menuDesc: 'A toxic rain of words pours from the sky. Type each word exactly to erase it before it lands. ' +
              'Every word that hits the ground raises the acid pool — five floods and it is over. ' +
              'A new wave rolls in every 15 seconds, faster and with longer words.',
    menuSpecial: '💧 Heal — restore 1 flood · ⚡ Bolt — clear the whole screen · 🐌 Slow — 5s slowdown',
    menuCombo: 'Consecutive kills build combo ×2 · ×3 — a typo breaks the chain',
    startKo: '▶ Korean Mode',
    startEn: '▶ English Mode',
    bestLine: 'Best — Korean {ko} · English {en}',
    typePh: 'Type a word, then Enter / Space',
    infoLine: 'Type a word + Enter/Space = erase · 💧 heal flood · ⚡ clear all · 🐌 5s slow',
    hudScore: '⭐ {s}',
    hudWave: '☔ Wave {n}',
    hudCombo: '🔥 Combo {c} ×{m}',
    hudFlood: '☣ Flood {n}/{max}',
    hudSlow: '🐌 Slowed!',
    waveBanner: 'Wave {n}',
    lullBanner: 'A brief lull…',
    startBanner: 'The acid rain is coming — start typing!',
    boltBanner: '⚡ Bolt — screen cleared!',
    healPop: '💧 Flood -1',
    slowPop: '🐌 Slow 5s',
    floodPop: '☣ Flooded!',
    endTitle: '☣ Completely Flooded…',
    endScore: 'Score {score}',
    endStats: 'Wave {w} · Max combo {c} · WPM {wpm} · Accuracy {acc}%',
    newBest: ' — 🏆 New best record!',
    rankMsg: ' 🏆 Rank #{n}!',
    againBtn: '☔ Try Again',
    backBtn: 'Back to Menu',
  },
});
var TR = GameI18n.t;
function TX(key, vals) {
  return TR(key).replace(/\{(\w+)\}/g, function (m, name) { return vals[name]; });
}

var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var VW = cv.width, VH = cv.height;
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd() { return Math.random(); }
function ri(n) { return Math.floor(Math.random() * n); }

/* ── 단어 은행: 한국어 일상 200 ── */
var KO_LIFE = ('사과 바다 하늘 구름 바람 나무 강물 노래 사랑 친구 ' +
  '가족 학교 연필 공책 가방 신발 양말 모자 장갑 우산 ' +
  '안경 시계 달력 거울 창문 마당 지붕 부엌 냄비 접시 ' +
  '김치 된장 고추 마늘 양파 감자 당근 오이 호박 배추 ' +
  '두부 계란 우유 치즈 과자 사탕 커피 녹차 주스 라면 ' +
  '국수 만두 김밥 냉면 피자 치킨 수박 딸기 포도 복숭아 ' +
  '자두 참외 미역 멸치 고등어 갈치 오징어 문어 새우 조개 ' +
  '아침 점심 저녁 새벽 노을 무지개 소나기 장마 천둥 번개 ' +
  '눈사람 고드름 단풍 낙엽 벚꽃 개나리 진달래 민들레 해바라기 코스모스 ' +
  '소나무 대나무 참새 까치 비둘기 제비 갈매기 독수리 부엉이 다람쥐 ' +
  '토끼 거북이 강아지 고양이 병아리 돼지 호랑이 사자 코끼리 기린 ' +
  '원숭이 고래 상어 붕어 잠자리 나비 개미 메뚜기 귀뚜라미 무당벌레 ' +
  '지렁이 달팽이 버스 지하철 기차 자전거 오토바이 비행기 헬리콥터 배낭 ' +
  '여행 지도 나침반 텐트 모닥불 낚시 등산 수영 축구 야구 ' +
  '농구 배구 탁구 볼링 줄넘기 술래잡기 숨바꼭질 윷놀이 연날리기 팽이 ' +
  '구슬 딱지 그네 시소 미끄럼틀 놀이터 운동장 도서관 박물관 미술관 ' +
  '영화관 시장 마트 편의점 약국 병원 우체국 은행 경찰서 소방서 ' +
  '손수건 목도리 스웨터 외투 청바지 치마 셔츠 단추 주머니 지갑 ' +
  '열쇠 자물쇠 사다리 망치 나사 빗자루 걸레 세탁기 냉장고 선풍기 ' +
  '에어컨 라디오 전화기 사진기 계산기 떡볶이 순대 어묵 붕어빵 호떡').split(' ');

/* ── 단어 은행: IT 용어(한글 표기) 100 ── */
var KO_IT = ('서버 코드 데이터 네트워크 알고리즘 변수 함수 클래스 객체 배열 ' +
  '문자열 정수 메모리 캐시 버퍼 스택 트리 그래프 해시 정렬 ' +
  '탐색 재귀 반복문 조건문 연산자 컴파일러 디버거 브라우저 쿠키 세션 ' +
  '토큰 인증 암호화 방화벽 프록시 게이트웨이 라우터 도메인 호스트 포트 ' +
  '프로토콜 패킷 대역폭 트래픽 클라우드 컨테이너 도커 쿠버네티스 마이크로서비스 데이터베이스 ' +
  '테이블 인덱스 트랜잭션 커밋 롤백 백업 샤딩 파티션 레플리카 프레임워크 ' +
  '라이브러리 모듈 패키지 의존성 빌드 배포 릴리스 버전 브랜치 머지 ' +
  '리베이스 이슈 버그 패치 리팩터링 테스트 로그 모니터링 대시보드 메트릭 ' +
  '트레이싱 오픈소스 라이선스 터미널 스크립트 커널 프로세스 스레드 뮤텍스 세마포어 ' +
  '데드락 스케줄러 인터럽트 가상머신 큐 오버플로 스로틀링 웹소켓 미들웨어 옵저버').split(' ');

/* ── 단어 은행: 영단어 200 ── */
var EN_WORDS = ('apple banana cloud river mountain forest garden window bridge castle ' +
  'dragon knight wizard potion shield sword arrow lantern candle marble ' +
  'copper silver golden breeze meadow valley canyon desert island harbor ' +
  'sailor anchor compass voyage journey ticket wallet pocket button ribbon ' +
  'basket bottle kettle spoon plate table chair sofa pillow blanket ' +
  'mirror ladder hammer needle thread fabric cotton leather pepper ginger ' +
  'garlic onion carrot tomato potato lettuce spinach walnut almond honey ' +
  'sugar butter cheese bread toast jelly cookie candy waffle muffin ' +
  'donut bacon salad noodle soup rice corn wheat berry grape ' +
  'lemon orange peach cherry melon mango plum pear tiger lion ' +
  'zebra panda koala camel eagle falcon owl swan crane robin ' +
  'whale shark salmon trout crab shrimp oyster turtle rabbit squirrel ' +
  'spider beetle cricket firefly maple willow cedar bamboo cactus tulip ' +
  'daisy orchid violet clover acorn pebble boulder cliff summit glacier ' +
  'thunder lightning rainbow sunrise sunset twilight midnight morning evening season ' +
  'spring summer autumn winter blizzard drizzle monsoon typhoon frost mist ' +
  'train subway bicycle airplane rocket sailboat ferry wagon engine tunnel ' +
  'station airport market bakery library museum theater stadium school office ' +
  'doctor nurse farmer baker singer dancer painter writer teacher student ' +
  'music guitar violin trumpet drum flute piano melody rhythm harmony').split(' ');

/** 웨이브가 오를수록 긴 단어 비중을 키우기 위한 길이 버킷 */
function buckets(list, shortMax, midMax) {
  var b = { short: [], mid: [], long: [] };
  for (var i = 0; i < list.length; i++) {
    var L = list[i].length;
    (L <= shortMax ? b.short : L <= midMax ? b.mid : b.long).push(list[i]);
  }
  return b;
}
var KO_BANK = buckets(KO_LIFE.concat(KO_IT), 2, 3);
var EN_BANK = buckets(EN_WORDS, 5, 7);

/* ── 규칙 상수 ── */
var MAX_FLOOD = 5, WAVE_TIME = 15, LULL_TIME = 3;
var SPECIAL_P = 0.09, SLOW_MUL = 0.45, SLOW_DUR = 5;
var WORD_FONT = 'bold 19px "Courier New", monospace';
var KIND = {
  n:    { color: '#e6ecf2', icon: '' },
  heal: { color: '#60a5fa', icon: '💧' },
  bolt: { color: '#eab308', icon: '⚡' },
  slow: { color: '#7dd3fc', icon: '🐌' },
};
var BEST_KEY = 'acid_rain_best';

/* ── 상태 ── */
var G = null, running = false, bannerT = 0, shake = 0, typed = '';
var box = $('typeBox');

function newGame(mode) {
  G = { mode: mode, wave: 1, phase: 'wave', waveT: WAVE_TIME, spawnT: 0.6,
        words: [], parts: [], flood: 0, slowT: 0, flash: 0,
        score: 0, combo: 0, maxCombo: 0, hits: 0, misses: 0, chars: 0,
        startAt: performance.now() };
  typed = ''; shake = 0;
}
function mult() { return G.combo >= 10 ? 3 : G.combo >= 5 ? 2 : 1; }
function poolTop() { return VH - (16 + G.flood * 13); }

function loadBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; }
}
function saveBest(b) { try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) {} }
function updateBestLine() {
  var b = loadBest();
  $('bestLine').textContent = TX('bestLine', {
    ko: (b.ko || 0).toLocaleString(), en: (b.en || 0).toLocaleString(),
  });
}

function banner(text) {
  var el = $('banner');
  el.textContent = text;
  el.style.fontSize = text.length > 26 ? '17px' : '26px';
  el.classList.add('on');
  bannerT = text.length > 26 ? 2400 : 1500;
}

/* ── 이펙트 ── */
function burst(x, y, color, n, spd) {
  for (var i = 0; i < n; i++) {
    var a = rnd() * Math.PI * 2, s = spd * (0.35 + rnd() * 0.85);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
                   life: 1, color: color, size: 2 + rnd() * 3, grav: 240 });
  }
}
function popText(x, y, text, color) {
  G.parts.push({ x: clamp(x, 40, VW - 40), y: y, vx: 0, vy: -30, life: 1, text: text, color: color, grav: 0 });
}
function ringFx(x, y, color, r) { G.parts.push({ x: x, y: y, vx: 0, vy: 0, life: 1, ring: r, color: color, grav: 0 }); }
function bubbleFx(x, y) {
  G.parts.push({ x: x, y: y, vx: (rnd() - 0.5) * 10, vy: -22 - rnd() * 18, life: 1, color: '#a3e635', size: 2, grav: 0 });
}

/* ── 스폰 ── */
function maxOnScreen() { return Math.min(9, 2 + G.wave); }
function spawnInterval() { return Math.max(0.7, 2.2 - G.wave * 0.13); }
function fallSpeed() { return Math.min(160, 24 + G.wave * 6) * (0.75 + rnd() * 0.5); }

function pickText() {
  var bank = G.mode === 'en' ? EN_BANK : KO_BANK;
  var pLong = Math.min(0.12 + G.wave * 0.05, 0.55);
  var r = rnd();
  var arr = r < pLong ? bank.long : r < pLong + 0.34 ? bank.mid : bank.short;
  if (!arr.length) arr = bank.mid;
  return arr[ri(arr.length)];
}
function spawnWord() {
  var text = null;
  for (var t = 0; t < 8; t++) {                       // 화면에 이미 있는 단어는 피한다
    var cand = pickText(), dup = false;
    for (var i = 0; i < G.words.length; i++) if (G.words[i].text === cand) { dup = true; break; }
    if (!dup) { text = cand; break; }
  }
  if (!text) return;
  var kind = 'n';
  if (rnd() < SPECIAL_P) {
    var r2 = rnd();
    kind = r2 < 0.4 ? 'heal' : r2 < 0.8 ? 'slow' : 'bolt';
  }
  cx.font = WORD_FONT;
  var iconW = kind === 'n' ? 0 : cx.measureText(KIND[kind].icon + ' ').width;
  var w = iconW + cx.measureText(text).width;
  G.words.push({ text: text, kind: kind, x: 10 + rnd() * Math.max(1, VW - 20 - w),
                 y: -14, v: fallSpeed(), w: w, iconW: iconW });
}

/* ── 처치 / 침수 ── */
function removeWord(w) { G.words.splice(G.words.indexOf(w), 1); }
function wordPts(w) { return w.text.length * 10 * mult(); }

function killWord(w) {
  var pts = wordPts(w);
  G.score += pts;
  G.hits++; G.chars += w.text.length;
  G.combo++;
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  var col = KIND[w.kind].color;
  removeWord(w);
  burst(w.x + w.w / 2, w.y, w.kind === 'n' ? '#a3e635' : col, 14, 150);   // 잉크 튀는 이펙트
  ringFx(w.x + w.w / 2, w.y, col, 30);
  popText(w.x + w.w / 2, w.y - 16, '+' + pts, '#a3e635');

  if (w.kind === 'heal') {
    if (G.flood > 0) G.flood--;
    popText(w.x + w.w / 2, w.y - 34, TR('healPop'), '#60a5fa');
  } else if (w.kind === 'slow') {
    G.slowT = SLOW_DUR;
    popText(w.x + w.w / 2, w.y - 34, TR('slowPop'), '#7dd3fc');
  } else if (w.kind === 'bolt') {
    G.flash = 1; shake = 7;
    banner(TR('boltBanner'));
    var rest = G.words.slice();
    for (var i = 0; i < rest.length; i++) {
      var o = rest[i], p = wordPts(o);
      G.score += p;
      burst(o.x + o.w / 2, o.y, '#eab308', 8, 130);
      popText(o.x + o.w / 2, o.y - 14, '+' + p, '#eab308');
    }
    G.words = [];
  }
}

function drown(w) {
  removeWord(w);
  G.flood++;
  shake = 6;
  burst(w.x + w.w / 2, poolTop(), '#a3e635', 16, 130);
  popText(w.x + w.w / 2, poolTop() - 22, TR('floodPop'), '#ef4444');
  if (G.flood >= MAX_FLOOD) endGame();
}

/* ── 입력 ── */
function submitWord(raw) {
  if (!running || !raw) return;
  var t = G.mode === 'en' ? raw.toLowerCase() : raw;
  var best = null;
  for (var i = 0; i < G.words.length; i++) {
    var w = G.words[i];
    if (w.text === t && (!best || w.y > best.y)) best = w;    // 가장 아래쪽 우선
  }
  if (best) { killWord(best); return; }
  G.misses++; G.combo = 0;                                    // 오타 → 콤보 리셋
  box.classList.add('err');
  setTimeout(function () { box.classList.remove('err'); }, 220);
}

box.addEventListener('input', function () {
  var v = box.value;
  if (v.length && v.charAt(v.length - 1) === ' ') {           // 스페이스 = 제출 (한글 IME 안전)
    var t = v.replace(/\s+/g, '');
    box.value = ''; typed = '';
    submitWord(t);
    return;
  }
  typed = v.replace(/\s+/g, '');
});
box.addEventListener('keydown', function (ev) {
  if ((ev.key === 'Enter' || ev.keyCode === 13) && !ev.isComposing && ev.keyCode !== 229) {
    ev.preventDefault();
    var t = box.value.replace(/\s+/g, '');
    box.value = ''; typed = '';
    submitWord(t);
  }
});
cv.addEventListener('pointerdown', function (ev) {
  if (running) ev.preventDefault();                           // 캔버스 탭으로 input 포커스가 풀리지 않게
});

/* ── 진행 ── */
function update(dt) {
  var ts = 1;
  if (G.slowT > 0) { G.slowT -= dt; ts = SLOW_MUL; }

  if (G.phase === 'wave') {
    G.waveT -= dt;
    if (G.waveT <= 0) {
      G.phase = 'lull'; G.lullT = LULL_TIME;
      banner(TR('lullBanner'));
    } else {
      G.spawnT -= dt;
      var topClear = true;
      for (var i = 0; i < G.words.length; i++) if (G.words[i].y < 26) { topClear = false; break; }
      if (G.spawnT <= 0 && topClear && G.words.length < maxOnScreen()) {
        G.spawnT = spawnInterval();
        spawnWord();
      }
    }
  } else {
    G.lullT -= dt;
    if (G.lullT <= 0) {
      G.wave++; G.phase = 'wave'; G.waveT = WAVE_TIME; G.spawnT = 0.4;
      banner(TX('waveBanner', { n: G.wave }));
    }
  }

  var fall = G.words.slice();
  for (var j = 0; j < fall.length; j++) {
    var w = fall[j];
    w.y += w.v * ts * dt;
    if (w.y >= poolTop() - 2) { drown(w); if (!running) return; }
  }

  // 배경 빗줄기
  for (var k = 0; k < streaks.length; k++) {
    var st = streaks[k];
    st.y += st.spd * ts * dt;
    if (st.y > VH) { st.y = -st.len; st.x = rnd() * VW; }
  }
  if (rnd() < dt * 5) bubbleFx(rnd() * VW, poolTop() + 4 + rnd() * 8);    // 산성 풀 기포

  var parts = G.parts.slice();
  for (var p = 0; p < parts.length; p++) {
    var pa = parts[p];
    pa.x += pa.vx * dt; pa.y += pa.vy * dt;
    pa.vy += (pa.grav || 0) * dt;
    pa.life -= dt * (pa.text ? 1.0 : pa.ring ? 2.6 : 2.0);
    if (pa.life <= 0) G.parts.splice(G.parts.indexOf(pa), 1);
  }
  G.flash = Math.max(0, G.flash - dt * 3);
  shake = Math.max(0, shake - dt * 26);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}

/* ── 배경 (한 번만 그려 캐시) ── */
var seed = 20260806;
function srnd() { return (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff; }
var bgCv = null, streaks = [];
function buildBg() {
  bgCv = document.createElement('canvas'); bgCv.width = VW; bgCv.height = VH;
  var g = bgCv.getContext('2d');
  seed = 20260806;
  var grad = g.createLinearGradient(0, 0, 0, VH);
  grad.addColorStop(0, '#101b33'); grad.addColorStop(0.5, '#0c1424'); grad.addColorStop(1, '#0a111e');
  g.fillStyle = grad; g.fillRect(0, 0, VW, VH);
  for (var i = 0; i < 90; i++) {                              // 희미한 안개 입자
    g.fillStyle = 'rgba(163,230,53,' + (0.015 + srnd() * 0.03).toFixed(3) + ')';
    g.fillRect(Math.floor(srnd() * VW), Math.floor(srnd() * VH * 0.8), 2, 2);
  }
  for (var c = 0; c < 16; c++) {                              // 상단 독성 구름 띠
    var cxp = srnd() * VW, cyp = 12 + srnd() * 30, r = 26 + srnd() * 40;
    g.fillStyle = 'rgba(26,34,56,.9)';
    g.beginPath(); g.arc(cxp, cyp, r, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(163,230,53,.14)'; g.fillRect(0, 56, VW, 2);
  for (var b = 0; b < 34; b++) {                              // 구름 밑면 산성 이슬
    g.fillStyle = 'rgba(163,230,53,' + (0.1 + srnd() * 0.2).toFixed(3) + ')';
    g.fillRect(Math.floor(srnd() * VW), 58 + Math.floor(srnd() * 5), 2, 3 + Math.floor(srnd() * 4));
  }
  streaks = [];
  for (var s = 0; s < 56; s++) {
    streaks.push({ x: rnd() * VW, y: rnd() * VH, len: 8 + rnd() * 14, spd: 220 + rnd() * 180 });
  }
}

/* ── 렌더 ── */
function draw(now) {
  var ox = shake ? (rnd() - 0.5) * shake : 0, oy = shake ? (rnd() - 0.5) * shake : 0;
  cx.save(); cx.translate(ox, oy);
  cx.drawImage(bgCv, 0, 0);

  cx.strokeStyle = 'rgba(163,230,53,.10)'; cx.lineWidth = 1;   // 빗줄기
  cx.beginPath();
  for (var k = 0; k < streaks.length; k++) {
    var st = streaks[k];
    cx.moveTo(st.x, st.y); cx.lineTo(st.x - 2, st.y + st.len);
  }
  cx.stroke();

  // 단어
  cx.font = WORD_FONT; cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
  var pt = poolTop();
  for (var i = 0; i < G.words.length; i++) {
    var w = G.words[i];
    var col = KIND[w.kind].color;
    if (w.kind === 'n' && w.y > pt - 90) col = '#ef4444';      // 침수 임박 경고
    if (w.iconW) cx.fillText(KIND[w.kind].icon, w.x, w.y);     // 이모지는 fillStyle 무시 — 그림자 없이 1회
    var tx = w.x + w.iconW;
    cx.fillStyle = '#050a14'; cx.fillText(w.text, tx + 1.5, w.y + 1.5);
    cx.fillStyle = col; cx.fillText(w.text, tx, w.y);
    var cur = G.mode === 'en' ? typed.toLowerCase() : typed;
    if (cur && w.text.indexOf(cur) === 0) {                    // 입력 중 접두 일치 하이라이트
      cx.fillStyle = '#0ea5e9';
      cx.fillText(cur, tx, w.y);
      cx.fillRect(tx, w.y + 4, w.w - w.iconW, 2);
    }
  }

  // 산성 풀 — 단어를 덮어 가라앉는 느낌을 준다
  cx.fillStyle = 'rgba(163,230,53,.26)';
  cx.beginPath();
  cx.moveTo(0, VH);
  for (var x = 0; x <= VW; x += 16) {
    cx.lineTo(x, pt + Math.sin(now / 300 + x * 0.045) * 3);
  }
  cx.lineTo(VW, VH);
  cx.closePath(); cx.fill();
  cx.strokeStyle = '#a3e635'; cx.lineWidth = 2;
  cx.beginPath();
  for (var x2 = 0; x2 <= VW; x2 += 16) {
    var yy = pt + Math.sin(now / 300 + x2 * 0.045) * 3;
    if (x2 === 0) cx.moveTo(x2, yy); else cx.lineTo(x2, yy);
  }
  cx.stroke();

  // 파티클
  for (var p = 0; p < G.parts.length; p++) {
    var pa = G.parts[p];
    cx.globalAlpha = clamp(pa.life, 0, 1);
    if (pa.ring) {
      cx.strokeStyle = pa.color; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(pa.x, pa.y, pa.ring * (1.25 - pa.life), 0, 7); cx.stroke();
    } else if (pa.text) {
      cx.font = 'bold 13px monospace'; cx.textAlign = 'center';
      cx.fillStyle = '#000'; cx.fillText(pa.text, pa.x + 1, pa.y + 1);
      cx.fillStyle = pa.color; cx.fillText(pa.text, pa.x, pa.y);
      cx.font = WORD_FONT; cx.textAlign = 'left';
    } else {
      cx.fillStyle = pa.color; cx.fillRect(pa.x, pa.y, pa.size, pa.size);
    }
    cx.globalAlpha = 1;
  }
  if (G.flash > 0) {
    cx.fillStyle = 'rgba(234,179,8,' + (G.flash * 0.25).toFixed(3) + ')';
    cx.fillRect(0, 0, VW, VH);
  }
  cx.restore();

  // HUD
  $('scoreTxt').textContent = TX('hudScore', { s: G.score.toLocaleString() });
  $('waveTxt').textContent = TX('hudWave', { n: G.wave });
  $('comboTxt').textContent = TX('hudCombo', { c: G.combo, m: mult() });
  $('floodTxt').textContent = TX('hudFlood', { n: G.flood, max: MAX_FLOOD });
  $('slowTag').hidden = !(G.slowT > 0);
  if (G.slowT > 0) $('slowTag').textContent = TR('hudSlow');
}

/* ── 시작 / 종료 ── */
function startGame(mode) {
  newGame(mode);
  running = true;
  $('menu').hidden = true; $('endPanel').hidden = true;
  $('hud').hidden = false; $('inputBar').hidden = false;
  box.value = '';
  box.focus();
  banner(TR('startBanner'));
}
function endGame() {
  running = false;
  $('hud').hidden = true; $('inputBar').hidden = true;
  box.blur();
  $('banner').classList.remove('on'); bannerT = 0;

  var minutes = Math.max(0.02, (performance.now() - G.startAt) / 60000);
  var wpm = Math.round((G.chars / 5) / minutes);
  var acc = G.hits + G.misses > 0 ? Math.round(G.hits * 100 / (G.hits + G.misses)) : 100;

  var best = loadBest(), isBest = G.score > (best[G.mode] || 0);
  if (isBest) { best[G.mode] = G.score; saveBest(best); }

  $('endTitle').textContent = TR('endTitle');
  $('endScore').textContent = TX('endScore', { score: G.score.toLocaleString() }) + (isBest ? TR('newBest') : '');
  $('endStats').textContent = TX('endStats', { w: G.wave, c: G.maxCombo, wpm: wpm, acc: acc });
  $('endPanel').hidden = false;

  GameRank.submit('acid-rain', G.score, '웨이브 ' + G.wave + ', 최대콤보 ' + G.maxCombo)
    .then(function (r) {
      if (r && r.applied) $('endScore').textContent += TX('rankMsg', { n: r.rank });
    });
}

var last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  var now = performance.now(), dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!running || !G) return;
  update(dt);
  if (running && G) draw(now);
}
buildBg();
requestAnimationFrame(loop);
updateBestLine();
var lastMode = 'ko';
$('startKoBtn').onclick = function () { lastMode = 'ko'; startGame('ko'); };
$('startEnBtn').onclick = function () { lastMode = 'en'; startGame('en'); };
$('againBtn').onclick = function () { startGame(lastMode); };
$('backBtn').onclick = function () {
  $('endPanel').hidden = true; $('menu').hidden = false;
  updateBestLine();
};
</script>
<!-- 레이아웃 전용: 조이스틱 없이 상단 정렬 + 하단 여백 + 캔버스 비율 맞춤만 쓴다.
     입력 방식은 게임이 이미 가진 것을 그대로 둔다. -->
<script src="../lib/touch.js" data-stick="off"></script>
<script src="../lib/rank.js"></script>
<script>
GameRank.autoPanel('acid-rain');
</script>
