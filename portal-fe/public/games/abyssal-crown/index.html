<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>심연의 왕관 — Abyssal Crown</title>
<meta name="description" content="가라앉은 왕국의 마지막 창기사가 되어 심연의 세 지역을 돌파하는 로그라이크 액션 RPG." />
<meta name="theme-color" content="#03060c" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303060c'/%3E%3Cpath d='M5 24 L7 9 L12 16 L16 5 L20 16 L25 9 L27 24 Z' fill='%23f5c542'/%3E%3Crect x='5' y='25' width='22' height='3' fill='%23f5c542'/%3E%3C/svg%3E" />
<style>
  @font-face {
    font-family: 'Galmuri11';
    src: url('./assets/fonts/Galmuri11.woff2') format('woff2');
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Galmuri11Bold';
    src: url('./assets/fonts/Galmuri11-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: 'Galmuri14';
    src: url('./assets/fonts/Galmuri14.woff2') format('woff2');
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'Galmuri9';
    src: url('./assets/fonts/Galmuri9.woff2') format('woff2');
    font-weight: 400;
    font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #03060c;
    overflow: hidden;
    font-family: 'Galmuri11', monospace;
    color: #e8f3ff;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 30%, #0b1626 0%, #04070f 60%, #010308 100%);
  }

  canvas#game {
    display: block;
    image-rendering: auto;
    box-shadow: 0 0 90px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(80, 140, 170, 0.18);
    background: #03060c;
    touch-action: none;
  }

  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #03060c;
    z-index: 20;
    transition: opacity 0.5s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }

  #loader .crown {
    width: 74px;
    height: 74px;
    border: 3px solid rgba(245, 197, 66, 0.35);
    border-top-color: #f5c542;
    border-radius: 50%;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loader .t { font-size: 20px; color: #f5c542; letter-spacing: 0.12em; }
  #loader .s { font-size: 13px; color: #6f8aa2; }

  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #03060c;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-size: 16px;
    line-height: 1.7;
    color: #9fb8cc;
  }
  /* Keyboard-only game: tell touch/narrow visitors up front. */
  @media (max-width: 720px), (pointer: coarse) and (max-width: 1000px) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720" aria-label="심연의 왕관 게임 화면"></canvas>
  </div>

  <div id="loader">
    <div class="crown"></div>
    <div class="t">심연의 왕관</div>
    <div class="s">ABYSSAL CROWN — 불러오는 중</div>
  </div>

  <div id="rotate">
    <div>
      <strong style="color:#f5c542;font-size:20px;">심연의 왕관</strong><br /><br />
      이 게임은 <b>키보드 전용</b>입니다.<br />
      데스크톱 브라우저에서 넓은 화면으로 즐겨주세요.<br /><br />
      <span style="color:#6f8aa2;font-size:13px;">WASD 이동 · J 공격 · K 특수 · L 주문 · SPACE 대시</span>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
