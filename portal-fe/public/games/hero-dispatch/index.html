<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dbe4f5; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:flex-start; min-height:100vh; user-select:none; padding:14px 0; }
  #wrap { width:min(560px, 100vw); }
  h1 { color:#0ea5e9; font-size:22px; text-align:center; text-shadow:2px 2px 0 #000; margin:6px 0 2px; }
  #sub { text-align:center; font-size:11px; color:#8b98b8; margin-bottom:12px; }
  .panel { background:#111a30; border:1px solid #2a3452; border-radius:12px; padding:18px 14px; margin:0 12px;
           display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; }
  .panel p { font-size:12.5px; line-height:1.75; color:#a9b6d3; max-width:480px; }
  .panel .howto { font-size:11px; color:#8b98b8; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  button.big { background:#0ea5e9; color:#04121f; border:0; padding:12px 26px; border-radius:8px; font-weight:bold;
               font-family:inherit; font-size:14px; cursor:pointer; min-height:46px; }
  button.ghost { background:#232c48; color:#dbe4f5; border:1px solid #2a3452; padding:8px 12px; border-radius:7px;
                 font-family:inherit; font-size:11.5px; cursor:pointer; min-height:38px; }
  #saveRow input { background:#0c1424; border:1px solid #2a3452; color:#dbe4f5; border-radius:6px; padding:8px 9px;
                   font-family:inherit; font-size:12px; letter-spacing:1px; width:160px; text-transform:uppercase; }
  #saveStatus { font-size:10.5px; color:#8b98b8; }
  #codeShow { font-size:11px; color:#eab308; letter-spacing:2px; }
  #hud { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; font-size:13px; font-weight:bold; margin:4px 0 10px; }
  #hud span { background:rgba(14,165,233,.08); border:1px solid #2a3452; border-radius:9px; padding:5px 12px; }
  #tabs { display:flex; gap:6px; padding:0 12px; margin-bottom:8px; }
  #tabs button { flex:1; background:#1a2238; border:1px solid #2a3452; color:#a9b6d3; padding:10px 2px; border-radius:8px;
                 font-family:inherit; font-size:11.5px; cursor:pointer; min-height:44px; }
  #tabs button.on { background:#0ea5e9; color:#04121f; border-color:#0ea5e9; font-weight:bold; }
  .tabPage { display:flex; flex-direction:column; gap:7px; padding:0 12px 14px; }
  .card { background:#1a2238; border:1px solid #2a3452; border-radius:10px; padding:10px 12px; display:flex;
          justify-content:space-between; align-items:center; gap:10px; text-align:left; }
  .card .cl { flex:1; min-width:0; }
  .card b { font-size:13px; display:block; }
  .card small { display:block; color:#8b98b8; font-size:10.5px; line-height:1.65; }
  .card small.timer { color:#eab308; }
  .card small.firstHint { color:#22c55e; }
  .card button { background:#0ea5e9; color:#04121f; border:0; border-radius:7px; padding:9px 14px; font-family:inherit;
                 font-weight:bold; font-size:12px; cursor:pointer; min-height:40px; white-space:nowrap; }
  .card button:disabled { opacity:.35; cursor:default; }
  .card button.dangerB { background:transparent; color:#ef4444; border:1px solid #ef4444; font-weight:normal;
                         padding:6px 10px; min-height:32px; font-size:11px; }
  .bar { height:6px; background:#0c1424; border-radius:3px; overflow:hidden; margin-top:4px; width:100%; }
  .bar i { display:block; height:100%; background:#22c55e; }
  .ov { position:fixed; inset:0; background:rgba(5,9,20,.86); display:flex; align-items:center; justify-content:center;
        z-index:50; padding:14px; }
  .ovCard { background:#1a2238; border:1px solid #2a3452; border-radius:12px; padding:16px 14px; width:min(480px, 96vw);

  .repLbl { font-size:12px; display:flex; gap:6px; align-items:center; justify-content:center; cursor:pointer; }
  #bookGrid { display:grid; grid-template-columns:58px repeat(4, 1fr); gap:5px; }

<div id="wrap">

  <div id="menu" class="panel">
    <p data-i18n="menuDesc"></p>
    <p class="howto" data-i18n="menuHow"></p>
    <div id="saveStatus"></div>
    <div class="row" id="saveRow">
      <input id="codeInput" placeholder="이어하기 코드" data-i18n-ph="phCode" maxlength="18" autocomplete="off">
      <button id="codeLoadBtn" class="ghost" data-i18n="btnCodeLoad">🔑 코드로 불러오기</button>
    </div>
    <div id="codeShow"></div>
    <button id="startBtn" class="big" data-i18n="startBtn">▶ 파견소 입장</button>
  </div>

  <div id="game" hidden>

    <div id="tabs">

      <button data-tab="fac" data-i18n="tabFac">🏛 시설</button>
      <button data-tab="book" data-i18n="tabBook">📖 도감</button>
      <button id="sumBtn" data-i18n="btnSummary">📊 요약</button>
    </div>
    <div id="tab-dg" class="tabPage"></div>
    <div id="tab-hero" class="tabPage" hidden></div>
    <div id="tab-fac" class="tabPage" hidden></div>
    <div id="tab-book" class="tabPage" hidden></div>
  </div>

  <div id="summary" class="panel" hidden>

    <div id="sumBody"></div>
    <div class="row">

      <button id="backBtn" class="ghost" data-i18n="backBtn">메뉴로</button>

  </div>
</div>

<div id="dgOv" class="ov" hidden><div class="ovCard" id="dgOvCard"></div></div>
<div id="offOv" class="ov" hidden>

</div>

var TR = GameI18n.t;
var API = '/api/v1/games/hero-dispatch';
function $(id) { return document.getElementById(id); }
function ri(n) { return Math.floor(Math.random() * n); }
function T(key, map) {
  var s = TR(key);
  if (map) { for (var k in map) s = s.split('{' + k + '}').join(map[k]); }
  return s;
}
function fmt(n) {
  return n >= 1e12 ? (n / 1e12).toFixed(2) + 'T' : n >= 1e9 ? (n / 1e9).toFixed(2) + 'B'
       : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : Math.floor(n).toString();
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtT(sec) {
  sec = Math.max(0, Math.ceil(sec));
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
}
function toast(msg) {
  var el = $('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(function () { el.style.opacity = 0; }, 2600);
}

function deviceId() {
  var id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
function api(path, opt) {
  opt = opt || {};
  var headers = { 'Content-Type': 'application/json', 'X-Device-Id': deviceId() };
  if (opt.headers) { for (var k in opt.headers) headers[k] = opt.headers[k]; }
  var tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
  var init = { method: opt.method || 'GET', headers: headers };
  if (opt.body) init.body = opt.body;
  return fetch(API + path, init).then(function (res) {
    return res.json().catch(function () { return null; }).then(function (body) {
      if (!res.ok || !body || body.success === false) {
        throw new Error((body && body.error && body.error.code) || res.status);
      }
      return body.data;
    });
  });
}
var CODE_KEY = 'hero_dispatch_code', LOCAL_KEY = 'hero_dispatch_save';
var saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
function fmtCode(c) { return c ? c.replace(/(.{4})(?=.)/g, '$1-') : ''; }
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }

function loadSave(codeOverride) {
  var code = codeOverride || saveCode;
  if (token() || code) {
    return api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''))
      .then(function (s) {
        saveVersion = s.version;
        if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
        $('saveStatus').textContent = T('saveCloud', { v: saveVersion });
        showCode();
        if (s.data && s.data.v === 1) return s.data;
        if (codeOverride) toast(TR('saveNoCode'));
        return null;
      })
      .catch(function (e) {
        $('saveStatus').textContent = T('saveFail', { e: e.message });
        if (codeOverride) return null;
        return loadLocal();
      });
  }
  return Promise.resolve(loadLocal());
}
function loadLocal() {
  $('saveStatus').textContent = TR('saveLocal');
  showCode();
  try {
    var d = JSON.parse(localStorage.getItem(LOCAL_KEY));
    return d && d.v === 1 ? d : null;
  } catch (_) { return null; }
}
function persist() {
  if (!S) return;
  S.lastTs = Date.now();
  localStorage.setItem(LOCAL_KEY, JSON.stringify(S));
  api('/save', { method: 'PUT', body: JSON.stringify({ data: S, version: saveVersion, code: saveCode }) })
    .then(function (s) {
      saveVersion = s.version;
      var freshCode = !saveCode && s.code;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (freshCode) toast(T('codeIssued', { c: fmtCode(saveCode) }));
      showCode();
    })
    .catch(function (e) {
      if (e.message !== 'INVALID_INPUT') return;
      api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''))
        .then(function (re) {
          saveVersion = re.version;
          return api('/save', { method: 'PUT', body: JSON.stringify({ data: S, version: saveVersion, code: saveCode }) });
        })
        .then(function (s2) { saveVersion = s2.version; })
        .catch(function () {});
    });
}
var persistTimer = null;
function persistSoon() { clearTimeout(persistTimer); persistTimer = setTimeout(persist, 2500); }

  { e: '🔮', pw: 1.0 },    // 마법사 — 골드 +10%

];
var GRADE = [

  { c: '#22c55e', base: 18,  refund: 30 },
  { c: '#0ea5e9', base: 40,  refund: 100 },
  { c: '#a78bfa', base: 90,  refund: 350 },
  { c: '#eab308', base: 200, refund: 1200 },

var GACHA = [50, 30, 14, 5, 1];
var DG = [

  { k: 'dg1', e: '⛏', dur: 300,  req: 45,   gold: 130,  xp: 70,   fame: 3 },

/* ── 상태 ── */
var S = null;
var fameDirty = false;
function fresh() {
  return {
    v: 1, gold: 150, fame: 0, hires: 0, seq: 2, clears: 0, wins: 0, fails: 0,
    heroes: [{ id: 1, n: [ri(NAME_A.ko.length), ri(NAME_B.ko.length)], cls: 0, grade: 0, lv: 1, xp: 0 }],
    disp: [], fac: { train: 0, vault: 0, house: 0 }, book: { '0_0': 1 }, first: {}, lastTs: Date.now(),
  };
}
function heroName(h) {
  var lg = (window.GameI18n && GameI18n.lang) === 'en' ? 'en' : 'ko';
  return NAME_A[lg][h.n[0] % NAME_A[lg].length] + NAME_B[lg][h.n[1] % NAME_B[lg].length];
}
function heroById(id) {
  for (var i = 0; i < S.heroes.length; i++) if (S.heroes[i].id === id) return S.heroes[i];
  return null;
}
function xpNeed(lv) { return Math.round(60 * Math.pow(lv, 1.5)); }
function power(h) { return Math.floor(GRADE[h.grade].base * CLS[h.cls].pw * (1 + 0.15 * (h.lv - 1))); }
function bookCount() { var c = 0; for (var k in S.book) c++; return c; }
function partyPower(ids) {
  var sum = 0;
  for (var i = 0; i < ids.length; i++) { var h = heroById(ids[i]); if (h) sum += power(h); }
  return Math.floor(sum * (1 + bookCount() / 100));         // 도감 수집 보너스 +1%/종
}
function trainMul() { return 1 + 0.25 * S.fac.train; }
function vaultH() { return 2 + 2 * S.fac.vault; }
function maxHeroes() { return 8 + S.fac.house; }
function hireCost() { return Math.round(100 * Math.pow(1.28, S.hires)); }
function legendCount() {
  var c = 0;
  for (var i = 0; i < S.heroes.length; i++) if (S.heroes[i].grade === 4) c++;
  return c;
}
function busySet() {
  var m = {};
  for (var i = 0; i < S.disp.length; i++) {
    for (var j = 0; j < S.disp[i].ids.length; j++) m[S.disp[i].ids[j]] = true;
  }
  return m;
}
function idleHeroes() {
  var b = busySet(), out = [];
  for (var i = 0; i < S.heroes.length; i++) if (!b[S.heroes[i].id]) out.push(S.heroes[i]);
  return out;
}
function dispOf(dg) {
  for (var i = 0; i < S.disp.length; i++) if (S.disp[i].dg === dg) return S.disp[i];
  return null;
}
function clsCount(ids, cls) {
  var c = 0;
  for (var i = 0; i < ids.length; i++) { var h = heroById(ids[i]); if (h && h.cls === cls) c++; }
  return c;
}
/* 성공률 = clamp(round(90 × 파티전투력/권장), 5, 95) + 궁수×4%p (최대 3명, 총 상한 97) */
function successRate(pp, dg, archers) {
  var base = Math.round(90 * pp / DG[dg].req);
  if (base > 95) base = 95;
  if (base < 5) base = 5;
  var r = base + 4 * Math.min(archers, 3);
  return r > 97 ? 97 : r;
}
function overMul(pp, dg) {
  var over = pp / DG[dg].req - 1;
  return 1 + 0.5 * Math.min(Math.max(over, 0), 1);          // 권장 초과분 — 최대 +50%
}
function grantXp(h, amt) {
  var ups = 0;
  h.xp += amt;
  while (h.lv < 60 && h.xp >= xpNeed(h.lv)) { h.xp -= xpNeed(h.lv); h.lv++; ups++; }
  return ups;
}
function dgName(i) { return DG[i].e + ' ' + TR(DG[i].k); }
function partyNames(ids) {
  var out = [];
  for (var i = 0; i < ids.length; i++) { var h = heroById(ids[i]); if (h) out.push(heroName(h)); }
  return out.join(', ');
}

/* ── 파견 정산 — 온라인 틱과 오프라인 복귀가 같은 경로를 쓴다 ── */
function runOnce(d, res) {
  var g = DG[d.dg];
  var archers = clsCount(d.ids, 1), mages = clsCount(d.ids, 2), priests = clsCount(d.ids, 3);
  var pp = partyPower(d.ids);
  var win = Math.random() * 100 < successRate(pp, d.dg, archers);
  var mult = overMul(pp, d.dg);
  var gold = Math.round(g.gold * mult * (1 + 0.1 * mages));
  var xp = Math.round(g.xp * mult * trainMul() * (1 + 0.15 * priests));
  if (!win) {
    var fr = priests > 0 ? 0.6 : 0.5;
    gold = Math.round(gold * fr); xp = Math.round(xp * fr);
  }
  S.gold += gold; S.clears++;
  res.runs++; res.gold += gold; res.xp += xp;
  for (var i = 0; i < d.ids.length; i++) {
    var h = heroById(d.ids[i]);
    if (h && grantXp(h, xp) > 0) res.lvups.push(T('lvTxt', { n: heroName(h), l: h.lv }));
  }
  if (win) {
    S.wins++; S.fame += g.fame;
    res.wins++; res.fame += g.fame;
    if (!S.first[d.dg]) {
      S.first[d.dg] = 1;
      var bg = g.gold * 4, bf = g.fame * 5;                 // 첫 클리어 보너스
      S.gold += bg; S.fame += bf;
      res.gold += bg; res.fame += bf;
      res.first = true; res.firstGold = bg; res.firstFame = bf;
    }
  } else {
    S.fails++;
  }
}
function settleAll(capSec, refTs) {
  var out = [], now = Date.now();
  for (var i = S.disp.length - 1; i >= 0; i--) {
    var d = S.disp[i], durMs = DG[d.dg].dur * 1000;
    var allow = now;
    if (capSec != null && refTs != null) {
      allow = refTs + capSec * 1000;                        // 금고 상한 — 오프라인 정산 가능 시간
      var firstEnd = d.startTs + durMs;
      if (firstEnd <= now && firstEnd > allow) allow = firstEnd;   // 첫 귀환은 항상 보장
      if (allow > now) allow = now;
    }
    var runs = Math.floor((allow - d.startTs) / durMs);
    if (runs <= 0) continue;
    if (!d.rep) runs = 1;
    if (runs > 1000) runs = 1000;
    var res = { dg: d.dg, runs: 0, wins: 0, gold: 0, xp: 0, fame: 0, first: false, firstGold: 0, firstFame: 0, lvups: [] };
    for (var r = 0; r < runs; r++) runOnce(d, res);
    if (d.rep) d.startTs = now - ((allow - d.startTs) % durMs);
    else S.disp.splice(i, 1);
    out.push(res);
  }
  if (out.length) fameDirty = true;
  return out;
}

/* ── UI 공통 ── */
function bindList(root, attr, fn) {
  var list = root.querySelectorAll('[' + attr + ']');
  for (var i = 0; i < list.length; i++) {
    (function (btn) {
      btn.onclick = function () { fn(parseInt(btn.getAttribute(attr), 10)); };
    })(list[i]);
  }
}
function hud() {
  $('goldTxt').textContent = T('hudGold', { g: fmt(S.gold) });
  $('fameTxt').textContent = T('hudFame', { f: fmt(S.fame) });
  $('heroTxt').textContent = T('hudHeroes', { n: S.heroes.length, m: maxHeroes() });
}
var activeTab = 'dg';
var TAB_IDS = ['dg', 'hero', 'fac', 'book'];
function showTab(t) {
  activeTab = t;
  var btns = $('tabs').querySelectorAll('button[data-tab]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = btns[i].getAttribute('data-tab') === t ? 'on' : '';

/* ── 던전 탭 ── */
function renderDungeons() {
  var el = $('tab-dg'), now = Date.now(), html = '';
  for (var i = 0; i < DG.length; i++) {
    var g = DG[i], d = dispOf(i);
    html += '<div class="card"><div class="cl">';
    html += '<b>' + g.e + ' ' + TR(g.k) + (d && d.rep ? TR('dgRepeatTag') : '') + '</b>';
    html += '<small>' + T('dgMeta', { t: fmtT(g.dur), r: g.req }) + '</small>';
    html += '<small>' + T('dgReward', { g: fmt(g.gold), x: fmt(g.xp), f: g.fame }) + '</small>';
    if (d) {
      var remain = (d.startTs + g.dur * 1000 - now) / 1000;
      html += '<small class="timer">' + T('dgBusyLine', { t: fmtT(remain), p: partyNames(d.ids) }) + '</small>';
    } else if (!S.first[i]) {
      html += '<small class="firstHint">' + TR('dgFirst') + '</small>';
    }
    html += '</div>';
    if (d) html += '<button class="dangerB" data-recall="' + i + '">' + TR('dgRecall') + '</button>';
    else html += '<button data-open="' + i + '">' + TR('dgGo') + '</button>';
    html += '</div>';
  }
  el.innerHTML = html;
  bindList(el, 'data-open', openDg);
  bindList(el, 'data-recall', recallDg);
}
function recallDg(i) {
  var d = dispOf(i);
  if (!d || !confirm(TR('recallAsk'))) return;
  S.disp.splice(S.disp.indexOf(d), 1);
  renderAll(); persistSoon();
}

/* ── 파견 오버레이 ── */
var ovDg = -1, ovSel = [], ovRep = false;
function openDg(i) {
  if (dispOf(i)) { toast(TR('tBusyDg')); return; }
  ovDg = i; ovSel = []; ovRep = false;
  renderDgOv();
  $('dgOv').hidden = false;
}
function closeOv() { $('dgOv').hidden = true; ovDg = -1; }
function renderDgOv() {
  var g = DG[ovDg], idle = idleHeroes(), html = '';
  html += '<h2>' + T('pickHdr', { d: dgName(ovDg) }) + '</h2>';
  html += '<div style="text-align:center;font-size:11px;color:#8b98b8">' +
          T('dgMeta', { t: fmtT(g.dur), r: g.req }) + '</div>';

    g: fmt(Math.round(g.gold * mult * (1 + 0.1 * mages))),

    f: g.fame,
  });

          TR('repToggle') + '</label>';
  html += '<div class="row">' +
          '<button class="big" id="dgGoBtn"' + (ovSel.length ? '' : ' disabled') + '>' + TR('btnGo') + '</button>' +
          '<button class="ghost" id="dgCloseBtn">' + TR('btnClose') + '</button></div>';
  $('dgOvCard').innerHTML = html;
  bindList($('dgOvCard'), 'data-pick', togglePick);

function togglePick(id) {
  var at = ovSel.indexOf(id);
  if (at >= 0) ovSel.splice(at, 1);
  else if (ovSel.length >= 3) { toast(TR('tPartyMax')); return; }
  else ovSel.push(id);
  renderDgOv();
}
function doDispatch() {
  if (!ovSel.length) { toast(TR('tNeedParty')); return; }
  if (dispOf(ovDg)) { toast(TR('tBusyDg')); return; }
  S.disp.push({ dg: ovDg, ids: ovSel.slice(), startTs: Date.now(), rep: ovRep });
  closeOv();
  renderAll(); persistSoon();
}

/* ── 용사 탭 ── */
function renderHeroes() {
  var el = $('tab-hero'), busy = busySet(), html = '';
  html += '<div class="card"><div class="cl">' +
    '<b class="gold">' + T('btnHire', { g: fmt(hireCost()) }) + '</b>' +
    '<small>' + TR('hireRates') + '</small>' +
    '<small>' + T('hudHeroes', { n: S.heroes.length, m: maxHeroes() }) + '</small></div>' +
    '<button id="hireBtn"' + (S.gold < hireCost() || S.heroes.length >= maxHeroes() ? ' disabled' : '') + '>🎲</button></div>';
  var sorted = S.heroes.slice().sort(function (a, b) { return b.grade - a.grade || b.lv - a.lv; });
  for (var i = 0; i < sorted.length; i++) {
    var h = sorted[i], b = busy[h.id], need = xpNeed(h.lv);
    var pct = Math.min(100, Math.round(h.xp / need * 100));
    html += '<div class="card"><div class="cl">';
    html += '<b>' + CLS[h.cls].e + ' ' + heroName(h) +
      ' <span style="color:' + GRADE[h.grade].c + '">[' + TR('gr' + h.grade) + ']</span></b>';
    html += '<small>' + TR('cls' + h.cls) + ' · Lv.' + h.lv + ' · ' + T('heroPow', { n: power(h) }) +
      ' · ' + (b ? TR('heroBusy') : TR('heroIdle')) + '</small>';
    html += '<small>✨ ' + fmt(h.xp) + '/' + fmt(need) + '</small>';
    html += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    html += '</div>';
    if (!b) html += '<button class="dangerB" data-fire="' + h.id + '">' +
      T('btnFire', { g: GRADE[h.grade].refund }) + '</button>';
    html += '</div>';
  }
  el.innerHTML = html;
  var hb = $('hireBtn');
  if (hb) hb.onclick = hire;
  bindList(el, 'data-fire', fireHero);
}
function hire() {
  if (S.heroes.length >= maxHeroes()) { toast(TR('hireFull')); return; }
  var c = hireCost();
  if (S.gold < c) { toast(TR('tNoGold')); return; }
  S.gold -= c; S.hires++;
  var roll = Math.random() * 100, acc = 0, gr = 0;
  for (var i = 0; i < GACHA.length; i++) { acc += GACHA[i]; if (roll < acc) { gr = i; break; } }
  var cls = ri(4);
  var h = { id: S.seq++, n: [ri(NAME_A.ko.length), ri(NAME_B.ko.length)], cls: cls, grade: gr, lv: 1, xp: 0 };
  S.heroes.push(h);
  var bk = cls + '_' + gr, isNew = !S.book[bk];
  S.book[bk] = 1;
  toast(T('hireGet', { g: TR('gr' + gr), c: TR('cls' + cls), n: heroName(h) }) + (isNew ? TR('hireNewBook') : ''));
  renderAll(); persistSoon();
}
function fireHero(id) {
  var h = heroById(id);
  if (!h || busySet()[id]) return;
  var refund = GRADE[h.grade].refund;
  if (!confirm(T('fireAsk', { n: heroName(h), g: refund }))) return;
  S.gold += refund;
  S.heroes.splice(S.heroes.indexOf(h), 1);
  renderAll(); persistSoon();
}

/* ── 시설 탭 ── */
var FAC = [
  { key: 'train', name: 'facTrain', max: 10,
    cost: function (l) { return Math.round(250 * Math.pow(2, l)); },
    desc: function (l, atMax) {
      return atMax ? T('facTrainCur', { m: (1 + 0.25 * l).toFixed(2) })
                   : T('facTrainDesc', { m: (1 + 0.25 * l).toFixed(2), n: (1 + 0.25 * (l + 1)).toFixed(2) });
    } },
  { key: 'vault', name: 'facVault', max: 5,
    cost: function (l) { return Math.round(400 * Math.pow(2.4, l)); },
    desc: function (l, atMax) {
      return atMax ? T('facVaultCur', { h: 2 + 2 * l })
                   : T('facVaultDesc', { h: 2 + 2 * l, n: 2 + 2 * (l + 1) });
    } },
  { key: 'house', name: 'facHouse', max: 4,
    cost: function (l) { return Math.round(600 * Math.pow(2.8, l)); },
    desc: function (l, atMax) {
      return atMax ? T('facHouseCur', { h: 8 + l })
                   : T('facHouseDesc', { h: 8 + l, n: 8 + l + 1 });
    } },
];
function renderFacilities() {
  var el = $('tab-fac'), html = '';
  for (var i = 0; i < FAC.length; i++) {
    var f = FAC[i], lv = S.fac[f.key], atMax = lv >= f.max;
    html += '<div class="card"><div class="cl">';
    html += '<b>' + TR(f.name) + ' ' + T('facLv', { n: lv }) + '</b>';
    html += '<small>' + f.desc(lv, atMax) + '</small>';
    html += '</div>';
    if (atMax) html += '<button disabled>' + TR('facMax') + '</button>';
    else html += '<button data-up="' + i + '"' + (S.gold < f.cost(lv) ? ' disabled' : '') + '>' +
      T('btnUp', { g: fmt(f.cost(lv)) }) + '</button>';
    html += '</div>';
  }
  el.innerHTML = html;
  bindList(el, 'data-up', upgradeFac);
}
function upgradeFac(i) {
  var f = FAC[i], lv = S.fac[f.key];
  if (lv >= f.max) return;
  var c = f.cost(lv);
  if (S.gold < c) { toast(TR('tNoGold')); return; }
  S.gold -= c; S.fac[f.key]++;
  renderAll(); persistSoon();
}

/* ── 도감 탭 ── */
function renderBook() {
  var el = $('tab-book'), html = '';
  html += '<div class="card"><div class="cl">' +
    '<b>' + T('bookHdr', { c: bookCount() }) + '</b>' +
    '<small>' + T('bookBonus', { n: bookCount() }) + '</small></div></div>';
  html += '<div id="bookGrid">';
  html += '<div class="bkCell bkHead"></div>';
  for (var c = 0; c < 4; c++) html += '<div class="bkCell bkHead">' + CLS[c].e + ' ' + TR('cls' + c) + '</div>';
  for (var g = 0; g < 5; g++) {
    html += '<div class="bkCell bkHead" style="color:' + GRADE[g].c + '">' + TR('gr' + g) + '</div>';
    for (var c2 = 0; c2 < 4; c2++) {
      var got = S.book[c2 + '_' + g];
      html += got ? '<div class="bkCell got" style="border-color:' + GRADE[g].c + '">' + CLS[c2].e + '</div>'
                  : '<div class="bkCell">?</div>';
    }
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ── 요약 패널 ── */
function renderSummary() {
  $('sumBody').innerHTML =
    T('sumFame', { n: fmt(S.fame) }) + '<br>' +
    T('sumClear', { n: fmt(S.clears), s: fmt(S.wins), f: fmt(S.fails) }) + '<br>' +
    T('sumBook', { n: bookCount(), b: bookCount() }) + '<br>' +
    T('sumLegend', { n: legendCount() }) + '<br>' +
    T('sumGold', { g: fmt(S.gold), h: S.heroes.length });
}

/* ── 오프라인 정산 팝업 ── */
function showOffModal(results, awaySec) {
  var html = '<div class="away">' +
    T('offAway', { m: Math.round(awaySec / 60), h: vaultH(), v: S.fac.vault }) + '</div>';
  var lvups = [];
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    html += '<div>' + T('offLine', {
      d: dgName(r.dg), n: r.runs, s: r.wins, g: fmt(r.gold), x: fmt(r.xp), f: r.fame,
    }) + (r.first ? ' 🎁' : '') + '</div>';
    lvups = lvups.concat(r.lvups);
  }
  if (lvups.length) {
    html += '<div class="lvups">⬆ ' + lvups.slice(0, 6).join(', ') + (lvups.length > 6 ? ' …' : '') + '</div>';
  }
  $('offBody').innerHTML = html;
  $('offOv').hidden = false;
}

/* ── 화면 전환 ── */
$('startBtn').onclick = function () {
  $('menu').hidden = true; $('summary').hidden = true; $('game').hidden = false;
  renderAll();
};
$('sumBtn').onclick = function () {
  renderSummary(); submitRank();
  $('game').hidden = true; $('summary').hidden = false;
};
$('contBtn').onclick = function () {
  $('summary').hidden = true; $('game').hidden = false;
  renderAll();
};
$('backBtn').onclick = function () {
  $('summary').hidden = true; $('game').hidden = true; $('menu').hidden = false;
};
$('offOk').onclick = function () {
  $('offOv').hidden = true;
  submitRank();
  renderAll();
};
(function () {
  var btns = $('tabs').querySelectorAll('button[data-tab]');
  for (var i = 0; i < btns.length; i++) {
    (function (b) { b.onclick = function () { showTab(b.getAttribute('data-tab')); }; })(btns[i]);
  }
})();

/* ── 틱 — 온라인 귀환 정산 + 타이머 갱신 ── */
setInterval(function () {
  if (!S) return;
  var results = settleAll(null, null);
  if (results.length) {
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      if (r.first) toast(T('tFirst', { d: dgName(r.dg), g: fmt(r.firstGold), f: r.firstFame }));
      else if (r.wins > 0) toast(T('tSettleWin', { d: dgName(r.dg), g: fmt(r.gold), f: r.fame }));
      else toast(T('tSettleFail', { d: dgName(r.dg), g: fmt(r.gold) }));
    }
    renderAll(); persistSoon();
  } else if (!$('game').hidden && activeTab === 'dg' && $('dgOv').hidden) {
    renderDungeons();                                       // 카드 타이머 초 단위 갱신
  }
  if (S) hud();
}, 1000);
setInterval(function () { if (S) persist(); }, 30000);      // 30초마다 자동 저장
addEventListener('beforeunload', function () {
  if (S) { S.lastTs = Date.now(); localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); }
});

/* ── 시작 — 오프라인 파견 정산 포함 ── */
$('codeLoadBtn').onclick = function () {
  var raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  loadSave(raw).then(function (d) {
    if (d) { saveCode = raw; localStorage.setItem(CODE_KEY, raw); boot(d); }
  });
};
function boot(saved) {
  S = (saved && saved.v === 1) ? saved : fresh();
  if (saved && saved.lastTs) {
    var awaySec = (Date.now() - saved.lastTs) / 1000;
    var results = settleAll(vaultH() * 3600, saved.lastTs);
    if (results.length && awaySec > 60) showOffModal(results, awaySec);
    if (results.length) { fameDirty = true; persistSoon(); }
  }
  hud(); renderAll();
}
loadSave().then(boot);
</script>
<script src="../lib/rank.js"></script>
<script>
'use strict';
GameRank.copyButton(function () { return typeof saveCode !== 'undefined' ? saveCode : null; });
GameRank.autoPanel('hero-dispatch');
</script>
</body>
</html>
