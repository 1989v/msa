<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">숫자 정원</title>
<script src="../lib/i18n.js"></script>
<script src="../lib/daily.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#e6ecf2; font-family:'Courier New',monospace; display:flex;
         flex-direction:column; align-items:center; min-height:100vh; user-select:none; padding:14px 8px 30px;
         touch-action:manipulation; }
  h1.top { font-size:19px; color:#0ea5e9; margin:6px 0 2px; text-shadow:1px 1px 0 #000; }
  .sub { font-size:11px; color:#8e9db0; margin-bottom:10px; }
  #board { display:grid; grid-template-columns:repeat(9, var(--cs)); border:3px solid #2c3550;
           border-radius:6px; overflow:hidden; background:#2c3550; gap:1px; }
  .cell { width:var(--cs); height:var(--cs); background:#1a2238; display:flex; align-items:center;
          justify-content:center; font-size:calc(var(--cs) * .52); cursor:pointer; position:relative; }
  .cell.given { color:#e6ecf2; font-weight:bold; }
  .cell.user { color:#38bdf8; }
  .cell.wrong { color:#ef4444; }
  .cell.sel { background:#2c3550; outline:2px solid #0ea5e9; outline-offset:-2px; }
  .cell.same { background:#222b44; }
  .cell.bR { border-right:2px solid #3a4763; }
  .cell.bB { border-bottom:2px solid #3a4763; }
  .notes { position:absolute; inset:1px; display:grid; grid-template-columns:1fr 1fr 1fr;
           font-size:calc(var(--cs) * .2); color:#8e9db0; line-height:1; }
  .notes span { display:flex; align-items:center; justify-content:center; }
  #pad { display:flex; gap:5px; margin:13px 0 4px; flex-wrap:wrap; justify-content:center; max-width:460px; }
  #pad button { width:42px; height:46px; background:#1a2238; border:2px solid #2c3550; color:#e6ecf2;
                border-radius:8px; font-family:inherit; font-size:17px; font-weight:bold; cursor:pointer; }
  #pad button.wide { width:auto; padding:0 13px; font-size:13px; }
  #pad button.on { border-color:#0ea5e9; background:#2c3550; }
  #pad button:disabled { opacity:.3; }
  #meta { display:flex; gap:14px; font-size:12px; color:#c2cedc; margin-top:4px; }
  .panel { position:fixed; inset:0; background:rgba(9,13,24,.97); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:13px; text-align:center; z-index:10; padding:20px; overflow:auto; }
  .panel h1 { color:#0ea5e9; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#c2cedc; line-height:1.8; max-width:480px; }
  .panel p.small { font-size:11px; color:#8e9db0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .stat { background:#1a2238; border-radius:8px; padding:8px 14px; font-size:12px; }
  .stat b { color:#0ea5e9; font-size:17px; display:block; }
  button.act { background:#0ea5e9; color:#04121c; border:0; padding:11px 18px; font-weight:bold;
               font-size:13px; border-radius:8px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#222b44; color:#e6ecf2; }
</style>
<link rel="stylesheet" href="../lib/menu.css">
</head>
<body>
<h1 class="top" data-i18n="title">🌱 숫자 정원</h1>
<div class="sub"><span id="dayTag"></span> · <span id="timerTxt">0:00</span> · ❌ <span id="missTxt">0</span></div>

<div id="board"></div>
<div id="pad">
  <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
  <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
  <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
  <button class="wide" id="noteBtn">✏ <span data-i18n="note">메모</span></button>
  <button class="wide" id="eraseBtn">⌫</button>
</div>

<div class="panel" id="menu">
  <h1 data-i18n="menuTitle">🌱 숫자 정원</h1>
  <p data-i18n="menuDesc">아홉 개의 화단에 1~9를 심는다. 가로줄·세로줄·3×3 화단 어디에도
    같은 숫자가 겹치면 안 된다. 오늘의 정원은 답이 하나뿐이다.</p>
  <p class="small" id="menuStreak"></p>
  <button class="act" id="startBtn" data-i18n="startBtn">▶ 오늘의 정원</button>
</div>

<div class="panel" id="endPanel" hidden>
  <h1 data-i18n="win">🎉 만개!</h1>
  <div class="row">
    <div class="stat"><b id="endStreak">0</b><span data-i18n="streakLabel">연속 출석</span></div>
    <div class="stat"><b id="endTime">0:00</b><span data-i18n="timeLabel">클리어 시간</span></div>
    <div class="stat"><b id="endMiss">0</b><span data-i18n="missLabel">실수</span></div>
  </div>
  <p class="small"><span data-i18n="next">다음 정원까지</span> <b id="cdown"></b></p>
  <div class="row">
    <button class="act" id="shareBtn" data-i18n="shareBtn">📤 결과 공유</button>
    <button class="act ghost" id="backBtn" data-i18n="backBtn">처음으로</button>
  </div>
</div>

<script>
'use strict';
GameI18n.init({
  ko: {
    title: '🌱 숫자 정원', menuTitle: '🌱 숫자 정원',
    menuDesc: '아홉 개의 화단에 1~9를 심는다. 가로줄·세로줄·3×3 화단 어디에도 같은 숫자가 겹치면 안 된다. 오늘의 정원은 답이 하나뿐이다.',
    startBtn: '▶ 오늘의 정원', note: '메모', win: '🎉 만개!',
    streakLabel: '연속 출석', timeLabel: '클리어 시간', missLabel: '실수',
    next: '다음 정원까지', shareBtn: '📤 결과 공유', backBtn: '처음으로',
  },
  en: {
    title: '🌱 Number Garden', menuTitle: '🌱 Number Garden',
    menuDesc: 'Plant 1-9 across nine beds. No digit may repeat in any row, column or 3×3 bed. Today\'s garden has exactly one solution.',
    startBtn: '▶ Daily Garden', note: 'Note', win: '🎉 Full bloom!',
    streakLabel: 'Day streak', timeLabel: 'Clear time', missLabel: 'Mistakes',
    next: 'Next garden in', shareBtn: '📤 Share', backBtn: 'Menu',
  },
});
var TR = GameI18n.t;

var SLUG = 'number-garden', EPOCH = '2026-08-07', TARGET_CLUES = 34;

var solution, given, state, notes, sel = -1, noteMode = false, misses, startTs, timerIv, over;

function rowOf(i) { return Math.floor(i / 9); }
function colOf(i) { return i % 9; }
function boxOf(i) { return Math.floor(rowOf(i) / 3) * 3 + Math.floor(colOf(i) / 3); }

function candidates(bd, i) {
  var used = {};
  var r = rowOf(i), c = colOf(i), br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
  for (var k = 0; k < 9; k++) {
    used[bd[r * 9 + k]] = true;
    used[bd[k * 9 + c]] = true;
    used[bd[(br + Math.floor(k / 3)) * 9 + bc + (k % 3)]] = true;
  }
  var out = [];
  for (var n = 1; n <= 9; n++) if (!used[n]) out.push(n);
  return out;
}

function genFull(rand) {
  var bd = new Array(81).fill(0);
  function fill(i) {
    if (i === 81) return true;
    var cands = GameDaily.shuffle(candidates(bd, i), rand);
    for (var k = 0; k < cands.length; k++) {
      bd[i] = cands[k];
      if (fill(i + 1)) return true;
    }
    bd[i] = 0;
    return false;
  }
  fill(0);
  return bd;
}

/** 해 개수 (cap 2) — 후보 최소 칸 우선 백트래킹 */
function countSol(bd) {
  var count = 0;
  function walk() {
    if (count >= 2) return;
    var best = -1, bestCands = null;
    for (var i = 0; i < 81; i++) {
      if (bd[i]) continue;
      var c = candidates(bd, i);
      if (!c.length) return;
      if (!bestCands || c.length < bestCands.length) { best = i; bestCands = c; }
      if (bestCands.length === 1) break;
    }
    if (best < 0) { count++; return; }
    for (var k = 0; k < bestCands.length; k++) {
      bd[best] = bestCands[k];
      walk();
      if (count >= 2) break;
    }
    bd[best] = 0;
  }
  walk();
  return count;
}

function generate() {
  var rand = GameDaily.rng(GameDaily.seed(SLUG));
  solution = genFull(rand);
  var puzzle = solution.slice();
  var order = GameDaily.shuffle(Array.from({ length: 81 }, function (_, i) { return i; }), rand);
  var clues = 81;
  for (var k = 0; k < order.length && clues > TARGET_CLUES; k++) {
    var i = order[k];
    if (!puzzle[i]) continue;
    var keep = puzzle[i];
    puzzle[i] = 0;
    if (countSol(puzzle.slice()) !== 1) puzzle[i] = keep;
    else clues--;
  }
  return puzzle;
}

function begin() {
  var puzzle = generate();
  given = puzzle.map(function (v) { return v !== 0; });
  state = puzzle.slice();
  notes = Array.from({ length: 81 }, function () { return {}; });
  sel = -1; noteMode = false; misses = 0; over = false;
  startTs = Date.now();
  clearInterval(timerIv);
  timerIv = setInterval(function () {
    document.getElementById('timerTxt').textContent =
      GameDaily.fmtTime(Math.floor((Date.now() - startTs) / 1000));
  }, 500);
  document.getElementById('missTxt').textContent = '0';
  document.getElementById('noteBtn').className = 'wide';
  document.getElementById('menu').hidden = true;
  document.getElementById('endPanel').hidden = true;
  sizeCells();
  render();
}

function sizeCells() {
  var avail = Math.min(430, window.innerWidth - 18);
  document.body.style.setProperty('--cs', Math.floor((avail - 12) / 9) + 'px');
}

function render() {
  var b = document.getElementById('board');
  b.innerHTML = '';
  var selVal = sel >= 0 ? state[sel] : 0;
  for (var i = 0; i < 81; i++) {
    var d = document.createElement('div');
    var cls = 'cell';
    if (given[i]) cls += ' given';
    else if (state[i]) cls += state[i] === solution[i] ? ' user' : ' wrong';
    if (i === sel) cls += ' sel';
    else if (selVal && state[i] === selVal) cls += ' same';
    if (colOf(i) === 2 || colOf(i) === 5) cls += ' bR';
    if (rowOf(i) === 2 || rowOf(i) === 5) cls += ' bB';
    d.className = cls;
    if (state[i]) d.textContent = state[i];
    else {
      var ns = Object.keys(notes[i]);
      if (ns.length) {
        var nd = document.createElement('div');
        nd.className = 'notes';
        for (var n = 1; n <= 9; n++) nd.innerHTML += '<span>' + (notes[i][n] ? n : '') + '</span>';
        d.appendChild(nd);
      }
    }
    (function (idx) {
      d.onclick = function () { if (!over) { sel = idx; render(); } };
    })(i);
    b.appendChild(d);
  }
}

function input(n) {
  if (over || sel < 0 || given[sel]) return;
  if (noteMode) {
    if (state[sel]) return;
    notes[sel][n] = !notes[sel][n];
    if (!notes[sel][n]) delete notes[sel][n];
  } else {
    if (state[sel] === n) { state[sel] = 0; render(); return; }
    state[sel] = n;
    if (n !== solution[sel]) {
      misses++;
      document.getElementById('missTxt').textContent = misses;
    } else {
      notes[sel] = {};
      // 같은 행/열/박스 메모에서 확정 숫자 지우기
      for (var i = 0; i < 81; i++) {
        if (rowOf(i) === rowOf(sel) || colOf(i) === colOf(sel) || boxOf(i) === boxOf(sel)) {
          delete notes[i][n];
        }
      }
    }
  }
  render();
  if (state.every(function (v, i) { return v === solution[i]; })) finish();
}

function finish() {
  over = true;
  clearInterval(timerIv);
  var sec = Math.floor((Date.now() - startTs) / 1000);
  document.getElementById('endTime').textContent = GameDaily.fmtTime(sec);
  document.getElementById('endMiss').textContent = misses;
  var st = GameDaily.recordClear(SLUG);
  document.getElementById('endStreak').textContent = st.streak;
  if (!GameDaily.result(SLUG)) {
    GameDaily.saveResult(SLUG, { sec: sec, miss: misses });
    var score = Math.max(100, 10000 - sec * 3 - misses * 500);
    GameRank.submit(SLUG, score,
      '#' + GameDaily.dayNumber(EPOCH) + ' ❌' + misses + ' ' + GameDaily.fmtTime(sec));
  }
  document.getElementById('endPanel').hidden = false;
}

Array.prototype.forEach.call(document.querySelectorAll('#pad button[data-n]'), function (b) {
  b.onclick = function () { input(+b.dataset.n); };
});
document.getElementById('noteBtn').onclick = function () {
  noteMode = !noteMode;
  this.className = 'wide' + (noteMode ? ' on' : '');
};
document.getElementById('eraseBtn').onclick = function () {
  if (over || sel < 0 || given[sel]) return;
  state[sel] = 0; notes[sel] = {};
  render();
};
window.addEventListener('keydown', function (e) {
  if (e.key >= '1' && e.key <= '9') input(+e.key);
  else if (e.key === 'Backspace' || e.key === 'Delete') document.getElementById('eraseBtn').onclick();
  else if (e.key === 'n' || e.key === 'N') document.getElementById('noteBtn').onclick.call(document.getElementById('noteBtn'));
  else if (sel >= 0 && e.key.indexOf('Arrow') === 0) {
    var r = rowOf(sel), c = colOf(sel);
    if (e.key === 'ArrowUp') r = Math.max(0, r - 1);
    if (e.key === 'ArrowDown') r = Math.min(8, r + 1);
    if (e.key === 'ArrowLeft') c = Math.max(0, c - 1);
    if (e.key === 'ArrowRight') c = Math.min(8, c + 1);
    sel = r * 9 + c;
    render();
    e.preventDefault();
  }
});

document.getElementById('startBtn').onclick = function () {
  var prev = GameDaily.result(SLUG);
  begin();
  if (prev) {
    over = true;
    clearInterval(timerIv);
    state = solution.slice();
    render();
    document.getElementById('endTime').textContent = GameDaily.fmtTime(prev.sec || 0);
    document.getElementById('endMiss').textContent = prev.miss || 0;
    document.getElementById('endStreak').textContent = GameDaily.streak(SLUG).streak;
    document.getElementById('endPanel').hidden = false;
  }
};
document.getElementById('backBtn').onclick = function () {
  document.getElementById('endPanel').hidden = true;
  document.getElementById('menu').hidden = false;
  refreshMenu();
};
document.getElementById('shareBtn').onclick = function () {
  var r = GameDaily.result(SLUG) || { sec: 0, miss: 0 };
  GameDaily.share(TR('title') + ' #' + GameDaily.dayNumber(EPOCH) +
    ' 🌱 ' + GameDaily.fmtTime(r.sec) + ' ❌' + r.miss +
    '\nhttps://game.1989v.com/games/number-garden/', this);
};

function refreshMenu() {
  var st = GameDaily.streak(SLUG);
  document.getElementById('menuStreak').textContent =
    '#' + GameDaily.dayNumber(EPOCH) + ' · 🔥 ' + st.streak + ' (best ' + st.best + ')';
}
document.getElementById('dayTag').textContent = '#' + GameDaily.dayNumber(EPOCH);
refreshMenu();
GameDaily.countdown(document.getElementById('cdown'));
window.addEventListener('resize', function () { if (state) { sizeCells(); render(); } });
</script>
<script src="../lib/rank.js"></script>
<script>GameRank.autoPanel('number-garden');</script>
</body>
</html>
