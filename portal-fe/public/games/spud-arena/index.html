<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감자 투기장</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dce4f5; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:10px; overflow:hidden; box-shadow:0 0 52px rgba(14,80,140,.35); }
  canvas { display:block; background:#0c1424; max-width:100%; touch-action:none; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:13px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; align-items:center; }
  #hud .tag { background:rgba(10,15,30,.66); padding:3px 11px; border-radius:10px; white-space:nowrap; }
  #hud .grow { flex:1; }
  #hpBar { display:inline-block; width:86px; height:9px; background:#3a1520; border-radius:5px; vertical-align:middle; overflow:hidden; }
  #hpBar i { display:block; height:100%; background:#22c55e; border-radius:5px; }
  #banner { position:absolute; top:36%; left:0; right:0; text-align:center; font-size:30px; font-weight:bold;
            color:#eab308; text-shadow:0 0 18px rgba(234,179,8,.7), 3px 3px 0 #000; pointer-events:none;
            opacity:0; transition:opacity .25s; letter-spacing:2px; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(10,15,28,.95); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:10px; text-align:center; z-index:10; padding:18px; }
  .panel h1 { color:#eab308; font-size:24px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12px; color:#b6c2dc; line-height:1.7; max-width:560px; }
  .panel button { background:#0ea5e9; color:#06101f; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1a2238; color:#dce4f5; }
  .panel button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .char { background:#1a2238; border:2px solid #2a3a5c; border-radius:10px; padding:10px 12px; width:152px; cursor:pointer; }
  .char.sel { border-color:#0ea5e9; box-shadow:0 0 12px rgba(14,165,233,.45); }
  .char .ico { font-size:30px; }
  .char .nm { font-weight:bold; font-size:13px; color:#e2ecff; margin:4px 0; }
  .char .ds { font-size:10.5px; color:#93a4c8; line-height:1.5; }
  #menu { justify-content:flex-start; overflow-y:auto; padding-top:22px; }
  #shop { justify-content:flex-start; overflow-y:auto; gap:8px; padding:14px 16px; }
  #shop h1 { font-size:18px; }
  #shopMats { font-size:14px; font-weight:bold; color:#eab308; }
  #shopOffers { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .offer { background:#1a2238; border:1.5px solid #2a3a5c; border-radius:9px; padding:8px 10px; width:176px;
           text-align:left; font-size:11px; position:relative; display:flex; flex-direction:column; gap:4px; }
  .offer.sold { opacity:.35; }
  .offer.locked { border-color:#eab308; }
  .offer .t { font-weight:bold; font-size:12.5px; }
  .offer .d { color:#93a4c8; line-height:1.45; flex:1; min-height:26px; }
  .offer .m { color:#22c55e; font-size:10.5px; }
  .offer button.buyBtn { padding:5px 10px; font-size:11px; border-radius:6px; width:100%; }
  .lockBtn { position:absolute; top:4px; right:5px; background:none !important; border:0; font-size:13px;
             cursor:pointer; padding:2px !important; }
  #shopFoot { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #shopStats { font-size:10.5px; color:#93a4c8; line-height:1.7; max-width:640px; text-align:center; }
  #shopStats b { color:#dce4f5; }
  #info { margin-top:9px; font-size:11px; color:#5a688a; text-align:center; line-height:1.7; }
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width:100vw; max-width:100vw; border-width:0; border-radius:0; }
    canvas { width:100%; height:auto; }
    #info { display:none; }
    .panel button { padding:10px 16px; font-size:13px; }
    .char { width:130px; padding:8px; }
    .offer { width:158px; }
  }
</style>
<link rel="stylesheet" href="../lib/menu.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="900" height="540"></canvas>
  <div id="hud" hidden>

    <span class="tag" id="waveTxt"></span>

    <div class="row" id="charRow"></div>
    <button id="startBtn" data-i18n="startBtn">▶ 투기장 입장</button>
  </div>
  <div class="panel" id="shop" hidden>
    <h1 id="shopTitle"></h1>
    <div id="shopMats"></div>
    <div id="shopOffers"></div>
    <div id="shopFoot">
      <button id="rerollBtn" class="ghost"></button>
      <button id="nextBtn"></button>
    </div>
    <div id="shopStats"></div>
  </div>
  <div class="panel" id="endPanel" hidden>

    <div class="row">

    base: { maxHp: ch.hp, regen: 0, speed: ch.spd, dmg: ch.dmg, atkSpd: 0, range: 0, armor: 0, luck: 0 },
    bonus: { maxHp: 0, regen: 0, speed: 0, dmg: 0, atkSpd: 0, range: 0, armor: 0, luck: 0 },
    weapons: [{ id: ch.weapon, tier: 1, cd: 0.4 }],
    mats: 0, kills: 0, wave: 0, waveT: 0, regenAcc: 0,
    E: [], EB: [], PJ: [], Z: [], M: [], SQ: [],
    parts: [], rings: [], floats: [], slashes: [],
    boss: null, spawnT: 1, eliteT: -1, bossT: -1,
    offers: [], rerolls: 0,
    over: false, dying: 0, won: false,
  };
}

function waveDur(n) { return n >= 12 ? 60 : Math.min(60, 20 + (n - 1) * 3); }

function startWave(n) {
  G.wave = n; G.waveT = waveDur(n);
  G.hp = stat('maxHp');
  G.E.length = 0; G.EB.length = 0; G.PJ.length = 0; G.Z.length = 0; G.M.length = 0; G.SQ.length = 0;
  G.boss = null; G.spawnT = 1.2;
  G.eliteT = (n === 4 || n === 7 || n === 10) ? 5 : -1;
  G.bossT = n >= 12 ? 1.2 : -1;
  G.px = VW / 2; G.py = VH / 2; G.inv = 1;
  state = 'combat';
  $('shop').hidden = true; $('hud').hidden = false;
  banner(n >= 12 ? TR('bossWave') : tf('waveStart', { n: n }));
}

/* ═══════════ 스폰 ═══════════ */
function spawnPos() {
  var x = MINX + 30, y = MINY + 30, k;
  for (k = 0; k < 14; k++) {
    x = MINX + 20 + rnd() * (MAXX - MINX - 40);
    y = MINY + 20 + rnd() * (MAXY - MINY - 40);
    if (d2(x, y, G.px, G.py) > 150 * 150) break;
  }
  return { x: x, y: y };
}
function pickKind() {
  var w = G.wave, r = rnd() * 100;
  if (w >= 4 && r < 14) return 'shroom';
  if (w >= 3 && r < 38) return 'slime';
  if (w >= 2 && r < 62) return 'seed';
  return 'bug';
}
function queueSpawn(kind) {
  var p = spawnPos();
  G.SQ.push({ x: p.x, y: p.y, k: kind, t: 0.8 });
}
function makeEnemy(q) {
  var w = G.wave, hs = 1 + (w - 1) * 0.38, e;
  if (q.k === 'bug')         e = { k: 'bug',    hp: 18 * hs,  spd: 80 + w * 4, dmg: 8 + w,      r: 10, worth: 1 };
  else if (q.k === 'seed')   e = { k: 'seed',   hp: 14 * hs,  spd: 55,  dmg: 6 + w,      r: 9,  fireT: 1.4 + rnd(), worth: 1 };
  else if (q.k === 'slime')  e = { k: 'slime',  hp: 32 * hs,  spd: 56,  dmg: 9 + w,      r: 14, gen: 1, worth: 1 };
  else if (q.k === 'mini')   e = { k: 'slime',  hp: 10 * hs,  spd: 92,  dmg: 6 + w,      r: 8,  gen: 2, worth: 1 };
  else if (q.k === 'shroom') e = { k: 'shroom', hp: 12 * hs,  spd: 112, dmg: 14 + w * 2, r: 9,  fuse: -1, worth: 1 };
  else if (q.k === 'elite')  e = { k: 'elite',  hp: 250 * hs, spd: 66,  dmg: 14 + w,     r: 20, fireT: 3, worth: 8 };
  else e = makeBoss();
  e.x = q.x; e.y = q.y; e.mhp = e.hp; e.hitCd = 0; e.flash = 0; e.wob = rnd() * 6.28;
  G.E.push(e);
  if (e.k === 'boss') G.boss = e;
}
function makeBoss() {
  return { k: 'boss', hp: 4500, spd: 52, dmg: 24, r: 30, worth: 0,
           fanT: 2.5, ringT: 5, dashT: 7.5, dashW: 0, dashD: 0, dvx: 0, dvy: 0 };
}
function spawner(dt) {
  var w = G.wave;
  G.spawnT -= dt;
  var iv = Math.max(0.35, 1.55 - w * 0.09) * (w >= 12 ? 2.2 : 1);
  if (G.spawnT <= 0 && G.E.length + G.SQ.length < (w >= 12 ? 14 : 26)) {
    queueSpawn(pickKind()); G.spawnT = iv * (0.7 + rnd() * 0.6);
  }
  if (G.eliteT > 0) { G.eliteT -= dt; if (G.eliteT <= 0) { queueSpawn('elite'); G.eliteT = -1; } }
  if (G.bossT > 0) {
    G.bossT -= dt;
    if (G.bossT <= 0) { var p = spawnPos(); G.SQ.push({ x: p.x, y: p.y, k: 'boss', t: 1 }); G.bossT = -1; }
  }
}

/* ═══════════ 피해 / 처치 ═══════════ */
function hurt(dmg) {
  if (G.inv > 0 || G.over) return;
  var real = Math.max(1, Math.round(dmg * armorMul()));
  G.hp -= real; G.inv = 0.5; shake = Math.max(shake, 6);
  addFloat(G.px, G.py - 18, '-' + real, '#ef4444');
  burst(G.px, G.py, '#ef4444', 8, 120);
  if (G.hp <= 0) die();
}
function die() {
  G.over = true; G.dying = 1; shake = 14;
  burst(G.px, G.py, '#d7a35f', 40, 240);
  burst(G.px, G.py, '#ffffff', 14, 150);
  G.rings.push({ x: G.px, y: G.py, r: 10, max: 160, life: 1, c: '215,163,95' });
}
function dmgE(e, amount) {
  if (e.hp <= 0) return;
  e.hp -= amount; e.flash = 0.12;
  if (G.floats.length < 28) addFloat(e.x + (rnd() - 0.5) * 10, e.y - e.r - 4, Math.round(amount), '#ffe9b0');
  if (e.hp <= 0) killE(e);
}
function killE(e) {
  var i = G.E.indexOf(e);
  if (i >= 0) G.E.splice(i, 1);
  G.kills++;
  burst(e.x, e.y, e.k === 'boss' ? '#eab308' : '#9aa9c9', e.k === 'boss' ? 60 : 10, e.k === 'boss' ? 260 : 110);
  if (e.k === 'slime' && e.gen === 1) {
    G.SQ.push({ x: clamp(e.x - 14, MINX, MAXX), y: e.y, k: 'mini', t: 0.2 });
    G.SQ.push({ x: clamp(e.x + 14, MINX, MAXX), y: e.y, k: 'mini', t: 0.2 });
  }
  if (e.k === 'boss') { winGame(); return; }
  var n = e.worth, j;
  if (rnd() * 100 < stat('luck')) n++;
  for (j = 0; j < n; j++) {
    G.M.push({ x: e.x + (rnd() - 0.5) * 18, y: e.y + (rnd() - 0.5) * 18,
               vx: (rnd() - 0.5) * 70, vy: (rnd() - 0.5) * 70 });
  }
}
function shroomBoom(e) {
  var i = G.E.indexOf(e);
  if (i >= 0) G.E.splice(i, 1);
  G.rings.push({ x: e.x, y: e.y, r: 8, max: 72, life: 1, c: '255,90,70' });
  burst(e.x, e.y, '#ef4444', 18, 180);
  shake = Math.max(shake, 7);
  if (!G.over && d2(e.x, e.y, G.px, G.py) < 72 * 72) hurt(e.dmg);
}

/* ═══════════ 무기 — 자동 조준 발사 ═══════════ */
function nearestE(rng) {
  var bd = rng > 0 ? rng * rng : 1e9, bi = null, i, e, dd;
  for (i = 0; i < G.E.length; i++) {
    e = G.E[i];
    dd = d2(e.x, e.y, G.px, G.py);
    if (dd < bd) { bd = dd; bi = e; }
  }
  return bi;
}
function fireWeapons(dt) {
  var i, w, W, rng, t, dmg, a, dist;
  for (i = 0; i < G.weapons.length; i++) {
    w = G.weapons[i]; W = WEAPONS[w.id];
    w.cd -= dt;
    if (w.cd > 0) continue;
    rng = W.range * TIER_RANGE[w.tier - 1] * (1 + stat('range') / 100);
    t = nearestE(rng + (W.kind === 'melee' ? 18 : 0));
    if (!t) { w.cd = 0.1; continue; }
    dmg = W.dmg * TIER_DMG[w.tier - 1] * (1 + stat('dmg') / 100);
    a = Math.atan2(t.y - G.py, t.x - G.px);
    G.aim = a;
    if (W.kind === 'melee') {
      G.slashes.push({ a: a, r: rng, life: 0.16 });
      var j, e2, dd, da;
      for (j = G.E.length - 1; j >= 0; j--) {
        e2 = G.E[j];
        dd = Math.sqrt(d2(e2.x, e2.y, G.px, G.py));
        if (dd < rng + e2.r) {
          da = Math.atan2(e2.y - G.py, e2.x - G.px) - a;
          while (da > Math.PI) da -= 6.2832;
          while (da < -Math.PI) da += 6.2832;
          if (Math.abs(da) < 1.05) dmgE(e2, dmg);
        }
      }
    } else if (W.kind === 'shot') {
      G.PJ.push({ k: 'shot', x: G.px, y: G.py, vx: Math.cos(a) * W.ps, vy: Math.sin(a) * W.ps,
                  dmg: dmg, life: rng / W.ps });
    } else if (W.kind === 'bomb') {
      dist = Math.sqrt(d2(t.x, t.y, G.px, G.py));
      G.PJ.push({ k: 'bomb', x: G.px, y: G.py, vx: Math.cos(a) * W.ps, vy: Math.sin(a) * W.ps,
                  dmg: dmg, life: dist / W.ps, aoe: W.aoe * TIER_RANGE[w.tier - 1] });
    } else if (W.kind === 'pierce') {
      G.PJ.push({ k: 'pierce', x: G.px, y: G.py, vx: Math.cos(a) * W.ps, vy: Math.sin(a) * W.ps,
                  dmg: dmg, life: rng / W.ps, hits: [], a: a });
    } else if (W.kind === 'zone') {
      G.Z.push({ x: t.x, y: t.y, r: W.zr * TIER_RANGE[w.tier - 1], life: W.zlife, tick: 0, dmg: dmg });
    } else {
      G.PJ.push({ k: 'boomer', x: G.px, y: G.py, a: a, sp: W.ps, out: rng, trav: 0, ret: false,
                  dmg: dmg, hits: [] });
    }
    w.cd = W.cd * TIER_CD[w.tier - 1] / (1 + stat('atkSpd') / 100);
  }
}
function explode(x, y, r, dmg) {
  G.rings.push({ x: x, y: y, r: 8, max: r, life: 1, c: '255,220,120' });
  burst(x, y, '#eab308', 14, 150);
  shake = Math.max(shake, 4);
  var j, e;
  for (j = G.E.length - 1; j >= 0; j--) {
    e = G.E[j];
    if (d2(e.x, e.y, x, y) < (r + e.r) * (r + e.r)) dmgE(e, dmg);
  }
}

/* ═══════════ 투사체 / 존 / 적탄 / 재료 ═══════════ */
function updPJ(dt) {
  var i, p, j, e, hit, da;
  for (i = G.PJ.length - 1; i >= 0; i--) {
    p = G.PJ[i];
    if (p.k === 'boomer') {
      if (!p.ret) {
        p.x += Math.cos(p.a) * p.sp * dt; p.y += Math.sin(p.a) * p.sp * dt; p.trav += p.sp * dt;
        if (p.trav >= p.out) { p.ret = true; p.hits = []; }
      } else {
        da = Math.atan2(G.py - p.y, G.px - p.x);
        p.x += Math.cos(da) * p.sp * 1.15 * dt; p.y += Math.sin(da) * p.sp * 1.15 * dt;
        if (d2(p.x, p.y, G.px, G.py) < 18 * 18) { G.PJ.splice(i, 1); continue; }
      }
      for (j = 0; j < G.E.length; j++) {
        e = G.E[j];
        if (p.hits.indexOf(e) < 0 && d2(p.x, p.y, e.x, e.y) < (e.r + 6) * (e.r + 6)) {
          p.hits.push(e); dmgE(e, p.dmg);
        }
      }
      continue;
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.k === 'bomb') {
      hit = false;
      for (j = 0; j < G.E.length; j++) {
        e = G.E[j];
        if (d2(p.x, p.y, e.x, e.y) < (e.r + 5) * (e.r + 5)) { hit = true; break; }
      }
      if (hit || p.life <= 0) { explode(p.x, p.y, p.aoe, p.dmg); G.PJ.splice(i, 1); }
      continue;
    }
    if (p.k === 'pierce') {
      for (j = 0; j < G.E.length; j++) {
        e = G.E[j];
        if (p.hits.indexOf(e) < 0 && d2(p.x, p.y, e.x, e.y) < (e.r + 5) * (e.r + 5)) {
          p.hits.push(e); dmgE(e, p.dmg);
        }
      }
      if (p.life <= 0) G.PJ.splice(i, 1);
      continue;
    }
    hit = false;
    for (j = 0; j < G.E.length; j++) {
      e = G.E[j];
      if (d2(p.x, p.y, e.x, e.y) < (e.r + 5) * (e.r + 5)) { dmgE(e, p.dmg); hit = true; break; }
    }
    if (hit || p.life <= 0) G.PJ.splice(i, 1);
  }
}
function updZones(dt) {
  var i, z, j, e;
  for (i = G.Z.length - 1; i >= 0; i--) {
    z = G.Z[i]; z.life -= dt; z.tick -= dt;
    if (z.tick <= 0) {
      z.tick = 0.4;
      for (j = G.E.length - 1; j >= 0; j--) {
        e = G.E[j];
        if (d2(e.x, e.y, z.x, z.y) < (z.r + e.r) * (z.r + e.r)) dmgE(e, z.dmg);
      }
    }
    if (z.life <= 0) G.Z.splice(i, 1);
  }
}
function updEB(dt) {
  var i, b;
  for (i = G.EB.length - 1; i >= 0; i--) {
    b = G.EB[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < WALL || b.x > VW - WALL || b.y < WALL || b.y > VH - WALL) {
      G.EB.splice(i, 1); continue;
    }
    if (!G.over && G.inv <= 0 && d2(b.x, b.y, G.px, G.py) < 13 * 13) { G.EB.splice(i, 1); hurt(b.dmg); }
  }
}
function updM(dt) {
  var i, m, dx, dy, dd, d;
  for (i = G.M.length - 1; i >= 0; i--) {
    m = G.M[i];
    m.x += m.vx * dt; m.y += m.vy * dt; m.vx *= 1 - dt * 3; m.vy *= 1 - dt * 3;
    dx = G.px - m.x; dy = G.py - m.y; dd = dx * dx + dy * dy;
    if (dd < 70 * 70) { d = Math.sqrt(dd) || 1; m.x += dx / d * 300 * dt; m.y += dy / d * 300 * dt; }
    if (dd < 16 * 16) { G.M.splice(i, 1); G.mats++; }
  }
}

/* ═══════════ 적 AI ═══════════ */
function updEnemies(dt) {
  var i, e, dx, dy, dist, a0, k, a;
  for (i = G.E.length - 1; i >= 0; i--) {
    e = G.E[i];
    if (e.flash > 0) e.flash -= dt;
    if (e.hitCd > 0) e.hitCd -= dt;
    dx = G.px - e.x; dy = G.py - e.y; dist = Math.sqrt(dx * dx + dy * dy) || 1;
    if (e.k === 'boss') { updBoss(e, dt, dx, dy, dist); continue; }
    if (e.k === 'seed') {
      if (dist > 215) { e.x += dx / dist * e.spd * dt; e.y += dy / dist * e.spd * dt; }
      else if (dist < 150) { e.x -= dx / dist * e.spd * 0.8 * dt; e.y -= dy / dist * e.spd * 0.8 * dt; }
      e.fireT -= dt;
      if (e.fireT <= 0 && !G.over) {
        e.fireT = 2.2 + rnd() * 0.6;
        G.EB.push({ x: e.x, y: e.y, vx: dx / dist * 170, vy: dy / dist * 170, dmg: e.dmg, life: 3 });
      }
    } else if (e.k === 'shroom') {
      if (e.fuse < 0) {
        e.x += dx / dist * e.spd * dt; e.y += dy / dist * e.spd * dt;
        if (dist < 64) e.fuse = 0.6;
      } else {
        e.fuse -= dt;
        if (e.fuse <= 0) { shroomBoom(e); continue; }
      }
    } else {
      e.x += dx / dist * e.spd * dt; e.y += dy / dist * e.spd * dt;
      if (e.k === 'elite' && G.wave >= 7) {
        e.fireT -= dt;
        if (e.fireT <= 0 && !G.over) {
          e.fireT = 3.5;
          a0 = rnd() * 6.2832;
          for (k = 0; k < 8; k++) {
            a = a0 + k * 0.7854;
            G.EB.push({ x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, dmg: e.dmg - 4, life: 3 });
          }
        }
      }
    }
    e.x = clamp(e.x, MINX, MAXX); e.y = clamp(e.y, MINY, MAXY);
    if (e.k !== 'shroom' && !G.over && e.hitCd <= 0 && dist < e.r + PR) {
      hurt(e.dmg); e.hitCd = 0.9;
    }
  }
}
function updBoss(e, dt, dx, dy, dist) {
  var base, a0, k, a;
  if (e.dashW > 0) {                                 // 돌진 예고 — 부풀며 조준
    e.dashW -= dt;
    if (e.dashW <= 0) { e.dashD = 0.42; e.dvx = dx / dist * 430; e.dvy = dy / dist * 430; }
  } else if (e.dashD > 0) {
    e.dashD -= dt;
    e.x = clamp(e.x + e.dvx * dt, MINX + 20, MAXX - 20);
    e.y = clamp(e.y + e.dvy * dt, MINY + 20, MAXY - 20);
  } else {
    e.x += dx / dist * e.spd * dt; e.y += dy / dist * e.spd * dt;
    e.fanT -= dt; e.ringT -= dt; e.dashT -= dt;
    if (e.fanT <= 0 && !G.over) {
      e.fanT = 2.4;
      base = Math.atan2(dy, dx);
      for (k = 0; k < 5; k++) {
        a = base + (k - 2) * 0.16;
        G.EB.push({ x: e.x, y: e.y, vx: Math.cos(a) * 205, vy: Math.sin(a) * 205, dmg: 14, life: 3.4 });
      }
    }
    if (e.ringT <= 0) {
      e.ringT = 5;
      a0 = rnd() * 6.2832;
      for (k = 0; k < 16; k++) {
        a = a0 + k * 0.3927;
        G.EB.push({ x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, dmg: 12, life: 3.6 });
      }
    }
    if (e.dashT <= 0) { e.dashT = 7.5; e.dashW = 0.55; }
  }
  if (!G.over && e.hitCd <= 0 && dist < e.r + PR) { hurt(e.dmg); e.hitCd = 1; }
}

/* ═══════════ 이펙트 ═══════════ */
function burst(x, y, color, n, spd) {
  var i, a, s;
  for (i = 0; i < n; i++) {
    a = rnd() * Math.PI * 2; s = spd * (0.3 + rnd() * 0.9);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: color, size: 1 + rnd() * 3 });
  }
}
function addFloat(x, y, text, c) {
  G.floats.push({ x: x, y: y, life: 1, text: '' + text, c: c || '#ffe9b0' });
}
function banner(text) {
  $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1.3;
}
function updFx(dt) {
  var i, q, rg, f;
  for (i = G.parts.length - 1; i >= 0; i--) {
    q = G.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - dt * 1.6; q.vy *= 1 - dt * 1.6;
    q.life -= dt * 1.7;
    if (q.life <= 0) G.parts.splice(i, 1);
  }
  for (i = G.rings.length - 1; i >= 0; i--) {
    rg = G.rings[i];
    rg.r += (rg.max - rg.r) * Math.min(1, dt * 7); rg.life -= dt * 2.2;
    if (rg.life <= 0) G.rings.splice(i, 1);
  }
  for (i = G.floats.length - 1; i >= 0; i--) {
    f = G.floats[i];
    f.y -= dt * 30; f.life -= dt * 1.4;
    if (f.life <= 0) G.floats.splice(i, 1);
  }
  for (i = G.slashes.length - 1; i >= 0; i--) {
    G.slashes[i].life -= dt;
    if (G.slashes[i].life <= 0) G.slashes.splice(i, 1);
  }
}

/* ═══════════ 웨이브 종료 / 게임 종료 ═══════════ */
function winGame() {
  if (state !== 'combat') return;
  G.won = true;
  endRun(TR('endWin'), 12 * 1000 + G.kills + 5000, '웨이브 12 클리어(' + CHAR_KO[G.ci] + ')');
}
function loseGame(timeUp) {
  endRun(timeUp ? TR('endTime') : TR('endLose'), (G.wave - 1) * 1000 + G.kills,
         '웨이브 ' + G.wave + (timeUp ? ' 시간초과(' : ' 전사(') + CHAR_KO[G.ci] + ')');
}
function endRun(title, score, detail) {
  state = 'end';
  $('endTitle').textContent = title;
  $('endDesc').textContent = tf('endDesc', { w: G.won ? 12 : G.wave, k: G.kills, v: score.toLocaleString() });
  $('endPanel').hidden = false; $('hud').hidden = true; $('banner').classList.remove('on');
  GameRank.submit('spud-arena', score, detail).then(function (r) {
    if (r && r.applied) $('endDesc').textContent += tf('rankApplied', { n: r.rank });
  });
}
function waveClear() {
  var i, bonus = G.M.length;                          // 남은 재료 + 남은 적 자동 정산
  for (i = 0; i < G.E.length; i++) if (G.E[i].k !== 'boss') bonus += G.E[i].worth;
  G.mats += bonus + 3 + Math.floor(G.wave / 2);
  G.E.length = 0; G.EB.length = 0; G.PJ.length = 0; G.Z.length = 0; G.M.length = 0; G.SQ.length = 0;
  banner(TR('waveClear'));
  openShop();
}

/* ═══════════ 메인 갱신 ═══════════ */
function update(dt) {
  if (state !== 'combat') return;
  var i, mx, my, sp, rg, whole;
  if (!G.over) {
    G.waveT -= dt;
    if (G.waveT <= 0) {
      if (G.wave >= 12) { loseGame(true); return; }
      waveClear(); return;
    }
    G.inv = Math.max(0, G.inv - dt);
    rg = stat('regen');
    if (rg) {                                        // 음수 재생은 1까지만 깎인다
      G.regenAcc += rg * 0.5 * dt;
      whole = G.regenAcc > 0 ? Math.floor(G.regenAcc) : Math.ceil(G.regenAcc);
      if (whole) { G.regenAcc -= whole; G.hp = clamp(G.hp + whole, 1, stat('maxHp')); }
    }
    mx = 0; my = 0;
    if (keys.ArrowLeft || keys.KeyA) mx -= 1;
    if (keys.ArrowRight || keys.KeyD) mx += 1;
    if (keys.ArrowUp || keys.KeyW) my -= 1;
    if (keys.ArrowDown || keys.KeyS) my += 1;
    if (mx && my) { mx *= 0.7071; my *= 0.7071; }
    sp = SPD0 * (1 + stat('speed') / 100);
    G.px = clamp(G.px + mx * sp * dt, MINX, MAXX);
    G.py = clamp(G.py + my * sp * dt, MINY, MAXY);
    if (mx || my) G.walk += dt * 10;
    G.mvx = mx;
    spawner(dt);
    fireWeapons(dt);
  } else {
    G.dying -= dt;
    if (G.dying <= 0) { loseGame(false); return; }
  }
  for (i = G.SQ.length - 1; i >= 0; i--) {
    G.SQ[i].t -= dt;
    if (G.SQ[i].t <= 0) { makeEnemy(G.SQ[i]); G.SQ.splice(i, 1); }
  }
  updEnemies(dt);
  updEB(dt);
  updPJ(dt);
  updZones(dt);
  updM(dt);
  updFx(dt);
  shake = Math.max(0, shake - dt * 30);
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
}

/* ═══════════ 상점 ═══════════ */
function priceInfl() { return 1 + G.wave * 0.07; }
function rollWeaponTier() {
  var w = G.wave, lk = stat('luck'), t = 1;
  if (w >= 9 && rnd() * 100 < 6 + (w - 9) * 3 + lk * 0.2) t = 4;
  else if (w >= 6 && rnd() * 100 < 10 + (w - 6) * 4 + lk * 0.3) t = 3;
  else if (w >= 3 && rnd() * 100 < 16 + (w - 3) * 4 + lk * 0.4) t = 2;
  return t;
}
function rollOffer() {
  if (rnd() < 0.4) {
    var id = WIDS[ri(WIDS.length)], t = rollWeaponTier();
    return { type: 'w', id: id, tier: t,
             cost: Math.round(WEAPONS[id].cost * TIER_COST[t - 1] * priceInfl()),
             locked: false, sold: false };
  }
  var tot = 0, i, r;
  for (i = 0; i < ITEMS.length; i++) tot += itemWeight(ITEMS[i]);
  r = rnd() * tot;
  for (i = 0; i < ITEMS.length; i++) { r -= itemWeight(ITEMS[i]); if (r <= 0) break; }
  var it = ITEMS[Math.min(i, ITEMS.length - 1)];
  return { type: 'i', item: it, cost: Math.round(it.cost * priceInfl()), locked: false, sold: false };
}
function rerollCost() { return 2 + Math.floor(G.wave * 0.8) + G.rerolls * 2; }
function openShop() {
  state = 'shop';
  G.rerolls = 0;
  var kept = [], i;
  for (i = 0; i < G.offers.length; i++) if (G.offers[i].locked && !G.offers[i].sold) kept.push(G.offers[i]);
  G.offers = [];
  for (i = 0; i < 4; i++) G.offers.push(kept[i] || rollOffer());
  $('hud').hidden = true;
  $('shop').hidden = false;
  renderShop();
}
function weaponBuyState(o) {                          // 'merge' | 'slot' | 'full'
  var i, w;
  for (i = 0; i < G.weapons.length; i++) {
    w = G.weapons[i];
    if (w.id === o.id && w.tier === o.tier && w.tier < 4) return 'merge';
  }
  return G.weapons.length < 6 ? 'slot' : 'full';
}
function offerCard(o, idx) {
  var d = document.createElement('div');
  d.className = 'offer' + (o.sold ? ' sold' : '') + (o.locked ? ' locked' : '');
  var head = document.createElement('div'); head.className = 't';
  var desc = document.createElement('div'); desc.className = 'd';
  var meta = document.createElement('div'); meta.className = 'm';
  if (o.type === 'w') {
    var W = WEAPONS[o.id];
    head.textContent = W.icon + ' ' + TR(W.nk) + ' · T' + o.tier;
    head.style.color = TIER_COL[o.tier - 1];
    desc.textContent = '[' + TR('wTag') + '] ' + tf('wdStat', {
      d: Math.round(W.dmg * TIER_DMG[o.tier - 1]),
      c: (W.cd * TIER_CD[o.tier - 1]).toFixed(2),
      r: Math.round(W.range * TIER_RANGE[o.tier - 1]),
    });
    var st = weaponBuyState(o);
    meta.textContent = st === 'merge' ? tf('merge', { n: o.tier + 1 }) : st === 'full' ? TR('noSlot') : '';
    if (st === 'full') meta.style.color = '#ef4444';
  } else {
    head.textContent = '🎁 ' + TR(o.item.n);
    desc.textContent = '[' + TR('iTag') + '] ' + itemDesc(o.item);
  }
  var buy = document.createElement('button');
  buy.className = 'buyBtn';
  buy.textContent = o.sold ? TR('sold') : tf('buy', { c: o.cost });
  buy.disabled = o.sold || G.mats < o.cost || (o.type === 'w' && weaponBuyState(o) === 'full');
  buy.onclick = function () { buyOffer(idx); };
  var lock = document.createElement('button');
  lock.className = 'lockBtn';
  lock.textContent = o.locked ? '🔒' : '🔓';
  lock.onclick = function () { o.locked = !o.locked; renderShop(); };
  d.appendChild(lock); d.appendChild(head); d.appendChild(desc); d.appendChild(meta); d.appendChild(buy);
  return d;
}
function renderShop() {
  $('shopTitle').textContent = tf('shopTitle', { n: G.wave + 1 });
  $('shopMats').textContent = '🥔 ' + G.mats;
  var host = $('shopOffers'), i;
  host.innerHTML = '';
  for (i = 0; i < 4; i++) host.appendChild(offerCard(G.offers[i], i));
  $('rerollBtn').textContent = tf('reroll', { c: rerollCost() });
  $('rerollBtn').disabled = G.mats < rerollCost();
  $('nextBtn').textContent = tf('nextBtn', { n: G.wave + 1 });
  renderShopStats();
}
function buyOffer(idx) {
  var o = G.offers[idx];
  if (o.sold || G.mats < o.cost) return;
  if (o.type === 'w') { if (!addWeapon(o.id, o.tier)) return; }
  else applyItem(o.item);
  G.mats -= o.cost; o.sold = true; o.locked = false;
  renderShop();
}
function addWeapon(id, tier) {
  var i, w;
  for (i = 0; i < G.weapons.length; i++) {
    w = G.weapons[i];
    if (w.id === id && w.tier === tier && w.tier < 4) { w.tier++; mergeChain(w); return true; }
  }
  if (G.weapons.length >= 6) return false;
  G.weapons.push({ id: id, tier: tier, cd: 0 });
  return true;
}
function mergeChain(w) {                              // 같은 티어가 또 생기면 연쇄 합성
  var i, o;
  for (i = 0; i < G.weapons.length; i++) {
    o = G.weapons[i];
    if (o !== w && o.id === w.id && o.tier === w.tier && w.tier < 4) {
      G.weapons.splice(i, 1); w.tier++; mergeChain(w); return;
    }
  }
}
function applyItem(it) {
  var k;
  for (k in it.fx) {
    G.bonus[k] += it.fx[k];
    if (k === 'maxHp' && it.fx[k] > 0) G.hp += it.fx[k];
  }
  G.hp = clamp(G.hp, 1, stat('maxHp'));
}
function renderShopStats() {
  var parts = [], wl = [], i, k, v, w;
  for (i = 0; i < STAT_KEYS.length; i++) {
    k = STAT_KEYS[i]; v = stat(k);
    parts.push(TR(STAT_NK[k]) + ' <b>' + v + (PCT[k] ? '%' : '') + '</b>');
  }
  for (i = 0; i < G.weapons.length; i++) {
    w = G.weapons[i];
    wl.push('<span style="color:' + TIER_COL[w.tier - 1] + '">' + WEAPONS[w.id].icon +
            TR(WEAPONS[w.id].nk) + ' T' + w.tier + '</span>');
  }
  $('shopStats').innerHTML =
    '<div>' + TR('stats') + ' — ' + parts.join(' · ') + '</div>' +
    '<div>' + tf('arsenal', { n: G.weapons.length }) + ' — ' + wl.join(' &nbsp; ') + '</div>';
}
$('rerollBtn').onclick = function () {
  var c = rerollCost(), i;
  if (G.mats < c) return;
  G.mats -= c; G.rerolls++;
  for (i = 0; i < 4; i++) if (!G.offers[i].locked || G.offers[i].sold) G.offers[i] = rollOffer();
  renderShop();
};
$('nextBtn').onclick = function () { startWave(G.wave + 1); };

/* ═══════════ 캐릭터 선택 / 입력 / 루프 ═══════════ */
function buildCharRow() {
  var row = $('charRow'), i;
  row.innerHTML = '';
  for (i = 0; i < CHARS.length; i++) {
    (function (idx) {
      var ch = CHARS[idx], d = document.createElement('div');
      d.className = 'char' + (idx === selChar ? ' sel' : '');
      d.innerHTML = '<div class="ico">' + ch.icon + '🥔</div><div class="nm">' + TR(ch.nk) +
                    '</div><div class="ds">' + TR(ch.dk) + '</div>';
      d.onclick = function () { selChar = idx; buildCharRow(); };
      row.appendChild(d);
    })(i);
  }
}

var MOVE = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
             KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, Space: 1 };
addEventListener('keydown', function (ev) { if (MOVE[ev.code]) ev.preventDefault(); keys[ev.code] = true; });
addEventListener('keyup', function (ev) { delete keys[ev.code]; });
addEventListener('blur', function () { keys = {}; });

var last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!G) return;
  if (state === 'combat') {
    update(dt);
    if (state === 'combat') draw(now / 1000);
  }
}
requestAnimationFrame(loop);

function startGame() {
  newGame(selChar);
  $('menu').hidden = true; $('endPanel').hidden = true;
  startWave(1);
}
$('startBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('backBtn').onclick = function () {
  state = 'menu';
  $('endPanel').hidden = true; $('hud').hidden = true; $('menu').hidden = false;
};
buildCharRow();
</script>
<script src="../lib/touch.js"></script>
<script src="../lib/rank.js"></script>

GameRank.autoPanel('spud-arena');
</script>
