<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">유물 계승자</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dbe4f5; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:flex-start; min-height:100vh; user-select:none; padding:14px 10px; }
  #wrap { width:min(560px, 100%); }
  h1 { color:#d4a24e; font-size:22px; text-align:center; text-shadow:2px 2px 0 #000; margin:6px 0 2px; }
  #sub { text-align:center; font-size:11px; color:#8fa0bd; margin-bottom:12px; }
  h2 { color:#7dd3fc; font-size:16px; margin-bottom:8px; text-align:center; }
  .panel { background:#1a2238; border:1px solid #2a3552; border-radius:12px; padding:14px; }
  button { font-family:inherit; cursor:pointer; border:0; border-radius:8px; color:#dbe4f5;
           background:#232e4d; padding:10px 12px; font-size:13px; touch-action:manipulation; }
  button:disabled { opacity:.38; cursor:default; }
  .accent { background:#0ea5e9; color:#06121f; font-weight:bold; }
  .warn { background:#3d3413; border:1px solid #eab308; color:#eab308; }
  .danger { background:#3d1717; border:1px solid #ef4444; color:#ef4444; }
  .big { width:100%; padding:13px; font-size:15px; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row button { flex:1; }
  /* 메뉴 */
  #menu { display:flex; flex-direction:column; gap:9px; text-align:center; }
  #menuInfo { font-size:12.5px; line-height:1.9; color:#8fa0bd; }
  #menuInfo b { color:#d4a24e; }
  #saveRow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #saveRow input { background:#0c1424; border:1px solid #2a3552; color:#dbe4f5; border-radius:6px; padding:8px 9px;
                   font-family:inherit; font-size:12px; letter-spacing:1px; width:150px; text-transform:uppercase; }
  #saveRow button { font-size:11px; padding:8px 12px; }
  #codeShow { font-size:11px; color:#d4a24e; letter-spacing:2px; min-height:1em; }
  #saveStatus { font-size:10.5px; color:#8fa0bd; }
  /* 런 화면 */
  #hudTop { display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  #depthBig { font-size:26px; font-weight:bold; color:#7dd3fc; }
  #depthBig small { font-size:13px; color:#8fa0bd; }
  #strataTxt { color:#d4a24e; font-size:12px; }
  #bestTxt { color:#8fa0bd; font-size:11px; }
  #hpWrap { height:12px; background:#0c1424; border:1px solid #2a3552; border-radius:6px; overflow:hidden; margin:8px 0 5px; }
  #hpFill { height:100%; background:#22c55e; width:100%; transition:width .25s; }
  #hudRow { display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:#8fa0bd; margin-bottom:8px; }
  #log { height:250px; overflow-y:auto; background:#0c1424; border:1px solid #2a3552; border-radius:8px;
         padding:10px 12px; font-size:12px; line-height:1.6; }
  .ln { color:#aab7d4; }
  .ln.dmg { color:#ef4444; }
  .ln.good { color:#22c55e; }
  .ln.gold { color:#eab308; }
  .ln.relic { color:#d4a24e; }
  .ln.sys { color:#7dd3fc; }
  #choiceBox { display:flex; flex-direction:column; gap:7px; margin-top:10px; }
  #choiceBox .note { font-size:12px; color:#eab308; text-align:center; }
  #choiceBox button { width:100%; padding:12px; font-size:13px; }
  #retreatBtn { width:100%; margin-top:10px; }
  /* 유산 트리 */
  #shardTxt { color:#d4a24e; font-weight:bold; text-align:center; margin:4px 0 6px; font-size:13px; }
  .lgBr { margin:12px 0 6px; color:#7dd3fc; font-size:12px; font-weight:bold;
          border-bottom:1px solid #2a3552; padding-bottom:3px; }
  .lg { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#0c1424;
        border:1px solid #2a3552; border-radius:8px; padding:8px 10px; margin-bottom:6px; }
  .lg .nm { font-size:12.5px; font-weight:bold; color:#dbe4f5; }
  .lg .ds { font-size:10.5px; color:#8fa0bd; }
  .lg button { white-space:nowrap; font-size:11px; padding:8px 10px; }
  .lg button.buy { background:#0ea5e9; color:#06121f; font-weight:bold; }
  #legacyBackBtn, #codexBackBtn { margin-top:10px; }
  /* 도감 */
  #codexBonus { font-size:10.5px; color:#8fa0bd; text-align:center; margin:2px 0 4px; }
  #codexGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
  .cx { background:#0c1424; border:1px solid #2a3552; border-radius:8px; padding:8px 4px; text-align:center;
        font-size:9.5px; color:#8fa0bd; min-height:60px; }
  .cx .em { font-size:18px; display:block; margin-bottom:3px; }
  .cx.rar1 { border-color:#0ea5e9; }
  .cx.rar2 { border-color:#eab308; }
  .cx.rar3 { border-color:#d4a24e; box-shadow:0 0 8px rgba(212,162,78,.35); }
  .cx.lock { opacity:.35; }
  .cxFlavor { font-size:10.5px; color:#d4a24e; font-style:italic; margin-top:10px; text-align:center; line-height:1.7; }
  /* 세대 요약 */
  #sumBody { margin:12px 0; }
  .srow { display:flex; justify-content:space-between; gap:10px; padding:5px 0;
          border-bottom:1px dashed #2a3552; font-size:12.5px; }
  .srow .v { color:#eab308; font-weight:bold; text-align:right; }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:rgba(6,12,24,.94);
           border:1px solid #2a3552; padding:8px 18px; border-radius:9px; font-size:12px; opacity:0;
           transition:opacity .3s; pointer-events:none; z-index:99; }
</style>
</head>
<body>
<div id="wrap">
  <h1 data-i18n="h1">🏺 유물 계승자</h1>
  <div id="sub" data-i18n="sub">몰락한 가문의 후계자여 — 한 런은 한 세대, 유산은 대를 이어 깊어진다</div>

  <div class="panel" id="menu">
    <div id="menuInfo"></div>
    <button id="startBtn" class="big accent" data-i18n="btnStart">⛏ 탐사대 출발</button>
    <div class="row">
      <button id="legacyBtn" data-i18n="btnLegacy">🏛 가문 유산</button>
      <button id="codexBtn" data-i18n="btnCodex">📜 유물 도감</button>
    </div>
    <div id="saveRow">
      <input id="codeInput" placeholder="이어하기 코드" data-i18n-ph="phCode" maxlength="18" autocomplete="off">
      <button id="codeLoadBtn" data-i18n="btnCodeLoad">🔑 코드로 불러오기</button>
    </div>
    <div id="codeShow"></div>
    <div id="saveStatus"></div>
  </div>

  <div class="panel" id="legacy" hidden>
    <h2 data-i18n="legacyTitle">🏛 가문 유산</h2>
    <div id="shardTxt"></div>
    <div id="legacyList"></div>
    <button id="legacyBackBtn" class="big" data-i18n="btnBack">← 돌아가기</button>
  </div>

  <div class="panel" id="codex" hidden>
    <h2 data-i18n="codexTitle">📜 유물 도감</h2>
    <div id="codexBonus"></div>
    <div id="codexGrid"></div>
    <div id="codexFlavor" class="cxFlavor"></div>
    <button id="codexBackBtn" class="big" data-i18n="btnBack">← 돌아가기</button>
  </div>

  <div class="panel" id="run" hidden>
    <div id="hudTop">
      <div id="depthBig"><span id="depthTxt">0</span><small>m</small></div>
      <div id="strataTxt"></div>
      <div id="bestTxt"></div>
    </div>
    <div id="hpWrap"><div id="hpFill"></div></div>
    <div id="hudRow">
      <span id="hpTxt"></span><span id="spdTxt"></span><span id="goldTxt"></span>
      <span id="shardRunTxt"></span><span id="dangerTxt"></span>
    </div>
    <div id="log"></div>
    <div id="choiceBox"></div>
    <button id="retreatBtn" class="warn" data-i18n="btnRetreat">🏳 철수한다 (수확 보존)</button>
  </div>

  <div class="panel" id="summary" hidden>
    <h2 id="sumTitle"></h2>
    <div id="sumBody"></div>
    <div class="row">
      <button id="sumLegacyBtn" class="accent" data-i18n="btnSumLegacy">🏛 유산에 투자</button>
      <button id="backBtn" data-i18n="backBtn">🏚 가문 저택으로</button>
    </div>
  </div>
</div>
<div id="toast"></div>

  if (!R.paused) {
    R.depth += runSpd() * 0.25;
    // 지층 돌파 — 이정표마다 새 지층 + 회복 + 상인 조우
    var st = Math.floor(R.depth / 100);
    if (st > R.stratum) {
      R.stratum = st;
      addLog(T('logStrata', { s: stratumName(st), n: st * 100 }), 'sys');
      var healLv = lgLv('medic');
      if (healLv > 0 && R.hp < R.maxHp) {
        var h = Math.min(R.maxHp - R.hp, healLv * 8);
        R.hp += h;
        addLog(T('evHeal', { n: h }), 'good');
      }
      if (Math.random() < 0.65) { merchant(); hud(); return; }
    }
    // 가문 기록 돌파
    if (!R.recordPassed && R.depth > meta.best) {
      R.recordPassed = true;
      addLog(T('recordLog', { n: fmtNum(meta.best) }), 'good');
    }
    // 이벤트 타이머
    R.nextEv -= 0.25;
    if (R.nextEv <= 0) {
      R.nextEv = rnd(3.5, 6.5);
      rollEvent();
    }
  }
  hud();
}
function rollEvent() {
  var x = Math.random();
  var hazardSkip = lgLv('maps') * 0.10;    // 지름길 지도 — 위험 이벤트를 무산시킨다
  if (x < 0.20) {
    if (Math.random() < hazardSkip) { addLog(TR('evCalm1'), ''); return; }
    hit(damage(ri(7, 16), 'trap'), Math.random() < 0.5 ? 'evTrap1' : 'evTrap2');
  } else if (x < 0.40) {
    if (Math.random() < hazardSkip) { addLog(TR('evCalm2'), ''); return; }
    if (hasGear('sword') && Math.random() < 0.25) { addLog(TR('evMonWin'), 'good'); return; }
    hit(damage(ri(9, 18), 'mon'), Math.random() < 0.5 ? 'evMon1' : 'evMon2');
  } else if (x < 0.58) {
    var g = Math.round(rnd(10, 26) * (1 + R.depth / 120) * goldMul());
    R.gold += g;
    addLog(T('evGold', { n: fmtNum(g) }), 'gold');
  } else if (x < 0.70) {
    var s = Math.round(rnd(1, 3) * (1 + R.depth / 200) * shardMul());
    R.shards += s;
    addLog(T('evShard', { n: s }), 'relic');
  } else if (x < 0.82) {
    relicSpot();
  } else if (x < 0.92) {
    fork();
  } else {
    addLog(TR(Math.random() < 0.5 ? 'evCalm1' : 'evCalm2'), '');
  }
}

/* ── 실시간 개입 — 갈림길 / 유물 줍기 / 상인 (하강 일시정지) ── */
var choiceCount = null;
function clearChoice() {
  $('choiceBox').innerHTML = '';
  clearInterval(choiceCount);
  choiceCount = null;
  if (R) R.paused = false;
}
function choiceNote(text) {
  var d = document.createElement('div');
  d.className = 'note';
  d.textContent = text;
  $('choiceBox').appendChild(d);
  return d;
}
function choiceBtn(label, cls, fn) {
  var b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = fn;
  $('choiceBox').appendChild(b);
  return b;
}
function relicSpot() {
  R.paused = true;
  var left = 6;
  var note = choiceNote(T('relicSpot', { t: left }));
  choiceBtn(TR('btnGrab'), 'accent', function () { grabRelic(); });
  choiceBtn(TR('btnLeave'), '', function () {
    clearChoice();
    addLog(TR('relicLeft'), '');
  });
  choiceCount = setInterval(function () {
    left--;
    if (left <= 0) {
      clearChoice();
      addLog(TR('relicLeft'), '');
    } else {
      note.textContent = T('relicSpot', { t: left });
    }
  }, 1000);
}
function rollRarity() {
  // 깊이·렌즈·행운이 등급을 끌어올린다 — 심층일수록 신화 확률 상승
  var x = Math.random() + R.depth / 3000 + lgLv('lens') * 0.04 + runLuck() * 0.08;
  if (x > 1.18) return 3;
  if (x > 1.0) return 2;
  if (x > 0.75) return 1;
  return 0;
}
function grabRelic() {
  clearChoice();
  if (Math.random() < Math.max(0.08, 0.30 - runLuck() * 0.5)) {
    if (hit(damage(ri(10, 20), 'mon'), 'relicGuard')) return;
  }
  var rar = rollRarity();
  var pool = [], i;
  for (i = 0; i < RELICS.length; i++) if (RELICS[i].r === rar) pool.push(RELICS[i]);
  var pick = pool[Math.floor(Math.random() * pool.length)];
  var s = Math.round(rnd(2, 5) * (1 + rar) * shardMul());
  R.shards += s;
  addLog(T('relicGet', { r: pick.e + ' ' + TR(pick.k), n: s }), 'relic');
  if (!meta.codex[pick.k]) {
    meta.codex[pick.k] = 1;               // 도감은 지식 — 전멸해도 남는다
    R.relics.push(pick.k);
    addLog(T('relicNew', { q: TR('rar' + rar), r: TR(pick.k) }), 'relic');
    if (pick.f) addLog(TR(pick.f), 'relic');
    persistSoon();
  }
}
function fork() {
  R.paused = true;
  var reward = Math.round(rnd(28, 70) * (1 + R.depth / 120) * goldMul());
  choiceNote(TR('forkTitle'));
  choiceBtn(TR('btnSafe'), '', function () {
    clearChoice();
    addLog(TR('forkSafe'), '');
  });
  var hint = lgLv('scouts') ? T('scoutHint', { n: fmtNum(reward) }) : '';
  choiceBtn(T('btnRisk', { h: hint }), 'danger', function () {
    clearChoice();
    if (Math.random() < Math.min(0.85, 0.55 + runLuck() * 0.5)) {
      R.gold += reward;
      addLog(T('forkRiskWin', { n: fmtNum(reward) }), 'gold');
    } else {
      var part = Math.round(reward * 0.25);
      R.gold += part;
      var d = damage(ri(12, 24), 'trap');
      R.hp -= d;
      addLog(T('forkRiskHit', { n: d }).replace('{g}', fmtNum(part)), 'dmg');
      if (R.hp <= 0) { R.hp = 0; hud(); wipe(); }
    }
  });
  if (lgLv('ropes')) {
    choiceBtn(TR('btnScoutGo'), '', function () {
      clearChoice();
      var part2 = Math.round(reward * 0.6);
      R.gold += part2;
      addLog(T('forkScout', { n: fmtNum(part2) }), 'gold');
    });
  }
}
function merchant() {
  var pool = [], i;
  for (i = 0; i < EQUIP.length; i++) if (!hasGear(EQUIP[i].id)) pool.push(EQUIP[i]);
  if (!pool.length) return;
  R.paused = true;
  choiceNote(T('merTitle', { a: R.gear.length, b: gearSlots() }));
  pool.sort(function () { return Math.random() - 0.5; });
  var offers = pool.slice(0, 3);
  for (i = 0; i < offers.length; i++) (function (eq) {
    var price = Math.ceil(eq.base * (1 + R.depth / 150) * (lgLv('forge') ? 0.75 : 1));
    var b = choiceBtn(TR(eq.name) + ' — 💰' + fmtNum(price) + 'G', '', function () {
      if (R.gold < price) return;
      if (R.gear.length >= gearSlots()) { toast(TR('merFull')); return; }
      R.gold -= price;
      R.gear.push(eq.id);
      if (eq.id === 'armor') { R.maxHp += 40; R.hp = Math.min(R.maxHp, R.hp + 40); }
      addLog(T('merBought', { e: TR(eq.name) }), 'good');
      b.disabled = true;
      hud();
    });
    if (R.gold < price) b.disabled = true;
  })(offers[i]);
  choiceBtn(TR('btnPass'), '', function () { clearChoice(); });
}

/* ── 런 종료 — 철수(전부 보존) vs 전멸(절반 손실) ── */
$('retreatBtn').onclick = function () {
  if (!R || R.over) return;
  clearChoice();
  addLog(TR('retreatLog'), 'good');
  if (lgLv('will')) addLog(TR('retreatBonus'), 'good');
  endRun(true, 900);
};
function wipe() {
  if (!R || R.over) return;
  addLog(T('wipeLog', { n: lgLv('will') ? 35 : 50 }), 'dmg');
  endRun(false, 1800);
}
function endRun(survived, delay) {
  if (!R || R.done) return;
  R.done = true;
  R.over = true;
  clearInterval(loopT);
  loopT = null;
  clearChoice();
  var depth = Math.floor(R.depth);
  var keep = R.shards;
  if (!survived) keep *= lgLv('will') ? 0.65 : 0.5;
  else if (lgLv('will')) keep *= 1.10;
  keep = Math.floor(keep);
  var newRecord = depth > meta.best;
  if (newRecord) meta.best = depth;
  meta.shards += keep;
  var gen = meta.gen;
  meta.gen += 1;
  meta.runs += 1;
  persist();
  var score = meta.best * 10 + codexCount() * 500;
  if (window.GameRank) GameRank.submit('relic-heir', score, T('detail', { g: gen, d: fmtNum(meta.best) }));
  renderSummary(gen, depth, newRecord, keep, score);
  setTimeout(function () { showPanel('summary'); }, delay || 0);
}
function renderSummary(gen, depth, newRecord, keep, score) {
  $('sumTitle').textContent = T('sumTitle', { n: gen });
  var h = '<div class="srow"><span>' + TR('sumDepth') + '</span><span class="v">' + fmtNum(depth) + 'm' +
    (newRecord ? ' <span style="color:#22c55e">' + TR('sumBestNew') + '</span>' : '') + '</span></div>';
  h += '<div class="srow"><span>' + TR('sumShard') + '</span><span class="v">🔮 ' + fmtNum(keep) + '</span></div>';
  var names = [], i;
  for (i = 0; i < R.relics.length; i++) {
    var rl = relicByKey(R.relics[i]);
    names.push(rl.e + ' ' + TR(rl.k));
  }
  h += '<div class="srow"><span>' + TR('sumRelics') + '</span><span class="v">' +
    (names.length ? names.join(', ') : TR('sumNone')) + '</span></div>';
  h += '<div class="srow"><span>' + TR('sumScore') + '</span><span class="v">' + fmtNum(score) + '</span></div>';
  h += '<div style="margin-top:10px;font-size:11.5px;color:#8fa0bd">' + TR('sumNext') + '</div>';
  $('sumBody').innerHTML = h;
}
</script>
<script src="../lib/rank.js"></script>
<script>
GameRank.autoPanel('relic-heir');
GameRank.copyButton(function () { return typeof saveCode !== 'undefined' ? saveCode : null; });
</script>
