<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">밧줄 공방</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dde6f2; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:10px; overflow:hidden;
          box-shadow:0 0 52px rgba(14,165,233,.14); }
  canvas { display:block; background:#0c1424; max-width:100%; touch-action:none; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:10px; right:56px; display:flex; gap:8px; font-size:12.5px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(12,20,36,.72); padding:3px 11px; border-radius:10px; white-space:nowrap; }
  #hud .grow { flex:1; }
  #bar { position:absolute; left:0; right:0; bottom:0; display:flex; gap:7px; padding:7px 9px;
         background:rgba(12,20,36,.9); font-size:11px; align-items:center; }
  #bar button { background:#222b44; color:#dde6f2; border:1px solid #2c3550; padding:6px 12px; border-radius:6px;
                cursor:pointer; font-family:inherit; font-size:11px; font-weight:bold; }
  #bar button:hover { background:#2c3550; }
  #banner { position:absolute; top:34%; left:0; right:0; text-align:center; font-size:24px; font-weight:bold;
            color:#0ea5e9; text-shadow:0 0 16px rgba(14,165,233,.55), 2px 2px 0 #000; pointer-events:none;
            opacity:0; transition:opacity .25s; padding:0 12px; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(10,16,30,.95); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:10px; text-align:center; z-index:10; padding:16px;
           overflow-y:auto; }
  .panel h1 { color:#0ea5e9; font-size:24px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#b7c4da; line-height:1.75; max-width:540px; }
  .panel p.small { font-size:11px; color:#7c8ab0; }
  .panel button { background:#0ea5e9; color:#04121f; border:0; padding:9px 20px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#222b44; color:#dde6f2; }
  .panel button.ghost:hover { background:#2c3550; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #menu { justify-content:flex-start; padding-top:20px; }
  #failPanel { background:rgba(12,20,36,.82); }
  #failPanel h1 { color:#ef4444; }
  #clearPanel h1 { color:#22c55e; }
  #starRow { font-size:30px; letter-spacing:6px; color:#eab308; text-shadow:2px 2px 0 #000; }
  #levelGrid { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:460px; }
  #levelGrid button { width:40px; height:40px; padding:0; font-size:11px; line-height:1.25; border-radius:6px;
                      background:#2c3550; color:#dde6f2; border:1px solid #222b44; }
  #levelGrid button:hover:not(:disabled) { background:#222b44; border-color:#0ea5e9; }
  #levelGrid button:disabled { background:#1a2238; opacity:.42; cursor:default; }
  #levelGrid .st { display:block; font-size:8px; color:#eab308; }
  #info { margin-top:9px; font-size:11px; color:#5a688a; text-align:center; line-height:1.7; padding:0 12px; }
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width:100vw; max-width:100vw; border-width:0; border-radius:0; }
    canvas { width:100%; height:auto; }
    #info { display:none; }
    #bar button, .panel button { padding:10px 15px; font-size:13px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="860" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="lvTxt"></span>

    <span class="tag" id="scTxt"></span>

  <div id="banner"></div>
  <div id="bar" hidden>
    <button id="retryBtn"></button>
    <button id="quitBtn"></button>
  </div>
  <div class="panel" id="menu">
    <h1 data-i18n="menuTitle">🪢 밧줄 공방</h1>

  <div class="panel" id="clearPanel" hidden>

    <div class="row">
      <button id="nextBtn" data-i18n="nextBtn">▶ 다음 작업대</button>
      <button id="clearRetryBtn" class="ghost" data-i18n="retryBtn2">🔁 다시</button>
      <button id="clearMenuBtn" class="ghost" data-i18n="listBtn">목록</button>
    </div>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 data-i18n="endTitle">🫙 모든 항아리를 채웠다!</h1>

    <div class="row">
      <button id="againBtn" data-i18n="againBtn">🔁 처음부터 다시</button>
      <button id="backBtn" class="ghost" data-i18n="backBtn">처음으로</button>
    </div>
  </div>
</div>
<div id="info" data-i18n="info">마우스 / 손가락 스와이프로 밧줄을 자른다 · R = 재시도 · 별을 스치고 항아리에 담아라</div>

var TR = GameI18n.t;
function TX(key, vals) {
  return TR(key).replace(/\{(\w+)\}/g, function (m, name) { return vals[name]; });
}

var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var VW = cv.width, VH = cv.height;
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist2(ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }

/* ── 물리 상수 — 고정 dt 어큐뮬레이터 + Verlet 밧줄 ── */
var DT = 1 / 60, DTDT = DT * DT;
var GRAV = 900;            // px/s²
var RELAX = 4;             // 제약 이완 반복 횟수
var SEG_LEN = 16;          // 밧줄 마디 목표 길이(px)
var DAMP_ROPE = 0.99, DAMP_CANDY = 0.999;
var CANDY_R = 14, CANDY_W = 0.12;   // 사탕 반지름 / 제약에서 사탕이 움직이는 비중(무거움)
var REST = 0.78;           // 범퍼 반발 계수
var REST_RIM = 0.22;       // 항아리 테두리 반발 — 아슬한 근접 실수를 튕겨내지 않고 흘려 담는다
var JAR_Y = 412;           // 항아리 주둥이 y (전 레벨 공통)
var STUCK_LIMIT = 10;      // 모든 밧줄 절단 후 미착지 제한(초)

/* ── 레벨 데이터 — c:사탕, r:밧줄 앵커들, j:항아리{x,amp,spd}, st:별3, w:바람존, b:범퍼, sp:가시 ── */
var LV = [
  /* 1 튜토리얼: 수직 낙하 */
  { c: [430, 190], r: [[430, 60]], j: { x: 430 },
    st: [[430, 265], [430, 325], [430, 382]] },
  /* 2 진자: 오른쪽 스윙 타이밍 */
  { c: [330, 180], r: [[430, 55]], j: { x: 545 },
    st: [[505, 255], [540, 320], [555, 385]] },
  /* 3 두 가닥 V: 둘 다 끊기 */
  { c: [430, 185], r: [[310, 60], [550, 60]], j: { x: 430 },
    st: [[430, 258], [430, 320], [430, 382]] },
  /* 4 순서: 왼쪽 먼저 → 오른쪽 진자 → 우측 투척 */
  { c: [300, 200], r: [[300, 70], [520, 70]], j: { x: 640 },
    st: [[395, 290], [470, 322], [600, 360]] },
  /* 5 움직이는 항아리 입문 */
  { c: [430, 180], r: [[430, 55]], j: { x: 430, amp: 120, spd: 0.9 },
    st: [[430, 258], [430, 320], [430, 380]] },
  /* 6 두 가닥 + 이동 항아리 */
  { c: [430, 170], r: [[310, 55], [550, 55]], j: { x: 430, amp: 140, spd: 1.1 },
    st: [[430, 250], [430, 315], [430, 380]] },
  /* 7 세 가닥 */
  { c: [430, 200], r: [[250, 60], [430, 50], [610, 60]], j: { x: 430 },
    st: [[430, 268], [430, 330], [430, 385]] },
  /* 8 바람 입문: 우풍이 낙하를 휘게 한다 */
  { c: [300, 160], r: [[300, 50]], j: { x: 395 },
    w: [{ x: 180, y: 180, w: 520, h: 240, f: 650 }],
    st: [[318, 245], [348, 320], [380, 385]] },
  /* 9 좌풍 + 살짝 움직이는 항아리 */
  { c: [560, 170], r: [[640, 55]], j: { x: 485, amp: 60, spd: 1 },
    w: [{ x: 160, y: 200, w: 440, h: 230, f: -600 }],

  { c: [300, 160], r: [[300, 50]], j: { x: 350, amp: 100, spd: 1.3 },

  { c: [470, 150], r: [[470, 50]], j: { x: 640 }, b: [[445, 330, 28]],

  { c: [430, 150], r: [[430, 50]], j: { x: 250 }, b: [[460, 320, 26]],

  { c: [430, 160], r: [[430, 50]], j: { x: 430, amp: 130, spd: 1.4 },
    sp: [[250, 300, 110, 16], [500, 300, 110, 16]],
    st: [[430, 245], [430, 355], [430, 395]] },
  /* 16 강한 좌풍 + 발밑 가시: 직하하면 죽는다 */
  { c: [560, 160], r: [[560, 50]], j: { x: 370 }, sp: [[430, 394, 130, 18]],

  /* 17 진자 + 바람 + 이동 항아리 */
  { c: [330, 180], r: [[430, 55]], j: { x: 610, amp: 80, spd: 1.2 },
    w: [{ x: 380, y: 220, w: 380, h: 200, f: 450 }],
    st: [[520, 270], [575, 340], [660, 390]] },
  /* 18 세 가닥 + 가시 틈 + 느린 항아리 */
  { c: [430, 190], r: [[260, 55], [430, 45], [600, 55]], j: { x: 430, amp: 60, spd: 1 },
    sp: [[240, 320, 130, 16], [490, 320, 130, 16]],
    st: [[430, 258], [430, 360], [430, 400]] },
  /* 19 핀볼 + 가시 + 이동 항아리 */
  { c: [560, 150], r: [[560, 50]], j: { x: 450, amp: 50, spd: 1.1 },
    b: [[590, 320, 26]], sp: [[490, 394, 110, 18]],
    st: [[560, 230], [524, 330], [470, 385]] },
  /* 20 최종: 순서 + 바람 + 가시 + 범퍼 + 이동 항아리 */
  { c: [300, 190], r: [[300, 60], [520, 70]], j: { x: 640, amp: 110, spd: 1.5 },
    w: [{ x: 300, y: 200, w: 400, h: 220, f: 350 }],
    sp: [[200, 394, 150, 18]], b: [[370, 350, 22]],
    st: [[395, 290], [470, 318], [505, 385]] },
];
var HINTS = { 0: 'hintCut', 1: 'hintSwing', 2: 'hintMulti', 3: 'hintOrder', 4: 'hintJar',
              7: 'hintWind', 10: 'hintBumper', 12: 'hintSpike' };

/* ── 진행 저장 (localStorage) ── */
var PROG_KEY = 'ropeWorksProg';
function loadProg() {
  var p = null;
  try { p = JSON.parse(localStorage.getItem(PROG_KEY)); } catch (e) { p = null; }
  if (!p || !p.stars || p.stars.length !== LV.length) {
    p = { stars: [] };
    for (var i = 0; i < LV.length; i++) p.stars.push(-1);
  }
  return p;
}
function saveProg(p) { try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) {} }
var PROG = loadProg();
function clearedCount() { var n = 0, i; for (i = 0; i < PROG.stars.length; i++) if (PROG.stars[i] >= 0) n++; return n; }
function totalStars() { var n = 0, i; for (i = 0; i < PROG.stars.length; i++) if (PROG.stars[i] > 0) n += PROG.stars[i]; return n; }
function progScore() { return clearedCount() * 500 + totalStars() * 200; }
function unlocked(i) { return i === 0 || PROG.stars[i - 1] >= 0; }

/* ── 상태 ── */
var G = null, state = 'menu', shake = 0, bannerT = 0, P = [], TRAIL = [];
var cutting = false, cutId = -1, lastP = null;

function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

/* ── 레벨 구성: 앵커→사탕을 마디 ~16px Verlet 체인으로 잇는다 ── */
function buildRope(ax, ay, tx, ty) {
  var len = Math.sqrt(dist2(ax, ay, tx, ty));
  var n = Math.max(3, Math.round(len / SEG_LEN));   // 내부 점 개수 (마지막 마디는 사탕과 연결)
  var pts = [], i, t;
  for (i = 0; i < n; i++) {
    t = i / n;
    pts.push({ x: ax + (tx - ax) * t, y: ay + (ty - ay) * t,
               px: ax + (tx - ax) * t, py: ay + (ty - ay) * t, pin: i === 0 });
  }
  return { pts: pts, rest: len / n };
}
function buildLevel(li) {
  var L = LV[li], i;
  var g = { li: li, t: 0, caught: false, starsGot: 0, cutAllT: -1,
            candy: { x: L.c[0], y: L.c[1], px: L.c[0], py: L.c[1], rot: 0 },
            ropes: [], chains: [], stars: [], jar: { cx: L.j.x, x: L.j.x, amp: L.j.amp || 0, spd: L.j.spd || 0 },
            wind: L.w || [], bumpers: [], spikes: L.sp || [] };
  for (i = 0; i < L.r.length; i++) g.ropes.push(buildRope(L.r[i][0], L.r[i][1], L.c[0], L.c[1]));
  for (i = 0; i < L.st.length; i++) g.stars.push({ x: L.st[i][0], y: L.st[i][1], got: false });
  if (L.b) for (i = 0; i < L.b.length; i++) g.bumpers.push({ x: L.b[i][0], y: L.b[i][1], r: L.b[i][2], hit: 0 });
  return g;
}

/* ── Verlet 적분 + 제약 이완 ── */
function windAt(x, y) {
  var i, w, fx = 0;
  for (i = 0; i < G.wind.length; i++) {
    w = G.wind[i];
    if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) fx += w.f;
  }
  return fx;
}
function verlet(p, ax, ay, damp) {
  if (p.pin) return;
  var nx = p.x + (p.x - p.px) * damp + ax * DTDT;
  var ny = p.y + (p.y - p.py) * damp + ay * DTDT;
  p.px = p.x; p.py = p.y; p.x = nx; p.y = ny;
}
function solvePair(a, b, rest, bw) {
  var dx = b.x - a.x, dy = b.y - a.y;
  var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
  var diff = (d - rest) / d;
  var wa = a.pin ? 0 : (b.pin ? 1 : (bw === undefined ? 0.5 : 1 - bw));
  var wb = b.pin ? 0 : (a.pin ? 1 : (bw === undefined ? 0.5 : bw));
  a.x += dx * diff * wa; a.y += dy * diff * wa;
  b.x -= dx * diff * wb; b.y -= dy * diff * wb;
}
function relaxChain(pts, rest, endBody, endW) {
  var i;
  for (i = 0; i < pts.length - 1; i++) solvePair(pts[i], pts[i + 1], rest);
  if (endBody && pts.length) solvePair(pts[pts.length - 1], endBody, rest, endW);
}
function collideCircle(c, bx, by, br, rest) {
  var dx = c.x - bx, dy = c.y - by;
  var d = Math.sqrt(dx * dx + dy * dy);
  var rr = br + CANDY_R;
  if (d >= rr || d === 0) return false;
  var nx = dx / d, ny = dy / d;
  var vx = c.x - c.px, vy = c.y - c.py;
  c.x = bx + nx * rr; c.y = by + ny * rr;
  var vn = vx * nx + vy * ny;
  if (vn < 0) { vx -= (1 + rest) * vn * nx; vy -= (1 + rest) * vn * ny; }
  c.px = c.x - vx; c.py = c.y - vy;
  return true;
}

/* ── 스와이프 절단: 이동 선분 × 밧줄 마디 선분 교차 판정 ── */
function segX(ax, ay, bx, by, cx2, cy2, dx2, dy2) {
  var d = (bx - ax) * (dy2 - cy2) - (by - ay) * (dx2 - cx2);
  if (d === 0) return false;
  var t = ((cx2 - ax) * (dy2 - cy2) - (cy2 - ay) * (dx2 - cx2)) / d;
  var u = ((cx2 - ax) * (by - ay) - (cy2 - ay) * (bx - ax)) / d;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}
function checkCut(x1, y1, x2, y2) {
  var ri, i, r, a, b, n;
  for (ri = G.ropes.length - 1; ri >= 0; ri--) {
    r = G.ropes[ri]; n = r.pts.length;
    for (i = 0; i < n; i++) {
      a = r.pts[i];
      b = i < n - 1 ? r.pts[i + 1] : G.candy;
      if (segX(x1, y1, x2, y2, a.x, a.y, b.x, b.y)) { doCut(ri, i); break; }
    }
  }
}
function doCut(ri, i) {
  var r = G.ropes[ri], n = r.pts.length;
  var mx = (r.pts[i].x + (i < n - 1 ? r.pts[i + 1].x : G.candy.x)) / 2;
  var my = (r.pts[i].y + (i < n - 1 ? r.pts[i + 1].y : G.candy.y)) / 2;
  G.ropes.splice(ri, 1);
  G.chains.push({ pts: r.pts.slice(0, i + 1), rest: r.rest, toCandy: false });     // 앵커 쪽 잔여
  if (i < n - 1) G.chains.push({ pts: r.pts.slice(i + 1), rest: r.rest, toCandy: true });  // 사탕 쪽 잔여
  burst(mx, my, '#b08d57', 8, 110);
  burst(mx, my, '#0ea5e9', 5, 90);
  buzz(12);
  if (!G.ropes.length) G.cutAllT = G.t;
}

/* ── 파티클 ── */
function burst(x, y, color, n, spd) {
  var i, a, s;
  for (i = 0; i < n; i++) {
    a = Math.random() * Math.PI * 2; s = spd * (0.35 + Math.random() * 0.85);
    P.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
             color: color, size: 2 + Math.random() * 3, grav: 200 });
  }
}
function popText(x, y, text, color) { P.push({ x: x, y: y, vx: 0, vy: -28, life: 1, text: text, color: color, grav: 0 }); }
function ringFx(x, y, color, r) { P.push({ x: x, y: y, vx: 0, vy: 0, life: 1, ring: r, color: color, grav: 0 }); }

function banner(text) {
  var el = $('banner');
  var long = text.length > 22;
  el.textContent = text;
  el.style.fontSize = long ? '16px' : '24px';
  el.classList.add('on');
  bannerT = long ? 2400 : 1400;
}

/* ── 시뮬레이션 스텝 (고정 dt) ── */
function step() {
  var i, j, r, c = G.candy, jar = G.jar;
  G.t += DT;
  jar.x = jar.cx + (jar.amp ? Math.sin(G.t * jar.spd) * jar.amp : 0);

  if (!G.caught) {
    verlet(c, windAt(c.x, c.y), GRAV, DAMP_CANDY);
    for (i = 0; i < G.ropes.length; i++) {
      r = G.ropes[i];
      for (j = 0; j < r.pts.length; j++) verlet(r.pts[j], windAt(r.pts[j].x, r.pts[j].y) * 0.35, GRAV, DAMP_ROPE);
    }
    for (i = 0; i < G.chains.length; i++) {
      r = G.chains[i];
      for (j = 0; j < r.pts.length; j++) verlet(r.pts[j], windAt(r.pts[j].x, r.pts[j].y) * 0.35, GRAV, DAMP_ROPE);
    }
    for (i = 0; i < RELAX; i++) {
      for (j = 0; j < G.ropes.length; j++) relaxChain(G.ropes[j].pts, G.ropes[j].rest, c, CANDY_W);
      for (j = 0; j < G.chains.length; j++)
        relaxChain(G.chains[j].pts, G.chains[j].rest, G.chains[j].toCandy ? c : null, 0.06);
    }

    // 충돌: 레벨 범퍼 + 항아리 테두리
    for (i = 0; i < G.bumpers.length; i++) {
      var b = G.bumpers[i];
      if (collideCircle(c, b.x, b.y, b.r, REST)) { b.hit = 1; burst(c.x, c.y, '#0ea5e9', 6, 130); buzz(10); }
      if (b.hit > 0) b.hit = Math.max(0, b.hit - DT * 4);
    }
    collideCircle(c, jar.x - 44, JAR_Y + 4, 6, REST_RIM);
    collideCircle(c, jar.x + 44, JAR_Y + 4, 6, REST_RIM);

    c.rot += (c.x - c.px) * 0.004;

    // 별 수집
    for (i = 0; i < G.stars.length; i++) {
      var s = G.stars[i];
      if (!s.got && dist2(c.x, c.y, s.x, s.y) < 30 * 30) {
        s.got = true; G.starsGot++;
        burst(s.x, s.y, '#eab308', 12, 140); ringFx(s.x, s.y, '#eab308', 30);
        popText(s.x, s.y - 18, '⭐', '#eab308');
      }
    }
    // 착지 판정 (항아리 주둥이)
    var vy = (c.y - c.py) / DT;
    if (Math.abs(c.x - jar.x) < 32 && c.y > JAR_Y - 6 && c.y < JAR_Y + 22 && vy > -20) { doCatch(); return; }
    // 가시
    for (i = 0; i < G.spikes.length; i++) {
      var sp = G.spikes[i];
      var nx = clamp(c.x, sp[0], sp[0] + sp[2]), ny = clamp(c.y, sp[1], sp[1] + sp[3]);
      if (dist2(c.x, c.y, nx, ny) < (CANDY_R - 3) * (CANDY_R - 3)) { doFail('failSpike'); return; }
    }
    // 화면 밖 / 정지 시간 초과
    if (c.x < -40 || c.x > VW + 40 || c.y > VH + 40) { doFail('failOut'); return; }
    if (!G.ropes.length && G.cutAllT >= 0 && G.t - G.cutAllT > STUCK_LIMIT) { doFail('failStuck'); return; }
  }
}

function doCatch() {
  G.caught = true;
  state = 'catch';
  burst(G.jar.x, JAR_Y, '#0ea5e9', 22, 170);
  burst(G.jar.x, JAR_Y - 8, '#eab308', 12, 130);
  ringFx(G.jar.x, JAR_Y, '#22c55e', 50);
  buzz(30);
  setTimeout(showClear, 750);
}
function doFail(reasonKey) {
  state = 'fail';
  shake = 8;
  burst(G.candy.x, clamp(G.candy.y, 0, VH), '#ef4444', 18, 170);
  buzz(80);
  $('failDesc').textContent = TR(reasonKey);
  $('failPanel').hidden = false;
}
function showClear() {
  var li = G.li, got = G.starsGot;
  var oldScore = progScore();
  if (got > PROG.stars[li]) { PROG.stars[li] = got; saveProg(PROG); }
  var newScore = progScore();
  var detail = '레벨 ' + clearedCount() + '/20 ⭐' + totalStars();
  var submitted = null;
  if (newScore > oldScore) submitted = GameRank.submit('rope-works', newScore, detail);

  if (li === LV.length - 1) {   // 최종 레벨 → 종료 패널
    state = 'end';
    $('hud').hidden = true; $('bar').hidden = true;
    $('endDesc').textContent = TX('endDesc', { s: totalStars(), sc: newScore });
    $('endPanel').hidden = false;
    if (submitted) submitted.then(function (r) {
      if (r && r.applied) $('endDesc').textContent += TX('rankMsg', { n: r.rank });
    });
    return;
  }
  state = 'clear';
  var stars = '';
  for (var i = 0; i < 3; i++) stars += i < got ? '★' : '☆';
  $('clearTitle').textContent = TX('clearTitle', { n: li + 1 });
  $('starRow').textContent = stars;
  $('clearDesc').textContent = TX('clearDesc', { s: got, sc: newScore });
  $('clearPanel').hidden = false;
  if (submitted) submitted.then(function (r) {
    if (r && r.applied) $('clearDesc').textContent += TX('rankMsg', { n: r.rank });
  });
}

/* ── 배경 (한 번 그려 캐시) ── */
var seed = 20260806;
function srnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
var bgCv = null;
function buildBg() {
  bgCv = document.createElement('canvas'); bgCv.width = VW; bgCv.height = VH;
  var g = bgCv.getContext('2d'), i, x, y;
  seed = 20260806;
  g.fillStyle = '#0c1424'; g.fillRect(0, 0, VW, VH);
  var grd = g.createRadialGradient(VW / 2, VH * 0.42, 80, VW / 2, VH * 0.42, 560);
  grd.addColorStop(0, 'rgba(26,34,56,.55)'); grd.addColorStop(1, 'rgba(12,20,36,0)');
  g.fillStyle = grd; g.fillRect(0, 0, VW, VH);
  for (i = 0; i < 120; i++) {                              // 먼지 같은 잔별
    x = srnd() * VW; y = srnd() * VH;
    g.fillStyle = 'rgba(221,230,242,' + (0.03 + srnd() * 0.08).toFixed(3) + ')';
    g.fillRect(x, y, srnd() < 0.2 ? 2 : 1, 1);
  }
  g.fillStyle = '#1a2238'; g.fillRect(0, 0, VW, 26);        // 천장 들보
  g.fillStyle = '#2c3550'; g.fillRect(0, 24, VW, 3);
  for (x = 20; x < VW; x += 60) { g.fillStyle = '#222b44'; g.fillRect(x, 5, 6, 16); }
  g.fillStyle = '#1a2238'; g.fillRect(0, VH - 12, VW, 12);  // 바닥선
  g.fillStyle = '#2c3550'; g.fillRect(0, VH - 12, VW, 2);
}

/* ── 렌더 ── */
function drawStarShape(g, x, y, r, rot, fill, stroke) {
  var i, a, rad;
  g.beginPath();
  for (i = 0; i < 10; i++) {
    a = rot + i * Math.PI / 5 - Math.PI / 2;
    rad = i % 2 === 0 ? r : r * 0.45;
    if (i === 0) g.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    else g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); }
}
function drawChainLine(pts, tail) {
  var i;
  if (!pts.length && !tail) return;
  cx.beginPath();
  if (pts.length) {
    cx.moveTo(pts[0].x, pts[0].y);
    for (i = 1; i < pts.length; i++) cx.lineTo(pts[i].x, pts[i].y);
    if (tail) cx.lineTo(tail.x, tail.y);
  }
  cx.strokeStyle = '#3b2f1f'; cx.lineWidth = 4.5; cx.stroke();
  cx.strokeStyle = '#b08d57'; cx.lineWidth = 2; cx.stroke();
}
function drawJar(now) {
  var jar = G.jar, x = jar.x, y = JAR_Y, t = now / 1000;
  var pulse = 0.5 + Math.sin(t * 2.4) * 0.2;
  cx.fillStyle = 'rgba(14,165,233,' + (0.1 * pulse + 0.06).toFixed(3) + ')';
  cx.beginPath(); cx.arc(x, y + 18, 56, 0, 7); cx.fill();
  cx.beginPath();                                           // 항아리 몸통
  cx.moveTo(x - 34, y);
  cx.bezierCurveTo(x - 50, y + 18, x - 46, y + 44, x - 28, y + 56);
  cx.lineTo(x + 28, y + 56);
  cx.bezierCurveTo(x + 46, y + 44, x + 50, y + 18, x + 34, y);
  cx.closePath();
  cx.fillStyle = '#1a2238'; cx.fill();
  cx.strokeStyle = '#2c3550'; cx.lineWidth = 3; cx.stroke();
  drawStarShape(cx, x, y + 32, 9, 0, null, null);           // 문양
  cx.strokeStyle = 'rgba(14,165,233,.5)'; cx.lineWidth = 1.5; cx.stroke();
  cx.beginPath(); cx.ellipse(x, y, 34, 9, 0, 0, 7);         // 주둥이
  cx.fillStyle = '#0c1424'; cx.fill();
  cx.strokeStyle = 'rgba(14,165,233,.75)'; cx.lineWidth = 2; cx.stroke();
  var wx = x + Math.sin(t * 2) * 7, wy = y - 17 - Math.sin(t * 3.1) * 4;   // 정령 위습
  cx.fillStyle = 'rgba(127,216,255,.65)';
  cx.beginPath(); cx.arc(wx, wy, 3.2, 0, 7); cx.fill();
  cx.fillStyle = 'rgba(127,216,255,.22)';
  cx.beginPath(); cx.arc(wx, wy, 7, 0, 7); cx.fill();
}
function draw(now) {
  var i, j, ox = shake ? (Math.random() - 0.5) * shake : 0, oy = shake ? (Math.random() - 0.5) * shake : 0;
  cx.save(); cx.translate(ox, oy);
  cx.drawImage(bgCv, 0, 0);
  if (!G) { cx.restore(); return; }

  for (i = 0; i < G.wind.length; i++) {                     // 바람 존
    var w = G.wind[i], sgn = w.f > 0 ? 1 : -1;
    cx.fillStyle = 'rgba(14,165,233,.055)';
    cx.fillRect(w.x, w.y, w.w, w.h);
    cx.strokeStyle = 'rgba(14,165,233,.35)'; cx.lineWidth = 2;
    for (j = 0; j < 6; j++) {
      var ax2 = w.x + ((now * 0.09 * sgn + j * (w.w / 6) + w.w * 4) % w.w);
      var ay2 = w.y + 20 + (j % 3) * (w.h - 40) / 2;
      cx.beginPath();
      cx.moveTo(ax2 - 12 * sgn, ay2); cx.lineTo(ax2 + 10 * sgn, ay2);
      cx.lineTo(ax2 + 3 * sgn, ay2 - 5); cx.moveTo(ax2 + 10 * sgn, ay2); cx.lineTo(ax2 + 3 * sgn, ay2 + 5);
      cx.stroke();
    }
  }
  var Ldata = LV[G.li];
  for (i = 0; i < Ldata.r.length; i++) {                    // 앵커 고리
    var an = Ldata.r[i];
    cx.fillStyle = '#2c3550'; cx.fillRect(an[0] - 10, an[1] - 8, 20, 10);
    cx.fillStyle = '#222b44'; cx.fillRect(an[0] - 10, an[1] - 8, 20, 3);
    cx.beginPath(); cx.arc(an[0], an[1] + 2, 4, 0, 7);
    cx.strokeStyle = '#8a94ac'; cx.lineWidth = 2; cx.stroke();
  }
  for (i = 0; i < G.spikes.length; i++) {                   // 가시
    var sp = G.spikes[i], sx = sp[0], sy = sp[1], sw = sp[2], sh = sp[3];
    cx.fillStyle = '#1a2238'; cx.fillRect(sx, sy + sh - 5, sw, 5);
    cx.fillStyle = '#ef4444';
    cx.beginPath();
    for (j = 0; j < Math.floor(sw / 14); j++) {
      var tx = sx + j * 14;
      cx.moveTo(tx, sy + sh); cx.lineTo(tx + 7, sy); cx.lineTo(tx + 14, sy + sh);
    }
    cx.closePath(); cx.fill();
    cx.strokeStyle = '#7a1d1d'; cx.lineWidth = 1; cx.stroke();
  }
  for (i = 0; i < G.bumpers.length; i++) {                  // 범퍼
    var b = G.bumpers[i], br = b.r + b.hit * 4;
    cx.beginPath(); cx.arc(b.x, b.y, br, 0, 7);
    cx.fillStyle = '#222b44'; cx.fill();
    cx.strokeStyle = b.hit > 0 ? '#7fd8ff' : '#0ea5e9'; cx.lineWidth = 3; cx.stroke();
    cx.beginPath(); cx.arc(b.x, b.y, br * 0.45, 0, 7);
    cx.strokeStyle = 'rgba(14,165,233,.45)'; cx.lineWidth = 1.5; cx.stroke();
  }
  drawJar(now);
  for (i = 0; i < G.stars.length; i++) {                    // 수집 별
    var s = G.stars[i];
    if (s.got) continue;
    var pl = 1 + Math.sin(now / 260 + i * 2) * 0.12;
    cx.fillStyle = 'rgba(234,179,8,.14)';
    cx.beginPath(); cx.arc(s.x, s.y, 17 * pl, 0, 7); cx.fill();
    drawStarShape(cx, s.x, s.y, 11 * pl, now / 900, '#eab308', '#0c1424');
  }
  for (i = 0; i < G.chains.length; i++)                     // 잘린 잔여 밧줄
    drawChainLine(G.chains[i].pts, G.chains[i].toCandy ? G.candy : null);
  for (i = 0; i < G.ropes.length; i++)                      // 연결된 밧줄
    drawChainLine(G.ropes[i].pts, G.candy);
  if (!G.caught) {                                          // 별사탕
    var c = G.candy;
    cx.fillStyle = 'rgba(234,179,8,.16)';
    cx.beginPath(); cx.arc(c.x, c.y, CANDY_R + 8, 0, 7); cx.fill();
    drawStarShape(cx, c.x, c.y, CANDY_R + 2, c.rot, '#eab308', '#3b2f1f');
    drawStarShape(cx, c.x - 2, c.y - 2, (CANDY_R + 2) * 0.42, c.rot, '#fde68a', null);
  }
  for (i = 0; i < P.length; i++) {                          // 파티클
    var pa = P[i];
    cx.globalAlpha = clamp(pa.life, 0, 1);
    if (pa.ring) {
      cx.strokeStyle = pa.color; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(pa.x, pa.y, pa.ring * (1.25 - pa.life), 0, 7); cx.stroke();
    } else if (pa.text) {
      cx.font = 'bold 13px monospace'; cx.textAlign = 'center';
      cx.fillStyle = '#000'; cx.fillText(pa.text, pa.x + 1, pa.y + 1);
      cx.fillStyle = pa.color; cx.fillText(pa.text, pa.x, pa.y);
    } else {
      cx.fillStyle = pa.color; cx.fillRect(pa.x, pa.y, pa.size, pa.size);
    }
    cx.globalAlpha = 1;
  }
  for (i = 1; i < TRAIL.length; i++) {                      // 스와이프 궤적
    var t0 = TRAIL[i - 1], t1 = TRAIL[i];
    if (t1.life <= 0 || t1.gap) continue;
    cx.strokeStyle = 'rgba(14,165,233,' + (t1.life * 0.8).toFixed(3) + ')';
    cx.lineWidth = 2.5 * t1.life;
    cx.beginPath(); cx.moveTo(t0.x, t0.y); cx.lineTo(t1.x, t1.y); cx.stroke();
  }
  cx.restore();

  $('lvTxt').textContent = TX('hudLv', { n: G.li + 1 });
  $('stTxt').textContent = TX('hudSt', { n: G.starsGot });
  $('scTxt').textContent = TX('hudSc', { sc: progScore() });
}

/* ── 파티클/이펙트 시간 진행 ── */
function fxTick(dt) {
  var i;
  for (i = P.length - 1; i >= 0; i--) {
    var pa = P[i];
    pa.x += pa.vx * dt; pa.y += pa.vy * dt;
    pa.vy += (pa.grav || 0) * dt;
    pa.life -= dt * (pa.text ? 1.0 : pa.ring ? 2.6 : 2.0);
    if (pa.life <= 0) P.splice(i, 1);
  }
  for (i = TRAIL.length - 1; i >= 0; i--) {
    TRAIL[i].life -= dt * 3.2;
    if (TRAIL[i].life <= 0) TRAIL.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * 26);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}

/* ── 입력 ── */
function canvasPoint(ev) {
  var r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (VW / r.width), y: (ev.clientY - r.top) * (VH / r.height) };
}
cv.addEventListener('pointerdown', function (ev) {
  if (state !== 'play') return;
  ev.preventDefault();
  cutting = true; cutId = ev.pointerId;
  lastP = canvasPoint(ev);
  TRAIL.push({ x: lastP.x, y: lastP.y, life: 1, gap: true });   // 새 스와이프 시작 — 이전 궤적과 연결 금지
});
cv.addEventListener('pointermove', function (ev) {
  if (!cutting || ev.pointerId !== cutId || state !== 'play') return;
  ev.preventDefault();
  var p = canvasPoint(ev);
  checkCut(lastP.x, lastP.y, p.x, p.y);
  TRAIL.push({ x: p.x, y: p.y, life: 1 });
  lastP = p;
});
function endSwipe(ev) { if (ev.pointerId === cutId) { cutting = false; cutId = -1; } }
cv.addEventListener('pointerup', endSwipe);
cv.addEventListener('pointercancel', endSwipe);
cv.addEventListener('pointerleave', endSwipe);
window.addEventListener('keydown', function (ev) {
  if (ev.code === 'KeyR' && (state === 'play' || state === 'fail')) { ev.preventDefault(); retryLevel(); }
  else if (ev.code === 'Escape' && state !== 'menu') showMenu();
});

/* ── 화면 전환 ── */
function hidePanels() {
  $('menu').hidden = true; $('failPanel').hidden = true;
  $('clearPanel').hidden = true; $('endPanel').hidden = true;
}
function startLevel(li) {
  G = buildLevel(li);
  P = []; TRAIL = []; cutting = false;
  state = 'play';
  hidePanels();
  $('hud').hidden = false; $('bar').hidden = false;
  banner(HINTS[li] !== undefined
    ? TX('lvBanner', { n: li + 1 }) + ' — ' + TR(HINTS[li])
    : TX('lvBanner', { n: li + 1 }));
}
function retryLevel() { if (G) startLevel(G.li); }
function showMenu() {
  state = 'menu'; G = null;
  hidePanels();
  $('hud').hidden = true; $('bar').hidden = true;
  $('banner').classList.remove('on'); bannerT = 0;
  $('progTxt').textContent = TX('progTxt', { n: clearedCount(), s: totalStars(), sc: progScore() });
  buildGrid();
  $('menu').hidden = false;
}
function buildGrid() {
  var grid = $('levelGrid'), i;
  grid.innerHTML = '';
  for (i = 0; i < LV.length; i++) {
    var btn = document.createElement('button');
    var open = unlocked(i), st = PROG.stars[i];
    var line = '';
    if (st > 0) { for (var k = 0; k < st; k++) line += '★'; }
    else if (st === 0) line = '·';
    btn.innerHTML = (open ? (i + 1) : '🔒') + '<span class="st">' + line + '</span>';
    btn.disabled = !open;
    if (open) btn.onclick = (function (li) { return function () { startLevel(li); }; })(i);
    grid.appendChild(btn);
  }
}
function firstOpenLevel() {
  for (var i = 0; i < LV.length; i++) if (PROG.stars[i] < 0) return i;
  return LV.length - 1;
}
$('startBtn').onclick = function () { startLevel(firstOpenLevel()); };
$('retryBtn').onclick = retryLevel;
$('quitBtn').onclick = showMenu;
$('failRetryBtn').onclick = retryLevel;
$('failMenuBtn').onclick = showMenu;
$('clearRetryBtn').onclick = retryLevel;
$('clearMenuBtn').onclick = showMenu;
$('nextBtn').onclick = function () { if (G) startLevel(Math.min(G.li + 1, LV.length - 1)); };
$('againBtn').onclick = function () { startLevel(0); };
$('backBtn').onclick = showMenu;
$('retryBtn').textContent = TR('retryBtn');
$('quitBtn').textContent = TR('quitBtn');

/* ── 메인 루프: 고정 dt 어큐뮬레이터 ── */
var last = performance.now(), acc = 0;
function loop() {
  requestAnimationFrame(loop);
  var now = performance.now();
  var frame = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (state === 'play') {
    acc += frame;
    while (acc >= DT) { step(); acc -= DT; if (state !== 'play') { acc = 0; break; } }
  } else {
    acc = 0;
  }
  fxTick(frame);
  draw(now);
}
buildBg();
showMenu();
requestAnimationFrame(loop);
</script>

     입력 방식은 게임이 이미 가진 것을 그대로 둔다. -->

GameRank.autoPanel('rope-works');
