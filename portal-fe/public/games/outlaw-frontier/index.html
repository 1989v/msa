<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>황야의 무법자</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#150f0a; color:#f0e4d0; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #3a2a1c; border-radius:10px; overflow:hidden; box-shadow:0 0 50px rgba(0,0,0,.75); }
  canvas { display:block; background:#c9a06a; }
  #hud { position:absolute; top:9px; left:11px; right:11px; display:flex; gap:9px; align-items:center;
         font-size:12px; font-weight:bold; pointer-events:none; text-shadow:1px 1px 0 #000; flex-wrap:wrap; }
  #hud .tag { background:rgba(20,12,6,.62); padding:3px 10px; border-radius:10px; }
  #hud .grow { flex:1; }
  #banner { position:absolute; top:42%; left:0; right:0; text-align:center; font-size:26px; font-weight:bold;
            color:#ffd98a; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .35s; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(21,15,10,.96); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:11px; text-align:center; z-index:10; padding:20px; overflow-y:auto; }
  .panel h1 { color:#ffd98a; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel h2 { color:#ffd98a; font-size:17px; }
  .panel p { font-size:12.5px; color:#d8c8ae; line-height:1.75; max-width:520px; }
  .panel button { background:#d9a441; color:#241a0e; border:0; padding:9px 20px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#3a2a1c; color:#f0e4d0; }
  .panel button:disabled { opacity:.38; cursor:default; }
  .row { display:flex; gap:9px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .card { background:#241a0e; border:1px solid #4a3826; border-radius:8px; padding:9px 12px; font-size:12px;
          display:flex; gap:10px; align-items:center; min-width:290px; justify-content:space-between; }
  .card small { color:#a8967a; font-size:10.5px; }
  #squadList { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:620px; }
  .unitChip { background:#241a0e; border:2px solid #4a3826; border-radius:7px; padding:6px 9px; font-size:11px; cursor:pointer; min-width:96px; }
  .unitChip.sel { border-color:#ffd98a; background:#3a2a1c; }
  .unitChip b { display:block; font-size:12px; }
  .unitChip i { font-style:normal; color:#ffd98a; }
  #saveStatus { font-size:10.5px; color:#a8967a; }
  #info { margin-top:9px; font-size:11px; color:#8a7a63; text-align:center; line-height:1.7; }
  input { background:#241a0e; border:1px solid #4a3826; color:#f0e4d0; border-radius:6px; padding:6px 9px;
          font-family:inherit; font-size:12px; letter-spacing:1px; width:165px; text-transform:uppercase; }

  /* 모바일 — 캔버스를 화면 폭에 맞추고 오버레이 UI 를 키운다 */
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width: 100vw; max-width: 100vw; border-width: 0; border-radius: 0; }
    canvas { width: 100%; height: auto; }
    #info { display: none; }
    #bar button, .panel button { padding: 10px 14px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="840" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="goldTxt"></span>
    <span class="tag" id="zoneTxt"></span>
    <span class="tag" id="squadTxt"></span>
    <span class="grow"></span>
    <span class="tag" id="deathTxt"></span>
  </div>
  <div id="banner"></div>

  <div class="panel" id="menu">
    <h1>🤠 황야의 무법자</h1>
    <p>떠돌이 한 명으로 시작해 <b>무법지대를 서쪽으로 밀고 나간다</b>. 쓰러뜨린 현상범의 현상금으로 동료를 모으고,
       <b>둘을 갈아 넣어 상위 등급을 도박</b>한다. 동료가 죽으면 <b>사망 점수</b>가 쌓이고, 한계를 넘으면 그대로 끝이다.</p>
    <div class="row">
      <div class="card"><span id="dmgTxt"></span><button id="buyDmg">구입</button></div>
    </div>
    <div class="row">
      <div class="card"><span id="hpUpTxt"></span><button id="buyHpUp">구입</button></div>
    </div>
    <div class="row"><span id="bankTxt"></span></div>
    <div id="saveStatus"></div>
    <div class="row">
      <input id="codeInput" placeholder="이어하기 코드" maxlength="18" autocomplete="off">
      <button id="codeLoadBtn" class="ghost">🔑 코드로 불러오기</button>
    </div>
    <div class="row"><span id="codeShow" style="font-size:11px;color:#ffd98a;letter-spacing:2px"></span></div>
    <button id="startBtn">▶ 출발</button>
  </div>

  <div class="panel" id="camp" hidden>
    <h1>🏕 야영지</h1>
    <p id="campDesc"></p>
    <div class="row"><span id="campGold"></span></div>
    <h2>동료</h2>
    <div id="squadList"></div>
    <p style="font-size:11px">합성할 동료 <b>둘</b>을 고르면 등급을 도박한다 — 등급이 높을수록 성공 확률이 오른다.</p>
    <div class="row">
      <button id="recruitBtn">🤝 떠돌이 고용</button>
      <button id="combineBtn" disabled>🎲 합성</button>
      <button id="healBtn">💊 치료</button>
    </div>
    <div class="row"><button id="marchBtn">▶ 서쪽으로</button></div>
  </div>

  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <div class="row">
      <button id="againBtn">🔁 재도전</button>
      <button id="backBtn">야영지로</button>
    </div>
  </div>
</div>
<div id="info">이동 방향키/WASD · 동료는 사거리 안 적을 <b>자동 사격</b> · 야영지에서 고용/합성/치료<br>
  구조물을 부수면 매복이 나온다 — 무리하지 말 것</div>
<script>
'use strict';
const API = '/api/v1/games/outlaw-frontier';
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = cv.width, VH = cv.height;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const nowMs = () => performance.now();
const rnd = () => Math.random();
const ri = n => Math.floor(Math.random() * n);

/* ═══════════ 플랫폼 연동 (세이브 = 서버 + 이어하기 코드) ═══════════ */
const token = () => localStorage.getItem('portal_access_token');
function deviceId() {
  let id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
async function api(path, opt = {}) {
  const headers = { 'Content-Type':'application/json', 'X-Device-Id':deviceId(), ...(opt.headers || {}) };
  const tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
  const res = await fetch(API + path, { ...opt, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.success === false) throw new Error(body?.error?.code || res.status);
  return body.data;
}
const CODE_KEY = 'outlaw_frontier_code', LOCAL_KEY = 'outlaw_frontier_save';
let saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
const fmtCode = c => c ? c.replace(/(.{4})(?=.)/g, '$1-') : '';
let meta = { bank: 0, dmgLv: 0, hpLv: 0, best: 0 };

function showCode() {
  $('codeShow').textContent = saveCode ? '🔑 이어하기 코드  ' + fmtCode(saveCode) : '';
}
async function loadMeta(codeOverride) {
  const code = codeOverride || saveCode;
  if (token() || code) {
    try {
      const s = await api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''));
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (s.data) meta = { bank:0, dmgLv:0, hpLv:0, best:0, ...s.data };
      $('saveStatus').textContent = '☁ 서버 세이브 (v' + saveVersion + ')';
      showCode(); return true;
    } catch (e) {
      $('saveStatus').textContent = '세이브 로드 실패: ' + e.message;
      if (codeOverride) return false;
    }
  }
  try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d) meta = { ...meta, ...d }; } catch (_) {}
  $('saveStatus').textContent = '브라우저 저장 — 저장하면 이어하기 코드가 발급됩니다';
  showCode(); return true;
}
async function persistMeta() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(meta));
  try {
    const s = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
    saveVersion = s.version;
    if (s.code && s.code !== saveCode) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
    $('saveStatus').textContent = '☁ 저장됨 (v' + saveVersion + ')';
    showCode();
  } catch (e) {
    if (e.message === 'INVALID_INPUT') {
      try {
        const re = await api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''));
        saveVersion = re.version;
        const s2 = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
        saveVersion = s2.version;
      } catch (_) {}
    } else $('saveStatus').textContent = '서버 저장 실패(브라우저에는 저장됨)';
  }
}

/* ═══════════ 등급 — 합성으로 올라간다 ═══════════ */
const TIERS = [
  { star:1, name:'떠돌이',       hp:26,  dmg:4,  rate:0.62, range:132, spd:74, color:'#9d8b6f' },
  { star:2, name:'총잡이',       hp:40,  dmg:7,  rate:0.55, range:150, spd:76, color:'#c9a06a' },
  { star:3, name:'명사수',       hp:58,  dmg:11, rate:0.47, range:176, spd:78, color:'#8fb8d6' },
  { star:4, name:'현상금 사냥꾼', hp:82,  dmg:17, rate:0.40, range:196, spd:80, color:'#b58fd6' },
  { star:5, name:'무법자',       hp:118, dmg:26, rate:0.34, range:214, spd:84, color:'#e0913f' },
  { star:6, name:'전설의 건맨',   hp:170, dmg:40, rate:0.27, range:238, spd:88, color:'#ffd54a' },
];

/**
 * 합성 — 동급 둘을 넣어야 한 단계 위를 노릴 수 있고, 등급이 오를수록 성공률이 떨어진다.
 * 실패하면 낮은 쪽 등급만 남고, 대실패면 떠돌이로 되돌아간다 — 상위 합성일수록 잃는 것이 크다.
 */
function combineRoll(a, b) {
  const hi = Math.max(a, b), lo = Math.min(a, b);
  const target = clamp(hi + (a === b ? 1 : 0), 1, 6);
  const p = clamp(0.74 - (target - 2) * 0.11 - (hi - lo) * 0.10, 0.10, 0.80);
  const r = rnd();
  if (r < p * 0.10) return clamp(target + 1, 1, 6);   // 대성공 — 두 단계
  if (r < p) return target;                            // 성공
  if (r < p + 0.30) return lo;                         // 실패 — 낮은 쪽만 남는다
  return 1;                                            // 대실패 — 떠돌이
}

/* ═══════════ 적 ═══════════ */
const FOES = {
  coyote:  { name:'들개',        hp:16,  dmg:3,  spd:88, r:11, bounty:6,   color:'#8a6a44', ai:'chase' },
  bandit:  { name:'산적',        hp:30,  dmg:5,  spd:56, r:12, bounty:14,  color:'#7d5a3a', ai:'shoot', range:150, cd:1.5 },
  brute:   { name:'덩치',        hp:78,  dmg:11, spd:44, r:16, bounty:34,  color:'#6b4630', ai:'chase' },
  dynamite:{ name:'폭약꾼',      hp:26,  dmg:18, spd:100, r:12, bounty:26, color:'#b04a2a', ai:'bomber' },
  sharp:   { name:'저격수',      hp:34,  dmg:13, spd:38, r:12, bounty:40,  color:'#4a5a7a', ai:'shoot', range:250, cd:2.3 },
  boss:    { name:'열차강도 두목', hp:900, dmg:22, spd:46, r:26, bounty:600, color:'#8e2f2f', ai:'boss' },
};
const ZONES = [
  { name:'메마른 초원', bg:'#c9a06a', bg2:'#bd9560', pool:['coyote','coyote','bandit'], n:9 },
  { name:'버려진 광산', bg:'#a8845a', bg2:'#9c7a52', pool:['coyote','bandit','bandit','brute'], n:11 },
  { name:'붉은 협곡',   bg:'#b8724a', bg2:'#a96843', pool:['bandit','brute','dynamite'], n:13 },
  { name:'모래 폭풍',   bg:'#caa878', bg2:'#bd9d6e', pool:['bandit','dynamite','sharp'], n:15 },
  { name:'무법자 소굴', bg:'#8e6a4a', bg2:'#836243', pool:['brute','sharp','dynamite'], n:17 },
  { name:'종착역',      bg:'#7a5540', bg2:'#6f4d3a', pool:['brute','sharp'], n:8, boss:true },
];
const DEATH_LIMIT = 12;

/* ═══════════ 스프라이트 ═══════════ */
const cache = new Map();
function sprite(key, w, h, paint) {
  let c = cache.get(key); if (c) return c;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h); cache.set(key, c); return c;
}
const px = (g, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };

function allySprite(star) {
  const t = TIERS[star - 1];
  return sprite('ally' + star, 26, 30, g => {
    px(g, 6, 27, 14, 3, 'rgba(0,0,0,.32)');
    px(g, 5, 3, 16, 4, '#5a4028');                       // 모자 챙
    px(g, 8, 0, 10, 4, t.color);                         // 모자
    px(g, 8, 7, 10, 7, '#f0c49a');                       // 얼굴
    px(g, 10, 9, 2, 2, '#241a0e'); px(g, 14, 9, 2, 2, '#241a0e');
    px(g, 7, 14, 12, 9, t.color);                        // 상의
    px(g, 7, 19, 12, 4, '#3a2a1c');                      // 벨트
    px(g, 19, 15, 6, 3, '#4a4a52');                      // 총
    px(g, 8, 23, 4, 5, '#4a3524'); px(g, 14, 23, 4, 5, '#4a3524');
    if (star >= 4) { px(g, 4, 14, 3, 9, t.color); }      // 판초
    if (star >= 6) { px(g, 6, 1, 14, 2, '#fff3b0'); }    // 금테
  });
}
function foeSprite(kind) {
  const f = FOES[kind];
  return sprite('foe' + kind, 34, 34, g => {
    px(g, 8, 30, 18, 3, 'rgba(0,0,0,.32)');
    if (kind === 'coyote') {
      px(g, 6, 14, 20, 9, f.color); px(g, 22, 10, 8, 7, f.color);
      px(g, 27, 12, 2, 2, '#ffd54a'); px(g, 21, 7, 3, 4, f.color); px(g, 26, 7, 3, 4, f.color);
      px(g, 7, 22, 4, 6, f.color); px(g, 19, 22, 4, 6, f.color); px(g, 2, 12, 5, 3, f.color);
    } else if (kind === 'boss') {
      px(g, 4, 2, 26, 5, '#3a2118'); px(g, 9, 6, 16, 9, '#e0b48a');
      px(g, 12, 9, 3, 3, '#241a0e'); px(g, 19, 9, 3, 3, '#241a0e');
      px(g, 6, 15, 22, 13, f.color); px(g, 6, 22, 22, 5, '#5a1a1a');
      px(g, 1, 16, 5, 10, f.color); px(g, 28, 16, 5, 10, f.color);
      px(g, 28, 13, 6, 3, '#4a4a52');
    } else {
      px(g, 8, 2, 18, 4, '#3a2a1c'); px(g, 11, 0, 12, 3, f.color);
      px(g, 11, 6, 12, 8, '#e0b48a');
      px(g, 13, 9, 2, 2, '#241a0e'); px(g, 19, 9, 2, 2, '#241a0e');
      px(g, 9, 14, 16, 11, f.color); px(g, 9, 20, 16, 4, '#3a2a1c');
      px(g, 11, 25, 5, 6, '#4a3524'); px(g, 18, 25, 5, 6, '#4a3524');
      if (kind === 'dynamite') { px(g, 25, 15, 5, 8, '#d84a2a'); px(g, 26, 12, 2, 4, '#ffd54a'); }
      if (kind === 'sharp') { px(g, 24, 13, 11, 3, '#4a4a52'); }
      if (kind === 'bandit') { px(g, 24, 16, 7, 3, '#4a4a52'); }
      if (kind === 'brute') { px(g, 6, 13, 22, 13, f.color); }
    }
  });
}
const crateSprite = () => sprite('crate', 30, 30, g => {
  px(g, 5, 27, 20, 3, 'rgba(0,0,0,.3)');
  px(g, 3, 8, 24, 19, '#8d5a35'); px(g, 3, 13, 24, 3, '#6f4527'); px(g, 3, 21, 24, 3, '#6f4527');
  px(g, 13, 8, 4, 19, '#6f4527');
});
const campSprite = () => sprite('campfire', 34, 34, g => {
  px(g, 6, 28, 22, 3, 'rgba(0,0,0,.3)');
  px(g, 5, 22, 24, 4, '#5a4028'); px(g, 9, 24, 16, 4, '#6f4527');
  px(g, 13, 10, 8, 12, '#ff9a3c'); px(g, 15, 6, 4, 8, '#ffd54a');
});

/* ═══════════ 런 상태 ═══════════ */
let G = null, running = false, run = null;
const keys = new Set();
let shake = 0, bannerT = 0;
const WORLD_W = 3400, WORLD_H = 480;

function mkAlly(star) {
  const t = TIERS[star - 1];
  const hp = Math.round(t.hp * (1 + meta.hpLv * 0.12));
  return { star, x:0, y:0, hp, maxHp:hp, cd:0, hurt:0, id: Math.random().toString(36).slice(2, 8) };
}
const allyDmg = a => Math.round(TIERS[a.star - 1].dmg * (1 + meta.dmgLv * 0.12));

function newRun() {
  G = {
    zone: 0, gold: 0, deaths: 0,
    squad: [mkAlly(1)],
    foes: [], shots: [], parts: [], crates: [], drops: [],
    lead: { x: 90, y: VH / 2 },
    cam: 0, cleared: false, bossDown: false,
  };
  buildZone();
}
function buildZone() {
  const z = ZONES[G.zone];
  G.foes = []; G.shots = []; G.crates = []; G.drops = []; G.cleared = false;
  G.lead = { x: 90, y: VH / 2 };
  G.squad.forEach((a, i) => { a.x = 70 - (i % 3) * 22; a.y = VH / 2 + (i % 5 - 2) * 26; });
  for (let i = 0; i < z.n; i++) {
    const kind = z.pool[ri(z.pool.length)];
    spawnFoe(kind, 420 + rnd() * (WORLD_W - 560), 60 + rnd() * (WORLD_H - 120));
  }
  if (z.boss) spawnFoe('boss', WORLD_W - 180, VH / 2);
  for (let i = 0; i < 4 + ri(3); i++)
    G.crates.push({ x: 360 + rnd() * (WORLD_W - 500), y: 60 + rnd() * (WORLD_H - 120), hp: 12,
      golden: rnd() < 0.08 });                             // 이스터에그 — 황금 마차: 매복 없이 잭팟
  banner('제' + (G.zone + 1) + '구역 — ' + z.name);
}
function spawnFoe(kind, x, y) {
  const f = FOES[kind];
  const scale = 1 + G.zone * 0.16;
  G.foes.push({ kind, x, y, hp: Math.round(f.hp * scale), maxHp: Math.round(f.hp * scale),
    dmg: Math.round(f.dmg * scale), spd: f.spd, r: f.r, bounty: Math.round(f.bounty * (1 + G.zone * 0.1)),
    cd: rnd() * 2, hurt: 0, ai: f.ai, range: f.range || 0, fuse: 0 });
}
function banner(text) { $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1700; }

/* ═══════════ 전투 ═══════════ */
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, s = spd * (0.4 + rnd() * 0.8);
    G.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color, size:2 + rnd()*3 });
  }
}
function popText(x, y, text, color) { G.parts.push({ x, y, vx:0, vy:-30, life:1, text, color }); }

function killFoe(f) {
  G.gold += f.bounty;
  popText(f.x, f.y - 16, '+' + f.bounty + '$', '#ffd98a');
  burst(f.x, f.y, f.kind === 'boss' ? '#ffd54a' : '#c25a3a', f.kind === 'boss' ? 40 : 12, 180);
  if (f.kind === 'boss') { G.bossDown = true; shake = 16; }
  G.foes = G.foes.filter(o => o !== f);
  if (!G.foes.length) { G.cleared = true; banner('구역 정리 완료 — 서쪽 야영지로'); }
}
function hurtAlly(a, dmg, fx, fy) {
  a.hp -= dmg; a.hurt = 0.22;
  burst(a.x, a.y, '#ff6b6b', 6, 110);
  if (a.hp <= 0) {
    G.deaths += Math.max(1, a.star - 1) || 1;
    burst(a.x, a.y, '#ffffff', 16, 150);
    popText(a.x, a.y - 14, '사망!', '#ff6b6b');
    G.squad = G.squad.filter(o => o !== a);
    shake = 11;
    if (!G.squad.length) { endRun('WIPE', '동료가 모두 쓰러졌다.'); return; }
    if (G.deaths >= DEATH_LIMIT) { endRun('DEATH_SCORE', '사망 점수 한계를 넘었다.'); }
  }
}

/* ═══════════ 갱신 ═══════════ */
function update(dt) {
  // 리더 이동 — 나머지는 대형을 따라온다
  let ix = 0, iy = 0;
  if (keys.has('ArrowLeft') || keys.has('a')) ix -= 1;
  if (keys.has('ArrowRight') || keys.has('d')) ix += 1;
  if (keys.has('ArrowUp') || keys.has('w')) iy -= 1;
  if (keys.has('ArrowDown') || keys.has('s')) iy += 1;
  if (ix || iy) { const l = Math.hypot(ix, iy); ix /= l; iy /= l; }
  const L = G.lead;
  L.x = clamp(L.x + ix * 118 * dt, 24, WORLD_W - 24);
  L.y = clamp(L.y + iy * 118 * dt, 30, WORLD_H - 30);

  G.squad.forEach((a, i) => {
    const t = TIERS[a.star - 1];
    const col = i % 3, row = Math.floor(i / 3);
    const tx = L.x - row * 30 - 6, ty = L.y + (col - 1) * 30;
    const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);
    if (d > 4) { const s = Math.min(t.spd * 1.35, d * 5) * dt; a.x += dx / d * s; a.y += dy / d * s; }
    a.hurt = Math.max(0, a.hurt - dt);
    // 자동 사격 — 사거리 안 가장 가까운 적
    a.cd -= dt;
    if (a.cd <= 0) {
      let best = null, bd = t.range * t.range;
      for (const f of G.foes) { const q = (f.x - a.x) ** 2 + (f.y - a.y) ** 2; if (q < bd) { bd = q; best = f; } }
      if (!best) for (const c of G.crates) { const q = (c.x - a.x) ** 2 + (c.y - a.y) ** 2; if (q < bd) { bd = q; best = c; } }
      if (best) {
        a.cd = t.rate;
        const ang = Math.atan2(best.y - a.y, best.x - a.x);
        G.shots.push({ x:a.x, y:a.y, vx:Math.cos(ang)*430, vy:Math.sin(ang)*430, dmg:allyDmg(a), life:1.1, ally:true });
      }
    }
  });

  // 적
  for (const f of [...G.foes]) {
    f.hurt = Math.max(0, f.hurt - dt);
    const near = nearestAlly(f.x, f.y);
    if (!near) break;
    const dx = near.x - f.x, dy = near.y - f.y, d = Math.hypot(dx, dy) || 1;
    if (f.ai === 'chase' || f.ai === 'boss') {
      if (d > f.r + 12) { f.x += dx / d * f.spd * dt; f.y += dy / d * f.spd * dt; }
      else { f.cd -= dt; if (f.cd <= 0) { f.cd = 0.85; hurtAlly(near, f.dmg, f.x, f.y); } }
      if (f.ai === 'boss') {
        f.fuse -= dt;
        if (f.fuse <= 0 && d < 420) {
          f.fuse = 2.6;
          const base = Math.atan2(dy, dx);
          for (let i = -2; i <= 2; i++) {
            const ang = base + i * 0.20;
            G.shots.push({ x:f.x, y:f.y, vx:Math.cos(ang)*250, vy:Math.sin(ang)*250, dmg:f.dmg, life:2.6, ally:false });
          }
        }
      }
    } else if (f.ai === 'shoot') {
      if (d < f.range * 0.6) { f.x -= dx / d * f.spd * dt; f.y -= dy / d * f.spd * dt; }
      else if (d > f.range) { f.x += dx / d * f.spd * dt; f.y += dy / d * f.spd * dt; }
      f.cd -= dt;
      if (f.cd <= 0 && d < f.range) {
        f.cd = FOES[f.kind].cd;
        G.shots.push({ x:f.x, y:f.y, vx:dx/d*300, vy:dy/d*300, dmg:f.dmg, life:2.2, ally:false });
      }
    } else if (f.ai === 'bomber') {                         // 폭약꾼 — 붙어서 자폭
      f.x += dx / d * f.spd * dt; f.y += dy / d * f.spd * dt;
      if (d < f.r + 16) {
        burst(f.x, f.y, '#ff9a3c', 26, 220); shake = 12;
        for (const a of [...G.squad]) if (Math.hypot(a.x - f.x, a.y - f.y) < 62) hurtAlly(a, f.dmg, f.x, f.y);
        G.foes = G.foes.filter(o => o !== f);
        if (!G.foes.length) { G.cleared = true; banner('구역 정리 완료 — 서쪽 야영지로'); }
      }
    }
  }

  // 탄
  for (const s of [...G.shots]) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || s.x < 0 || s.x > WORLD_W) { G.shots = G.shots.filter(o => o !== s); continue; }
    if (s.ally) {
      const f = G.foes.find(o => (o.x - s.x) ** 2 + (o.y - s.y) ** 2 < (o.r + 5) ** 2);
      if (f) { f.hp -= s.dmg; f.hurt = 0.18; burst(s.x, s.y, '#ffd98a', 4, 80);
        G.shots = G.shots.filter(o => o !== s); if (f.hp <= 0) killFoe(f); continue; }
      const c = G.crates.find(o => Math.abs(o.x - s.x) < 15 && Math.abs(o.y - s.y) < 15);
      if (c) { c.hp -= s.dmg; G.shots = G.shots.filter(o => o !== s);
        if (c.hp <= 0) {
          burst(c.x, c.y, c.golden ? '#ffd98a' : '#8d5a35', c.golden ? 26 : 14, 160);
          G.crates = G.crates.filter(o => o !== c);
          if (c.golden) {                                     // 황금 마차 — 무조건 대박
            const g = 80 + ri(80); G.gold += g;
            popText(c.x, c.y - 16, '💰 황금 마차! +' + g + '$', '#ffe08a');
          } else if (rnd() < 0.55) {                          // 구조물은 함정 — 매복이 튀어나온다
            popText(c.x, c.y - 14, '매복!', '#ff6b6b');
            const pool = ZONES[G.zone].pool;
            for (let i = 0; i < 2 + ri(2); i++) spawnFoe(pool[ri(pool.length)], c.x + (rnd()-0.5)*70, c.y + (rnd()-0.5)*70);
          } else { const g = 15 + ri(25); G.gold += g; popText(c.x, c.y - 14, '+' + g + '$', '#ffd98a'); }
        }
        continue; }
    } else {
      const a = G.squad.find(o => (o.x - s.x) ** 2 + (o.y - s.y) ** 2 < 13 ** 2);
      if (a) { G.shots = G.shots.filter(o => o !== s); hurtAlly(a, s.dmg, s.x, s.y); }
    }
  }
  for (const q of [...G.parts]) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 190 * dt; q.life -= dt * (q.text ? 1.05 : 1.8);
    if (q.life <= 0) G.parts = G.parts.filter(o => o !== q);
  }
  // 구역을 비우고 서쪽 끝에 닿으면 야영지
  if (G.cleared && L.x > WORLD_W - 90) openCamp();
  G.cam = clamp(L.x - VW / 2, 0, WORLD_W - VW);
  shake = Math.max(0, shake - dt * 32);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}
function nearestAlly(x, y) {
  let best = null, bd = Infinity;
  for (const a of G.squad) { const q = (a.x - x) ** 2 + (a.y - y) ** 2; if (q < bd) { bd = q; best = a; } }
  return best;
}

/* ═══════════ 렌더 ═══════════ */
function draw() {
  const z = ZONES[G.zone], camX = G.cam + (shake ? (rnd() - 0.5) * shake : 0);
  cx.fillStyle = z.bg; cx.fillRect(0, 0, VW, VH);
  // 바닥 줄무늬 + 원경
  for (let i = Math.floor(camX / 80) * 80; i < camX + VW + 80; i += 80) {
    cx.fillStyle = z.bg2; cx.fillRect(i - camX, 0, 40, VH);
  }
  cx.fillStyle = 'rgba(90,60,35,.20)';
  for (let i = Math.floor(camX / 220) * 220; i < camX + VW + 220; i += 220) {
    const sx = i - camX;
    cx.beginPath(); cx.moveTo(sx, 120); cx.lineTo(sx + 80, 34); cx.lineTo(sx + 160, 120); cx.closePath(); cx.fill();
  }
  cx.fillStyle = 'rgba(0,0,0,.10)'; cx.fillRect(0, 0, VW, 34);
  // 서쪽 끝 야영지 표시
  if (G.cleared) {
    const gx = WORLD_W - 60 - camX;
    cx.drawImage(campSprite(), gx - 17, VH / 2 - 17);
    cx.font = 'bold 12px monospace'; cx.textAlign = 'center'; cx.fillStyle = '#ffd98a';
    cx.fillText('▶ 야영지', gx, VH / 2 - 26);
  }
  for (const c of G.crates) {
    cx.drawImage(crateSprite(), c.x - camX - 15, c.y - 17);
    if (c.golden) {
      cx.fillStyle = 'rgba(255,217,138,.30)'; cx.fillRect(c.x - camX - 15, c.y - 17, 30, 30);
      cx.font = '11px monospace'; cx.textAlign = 'center';
      cx.fillText('✨', c.x - camX + 12, c.y - 14 + Math.sin(nowMs() / 200) * 2);
    }
  }
  // 적
  for (const f of G.foes) {
    const sx = f.x - camX; if (sx < -60 || sx > VW + 60) continue;
    cx.save(); if (f.hurt > 0) cx.filter = 'brightness(2.4)';
    const sc = f.kind === 'boss' ? 2 : 1;
    cx.drawImage(foeSprite(f.kind), sx - 17 * sc, f.y - 20 * sc, 34 * sc, 34 * sc);
    cx.restore();
    if (f.hp < f.maxHp) {
      const w = f.kind === 'boss' ? 90 : 26;
      cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(sx - w/2, f.y - 24 * sc, w, 4);
      cx.fillStyle = '#e05c4a'; cx.fillRect(sx - w/2, f.y - 24 * sc, w * (f.hp / f.maxHp), 4);
    }
  }
  // 동료
  for (const a of G.squad) {
    const sx = a.x - camX;
    cx.save(); if (a.hurt > 0) cx.filter = 'brightness(2.4)';
    cx.drawImage(allySprite(a.star), sx - 13, a.y - 20);
    cx.restore();
    cx.fillStyle = 'rgba(0,0,0,.5)'; cx.fillRect(sx - 13, a.y - 25, 26, 3);
    cx.fillStyle = '#6bd18a'; cx.fillRect(sx - 13, a.y - 25, 26 * (a.hp / a.maxHp), 3);
    cx.font = 'bold 9px monospace'; cx.textAlign = 'center'; cx.fillStyle = '#ffd98a';
    cx.fillText('★'.repeat(a.star), sx, a.y - 28);
  }
  // 탄 / 파티클
  for (const s of G.shots) {
    cx.fillStyle = s.ally ? '#fff3b0' : '#ff9a6a';
    cx.fillRect(s.x - camX - 2, s.y - 2, 5, 3);
  }
  for (const q of G.parts) {
    cx.globalAlpha = clamp(q.life, 0, 1);
    if (q.text) { cx.font = 'bold 13px monospace'; cx.textAlign = 'center'; cx.fillStyle = q.color;
      cx.fillText(q.text, q.x - camX, q.y); }
    else { cx.fillStyle = q.color; cx.fillRect(q.x - camX, q.y, q.size, q.size); }
    cx.globalAlpha = 1;
  }
  // 진행 바
  cx.fillStyle = 'rgba(20,12,6,.5)'; cx.fillRect(VW/2 - 130, VH - 20, 260, 7);
  cx.fillStyle = '#ffd98a'; cx.fillRect(VW/2 - 130, VH - 20, 260 * (G.lead.x / WORLD_W), 7);

  $('goldTxt').textContent = '💰 ' + G.gold + '$';
  $('zoneTxt').textContent = '🏜 ' + (G.zone + 1) + '/' + ZONES.length + ' ' + z.name;
  $('squadTxt').textContent = '🤠 ' + G.squad.length + '명 (' + G.squad.reduce((a, b) => a + b.star, 0) + '★)';
  $('deathTxt').textContent = '💀 ' + G.deaths + '/' + DEATH_LIMIT;
}

/* ═══════════ 야영지 ═══════════ */
let sel = [];
function openCamp() {
  running = false; $('hud').hidden = true; sel = [];
  if (G.bossDown) { endRun('CLEAR', '두목을 쓰러뜨리고 무법지대를 평정했다!'); return; }
  $('campDesc').textContent = '제' + (G.zone + 1) + '구역을 정리했다. 다음은 ' +
    (ZONES[G.zone + 1] ? ZONES[G.zone + 1].name : '종착역') + ' — 준비를 끝내고 떠나자.';
  $('camp').hidden = false;
  renderCamp();
}
const recruitCost = () => 40 + G.squad.length * 26;
const healCost = () => 30 + G.zone * 12;
function renderCamp() {
  $('campGold').textContent = '💰 ' + G.gold + '$    💀 사망 점수 ' + G.deaths + '/' + DEATH_LIMIT;
  const list = $('squadList'); list.innerHTML = '';
  G.squad.forEach(a => {
    const t = TIERS[a.star - 1];
    const el = document.createElement('div');
    el.className = 'unitChip' + (sel.includes(a) ? ' sel' : '');
    el.innerHTML = '<b>' + t.name + '</b><i>' + '★'.repeat(a.star) + '</i>' +
      '<small>HP ' + a.hp + '/' + a.maxHp + ' · 공 ' + allyDmg(a) + '</small>';
    el.onclick = () => {
      if (sel.includes(a)) sel = sel.filter(o => o !== a);
      else if (sel.length < 2) sel.push(a);
      renderCamp();
    };
    list.appendChild(el);
  });
  $('recruitBtn').textContent = '🤝 떠돌이 고용 (' + recruitCost() + '$)';
  $('recruitBtn').disabled = G.gold < recruitCost();
  $('healBtn').textContent = '💊 전원 치료 (' + healCost() + '$)';
  $('healBtn').disabled = G.gold < healCost() || G.squad.every(a => a.hp >= a.maxHp);
  $('combineBtn').disabled = sel.length !== 2;
  $('combineBtn').textContent = sel.length === 2
    ? '🎲 합성 (' + sel.map(a => '★'.repeat(a.star)).join(' + ') + ')' : '🎲 합성 — 둘을 고르세요';
}
$('recruitBtn').onclick = () => {
  if (G.gold < recruitCost()) return;
  G.gold -= recruitCost(); G.squad.push(mkAlly(1)); renderCamp();
};
$('healBtn').onclick = () => {
  if (G.gold < healCost()) return;
  G.gold -= healCost(); G.squad.forEach(a => { a.hp = a.maxHp; }); renderCamp();
};
$('combineBtn').onclick = () => {
  if (sel.length !== 2) return;
  const [a, b] = sel;
  const out = combineRoll(a.star, b.star);
  G.squad = G.squad.filter(o => o !== a && o !== b);
  const born = mkAlly(out);
  G.squad.push(born);
  sel = [];
  const best = Math.max(a.star, b.star);
  banner(out > best ? '🎉 ' + TIERS[out - 1].name + ' 탄생! ' + '★'.repeat(out)
       : out === best ? '— ' + TIERS[out - 1].name + ' ' + '★'.repeat(out)
       : '💥 실패… ' + TIERS[out - 1].name);
  renderCamp();
};
$('marchBtn').onclick = () => {
  $('camp').hidden = true;
  G.zone++;
  if (G.zone >= ZONES.length) { endRun('CLEAR', '무법지대 끝까지 밀어냈다!'); return; }
  buildZone();
  $('hud').hidden = false; running = true;
};

/* ═══════════ 시작/종료 ═══════════ */
async function startRun() {
  $('startBtn').disabled = true;
  try { run = await api('/runs', { method:'POST' }); } catch (_) { run = null; }
  newRun();
  $('menu').hidden = true; $('endPanel').hidden = true; $('camp').hidden = true;
  $('hud').hidden = false; running = true;
  $('startBtn').disabled = false;
}
async function endRun(outcome, desc) {
  running = false; $('hud').hidden = true; $('camp').hidden = true;
  let earned = Math.floor(G.gold * 0.35) + G.zone * 40;
  let extra = '';
  if (outcome === 'CLEAR' && G.deaths === 0) {             // 동료를 하나도 잃지 않았다
    earned = Math.floor(earned * 1.25);
    extra = ' 🏅 무사고 여정 — 보상 +25%!';
    meta.noDeath = (meta.noDeath || 0) + 1;
  }
  meta.bank += earned;
  meta.best = Math.max(meta.best, G.zone + 1);
  GameRank.submit('outlaw-frontier', (G.zone + 1) * 100000 + earned, '제' + (G.zone + 1) + '구역 · ' + earned + '$')
    .then(r => { if (r && r.applied) $('endDesc').textContent += ' 🏆 랭킹 ' + r.rank + '위!'; });
  $('endTitle').textContent = outcome === 'CLEAR' ? '🏆 무법지대 평정!' : '💀 여정 종료';
  $('endDesc').textContent = desc + extra + ' 제' + (G.zone + 1) + '구역까지 도달. 현상금 ' + earned + '$ 를 은행에 넣었다.';
  $('endPanel').hidden = false;
  if (run) { try { await api('/runs/' + run.runKey + '/consume', { method:'POST', body:JSON.stringify({ outcome: outcome === 'CLEAR' ? 'CLEAR' : 'DEATH' }) }); } catch (_) {} }
  await persistMeta();
}

/* ═══════════ 루프 / 입력 ═══════════ */
let last = nowMs();
function loop() {
  requestAnimationFrame(loop);
  const t = nowMs(), dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!running || !G) return;
  update(dt);
  if (running && G) draw();
}
requestAnimationFrame(loop);
const codeChar = ev => { const c = ev.code || ''; return c.startsWith('Key') ? c.slice(3).toLowerCase() : ev.key; };
addEventListener('keydown', ev => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(ev.key)) ev.preventDefault();
  keys.add(codeChar(ev));
});
addEventListener('keyup', ev => keys.delete(codeChar(ev)));
addEventListener('blur', () => keys.clear());

/* ═══════════ 메타 UI ═══════════ */
const dmgCost = () => 90 * Math.pow(2, meta.dmgLv);
const hpUpCost = () => 110 * Math.pow(2, meta.hpLv);
function renderMeta() {
  $('dmgTxt').innerHTML = '<b>사격 훈련 Lv.' + meta.dmgLv + '</b> — 공격 +' + (meta.dmgLv * 12) + '%<small>' + dmgCost() + '$</small>';
  $('hpUpTxt').innerHTML = '<b>강골 Lv.' + meta.hpLv + '</b> — 체력 +' + (meta.hpLv * 12) + '%<small>' + hpUpCost() + '$</small>';
  $('bankTxt').textContent = '🏦 은행 ' + meta.bank + '$   ·   최고 기록 제' + (meta.best || 0) + '구역';
  $('buyDmg').disabled = meta.bank < dmgCost();
  $('buyHpUp').disabled = meta.bank < hpUpCost();
}
$('buyDmg').onclick = async () => { if (meta.bank < dmgCost()) return; meta.bank -= dmgCost(); meta.dmgLv++; renderMeta(); await persistMeta(); };
$('buyHpUp').onclick = async () => { if (meta.bank < hpUpCost()) return; meta.bank -= hpUpCost(); meta.hpLv++; renderMeta(); await persistMeta(); };
$('startBtn').onclick = startRun;
$('backBtn').onclick = () => { $('endPanel').hidden = true; $('menu').hidden = false; renderMeta(); };
$('againBtn').onclick = () => { $('endPanel').hidden = true; startRun(); };
$('codeLoadBtn').onclick = async () => {
  const raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  if (await loadMeta(raw)) { saveCode = raw; localStorage.setItem(CODE_KEY, raw); renderMeta(); showCode(); }
};

loadMeta().then(renderMeta);
</script>
<script src="../lib/touch.js"></script>
<script src="../lib/rank.js"></script>
<script>
GameRank.autoPanel('outlaw-frontier');
GameRank.copyButton(function(){ return typeof saveCode !== 'undefined' ? saveCode : null; });
</script>
