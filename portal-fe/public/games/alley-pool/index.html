<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">골목 당구장</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dbe7f5; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; -webkit-user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.72); }
  canvas { display:block; background:#12305a; max-width:100%; touch-action:none; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:10px; right:56px; display:flex; gap:8px; font-size:12px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(6,10,20,.72); padding:3px 10px; border-radius:10px; white-space:nowrap; }
  #hud .grow { flex:1; }
  #banner { position:absolute; top:38%; left:0; right:0; text-align:center; font-size:24px; font-weight:bold;
            color:#0ea5e9; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .3s; padding:0 12px; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(7,12,22,.96); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:12px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#0ea5e9; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#b9c9dd; line-height:1.75; max-width:540px; }
  .panel p.small { font-size:11px; color:#7e8ea3; }
  .panel button { background:#0ea5e9; color:#04121f; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1a2238; color:#dbe7f5; border:1px solid #2b3a57; }
  .modes { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .modes button { display:flex; flex-direction:column; gap:5px; padding:13px 20px; min-width:230px; }
  .modes button .big { font-size:14px; }
  .modes button .sub { font-size:10.5px; font-weight:normal; opacity:.82; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #info { margin-top:9px; font-size:11px; color:#54637a; text-align:center; line-height:1.7; padding:0 12px; }

  /* 모바일 — 가로형 캔버스를 화면 폭에 맞춰 축소 */
  @media (max-width: 940px), (pointer: coarse) {
    #wrap { width: 100vw; max-width: 100vw; border-width: 0; border-radius: 0; }
    canvas { width: 100%; height: auto; }
    #info { display: none; }
    .panel button { padding: 11px 18px; font-size: 13px; }
    #banner { font-size: 19px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="900" height="520"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="tagA"></span>
    <span class="tag" id="tagB"></span>
    <span class="grow"></span>
    <span class="tag" id="tagC"></span>
    <span class="tag" id="tagD"></span>
  </div>
  <div id="banner"></div>
  <div class="panel" id="menu">
    <h1 data-i18n="menuTitle">🎱 골목 당구장</h1>
    <p data-i18n="menuDesc">네온 불빛 아래 골목 당구장.</p>
    <div class="modes">
      <button id="mode9Btn">
        <span class="big" data-i18n="mode9Btn">⏱ 9볼 타임어택</span>
        <span class="sub" data-i18n="mode9Desc">1→9 순서로 최대한 빨리 — 파울 +10초</span>
      </button>
      <button id="modeTrickBtn">
        <span class="big" data-i18n="modeTrickBtn">🎯 트릭샷 챌린지</span>
        <span class="sub" data-i18n="modeTrickDesc">12개 배치 퍼즐 — 제한 샷 안에 지정 공 포켓</span>
      </button>
    </div>
    <p class="small" data-i18n="menuHint">드래그 = 조준·파워 (고무줄) · 놓으면 발사</p>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <div class="row">
      <button id="againBtn" data-i18n="againBtn">🎱 다시 도전</button>
      <button id="backBtn" class="ghost" data-i18n="backBtn">처음으로</button>
    </div>
  </div>
</div>
<div id="info" data-i18n="infoLine">큐볼에서 드래그 = 조준·파워 · 놓으면 발사 · ESC = 조준 취소</div>
<script>

GameI18n.init({

    menuDesc: '네온 불빛 아래 골목 당구장. 큐볼을 뒤로 당겼다 놓으면 발사된다 — 쿠션 반발, 롤링 마찰, ' +
              '탄성 충돌까지 그대로 살린 2D 포켓볼.',
    mode9Btn: '⏱ 9볼 타임어택',

    infoLine: '큐볼에서 드래그 = 조준·파워 · 놓으면 발사 · ESC = 조준 취소',
    startHint: '뒤로 당겨 조준 — 놓으면 발사!',
    hudTime: '⏱ {t}',

    foulNone: '파울! 헛샷 — +10초',
    ballInHand: '프리볼 — 큐볼을 드래그해 배치하라',

    respot9: '9번 복귀',
    potIn: '{n}번 IN!',
    end9Title: '🏆 9볼 클리어!',
    end9Desc: '기록 {t} · 파울 {f}회 · 점수 {s}점',

  },

    mode9Btn: '⏱ 9-Ball Time Attack',
    mode9Desc: 'Pocket 1→9 in order as fast as you can — fouls cost +10s',
    modeTrickBtn: '🎯 Trick Shot Challenge',
    modeTrickDesc: '12 fixed-layout puzzles — sink the marked balls within the shot limit',
    menuHint: 'Drag = aim & power (rubber band) · release to shoot',
    infoLine: 'Drag from the cue ball = aim & power · release to shoot · ESC = cancel',
    startHint: 'Pull back to aim — release to fire!',
    hudTime: '⏱ {t}',
    hudFoul: '⚠ Fouls {n}',
    hudNext: 'Next ▶ #{n}',
    hudLevel: '🎯 LV {n}/{max}',
    hudShots: '🎱 Shots {n}',
    hudStars: '★ {n}',
    hudTargets: 'Marks {list}',
    lvBanner: 'LV.{n} — {name}',
    lvClear: 'LV.{n} clear! {st}',
    lvFail: 'Out of shots… run over',
    winBanner: '🏆 Cleared!',
    foulCue: 'Foul! Cue ball pocketed — +10s',
    foulWrong: 'Foul! Hit #{n} first — +10s',
    foulNone: 'Foul! Nothing hit — +10s',
    ballInHand: 'Ball in hand — drag the cue ball anywhere',
    trickCue: 'Cue ball pocketed! Place it freely',
    respot9: '#9 respotted',
    potIn: '#{n} IN!',
    end9Title: '🏆 9-Ball Clear!',
    end9Desc: 'Time {t} · {f} fouls · Score {s}',
    endTrickWin: '🏆 Trick Shot Master!',
    endTrickFail: '🎯 Run Over',
    endTrickDesc: 'Cleared {n}/12 · {st} stars · Score {s}',
    againBtn: '🎱 Try Again',
    backBtn: 'Back to Menu',
    rankMsg: ' 🏆 Rank #{n}!',
    lvName1: 'Straight Shot', lvName2: 'Fork Roads', lvName3: 'Side Lines', lvName4: 'The Combo',
    lvName5: 'Needle Eye', lvName6: 'Past the Wall', lvName7: 'Three Brothers', lvName8: 'Corner Rush',
    lvName9: 'Minefield', lvName10: 'The Long Shot', lvName11: 'Twin Marks', lvName12: 'Grand Finale',
  },
});
var TR = GameI18n.t;
function TX(key, vals) {
  return TR(key).replace(/\{(\w+)\}/g, function (m, name) { return vals[name]; });
}

var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var VW = cv.width, VH = cv.height, TAU = Math.PI * 2;
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd() { return Math.random(); }

/* ── 테이블 기하 ── */
var TX0 = 60, TX1 = 840, TY0 = 60, TY1 = 460;          // 펠트 플레이 영역
var R = 11;                                            // 공 반지름
var POCKETS = [
  { x: TX0, y: TY0, r: 21 }, { x: TX1, y: TY0, r: 21 },
  { x: TX0, y: TY1, r: 21 }, { x: TX1, y: TY1, r: 21 },
  { x: (TX0 + TX1) / 2, y: TY0, r: 18 }, { x: (TX0 + TX1) / 2, y: TY1, r: 18 },
];
var FOOT_X = TX0 + (TX1 - TX0) * 0.75, FOOT_Y = (TY0 + TY1) / 2;   // 풋 스폿(랙 apex)
var HEAD_X = TX0 + (TX1 - TX0) * 0.25;                              // 헤드 스폿(큐볼)

/* ── 물리 파라미터 ── */
var FRICTION = 130;        // 롤링 마찰 감속 px/s²
var DAMP = 0.6;            // 지수 감쇠 /s
var STOP_V = 6;            // 정지 판정 속도
var CUSH = 0.85;           // 쿠션 반발 계수
var BALL_E = 0.95;         // 공-공 반발 계수 (질량 동일 탄성 충돌)
var SUBSTEPS = 4;          // 프레임당 서브스텝 — 관통 방지
var MAXPULL = 150, MAXV = 1150, MINPULL = 14;

/* ── 공 색상 (당구 표준 배색) ── */
var BCOL = { 1:'#eab308', 2:'#2f6fe4', 3:'#ef4444', 4:'#8b5cf6', 5:'#f97316',
             6:'#22c55e', 7:'#9a4a1f', 8:'#10151f', 9:'#eab308' };

/* ── 트릭샷 레벨 12종 — c:큐볼, b:[번호,x,y], t:목표, sh:샷 제한, par:별 3개 기준 ── */
var LEVELS = [
  { c:[300,300], b:[[1,620,170]], t:[1], sh:2, par:1 },
  { c:[450,350], b:[[1,650,160],[2,250,160]], t:[1,2], sh:3, par:2 },
  { c:[330,300], b:[[1,390,180],[2,510,340]], t:[1,2], sh:3, par:2 },
  { c:[376,199], b:[[1,550,297],[2,620,336]], t:[2], sh:2, par:1 },
  { c:[240,220], b:[[1,690,180],[7,465,160],[8,465,240]], t:[1], sh:3, par:1 },
  { c:[450,140], b:[[3,450,340],[8,450,410]], t:[3], sh:4, par:2 },
  { c:[450,260], b:[[1,340,170],[2,560,170],[3,450,370]], t:[1,2,3], sh:5, par:3 },
  { c:[500,240], b:[[1,760,400],[2,742,382],[3,764,360]], t:[1,2,3], sh:5, par:3 },
  { c:[300,380], b:[[9,450,260],[3,330,180],[4,590,150],[5,280,300],[6,570,340]], t:[9], sh:3, par:1 },
  { c:[720,390], b:[[5,180,150],[8,450,300]], t:[5], sh:3, par:1 },
  { c:[680,120], b:[[2,620,336],[4,250,150],[1,550,297]], t:[2,4], sh:4, par:2 },
  { c:[450,200], b:[[1,150,150],[2,750,150],[3,150,370],[4,750,370],[9,450,330]], t:[1,2,3,4,9], sh:8, par:5 },
];

/* ── 배경(테이블) 캐시 ── */
var bgCv = null;
function buildBg() {
  var i, p;
  bgCv = document.createElement('canvas'); bgCv.width = VW; bgCv.height = VH;
  var g = bgCv.getContext('2d');
  g.fillStyle = '#1a2238'; g.fillRect(0, 0, VW, VH);                       // 우드 프레임
  g.fillStyle = '#0f2c55'; g.fillRect(46, 46, VW - 92, VH - 92);           // 쿠션 밴드
  g.fillStyle = '#12305a'; g.fillRect(TX0, TY0, TX1 - TX0, TY1 - TY0);     // 펠트
  // 펠트 미세 텍스처
  for (i = 0; i < 900; i++) {
    var fx = TX0 + rnd() * (TX1 - TX0), fy = TY0 + rnd() * (TY1 - TY0);
    g.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,.016)' : 'rgba(0,0,0,.05)';
    g.fillRect(fx, fy, 2, 2);
  }
  // 비네트 + 쿠션 안쪽 하이라이트
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 10;
  g.strokeRect(TX0 + 5, TY0 + 5, TX1 - TX0 - 10, TY1 - TY0 - 10);
  g.strokeStyle = '#24406e'; g.lineWidth = 2;
  g.strokeRect(TX0, TY0, TX1 - TX0, TY1 - TY0);
  // 헤드 스트링 / 스폿
  g.strokeStyle = 'rgba(148,190,255,.08)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(HEAD_X, TY0 + 4); g.lineTo(HEAD_X, TY1 - 4); g.stroke();
  g.fillStyle = 'rgba(148,190,255,.16)';
  g.beginPath(); g.arc(FOOT_X, FOOT_Y, 3, 0, TAU); g.fill();
  g.beginPath(); g.arc((TX0 + TX1) / 2, FOOT_Y, 3, 0, TAU); g.fill();
  // 프레임 다이아 사이트
  g.fillStyle = '#33507e';
  var fr8 = [1, 2, 3, 5, 6, 7];
  for (i = 0; i < fr8.length; i++) {
    var dx = TX0 + (TX1 - TX0) * fr8[i] / 8;
    diamond(g, dx, 23); diamond(g, dx, VH - 23);
  }
  for (i = 1; i <= 3; i++) {
    var dy = TY0 + (TY1 - TY0) * i / 4;
    diamond(g, 23, dy); diamond(g, VW - 23, dy);
  }
  // 포켓
  for (i = 0; i < POCKETS.length; i++) {
    p = POCKETS[i];
    g.fillStyle = '#04070d';
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
    g.strokeStyle = '#0a1526'; g.lineWidth = 4;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(120,170,230,.14)'; g.lineWidth = 2;
    g.beginPath(); g.arc(p.x, p.y, p.r - 3, Math.PI * 0.7, Math.PI * 1.4); g.stroke();
  }
}
function diamond(g, x, y) {
  g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.fillRect(-3, -3, 6, 6); g.restore();
}

/* ── 상태 ── */
var G = null, running = false, lastMode = 'nine', bannerT = 0;

function makeBall(num, x, y, isCue) {
  return { num: num, x: x, y: y, vx: 0, vy: 0, on: true, cue: !!isCue };
}
function rack9() {
  var s = 23, dx = 20, dy = 12, X = FOOT_X, Y = FOOT_Y;
  var pos = [
    [1, X, Y],
    [2, X + dx, Y - dy], [3, X + dx, Y + dy],
    [4, X + dx * 2, Y - dy * 2], [9, X + dx * 2, Y], [5, X + dx * 2, Y + dy * 2],
    [6, X + dx * 3, Y - dy], [7, X + dx * 3, Y + dy],
    [8, X + dx * 4, Y],
  ];
  var arr = [makeBall(0, HEAD_X, FOOT_Y, true)], i;
  for (i = 0; i < pos.length; i++) arr.push(makeBall(pos[i][0], pos[i][1], pos[i][2]));
  return arr;
}
function loadLevel(n) {
  var lv = LEVELS[n - 1], i;
  G.balls = [makeBall(0, lv.c[0], lv.c[1], true)];
  for (i = 0; i < lv.b.length; i++) G.balls.push(makeBall(lv.b[i][0], lv.b[i][1], lv.b[i][2]));
  G.shots = lv.sh;
  G.pottedAll = [];
  G.parts = [];
  banner(TX('lvBanner', { n: n, name: TR('lvName' + n) }), '#0ea5e9');
}
function cueBall() { return G.balls[0]; }
function lowestActive() {
  var i, m = 99;
  for (i = 1; i < G.balls.length; i++) if (G.balls[i].on && G.balls[i].num < m) m = G.balls[i].num;
  return m === 99 ? 0 : m;
}
function trickRemaining() {
  var lv = LEVELS[G.level - 1], out = [], i;
  for (i = 0; i < lv.t.length; i++) if (G.pottedAll.indexOf(lv.t[i]) < 0) out.push(lv.t[i]);
  return out;
}
function starStr(n) {
  var s = '', i;
  for (i = 0; i < 3; i++) s += i < n ? '★' : '☆';
  return s;
}
function fmtTime(t) {
  var s = Math.floor(t), m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

/* ── 이펙트 ── */
function banner(text, color) {
  var el = $('banner');
  el.textContent = text;
  el.style.color = color || '#0ea5e9';
  el.style.fontSize = text.length > 26 ? '16px' : '24px';
  el.classList.add('on');
  bannerT = text.length > 26 ? 2600 : 1700;
}
function burst(x, y, color, n, spd) {
  var i;
  for (i = 0; i < n; i++) {
    var a = rnd() * TAU, s = spd * (0.35 + rnd() * 0.85);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
                   color: color, size: 2 + rnd() * 2.5, grav: 150 });
  }
}
function ringFx(x, y, color, r) {
  G.parts.push({ x: x, y: y, vx: 0, vy: 0, life: 1, ring: r, color: color, grav: 0 });
}
function popText(x, y, text, color) {
  G.parts.push({ x: x, y: clamp(y, TY0 + 14, TY1 - 6), vx: 0, vy: -26, life: 1, text: text, color: color, grav: 0 });
}

/* ── 물리 — 서브스텝 시뮬 ── */
function stepPhysics(dt) {
  var i, j, b, a;
  for (i = 0; i < G.balls.length; i++) {
    b = G.balls[i];
    if (!b.on) continue;
    b.x += b.vx * dt; b.y += b.vy * dt;
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp > 0) {
      var ns = sp * (1 - DAMP * dt) - FRICTION * dt;   // 지수 감쇠 + 롤링 마찰
      if (ns < STOP_V) { b.vx = 0; b.vy = 0; }

      if (px * px + py * py < pk.r * pk.r) { sinkBall(b, pk); break; }
    }
    if (!b.on) continue;
    if (b.x < TX0 + R && b.vx < 0) { b.x = TX0 + R; cushionHit(b, 'x'); }
    else if (b.x > TX1 - R && b.vx > 0) { b.x = TX1 - R; cushionHit(b, 'x'); }

    else if (b.y > TY1 - R && b.vy > 0) { b.y = TY1 - R; cushionHit(b, 'y'); }

    if (!a.on) continue;
    for (j = i + 1; j < G.balls.length; j++) {

        else if (b.cue) G.firstHit = a.num;

      a.vx -= imp * nx; a.vy -= imp * ny;
      b.vx += imp * nx; b.vy += imp * ny;

}

}

/* ── 발사 / 샷 판정 ── */
function fire(dirx, diry, pw) {

  if (G.mode === 'nine') G.legal = lowestActive();

  if (frac > 0.6) { ringFx(c.x, c.y, '#dbe7f5', 26); G.flash = frac * 0.55; }
}
function respot9() {
  var i, x = FOOT_X, b9 = null;

    }

}

  if (won) {

  } else if (foul !== null) {

  } else {
    G.state = 'aim';
  }
}
function resolveTrick() {

    var st = used <= lv.par ? 3 : used <= lv.par + 1 ? 2 : 1;
    G.stars += st; G.cleared++;
    banner(TX('lvClear', { n: G.level, st: starStr(st) }), '#22c55e');
    if (G.level >= LEVELS.length) G.finish = { win: true };

  } else if (G.shots <= 0) {

    G.finish = { win: false };
    G.state = 'transition'; G.transT = 1.6;
  } else if (G.cueDown) {

/* ── 진행 ── */
function update(dt) {
  var i;

    for (i = 0; i < SUBSTEPS; i++) {
      stepPhysics(sub);
      if (allStopped()) break;
    }
    if (allStopped()) resolveShot();
  } else if (G.state === 'transition') {
    G.transT -= dt;
    if (G.transT <= 0) {
      if (G.finish) { doEnd(G.finish.win); return; }
      G.level++;
      loadLevel(G.level);
      G.state = 'aim';
    }
  }
  if (G.mode === 'nine' && !G.finish) G.time += dt;
  for (i = G.parts.length - 1; i >= 0; i--) {
    var pa = G.parts[i];
    pa.x += pa.vx * dt; pa.y += pa.vy * dt;
    pa.vy += (pa.grav || 0) * dt;
    pa.life -= dt * (pa.text ? 1.0 : pa.ring ? 2.6 : 2.0);
    if (pa.life <= 0) G.parts.splice(i, 1);
  }
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}

/* ── 조준 가이드 — 레이 캐스트 ── */
function castRay(ox, oy, dirx, diry) {
  var bestT = Infinity, hitBall = null, i;
  for (i = 1; i < G.balls.length; i++) {
    var b = G.balls[i];

    var proj = rx * dirx + ry * diry;

  }
  var tx = dirx > 0 ? (TX1 - R - ox) / dirx : dirx < 0 ? (TX0 + R - ox) / dirx : Infinity;
  var ty = diry > 0 ? (TY1 - R - oy) / diry : diry < 0 ? (TY0 + R - oy) / diry : Infinity;
  var tw = Math.min(tx, ty);
  if (tw < bestT) { bestT = tw; hitBall = null; }
  return { t: bestT, ball: hitBall };
}

/* ── 렌더 ── */
function drawBall(b) {
  var x = b.x, y = b.y;

  cx.beginPath(); cx.ellipse(x + 2, y + 3, R * 0.9, R * 0.55, 0, 0, TAU); cx.fill();
  cx.beginPath(); cx.arc(x, y, R, 0, TAU);
  cx.fillStyle = (b.cue || b.num === 9) ? '#eef3f9' : BCOL[b.num];
  cx.fill();
  if (b.num === 9) {
    cx.save();
    cx.beginPath(); cx.arc(x, y, R - 0.5, 0, TAU); cx.clip();
    cx.fillStyle = BCOL[9];
    cx.fillRect(x - R, y - 5, R * 2, 10);
    cx.restore();
  }
  cx.strokeStyle = 'rgba(4,8,16,.5)'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.arc(x, y, R, 0, TAU); cx.stroke();
  cx.fillStyle = 'rgba(255,255,255,.55)';
  cx.beginPath(); cx.arc(x - 4, y - 4, 2.2, 0, TAU); cx.fill();
  if (!b.cue) {
    cx.fillStyle = '#f4f7fb';
    cx.beginPath(); cx.arc(x, y, 5.5, 0, TAU); cx.fill();
    cx.fillStyle = '#16213a';
    cx.font = 'bold 8px "Courier New",monospace';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';

}
function drawGoalRing(x, y, color, now) {

}

  var i, b, c = cueBall();

  // 목표 링 — 9볼: 다음 공 / 트릭샷: 남은 지정 공

    if (G.mode === 'nine') {
      var low = lowestActive();
      for (i = 1; i < G.balls.length; i++) {
        b = G.balls[i];

      }
    } else {
      var remain = trickRemaining();

    var pvx = G.drag.cx - G.drag.sx, pvy = G.drag.cy - G.drag.sy;
    var plen = Math.sqrt(pvx * pvx + pvy * pvy);

      var dirx = -ux, diry = -uy;

      cx.setLineDash([]);

      cx.beginPath(); cx.arc(gx, gy, R, 0, TAU); cx.stroke();

      cx.fillStyle = '#7d5a37'; cx.fillRect(off, -3, 175, 3);
      cx.fillStyle = '#cbd5e1'; cx.fillRect(off, -3, 10, 6);
      cx.fillStyle = '#1f2a40'; cx.fillRect(off + 165, -3, 10, 6);

    cx.fillRect(0, 0, VW, VH);

    $('tagA').textContent = TX('hudTime', { t: fmtTime(G.time) });
    $('tagB').textContent = lowestActive() ? TX('hudNext', { n: lowestActive() }) : '';

    $('tagA').textContent = TX('hudLevel', { n: G.level, max: LEVELS.length });
    $('tagB').textContent = TX('hudShots', { n: G.shots });
    $('tagC').textContent = TX('hudTargets', { list: trickRemaining().join('·') || '—' });
    $('tagD').hidden = false;
    $('tagD').textContent = TX('hudStars', { n: G.stars });
  }
}

/* ── 입력 — 데스크톱/모바일 동일 포인터 조작 ── */
function canvasPoint(ev) {
  var r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (VW / r.width), y: (ev.clientY - r.top) * (VH / r.height) };
}
function clampPos(p) {
  return { x: clamp(p.x, TX0 + R, TX1 - R), y: clamp(p.y, TY0 + R, TY1 - R) };
}
function validPlace(x, y) {
  var i;
  for (i = 1; i < G.balls.length; i++) {
    var b = G.balls[i];
    if (!b.on) continue;
    var dx = b.x - x, dy = b.y - y;
    if (dx * dx + dy * dy < (R * 2 + 1) * (R * 2 + 1)) return false;
  }
  for (i = 0; i < POCKETS.length; i++) {
    var pk = POCKETS[i], px = pk.x - x, py = pk.y - y;
    if (px * px + py * py < (pk.r + 8) * (pk.r + 8)) return false;
  }
  return true;
}
cv.addEventListener('pointerdown', function (ev) {
  if (!running) return;
  ev.preventDefault();
  var p = canvasPoint(ev);
  if (G.state === 'aim') {
    G.pid = ev.pointerId;
    G.drag = { sx: p.x, sy: p.y, cx: p.x, cy: p.y };
    G.state = 'drag';
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* capture 미지원 무시 */ }
  } else if (G.state === 'place') {
    G.pid = ev.pointerId;
    G.ghost = clampPos(p);
    G.state = 'placeDrag';
    try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* capture 미지원 무시 */ }
  }
});
cv.addEventListener('pointermove', function (ev) {
  if (!running || ev.pointerId !== G.pid) return;
  var p = canvasPoint(ev);
  if (G.state === 'drag' && G.drag) { G.drag.cx = p.x; G.drag.cy = p.y; }
  else if (G.state === 'placeDrag') G.ghost = clampPos(p);
});
cv.addEventListener('pointerup', function (ev) {
  if (!running || ev.pointerId !== G.pid) return;
  if (G.state === 'drag' && G.drag) {
    var pvx = G.drag.cx - G.drag.sx, pvy = G.drag.cy - G.drag.sy;
    var plen = Math.sqrt(pvx * pvx + pvy * pvy);
    G.drag = null;
    if (plen < MINPULL) { G.state = 'aim'; return; }
    fire(-pvx / plen, -pvy / plen, Math.min(plen, MAXPULL));
  } else if (G.state === 'placeDrag' && G.ghost) {
    if (validPlace(G.ghost.x, G.ghost.y)) {
      var c = cueBall();
      c.x = G.ghost.x; c.y = G.ghost.y; c.vx = 0; c.vy = 0; c.on = true;
      G.cueDown = false; G.ghost = null;
      ringFx(c.x, c.y, '#22c55e', 22);
      G.state = 'aim';
    } else {
      G.ghost = null;
      G.state = 'place';
    }
  }
});
cv.addEventListener('pointercancel', function (ev) {
  if (!running || ev.pointerId !== G.pid) return;
  if (G.state === 'drag') { G.drag = null; G.state = 'aim'; }
  else if (G.state === 'placeDrag') { G.ghost = null; G.state = 'place'; }
});
window.addEventListener('keydown', function (ev) {
  if (ev.code === 'Escape' && running && G.state === 'drag') { G.drag = null; G.state = 'aim'; }
});

/* ── 시작 / 종료 ── */
function startGame(mode) {
  lastMode = mode;
  G = { mode: mode, state: 'aim', balls: [], parts: [], drag: null, ghost: null, pid: -1,
        firstHit: null, potted: [], cueDown: false, flash: 0, finish: null, transT: 0,
        time: 0, fouls: 0, legal: 1,
        level: 1, shots: 0, stars: 0, cleared: 0, pottedAll: [] };
  running = true;
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false;
  if (mode === 'nine') {
    G.balls = rack9();

  } else {
    loadLevel(1);
  }
}
function doEnd(win) {

  $('banner').classList.remove('on'); bannerT = 0;
  var score, detail;

    detail = '9볼 ' + fmtTime(G.time);
    $('endTitle').textContent = TR('end9Title');
    $('endDesc').textContent = TX('end9Desc', { t: fmtTime(G.time), f: G.fouls, s: score });
  } else {

    detail = '트릭샷 ' + G.cleared + '/' + LEVELS.length;
    $('endTitle').textContent = win ? TR('endTrickWin') : TR('endTrickFail');
    $('endDesc').textContent = TX('endTrickDesc', { n: G.cleared, st: G.stars, s: score });
  }
  $('endPanel').hidden = false;
  GameRank.submit('alley-pool', score, detail)
    .then(function (r) {
      if (r && r.applied) $('endDesc').textContent += TX('rankMsg', { n: r.rank });
    });
}

var last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  var now = performance.now(), dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!running || !G) return;
  update(dt);
  if (running && G) draw(now);
}
buildBg();
requestAnimationFrame(loop);
$('mode9Btn').onclick = function () { startGame('nine'); };
$('modeTrickBtn').onclick = function () { startGame('trick'); };
$('againBtn').onclick = function () { startGame(lastMode); };
$('backBtn').onclick = function () { $('endPanel').hidden = true; $('menu').hidden = false; };
</script>

     입력 방식은 게임이 이미 가진 것을 그대로 둔다. -->
