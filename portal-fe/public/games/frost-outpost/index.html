<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혹한 전초기지</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0a0f16; color:#e2ecf4; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1c2c3c; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.7); }
  canvas { display:block; background:#22303e; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:12px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(6,12,20,.65); padding:3px 10px; border-radius:10px; }
  #hud .grow { flex:1; }
  #bar { position:absolute; left:0; right:0; bottom:0; display:flex; gap:6px; padding:7px 9px; background:rgba(6,12,20,.9);
         font-size:11px; align-items:center; flex-wrap:wrap; }
  #bar button { background:#1c2c3c; color:#e2ecf4; border:1px solid #2e4358; padding:6px 10px; border-radius:6px;
                cursor:pointer; font-family:inherit; font-size:11px; font-weight:bold; }
  #bar button.on { background:#6ab8d6; color:#0a1620; border-color:#a0d8ec; }
  #bar button:disabled { opacity:.35; cursor:default; }
  #banner { position:absolute; top:40%; left:0; right:0; text-align:center; font-size:26px; font-weight:bold;
            color:#a0d8ec; text-shadow:3px 3px 0 #000; pointer-events:none; opacity:0; transition:opacity .3s; }
  #banner.on { opacity:1; }
  .panel { position:absolute; inset:0; background:rgba(8,13,20,.96); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:12px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#a0d8ec; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#bcccd8; line-height:1.75; max-width:530px; }
  .panel button { background:#6ab8d6; color:#0a1620; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1c2c3c; color:#e2ecf4; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #saveStatus { font-size:10.5px; color:#7a92a4; }
  #info { margin-top:9px; font-size:11px; color:#586c7c; text-align:center; line-height:1.7; }
  input { background:#12202c; border:1px solid #1c2c3c; color:#e2ecf4; border-radius:6px; padding:6px 9px;
          font-family:inherit; font-size:12px; letter-spacing:1px; width:165px; text-transform:uppercase; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="840" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="goldTxt"></span>
    <span class="tag" id="timeTxt"></span>
    <span class="tag" id="raidTxt"></span>
    <span class="grow"></span>
    <span class="tag" id="baseTxt"></span>
  </div>
  <div id="banner"></div>
  <div id="bar" hidden>
    <button id="mWall">🧱 방벽 25$</button>
    <button id="mTurret">🔫 포탑 90$</button>
    <button id="mDemol">⛏ 철거</button>
    <span style="flex:1"></span>
    <button id="hireBtn"></button>
  </div>
  <div class="panel" id="menu">
    <h1>❄ 혹한 전초기지</h1>
    <p>눈보라 너머에서 서리 늑대 무리가 몰려온다. <b>광부가 수정을 캐서</b> 자금을 만들고,
       세 개의 <b>협곡 입구를 방벽과 포탑으로 틀어막아라</b>. 수정은 유한하다 — 아껴 쓰고, 버텨라.
       본부가 무너지기 전에 <b>12분</b>을 살아남으면 승리.</p>
    <div id="saveStatus"></div>
    <div class="row">
      <input id="codeInput" placeholder="이어하기 코드" maxlength="18" autocomplete="off">
      <button id="codeLoadBtn" class="ghost">🔑 코드로 불러오기</button>
    </div>
    <div class="row"><span id="codeShow" style="font-size:11px;color:#a0d8ec;letter-spacing:2px"></span></div>
    <div class="row"><span id="bestTxt" style="font-size:12px;color:#7a92a4"></span></div>
    <button id="startBtn">▶ 개척 시작</button>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <button id="backBtn">처음으로</button>
  </div>
</div>
<div id="info">모드 선택 후 빈 칸 클릭 → 건설 · 철거 모드로 건물 클릭 → 절반 환불 · 습격은 왼쪽/위/아래 협곡에서 온다<br>
  💎 수정은 캘수록 줄어든다 · 광부가 물리면 도망친다 — 입구를 막는 게 먼저다</div>
<script>
'use strict';
const API = '/api/v1/games/frost-outpost';
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = cv.width, VH = cv.height, T = 40, COLS = 21, ROWS = 12;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random(), ri = n => Math.floor(Math.random() * n);

/* ── 플랫폼 연동 (이어하기 코드 세이브) ── */
const token = () => localStorage.getItem('portal_access_token');
function deviceId() {
  let id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
async function api(path, opt = {}) {
  const headers = { 'Content-Type':'application/json', 'X-Device-Id':deviceId(), ...(opt.headers || {}) };
  const tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
  const res = await fetch(API + path, { ...opt, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.success === false) throw new Error(body?.error?.code || res.status);
  return body.data;
}
const CODE_KEY = 'frost_outpost_code', LOCAL_KEY = 'frost_outpost_save';
let saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
const fmtCode = c => c ? c.replace(/(.{4})(?=.)/g, '$1-') : '';
let meta = { bestSec: 0, clears: 0 };
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }
const fmtT = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
async function loadMeta(codeOverride) {
  const code = codeOverride || saveCode;
  if (token() || code) {
    try {
      const s = await api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''));
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (s.data) meta = { bestSec:0, clears:0, ...s.data };
      $('saveStatus').textContent = '☁ 서버 세이브 (v' + saveVersion + ')';
      showCode(); return true;
    } catch (e) { $('saveStatus').textContent = '세이브 로드 실패: ' + e.message; if (codeOverride) return false; }
  }
  try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d) meta = { ...meta, ...d }; } catch (_) {}
  $('saveStatus').textContent = '브라우저 저장 — 저장하면 이어하기 코드가 발급됩니다';
  showCode(); return true;
}
async function persistMeta() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(meta));
  try {
    const s = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
    saveVersion = s.version;
    if (s.code && s.code !== saveCode) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
    showCode();
  } catch (e) {
    if (e.message === 'INVALID_INPUT') {
      try {
        const re = await api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''));
        saveVersion = re.version;
        const s2 = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
        saveVersion = s2.version;
      } catch (_) {}
    }
  }
}

/* ── 지형 ── */
const ROCK = new Set(), CRYSTALS = [], GATES = [
  { x:0, y:5.5, dir:[1,0] },     // 왼쪽 협곡
  { x:6.5, y:0, dir:[0,1] },     // 위 협곡
  { x:14.5, y:11, dir:[0,-1] },  // 아래 협곡
];
(function buildTerrain() {
  for (let x = 0; x < COLS; x++) { ROCK.add(x + ',0'); ROCK.add(x + ',' + (ROWS - 1)); }
  for (let y = 0; y < ROWS; y++) { ROCK.add('0,' + y); ROCK.add((COLS - 1) + ',' + y); }
  // 협곡 입구를 뚫는다
  ROCK.delete('0,5'); ROCK.delete('0,6');
  ROCK.delete('6,0'); ROCK.delete('7,0');
  ROCK.delete('14,' + (ROWS - 1)); ROCK.delete('15,' + (ROWS - 1));
  // 내부 능선 — 동선을 좁힌다
  for (let y = 1; y <= 3; y++) ROCK.add('10,' + y);
  for (let y = 8; y <= 10; y++) ROCK.add('10,' + y);
  [[3,2],[3,9],[5,5],[6,8],[8,3],[9,6],[12,9],[12,2]].forEach(([x, y]) =>
    CRYSTALS.push({ x, y, left: 34 }));
})();
const BASE = { gx:16, gy:5 };   // 2x2
const baseTiles = new Set([ '16,5','17,5','16,6','17,6' ]);
const baseCX = (BASE.gx + 1) * T, baseCY = (BASE.gy + 1) * T;
const RAID_GAP = 35, WIN_SEC = 720;

let G = null, running = false, mode = 'wall', bannerT = 0, shake = 0;
function newGame() {
  G = { gold: 120, time: 0, raid: 0, raidT: 25, baseHp: 500, baseMax: 500,
    buildings: new Map(), miners: [], foes: [], shots: [], parts: [],
    crystals: CRYSTALS.map(c => ({ ...c, left: 34 })) };
  G.miners.push(mkMiner(), mkMiner());
}
function mkMiner() { return { x: baseCX, y: baseCY, state:'seek', target:null, mineT:0, hp:40, maxHp:40, flee:0, hurt:0 }; }
function banner(text) { $('banner').textContent = text; $('banner').classList.add('on'); bannerT = 1600; }
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, s = spd * (0.4 + rnd() * 0.8);
    G.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color, size:2 + rnd()*3 });
  }
}
function popText(x, y, text, color) { G.parts.push({ x, y, vx:0, vy:-28, life:1, text, color }); }
const bKey = (gx, gy) => gx + ',' + gy;
const blockedTile = (gx, gy) => ROCK.has(bKey(gx, gy)) || G.buildings.has(bKey(gx, gy)) || baseTiles.has(bKey(gx, gy));
/** 반경 코너 4점 + 중심을 샘플링해 막고 있는 셀을 찾는다 — 대각선으로 벽 틈을 파고들 수 없다 */
function blockInfoAt(px2, py2, r) {
  for (const [ox, oy] of [[0,0],[-r,-r],[r,-r],[-r,r],[r,r]]) {
    const gx = Math.floor((px2 + ox) / T), gy = Math.floor((py2 + oy) / T);
    const k = bKey(gx, gy);
    if (baseTiles.has(k)) return { type:'base', k, gx, gy };
    if (G.buildings.has(k)) return { type:'bld', k, gx, gy };
    if (ROCK.has(k)) return { type:'rock', k, gx, gy };
  }
  return null;
}

/* ── 습격 ── */
function startRaid() {
  G.raid++;
  const gate = GATES[ri(GATES.length)];
  const n = 3 + Math.floor(G.raid * 1.6);
  for (let i = 0; i < n; i++) {
    const hp = Math.round(34 * (1 + G.raid * 0.22));
    const big = G.raid >= 4 && i === 0;
    G.foes.push({
      x: gate.x * T + T/2 + (rnd() - 0.5) * 30 - gate.dir[0] * (i * 26),
      y: gate.y * T + T/2 + (rnd() - 0.5) * 30 - gate.dir[1] * (i * 26),
      hp: big ? hp * 5 : hp, maxHp: big ? hp * 5 : hp,
      dmg: big ? 22 : 8, spd: big ? 46 : 72, r: big ? 17 : 11, big,
      cd: 0, hurt: 0 });
  }
  banner('❄ 제' + G.raid + '차 습격 — ' + (gate.dir[0] ? '왼쪽' : gate.dir[1] > 0 ? '위쪽' : '아래쪽') + ' 협곡!');
}

/* ── 갱신 ── */
function update(dt) {
  G.time += dt;
  if (G.time >= WIN_SEC) { endGame(true); return; }
  G.raidT -= dt;
  if (G.raidT <= 0) { G.raidT = Math.max(20, RAID_GAP - G.raid); startRaid(); }

  // 광부
  for (const m of [...G.miners]) {
    m.hurt = Math.max(0, m.hurt - dt);
    // 가까운 적이 있으면 본부로 도망친다
    const danger = G.foes.some(f => (f.x - m.x) ** 2 + (f.y - m.y) ** 2 < 110 * 110);
    if (danger) m.flee = 1.6;
    if (m.flee > 0) {
      m.flee -= dt;
      const dx = baseCX - m.x, dy = baseCY - m.y, d = Math.hypot(dx, dy) || 1;
      if (d > 8) { m.x += dx / d * 110 * dt; m.y += dy / d * 110 * dt; }
      continue;
    }
    if (m.state === 'seek') {
      const c = G.crystals.filter(c => c.left > 0)
        .sort((a, b) => ((a.x*T - m.x) ** 2 + (a.y*T - m.y) ** 2) - ((b.x*T - m.x) ** 2 + (b.y*T - m.y) ** 2))[0];
      if (!c) continue;                                     // 수정 고갈 — 대기
      m.target = c;
      const tx = c.x * T + T/2, ty = c.y * T + T/2;
      const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy);
      if (d < 6) { m.state = 'mine'; m.mineT = 1.8; }
      else { m.x += dx / d * 88 * dt; m.y += dy / d * 88 * dt; }
    } else if (m.state === 'mine') {
      m.mineT -= dt;
      if (m.mineT <= 0) {
        if (m.target.left > 0) m.target.left--;
        m.state = 'return';
      }
    } else {
      const dx = baseCX - m.x, dy = baseCY - m.y, d = Math.hypot(dx, dy);
      if (d < 24) { G.gold += 10; popText(m.x, m.y - 12, '+10$', '#a0d8ec'); m.state = 'seek'; }
      else { m.x += dx / d * 92 * dt; m.y += dy / d * 92 * dt; }
    }
  }

  // 적 — 본부를 향해 직진, 막히면 부수거나 미끄러진다
  for (const f of [...G.foes]) {
    f.hurt = Math.max(0, f.hurt - dt); f.cd = Math.max(0, f.cd - dt);
    // 근처 광부 우선 공격
    let prey = null, pd = 90 * 90;
    for (const m of G.miners) { const q = (m.x - f.x) ** 2 + (m.y - f.y) ** 2; if (q < pd) { pd = q; prey = m; } }
    const tx = prey ? prey.x : baseCX, ty = prey ? prey.y : baseCY;
    const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1;
    if (prey && d < f.r + 10) {
      if (f.cd <= 0) { f.cd = 0.8; prey.hp -= f.dmg; prey.hurt = 0.2; burst(prey.x, prey.y, '#ff6b6b', 5, 90);
        if (prey.hp <= 0) { burst(prey.x, prey.y, '#e2ecf4', 12, 130); G.miners = G.miners.filter(o => o !== prey);
          popText(prey.x, prey.y - 12, '광부 사망!', '#ff6b6b'); } }
      continue;
    }
    // 축 분리 이동 + 반경 충돌 — 방벽과 같은 픽셀 선상이면 반드시 막히고, 막은 구조물을 두들긴다
    const rr = f.r * 0.75;
    const hitStructure = bi => {
      if (f.cd > 0) return;
      f.cd = 0.8;
      if (bi.type === 'base') {
        G.baseHp -= f.dmg; shake = Math.max(shake, 4);
        burst(f.x, f.y, '#6ab8d6', 5, 90);
        if (G.baseHp <= 0) { G.baseHp = 0; endGame(false); }
      } else if (bi.type === 'bld') {
        const b = G.buildings.get(bi.k);
        b.hp -= f.dmg * (f.big ? 2 : 1);
        burst(bi.gx * T + T/2, bi.gy * T + T/2, '#8a9aa8', 4, 70);
        if (b.hp <= 0) { G.buildings.delete(bi.k); burst(bi.gx * T + T/2, bi.gy * T + T/2, '#8a9aa8', 16, 150); shake = 7; }
      }
    };
    // 스폰 직후 가장자리 바위에 겹친 경우 — 이미 겹친 셀은 빠져나가는 이동을 막지 않는다
    const cur = blockInfoAt(f.x, f.y, rr);
    const nx = f.x + dx / d * f.spd * dt;
    let bi = blockInfoAt(nx, f.y, rr);
    if (!bi || (cur && bi.k === cur.k)) f.x = nx; else hitStructure(bi);
    if (G.baseHp <= 0) return;
    const ny = f.y + dy / d * f.spd * dt;
    bi = blockInfoAt(f.x, ny, rr);
    if (!bi || (cur && bi.k === cur.k)) f.y = ny; else hitStructure(bi);
    if (G.baseHp <= 0) return;
  }

  // 포탑
  for (const [k, b] of G.buildings) {
    if (b.kind !== 'turret') continue;
    b.cd = Math.max(0, (b.cd || 0) - dt);
    if (b.cd > 0) continue;
    const [gx, gy] = k.split(',').map(Number);
    const px = gx * T + T/2, py = gy * T + T/2;
    let best = null, bd = 165 * 165;
    for (const f of G.foes) { const q = (f.x - px) ** 2 + (f.y - py) ** 2; if (q < bd) { bd = q; best = f; } }
    if (best) { b.cd = 0.72; b.angle = Math.atan2(best.y - py, best.x - px);
      G.shots.push({ x:px, y:py, vx:Math.cos(b.angle)*400, vy:Math.sin(b.angle)*400, dmg:9, life:0.7 }); }
  }
  // 탄
  for (const s of [...G.shots]) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) { G.shots = G.shots.filter(o => o !== s); continue; }
    const f = G.foes.find(o => (o.x - s.x) ** 2 + (o.y - s.y) ** 2 < (o.r + 4) ** 2);
    if (f) {
      f.hp -= s.dmg; f.hurt = 0.15;
      G.shots = G.shots.filter(o => o !== s);
      if (f.hp <= 0) {
        const bounty = f.big ? 30 : 6;
        G.gold += bounty; popText(f.x, f.y - 12, '+' + bounty + '$', '#a0d8ec');
        burst(f.x, f.y, '#b0c8d8', 10, 130);
        G.foes = G.foes.filter(o => o !== f);
      }
    }
  }
  for (const q of [...G.parts]) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.text ? 0 : 170) * dt; q.life -= dt * (q.text ? 1.05 : 1.9);
    if (q.life <= 0) G.parts = G.parts.filter(o => o !== q);
  }
  shake = Math.max(0, shake - dt * 30);
  if (bannerT > 0) { bannerT -= dt * 1000; if (bannerT <= 0) $('banner').classList.remove('on'); }
}

/* ── 렌더 ── */
function draw() {
  const sx = shake ? (rnd() - 0.5) * shake : 0, sy = shake ? (rnd() - 0.5) * shake : 0;
  cx.save(); cx.translate(sx, sy);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    cx.fillStyle = ((x + y) & 1) ? '#263544' : '#2a3a48';
    cx.fillRect(x * T, y * T, T, T);
    if (((x * 7 + y * 5) % 13) === 0) { cx.fillStyle = 'rgba(255,255,255,.06)'; cx.fillRect(x * T + 8, y * T + 8, 4, 4); }
  }
  // 바위
  for (const k of ROCK) {
    const [x, y] = k.split(',').map(Number);
    cx.fillStyle = '#18222e'; cx.fillRect(x * T, y * T, T, T);
    cx.fillStyle = '#20303e'; cx.fillRect(x * T + 3, y * T + 3, T - 6, T - 10);
  }
  // 수정
  for (const c of G.crystals) {
    if (c.left <= 0) { cx.fillStyle = 'rgba(160,216,236,.12)'; cx.fillRect(c.x * T + 12, c.y * T + 12, T - 24, T - 24); continue; }
    const px2 = c.x * T + T/2, py2 = c.y * T + T/2;
    cx.fillStyle = '#7ad8f0';
    cx.beginPath(); cx.moveTo(px2, py2 - 13); cx.lineTo(px2 + 10, py2 + 6); cx.lineTo(px2 - 10, py2 + 6); cx.closePath(); cx.fill();
    cx.fillStyle = '#c8f0fa'; cx.fillRect(px2 - 2, py2 - 8, 4, 9);
    cx.fillStyle = 'rgba(0,0,0,.5)'; cx.fillRect(px2 - 13, py2 + 10, 26, 3);
    cx.fillStyle = '#7ad8f0'; cx.fillRect(px2 - 13, py2 + 10, 26 * (c.left / 34), 3);
  }
  // 본부
  cx.fillStyle = '#3a5468'; cx.fillRect(BASE.gx * T, BASE.gy * T, T * 2, T * 2);
  cx.fillStyle = '#4a6a84'; cx.fillRect(BASE.gx * T + 6, BASE.gy * T + 6, T * 2 - 12, T * 2 - 12);
  cx.font = '22px monospace'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText('🏭', baseCX, baseCY);
  cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(BASE.gx * T, BASE.gy * T - 9, T * 2, 5);
  cx.fillStyle = G.baseHp / G.baseMax > 0.4 ? '#6bd18a' : '#e0913f';
  cx.fillRect(BASE.gx * T, BASE.gy * T - 9, T * 2 * (G.baseHp / G.baseMax), 5);
  // 건물
  for (const [k, b] of G.buildings) {
    const [gx, gy] = k.split(',').map(Number);
    const px2 = gx * T, py2 = gy * T;
    if (b.kind === 'wall') {
      cx.fillStyle = '#5a7288'; cx.fillRect(px2 + 2, py2 + 2, T - 4, T - 4);
      cx.fillStyle = '#48607a'; cx.fillRect(px2 + 2, py2 + 2, T - 4, 6);
      cx.fillStyle = '#6a84a0'; cx.fillRect(px2 + 6, py2 + 12, 10, 8); cx.fillRect(px2 + 22, py2 + 12, 10, 8);
      cx.fillRect(px2 + 14, py2 + 24, 10, 8);
    } else {
      cx.fillStyle = '#2e4358'; cx.fillRect(px2 + 6, py2 + 6, T - 12, T - 12);
      cx.fillStyle = '#6ab8d6'; cx.beginPath(); cx.arc(px2 + T/2, py2 + T/2, 9, 0, 7); cx.fill();
      cx.save(); cx.translate(px2 + T/2, py2 + T/2); cx.rotate(b.angle || 0);
      cx.fillStyle = '#12202c'; cx.fillRect(0, -3, 15, 6); cx.restore();
    }
    if (b.hp < b.maxHp) {
      cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(px2 + 4, py2 - 5, T - 8, 4);
      cx.fillStyle = '#e05c4a'; cx.fillRect(px2 + 4, py2 - 5, (T - 8) * (b.hp / b.maxHp), 4);
    }
  }
  // 광부
  for (const m of G.miners) {
    cx.save(); if (m.hurt > 0) cx.filter = 'brightness(2.3)';
    cx.fillStyle = '#e0b83c'; cx.fillRect(m.x - 6, m.y - 12, 12, 5);
    cx.fillStyle = '#f0c49a'; cx.fillRect(m.x - 5, m.y - 7, 10, 7);
    cx.fillStyle = '#4a6a8a'; cx.fillRect(m.x - 6, m.y, 12, 9);
    cx.restore();
    if (m.state === 'mine') { cx.fillStyle = '#c8f0fa'; cx.fillRect(m.x + 7, m.y - 4 + Math.sin(performance.now()/90) * 3, 4, 4); }
    if (m.state === 'return') { cx.font = '9px monospace'; cx.fillStyle = '#7ad8f0'; cx.fillText('💎', m.x + 9, m.y - 8); }
  }
  // 적 — 서리 늑대
  for (const f of G.foes) {
    cx.save(); if (f.hurt > 0) cx.filter = 'brightness(2.4)';
    cx.fillStyle = f.big ? '#8aa4c8' : '#a8bcd4';
    cx.beginPath(); cx.ellipse(f.x, f.y, f.r + 3, f.r - 2, 0, 0, 7); cx.fill();
    cx.fillStyle = f.big ? '#6a84a8' : '#8aa0bc';
    cx.beginPath(); cx.ellipse(f.x + f.r * 0.7, f.y - f.r * 0.4, f.r * 0.55, f.r * 0.4, 0, 0, 7); cx.fill();
    cx.fillStyle = '#3ce0f0'; cx.fillRect(f.x + f.r * 0.6, f.y - f.r * 0.5, 3, 3);
    cx.restore();
    if (f.hp < f.maxHp) {
      const w = f.big ? 40 : 22;
      cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(f.x - w/2, f.y - f.r - 9, w, 4);
      cx.fillStyle = '#e05c4a'; cx.fillRect(f.x - w/2, f.y - f.r - 9, w * (f.hp / f.maxHp), 4);
    }
  }
  for (const s of G.shots) { cx.fillStyle = '#a0e8f8'; cx.fillRect(s.x - 2, s.y - 2, 5, 4); }
  for (const q of G.parts) {
    cx.globalAlpha = clamp(q.life, 0, 1);
    if (q.text) { cx.font = 'bold 12px monospace'; cx.textAlign = 'center'; cx.fillStyle = q.color; cx.fillText(q.text, q.x, q.y); }
    else { cx.fillStyle = q.color; cx.fillRect(q.x, q.y, q.size, q.size); }
    cx.globalAlpha = 1;
  }
  cx.restore();
  $('goldTxt').textContent = '💰 ' + Math.floor(G.gold) + '$';
  $('timeTxt').textContent = '⏱ ' + fmtT(G.time) + ' / ' + fmtT(WIN_SEC);
  $('raidTxt').textContent = G.foes.length ? '⚔ 교전 중 (' + G.foes.length + ')' : '❄ 다음 습격 ' + Math.ceil(G.raidT) + 's';
  $('baseTxt').textContent = '🏭 ' + Math.ceil(G.baseHp) + '/' + G.baseMax + '   ⛏ ' + G.miners.length;
  $('hireBtn').textContent = '⛏ 광부 고용 70$ (' + G.miners.length + '/6)';
  $('hireBtn').disabled = G.gold < 70 || G.miners.length >= 6;
}

/* ── 입력 ── */
function setMode(m) {
  mode = m;
  $('mWall').classList.toggle('on', m === 'wall');
  $('mTurret').classList.toggle('on', m === 'turret');
  $('mDemol').classList.toggle('on', m === 'demol');
}
$('mWall').onclick = () => setMode('wall');
$('mTurret').onclick = () => setMode('turret');
$('mDemol').onclick = () => setMode('demol');
$('hireBtn').onclick = () => { if (G.gold >= 70 && G.miners.length < 6) { G.gold -= 70; G.miners.push(mkMiner()); } };
cv.addEventListener('click', ev => {
  if (!running) return;
  const r = cv.getBoundingClientRect();
  const mx = (ev.clientX - r.left) * (VW / r.width), my = (ev.clientY - r.top) * (VH / r.height);
  const gx = Math.floor(mx / T), gy = Math.floor(my / T);
  if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return;
  const k = bKey(gx, gy);
  if (mode === 'demol') {
    const b = G.buildings.get(k);
    if (b) { G.gold += b.kind === 'wall' ? 12 : 45; G.buildings.delete(k); }
    return;
  }
  if (ROCK.has(k) || baseTiles.has(k) || G.buildings.has(k)) return;
  if (G.crystals.some(c => c.x === gx && c.y === gy && c.left > 0)) return;
  if (mode === 'wall' && G.gold >= 25) { G.gold -= 25; G.buildings.set(k, { kind:'wall', hp:150, maxHp:150 }); }
  if (mode === 'turret' && G.gold >= 90) { G.gold -= 90; G.buildings.set(k, { kind:'turret', hp:90, maxHp:90, cd:0 }); }
});

/* ── 시작/종료 ── */
function startGame() {
  newGame(); running = true; setMode('wall');
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false; $('bar').hidden = false;
  banner('협곡 입구를 막아라!');
}
async function endGame(win) {
  running = false; $('hud').hidden = true; $('bar').hidden = true;
  meta.bestSec = Math.max(meta.bestSec, Math.floor(G.time));
  if (win) meta.clears = (meta.clears || 0) + 1;
  $('endTitle').textContent = win ? '🏆 구조대 도착!' : '💥 전초기지 함락…';
  $('endDesc').textContent = (win ? '12분을 버텨 구조대가 도착했다!' : fmtT(G.time) + ' 만에 본부가 무너졌다.') +
    ' 최고 기록 ' + fmtT(meta.bestSec) + (meta.clears ? ' · 생존 성공 ' + meta.clears + '회' : '');
  $('endPanel').hidden = false;
  await persistMeta();
}
let last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!running || !G) return;
  update(dt);
  if (running && G) draw();
}
requestAnimationFrame(loop);
$('startBtn').onclick = startGame;
$('backBtn').onclick = () => { $('endPanel').hidden = true; $('menu').hidden = false;
  $('bestTxt').textContent = meta.bestSec ? '최고 기록 ' + fmtT(meta.bestSec) : ''; };
$('codeLoadBtn').onclick = async () => {
  const raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  if (await loadMeta(raw)) { saveCode = raw; localStorage.setItem(CODE_KEY, raw);
    $('bestTxt').textContent = meta.bestSec ? '최고 기록 ' + fmtT(meta.bestSec) : ''; showCode(); }
};
loadMeta().then(() => { $('bestTxt').textContent = meta.bestSec ? '최고 기록 ' + fmtT(meta.bestSec) : ''; });
</script>
