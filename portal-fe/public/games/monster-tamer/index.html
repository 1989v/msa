<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Tamer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#eee; font-family:'Courier New',monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:8px; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.6); width:800px; }
  canvas#cv { display:block; background:#05080f; image-rendering:pixelated; }
  #hud { position:absolute; top:8px; left:10px; display:flex; gap:6px; font-size:11px; font-weight:bold; pointer-events:none; text-shadow:1px 1px 0 #000; z-index:2; flex-wrap:wrap; max-width:600px; }
  #hud span { background:rgba(0,0,0,.6); padding:2px 8px; border-radius:10px; }
  #zoneTag { position:absolute; top:8px; right:10px; background:rgba(0,0,0,.6); padding:3px 12px; border-radius:10px; font-size:11px; font-weight:bold; z-index:2; }
  #toast { position:absolute; bottom:56px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.8); padding:5px 16px; border-radius:12px; font-size:12px; z-index:7; transition:opacity .4s; opacity:0; pointer-events:none; max-width:660px; text-align:center; }
  .panel { position:absolute; inset:0; background:rgba(10,14,28,.96); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; z-index:12; padding:20px; }
  .panel h1 { color:#ffd54a; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:13px; color:#ccc; line-height:1.7; max-width:600px; }
  button { background:#ffd54a; color:#0c1424; border:0; padding:9px 18px; font-weight:bold; font-size:13px; border-radius:8px; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:#2c3550; color:#eee; }
  .starters { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .starters button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 14px; }
  #saveStatus { font-size:11px; color:#8a93a8; }
  #info { margin-top:10px; font-size:11px; color:#667; text-align:center; line-height:1.6; }

  /* ── 배틀: 포켓몬식 상하 대치 ── */
  #battle { position:absolute; inset:0; background:linear-gradient(#7fc4e8 0%,#a8dcf0 45%,#8fce7a 45%,#69b45c 100%); display:none; flex-direction:column; z-index:5; }
  #battle.on { display:flex; }
  #bField { flex:1; position:relative; }
  .side { position:absolute; display:flex; flex-direction:column; align-items:center; }
  .side.foe { top:14px; right:70px; }
  .side.mine { bottom:6px; left:70px; }
  .plat { width:150px; height:26px; border-radius:50%; background:rgba(60,110,50,.45); margin-top:-14px; }
  .side.mine .plat { width:190px; height:32px; }
  .sprite { image-rendering:pixelated; filter:drop-shadow(2px 4px 3px rgba(0,0,0,.35)); }
  .side.foe .sprite { width:120px; height:120px; }
  .side.mine .sprite { width:150px; height:150px; }
  .sprite.shinyGlow { animation:shinyPulse 1.4s ease-in-out infinite; }
  @keyframes shinyPulse { 0%,100% { filter:drop-shadow(0 0 4px #fff3a0) drop-shadow(2px 4px 3px rgba(0,0,0,.35)); } 50% { filter:drop-shadow(0 0 16px #ffd54a) drop-shadow(0 0 26px #fff) drop-shadow(2px 4px 3px rgba(0,0,0,.35)); } }
  .sparkles { position:absolute; inset:-10px; pointer-events:none; }
  .sparkles i { position:absolute; font-size:15px; animation:spark 1.6s linear infinite; opacity:0; }
  @keyframes spark { 0% { opacity:0; transform:scale(.4) rotate(0); } 40% { opacity:1; transform:scale(1.1) rotate(60deg); } 100% { opacity:0; transform:scale(.5) rotate(140deg); } }
  .infoBox { position:absolute; background:rgba(255,253,240,.95); color:#20242e; border:3px solid #4a5568; border-radius:10px; padding:6px 12px; min-width:230px; box-shadow:2px 3px 0 rgba(0,0,0,.25); }

  .infoBox.mine { bottom:14px; right:24px; }

  .hpBar { height:9px; background:#3c4250; border-radius:5px; overflow:hidden; margin:5px 0 2px; border:1px solid #20242e; }
  .hpBar i { display:block; height:100%; background:#38c95a; transition:width .3s; }
  .hpBar i.mid { background:#e8b81f; } .hpBar i.low { background:#e04a3a; }
  .infoBox small { font-size:10px; color:#4a5568; }
  .expBar { height:4px; background:#3c4250; border-radius:3px; overflow:hidden; margin-top:3px; }
  .expBar i { display:block; height:100%; background:#3aa8e8; }
  .st { font-size:9px; padding:1px 5px; border-radius:5px; color:#fff; }
  .st.PSN { background:#7b2d8b; } .st.BRN { background:#b8431f; } .st.PAR { background:#a68b00; } .st.SLP { background:#4a5568; } .st.FRZ { background:#2b6cb0; }
  #bLog { min-height:44px; font-size:13px; color:#20242e; background:rgba(255,253,240,.95); border-top:3px solid #4a5568; text-align:left; padding:8px 16px; line-height:1.5; }
  #bBtns { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:8px 14px 14px; background:#e8e4d4; }
  #bBtns button { padding:9px 5px; font-size:12px; }
  #bBtns button small { display:block; font-weight:normal; color:#4a3a00; font-size:10px; }
  #bBtns button.ghost small { color:#8a93a8; }

  #dialog { position:absolute; left:12px; right:12px; bottom:12px; background:rgba(6,10,22,.95); border:2px solid #ffd54a; border-radius:10px; padding:12px 16px; font-size:13px; line-height:1.7; z-index:8; }
  #dialog .next { color:#8a93a8; font-size:11px; text-align:right; }
  .overlay { position:absolute; inset:0; background:rgba(10,14,28,.96); display:none; flex-direction:column; align-items:center; padding:14px; gap:6px; z-index:9; overflow:auto; }
  .overlay.on { display:flex; }
  .overlay h2 { color:#ffd54a; font-size:16px; }
  .menuRow { display:flex; gap:8px; align-items:center; font-size:12px; width:700px; justify-content:space-between; background:#141d33; border:1px solid #2c3550; border-radius:8px; padding:6px 11px; }
  .menuRow.sel { border-color:#ffd54a; } .menuRow.on { border-color:#22c55e; }

  .typeTag { display:inline-block; padding:0 6px; border-radius:4px; font-size:10px; color:#fff; margin-right:3px; }
</style>

<script>

const API = '/api/v1/games/monster-tamer';

const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rand = () => Math.random();
const ri = n => Math.floor(rand() * n);
function mulberry(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

/* ═══════════ 사운드 (WebAudio, 외부 파일 없음) ═══════════ */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function beep(freq, dur, type = 'square', vol = 0.05, delay = 0) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(ac.destination);
  const t0 = ac.currentTime + delay;
  o.start(t0); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.stop(t0 + dur + 0.02);
}
const SFX = {
  hit:() => beep(180, 0.09, 'square', 0.05),
  crit:() => { beep(260, 0.07); beep(360, 0.09, 'square', 0.05, 0.06); },
  faint:() => { beep(300, 0.12, 'sawtooth', 0.05); beep(160, 0.22, 'sawtooth', 0.05, 0.1); },
  level:() => [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.12, 'triangle', 0.05, i * 0.08)),
  heal:() => [660, 880].forEach((f, i) => beep(f, 0.13, 'sine', 0.05, i * 0.1)),
  encounter:() => [440, 330, 550].forEach((f, i) => beep(f, 0.1, 'square', 0.05, i * 0.08)),
  shiny:() => [1046, 1318, 1568, 2093].forEach((f, i) => beep(f, 0.16, 'sine', 0.06, i * 0.1)),
  catch:() => [523, 659, 880].forEach((f, i) => beep(f, 0.14, 'triangle', 0.05, i * 0.12)),
  select:() => beep(720, 0.04, 'square', 0.03),
  evolve:() => [392, 523, 659, 784, 1046].forEach((f, i) => beep(f, 0.18, 'triangle', 0.055, i * 0.13)),
};

/* ═══════════ 15 타입 ═══════════ */
const TYPES = ['NORMAL','FIRE','WATER','GRASS','ELECTRIC','ICE','FIGHT','POISON','GROUND','FLYING','PSYCHIC','BUG','ROCK','GHOST','DRAGON'];

  FIGHT:['연속펀치','바위깨기','기와깨기','인파이트'], POISON:['독침','오물공격','독가시','헤도로폭탄'],
  GROUND:['모래뿌리기','땅고르기','지진','대지의힘'], FLYING:['날개치기','공중날기','제비반환','폭풍'],
  PSYCHIC:['염동력','환상빔','사이코키네시스','정신붕괴'], BUG:['벌레먹기','바늘가시','시저크로스','메가혼'],

  DRAGON:['용의숨결','용의날개','드래곤클로','역린'],

const TIER = [[40,100,30],[60,95,20],[85,95,10],[110,85,5]];
const MOVES = { struggle:{ name:'발버둥', type:'NORMAL', power:40, acc:100, pp:Infinity } };
TYPES.forEach(t => TYPE_MOVE_NAMES[t].forEach((name, i) => { MOVES[t.toLowerCase() + i] = { name, type:t, power:TIER[i][0], acc:TIER[i][1], pp:TIER[i][2] }; }));

/* ═══════════ 102종 ═══════════ */
const FAMILIES = [

  if (action.slot) { action.slot.pp -= 1; myMove = MOVES[action.slot.id]; } else myMove = MOVES.struggle;
  let msg = '';
  const mine = () => { msg += applyMove(my, foe, myMove, false); if (foe.hp <= 0) { SFX.faint(); msg += winFoe(); } };
  const theirs = () => { if (!B.over && foe.hp > 0) msg += foeTurn(); };
  if (effSpd(my) >= effSpd(foe)) { mine(); theirs(); } else { theirs(); if (!B.over && my.hp > 0) mine(); }
  if (!B.over) {
    msg += statusTick(my); msg += statusTick(foe);
    if (my.hp <= 0) { const n = S.party.find(m => m.hp > 0); if (n) { B.my = n; msg += ' ' + monName(n) + ' 등장!'; } else { B.over = true; B.lost = true; msg += ' 전멸…'; } }
    if (foe.hp <= 0 && !B.over) msg += winFoe();
  }
  log(msg.trim()); renderBattle();
}
function dropUnique(reason) {
  if (rand() >= uniqueDropRate()) return;
  const keys = Object.keys(UNIQUES), k = keys[ri(keys.length)];
  S.uniques[k] = (S.uniques[k] || 0) + 1; recalcParty();
  toast('🎁 ' + reason + ' — ' + UNIQUES[k].emoji + ' ' + UNIQUES[k].name + ' 획득!');
}
function winFoe() {
  const fd = DEX[B.foe.id];
  const before = researchStage(B.foe.id);
  S.research[B.foe.id] = (S.research[B.foe.id] || 0) + 1;
  const after = researchStage(B.foe.id);
  let msg = ' ' + monName(B.foe) + ' 격파!';
  if (after > before) { recalcParty(); msg += ' 🔬' + fd.name + ' 리서치 ' + after + '단계!'; }
  if (B.foe.shiny) dropUnique('✨이로치 격파');
  const alive = S.party.filter(m => m.hp > 0);
  const totalExp = Math.floor(fd.baseExp * B.foe.lv / 7 * (B.wild ? 1 : 1.5) * (1 + (S.totems.growth ? 0.25 : 0)));
  S.gold += Math.floor((B.wild ? 12 + B.foe.lv * 5 : 0) * goldMult());
  const share = Math.max(1, Math.floor(totalExp / Math.max(1, alive.length)));
  msg += ' EXP ' + share + '×' + alive.length;
  alive.forEach(m => {
    m.exp += Math.floor(share * (m.held === 'luckyegg' ? 1.5 : 1));
    // 노력치(스탯 경험치) — 쓰러뜨린 상대의 종족값 누적
    m.se = m.se || { hp:0, atk:0, def:0, spc:0, spd:0 };
    ['hp','atk','def','spc','spd'].forEach(k => { m.se[k] = Math.min(65535, m.se[k] + fd[k]); });
    msg += levelCheck(m);
  });
  if (!B.wild && B.queue.length) { B.foe = B.queue.shift(); return msg + ' — ' + B.trainer.name + ' 의 ' + DEX[B.foe.id].name + ' 등장!'; }
  if (!B.wild) {
    const t = B.trainer;
    if (t.badge && !S.badges.includes(t.badge)) S.badges.push(t.badge);
    if (t.trainerId) S.beaten.add(t.trainerId);
    S.gold += t.gold;
    msg += (t.badge ? ' 🏅 배지 획득!' : ' 승리!') + ' 💰+' + t.gold;
    if (t.totem && !S.totems[t.totem]) { S.totems[t.totem] = 1; recalcParty(); msg += ' 🗿' + TOTEMS[t.totem].name + ' 획득!'; }
    if (t.ascend) B.ascend = true;
  }
  B.over = true;
  return msg;
}
function levelCheck(m) {
  let msg = '';
  while (m.lv < 99 && m.exp >= expForLevel(m.lv + 1)) {
    m.lv += 1;
    const prev = m.maxHp; recalcStats(m); m.hp = Math.min(m.maxHp, m.hp + (m.maxHp - prev));
    msg += ' ⬆' + DEX[m.id].name + ' Lv.' + m.lv; SFX.level();
    // 신규 기술 — 4개 초과면 선택 큐로
    const learnNow = DEX[m.id].learn.filter(([l]) => l === m.lv).map(([, id]) => id);
    learnNow.forEach(nid => {
      if (m.moves.some(x => x.id === nid)) return;
      if (m.moves.length < 4) { m.moves.push(mkMove(nid)); msg += ' ✨' + MOVES[nid].name + ' 습득!'; }
      else { S.pendingLearn.push({ mon:m, move:nid }); msg += ' 📘' + MOVES[nid].name + ' 학습 대기'; }
    });
    const d = DEX[m.id];
    if (d.evolveTo && m.lv >= d.evolveLv) { m.id = d.evolveTo; recalcStats(m); syncMoves(m); S.dex.add(m.id); SFX.evolve(); msg += ' 🌟' + DEX[m.id].name + ' 진화!'; }
  }
  if (m.lv >= 99) m.exp = expForLevel(99);
  return msg;
}
function tryRun() { if (rand() < 0.75) { B.over = true; log('무사히 도망쳤다!'); } else log('도망칠 수 없었다!' + foeTurn()); renderBattle(); }
function ascend() {
  S.ascension += 1; S.badges = []; S.taken = {}; S.beaten = new Set(); S.map = 'village';
  const st = MAPS.village.start; P.tx = st.x; P.ty = st.y; P.moving = false;
  S.party.forEach(fullRest); recalcParty(); reveal(); persist(true);
  // 회차 보상 — 몬스터 1마리 영구 강화 선택
  S.mode = 'menu'; $('menu').classList.add('on');
  const body = $('menuBody'); body.innerHTML = '';
  const p = document.createElement('p'); p.style.cssText = 'font-size:13px;color:#ffd54a;text-align:center;line-height:1.8';
  p.innerHTML = '🌀 <b>' + S.ascension + '회차 각성!</b> 세계가 다시 태어났다 — 적 레벨 +' + (S.ascension * 8) + ', 파티 +' + (S.ascension * 8) + '%<br>' +
    '보상: 몬스터 <b>한 마리</b>를 영구히 한 단계(⭐ +8%) 강화하세요.';
  body.appendChild(p);
  S.party.concat(S.box).forEach(m => {
    const r = document.createElement('div'); r.className = 'menuRow';
    r.innerHTML = spriteImg(m, 42) + '<span class="grow"><b>' + monName(m) + '</b> Lv.' + m.lv + ' ' + typeTag(DEX[m.id].type) +
      '<small>현재 ⭐' + (m.grade || 0) + ' 단계 · HP ' + m.maxHp + ' ATK ' + m.atk + '</small></span>';
    const b = document.createElement('button'); b.textContent = '⭐ 강화';
    b.onclick = () => { m.grade = (m.grade || 0) + 1; recalcStats(m); SFX.evolve(); toast('⭐ ' + monName(m) + ' 이(가) ' + m.grade + '단계 강화되었다!'); closeMenu(); persist(true); };
    r.appendChild(b); body.appendChild(r);
  });
}
function endBattle() {
  const lost = B.lost, doAsc = B.ascend;
  $('battle').classList.remove('on'); B = null; S.mode = 'world';
  if (lost) { S.party.forEach(fullRest); S.map = 'village'; const st = MAPS.village.start; P.tx = st.x; P.ty = st.y; P.moving = false; reveal(); }
  hud(); persist(true);
  if (doAsc) ascend(); else processPending();
}

/* ═══════════ 렌더 ═══════════ */
const TILE_STYLE = { '#':'#1d3a24', '.':'#3f7a45', ',':'#3f7a45', 'g':'#2e5d33', 'w':'#28587a', 'c':'#4a4038', 'C':'#241f1a', 'r':'#3a3330', 'H':'#3f7a45', 's':'#3f7a45', 'b':'#2a4d2f', 'B':'#4a4038' };
const TILE_EMOJI = { '#':'🌲', ',':'🌼', 'g':'🌿', 'w':'🌊', 'C':'⛰', 'r':'🪨', 'H':'🏥', 's':'🏪', 'b':'🌳', 'B':'🗿' };
function playerPix() {
  if (!P.moving) return { x:P.tx * T, y:P.ty * T, bob:0 };
  const fx = P.tx + (P.ntx - P.tx) * P.prog, fy = P.ty + (P.nty - P.ty) * P.prog;
  return { x:fx * T, y:fy * T, bob:Math.sin(P.prog * Math.PI) * 3 };
}
function draw() {
  const m = curMap(), pp = playerPix(), set = exploredSet();
  const camX = Math.max(0, Math.min(m.W * T - VIEW_W * T, pp.x - (VIEW_W >> 1) * T));
  const camY = Math.max(0, Math.min(m.H * T - VIEW_H * T, pp.y - (VIEW_H >> 1) * T));
  cx.fillStyle = '#05080f'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const x0 = Math.floor(camX / T), y0 = Math.floor(camY / T);
  for (let vy = y0; vy <= y0 + VIEW_H; vy++) for (let vx = x0; vx <= x0 + VIEW_W; vx++) {
    if (!set.has(vx + ',' + vy)) continue;
    const t = m.grid[vy]?.[vx] ?? m.wall, sx = vx * T - camX, sy = vy * T - camY;
    cx.fillStyle = TILE_STYLE[t] || '#1d3a24'; cx.fillRect(sx, sy, T, T);
    const e = TILE_EMOJI[t];
    if (e) { cx.font = (t === '#' || t === 'C' || t === 'r' ? '22px' : t === ',' ? '13px' : '17px') + ' monospace'; cx.fillStyle = '#fff'; cx.fillText(e, sx + T / 2, sy + T / 2 + 1); }
    if (Math.max(Math.abs(vx - P.tx), Math.abs(vy - P.ty)) > SIGHT) { cx.fillStyle = 'rgba(5,8,15,.55)'; cx.fillRect(sx, sy, T, T); }
  }
  const vis = (x, y) => set.has(x + ',' + y) && Math.max(Math.abs(x - P.tx), Math.abs(y - P.ty)) <= SIGHT;
  cx.font = '15px monospace'; cx.fillStyle = '#ffd54a';
  for (const ex of m.exits) if (set.has(ex.x + ',' + ex.y)) cx.fillText(S.badges.length < ex.need ? '🚧' : ex.dir, ex.x * T - camX + T / 2, ex.y * T - camY + T / 2);
  cx.font = '16px monospace';
  m.items.forEach((s, i) => { if (!(S.taken[S.map] || []).includes(i) && vis(s.x, s.y))
    cx.fillText(s.hm ? HMS[s.hm].emoji : s.car ? '🚙' : s.held ? '🎁' : '💊', s.x * T - camX + T / 2, s.y * T - camY + T / 2); });
  cx.font = '22px monospace';
  for (const n of m.npcs) if (!cleared(n) && vis(n.x, n.y)) {
    cx.fillText(n.emoji, n.x * T - camX + T / 2, n.y * T - camY + T / 2);
    if (n.trainerId) { cx.font = '11px monospace'; cx.fillStyle = 'rgba(255,80,80,.75)';
      for (let i = 1; i <= n.sight; i++) { const tx2 = n.x + n.dir[0] * i, ty2 = n.y + n.dir[1] * i;
        if (!canPass(tileAt(tx2, ty2))) break;
        if (vis(tx2, ty2)) cx.fillText('·', tx2 * T - camX + T / 2, ty2 * T - camY + T / 2); }
      cx.fillStyle = '#fff'; cx.font = '22px monospace'; }
  }
  const px = pp.x - camX + T / 2, py = pp.y - camY + T / 2;
  cx.fillStyle = 'rgba(0,0,0,.3)'; cx.beginPath(); cx.ellipse(px, py + 11, 9, 4, 0, 0, Math.PI * 2); cx.fill();
  cx.font = '22px monospace'; cx.fillStyle = '#fff';
  cx.fillText(S.driving ? '🚙' : tileAt(P.tx, P.ty) === 'w' ? '🏄' : P.dir[0] === -1 ? '🚶' : P.dir[0] === 1 ? '🚶‍➡️' : '🧑‍🌾', px, py - pp.bob);
  if (isNight()) { cx.fillStyle = 'rgba(20,28,80,.30)'; cx.fillRect(0, 0, cv.width, cv.height); }
  $('zoneTag').textContent = m.name + (isNight() ? ' 🌙' : ' ☀');
}
function hud() {
  $('ascTxt').textContent = '🌀' + S.ascension;
  $('timeTxt').textContent = (isNight() ? '🌙' : '☀') + clockStr();
  $('partyTxt').textContent = S.party.map(m => (m.shiny ? '✨' : '') + DEX[m.id].emoji + m.lv).join(' ') || '-';
  $('dexTxt').textContent = '📖' + S.dex.size + '/' + SPECIES.length;
  $('goldTxt').textContent = '💰' + S.gold;
  $('badgeTxt').textContent = '🏅' + S.badges.length + '/9';
  $('totemTxt').textContent = '🗿' + totemKinds() + '/6' + (S.box.length ? ' 📦' + S.box.length : '');
}

/* ═══════════ 시작 ═══════════ */
function enterWorld() {
  $('title').hidden = true; $('starterPanel').hidden = true;
  $('hud').hidden = false; $('zoneTag').hidden = false;
  S.mode = 'world'; reveal(); hud();
}
function newGame() {
  $('title').hidden = true; $('starterPanel').hidden = false;
  const box = $('starterBtns'); box.innerHTML = '';
  STARTERS.forEach(id => {
    const d = DEX[id];
    const b = document.createElement('button');
    b.innerHTML = '<img src="' + spriteDataUrl(id, false) + '" style="width:64px;height:64px">' + d.name +
      '<small>' + TYPE_KO[d.type] + ' · 종족값 ' + (d.hp + d.atk + d.def + d.spc + d.spd) + '</small>';
    b.onclick = () => {
      Object.assign(S, { party:[], box:[], dex:new Set([id]), gold:1000, badges:[],
        items:{ potion:3, superpotion:0, fullheal:1, ether:1, ball:5, greatball:0, ultraball:0 },
        taken:{}, totems:{}, uniques:{}, research:{}, ascension:0, shinyCount:0, map:'village',
        hms:{}, visited:{ village:1 }, explored:{}, beaten:new Set(), minutes:8 * 60, car:false, driving:false, pendingLearn:[] });
      S.party = [mkMon(id, 5, { mine:true })];
      const st = MAPS.village.start;
      Object.assign(P, { tx:st.x, ty:st.y, moving:false, prog:0, dir:[0,1] });
      SFX.level(); enterWorld(); persist(true);
      showDialog(['여정 시작! 지역 경계의 ▸ 를 밟으면 다음 지역으로 이동한다.',
        '트레이너와 눈이 마주치면(붉은 점) 배틀이 시작된다. 🏥 는 회복 + 📦보관소.',
        '낮과 밤에 나타나는 몬스터가 다르다. C 키는 탈것, X 키는 메뉴.']);
    };
    box.appendChild(b);
  });
}
function continueGame(saved) {
  S.party = (saved.party || []).map(m => { const x = { ...m, field:m.field || [], dv:m.dv || dvRoll(), se:m.se || { hp:0,atk:0,def:0,spc:0,spd:0 }, grade:m.grade || 0 }; if (!x.moves?.[0]?.id) syncMoves(x); return x; });
  S.box = (saved.box || []).map(m => ({ ...m, dv:m.dv || dvRoll(), se:m.se || { hp:0,atk:0,def:0,spc:0,spd:0 }, grade:m.grade || 0 }));
  S.dex = new Set(saved.dex || []);
  S.items = { potion:0, superpotion:0, fullheal:0, ether:0, ball:0, greatball:0, ultraball:0, ...(saved.items || {}) };
  S.gold = saved.gold ?? 1000; S.badges = saved.badges || []; S.taken = saved.taken || {};
  S.totems = saved.totems || {}; S.uniques = saved.uniques || {}; S.research = saved.research || {};
  S.ascension = saved.ascension || 0; S.shinyCount = saved.shinyCount || 0;
  S.hms = saved.hms || {}; S.visited = saved.visited || { village:1 };
  S.beaten = new Set(saved.beaten || []); S.minutes = saved.minutes ?? 8 * 60; S.car = !!saved.car; S.driving = false;
  S.pendingLearn = [];
  S.explored = {};
  for (const [k, arr] of Object.entries(saved.explored || {})) S.explored[k] = new Set(arr);
  S.map = MAPS[saved.map] ? saved.map : 'village';
  const pos = saved.pos || MAPS[S.map].start;
  Object.assign(P, { tx:pos.x, ty:pos.y, moving:false, prog:0, dir:[0,1] });
  if (!canPass(tileAt(P.tx, P.ty))) { const st = MAPS[S.map].start; P.tx = st.x; P.ty = st.y; }
  recalcParty(); enterWorld();
}
loadSave().then(saved => {
  if (saved && saved.party?.length) { $('continueBtn').hidden = false; $('continueBtn').onclick = () => continueGame(saved); }
  $('newBtn').onclick = newGame;
});
</script>
