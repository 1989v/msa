<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Tamer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#eee; font-family:'Courier New',monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:8px; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.6); width:800px; }
  canvas { display:block; background:#1d3a24; image-rendering:pixelated; }
  #hud { position:absolute; top:8px; left:10px; display:flex; gap:8px; font-size:12px; font-weight:bold; pointer-events:none; text-shadow:1px 1px 0 #000; z-index:2; }
  #hud span { background:rgba(0,0,0,.55); padding:2px 9px; border-radius:10px; }
  #zoneTag { position:absolute; top:8px; right:10px; background:rgba(0,0,0,.55); padding:3px 12px; border-radius:10px; font-size:12px; font-weight:bold; z-index:2; }
  #toast { position:absolute; bottom:56px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); padding:5px 16px; border-radius:12px; font-size:12px; z-index:7; transition:opacity .4s; opacity:0; pointer-events:none; max-width:600px; }
  .panel { position:absolute; inset:0; background:rgba(10,14,28,.95); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#ffd54a; font-size:26px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:13px; color:#ccc; line-height:1.7; max-width:560px; }
  button { background:#ffd54a; color:#0c1424; border:0; padding:9px 18px; font-weight:bold; font-size:13px; border-radius:8px; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:#2c3550; color:#eee; }
  .starters { display:flex; gap:12px; }
  .starters button { display:flex; flex-direction:column; gap:4px; padding:12px 18px; }
  #saveStatus { font-size:11px; color:#8a93a8; }
  #info { margin-top:10px; font-size:11px; color:#667; text-align:center; line-height:1.6; }

  #battle { position:absolute; inset:0; background:linear-gradient(#28406b,#182643); display:none; flex-direction:column; z-index:5; }
  #battle.on { display:flex; }
  .bRow { flex:1; display:flex; align-items:center; justify-content:space-around; }
  .mon { text-align:center; }
  .mon .sprite { font-size:60px; filter:drop-shadow(2px 3px 2px rgba(0,0,0,.5)); }
  .mon .sprite.shiny { filter:drop-shadow(0 0 10px #ffd54a) saturate(1.6) hue-rotate(40deg); }
  .hpBar { width:180px; height:11px; background:#0c1424; border-radius:5px; overflow:hidden; margin:6px auto 2px; border:1px solid #000; }
  .hpBar i { display:block; height:100%; background:#22c55e; transition:width .25s; }
  .hpBar i.low { background:#ef4444; }
  .mon .label { font-size:12px; font-weight:bold; text-shadow:1px 1px 0 #000; }
  #bLog { min-height:42px; font-size:13px; color:#ffd54a; text-align:center; padding:4px 14px; text-shadow:1px 1px 0 #000; }
  #bBtns { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:0 14px 14px; }
  #bBtns button { padding:9px 5px; font-size:12px; }
  #bBtns button small { display:block; font-weight:normal; color:#4a3a00; font-size:10px; }
  #bBtns button.ghost small { color:#8a93a8; }

  #dialog { position:absolute; left:12px; right:12px; bottom:12px; background:rgba(6,10,22,.94); border:2px solid #ffd54a; border-radius:10px; padding:12px 16px; font-size:13px; line-height:1.7; z-index:8; }
  #dialog .next { color:#8a93a8; font-size:11px; text-align:right; }
  .overlay { position:absolute; inset:0; background:rgba(10,14,28,.96); display:none; flex-direction:column; align-items:center; padding:18px; gap:8px; z-index:9; overflow:auto; }
  .overlay.on { display:flex; }
  .overlay h2 { color:#ffd54a; font-size:18px; }
  .menuRow { display:flex; gap:8px; align-items:center; font-size:12px; width:640px; justify-content:space-between; background:#141d33; border:1px solid #2c3550; border-radius:8px; padding:8px 12px; }
  .menuRow.sel { border-color:#ffd54a; }
  .menuRow.on { border-color:#22c55e; }
  .menuRow .grow { flex:1; text-align:left; line-height:1.5; }
  .menuRow small { color:#8a93a8; display:block; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="800" height="480"></canvas>
  <div id="hud" hidden><span id="ascTxt"></span><span id="partyTxt"></span><span id="dexTxt"></span><span id="goldTxt"></span><span id="badgeTxt"></span><span id="totemTxt"></span></div>
  <div id="zoneTag" hidden></div>
  <div id="toast"></div>

  <div id="battle">
    <div class="bRow">
      <div class="mon"><div class="sprite" id="mySprite"></div><div class="hpBar"><i id="myHp"></i></div><div class="label" id="myLabel"></div></div>
      <div class="mon"><div class="sprite" id="foeSprite"></div><div class="hpBar"><i id="foeHp"></i></div><div class="label" id="foeLabel"></div></div>
    </div>
    <div id="bLog"></div>
    <div id="bBtns"></div>
  </div>

  <div id="dialog" hidden><div id="dialogText"></div><div class="next">Z / Enter ▶</div></div>

  <div class="overlay" id="menu">
    <h2>메뉴 <small style="color:#8a93a8;font-size:11px">(X 로 닫기)</small></h2>
    <div class="tabs">
      <button id="tabParty">🔁 몬스터</button>
      <button id="tabBag" class="ghost">🎒 가방</button>
      <button id="tabTotem" class="ghost">🗿 유물</button>
      <button id="tabDex" class="ghost">📖 리서치</button>
      <button id="tabSave" class="ghost">💾 저장</button>
      <button id="menuClose" class="ghost">닫기</button>
    </div>
    <div id="menuBody" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>

  <div class="overlay" id="shop">
    <h2>🏪 상점</h2>
    <div id="shopRows" style="display:flex;flex-direction:column;gap:8px;"></div>
    <div class="menuRow"><span id="shopGold"></span><button class="ghost" id="shopClose">나가기</button></div>
  </div>

  <div class="panel" id="title">
    <h1>🐾 Monster Tamer</h1>
    <p>10개 지역을 여행하며 몬스터를 수집·육성하고 수호자 6명을 꺾자.
       챔피언을 넘어 <b>심연</b>을 돌파하면 <b>각성 회차</b>가 시작된다 —
       파티와 유물은 그대로, 세계는 더 강해진다. 🗿유물을 모으면 ✨이로치 출현률이 오른다.</p>
    <div style="display:flex; gap:10px;">
      <button id="continueBtn" hidden>▶ 이어하기</button>
      <button id="newBtn" class="ghost">새 게임</button>
    </div>
    <div id="saveStatus"></div>
  </div>

  <div class="panel" id="starterPanel" hidden>
    <h1>스타터 선택</h1>
    <p>여행을 함께할 첫 파트너를 고르세요. Lv.16 에 진화합니다.</p>
    <div class="starters" id="starterBtns"></div>
  </div>
</div>
<div id="info">이동: 방향키/WASD 홀드 · 확인/말걸기: Z·Enter · 메뉴: <b>X</b> · 🏥 HP/PP 회복 · 🗿 유물 · 지역 경계 ▸ 로 이동</div>
<script>
'use strict';
const API = '/api/v1/games/monster-tamer';
const T = 32, VIEW_W = 25, VIEW_H = 15;
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rand = () => Math.random();
const ri = n => Math.floor(rand() * n);

/* ═══════════ 기술 / 도감 ═══════════ */
const CHART = {
  FLAME:{ LEAF:200, AQUA:50, STONE:50 }, AQUA:{ FLAME:200, STONE:200, LEAF:50 },
  LEAF:{ AQUA:200, STONE:200, FLAME:50 }, SPARK:{ AQUA:200, LEAF:50, STONE:50 },
  STONE:{ FLAME:200, SPARK:200, AQUA:50, LEAF:50 }, NORMAL:{},
};
const mult = (a, d) => (CHART[a] && CHART[a][d]) || 100;
const MOVES = {
  struggle:{ name:'발버둥', type:'NORMAL', power:35, acc:100, pp:Infinity },
  tackle:{ name:'몸통박치기', type:'NORMAL', power:40, acc:100, pp:35 },
  scratch:{ name:'할퀴기', type:'NORMAL', power:45, acc:100, pp:35 },
  headbutt:{ name:'박치기', type:'NORMAL', power:65, acc:95, pp:15 },
  slam:{ name:'내려찍기', type:'NORMAL', power:80, acc:85, pp:10 },
  ember:{ name:'불꽃세례', type:'FLAME', power:45, acc:100, pp:25 },
  firefang:{ name:'불꽃깨물기', type:'FLAME', power:65, acc:95, pp:15 },
  flameburst:{ name:'화염방사', type:'FLAME', power:90, acc:90, pp:8 },
  bubble:{ name:'거품', type:'AQUA', power:45, acc:100, pp:25 },
  waterjet:{ name:'거품제트', type:'AQUA', power:65, acc:95, pp:15 },
  torrent:{ name:'급류', type:'AQUA', power:90, acc:90, pp:8 },
  vine:{ name:'덩굴채찍', type:'LEAF', power:45, acc:100, pp:25 },
  leafblade:{ name:'리프블레이드', type:'LEAF', power:65, acc:95, pp:15 },
  solarbeam:{ name:'솔라빔', type:'LEAF', power:95, acc:85, pp:8 },
  spark:{ name:'스파크', type:'SPARK', power:50, acc:100, pp:25 },
  bolt:{ name:'번개엄니', type:'SPARK', power:70, acc:95, pp:15 },
  thunder:{ name:'벼락', type:'SPARK', power:95, acc:80, pp:8 },
  pebble:{ name:'돌던지기', type:'STONE', power:50, acc:95, pp:25 },
  rockroll:{ name:'바위굴리기', type:'STONE', power:70, acc:90, pp:15 },
  landslide:{ name:'낙석', type:'STONE', power:90, acc:85, pp:8 },
};
const DEX = {
  flarepup:{ name:'플레어펍', emoji:'🦊', type:'FLAME', hp:39, atk:52, def:43, spd:65,
    learn:[[1,'scratch'],[1,'ember'],[9,'firefang'],[15,'headbutt']], evolveTo:'flarehound', evolveLv:16 },
  flarehound:{ name:'플레어하운드', emoji:'🐺', type:'FLAME', hp:58, atk:74, def:58, spd:80,
    learn:[[1,'scratch'],[1,'firefang'],[16,'flameburst'],[22,'slam']] },
  aquafin:{ name:'아쿠아핀', emoji:'🐟', type:'AQUA', hp:44, atk:48, def:65, spd:43,
    learn:[[1,'tackle'],[1,'bubble'],[9,'waterjet'],[15,'headbutt']], evolveTo:'aquarex', evolveLv:16 },
  aquarex:{ name:'아쿠아렉스', emoji:'🦈', type:'AQUA', hp:64, atk:68, def:82, spd:56,
    learn:[[1,'tackle'],[1,'waterjet'],[16,'torrent'],[22,'slam']] },
  leafling:{ name:'리플링', emoji:'🦎', type:'LEAF', hp:45, atk:49, def:49, spd:45,
    learn:[[1,'tackle'],[1,'vine'],[9,'leafblade'],[15,'headbutt']], evolveTo:'leafdrake', evolveLv:16 },
  leafdrake:{ name:'리프드레이크', emoji:'🐉', type:'LEAF', hp:66, atk:70, def:66, spd:62,
    learn:[[1,'tackle'],[1,'leafblade'],[16,'solarbeam'],[22,'slam']] },
  moppit:{ name:'몹핏', emoji:'🐹', type:'NORMAL', hp:48, atk:45, def:45, spd:50,
    learn:[[1,'tackle'],[5,'scratch'],[11,'headbutt'],[18,'slam']] },
  sparklit:{ name:'스파클릿', emoji:'🐭', type:'SPARK', hp:35, atk:55, def:40, spd:90,
    learn:[[1,'scratch'],[1,'spark'],[12,'bolt'],[20,'thunder']] },
  pebblun:{ name:'페블런', emoji:'🐢', type:'STONE', hp:50, atk:45, def:80, spd:25,
    learn:[[1,'tackle'],[1,'pebble'],[12,'rockroll'],[20,'landslide']] },
  mossbug:{ name:'모스버그', emoji:'🐛', type:'LEAF', hp:40, atk:42, def:50, spd:40,
    learn:[[1,'tackle'],[1,'vine'],[10,'leafblade']] },
  dewpip:{ name:'듀핍', emoji:'🦆', type:'AQUA', hp:42, atk:50, def:44, spd:60,
    learn:[[1,'tackle'],[1,'bubble'],[10,'waterjet'],[17,'torrent']] },
  cinderimp:{ name:'신더임프', emoji:'🦂', type:'FLAME', hp:44, atk:58, def:46, spd:70,
    learn:[[1,'scratch'],[1,'ember'],[10,'firefang'],[18,'flameburst']] },
  glacikit:{ name:'글래시킷', emoji:'🐧', type:'AQUA', hp:47, atk:53, def:52, spd:58,
    learn:[[1,'tackle'],[1,'bubble'],[12,'waterjet'],[19,'torrent']] },
  duneling:{ name:'듄링', emoji:'🦔', type:'STONE', hp:52, atk:58, def:62, spd:44,
    learn:[[1,'tackle'],[1,'pebble'],[13,'rockroll'],[21,'landslide']] },
  wraithe:{ name:'레이스', emoji:'👻', type:'NORMAL', hp:46, atk:62, def:44, spd:72, flying:true,
    learn:[[1,'scratch'],[1,'headbutt'],[16,'slam']] },
  skywing:{ name:'스카이윙', emoji:'🦅', type:'NORMAL', hp:45, atk:57, def:45, spd:85, flying:true,
    learn:[[1,'scratch'],[1,'headbutt'],[14,'slam']] },
};
DEX.dewpip.flying = true;   // 🦆 물새 — 날기 가능
DEX.glacikit.flying = true; // 🐧 활공

/* 비전서(필드 스킬) — 타입이 맞는 몬스터만 습득, 소비형 */
const HMS = {
  surf:{ name:'비전서: 파도타기', emoji:'📘', type:'AQUA', tile:'w', desc:'물 위를 건널 수 있다' },
  cut:{ name:'비전서: 베기', emoji:'📗', type:'LEAF', tile:'b', desc:'덤불을 베고 지나간다' },
  rocksmash:{ name:'비전서: 바위깨기', emoji:'📙', type:'STONE', tile:'B', desc:'금 간 바위를 부순다' },
  fly:{ name:'비전서: 하늘날기', emoji:'📕', type:'FLYING', desc:'방문한 지역으로 날아간다' },
};
const canLearnHm = (m, k) => HMS[k].type === 'FLYING' ? !!DEX[m.id].flying : DEX[m.id].type === HMS[k].type;
const hasField = k => S.party.some(m => (m.field || []).includes(k));
const fieldUser = k => S.party.find(m => (m.field || []).includes(k));
const SPECIES = Object.keys(DEX);

/* ═══════════ 유물(토템) · 유니크 ═══════════ */
const TOTEMS = {
  ember:{ name:'불꽃 유물', emoji:'🔥', effect:'✨이로치 출현률 ×2' },
  luck:{ name:'행운 유물', emoji:'🍀', effect:'유니크 드롭률 ×2' },
  growth:{ name:'성장 유물', emoji:'🌱', effect:'획득 경험치 +25%' },
  gold:{ name:'황금 유물', emoji:'💰', effect:'획득 골드 +50%' },
  catch:{ name:'포획 유물', emoji:'🎯', effect:'포획 성공률 +15%p' },
  guard:{ name:'수호 유물', emoji:'🛡', effect:'받는 데미지 -12%' },
};
const UNIQUES = {
  crown:{ name:'왕관 조각', emoji:'👑', effect:'파티 ATK +5% (중첩)' },
  prism:{ name:'프리즘 코어', emoji:'💎', effect:'파티 HP +8% (중첩)' },
  fang:{ name:'고대의 송곳니', emoji:'🦷', effect:'파티 SPD +8% (중첩)' },
};
const ITEMS = {
  potion:{ name:'포션', emoji:'🧪', desc:'HP +25', price:80 },
  superpotion:{ name:'슈퍼포션', emoji:'💉', desc:'HP +60', price:250 },
  ether:{ name:'PP에테르', emoji:'🫧', desc:'기술 1개 PP +10', price:200 },
  ball:{ name:'테이머볼', emoji:'🔴', desc:'포획 시도', price:100 },
  greatball:{ name:'그레이트볼', emoji:'🟣', desc:'포획 확률 ↑', price:300 },
};

/* ═══════════ 성장 배율 (리서치 · 회차 · 유물 · 이로치) ═══════════ */
const RESEARCH_STEP = 50, RESEARCH_MAX = 5;    // 50마리 격파마다 +4%, 최대 5단계(+20%)
const researchStage = id => Math.min(RESEARCH_MAX, Math.floor((S.research[id] || 0) / RESEARCH_STEP));
const researchMult = id => 1 + 0.04 * researchStage(id);
const totemKinds = () => Object.keys(TOTEMS).filter(k => (S.totems[k] || 0) > 0).length;
function shinyRate() {
  let r = 1 / 512;
  if (S.totems.ember) r *= 2;
  const kinds = totemKinds();
  if (kinds >= 3) r *= 2;
  if (kinds >= 6) r *= 1.5;
  r *= 1 + 0.3 * S.ascension;
  return Math.min(r, 0.08);
}
const uniqueDropRate = () => Math.min(0.9, 0.35 * (S.totems.luck ? 2 : 1));
const expMult = () => 1 + (S.totems.growth ? 0.25 : 0);
const goldMult = () => 1 + (S.totems.gold ? 0.5 : 0);
const catchBonus = () => (S.totems.catch ? 0.15 : 0);
const guardMult = () => (S.totems.guard ? 0.88 : 1);
const setMult = () => (totemKinds() >= 6 ? 1.10 : 1);
const uniqueMult = () => ({
  atk: 1 + 0.05 * (S.uniques.crown || 0),
  hp: 1 + 0.08 * (S.uniques.prism || 0),
  spd: 1 + 0.08 * (S.uniques.fang || 0),
});

const baseStat = (b, lv) => ({ maxHp:Math.floor(b.hp*lv/50)+lv+10, atk:Math.floor(b.atk*lv/50)+5, def:Math.floor(b.def*lv/50)+5, spd:Math.floor(b.spd*lv/50)+5 });
/** 종족별 강화 배율 분해 — 도감 표시용 */
function statBreakdown(id, shiny) {
  const uq = uniqueMult();
  const parts = {
    research:researchMult(id), ascension:1 + 0.08 * S.ascension, totemSet:setMult(),
    shiny:shiny ? 1.15 : 1, uniqueHp:uq.hp, uniqueAtk:uq.atk, uniqueSpd:uq.spd,
  };
  const common = parts.research * parts.ascension * parts.totemSet * parts.shiny;
  return { parts, hp:common * uq.hp, atk:common * uq.atk, def:common, spd:common * uq.spd };
}
/** 파티 몬스터 — 리서치·회차·유물·이로치 보너스 반영 (HP 비율 유지) */
function recalcStats(m) {
  const b = DEX[m.id], st = baseStat(b, m.lv);
  const rb = researchMult(m.id), sb = m.shiny ? 1.15 : 1;
  const ab = 1 + 0.08 * S.ascension, sm = setMult(), uq = uniqueMult();
  const ratio = m.maxHp ? m.hp / m.maxHp : 1;
  m.maxHp = Math.max(1, Math.floor(st.maxHp * rb * sb * ab * sm * uq.hp));
  m.atk = Math.max(1, Math.floor(st.atk * rb * sb * ab * sm * uq.atk));
  m.def = Math.max(1, Math.floor(st.def * rb * sb * ab * sm));
  m.spd = Math.max(1, Math.floor(st.spd * rb * sb * ab * sm * uq.spd));
  m.hp = Math.max(1, Math.min(m.maxHp, Math.round(m.maxHp * ratio)));
}
const recalcParty = () => S.party.forEach(recalcStats);

const mkMove = id => ({ id, pp:MOVES[id].pp, maxPp:MOVES[id].pp });
const moveIdsAt = (id, lv) => DEX[id].learn.filter(([l]) => l <= lv).map(([, m]) => m).slice(-4);
function syncMoves(m) {
  m.moves = moveIdsAt(m.id, m.lv).map(id => m.moves?.find(x => x.id === id) || mkMove(id));
}
function mkMon(id, lv, opt = {}) {
  const st = baseStat(DEX[id], lv);
  const m = { id, lv, exp:0, shiny:!!opt.shiny, ...st, hp:st.maxHp, moves:[] };
  syncMoves(m);
  if (opt.mine) recalcStats(m);
  else if (opt.shiny) { m.maxHp = Math.floor(m.maxHp * 1.15); m.hp = m.maxHp; m.atk = Math.floor(m.atk * 1.15); m.def = Math.floor(m.def * 1.15); m.spd = Math.floor(m.spd * 1.15); }

}

      toast(HMS[need].emoji + ' ' + (t === 'w' ? '물이 깊다' : t === 'b' ? '덤불이 길을 막는다' : '금 간 바위가 막고 있다') +
        ' — ' + HMS[need].name.split(': ')[1] + ' 를 익힌 몬스터가 필요하다 (' + (HMS[need].type === 'FLYING' ? '비행' : HMS[need].type) + ' 타입)');
    }

  }

}
const cleared = n => n.badge && S.badges.includes(n.badge);
let hintCool = false;
function arrive() {
  const m = curMap();
  const ex = m.exits.find(e => e.x === P.tx && e.y === P.ty);
  if (ex) { goMap(ex.to, ex.tx, ex.ty); return; }
  const t = tileAt(P.tx, P.ty);
  if (t === 'H') { S.party.forEach(fullRest); showDialog(['🏥 몬스터센터: 파티의 HP와 PP가 모두 회복되었습니다!']); persist(true); hud(); return; }
  if (t === 's') { openShop(); return; }
  const idx = m.items.findIndex(s => s.x === P.tx && s.y === P.ty);
  if (idx >= 0 && !(S.taken[S.map] || []).includes(idx)) {
    (S.taken[S.map] = S.taken[S.map] || []).push(idx);
    const spot = m.items[idx];
    if (spot.hm) {
      S.hms[spot.hm] = (S.hms[spot.hm] || 0) + 1;
      const h = HMS[spot.hm];
      showDialog([h.emoji + ' ' + h.name + ' 을(를) 발견했다!',
        h.desc + ' — 가방에서 ' + (h.type === 'FLYING' ? '비행이 가능한' : h.type + ' 타입') + ' 몬스터에게 가르칠 수 있다.']);
    } else {
      S.items[spot.item] = (S.items[spot.item] || 0) + 1;
      showDialog(['💊 ' + ITEMS[spot.item].name + ' 을(를) 손에 넣었다!']);
    }
    persist(true); return;
  }
  if ((t === 'g' || t === 'c') && m.pool.length && rand() < (t === 'c' ? 0.10 : 0.12) && S.party.some(x => x.hp > 0)) startWild(m);
  hud();
}
function goMap(to, tx, ty) {
  S.map = to; P.tx = tx; P.ty = ty; P.moving = false; P.prog = 0;
  S.visited[to] = 1;
  toast('➜ ' + curMap().name);
  persist(true); hud();
}
function interact() {
  const m = curMap();
  const fx = P.tx + P.dir[0], fy = P.ty + P.dir[1];
  const n = m.npcs.find(n => (n.x === fx && n.y === fy) || (n.x === P.tx && n.y === P.ty));
  if (!n) return;
  if (cleared(n)) { showDialog([n.name + ': 훌륭한 승부였다. 앞으로 나아가라!']); return; }
  if (n.badge) showDialog([n.lines[0], n.lines[1]], () => startTrainer(n));
  else showDialog(n.lines);
}

let dialogQueue = [], dialogDone = null;
function showDialog(lines, done) {
  dialogQueue = [...lines]; dialogDone = done || null;
  S.mode = 'dialog'; $('dialog').hidden = false;
  $('dialogText').textContent = dialogQueue.shift();
}
function advanceDialog() {
  if (dialogQueue.length) { $('dialogText').textContent = dialogQueue.shift(); return; }
  $('dialog').hidden = true;
  const cb = dialogDone; dialogDone = null;
  S.mode = 'world';
  if (cb) cb();
  hud();
}

    '<small>' + b.type + ' 타입 · 격파 ' + cnt + '마리 · 보유 ' + owned.length + '마리' + (S.dex.has(id) ? ' · 📖등록' : '') + '</small>' +

  // 강화도 — 배율 분해
  const bd = statBreakdown(id, false);
  const pct = v => (v >= 1 ? '+' : '') + Math.round((v - 1) * 100) + '%';

  row('<span class="grow"><b>🔬 리서치 강화</b>' +

    '<small>' + (st >= RESEARCH_MAX ? '최대 단계 달성' : '다음 단계까지 ' + (RESEARCH_STEP - cnt % RESEARCH_STEP) + '마리 (' + RESEARCH_STEP + '마리당 +4%)') + '</small></span>');
  row('<span class="grow"><b>🌀 각성 회차</b><small>' + S.ascension + '회차 → 스탯 ' + pct(bd.parts.ascension) + '</small></span>');
  row('<span class="grow"><b>🗿 유물 세트</b><small>보유 ' + totemKinds() + '/6 → 스탯 ' + pct(bd.parts.totemSet) + (totemKinds() >= 6 ? ' (완성)' : ' · 6종 완성 시 +10%') + '</small></span>');
  row('<span class="grow"><b>👑 유니크</b><small>ATK ' + pct(bd.parts.uniqueAtk) + ' · HP ' + pct(bd.parts.uniqueHp) + ' · SPD ' + pct(bd.parts.uniqueSpd) + '</small></span>');

  // 실제 스탯 비교 (보유 개체가 있으면 그 레벨, 없으면 Lv.50 기준)

  const line = (k, label) => label + ' <b>' + base[k] + ' → ' + fin[k] + '</b>' + (fin[k] > base[k] ? ' (+' + (fin[k] - base[k]) + ')' : '');

    '<small>' + line('def', 'DEF') + ' · ' + line('spd', 'SPD') + '</small>' +

  row('<span class="grow"><b>📚 습득 기술</b>' + b.learn.map(([lv, mid]) =>
    '<small>Lv.' + lv + ' — ' + MOVES[mid].name + ' (' + MOVES[mid].type + ' ' + MOVES[mid].power + ', PP ' + MOVES[mid].pp + ')</small>').join('') + '</span>');

    (learnable.length ? learnable.map(([k, h]) => h.emoji + ' ' + h.name.split(': ')[1]).join(' · ') : '익힐 수 있는 필드 스킬이 없다') + '</small></span>');
}

let B = null;
function dmg(a, d, move, toPlayer) {
  if (rand() * 100 >= move.acc) return 0;
  let v = Math.floor(Math.floor((2 * a.lv / 5 + 2) * move.power * a.atk / d.def) / 50) + 2;
  if (move.type === DEX[a.id].type) v = Math.floor(v * 150 / 100);
  v = Math.floor(v * mult(move.type, DEX[d.id].type) / 100);
  v = Math.floor(v * (85 + ri(16)) / 100);
  if (toPlayer) v = Math.floor(v * guardMult());
  return Math.max(v, 1);
}
const firstAlive = () => S.party.find(m => m.hp > 0);
const wildLv = m => {
  const bump = S.ascension * 6;
  return m.lv[0] + bump + ri(m.lv[1] - m.lv[0] + 1);
};
function startWild(m) {
  const id = m.pool[ri(m.pool.length)];
  const shiny = rand() < shinyRate();
  const foe = mkMon(id, wildLv(m), { shiny });
  if (shiny) S.shinyCount++;
  B = { my:firstAlive(), foe, wild:true, over:false, menu:'root' };
  S.mode = 'battle'; $('battle').classList.add('on');
  log(shiny ? '✨ 색이 다른 ' + DEX[id].name + ' (Lv.' + foe.lv + ') 이(가) 나타났다! 극히 희귀하다!' : '야생의 ' + DEX[id].name + ' (Lv.' + foe.lv + ') 이(가) 나타났다!');
  renderBattle();
}
function startTrainer(npc) {

  B = { my:firstAlive(), trainer:npc, queue:npc.party.map(p => mkMon(p.id, p.lv + bump)), wild:false, over:false, menu:'root' };
  B.foe = B.queue.shift();
  S.mode = 'battle'; $('battle').classList.add('on');
  log(npc.name + ' 이(가) ' + DEX[B.foe.id].name + ' 을(를) 내보냈다!');
  renderBattle();
}
function log(t) { $('bLog').textContent = t; }
const hpPct = m => Math.max(0, m.hp / m.maxHp * 100);
function pickMove(m) {
  const usable = m.moves.filter(mv => mv.pp > 0);

  const mv = usable[ri(usable.length)];

}
function renderBattle() {

  $('foeSprite').textContent = DEX[foe.id].emoji; $('foeSprite').className = 'sprite' + (foe.shiny ? ' shiny' : '');
  $('myHp').style.width = hpPct(my) + '%'; $('myHp').className = hpPct(my) < 30 ? 'low' : '';
  $('foeHp').style.width = hpPct(foe) + '%'; $('foeHp').className = hpPct(foe) < 30 ? 'low' : '';
  $('myLabel').textContent = monName(my) + ' Lv.' + my.lv + ' (' + my.hp + '/' + my.maxHp + ')';
  $('foeLabel').textContent = monName(foe) + ' Lv.' + foe.lv + (B.wild ? '' : ' [' + B.trainer.name + ']');
  const btns = $('bBtns'); btns.innerHTML = '';
  const add = (label, fn, disabled, sub, ghost) => {

  if (B.over) { add('계속 ▶', endBattle); return; }
  if (B.menu === 'root') {

    add('🎒 가방', () => { B.menu = 'bag'; renderBattle(); });
    add('🔁 몬스터', () => { B.menu = 'party'; renderBattle(); });
    add('🏃 도주', tryRun, !B.wild, B.wild ? '' : '트레이너전');
  } else if (B.menu === 'fight') {
    const noPp = B.my.moves.every(mv => mv.pp <= 0);
    B.my.moves.forEach(mv => {
      const def = MOVES[mv.id];
      add(def.name, () => turn({ kind:'move', slot:mv }), mv.pp <= 0, def.type + ' ' + def.power + ' · PP ' + mv.pp + '/' + mv.maxPp);
    });
    if (noPp) add('발버둥', () => turn({ kind:'move', slot:null }), false, 'PP 소진');
    add('← 돌아가기', () => { B.menu = 'root'; renderBattle(); }, false, '', true);
  } else if (B.menu === 'bag') {
    for (const [key, it] of Object.entries(ITEMS)) {
      if (key === 'ether') continue;
      const n = S.items[key] || 0, isBall = key === 'ball' || key === 'greatball';
      add(it.emoji + ' ' + it.name, () => turn({ kind:isBall ? 'ball' : 'heal', item:key }), n <= 0 || (isBall && !B.wild), '보유 ' + n + (isBall && !B.wild ? ' · 야생 전용' : ''));
    }
    add('← 돌아가기', () => { B.menu = 'root'; renderBattle(); }, false, '', true);
  } else if (B.menu === 'party') {
    S.party.forEach(m => add(DEX[m.id].emoji + ' ' + monName(m), () => turn({ kind:'switch', to:m }), m === B.my || m.hp <= 0, 'Lv.' + m.lv + ' ' + m.hp + '/' + m.maxHp));
    add('← 돌아가기', () => { B.menu = 'root'; renderBattle(); }, false, '', true);

function foeStrike() {
  const v = dmg(B.foe, B.my, pickMove(B.foe), true);
  B.my.hp = Math.max(0, B.my.hp - v);
  if (B.my.hp <= 0) {
    const next = S.party.find(m => m.hp > 0);
    if (next) { log(monName(B.my) + ' 이(가) 쓰러졌다! ' + monName(next) + ' 을(를) 내보냈다.'); B.my = next; }
    else { B.over = true; B.lost = true; log('모든 몬스터가 쓰러졌다… 마을에서 눈을 떴다.'); }
  }
}
function turn(action) {
  B.menu = 'root';
  const my = B.my, foe = B.foe;
  if (action.kind === 'ball') {
    S.items[action.item] -= 1;
    const bonus = action.item === 'greatball' ? 1.5 : 1.0;
    const rate = Math.min(0.95, ((1 - foe.hp / foe.maxHp) * 0.7 + 0.15) * bonus + catchBonus());
    if (rand() < rate) {
      S.dex.add(foe.id);
      const caught = foe;
      if (S.party.length < 6) { S.party.push(caught); recalcStats(caught); log(monName(caught) + ' 을(를) 잡았다! 파티에 합류.'); }
      else log(monName(caught) + ' 을(를) 잡았다! (파티가 가득이라 도감만 기록)');
      if (caught.shiny) dropUnique('✨이로치 포획 보너스');
      B.over = true; renderBattle(); return;
    }
    log('앗, 빠져나왔다!'); foeStrike(); renderBattle(); return;
  }
  if (action.kind === 'heal') {
    S.items[action.item] -= 1;
    const amount = action.item === 'superpotion' ? 60 : 25;
    my.hp = Math.min(my.maxHp, my.hp + amount);
    log(ITEMS[action.item].name + ' 사용! HP +' + amount);
    foeStrike(); renderBattle(); return;
  }
  if (action.kind === 'switch') {
    B.my = action.to; log('가랏, ' + monName(B.my) + '!');
    foeStrike(); renderBattle(); return;
  }
  let myMove;
  if (action.slot) { action.slot.pp -= 1; myMove = MOVES[action.slot.id]; } else myMove = MOVES.struggle;
  for (const side of (my.spd >= foe.spd ? ['my', 'foe'] : ['foe', 'my'])) {
    if (B.over || my.hp <= 0 || foe.hp <= 0) break;
    if (side === 'my') {
      const v = dmg(my, foe, myMove, false);
      foe.hp = Math.max(0, foe.hp - v);
      const eff = mult(myMove.type, DEX[foe.id].type);
      log(v > 0 ? monName(my) + '의 ' + myMove.name + '! ' + v + ' 데미지' + (eff > 100 ? ' — 효과가 굉장했다!' : eff < 100 ? ' — 효과가 별로였다…' : '') : monName(my) + '의 공격이 빗나갔다!');
      if (foe.hp <= 0) winFoe();
    } else foeStrike();
  }
  renderBattle();
}
function dropUnique(reason) {
  if (rand() >= uniqueDropRate()) return;
  const keys = Object.keys(UNIQUES), k = keys[ri(keys.length)];
  S.uniques[k] = (S.uniques[k] || 0) + 1;

}
function winFoe() {
  // 리서치 — 종족 격파 누적
  const before = researchStage(B.foe.id);
  S.research[B.foe.id] = (S.research[B.foe.id] || 0) + 1;
  const after = researchStage(B.foe.id);
  let msg = monName(B.foe) + ' 격파!';
  if (after > before) { recalcParty(); msg += ' 🔬' + DEX[B.foe.id].name + ' 리서치 ' + after + '단계 (+' + (after * 4) + '%)!'; }
  if (B.foe.shiny) dropUnique('✨이로치 격파 보너스');

  const total = Math.floor((14 + B.foe.lv * 5) * expMult());
  S.gold += Math.floor((B.wild ? 10 + B.foe.lv * 3 : 0) * goldMult());
  // 경험치 균등 분배 — 생존 파티 전원 동일
  const alive = S.party.filter(m => m.hp > 0);
  const share = Math.max(1, Math.floor(total / Math.max(1, alive.length)));
  msg += ' EXP ' + share + ' × ' + alive.length + '마리 균등 분배';
  alive.forEach(m => { m.exp += share; msg += levelCheck(m); });

  if (!B.wild && B.queue.length) {

  }

function levelCheck(m) {
  let msg = '';
  while (m.exp >= m.lv * 22) {
    m.exp -= m.lv * 22; m.lv += 1;
    const prevMax = m.maxHp;
    recalcStats(m);
    m.hp = Math.min(m.maxHp, m.hp + (m.maxHp - prevMax));
    msg += ' ⬆' + DEX[m.id].name + ' Lv.' + m.lv;
    const before = m.moves.map(x => x.id);

    const b = DEX[m.id];

}

const TILE_STYLE = { '#':'#1d3a24', '.':'#3f7a45', ',':'#3f7a45', 'g':'#2e5d33', 'w':'#28587a', 'c':'#4a4038', 'C':'#2a241e', 'r':'#3a3330', 'H':'#3f7a45', 's':'#3f7a45', 'b':'#2a4d2f', 'B':'#4a4038' };
const TILE_EMOJI = { '#':'🌲', ',':'🌼', 'g':'🌿', 'w':'🌊', 'C':'⛰', 'r':'🪨', 'H':'🏥', 's':'🏪', 'b':'🌳', 'B':'🗿' };
function playerPix() {
  if (!P.moving) return { x:P.tx * T, y:P.ty * T, bob:0 };
  const fx = P.tx + (P.ntx - P.tx) * P.prog, fy = P.ty + (P.nty - P.ty) * P.prog;
  return { x:fx * T, y:fy * T, bob:Math.sin(P.prog * Math.PI) * 3 };
}
function draw() {
  const m = curMap(), pp = playerPix();
  const camX = Math.max(0, Math.min(m.W * T - VIEW_W * T, pp.x - (VIEW_W >> 1) * T));
  const camY = Math.max(0, Math.min(m.H * T - VIEW_H * T, pp.y - (VIEW_H >> 1) * T));
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const x0 = Math.floor(camX / T), y0 = Math.floor(camY / T);
  for (let vy = y0; vy <= y0 + VIEW_H; vy++) for (let vx = x0; vx <= x0 + VIEW_W; vx++) {
    const t = m.grid[vy]?.[vx] ?? m.wall;
    const sx = vx * T - camX, sy = vy * T - camY;
    cx.fillStyle = TILE_STYLE[t] || '#1d3a24';
    cx.fillRect(sx, sy, T, T);
    const e = TILE_EMOJI[t];
    if (e) { cx.font = (t === '#' || t === 'C' || t === 'r' ? '22px' : t === ',' ? '13px' : '17px') + ' monospace'; cx.fillText(e, sx + T / 2, sy + T / 2 + 1); }
  }
  cx.font = '15px monospace'; cx.fillStyle = '#ffd54a';
  for (const ex of m.exits) cx.fillText(S.badges.length < ex.need ? '🚧' : ex.dir, ex.x * T - camX + T / 2, ex.y * T - camY + T / 2);
  cx.font = '16px monospace';
  m.items.forEach((s, i) => {
    if ((S.taken[S.map] || []).includes(i)) return;
    cx.fillText(s.hm ? HMS[s.hm].emoji : '💊', s.x * T - camX + T / 2, s.y * T - camY + T / 2);
  });
  cx.font = '22px monospace';
  for (const n of m.npcs) { if (!cleared(n)) cx.fillText(n.emoji, n.x * T - camX + T / 2, n.y * T - camY + T / 2); }
  const px = pp.x - camX + T / 2, py = pp.y - camY + T / 2;
  cx.fillStyle = 'rgba(0,0,0,.3)';
  cx.beginPath(); cx.ellipse(px, py + 11, 9, 4, 0, 0, Math.PI * 2); cx.fill();
  cx.font = '22px monospace'; cx.fillStyle = '#fff';
  const onWater = tileAt(P.tx, P.ty) === 'w';
  cx.fillText(onWater ? '🏄' : P.dir[0] === -1 ? '🚶' : P.dir[0] === 1 ? '🚶‍➡️' : '🧑‍🌾', px, py - pp.bob);
  $('zoneTag').textContent = m.name;
}

  $('ascTxt').textContent = '🌀 ' + S.ascension + '회차';
  $('partyTxt').textContent = S.party.map(m => (m.shiny ? '✨' : '') + DEX[m.id].emoji + m.lv).join(' ') || '-';

  if (saved && saved.party?.length) {
    $('continueBtn').hidden = false;
    $('continueBtn').onclick = () => continueGame(saved);
  }
  $('newBtn').onclick = newGame;
});
</script>
</body>
</html>
