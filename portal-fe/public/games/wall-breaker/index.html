<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성벽 파쇄</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#100e0a; color:#f0ead8; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #2e2618; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.7); }
  canvas { display:block; background:#171310; touch-action:none; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:13px; font-weight:bold;
         pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(10,8,4,.6); padding:3px 11px; border-radius:10px; }
  #hud .grow { flex:1; }
  .panel { position:absolute; inset:0; background:rgba(12,10,6,.94); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:11px; text-align:center; z-index:10; padding:20px; }
  .panel h1 { color:#e8c05a; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#d4c8a8; line-height:1.75; max-width:470px; }
  .panel button { background:#e8c05a; color:#1a1408; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#2e2618; color:#f0ead8; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #saveStatus { font-size:10.5px; color:#a89870; }
  #info { margin-top:9px; font-size:11px; color:#6a6048; text-align:center; }
  input { background:#1e1810; border:1px solid #2e2618; color:#f0ead8; border-radius:6px; padding:6px 9px;
          font-family:inherit; font-size:12px; letter-spacing:1px; width:160px; text-transform:uppercase; }
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width: 100vw; border-width: 0; border-radius: 0; }
    canvas { width: 100%; height: auto; }
    #info { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="840" height="480"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="scoreTxt"></span>
    <span class="tag" id="lvTxt"></span>
    <span class="grow"></span>
    <span class="tag" id="lifeTxt"></span>
  </div>
  <div class="panel" id="menu">
    <h1>🏰 성벽 파쇄</h1>
    <p>공성추 구슬로 <b>성벽을 무너뜨려라.</b> 마우스/터치로 발판을 움직여 구슬을 받는다.
       금간 벽돌은 1방, 석벽은 2방, 강철은 3방. 떨어지는 <b>보급품</b>을 받으면 강해진다.</p>
    <p style="font-size:11px">🟢 발판 확장 · 🔵 구슬 분열 · 🟡 관통탄 · 🔴 저속</p>
    <div id="saveStatus"></div>
    <div class="row">
      <input id="codeInput" placeholder="이어하기 코드" maxlength="18" autocomplete="off">
      <button id="codeLoadBtn" class="ghost">🔑 코드로 불러오기</button>
    </div>
    <div class="row"><span id="codeShow" style="font-size:11px;color:#e8c05a;letter-spacing:2px"></span></div>
    <div class="row"><span id="bestTxt" style="font-size:12px;color:#a89870"></span></div>
    <button id="startBtn">▶ 공성 시작</button>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <div class="row">
      <button id="againBtn">🔁 재도전</button>
      <button id="backBtn" class="ghost">처음으로</button>
    </div>
  </div>
</div>
<div id="info">마우스 이동 / 터치 드래그 = 발판 · 구슬을 놓치면 생명 -1 (3개) · 층을 다 부수면 다음 성벽</div>
<script>
'use strict';
const API = '/api/v1/games/wall-breaker';
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = cv.width, VH = cv.height;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = () => Math.random();

/* ── 플랫폼 연동 (이어하기 코드 세이브) ── */
const token = () => localStorage.getItem('portal_access_token');
function deviceId() {
  let id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
async function api(path, opt = {}) {
  const headers = { 'Content-Type':'application/json', 'X-Device-Id':deviceId(), ...(opt.headers || {}) };
  const tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
  const res = await fetch(API + path, { ...opt, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.success === false) throw new Error(body?.error?.code || res.status);
  return body.data;
}
const CODE_KEY = 'wall_breaker_code', LOCAL_KEY = 'wall_breaker_save';
let saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
const fmtCode = c => c ? c.replace(/(.{4})(?=.)/g, '$1-') : '';
let meta = { best: 0, bestLv: 0 };
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }
async function loadMeta(codeOverride) {
  const code = codeOverride || saveCode;
  if (token() || code) {
    try {
      const s = await api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''));
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (s.data) meta = { best:0, bestLv:0, ...s.data };
      $('saveStatus').textContent = '☁ 서버 세이브 (v' + saveVersion + ')';
      showCode(); return true;
    } catch (e) { $('saveStatus').textContent = '세이브 로드 실패: ' + e.message; if (codeOverride) return false; }
  }
  try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d) meta = { ...meta, ...d }; } catch (_) {}
  $('saveStatus').textContent = '브라우저 저장 — 저장하면 이어하기 코드가 발급된다';
  showCode(); return true;
}
async function persistMeta() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(meta));
  try {
    const s = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
    saveVersion = s.version;
    if (s.code && s.code !== saveCode) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
    showCode();
  } catch (e) {
    if (e.message === 'INVALID_INPUT') {
      try {
        const re = await api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''));
        saveVersion = re.version;
        const s2 = await api('/save', { method:'PUT', body:JSON.stringify({ data:meta, version:saveVersion, code:saveCode }) });
        saveVersion = s2.version;
      } catch (_) {}
    }
  }
}

/* ── 상태 ── */
const BW = 60, BH = 22, COLS = 12, PAD_Y = 440;
let G = null, running = false;
function newGame() {
  G = { score: 0, level: 1, lives: 3, paddle: { x: VW/2, w: 110 },
    balls: [], bricks: [], drops: [], parts: [], pierce: 0, slow: 0, launched: false };
  buildLevel();
}
function buildLevel() {
  G.bricks = [];
  const rows = Math.min(9, 4 + G.level);
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
    if (G.level >= 3 && (r + c) % 7 === 0) continue;                    // 구멍 패턴
    let hp = 1;
    if (r < 2 && G.level >= 2) hp = 3;                                  // 강철
    else if (r < 4) hp = Math.min(2, 1 + Math.floor(G.level / 2));      // 석벽
    G.bricks.push({ x: 30 + c * (BW + 5), y: 52 + r * (BH + 5), hp, maxHp: hp });
  }
  G.balls = [mkBall()];
  G.launched = false;
  G.pierce = 0; G.slow = 0;
}
function mkBall() { return { x: G.paddle.x, y: PAD_Y - 14, vx: 0, vy: 0, stuck: true }; }
function launch() {
  if (G.launched) return;
  G.launched = true;
  G.balls.forEach(b => { if (b.stuck) { b.stuck = false;
    const a = -Math.PI/2 + (rnd() - 0.5) * 0.5;
    const sp = ballSpeed();
    b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; } });
}
const ballSpeed = () => (300 + G.level * 22) * (G.slow > 0 ? 0.65 : 1);

/* ── 갱신 ── */
function update(dt) {
  G.slow = Math.max(0, G.slow - dt);
  G.pierce = Math.max(0, G.pierce - dt);
  for (const b of [...G.balls]) {
    if (b.stuck) { b.x = G.paddle.x; b.y = PAD_Y - 14; continue; }
    // 속도 정규화(저속 보급 반영)
    const sp = Math.hypot(b.vx, b.vy) || 1, want = ballSpeed();
    b.vx *= want / sp; b.vy *= want / sp;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < 10) { b.x = 10; b.vx = Math.abs(b.vx); }
    if (b.x > VW - 10) { b.x = VW - 10; b.vx = -Math.abs(b.vx); }
    if (b.y < 10) { b.y = 10; b.vy = Math.abs(b.vy); }
    // 발판
    if (b.vy > 0 && b.y > PAD_Y - 10 && b.y < PAD_Y + 12 && Math.abs(b.x - G.paddle.x) < G.paddle.w / 2 + 8) {
      const off = (b.x - G.paddle.x) / (G.paddle.w / 2);              // -1..1
      const a = -Math.PI/2 + off * 1.05;
      const spd = ballSpeed();
      b.vx = Math.cos(a) * spd; b.vy = Math.sin(a) * spd;
      burst(b.x, PAD_Y, '#e8c05a', 4, 90);
    }
    // 낙하
    if (b.y > VH + 20) {
      G.balls = G.balls.filter(o => o !== b);
      if (!G.balls.length) {
        G.lives--;
        burst(G.paddle.x, PAD_Y, '#e05c4a', 16, 170);
        if (G.lives <= 0) return endGame(false);
        G.balls = [mkBall()]; G.launched = false;
      }
      continue;
    }
    // 벽돌
    for (const br of G.bricks) {
      if (b.x + 8 < br.x || b.x - 8 > br.x + BW || b.y + 8 < br.y || b.y - 8 > br.y + BH) continue;
      br.hp--;
      G.score += 10 * G.level;
      burst(b.x, b.y, br.hp <= 0 ? '#e8c05a' : '#8a8578', br.hp <= 0 ? 10 : 5, 130);
      if (br.hp <= 0) {
        G.bricks = G.bricks.filter(o => o !== br);
        if (rnd() < 0.16) G.drops.push({ x: br.x + BW/2, y: br.y, kind: ['wide','multi','pierce','slow'][Math.floor(rnd()*4)] });
      }
      if (G.pierce <= 0) {
        // 반사 방향 — 어느 면에 맞았는지
        const ox = Math.min(b.x + 8 - br.x, br.x + BW - (b.x - 8));
        const oy = Math.min(b.y + 8 - br.y, br.y + BH - (b.y - 8));
        if (ox < oy) b.vx = -b.vx; else b.vy = -b.vy;
      }
      break;
    }
  }
  // 보급품
  for (const d of [...G.drops]) {
    d.y += 150 * dt;
    if (d.y > VH + 12) { G.drops = G.drops.filter(o => o !== d); continue; }
    if (d.y > PAD_Y - 8 && Math.abs(d.x - G.paddle.x) < G.paddle.w / 2 + 10) {
      G.drops = G.drops.filter(o => o !== d);
      applyDrop(d.kind);
    }
  }
  G.parts = G.parts.filter(p => (p.life -= dt * 1.9) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; });
  if (!G.bricks.length) {
    G.level++;
    G.score += 200;
    if (G.paddle.w > 90) G.paddle.w -= 4;                              // 판이 갈수록 좁아진다
    buildLevel();
  }
}
function applyDrop(kind) {
  if (kind === 'wide') { G.paddle.w = Math.min(190, G.paddle.w + 34); toastMini('🟢 발판 확장'); }
  if (kind === 'multi') {
    const src = G.balls[0] || mkBall();
    for (let i = 0; i < 2; i++) {
      const a = Math.atan2(src.vy || -1, src.vx || 0.3) + (i ? 0.5 : -0.5);
      const sp = ballSpeed();
      G.balls.push({ x: src.x, y: src.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, stuck: false });
    }
    toastMini('🔵 구슬 분열');
  }
  if (kind === 'pierce') { G.pierce = 6; toastMini('🟡 관통탄 6초'); }
  if (kind === 'slow') { G.slow = 7; toastMini('🔴 저속 7초'); }
}
let miniT = 0, miniMsg = '';
function toastMini(m) { miniMsg = m; miniT = 1.6; }
function burst(x, y, c, n, sp) {
  for (let i = 0; i < n; i++) { const a = rnd() * 7; G.parts.push({ x, y, vx: Math.cos(a)*sp*(0.4+rnd()*0.7), vy: Math.sin(a)*sp*(0.4+rnd()*0.7), life: 1, c }); }
}
function endGame(win) {
  running = false;
  meta.best = Math.max(meta.best, G.score);
  meta.bestLv = Math.max(meta.bestLv, G.level);
  $('endTitle').textContent = '💥 공성 실패…';
  $('endDesc').textContent = G.level + '번째 성벽에서 멈췄다 — 점수 ' + G.score.toLocaleString() +
    ' (최고 ' + meta.best.toLocaleString() + ')';
  $('endPanel').hidden = false; $('hud').hidden = true;
  GameRank.submit('wall-breaker', G.score, G.level + '번째 성벽')
    .then(r => { if (r && r.applied) $('endDesc').textContent += ' 🏆 랭킹 ' + r.rank + '위!'; });
  persistMeta();
}

/* ── 렌더 ── */
function draw(ts) {
  requestAnimationFrame(draw);
  if (!G) return;
  if (running) update(Math.min(0.033, (ts - (draw.last || ts)) / 1000));
  draw.last = ts;
  cx.fillStyle = '#171310'; cx.fillRect(0, 0, VW, VH);
  // 벽돌 — 내구도별 질감
  G.bricks.forEach(b => {
    const c = b.maxHp === 3 ? ['#6a707c','#8a919e','#aeb5c2'] : b.maxHp === 2 ? ['#7a6248','#96795a','#b0906c'] : ['#8a5a3c','#a86e48','#c08256'];
    cx.fillStyle = c[Math.max(0, b.hp - 1)];
    cx.fillRect(b.x, b.y, BW, BH);
    cx.fillStyle = 'rgba(255,255,255,.16)'; cx.fillRect(b.x, b.y, BW, 4);
    cx.fillStyle = 'rgba(0,0,0,.28)'; cx.fillRect(b.x, b.y + BH - 4, BW, 4);
    if (b.hp < b.maxHp) {                                             // 금
      cx.strokeStyle = 'rgba(20,10,5,.55)'; cx.lineWidth = 1.5;
      cx.beginPath(); cx.moveTo(b.x + 12, b.y + 3); cx.lineTo(b.x + 24, b.y + 12); cx.lineTo(b.x + 18, b.y + 19); cx.stroke();
      if (b.maxHp - b.hp > 1) { cx.beginPath(); cx.moveTo(b.x + 42, b.y + 2); cx.lineTo(b.x + 34, b.y + 13); cx.lineTo(b.x + 44, b.y + 20); cx.stroke(); }
    }
  });
  // 보급품
  G.drops.forEach(d => {
    const col = { wide:'#6ad18a', multi:'#6aa8e8', pierce:'#e8c05a', slow:'#e07a6a' }[d.kind];
    cx.fillStyle = col; cx.fillRect(d.x - 9, d.y - 9, 18, 18);
    cx.fillStyle = '#171310'; cx.font = 'bold 11px monospace'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText({ wide:'W', multi:'M', pierce:'P', slow:'S' }[d.kind], d.x, d.y + 1);
  });
  // 발판 — 공성 수레
  cx.fillStyle = '#5a4630'; cx.fillRect(G.paddle.x - G.paddle.w/2, PAD_Y, G.paddle.w, 12);
  cx.fillStyle = '#7a6248'; cx.fillRect(G.paddle.x - G.paddle.w/2, PAD_Y, G.paddle.w, 4);
  cx.fillStyle = '#2e2618';
  cx.beginPath(); cx.arc(G.paddle.x - G.paddle.w/2 + 12, PAD_Y + 15, 6, 0, 7); cx.fill();
  cx.beginPath(); cx.arc(G.paddle.x + G.paddle.w/2 - 12, PAD_Y + 15, 6, 0, 7); cx.fill();
  // 구슬
  G.balls.forEach(b => {
    cx.fillStyle = G.pierce > 0 ? '#ffd54a' : '#d8d2c0';
    cx.beginPath(); cx.arc(b.x, b.y, 8, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(b.x - 2.5, b.y - 2.5, 2.5, 0, 7); cx.fill();
  });
  G.parts.forEach(p => { cx.globalAlpha = clamp(p.life, 0, 1); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, 3, 3); cx.globalAlpha = 1; });
  if (!G.launched && running) {
    cx.fillStyle = '#a89870'; cx.font = 'bold 13px monospace'; cx.textAlign = 'center';
    cx.fillText('클릭/탭 하면 발사', VW/2, 300);
  }
  if (miniT > 0) { miniT -= 0.016;
    cx.fillStyle = 'rgba(232,192,90,' + Math.min(1, miniT) + ')'; cx.font = 'bold 15px monospace'; cx.textAlign = 'center';
    cx.fillText(miniMsg, VW/2, 330); }
  $('scoreTxt').textContent = '⚔ ' + G.score.toLocaleString();
  $('lvTxt').textContent = '🏰 ' + G.level + '번째 성벽';
  $('lifeTxt').textContent = '🛞 ' + '●'.repeat(Math.max(0, G.lives));
}
requestAnimationFrame(draw);

/* ── 입력 ── */
function movePaddle(clientX) {
  if (!G) return;
  const r = cv.getBoundingClientRect();
  G.paddle.x = clamp((clientX - r.left) * (VW / r.width), G.paddle.w/2, VW - G.paddle.w/2);
}
cv.addEventListener('pointermove', ev => movePaddle(ev.clientX));
cv.addEventListener('pointerdown', ev => { movePaddle(ev.clientX); if (running) launch(); });

function start() {
  newGame(); running = true;
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false;
}
$('startBtn').onclick = start;
$('againBtn').onclick = start;
$('backBtn').onclick = () => { $('endPanel').hidden = true; $('menu').hidden = false;
  $('bestTxt').textContent = meta.best ? '최고 점수 ' + meta.best.toLocaleString() + ' · ' + meta.bestLv + '번째 성벽' : ''; };
$('codeLoadBtn').onclick = async () => {
  const raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  if (await loadMeta(raw)) { saveCode = raw; localStorage.setItem(CODE_KEY, raw);
    $('bestTxt').textContent = meta.best ? '최고 점수 ' + meta.best.toLocaleString() : ''; showCode(); }
};
loadMeta().then(() => { $('bestTxt').textContent = meta.best ? '최고 점수 ' + meta.best.toLocaleString() + ' · ' + meta.bestLv + '번째 성벽' : ''; });
</script>
<script src="../lib/rank.js"></script>
<script>
GameRank.autoPanel('wall-breaker');
GameRank.copyButton(function(){ return typeof saveCode !== 'undefined' ? saveCode : null; });
</script>
</body>
</html>
