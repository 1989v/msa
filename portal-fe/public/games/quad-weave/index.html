<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">넉 줄 묶기</title>
<script src="../lib/i18n.js"></script>
<script src="../lib/daily.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#e6ecf2; font-family:'Courier New',monospace; display:flex;
         flex-direction:column; align-items:center; min-height:100vh; user-select:none; padding:14px 10px 30px; }
  h1.top { font-size:19px; color:#0ea5e9; margin:6px 0 2px; text-shadow:1px 1px 0 #000; }
  .sub { font-size:11px; color:#8e9db0; margin-bottom:10px; }
  #solved { display:flex; flex-direction:column; gap:6px; width:min(440px,96vw); margin-bottom:6px; }
  .band { border-radius:8px; padding:8px 6px; text-align:center; font-weight:bold; }
  .band small { display:block; font-weight:normal; font-size:11px; opacity:.85; margin-top:2px; }
  .d0 { background:#eab308; color:#241c02; } .d1 { background:#22c55e; color:#06230f; }
  .d2 { background:#0ea5e9; color:#04121c; } .d3 { background:#a855f7; color:#1d0733; }
  #grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:min(440px,96vw); }
  #grid button { background:#1a2238; border:2px solid #2c3550; color:#e6ecf2; border-radius:8px;
                 min-height:56px; padding:4px 2px; font-family:inherit; font-weight:bold; cursor:pointer;
                 font-size:clamp(10px,3.4vw,14px); word-break:keep-all; line-height:1.25; }
  #grid button.sel { background:#2c3550; border-color:#0ea5e9; transform:scale(.96); }
  #grid button.shake { animation:sh .3s; }
  @keyframes sh { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  #ctl { display:flex; gap:8px; margin:12px 0 4px; align-items:center; }
  button.act { background:#0ea5e9; color:#04121c; border:0; padding:11px 18px; font-weight:bold;
               font-size:13px; border-radius:8px; cursor:pointer; font-family:inherit; }
  button.act:disabled { opacity:.35; cursor:default; }
  button.ghost { background:#222b44; color:#e6ecf2; }
  #lives { font-size:14px; letter-spacing:2px; }
  #msg { min-height:20px; font-size:12.5px; color:#eab308; margin-top:6px; text-align:center; }
  .panel { position:fixed; inset:0; background:rgba(9,13,24,.97); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:13px; text-align:center; z-index:10; padding:20px; overflow:auto; }
  .panel h1 { color:#0ea5e9; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#c2cedc; line-height:1.8; max-width:480px; }
  .panel p.small { font-size:11px; color:#8e9db0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .stat { background:#1a2238; border-radius:8px; padding:8px 14px; font-size:12px; }
  .stat b { color:#0ea5e9; font-size:17px; display:block; }
  #shareGrid { font-size:15px; line-height:1.35; letter-spacing:1px; }
</style>
</head>
<body>
<h1 class="top" data-i18n="title">🧵 넉 줄 묶기</h1>
<div class="sub"><span id="dayTag"></span> · <span data-i18n="livesLabel">남은 실수</span> <span id="lives"></span></div>

<div id="solved"></div>
<div id="grid"></div>
<div id="ctl">
  <button class="act ghost" id="shuffleBtn" data-i18n="shuffleBtn">🔀 섞기</button>
  <button class="act ghost" id="clearBtn" data-i18n="clearBtn">선택 해제</button>
  <button class="act" id="checkBtn" data-i18n="checkBtn" disabled>묶기</button>
</div>
<div id="msg"></div>

<div class="panel" id="menu">
  <h1 data-i18n="menuTitle">🧵 넉 줄 묶기</h1>
  <p data-i18n="menuDesc">열여섯 단어에는 네 가지 공통점이 숨어 있다. 네 개씩 묶어 네 줄을 완성하라 —
    실수는 네 번까지. 노랑이 가장 쉽고 보라가 가장 짓궂다.</p>
  <p class="small" id="menuStreak"></p>
  <button class="act" id="startBtn" data-i18n="startBtn">▶ 오늘의 묶음</button>
</div>

<div class="panel" id="endPanel" hidden>
  <h1 id="endTitle"></h1>
  <div id="endBands" style="display:flex;flex-direction:column;gap:6px;width:min(420px,92vw)"></div>
  <div id="shareGrid"></div>
  <div class="row">
    <div class="stat"><b id="endStreak">0</b><span data-i18n="streakLabel">연속 출석</span></div>
    <div class="stat"><b id="endTime">0:00</b><span data-i18n="timeLabel">클리어 시간</span></div>
  </div>
  <p class="small"><span data-i18n="next">다음 묶음까지</span> <b id="cdown"></b></p>
  <div class="row">
    <button class="act" id="shareBtn" data-i18n="shareBtn">📤 결과 공유</button>
    <button class="act ghost" id="backBtn" data-i18n="backBtn">처음으로</button>
  </div>
</div>

<script>
'use strict';
GameI18n.init({
  ko: {
    title: '🧵 넉 줄 묶기', menuTitle: '🧵 넉 줄 묶기',
    menuDesc: '열여섯 단어에는 네 가지 공통점이 숨어 있다. 네 개씩 묶어 네 줄을 완성하라 — 실수는 네 번까지. 노랑이 가장 쉽고 보라가 가장 짓궂다.',
    startBtn: '▶ 오늘의 묶음', shuffleBtn: '🔀 섞기', clearBtn: '선택 해제', checkBtn: '묶기',
    livesLabel: '남은 실수', streakLabel: '연속 출석', timeLabel: '클리어 시간',
    next: '다음 묶음까지', shareBtn: '📤 결과 공유', backBtn: '처음으로',
    oneAway: '아깝다 — 하나만 다르다!', dup: '이미 시도한 조합', win: '🎉 네 줄 완성!', lose: '💧 실이 끊겼다',
  },
  en: {
    title: '🧵 Quad Weave', menuTitle: '🧵 Quad Weave',
    menuDesc: 'Sixteen Korean words hide four common threads. Bundle them four by four — four mistakes allowed. Yellow is easiest, purple is the trickster. (Korean vocabulary)',
    startBtn: '▶ Daily Weave', shuffleBtn: '🔀 Shuffle', clearBtn: 'Deselect', checkBtn: 'Weave',
    livesLabel: 'Mistakes left', streakLabel: 'Day streak', timeLabel: 'Clear time',
    next: 'Next weave in', shareBtn: '📤 Share', backBtn: 'Menu',
    oneAway: 'So close — one away!', dup: 'Already tried', win: '🎉 All four woven!', lose: '💧 The thread snapped',
  },
});
var TR = GameI18n.t;

var SLUG = 'quad-weave', EPOCH = '2026-08-07', MAX_MISS = 4;

// 그룹 은행 — d: 0(노랑,쉬움) ~ 3(보라,함정). 같은 날 뽑힌 4그룹은 단어 중복이 없도록 선별.
var BANK = [
  { d: 0, t: '김치의 종류', w: ['깍두기', '총각김치', '백김치', '열무김치'] },
  { d: 0, t: '바다 동물', w: ['고래', '상어', '문어', '해파리'] },
  { d: 0, t: '악기', w: ['가야금', '피아노', '장구', '바이올린'] },
  { d: 0, t: '과일', w: ['사과', '포도', '수박', '복숭아'] },
  { d: 0, t: '직업', w: ['의사', '교사', '소방관', '요리사'] },
  { d: 0, t: '날씨', w: ['맑음', '흐림', '소나기', '폭설'] },
  { d: 0, t: '한국의 산', w: ['한라산', '설악산', '지리산', '백두산'] },
  { d: 0, t: '양념', w: ['소금', '설탕', '간장', '고추장'] },
  { d: 0, t: '새', w: ['참새', '까치', '부엉이', '제비'] },
  { d: 0, t: '꽃', w: ['장미', '튤립', '개나리', '무궁화'] },
  { d: 0, t: '교통수단', w: ['지하철', '버스', '자전거', '택시'] },
  { d: 0, t: '문구류', w: ['지우개', '연필', '공책', '가위'] },
  { d: 1, t: '전래동화 주인공', w: ['흥부', '콩쥐', '심청', '견우'] },
  { d: 1, t: '윷놀이의 끗', w: ['도', '개', '걸', '모'] },
  { d: 1, t: '태양계 행성', w: ['수성', '금성', '화성', '목성'] },
  { d: 1, t: '바둑 용어', w: ['포석', '정석', '사활', '끝내기'] },
  { d: 1, t: '떡의 종류', w: ['송편', '인절미', '가래떡', '백설기'] },
  { d: 1, t: '전통 놀이', w: ['제기차기', '팽이치기', '널뛰기', '강강술래'] },
  { d: 1, t: '조선의 왕', w: ['세종', '정조', '태조', '성종'] },
  { d: 1, t: '서울의 지명', w: ['강남', '종로', '마포', '노원'] },
  { d: 1, t: '몸속 장기', w: ['심장', '간', '위', '폐'] },
  { d: 1, t: '십이지 동물', w: ['쥐', '소', '범', '토끼'] },
  { d: 1, t: '국경일', w: ['삼일절', '광복절', '개천절', '한글날'] },
  { d: 1, t: '김밥 재료', w: ['단무지', '시금치', '우엉', '맛살'] },
  { d: 2, t: "'눈'이 들어가는 말", w: ['눈사람', '눈치', '눈썹', '눈금'] },
  { d: 2, t: "'배'로 시작하는 말", w: ['배꼽', '배달', '배추', '배터리'] },
  { d: 2, t: "'불'로 시작하는 말", w: ['불고기', '불면증', '불꽃', '불평'] },
  { d: 2, t: "'물'이 들어가는 말", w: ['물음표', '물레방아', '물개', '물감'] },
  { d: 2, t: "'손'으로 시작하는 말", w: ['손난로', '손해', '손뼉', '손질'] },
  { d: 2, t: "'금'으로 시작하는 말", w: ['금메달', '금요일', '금붕어', '금지'] },
  { d: 2, t: "'별'이 들어가는 말", w: ['별명', '별자리', '별장', '별미'] },
  { d: 2, t: "'말'이 들어가는 말", w: ['말투', '말굽', '말썽', '말복'] },
  { d: 2, t: "'개'로 시작하는 말", w: ['개미', '개천', '개성', '개학'] },
  { d: 2, t: "'차'로 끝나는 말", w: ['기차', '마차', '유모차', '풍차'] },
  { d: 2, t: "'국'으로 끝나는 음식", w: ['미역국', '떡국', '북엇국', '곰국'] },
  { d: 2, t: "'왕'으로 시작하는 말", w: ['왕관', '왕복', '왕자', '왕돈까스'] },
  { d: 3, t: '거꾸로 읽어도 같은 말', w: ['기러기', '토마토', '오디오', '스위스'] },
  { d: 3, t: '동물 울음소리', w: ['멍멍', '꿀꿀', '짹짹', '음매'] },
  { d: 3, t: '화폐 단위', w: ['원', '달러', '유로', '엔'] },
  { d: 3, t: '바람의 종류', w: ['산들바람', '회오리', '돌풍', '미풍'] },
  { d: 3, t: '옛 도량형 단위', w: ['되', '말', '근', '자'] },
  { d: 3, t: '전설 속 존재', w: ['도깨비', '저승사자', '구미호', '해태'] },
  { d: 3, t: '커피 메뉴', w: ['라떼', '에스프레소', '아메리카노', '모카'] },
  { d: 3, t: "'ㅅ'으로 시작하는 나라", w: ['스페인', '스웨덴', '시리아', '싱가포르'] },
  { d: 3, t: '세는 단위(수량사)', w: ['마리', '그루', '켤레', '송이'] },
  { d: 3, t: '순우리말 날수', w: ['하루', '이틀', '사흘', '나흘'] },
  { d: 3, t: '조선의 궁궐', w: ['경복궁', '창덕궁', '덕수궁', '경희궁'] },
  { d: 3, t: '별자리 이름', w: ['전갈', '물병', '사수', '처녀'] },
];

function pickGroups() {
  var rand = GameDaily.rng(GameDaily.seed(SLUG));
  var used = {}, out = [];
  for (var d = 0; d < 4; d++) {
    var tier = GameDaily.shuffle(BANK.filter(function (g) { return g.d === d; }).slice(), rand);
    for (var i = 0; i < tier.length; i++) {
      var g = tier[i];
      if (g.w.every(function (w) { return !used[w]; })) {
        g.w.forEach(function (w) { used[w] = true; });
        out.push(g);
        break;
      }
    }
  }
  return out;
}

var groups, wordTier, board, selected, solvedTiers, misses, guesses, startTs, over;

function begin() {
  groups = pickGroups();
  wordTier = {};
  groups.forEach(function (g) { g.w.forEach(function (w) { wordTier[w] = g.d; }); });
  var rand = GameDaily.rng(GameDaily.seed(SLUG) ^ 0x9e3779b9);
  board = GameDaily.shuffle(groups.reduce(function (a, g) { return a.concat(g.w); }, []), rand);
  selected = []; solvedTiers = []; misses = 0; guesses = []; over = false;
  startTs = Date.now();
  document.getElementById('menu').hidden = true;
  document.getElementById('endPanel').hidden = true;
  document.getElementById('solved').innerHTML = '';
  document.getElementById('msg').textContent = '';
  renderLives(); renderGrid();
}

function renderLives() {
  document.getElementById('lives').textContent =
    '●'.repeat(MAX_MISS - misses) + '○'.repeat(misses);
}

function renderGrid() {
  var el = document.getElementById('grid');
  el.innerHTML = '';
  board.forEach(function (w) {
    var b = document.createElement('button');
    b.textContent = w;
    if (selected.indexOf(w) >= 0) b.className = 'sel';
    b.onclick = function () {
      if (over) return;
      var i = selected.indexOf(w);
      if (i >= 0) selected.splice(i, 1);
      else if (selected.length < 4) selected.push(w);
      renderGrid();
      document.getElementById('checkBtn').disabled = selected.length !== 4;
    };
    el.appendChild(b);
  });
  document.getElementById('checkBtn').disabled = selected.length !== 4;
}

function bandHtml(g) {
  return '<div class="band d' + g.d + '">' + g.t + '<small>' + g.w.join(' · ') + '</small></div>';
}

function check() {
  if (selected.length !== 4 || over) return;
  var key = selected.slice().sort().join('|');
  if (guesses.some(function (x) { return x.key === key; })) {
    flash(TR('dup')); return;
  }
  var emoji = selected.map(function (w) { return ['🟨', '🟩', '🟦', '🟪'][wordTier[w]]; }).join('');
  guesses.push({ key: key, emoji: emoji });
  var hit = groups.find(function (g) {
    return g.w.every(function (w) { return selected.indexOf(w) >= 0; });
  });
  if (hit) {
    solvedTiers.push(hit.d);
    document.getElementById('solved').innerHTML += bandHtml(hit);
    board = board.filter(function (w) { return hit.w.indexOf(w) < 0; });
    selected = [];
    renderGrid();
    if (board.length === 0) finish(true);
  } else {
    var best = 0;
    groups.forEach(function (g) {
      if (solvedTiers.indexOf(g.d) >= 0) return;
      var c = g.w.filter(function (w) { return selected.indexOf(w) >= 0; }).length;
      if (c > best) best = c;
    });
    misses++;
    renderLives();
    flash(best === 3 ? TR('oneAway') : '');
    Array.prototype.forEach.call(document.querySelectorAll('#grid button.sel'), function (b) {
      b.classList.add('shake');
    });
    if (misses >= MAX_MISS) finish(false);
  }
}

function flash(text) {
  var m = document.getElementById('msg');
  m.textContent = text;
  if (text) setTimeout(function () { if (m.textContent === text) m.textContent = ''; }, 2200);
}

function finish(won) {
  over = true;
  var sec = Math.floor((Date.now() - startTs) / 1000);
  document.getElementById('endTitle').textContent = won ? TR('win') : TR('lose');
  document.getElementById('endBands').innerHTML = groups.map(bandHtml).join('');
  document.getElementById('shareGrid').innerHTML =
    guesses.map(function (g) { return g.emoji; }).join('<br>');
  document.getElementById('endTime').textContent = GameDaily.fmtTime(sec);
  var st = won ? GameDaily.recordClear(SLUG) : GameDaily.streak(SLUG);
  document.getElementById('endStreak').textContent = st.streak;
  if (!GameDaily.result(SLUG)) {
    GameDaily.saveResult(SLUG, { won: won, miss: misses, sec: sec, guesses: guesses });
    if (won) {
      var score = Math.max(100, 5000 - misses * 700 - sec * 2);
      GameRank.submit(SLUG, score,
        '#' + GameDaily.dayNumber(EPOCH) + ' ' + TR('livesLabel') + ' ' + (MAX_MISS - misses) + ' ' + GameDaily.fmtTime(sec));
    }
  }
  document.getElementById('endPanel').hidden = false;
}

function shareText() {
  return TR('title') + ' #' + GameDaily.dayNumber(EPOCH) + ' (' + misses + '❌)\n' +
    guesses.map(function (g) { return g.emoji; }).join('\n') +
    '\nhttps://game.1989v.com/games/quad-weave/';
}

document.getElementById('startBtn').onclick = function () {
  var prev = GameDaily.result(SLUG);
  begin();
  if (prev) {
    // 이미 끝난 날 — 보드를 결과로 대체
    guesses = prev.guesses || []; misses = prev.miss || 0;
    finishReplay(prev);
  }
};
function finishReplay(prev) {
  over = true;
  document.getElementById('endTitle').textContent = prev.won ? TR('win') : TR('lose');
  document.getElementById('endBands').innerHTML = groups.map(bandHtml).join('');
  document.getElementById('shareGrid').innerHTML =
    guesses.map(function (g) { return g.emoji; }).join('<br>');
  document.getElementById('endTime').textContent = GameDaily.fmtTime(prev.sec || 0);
  document.getElementById('endStreak').textContent = GameDaily.streak(SLUG).streak;
  document.getElementById('endPanel').hidden = false;
}
document.getElementById('checkBtn').onclick = check;
document.getElementById('clearBtn').onclick = function () { selected = []; renderGrid(); };
document.getElementById('shuffleBtn').onclick = function () {
  if (over) return;
  board = GameDaily.shuffle(board, Math.random.bind(Math));
  renderGrid();
};
document.getElementById('backBtn').onclick = function () {
  document.getElementById('endPanel').hidden = true;
  document.getElementById('menu').hidden = false;
  refreshMenu();
};
document.getElementById('shareBtn').onclick = function () { GameDaily.share(shareText(), this); };

function refreshMenu() {
  var st = GameDaily.streak(SLUG);
  document.getElementById('menuStreak').textContent =
    '#' + GameDaily.dayNumber(EPOCH) + ' · 🔥 ' + st.streak + ' (best ' + st.best + ')';
}
document.getElementById('dayTag').textContent = '#' + GameDaily.dayNumber(EPOCH);
refreshMenu();
GameDaily.countdown(document.getElementById('cdown'));
</script>
<script src="../lib/rank.js"></script>
<script>GameRank.autoPanel('quad-weave');</script>
</body>
</html>
