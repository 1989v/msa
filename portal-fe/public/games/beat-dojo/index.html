<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">박자 도장</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#e2e8f0; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:center; min-height:100vh; user-select:none; }
  #wrap { position:relative; border:4px solid #1a2238; border-radius:10px; overflow:hidden; box-shadow:0 0 48px rgba(0,0,0,.7); }
  canvas { display:block; background:#0c1424; touch-action:manipulation; }
  #hud { position:absolute; top:8px; left:10px; right:10px; display:flex; gap:8px; font-size:13px; font-weight:bold;
         align-items:center; pointer-events:none; text-shadow:1px 1px 0 #000; }
  #hud .tag { background:rgba(8,13,26,.65); padding:3px 11px; border-radius:10px; }
  #hud .grow { flex:1; }
  #gauge { width:120px; height:11px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; }
  #gaugeBar { height:100%; width:65%; background:#22c55e; transition:width .15s; }
  .panel { position:absolute; inset:0; background:rgba(9,14,27,.94); display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:11px; text-align:center; z-index:10; padding:20px; overflow-y:auto; }
  .panel h1 { color:#0ea5e9; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#bccadc; line-height:1.75; max-width:470px; }
  .panel button { background:#0ea5e9; color:#07121f; border:0; padding:9px 22px; font-weight:bold; font-size:13px;
                  border-radius:7px; cursor:pointer; font-family:inherit; }
  .panel button.ghost { background:#1a2238; color:#e2e8f0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  #songList { display:flex; flex-direction:column; gap:8px; }
  .song { display:grid; grid-template-columns:58px 1fr auto; gap:1px 12px; align-items:center; text-align:left;
          background:#1a2238; border:1px solid #263354; color:#e2e8f0; padding:9px 14px; border-radius:8px;
          cursor:pointer; font-family:inherit; width:320px; }
  .song:hover { border-color:#0ea5e9; }
  .song .stars { grid-row:span 2; color:#eab308; font-size:15px; letter-spacing:1px; }
  .song .sname { font-weight:bold; font-size:14px; }
  .song .sbpm { color:#0ea5e9; font-size:11px; font-weight:bold; }
  .song .sbest { grid-column:2 / span 2; font-size:10.5px; color:#8a98b0; }
  #hint { font-size:10.5px; color:#93a3b8; }
  #endGrade { font-size:15px; font-weight:bold; color:#eab308; }
  #info { margin-top:9px; font-size:11px; color:#8e9db0; text-align:center; }
  @media (max-width: 900px), (pointer: coarse) {
    #wrap { width:100vw; border-width:0; border-radius:0; }
    canvas { width:100%; height:auto; }
    #info { display:none; }
  }
</style>
<link rel="stylesheet" href="../lib/menu.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="860" height="440"></canvas>
  <div id="hud" hidden>
    <span class="tag" id="songTxt"></span>
    <span class="tag" id="scoreTxt"></span>
    <span class="grow"></span>
    <span class="tag" id="statTxt"></span>
    <div id="gauge"><div id="gaugeBar"></div></div>
  </div>
  <div class="panel" id="menu">
    <h1 data-i18n="h1">🥁 박자 도장</h1>
    <p><b data-i18n="desc1">사부의 북소리가 판정선에 닿는 순간 두드려라.</b><span data-i18n="desc2"> 단타 ●는 한 번,
       초록 롱노트는 누르고 유지, 노란 연타는 빠르게 두들긴다. MISS 가 쌓여 게이지가 바닥나면 수련 실패.</span></p>
    <p id="hint" data-i18n="hint">수련곡을 골라 시작 — 오디오가 함께 시작된다</p>
    <div id="songList"></div>
  </div>
  <div class="panel" id="endPanel" hidden>
    <h1 id="endTitle"></h1>
    <p id="endDesc"></p>
    <p id="endStats"></p>
    <div id="endGrade"></div>
    <div class="row">
      <button id="againBtn" data-i18n="btnAgain">🔁 재도전</button>
      <button id="backBtn" class="ghost" data-i18n="btnBack">처음으로</button>
    </div>
  </div>
</div>
<div id="info" data-i18n="info">탭 / 클릭 / Space · J · F = 타격 · 롱노트는 누른 채 유지 · 연타는 두 손가락도 가능</div>
<script>
'use strict';
GameI18n.init({
  ko: {
    title: '박자 도장',
    h1: '🥁 박자 도장',
    desc1: '사부의 북소리가 판정선에 닿는 순간 두드려라.',
    desc2: ' 단타 ●는 한 번, 초록 롱노트는 누르고 유지, 노란 연타는 빠르게 두들긴다. MISS 가 쌓여 게이지가 바닥나면 수련 실패.',
    hint: '수련곡을 골라 시작 — 오디오가 함께 시작된다',
    song0: '수련의 아침',
    song1: '대나무 소나기',
    song2: '천둥 각성',
    bestLine: '최고 {s} · {r}랭크',
    noBest: '기록 없음',
    btnAgain: '🔁 재도전',
    btnBack: '처음으로',
    endClear: '🥁 수련 완료!',
    endNewBest: '🏆 신기록!',
    endFail: '💥 수련 실패…',
    endDesc: '{song} · 점수 {s}',
    endStats: 'PERFECT {p} · GOOD {g} · MISS {m} · 최대 {c}콤보',
    endGrade: '등급 {r} — {t}',
    gradeS: '사범',
    gradeA: '고수',
    gradeB: '수련생',
    detailFmt: '{song} {r}랭크 {c}콤보',
    detailFail: '{song} 수련 실패 {c}콤보',
    rankMsg: ' 🏆 랭킹 {n}위!',
    info: '탭 / 클릭 / Space · J · F = 타격 · 롱노트는 누른 채 유지 · 연타는 두 손가락도 가능',
  },
  en: {
    title: 'Beat Dojo',
    h1: '🥁 Beat Dojo',
    desc1: 'Strike the moment the master\'s drumbeat reaches the judgment line.',
    desc2: ' Tap ● once, hold the green long notes, and hammer the yellow rapid notes. Pile up MISSes until the gauge empties and the training fails.',
    hint: 'Pick a training song to start — audio begins with it',
    song0: 'Morning Discipline',
    song1: 'Bamboo Downpour',
    song2: 'Thunder Awakening',
    bestLine: 'Best {s} · Rank {r}',
    noBest: 'No record',
    btnAgain: '🔁 Retry',
    btnBack: 'Main menu',
    endClear: '🥁 Training complete!',
    endNewBest: '🏆 New record!',
    endFail: '💥 Training failed…',
    endDesc: '{song} · Score {s}',
    endStats: 'PERFECT {p} · GOOD {g} · MISS {m} · Max {c} combo',
    endGrade: 'Rank {r} — {t}',
    gradeS: 'Master',
    gradeA: 'Expert',
    gradeB: 'Trainee',
    detailFmt: '{song} rank {r}, {c} combo',
    detailFail: '{song} failed, {c} combo',
    rankMsg: ' 🏆 Rank #{n}!',
    info: 'Tap / Click / Space · J · F = strike · Keep holding long notes · Two fingers work for rapid notes',
  },
});
var TR = GameI18n.t;
var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var JX = 150, LY = 262, SPEED = 300;      // 판정선 x · 레인 y · 노트 진행속도(px/s)
var WIN_P = 0.050, WIN_G = 0.110;         // 판정창 PERFECT ±50ms / GOOD ±110ms
function $(id) { return document.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* ── 곡 데이터 — 시드 고정 배열 (마디 = 4/4, PAT 인덱스 나열) ──
   PAT 이벤트: [박, 0]=단타 / [박, 1, 길이박]=홀드 / [박, 2, 개수]=연타(0.5박 간격) */
var PAT = [
  /* 0 쉼    */ [],
  /* 1 반박  */ [[0, 0], [2, 0]],
  /* 2 정박  */ [[0, 0], [1, 0], [2, 0], [3, 0]],
  /* 3 당김  */ [[0, 0], [1.5, 0], [2, 0], [3, 0]],
  /* 4 당김2 */ [[0, 0], [1.5, 0], [3, 0]],
  /* 5 홀드  */ [[0, 1, 1.5], [2, 0], [3, 0]],
  /* 6 홀드2 */ [[0, 0], [1, 1, 2]],
  /* 7 연타3 */ [[0, 0], [2, 2, 3]],
  /* 8 연타4 */ [[0, 2, 4], [2.5, 0], [3, 0]],
  /* 9 8분   */ [[0, 0], [0.5, 0], [1, 0], [2, 0], [2.5, 0], [3, 0]],
  /* 10 엇박 */ [[0.5, 0], [1.5, 0], [2.5, 0], [3.5, 0]],
  /* 11 긴홀드*/ [[0, 1, 3]],
];
var SONGS = [
  { key: 'song0', bpm: 90, stars: 1, seq: [
      0, 1, 1, 2,  1, 2, 1, 2,  5, 2, 1, 3,  2, 2, 5, 1,
      3, 2, 3, 2,  5, 6, 2, 2,  7, 2, 5, 2,  11, 2, 7, 1] },
  { key: 'song1', bpm: 120, stars: 2, seq: [
      0, 2, 2, 3,  2, 3, 5, 2,  9, 3, 6, 2,  7, 2, 3, 5,
      10, 2, 9, 3,  6, 2, 7, 5,  2, 9, 3, 10,  5, 7, 2, 6,
      9, 10, 7, 3,  11, 9, 7, 8,  2, 3, 1] },
  { key: 'song2', bpm: 150, stars: 3, seq: [
      0, 2, 3, 9,  2, 9, 3, 10,  7, 9, 5, 9,  8, 2, 9, 10,
      6, 9, 7, 9,  3, 10, 9, 8,  5, 9, 10, 7,  9, 2, 8, 9,
      10, 9, 7, 6,  9, 8, 10, 9,  7, 9, 8, 10,  9, 9, 8, 7,
      11, 9, 10, 2,  9, 7] },
];
function buildChart(song) {
  var spb = 60 / song.bpm;
  var lead = 2 * 4 * spb;                 // 리드인 2마디 (2번째 마디에 카운트인)
  var notes = [];
  for (var i = 0; i < song.seq.length; i++) {
    var pat = PAT[song.seq[i]];
    var barT = lead + i * 4 * spb;
    for (var j = 0; j < pat.length; j++) {
      var ev = pat[j];
      if (ev[1] === 0) notes.push({ t: barT + ev[0] * spb, type: 0, done: false });
      else if (ev[1] === 1) notes.push({ t: barT + ev[0] * spb, type: 1, dur: ev[2] * spb,
                                         done: false, tailDone: false, holding: false });
      else for (var k = 0; k < ev[2]; k++)
        notes.push({ t: barT + (ev[0] + k * 0.5) * spb, type: 2, done: false });
    }
  }
  notes.sort(function (a, b) { return a.t - b.t; });
  return { notes: notes, lead: lead, spb: spb, end: lead + song.seq.length * 4 * spb };
}

/* ── 오디오 — WebAudio 절차 합성 (외부 음원 없음) ──
   북(저음 킥): sine 150→46Hz 피치 엔벨로프 + 로우패스 노이즈 타격감
   목탁(고음): triangle 1080→760Hz 짧은 감쇠 + 밴드패스 노이즈 클릭
   스케줄링: AudioContext.currentTime 기준 30ms 인터벌 + 150ms 룩어헤드 */
var actx = null, masterG = null, noiseBuf = null;
function ensureAudio() {
  if (actx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();
  masterG = actx.createGain();
  masterG.gain.value = 0.9;
  masterG.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, (actx.sampleRate * 0.25) | 0, actx.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function noiseAt(t, dur, filtType, freq, gain) {
  var n = actx.createBufferSource(); n.buffer = noiseBuf;
  var f = actx.createBiquadFilter(); f.type = filtType; f.frequency.value = freq;
  var g = actx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f); f.connect(g); g.connect(masterG);
  n.start(t); n.stop(t + dur + 0.02);
}
function playKick(t, gain) {                       // 사부의 북 — "덩"
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(46, t + 0.12);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g); g.connect(masterG);
  o.start(t); o.stop(t + 0.32);
  noiseAt(t, 0.08, 'lowpass', 420, gain * 0.5);
}
function playTak(t, gain) {                        // 목탁 — "딱"
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(1080, t);
  o.frequency.exponentialRampToValueAtTime(760, t + 0.045);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(g); g.connect(masterG);
  o.start(t); o.stop(t + 0.11);
  noiseAt(t, 0.03, 'bandpass', 2600, gain * 0.6);
}
function playClick() {                             // 입력 피드백 — 미세 클릭
  if (!actx) return;
  noiseAt(actx.currentTime, 0.025, 'highpass', 3200, 0.08);
}
function playThud() {                              // MISS — 둔탁음
  if (!actx) return;
  var t = actx.currentTime;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.15);
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(masterG);
  o.start(t); o.stop(t + 0.2);
}

/* ── 상태 ── */
var playing = false, song = null, songIdx = 0, chart = null, notes = [], headIdx = 0;
var startAt = 0, clockOff = null, schedTimer = null, schedIdx = 0, sndEvents = [];
var perfects = 0, goods = 0, misses = 0, combo = 0, maxCombo = 0, gauge = 65;
var currentHold = null, active = {};
var pops = [], flashUntil = -9, flashColor = '#0ea5e9', shakeT = -9, comboPopT = -9;
var bests = {};
var BEST_KEY = 'beat_dojo_best';
try { bests = JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { bests = {}; }
var JCOLOR = ['#0ea5e9', '#eab308', '#ef4444'];    // PERFECT 파랑 / GOOD 노랑 / MISS 빨강
var JTEXT = ['PERFECT', 'GOOD', 'MISS'];

function liveScore() { return perfects * 300 + goods * 100 + maxCombo * 10; }
function gradeOf() {
  var total = perfects + goods + misses;
  var p = total ? perfects / total : 0;
  if (p >= 0.9) return { r: 'S', t: TR('gradeS') };
  if (p >= 0.7) return { r: 'A', t: TR('gradeA') };
  if (p >= 0.5) return { r: 'B', t: TR('gradeB') };
  return { r: 'C', t: TR('gradeB') };
}

/* ── 곡 선택 메뉴 ── */
function starsOf(n) {
  var s = '';
  for (var i = 0; i < 3; i++) s += i < n ? '★' : '☆';
  return s;
}
function buildMenu() {
  var list = $('songList');
  list.innerHTML = '';
  for (var i = 0; i < SONGS.length; i++) {
    (function (idx) {
      var sg = SONGS[idx];
      var b = bests[sg.key];
      var bestTxt = b
        ? TR('bestLine').replace('{s}', Number(b.s).toLocaleString()).replace('{r}', b.r)
        : TR('noBest');
      var btn = document.createElement('button');
      btn.className = 'song';
      btn.innerHTML = '<span class="stars">' + starsOf(sg.stars) + '</span>' +
        '<span class="sname">' + TR(sg.key) + '</span>' +
        '<span class="sbpm">BPM ' + sg.bpm + '</span>' +
        '<span class="sbest">' + bestTxt + '</span>';
      btn.onclick = function () { startSong(idx); };
      list.appendChild(btn);
    })(i);
  }
}

/* ── 사운드 이벤트 빌드: 카운트인 + 배경 그루브 + 차트 노트 자체가 사부의 연주 ── */
function buildSnd() {
  sndEvents = [];
  var spb = chart.spb, i;
  for (i = 0; i < 4; i++) sndEvents.push({ t: (4 + i) * spb, k: 1, g: 0.22 });   // 카운트인 목탁 4회
  for (i = 0; i < song.seq.length; i++) {                                        // 마디 그루브
    var t0 = chart.lead + i * 4 * spb;
    sndEvents.push({ t: t0, k: 0, g: 0.28 });
    sndEvents.push({ t: t0 + 2 * spb, k: 1, g: 0.15 });
  }
  for (i = 0; i < notes.length; i++) {                                           // 차트 = 사부의 북/목탁
    var n = notes[i];
    if (n.type === 2) sndEvents.push({ t: n.t, k: 1, g: 0.55 });
    else {
      sndEvents.push({ t: n.t, k: 0, g: 0.75 });
      if (n.type === 1) sndEvents.push({ t: n.t + n.dur, k: 1, g: 0.35 });
    }
  }
  sndEvents.sort(function (a, b) { return a.t - b.t; });
}
function schedTick() {
  var limit = actx.currentTime + 0.15;
  while (schedIdx < sndEvents.length && startAt + sndEvents[schedIdx].t < limit) {
    var ev = sndEvents[schedIdx++];
    if (ev.k === 0) playKick(startAt + ev.t, ev.g);
    else playTak(startAt + ev.t, ev.g);
  }
}

/* ── 진행 ── */
function startSong(i) {
  songIdx = i; song = SONGS[i];
  ensureAudio();
  if (actx.state === 'suspended') actx.resume();
  chart = buildChart(song);
  notes = chart.notes; headIdx = 0;
  perfects = 0; goods = 0; misses = 0; combo = 0; maxCombo = 0; gauge = 65;
  currentHold = null; active = {};
  pops = []; flashUntil = -9; shakeT = -9; comboPopT = -9; clockOff = null;
  buildSnd();
  schedIdx = 0;
  startAt = actx.currentTime + 0.2;
  clearInterval(schedTimer);
  schedTimer = setInterval(schedTick, 30);
  playing = true;
  $('menu').hidden = true; $('endPanel').hidden = true; $('hud').hidden = false;
  hudRefresh();
}
function finish(cleared) {
  if (!playing) return;
  playing = false;
  clearInterval(schedTimer);
  currentHold = null;
  var g = gradeOf();
  var score = liveScore();
  var t = actx.currentTime;
  if (cleared) { playKick(t, 0.7); playTak(t + 0.15, 0.4); playTak(t + 0.3, 0.55); }
  else { playKick(t, 0.7); playKick(t + 0.25, 0.8); }
  var prev = bests[song.key];
  var newBest = cleared && (!prev || score > prev.s);
  if (newBest) {
    bests[song.key] = { s: score, r: g.r };
    try { localStorage.setItem(BEST_KEY, JSON.stringify(bests)); } catch (e) {}
  }
  $('endTitle').textContent = cleared ? (newBest ? TR('endNewBest') : TR('endClear')) : TR('endFail');
  $('endDesc').textContent = TR('endDesc').replace('{song}', TR(song.key)).replace('{s}', score.toLocaleString());
  $('endStats').textContent = TR('endStats').replace('{p}', perfects).replace('{g}', goods)
    .replace('{m}', misses).replace('{c}', maxCombo);
  $('endGrade').textContent = cleared ? TR('endGrade').replace('{r}', g.r).replace('{t}', g.t) : '';
  $('endPanel').hidden = false; $('hud').hidden = true;
  var detail = (cleared ? TR('detailFmt').replace('{r}', g.r) : TR('detailFail'))
    .replace('{song}', TR(song.key)).replace('{c}', maxCombo);
  GameRank.submit('beat-dojo', score, detail)
    .then(function (r) { if (r && r.applied) $('endDesc').textContent += TR('rankMsg').replace('{n}', r.rank); });
}

/* ── 판정 — 오디오 클럭(AudioContext.currentTime) 기준 ── */
function hudRefresh() {
  $('songTxt').textContent = '🥁 ' + TR(song.key);
  $('scoreTxt').textContent = '⭐ ' + liveScore().toLocaleString();
  $('statTxt').textContent = 'P' + perfects + ' G' + goods + ' M' + misses;
  var bar = $('gaugeBar');
  bar.style.width = gauge + '%';
  bar.style.background = gauge >= 50 ? '#22c55e' : gauge >= 25 ? '#eab308' : '#ef4444';
}
function registerJudge(kind, isBurst, now) {
  if (kind === 0) { perfects++; combo++; gauge = Math.min(100, gauge + 2.2); }
  else if (kind === 1) { goods++; combo++; gauge = Math.min(100, gauge + 1.1); }
  else { misses++; combo = 0; gauge -= 9; }
  if (combo > maxCombo) maxCombo = combo;
  if (kind < 2) comboPopT = now;
  if (isBurst && kind < 2) shakeT = now;           // 연타 구간 — 화면 미세 쉐이크
  pops.push({ k: kind, t0: now });
  flashUntil = now + 0.15; flashColor = JCOLOR[kind];
  hudRefresh();
  if (gauge <= 0) { gauge = 0; finish(false); }
}
function matchNote(now) {
  for (var i = headIdx; i < notes.length; i++) {
    var n = notes[i];
    if (n.t - now > WIN_G) break;
    if (n.done) continue;
    if (Math.abs(now - n.t) <= WIN_G) return n;
  }
  return null;
}
function press(now) {
  playClick();
  var n = matchNote(now);
  if (!n) return;
  var d = Math.abs(now - n.t);
  var kind = d <= WIN_P ? 0 : 1;
  n.done = true;
  if (n.type === 1) { n.holding = true; currentHold = n; }
  registerJudge(kind, n.type === 2, now);
}
function release(now) {
  var n = currentHold;
  currentHold = null;
  if (!n || !n.holding || n.tailDone) return;
  n.holding = false; n.tailDone = true;
  var tail = n.t + n.dur;
  if (now >= tail - WIN_G) registerJudge(Math.abs(now - tail) <= WIN_P ? 0 : 1, false, now);
  else registerJudge(2, false, now);               // 너무 이른 릴리즈 — 꼬리 MISS
}
function sweep(now) {
  while (headIdx < notes.length) {
    var h = notes[headIdx];
    if (h.done && (h.type !== 1 || h.tailDone)) { headIdx++; continue; }
    break;
  }
  for (var i = headIdx; i < notes.length; i++) {
    if (!playing) return;
    var n = notes[i];
    if (n.t - now > 0.15) break;
    if (!n.done && now > n.t + WIN_G) {            // 지나친 노트 — MISS
      n.done = true;
      if (n.type === 1) { n.tailDone = true; misses++; }
      registerJudge(2, false, now);
      playThud();
    } else if (n.type === 1 && n.holding && now > n.t + n.dur + WIN_P) {
      n.holding = false; n.tailDone = true;        // 끝까지 유지 — 꼬리 PERFECT
      if (n === currentHold) currentHold = null;
      registerJudge(0, false, now);
    }
  }
}

/* ── 입력 — 전면 탭 영역 + Space/J/F ── */
function anyActive() { for (var k in active) if (active.hasOwnProperty(k)) return true; return false; }
function down(src) {
  if (active[src]) return;
  active[src] = 1;
  if (!playing) return;
  press(actx.currentTime - startAt);
}
function up(src) {
  if (!active[src]) return;
  delete active[src];
  if (playing && currentHold && !anyActive()) release(actx.currentTime - startAt);
}
var KEYS = { Space: 1, KeyJ: 1, KeyF: 1 };
addEventListener('keydown', function (ev) {
  if (!KEYS[ev.code] || ev.repeat) return;
  ev.preventDefault();
  down('k' + ev.code);
});
addEventListener('keyup', function (ev) { if (KEYS[ev.code]) up('k' + ev.code); });
document.addEventListener('pointerdown', function (ev) {
  if (!playing) return;
  ev.preventDefault();
  down('p' + ev.pointerId);
});
document.addEventListener('pointerup', function (ev) { up('p' + ev.pointerId); });
document.addEventListener('pointercancel', function (ev) { up('p' + ev.pointerId); });
addEventListener('blur', function () {
  active = {};
  if (playing && currentHold) release(actx.currentTime - startAt);
});

/* ── 렌더 — rAF 보간(스무딩한 오디오-퍼포먼스 클럭 오프셋) ── */
function drawScene(now, pt) {
  var i, x;
  var shakeAmp = playing ? Math.max(0, 1 - (now - shakeT) / 0.15) * 3.5 : 0;
  cx.save();
  if (shakeAmp > 0.2) cx.translate((Math.random() * 2 - 1) * shakeAmp, (Math.random() * 2 - 1) * shakeAmp);
  cx.fillStyle = '#0c1424'; cx.fillRect(-8, -8, W + 16, H + 16);
  // 도장 벽 — 장지문 패널
  for (i = 0; i < 6; i++) {
    var px = i * 150 - 20;
    cx.fillStyle = '#101a30'; cx.fillRect(px, 18, 138, 150);
    cx.strokeStyle = '#1a2238'; cx.lineWidth = 3;
    cx.strokeRect(px, 18, 138, 150);
    cx.beginPath();
    cx.moveTo(px + 46, 18); cx.lineTo(px + 46, 168);
    cx.moveTo(px + 92, 18); cx.lineTo(px + 92, 168);
    cx.moveTo(px, 93); cx.lineTo(px + 138, 93);
    cx.stroke();
  }
  // 마루 바닥
  cx.fillStyle = '#101828'; cx.fillRect(0, 340, W, H - 340);
  cx.strokeStyle = '#1a2238'; cx.lineWidth = 2;
  for (i = 0; i < 4; i++) { cx.beginPath(); cx.moveTo(0, 355 + i * 24); cx.lineTo(W, 355 + i * 24); cx.stroke(); }
  // 노트 하이웨이
  cx.fillStyle = 'rgba(26,34,56,.6)'; cx.fillRect(0, 205, W, 115);
  cx.strokeStyle = '#1a2238'; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(0, 205); cx.lineTo(W, 205); cx.moveTo(0, 320); cx.lineTo(W, 320); cx.stroke();
  var spb = chart ? chart.spb : 0.5;
  var beat = playing ? (now % spb) / spb : (pt % 0.8) / 0.8;
  if (beat < 0) beat += 1;
  // 박자 그리드
  if (playing) {
    var k0 = Math.floor(now / spb);
    for (var k = k0; k * spb < now + 2.6; k++) {
      if (k < 0) continue;
      x = JX + (k * spb - now) * SPEED;
      if (x < -20 || x > W + 20) continue;
      cx.strokeStyle = k % 4 === 0 ? 'rgba(226,232,240,.16)' : 'rgba(226,232,240,.06)';
      cx.lineWidth = k % 4 === 0 ? 2 : 1;
      cx.beginPath(); cx.moveTo(x, 208); cx.lineTo(x, 317); cx.stroke();
    }
  }
  // 사부 — 북채를 든 실루엣 (박자에 맞춰 타격)
  var arm = Math.pow(1 - beat, 3);
  cx.save();
  cx.translate(64, 380);
  cx.fillStyle = '#16203a';
  cx.beginPath(); cx.arc(0, -52, 13, 0, Math.PI * 2); cx.fill();          // 머리
  cx.fillStyle = '#ef4444'; cx.fillRect(-13, -58, 26, 5);                 // 머리띠
  cx.fillStyle = '#16203a';
  cx.beginPath(); cx.moveTo(-22, 0); cx.lineTo(-14, -42); cx.lineTo(14, -42); cx.lineTo(22, 0); cx.fill(); // 몸통
  cx.strokeStyle = '#16203a'; cx.lineWidth = 6; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(10, -36);
  cx.lineTo(10 + 24 * Math.cos(-0.9 + arm * 1.1), -36 + 24 * Math.sin(-0.9 + arm * 1.1)); cx.stroke(); // 팔
  cx.strokeStyle = '#eab308'; cx.lineWidth = 3;
  var ax = 10 + 24 * Math.cos(-0.9 + arm * 1.1), ay = -36 + 24 * Math.sin(-0.9 + arm * 1.1);
  cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(ax + 20, ay + 12 - arm * 16); cx.stroke();              // 북채
  cx.restore();
  // 사부의 북 (장식 — 박자 맞춰 진동)
  cx.save();
  cx.translate(150, 375);
  cx.scale(1 + arm * 0.06, 1 + arm * 0.06);
  cx.fillStyle = '#1a2238';
  cx.beginPath(); cx.arc(0, 0, 30, 0, Math.PI * 2); cx.fill();
  cx.strokeStyle = '#263354'; cx.lineWidth = 4; cx.stroke();
  cx.strokeStyle = '#ef4444'; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(-19, -19); cx.lineTo(19, 19); cx.moveTo(19, -19); cx.lineTo(-19, 19); cx.stroke();
  cx.fillStyle = '#0ea5e9';
  cx.beginPath(); cx.arc(0, 0, 6, 0, Math.PI * 2); cx.fill();
  cx.restore();
  // 판정선 + 타깃 링 (+ 판정 플래시)
  cx.strokeStyle = 'rgba(226,232,240,.4)'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(JX, 205); cx.lineTo(JX, 320); cx.stroke();
  cx.strokeStyle = 'rgba(226,232,240,.5)'; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(JX, LY, 17, 0, Math.PI * 2); cx.stroke();
  if (playing && now < flashUntil) {
    var fa = (flashUntil - now) / 0.15;
    cx.globalAlpha = fa;
    cx.strokeStyle = flashColor; cx.lineWidth = 5;
    cx.beginPath(); cx.arc(JX, LY, 17 + (1 - fa) * 16, 0, Math.PI * 2); cx.stroke();
    cx.globalAlpha = fa * 0.35;
    cx.fillStyle = flashColor; cx.fillRect(JX - 4, 205, 8, 115);
    cx.globalAlpha = 1;
  }
  // 노트
  if (playing) {
    for (i = headIdx; i < notes.length; i++) {
      var n = notes[i];
      if (n.done && (n.type !== 1 || n.tailDone)) continue;
      var hx = JX + (n.t - now) * SPEED;
      if (n.type === 1) {
        var tx = JX + (n.t + n.dur - now) * SPEED;
        var hx2 = n.holding ? JX : hx;
        if (hx2 > W + 40) break;
        cx.fillStyle = 'rgba(34,197,94,.3)';
        cx.fillRect(hx2, LY - 9, Math.max(4, tx - hx2), 18);
        cx.strokeStyle = '#22c55e'; cx.lineWidth = 2;
        cx.strokeRect(hx2, LY - 9, Math.max(4, tx - hx2), 18);
        cx.fillStyle = '#22c55e';
        cx.beginPath(); cx.arc(tx, LY, 8, 0, Math.PI * 2); cx.fill();
        cx.beginPath(); cx.arc(hx2, LY, 13, 0, Math.PI * 2); cx.fill();
        if (n.holding) {
          cx.strokeStyle = 'rgba(34,197,94,.7)'; cx.lineWidth = 3;
          cx.beginPath(); cx.arc(JX, LY, 19 + Math.sin(pt * 18) * 2, 0, Math.PI * 2); cx.stroke();
        }
      } else {
        if (hx > W + 40) break;
        if (hx < -60) continue;
        if (n.type === 2) {                        // 연타 — 노랑 이중 링
          cx.fillStyle = '#eab308';
          cx.beginPath(); cx.arc(hx, LY, 10, 0, Math.PI * 2); cx.fill();
          cx.strokeStyle = 'rgba(234,179,8,.55)'; cx.lineWidth = 2;
          cx.beginPath(); cx.arc(hx, LY, 15, 0, Math.PI * 2); cx.stroke();
        } else {                                   // 단타 ●
          cx.fillStyle = '#0ea5e9';
          cx.beginPath(); cx.arc(hx, LY, 13, 0, Math.PI * 2); cx.fill();
          cx.fillStyle = 'rgba(226,232,240,.55)';
          cx.beginPath(); cx.arc(hx - 4, LY - 4, 4, 0, Math.PI * 2); cx.fill();
        }
      }
    }
  }
  // 판정 텍스트 팝
  for (i = pops.length - 1; i >= 0; i--) {
    var p = pops[i];
    var age = now - p.t0;
    if (age > 0.6 || age < 0) { pops.splice(i, 1); continue; }
    cx.globalAlpha = 1 - age / 0.6;
    cx.font = 'bold 17px "Courier New",monospace';
    cx.textAlign = 'left';
    cx.fillStyle = '#0c1424';
    cx.fillText(JTEXT[p.k], JX + 31, 201 - age * 46);
    cx.fillStyle = JCOLOR[p.k];
    cx.fillText(JTEXT[p.k], JX + 30, 200 - age * 46);
    cx.globalAlpha = 1;
  }
  // 콤보
  if (playing && combo >= 2) {
    var cs = 1 + Math.max(0, 1 - (now - comboPopT) / 0.18) * 0.35;
    cx.save();
    cx.translate(W / 2, 120);
    cx.scale(cs, cs);
    cx.textAlign = 'center';
    cx.font = 'bold 30px "Courier New",monospace';
    cx.fillStyle = '#0c1424'; cx.fillText(combo + ' COMBO', 2, 2);
    cx.fillStyle = '#0ea5e9'; cx.fillText(combo + ' COMBO', 0, 0);
    cx.restore();
  }
  cx.restore();
}
function frame(ts) {
  requestAnimationFrame(frame);
  var pt = ts / 1000;
  var vNow = 0;
  if (playing) {
    var aNow = actx.currentTime;
    var raw = aNow - pt;
    clockOff = clockOff === null ? raw : clockOff + (raw - clockOff) * 0.1;   // 오디오↔rAF 클럭 오프셋 스무딩
    vNow = pt + clockOff - startAt;
    sweep(aNow - startAt);                                                    // 판정은 오디오 클럭
    if (playing && aNow - startAt > chart.end + 0.8) finish(true);
  }
  drawScene(vNow, pt);
}
requestAnimationFrame(frame);

$('againBtn').onclick = function () { startSong(songIdx); };
$('backBtn').onclick = function () { $('endPanel').hidden = true; buildMenu(); $('menu').hidden = false; };
buildMenu();
</script>

     입력 방식은 게임이 이미 가진 것을 그대로 둔다. -->

GameRank.autoPanel('beat-dojo');
