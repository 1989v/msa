<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">달빛 낚시터</title>
<script src="../lib/i18n.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#dbe4f2; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; min-height:100vh; user-select:none; -webkit-user-select:none; padding:14px 0 30px; }
  #wrap { width:min(460px, 100vw); display:flex; flex-direction:column; align-items:center; padding:0 8px; }
  h1 { color:#cbd5e1; font-size:22px; text-shadow:2px 2px 0 #000; margin:4px 0 2px; text-align:center; }
  #sub { text-align:center; font-size:11px; color:#8b98b8; margin-bottom:10px; line-height:1.6; padding:0 10px; }
  #sea { display:block; background:#0c1424; border:3px solid #263050; border-radius:10px; cursor:pointer;
         touch-action:none; -webkit-touch-callout:none; width:min(430px, 94vw); }
  #stats { display:flex; gap:7px; justify-content:center; margin:10px 0 4px; font-size:12px; font-weight:bold; flex-wrap:wrap; }
  #stats span { background:#1a2238; border:1px solid #263050; padding:4px 11px; border-radius:9px; }
  #stats #moonTxt.on { color:#eab308; border-color:#eab308; }
  #hint { text-align:center; font-size:10.5px; color:#8b98b8; line-height:1.6; margin:2px 0 8px; min-height:17px; padding:0 8px; }
  .shop { display:flex; flex-direction:column; gap:6px; width:min(430px, 94vw); }
  .shop button { display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:left;
                 background:#1a2238; border:1px solid #263050; color:#dbe4f2; padding:8px 12px; border-radius:8px;
                 cursor:pointer; font-family:inherit; font-size:12px; }
  .shop button:disabled { opacity:.38; cursor:default; }
  .shop button b { display:block; font-size:12.5px; }
  .shop button small { color:#8b98b8; font-size:10.5px; }
  .shop button .price { color:#eab308; font-weight:bold; white-space:nowrap; }
  .btnRow { display:flex; gap:8px; justify-content:center; margin:10px 0 2px; }
  .btnRow button, .panel button { background:#0ea5e9; color:#06121f; border:0; padding:9px 20px; font-weight:bold;
                 font-size:13px; border-radius:7px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#1a2238 !important; color:#dbe4f2 !important; border:1px solid #263050 !important; }
  #saveRow { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin:12px 0 2px; }
  #saveRow input { background:#1a2238; border:1px solid #263050; color:#dbe4f2; border-radius:6px; padding:6px 9px;
                 font-family:inherit; font-size:12px; letter-spacing:1px; width:160px; text-transform:uppercase; }
  #saveRow button { background:#263050; color:#dbe4f2; border:0; padding:7px 12px; border-radius:6px;
                 cursor:pointer; font-family:inherit; font-size:11px; }
  #saveStatus, #codeShow { text-align:center; font-size:10.5px; color:#8b98b8; margin-top:3px; }
  #codeShow { color:#eab308; letter-spacing:2px; }
  .panel { position:fixed; inset:0; background:rgba(12,20,36,.97); z-index:20; overflow-y:auto; display:flex;
           flex-direction:column; align-items:center; padding:26px 14px 32px; text-align:center; }
  #menu { justify-content:center; }
  .panel h1 { margin-bottom:8px; }
  .panel p { font-size:12.5px; color:#b7c3da; line-height:1.8; max-width:440px; margin-bottom:5px; }
  .panel p.small { font-size:11px; color:#8b98b8; }
  .panel .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  #dexGrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:min(440px, 94vw); margin:12px 0 4px; }
  .dexCard { background:#1a2238; border:1px solid #263050; border-radius:9px; padding:9px 4px 7px; font-size:9.5px;
             color:#8b98b8; display:flex; flex-direction:column; gap:3px; align-items:center; line-height:1.35; }
  .dexCard .de { font-size:22px; }
  .dexCard.got { color:#dbe4f2; border-color:#0ea5e9; }
  .dexCard.legend { border-color:#eab308; }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:rgba(12,20,36,.94);
           border:1px solid #263050; padding:8px 18px; border-radius:9px; font-size:12px; opacity:0;
           transition:opacity .3s; pointer-events:none; z-index:99; max-width:92vw; text-align:center; }
  @media (max-width: 520px) {
    .shop button, .btnRow button, .panel button { padding:10px 14px; font-size:13px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1 data-i18n="h1">🌕 달빛 낚시터</h1>
  <div id="sub" data-i18n="sub">달이 뜨면 바다가 깨어난다 — 20시~06시, 달빛 아래 희귀 어종이 몰려든다</div>
  <canvas id="sea" width="430" height="300"></canvas>
  <div id="stats">
    <span id="goldTxt"></span><span id="dexTxt"></span><span id="scoreTxt"></span><span id="moonTxt"></span>
  </div>
  <div id="hint"></div>
  <div class="shop" id="shop"></div>
  <div class="btnRow"><button id="dexBtn" data-i18n="dexBtn">📖 달빛 도감</button></div>
  <div id="saveRow">
    <input id="codeInput" placeholder="이어하기 코드" data-i18n-ph="phCode" maxlength="18" autocomplete="off">
    <button id="codeLoadBtn" data-i18n="btnCodeLoad">🔑 코드로 불러오기</button>
  </div>
  <div id="codeShow"></div>
  <div id="saveStatus"></div>
</div>

<div class="panel" id="menu">
  <h1 data-i18n="menuTitle">🌕 달빛 낚시터</h1>
  <p data-i18n="menuDesc">홀드로 파워를 모아 캐스팅하고, 찌가 크게 출렁이는 순간 챔질하라.</p>
  <p class="small" data-i18n="menuTip1">🎣 캐스팅 거리로 수심이 정해진다 — 근해 · 앞바다 · 심해</p>
  <p class="small" data-i18n="menuTip2">🌕 실제 시각 20시~06시엔 달빛 보너스 — 희귀 어종 확률 상승</p>
  <p class="small" data-i18n="menuTip3">⚙ 낚싯대 = 텐션 여유 · 릴 = 존 크기 · 미끼 = 희귀도 · 탐지기 = 어영 정보</p>
  <div class="row"><button id="startBtn" data-i18n="startBtn">🎣 낚시터 들어가기</button></div>
</div>

<div class="panel" id="dexPanel" hidden>
  <h1 data-i18n="dexTitle">📖 달빛 도감</h1>
  <p class="small" id="dexSum"></p>
  <div id="dexGrid"></div>
  <div class="row">
    <button id="dexClose" data-i18n="dexClose">🎣 낚시터로 돌아가기</button>
    <button id="backBtn" class="ghost" data-i18n="backBtn">처음으로</button>
  </div>
</div>

<div id="toast"></div>

/* ── 업그레이드 ── */
var SHOP = [
  { key:'rod',   name:'shopRod',   desc:'shopRodDesc',   base:90,  maxLv:5 },
  { key:'reel',  name:'shopReel',  desc:'shopReelDesc',  base:110, maxLv:5 },
  { key:'bait',  name:'shopBait',  desc:'shopBaitDesc',  base:130, maxLv:5 },
  { key:'sonar', name:'shopSonar', desc:'shopSonarDesc', base:0,   maxLv:3, costs:[150, 550, 1800] },
];
function shopCost(it) {
  var lv = S[it.key];
  return it.costs ? it.costs[lv] : Math.ceil(it.base * Math.pow(2.15, lv));
}

/* ── 플랫폼 연동 (이어하기 코드 세이브 — golden-forge 동일 패턴) ── */
var API = '/api/v1/games/moon-angler';
function token() { return localStorage.getItem('portal_access_token'); }
function deviceId() {
  var id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
function api(path, opt) {
  opt = opt || {};
  var headers = { 'Content-Type': 'application/json', 'X-Device-Id': deviceId() };
  var tk = token();
  if (tk) headers['Authorization'] = 'Bearer ' + tk;
  return fetch(API + path, { method: opt.method, body: opt.body, headers: headers }).then(function (res) {
    return res.json().catch(function () { return null; }).then(function (body) {
      if (!res.ok || !body || body.success === false) {
        throw new Error((body && body.error && body.error.code) || res.status);
      }
      return body.data;
    });
  });
}
var CODE_KEY = 'moon_angler_code', LOCAL_KEY = 'moon_angler_save';
var saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
function fmtCode(c) { return c ? c.replace(/(.{4})(?=.)/g, '$1-') : ''; }
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }
var toastT = null;
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.style.opacity = 0; }, 2600);
}

/* ── 상태 ── */
var S = null;
function fresh() {
  return { v: 1, gold: 0, casts: 0, rod: 0, reel: 0, bait: 0, sonar: 0, dex: {}, lastTs: Date.now() };
}
function dexCount() {
  var n = 0, k;
  for (k in S.dex) if (S.dex.hasOwnProperty(k)) n++;
  return n;
}
function score() {
  var sc = 0, legends = 0, cm = 0, n = 0, k;
  for (k in S.dex) {
    if (!S.dex.hasOwnProperty(k)) continue;
    n++;
    if (FISH[k].r === 5) legends++;
    cm += Math.floor(S.dex[k].max);
  }
  sc = n * 500 + legends * 2000 + cm;
  return sc;
}
function legendCount() {
  var n = 0, k;
  for (k in S.dex) if (S.dex.hasOwnProperty(k) && FISH[k].r === 5) n++;
  return n;
}
function totalCm() {
  var cm = 0, k;
  for (k in S.dex) if (S.dex.hasOwnProperty(k)) cm += Math.floor(S.dex[k].max);
  return cm;
}
function stars(r) {
  var s = '', i;
  for (i = 0; i < r; i++) s += '★';
  return s;
}
function fmt(n) {
  return n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M'
       : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : Math.floor(n).toString();
}

/* ── 세이브 ── */
function localFallback() {
  try {
    var d = JSON.parse(localStorage.getItem(LOCAL_KEY));
    return d && d.v === 1 ? d : null;
  } catch (e) { return null; }
}
function loadSave(codeOverride) {
  var code = codeOverride || saveCode;
  if (token() || code) {
    return api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''))
      .then(function (s) {
        saveVersion = s.version;
        if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
        $('saveStatus').textContent = TX('saveCloud', { v: saveVersion });
        showCode();
        if (s.data && s.data.v === 1) return s.data;
        if (codeOverride) toast(TR('saveNoCode'));
        return null;
      })
      .catch(function (e) {
        $('saveStatus').textContent = TX('saveFail', { e: e.message });
        if (codeOverride) return null;
        return localFallback();
      });
  }
  $('saveStatus').textContent = TR('saveLocal');
  showCode();
  return Promise.resolve(localFallback());
}
function persist() {
  if (!S) return;
  S.lastTs = Date.now();
  localStorage.setItem(LOCAL_KEY, JSON.stringify(S));
  var hadCode = !!saveCode;
  api('/save', { method: 'PUT', body: JSON.stringify({ data: S, version: saveVersion, code: saveCode }) })
    .then(function (s) {
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      if (!hadCode && saveCode) toast(TX('codeIssued', { c: fmtCode(saveCode) }));
      showCode();
    })
    .catch(function (e) {
      if (e.message !== 'INVALID_INPUT') return;
      // 버전 충돌 — 서버 버전 재동기화 후 1회 재시도
      api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''))
        .then(function (re) {
          saveVersion = re.version;
          return api('/save', { method: 'PUT', body: JSON.stringify({ data: S, version: saveVersion, code: saveCode }) });
        })
        .then(function (s2) { saveVersion = s2.version; })
        .catch(function () {});
    });
}
var persistTimer = null;
function persistSoon() { clearTimeout(persistTimer); persistTimer = setTimeout(persist, 2500); }

/* ── 랭킹 — 점수 = 도감 종수×500 + 전설×2000 + 크기 보정 ── */
function submitRank() {
  if (S && score() > 0 && window.GameRank) {
    GameRank.submit('moon-angler', score(), TX('rankDetail', { n: dexCount() }));
  }
}

/* ── 씬 지오메트리 ── */
var SEA_Y = 148;                                       // 수평선
var ROD_TIP = { x: 88, y: 100 };
var CAST_X0 = 110, CAST_X1 = 406;                      // 캐스팅 착수점 범위
var ZONE_BOUND = [210, 320];                           // 근해 | 앞바다 | 심해 경계 x
var BITE_WIN = 0.85;                                   // 입질 판정창 (s)
var PERSONA_KEY = { calm: 'pCalm', fierce: 'pFierce', tricky: 'pTricky' };

/* ── 페이즈: idle | power | fly | wait | bite | reel | result ── */
var phase = 'idle';
var holdDown = false;
var P = null;                                          // 현재 캐스트/파이트 상태
var parts = [];                                        // 파티클

function burst(x, y, color, n, spd) {
  var i, a, sp;
  for (i = 0; i < n; i++) {
    a = rnd() * Math.PI * 2; sp = spd * (0.35 + rnd() * 0.85);
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - spd * 0.4, life: 1,
                 color: color, size: 2 + rnd() * 2, grav: 220 });
  }
}
function popText(x, y, text, color) {
  parts.push({ x: x, y: y, vx: 0, vy: -24, life: 1.4, text: text, color: color, grav: 0 });
}
function ringFx(x, y, color, r) {
  parts.push({ x: x, y: y, vx: 0, vy: 0, life: 1, ring: r, color: color, grav: 0 });
}

function zoneOfX(x) { return x < ZONE_BOUND[0] ? 0 : x < ZONE_BOUND[1] ? 1 : 2; }

/* ── 어종 추첨 — 존 내 희귀도 가중 (미끼 Lv + 달빛 보정) ── */
function rollFish(zone) {
  var pool = [], wsum = 0, i, f, w, moon = isMoon();
  for (i = 0; i < FISH.length; i++) {
    f = FISH[i];
    if (f.z !== zone) continue;
    w = RARITY_W[f.r - 1] * Math.pow(1 + 0.22 * S.bait, f.r - 1);
    if (moon) w *= MOON_W[f.r - 1];
    pool.push({ i: i, w: w });
    wsum += w;
  }
  var pick = rnd() * wsum, j;
  for (j = 0; j < pool.length; j++) {
    pick -= pool[j].w;
    if (pick <= 0) return pool[j].i;
  }
  return pool[pool.length - 1].i;
}
function rollSize(f) {
  var t = Math.pow(rnd(), 1.35);                       // 소형 쪽으로 완만히 치우침
  return Math.round((f.min + t * (f.max - f.min)) * 10) / 10;
}

function setHint(key) { $('hint').textContent = key ? TR(key) : ''; }

/* ── 캐스팅 ── */
function startPower() {
  phase = 'power';
  P = { power: 0, powDir: 1 };
  setHint(null);
}
function doCast() {
  var power = P.power;
  var tx = CAST_X0 + power * (CAST_X1 - CAST_X0);
  var zone = zoneOfX(tx);
  phase = 'fly';
  P = { t: 0, x0: ROD_TIP.x, y0: ROD_TIP.y, x1: tx, zone: zone,
        fish: rollFish(zone), bx: ROD_TIP.x, by: ROD_TIP.y };
  P.size = rollSize(FISH[P.fish]);
}
function startWait() {
  phase = 'wait';
  P.waitT = 2 + rnd() * 4;
  P.fakeT = 0.7 + rnd() * 1.4;
  P.fakeAnim = 0;
  P.biteAnim = 0;
  $('hint').textContent = TX('hintZone', { z: TR('zone' + P.zone) }) + ' — ' + TR('hintWait');
}
function triggerBite() {
  phase = 'bite';
  P.biteT = BITE_WIN;
  P.biteAnim = 1;
  burst(P.bx, P.by, '#7dd3fc', 8, 90);
  ringFx(P.bx, P.by, '#7dd3fc', 26);
  setHint('hintBite');
}
function scareFish() {
  toast(TR('toastScared'));
  burst(P.bx, P.by, '#8b98b8', 6, 70);
  phase = 'idle';
  P = null;
  setHint('hintIdle');
}
function missBite() {
  toast(TR('toastMiss'));
  P.fish = rollFish(P.zone);                            // 미끼만 물고 감 — 다음 놈 재추첨
  P.size = rollSize(FISH[P.fish]);
  startWait();
}

/* ── 릴 감기 미니게임 ── */
function hookFish() {
  var elapsed = BITE_WIN - P.biteT;
  var grade = elapsed < 0.28 ? 'perfect' : elapsed < 0.6 ? 'good' : 'late';
  var f = FISH[P.fish];
  var hpMax = fishHp(f);
  phase = 'reel';
  P.grade = grade;
  P.hpMax = hpMax;
  P.hp = hpMax * (grade === 'perfect' ? 0.82 : grade === 'good' ? 0.92 : 1);
  P.tension = grade === 'perfect' ? 0 : grade === 'good' ? 5 : 10;
  P.goldMul = grade === 'perfect' ? 1.3 : grade === 'good' ? 1.1 : 1;
  P.zsize = zoneSize();
  P.zy = 0.5; P.zv = 0;                                // 릴 존 중심 (0=바닥, 1=꼭대기)
  P.fy = 0.5 + (rnd() - 0.5) * 0.3; P.fv = 0;          // 물고기 위치/속도
  P.aiT = 0; P.aiState = 'freeze'; P.aiTarget = P.fy;
  P.gradeT = 1.2;
  holdDown = true;                                     // 챔질 탭이 곧 첫 홀드
  if (grade !== 'late') popText(P.bx, P.by - 26, TR(grade), grade === 'perfect' ? '#eab308' : '#22c55e');
  setHint('hintReel');
}
function fishAi(dt) {
  var f = FISH[P.fish], maxSpd, accel;
  P.aiT -= dt;
  if (f.p === 'calm') {
    maxSpd = 0.28 + f.r * 0.02; accel = 1.2;
    if (P.aiT <= 0) { P.aiTarget = rnd(); P.aiT = 1.0 + rnd() * 1.2; }
  } else if (f.p === 'fierce') {
    maxSpd = 0.5 + f.r * 0.04; accel = 3.2;
    if (P.aiT <= 0) {
      P.aiTarget = rnd(); P.aiT = 0.5 + rnd() * 0.6;
      if (rnd() < 0.3) P.fv += (P.aiTarget > P.fy ? 1 : -1) * 0.45;  // 급가속 스파이크
    }
  } else {                                             // tricky — 페이크 정지 → 급발진
    if (P.aiT <= 0) {
      if (P.aiState === 'freeze') {
        P.aiState = 'dart';
        P.aiTarget = P.fy < 0.5 ? 0.75 + rnd() * 0.25 : rnd() * 0.25;
        P.aiT = 0.5 + rnd() * 0.4;
      } else {
        P.aiState = 'freeze';
        P.aiT = 0.4 + rnd() * 0.6;
      }
    }
    if (P.aiState === 'freeze') { P.fv *= Math.max(0, 1 - dt * 9); return; }
    maxSpd = 0.85 + f.r * 0.03; accel = 4.0;
  }
  P.fv += (P.aiTarget > P.fy ? accel : -accel) * dt;
  P.fv = clamp(P.fv, -maxSpd, maxSpd);
}
function updateReel(dt) {
  var f = FISH[P.fish];
  // 릴 존 물리 — 홀드 상승 / 놓으면 하강
  P.zv += (holdDown ? REEL.holdAccel : -REEL.gravity) * dt;
  P.zv = clamp(P.zv, -REEL.maxVel, REEL.maxVel);
  P.zy += P.zv * dt;
  var half = P.zsize / 2;
  if (P.zy < half) { P.zy = half; if (P.zv < 0) P.zv = -P.zv * REEL.bounce; }
  if (P.zy > 1 - half) { P.zy = 1 - half; if (P.zv > 0) P.zv = -P.zv * REEL.bounce; }
  // 물고기 AI
  fishAi(dt);
  P.fy = clamp(P.fy + P.fv * dt, 0, 1);
  if (P.fy === 0 || P.fy === 1) P.fv = -P.fv * 0.5;
  // 판정
  var inZone = Math.abs(P.fy - P.zy) <= half;
  P.inZone = inZone;
  if (inZone) {
    P.hp -= REEL.drainIn * dt;
    P.tension = Math.max(0, P.tension - REEL.tensionIn * dt);
  } else {
    P.hp = Math.min(P.hpMax, P.hp + REEL.regenOut * dt);
    P.tension += REEL.tensionOut * fishPow(f) * dt;
  }
  if (P.gradeT > 0) P.gradeT -= dt;
  if (P.hp <= 0) { landFish(true); return; }
  if (P.tension >= tensionMax()) landFish(false);
}

/* ── 포획 / 놓침 ── */
function landFish(caught) {
  var f = FISH[P.fish], idx = P.fish, size = P.size;
  phase = 'result';
  P.resultT = 2.4;
  P.caught = caught;
  if (!caught) {
    burst(P.bx, P.by, '#ef4444', 12, 130);
    setHint('hintIdle');
    return;
  }
  var span = f.max - f.min;
  var gold = Math.round(PRICE_BASE[f.r - 1] * (0.7 + 0.8 * (size - f.min) / (span || 1)) * P.goldMul);
  S.gold += gold;
  S.casts++;
  var d = S.dex[idx];
  P.isNew = !d;
  P.isRecord = !!d && size > d.max;
  if (!d) S.dex[idx] = { n: 1, max: size };
  else { d.n++; if (size > d.max) d.max = size; }
  P.gold = gold;
  burst(P.bx, P.by, '#7dd3fc', 14, 130);
  ringFx(P.bx, P.by, f.r === 5 ? '#eab308' : '#7dd3fc', 40);
  popText(P.bx, P.by - 30, TX('goldPop', { g: gold }), '#eab308');
  if (f.r === 5) burst(VW / 2, SEA_Y - 40, '#eab308', 26, 180);
  hud(); renderShop(); persistSoon();
  if (P.isNew || P.isRecord) submitRank();              // 도감 갱신 시에만 랭킹 제출
  setHint('hintIdle');
}

/* ── 메인 업데이트 ── */
function update(dt) {
  var i, pa;
  if (phase === 'power') {
    P.power += P.powDir * 1.1 * dt;
    if (P.power >= 1) { P.power = 1; P.powDir = -1; }
    if (P.power <= 0) { P.power = 0; P.powDir = 1; }
  } else if (phase === 'fly') {
    P.t += dt / 0.7;
    if (P.t >= 1) {
      P.t = 1;
      P.bx = P.x1; P.by = SEA_Y + 14;
      burst(P.bx, P.by, '#7dd3fc', 10, 110);
      startWait();
    } else {
      P.bx = P.x0 + (P.x1 - P.x0) * P.t;
      P.by = P.y0 + (SEA_Y + 14 - P.y0) * P.t - Math.sin(P.t * Math.PI) * 70;
    }
  } else if (phase === 'wait') {
    P.fakeAnim = Math.max(0, P.fakeAnim - dt * 2.2);
    P.fakeT -= dt;
    if (P.fakeT <= 0) { P.fakeAnim = 1; P.fakeT = 0.9 + rnd() * 1.8; }   // 페이크 — 작은 흔들림
    P.waitT -= dt;
    if (P.waitT <= 0) triggerBite();
  } else if (phase === 'bite') {
    P.biteAnim = Math.max(0, P.biteAnim - dt * 1.2);
    P.biteT -= dt;
    if (P.biteT <= 0) missBite();
  } else if (phase === 'reel') {
    updateReel(dt);
  } else if (phase === 'result') {
    P.resultT -= dt;
    if (P.resultT <= 0) { phase = 'idle'; P = null; }
  }
  for (i = parts.length - 1; i >= 0; i--) {
    pa = parts[i];
    pa.x += pa.vx * dt; pa.y += pa.vy * dt;
    pa.vy += (pa.grav || 0) * dt;
    pa.life -= dt * (pa.text ? 1.0 : pa.ring ? 2.6 : 2.0);
    if (pa.life <= 0) parts.splice(i, 1);
  }
}

/* ── HUD / 상점 / 도감 ── */
function hud() {
  $('goldTxt').textContent = TX('hudGold', { g: fmt(S.gold) });
  $('dexTxt').textContent = TX('hudDex', { n: dexCount() });
  $('scoreTxt').textContent = TX('hudScore', { s: fmt(score()) });
  var mt = $('moonTxt');
  mt.textContent = isMoon() ? TR('moonOn') : TR('moonOff');
  mt.className = isMoon() ? 'on' : '';
}
function renderShop() {
  var shop = $('shop'), i, it, lv, maxed, cost, b;
  shop.innerHTML = '';
  for (i = 0; i < SHOP.length; i++) {
    it = SHOP[i];
    lv = S[it.key];
    maxed = lv >= it.maxLv;
    cost = maxed ? 0 : shopCost(it);
    b = document.createElement('button');
    b.innerHTML = '<span><b>' + TR(it.name) + ' ' + TX('lvTag', { n: lv }) + '</b><small>' + TR(it.desc) + '</small></span>' +
      '<span class="price">' + (maxed ? TR('lvMax') : fmt(cost) + 'G') + '</span>';
    b.disabled = maxed || S.gold < cost;
    b.onclick = (function (item, price, isMax) {
      return function () {
        if (isMax || S.gold < price) return;
        S.gold -= price;
        S[item.key]++;
        hud(); renderShop(); persistSoon();
      };
    })(it, cost, maxed);
    shop.appendChild(b);
  }
}
function sonarLine() {
  if (!S.sonar || !P || !P.fish && P.fish !== 0) return '';
  var f = FISH[P.fish], s = stars(f.r);
  if (S.sonar >= 2) s += ' · ' + TR(PERSONA_KEY[f.p]);
  if (S.sonar >= 3) s = TR('nm' + P.fish) + ' · ' + s;
  return TX('sonarTag', { s: s });
}
function renderDex() {
  var grid = $('dexGrid'), i, f, d, got, card, tags;
  grid.innerHTML = '';
  for (i = 0; i < FISH.length; i++) {
    f = FISH[i];
    d = S.dex[i];
    got = !!d;
    card = document.createElement('div');
    card.className = 'dexCard' + (got ? ' got' : '') + (got && f.r === 5 ? ' legend' : '');
    tags = got
      ? TX('dexCountTag', { n: d.n }) + '</span><span>' + TX('dexMaxTag', { cm: d.max })
      : TR('dexUnknown');
    card.innerHTML =
      '<span class="de">' + (got ? f.e : '❓') + '</span>' +
      '<b>' + (got ? TR('nm' + i) : TR('dexUnknown')) + '</b>' +
      '<span style="color:' + RARITY_COL[f.r - 1] + '">' + stars(f.r) + '</span>' +
      '<span>' + TR('zone' + f.z) + ' · ' + TR(PERSONA_KEY[f.p]) + '</span>' +
      '<span>' + tags + '</span>';
    grid.appendChild(card);
  }
  $('dexSum').textContent = TX('dexSum', { n: dexCount(), l: legendCount(), cm: totalCm(), s: fmt(score()) });
}

/* ── 렌더 ── */
var STARS = [], SHIMS = [], si;
for (si = 0; si < 70; si++) {
  STARS.push({ x: Math.floor(rnd() * VW), y: Math.floor(rnd() * (SEA_Y - 14)), s: rnd() < 0.2 ? 2 : 1, ph: rnd() * 7 });
}
for (si = 0; si < 26; si++) {
  SHIMS.push({ y: 156 + si * 5.3, w: 8 + rnd() * 26, ph: rnd() * 7 });
}

function drawSkySea(now) {
  var moon = isMoon(), g, i, st, a, sh, k, x, y;
  g = cx.createLinearGradient(0, 0, 0, SEA_Y);
  g.addColorStop(0, moon ? '#0c1424' : '#16233c');
  g.addColorStop(1, moon ? '#16233c' : '#24344f');
  cx.fillStyle = g; cx.fillRect(0, 0, VW, SEA_Y);
  if (moon) {
    for (i = 0; i < STARS.length; i++) {
      st = STARS[i];
      a = 0.25 + 0.6 * Math.abs(Math.sin(now / 700 + st.ph));
      cx.globalAlpha = a;
      cx.fillStyle = '#cbd5e1';
      cx.fillRect(st.x, st.y, st.s, st.s);
    }
    cx.globalAlpha = 1;
  }
  // 달 / 해
  g = cx.createRadialGradient(352, 54, 6, 352, 54, moon ? 64 : 50);
  g.addColorStop(0, moon ? 'rgba(203,213,225,.30)' : 'rgba(242,230,184,.16)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  cx.fillStyle = g; cx.fillRect(280, 0, 150, 130);
  cx.fillStyle = moon ? '#e8edf5' : '#f2e6b8';
  cx.beginPath(); cx.arc(352, 54, moon ? 22 : 19, 0, 7); cx.fill();
  if (moon) {
    cx.fillStyle = '#c3cbd8';
    cx.beginPath(); cx.arc(345, 48, 4, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(358, 60, 3, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(350, 63, 2, 0, 7); cx.fill();
  }
  // 바다
  g = cx.createLinearGradient(0, SEA_Y, 0, VH);
  g.addColorStop(0, moon ? '#14283f' : '#1a3350');
  g.addColorStop(1, moon ? '#0a1226' : '#0e1830');
  cx.fillStyle = g; cx.fillRect(0, SEA_Y, VW, VH - SEA_Y);
  g = cx.createLinearGradient(0, 0, VW, 0);                       // 우측(심해)으로 갈수록 어둡게
  g.addColorStop(0, 'rgba(4,8,18,0)');
  g.addColorStop(1, 'rgba(4,8,18,.5)');
  cx.fillStyle = g; cx.fillRect(0, SEA_Y, VW, VH - SEA_Y);
  cx.fillStyle = 'rgba(203,213,225,.18)'; cx.fillRect(0, SEA_Y, VW, 1);
  // 달빛 물기둥 반짝임
  if (moon) {
    for (i = 0; i < SHIMS.length; i++) {
      sh = SHIMS[i];
      cx.globalAlpha = 0.05 + 0.06 * Math.abs(Math.sin(now / 600 + sh.ph));
      cx.fillStyle = '#cbd5e1';
      cx.fillRect(352 - sh.w / 2 + Math.sin(now / 900 + sh.ph) * 6, sh.y, sh.w, 2);
    }
    cx.globalAlpha = 1;
  }
  // 파도
  for (k = 0; k < 3; k++) {
    y = 172 + k * 38;
    cx.strokeStyle = 'rgba(125,211,252,' + (0.07 + k * 0.02).toFixed(2) + ')';
    cx.lineWidth = 1;
    cx.beginPath();
    for (x = 0; x <= VW; x += 6) {
      var wy = y + Math.sin(x * 0.05 + now / (700 + k * 180)) * 2.5;
      if (x === 0) cx.moveTo(x, wy); else cx.lineTo(x, wy);
    }
    cx.stroke();
  }
  // 수심 존 경계 + 라벨
  cx.strokeStyle = 'rgba(203,213,225,.12)';
  cx.setLineDash([4, 5]);
  for (i = 0; i < ZONE_BOUND.length; i++) {
    cx.beginPath(); cx.moveTo(ZONE_BOUND[i], SEA_Y + 4); cx.lineTo(ZONE_BOUND[i], VH - 4); cx.stroke();
  }
  cx.setLineDash([]);
  cx.fillStyle = 'rgba(203,213,225,.35)';
  cx.font = '10px monospace'; cx.textAlign = 'center';
  cx.fillText(TR('zone0'), 150, VH - 7);
  cx.fillText(TR('zone1'), 265, VH - 7);
  cx.fillText(TR('zone2'), 375, VH - 7);
}

function drawPier() {
  cx.fillStyle = '#2c2418';
  cx.fillRect(10, 174, 6, 30); cx.fillRect(62, 174, 6, 30);
  cx.fillStyle = '#3a2f22'; cx.fillRect(0, 164, 84, 10);
  cx.fillStyle = '#5a4c36'; cx.fillRect(0, 164, 84, 2);
  // 낚시꾼
  cx.fillStyle = '#0ea5e9'; cx.fillRect(38, 113, 13, 5); cx.fillRect(37, 118, 15, 2);
  cx.fillStyle = '#e5c9a8'; cx.fillRect(40, 120, 9, 8);
  cx.fillStyle = '#22304e'; cx.fillRect(39, 128, 11, 16);
  cx.fillStyle = '#1a2238'; cx.fillRect(40, 144, 4, 8); cx.fillRect(46, 144, 4, 8);
  cx.strokeStyle = '#22304e'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(49, 132); cx.lineTo(58, 126); cx.stroke();
  // 낚싯대
  cx.strokeStyle = '#8a6a3c'; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(50, 132); cx.lineTo(ROD_TIP.x, ROD_TIP.y); cx.stroke();
}

function drawLine(bx, by, sag) {
  cx.strokeStyle = 'rgba(203,213,225,.5)';
  cx.lineWidth = 1;
  cx.beginPath();
  cx.moveTo(ROD_TIP.x, ROD_TIP.y);
  cx.quadraticCurveTo((ROD_TIP.x + bx) / 2, Math.max(ROD_TIP.y, by) + sag, bx, by);
  cx.stroke();
}
function drawBobber(x, y) {
  cx.fillStyle = '#cbd5e1'; cx.fillRect(x - 3, y - 2, 6, 5);
  cx.fillStyle = '#eab308'; cx.fillRect(x - 3, y - 7, 6, 5);
  cx.fillStyle = '#8b98b8'; cx.fillRect(x - 1, y - 10, 2, 3);
}

function drawSonar() {
  var sl = sonarLine();
  if (!sl) return;
  cx.fillStyle = '#7dd3fc'; cx.font = '10px monospace'; cx.textAlign = 'left';
  cx.fillText(sl, 12, 40);
}

function drawPower(now) {
  var tx = CAST_X0 + P.power * (CAST_X1 - CAST_X0);
  var zone = zoneOfX(tx);
  var zcol = ['#22c55e', '#0ea5e9', '#a855f7'][zone];
  cx.fillStyle = 'rgba(10,16,30,.85)'; cx.fillRect(18, 46, 132, 16);
  cx.strokeStyle = '#263050'; cx.lineWidth = 1; cx.strokeRect(18.5, 46.5, 131, 15);
  cx.fillStyle = zcol; cx.fillRect(20, 48, P.power * 128, 12);
  cx.fillStyle = '#dbe4f2'; cx.font = 'bold 10px monospace'; cx.textAlign = 'left';
  cx.fillText(TR('zone' + zone), 156, 58);
  // 예상 궤적
  cx.fillStyle = 'rgba(203,213,225,.35)';
  var i, t, dx, dy;
  for (i = 1; i <= 8; i++) {
    t = i / 9;
    dx = ROD_TIP.x + (tx - ROD_TIP.x) * t;
    dy = ROD_TIP.y + (SEA_Y + 14 - ROD_TIP.y) * t - Math.sin(t * Math.PI) * 70;
    cx.fillRect(dx - 1, dy - 1, 2, 2);
  }
}

function drawReelUi(now) {
  var f = FISH[P.fish];
  var tx0 = 396, tw = 20, ty0 = 44, th = 240;
  var half = P.zsize / 2;
  // 트랙
  cx.fillStyle = 'rgba(10,16,30,.85)'; cx.fillRect(tx0, ty0, tw, th);
  cx.strokeStyle = '#263050'; cx.strokeRect(tx0 + 0.5, ty0 + 0.5, tw - 1, th - 1);
  // 릴 존
  var zTop = ty0 + (1 - (P.zy + half)) * th;
  cx.fillStyle = P.inZone ? 'rgba(14,165,233,.62)' : 'rgba(14,165,233,.38)';
  cx.fillRect(tx0 + 2, zTop, tw - 4, P.zsize * th);
  if (P.inZone) { cx.strokeStyle = '#7dd3fc'; cx.strokeRect(tx0 + 1.5, zTop - 0.5, tw - 3, P.zsize * th + 1); }
  // 물고기 마커
  cx.font = '13px monospace'; cx.textAlign = 'center';
  cx.fillText(f.e, tx0 + tw / 2, ty0 + (1 - P.fy) * th + 5);
  // 텐션 바 (좌)
  var tmax = tensionMax(), tr = clamp(P.tension / tmax, 0, 1);
  cx.fillStyle = 'rgba(10,16,30,.85)'; cx.fillRect(14, ty0, 12, th);
  cx.strokeStyle = '#263050'; cx.strokeRect(14.5, ty0 + 0.5, 11, th - 1);
  cx.fillStyle = tr < 0.5 ? '#22c55e' : tr < 0.8 ? '#eab308' : '#ef4444';
  cx.fillRect(16, ty0 + th - 2 - (th - 4) * tr, 8, (th - 4) * tr);
  cx.font = '10px monospace';
  cx.fillStyle = '#8b98b8'; cx.fillText('⚡', 20, ty0 + th + 12);
  // 체력 바 (상단)
  cx.font = '12px monospace'; cx.textAlign = 'left';
  cx.fillText(f.e, 104, 35);
  cx.fillStyle = 'rgba(10,16,30,.85)'; cx.fillRect(120, 26, 180, 9);
  cx.strokeStyle = '#263050'; cx.strokeRect(120.5, 26.5, 179, 8);
  cx.fillStyle = '#22c55e';
  cx.fillRect(121, 27, 178 * clamp(P.hp / P.hpMax, 0, 1), 7);
  // 물고기 실루엣 — 찌 주변에서 요동
  var fx = P.bx + Math.sin(now / 160) * 14;
  var fy = Math.min(VH - 16, P.by + 18 + Math.sin(now / 230) * 6);
  var len = clamp(14 + (f.max / 300) * 40, 14, 50);
  cx.fillStyle = 'rgba(6,10,20,.8)';
  cx.beginPath(); cx.ellipse(fx, fy, len / 2, len / 5, Math.sin(now / 300) * 0.25, 0, 7); cx.fill();
  cx.beginPath();
  cx.moveTo(fx - len / 2 - 6, fy - 5); cx.lineTo(fx - len / 2 + 2, fy); cx.lineTo(fx - len / 2 - 6, fy + 5);
  cx.closePath(); cx.fill();
}

function drawResult() {
  var f = FISH[P.fish];
  cx.fillStyle = 'rgba(12,20,36,.82)';
  cx.fillRect(55, 88, 320, 126);
  cx.strokeStyle = P.caught ? (f.r === 5 ? '#eab308' : '#0ea5e9') : '#ef4444';
  cx.strokeRect(55.5, 88.5, 319, 125);
  cx.textAlign = 'center';
  if (P.caught) {
    cx.font = '30px monospace';
    cx.fillText(f.e, VW / 2, 128);
    cx.font = 'bold 13px monospace';
    cx.fillStyle = RARITY_COL[f.r - 1];
    cx.fillText(TX('catchLine', { e: stars(f.r), name: TR('nm' + P.fish), cm: P.size }), VW / 2, 152);
    cx.fillStyle = '#eab308';
    cx.fillText(TX('goldPop', { g: P.gold }), VW / 2, 172);
    if (P.isNew || P.isRecord) {
      cx.fillStyle = P.isNew ? '#22c55e' : '#eab308';
      cx.fillText(P.isNew ? TR('newSpecies') : TX('newRecord', { cm: P.size }), VW / 2, 194);
    }
  } else {
    cx.font = '26px monospace';
    cx.fillText('💥', VW / 2, 132);
    cx.font = 'bold 12px monospace';
    cx.fillStyle = '#ef4444';
    cx.fillText(TR('escaped'), VW / 2, 162);
  }
}

function draw(now) {
  drawSkySea(now);
  drawPier();
  if (phase === 'power') {
    drawPower(now);
  } else if (phase === 'fly') {
    drawLine(P.bx, P.by, 4);
    drawBobber(P.bx, P.by);
  } else if (phase === 'wait' || phase === 'bite') {
    var dip = Math.sin(now / 400) * 2 + P.fakeAnim * 4 + (phase === 'bite' ? 7 : 0);
    drawLine(P.bx, P.by + dip, 16);
    drawBobber(P.bx, P.by + dip);
    if (P.fakeAnim > 0.4 || phase === 'bite') {
      cx.strokeStyle = 'rgba(125,211,252,.4)'; cx.lineWidth = 1;
      cx.beginPath(); cx.arc(P.bx, P.by + 2, 8 + (1 - (phase === 'bite' ? P.biteAnim : P.fakeAnim)) * 10, 0, 7); cx.stroke();
    }
    if (phase === 'bite') {
      cx.fillStyle = '#eab308'; cx.font = 'bold 20px monospace'; cx.textAlign = 'center';
      cx.fillText('!', P.bx, P.by - 22);
    }
    drawSonar();
  } else if (phase === 'reel') {
    var tug = Math.sin(now / 90) * 2;
    drawLine(P.bx + tug, P.by + 4, 2);
    drawBobber(P.bx + tug, P.by + 4);
    drawReelUi(now);
  } else if (phase === 'result') {
    drawResult();
  }
  // 파티클
  var i, pa;
  for (i = 0; i < parts.length; i++) {
    pa = parts[i];
    cx.globalAlpha = clamp(pa.life, 0, 1);
    if (pa.ring) {
      cx.strokeStyle = pa.color; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(pa.x, pa.y, pa.ring * (1.25 - pa.life), 0, 7); cx.stroke();
    } else if (pa.text) {
      cx.font = 'bold 13px monospace'; cx.textAlign = 'center';
      cx.fillStyle = '#000'; cx.fillText(pa.text, pa.x + 1, pa.y + 1);
      cx.fillStyle = pa.color; cx.fillText(pa.text, pa.x, pa.y);
    } else {
      cx.fillStyle = pa.color; cx.fillRect(pa.x, pa.y, pa.size, pa.size);
    }
    cx.globalAlpha = 1;
  }
}

/* ── 입력 — 탭/홀드 (포인터 + 스페이스) ── */
function pressDown() {
  if (!S) return;
  if (phase === 'idle') startPower();
  else if (phase === 'wait') scareFish();
  else if (phase === 'bite') hookFish();
  else if (phase === 'reel') holdDown = true;
}
function pressUp() {
  if (phase === 'power') doCast();
  holdDown = false;
}
cv.addEventListener('pointerdown', function (ev) { ev.preventDefault(); pressDown(); });
window.addEventListener('pointerup', pressUp);
window.addEventListener('pointercancel', pressUp);
cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
window.addEventListener('keydown', function (ev) {
  if (ev.code !== 'Space' || ev.repeat) return;
  if ($('menu').hidden && $('dexPanel').hidden) { ev.preventDefault(); pressDown(); }
});
window.addEventListener('keyup', function (ev) {
  if (ev.code === 'Space') { ev.preventDefault(); pressUp(); }
});

/* ── 패널 ── */
$('startBtn').onclick = function () { $('menu').hidden = true; };
$('dexBtn').onclick = function () { renderDex(); $('dexPanel').hidden = false; };
$('dexClose').onclick = function () { $('dexPanel').hidden = true; };
$('backBtn').onclick = function () { $('dexPanel').hidden = true; $('menu').hidden = false; };
$('codeLoadBtn').onclick = function () {
  var raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  loadSave(raw).then(function (d) {
    if (d) { saveCode = raw; localStorage.setItem(CODE_KEY, raw); boot(d); }
  });
};

/* ── 루프 ── */
var last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  var now = performance.now(), dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S) update(dt);
  draw(now);
}
setInterval(function () { if (S) persist(); }, 30000);
setInterval(function () { if (S) hud(); }, 20000);        // 달빛 시간 전환 반영
addEventListener('beforeunload', function () {
  if (S) { S.lastTs = Date.now(); localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); }
});

/* ── 시작 ── */
function boot(saved) {
  S = saved || fresh();
  if (!S.dex) S.dex = {};
  phase = 'idle'; P = null;
  hud(); renderShop();
  setHint('hintIdle');
}
loadSave().then(boot);
requestAnimationFrame(loop);
</script>
<script src="../lib/rank.js"></script>
<script>
'use strict';
GameRank.autoPanel('moon-angler');
GameRank.copyButton(function () { return typeof saveCode !== 'undefined' ? saveCode : null; });
</script>
