<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">네모 채굴</title>
<script src="../lib/i18n.js"></script>
<script src="../lib/daily.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#0c1424; color:#e6ecf2; font-family:'Courier New',monospace; display:flex;
         flex-direction:column; align-items:center; min-height:100vh; user-select:none; padding:14px 8px 30px;
         touch-action:manipulation; }
  h1.top { font-size:19px; color:#0ea5e9; margin:6px 0 2px; text-shadow:1px 1px 0 #000; }
  .sub { font-size:11px; color:#8e9db0; margin-bottom:10px; }
  #wrap { display:grid; grid-template-columns:auto auto; grid-template-rows:auto auto; gap:3px; }
  #colClues { grid-column:2; display:grid; align-items:end; }
  #rowClues { grid-row:2; display:grid; justify-items:end; align-items:center; }
  #board { grid-column:2; grid-row:2; display:grid; background:#2c3550; gap:1px;
           border:2px solid #2c3550; border-radius:4px; overflow:hidden; }
  .cell { width:var(--cs); height:var(--cs); background:#1a2238; display:flex; align-items:center;
          justify-content:center; font-size:calc(var(--cs) * .55); color:#5d6a7a; cursor:pointer; }
  .cell.fill { background:#0ea5e9; }
  .cell.mark { color:#8e9db0; }
  .clue { font-size:calc(var(--cs) * .42); color:#c2cedc; line-height:1.15; text-align:center; }
  #colClues .clue { display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:3px;
                    width:calc(var(--cs) + 1px); }
  #rowClues .clue { display:flex; gap:4px; justify-content:flex-end; padding-right:5px;
                    height:calc(var(--cs) + 1px); align-items:center; }
  .clue.done { color:#3d4a5c; }
  #ctl { display:flex; gap:8px; margin:14px 0 4px; align-items:center; }
  button.act { background:#0ea5e9; color:#04121c; border:0; padding:11px 18px; font-weight:bold;
               font-size:13px; border-radius:8px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#222b44; color:#e6ecf2; }
  button.tool { background:#222b44; color:#e6ecf2; border:2px solid #2c3550; padding:10px 16px;
                border-radius:8px; font-family:inherit; font-weight:bold; font-size:14px; cursor:pointer; }
  button.tool.on { border-color:#0ea5e9; background:#2c3550; }
  #timerTxt { font-size:13px; color:#c2cedc; min-width:48px; text-align:center; }
  .panel { position:fixed; inset:0; background:rgba(9,13,24,.97); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:13px; text-align:center; z-index:10; padding:20px; overflow:auto; }
  .panel h1 { color:#0ea5e9; font-size:25px; text-shadow:2px 2px 0 #000; }
  .panel p { font-size:12.5px; color:#c2cedc; line-height:1.8; max-width:480px; }
  .panel p.small { font-size:11px; color:#8e9db0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .stat { background:#1a2238; border-radius:8px; padding:8px 14px; font-size:12px; }
  .stat b { color:#0ea5e9; font-size:17px; display:block; }
  #miniView { display:grid; gap:1px; background:#2c3550; border:2px solid #2c3550; border-radius:4px; }
  #miniView span { width:14px; height:14px; background:#1a2238; }
  #miniView span.on { background:#0ea5e9; }
</style>
</head>
<body>
<h1 class="top" data-i18n="title">⛏ 네모 채굴</h1>
<div class="sub"><span id="dayTag"></span> · <span id="timerTxt">0:00</span></div>

<div id="wrap">
  <div></div>
  <div id="colClues"></div>
  <div id="rowClues"></div>
  <div id="board"></div>
</div>

<div id="ctl">
  <button class="tool on" id="fillTool">⛏ <span data-i18n="fill">채우기</span></button>
  <button class="tool" id="markTool">✖ <span data-i18n="mark">표시</span></button>
</div>

<div class="panel" id="menu">
  <h1 data-i18n="menuTitle">⛏ 네모 채굴</h1>
  <p data-i18n="menuDesc">숫자는 그 줄에서 연속으로 채워지는 칸의 묶음이다. 가로·세로 단서를 모두
    만족하도록 광맥을 캐내라. ✖ 표시는 "여긴 빈 돌"이라는 메모일 뿐 채점되지 않는다.</p>
  <p class="small" id="menuStreak"></p>
  <button class="act" id="startBtn" data-i18n="startBtn">▶ 오늘의 광맥</button>
</div>

<div class="panel" id="endPanel" hidden>
  <h1 data-i18n="win">🎉 광맥 발굴!</h1>
  <div id="miniView"></div>
  <div class="row">
    <div class="stat"><b id="endStreak">0</b><span data-i18n="streakLabel">연속 출석</span></div>
    <div class="stat"><b id="endTime">0:00</b><span data-i18n="timeLabel">클리어 시간</span></div>
  </div>
  <p class="small"><span data-i18n="next">다음 광맥까지</span> <b id="cdown"></b></p>
  <div class="row">
    <button class="act" id="shareBtn" data-i18n="shareBtn">📤 결과 공유</button>
    <button class="act ghost" id="backBtn" data-i18n="backBtn">처음으로</button>
  </div>
</div>

<script>
'use strict';
GameI18n.init({
  ko: {
    title: '⛏ 네모 채굴', menuTitle: '⛏ 네모 채굴',
    menuDesc: '숫자는 그 줄에서 연속으로 채워지는 칸의 묶음이다. 가로·세로 단서를 모두 만족하도록 광맥을 캐내라. ✖ 표시는 "여긴 빈 돌"이라는 메모일 뿐 채점되지 않는다.',
    startBtn: '▶ 오늘의 광맥', fill: '채우기', mark: '표시', win: '🎉 광맥 발굴!',
    streakLabel: '연속 출석', timeLabel: '클리어 시간', next: '다음 광맥까지',
    shareBtn: '📤 결과 공유', backBtn: '처음으로',
  },
  en: {
    title: '⛏ Pixel Mine', menuTitle: '⛏ Pixel Mine',
    menuDesc: 'Each number is a run of consecutive filled cells in that line. Dig the vein so every row and column clue is satisfied. ✖ marks are just notes — they are not graded.',
    startBtn: '▶ Daily Vein', fill: 'Dig', mark: 'Mark', win: '🎉 Vein excavated!',
    streakLabel: 'Day streak', timeLabel: 'Clear time', next: 'Next vein in',
    shareBtn: '📤 Share', backBtn: 'Menu',
  },
});
var TR = GameI18n.t;

var SLUG = 'pixel-mine', EPOCH = '2026-08-07', N = 10;

var target, rowClues, colClues, state, startTs, timerIv, over, tool = 'fill';

function lineClue(arr) {
  var out = [], run = 0;
  for (var i = 0; i < arr.length; i++) {
    if (arr[i]) run++;
    else if (run) { out.push(run); run = 0; }
  }
  if (run) out.push(run);
  return out.length ? out : [0];
}

function genTarget() {
  var rand = GameDaily.rng(GameDaily.seed(SLUG));
  for (var attempt = 0; attempt < 60; attempt++) {
    var g = [];
    for (var r = 0; r < N; r++) {
      g.push([]);
      for (var c = 0; c < N; c++) g[r].push(rand() < 0.52 ? 1 : 0);
    }
    // 완전히 빈 줄이 3개 이상이면 밋밋해서 재생성
    var empties = 0;
    for (r = 0; r < N; r++) if (g[r].every(function (v) { return !v; })) empties++;
    for (var cc = 0; cc < N; cc++) {
      var col = g.map(function (row) { return row[cc]; });
      if (col.every(function (v) { return !v; })) empties++;
    }
    if (empties <= 1) return g;
  }
  return g; // 확률상 도달하지 않음
}

function colOf(grid, c) { return grid.map(function (row) { return row[c]; }); }

function begin() {
  target = genTarget();
  rowClues = target.map(lineClue);
  colClues = [];
  for (var c = 0; c < N; c++) colClues.push(lineClue(colOf(target, c)));
  state = target.map(function (row) { return row.map(function () { return 0; }); }); // 0 빈칸 1 채움 2 표시
  over = false;
  startTs = Date.now();
  clearInterval(timerIv);
  timerIv = setInterval(function () {
    document.getElementById('timerTxt').textContent =
      GameDaily.fmtTime(Math.floor((Date.now() - startTs) / 1000));
  }, 500);
  document.getElementById('menu').hidden = true;
  document.getElementById('endPanel').hidden = true;
  sizeCells();
  render();
}

function sizeCells() {
  var maxRowClue = Math.max.apply(null, rowClues.map(function (c) { return c.length; }));
  var avail = Math.min(460, window.innerWidth - 16);
  var cs = Math.floor((avail - maxRowClue * 14 - 12) / N);
  document.body.style.setProperty('--cs', Math.max(22, Math.min(38, cs)) + 'px');
}

function render() {
  var b = document.getElementById('board');
  b.style.gridTemplateColumns = 'repeat(' + N + ', var(--cs))';
  b.innerHTML = '';
  for (var r = 0; r < N; r++) {
    for (var c = 0; c < N; c++) {
      var d = document.createElement('div');
      d.className = 'cell' + (state[r][c] === 1 ? ' fill' : state[r][c] === 2 ? ' mark' : '');
      d.textContent = state[r][c] === 2 ? '✖' : '';
      d.dataset.r = r; d.dataset.c = c;
      b.appendChild(d);
    }
  }
  var cc = document.getElementById('colClues');
  cc.style.gridTemplateColumns = 'repeat(' + N + ', calc(var(--cs) + 1px))';
  cc.innerHTML = colClues.map(function (clue, i) {
    var done = clueDone(clue, colOf(state, i));
    return '<div class="clue' + (done ? ' done' : '') + '">' +
      clue.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '</div>';
  }).join('');
  var rc = document.getElementById('rowClues');
  rc.style.gridTemplateRows = 'repeat(' + N + ', calc(var(--cs) + 1px))';
  rc.innerHTML = rowClues.map(function (clue, i) {
    var done = clueDone(clue, state[i]);
    return '<div class="clue' + (done ? ' done' : '') + '">' +
      clue.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '</div>';
  }).join('');
}

function clueDone(clue, line) {
  var cur = lineClue(line.map(function (v) { return v === 1 ? 1 : 0; }));
  return JSON.stringify(cur) === JSON.stringify(clue);
}

function checkWin() {
  for (var r = 0; r < N; r++) if (!clueDone(rowClues[r], state[r])) return false;
  for (var c = 0; c < N; c++) if (!clueDone(colClues[c], colOf(state, c))) return false;
  return true;
}

// 드래그 페인팅 — 첫 칸의 결과 상태를 드래그 내내 유지
var painting = false, paintVal = 0;
function applyCell(r, c, first) {
  if (over) return;
  var cur = state[r][c];
  var next;
  if (first) {
    if (tool === 'fill') next = cur === 1 ? 0 : 1;
    else next = cur === 2 ? 0 : 2;
    paintVal = next;
  } else {
    next = paintVal;
    if (tool === 'fill' && cur === 2) return;  // 드래그로 표시를 덮지 않는다
    if (tool === 'mark' && cur === 1) return;
  }
  if (cur === next) return;
  state[r][c] = next;
  render();
  if (checkWin()) finish();
}
function cellFromEvent(e) {
  var t = e.touches ? document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY) : e.target;
  return t && t.classList && t.classList.contains('cell') ? t : null;
}
var boardEl = document.getElementById('board');
boardEl.addEventListener('pointerdown', function (e) {
  var cell = cellFromEvent(e);
  if (!cell) return;
  painting = true;
  applyCell(+cell.dataset.r, +cell.dataset.c, true);
  e.preventDefault();
});
boardEl.addEventListener('pointerover', function (e) {
  if (!painting) return;
  var cell = cellFromEvent(e);
  if (cell) applyCell(+cell.dataset.r, +cell.dataset.c, false);
});
window.addEventListener('pointerup', function () { painting = false; });
boardEl.addEventListener('touchmove', function (e) {
  if (!painting) return;
  var cell = cellFromEvent(e);
  if (cell) applyCell(+cell.dataset.r, +cell.dataset.c, false);
  e.preventDefault();
}, { passive: false });

function setTool(t) {
  tool = t;
  document.getElementById('fillTool').className = 'tool' + (t === 'fill' ? ' on' : '');
  document.getElementById('markTool').className = 'tool' + (t === 'mark' ? ' on' : '');
}
document.getElementById('fillTool').onclick = function () { setTool('fill'); };
document.getElementById('markTool').onclick = function () { setTool('mark'); };

function miniHtml() {
  var mv = document.getElementById('miniView');
  mv.style.gridTemplateColumns = 'repeat(' + N + ', 14px)';
  mv.innerHTML = target.map(function (row) {
    return row.map(function (v) { return '<span class="' + (v ? 'on' : '') + '"></span>'; }).join('');
  }).join('');
}

function finish() {
  over = true;
  clearInterval(timerIv);
  var sec = Math.floor((Date.now() - startTs) / 1000);
  miniHtml();
  document.getElementById('endTime').textContent = GameDaily.fmtTime(sec);
  var st = GameDaily.recordClear(SLUG);
  document.getElementById('endStreak').textContent = st.streak;
  if (!GameDaily.result(SLUG)) {
    GameDaily.saveResult(SLUG, { sec: sec });
    var score = Math.max(100, 7200 - sec * 4);
    GameRank.submit(SLUG, score, '#' + GameDaily.dayNumber(EPOCH) + ' ' + GameDaily.fmtTime(sec));
  }
  document.getElementById('endPanel').hidden = false;
}

document.getElementById('startBtn').onclick = function () {
  var prev = GameDaily.result(SLUG);
  begin();
  if (prev) {
    over = true;
    clearInterval(timerIv);
    state = target.map(function (row) { return row.slice(); });
    render();
    miniHtml();
    document.getElementById('endTime').textContent = GameDaily.fmtTime(prev.sec || 0);
    document.getElementById('endStreak').textContent = GameDaily.streak(SLUG).streak;
    document.getElementById('endPanel').hidden = false;
  }
};
document.getElementById('backBtn').onclick = function () {
  document.getElementById('endPanel').hidden = true;
  document.getElementById('menu').hidden = false;
  refreshMenu();
};
document.getElementById('shareBtn').onclick = function () {
  var sec = GameDaily.result(SLUG) ? GameDaily.result(SLUG).sec : 0;
  GameDaily.share(TR('title') + ' #' + GameDaily.dayNumber(EPOCH) + ' ⛏ ' + GameDaily.fmtTime(sec) +
    '\nhttps://game.1989v.com/games/pixel-mine/', this);
};

function refreshMenu() {
  var st = GameDaily.streak(SLUG);
  document.getElementById('menuStreak').textContent =
    '#' + GameDaily.dayNumber(EPOCH) + ' · 🔥 ' + st.streak + ' (best ' + st.best + ')';
}
document.getElementById('dayTag').textContent = '#' + GameDaily.dayNumber(EPOCH);
refreshMenu();
GameDaily.countdown(document.getElementById('cdown'));
window.addEventListener('resize', function () { if (target) { sizeCells(); render(); } });
</script>
<script src="../lib/rank.js"></script>
<script>GameRank.autoPanel('pixel-mine');</script>
</body>
</html>
