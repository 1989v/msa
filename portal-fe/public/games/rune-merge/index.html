<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>룬 합성</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:#100c16; color:#eae4f4; font-family:'Courier New',monospace; display:flex; flex-direction:column;
         align-items:center; justify-content:flex-start; min-height:100vh; user-select:none; padding:14px 0; }
  h1 { color:#c8b0ff; font-size:22px; text-shadow:2px 2px 0 #000; margin:4px 0; }
  #sub { font-size:11px; color:#8a84a0; margin-bottom:8px; }
  #stats { display:flex; gap:8px; margin-bottom:10px; font-size:13px; font-weight:bold; }
  #stats span { background:rgba(200,176,255,.08); border:1px solid #2c2440; padding:4px 12px; border-radius:9px; }
  #board { display:block; background:#1a1426; border:4px solid #2c2440; border-radius:12px; touch-action:none;
           width:min(400px, 94vw); }
  #btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  button { background:#9a7ae0; color:#140f24; border:0; padding:8px 18px; font-weight:bold; font-size:12px;
           border-radius:7px; cursor:pointer; font-family:inherit; }
  button.ghost { background:#2c2440; color:#eae4f4; }
  #saveRow { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:12px; }
  #saveRow input { background:#1a1426; border:1px solid #2c2440; color:#eae4f4; border-radius:6px; padding:6px 9px;
          font-family:inherit; font-size:12px; letter-spacing:1px; width:160px; text-transform:uppercase; }
  #saveStatus, #codeShow { font-size:10.5px; color:#8a84a0; margin-top:4px; text-align:center; }
  #codeShow { color:#c8b0ff; letter-spacing:2px; }
  #menu { width:min(400px, 94vw); margin-top:10px; }
  #info { margin-top:8px; font-size:11px; color:#5f5a74; text-align:center; }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:rgba(16,10,24,.92);
           padding:8px 18px; border-radius:9px; font-size:12px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:99; }
</style>
</head>
<body>
<h1>🔮 룬 합성</h1>
<div id="sub">같은 룬을 밀어 합쳐 고대의 문양을 완성하라</div>
<div id="stats"><span id="scoreTxt"></span><span id="bestTxt"></span><span id="tileTxt"></span></div>
<canvas id="board" width="400" height="400"></canvas>
<div id="btns">
  <button id="newBtn">새 게임</button>
  <button id="undoBtn" class="ghost">↩ 무르기 (1회)</button>
</div>
<div id="saveRow">
  <input id="codeInput" placeholder="이어하기 코드" maxlength="18" autocomplete="off">
  <button id="codeLoadBtn" class="ghost">🔑 코드로 불러오기</button>
</div>
<div id="codeShow"></div>
<div id="saveStatus"></div>
<div id="menu"></div>
<div id="info">방향키/WASD 또는 스와이프 · 같은 룬이 만나면 한 단계 위로 · 4096룬 완성이 목표</div>
<div id="toast"></div>
<script>
'use strict';
const API = '/api/v1/games/rune-merge';
const $ = id => document.getElementById(id);
const cv = $('board'), cx = cv.getContext('2d');
const N = 4, CELL = 92, GAP = 12;

/* ── 플랫폼 연동 (이어하기 코드 세이브) ── */
const token = () => localStorage.getItem('portal_access_token');
function deviceId() {
  let id = localStorage.getItem('kgd_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('kgd_device_id', id); }
  return id;
}
async function api(path, opt = {}) {
  const headers = { 'Content-Type':'application/json', 'X-Device-Id':deviceId(), ...(opt.headers || {}) };
  const tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
  const res = await fetch(API + path, { ...opt, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.success === false) throw new Error(body?.error?.code || res.status);
  return body.data;
}
const CODE_KEY = 'rune_merge_code', LOCAL_KEY = 'rune_merge_save';
let saveCode = localStorage.getItem(CODE_KEY) || null, saveVersion = 0;
const fmtCode = c => c ? c.replace(/(.{4})(?=.)/g, '$1-') : '';
function showCode() { $('codeShow').textContent = saveCode ? '🔑 ' + fmtCode(saveCode) : ''; }
function toast(msg) { const el = $('toast'); el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.opacity = 0; }, 2200); }
async function loadMeta(codeOverride) {
  const code = codeOverride || saveCode;
  if (token() || code) {
    try {
      const s = await api('/save' + (!token() && code ? '?code=' + encodeURIComponent(code) : ''));
      saveVersion = s.version;
      if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
      $('saveStatus').textContent = '☁ 서버 세이브 (v' + saveVersion + ')';
      showCode(); return s.data;
    } catch (e) { $('saveStatus').textContent = '세이브 로드 실패: ' + e.message; if (codeOverride) return null; }
  }
  $('saveStatus').textContent = '브라우저 저장 — 저장하면 이어하기 코드가 발급된다';
  showCode();
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY)); } catch (_) { return null; }
}
async function persistMeta() {
  const data = { v:1, best:best, grid:G, score:score, undoLeft:undoLeft };
  localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
  try {
    const s = await api('/save', { method:'PUT', body:JSON.stringify({ data, version:saveVersion, code:saveCode }) });
    saveVersion = s.version;
    const fresh = !saveCode && s.code;
    if (s.code) { saveCode = s.code; localStorage.setItem(CODE_KEY, s.code); }
    if (fresh) toast('🔑 이어하기 코드 발급: ' + fmtCode(saveCode));
    showCode();
  } catch (e) {
    if (e.message === 'INVALID_INPUT') {
      try {
        const re = await api('/save' + (!token() && saveCode ? '?code=' + encodeURIComponent(saveCode) : ''));
        saveVersion = re.version;
        const s2 = await api('/save', { method:'PUT', body:JSON.stringify({ data, version:saveVersion, code:saveCode }) });
        saveVersion = s2.version;
      } catch (_) {}
    }
  }
}

/* ── 룬 정의 — 단계별 문양/색 ── */
const RUNES = [
  null,
  { g:'ᚠ', bg:'#3a3450', fg:'#c8c2d8' },   // 2
  { g:'ᚢ', bg:'#3f4a68', fg:'#bcd0e8' },   // 4
  { g:'ᚦ', bg:'#2c5e4a', fg:'#a8e8c8' },   // 8
  { g:'ᚨ', bg:'#5e5a2c', fg:'#e8e0a0' },   // 16
  { g:'ᚱ', bg:'#6b4a24', fg:'#f0c890' },   // 32
  { g:'ᚲ', bg:'#743030', fg:'#f0a8a8' },   // 64
  { g:'ᚷ', bg:'#5e2c68', fg:'#e0b0f0' },   // 128
  { g:'ᚹ', bg:'#2c4a74', fg:'#a0c8ff' },   // 256
  { g:'ᚺ', bg:'#136c66', fg:'#8af0e0' },   // 512
  { g:'ᚾ', bg:'#8a5a10', fg:'#ffd98a' },   // 1024
  { g:'ᛁ', bg:'#a03a68', fg:'#ffc0dc' },   // 2048
  { g:'ᛃ', bg:'#c9a441', fg:'#fff6d8' },   // 4096 — 완성
];
const val = lv => Math.pow(2, lv);

/* ── 상태 ── */
let G = null, score = 0, best = 0, over = false, undoLeft = 1, prev = null;
let anim = [];                                        // {fx,fy,tx,ty,lv,t} 이동 트윈
const emptyGrid = () => Array.from({ length: N }, () => Array(N).fill(0));
function spawn() {
  const empt = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!G[y][x]) empt.push([x, y]);
  if (!empt.length) return;
  const [x, y] = empt[Math.floor(Math.random() * empt.length)];
  G[y][x] = Math.random() < 0.9 ? 1 : 2;
  anim.push({ pop:true, x, y, t:0 });
}
function newGame() {
  G = emptyGrid(); score = 0; over = false; undoLeft = 1; prev = null;
  spawn(); spawn();
  hud(); persistMeta();
}
/** 한 줄을 왼쪽으로 밀어 합치기 — 이동 정보 반환 */
function slideRow(row) {
  const src = row.map((v, i) => ({ v, i })).filter(c => c.v);
  const out = Array(N).fill(0);
  const moves = [];
  let oi = 0, gained = 0;
  for (let k = 0; k < src.length; k++) {
    if (k + 1 < src.length && src[k].v === src[k + 1].v) {
      out[oi] = src[k].v + 1;
      gained += val(src[k].v + 1);
      moves.push({ from: src[k].i, to: oi, lv: src[k].v }, { from: src[k + 1].i, to: oi, lv: src[k + 1].v, merge: true });
      k++;
    } else {
      out[oi] = src[k].v;
      if (src[k].i !== oi) moves.push({ from: src[k].i, to: oi, lv: src[k].v });
    }
    oi++;
  }
  return { out, moves, gained };
}
function move(dir) {                                   // 0← 1→ 2↑ 3↓
  if (over) return;
  const before = JSON.stringify(G);
  const snapshot = { g: G.map(r => [...r]), score };
  let gainedTotal = 0;
  const applyRow = (cells, write) => {
    const { out, moves, gained } = slideRow(cells);
    gainedTotal += gained;
    write(out, moves);
  };
  anim = [];
  if (dir === 0 || dir === 1) {
    for (let y = 0; y < N; y++) {
      const row = dir === 0 ? [...G[y]] : [...G[y]].reverse();
      applyRow(row, (out, moves) => {
        G[y] = dir === 0 ? out : [...out].reverse();
        moves.forEach(m => anim.push({ fx: dir === 0 ? m.from : N - 1 - m.from, fy: y,
          tx: dir === 0 ? m.to : N - 1 - m.to, ty: y, lv: m.lv, merge: m.merge, t: 0 }));
      });
    }
  } else {
    for (let x = 0; x < N; x++) {
      const col = [];
      for (let y = 0; y < N; y++) col.push(G[dir === 2 ? y : N - 1 - y][x]);
      applyRow(col, (out, moves) => {
        for (let y = 0; y < N; y++) G[dir === 2 ? y : N - 1 - y][x] = out[y];
        moves.forEach(m => anim.push({ fx: x, fy: dir === 2 ? m.from : N - 1 - m.from,
          tx: x, ty: dir === 2 ? m.to : N - 1 - m.to, lv: m.lv, merge: m.merge, t: 0 }));
      });
    }
  }
  if (JSON.stringify(G) === before) { anim = []; return; }
  prev = snapshot; score += gainedTotal;
  if (gainedTotal >= 128) toast('✨ +' + gainedTotal);
  spawn();
  if (score > best) best = score;
  hud();
  if (isOver()) endGame();
  else persistSoon();
}
function isOver() {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!G[y][x]) return false;
    if (x + 1 < N && G[y][x] === G[y][x + 1]) return false;
    if (y + 1 < N && G[y][x] === G[y + 1][x]) return false;
  }
  return true;
}
function maxTile() { return Math.max(...G.flat()); }
function endGame() {
  over = true;
  toast('💫 더 밀 곳이 없다 — 점수 ' + score.toLocaleString());
  GameRank.submit('rune-merge', score, '최고 룬 ' + val(maxTile()))
    .then(r => { if (r && r.applied) toast('🏆 랭킹 ' + r.rank + '위!'); });
  persistMeta();
}
$('undoBtn').onclick = () => {
  if (!prev || undoLeft <= 0 || over) return;
  G = prev.g; score = prev.score; prev = null; undoLeft--;
  hud(); persistSoon();
};
let persistTimer = null;
function persistSoon() { clearTimeout(persistTimer); persistTimer = setTimeout(persistMeta, 1500); }

/* ── 렌더 ── */
function draw(ts) {
  requestAnimationFrame(draw);
  cx.fillStyle = '#1a1426'; cx.fillRect(0, 0, 400, 400);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const px2 = GAP + x * (CELL + GAP) - 4, py2 = GAP + y * (CELL + GAP) - 4;
    cx.fillStyle = '#241c34'; roundRect(px2, py2, CELL, CELL, 10); cx.fill();
  }
  const moving = new Set(anim.filter(a => !a.pop && a.t < 1).map(a => a.tx + ',' + a.ty));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!G[y][x] || moving.has(x + ',' + y)) continue;
    drawTile(x, y, G[y][x], 1);
  }
  anim = anim.filter(a => (a.t += 0.12) < 1.25);
  anim.forEach(a => {
    if (a.pop) { if (a.t < 1) drawTile(a.x, a.y, G[a.y][a.x], 0.4 + a.t * 0.6); return; }
    const t = Math.min(1, a.t);
    const ix = a.fx + (a.tx - a.fx) * t, iy = a.fy + (a.ty - a.fy) * t;
    drawTile(ix, iy, t >= 1 && a.merge ? G[a.ty][a.tx] : a.lv, 1);
  });
}
function drawTile(x, y, lv, scale) {
  const r = RUNES[Math.min(lv, RUNES.length - 1)];
  const px2 = GAP + x * (CELL + GAP) - 4 + CELL / 2, py2 = GAP + y * (CELL + GAP) - 4 + CELL / 2;
  const s = CELL * scale;
  cx.fillStyle = r.bg; roundRect(px2 - s/2, py2 - s/2, s, s, 10); cx.fill();
  if (lv >= 10) { cx.strokeStyle = 'rgba(255,213,74,.7)'; cx.lineWidth = 2.5; roundRect(px2 - s/2 + 2, py2 - s/2 + 2, s - 4, s - 4, 8); cx.stroke(); }
  cx.fillStyle = r.fg; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.font = 'bold ' + Math.round(34 * scale) + 'px serif';
  cx.fillText(r.g, px2, py2 - 8 * scale);
  cx.font = 'bold ' + Math.round(15 * scale) + 'px monospace';
  cx.fillText(val(lv).toString(), px2, py2 + 28 * scale);
}
function roundRect(x, y, w, h, r) {
  cx.beginPath(); cx.moveTo(x + r, y);
  cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath();
}
function hud() {
  $('scoreTxt').textContent = '점수 ' + score.toLocaleString();
  $('bestTxt').textContent = '최고 ' + best.toLocaleString();
  $('tileTxt').textContent = '룬 ' + (maxTile() ? val(maxTile()) : 0);
  $('undoBtn').textContent = '↩ 무르기 (' + undoLeft + '회)';
}

/* ── 입력: 키 + 스와이프 ── */
addEventListener('keydown', ev => {
  const c = ev.code || '';
  const k = c.startsWith('Key') ? c.slice(3).toLowerCase() : ev.key;
  const map = { ArrowLeft:0, a:0, ArrowRight:1, d:1, ArrowUp:2, w:2, ArrowDown:3, s:3 };
  if (map[k] !== undefined) { ev.preventDefault(); move(map[k]); }
});
let swipe = null;
cv.addEventListener('pointerdown', ev => { swipe = { x: ev.clientX, y: ev.clientY }; });
cv.addEventListener('pointerup', ev => {
  if (!swipe) return;
  const dx = ev.clientX - swipe.x, dy = ev.clientY - swipe.y; swipe = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 0) : (dy > 0 ? 3 : 2));
});
$('newBtn').onclick = () => { if (!over && score > 0) endGame(); newGame(); };
$('codeLoadBtn').onclick = async () => {
  const raw = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length < 8) return;
  const d = await loadMeta(raw);
  if (d) { saveCode = raw; localStorage.setItem(CODE_KEY, raw); restore(d); }
};
function restore(d) {
  if (d && d.grid) { G = d.grid; score = d.score || 0; best = d.best || 0; undoLeft = d.undoLeft ?? 1; over = isOver(); hud(); }
  else newGame();
}
loadMeta().then(d => { if (d && d.v === 1) restore(d); else newGame(); });
requestAnimationFrame(draw);
</script>
<script src="../lib/rank.js"></script>
<script>
GameRank.copyButton(function(){ return typeof saveCode !== 'undefined' ? saveCode : null; });
(function(){ var el = document.createElement('div'); el.style.cssText='text-align:left;background:rgba(0,0,0,.25);border-radius:8px;padding:9px 12px';
  document.getElementById('menu').appendChild(el); GameRank.panel('rune-merge', el); })();
</script>
</body>
</html>
