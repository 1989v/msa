spring:
  application:
    name: place-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://localhost:3306/place_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:place_user}
    password: ${MYSQL_PASSWORD:place_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  # Flyway+validate — 스키마 변경은 Flyway 단독 책임 (jpa-persistence.md)
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 운영 스키마는 Hibernate ddl-auto=update 가 만든 것이라 Flyway 이력이 없다
    # (Boot 4 에서 자동설정 모듈이 분리된 걸 놓쳐 마이그레이션이 실행된 적이 없었다 —
    #  docs/conventions/jpa-persistence.md). 실제 스키마가 **전 마이그레이션 적용 상태와
    # 동일함을 대조 확인**했으므로 최신 버전을 기준선으로 잡고 이후 버전부터 적용한다.
    # baseline-version 은 이력 테이블이 없을 때 한 번만 쓰인다 — 이후엔 무시되므로 갱신 불필요.
    baseline-version: 2

opensearch:
  uris: ${OPENSEARCH_URIS:http://localhost:9200}

place:
  seed:
    enabled: ${PLACE_SEED_ENABLED:false}
    regions-path: ${PLACE_SEED_REGIONS_PATH:/seed/regions.jsonl}
    pois-path: ${PLACE_SEED_POIS_PATH:/seed/pois.jsonl}
  poi:
    index: ${PLACE_POI_INDEX:poi}

server:
  port: 8096
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
