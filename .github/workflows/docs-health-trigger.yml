name: Docs Health

# doctor.py 진단만 수행하는 minimal CI.
# Claude 자동 수정 (stale-doc/quality-gc/doctor-check auto-fix PR) 은 미사용
# — 그건 .github/workflows/docs-health.yml (재사용 워크플로) 에 그대로 보존돼 있고,
# ANTHROPIC_API_KEY_FOR_WORKFLOWS 시크릿 등록 시 트리거 측 uses 만 바꿔 재활성 가능.
#
# 저장소 정책 진입점 scripts/docs-health.py: FAIL 은 차단, WARN 은 통과.
# source citation 은 docs/standards/doc-index-tracking.md 에 따라 선택 사항(WARN).
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs-health-trigger.yml'
      - 'scripts/docs-health.py'
      - 'scripts/tests/test_docs_health.py'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs-health-trigger.yml'
      - 'scripts/docs-health.py'
      - 'scripts/tests/test_docs_health.py'
  workflow_dispatch:

concurrency:
  group: docs-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: Doctor (5-layer health diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init ai submodule (public, doctor.py 위치)
        run: git submodule update --init --depth 1 -- ai

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Docs Health policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_health.py' -v

      - name: Run doctor with repository policy
        # 예상하지 못한 실행 오류도 그대로 실패시킨다.
        run: python3 scripts/docs-health.py
