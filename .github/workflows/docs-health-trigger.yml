name: Docs Health

# doctor.py 진단만 수행하는 minimal CI.
# Claude 자동 수정 (stale-doc/quality-gc/doctor-check auto-fix PR) 은 미사용
# — 그건 .github/workflows/docs-health.yml (재사용 워크플로) 에 그대로 보존돼 있고,
# ANTHROPIC_API_KEY_FOR_WORKFLOWS 시크릿 등록 시 트리거 측 uses 만 바꿔 재활성 가능.
#
# Doctor.py 가 FAIL 이면 CI 빨강. WARN 만 있으면 통과 (--strict 미사용).
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs-health-trigger.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs-health-trigger.yml'
  workflow_dispatch:

concurrency:
  group: docs-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: Doctor (4-layer health diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init ai submodule (public, doctor.py 위치)
        run: git submodule update --init --depth 1 -- ai

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run doctor
        # doctor.py 종료 코드 규약: 0=PASS · 2=WARN · 1=FAIL.
        # 그냥 실행하면 WARN(2)도 실패로 잡혀 **늘 빨간 CI** 가 된다 —
        # 미인용 문서 30건이 WARN 이라 사실상 항상 빨갛고, 그러면 아무도 CI 를 안 본다.
        # 이 파일 상단 주석이 정한 대로 FAIL 만 빨갛게 한다.
        run: |
          set +e
          python3 ai/plugins/hns/scripts/doctor.py
          code=$?
          set -e
          echo "doctor exit=$code (0=PASS 2=WARN 1=FAIL)"
          [ "$code" -eq 1 ] && exit 1
          exit 0
