name: Uptime

# 운영 API 를 밖에서 찔러 본문까지 본다. 상태 코드만 보면 안 되는 이유: 업스트림이 죽었을 때
# 게이트웨이가 200 + 빈 본문을 낸 적이 있고(2026-10-19~20, content 18시간 장애), 화면 HTML 은
# 프리렌더 정적 파일이라 늘 뜬다. 그래서 응답이 `"success":true` 를 담고 있는지로 판정한다.
#
# 실패하면 잡이 빨간불이 되고, GitHub 가 스케줄을 마지막으로 고친 사람에게 메일을 보낸다.
# 파드마다 대표 경로 하나 이상을 둔다 — 한 파드가 폴드 도메인 여럿을 들고 있어 하나만 봐도 파드가 살았는지 안다.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe public APIs
        shell: bash
        run: |
          set -u
          API=https://api.1989v.com
          # 파드 | 경로
          targets=(
            "atlas|$API/api/v1/concepts?size=1"
            "atlas|$API/api/v1/display/services"
            "content(game)|$API/api/v1/games/tags"
            "content(blog)|$API/api/v1/blog/posts?size=1"
            "content(ranking)|$API/api/v1/ranking/boards"
            "content(place)|$API/api/places/regions"
            "commerce(deal)|$API/api/v1/deal/sections"
            "commerce(product)|$API/api/v1/products?size=1"
            "search|$API/api/search/attractions?q=%EA%B2%BD%EB%B3%B5%EA%B6%81&size=1"
          )
          probe() {
            local url=$1 body code
            body=$(curl -s -m 20 -A "Mozilla/5.0 (uptime-probe)" -w $'\n%{http_code}' "$url") || return 1
            code=${body##*$'\n'}
            body=${body%$'\n'*}
            [[ "$code" == "200" && "$body" == *'"success":true'* ]] || { echo "  code=$code bytes=${#body}"; return 1; }
          }
          failed=0
          for t in "${targets[@]}"; do
            name=${t%%|*}; url=${t#*|}
            # 롤링 배포 중 한 번 튀는 것은 장애가 아니다 — 30초 뒤 한 번 더 본다
            if probe "$url" || { sleep 30; probe "$url"; }; then
              echo "ok   $name $url"
            else
              echo "::error::$name 응답 이상 — $url"
              failed=1
            fi
          done
          exit $failed
