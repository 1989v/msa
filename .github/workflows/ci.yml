name: ci

# PR/main 머지 전 사전 검증.
#
# 다섯 job (병렬):
#   - compile-gate       : 구조 게이트(verifyArchitecture) + Kotlin/Java 컴파일 검증 (test 는 미포함)
#   - test-gate          : 변경된 JVM 서비스만 ./gradlew test (PR 전용)
#   - frontend-gate      : portal-fe tsc --noEmit + vitest run
#   - yaml-validate      : application*.yml syntax + duplicate key 검증
#   - kustomize-validate : k8s overlay 렌더 검증
#
# yaml-validate 가 catch 한 케이스: Spring Boot startup 시점에야 발견되던
# duplicate top-level key (예: spring: 블록 두 번). compile-gate 는 yml 을
# 안 읽어서 못 잡음.
#
# test-gate 는 "PR 단계엔 빠른 게이트만" 원칙을 유지하기 위해 전체가 아닌
# 변경된 서비스의 테스트만 실행한다 (images.yml 의 변경 감지와 동일 매핑).
# common/buildSrc 등 공유 의존성 변경 시에만 전체 JVM 테스트.
# 전체 test/jib 는 images.yml 이 main push 시 수행.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-gate:
    name: 구조 게이트 + Kotlin/Java compile + 테스트 컴파일 (실행은 test-gate)
    runs-on: ubuntu-24.04-arm   # public repo + arm64 무료
    timeout-minutes: 20
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            msa
            msa-auth
            msa-gifticon

      - name: Checkout (root only)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: false
          fetch-depth: 1

      - name: Init build-required submodules (auth, gifticon)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --recursive -- auth gifticon

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 구조 게이트는 `check` 에 붙어 있는데 CI 는 `test` 만 돈다 → 여기서 직접 부른다.
      # 텍스트 스캔이라 컴파일 없이 수 초에 끝나고, 컴파일보다 먼저 실패해야 신호가 빠르다.
      # 묶음 태스크라 게이트가 늘어도 이 줄은 그대로다.
      - name: ./gradlew verifyArchitecture
        run: ./gradlew verifyArchitecture --no-daemon

      - name: ./gradlew compileKotlin compileJava
        run: ./gradlew compileKotlin compileJava --no-daemon

      # 테스트 **소스도** 컴파일한다. 실행이 아니라 컴파일이라 몇 초면 끝나는데,
      # 이게 없으면 시그니처를 바꾸고 호출부를 안 고친 커밋이 main 에 그대로 들어간다.
      #
      # 2026-08-29 실제 사고: 포트에 파라미터를 중간에 끼워 넣어 기존 위치 인자가 밀렸고
      # (score 가 memberId 자리에 들어가도 타입이 맞아 컴파일된다) 테스트 4파일 56개 오류가
      # 난 채로 push 됐다. compile-gate 는 본 코드만 봤고 test-gate 는 PR 전용이라
      # main 직푸시에서는 **아무 게이트도 걸리지 않았다.**
      - name: ./gradlew compileTestKotlin
        run: ./gradlew compileTestKotlin --no-daemon

  test-gate:
    name: Changed-services test (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            msa
            msa-auth
            msa-gifticon

      - name: Checkout (with merge-base history)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: false
          fetch-depth: 0

      - name: Init build-required submodules (auth, gifticon)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --recursive -- auth gifticon

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew test (변경된 JVM 서비스만)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # 서비스 → 테스트 태스크 매핑은 images.yml 의 매핑과 동일하게 유지할 것
          ALL_JVM="gateway product search search-batch search-consumer auth gifticon analytics experiment code-dictionary commerce chatbot place quant recommendation"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "── 변경 파일 ($(echo "$CHANGED_FILES" | wc -l) 개):"
          echo "$CHANGED_FILES" | sed 's/^/   /'

          if echo "$CHANGED_FILES" | grep -qE '^(common/|buildSrc/|gradle/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$)'; then
            echo "→ 공유 의존성 변경 감지 — 전체 JVM 테스트"
            SVCS="$ALL_JVM"
          else
            SVCS=""
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                gateway/*)                                 SVCS+=" gateway" ;;
                product/*)                                 SVCS+=" product" ;;
                search/app/*|search/domain/*)              SVCS+=" search" ;;
                search/batch/*)                            SVCS+=" search-batch" ;;
                search/consumer/*)                         SVCS+=" search-consumer" ;;
                auth|auth/*)                               SVCS+=" auth" ;;
                gifticon|gifticon/app/*|gifticon/domain/*) SVCS+=" gifticon" ;;
                inventory/*|warehouse/*|fulfillment/*|order/*|member/*|wishlist/*|commerce/*)           SVCS+=" commerce" ;;
                analytics/*)                               SVCS+=" analytics" ;;
                experiment/*)                              SVCS+=" experiment" ;;
                # code-dictionary:app 에 폴드된 모듈 — 여기 빠지면 그 도메인은 PR 에서 테스트가 한 건도 안 돈다
                #   game (ADR-0059) · deal (ADR-0069) · blog (ADR-0072) · ranking (ADR-0081)
                ranking/ingest/*)                          ;;   # 파이썬 배치 — JVM 테스트 대상 아님
                code-dictionary/*|game/*|deal/*|blog/*|ranking/*) SVCS+=" code-dictionary" ;;
                chatbot/*)                                 SVCS+=" chatbot" ;;
                place/ingest/*)                            ;;   # 파이썬 배치
                place/*)                                   SVCS+=" place" ;;
                quant/app/*|quant/domain/*)                SVCS+=" quant" ;;
                recommendation/app/*|recommendation/domain/*) SVCS+=" recommendation" ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          SVCS=$(echo "$SVCS" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          if [[ -z "${SVCS// /}" ]]; then
            echo "→ JVM 서비스 변경 없음 — 테스트 스킵"
            exit 0
          fi

          TASKS=""
          for svc in $SVCS; do
            case "$svc" in
              gateway)            TASKS+=" :gateway:test" ;;
              search)             TASKS+=" :search:app:test :search:domain:test" ;;
              search-batch)       TASKS+=" :search:batch:test" ;;
              search-consumer)    TASKS+=" :search:consumer:test" ;;
              # ADR-0058: commerce 는 aggregator(:commerce:app)만 있고 :commerce:domain 없음 →
              # 폴드된 4 도메인/feature 테스트를 직접 지정 (default 의 :commerce:domain:test 는 미존재 → CI 실패).
              commerce)           TASKS+=" :commerce:app:test :inventory:domain:test :inventory:feature:test :warehouse:domain:test :warehouse:feature:test :fulfillment:domain:test :fulfillment:feature:test :order:domain:test :order:feature:test :member:domain:test :member:feature:test :wishlist:domain:test :wishlist:feature:test" ;;
              *)                  TASKS+=" :${svc}:app:test :${svc}:domain:test" ;;
            esac
          done

          echo "── Gradle test tasks: $TASKS"
          # shellcheck disable=SC2086
          ./gradlew $TASKS --no-daemon --continue

  frontend-gate:
    name: portal-fe 타입체크 + 테스트
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portal-fe/package-lock.json

      # 게임 서브모듈은 받지 않는다 — 타입체크·테스트는 src 만 쓰고, games 는 330MB 다
      - name: Install
        working-directory: portal-fe
        run: npm ci --no-audit --no-fund

      # 여기가 진짜 게이트다. Dockerfile 검사만 켜면 이미지 빌드는 머지 뒤에 돌아서
      # PR 단계에서 안 잡히고, "빌드가 급하다" 는 이유로 다시 꺼진다.
      - name: Type check
        working-directory: portal-fe
        run: npx tsc --noEmit

      # 2026-08-28: import 하나가 빠진 채 배포까지 갔다. 그 케이스를 덮는 테스트가
      # 이미 있었는데 CI 에서 아무도 돌리지 않아 못 잡았다.
      - name: Test
        working-directory: portal-fe
        run: npx vitest run

  yaml-validate:
    name: application*.yml syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            msa
            msa-auth
            msa-gifticon

      - name: Checkout (root + auth/gifticon submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: false
          fetch-depth: 1

      - name: Init build-required submodules (auth, gifticon)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --recursive -- auth gifticon

      - name: Validate every application*.yml
        run: |
          set -e
          fail=0
          # Psych 의 YAML.load 는 duplicate key 를 조용히 덮어쓸 수 있으므로
          # AST 를 직접 순회해 동일 mapping 안의 중복 key 를 명시적으로 차단한다.
          while IFS= read -r f; do
            if ! ruby - "$f" 2>err.tmp <<'RUBY'
          require "psych"

          path = ARGV.fetch(0)
          tree = Psych.parse_stream(File.read(path), filename: path)
          errors = []

          def key_name(node)
            case node
            when Psych::Nodes::Scalar
              node.value
            else
              node.to_yaml
            end
          end

          def walk_yaml(node, path, errors)
            case node
            when Psych::Nodes::Mapping
              seen = {}
              node.children.each_slice(2) do |key_node, value_node|
                key = key_name(key_node)
                line = key_node.start_line + 1
                full_path = (path + [key]).join(".")

                if seen.key?(key)
                  errors << "duplicate key '#{full_path}' at line #{line} (first seen at line #{seen[key]})"
                else
                  seen[key] = line
                end

                walk_yaml(value_node, path + [key], errors)
              end
            when Psych::Nodes::Sequence
              node.children.each_with_index do |child, index|
                walk_yaml(child, path + ["[#{index}]"], errors)
              end
            end
          end

          tree.children.each do |document|
            walk_yaml(document.root, [], errors) if document.root
          end

          abort(errors.join("\n")) unless errors.empty?
          RUBY
            then
              echo "::error file=$f::$(cat err.tmp | head -1)"
              fail=1
            fi
            rm -f err.tmp
          done < <(find . \
                     -path ./.git -prune -o \
                     -path '*/build' -prune -o \
                     -path '*/node_modules' -prune -o \
                     -name "application*.yml" -print)
          exit $fail

  kustomize-validate:
    name: Kustomize render check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render every kustomization
        run: |
          set -euo pipefail
          fail=0
          for dir in \
              k8s/base \
              k8s/infra/local \
              k8s/infra/local/mysql \
              k8s/infra/local/redis \
              k8s/infra/local/kafka \
              k8s/infra/local/opensearch \
              k8s/infra/local/clickhouse \
              k8s/infra/prod/backup \
              k8s/infra/prod/monitoring/dashboards \
              k8s/overlays/k3s-lite \
              k8s/overlays/oci-arm \
              k8s/overlays/prod-k8s; do
            echo "::group::kustomize $dir"
            if ! kubectl kustomize "$dir" > /tmp/render.yaml; then
              echo "::error::kustomize render failed for $dir"
              fail=1
            else
              wc -l /tmp/render.yaml
            fi
            echo "::endgroup::"
          done
          exit $fail
