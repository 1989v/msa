# JVM · 런타임 온톨로지 — 원본은 이 파일이다 (ADR-0100, docs/specs/2026-09-24-concept-atlas).
# 바꾸면 manifest.yaml 의 revision 을 올린다. 간선은 from 개념에만 적는다.
domain: runtime
root: rt-jvm-runtime
concepts:
  - id: rt-jvm-runtime
    kind: DOMAIN
    name: "JVM · 런타임"
    category: BASICS
    level: INTERMEDIATE
    description: "자바·코틀린 코드가 실제로 도는 자리. 메모리를 어떻게 나눠 쓰고, 쓰레기를 어떻게 치우고, 바이트코드를 어떻게 기계어로 바꾸고, 컨테이너와 운영체제 위에서 어떻게 진단하는지를 다룬다"
    synonyms: ["JVM", "Java Virtual Machine", "HotSpot"]
    contains: [rt-memory-areas, rt-object-model, rt-allocation, rt-garbage-collection, rt-collector-selection, rt-gc-tuning, rt-execution, rt-startup-optimization, rt-class-loading, rt-container-runtime, rt-os-memory, rt-memory-hierarchy, rt-diagnostics, rt-out-of-memory, runtime-glossary]

  # ── 메모리 영역 ──
  - id: rt-memory-areas
    kind: STAGE
    name: "메모리 영역 이해"
    category: BASICS
    level: BEGINNER
    description: "JVM 이 쓰는 메모리를 영역별로 나눠 본다 — GC 가 관리하는 힙, 클래스 메타데이터, 스레드 스택, JIT 코드, 힙 밖 다이렉트·네이티브 메모리. 컨테이너 한도는 이 전부의 합을 센다"
    questions: ["JVM 메모리 영역 다섯 가지와 각각을 정하는 옵션을 말해 보라", "-Xmx 를 컨테이너 한도와 같게 잡으면 왜 죽나"]
    contains: [rt-java-heap, rt-metaspace, rt-permgen, rt-jvm-stack, rt-code-cache, rt-direct-memory, rt-native-memory, rt-heap-occupancy]
    flows_to: [rt-object-model]
    measured_by: [rt-heap-occupancy, obs-rss]
  - id: rt-java-heap
    kind: MECHANISM
    name: "힙"
    category: BASICS
    level: BEGINNER
    description: "객체와 배열이 할당되고 GC 가 회수하는 공유 영역. 대부분의 컬렉터가 젊은 세대와 늙은 세대로 나눈다. -Xms·-Xmx 나 MaxRAMPercentage 로 크기를 정한다"
    synonyms: ["Java heap", "-Xmx", "-Xms"]
    contains: [rt-young-generation, rt-old-generation]
    uses: [rt-weak-generational-hypothesis]
    affects: [rt-heap-occupancy]
  - id: rt-young-generation
    kind: MECHANISM
    name: "Young 세대"
    category: BASICS
    level: BEGINNER
    description: "새 객체가 태어나는 Eden 과 살아남은 객체를 번갈아 옮겨 담는 Survivor 두 칸으로 이뤄진다. 대부분 여기서 죽으므로 복사 수집으로 자주·짧게 치운다"
    synonyms: ["young generation", "Eden", "Survivor", "S0/S1", "new generation"]
    uses: [rt-copying-collection]
  - id: rt-old-generation
    kind: MECHANISM
    name: "Old 세대"
    category: BASICS
    level: BEGINNER
    description: "여러 번의 Young GC 를 살아남아 승격된 객체가 사는 영역. 크고 드물게 수집되며, 여기가 차면 Mixed·Full GC 가 돈다"
    synonyms: ["old generation", "tenured generation"]
  - id: rt-metaspace
    kind: MECHANISM
    name: "Metaspace"
    category: BASICS
    level: INTERMEDIATE
    description: "클래스 구조·메서드 바이트코드·상수 풀 같은 클래스 메타데이터를 네이티브 메모리에 두는 영역(JDK 8+). 기본 상한이 없어 동적 클래스 생성이 새면 계속 자란다. MaxMetaspaceSize 로 막는다"
    synonyms: ["Metaspace", "MaxMetaspaceSize", "Compressed Class Space"]
    code:
      - { path: gradle.properties, symbol: "-XX:MaxMetaspaceSize=", note: "Gradle 데몬의 Metaspace 상한을 1 GB 로 건다" }
    alternative_to:
      - { to: rt-permgen, reason: "고정 크기 힙 영역 대신 네이티브에서 필요한 만큼 늘어 'PermGen space' OOM 이 사라졌다" }
  - id: rt-permgen
    kind: MECHANISM
    name: "PermGen"
    category: BASICS
    level: INTERMEDIATE
    description: "JDK 7 까지 클래스 메타데이터와 인턴 문자열을 두던 힙 안의 고정 크기 영역. 재배포를 반복하면 'OutOfMemoryError: PermGen space'가 났고 JDK 8 에서 Metaspace 로 바뀌었다"
    synonyms: ["Permanent Generation", "MaxPermSize"]
  - id: rt-jvm-stack
    kind: MECHANISM
    name: "스레드 스택"
    category: BASICS
    level: BEGINNER
    description: "스레드마다 따로 갖는 호출 스택. 메서드를 부를 때마다 지역 변수·피연산자 스택을 담은 프레임이 쌓인다. 크기는 -Xss(보통 1 MB)이고, 스레드 수 × Xss 가 힙 밖 메모리가 된다"
    synonyms: ["JVM stack", "thread stack", "-Xss"]
    uses: [rt-stack-frame]
    causes: [cs-stack-overflow, rt-oom-native-thread]
  - id: rt-code-cache
    kind: MECHANISM
    name: "Code Cache"
    category: BASICS
    level: INTERMEDIATE
    description: "JIT 가 만든 기계어를 두는 네이티브 영역. JDK 9+ 는 비메서드·프로파일드·논프로파일드 세 구획으로 나눈다(segmented code cache). 기본 예약은 240 MB 다"
    synonyms: ["code cache", "ReservedCodeCacheSize", "segmented code cache"]
    causes: [rt-code-cache-full]
  - id: rt-direct-memory
    kind: MECHANISM
    name: "다이렉트 메모리"
    category: BASICS
    level: INTERMEDIATE
    description: "ByteBuffer.allocateDirect 로 힙 밖에 잡는 버퍼. 소켓·파일 IO 때 힙 복사를 한 번 줄인다. 힙의 작은 객체가 GC 될 때만 간접으로 풀리므로 쉽게 쌓이고, MaxDirectMemorySize 가 상한이다"
    synonyms: ["direct buffer", "off-heap", "MaxDirectMemorySize", "DirectByteBuffer"]
    causes: [rt-oom-direct-buffer]
  - id: rt-native-memory
    kind: MECHANISM
    name: "네이티브 메모리"
    category: BASICS
    level: ADVANCED
    description: "힙 밖에서 JVM 이 쓰는 나머지 전부 — 스레드 스택·Metaspace·Code Cache·GC 자료구조(remembered set·마킹 비트맵)·심볼 테이블·JNI·다이렉트 버퍼. 작은 힙이라도 수백 MB~1 GB 가 따로 든다"
    synonyms: ["native memory", "off-heap", "non-heap"]
    questions: ["힙이 512 MB 인 JVM 의 RSS 가 1.5 GB 인 이유를 설명해 보라"]
    contains: [rt-malloc-arena]
    uses: [obs-anon-memory]
    causes: [infra-oom-killed]
  - id: rt-malloc-arena
    kind: MECHANISM
    name: "malloc 아레나"
    category: BASICS
    level: ADVANCED
    description: "glibc malloc 은 경합을 피하려 스레드마다 64 MB 단위 아레나를 최대 코어 수 × 8 개까지 만든다. 스레드가 많은 JVM 에서 RSS 가 설명 없이 불어나는 원인이고, MALLOC_ARENA_MAX 나 jemalloc 으로 줄인다"
    synonyms: ["glibc arena", "MALLOC_ARENA_MAX", "jemalloc", "musl"]
    affects: [obs-rss]
  - id: rt-heap-occupancy
    kind: METRIC
    name: "힙 점유율"
    category: BASICS
    level: BEGINNER
    description: "GC 직후 남은 힙의 비율(라이브 셋). GC 직전 값이 아니라 직후 값이 계단처럼 오르면 누수다"
    synonyms: ["heap after GC", "live set size", "jvm_memory_used_bytes"]

  # ── 객체 표현 ──
  - id: rt-object-model
    kind: STAGE
    name: "객체 표현"
    category: BASICS
    level: INTERMEDIATE
    description: "객체가 메모리에서 어떤 모양인지, 참조가 얼마나 크고 얼마나 강한지 본다. 헤더·정렬·포인터 압축이 객체 하나의 크기를, 참조 강도가 수명을 정한다"
    questions: ["new Object() 는 몇 바이트인가", "힙을 32 GB 넘게 잡으면 무엇을 잃나"]
    contains: [rt-object-header, rt-object-alignment, rt-compressed-oops, rt-compact-object-headers, rt-reference-strength, rt-finalizer, rt-cleaner, rt-string-interning, rt-string-deduplication, rt-value-class]
    flows_to: [rt-allocation]
    uses: [rt-oop, rt-shallow-retained-size]
  - id: rt-object-header
    kind: MECHANISM
    name: "객체 헤더"
    category: BASICS
    level: ADVANCED
    description: "모든 객체 앞에 붙는 12~16 바이트. 해시·GC 나이·락 상태를 담는 Mark Word 와 클래스를 가리키는 Klass 포인터로 이뤄지고, 배열이면 길이가 더 붙는다"
    synonyms: ["object header", "Mark Word", "Klass pointer"]
    uses: [rt-mark-word, rt-klass-pointer]
  - id: rt-object-alignment
    kind: MECHANISM
    name: "객체 정렬 · 패딩"
    category: BASICS
    level: ADVANCED
    description: "HotSpot 은 객체를 8 바이트 배수로 맞추고 필드를 크기순으로 재배치해 빈칸을 채운다. 그래서 필드 하나를 더해도 크기가 안 늘거나 8 바이트씩 뛴다. JOL 로 실제 배치를 본다"
    synonyms: ["object alignment", "ObjectAlignmentInBytes", "JOL", "field layout"]
    affects: [obs-rss]
  - id: rt-compressed-oops
    kind: MECHANISM
    name: "Compressed OOPs"
    category: BASICS
    level: ADVANCED
    description: "64비트 JVM 에서 객체 참조를 32비트 오프셋 × 8 로 저장해 참조 크기를 절반으로 줄인다. 힙이 약 32 GB 를 넘으면 꺼져서, 33 GB 힙이 31 GB 힙보다 실제로 담는 객체가 적을 수 있다"
    synonyms: ["compressed oops", "UseCompressedOops", "32GB 경계"]
    affects: [obs-rss]
  - id: rt-compact-object-headers
    kind: MECHANISM
    name: "Compact Object Headers"
    category: BASICS
    level: ADVANCED
    description: "Mark Word 와 클래스 포인터를 합쳐 헤더를 8 바이트로 줄이는 Lilliput 프로젝트(JEP 450, JDK 24 실험 → JDK 25 정식). 작은 객체가 많은 힙에서 사용량이 10~20% 준다"
    synonyms: ["Project Lilliput", "JEP 450", "JEP 519", "UseCompactObjectHeaders"]
    affects: [obs-rss]
  - id: rt-reference-strength
    kind: MECHANISM
    name: "참조 강도"
    category: BASICS
    level: INTERMEDIATE
    description: "GC 가 객체를 언제 치울지 참조의 종류로 조절한다. 일반 참조는 절대 안 치우고, Soft 는 메모리가 부족할 때, Weak 는 다음 GC 에, Phantom 은 치운 뒤 알림만 받는다"
    synonyms: ["reference types", "java.lang.ref"]
    contains: [rt-soft-reference, rt-weak-reference, rt-phantom-reference]
    uses: [rt-reachability-analysis]
  - id: rt-soft-reference
    kind: MECHANISM
    name: "SoftReference"
    category: BASICS
    level: INTERMEDIATE
    description: "메모리가 모자랄 때까지는 살려 두는 참조. 메모리 민감 캐시에 쓰지만 회수 시점을 예측할 수 없어 크기 제한 캐시가 대개 낫다"
    synonyms: ["SoftReference", "SoftRefLRUPolicyMSPerMB"]
  - id: rt-weak-reference
    kind: MECHANISM
    name: "WeakReference"
    category: BASICS
    level: INTERMEDIATE
    description: "다른 강한 참조가 없으면 다음 GC 에 치워지는 참조. WeakHashMap·ThreadLocalMap 의 키가 이것이라, 키가 사라지면 항목을 지울 수 있다"
    synonyms: ["WeakReference", "WeakHashMap"]
  - id: rt-phantom-reference
    kind: MECHANISM
    name: "PhantomReference"
    category: BASICS
    level: ADVANCED
    description: "get 이 항상 null 이고, 객체가 회수된 뒤 ReferenceQueue 로 알림만 오는 참조. 네이티브 자원 정리 시점을 잡는 데 쓰고 Cleaner 가 이 위에 선다"
    synonyms: ["PhantomReference", "ReferenceQueue"]
  - id: rt-finalizer
    kind: MECHANISM
    name: "finalize"
    category: BASICS
    level: INTERMEDIATE
    description: "회수 직전에 불리는 객체 메서드. 호출 시점이 보장되지 않고, 객체를 되살릴 수 있으며, 파이널라이저 스레드가 밀리면 힙이 찬다. JDK 18 에서 제거 예정으로 폐기됐다"
    synonyms: ["finalize()", "finalization", "JEP 421"]
    causes: [rt-memory-leak]
  - id: rt-cleaner
    kind: MECHANISM
    name: "Cleaner"
    category: BASICS
    level: ADVANCED
    description: "객체가 팬텀 도달 상태가 되면 등록해 둔 정리 동작을 전용 스레드에서 돌린다(JDK 9). 정리 동작이 객체 자신을 참조하지 않아 되살림이 없다. try-with-resources 가 먼저고 이것은 안전망이다"
    synonyms: ["java.lang.ref.Cleaner"]
    uses: [rt-phantom-reference]
    alternative_to:
      - { to: rt-finalizer, reason: "되살림·순서 문제 없이 팬텀 참조로 정리 시점만 받는다" }
  - id: rt-string-interning
    kind: MECHANISM
    name: "문자열 풀"
    category: BASICS
    level: INTERMEDIATE
    description: "리터럴과 intern() 한 문자열을 힙 안의 해시 테이블 하나에 모아 같은 내용은 한 객체로 공유한다. 무분별한 intern 은 테이블을 키워 오히려 느려진다"
    synonyms: ["String pool", "intern()", "StringTable"]
  - id: rt-string-deduplication
    kind: MECHANISM
    name: "문자열 중복 제거"
    category: BASICS
    level: ADVANCED
    description: "GC 가 살아남은 String 들의 내부 byte[] 가 같으면 하나를 공유하게 바꾼다. 객체 자체는 그대로라 == 결과는 안 바뀐다. G1 에서 시작해 JDK 18+ 는 모든 컬렉터가 지원한다"
    synonyms: ["UseStringDeduplication", "JEP 192"]
    affects: [obs-rss]
  - id: rt-value-class
    kind: MECHANISM
    name: "JVM 값 클래스 (Valhalla)"
    category: LANGUAGE_FEATURE
    level: ADVANCED
    description: "정체성(identity)이 없어 헤더와 포인터 없이 필드를 배열·다른 객체 안에 펼쳐 넣을 수 있는 클래스(Valhalla). 작은 값 객체가 많은 코드의 메모리와 캐시 미스를 줄인다. 아직 프리뷰다"
    synonyms: ["Project Valhalla", "value class", "value object", "JEP 401"]
    mitigates: [rt-cache-miss]

  # ── 할당 ──
  - id: rt-allocation
    kind: STAGE
    name: "객체 할당"
    category: BASICS
    level: INTERMEDIATE
    description: "new 가 어디에 어떻게 자리를 잡고, 객체가 세대 사이를 어떻게 옮겨 가는지 본다. 할당 속도와 승격 속도가 GC 빈도와 정지 시간을 정한다"
    questions: ["TLAB 이 없으면 할당이 왜 느려지나", "Survivor 가 두 칸인 이유는 무엇인가"]
    contains: [rt-tlab, rt-bump-pointer-allocation, rt-object-promotion, rt-humongous-object, rt-premature-promotion, rt-allocation-rate, rt-promotion-rate]
    flows_to: [rt-garbage-collection]
    measured_by: [rt-allocation-rate, rt-promotion-rate]
  - id: rt-tlab
    kind: MECHANISM
    name: "TLAB"
    category: BASICS
    level: INTERMEDIATE
    description: "Eden 을 스레드마다 한 덩이씩 나눠 준 할당 버퍼. 자기 덩이 안에서는 포인터만 밀어 잠금 없이 할당하고, 다 쓰면 새 덩이를 받는다. 덩이보다 큰 객체는 밖에서 할당된다"
    synonyms: ["Thread-Local Allocation Buffer", "TLAB"]
    uses: [rt-bump-pointer-allocation]
    mitigates: [conc-lock-contention]
    affects: [rt-allocation-rate]
  - id: rt-bump-pointer-allocation
    kind: MECHANISM
    name: "포인터 증가 할당"
    category: BASICS
    level: INTERMEDIATE
    description: "빈 공간의 시작 주소를 객체 크기만큼 밀어 할당한다. 압축·복사 수집이 빈 공간을 한 덩이로 만들어 두기에 가능하고, C 의 malloc 보다 훨씬 싸다"
    synonyms: ["bump-the-pointer"]
  - id: rt-object-promotion
    kind: MECHANISM
    name: "승격"
    category: BASICS
    level: INTERMEDIATE
    description: "Young GC 를 살아남을 때마다 나이를 하나 올리고, 나이가 문턱(MaxTenuringThreshold, 기본 15)을 넘거나 Survivor 가 넘치면 Old 로 옮긴다"
    synonyms: ["promotion", "tenuring", "MaxTenuringThreshold", "object age"]
    uses: [rt-object-age]
    affects: [rt-promotion-rate]
  - id: rt-humongous-object
    kind: MECHANISM
    name: "Humongous 객체"
    category: BASICS
    level: ADVANCED
    description: "G1 에서 리전 크기의 절반 이상인 객체. 연속된 리전 여럿을 통째로 차지하고 Old 에 바로 들어가 단편화와 이른 GC 를 부른다. 큰 배열·큰 응답 버퍼가 흔한 원인이다"
    synonyms: ["humongous allocation", "G1HeapRegionSize"]
    causes: [rt-heap-fragmentation, rt-premature-promotion]
  - id: rt-premature-promotion
    kind: PROBLEM
    name: "조기 승격"
    category: BASICS
    level: ADVANCED
    description: "곧 죽을 객체가 Survivor 부족이나 큰 크기 때문에 Old 로 넘어가 Old 를 빨리 채우는 상태. 비싼 Old 수집이 잦아진다"
    synonyms: ["premature promotion", "survivor overflow"]
    measured_by: [rt-promotion-rate]
  - id: rt-allocation-rate
    kind: METRIC
    name: "할당률"
    category: BASICS
    level: INTERMEDIATE
    description: "초당 새로 할당하는 바이트. Young GC 빈도를 거의 그대로 정한다. 보통 API 서버는 수백 MB/s 이고 GB/s 를 넘으면 할당부터 줄인다"
    synonyms: ["allocation rate", "jvm_gc_memory_allocated_bytes_total"]
  - id: rt-promotion-rate
    kind: METRIC
    name: "승격률"
    category: BASICS
    level: INTERMEDIATE
    description: "초당 Old 로 옮겨 가는 바이트. 이것이 높으면 Old 가 빨리 차서 Mixed·Full GC 가 잦아진다"
    synonyms: ["promotion rate", "jvm_gc_memory_promoted_bytes_total"]

  # ── 가비지 수집 원리 ──
  - id: rt-garbage-collection
    kind: STAGE
    name: "가비지 수집 원리"
    category: BASICS
    level: INTERMEDIATE
    description: "더 이상 닿을 수 없는 객체를 찾아 자리를 되찾는다. 살아 있는 것을 표시하고, 죽은 자리를 쓸거나 산 것을 모으고, 애플리케이션을 얼마나 멈출지 정하는 일이다"
    questions: ["GC 는 객체가 살아 있는지 무엇으로 판단하나", "Mark-Sweep·Mark-Compact·Copying 의 장단점은 무엇인가", "STW 가 없는 GC 가 가능한가"]
    contains: [rt-reachability-analysis, rt-reference-counting, rt-mark-sweep, rt-mark-compact, rt-copying-collection, rt-generational-collection, rt-tri-color-marking, rt-remembered-set, rt-gc-barrier, rt-safepoint, rt-concurrent-gc, rt-heap-fragmentation, rt-time-to-safepoint, rt-gc-pause-time, rt-gc-throughput]
    flows_to: [rt-collector-selection]
    uses: [rt-gc-root, rt-stop-the-world, rt-mutator]
    measured_by: [rt-gc-pause-time, rt-gc-throughput]
  - id: rt-reachability-analysis
    kind: MECHANISM
    name: "도달성 분석"
    category: BASICS
    level: BEGINNER
    description: "GC 루트(스택 지역 변수·static 필드·JNI 참조·활성 스레드)에서 참조를 따라가 닿는 객체만 살아 있다고 본다. 서로만 가리키는 순환 쓰레기도 치운다"
    synonyms: ["reachability", "tracing GC", "GC roots"]
    uses: [rt-gc-root, graph]
  - id: rt-reference-counting
    kind: MECHANISM
    name: "참조 카운팅"
    category: BASICS
    level: BEGINNER
    description: "객체마다 가리키는 참조 수를 세다가 0 이 되면 즉시 치운다. 정지가 없지만 순환 참조를 못 치우고 매 대입마다 카운트를 고쳐야 한다. CPython·Swift 가 쓰고 JVM 은 쓰지 않는다"
    synonyms: ["reference counting", "ARC"]
    alternative_to:
      - { to: rt-reachability-analysis, reason: "추적 없이 즉시 회수하지만 순환 쓰레기를 남긴다" }
  - id: rt-mark-sweep
    kind: MECHANISM
    name: "Mark-Sweep"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "산 객체를 표시한 뒤 표시 안 된 자리를 빈 목록에 돌려준다. 객체를 옮기지 않아 빠르지만 빈 공간이 조각나고 할당이 빈 목록 탐색이 된다. CMS 가 이 방식이었다"
    synonyms: ["mark and sweep"]
    causes: [rt-heap-fragmentation]
  - id: rt-mark-compact
    kind: MECHANISM
    name: "Mark-Compact"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "표시한 뒤 산 객체를 한쪽으로 밀어 모으고 참조를 고친다. 조각이 없어 포인터 증가 할당이 되지만 이동·참조 수정 비용이 크다. Old 세대와 Full GC 가 쓴다"
    synonyms: ["mark and compact", "sliding compaction", "Lisp2"]
    mitigates: [rt-heap-fragmentation]
    alternative_to:
      - { to: rt-mark-sweep, reason: "객체를 옮기는 비용을 내고 조각을 없앤다" }
  - id: rt-copying-collection
    kind: MECHANISM
    name: "복사 수집"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "공간을 둘로 나눠 산 객체만 반대편으로 복사하고 원래 공간은 통째로 비운다(Cheney). 비용이 산 객체 수에만 비례해 대부분 죽는 Young 세대에 맞고, 공간 절반을 비워 둬야 한다"
    synonyms: ["copying GC", "semi-space", "Cheney algorithm", "evacuation"]
    mitigates: [rt-heap-fragmentation]
  - id: rt-generational-collection
    kind: MECHANISM
    name: "세대별 수집"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "객체를 나이로 나눠 젊은 영역은 자주·싸게(복사), 늙은 영역은 드물게 수집한다. 대부분의 객체는 일찍 죽는다는 가설 위에 서고, 세대 간 참조를 따로 추적해야 한다"
    synonyms: ["generational GC", "minor GC", "major GC"]
    uses: [rt-weak-generational-hypothesis, rt-remembered-set, rt-copying-collection]
  - id: rt-tri-color-marking
    kind: MECHANISM
    name: "삼색 마킹"
    category: ALGORITHM
    level: ADVANCED
    description: "객체를 흰색(미방문)·회색(방문했지만 자식 미탐색)·검은색(끝)으로 칠하며 표시한다. 애플리케이션이 도는 동안 표시하면 검은 객체가 흰 객체를 새로 가리켜 산 것을 놓칠 수 있어 배리어로 막는다"
    synonyms: ["tri-color marking", "concurrent marking"]
    contains: [rt-satb, rt-incremental-update]
    uses: [rt-gc-barrier]
  - id: rt-satb
    kind: MECHANISM
    name: "SATB"
    category: ALGORITHM
    level: ADVANCED
    description: "마킹 시작 순간의 객체 그래프를 기준으로 삼아, 참조를 덮어쓸 때 옛 값을 기록해(pre-write barrier) 그 시점에 살아 있던 것은 모두 살린다. G1·Shenandoah 가 쓰고 떠 있는 쓰레기가 조금 남는다"
    synonyms: ["Snapshot-At-The-Beginning"]
    uses: [rt-write-barrier, rt-floating-garbage]
  - id: rt-incremental-update
    kind: MECHANISM
    name: "증분 갱신"
    category: ALGORITHM
    level: ADVANCED
    description: "검은 객체에 새 참조가 생기면 그 객체를 다시 회색으로 돌려 재탐색한다(post-write barrier). CMS 가 쓴 방식이고 마지막 재표시 단계가 길어질 수 있다"
    synonyms: ["incremental update", "remark"]
    alternative_to:
      - { to: rt-satb, reason: "옛 값 대신 새 참조를 기록해 떠 있는 쓰레기가 적지만 재표시가 길다" }
  - id: rt-remembered-set
    kind: MECHANISM
    name: "Remembered Set"
    category: ALGORITHM
    level: ADVANCED
    description: "다른 영역에서 이 영역을 가리키는 참조의 위치를 적어 둔 목록. Young 만 수집할 때 Old 전체를 훑지 않고 이것만 루트로 본다. G1 은 리전마다 하나씩 둬 메모리를 꽤 쓴다"
    synonyms: ["remembered set", "RSet"]
    contains: [rt-card-table]
    uses: [rt-write-barrier]
  - id: rt-card-table
    kind: MECHANISM
    name: "카드 테이블"
    category: ALGORITHM
    level: ADVANCED
    description: "힙을 512 바이트 카드로 나누고 Old 에서 Young 을 가리키는 쓰기가 일어난 카드를 더럽다고 표시하는 바이트 배열. Young GC 는 더러운 카드만 훑는다"
    synonyms: ["card table", "dirty card"]
  - id: rt-gc-barrier
    kind: MECHANISM
    name: "GC 배리어"
    category: ALGORITHM
    level: ADVANCED
    description: "JIT 가 참조 쓰기·읽기마다 끼워 넣는 짧은 코드. 동시 마킹·세대 간 참조·동시 이동을 GC 에 알리고, 그 대가로 애플리케이션 처리량을 몇 퍼센트 깎는다"
    synonyms: ["GC barrier"]
    contains: [rt-write-barrier, rt-load-barrier]
    affects: [rt-gc-throughput]
  - id: rt-write-barrier
    kind: MECHANISM
    name: "쓰기 배리어"
    category: ALGORITHM
    level: ADVANCED
    description: "참조 필드에 쓸 때 카드를 더럽히거나(세대 추적) 옛 값을 기록한다(SATB). G1 은 쓰기 앞뒤 두 개를 둔다"
    synonyms: ["write barrier", "pre/post-write barrier"]
  - id: rt-load-barrier
    kind: MECHANISM
    name: "읽기 배리어"
    category: ALGORITHM
    level: ADVANCED
    description: "힙에서 참조를 읽을 때마다 그 포인터가 옮겨진 객체를 가리키는지 확인하고 고친다(self-healing). 객체를 애플리케이션이 도는 동안 옮기게 해 주는 장치로 ZGC·Shenandoah 가 쓴다"
    synonyms: ["load barrier", "read barrier", "LRB"]
  - id: rt-safepoint
    kind: MECHANISM
    name: "세이프포인트"
    category: BASICS
    level: ADVANCED
    description: "모든 스레드의 스택·레지스터 상태를 JVM 이 정확히 알 수 있는 지점. GC·역최적화·스레드 덤프 같은 전역 작업은 모든 스레드가 여기 멈추기를 기다린 뒤 시작한다. 루프 백엣지·메서드 반환에 폴링이 들어간다"
    synonyms: ["safepoint", "handshake"]
    causes: [rt-time-to-safepoint]
  - id: rt-concurrent-gc
    kind: MECHANISM
    name: "동시 · 병렬 수집"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "병렬(parallel)은 멈춘 채 여러 GC 스레드로 빨리 끝내는 것, 동시(concurrent)는 애플리케이션과 함께 도는 것이다. 동시일수록 정지는 짧아지고 배리어·CPU 비용이 는다"
    synonyms: ["concurrent GC", "parallel GC threads", "ConcGCThreads", "ParallelGCThreads"]
    uses: [rt-tri-color-marking, rt-gc-barrier]
    affects: [rt-gc-pause-time]
  - id: rt-heap-fragmentation
    kind: PROBLEM
    name: "힙 단편화"
    category: BASICS
    level: INTERMEDIATE
    description: "빈 공간은 충분한데 한 덩이로 붙어 있지 않아 큰 객체를 놓지 못하는 상태. 결국 압축(Full GC)으로만 풀린다"
    synonyms: ["fragmentation"]
    causes: [rt-full-gc]
  - id: rt-time-to-safepoint
    kind: PROBLEM
    name: "세이프포인트 도달 지연"
    category: BASICS
    level: ADVANCED
    description: "한 스레드가 폴링 없는 긴 루프(int 카운트 루프)나 큰 배열 복사 안에 있어 세이프포인트에 늦게 닿는 동안 나머지가 모두 멈춰 기다리는 상태. GC 로그의 정지 시간에 잡히지 않는 숨은 정지다"
    synonyms: ["TTSP", "time to safepoint", "counted loop"]
    measured_by: [rt-gc-pause-time]
  - id: rt-gc-pause-time
    kind: METRIC
    name: "GC 정지 시간"
    category: BASICS
    level: INTERMEDIATE
    description: "GC 가 애플리케이션을 멈춘 시간. 평균보다 p99·최댓값이 요청 지연 꼬리를 정한다"
    synonyms: ["pause time", "jvm_gc_pause_seconds"]
  - id: rt-gc-throughput
    kind: METRIC
    name: "GC 처리량"
    category: BASICS
    level: INTERMEDIATE
    description: "전체 시간 중 GC 가 아닌 애플리케이션 실행에 쓴 비율. 배치는 이것을, API 는 정지 시간을 우선한다. 보통 95% 이상을 목표로 한다"
    synonyms: ["GC throughput", "GC overhead"]

  # ── 컬렉터 선택 ──
  - id: rt-collector-selection
    kind: STAGE
    name: "컬렉터 선택"
    category: BASICS
    level: INTERMEDIATE
    description: "힙 크기·정지 목표·CPU 여유에 맞춰 HotSpot 의 컬렉터를 고른다. 처리량(Parallel), 균형(G1), 초저지연(ZGC·Shenandoah) 사이의 교환이다"
    questions: ["G1 과 ZGC 는 각각 언제 쓰나", "작은 컨테이너(1 코어·1 GB 미만)에서 JVM 이 고르는 컬렉터는 무엇인가"]
    contains: [rt-serial-gc, rt-parallel-gc, rt-cms-gc, rt-g1-gc, rt-zgc, rt-shenandoah, rt-epsilon-gc, rt-evacuation-failure, rt-allocation-stall, rt-concurrent-mode-failure]
    flows_to: [rt-gc-tuning]
  - id: rt-serial-gc
    kind: MECHANISM
    name: "Serial GC"
    category: ALGORITHM
    level: BEGINNER
    description: "GC 스레드 하나로 멈춘 채 Young 은 복사, Old 는 Mark-Compact 한다. CPU 2 개 미만·메모리 1.7 GB 미만이면 JVM 이 자동으로 고른다 — 작은 컨테이너가 조용히 이것을 쓴다"
    synonyms: ["SerialGC", "-XX:+UseSerialGC"]
    uses: [rt-copying-collection, rt-mark-compact]
  - id: rt-parallel-gc
    kind: MECHANISM
    name: "Parallel GC"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "Serial 과 같은 방식을 GC 스레드 여럿으로 돌린다. 정지는 길어도 전체 GC 비용이 가장 적어 배치·처리량 중심 작업에 맞다"
    synonyms: ["ParallelGC", "Throughput Collector", "-XX:+UseParallelGC"]
    uses: [rt-copying-collection, rt-mark-compact]
    alternative_to:
      - { to: rt-serial-gc, reason: "같은 알고리즘을 여러 코어로 돌려 정지를 줄인다" }
  - id: rt-cms-gc
    kind: MECHANISM
    name: "CMS"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "Old 를 애플리케이션과 동시에 Mark-Sweep 해 정지를 줄인 첫 저지연 컬렉터. 압축을 안 해 단편화가 쌓이면 긴 Full GC 로 떨어졌고, JDK 14 에서 제거됐다"
    synonyms: ["Concurrent Mark Sweep", "JEP 363"]
    uses: [rt-mark-sweep, rt-incremental-update]
    causes: [rt-concurrent-mode-failure, rt-heap-fragmentation]
  - id: rt-g1-gc
    kind: MECHANISM
    name: "G1 GC"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "힙을 같은 크기 리전으로 나누고, 동시 마킹으로 쓰레기가 많은 리전을 골라 정지 목표(MaxGCPauseMillis, 기본 200 ms) 안에서 먼저 비운다(Garbage-First). JDK 9 부터 기본 컬렉터다"
    synonyms: ["Garbage-First", "G1", "-XX:+UseG1GC"]
    questions: ["G1 의 Mixed GC 는 무엇을 수집하나", "G1 에서 Full GC 가 났다면 무엇을 먼저 의심하나"]
    contains: [rt-g1-region, rt-g1-mixed-gc]
    uses: [rt-satb, rt-remembered-set, rt-copying-collection]
    alternative_to:
      - { to: rt-cms-gc, reason: "동시 마킹은 유지하되 리전을 복사로 비워 단편화를 없앴다" }
      - { to: rt-parallel-gc, reason: "처리량을 조금 내주고 정지 시간을 목표 안에 묶는다" }
  - id: rt-g1-region
    kind: MECHANISM
    name: "G1 리전"
    category: ALGORITHM
    level: ADVANCED
    description: "힙을 1~32 MB 리전 약 2048 개로 나눠, 리전마다 Eden·Survivor·Old·Humongous 역할을 그때그때 붙인다. 세대 크기를 동적으로 바꿀 수 있는 이유다"
    synonyms: ["region", "G1HeapRegionSize"]
  - id: rt-g1-mixed-gc
    kind: MECHANISM
    name: "G1 사이클"
    category: ALGORITHM
    level: ADVANCED
    description: "Young GC 를 돌다가 힙 점유가 IHOP 를 넘으면 동시 마킹을 시작하고, 끝나면 Young 과 쓰레기가 많은 Old 리전 일부를 함께 비우는 Mixed GC 를 몇 번 돈다. 따라잡지 못하면 Full GC 다"
    synonyms: ["Young GC", "Concurrent Mark", "Mixed GC", "Remark", "Cleanup"]
  - id: rt-zgc
    kind: MECHANISM
    name: "ZGC"
    category: ALGORITHM
    level: ADVANCED
    description: "표시·이동·참조 수정을 모두 애플리케이션과 동시에 해 정지를 힙 크기와 무관하게 1 ms 아래로 묶는 컬렉터. 컬러 포인터와 읽기 배리어가 핵심이다. JDK 21 에 세대 모드가 생겼고 JDK 24 부터는 세대 모드뿐이다"
    synonyms: ["Z Garbage Collector", "-XX:+UseZGC", "JEP 377"]
    questions: ["ZGC 는 왜 Compressed OOPs 를 못 쓰나"]
    contains: [rt-colored-pointer, rt-generational-zgc]
    uses: [rt-load-barrier]
    causes: [rt-allocation-stall]
    alternative_to:
      - { to: rt-g1-gc, reason: "처리량과 메모리를 조금 더 내고 정지를 서브 밀리초로 묶는다" }
  - id: rt-colored-pointer
    kind: MECHANISM
    name: "컬러 포인터"
    category: ALGORITHM
    level: ADVANCED
    description: "64비트 참조의 남는 상위 비트에 표시·재배치 상태를 적는다. 읽기 배리어가 이 비트만 보고 포인터가 최신인지 판단해 느린 경로로 고친다"
    synonyms: ["colored pointer", "multi-mapping"]
  - id: rt-generational-zgc
    kind: MECHANISM
    name: "세대별 ZGC"
    category: ALGORITHM
    level: ADVANCED
    description: "ZGC 에 Young·Old 구분을 더해 젊은 객체를 자주 수집한다(JEP 439, JDK 21). 할당률이 높을 때 할당 정지가 줄고 필요한 힙 여유도 준다"
    synonyms: ["Generational ZGC", "JEP 439", "ZGenerational"]
    uses: [rt-generational-collection]
  - id: rt-shenandoah
    kind: MECHANISM
    name: "Shenandoah"
    category: ALGORITHM
    level: ADVANCED
    description: "Red Hat 이 만든 동시 압축 컬렉터. 초기엔 객체마다 전달 포인터(Brooks pointer)를 뒀고 지금은 읽기 배리어로 이동 중 객체를 찾는다. Compressed OOPs 를 쓸 수 있어 중간 크기 힙에서 유리하다"
    synonyms: ["Shenandoah GC", "-XX:+UseShenandoahGC"]
    contains: [rt-brooks-pointer]
    uses: [rt-satb, rt-load-barrier]
    alternative_to:
      - { to: rt-zgc, reason: "같은 동시 이동을 컬러 포인터 없이 해 32 GB 미만 힙에서 참조 압축을 유지한다" }
  - id: rt-brooks-pointer
    kind: MECHANISM
    name: "Brooks 포인터"
    category: ALGORITHM
    level: ADVANCED
    description: "객체 앞에 자기 자신(또는 옮겨 간 사본)을 가리키는 전달 포인터를 하나 더 두어, 동시 이동 중에도 항상 최신 사본으로 가게 한다. 객체당 한 워드가 더 든다"
    synonyms: ["Brooks forwarding pointer", "indirection pointer"]
  - id: rt-epsilon-gc
    kind: MECHANISM
    name: "Epsilon GC"
    category: ALGORITHM
    level: ADVANCED
    description: "할당만 하고 아무것도 수집하지 않는 컬렉터. 힙이 차면 죽는다. GC 비용을 뺀 성능 기준선 측정이나 수명이 아주 짧은 작업에 쓴다"
    synonyms: ["No-Op GC", "JEP 318"]
  - id: rt-evacuation-failure
    kind: PROBLEM
    name: "Evacuation 실패"
    category: BASICS
    level: ADVANCED
    description: "G1 이 산 객체를 옮겨 담을 빈 리전을 못 찾아 복사를 끝내지 못하는 상태. 'to-space exhausted' 로 찍히고 긴 정지나 Full GC 로 이어진다"
    synonyms: ["to-space exhausted", "evacuation failure"]
    causes: [rt-full-gc]
  - id: rt-allocation-stall
    kind: PROBLEM
    name: "할당 정지"
    category: BASICS
    level: ADVANCED
    description: "동시 컬렉터가 수집보다 할당이 빨라 힙이 차서, 할당하려는 스레드가 GC 를 기다리며 멈추는 상태. ZGC 로그의 'Allocation Stall' 이고 정지 시간 지표에는 안 잡힌다"
    synonyms: ["Allocation Stall", "pacing"]
  - id: rt-concurrent-mode-failure
    kind: PROBLEM
    name: "동시 모드 실패"
    category: BASICS
    level: ADVANCED
    description: "동시 수집이 끝나기 전에 Old 가 가득 차 멈춤 수집으로 떨어지는 상태. CMS 의 대표 장애였고 G1 에서도 마킹이 늦게 시작되면 같은 모양이 된다"
    synonyms: ["concurrent mode failure"]
    causes: [rt-full-gc]

  # ── GC 튜닝 ──
  - id: rt-gc-tuning
    kind: STAGE
    name: "GC 튜닝"
    category: BASICS
    level: ADVANCED
    description: "GC 로그로 현재 정지·빈도·승격을 재고, 한 번에 옵션 하나씩 바꿔 목표(정지 p99·처리량·메모리) 사이 균형을 맞춘다. 측정 없이 옵션부터 바꾸지 않는다"
    questions: ["GC 로그에서 가장 먼저 보는 지표 다섯 가지는 무엇인가", "Young GC 가 목표보다 길 때 무엇을 조절하나"]
    contains: [rt-gc-logging, rt-gc-log-analysis, rt-heap-sizing, rt-pause-time-goal, rt-young-gen-sizing, rt-ihop-tuning, rt-gc-thrashing, rt-full-gc]
    flows_to: [rt-execution]
    measured_by: [rt-gc-pause-time, rt-gc-throughput]
  - id: rt-gc-logging
    kind: MECHANISM
    name: "GC 로그"
    category: BASICS
    level: INTERMEDIATE
    description: "-Xlog:gc*:file=...:time,uptime,level,tags:filecount=,filesize= 로 켜는 통합 로깅(JDK 9+). 정지마다 원인·전후 힙·단계별 시간이 찍히고 비용이 거의 없어 운영에서 늘 켜 둔다"
    synonyms: ["Unified Logging", "-Xlog:gc*", "PrintGCDetails"]
  - id: rt-gc-log-analysis
    kind: MECHANISM
    name: "GC 로그 분석"
    category: BASICS
    level: INTERMEDIATE
    description: "로그를 GCViewer·GCEasy 같은 도구로 읽어 정지 분포·처리량·할당률·승격률·GC 뒤 힙 추이를 뽑는다. Full GC·to-space exhausted·Allocation Stall 이 위험 신호다"
    synonyms: ["GCViewer", "GCEasy"]
    uses: [rt-gc-logging]
    measured_by: [rt-gc-pause-time, rt-allocation-rate, rt-promotion-rate]
  - id: rt-heap-sizing
    kind: MECHANISM
    name: "힙 크기 설정"
    category: BASICS
    level: INTERMEDIATE
    description: "운영에서는 -Xms 와 -Xmx 를 같게 잡아 늘고 줄 때의 GC·페이지 폴트를 없앤다. 크기는 GC 뒤 라이브 셋의 3~4 배가 출발점이고, 컨테이너 한도의 절반 안팎으로 둔다"
    synonyms: ["-Xms", "-Xmx", "heap size"]
    code:
      - { path: k8s/infra/local/opensearch/statefulset.yaml, symbol: "-Xms512m -Xmx512m", note: "OpenSearch 힙을 최소·최대 같은 값으로 고정한다" }
    affects: [rt-gc-pause-time, obs-rss]
  - id: rt-pause-time-goal
    kind: MECHANISM
    name: "정지 목표"
    category: BASICS
    level: INTERMEDIATE
    description: "G1 의 MaxGCPauseMillis 처럼 컬렉터가 맞추려는 정지 시간. 너무 낮추면 Young 을 작게 잡아 GC 가 잦아지고 처리량이 떨어진다. 약속이 아니라 목표다"
    synonyms: ["MaxGCPauseMillis", "pause target"]
    affects: [rt-gc-pause-time, rt-gc-throughput]
  - id: rt-young-gen-sizing
    kind: MECHANISM
    name: "Young 크기 조절"
    category: BASICS
    level: ADVANCED
    description: "Young 이 크면 GC 는 드물지만 한 번이 길고, 작으면 잦고 조기 승격이 는다. G1 은 G1NewSizePercent·G1MaxNewSizePercent 범위에서 스스로 조절하므로 -Xmn 으로 고정하면 정지 목표가 무력해진다"
    synonyms: ["-Xmn", "NewRatio", "G1NewSizePercent"]
    mitigates: [rt-premature-promotion]
  - id: rt-ihop-tuning
    kind: MECHANISM
    name: "IHOP 조절"
    category: BASICS
    level: ADVANCED
    description: "G1 이 동시 마킹을 시작하는 힙 점유 문턱(InitiatingHeapOccupancyPercent, 기본 45% 에서 적응형). 늦게 시작하면 마킹이 끝나기 전에 힙이 차서 Full GC 가 난다"
    synonyms: ["InitiatingHeapOccupancyPercent", "IHOP", "G1ReservePercent"]
    mitigates: [rt-evacuation-failure, rt-concurrent-mode-failure]
  - id: rt-gc-thrashing
    kind: PROBLEM
    name: "연속 GC"
    category: BASICS
    level: ADVANCED
    description: "힙이 라이브 셋에 비해 너무 작아 GC 가 끝나자마자 다시 도는(back-to-back) 상태. CPU 는 GC 가 먹고 처리량은 바닥이며, 계속되면 GC overhead limit OOM 으로 끝난다"
    synonyms: ["back-to-back GC", "GC thrashing"]
    causes: [rt-oom-gc-overhead]
    measured_by: [rt-gc-throughput]
  - id: rt-full-gc
    kind: PROBLEM
    name: "Full GC"
    category: BASICS
    level: INTERMEDIATE
    description: "힙 전체를 멈춘 채 압축하는 최후 수단. 수 GB 힙이면 초 단위로 멈춘다. G1·ZGC 에서 Full GC 가 보이면 크기·IHOP·할당 패턴 중 하나가 잘못됐다는 신호다"
    synonyms: ["Full GC", "stop-the-world full collection", "System.gc()"]
    measured_by: [rt-gc-pause-time]

  # ── 실행 엔진 · JIT ──
  - id: rt-execution
    kind: STAGE
    name: "실행 엔진 · JIT"
    category: BASICS
    level: INTERMEDIATE
    description: "바이트코드를 처음엔 해석하고, 자주 도는 코드는 실행 중 모은 프로파일로 기계어로 컴파일한다. 추측으로 최적화하고, 추측이 틀리면 되돌린다"
    questions: ["C1 과 C2 는 무엇이 다르고 계층형 컴파일은 둘을 어떻게 쓰나", "Escape Analysis 가 성공하면 무엇이 사라지나"]
    contains: [rt-bytecode-interpreter, rt-jit-compilation, rt-method-inlining, rt-escape-analysis, rt-lock-coarsening, rt-loop-optimization, rt-auto-vectorization, rt-dead-code-elimination, rt-intrinsic, rt-deoptimization, rt-megamorphic-call, rt-jvm-warmup, rt-code-cache-full, rt-microbenchmark-pitfall]
    flows_to: [rt-startup-optimization]
    uses: [rt-bytecode, rt-hot-method, rt-speculative-optimization, obs-microbenchmark]
  - id: rt-bytecode-interpreter
    kind: MECHANISM
    name: "인터프리터"
    category: BASICS
    level: BEGINNER
    description: "바이트코드를 한 명령씩 읽어 실행한다(HotSpot 은 템플릿 인터프리터). 기동은 빠르지만 느리고, 실행하면서 호출 횟수·분기·타입 프로파일을 모아 JIT 에 넘긴다"
    synonyms: ["interpreter", "template interpreter"]
    uses: [rt-bytecode]
  - id: rt-jit-compilation
    kind: MECHANISM
    name: "JIT 컴파일"
    category: BASICS
    level: INTERMEDIATE
    description: "실행 중 호출·루프 횟수가 문턱을 넘은 메서드를 백그라운드 스레드가 기계어로 컴파일해 Code Cache 에 올린다. 실제 실행 프로파일을 써서 정적 컴파일보다 공격적으로 최적화한다"
    synonyms: ["Just-In-Time compilation", "JIT"]
    contains: [rt-c1-compiler, rt-c2-compiler, rt-tiered-compilation, rt-graal-compiler, rt-osr]
    uses: [rt-code-cache, rt-speculative-optimization]
    affects: [rt-startup-time]
  - id: rt-c1-compiler
    kind: MECHANISM
    name: "C1 컴파일러"
    category: BASICS
    level: INTERMEDIATE
    description: "빨리 컴파일하고 가벼운 최적화만 하는 클라이언트 컴파일러. 계층형에서는 프로파일을 모으는 코드를 심어 C2 의 재료를 만든다"
    synonyms: ["C1", "client compiler"]
  - id: rt-c2-compiler
    kind: MECHANISM
    name: "C2 컴파일러"
    category: BASICS
    level: INTERMEDIATE
    description: "오래 걸리지만 인라이닝·이스케이프 분석·루프 최적화·벡터화를 다 하는 서버 컴파일러. 뜨거운 코드의 최종 형태를 만든다"
    synonyms: ["C2", "server compiler", "opto"]
  - id: rt-tiered-compilation
    kind: MECHANISM
    name: "계층형 컴파일"
    category: BASICS
    level: INTERMEDIATE
    description: "0 단계 인터프리터 → 3 단계 C1(프로파일 수집) → 4 단계 C2 로 올라간다(JDK 8 기본). 빨리 기계어로 가면서도 C2 에 충분한 프로파일을 준다"
    synonyms: ["tiered compilation", "TieredStopAtLevel", "Tier 0-4"]
    uses: [rt-c1-compiler, rt-c2-compiler]
    mitigates: [rt-jvm-warmup]
  - id: rt-graal-compiler
    kind: MECHANISM
    name: "Graal JIT"
    category: BASICS
    level: ADVANCED
    description: "자바로 작성한 최적화 컴파일러. C2 자리에 JVMCI 로 끼워 쓰거나 GraalVM Native Image 의 AOT 백엔드로 쓴다. 부분 이스케이프 분석처럼 C2 보다 공격적인 최적화가 있다"
    synonyms: ["Graal", "JVMCI", "GraalVM"]
    alternative_to:
      - { to: rt-c2-compiler, reason: "같은 최상위 JIT 자리를 자바로 쓴 컴파일러로 대신한다" }
  - id: rt-osr
    kind: MECHANISM
    name: "OSR"
    category: BASICS
    level: ADVANCED
    description: "메서드는 한 번 불렸지만 안의 루프가 오래 도는 경우, 루프 도중에 컴파일된 코드로 갈아타는 것(On-Stack Replacement). 벤치마크 main 안의 루프가 이것으로 빨라진다"
    synonyms: ["On-Stack Replacement"]
  - id: rt-method-inlining
    kind: MECHANISM
    name: "인라이닝"
    category: BASICS
    level: INTERMEDIATE
    description: "호출 대상 메서드 본문을 호출 자리에 펼쳐 호출 비용을 없애고, 펼친 코드끼리 다른 최적화가 걸리게 한다. 가장 중요한 JIT 최적화이고 크기(MaxInlineSize·FreqInlineSize)와 깊이 제한이 있다"
    synonyms: ["inlining", "MaxInlineSize", "FreqInlineSize"]
    uses: [rt-call-site-morphism]
    affects: [rt-startup-time]
  - id: rt-escape-analysis
    kind: MECHANISM
    name: "이스케이프 분석"
    category: BASICS
    level: ADVANCED
    description: "객체가 메서드 밖이나 다른 스레드로 새지 않는지 분석한다. 새지 않으면 힙 할당을 없애고(스칼라 치환) 그 객체의 잠금도 없앤다. 인라이닝이 먼저 돼야 성공한다"
    synonyms: ["Escape Analysis", "DoEscapeAnalysis"]
    contains: [rt-scalar-replacement, rt-lock-elision]
    uses: [rt-method-inlining]
    affects: [rt-allocation-rate]
  - id: rt-scalar-replacement
    kind: MECHANISM
    name: "스칼라 치환"
    category: BASICS
    level: ADVANCED
    description: "새지 않는 객체를 만들지 않고 필드들을 지역 변수(레지스터)로 흩어 쓴다. 흔히 말하는 '스택 할당'의 실제 모습이다"
    synonyms: ["scalar replacement", "stack allocation"]
  - id: rt-lock-elision
    kind: MECHANISM
    name: "락 제거"
    category: BASICS
    level: ADVANCED
    description: "다른 스레드가 볼 수 없는 객체에 대한 synchronized 를 JIT 가 지운다. 지역 StringBuffer 의 잠금이 대표 예다"
    synonyms: ["lock elision"]
  - id: rt-lock-coarsening
    kind: MECHANISM
    name: "락 확장"
    category: BASICS
    level: ADVANCED
    description: "같은 락을 잇달아 잡고 푸는 코드를 한 번의 큰 잠금으로 합쳐 획득 비용을 줄인다"
    synonyms: ["lock coarsening"]
    mitigates: [conc-lock-contention]
  - id: rt-loop-optimization
    kind: MECHANISM
    name: "루프 최적화"
    category: BASICS
    level: ADVANCED
    description: "루프를 여러 번 펼치고(unrolling), 루프 밖으로 불변식을 꺼내고(hoisting), 배열 경계 검사를 없앤다. 카운트 루프는 세이프포인트 폴링까지 빠질 수 있다"
    synonyms: ["loop unrolling", "range check elimination", "loop invariant hoisting"]
    causes: [rt-time-to-safepoint]
  - id: rt-auto-vectorization
    kind: MECHANISM
    name: "자동 벡터화"
    category: BASICS
    level: ADVANCED
    description: "C2 가 배열 루프를 SIMD 명령(AVX·NEON)으로 바꿔 한 번에 여러 원소를 계산한다(SuperWord). 조건이 까다로워 명시적으로 쓰려면 Vector API 를 쓴다"
    synonyms: ["SIMD", "SuperWord", "Vector API", "Project Panama"]
  - id: rt-dead-code-elimination
    kind: MECHANISM
    name: "죽은 코드 제거 · 상수 접기"
    category: BASICS
    level: INTERMEDIATE
    description: "결과가 쓰이지 않는 계산을 지우고 컴파일 시점에 알 수 있는 값을 미리 계산한다. 마이크로벤치마크가 아무것도 안 재게 되는 원인이기도 하다"
    synonyms: ["DCE", "constant folding"]
    causes: [rt-microbenchmark-pitfall]
  - id: rt-intrinsic
    kind: MECHANISM
    name: "인트린식"
    category: BASICS
    level: ADVANCED
    description: "System.arraycopy·Math·String.equals·CRC32·AES 같은 특정 JDK 메서드를 JIT 가 미리 손으로 짠 CPU 전용 명령열로 바꿔 넣는다"
    synonyms: ["intrinsic", "HotSpotIntrinsicCandidate", "IntrinsicCandidate"]
  - id: rt-deoptimization
    kind: MECHANISM
    name: "역최적화"
    category: BASICS
    level: ADVANCED
    description: "컴파일 때의 추측(이 호출은 항상 이 타입, 이 분기는 안 탄다)이 깨지면 컴파일 코드를 버리고 인터프리터로 돌아가 다시 프로파일한다. 새 클래스 로딩도 계기가 된다"
    synonyms: ["deoptimization", "uncommon trap", "made not entrant"]
    uses: [rt-safepoint, rt-speculative-optimization]
  - id: rt-megamorphic-call
    kind: PROBLEM
    name: "메가모픽 호출"
    category: BASICS
    level: ADVANCED
    description: "한 호출 지점에서 실제 구현 타입이 셋 이상 나와 JIT 가 인라인하지 못하고 가상 호출 테이블을 거치는 상태. 인라이닝이 막히면 뒤따르는 최적화도 함께 막힌다"
    synonyms: ["megamorphic call site", "vtable/itable dispatch"]
  - id: rt-jvm-warmup
    kind: PROBLEM
    name: "워밍업 지연"
    category: BASICS
    level: INTERMEDIATE
    description: "기동 직후에는 인터프리터와 C1 코드로 돌아 수십 초 동안 지연이 높은 상태. 스케일 아웃한 파드가 트래픽을 받자마자 p99 가 튄다"
    synonyms: ["JIT warm-up", "cold start"]
    measured_by: [rt-startup-time]
  - id: rt-code-cache-full
    kind: PROBLEM
    name: "Code Cache 가득 참"
    category: BASICS
    level: ADVANCED
    description: "Code Cache 가 차면 JIT 가 멈추고('CodeCache is full. Compiler has been disabled') 새로 뜨거워진 코드가 인터프리터로 남아 서서히 느려진다. 프레임워크가 큰 앱에서 생긴다"
    synonyms: ["CodeCache is full"]
  - id: rt-microbenchmark-pitfall
    kind: PROBLEM
    name: "마이크로벤치마크 함정"
    category: TESTING
    level: ADVANCED
    description: "워밍업 없는 측정, 결과를 안 써서 계산이 통째로 지워지는 것, 상수 입력이 접혀 버리는 것, 한 JVM 에서 여러 대상을 재 프로파일이 섞이는 것 때문에 System.nanoTime 루프가 틀린 숫자를 내는 상태"
    synonyms: ["benchmark pitfall", "dead code elimination in benchmark"]

  # ── 기동 최적화 ──
  - id: rt-startup-optimization
    kind: STAGE
    name: "기동 최적화"
    category: BASICS
    level: ADVANCED
    description: "클래스 로딩·JIT 워밍업에 드는 시간을 미리 해 둔다 — 클래스 메타데이터를 파일로 남기거나, 미리 기계어로 컴파일하거나, 데운 프로세스를 통째로 저장했다 되살린다"
    questions: ["AppCDS 와 CRaC 는 각각 무엇을 미리 해 두나", "Native Image 로 바꾸면 무엇을 잃나"]
    contains: [rt-cds, rt-aot-compilation, rt-crac, rt-startup-time]
    flows_to: [rt-class-loading]
    measured_by: [rt-startup-time]
  - id: rt-cds
    kind: MECHANISM
    name: "CDS · AppCDS"
    category: BASICS
    level: ADVANCED
    description: "파싱·검증을 끝낸 클래스 메타데이터를 아카이브 파일로 남겨 다음 기동 때 메모리에 매핑한다. JDK 클래스는 기본 아카이브가 있고 AppCDS 로 앱 클래스까지 넣는다. 여러 JVM 이 같은 아카이브를 공유한다"
    synonyms: ["Class Data Sharing", "AppCDS", "Dynamic CDS", "-XX:SharedArchiveFile"]
    mitigates: [rt-jvm-warmup]
    affects: [rt-startup-time]
  - id: rt-aot-compilation
    kind: MECHANISM
    name: "AOT 컴파일"
    category: BASICS
    level: ADVANCED
    description: "빌드 때 기계어로 미리 컴파일한다. GraalVM Native Image 는 닫힌 세계 가정으로 JVM 없이 수십 ms 에 뜨는 실행 파일을 만들지만 리플렉션 설정이 필요하고 최고 처리량은 JIT 보다 낮다. Leyden 은 JVM 안에서 같은 이득을 노린다"
    synonyms: ["Ahead-Of-Time", "GraalVM Native Image", "Project Leyden", "Spring AOT"]
    uses: [rt-graal-compiler]
    mitigates: [rt-jvm-warmup]
    alternative_to:
      - { to: rt-jit-compilation, reason: "실행 중 프로파일 대신 빌드 때 컴파일해 기동을 줄이고 최고 성능을 조금 내준다" }
  - id: rt-crac
    kind: MECHANISM
    name: "CRaC"
    category: BASICS
    level: ADVANCED
    description: "데운 JVM 프로세스를 체크포인트로 디스크에 저장했다가 수백 ms 안에 복원한다(CRIU 기반). 열린 파일·소켓은 복원 전후에 앱이 직접 닫고 다시 연다"
    synonyms: ["Coordinated Restore at Checkpoint", "CRIU"]
    mitigates: [rt-jvm-warmup]
  - id: rt-startup-time
    kind: METRIC
    name: "기동 · 준비 시간"
    category: BASICS
    level: INTERMEDIATE
    description: "프로세스 시작부터 첫 요청 응답까지, 그리고 최고 처리량에 닿기까지의 시간. 스케일 아웃·롤링 배포 속도를 정한다"
    synonyms: ["startup time", "time to first response", "time to peak performance"]

  # ── 클래스 로딩 ──
  - id: rt-class-loading
    kind: STAGE
    name: "클래스 로딩"
    category: BASICS
    level: INTERMEDIATE
    description: "클래스 파일을 찾아 읽고, 검증·준비·해석해 연결하고, 처음 쓰일 때 초기화한다. 어느 클래스로더가 읽었는지가 클래스의 정체성이 된다"
    questions: ["부모 위임 모델은 무엇을 막으려는 것인가", "같은 이름의 클래스가 ClassCastException 을 내는 경우는 언제인가"]
    contains: [rt-class-loading-process, rt-parent-delegation, rt-custom-classloader, rt-hidden-class, rt-jpms, rt-class-unloading, rt-classloader-leak]
    flows_to: [rt-container-runtime]
    uses: [rt-class-file]
  - id: rt-class-loading-process
    kind: MECHANISM
    name: "로딩 · 연결 · 초기화"
    category: BASICS
    level: INTERMEDIATE
    description: "로딩(바이트 읽기) → 연결(검증·준비·해석) → 초기화(static 초기화 블록 실행) 순서로 진행한다. 초기화는 처음 인스턴스를 만들거나 static 멤버를 쓸 때 한 번, 스레드 안전하게 일어난다"
    synonyms: ["loading", "linking", "verification", "preparation", "resolution", "initialization", "<clinit>"]
    contains: [rt-class-linking, rt-class-initialization]
  - id: rt-class-linking
    kind: MECHANISM
    name: "연결"
    category: BASICS
    level: ADVANCED
    description: "바이트코드가 타입 규칙을 어기지 않는지 검증하고, static 필드에 기본값 자리를 잡고, 기호 참조를 실제 주소로 바꾼다(지연 해석)"
    synonyms: ["linking", "bytecode verification", "symbolic reference resolution"]
  - id: rt-class-initialization
    kind: MECHANISM
    name: "클래스 초기화"
    category: BASICS
    level: INTERMEDIATE
    description: "static 필드 대입과 static 블록을 담은 <clinit> 를 한 번만 실행한다. JVM 이 잠가 주므로 홀더 클래스 싱글턴이 동기화 없이 안전하다. 초기화 중 예외는 NoClassDefFoundError 로 되돌아온다"
    synonyms: ["<clinit>", "initialization-on-demand holder", "ExceptionInInitializerError"]
  - id: rt-parent-delegation
    kind: MECHANISM
    name: "부모 위임"
    category: BASICS
    level: INTERMEDIATE
    description: "클래스로더는 먼저 부모(부트스트랩 ← 플랫폼 ← 애플리케이션)에게 찾아 달라고 하고, 부모가 못 찾을 때만 직접 읽는다. java.lang.String 을 앱이 바꿔치기하지 못하게 한다"
    synonyms: ["parent delegation", "bootstrap class loader", "platform class loader", "application class loader"]
  - id: rt-custom-classloader
    kind: MECHANISM
    name: "사용자 클래스로더"
    category: BASICS
    level: ADVANCED
    description: "플러그인·핫 리로드·격리를 위해 따로 만든 클래스로더. 톰캣 웹앱·스프링 부트 fat jar·OpenSearch 플러그인이 쓴다. 같은 이름이라도 로더가 다르면 다른 클래스다"
    synonyms: ["custom ClassLoader", "URLClassLoader", "LaunchedClassLoader"]
    alternative_to:
      - { to: rt-parent-delegation, reason: "자기 것을 먼저 찾는(child-first) 규칙으로 라이브러리 버전 충돌을 격리한다" }
  - id: rt-hidden-class
    kind: MECHANISM
    name: "런타임 클래스 생성"
    category: BASICS
    level: ADVANCED
    description: "람다·리플렉션 가속·프록시(CGLIB·ByteBuddy)가 실행 중 클래스를 만든다. JDK 15 의 hidden class 는 이름으로 찾을 수 없고 따로 언로드될 수 있어 Metaspace 누수를 줄인다"
    synonyms: ["hidden class", "JEP 371", "dynamic proxy", "CGLIB", "ByteBuddy"]
    uses: [reflection]
    causes: [rt-oom-metaspace]
  - id: rt-jpms
    kind: MECHANISM
    name: "모듈 시스템"
    category: BASICS
    level: ADVANCED
    description: "module-info 로 패키지를 어느 모듈에 공개할지(exports) 정하고 의존(requires)을 명시한다(JDK 9, Jigsaw). 내부 API 를 막아 --add-opens 없이는 리플렉션으로도 못 연다. jlink 로 필요한 모듈만 담은 런타임을 만든다"
    synonyms: ["JPMS", "Project Jigsaw", "module-info", "jlink", "--add-opens"]
  - id: rt-class-unloading
    kind: MECHANISM
    name: "클래스 언로딩"
    category: BASICS
    level: ADVANCED
    description: "클래스로더와 그것이 읽은 모든 클래스·인스턴스에 닿는 참조가 모두 끊겨야 GC 가 그 클래스들을 Metaspace 에서 치운다. 한 참조라도 남으면 로더 통째로 남는다"
    synonyms: ["class unloading", "ClassUnloadingWithConcurrentMark"]
    mitigates: [rt-classloader-leak]
  - id: rt-classloader-leak
    kind: PROBLEM
    name: "클래스로더 누수"
    category: BASICS
    level: ADVANCED
    description: "재배포한 앱의 클래스로더를 스레드·ThreadLocal·JDBC 드라이버 등록·static 캐시가 붙잡아, 옛 버전 클래스가 통째로 남아 Metaspace 가 재배포마다 불어나는 상태"
    synonyms: ["classloader leak"]
    causes: [rt-oom-metaspace]

  # ── 컨테이너에서 JVM ──
  - id: rt-container-runtime
    kind: STAGE
    name: "컨테이너에서 JVM 운영"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "JVM 이 노드가 아니라 컨테이너의 CPU·메모리 한도를 보게 하고, 힙과 힙 밖과 페이지 캐시 몫을 한도 안에 나눠 담는다. 한도를 넘으면 JVM 예외가 아니라 커널이 프로세스를 죽인다"
    questions: ["컨테이너 한도 1 GB 에서 MaxRAMPercentage 를 몇으로 잡나", "OOMKilled 인데 힙 덤프가 없다면 무엇을 의심하나"]
    contains: [rt-container-awareness, rt-ram-percentage, rt-active-processor-count, rt-jvm-ergonomics, rt-memory-budget, openjdk]
    flows_to: [rt-os-memory]
    uses: [infra-cgroup]
    measured_by: [obs-rss]
  - id: rt-container-awareness
    kind: MECHANISM
    name: "컨테이너 인식"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "JVM 이 cgroup(v1·v2) 의 메모리 한도와 CPU quota 를 읽어 힙 기본값·GC 스레드 수·availableProcessors 를 정한다(JDK 10+, 8u191+ 기본 켜짐). 옛 JVM 은 노드 전체 메모리를 보고 힙을 잡아 죽었다"
    synonyms: ["UseContainerSupport", "cgroup v2 awareness"]
    code:
      - { path: buildSrc/src/main/kotlin/commerce.jib-convention.gradle.kts, symbol: "\"-XX:+UseContainerSupport\",", note: "Jib 이미지의 JVM 이 컨테이너 한도를 읽게 한다" }
    uses: [infra-cgroup]
    mitigates: [infra-oom-killed]
  - id: rt-ram-percentage
    kind: MECHANISM
    name: "MaxRAMPercentage"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "힙 최대치를 컨테이너 메모리 한도의 비율로 정한다. 기본 25% 는 작은 한도에서 힙이 너무 작고, 75% 는 네이티브 몫이 모자랄 수 있어 한도 크기에 맞춰 고른다. 한도를 바꿔도 힙이 따라간다"
    synonyms: ["MaxRAMPercentage", "InitialRAMPercentage", "MinRAMPercentage"]
    questions: ["-Xmx 대신 MaxRAMPercentage 를 쓰는 이유는 무엇인가"]
    code:
      - { path: k8s/overlays/oci-arm/patches/java-tool-options.yaml, symbol: "value: \"-XX:MaxRAMPercentage=60.0\"", note: "512Mi 이하 파드에서 기본 25% 로는 힙이 모자라 60% 로 올린다" }
      - { path: buildSrc/src/main/kotlin/commerce.jib-convention.gradle.kts, symbol: "\"-XX:MaxRAMPercentage=75.0\",", note: "이미지 기본값은 75% 로 굽는다" }
    uses: [rt-container-awareness]
    alternative_to:
      - { to: rt-heap-sizing, reason: "고정 -Xmx 대신 한도 비율로 잡아 파드 한도를 바꿔도 힙이 함께 움직인다" }
  - id: rt-active-processor-count
    kind: MECHANISM
    name: "ActiveProcessorCount"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "JVM 이 보는 CPU 수를 강제한다. GC·JIT·ForkJoinPool 스레드 수가 이 값을 따른다. 컨테이너 인식이 quota 에서 스스로 계산하므로 보통은 두지 않는다 — 다른 값을 넣으면 한도와 스레드 수가 어긋난다"
    synonyms: ["-XX:ActiveProcessorCount", "availableProcessors"]
    uses: [rt-container-awareness]
  - id: rt-jvm-ergonomics
    kind: MECHANISM
    name: "JVM 에고노믹스"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "옵션을 안 주면 JVM 이 CPU·메모리를 보고 컬렉터·힙·스레드 수를 스스로 고른다. 2 코어 미만이거나 1792 MB 미만이면 클라이언트급으로 보고 Serial GC 를 고른다"
    synonyms: ["ergonomics", "server-class machine"]
    uses: [rt-container-awareness, rt-serial-gc, rt-g1-gc]
  - id: rt-memory-budget
    kind: MECHANISM
    name: "메모리 예산 산정"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "컨테이너 한도 = 힙 + Metaspace + Code Cache + 스레드 수 × Xss + 다이렉트 + GC 자료구조 + malloc 여유 + (파일을 읽는 앱이면) 페이지 캐시 몫으로 나눠 적는다. NMT 기준선으로 각 몫을 실측해 채운다"
    synonyms: ["memory budget", "container sizing"]
    questions: ["검색 노드의 힙을 한도의 절반 아래로 두라는 이유는 무엇인가"]
    uses: [rt-nmt, rt-native-memory]
    mitigates: [infra-oom-killed, page-cache-eviction]
    measured_by: [obs-rss, search-node-memory]
  - id: openjdk
    kind: TECHNOLOGY
    name: "OpenJDK (Eclipse Temurin)"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "이 레포 서비스 이미지가 도는 HotSpot JVM 배포판. Jib 이 eclipse-temurin 25 JRE(Alpine) 위에 앱을 얹는다. G1 기본, 컨테이너 인식 기본, ZGC·Shenandoah·JFR·NMT 를 포함한다"
    synonyms: ["HotSpot", "Temurin", "JDK 25", "Adoptium"]
    code:
      - { path: buildSrc/src/main/kotlin/commerce.jib-convention.gradle.kts, symbol: "image = \"eclipse-temurin:25-jre-alpine\"", note: "모든 JVM 서비스 이미지의 베이스" }
    implements:
      - { to: rt-g1-gc, reason: "힙 크기·코어가 충분하면 기본 컬렉터로 G1 을 쓴다" }
      - { to: rt-tiered-compilation, reason: "C1·C2 계층형 컴파일이 기본으로 켜져 있다" }
      - { to: rt-container-awareness, reason: "cgroup v2 한도를 읽는 컨테이너 인식이 기본이다" }
      - { to: rt-jfr, reason: "Flight Recorder 가 JVM 에 내장돼 있다" }

  # ── OS 메모리 ──
  - id: rt-os-memory
    kind: STAGE
    name: "OS 메모리 이해"
    category: BASICS
    level: INTERMEDIATE
    description: "프로세스 메모리를 운영체제 눈으로 본다 — 가상 주소와 실제 RAM, 파일 사본(페이지 캐시)과 익명 메모리, 컨테이너 한도와 OOM killer. JVM 밖에서 벌어지는 일이 지연과 죽음을 정한다"
    questions: ["RSS 와 VSZ 는 무엇이 다른가", "free 가 적은데 문제가 아닐 수 있는 이유는 무엇인가"]
    contains: [rt-virtual-memory, rt-mmap, rt-oom-killer, rt-major-fault-storm]
    flows_to: [rt-memory-hierarchy]
    uses: [data-page-cache, infra-cgroup, obs-anon-memory, obs-page-fault, obs-swap, obs-huge-page, data-dirty-page]
    measured_by: [obs-rss, obs-memory-available]
  - id: rt-virtual-memory
    kind: MECHANISM
    name: "가상 메모리"
    category: BASICS
    level: BEGINNER
    description: "프로세스마다 독립된 주소 공간을 주고, 페이지 테이블로 실제 RAM 페이지에 대응시킨다. 예약(VSZ)만 하고 처음 만질 때 실제 페이지를 붙이며(demand paging), 이 변환을 TLB 가 캐시한다"
    synonyms: ["virtual memory", "paging", "page table", "demand paging"]
    contains: [rt-tlb]
    uses: [obs-vsz, obs-page-fault]
  - id: rt-tlb
    kind: MECHANISM
    name: "TLB"
    category: BASICS
    level: ADVANCED
    description: "가상 → 물리 주소 변환 결과를 담는 CPU 캐시. 놓치면 페이지 테이블을 여러 단계 걸어 수백 ns 가 든다. 큰 페이지를 쓰면 같은 TLB 로 더 넓은 메모리를 덮는다"
    synonyms: ["Translation Lookaside Buffer", "TLB miss", "page walk"]
  - id: rt-mmap
    kind: MECHANISM
    name: "mmap"
    category: BASICS
    level: INTERMEDIATE
    description: "파일을 주소 공간에 붙여 배열처럼 읽는다. 복사 없이 페이지 캐시를 직접 보고, 처음 닿는 페이지마다 폴트로 채운다. Lucene·Kafka 인덱스가 쓰고 vm.max_map_count 가 조각 수 상한이다"
    synonyms: ["mmap", "memory-mapped file", "MappedByteBuffer", "vm.max_map_count"]
    code:
      - { path: k8s/infra/local/opensearch/statefulset.yaml, symbol: "- name: increase-vm-max-map", note: "OpenSearch 가 세그먼트를 mmap 하도록 init 컨테이너가 vm.max_map_count 를 올린다" }
    uses: [data-page-cache, obs-page-fault]
  - id: rt-oom-killer
    kind: MECHANISM
    name: "OOM killer"
    category: BASICS
    level: INTERMEDIATE
    description: "메모리를 더 줄 수 없을 때 커널이 점수(oom_score, oom_score_adj 반영)가 가장 높은 프로세스를 SIGKILL 로 죽인다. 쿠버네티스는 QoS 등급으로 점수를 조절한다"
    synonyms: ["OOM killer", "oom_score_adj", "SIGKILL"]
    causes: [infra-oom-killed]
  - id: rt-major-fault-storm
    kind: PROBLEM
    name: "major 페이지 폴트 폭증"
    category: BASICS
    level: ADVANCED
    description: "필요한 페이지가 캐시에서 밀려나 매번 디스크에서 읽어야 하는 상태. 무작위 읽기라면 요청 하나가 수천 번의 major fault 가 되어 지연이 초 단위로 뛰고 iowait 가 치솟는다"
    synonyms: ["major page fault", "thrashing", "iowait"]
    measured_by: [obs-major-page-faults]

  # ── 메모리 계층 ──
  - id: rt-memory-hierarchy
    kind: STAGE
    name: "메모리 계층 이해"
    category: BASICS
    level: INTERMEDIATE
    description: "레지스터 → L1·L2·L3 캐시 → DRAM → SSD 로 갈수록 한 자릿수씩 느려진다. 코드의 속도는 연산보다 데이터가 어느 층에 있느냐로 정해지는 경우가 많다"
    questions: ["배열 순회가 연결 리스트 순회보다 빠른 이유는 무엇인가", "L1 참조와 DRAM 참조는 몇 배 차이인가"]
    contains: [rt-cpu-cache-hierarchy, rt-cache-coherence, rt-numa, rt-data-locality, rt-branch-prediction, rt-cache-miss, rt-branch-misprediction, rt-cache-miss-rate]
    flows_to: [rt-diagnostics]
    uses: [rt-cache-line, obs-memory-hierarchy]
    measured_by: [rt-cache-miss-rate]
  - id: rt-cpu-cache-hierarchy
    kind: MECHANISM
    name: "CPU 캐시 계층"
    category: BASICS
    level: INTERMEDIATE
    description: "코어마다 L1(약 1 ns)·L2(약 4 ns), 소켓 공유 L3(약 10~20 ns), 그 밖의 DRAM(약 100 ns). 작고 가까울수록 빠르고, 데이터는 64 바이트 캐시 라인 단위로 오르내린다"
    synonyms: ["L1", "L2", "L3", "cache hierarchy"]
    uses: [rt-cache-line]
  - id: rt-cache-coherence
    kind: MECHANISM
    name: "캐시 일관성"
    category: BASICS
    level: ADVANCED
    description: "여러 코어의 캐시가 같은 주소의 사본을 가질 때 MESI 같은 프로토콜로 한 코어가 쓰면 다른 코어의 사본을 무효로 만든다. 이 라인 주고받기가 경합·false sharing 비용의 정체다"
    synonyms: ["cache coherence", "MESI", "MOESI", "cache line bouncing"]
    causes: [conc-false-sharing]
  - id: rt-numa
    kind: MECHANISM
    name: "NUMA"
    category: BASICS
    level: ADVANCED
    description: "소켓마다 가까운 메모리가 있어 다른 소켓의 메모리를 읽으면 1.5~2 배 느리다. 큰 힙은 -XX:+UseNUMA 로 스레드 가까운 노드에 할당한다"
    synonyms: ["Non-Uniform Memory Access", "UseNUMA", "numactl"]
  - id: rt-data-locality
    kind: MECHANISM
    name: "데이터 지역성"
    category: BASICS
    level: INTERMEDIATE
    description: "함께 쓰는 데이터를 메모리에 붙여 두고 순서대로 훑어 캐시 라인과 하드웨어 프리페처를 살린다. 객체 참조를 따라가는 구조보다 기본형 배열이 몇 배 빠른 이유다"
    synonyms: ["prefetch", "data-oriented design", "cache-friendly layout"]
    uses: [cs-locality-of-reference]
    mitigates: [rt-cache-miss]
  - id: rt-branch-prediction
    kind: MECHANISM
    name: "분기 예측"
    category: BASICS
    level: ADVANCED
    description: "CPU 가 분기 결과를 미리 추측해 파이프라인을 채운다. 규칙적인 분기는 거의 공짜고, 무작위 분기는 틀릴 때마다 파이프라인을 비워 수 ns 를 잃는다"
    synonyms: ["branch prediction", "speculative execution"]
    causes: [rt-branch-misprediction]
  - id: rt-cache-miss
    kind: PROBLEM
    name: "캐시 미스"
    category: BASICS
    level: INTERMEDIATE
    description: "필요한 라인이 캐시에 없어 아래 층에서 가져오는 동안 코어가 노는 상태. 포인터 추적·무작위 접근·큰 작업 집합에서 늘고, CPU 사용률은 높은데 일은 안 하는 모양으로 보인다"
    synonyms: ["cache miss", "memory stall", "LLC miss"]
    measured_by: [rt-cache-miss-rate]
  - id: rt-branch-misprediction
    kind: PROBLEM
    name: "분기 예측 실패"
    category: BASICS
    level: ADVANCED
    description: "예측이 틀려 추측 실행한 명령을 버리고 파이프라인을 다시 채우는 상태(약 5 ns). 정렬된 배열의 조건 합산이 정렬 안 된 배열보다 몇 배 빠른 이유다"
    synonyms: ["branch misprediction", "pipeline flush"]
  - id: rt-cache-miss-rate
    kind: METRIC
    name: "캐시 미스율"
    category: BASICS
    level: ADVANCED
    description: "메모리 참조 중 캐시를 놓친 비율과 IPC(사이클당 명령 수). perf stat 의 cache-misses·LLC-load-misses·perf c2c 로 잰다"
    synonyms: ["cache-misses", "IPC", "perf stat", "perf c2c"]

  # ── 진단 ──
  - id: rt-diagnostics
    kind: STAGE
    name: "JVM 진단"
    category: BASICS
    level: ADVANCED
    description: "멈춤·느려짐·메모리 증가를 JVM 이 스스로 내놓는 기록으로 가른다 — 스레드 덤프(지금 무엇을 하나), 힙 덤프(무엇이 메모리를 쥐나), JFR·프로파일러(시간이 어디에 드나), NMT(힙 밖이 어디에 쓰이나)"
    questions: ["힙 덤프와 스레드 덤프를 함께 떠야 하는 경우는 언제인가", "운영에서 늘 켜 둘 수 있는 프로파일러는 무엇인가"]
    contains: [rt-jcmd, rt-thread-dump, rt-heap-dump, rt-jfr, rt-async-profiler, rt-nmt, rt-jstat]
    flows_to: [rt-out-of-memory]
  - id: rt-jcmd
    kind: MECHANISM
    name: "jcmd"
    category: BASICS
    level: INTERMEDIATE
    description: "실행 중 JVM 에 진단 명령을 보내는 표준 도구. Thread.print·GC.heap_dump·GC.class_histogram·JFR.start·VM.native_memory·VM.flags 를 한 창구로 부른다. jstack·jmap·jinfo 를 대신한다"
    synonyms: ["jcmd", "jmap", "jinfo", "Attach API"]
  - id: rt-thread-dump
    kind: MECHANISM
    name: "스레드 덤프"
    category: BASICS
    level: INTERMEDIATE
    description: "모든 스레드의 상태·스택·쥔 락·기다리는 락을 한순간 찍는다(jcmd Thread.print, jstack, kill -3). 5~10 초 간격으로 여러 장 떠서 같은 자리에 머무는 스레드를 찾는다"
    synonyms: ["thread dump", "jstack", "Thread.print", "kill -3"]
    uses: [rt-jcmd, conc-thread-state]
  - id: rt-heap-dump
    kind: MECHANISM
    name: "힙 덤프"
    category: BASICS
    level: INTERMEDIATE
    description: "힙의 모든 객체와 참조를 hprof 파일로 떠낸다(jcmd GC.heap_dump). 뜨는 동안 전체가 멈추고 힙 크기만큼 디스크가 든다. OOM 때 자동으로 뜨게 해 둔다"
    synonyms: ["heap dump", "hprof", "GC.heap_dump", "jmap -dump"]
    contains: [rt-heap-dump-analysis, rt-heap-dump-on-oom]
    uses: [rt-jcmd]
  - id: rt-heap-dump-analysis
    kind: MECHANISM
    name: "힙 덤프 분석"
    category: BASICS
    level: ADVANCED
    description: "Eclipse MAT 로 지배자 트리(dominator tree)에서 가장 많은 메모리를 붙잡은 객체를 찾고, GC 루트까지의 경로로 누가 놓아주지 않는지 본다. 히스토그램·OQL·Leak Suspects 로 보조한다"
    synonyms: ["Eclipse MAT", "dominator tree", "path to GC roots", "OQL", "Leak Suspects"]
    uses: [rt-shallow-retained-size, rt-gc-root]
    mitigates: [rt-memory-leak]
  - id: rt-heap-dump-on-oom
    kind: MECHANISM
    name: "OOM 시 자동 덤프"
    category: BASICS
    level: INTERMEDIATE
    description: "-XX:+HeapDumpOnOutOfMemoryError 와 HeapDumpPath 로 OOM 순간의 힙을 남기고, ExitOnOutOfMemoryError 로 반쯤 죽은 프로세스를 재시작시킨다. 경로는 컨테이너가 다시 떠도 남는 볼륨이어야 한다"
    synonyms: ["HeapDumpOnOutOfMemoryError", "ExitOnOutOfMemoryError", "CrashOnOutOfMemoryError"]
  - id: rt-jfr
    kind: MECHANISM
    name: "JFR"
    category: BASICS
    level: ADVANCED
    description: "JVM 에 내장된 이벤트 기록기. CPU 샘플·할당·GC·락·IO·예외 이벤트를 1~2% 오버헤드로 순환 버퍼에 남겨 운영에서 늘 켜 둘 수 있다. JMC 로 읽고, 사용자 이벤트도 만들 수 있다"
    synonyms: ["Java Flight Recorder", "JMC", "JDK Mission Control", "JFR.start", "jdk.ObjectAllocationSample"]
  - id: rt-async-profiler
    kind: MECHANISM
    name: "async-profiler"
    category: BASICS
    level: ADVANCED
    description: "세이프포인트 편향 없이 CPU·할당·락·wall-clock 을 샘플링해 플레임 그래프로 보여 주는 저오버헤드 프로파일러. 네이티브·커널 프레임까지 한 스택에 잡는다"
    synonyms: ["async-profiler", "flame graph", "AsyncGetCallTrace"]
    alternative_to:
      - { to: rt-jfr, reason: "세이프포인트 편향 없는 샘플과 네이티브 프레임을 보고 싶을 때 쓴다" }
  - id: rt-nmt
    kind: MECHANISM
    name: "NMT"
    category: BASICS
    level: ADVANCED
    description: "JVM 이 힙 밖 메모리를 Java Heap·Class·Thread·Code·GC·Internal·Symbol 로 나눠 스스로 센다. summary 로 켜고 jcmd VM.native_memory baseline·summary.diff 로 증가분을 본다. 5~10% 오버헤드가 있고 malloc 아레나 여유는 못 본다"
    synonyms: ["Native Memory Tracking", "-XX:NativeMemoryTracking", "VM.native_memory"]
    code:
      - { path: k8s/infra/local/opensearch/statefulset.yaml, symbol: "-XX:NativeMemoryTracking=summary", note: "검색 노드의 힙 밖 메모리를 영역별로 보려고 켠다" }
    uses: [rt-jcmd, rt-native-memory]
  - id: rt-jstat
    kind: MECHANISM
    name: "jstat"
    category: BASICS
    level: INTERMEDIATE
    description: "세대별 점유·GC 횟수·누적 시간을 주기적으로 찍는 가벼운 모니터. jstat -gcutil <pid> 1s 로 GC 가 도는 모양을 바로 본다"
    synonyms: ["jstat", "-gcutil"]

  # ── 메모리 부족 ──
  - id: rt-out-of-memory
    kind: STAGE
    name: "메모리 부족 대응"
    category: BASICS
    level: ADVANCED
    description: "OutOfMemoryError 의 메시지와 OOMKilled 를 구별해 어느 영역이 모자랐는지부터 가른다. 영역마다 원인·진단·해결이 다르다"
    questions: ["OOM 다섯 종류를 메시지로 구분해 보라", "Java heap space OOM 과 OOMKilled 는 무엇이 다른가"]
    contains: [rt-exit-on-oom, rt-oom-heap-space, rt-oom-metaspace, rt-oom-gc-overhead, rt-oom-direct-buffer, rt-oom-native-thread, rt-oom-array-size, rt-memory-leak]
    uses: [rt-heap-dump-on-oom, rt-nmt]
  - id: rt-exit-on-oom
    kind: MECHANISM
    name: "OOM 뒤 종료"
    category: BASICS
    level: INTERMEDIATE
    description: "OOM 을 잡아 버티는 대신 프로세스를 끝내 오케스트레이터가 새로 띄우게 한다. OOM 뒤 JVM 은 일부 스레드만 죽은 불확실한 상태라 계속 돌리면 조용한 장애가 된다"
    synonyms: ["ExitOnOutOfMemoryError", "fail fast"]
    uses: [rt-heap-dump-on-oom]
  - id: rt-oom-heap-space
    kind: PROBLEM
    name: "OOM: Java heap space"
    category: BASICS
    level: INTERMEDIATE
    description: "GC 를 해도 새 객체를 놓을 힙이 없다. 힙이 작거나(정상 부하) 누수이거나(GC 뒤 점유가 계속 오름) 한 번에 너무 큰 컬렉션을 만든 것이다"
    synonyms: ["java.lang.OutOfMemoryError: Java heap space"]
  - id: rt-oom-metaspace
    kind: PROBLEM
    name: "OOM: Metaspace"
    category: BASICS
    level: ADVANCED
    description: "클래스 메타데이터가 MaxMetaspaceSize(또는 네이티브 한계)에 닿았다. 동적 프록시·스크립트 엔진의 클래스 생성이나 재배포 클래스로더 누수가 원인이다"
    synonyms: ["java.lang.OutOfMemoryError: Metaspace", "PermGen space"]
  - id: rt-oom-gc-overhead
    kind: PROBLEM
    name: "OOM: GC overhead limit exceeded"
    category: BASICS
    level: ADVANCED
    description: "시간의 98% 이상을 GC 에 쓰고도 힙의 2% 도 못 되찾는 상태가 이어져 Parallel GC 가 포기했다. 사실상 힙 부족이 천천히 온 것이다"
    synonyms: ["GC overhead limit exceeded", "UseGCOverheadLimit"]
  - id: rt-oom-direct-buffer
    kind: PROBLEM
    name: "OOM: Direct buffer memory"
    category: BASICS
    level: ADVANCED
    description: "다이렉트 버퍼 합계가 MaxDirectMemorySize 에 닿았다. Netty 버퍼 미반납이나, 힙이 커서 GC 가 드물어 버퍼를 쥔 작은 객체가 치워지지 않는 것이 원인이다"
    synonyms: ["java.lang.OutOfMemoryError: Direct buffer memory"]
  - id: rt-oom-native-thread
    kind: PROBLEM
    name: "OOM: unable to create native thread"
    category: BASICS
    level: ADVANCED
    description: "OS 가 스레드를 더 만들어 주지 않는다 — 프로세스·cgroup 의 pid 한도(ulimit -u, pids.max)나 스택 메모리가 바닥났다. 대개 무한히 늘어나는 풀이나 스레드 누수다"
    synonyms: ["unable to create native thread", "pids.max", "ulimit -u"]
  - id: rt-oom-array-size
    kind: PROBLEM
    name: "OOM: Requested array size exceeds VM limit"
    category: BASICS
    level: ADVANCED
    description: "Integer.MAX_VALUE 에 가까운 길이의 배열을 요청했다. 힙이 넉넉해도 난다. 크기 계산 오버플로나 끝없이 커지는 버퍼가 원인이다"
    synonyms: ["Requested array size exceeds VM limit"]
  - id: rt-memory-leak
    kind: PROBLEM
    name: "메모리 누수"
    category: BASICS
    level: INTERMEDIATE
    description: "더 쓰지 않는 객체를 어딘가의 강한 참조가 계속 쥐어 GC 가 치우지 못하는 상태. 크기 제한 없는 캐시·static 컬렉션·해제 안 한 리스너·ThreadLocal·클래스로더가 흔한 자리다"
    synonyms: ["memory leak", "unbounded cache"]
    causes: [rt-oom-heap-space]
    measured_by: [rt-heap-occupancy]

  # ── 용어 ──
  - id: runtime-glossary
    kind: TERM
    name: "JVM · 런타임 용어 사전"
    category: BASICS
    level: BEGINNER
    description: "JVM 과 운영체제 메모리를 읽는 데 필요한 말을 메모리·GC·실행·OS 넷으로 나눠 모은다"
    synonyms: ["glossary", "용어집"]
    contains: [rt-glossary-memory, rt-glossary-gc, rt-glossary-execution, rt-glossary-os]
  - id: rt-glossary-memory
    kind: TERM
    name: "메모리 구조 용어"
    category: BASICS
    level: BEGINNER
    description: "JVM 안의 메모리 구성 요소와 객체 크기를 말하는 용어"
    contains: [rt-pc-register, rt-stack-frame, rt-oop, rt-mark-word, rt-klass-pointer, rt-shallow-retained-size, rt-live-set]
  - id: rt-pc-register
    kind: TERM
    name: "PC 레지스터"
    category: BASICS
    level: BEGINNER
    description: "스레드마다 지금 실행 중인 바이트코드 명령의 주소를 담는 작은 영역. 네이티브 메서드를 실행 중이면 비어 있다"
    synonyms: ["Program Counter register"]
  - id: rt-stack-frame
    kind: TERM
    name: "스택 프레임"
    category: BASICS
    level: BEGINNER
    description: "메서드 호출 하나가 스택에 차지하는 칸. 지역 변수 배열·피연산자 스택·상수 풀 참조·반환 주소를 담고 메서드가 끝나면 사라진다"
    synonyms: ["stack frame", "local variables", "operand stack"]
  - id: rt-oop
    kind: TERM
    name: "OOP"
    category: BASICS
    level: ADVANCED
    description: "HotSpot 안에서 자바 객체를 가리키는 포인터(Ordinary Object Pointer). 압축되면 32비트다"
    synonyms: ["ordinary object pointer", "narrow oop"]
  - id: rt-mark-word
    kind: TERM
    name: "Mark Word"
    category: BASICS
    level: ADVANCED
    description: "객체 헤더의 첫 워드. 해시코드·GC 나이(4비트)·락 상태 비트를 담고, 잠겨 있으면 락 기록이나 모니터를 가리킨다"
    synonyms: ["mark word"]
  - id: rt-klass-pointer
    kind: TERM
    name: "Klass 포인터"
    category: BASICS
    level: ADVANCED
    description: "객체가 어느 클래스인지 가리키는 헤더의 둘째 필드. Metaspace 의 클래스 구조를 가리키며 보통 32비트로 압축된다"
    synonyms: ["klass pointer", "compressed class pointer"]
  - id: rt-shallow-retained-size
    kind: TERM
    name: "Shallow · Retained 크기"
    category: BASICS
    level: INTERMEDIATE
    description: "Shallow 는 객체 자신의 크기, Retained 는 그 객체가 사라지면 함께 회수될 모든 객체의 크기다. 누수 범인은 Retained 가 큰 객체다"
    synonyms: ["shallow heap", "retained heap"]
  - id: rt-live-set
    kind: TERM
    name: "라이브 셋"
    category: BASICS
    level: INTERMEDIATE
    description: "어떤 순간 실제로 살아 있는 객체의 총량. Full GC 직후 힙 사용량으로 어림하고, 힙 크기를 정하는 기준이 된다"
    synonyms: ["live set", "live data size"]
  - id: rt-glossary-gc
    kind: TERM
    name: "GC 용어"
    category: BASICS
    level: BEGINNER
    description: "가비지 수집을 설명하는 기본 용어"
    contains: [rt-gc-root, rt-mutator, rt-stop-the-world, rt-weak-generational-hypothesis, rt-object-age, rt-floating-garbage]
  - id: rt-gc-root
    kind: TERM
    name: "GC 루트"
    category: BASICS
    level: BEGINNER
    description: "도달성 탐색을 시작하는 참조 — 스레드 스택의 지역 변수, 클래스의 static 필드, JNI 참조, 모니터로 잡힌 객체, 살아 있는 스레드 객체"
    synonyms: ["GC roots"]
  - id: rt-mutator
    kind: TERM
    name: "뮤테이터"
    category: BASICS
    level: INTERMEDIATE
    description: "GC 입장에서 본 애플리케이션 스레드. 객체 그래프를 바꾸는(mutate) 쪽이라 이렇게 부른다"
    synonyms: ["mutator"]
  - id: rt-stop-the-world
    kind: TERM
    name: "Stop-The-World"
    category: BASICS
    level: BEGINNER
    description: "GC 가 일하는 동안 모든 애플리케이션 스레드를 세이프포인트에 세워 두는 것. 요청이 그동안 한꺼번에 밀린다"
    synonyms: ["STW", "GC pause"]
  - id: rt-weak-generational-hypothesis
    kind: TERM
    name: "약한 세대 가설"
    category: BASICS
    level: BEGINNER
    description: "대부분의 객체는 태어나자마자 죽고, 오래 산 객체가 젊은 객체를 가리키는 일은 드물다는 관찰. 세대별 수집이 이 위에 선다. 캐시처럼 오래 사는 객체가 많은 부하에서는 맞지 않는다"
    synonyms: ["weak generational hypothesis", "infant mortality"]
  - id: rt-object-age
    kind: TERM
    name: "객체 나이"
    category: BASICS
    level: INTERMEDIATE
    description: "객체가 살아남은 Young GC 횟수. Mark Word 의 4비트라 최대 15 다"
    synonyms: ["object age", "tenuring age"]
  - id: rt-floating-garbage
    kind: TERM
    name: "떠 있는 쓰레기"
    category: BASICS
    level: ADVANCED
    description: "동시 마킹 도중 죽었지만 이번 사이클에는 산 것으로 표시돼 다음 사이클까지 남는 객체. 동시 컬렉터가 여유 힙을 더 요구하는 이유다"
    synonyms: ["floating garbage"]
  - id: rt-glossary-execution
    kind: TERM
    name: "실행 용어"
    category: BASICS
    level: INTERMEDIATE
    description: "바이트코드 실행과 JIT 를 설명하는 용어"
    contains: [rt-bytecode, rt-class-file, rt-hot-method, rt-speculative-optimization, rt-call-site-morphism]
  - id: rt-bytecode
    kind: TERM
    name: "바이트코드"
    category: BASICS
    level: BEGINNER
    description: "javac·kotlinc 가 내놓는 JVM 명령어. 피연산자 스택에 값을 쌓고 꺼내는 스택 머신 명령이라 CPU 와 무관하게 이식된다"
    synonyms: ["bytecode", "javap"]
  - id: rt-class-file
    kind: TERM
    name: "클래스 파일"
    category: BASICS
    level: INTERMEDIATE
    description: "클래스 하나를 담은 .class 파일. 매직 넘버·버전·상수 풀·필드·메서드(바이트코드)·속성으로 이뤄지고, 버전이 JVM 보다 높으면 UnsupportedClassVersionError 가 난다"
    synonyms: [".class", "constant pool", "class file format"]
  - id: rt-hot-method
    kind: TERM
    name: "핫 메서드"
    category: BASICS
    level: INTERMEDIATE
    description: "호출·루프 반복이 컴파일 문턱을 넘은 뜨거운 코드. HotSpot 이라는 이름이 여기서 왔다 — 뜨거운 곳만 공들여 컴파일한다"
    synonyms: ["hot spot", "hot method", "CompileThreshold"]
  - id: rt-speculative-optimization
    kind: TERM
    name: "추측 최적화"
    category: BASICS
    level: ADVANCED
    description: "지금까지 본 프로파일(타입·분기·null 여부)이 앞으로도 맞는다고 가정하고 그 경우만 빠르게 컴파일하는 것. 가정이 깨지면 역최적화한다"
    synonyms: ["speculative optimization", "profile-guided optimization", "uncommon trap"]
  - id: rt-call-site-morphism
    kind: TERM
    name: "호출 지점 형태"
    category: BASICS
    level: ADVANCED
    description: "한 호출 지점에서 관찰된 실제 타입 수. 하나면 monomorphic, 둘이면 bimorphic 으로 인라인되고, 셋 이상 megamorphic 이면 가상 호출로 남는다"
    synonyms: ["monomorphic", "bimorphic", "megamorphic", "inline cache"]
  - id: rt-glossary-os
    kind: TERM
    name: "OS 메모리 용어"
    category: BASICS
    level: INTERMEDIATE
    description: "운영체제와 하드웨어 눈으로 메모리를 말하는 용어"
    contains: [rt-kernel-slab, rt-cache-line, rt-exit-code-137]
  - id: rt-kernel-slab
    kind: TERM
    name: "slab"
    category: BASICS
    level: ADVANCED
    description: "커널 자료구조(dentry·inode·소켓 버퍼)를 담는 커널 메모리. 파일을 많이 열거나 연결이 많으면 자라고, 컨테이너 한도에도 잡힌다"
    synonyms: ["slab", "kernel memory", "slabtop"]
  - id: rt-cache-line
    kind: TERM
    name: "캐시 라인"
    category: BASICS
    level: INTERMEDIATE
    description: "CPU 캐시와 메모리가 주고받는 최소 단위, 보통 64 바이트. 1 바이트를 읽어도 라인 전체가 오고, 한 코어가 라인의 어느 바이트든 쓰면 다른 코어의 그 라인 사본이 무효가 된다"
    synonyms: ["cache line", "64 bytes"]
  - id: rt-exit-code-137
    kind: TERM
    name: "종료 코드 137"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "128 + 9(SIGKILL). 컨테이너가 이 코드로 죽었다면 앱 버그가 아니라 외부에서 강제로 죽인 것이고, 대개 메모리 한도 초과다. 143(SIGTERM)은 정상 종료 경로다"
    synonyms: ["exit 137", "SIGKILL", "exit 143"]
