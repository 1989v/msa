# 추천 온톨로지 — 원본은 이 파일이다 (ADR-0100, docs/specs/2026-09-24-concept-atlas).
# 바꾸면 manifest.yaml 의 revision 을 올린다. 간선은 from 개념에만 적는다.
# 재료: study/docs/20-recommendation-modeling · recommendation/ · ADR-0044~0049 · 분야 표준(Recommender Systems Handbook · Aggarwal).
# A/B · 밴딧 기본 · 임베딩 · ANN · nDCG 는 search 소유다 — 여기서는 USES · MEASURED_BY 로 잇는다.
domain: recommendation
root: recommendation-system
concepts:
  - id: recommendation-system
    kind: DOMAIN
    name: "추천"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "검색어 없이 사용자가 좋아할 아이템을 고른다. 수천만 후보를 후보 생성 → 랭킹 → 재정렬 퍼널로 좁히고, 피드백이 다음 학습으로 돌아온다"
    synonyms: ["recommender system", "RecSys"]
    questions:
      - "추천이 검색과 다른 점은 입력과 평가에서 무엇인가"
    contains: [rec-signal-collection, rec-score-correction, rec-candidate-retrieval, rec-ranking, rec-reranking, rec-cold-start, rec-serving, rec-evaluation, rec-glossary]

  # ── 신호 수집 ─────────────────────────────────────────────
  - id: rec-signal-collection
    kind: STAGE
    name: "행동 신호 수집"
    category: DATA
    level: BEGINNER
    description: "평점 같은 명시 피드백과 조회 · 클릭 · 찜 · 구매 같은 암묵 피드백을 모아 사용자 × 아이템 상호작용으로 만든다"
    questions:
      - "암묵 피드백에서 「안 눌렀다」는 싫다는 뜻인가"
      - "행동별 가중치 100 : 20 : 10 : 1 은 무엇에서 나온 비율인가"
    contains: [explicit-feedback, implicit-feedback, rec-action-weighting, rec-realtime-reward-aggregation, rec-data-sparsity]
    uses: [rec-interaction-matrix, impression-click-ledger]
    flows_to: [rec-score-correction]
  - id: explicit-feedback
    kind: MECHANISM
    name: "명시 피드백"
    category: DATA
    level: BEGINNER
    description: "별점 · 좋아요처럼 사용자가 선호를 직접 밝힌 신호다. 뜻이 분명하지만 양이 적고 남기는 사람이 치우친다"
    synonyms: ["explicit feedback", "rating"]
    alternative_to: [implicit-feedback]
  - id: implicit-feedback
    kind: MECHANISM
    name: "암묵 피드백"
    category: DATA
    level: BEGINNER
    description: "조회 · 클릭 · 체류 · 구매처럼 행동에서 추정한 선호다. 양은 많지만 부정 신호가 없고(안 본 것 ≠ 싫은 것) 확신도가 행동마다 다르다"
    synonyms: ["implicit feedback", "one-class feedback"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/kafka/RecommendationEventConsumer.kt, symbol: "class RecommendationEventConsumer", note: "analytics 이벤트에서 추천 행동을 받는다" }
  - id: rec-action-weighting
    kind: MECHANISM
    name: "행동 가중합"
    category: ALGORITHM
    level: BEGINNER
    description: "행동마다 가중치를 곱해 더한다(예약 × 100 + 클릭 × 20 + 찜 × 10 + 조회 × 1). 비율은 퍼널 전환율의 역수에서 나오고 최적화 목표(CTR · CVR · GMV)에 따라 바뀐다"
    synonyms: ["action-weighted score", "weighted interaction"]
    code:
      - { path: recommendation/domain/src/main/kotlin/com/kgd/recommendation/domain/recommendation/policy/ActionWeightedScore.kt, symbol: "object ActionWeightedScore", note: "가중치는 도메인이 소유" }
    contains: [rec-dynamic-action-weight]
  - id: rec-dynamic-action-weight
    kind: MECHANISM
    name: "동적 행동 가중치"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "카테고리마다 전환 구조가 달라 고정 비율이 맞지 않을 때, 카테고리별 전환율로 가중치를 다시 계산한다"
    synonyms: ["dynamic weight"]
  - id: rec-realtime-reward-aggregation
    kind: MECHANISM
    name: "실시간 보상 집계"
    category: DATA
    level: INTERMEDIATE
    description: "노출 · 클릭을 스트림으로 받아 변형별 보상을 바로 갱신한다. 일 배치 집계를 기다리지 않고 밴딧이 반응하게 한다"
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/kafka/RecommendationClickConsumer.kt, symbol: "class RecommendationClickConsumer", note: "클릭 → 밴딧 보상 갱신 (ADR-0049 Phase 7)" }
    uses: [kafka]
  - id: rec-data-sparsity
    kind: PROBLEM
    name: "데이터 희소성"
    category: DATA
    level: BEGINNER
    description: "사용자 × 아이템 행렬의 99% 이상이 비어 있다. 두 아이템을 같이 본 사람이 거의 없어 유사도가 잡음이 된다"
    synonyms: ["sparsity"]

  # ── 점수 보정 ─────────────────────────────────────────────
  - id: rec-score-correction
    kind: STAGE
    name: "점수 보정"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "노출이 적은 아이템의 CTR 은 우연에 크게 흔들린다. 신뢰구간 하한이나 사전 분포로 당겨 적은 표본이 1위를 차지하지 않게 한다"
    questions:
      - "노출 2회 클릭 2회인 아이템을 CTR 100% 로 줄 세우면 무엇이 틀리나"
      - "Wilson 하한과 베이지안 평활은 언제 무엇을 고르나"
    contains: [wilson-score, bayesian-smoothing, rec-small-sample-distortion]
    flows_to: [rec-candidate-retrieval]
  - id: wilson-score
    kind: MECHANISM
    name: "Wilson 점수 하한"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "클릭률의 Wilson 신뢰구간 하한(LCB)으로 줄 세운다. 표본이 적으면 하한이 낮아 자동으로 뒤로 간다. Wald 구간과 달리 0 · 1 근처에서도 무너지지 않는다"
    synonyms: ["Wilson score interval", "lower confidence bound", "LCB"]
    code:
      - { path: common/src/main/kotlin/com/kgd/common/statistics/Wilson.kt, symbol: "fun lowerConfidenceBound(positives: Long, total: Long, z: Double = 1.96): Double", note: "공용 Wilson 하한" }
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/sync/CbScoreSync.kt, symbol: "Wilson.lowerConfidenceBound(row.clickCount, ctrTotal)", note: "행동 가중합 × log(1 + Wilson CTR × 100)" }
    mitigates: [rec-small-sample-distortion]
    alternative_to: [bayesian-smoothing]
  - id: bayesian-smoothing
    kind: MECHANISM
    name: "베이지안 평활"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "CTR 에 베타 사전 분포를 두고 (클릭 + α) ÷ (노출 + α + β) 로 전체 평균 쪽으로 당긴다. 사전값은 전체 아이템 분포에서 추정한다(Empirical Bayes)"
    synonyms: ["Bayesian smoothing", "Beta-Binomial", "Empirical Bayes", "additive smoothing"]
    uses: [beta-bernoulli-conjugate]
    mitigates: [rec-small-sample-distortion]
  - id: rec-small-sample-distortion
    kind: PROBLEM
    name: "적은 표본 점수 왜곡"
    category: ALGORITHM
    level: BEGINNER
    description: "노출이 몇 번뿐인 아이템의 관측 CTR 이 극단값으로 튀어 상위를 차지한다"
    synonyms: ["small sample bias"]

  # ── 후보 생성 ─────────────────────────────────────────────
  - id: rec-candidate-retrieval
    kind: STAGE
    name: "후보 생성 (리트리벌)"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "수천만 아이템에서 수백 개를 recall 위주로 빠르게 뽑는다. 룰 · 콘텐츠 · 협업 · 임베딩 · 위치 소스 여러 개를 합친다"
    synonyms: ["retrieval", "candidate generation", "recall stage"]
    questions:
      - "후보 생성과 랭킹을 한 모델로 하지 않는 이유는"
      - "Two-Tower 와 Two-Stage 는 어떻게 다른가"
    contains: [rec-rule-based-retrieval, rec-content-based, rec-collaborative, rec-embedding-retrieval, rec-geo-retrieval, hybrid-recommendation]
    measured_by: [srch-recall-at-k]
    flows_to: [rec-ranking]
  - id: rec-rule-based-retrieval
    kind: STAGE
    name: "룰 기반 추천"
    category: ALGORITHM
    level: BEGINNER
    description: "모델 없이 집계 규칙으로 목록을 만든다. 개인화는 약하지만 콜드 스타트의 안전망이고 첫 단계로 도입한다"
    contains: [popularity-recommendation, rec-category-best, rec-seasonal-window, rec-ctr-best, rec-repurchase-best]
    flows_to: [rec-content-based]
  - id: popularity-recommendation
    kind: MECHANISM
    name: "인기 추천"
    category: ALGORITHM
    level: BEGINNER
    description: "전체 또는 구간에서 가장 많이 팔리거나 본 것을 보인다. 개인화 기준선이자 모든 폴백의 마지막 단이다"
    synonyms: ["popularity baseline", "most popular", "best seller"]
    causes: [rec-popularity-bias]
  - id: rec-category-best
    kind: MECHANISM
    name: "카테고리 베스트"
    category: ALGORITHM
    level: BEGINNER
    description: "도시 × 카테고리 같은 분할마다 보정 점수 Top-N 을 미리 계산해 캐시에 둔다(ADR-0044 Phase 1)"
    synonyms: ["Category Best", "segment popularity"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/application/recommendation/service/CategoryBestService.kt, symbol: "class CategoryBestService(", note: "도시 × 카테고리 Top-N" }
    uses: [rec-action-weighting, wilson-score]
  - id: rec-seasonal-window
    kind: MECHANISM
    name: "시즌 슬라이딩 윈도"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "작년 같은 날짜 ±7일 같은 구간의 행동만 모아 시즌 인기를 만든다. 장기 인기와 섞는 비율이 균형점이다"
    synonyms: ["seasonality", "sliding window"]
  - id: rec-ctr-best
    kind: MECHANISM
    name: "CTR 베스트"
    category: ALGORITHM
    level: BEGINNER
    description: "중기 CTR 로 줄 세운다. 노출이 적은 아이템 보정 없이는 우연히 높은 것이 올라온다"
    uses: [wilson-score]
  - id: rec-repurchase-best
    kind: MECHANISM
    name: "재구매 베스트"
    category: ALGORITHM
    level: BEGINNER
    description: "같은 사람이 다시 산 비율로 충성 신호를 본다. 소모품 · 반복 소비 도메인에서만 뜻이 있다"
    synonyms: ["resale best", "repeat purchase"]
  - id: rec-content-based
    kind: STAGE
    name: "콘텐츠 기반 추천"
    category: ALGORITHM
    level: BEGINNER
    description: "아이템 속성(카테고리 · 태그 · 텍스트)이 사용자가 좋아한 것과 닮은 것을 고른다. 행동이 없는 새 아이템에도 쓸 수 있다"
    synonyms: ["content-based filtering", "CB"]
    questions:
      - "콘텐츠 기반이 과도한 특화(비슷한 것만 반복)에 빠지는 이유는"
    contains: [content-based-filtering, more-like-this, rec-text-embedding-similarity]
    flows_to: [rec-collaborative]
  - id: content-based-filtering
    kind: MECHANISM
    name: "콘텐츠 기반 필터링"
    category: ALGORITHM
    level: BEGINNER
    description: "아이템을 속성 벡터로, 사용자를 좋아한 아이템 벡터의 합으로 만들어 유사도로 줄 세운다"
    synonyms: ["CBF", "item profile", "user profile"]
    uses: [cosine-similarity]
    causes: [filter-bubble]
    alternative_to: [collaborative-filtering]
  - id: more-like-this
    kind: MECHANISM
    name: "MoreLikeThis"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "기준 문서의 대표 단어(TF-IDF 상위)로 질의를 만들어 검색 엔진에서 비슷한 문서를 찾는다. 동의어 · 다국어 · 짧은 텍스트에 약하다"
    synonyms: ["MLT", "TF-IDF similarity"]
    uses: [bm25, opensearch]
    alternative_to: [rec-text-embedding-similarity]
  - id: rec-text-embedding-similarity
    kind: MECHANISM
    name: "텍스트 임베딩 유사 아이템"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "아이템 설명을 문장 임베딩(Sentence-BERT 류)으로 바꿔 ANN 으로 가까운 것을 찾는다. 단어가 달라도 뜻이 같으면 잡는다"
    synonyms: ["Sentence-BERT", "semantic similar items"]
    uses: [embedding-model, ann-search]
  - id: rec-collaborative
    kind: STAGE
    name: "협업 필터링"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "속성이 아니라 「같이 본 사람들」로 비슷함을 정한다. 이웃 기반과 행렬 분해 두 계열이 있다"
    synonyms: ["collaborative filtering", "CF"]
    questions:
      - "사용자 기반보다 아이템 기반 CF 가 운영에서 흔한 이유는"
      - "코사인 · Jaccard · PMI 는 인기 아이템에 각각 어떻게 반응하나"
    contains: [collaborative-filtering, rec-similarity-metric, matrix-factorization, rec-popularity-bias]
    flows_to: [rec-embedding-retrieval]
  - id: collaborative-filtering
    kind: MECHANISM
    name: "이웃 기반 협업 필터링"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "비슷한 사용자가 좋아한 것(사용자 기반) 또는 내가 좋아한 것과 같이 소비된 것(아이템 기반)을 고른다. 공출현 행렬과 유사도 지표가 핵심이다"
    synonyms: ["memory-based CF", "neighborhood CF", "kNN CF"]
    contains: [user-based-cf, item-based-cf]
    uses: [rec-co-occurrence]
  - id: user-based-cf
    kind: MECHANISM
    name: "사용자 기반 CF"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "나와 행동이 비슷한 사용자들이 좋아한 것을 추천한다. 사용자 수가 아이템보다 많고 취향이 빨리 변해 이웃 계산이 비싸고 불안정하다"
    synonyms: ["user-user CF"]
    alternative_to: [item-based-cf]
  - id: item-based-cf
    kind: MECHANISM
    name: "아이템 기반 CF"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "같이 본 · 같이 산 아이템끼리의 유사도를 미리 계산해 두고, 사용자가 본 아이템의 이웃을 모은다(Amazon 2003). 아이템 관계가 느리게 변해 배치 계산이 잘 맞는다"
    synonyms: ["item-item CF", "people also viewed", "co-view", "co-purchase"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/persistence/ClickHouseItemSimilarityComputer.kt, symbol: "class ClickHouseItemSimilarityComputer(", note: "아이템 × 아이템 PPMI 를 ClickHouse 에서 계산 (ADR-0044 Phase 2)" }
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/application/recommendation/service/SimilarItemsService.kt, symbol: "class SimilarItemsService(", note: "유사 아이템 + 절반 미만이면 폴백" }
    uses: [pmi, clickhouse]
  - id: rec-similarity-metric
    kind: MECHANISM
    name: "유사도 지표"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "두 아이템(사용자)이 얼마나 닮았는지 재는 식이다. 희소성과 인기 편향에 따라 고른다"
    synonyms: ["similarity measure"]
    contains: [jaccard-similarity, pmi, lift, pearson-correlation]
    uses: [cosine-similarity]
  - id: jaccard-similarity
    kind: MECHANISM
    name: "Jaccard 유사도"
    category: ALGORITHM
    level: BEGINNER
    description: "두 집합의 교집합 ÷ 합집합이다. 이진 상호작용에 맞고 빈도를 무시한다"
    synonyms: ["Jaccard index"]
  - id: pmi
    kind: MECHANISM
    name: "PMI · PPMI"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "log(P(i,j) ÷ (P(i)P(j))) — 우연히 같이 나올 기대보다 얼마나 더 같이 나왔는지다. 인기 아이템이 모든 쌍을 차지하는 것을 막고, 음수를 0 으로 자른 PPMI 가 산업 표준이다"
    synonyms: ["Pointwise Mutual Information", "PPMI", "Positive PMI"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/persistence/ClickHouseItemSimilarityComputer.kt, symbol: "PPMI(i,j) = max(0, log( P(i,j) / (P(i) × P(j)) ))", note: "PPMI 식" }
    mitigates: [rec-popularity-bias]
  - id: lift
    kind: MECHANISM
    name: "Lift"
    category: ALGORITHM
    level: BEGINNER
    description: "P(j|i) ÷ P(j) — 장바구니 분석에서 온 지표로 PMI 의 로그를 뗀 값이다. 1 보다 크면 함께 살 경향이 있다"
    synonyms: ["association rule lift", "market basket"]
  - id: pearson-correlation
    kind: MECHANISM
    name: "피어슨 상관"
    category: ALGORITHM
    level: BEGINNER
    description: "평균을 빼고 잰 코사인이다. 별점처럼 사람마다 기준이 다른 명시 피드백에서 짜게 · 후하게 주는 습관을 지운다"
    synonyms: ["Pearson correlation", "adjusted cosine"]
  - id: matrix-factorization
    kind: MECHANISM
    name: "행렬 분해"
    category: ALGORITHM
    level: ADVANCED
    description: "사용자 × 아이템 행렬을 저차원 사용자 벡터와 아이템 벡터의 곱으로 근사한다. 비어 있는 칸을 잠재 요인의 내적으로 채운다(Netflix Prize)"
    synonyms: ["MF", "latent factor model", "model-based CF"]
    questions:
      - "SVD 를 추천 행렬에 그대로 못 쓰는 이유는"
      - "암묵 피드백용 ALS 는 명시 MF 와 목적 함수가 어떻게 다른가"
    contains: [svd, funk-svd, als, implicit-als, rec-sgd]
    uses: [rec-latent-factor, rec-regularization]
    mitigates: [rec-data-sparsity]
  - id: svd
    kind: MECHANISM
    name: "SVD"
    category: ALGORITHM
    level: ADVANCED
    description: "행렬을 직교 행렬 둘과 특이값으로 정확히 분해한다. 빈칸을 0 으로 채워야 해 추천 행렬에는 그대로 못 쓴다"
    synonyms: ["Singular Value Decomposition", "truncated SVD"]
  - id: funk-svd
    kind: MECHANISM
    name: "FunkSVD"
    category: ALGORITHM
    level: ADVANCED
    description: "관측된 칸만으로 오차 제곱 + 정규화 항을 SGD 로 줄인다. 사용자 · 아이템 편향 항을 더한 것이 Koren 의 bias MF(SVD++ 계열)다"
    synonyms: ["Funk SVD", "biased MF", "SVD++"]
    uses: [rec-sgd]
  - id: als
    kind: MECHANISM
    name: "ALS"
    category: ALGORITHM
    level: ADVANCED
    description: "사용자 벡터를 고정하고 아이템 벡터를 최소제곱으로 풀고, 번갈아 반복한다. 각 단계가 독립이라 분산 학습(Spark MLlib)에 맞는다"
    synonyms: ["Alternating Least Squares"]
    alternative_to: [rec-sgd]
  - id: implicit-als
    kind: MECHANISM
    name: "암묵 피드백 ALS"
    category: ALGORITHM
    level: ADVANCED
    description: "모든 칸을 선호(0/1) × 확신도(1 + α × 횟수)로 가중해 학습한다(Hu · Koren · Volinsky 2008). 안 본 칸도 약한 부정으로 쓴다"
    synonyms: ["weighted MF", "WRMF", "iALS"]
    uses: [implicit-feedback]
  - id: rec-sgd
    kind: MECHANISM
    name: "SGD 학습"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "관측 하나씩 오차 기울기로 벡터를 조금씩 고친다. 구현이 쉽고 특징 · 편향을 더하기 쉽지만 분산이 어렵다"
    synonyms: ["Stochastic Gradient Descent"]
  - id: rec-popularity-bias
    kind: PROBLEM
    name: "인기 편향"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "많이 팔린 것이 더 많이 추천되고 그래서 더 팔린다. 긴 꼬리 아이템이 보일 기회를 잃고 개인화가 인기 순위로 수렴한다"
    synonyms: ["popularity bias", "rich-get-richer"]
    causes: [rec-feedback-loop]
  - id: rec-embedding-retrieval
    kind: STAGE
    name: "임베딩 리트리벌"
    category: ALGORITHM
    level: ADVANCED
    description: "사용자와 아이템을 같은 벡터 공간에 두고 내적이 큰 아이템을 ANN 으로 뽑는다. 아이템 벡터는 미리 색인하고 사용자 벡터만 요청 때 계산한다"
    synonyms: ["embedding-based retrieval", "EBR"]
    questions:
      - "Two-Tower 가 점수 함수를 내적으로 제한하는 이유는"
      - "in-batch negative 가 인기 아이템을 과하게 벌하는 이유와 보정 방법은"
    contains: [two-tower, item2vec, negative-sampling, faiss, rec-sampling-bias]
    uses: [ann-search, hnsw, embedding-model]
    flows_to: [rec-geo-retrieval]
  - id: two-tower
    kind: MECHANISM
    name: "Two-Tower"
    category: ALGORITHM
    level: ADVANCED
    description: "사용자 탑과 아이템 탑이 각자 벡터를 내고 내적으로 점수를 매긴다. 두 탑이 분리돼 아이템 벡터를 미리 ANN 에 색인할 수 있다(YouTube 2016 · 2019)"
    synonyms: ["dual encoder", "two-tower model", "YouTube DNN"]
    code:
      - { path: recommendation-ml/train_two_tower.py, symbol: "class TwoTower(nn.Module):", note: "PyTorch 학습 → ONNX 사용자 탑" }
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/client/EmbeddingAnnRestClient.kt, symbol: "override fun retrievePersonalized(userId: Long, k: Int): List<RecommendationItem>", note: "ANN 사이드카 /search 호출, 실패하면 빈 목록 → 폴백" }
    contains: [in-batch-negative, sampling-bias-correction]
    uses: [ann-search, pytorch]
    alternative_to: [matrix-factorization]
  - id: in-batch-negative
    kind: MECHANISM
    name: "in-batch negative"
    category: ALGORITHM
    level: ADVANCED
    description: "같은 배치의 다른 사용자가 고른 아이템을 음성 표본으로 쓰고 softmax 교차 엔트로피로 학습한다. 음성을 따로 뽑지 않아 싸다"
    synonyms: ["in-batch softmax", "sampled softmax"]
    causes: [rec-sampling-bias]
  - id: sampling-bias-correction
    kind: MECHANISM
    name: "샘플링 편향 보정 (logQ)"
    category: ALGORITHM
    level: ADVANCED
    description: "in-batch 음성은 인기 아이템이 자주 뽑혀 과하게 벌받는다. 점수에서 log(아이템 출현 빈도)를 빼 보정한다(Yi et al. 2019)"
    synonyms: ["logQ correction", "sampling bias correction"]
    code:
      - { path: recommendation-ml/train_two_tower.py, symbol: "log_item_freq = torch.log(item_freq + 1e-8)", note: "점수 - log 빈도 후 교차 엔트로피" }
    mitigates: [rec-sampling-bias]
  - id: item2vec
    kind: MECHANISM
    name: "item2vec"
    category: ALGORITHM
    level: ADVANCED
    description: "세션 · 장바구니의 아이템 순서를 문장처럼 보고 word2vec(skip-gram)으로 아이템 벡터를 배운다. 같이 소비되는 것이 가까워진다"
    synonyms: ["prod2vec", "session embedding"]
    uses: [negative-sampling]
  - id: negative-sampling
    kind: MECHANISM
    name: "음성 표본 추출"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "암묵 피드백엔 부정 라벨이 없어 안 본 아이템에서 음성을 뽑는다. 무작위 · 인기 비례 · 어려운 음성(hard negative)에 따라 모델이 배우는 경계가 달라진다"
    synonyms: ["negative sampling", "hard negative mining"]
    code:
      - { path: recommendation-ml/train_ranking.py, symbol: "NEG_PER_POS = int(os.environ.get(\"NEG_PER_POS\", \"4\"))", note: "양성 1 : 무작위 음성 4" }
    uses: [implicit-feedback]
  - id: faiss
    kind: TECHNOLOGY
    name: "FAISS"
    category: DATA
    level: ADVANCED
    description: "Meta 의 벡터 유사도 검색 라이브러리다. recommendation-ann 사이드카가 아이템 벡터를 HNSW(내적)로 색인해 사용자 벡터의 Top-K 를 낸다"
    synonyms: ["faiss-cpu"]
    code:
      - { path: recommendation-ann/app.py, symbol: "faiss.IndexHNSWFlat(dim, HNSW_M, faiss.METRIC_INNER_PRODUCT)", note: "M · efConstruction · efSearch 환경변수" }
    implements: [rec-ann-sidecar]
  - id: rec-geo-retrieval
    kind: STAGE
    name: "위치 기반 추천"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "가까움과 인기를 함께 본다. 공간 셀로 후보를 좁히고 거리 감쇠로 인기 점수를 깎는다"
    synonyms: ["geo-aware recommendation", "location-based"]
    questions:
      - "거리 패널티와 인기를 단순 곱하면 어떤 함정이 있나"
    contains: [rec-spatial-cell-index, haversine-distance, rec-distance-decay]
    flows_to: [hybrid-recommendation]
  - id: rec-spatial-cell-index
    kind: MECHANISM
    name: "공간 셀 인덱싱"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "지구를 격자로 나눠 좌표를 셀 id 로 바꾸고 이웃 셀만 본다. Geohash(문자열 접두사) · S2(구면 사각형 · 힐베르트 곡선) · H3(육각형 · 이웃 거리 균일)"
    synonyms: ["Geohash", "S2", "H3", "geo cell"]
  - id: haversine-distance
    kind: MECHANISM
    name: "하버사인 거리"
    category: ALGORITHM
    level: BEGINNER
    description: "위경도 두 점 사이 대원 거리를 구면 공식으로 구한다. 추천 규모에서는 타원체 공식(Vincenty)만큼 정확할 필요가 없다"
    synonyms: ["Haversine", "great-circle distance"]
  - id: rec-distance-decay
    kind: MECHANISM
    name: "거리 감쇠 결합"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "점수 = log(인기) × exp(-거리 ÷ 척도)처럼 인기를 로그로 누르고 거리를 지수로 깎는다. 인기가 거리를 압도하지 않게 한다"
    synonyms: ["exponential distance decay"]
    uses: [haversine-distance]
  - id: hybrid-recommendation
    kind: MECHANISM
    name: "하이브리드 추천"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "여러 추천 소스를 섞는다 — 점수 가중합 · 상황별 전환(switching) · 단계 연결(cascade) · 후보 합치기. 한 소스의 약점(콜드 스타트 · 희소성)을 다른 소스가 메운다"
    synonyms: ["hybrid", "ensemble retrieval", "multi-source retrieval"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/application/recommendation/service/PersonalizedService.kt, symbol: "private fun mergeWithCb(", note: "임베딩 후보와 카테고리 베스트를 합친다" }
    uses: [content-based-filtering, collaborative-filtering, two-tower]

  # ── 랭킹 ─────────────────────────────────────────────────
  - id: rec-ranking
    kind: STAGE
    name: "랭킹"
    category: ALGORITHM
    level: ADVANCED
    description: "후보 수백 개를 풍부한 특징으로 정밀하게 채점한다. 보통 클릭 · 전환 확률을 예측하는 모델이고 precision 이 목표다"
    synonyms: ["ranking stage", "precision stage"]
    questions:
      - "Wide & Deep 의 wide 쪽은 무엇을 외우고 deep 쪽은 무엇을 일반화하나"
      - "학습 때와 서빙 때 특징이 달라지면 무엇이 보이나"
    contains: [rec-ctr-prediction, rec-multi-task-ranking, rec-feature-engineering, srch-train-serve-skew, rec-auc, onnx-runtime]
    uses: [learning-to-rank]
    measured_by: [ndcg]
    flows_to: [rec-reranking]
  - id: rec-ctr-prediction
    kind: MECHANISM
    name: "CTR 예측 모델"
    category: ALGORITHM
    level: ADVANCED
    description: "(사용자, 아이템, 문맥) 특징으로 클릭 확률을 내는 이진 분류 모델이다. 특징 교차를 얼마나 자동으로 배우느냐로 계보가 이어진다"
    synonyms: ["CTR prediction", "pCTR model", "pointwise ranking"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/client/RankingAnnRestClient.kt, symbol: "override fun rerank(", note: "사이드카 /rank 로 후보 재채점" }
    contains: [logistic-regression-ctr, factorization-machine, wide-and-deep, deepfm, dcn, dlrm, tab-transformer]
    measured_by: [rec-auc]
  - id: logistic-regression-ctr
    kind: MECHANISM
    name: "로지스틱 회귀 CTR"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "희소한 원-핫 특징과 사람이 만든 교차 특징에 선형 가중치를 배운다. 빠르고 해석이 쉬워 오래 표준이었다(FTRL 온라인 학습)"
    synonyms: ["LR", "FTRL"]
    uses: [rec-feature-cross]
  - id: factorization-machine
    kind: MECHANISM
    name: "Factorization Machine"
    category: ALGORITHM
    level: ADVANCED
    description: "모든 특징 쌍의 교차를 특징별 잠재 벡터의 내적으로 표현한다. 같이 나온 적 없는 특징 쌍도 점수를 매긴다"
    synonyms: ["FM", "FFM"]
    alternative_to: [logistic-regression-ctr]
  - id: wide-and-deep
    kind: MECHANISM
    name: "Wide & Deep"
    category: ALGORITHM
    level: ADVANCED
    description: "선형 교차 특징(wide, 외우기)과 임베딩 + MLP(deep, 일반화)를 함께 학습한다(Google Play 2016)"
    synonyms: ["Wide and Deep"]
    code:
      - { path: recommendation-ml/train_ranking.py, symbol: "class WideAndDeep(nn.Module):", note: "도시 × 카테고리 교차(wide) + 임베딩 MLP(deep)" }
    uses: [rec-feature-cross, rec-memorization-generalization]
  - id: deepfm
    kind: MECHANISM
    name: "DeepFM"
    category: ALGORITHM
    level: ADVANCED
    description: "Wide & Deep 의 wide 쪽을 FM 으로 바꿔 교차 특징을 손으로 만들지 않는다"
    uses: [factorization-machine]
    alternative_to: [wide-and-deep]
  - id: dcn
    kind: MECHANISM
    name: "DCN"
    category: ALGORITHM
    level: ADVANCED
    description: "층마다 입력과의 명시 교차를 쌓는 cross network 로 고차 교차를 싸게 배운다(DCN-v2)"
    synonyms: ["Deep & Cross Network", "DCN-v2"]
  - id: dlrm
    kind: MECHANISM
    name: "DLRM"
    category: ALGORITHM
    level: ADVANCED
    description: "희소 특징은 임베딩 표로, 밀집 특징은 bottom MLP 로 벡터를 만들고, 모든 쌍의 내적(교차) 뒤 top MLP 로 점수를 낸다. 거대한 임베딩 표를 모델 병렬로 나눈다(Meta 2019)"
    synonyms: ["Deep Learning Recommendation Model"]
    code:
      - { path: recommendation-ml/train_dlrm.py, symbol: "class DLRM(nn.Module):", note: "pairwise dot product 상삼각" }
    uses: [rec-sparse-dense-features]
    alternative_to: [wide-and-deep]
  - id: tab-transformer
    kind: MECHANISM
    name: "TabTransformer"
    category: ALGORITHM
    level: ADVANCED
    description: "범주형 특징 임베딩들에 self-attention 을 걸어 서로의 문맥을 반영한 임베딩으로 바꾼다(Amazon 2020)"
    synonyms: ["Tab Transformer"]
    alternative_to: [dlrm]
  - id: rec-multi-task-ranking
    kind: MECHANISM
    name: "멀티태스크 랭킹"
    category: ALGORITHM
    level: ADVANCED
    description: "클릭 · 전환 · 체류를 한 모델이 함께 예측하고 가중합해 최종 점수를 낸다. 목표끼리 충돌하면 전문가 게이트(MMoE)로 나눈다. 전환은 클릭 뒤에만 관측돼 ESMM 처럼 전체 공간에서 학습한다"
    synonyms: ["MMoE", "ESMM", "multi-objective ranking"]
    uses: [rec-ctr-prediction]
  - id: rec-feature-engineering
    kind: MECHANISM
    name: "랭킹 특징 설계"
    category: DATA
    level: INTERMEDIATE
    description: "사용자 · 아이템 · 문맥 · 교차 특징을 만든다. 통계 특징(최근 CTR)은 보정해서, 범주 특징은 해싱 · 임베딩으로 넣는다"
    synonyms: ["feature engineering"]
    contains: [feature-store]
    uses: [rec-feature-cross, rec-sparse-dense-features, ranking-features]
  - id: feature-store
    kind: MECHANISM
    name: "Feature Store"
    category: DATA
    level: ADVANCED
    description: "학습과 서빙이 같은 정의 · 같은 값의 특징을 쓰게 오프라인 저장소와 온라인 조회 저장소를 한 정의로 묶는다(Feast 등)"
    synonyms: ["feature store", "Feast"]
    mitigates: [srch-train-serve-skew]
  - id: onnx-runtime
    kind: TECHNOLOGY
    name: "ONNX Runtime"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "학습 프레임워크와 무관하게 내보낸 모델(ONNX)을 CPU 로 추론한다. 사이드카가 사용자 탑과 랭커를 이것으로 돌린다"
    synonyms: ["onnxruntime", "ONNX"]
    code:
      - { path: recommendation-ann/app.py, symbol: "import onnxruntime as ort", note: "user_tower.onnx · ranker.onnx 로드" }
    implements: [rec-ctr-prediction, two-tower]
  - id: rec-auc
    kind: METRIC
    name: "AUC"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "무작위 양성 하나가 무작위 음성 하나보다 높게 채점될 확률이다. CTR 모델의 순서 판별력을 본다(보정 여부는 logloss 가 본다)"
    synonyms: ["ROC AUC", "GAUC", "logloss"]
    code:
      - { path: recommendation-ml/train_dlrm.py, symbol: "roc_auc_score", note: "에폭마다 학습 AUC" }

  # ── 재정렬 · 후처리 ───────────────────────────────────────
  - id: rec-reranking
    kind: STAGE
    name: "재정렬 · 후처리"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "점수 순 목록을 그대로 내지 않고 다양성 · 신선도 · 이미 본 것 · 운영 규칙을 반영해 최종 Top-K 를 만든다"
    synonyms: ["re-ranking", "post-processing", "boost"]
    questions:
      - "정확도만으로 줄 세운 목록이 왜 사용자에게 나쁜가"
      - "MMR 은 관련성과 다양성을 어떻게 맞바꾸나"
    contains: [rec-diversification, rec-score-boost, rec-seen-filter, rec-calibration, rec-exposure-fairness, filter-bubble]
    uses: [diversity-business-rules]
    measured_by: [srch-intra-list-diversity]
  - id: rec-diversification
    kind: MECHANISM
    name: "다양화"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "비슷한 아이템이 몰리지 않게 목록을 다시 고른다. 카테고리당 상한 같은 규칙부터 MMR · DPP 같은 최적화까지 있다"
    synonyms: ["diversification"]
    contains: [mmr, dpp]
    mitigates: [filter-bubble]
  - id: mmr
    kind: MECHANISM
    name: "MMR"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "다음 아이템을 λ × 관련성 − (1 − λ) × 이미 고른 것과의 최대 유사도로 하나씩 탐욕적으로 고른다"
    synonyms: ["Maximal Marginal Relevance"]
    uses: [greedy]
    alternative_to: [dpp]
  - id: dpp
    kind: MECHANISM
    name: "DPP"
    category: ALGORITHM
    level: ADVANCED
    description: "관련성과 서로 다름을 한 커널 행렬의 행렬식으로 재어 목록 전체를 함께 고른다(YouTube 2018)"
    synonyms: ["Determinantal Point Process"]
  - id: rec-score-boost
    kind: MECHANISM
    name: "점수 부스팅 · 비즈니스 규칙"
    category: ALGORITHM
    level: BEGINNER
    description: "신상품 · 프로모션 · 재고 같은 운영 의도를 가산점으로 넣거나 제외한다. 부스트는 기록하고 효과를 A/B 로 재야 모델 점수를 오염시키지 않는다"
    synonyms: ["boosting", "business rule", "freshness boost"]
    uses: [diversity-business-rules]
  - id: rec-seen-filter
    kind: MECHANISM
    name: "이미 본 것 · 산 것 제외"
    category: ALGORITHM
    level: BEGINNER
    description: "최근 노출했거나 이미 구매한 아이템, 추천 대상 자신을 목록에서 뺀다. 소모품은 재구매 주기가 지나면 다시 넣는다"
    synonyms: ["seen filter", "dedup"]
  - id: rec-calibration
    kind: MECHANISM
    name: "캘리브레이션"
    category: ALGORITHM
    level: ADVANCED
    description: "추천 목록의 카테고리 비율을 사용자 이력의 관심 비율에 맞춘다(Steck 2018). 주 관심사가 소수 관심사를 밀어내는 것을 막는다"
    synonyms: ["calibrated recommendations"]
  - id: rec-exposure-fairness
    kind: MECHANISM
    name: "노출 공정성"
    category: ALGORITHM
    level: ADVANCED
    description: "공급자 · 아이템 그룹이 받는 노출을 관련성에 비례하게 나눈다. 마켓플레이스에서 판매자 쏠림을 막는다"
    synonyms: ["fairness of exposure", "provider fairness"]
    mitigates: [rec-popularity-bias]
  - id: filter-bubble
    kind: PROBLEM
    name: "필터 버블"
    category: ALGORITHM
    level: BEGINNER
    description: "좋아한 것과 비슷한 것만 반복돼 관심사가 좁아지고 새로운 것을 만나지 못한다"
    synonyms: ["filter bubble", "echo chamber", "overspecialization"]

  # ── 콜드 스타트 ───────────────────────────────────────────
  - id: rec-cold-start
    kind: STAGE
    name: "콜드 스타트 대응"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "기록이 없는 새 사용자 · 새 아이템 · 새 문맥에 폴백 체인과 탐색으로 첫 추천을 낸다"
    synonyms: ["cold start"]
    questions:
      - "새 사용자 · 새 아이템 · 새 도시는 각각 무엇으로 버티나"
      - "하드 콜드 스타트와 소프트 콜드 스타트는 어떻게 다른가"
    contains: [rec-fallback-chain, rec-default-preference, rec-onboarding-bandit, rec-new-item-exposure, rec-transfer-learning, rec-cold-start-problem]
  - id: rec-fallback-chain
    kind: MECHANISM
    name: "폴백 체인"
    category: ARCHITECTURE
    level: BEGINNER
    description: "개인화 → 유사 아이템 → 세그먼트 인기 → 전체 인기 순으로, 앞 단계 결과가 모자라면 다음 단계로 채운다. 외부 호출이 실패해도 빈 목록을 내지 않는다"
    synonyms: ["fallback chain", "graceful degradation"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/application/recommendation/service/PersonalizedService.kt, symbol: "\"personalized-cold-start\"", note: "행동이 부족하면 카테고리 베스트로" }
    uses: [popularity-recommendation, rec-category-best]
    mitigates: [rec-cold-start-problem]
  - id: rec-default-preference
    kind: MECHANISM
    name: "기본 선호 · 인구통계 폴백"
    category: ALGORITHM
    level: BEGINNER
    description: "첫 방문자에게는 유입 경로 · 기기 · 지역 · 연령대 같은 즉시 가용 신호로 세그먼트 기본 선호를 준다"
    synonyms: ["demographic default", "segment default preference"]
    mitigates: [rec-cold-start-problem]
  - id: rec-onboarding-bandit
    kind: MECHANISM
    name: "온보딩 탐색"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "새 사용자에게 여러 카테고리를 조금씩 보여 반응으로 빠르게 취향을 좁힌다. 관심사 선택 화면이 가장 단순한 형태다"
    synonyms: ["onboarding", "preference elicitation"]
    uses: [bandit-exploration]
  - id: rec-new-item-exposure
    kind: MECHANISM
    name: "새 아이템 노출 · 부스트"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "새 아이템은 콘텐츠 임베딩 · 아이템 탑의 속성 특징으로 자리를 잡고, 일정 노출을 탐색 몫으로 보장받는다"
    synonyms: ["new item boost", "exploration slot"]
    uses: [rec-text-embedding-similarity, exploration-exploitation]
    mitigates: [rec-cold-start-problem]
  - id: rec-transfer-learning
    kind: MECHANISM
    name: "전이 학습"
    category: ALGORITHM
    level: ADVANCED
    description: "새 도시 · 새 카테고리에 비슷한 기존 시장에서 배운 임베딩 · 모델을 옮겨 쓰고 적은 데이터로 미세 조정한다"
    synonyms: ["transfer learning", "cross-domain recommendation"]
  - id: rec-cold-start-problem
    kind: PROBLEM
    name: "콜드 스타트"
    category: ALGORITHM
    level: BEGINNER
    description: "행동 기록이 없어 협업 필터링 · 임베딩이 아무것도 모른다. 새 사용자 · 새 아이템 · 새 문맥 세 축이 있다"
    synonyms: ["cold start problem"]

  # ── 서빙 ─────────────────────────────────────────────────
  - id: rec-serving
    kind: STAGE
    name: "추천 서빙"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "무거운 계산은 배치로 미리 하고, 요청 경로에서는 캐시 조회 · ANN · 가벼운 채점만 한다. 퍼널 단계마다 지연 예산이 다르다"
    questions:
      - "배치로 미리 계산한 추천과 요청 때 계산하는 추천은 신선도와 비용을 어떻게 맞바꾸나"
      - "캐시 키를 통째로 바꿀 때 읽는 쪽이 반쯤 쓴 목록을 보지 않게 하려면"
    contains: [rec-precompute-cache, rec-staged-key-swap, rec-ann-sidecar, rec-periodic-retraining, rec-funnel-latency-budget, rec-model-staleness, pytorch]
    uses: [redis]
  - id: rec-precompute-cache
    kind: MECHANISM
    name: "사전 계산 · 캐시 서빙"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "ClickHouse 에서 점수를 집계해 분할별 Top-N 을 Redis 에 넣고, 요청은 조회만 한다. 계산 비용이 사용자 수와 무관해진다"
    synonyms: ["batch recommendation", "precomputed recommendations"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/sync/CbScoreSync.kt, symbol: "class CbScoreSync(", note: "ClickHouse 집계 → Redis Top-N, TTL 25시간" }
    uses: [clickhouse, redis, caching]
    causes: [rec-model-staleness]
  - id: rec-staged-key-swap
    kind: MECHANISM
    name: "스테이징 키 교체"
    category: DATA
    level: INTERMEDIATE
    description: "새 목록을 스테이징 키에 다 쓴 뒤 라이브 키로 한 번에 옮긴다. 동기화 중에 읽는 요청이 반쯤 찬 목록을 보지 않는다"
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/sync/ItemSimilaritySync.kt, symbol: "private fun commit(stagingKey: String, liveKey: String, ttl: Duration)", note: "staging → live 교체" }
    uses: [redis]
  - id: rec-ann-sidecar
    kind: MECHANISM
    name: "ANN 추론 사이드카"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "파이썬 모델 · 벡터 인덱스를 별도 컨테이너로 두고 JVM 서비스가 클러스터 내부 HTTP 로 부른다. 인덱스 교체는 새로 만든 뒤 참조만 바꾼다(ADR-0046)"
    synonyms: ["model server", "FAISS sidecar"]
    code:
      - { path: recommendation-ann/app.py, symbol: "def reindex():", note: "새 인덱스를 만든 뒤 교체" }
    uses: [faiss, onnx-runtime]
  - id: rec-periodic-retraining
    kind: MECHANISM
    name: "주기 재학습"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "매일 최근 상호작용으로 모델을 다시 학습해 벡터 · 인덱스 · 랭커를 교체한다. 시간 순으로 나눈 검증셋의 지표가 떨어지면 교체하지 않는다"
    synonyms: ["daily retraining", "continuous training"]
    code:
      - { path: k8s/base/recommendation-ann/argo-train-daily.yaml, symbol: "kind: CronWorkflow", note: "일일 학습 워크플로" }
    uses: [pytorch, rec-temporal-split]
    mitigates: [rec-model-staleness]
  - id: rec-funnel-latency-budget
    kind: METRIC
    name: "퍼널 단계별 지연 예산"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "후보 생성 ~50ms · 랭킹 ~30ms · 재정렬 10ms 미만처럼 단계마다 지연 상한을 나눈다. 랭킹 후보 수가 이 예산으로 정해진다"
    synonyms: ["latency budget"]
  - id: rec-model-staleness
    kind: PROBLEM
    name: "모델 · 목록 노후화"
    category: DATA
    level: INTERMEDIATE
    description: "배치 주기 사이에 취향 · 재고 · 트렌드가 바뀌어 추천이 어제의 세상을 보여 준다"
    synonyms: ["staleness"]
    causes: [rec-concept-drift]
  - id: pytorch
    kind: TECHNOLOGY
    name: "PyTorch"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "추천 모델(Two-Tower · Wide & Deep · DLRM) 학습에 쓰는 딥러닝 프레임워크다. 학습 뒤 ONNX 로 내보내 서빙과 떼어 놓는다"
    synonyms: ["torch"]
    code:
      - { path: recommendation-ml/requirements.txt, symbol: "torch==", note: "학습 이미지 의존성" }
    implements: [two-tower, rec-ctr-prediction]

  # ── 평가 ─────────────────────────────────────────────────
  - id: rec-evaluation
    kind: STAGE
    name: "추천 평가"
    category: TESTING
    level: INTERMEDIATE
    description: "오프라인 지표로 후보를 거르고 온라인 실험으로 판정한다. 로그는 옛 정책이 보여 준 것만 담아 오프라인 지표가 믿기 어렵다"
    questions:
      - "추천에서 오프라인 지표가 좋아도 A/B 에서 지는 이유는"
      - "무작위 분할 대신 시간 순 분할을 쓰는 이유는"
    contains: [rec-offline-evaluation, rec-online-evaluation, rec-drift-monitoring, rec-concept-drift, rec-feedback-loop]
  - id: rec-offline-evaluation
    kind: STAGE
    name: "오프라인 평가"
    category: TESTING
    level: INTERMEDIATE
    description: "과거 로그로 모델을 비교한다. 정확도(Recall@K · nDCG · MAP · MRR)와 목록 성질(커버리지 · 다양성 · 신규성 · 의외성)을 함께 본다"
    contains: [rec-temporal-split, srch-offline-online-gap, srch-recall-at-k, srch-map, srch-mrr, rec-hit-rate, rec-catalog-coverage, srch-intra-list-diversity, rec-novelty, rec-serendipity]
    uses: [off-policy-evaluation]
    measured_by: [ndcg, recall-precision]
    flows_to: [rec-online-evaluation]
  - id: rec-temporal-split
    kind: MECHANISM
    name: "시간 순 분할"
    category: TESTING
    level: BEGINNER
    description: "사용자별 마지막 행동(또는 기준 시각 이후)을 시험셋으로 둔다. 무작위 분할은 미래로 과거를 맞히는 누수가 생긴다"
    synonyms: ["temporal split", "leave-last-out", "time-based split"]
    code:
      - { path: recommendation-ml/train_two_tower.py, symbol: "def temporal_split(triples, test_ratio=0.2):", note: "마지막 20% 를 시험셋으로" }
    mitigates: [srch-offline-online-gap]
  - id: rec-hit-rate
    kind: METRIC
    name: "Hit Rate@K"
    category: TESTING
    level: BEGINNER
    description: "상위 K 안에 정답이 하나라도 든 사용자 비율이다"
    synonyms: ["HR@K"]
  - id: rec-catalog-coverage
    kind: METRIC
    name: "카탈로그 커버리지"
    category: TESTING
    level: BEGINNER
    description: "전체 아이템 중 한 번이라도 추천된 비율이다. 낮으면 인기 편향이 긴 꼬리를 가리고 있다"
    synonyms: ["catalog coverage", "aggregate diversity"]
  - id: rec-novelty
    kind: METRIC
    name: "신규성"
    category: TESTING
    level: INTERMEDIATE
    description: "추천 아이템이 얼마나 덜 알려졌는지(인기의 음의 로그 평균)다"
    synonyms: ["novelty"]
  - id: rec-serendipity
    kind: METRIC
    name: "의외성"
    category: TESTING
    level: ADVANCED
    description: "뻔하지 않으면서(기준 추천과 다르면서) 사용자가 좋아한 추천의 비율이다"
    synonyms: ["serendipity"]
  - id: rec-online-evaluation
    kind: STAGE
    name: "온라인 평가 · 실험"
    category: TESTING
    level: INTERMEDIATE
    description: "추천 변형을 실험 서비스로 나눠 보이고 CTR · CVR · 체류로 판정한다. 트래픽 배분은 밴딧이 이긴 쪽으로 옮길 수 있다"
    contains: [rec-experiment-variant-routing, rec-variant-bandit, rec-impression-publishing, srch-dwell-time]
    uses: [ab-test, interleaving]
    measured_by: [ctr, ads-cvr, ord-gmv]
  - id: rec-experiment-variant-routing
    kind: MECHANISM
    name: "실험 변형 분기"
    category: TESTING
    level: INTERMEDIATE
    description: "사용자가 배정된 변형에 따라 룰 기반만 · 리트리벌만 · 리트리벌 + 랭킹 경로로 나눈다. 실험 서비스 호출이 실패하면 기본 변형으로 간다(ADR-0048)"
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/client/RecommendationExperimentClient.kt, symbol: "override fun getVariant(experimentId: Long, userId: Long): String?", note: "experiment 서비스 배정 조회" }
    uses: [ab-test]
  - id: rec-variant-bandit
    kind: MECHANISM
    name: "변형 선택 밴딧"
    category: ALGORITHM
    level: ADVANCED
    description: "추천 변형(팔)마다 클릭률의 베타 사후분포에서 표본을 뽑아 가장 큰 변형을 낸다. 실험이 끝나기 전에도 트래픽이 이기는 쪽으로 옮겨 간다(ADR-0049)"
    synonyms: ["Thompson Sampling variant selection"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/bandit/RedisThompsonSampler.kt, symbol: "class RedisThompsonSampler(", note: "팔별 성공 · 실패를 Redis 해시에 — 여러 파드가 공유" }
    uses: [bandit-exploration, beta-bernoulli-conjugate, redis]
  - id: rec-impression-publishing
    kind: MECHANISM
    name: "추천 노출 발행"
    category: DATA
    level: INTERMEDIATE
    description: "추천 목록을 변형 · 위치와 함께 노출 이벤트로 발행한다. 클릭과 이어야 CTR · 보상 · 성향을 계산할 수 있다"
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/infrastructure/kafka/RecommendationImpressionPublisher.kt, symbol: "override fun publishImpressions(rec: Recommendation, variant: String)", note: "변형 태그를 단 노출" }
    uses: [kafka, propensity-logging]
  - id: rec-drift-monitoring
    kind: MECHANISM
    name: "드리프트 감시"
    category: TESTING
    level: ADVANCED
    description: "입력 분포(데이터 드리프트) · 입력과 정답의 관계(개념 드리프트) · 추천이 만든 데이터로 다시 배우는 되먹임을 지표 분포 비교(PSI 등)로 감시한다"
    synonyms: ["drift detection", "PSI"]
    mitigates: [rec-concept-drift, rec-feedback-loop]
  - id: rec-concept-drift
    kind: PROBLEM
    name: "데이터 · 개념 드리프트"
    category: DATA
    level: ADVANCED
    description: "시즌 · 트렌드 · 상품 구성이 바뀌어 학습 때의 분포나 선호 관계가 더는 맞지 않는다"
    synonyms: ["data drift", "concept drift"]
  - id: rec-feedback-loop
    kind: PROBLEM
    name: "되먹임 루프"
    category: ALGORITHM
    level: ADVANCED
    description: "추천이 보여 준 것만 클릭되고 그 클릭으로 다시 학습해, 모델이 자기 편향을 강화한다"
    synonyms: ["feedback loop", "degenerate feedback"]
  - id: rec-sampling-bias
    kind: PROBLEM
    name: "음성 샘플링 편향"
    category: ALGORITHM
    level: ADVANCED
    description: "in-batch 음성은 인기 비례로 뽑혀 인기 아이템이 실제보다 과하게 부정 신호를 받는다"
    synonyms: ["sampling bias"]

  # ── 용어 ─────────────────────────────────────────────────
  - id: rec-glossary
    kind: TERM
    name: "추천 용어"
    category: BASICS
    level: BEGINNER
    description: "추천을 설명하는 말 — 데이터 모양 · 모델 구성 · 퍼널"
    contains: [rec-glossary-data, rec-glossary-model]
  - id: rec-glossary-data
    kind: TERM
    name: "데이터 모양"
    category: BASICS
    level: BEGINNER
    description: "추천이 다루는 상호작용 데이터의 모양"
    contains: [rec-interaction-matrix, rec-co-occurrence, rec-long-tail, rec-sparse-dense-features]
  - id: rec-interaction-matrix
    kind: TERM
    name: "사용자 × 아이템 상호작용 행렬"
    category: DATA
    level: BEGINNER
    description: "행은 사용자, 열은 아이템, 칸은 평점 또는 행동 가중치다. 거의 비어 있는 희소 행렬이다"
    synonyms: ["user-item matrix", "rating matrix", "utility matrix"]
  - id: rec-co-occurrence
    kind: TERM
    name: "공출현"
    category: DATA
    level: BEGINNER
    description: "두 아이템이 같은 사용자 · 세션에 함께 나타난 횟수다. 아이템 기반 CF 유사도의 원료다"
    synonyms: ["co-occurrence", "co-count"]
  - id: rec-long-tail
    kind: TERM
    name: "긴 꼬리"
    category: DATA
    level: BEGINNER
    description: "개별 판매는 적지만 수가 많은 비인기 아이템 무리다. 개인화의 가치가 가장 크게 나는 구간이다"
    synonyms: ["long tail"]
  - id: rec-sparse-dense-features
    kind: TERM
    name: "희소 · 밀집 특징"
    category: DATA
    level: INTERMEDIATE
    description: "id · 카테고리처럼 원-핫이면 거의 0 인 희소 특징은 임베딩 표로, 가격 · 최근 CTR 같은 연속값 밀집 특징은 정규화해 넣는다"
    synonyms: ["sparse features", "dense features", "embedding table"]
  - id: rec-glossary-model
    kind: TERM
    name: "모델 구성"
    category: BASICS
    level: INTERMEDIATE
    description: "추천 모델을 설명하는 말"
    contains: [rec-latent-factor, rec-regularization, rec-feature-cross, rec-memorization-generalization, rec-funnel]
  - id: rec-latent-factor
    kind: TERM
    name: "잠재 요인"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "행렬 분해가 찾아낸 저차원 축이다. 사람이 이름 붙이지 않았지만 장르 · 가격대 같은 성향을 흡수한다"
    synonyms: ["latent factor", "latent dimension k"]
  - id: rec-regularization
    kind: TERM
    name: "정규화 항 · 편향 항"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "벡터 크기에 벌점(λ)을 줘 적은 관측에 과적합하지 않게 하고, 전체 평균 · 사용자 편향 · 아이템 편향을 따로 둬 잠재 요인이 설명할 몫만 남긴다"
    synonyms: ["regularization λ", "bias term"]
  - id: rec-feature-cross
    kind: TERM
    name: "특징 교차"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "두 특징의 조합(도시 × 카테고리)을 새 특징으로 만든 것이다. 조합에만 있는 신호를 선형 모델이 외우게 한다"
    synonyms: ["feature cross", "cross product transformation"]
  - id: rec-memorization-generalization
    kind: TERM
    name: "외우기 · 일반화"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "자주 본 조합을 그대로 기억하는 능력과 본 적 없는 조합을 임베딩으로 추론하는 능력이다. Wide & Deep 이 둘을 나눠 맡긴다"
    synonyms: ["memorization", "generalization"]
  - id: rec-funnel
    kind: TERM
    name: "추천 퍼널"
    category: ARCHITECTURE
    level: BEGINNER
    description: "후보 생성(recall, 수천만 → 수백) → 랭킹(precision, 수백 → 수십) → 재정렬(규칙 · 다양성, 수십 → Top-K) 순의 단계 구조다"
    synonyms: ["two-stage recommendation", "multi-stage funnel"]
