# 상품 · 전시 · 재고 온톨로지 — 원본은 이 파일이다 (ADR-0100, docs/specs/2026-09-24-concept-atlas).
# 바꾸면 manifest.yaml 의 revision 을 올린다. 간선은 from 개념에만 적는다.
domain: commerce-catalog
root: commerce-catalog
concepts:
  - id: commerce-catalog
    kind: DOMAIN
    name: "상품 · 전시 · 재고"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "무엇을 얼마에 팔고(상품 · 가격), 어떻게 보여 주고(전시), 몇 개 남았는지(재고), 어떤 혜택을 얹는지(프로모션)를 다루는 커머스의 판매 준비 영역"
    synonyms: ["카탈로그", "catalog", "PIM"]
    contains: [cat-product-domain, cat-display-domain, cat-inventory-domain, cat-promotion-domain, cat-cart, cat-glossary]

  # ───────────── 상품 ─────────────
  - id: cat-product-domain
    kind: DOMAIN
    name: "상품"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "상품 구조 · 분류 · 가격 · 판매자를 정의한다. 주문 이후의 모든 계산이 여기서 정한 값을 스냅샷해 쓴다"
    contains: [cat-product-modeling, cat-category-taxonomy, cat-pricing, cat-seller-onboarding]
    flows_to: [cat-display-domain]
  - id: cat-product-modeling
    kind: STAGE
    name: "상품 모델링"
    category: DATA
    level: INTERMEDIATE
    description: "판매 단위(SKU)와 그것을 묶는 상품(SPU), 옵션 · 속성 · 상태를 설계한다"
    questions:
      - "SPU 와 SKU 를 나누면 재고 · 가격 · 전시가 각각 어느 층에 붙나"
      - "옵션 조합으로 SKU 를 만들 때 무엇이 폭발하나"
    contains: [cat-spu-sku-model, cat-option-combination, cat-attribute-model, cat-product-bundle, cat-product-type, cat-product-lifecycle, cat-product-versioning, cat-product-media, cat-product-compliance, cat-product-event-publishing, cat-sku-explosion]
  - id: cat-spu-sku-model
    kind: MECHANISM
    name: "SPU · SKU 2층 상품 모델"
    category: DATA
    level: INTERMEDIATE
    description: "상세 페이지 · 리뷰 · 검색이 붙는 상품(SPU)과 재고 · 가격 · 주문이 붙는 판매 단위(SKU)를 나눈다. 한 SPU 아래 옵션별 SKU 가 여럿이다"
    synonyms: ["product-variant model", "상품-단품"]
    uses: [cat-term-spu, cat-term-sku, cat-term-variant]
  - id: cat-option-combination
    kind: MECHANISM
    name: "옵션 조합 · SKU 생성"
    category: DATA
    level: INTERMEDIATE
    description: "색상 × 사이즈 같은 조합형 옵션은 곱집합으로 SKU 를 만들고, 각인 문구 같은 입력형 · 단독형 옵션은 SKU 를 늘리지 않는다"
    synonyms: ["조합형 옵션", "option matrix"]
    uses: [cat-term-option]
    causes: [cat-sku-explosion]
  - id: cat-attribute-model
    kind: MECHANISM
    name: "속성 모델 (고정 컬럼 · EAV · JSON)"
    category: DATA
    level: INTERMEDIATE
    description: "카테고리마다 다른 속성을 고정 컬럼 · EAV 테이블 · JSON 컬럼 중 하나로 담는다. 필터로 쓰는 속성은 검색 색인에 펴서 넣는다"
    synonyms: ["product attributes", "EAV"]
    code:
      - { path: product/domain/src/main/kotlin/com/kgd/product/domain/product/model/Product.kt, symbol: "var energyKcal: Double? = null", note: "식품 영양 속성을 고정 컬럼으로" }
    uses: [cat-term-attribute]
  - id: cat-product-bundle
    kind: MECHANISM
    name: "묶음 · 세트 상품"
    category: DATA
    level: INTERMEDIATE
    description: "여러 SKU 를 한 상품으로 판다. 재고는 구성품 재고의 최솟값이고, 부분 취소 때 구성품별 금액 배분이 필요하다"
    synonyms: ["bundle", "kit"]
    uses: [cat-term-sku]
  - id: cat-product-type
    kind: MECHANISM
    name: "상품 유형 (배송 · 디지털 · 예약 · 서비스)"
    category: DATA
    level: BEGINNER
    description: "유형에 따라 재고 개념 · 이행 방식 · 취소 규칙이 달라진다. 예약형은 날짜별 재고, 디지털은 코드 발급이 이행이다"
  - id: cat-product-lifecycle
    kind: MECHANISM
    name: "상품 상태 · 판매 상태"
    category: DATA
    level: BEGINNER
    description: "등록 · 심사 · 판매중 · 품절 · 판매중지 · 삭제를 상태로 둔다. 품절은 재고에서, 판매중지는 운영 판단에서 온다"
    synonyms: ["product status"]
    code:
      - { path: product/domain/src/main/kotlin/com/kgd/product/domain/product/model/ProductStatus.kt, symbol: "enum class ProductStatus { ACTIVE, INACTIVE }", note: "판매 상태" }
  - id: cat-product-versioning
    kind: MECHANISM
    name: "상품 변경 이력 · 버전"
    category: DATA
    level: INTERMEDIATE
    description: "가격 · 옵션 · 고시 정보 변경을 이력으로 남기고 이벤트에 발생 시각을 실어, 받는 쪽이 늦게 온 옛 버전으로 덮어쓰지 않게 한다"
    uses: [cat-product-event-publishing]
  - id: cat-product-media
    kind: MECHANISM
    name: "상품 이미지 · 미디어"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "원본은 오브젝트 스토리지에 Presigned URL 로 직접 올리고, 화면에는 CDN 과 온더플라이 리사이즈로 내보낸다"
    synonyms: ["Presigned URL", "이미지 플랫폼"]
    uses:
      - cloud-cdn
      - { to: cloud-signed-url, reason: "업로드 · 다운로드를 서명 URL 로 위임한다" }
  - id: cat-product-compliance
    kind: MECHANISM
    name: "상품 고시 정보"
    category: DATA
    level: BEGINNER
    description: "원산지 · 제조사 · 품목보고번호 · 영양성분처럼 법이 요구하는 표시 항목을 상품 유형별로 담는다"
    code:
      - { path: product/domain/src/main/kotlin/com/kgd/product/domain/product/model/Product.kt, symbol: "var itemReportNo: String? = null", note: "품목보고번호" }
  - id: cat-product-event-publishing
    kind: MECHANISM
    name: "상품 이벤트 발행"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "상품이 원본(SSOT)이고 변경을 이벤트로 낸다. 주문 · 검색은 이 이벤트로 자기 사본을 유지한다"
    code:
      - { path: product/feature/src/main/kotlin/com/kgd/product/infrastructure/messaging/ProductEventAdapter.kt, symbol: "class ProductEventAdapter(", note: "아웃박스로 product.item.* 발행" }
    uses:
      - outbox-pattern
      - { to: kafka, reason: "상품 변경 이벤트의 운반체" }
    mitigates: [dist-dual-write]
  - id: cat-sku-explosion
    kind: PROBLEM
    name: "옵션 조합 폭발"
    category: DATA
    level: INTERMEDIATE
    description: "옵션 축이 늘면 SKU 가 곱으로 늘어 재고 · 가격 관리와 화면이 감당하지 못한다"

  - id: cat-category-taxonomy
    kind: STAGE
    name: "카테고리 · 분류 체계"
    category: DATA
    level: INTERMEDIATE
    description: "상품을 계층 카테고리와 브랜드로 분류한다. 관리용 표준 분류와 고객용 전시 분류를 따로 둔다"
    questions: ["표준 카테고리와 전시 카테고리를 나누는 이유는 무엇인가"]
    contains: [cat-category-tree, cat-hierarchy-storage, cat-display-category-mapping, cat-brand-master]
  - id: cat-category-tree
    kind: MECHANISM
    name: "카테고리 트리"
    category: DATA
    level: BEGINNER
    description: "대 · 중 · 소 계층으로 상품을 분류한다. 수수료 · 속성 템플릿 · 고시 항목이 카테고리에 붙는다"
    synonyms: ["category tree", "taxonomy"]
    uses: [tree, taxonomy-tagging, cat-hierarchy-storage, cat-term-category]
  - id: cat-hierarchy-storage
    kind: MECHANISM
    name: "계층 저장 (인접 목록 · 경로 열거 · 클로저 테이블)"
    category: DATA
    level: INTERMEDIATE
    description: "부모 id 만 두는 인접 목록, 경로 문자열, 조상-자손 쌍을 모두 두는 클로저 테이블 중 하위 조회 빈도와 이동 빈도로 고른다"
    synonyms: ["adjacency list", "closure table", "materialized path"]
  - id: cat-display-category-mapping
    kind: MECHANISM
    name: "전시 카테고리 매핑"
    category: DATA
    level: INTERMEDIATE
    description: "고객이 보는 전시 카테고리를 표준 카테고리 · 태그 조건에 매핑한다. 전시 개편이 상품 데이터를 건드리지 않는다"
    uses: [cat-category-tree]
  - id: cat-brand-master
    kind: MECHANISM
    name: "브랜드 · 제조사 마스터"
    category: DATA
    level: BEGINNER
    description: "브랜드를 문자열이 아니라 마스터로 관리해 표기 흔들림 없이 필터 · 브랜드관을 만든다"
    synonyms: ["brand"]

  - id: cat-pricing
    kind: STAGE
    name: "가격 정책"
    category: DATA
    level: INTERMEDIATE
    description: "정가 · 판매가 · 할인가와 가격 규칙, 금액 타입 · 통화 · 반올림 · 배송비 정책을 정한다"
    synonyms: ["pricing"]
    questions:
      - "금액을 부동소수점으로 다루면 안 되는 이유와 대안은 무엇인가"
      - "여러 가격 규칙이 겹칠 때 어느 것이 이기나"
    contains: [cat-list-sale-price, cat-price-rule, cat-price-priority, cat-money-type, cat-currency, cat-rounding-rule, cat-shipping-fee-policy, cat-price-history, cat-dynamic-pricing, cat-float-money-error, cat-price-mismatch]
  - id: cat-list-sale-price
    kind: MECHANISM
    name: "정가 · 판매가 · 할인가"
    category: DATA
    level: BEGINNER
    description: "정가(소비자가)는 비교 기준, 판매가는 실제로 파는 값, 할인가는 즉시 할인까지 뺀 값이다. 주문 라인은 이 셋을 스냅샷한다"
    synonyms: ["list price", "sale price", "정가 · 판매가"]
    code:
      - { path: product/domain/src/main/kotlin/com/kgd/product/domain/product/model/Money.kt, symbol: "value class Money(val amount: Long)", note: "판매가 → 원 단위 정수" }
    uses: [cat-money-type]
  - id: cat-price-rule
    kind: MECHANISM
    name: "가격 규칙 (기간가 · 회원가 · 채널가 · 수량 할인)"
    category: DATA
    level: INTERMEDIATE
    description: "기간 · 회원 등급 · 판매 채널 · 구매 수량에 따라 다른 가격을 준다. 규칙은 유효 기간과 대상 조건을 갖는다"
    synonyms: ["price rule", "tier price"]
    uses: [cat-price-priority]
  - id: cat-price-priority
    kind: MECHANISM
    name: "가격 결정 우선순위 (가격 엔진)"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "겹치는 가격 규칙 중 무엇을 적용할지 우선순위 · 최저가 원칙으로 정하는 계산기. 전시와 주문서가 같은 엔진을 불러야 두 값이 어긋나지 않는다"
    synonyms: ["price engine"]
    mitigates: [cat-price-mismatch]
  - id: cat-money-type
    kind: MECHANISM
    name: "금액 타입 (정수 최소 단위 · BigDecimal + 통화)"
    category: DATA
    level: BEGINNER
    description: "금액은 최소 단위 정수나 BigDecimal 과 통화 코드로 다룬다. 값 객체로 감싸 덧셈 · 곱셈에서 넘침을 검사한다"
    synonyms: ["Money 타입", "통화 · 금액 타입"]
    code:
      - { path: order/domain/src/main/kotlin/com/kgd/order/domain/order/model/Money.kt, symbol: "value class Money(val amount: Long)", note: "원 단위 Long + 넘침 검사" }
    mitigates: [cat-float-money-error]
  - id: cat-currency
    kind: MECHANISM
    name: "통화 · 다통화 가격"
    category: DATA
    level: INTERMEDIATE
    description: "통화마다 최소 단위가 다르고(원 0자리 · 달러 2자리) 환율로 환산한 가격과 통화별 고정 가격 중 하나를 고른다"
    synonyms: ["currency", "ISO 4217"]
    uses: [cat-money-type]
  - id: cat-rounding-rule
    kind: MECHANISM
    name: "반올림 · 절사 규칙"
    category: ALGORITHM
    level: BEGINNER
    description: "정률 할인은 내림, 수수료는 HALF_UP 처럼 계산마다 반올림 방식을 정해 두고 한 곳에서 쓴다. 방식이 흩어지면 원 단위 차이가 대사에서 터진다"
    synonyms: ["rounding"]
    code:
      - { path: order/domain/src/main/kotlin/com/kgd/order/domain/sheet/model/Commission.kt, symbol: "object Commission", note: "수수료 HALF_UP" }
  - id: cat-shipping-fee-policy
    kind: MECHANISM
    name: "배송비 정책"
    category: DATA
    level: BEGINNER
    description: "고정 · 조건부 무료(얼마 이상) · 수량별 · 도서산간 추가 배송비를 판매자 단위로 정한다"
    synonyms: ["shipping fee"]
    code:
      - { path: order/domain/src/main/kotlin/com/kgd/order/domain/sheet/model/OrderSheet.kt, symbol: "data class ShippingLine(val sellerId: Long, val fee: Long)", note: "판매자별 고정 배송비" }
  - id: cat-price-history
    kind: MECHANISM
    name: "가격 이력 · 할인 전 가격 표시"
    category: DATA
    level: INTERMEDIATE
    description: "가격 변경 이력을 남겨 「할인 전 가격」을 최근 실제 판매가로 표시한다. 부풀린 정가 표시는 규제 대상이다"
    synonyms: ["price history"]
  - id: cat-dynamic-pricing
    kind: MECHANISM
    name: "동적 가격"
    category: ALGORITHM
    level: ADVANCED
    description: "수요 · 재고 · 경쟁가에 따라 가격을 자주 바꾼다. 담아 둔 가격과 결제 가격이 달라질 수 있어 주문서 재계산이 전제다"
    synonyms: ["dynamic pricing"]
    causes: [cat-price-mismatch]
  - id: cat-float-money-error
    kind: PROBLEM
    name: "부동소수점 금액 오차"
    category: DATA
    level: BEGINNER
    description: "double 로 금액을 계산하면 0.1 + 0.2 같은 오차가 쌓여 합계 · 환불 · 대사가 원 단위로 어긋난다"
  - id: cat-price-mismatch
    kind: PROBLEM
    name: "노출 가격과 결제 가격 불일치"
    category: DATA
    level: INTERMEDIATE
    description: "목록 · 장바구니에 보인 가격과 주문서 가격이 다르다. 캐시 · 규칙 경로가 둘이거나 그사이 가격이 바뀐 탓이다"

  - id: cat-seller-onboarding
    kind: STAGE
    name: "판매자 · 입점 (마켓플레이스)"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "판매자가 신청하고 승인받아 상품을 올리며, 자기 상품만 고칠 수 있게 한다. 수수료율 · 정산 주기 · 계좌가 판매자에 붙는다"
    questions: ["판매자 권한을 JWT 역할만으로 판정하면 정지 처분이 언제 먹나"]
    contains: [cat-seller-application, cat-seller-state-machine, cat-product-ownership, cat-marketplace-model, cat-seller-pii-purge]
  - id: cat-seller-application
    kind: MECHANISM
    name: "입점 신청 · 심사"
    category: DATA
    level: BEGINNER
    description: "상호 · 사업자번호 · 대표자 · 정산 계좌를 받아 심사하고, 승인 때 수수료율을 정한다"
    code:
      - { path: seller/domain/src/main/kotlin/com/kgd/seller/domain/seller/model/Seller.kt, symbol: "fun approve(commissionRateBp: Int, now: Instant)", note: "승인 + 수수료율" }
    uses: [cat-seller-state-machine]
  - id: cat-seller-state-machine
    kind: MECHANISM
    name: "판매자 상태 (신청 · 활성 · 정지 · 반려)"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "PENDING → ACTIVE | REJECTED, ACTIVE ↔ SUSPENDED. 정지된 판매자의 상품은 판매를 멈추고 진행 중 주문은 계속 이행 · 정산한다"
    code:
      - { path: seller/domain/src/main/kotlin/com/kgd/seller/domain/seller/model/SellerStatus.kt, symbol: "fun canTransitionTo(target: SellerStatus)", note: "판매자 전이 표" }
  - id: cat-product-ownership
    kind: MECHANISM
    name: "상품 소유 판정"
    category: SECURITY
    level: INTERMEDIATE
    description: "상품 쓰기는 그 상품의 ACTIVE 판매자나 관리자만 한다. 판매자 id 는 요청 본문이 아니라 요청자의 판매자 행에서 정한다"
    code:
      - { path: product/feature/src/main/kotlin/com/kgd/product/application/product/service/ProductWriteAuthorizer.kt, symbol: "class ProductWriteAuthorizer(", note: "판매자 · 관리자 소유 검사" }
    uses: [rbac]
    mitigates: [sec-identity-spoofing]
  - id: cat-marketplace-model
    kind: MECHANISM
    name: "마켓플레이스 · 직매입 (3P · 1P)"
    category: ARCHITECTURE
    level: BEGINNER
    description: "직매입(1P)은 플랫폼이 재고를 사서 팔고, 마켓플레이스(3P)는 판매자가 팔고 플랫폼은 수수료를 받는다. 재고 소유 · 정산 · 세금계산서 주체가 달라진다"
    synonyms: ["1P", "3P", "위탁 판매"]
  - id: cat-seller-pii-purge
    kind: MECHANISM
    name: "반려 신청 개인정보 파기"
    category: SECURITY
    level: BEGINNER
    description: "반려된 입점 신청의 대표자 · 계좌 정보를 정해진 날짜 뒤 지운다. 이력 행은 남기고 개인정보만 비운다"
    code:
      - { path: seller/feature/src/main/kotlin/com/kgd/seller/infrastructure/scheduler/RejectedSellerPurgeScheduler.kt, symbol: "class RejectedSellerPurgeScheduler(", note: "반려 30일 후 파기" }

  # ───────────── 전시 · 탐색 ─────────────
  - id: cat-display-domain
    kind: DOMAIN
    name: "전시 · 탐색"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "상품을 어디에 어떤 순서로 보여 줄지 편성하고, 목록 · 필터 · 상세로 고객이 찾게 한다"
    contains: [cat-merchandising, cat-product-discovery]
    flows_to: [cat-cart]
  - id: cat-merchandising
    kind: STAGE
    name: "전시 · 머천다이징"
    category: DATA
    level: INTERMEDIATE
    description: "기획전 · 코너 · 배너에 상품을 편성하고 기간 · 순서 · 품절 표시를 관리한다"
    synonyms: ["merchandising", "MD"]
    questions: ["전시 화면을 캐시할 때 품절 · 가격 변경은 어떻게 반영하나"]
    contains: [cat-display-slot, cat-display-schedule, cat-best-seller-ranking, cat-product-detail-page, cat-stock-display, cat-display-cache]
  - id: cat-display-slot
    kind: MECHANISM
    name: "전시 영역 · 기획전 편성"
    category: DATA
    level: BEGINNER
    description: "화면의 영역(코너 · 배너 · 기획전)에 상품 목록이나 조건을 연결한다. 편성은 상품이 아니라 전시 쪽 데이터다"
    synonyms: ["display corner", "기획전"]
  - id: cat-display-schedule
    kind: MECHANISM
    name: "전시 기간 · 예약 노출"
    category: DATA
    level: BEGINNER
    description: "전시 편성에 시작 · 종료 시각을 두고 시각이 되면 자동으로 켜고 끈다"
  - id: cat-best-seller-ranking
    kind: MECHANISM
    name: "베스트 · 인기 순위"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "판매량 · 조회 · 전환을 기간 가중으로 합쳐 순위를 만든다. 오래된 판매가 순위를 붙잡지 않게 감쇠를 둔다"
    synonyms: ["best seller"]
    measured_by: [cat-conversion-rate, ctr]
  - id: cat-product-detail-page
    kind: MECHANISM
    name: "상품 상세 (PDP)"
    category: DATA
    level: BEGINNER
    description: "옵션 선택 · 가격 · 재고 · 배송 정보 · 고시 정보를 한 화면에 모은다. 가격은 표시용이고 금액은 주문서가 정한다"
    synonyms: ["PDP", "product detail page"]
    code:
      - { path: portal-fe/src/pages/ShopProductDetailPage.tsx, symbol: "export default function ShopProductDetailPage()", note: "상세 + 수량 + 구매" }
  - id: cat-stock-display
    kind: MECHANISM
    name: "품절 · 재고 표시"
    category: DATA
    level: BEGINNER
    description: "상품 쪽 재고 사본으로 품절 · 남은 수량을 대략 표시한다. 정확한 판정은 재고 예약 때 한다"
    code:
      - { path: product/domain/src/main/kotlin/com/kgd/product/domain/product/model/Product.kt, symbol: "fun syncStock(availableQty: Int)", note: "재고 이벤트로 표시값 갱신" }
    uses: [cat-stock-ssot]
  - id: cat-display-cache
    kind: MECHANISM
    name: "전시 캐시"
    category: DATA
    level: INTERMEDIATE
    description: "목록 · 상세를 캐시해 조회를 흡수한다. 가격 · 품절은 짧은 TTL 이나 이벤트 무효화로 따라간다"
    uses: [caching, data-ttl-expiration]
    causes: [data-stale-cache, cat-price-mismatch]
  - id: cat-product-discovery
    kind: STAGE
    name: "상품 목록 · 탐색"
    category: DATA
    level: INTERMEDIATE
    description: "카테고리 · 필터 · 정렬 · 검색으로 상품 목록을 만든다. 텍스트 검색은 검색 시스템 도메인이 맡는다"
    contains: [cat-product-listing, cat-faceted-filter, cat-catalog-search-sync, cat-product-republish, cat-conversion-rate]
    measured_by: [cat-conversion-rate]
  - id: cat-product-listing
    kind: MECHANISM
    name: "상품 목록 · 정렬 · 페이징"
    category: DATA
    level: BEGINNER
    description: "판매 상태 · 카테고리 · 판매자 조건으로 거르고 최신 · 가격 · 인기 순으로 정렬해 페이지로 나눈다"
    code:
      - { path: product/feature/src/main/kotlin/com/kgd/product/infrastructure/persistence/product/repository/ProductQueryRepository.kt, symbol: "fun findAllByStatus(", note: "상태 · 판매자 조건 목록" }
    uses: [cat-faceted-filter, querydsl]
  - id: cat-faceted-filter
    kind: MECHANISM
    name: "패싯 필터"
    category: DATA
    level: INTERMEDIATE
    description: "브랜드 · 가격대 · 속성 값별 개수를 함께 보여 주며 거른다. 속성을 색인에 펴 두어야 집계가 빠르다"
    synonyms: ["faceted navigation", "facet"]
    uses: [cat-attribute-model]
  - id: cat-catalog-search-sync
    kind: MECHANISM
    name: "상품 → 검색 색인 동기화"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "상품 이벤트를 받아 검색 색인을 갱신한다. 이벤트를 놓치면 목록과 검색 결과가 어긋나므로 전체 재발행 경로를 함께 둔다"
    uses: [cat-product-event-publishing, opensearch]
  - id: cat-product-republish
    kind: MECHANISM
    name: "상품 재발행 (사본 재구축)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "모든 상품의 현재 상태를 이벤트로 다시 내 주문 읽기 모델 · 검색 색인 같은 사본을 처음부터 채운다"
    code:
      - { path: product/feature/src/main/kotlin/com/kgd/product/application/product/service/ProductRepublishService.kt, symbol: "class ProductRepublishService(", note: "전체 재발행" }
    uses: [cat-product-event-publishing]
  - id: cat-conversion-rate
    kind: METRIC
    name: "구매 전환율"
    category: DATA
    level: BEGINNER
    description: "상품 조회 · 목록 노출 대비 구매로 이어진 비율"
    synonyms: ["CVR", "conversion rate"]

  # ───────────── 장바구니 ─────────────
  - id: cat-cart
    kind: STAGE
    name: "장바구니"
    category: DATA
    level: BEGINNER
    description: "구매할 상품 · 수량을 모아 둔다. 가격은 담지 않고 주문서가 그때 다시 계산한다"
    synonyms: ["cart", "basket"]
    questions: ["장바구니에 가격을 저장하지 않는 이유는 무엇인가"]
    contains: [cat-cart-model, cat-guest-cart-merge, cat-cart-revalidation, cat-cart-seller-grouping, cat-wishlist, cat-cart-abandonment-rate]
    measured_by: [cat-cart-abandonment-rate]
  - id: cat-cart-model
    kind: MECHANISM
    name: "장바구니 모델"
    category: DATA
    level: BEGINNER
    description: "회원 · 상품(SKU) · 수량 한 줄씩. 판매자가 섞여도 되고 수량 상한을 둔다"
    code:
      - { path: order/domain/src/main/kotlin/com/kgd/order/domain/cart/model/CartItem.kt, symbol: "data class CartItem(", note: "가격 없는 장바구니 줄" }
    uses: [cat-term-sku]
  - id: cat-guest-cart-merge
    kind: MECHANISM
    name: "비회원 장바구니 병합"
    category: DATA
    level: INTERMEDIATE
    description: "로그인 전 브라우저에 담은 장바구니를 로그인 뒤 회원 장바구니와 합친다. 같은 상품의 수량 규칙을 정해 둔다"
    uses: [cat-cart-model]
  - id: cat-cart-revalidation
    kind: MECHANISM
    name: "장바구니 재검증"
    category: DATA
    level: INTERMEDIATE
    description: "장바구니를 열거나 주문서로 넘길 때 가격 · 판매 상태 · 재고를 다시 확인해 바뀐 것을 알려 준다"
    mitigates: [cat-price-mismatch]
  - id: cat-cart-seller-grouping
    kind: MECHANISM
    name: "판매자별 묶음 · 배송비 그룹"
    category: DATA
    level: BEGINNER
    description: "장바구니를 판매자(배송 그룹)별로 묶어 그룹마다 배송비와 무료 배송 기준을 보여 준다"
    uses: [cat-shipping-fee-policy]
  - id: cat-wishlist
    kind: MECHANISM
    name: "찜 (위시리스트)"
    category: DATA
    level: BEGINNER
    description: "지금 사지 않을 상품을 모아 둔다. 수량이 없고 가격 인하 · 재입고 알림의 대상이 된다"
    synonyms: ["wishlist"]
  - id: cat-cart-abandonment-rate
    kind: METRIC
    name: "장바구니 이탈률"
    category: DATA
    level: BEGINNER
    description: "장바구니에 담고 주문하지 않은 비율"
    synonyms: ["cart abandonment"]

  # ───────────── 재고 ─────────────
  - id: cat-inventory-domain
    kind: DOMAIN
    name: "재고"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "판매 가능한 수량을 한 곳(SSOT)에서 관리하고, 주문에 예약 → 확정 → 해제로 붙였다 뗀다. 동시 주문에서 초과 판매를 막는 것이 핵심이다"
    synonyms: ["inventory"]
    contains: [cat-stock-model, cat-stock-reservation, cat-stock-concurrency, cat-warehouse-allocation]
  - id: cat-stock-model
    kind: STAGE
    name: "재고 모델"
    category: DATA
    level: INTERMEDIATE
    description: "실재고 · 가용 · 예약 수량을 나누고 입출고를 이력으로 남긴다. 상품 쪽 재고는 표시용 사본이다"
    questions: ["상품 서비스의 재고 값을 판매 판정에 쓰면 안 되는 이유는 무엇인가"]
    contains: [cat-available-reserved, cat-stock-ssot, cat-stock-ledger, cat-safety-stock, cat-preorder-backorder, cat-limited-quantity]
    flows_to: [cat-stock-reservation]
  - id: cat-available-reserved
    kind: MECHANISM
    name: "가용 · 예약 수량 분리"
    category: DATA
    level: INTERMEDIATE
    description: "예약하면 가용에서 예약으로 옮기고, 확정하면 예약에서 빼고, 해제하면 가용으로 되돌린다. 실재고 = 가용 + 예약이다"
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/model/Inventory.kt, symbol: "fun reserve(qty: Int)", note: "가용 → 예약" }
    uses: [cat-term-available-qty, cat-term-reserved-qty, cat-term-on-hand]
  - id: cat-stock-ssot
    kind: MECHANISM
    name: "재고 SSOT · 상품 재고 사본"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "재고 변동은 재고 서비스에서만 일어나고, 상품의 재고 필드는 재고 이벤트로 덮어쓰는 읽기 전용 사본이다"
    synonyms: ["inventory SSOT"]
    code:
      - { path: product/feature/src/main/kotlin/com/kgd/product/infrastructure/messaging/InventoryStockSyncConsumer.kt, symbol: "class InventoryStockSyncConsumer(", note: "inventory.stock.* → 상품 재고" }
    uses: [cqrs, eventual-consistency]
  - id: cat-stock-ledger
    kind: MECHANISM
    name: "재고 수불 (입고 · 출고 · 조정)"
    category: DATA
    level: BEGINNER
    description: "입고 · 출고 · 반품 입고 · 실사 조정을 사건으로 남긴다. 현재 수량이 어떻게 됐는지 설명할 수 있어야 한다"
    synonyms: ["stock movement", "수불"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/model/Inventory.kt, symbol: "fun receive(qty: Int)", note: "입고" }
  - id: cat-safety-stock
    kind: MECHANISM
    name: "안전 재고 · 판매 버퍼"
    category: DATA
    level: INTERMEDIATE
    description: "실재고 일부를 판매 가능 수량에서 빼 둬 파손 · 실사 오차 · 동시성 틈으로 인한 초과 판매를 흡수한다"
    synonyms: ["safety stock"]
    mitigates: [cat-oversell]
  - id: cat-preorder-backorder
    kind: MECHANISM
    name: "예약 판매 · 백오더"
    category: DATA
    level: INTERMEDIATE
    description: "입고 전 상품을 입고 예정 수량으로 미리 판다. 입고가 늦으면 출고가 밀리므로 고객 고지와 취소 규칙이 따른다"
    synonyms: ["pre-order", "backorder"]
  - id: cat-limited-quantity
    kind: MECHANISM
    name: "한정 수량 · 날짜별 재고"
    category: DATA
    level: INTERMEDIATE
    description: "물리 재고가 없는 상품(티켓 · 숙박 · 쿠폰형)은 판매 한도나 날짜 · 회차별 수량을 재고로 삼는다"
    synonyms: ["allotment", "판매 한도"]
  - id: cat-stock-reservation
    kind: STAGE
    name: "재고 예약 · 차감"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "주문에 재고를 보류 기한이 있는 예약으로 붙이고, 결제 승인 뒤 확정(차감)하고, 실패 · 만료 · 취소면 해제한다"
    questions:
      - "재고를 주문 시점 · 결제 시점 · 출고 시점 중 언제 차감하나, 각각 무엇을 감수하나"
      - "보류 기한이 결제 결론보다 짧으면 어떤 일이 생기나"
    contains: [cat-reservation-hold, cat-reservation-confirm, cat-reservation-release, cat-restock, cat-deduction-timing, cat-all-or-nothing-reservation, cat-inventory-command-idempotency, cat-oversell, cat-stock-hoarding, cat-reservation-expiry-count]
    measured_by: [cat-reservation-expiry-count]
  - id: cat-reservation-hold
    kind: MECHANISM
    name: "재고 예약 (보류 기한)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "주문 · 상품 · 창고 · 수량 · 만료 시각을 가진 예약 행을 만들고 그만큼 가용을 줄인다"
    synonyms: ["reservation", "soft allocation"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/reservation/model/Reservation.kt, symbol: "class Reservation private constructor(", note: "예약 행" }
    uses: [cat-available-reserved, dist-semantic-lock]
    causes: [cat-stock-hoarding]
  - id: cat-reservation-confirm
    kind: MECHANISM
    name: "예약 확정 (차감)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "결제가 승인되면 예약을 CONFIRMED 로 바꾸고 예약 수량에서 뺀다. 이후 만료되지 않는다"
    synonyms: ["hard allocation", "차감"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/reservation/model/Reservation.kt, symbol: "fun confirm()", note: "ACTIVE → CONFIRMED" }
  - id: cat-reservation-release
    kind: MECHANISM
    name: "예약 해제 · 만료"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "보상 · 취소면 해제하고, 기한이 지난 ACTIVE 예약은 스케줄러가 만료시켜 가용으로 돌린다"
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/reservation/service/ReservationExpiryService.kt, symbol: "class ReservationExpiryService(", note: "만료 스케줄러" }
    mitigates: [cat-stock-hoarding]
  - id: cat-restock
    kind: MECHANISM
    name: "재입고 (클레임 되돌림)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "확정된 예약을 취소 · 반품으로 되돌릴 때 확정 수량 안에서 가용으로 돌려놓는다. 같은 되돌림이 두 번 오지 않게 키로 거른다"
    synonyms: ["restock"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/reservation/model/Reservation.kt, symbol: "fun restock(qty: Int)", note: "확정분 되돌림" }
  - id: cat-deduction-timing
    kind: MECHANISM
    name: "차감 시점 (주문 · 결제 · 출고)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "주문 때 차감하면 미결제 주문이 재고를 묶고, 결제 때 차감하면 결제 도중 품절이 나고, 출고 때 차감하면 초과 판매가 난다. 예약 + 확정이 절충안이다"
    uses: [cat-reservation-hold, cat-reservation-confirm]
  - id: cat-all-or-nothing-reservation
    kind: MECHANISM
    name: "주문 단위 전부 아니면 전무 예약"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "한 주문의 여러 라인 예약을 한 트랜잭션에서 전부 성공시키거나 전부 실패시킨다. 부족은 예외가 아니라 실패 이벤트로 답한다"
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/inventory/service/InventoryService.kt, symbol: "override fun execute(command: ReserveOrderStockUseCase.Command)", note: "주문 단위 예약" }
    uses: [cat-stock-pessimistic-lock, cat-warehouse-selection]
  - id: cat-inventory-command-idempotency
    kind: MECHANISM
    name: "재고 명령 멱등 (주문 · 명령 키)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "사가가 같은 예약 · 확정 명령을 다시 보내도 저장해 둔 첫 답을 그대로 돌려준다"
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/reservation/service/InventoryCommandService.kt, symbol: "private fun replay(orderId: Long, commandKey: String)", note: "저장된 답 재생" }
    uses: [idempotency]
    mitigates: [dist-duplicate-delivery]
  - id: cat-oversell
    kind: PROBLEM
    name: "초과 판매 (oversell)"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "동시 주문이나 늦은 동기화로 실재고보다 많이 판다. 결제 뒤 취소 · 보상 비용과 고객 불만이 따른다"
    synonyms: ["overselling"]
  - id: cat-stock-hoarding
    kind: PROBLEM
    name: "재고 묶임 (미결제 예약)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "결제되지 않은 예약이 기한까지 재고를 붙잡아 실제 살 사람이 품절을 본다"
  - id: cat-reservation-expiry-count
    kind: METRIC
    name: "예약 만료 수"
    category: DATA
    level: INTERMEDIATE
    description: "기한이 지나 풀린 예약 수. 결제 이탈 · 사가 지연을 드러낸다"
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/metrics/InventoryMetrics.kt, symbol: "override fun incrementReservationExpired(", note: "만료 카운터" }

  - id: cat-stock-concurrency
    kind: STAGE
    name: "재고 동시성"
    category: CONCURRENCY
    level: ADVANCED
    description: "같은 재고 행을 동시에 줄이는 요청을 락 · 조건부 갱신 · 원자 차감 · 입장 제어로 다룬다. 경합 정도에 따라 방식을 고른다"
    questions:
      - "낙관적 락 · 비관적 락 · 조건부 UPDATE · Redis 선차감은 각각 어떤 경합 수준에 맞나"
      - "여러 재고 행을 잠글 때 교착을 어떻게 피하나"
    contains: [cat-stock-optimistic-lock, cat-stock-pessimistic-lock, cat-conditional-update, cat-redis-prededuction, cat-cache-db-reconciliation, cat-admission-control, cat-stock-bucketing, cat-hot-sku-contention]
  - id: cat-stock-optimistic-lock
    kind: MECHANISM
    name: "재고 행 낙관적 락"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "@Version 으로 충돌을 감지하고 재시도한다. 경합이 낮을 때 싸지만 인기 상품에서는 재시도가 폭주한다"
    synonyms: ["낙관적 락", "@Version"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/persistence/inventory/entity/InventoryJpaEntity.kt, symbol: "@Version", note: "재고 행 버전" }
    uses: [optimistic-lock]
    causes: [dist-retry-storm]
    mitigates: [data-lost-update]
  - id: cat-stock-pessimistic-lock
    kind: MECHANISM
    name: "재고 행 비관적 락 (정렬된 FOR UPDATE)"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "SELECT … FOR UPDATE 로 행을 잠그고 줄인다. 여러 행이면 id 오름차순으로 잠가 교착을 피한다. 경합이 높고 트랜잭션이 짧을 때 맞다"
    synonyms: ["비관적 락", "SELECT FOR UPDATE"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/persistence/inventory/repository/InventoryJpaRepository.kt, symbol: "@Lock(LockModeType.PESSIMISTIC_WRITE)", note: "행 잠금 조회" }
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/persistence/inventory/adapter/InventoryRepositoryAdapter.kt, symbol: ".sorted()", note: "id 순서로 잠근다" }
    uses: [pessimistic-lock, data-lock-ordering]
    alternative_to: [cat-stock-optimistic-lock]
    mitigates: [cat-oversell, deadlock]
    causes: [conc-lock-contention]
  - id: cat-conditional-update
    kind: MECHANISM
    name: "원자적 조건부 갱신"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "UPDATE … SET qty = qty - n WHERE qty >= n 한 문장으로 확인과 차감을 같이 한다. 영향 행 수 0 이 곧 부족이다. 가장 단순하고 빠르다"
    synonyms: ["conditional update", "compare-and-set UPDATE"]
    code:
      - { path: promotion/feature/src/main/kotlin/com/kgd/promotion/infrastructure/persistence/coupon/repository/CouponRepositories.kt, symbol: "fun incrementIssuedIfBelowLimit(", note: "쿠폰 발행 상한을 한 문장으로" }
    uses: [atomic-operation]
    alternative_to: [cat-stock-pessimistic-lock]
    mitigates: [cat-oversell, race-condition]
  - id: cat-redis-prededuction
    kind: MECHANISM
    name: "Redis 선차감 (Lua 원자 차감)"
    category: CONCURRENCY
    level: ADVANCED
    description: "Lua 스크립트로 Redis 에서 확인 · 차감을 원자적으로 하고 DB 는 뒤에 반영한다. 초당 수천 건 티켓팅에 맞고 DB 와 대사가 필수다"
    synonyms: ["Redis 선차감"]
    code:
      - { path: commerce/app/src/main/resources/scripts/reserve-stock.lua, symbol: "redis.call('HINCRBY', key, 'availableQty', -qty)", note: "가용 확인 후 원자 차감" }
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/cache/InventoryCacheAdapter.kt, symbol: "scripts/reserve-stock.lua", note: "스크립트 실행" }
    uses:
      - redis
      - atomic-operation
      - cat-cache-db-reconciliation
      - { to: data-lua-script, reason: "확인과 차감을 한 번에 원자적으로 한다" }
    alternative_to: [cat-conditional-update]
    mitigates: [cat-hot-sku-contention]
  - id: cat-cache-db-reconciliation
    kind: MECHANISM
    name: "캐시 · DB 재고 대사"
    category: DATA
    level: INTERMEDIATE
    description: "Redis 재고와 DB 재고를 주기적으로 비교해 어긋난 것을 DB 기준으로 고친다"
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/inventory/service/InventoryReconciliationService.kt, symbol: "class InventoryReconciliationService(", note: "주기 대사" }
  - id: cat-admission-control
    kind: MECHANISM
    name: "입장 제어 · 대기열"
    category: CONCURRENCY
    level: ADVANCED
    description: "트래픽이 재고보다 수백 배 많을 때 동시 처리 수를 세어 넘치면 429 나 순번으로 앞단에서 거른다"
    synonyms: ["admission control", "virtual waiting room"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/admission/AdmissionControlFilter.kt, symbol: "class AdmissionControlFilter(", note: "동시 예약 수 초과 시 429" }
    uses: [rate-limiting, redis]
    mitigates: [cat-hot-sku-contention]
  - id: cat-stock-bucketing
    kind: MECHANISM
    name: "재고 분할 (버킷)"
    category: CONCURRENCY
    level: ADVANCED
    description: "한 SKU 재고를 여러 행 · 키로 나눠 담아 잠금 경합을 분산한다. 남은 수량이 적어지면 버킷을 합친다"
    synonyms: ["stock sharding", "inventory bucket"]
    uses: [sharding]
    mitigates: [cat-hot-sku-contention]
  - id: cat-hot-sku-contention
    kind: PROBLEM
    name: "인기 상품 경합 (hot SKU)"
    category: CONCURRENCY
    level: ADVANCED
    description: "한정 판매처럼 요청이 한 재고 행에 몰려 락 대기와 재시도가 폭주하고 DB 가 버티지 못한다"
    causes: [conc-lock-contention]

  - id: cat-warehouse-allocation
    kind: STAGE
    name: "창고 · 할당"
    category: DATA
    level: INTERMEDIATE
    description: "재고를 어느 창고에서 낼지 고르고 주문을 창고로 라우팅한다. 창고별 재고를 따로 관리한다"
    questions: ["한 주문의 상품들이 한 창고에 다 없을 때 어떻게 나누나"]
    contains: [cat-warehouse-master, cat-warehouse-selection, cat-multi-warehouse-split, cat-order-routing, cat-cycle-count]
  - id: cat-warehouse-master
    kind: MECHANISM
    name: "창고 마스터"
    category: DATA
    level: BEGINNER
    description: "창고 위치 · 활성 여부를 관리한다. 재고는 (상품, 창고) 쌍으로 쌓인다"
    code:
      - { path: warehouse/domain/src/main/kotlin/com/kgd/warehouse/domain/warehouse/model/Warehouse.kt, symbol: "class Warehouse private constructor(", note: "창고" }
  - id: cat-warehouse-selection
    kind: MECHANISM
    name: "창고 선택 규칙"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "수량을 한 번에 낼 수 있는 창고 중 가용이 가장 많은 곳을 고르는 식의 규칙으로 창고를 정한다"
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/service/WarehouseSelector.kt, symbol: "object WarehouseSelector", note: "가용 많은 창고 우선" }
    uses: [cat-warehouse-master]
  - id: cat-multi-warehouse-split
    kind: MECHANISM
    name: "다창고 분할 할당"
    category: ALGORITHM
    level: ADVANCED
    description: "한 창고로 못 채우는 주문을 여러 창고로 쪼갠다. 송장이 늘어 배송비와 고객 경험 비용이 생긴다"
    uses: [cat-warehouse-selection]
  - id: cat-order-routing
    kind: MECHANISM
    name: "주문 라우팅 (거리 · 비용 · 재고)"
    category: ALGORITHM
    level: ADVANCED
    description: "배송지와의 거리 · 출고 비용 · 재고 균형 · 마감 시각을 점수로 합쳐 출고 창고를 정한다"
    synonyms: ["order routing", "distributed order management"]
    alternative_to: [cat-warehouse-selection]
  - id: cat-cycle-count
    kind: MECHANISM
    name: "실사 · 재고 조정"
    category: DATA
    level: BEGINNER
    description: "실제 수량을 세어 시스템 수량과의 차이를 조정 사건으로 반영한다"
    synonyms: ["cycle count", "stocktaking"]
    uses: [cat-stock-ledger]

  # ───────────── 혜택 ─────────────
  - id: cat-promotion-domain
    kind: DOMAIN
    name: "혜택 (프로모션 · 쿠폰 · 포인트)"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "할인 · 쿠폰 · 포인트를 설계하고 주문에 예약 · 확정 · 원복으로 붙인다. 누가 할인을 부담하는지가 정산까지 따라간다"
    synonyms: ["promotion", "benefit"]
    contains: [cat-promotion-design, cat-points, cat-benefit-hold]
  - id: cat-promotion-design
    kind: STAGE
    name: "프로모션 설계"
    category: DATA
    level: INTERMEDIATE
    description: "즉시 할인 · 쿠폰의 종류 · 조건 · 중첩 규칙 · 예산 · 부담 주체를 정한다"
    questions:
      - "여러 할인이 겹칠 때 적용 순서가 결과 금액을 어떻게 바꾸나"
      - "쿠폰 발행 상한을 동시 요청에서 어떻게 지키나"
    contains: [cat-instant-discount, cat-coupon-definition, cat-coupon-issuance, cat-coupon-types, cat-discount-stacking, cat-cost-bearer, cat-promotion-budget, cat-abuse-prevention, cat-promotion-abuse]
  - id: cat-instant-discount
    kind: MECHANISM
    name: "즉시 할인"
    category: DATA
    level: BEGINNER
    description: "쿠폰 없이 상품 가격에 바로 붙는 할인. 전시 가격에 반영되고 쿠폰보다 먼저 적용하는 것이 보통이다"
    synonyms: ["instant discount"]
  - id: cat-coupon-definition
    kind: MECHANISM
    name: "쿠폰 정의 (정액 · 정률 · 최대 할인 · 최소 주문 금액)"
    category: DATA
    level: BEGINNER
    description: "할인 방식 · 최대 할인 · 최소 주문 금액 · 기간 · 대상 · 부담 주체를 가진 규칙. 대상 라인에 적용 가능 여부와 할인액을 계산한다"
    code:
      - { path: promotion/domain/src/main/kotlin/com/kgd/promotion/domain/coupon/model/CouponDefinition.kt, symbol: "fun evaluate(lines: List<CouponLine>, now: Instant)", note: "적용 가능 여부 · 할인액" }
      - { path: promotion/domain/src/main/kotlin/com/kgd/promotion/domain/coupon/model/CouponType.kt, symbol: "enum class CouponType { FIXED, RATE }", note: "정액 · 정률" }
    uses: [cat-term-coupon, cat-term-min-order-amount, cat-rounding-rule]
  - id: cat-coupon-issuance
    kind: MECHANISM
    name: "쿠폰 발급 · 발행 상한"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "선착순 발급은 조건부 UPDATE 로 상한을 지키고, 1인 1매는 (회원, 쿠폰) 유니크로 막는다"
    code:
      - { path: promotion/feature/src/main/kotlin/com/kgd/promotion/application/coupon/service/CouponClaimService.kt, symbol: "class CouponClaimService(", note: "발급 + 상한" }
    uses: [cat-conditional-update]
  - id: cat-coupon-types
    kind: MECHANISM
    name: "쿠폰 종류 (상품 · 장바구니 · 배송비 · 중복)"
    category: DATA
    level: BEGINNER
    description: "상품 단위 · 주문 전체 · 배송비 쿠폰과 다른 쿠폰과 함께 쓸 수 있는 중복 쿠폰을 나눈다. 종류마다 안분 대상이 다르다"
  - id: cat-discount-stacking
    kind: MECHANISM
    name: "할인 중첩 · 적용 순서"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "즉시 할인 → 상품 쿠폰 → 장바구니 쿠폰 → 포인트처럼 순서를 고정하고 무엇끼리 겹칠 수 있는지 규칙으로 둔다. 정률 할인은 순서에 따라 금액이 달라진다"
    synonyms: ["discount stacking"]
    uses: [cat-coupon-types, cat-instant-discount]
  - id: cat-cost-bearer
    kind: MECHANISM
    name: "할인 부담 주체 (플랫폼 · 판매자 · 분담)"
    category: DATA
    level: INTERMEDIATE
    description: "할인액을 플랫폼이 낼지 판매자가 낼지 비율로 나눌지 정한다. 판매자 부담분만 판매자 순매출을 줄이고 플랫폼 부담분은 판촉 비용이 된다"
    synonyms: ["부담 주체", "cost bearer", "분담률"]
    code:
      - { path: promotion/domain/src/main/kotlin/com/kgd/promotion/domain/coupon/model/CouponType.kt, symbol: "enum class CouponBearer { PLATFORM, SELLER }", note: "부담 주체" }
  - id: cat-promotion-budget
    kind: MECHANISM
    name: "프로모션 예산 · 소진"
    category: DATA
    level: INTERMEDIATE
    description: "할인 총액 · 발급 수에 상한을 두고 소진되면 자동 종료한다. 소진 판정도 조건부 갱신으로 원자적으로 한다"
    uses: [cat-conditional-update]
  - id: cat-abuse-prevention
    kind: MECHANISM
    name: "혜택 남용 방지"
    category: SECURITY
    level: INTERMEDIATE
    description: "1인 1매 · 기기 · 결제 수단 단위 제한과 발급 속도 제한으로 다중 계정 · 재사용을 막는다"
    uses: [rate-limiting]
    mitigates: [cat-promotion-abuse]
  - id: cat-promotion-abuse
    kind: PROBLEM
    name: "혜택 남용"
    category: SECURITY
    level: INTERMEDIATE
    description: "다중 계정 · 주문 후 취소 반복 · 쿠폰 재사용으로 혜택을 부당하게 챙긴다"
    synonyms: ["promotion abuse", "체리피킹"]
  - id: cat-points
    kind: STAGE
    name: "포인트 · 적립금"
    category: DATA
    level: INTERMEDIATE
    description: "포인트를 추가 전용 원장으로 적립 · 사용 · 원복 · 소멸하고 잔액은 음수가 되지 않게 한다"
    questions: ["포인트 잔액을 컬럼 하나로만 관리하면 무엇을 잃나"]
    contains: [cat-point-ledger, cat-point-expiry, cat-point-accrual]
  - id: cat-point-ledger
    kind: MECHANISM
    name: "포인트 원장"
    category: DATA
    level: INTERMEDIATE
    description: "적립 · 사용 · 사용 취소 · 원복을 멱등 키와 함께 한 줄씩 추가하고, 잔액 행은 버전으로 동시 갱신을 막는다"
    synonyms: ["point ledger"]
    code:
      - { path: promotion/domain/src/main/kotlin/com/kgd/promotion/domain/point/model/PointBalance.kt, symbol: "class PointBalance private constructor(", note: "잔액 + 원장 항목" }
    uses: [cat-term-point, optimistic-lock]
  - id: cat-point-expiry
    kind: MECHANISM
    name: "포인트 소멸 (유효기간 · 선입선출)"
    category: DATA
    level: INTERMEDIATE
    description: "적립 건마다 유효기간을 두고 사용 때 먼저 소멸될 것부터 차감한다. 소멸 예정액을 미리 알린다"
    uses: [cat-point-ledger]
  - id: cat-point-accrual
    kind: MECHANISM
    name: "구매 적립"
    category: DATA
    level: BEGINNER
    description: "구매 확정 시점에 결제액 기준으로 적립한다. 확정 전에 주면 취소 때 회수가 필요하다"
    uses: [cat-point-ledger]
  - id: cat-benefit-hold
    kind: STAGE
    name: "혜택 예약 · 확정"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "주문 사가 안에서 쿠폰 · 포인트를 예약(Try)하고 결제 뒤 확정(Confirm)하거나 실패 때 취소(Cancel)한다. 주문 id 로 멱등이다"
    questions: ["쿠폰 · 포인트를 결제 전에 바로 차감하지 않고 예약하는 이유는 무엇인가"]
    contains: [cat-benefit-tcc-hold, cat-coupon-state, cat-hold-expiry, cat-benefit-restore]
  - id: cat-benefit-tcc-hold
    kind: MECHANISM
    name: "혜택 예약 (TCC — Try · Confirm · Cancel)"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "쿠폰을 RESERVED 로, 포인트를 보류로 잡아 두고 확정 · 취소 명령을 기다린다. 예약 모델이라 쿠폰 · 포인트에 잘 맞는다"
    synonyms: ["TCC", "promotion hold"]
    code:
      - { path: promotion/domain/src/main/kotlin/com/kgd/promotion/domain/hold/model/PromotionHold.kt, symbol: "class PromotionHold private constructor(", note: "주문별 혜택 보류" }
    uses: [dist-tcc, cat-coupon-state, cat-point-ledger, idempotency]
  - id: cat-coupon-state
    kind: MECHANISM
    name: "사용자 쿠폰 상태"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "AVAILABLE → RESERVED → USED, 취소면 AVAILABLE 로, 전체 취소 뒤 반환 · 만료가 있다. 한 쿠폰은 한 주문에만 예약된다"
    code:
      - { path: promotion/domain/src/main/kotlin/com/kgd/promotion/domain/coupon/model/UserCoupon.kt, symbol: "enum class UserCouponStatus", note: "쿠폰 상태" }
  - id: cat-hold-expiry
    kind: MECHANISM
    name: "혜택 보류 만료"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "확정되지 않은 혜택 보류를 기한 뒤 풀고 만료 이벤트를 낸다. 사가는 이것을 받아 보상한다"
    code:
      - { path: promotion/feature/src/main/kotlin/com/kgd/promotion/infrastructure/scheduler/PromotionHoldExpiryScheduler.kt, symbol: "class PromotionHoldExpiryScheduler(", note: "만료 스케줄러" }
    uses: [cat-benefit-tcc-hold]
  - id: cat-benefit-restore
    kind: MECHANISM
    name: "혜택 원복"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "확정 뒤 취소되면 포인트 안분분을 원복하고, 전체 취소면 기간 안의 쿠폰을 돌려준다. 부분 취소면 쿠폰은 돌려주지 않는다"
    synonyms: ["benefit restore", "쿠폰 · 포인트 원복"]
    code:
      - { path: promotion/domain/src/main/kotlin/com/kgd/promotion/domain/hold/model/PromotionHold.kt, symbol: "fun restore(points: Long, fullCancel: Boolean, now: Instant)", note: "원복 규칙" }
    uses: [cat-point-ledger, cat-coupon-state]

