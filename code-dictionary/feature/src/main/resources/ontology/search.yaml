# 검색 도메인 온톨로지 — 원본은 이 파일이다 (ADR-0100, docs/specs/2026-09-24-concept-atlas).
# 바꾸면 manifest.yaml 의 revision 을 올린다. 간선은 from 개념에만 적는다.
# 망라 기준은 docs/specs/2026-09-24-concept-atlas/coverage/search.md — 거기 placed 인 개념은 전부 이 파일에 있다.
domain: search
root: search-system
concepts:
  - id: search-system
    kind: DOMAIN
    name: "검색 시스템"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "색인을 만드는 인제스트, 색인의 내부 구조, 색인을 읽는 쿼리, 결과를 재는 평가, 그것을 떠받치는 서빙 — 다섯 갈래로 읽는 검색 아키텍처"
    synonyms: ["hybrid search", "하이브리드 검색", "information retrieval", "정보 검색"]
    evidence:
      - { kind: POST, ref: search-system-concept-map, note: "검색 도메인 일반을 도식으로 정리한 글" }
    contains: [search-ingest, search-index-internals, search-query, search-evaluation, search-serving, search-glossary]

  # ─────────────────────────── 인제스트 ───────────────────────────
  - id: search-ingest
    kind: DOMAIN
    name: "검색 인제스트"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "원천에서 색인까지. 문서 임베딩은 이 축에서 오프라인으로 일어난다"
    contains: [source-collection, normalization-derivation, document-embedding, index-contract, bulk-indexing, srch-index-sync]
  - id: source-collection
    kind: STAGE
    name: "원천 수집"
    category: DATA
    level: BEGINNER
    description: "외부 원천을 전량 또는 증분으로 받는다. 호출은 일일 한도 자원이다"
    contains: [full-scan, incremental-backfill, api-quota]
    flows_to: [normalization-derivation]
  - id: full-scan
    kind: MECHANISM
    name: "풀스캔"
    category: DATA
    level: BEGINNER
    description: "원천 전량을 다시 받는다"
  - id: incremental-backfill
    kind: MECHANISM
    name: "증분 · 백필"
    category: DATA
    level: INTERMEDIATE
    description: "안 받은 것만 이어 받는다. 일일 한도 안에서 며칠에 걸쳐 채운다"
  # 상한 자체가 아니라 그것을 넘기는 상태를 피하는 대상으로 본다 — 단계 아래에는 TERM 을 둘 수 없다
  - id: api-quota
    kind: PROBLEM
    name: "호출 한도"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "원천이 정한 상한. 화면 표기와 실제 한도가 다를 수 있다"
  - id: normalization-derivation
    kind: STAGE
    name: "정규화 · 파생"
    category: DATA
    level: INTERMEDIATE
    description: "원본은 그대로 두고 화면용 그루핑은 파생 컬럼으로 만든다"
    contains: [raw-preservation, derived-column, taxonomy-tagging, srch-ingest-pipeline]
    flows_to: [document-embedding]
  - id: raw-preservation
    kind: MECHANISM
    name: "원본 보존"
    category: DATA
    level: BEGINNER
    description: "원천 값을 가공 없이 저장한다. 다시 받으려면 한도를 또 쓴다"
  - id: derived-column
    kind: MECHANISM
    name: "파생 컬럼"
    category: DATA
    level: BEGINNER
    description: "가공 값은 원본을 덮지 않고 별도 컬럼으로 둔다"
  - id: taxonomy-tagging
    kind: MECHANISM
    name: "분류 코드 · 태깅"
    category: DATA
    level: INTERMEDIATE
    description: "필터 축이 되는 분류 코드와 태그"
  - id: srch-ingest-pipeline
    kind: MECHANISM
    name: "인제스트 파이프라인"
    category: DATA
    level: INTERMEDIATE
    description: "색인 직전에 엔진 안에서 문서를 가공하는 프로세서 사슬이다. 무거운 변환(추론 등)을 여기 두면 색인 처리량이 그 비용을 그대로 진다"
    synonyms: ["ingest pipeline", "ingest processor"]
    contains: [srch-enrich-processor, srch-ingest-inference]
  - id: srch-enrich-processor
    kind: MECHANISM
    name: "인리치 (색인 시 조회 결합)"
    category: DATA
    level: INTERMEDIATE
    description: "색인할 때 다른 인덱스를 조회해 필드를 덧붙인다(IP → 지역, 도메인 → 분류). 질의 때 조인하지 않으려고 색인 때 비정규화한다"
    synonyms: ["enrich processor", "enrich policy"]
  - id: srch-ingest-inference
    kind: MECHANISM
    name: "색인 시 자동 추론"
    category: DATA
    level: ADVANCED
    description: "인제스트 단계에서 모델을 불러 임베딩 · 분류를 문서에 싣는다. 호출자는 원문만 보내면 되지만 색인 처리량이 추론 속도에 묶이고, 모델 교체가 곧 전량 재색인이다"
    synonyms: ["inference processor", "text_embedding processor", "neural ingest"]
    contains: [srch-semantic-text-field]
    alternative_to:
      - { to: offline-batch, reason: "엔진 안에서 색인하며 추론하느냐, 밖에서 미리 계산해 싣느냐" }
  - id: srch-semantic-text-field
    kind: MECHANISM
    name: "시맨틱 텍스트 필드"
    category: DATA
    level: ADVANCED
    description: "매핑에 추론 엔드포인트만 지정하면 청킹 · 임베딩 · 질의 인코딩을 엔진이 알아서 하는 필드. 편하지만 청킹 · 모델 선택의 손잡이를 엔진에 넘긴다"
    synonyms: ["semantic_text", "semantic query"]
    uses: [srch-chunking]
  - id: document-embedding
    kind: STAGE
    name: "문서 임베딩"
    category: DATA
    level: ADVANCED
    description: "문서를 벡터로 바꿔 색인에 싣는다. 오프라인 배치로 미리 계산한다"
    questions:
      - "문서 임베딩을 오프라인으로 미리 만들면 모델 크기 선택이 어떻게 달라지나"
      - "모델을 바꾸면 왜 전 문서를 다시 인코딩해야 하나"
    contains: [embedding-text-rule, embedding-model, model-stamp, offline-batch, srch-embedding-model-selection, srch-embedding-fine-tuning, srch-chunking, srch-embedding-model-migration, srch-vector-normalization, srch-vector-dimension-choice, srch-pca-reduction, srch-vector-space-mismatch]
    flows_to: [bulk-indexing]
  - id: embedding-text-rule
    kind: MECHANISM
    name: "임베딩 텍스트 규칙"
    category: DATA
    level: INTERMEDIATE
    description: "무엇을 이어 붙여 인코딩하나 — 제목 · 분류 · 주소 · 개요"
  - id: embedding-model
    kind: MECHANISM
    name: "임베딩 모델"
    category: ALGORITHM
    level: ADVANCED
    description: "문서와 검색어를 같은 벡터 공간으로 보내는 모델. 양쪽이 같은 모델이어야 한다"
    contains: [matryoshka-embedding, srch-two-tower]
  # 차원을 잘라 쓰도록 고르는 방식이라 MECHANISM
  - id: matryoshka-embedding
    kind: MECHANISM
    name: "마트료시카 임베딩"
    category: ALGORITHM
    level: ADVANCED
    description: "앞쪽 차원만 잘라 써도 뜻이 보존되게 학습한 임베딩(MRL). 2560 차원 모델을 1024 로 잘라 저장하는 식으로 메모리와 정확도를 맞바꾼다"
    synonyms: ["MRL", "Matryoshka Representation Learning"]
  - id: srch-two-tower
    kind: MECHANISM
    name: "바이 인코더 (two-tower)"
    category: ALGORITHM
    level: ADVANCED
    description: "질의와 문서를 각각 따로 인코딩해 벡터 유사도로 잰다. 문서 벡터를 미리 만들 수 있어 수백만 건을 질의당 인코딩 한 번으로 훑는다. 덴스 리트리벌의 기본 구조다"
    synonyms: ["bi-encoder", "dual encoder", "two-tower model"]
    questions:
      - "바이 인코더가 크로스 인코더보다 부정확한데도 1단계에 쓰이는 이유는 무엇인가"
  - id: model-stamp
    kind: MECHANISM
    name: "모델 스탬프"
    category: DATA
    level: INTERMEDIATE
    description: "벡터 공간 식별자. 모델이나 차원이 바뀌면 옛 벡터와 섞이지 않게 한다"
    mitigates:
      - { to: srch-vector-space-mismatch, reason: "스탬프가 다른 벡터는 싣지도 비교하지도 않는다" }
  - id: offline-batch
    kind: MECHANISM
    name: "오프라인 배치"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "실시간 경로 밖에서 미리 계산한다"
  - id: srch-embedding-model-selection
    kind: MECHANISM
    name: "임베딩 모델 선정"
    category: TESTING
    level: ADVANCED
    description: "리더보드는 후보를 줄이는 데만 쓰고, 순위는 자기 판정 세트에서 쓸 수 있는 차원으로 잰 nDCG 로 정한다. 인코딩 속도는 오프라인 설계에서는 비용이 아니라 대기 시간이다"
    questions:
      - "공개 리더보드 1위 모델이 내 도메인에서 지는 이유는 무엇인가"
    uses: [judgment-set]
    measured_by:
      - { to: ndcg, reason: "후보 모델마다 전 코퍼스를 인코딩해 같은 판정 세트로 nDCG@10 을 낸다" }
  - id: srch-embedding-fine-tuning
    kind: MECHANISM
    name: "임베딩 파인튜닝"
    category: ALGORITHM
    level: ADVANCED
    description: "클릭 · 전환 로그를 (질의, 문서) 학습 쌍으로 삼아 범용 모델을 도메인에 맞춘다. 판정 세트와 음성 표본이 없으면 착수하지 않는다"
    synonyms: ["fine-tuning"]
    contains: [srch-contrastive-learning, srch-hard-negative-mining]
  - id: srch-contrastive-learning
    kind: MECHANISM
    name: "대조 학습"
    category: ALGORITHM
    level: ADVANCED
    description: "정답 쌍은 가깝게, 나머지는 멀게 벡터를 당기는 학습. 같은 배치의 다른 문서를 음성으로 쓰는 in-batch negatives 가 표준이다"
    synonyms: ["contrastive learning", "InfoNCE", "in-batch negatives"]
  - id: srch-hard-negative-mining
    kind: MECHANISM
    name: "하드 네거티브 채굴"
    category: ALGORITHM
    level: ADVANCED
    description: "모델이 헷갈리는 오답(BM25 상위의 비정답 등)을 골라 음성 표본으로 쓴다. 쉬운 음성만 쓰면 모델이 경계를 못 배운다"
    synonyms: ["hard negative"]
  - id: srch-chunking
    kind: MECHANISM
    name: "청킹"
    category: DATA
    level: INTERMEDIATE
    description: "모델 입력 길이를 넘는 문서를 조각으로 나눠 조각마다 벡터를 만든다. 조각 크기와 겹침이 재현율과 색인 크기를 정한다"
    synonyms: ["chunking", "passage splitting"]
  - id: srch-embedding-model-migration
    kind: MECHANISM
    name: "모델 교체 · 벡터 공간 전환"
    category: DATA
    level: ADVANCED
    description: "모델을 바꾸면 옛 벡터가 전부 무효가 된다. 새 스탬프로 전 문서를 다시 인코딩한 새 색인을 만들고 별칭으로 넘긴다. 텍스트 규칙도 스탬프의 일부다"
    questions:
      - "임베딩 모델만 바꾸고 색인을 그대로 두면 무엇이 깨지나"
    uses: [model-stamp, alias-swap]
    causes:
      - { to: srch-vector-space-mismatch, reason: "문서와 질의가 다른 모델로 인코딩된 채 섞인다" }
  - id: srch-vector-normalization
    kind: MECHANISM
    name: "벡터 L2 정규화"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "벡터 길이를 1 로 맞춘다. 정규화하면 코사인과 내적이 같아져 더 싼 내적으로 잴 수 있다. 색인과 질의 양쪽에 같은 규칙을 적용한다"
    synonyms: ["L2 normalization", "unit vector"]
    uses: [cosine-similarity, srch-dot-product]
  - id: srch-vector-dimension-choice
    kind: MECHANISM
    name: "차원 선택"
    category: DATA
    level: ADVANCED
    description: "차원은 상주 메모리로 정하는 값처럼 보이지만, 메모리가 둘 다 되면 품질 문제로 바뀐다. MRL 모델이면 한 번 인코딩해 잘라서 비교한다"
    uses: [matryoshka-embedding, srch-vector-dimension]
    affects:
      - { to: srch-vector-memory-footprint, reason: "상주량이 차원에 비례한다" }
  - id: srch-pca-reduction
    kind: MECHANISM
    name: "PCA 차원 축소"
    category: ALGORITHM
    level: ADVANCED
    description: "학습된 벡터에 주성분 분석을 걸어 분산이 큰 축만 남긴다. 모델을 다시 학습하지 않고 차원을 줄이지만 MRL 보다 정보 손실이 크다"
    synonyms: ["PCA", "principal component analysis"]
    alternative_to:
      - { to: matryoshka-embedding, reason: "사후 투영으로 줄이느냐, 잘라 써도 되게 학습하느냐" }
  - id: srch-vector-space-mismatch
    kind: PROBLEM
    name: "벡터 공간 불일치"
    category: DATA
    level: INTERMEDIATE
    description: "문서와 질의가 다른 모델 · 차원 · 텍스트 규칙으로 인코딩된 상태. 오류 없이 엉뚱한 이웃을 돌려줘 눈에 띄지 않는다"

  # 계약(산출물)이 아니라 색인이 무엇을 받아들일지 정하는 활동으로 본다
  - id: index-contract
    kind: STAGE
    name: "색인 계약"
    category: DATA
    level: INTERMEDIATE
    description: "매핑 · 분석기 · 벡터 필드 — 색인이 무엇을 받아들이는지의 정의. 대부분 나중에 못 바꾼다 — 바꾸려면 새 인덱스 + 재색인 + 별칭 교체다"
    questions:
      - "매핑을 운영 중에 바꿀 수 없는 필드 속성은 무엇이고 그때 어떻게 하나"
    contains: [index-mapping, analyzer-tokenizer, inverse-index, vector-field, srch-index-template, srch-mapping-explosion, srch-object-array-cross-match, srch-analyzer-mismatch]
  - id: index-mapping
    kind: MECHANISM
    name: "매핑 · 필드 타입"
    category: DATA
    level: BEGINNER
    description: "필드마다 keyword · text · knn_vector 같은 타입을 정한다"
    synonyms: ["mapping", "schema"]
    contains: [srch-text-vs-keyword, srch-multi-field, srch-copy-to, srch-dynamic-mapping, srch-runtime-field, srch-object-modeling, srch-numeric-field-types, srch-range-field, srch-geo-field, srch-rank-feature-field, srch-sparse-vector-field, srch-wildcard-field, srch-match-only-text, srch-token-count-field, srch-field-storage-options]
  - id: srch-text-vs-keyword
    kind: MECHANISM
    name: "text · keyword 구분"
    category: DATA
    level: BEGINNER
    description: "text 는 분석기를 거쳐 토큰으로 색인되고 점수 경쟁을 한다. keyword 는 값 전체가 한 토큰이라 정확 일치 · 정렬 · 집계에 쓴다. text 필드에 term 질의를 걸면 안 맞는다"
    synonyms: ["text", "keyword"]
    questions:
      - "text 필드에 term 질의를 걸면 왜 결과가 비나"
  - id: srch-multi-field
    kind: MECHANISM
    name: "멀티 필드"
    category: DATA
    level: BEGINNER
    description: "한 원본 값을 여러 방식으로 색인한다(title 은 text, title.raw 는 keyword). 검색과 정렬을 한 필드로 겸하지 않으려는 표준 패턴이다"
    synonyms: ["multi-fields", "fields"]
  - id: srch-copy-to
    kind: MECHANISM
    name: "copy_to 합성 필드"
    category: DATA
    level: INTERMEDIATE
    description: "여러 필드 값을 색인 때 한 가상 필드로 모은다. 여러 필드를 한 번에 찾는 비용을 색인 쪽으로 옮기지만 필드별 가중은 잃는다"
    synonyms: ["copy_to"]
    alternative_to:
      - { to: srch-bm25f, reason: "색인 때 합치느냐, 질의 때 필드를 섞어 채점하느냐" }
  - id: srch-dynamic-mapping
    kind: MECHANISM
    name: "동적 매핑 · 동적 템플릿"
    category: DATA
    level: INTERMEDIATE
    description: "처음 보는 필드의 타입을 엔진이 추정해 매핑에 더한다. 패턴별 규칙(dynamic templates)으로 추정을 고정할 수 있다. 방치하면 필드 수가 폭증한다"
    synonyms: ["dynamic mapping", "dynamic templates"]
    causes:
      - { to: srch-mapping-explosion, reason: "키가 자유로운 JSON 을 넣으면 키마다 필드가 생긴다" }
  - id: srch-runtime-field
    kind: MECHANISM
    name: "런타임 필드"
    category: DATA
    level: ADVANCED
    description: "색인하지 않고 질의 · 집계 시점에 스크립트로 값을 계산하는 필드(schema-on-read). 재색인 없이 필드를 더하지만 문서마다 계산해 느리다"
    synonyms: ["runtime fields", "schema-on-read"]
  - id: srch-object-modeling
    kind: MECHANISM
    name: "객체 표현 네 패턴"
    category: DATA
    level: INTERMEDIATE
    description: "중첩 JSON 을 평탄화(object) · 독립 문서(nested) · 키 무시 평탄화(flattened) · 부모-자식(join) 중 무엇으로 색인할지 고른다. 정확도와 색인 · 질의 비용을 맞바꾼다"
    synonyms: ["object", "nested", "flattened", "join"]
    contains: [srch-nested-field, srch-flattened-field, srch-parent-child-join]
  - id: srch-nested-field
    kind: MECHANISM
    name: "nested 필드"
    category: DATA
    level: INTERMEDIATE
    description: "객체 배열의 원소마다 숨은 문서를 따로 색인해 한 원소 안의 조건끼리만 매칭한다. 원소 수만큼 문서가 늘고 전용 질의가 필요하다"
    synonyms: ["nested"]
    mitigates:
      - { to: srch-object-array-cross-match, reason: "원소를 독립 문서로 두어 다른 원소의 값과 섞이지 않는다" }
  - id: srch-flattened-field
    kind: MECHANISM
    name: "flattened 필드"
    category: DATA
    level: INTERMEDIATE
    description: "객체 전체를 한 필드로 두고 잎 값을 keyword 처럼 색인한다. 키가 자유로운 속성 맵에서 필드 폭증을 막지만 전문 검색 · 숫자 범위는 못 한다"
    synonyms: ["flattened"]
    mitigates:
      - { to: srch-mapping-explosion, reason: "키가 늘어도 매핑 필드는 하나다" }
  - id: srch-parent-child-join
    kind: MECHANISM
    name: "부모-자식 조인 필드"
    category: DATA
    level: ADVANCED
    description: "부모와 자식을 같은 샤드의 별도 문서로 두고 질의 때 잇는다. 자식만 자주 바뀔 때 부모를 다시 색인하지 않지만 질의가 무겁다"
    synonyms: ["join field", "parent-child"]
    alternative_to:
      - { to: srch-nested-field, reason: "갱신 비용을 줄이느냐(join), 질의 비용을 줄이느냐(nested)" }
  - id: srch-numeric-field-types
    kind: MECHANISM
    name: "숫자 타입 · scaled_float"
    category: DATA
    level: BEGINNER
    description: "정밀도와 디스크를 맞바꾸는 숫자 타입들. 가격처럼 소수 자릿수가 정해진 값은 scaled_float(정수 × 배율)로 두어 부동소수 오차와 크기를 함께 줄인다"
    synonyms: ["scaled_float", "long", "double"]
  - id: srch-range-field
    kind: MECHANISM
    name: "범위 필드"
    category: DATA
    level: INTERMEDIATE
    description: "문서가 값 하나가 아니라 구간(유효 기간 · 가격대)을 갖는 필드. 「이 시각을 포함하는 문서」 같은 질의를 한 번에 푼다"
    synonyms: ["range types", "date_range"]
  - id: srch-geo-field
    kind: MECHANISM
    name: "지리 필드"
    category: DATA
    level: INTERMEDIATE
    description: "위경도 점(geo_point)과 도형(geo_shape)을 색인하는 필드. 반경 · 박스 · 도형 질의와 거리 정렬의 근거다"
    synonyms: ["geo_point", "geo_shape"]
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"type\": \"geo_point\"", note: "관광지 좌표 필드" }
  - id: srch-rank-feature-field
    kind: MECHANISM
    name: "랭크 피처 필드"
    category: DATA
    level: ADVANCED
    description: "인기도 · 페이지랭크 같은 미리 계산한 점수를 순위용으로만 색인하는 필드. 스크립트 점수보다 빠르게 점수에 섞고, 상위 k 조기 종료가 가능하다"
    synonyms: ["rank_feature", "rank_features"]
  - id: srch-sparse-vector-field
    kind: MECHANISM
    name: "희소 벡터 필드"
    category: DATA
    level: ADVANCED
    description: "토큰 → 가중치 맵을 색인하는 필드. 학습형 스파스 모델의 출력을 역색인에 그대로 싣는다"
    synonyms: ["sparse_vector", "rank_features"]
  - id: srch-wildcard-field
    kind: MECHANISM
    name: "와일드카드 필드"
    category: DATA
    level: ADVANCED
    description: "로그 · URL 처럼 토큰 경계가 없는 긴 문자열에서 부분 일치를 빠르게 하려고 n-gram 색인을 내장한 필드. keyword 의 선행 와일드카드 풀스캔을 피한다"
    synonyms: ["wildcard field"]
    mitigates:
      - { to: srch-expensive-query, reason: "선행 와일드카드를 n-gram 후보 추림 + 검증으로 바꾼다" }
  - id: srch-match-only-text
    kind: MECHANISM
    name: "점수 없는 text"
    category: DATA
    level: ADVANCED
    description: "빈도 · 위치를 저장하지 않아 디스크를 줄인 text 필드. 매칭은 되지만 점수는 상수다. 로그처럼 순위가 필요 없는 워크로드용이다"
    synonyms: ["match_only_text"]
  - id: srch-token-count-field
    kind: MECHANISM
    name: "토큰 수 필드"
    category: DATA
    level: INTERMEDIATE
    description: "다른 필드의 토큰 수를 정수로 색인한다. 길이로 거르거나 정렬할 때 쓴다"
    synonyms: ["token_count"]
  - id: srch-field-storage-options
    kind: MECHANISM
    name: "필드 저장 옵션"
    category: DATA
    level: ADVANCED
    description: "필드마다 어느 자료구조에 들어갈지 고른다 — index(역색인) · doc_values(열 저장) · store(원문) · norms(길이값) · index_options(포스팅 상세도). 끄면 디스크가 줄고 그 기능을 잃는다"
    synonyms: ["index", "store", "doc_values", "norms", "index_options"]
    questions:
      - "정렬도 집계도 안 하는 필드의 doc_values 를 끄면 무엇을 얻나"
    uses: [srch-doc-values, srch-stored-fields, srch-norms, srch-postings-list, srch-term-vectors]
  - id: srch-index-template
    kind: MECHANISM
    name: "인덱스 템플릿"
    category: DATA
    level: INTERMEDIATE
    description: "이름 패턴에 맞는 새 인덱스에 매핑 · 설정 · 별칭을 자동으로 입힌다. 조각 템플릿(component)을 조립해 설정을 한 곳에서 고친다"
    synonyms: ["index template", "component template", "composable template"]
  - id: srch-mapping-explosion
    kind: PROBLEM
    name: "매핑 폭증"
    category: DATA
    level: INTERMEDIATE
    description: "필드 수가 수천으로 늘어 클러스터 상태가 커지고 마스터가 느려지는 상태. 동적 매핑에 자유 키 JSON 을 넣을 때 난다"
    synonyms: ["mapping explosion"]
  - id: srch-object-array-cross-match
    kind: PROBLEM
    name: "객체 배열 교차 매칭"
    category: DATA
    level: INTERMEDIATE
    description: "기본 object 는 배열을 필드별 값 목록으로 평탄화해, 서로 다른 원소의 값이 한 조건에 함께 걸린다(빨강 · XL 이 없는데 빨강 S + 파랑 XL 문서가 걸림)"
  - id: srch-analyzer-mismatch
    kind: PROBLEM
    name: "색인 · 질의 분석 불일치"
    category: DATA
    level: INTERMEDIATE
    description: "색인 때와 질의 때 토큰이 달라 있는 문서를 못 찾는 상태. 분석기나 분해 모드를 한쪽만 바꾸거나 재색인을 빠뜨릴 때 난다"
    questions:
      - "분석기 설정을 바꾼 뒤 재색인을 안 하면 무엇이 틀어지나"
  - id: analyzer-tokenizer
    kind: MECHANISM
    name: "분석기 · 토크나이저"
    category: DATA
    level: INTERMEDIATE
    description: "텍스트를 토큰으로 가르는 규칙. 문자 필터 → 토크나이저 → 토큰 필터의 사슬이고, 한국어는 형태소 분석기(nori)를 쓴다. 색인과 질의에 같은 분석을 해야 매칭된다"
    synonyms: ["analyzer", "analysis chain"]
    questions:
      - "형태소 분석기가 쪼갠 조각이 순위에 끼어드는 경우는 언제인가"
      - "문자 필터 · 토크나이저 · 토큰 필터의 순서가 바뀌면 무엇이 달라지나"
    code:
      - { path: code-dictionary/feature/src/main/kotlin/com/kgd/codedictionary/infrastructure/opensearch/adapter/IndexAliasManager.kt, symbol: "stoptags", note: "nori 품사 필터가 버릴 품사 목록 — Lucene 10 의 세분 태그" }
    contains: [srch-char-filter, srch-tokenizer, srch-token-filter, analyzer-customization-layers, srch-search-analyzer-split, srch-keyword-normalizer, nori]
    causes:
      - { to: srch-morpheme-fragment-noise, reason: "형태소 조각이 BM25 에서 내용어로 채점된다" }
  - id: srch-char-filter
    kind: MECHANISM
    name: "문자 필터"
    category: DATA
    level: BEGINNER
    description: "토큰화 전에 원문 문자열을 고친다 — HTML 제거 · 문자 치환 · 정규식 치환. 여기서 지운 글자는 뒤 단계에서 되살릴 수 없다"
    synonyms: ["char filter", "html_strip", "mapping char filter"]
    flows_to: [srch-tokenizer]
  - id: srch-tokenizer
    kind: MECHANISM
    name: "토크나이저"
    category: DATA
    level: BEGINNER
    description: "문자열을 토큰 열로 자르고 위치 · 오프셋을 붙인다. 분석기 하나에 토크나이저는 정확히 하나다"
    synonyms: ["tokenizer"]
    contains: [srch-standard-tokenizer, srch-ngram-tokenizer, srch-edge-ngram]
    flows_to: [srch-token-filter]
  - id: srch-standard-tokenizer
    kind: MECHANISM
    name: "표준 토크나이저"
    category: DATA
    level: BEGINNER
    description: "유니코드 단어 경계 규칙(UAX #29)으로 자른다. 띄어쓰기 단위라 조사가 붙은 한국어 어절을 한 토큰으로 남긴다"
    synonyms: ["standard tokenizer", "UAX 29"]
  - id: srch-ngram-tokenizer
    kind: MECHANISM
    name: "n-gram 토크나이저"
    category: DATA
    level: INTERMEDIATE
    description: "글자를 n 개씩 겹쳐 자른다. 사전 없이 부분 문자열을 다 잡지만 색인이 커지고 우연한 일치 잡음이 는다"
    synonyms: ["ngram", "n-gram"]
    alternative_to:
      - { to: lattice-viterbi, reason: "사전 밖 신조어까지 잡는 n-gram 대 정확하지만 사전에 묶인 형태소 분해" }
    causes:
      - { to: srch-ngram-index-bloat, reason: "문자열 하나가 길이 × gram 폭만큼 토큰이 된다" }
  - id: srch-edge-ngram
    kind: MECHANISM
    name: "edge n-gram"
    category: DATA
    level: INTERMEDIATE
    description: "토큰의 앞에서부터만 n-gram 을 만든다(서, 서울, 서울역). 접두 일치를 색인 때 풀어 두는 자동완성의 기본 도구다. 질의 쪽에는 같은 분해를 걸지 않는다"
    synonyms: ["edge_ngram"]
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"type\": \"edge_ngram\"", note: "관광지 자동완성용 자모 edge n-gram" }
    mitigates:
      - { to: srch-expensive-query, reason: "질의 때 prefix 확장 대신 색인된 접두 토큰을 바로 찾는다" }
    causes:
      - { to: srch-ngram-index-bloat, reason: "토큰마다 접두 길이만큼 토큰이 는다" }
  - id: srch-token-filter
    kind: MECHANISM
    name: "토큰 필터"
    category: DATA
    level: BEGINNER
    description: "토큰 열을 고친다 — 소문자화 · 불용어 제거 · 어간 추출 · 동의어 · 품사 제거. 순서가 결과를 바꾼다(소문자화 전에 동의어를 걸면 대문자 동의어가 안 걸린다)"
    synonyms: ["token filter"]
    contains: [srch-lowercase-folding, srch-stemming, srch-lemmatization, srch-synonym-filter, srch-shingle, srch-pos-filter, srch-reading-form]
    uses: [stopword]
  - id: srch-lowercase-folding
    kind: MECHANISM
    name: "소문자화 · ASCII 폴딩"
    category: DATA
    level: BEGINNER
    description: "대소문자를 통일하고 악센트 문자를 ASCII 로 접는다(café → cafe). 질의 정규화와 같은 규칙이어야 한다"
    synonyms: ["lowercase", "asciifolding"]
  - id: srch-stemming
    kind: MECHANISM
    name: "어간 추출"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "규칙으로 어미를 잘라 어간만 남긴다(running → run). 빠르고 사전이 없지만 과하게 자르면 다른 말이 합쳐진다"
    synonyms: ["stemming", "Porter stemmer", "snowball"]
    alternative_to:
      - { to: srch-lemmatization, reason: "규칙으로 자르느냐, 사전으로 기본형을 찾느냐" }
  - id: srch-lemmatization
    kind: MECHANISM
    name: "표제어 추출"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "사전과 품사로 활용형을 기본형으로 되돌린다(went → go). 한국어 형태소 분석은 이 계열이다"
    synonyms: ["lemmatization"]
  - id: srch-synonym-filter
    kind: MECHANISM
    name: "동의어 필터"
    category: DATA
    level: INTERMEDIATE
    description: "동의어 사전으로 토큰을 펼친다. 색인 때 펼치면 빠르지만 사전을 바꾸면 재색인해야 하고, 질의 때 펼치면 즉시 반영되지만 매 요청이 비싸진다"
    synonyms: ["synonym filter", "index-time synonym", "search-time synonym"]
    questions:
      - "동의어를 색인 시점과 질의 시점 중 어디서 펼칠지 무엇으로 정하나"
    contains: [srch-synonym-graph]
    uses: [synonym-dictionary]
  - id: srch-synonym-graph
    kind: MECHANISM
    name: "동의어 그래프"
    category: DATA
    level: ADVANCED
    description: "다어절 동의어(뉴욕 ↔ NYC)를 토큰 위치 그래프로 펼쳐 구문 질의가 깨지지 않게 한다. 질의 시점 전용이다"
    synonyms: ["synonym_graph"]
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"type\": \"synonym_graph\"", note: "관광지 색인의 질의 시점 동의어" }
  - id: srch-shingle
    kind: MECHANISM
    name: "싱글 (단어 n-gram)"
    category: DATA
    level: INTERMEDIATE
    description: "이웃한 토큰을 이어 붙인 토큰(서울 야경 → 서울_야경)을 더 만든다. 구문 근접을 BM25 점수에 싣는 싼 방법이다"
    synonyms: ["shingle", "word n-gram"]
  - id: srch-pos-filter
    kind: MECHANISM
    name: "품사 필터"
    category: DATA
    level: INTERMEDIATE
    description: "형태소 분석 뒤 조사 · 어미 같은 품사 태그의 토큰을 버린다. 버릴 품사 목록이 곧 검색 대상 어휘를 정한다"
    synonyms: ["nori_part_of_speech", "stoptags"]
    code:
      - { path: code-dictionary/feature/src/main/kotlin/com/kgd/codedictionary/infrastructure/opensearch/adapter/IndexAliasManager.kt, symbol: "stoptags", note: "버릴 품사 목록" }
    uses: [pos-tag]
  - id: srch-reading-form
    kind: MECHANISM
    name: "한자 독음 변환"
    category: DATA
    level: INTERMEDIATE
    description: "한자 토큰을 한글 독음으로 바꿔 한글 질의에 걸리게 한다(大韓 → 대한)"
    synonyms: ["nori_readingform"]
  - id: srch-search-analyzer-split
    kind: MECHANISM
    name: "색인 · 질의 분석기 분리"
    category: DATA
    level: INTERMEDIATE
    description: "같은 필드에 색인용과 질의용 분석기를 따로 둔다. edge n-gram 을 질의에도 걸면 접두 조각끼리 과하게 맞으므로 질의 쪽은 원형만 쓴다"
    synonyms: ["search_analyzer"]
    questions:
      - "edge n-gram 필드에서 search_analyzer 를 따로 두지 않으면 무엇이 틀리나"
  - id: srch-keyword-normalizer
    kind: MECHANISM
    name: "keyword 노멀라이저"
    category: DATA
    level: INTERMEDIATE
    description: "keyword 필드에 토큰화 없이 소문자화 · 폴딩만 적용한다. 대소문자가 섞인 코드 값을 정확 일치 · 집계할 때 쓴다"
    synonyms: ["normalizer"]
  - id: analyzer-customization-layers
    kind: MECHANISM
    name: "형태소 분석기 커스텀 층"
    category: DATA
    level: INTERMEDIATE
    description: "분해 결과를 바꾸는 손잡이 셋 — 사용자 사전(L1) · 시스템 사전 항목(L2) · 비용 재학습(L3). 층이 깊을수록 플러그인 빌드와 라벨 코퍼스가 따라온다"
    synonyms: ["nori 커스텀"]
    contains: [lattice-viterbi, user-dictionary, decompound-mode, system-dictionary-entry, tokenizer-cost-retraining]
  - id: lattice-viterbi
    kind: MECHANISM
    name: "격자 · 비터비 · 비용"
    category: ALGORITHM
    level: ADVANCED
    description: "글자 경계마다 노드를 두고 사전 후보를 간선으로 깐 격자에서, 단어 비용 + 연접 비용의 합이 가장 낮은 경로를 비터비로 고른다. 노리는 규칙이 아니라 이 비용으로 자른다"
    synonyms: ["Viterbi"]
    contains: [viterbi-algorithm]
    uses: [lattice, word-cost, connection-cost, context-id]
  # 분석기가 돌리는 알고리즘이라 MECHANISM — 용어 사전에서 빠지고 격자·비용 용어를 USES 로 쓴다
  - id: viterbi-algorithm
    kind: MECHANISM
    name: "비터비 알고리즘"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "격자에서 총비용 최소 경로를 왼쪽에서 오른쪽으로 한 번 훑어 찾는 동적 계획법. 노드마다 「여기까지의 최소 비용과 직전 간선」만 남긴다"
    synonyms: ["Viterbi"]
    uses:
      - { to: dynamic-programming, reason: "격자의 칸마다 최소 비용 경로 하나만 남기는 DP 다" }
  - id: user-dictionary
    kind: MECHANISM
    name: "사용자 사전"
    category: DATA
    level: INTERMEDIATE
    description: "분석기가 모르는 고유명사 · 복합어를 한 토큰으로 지정한다"
    flows_to: [system-dictionary-entry]
    uses: [surface-form]
  - id: decompound-mode
    kind: MECHANISM
    name: "복합어 분해 모드"
    category: DATA
    level: INTERMEDIATE
    description: "복합어를 통째로(none) · 조각만(discard, 기본값) · 둘 다(mixed) 색인할지. 색인과 질의 양쪽이 같아야 통째 토큰이 매칭된다"
    causes:
      - { to: srch-analyzer-mismatch, reason: "한쪽 분석기만 모드를 바꾸면 통째 토큰이 한쪽에만 생긴다" }
  - id: system-dictionary-entry
    kind: MECHANISM
    name: "시스템 사전 항목"
    category: DATA
    level: ADVANCED
    description: "사전 CSV 에 품사 · 비용 · 문맥 ID 를 직접 줘서 비터비 경쟁에 정상 참여시킨다. 기존 항목의 교정 · 삭제가 되는 유일한 층이고, 플러그인을 다시 굽는다"
    synonyms: ["mecab-ko-dic"]
    contains: [mecab-ko-dic]
    flows_to: [tokenizer-cost-retraining]
  - id: mecab-ko-dic
    kind: TECHNOLOGY
    name: "mecab-ko-dic"
    category: DATA
    level: INTERMEDIATE
    description: "MeCab 형식의 한국어 사전. 세종 말뭉치로 학습한 비용이 붙은 품사별 CSV 와 연접 비용 행렬(matrix.def) · 학습 모델(model.def)로 이뤄지고, Lucene nori 가 이것을 바이너리로 구워 쓴다"
    synonyms: ["MeCab"]
  - id: tokenizer-cost-retraining
    kind: MECHANISM
    name: "분해 비용 재학습"
    category: ALGORITHM
    level: ADVANCED
    description: "정답 분해가 붙은 도메인 코퍼스로 비용표(CRF)를 다시 배운다. 형태소 분석기의 「지도학습」은 이 층을 가리킨다. 라벨 코퍼스가 없으면 착수가 아니다"
    contains: [crf, sejong-corpus]
  # 비용을 학습하는 모델이라 MECHANISM — 용어 사전에서 빠진다
  - id: crf
    kind: MECHANISM
    name: "CRF"
    category: ALGORITHM
    level: ADVANCED
    description: "조건부 무작위장(Conditional Random Field). 문장 전체를 보고 각 위치의 라벨(형태소 경계·품사) 열을 확률로 매기는 판별 모델. MeCab 계열은 학습한 CRF 가중치를 단어 비용·연접 비용으로 바꿔 사전에 굽는다"
    synonyms: ["Conditional Random Field", "조건부 무작위장"]
  - id: sejong-corpus
    kind: TECHNOLOGY
    name: "세종 말뭉치"
    category: DATA
    level: BEGINNER
    description: "21세기 세종계획 말뭉치. 형태소·품사가 사람 손으로 달린 대규모 한국어 코퍼스로, 범용 형태소 분석기 비용의 원천이다. 신문·소설 분포라 도메인 용어는 일반어 조각으로 갈린다"
  - id: nori
    kind: TECHNOLOGY
    name: "nori"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "Lucene 한국어 형태소 분석기. mecab-ko-dic 을 바이너리 사전으로 구워 격자를 깔고 비터비로 최소 비용 분해를 고른다"
    implements:
      - { to: lattice-viterbi, reason: "nori 토크나이저가 mecab-ko-dic 비용으로 격자·비터비를 돈다" }
      - { to: user-dictionary, reason: "user_dictionary_rules 로 사용자 사전 항목을 싣는다(비용 고정 −100000)" }
      - { to: decompound-mode, reason: "nori_tokenizer 의 decompound_mode 설정" }
      - { to: srch-pos-filter, reason: "nori_part_of_speech 토큰 필터" }
      - { to: srch-reading-form, reason: "nori_readingform 토큰 필터" }
  - id: inverse-index
    kind: MECHANISM
    name: "역인덱싱"
    category: DATA
    level: INTERMEDIATE
    description: "단어→문서 매핑으로 전문 검색을 가능하게 하는 인덱스 구조. 정렬된 텀 사전과 텀마다의 포스팅 리스트로 이뤄진다"
    synonyms: ["inverted index", "역색인"]
    questions:
      - "RDB 의 LIKE '%foo%' 는 인덱스를 못 쓰는데 역색인은 왜 빠른가"
    contains: [srch-term-dictionary, srch-postings-list]
    alternative_to:
      - { to: b-tree, reason: "낱말 → 문서 목록(전문 검색) 대 정렬된 키 → 행(범위 · 정확 조회)" }
  - id: vector-field
    kind: MECHANISM
    name: "벡터 필드"
    category: DATA
    level: ADVANCED
    description: "벡터를 담는 필드와 그 근사 탐색 구조. 비용은 계산이 아니라 메모리 접근이다 — 방문한 노드마다 벡터를 무작위 위치에서 읽는다"
    synonyms: ["knn_vector", "dense_vector"]
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"type\": \"knn_vector\"", note: "관광지 640 차원 벡터 필드" }
    contains: [hnsw, vector-quantization, srch-flat-index, srch-ivf, srch-diskann, srch-lsh, srch-disk-based-vectors]
  - id: hnsw
    kind: MECHANISM
    name: "HNSW"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "계층 그래프로 벡터 근사 최근접을 찾는 자료구조. 위층의 성긴 그래프로 멀리 뛰고 아래층의 촘촘한 그래프로 좁힌다"
    synonyms: ["Hierarchical Navigable Small World"]
    questions:
      - "m 과 ef_search 를 키우면 무엇을 얻고 무엇을 잃나"
    contains: [vector-quantization, hnsw-parameters]
    uses:
      - { to: graph, reason: "층을 이룬 근접 그래프를 위층부터 따라 내려간다" }
    causes:
      - { to: srch-vector-indexing-cost, reason: "문서마다 그래프에 이웃을 찾아 끼워 넣고, 세그먼트 병합 때 그래프를 다시 짓는다" }
  - id: srch-flat-index
    kind: MECHANISM
    name: "전수 탐색 (flat)"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "모든 벡터와 거리를 재는 정확 kNN. 재현율 100% 기준선이고, 필터로 후보가 수천 건 이하로 줄면 그래프보다 빠르다"
    synonyms: ["exact kNN", "brute force", "flat"]
    alternative_to:
      - { to: hnsw, reason: "작은 후보 집합에서는 정확 탐색이 그래프 탐색보다 싸다" }
  - id: srch-ivf
    kind: MECHANISM
    name: "IVF (역파일 군집 색인)"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "벡터를 k-means 군집으로 나눠 두고, 질의와 가까운 군집 몇 개(nprobe)만 훑는다. 그래프보다 메모리가 적고 PQ 와 잘 묶이지만 군집 학습이 필요하다"
    synonyms: ["IVF", "inverted file index", "nprobe"]
    alternative_to:
      - { to: hnsw, reason: "군집 일부만 보느냐, 그래프를 타느냐 — 메모리 대 재현율 · 지연" }
  - id: srch-diskann
    kind: MECHANISM
    name: "DiskANN (Vamana)"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "디스크에 둔 그래프(Vamana)를 압축 벡터로 길잡이 삼아 적은 디스크 읽기로 탐색한다. 메모리에 다 안 들어가는 규모의 대안이다"
    synonyms: ["DiskANN", "Vamana"]
    uses: [graph]
    alternative_to:
      - { to: hnsw, reason: "그래프를 메모리에 두느냐 디스크에 두느냐" }
  - id: srch-lsh
    kind: MECHANISM
    name: "LSH (지역 민감 해싱)"
    category: ALGORITHM
    level: ADVANCED
    description: "가까운 벡터가 같은 버킷에 떨어지게 하는 해시 여러 개로 후보를 추린다. 이론 보장은 있지만 같은 재현율에서 그래프 방식보다 메모리 · 지연이 크다"
    synonyms: ["LSH", "locality-sensitive hashing"]
    alternative_to:
      - { to: hnsw, reason: "해시 버킷으로 추리느냐, 근접 그래프를 타느냐" }
  - id: srch-disk-based-vectors
    kind: MECHANISM
    name: "디스크 기반 벡터"
    category: DATA
    level: ADVANCED
    description: "압축 벡터만 메모리에 두고 원본은 디스크에 남겨 재채점 때만 읽는다. 메모리는 줄지만 디스크는 줄지 않는다"
    synonyms: ["on_disk mode", "disk-based vector search"]
    uses: [rescore-oversample]
  - id: vector-quantization
    kind: MECHANISM
    name: "벡터 양자화"
    category: DATA
    level: ADVANCED
    description: "저장된 벡터를 더 적은 비트로 눌러 상주 메모리를 줄인다. 스칼라(차원마다 정수로) · 이진(부호만) · 곱 양자화(부분 벡터를 코드북으로) 세 계열이 있다. 모델 가중치 양자화와 다른 축이고, 정밀도 손실은 재채점으로 메운다"
    synonyms: ["vector compression", "벡터 압축"]
    questions:
      - "스칼라 · 이진 · 곱 양자화는 각각 무엇을 버리고 몇 배를 줄이나"
      - "양자화가 디스크가 아니라 메모리를 줄인다는 말은 무슨 뜻인가"
    evidence:
      - { kind: RECORD, ref: msa-opensearch-memory-and-quantization-record, note: "관광지 색인 1-bit + rescore 적용 기록" }
    contains: [srch-scalar-quantization, srch-binary-quantization, srch-product-quantization, srch-osq, rescore-oversample]
    affects:
      - { to: search-node-memory, reason: "1-bit(encoder sq, bits 1)면 벡터 상주 크기가 float32 대비 1/32 — 관광지 색인에 적용", evidence: msa-opensearch-memory-and-quantization-record }
      - { to: recall-precision, reason: "↓ 폭은 rescore oversample 3.0 으로 되찾는다 — 관광지 판정 세트 nDCG 재측정 대기", evidence: msa-opensearch-memory-and-quantization-record }
      - { to: srch-vector-memory-footprint, reason: "차원당 비트 수가 상주량 식의 한 항이다" }
      - { to: srch-ann-recall, reason: "압축할수록 근사 거리가 거칠어져 재현율이 준다" }
    mitigates:
      - { to: page-cache-eviction, reason: "색인 한 벌이 작아져 페이지 캐시에 남는다 — kNN 112초 → 1.65초(콜드)는 한도 증설과 함께 잰 값", evidence: msa-opensearch-memory-and-quantization-record }
  - id: srch-scalar-quantization
    kind: MECHANISM
    name: "스칼라 양자화"
    category: DATA
    level: ADVANCED
    description: "차원마다 float32 를 구간(최솟값~최댓값)으로 나눠 작은 정수로 바꾼다. 비트 수가 곧 압축률이다 — 8비트 4×, 4비트 8×"
    synonyms: ["scalar quantization", "SQ"]
    contains: [srch-int8-quantization, srch-int4-quantization, srch-fp16-quantization]
  - id: srch-int8-quantization
    kind: MECHANISM
    name: "int8 스칼라 양자화"
    category: DATA
    level: ADVANCED
    description: "차원당 1 바이트로 4× 줄인다. 재현율 손실이 작아 재채점 없이도 쓰는 경우가 많은 기본 선택지다"
    synonyms: ["int8", "int8_hnsw", "8-bit quantization"]
  - id: srch-int4-quantization
    kind: MECHANISM
    name: "int4 양자화"
    category: DATA
    level: ADVANCED
    description: "차원당 반 바이트로 8× 줄인다. 손실이 커져 오버샘플 재채점을 함께 건다"
    synonyms: ["int4", "4-bit quantization"]
  - id: srch-fp16-quantization
    kind: MECHANISM
    name: "fp16 반정밀도"
    category: DATA
    level: INTERMEDIATE
    description: "float32 를 16비트 부동소수로 2× 줄인다. 손실이 거의 없어 첫 단계 압축으로 쓴다"
    synonyms: ["fp16", "half precision"]
  - id: srch-binary-quantization
    kind: MECHANISM
    name: "이진 양자화 (1-bit)"
    category: DATA
    level: ADVANCED
    description: "차원마다 부호 1 비트만 남겨 32× 줄이고, 거리는 해밍 거리(XOR · popcount)로 근사한다. 본질은 계산을 빠르게 하는 것이 아니라 색인을 메모리에 올릴 수 있게 하는 것이다. 손실이 커 오버샘플 재채점이 사실상 필수다"
    synonyms: ["binary quantization", "1-bit quantization", "BQ"]
    questions:
      - "1 비트로 줄인 벡터로 뽑은 후보를 왜 원본 벡터로 다시 채점하나"
      - "이진 양자화가 차원이 낮은 모델에서 더 크게 손해 보는 이유는 무엇인가"
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"bits\": 1", note: "관광지 벡터를 1 비트로 양자화(lucene 엔진 sq 인코더)" }
    contains: [srch-bbq, srch-rabitq]
    uses: [srch-hamming-distance]
    alternative_to:
      - { to: srch-scalar-quantization, reason: "32× 를 얻고 재채점을 필수로 떠안느냐, 4~8× 에서 재채점 없이 가느냐" }
  - id: srch-bbq
    kind: MECHANISM
    name: "BBQ (Better Binary Quantization)"
    category: DATA
    level: ADVANCED
    description: "벡터를 중심점 기준으로 옮긴 뒤 1 비트로 누르고, 벡터마다 보정값 몇 개를 함께 저장해 거리 추정 오차를 줄인 이진 양자화. 질의는 4 비트로 둬 비대칭으로 잰다. 32× 압축에서 int8 에 가까운 재현율을 노린다"
    synonyms: ["BBQ", "Better Binary Quantization", "bbq_hnsw"]
    questions:
      - "BBQ 가 단순 부호 양자화보다 재현율이 높은 이유는 무엇인가"
    uses: [rescore-oversample]
  - id: srch-rabitq
    kind: MECHANISM
    name: "RaBitQ"
    category: ALGORITHM
    level: ADVANCED
    description: "무작위 회전 뒤 1 비트로 양자화하고 거리 추정 오차에 이론 상한을 준 방식. BBQ 계열 이진 양자화의 바탕이 된 연구다"
    synonyms: ["RaBitQ"]
  - id: srch-product-quantization
    kind: MECHANISM
    name: "곱 양자화 (PQ)"
    category: DATA
    level: ADVANCED
    description: "벡터를 부분 벡터 m 개로 쪼개 각각을 코드북의 가장 가까운 중심점 번호로 바꾼다. 수십 배까지 줄이고 거리는 미리 계산한 표를 더해 근사한다. 코드북 학습이 필요하다"
    synonyms: ["PQ", "product quantization"]
    contains: [srch-ivf-pq]
    uses: [srch-codebook]
    alternative_to:
      - { to: srch-scalar-quantization, reason: "차원을 묶어 코드북으로 누르느냐, 차원마다 정수로 누르느냐" }
  - id: srch-ivf-pq
    kind: MECHANISM
    name: "IVF-PQ"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "IVF 로 군집 일부만 훑고 그 안의 벡터는 PQ 코드로 잰다. 수억 건 규모에서 메모리를 가장 크게 줄이는 조합이다"
    synonyms: ["IVFPQ"]
    uses: [srch-ivf]
  - id: srch-osq
    kind: MECHANISM
    name: "OSQ (Optimized Scalar Quantization)"
    category: DATA
    level: ADVANCED
    description: "벡터마다 양자화 구간을 오차가 최소가 되게 최적화하는 스칼라 양자화. 1 · 2 · 4 · 7 비트를 한 방식으로 다뤄, 낮은 비트에서도 고정 구간 스칼라 양자화보다 재현율이 높다"
    synonyms: ["OSQ", "Optimized Scalar Quantization"]
    alternative_to:
      - { to: srch-int8-quantization, reason: "구간을 벡터마다 최적화하느냐, 전역 최솟값~최댓값으로 고정하느냐" }
  - id: rescore-oversample
    kind: MECHANISM
    name: "재채점 · 오버샘플"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "양자화 벡터로 k 의 몇 배를 뽑은 뒤 원본 벡터로 다시 채점해 상위 k 를 낸다. 배수를 올리면 정확도가 오르고 지연이 는다"
    synonyms: ["oversample factor"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/AttractionSearchAdapter.kt, symbol: "oversampleFactor(", note: "근사 거리로 뽑은 후보를 원본 벡터로 재채점" }
    affects:
      - { to: srch-ann-recall, reason: "오버샘플 배수를 올리면 양자화로 잃은 재현율을 되찾는다" }
  # 고르는 파라미터 세트라 MECHANISM
  - id: hnsw-parameters
    kind: MECHANISM
    name: "HNSW 파라미터"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "m(노드당 이웃 수) · ef_construction(색인 때 탐색 폭) · ef_search(질의 때 탐색 폭, num_candidates). 올리면 재현율과 메모리·지연이 같이 오른다. 샤드마다 후보를 뽑으므로 샤드 수와도 곱해진다"
    synonyms: ["ef_search", "num_candidates", "ef_construction"]
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"ef_construction\": 128", note: "m 16 · ef_construction 128" }
    affects:
      - { to: recall-precision, reason: "m·ef 를 올리면 재현율 ↑, 대신 메모리·지연 ↑" }
      - { to: srch-ann-recall, reason: "탐색 폭이 곧 근사 재현율이다" }
  - id: bulk-indexing
    kind: STAGE
    name: "벌크 인덱싱"
    category: DATA
    level: INTERMEDIATE
    description: "대량 데이터를 한 번에 색인하는 기법"
    synonyms: ["bulk API"]
    questions:
      - "벌크 응답이 200 인데 일부 문서가 빠지는 경우는 어떻게 잡나"
    contains: [index-rebuild, alias-swap, reindex-count-gate, partial-index-live, srch-bulk-sizing, srch-bulk-partial-failure, srch-vector-indexing-cost, srch-indexing-throughput]
    flows_to: [srch-index-sync]
  - id: index-rebuild
    kind: MECHANISM
    name: "새 인덱스 생성"
    category: DATA
    level: INTERMEDIATE
    description: "기존 색인을 고치지 않고 새 색인을 만든 뒤 별칭을 옮긴다. 전체 재색인은 단순하고 되돌리기 쉽다"
    synonyms: ["full reindex", "전체 재색인"]
    code:
      - { path: code-dictionary/feature/src/main/kotlin/com/kgd/codedictionary/infrastructure/opensearch/adapter/IndexAliasManager.kt, symbol: "override fun createTimestampedIndexName(", note: "시각을 붙인 새 색인 이름" }
    flows_to: [alias-swap]
    causes:
      - { to: partial-index-live, reason: "벌크가 도중에 죽어도 별칭을 넘기면 덜 찬 색인이 라이브 — 2026-09-22 45,535/59,735건", evidence: msa-opensearch-memory-and-quantization-record }
  - id: alias-swap
    kind: MECHANISM
    name: "별칭 스왑"
    category: DATA
    level: INTERMEDIATE
    description: "ES에서 새 인덱스를 미리 빌드하고 별칭을 전환하여 무중단 재색인하는 기법. 교체는 원자적이어야 한다"
    synonyms: ["alias", "별칭"]
    questions:
      - "별칭 교체가 막지 못하는 실패는 무엇인가"
    code:
      - { path: code-dictionary/feature/src/main/kotlin/com/kgd/codedictionary/infrastructure/opensearch/adapter/IndexAliasManager.kt, symbol: "override fun swapAlias(", note: "별칭을 새 색인으로 옮기고 옛 색인은 보관 수만 남긴다" }
  - id: reindex-count-gate
    kind: MECHANISM
    name: "재색인 건수 게이트"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "새 인덱스의 문서 수와 벌크 오류율이 하한을 넘을 때만 별칭을 옮긴다"
    mitigates:
      - { to: partial-index-live, reason: "문서 수·벌크 오류율 하한을 못 넘으면 별칭을 옮기지 않는다" }
      - { to: srch-bulk-partial-failure, reason: "벌크 오류율을 세어 교체 조건에 넣는다" }
  - id: partial-index-live
    kind: PROBLEM
    name: "덜 찬 색인 라이브"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "재색인 벌크가 도중에 죽었는데 별칭이 새 인덱스로 넘어가 일부 문서만 든 색인이 서비스되는 상태"
  - id: srch-bulk-sizing
    kind: MECHANISM
    name: "벌크 크기 조정"
    category: DATA
    level: INTERMEDIATE
    description: "요청당 문서 수 · 바이트(수 MB)와 동시 요청 수를 재며 맞춘다. 크면 메모리와 거부가 늘고 작으면 왕복 비용이 는다. 색인 중엔 리프레시를 늦추고 레플리카를 0 으로 두기도 한다"
    synonyms: ["bulk size"]
    affects:
      - { to: srch-indexing-throughput, reason: "요청 크기와 동시성이 처리량 곡선을 정한다" }
    mitigates:
      - { to: srch-thread-pool-rejection, reason: "쓰기 대기열이 넘치지 않을 만큼만 보낸다" }
  - id: srch-bulk-partial-failure
    kind: PROBLEM
    name: "벌크 부분 실패"
    category: DATA
    level: INTERMEDIATE
    description: "벌크 요청은 성공(200)인데 응답 안의 일부 항목이 실패한 상태. 항목별 오류를 세지 않으면 문서가 조용히 빠진다"
    causes:
      - { to: partial-index-live, reason: "빠진 문서를 모른 채 별칭을 넘긴다" }
  - id: srch-vector-indexing-cost
    kind: PROBLEM
    name: "벡터 색인 비용"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "그래프 색인은 문서마다 이웃 탐색이 들고 세그먼트 병합 때 다시 지어져, 벡터가 붙으면 색인 시간과 CPU 가 몇 배로 는다"
  - id: srch-indexing-throughput
    kind: METRIC
    name: "색인 처리량"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "초당 색인 문서 수. 재색인 소요 시간(RTO)과 원천 변경 반영 속도를 정한다"
    synonyms: ["indexing rate", "docs/s"]
  - id: srch-index-sync
    kind: STAGE
    name: "색인 동기화"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "원천(SSOT)의 변경을 색인에 옮긴다 — 전체 재색인 · 증분 · 이벤트 기반 중 고른다. 증분은 빠르지만 순서와 멱등이 문제가 된다"
    questions:
      - "DB 트랜잭션 안에서 검색 엔진을 직접 호출하면 무엇이 틀어지나"
      - "같은 문서의 이벤트가 순서가 뒤바뀌어 오면 어떻게 옛 값을 버리나"
    contains: [srch-incremental-indexing, srch-change-capture-indexing, srch-external-versioning, srch-source-of-truth-rebuild, srch-out-of-order-update, srch-index-lag, srch-reindex-rto]
  - id: srch-incremental-indexing
    kind: MECHANISM
    name: "증분 색인"
    category: DATA
    level: INTERMEDIATE
    description: "바뀐 문서만 골라 색인한다. 변경 시각 · 버전 컬럼으로 대상을 고르고, 삭제는 따로 전해야 한다"
    synonyms: ["incremental indexing", "delta indexing"]
    alternative_to:
      - { to: index-rebuild, reason: "빠른 반영 대 단순함 · 되돌리기 쉬움" }
  - id: srch-change-capture-indexing
    kind: MECHANISM
    name: "변경 이벤트 색인"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "원천 DB 의 변경을 아웃박스 · CDC 로 이벤트로 내보내고 소비자가 색인에 반영한다. 이중 쓰기를 피하고 준실시간으로 맞추지만 최종 일관성이다"
    synonyms: ["CDC indexing", "outbox relay", "event-driven indexing"]
    uses:
      - outbox-pattern
      - kafka
      - { to: dist-cdc, reason: "원천 DB 변경을 색인으로 흘린다" }
    measured_by:
      - { to: srch-index-lag, reason: "원천 커밋에서 검색 가능해질 때까지의 지연" }
  - id: srch-external-versioning
    kind: MECHANISM
    name: "외부 버전 · 순서 보장"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "원천의 버전 · 시퀀스를 문서 버전으로 넘겨, 더 작은 버전의 쓰기는 엔진이 거부하게 한다. 같은 이벤트가 두 번 와도 결과가 같다"
    synonyms: ["version_type=external", "external versioning"]
    uses: [idempotency]
    mitigates:
      - { to: srch-out-of-order-update, reason: "늦게 온 옛 버전이 새 값을 덮지 못한다" }
  - id: srch-source-of-truth-rebuild
    kind: MECHANISM
    name: "원천 기준 재구성"
    category: DATA
    level: INTERMEDIATE
    description: "색인은 파생물이라 언제든 원천에서 다시 만들 수 있어야 한다. 스냅샷보다 재색인이 복구의 기준이 되고, 그 소요 시간을 주기적으로 잰다"
    synonyms: ["rebuildable index", "SSOT"]
    measured_by:
      - { to: srch-reindex-rto, reason: "원천에서 전체를 다시 채우는 데 걸리는 시간" }
  - id: srch-out-of-order-update
    kind: PROBLEM
    name: "순서 뒤바뀐 갱신"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "같은 문서의 옛 이벤트가 새 이벤트보다 늦게 도착해 색인에 옛 값이 남는 상태. 재시도 · 파티션 재배치에서 난다"
  - id: srch-index-lag
    kind: METRIC
    name: "색인 지연"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "원천에서 바뀐 뒤 검색 결과에 반영되기까지의 시간. 컨슈머 랙 + 색인 + 리프레시 간격의 합이다"
    synonyms: ["indexing lag", "freshness"]
  - id: srch-reindex-rto
    kind: METRIC
    name: "재색인 RTO"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "색인을 잃었을 때 원천에서 전체를 다시 채워 서비스하기까지 걸리는 시간. 검색 엔진의 실제 복구 시간이다"

  # ─────────────────────────── 색인 내부 구조 ───────────────────────────
  - id: search-index-internals
    kind: DOMAIN
    name: "색인 내부 구조"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "검색 엔진(Lucene)이 문서를 무엇으로 어떻게 저장하나. 한 문서가 서로 다른 자료구조 넷에 동시에 들어가고, 그 묶음이 불변 세그먼트다"
    synonyms: ["Lucene internals", "Lucene"]
    contains: [srch-index-structures, srch-segment-lifecycle]
  - id: srch-index-structures
    kind: STAGE
    name: "색인 자료구조 설계"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "찾기(역색인) · 정렬과 집계(doc values) · 보여 주기(stored fields) · 뜻으로 재기(벡터)를 서로 다른 구조에 나눠 싣는다. 역색인은 낱말 → 문서, doc values 는 문서 → 값이라 방향이 반대여서 한 구조로 겸할 수 없다"
    questions:
      - "역색인과 doc values 를 한 구조로 겸할 수 없는 이유는 무엇인가"
      - "text 필드로 정렬 · 집계하면 왜 메모리가 터지나"
    contains: [inverse-index, srch-doc-values, srch-fielddata, srch-stored-fields, srch-norms, srch-term-vectors, srch-points-bkd, vector-field, srch-heap-pressure]
  - id: srch-term-dictionary
    kind: MECHANISM
    name: "텀 사전"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "세그먼트의 모든 텀을 정렬해 둔 사전. 텀마다 문서 빈도와 포스팅 위치를 가리키고, 앞부분 색인은 FST 로 메모리에 올린다"
    synonyms: ["term dictionary", "terms index"]
    contains: [srch-fst]
  - id: srch-fst
    kind: MECHANISM
    name: "FST (유한 상태 변환기)"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "접두와 접미를 함께 공유하는 오토마타로 텀 → 값 매핑을 압축한다. 트라이보다 작아 텀 색인을 메모리에 두고, 접두 · 퍼지 탐색도 오토마타 교집합으로 푼다"
    synonyms: ["FST", "Finite State Transducer"]
    uses: [trie]
  - id: srch-postings-list
    kind: MECHANISM
    name: "포스팅 리스트"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "텀마다 그 텀이 든 문서 번호를 오름차순으로 적은 목록(+ 빈도 · 위치). 차이값으로 압축하고 스킵 데이터로 건너뛴다"
    synonyms: ["postings", "posting list", "index_options"]
    contains: [srch-postings-compression, srch-positions-offsets, srch-postings-intersection]
    uses: [skip-list]
  - id: srch-postings-compression
    kind: MECHANISM
    name: "포스팅 압축 (차이값 · 블록 비트 패킹)"
    category: ALGORITHM
    level: ADVANCED
    description: "정렬된 문서 번호를 앞 번호와의 차이로 바꿔 작게 만들고, 128 개 블록마다 필요한 최소 비트로 묶는다(FOR · PFOR). 디스크와 메모리 대역폭을 함께 줄인다"
    synonyms: ["delta encoding", "FOR", "PFOR", "variable byte"]
  - id: srch-positions-offsets
    kind: MECHANISM
    name: "위치 · 오프셋 · 페이로드"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "문서 안 토큰 위치와 원문 글자 오프셋. 구문 · 근접 질의와 하이라이팅의 근거이고, 끄면 색인이 작아지는 대신 구문 질의를 못 한다"
    synonyms: ["positions", "offsets", "payloads"]
  - id: srch-postings-intersection
    kind: MECHANISM
    name: "포스팅 교집합"
    category: ALGORITHM
    level: ADVANCED
    description: "AND 질의는 가장 짧은 포스팅을 기준으로 나머지를 스킵으로 건너뛰며 맞춘다(leapfrog). 희귀어가 섞인 질의가 빠른 이유다"
    synonyms: ["leapfrog", "conjunction", "WAND"]
  - id: srch-doc-values
    kind: MECHANISM
    name: "doc values (열 저장)"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "필드별로 문서 → 값을 디스크 열 형태로 저장한다. 정렬 · 집계 · 스크립트 점수의 근거이고, mmap 으로 읽어 힙을 쓰지 않는다. text 필드에는 없다"
    synonyms: ["doc_values", "columnar storage"]
    questions:
      - "doc values 가 힙이 아니라 페이지 캐시를 쓴다는 것은 운영에서 무슨 뜻인가"
    contains: [srch-global-ordinals]
    mitigates:
      - { to: srch-heap-pressure, reason: "정렬 · 집계 값을 힙이 아니라 디스크 열에서 읽는다" }
  - id: srch-global-ordinals
    kind: MECHANISM
    name: "전역 서수"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "keyword 값을 샤드 전체에서 정수 번호로 바꾼 표. terms 집계와 부모-자식 조인을 빠르게 하지만 리프레시마다 다시 지어 첫 질의가 느리다(eager 로 미리 짓기도 한다)"
    synonyms: ["global ordinals", "eager_global_ordinals"]
  - id: srch-fielddata
    kind: MECHANISM
    name: "fielddata"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "text 필드를 정렬 · 집계하려고 역색인을 뒤집어 힙에 올린 구조. 필드 전체를 힙에 올려 메모리가 터지기 쉬워 기본으로 꺼져 있다"
    synonyms: ["fielddata"]
    causes:
      - { to: srch-heap-pressure, reason: "필드의 모든 텀을 문서별로 힙에 적재한다" }
    alternative_to:
      - { to: srch-doc-values, reason: "힙에 뒤집어 올리느냐, 색인 때 열로 저장하느냐" }
  - id: srch-stored-fields
    kind: MECHANISM
    name: "stored fields · 원문"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "원문(_source)을 문서 단위 블록으로 압축 보관한다. 상위 k 건만 읽으므로 크기보다 압축률이 중요하다. 원문을 끄면 재색인 · 부분 갱신을 못 한다"
    synonyms: ["stored fields", "_source", "store"]
    contains: [srch-index-codec-compression]
  - id: srch-index-codec-compression
    kind: MECHANISM
    name: "코덱 · 압축 수준"
    category: DATA
    level: INTERMEDIATE
    description: "저장 포맷과 압축 알고리즘(LZ4 기본, DEFLATE · ZSTD 고압축)을 고른다. 디스크를 줄이는 대신 문서를 읽을 때 CPU 를 더 쓴다"
    synonyms: ["index.codec", "best_compression", "ZSTD"]
  - id: srch-norms
    kind: MECHANISM
    name: "norms (길이 정규화 값)"
    category: DATA
    level: ADVANCED
    description: "필드의 토큰 수를 문서당 1 바이트로 저장해 BM25 길이 정규화에 쓴다. 점수가 필요 없는 필드에서 끄면 메모리가 준다"
    synonyms: ["norms", "field length norm"]
  - id: srch-term-vectors
    kind: MECHANISM
    name: "텀 벡터"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "문서 하나의 텀 · 빈도 · 위치를 문서 단위로 따로 저장한 작은 역색인. 긴 필드의 빠른 하이라이팅과 유사 문서(MLT) 질의에 쓴다. 색인이 커진다"
    synonyms: ["term_vector", "term vectors"]
  - id: srch-points-bkd
    kind: MECHANISM
    name: "BKD 트리 (points)"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "숫자 · 날짜 · 좌표를 k 차원 트리로 색인해 범위 · 박스 질의를 푼다. 숫자를 텀으로 색인하던 옛 방식보다 범위 질의가 훨씬 빠르다"
    synonyms: ["BKD tree", "points", "k-d tree"]
    uses: [tree]
  - id: srch-heap-pressure
    kind: PROBLEM
    name: "힙 압박"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "fielddata · 큰 집계 · 벌크 버퍼가 JVM 힙을 채워 GC 가 길어지고 서킷 브레이커가 요청을 끊는 상태"
    synonyms: ["heap pressure", "CircuitBreakingException"]
    measured_by:
      - { to: rt-gc-pause-time, reason: "힙 압박은 GC 정지로 드러난다" }
  - id: srch-segment-lifecycle
    kind: STAGE
    name: "세그먼트 수명 관리"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "문서가 버퍼 → 세그먼트 → 디스크 → 병합으로 가는 흐름을 다룬다. 「검색된다(리프레시)」와 「살아남는다(플러시)」는 다른 일이고, 그 사이를 트랜스로그가 메운다"
    questions:
      - "방금 색인한 문서가 검색에 안 보이는 이유와, 재시작 후에도 남는 이유는 각각 무엇인가"
      - "refresh_interval 을 100ms 로 줄이면 무엇이 나빠지나"
    contains: [srch-segment, srch-indexing-buffer, srch-refresh, srch-translog, srch-flush-commit, srch-segment-merge, srch-index-sorting, srch-segment-explosion, srch-merge-io-storm, srch-unrefreshed-read, srch-acked-write-loss, srch-segment-count]
  - id: srch-segment
    kind: MECHANISM
    name: "세그먼트 (불변 묶음)"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "역색인 · doc values · stored fields · 벡터를 묶은 불변 파일 집합이다. 쓰면 추가만 하므로 잠금이 없고 캐시가 잘 듣는다. 대신 갱신이 「삭제 + 추가」가 되고 병합이 필요하다"
    synonyms: ["segment", "append-only"]
    contains: [srch-tombstone-delete, srch-update-as-delete-add]
    measured_by:
      - { to: srch-segment-count, reason: "세그먼트가 많을수록 질의가 여러 번 나뉘어 돈다" }
  - id: srch-tombstone-delete
    kind: MECHANISM
    name: "삭제 표시 (live docs)"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "불변 세그먼트에서 삭제는 문서를 지우지 않고 비트셋에 표시만 한다. 표시된 문서는 병합 때 실제로 사라진다"
    synonyms: ["tombstone", "live docs", "deleted docs"]
  - id: srch-update-as-delete-add
    kind: MECHANISM
    name: "갱신 = 삭제 + 추가"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "필드 하나를 바꿔도 옛 문서를 삭제 표시하고 새 문서 전체를 다시 색인한다. 잦은 부분 갱신이 비싼 이유다"
    synonyms: ["partial update", "reindex on update"]
  - id: srch-indexing-buffer
    kind: MECHANISM
    name: "인덱싱 버퍼"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "새 문서는 먼저 메모리 버퍼에 쌓인다. 아직 검색도 안 되고 디스크에도 없다"
    synonyms: ["indexing buffer", "in-memory buffer"]
    flows_to: [srch-refresh]
  - id: srch-refresh
    kind: MECHANISM
    name: "리프레시 (NRT 가시성)"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "버퍼를 새 세그먼트로 열어 검색 가능하게 한다(기본 1초). fsync 가 없어 가볍지만, 자주 하면 세그먼트가 잘게 쪼개진다"
    synonyms: ["refresh", "refresh_interval", "near real-time"]
    flows_to: [srch-flush-commit]
    mitigates:
      - { to: srch-unrefreshed-read, reason: "리프레시가 끝나면 방금 쓴 문서가 보인다" }
    causes:
      - { to: srch-segment-explosion, reason: "짧은 간격이 작은 세그먼트를 계속 만든다" }
    affects:
      - { to: srch-indexing-throughput, reason: "대량 색인 중에는 리프레시를 늦춰야 처리량이 오른다" }
  - id: srch-translog
    kind: MECHANISM
    name: "트랜스로그"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "커밋 전 쓰기를 순서대로 적어 두는 로그다. 요청마다 fsync(request)하면 확인한 쓰기가 살아남고, 주기적(async)이면 몇 초치를 잃을 수 있다. 재시작 때 이것을 재생한다"
    synonyms: ["translog", "transaction log"]
    uses: [write-ahead-log]
    mitigates:
      - { to: srch-acked-write-loss, reason: "커밋 전에 죽어도 로그를 재생해 되살린다" }
  - id: srch-flush-commit
    kind: MECHANISM
    name: "플러시 · 커밋"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "세그먼트를 fsync 해 디스크에 내구하게 만들고 트랜스로그를 비운다. 리프레시와 달리 무겁고 드물다"
    synonyms: ["flush", "Lucene commit", "fsync"]
    flows_to: [srch-segment-merge]
  - id: srch-segment-merge
    kind: MECHANISM
    name: "세그먼트 병합"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "작은 세그먼트를 합치고 삭제 표시된 문서를 실제로 지운다. 백그라운드에서 돌며 I/O 를 크게 쓴다"
    synonyms: ["merge"]
    contains: [srch-tiered-merge-policy, srch-force-merge]
    mitigates:
      - { to: srch-segment-explosion, reason: "작은 세그먼트를 모아 질의가 훑을 단위를 줄인다" }
    causes:
      - { to: srch-merge-io-storm, reason: "큰 병합이 디스크 I/O 를 점유한다" }
  - id: srch-tiered-merge-policy
    kind: MECHANISM
    name: "계층 병합 정책"
    category: ALGORITHM
    level: ADVANCED
    description: "비슷한 크기의 세그먼트끼리 묶어 병합하고, 삭제 비율이 높은 세그먼트를 먼저 고른다. 한 번에 합치는 수와 최대 크기로 I/O 를 조절한다"
    synonyms: ["TieredMergePolicy"]
    mitigates:
      - { to: srch-merge-io-storm, reason: "병합 크기와 동시 수를 제한한다" }
  - id: srch-force-merge
    kind: MECHANISM
    name: "강제 병합"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "세그먼트를 지정한 수(보통 1)까지 한꺼번에 합친다. 더 안 쓰는 읽기 전용 인덱스에만 쓴다 — 쓰기 중인 인덱스에 걸면 거대 세그먼트가 이후 병합에서 빠진다"
    synonyms: ["force merge", "_forcemerge"]
    causes:
      - { to: srch-merge-io-storm, reason: "운영 인덱스에 걸면 전체를 다시 쓴다" }
  - id: srch-index-sorting
    kind: MECHANISM
    name: "색인 정렬"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "세그먼트 안 문서를 지정한 필드 순서로 저장한다. 같은 순서의 정렬 질의가 상위 k 만 읽고 멈출 수 있지만 색인이 느려진다. 점수 정렬에는 소용없다"
    synonyms: ["index sorting", "index.sort"]
    contains: [srch-early-termination]
  - id: srch-early-termination
    kind: MECHANISM
    name: "조기 종료"
    category: ALGORITHM
    level: ADVANCED
    description: "필요한 상위 k 가 확정되면 나머지 문서를 보지 않고 멈춘다. 색인 정렬 · 최대 점수 상한(WAND/MaxScore)이 그 근거다"
    synonyms: ["early termination", "MaxScore", "block-max WAND"]
  - id: srch-segment-explosion
    kind: PROBLEM
    name: "세그먼트 과다"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "작은 세그먼트가 수백 개로 늘어 질의마다 그 수만큼 나눠 돌고 파일 핸들이 쌓이는 상태. 짧은 리프레시와 밀린 병합에서 난다"
  - id: srch-merge-io-storm
    kind: PROBLEM
    name: "병합 I/O 폭주"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "큰 병합이 디스크 대역을 차지해 색인과 질의 지연이 함께 튀는 상태"
  - id: srch-unrefreshed-read
    kind: PROBLEM
    name: "방금 쓴 문서가 안 보임"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "쓰기 확인을 받았는데 리프레시 전이라 검색에 안 나오는 상태. 쓰고 바로 읽는 화면에서 버그로 보인다"
    synonyms: ["read-your-writes gap"]
  - id: srch-acked-write-loss
    kind: PROBLEM
    name: "확인된 쓰기 유실"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "성공 응답을 받은 쓰기가 노드 재시작 뒤 사라진 상태. 트랜스로그를 비동기로 둘 때 창이 생긴다"
  - id: srch-segment-count
    kind: METRIC
    name: "세그먼트 수"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "샤드당 세그먼트 수. 늘면 질의가 느려지고, 병합이 밀리고 있다는 신호다"

  # ─────────────────────────── 검색어 파이프라인 ───────────────────────────
  - id: search-query
    kind: DOMAIN
    name: "검색어 파이프라인"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "검색어가 결과가 되기까지 — 쿼리 언더스탠딩 · 후보 생성 · 융합 · 후처리. 싼 것으로 많이 거르고 비싼 것은 적게 쓴다"
    contains: [query-understanding, search-lexicon, query-embedding, srch-query-dsl, candidate-generation, rank-fusion, srch-relevance-tuning, post-ranking, srch-autocomplete, srch-aggregation, srch-result-presentation]
  - id: query-understanding
    kind: STAGE
    name: "쿼리 언더스탠딩"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "검색어에서 뜻을 읽어 필터 · 잔여 검색어 · 정책 스위치로 가른다. 같은 낱말이 셋 중 어디로 가느냐가 결과를 가른다 — 필터는 안 맞으면 탈락, 검색어는 점수 경쟁, 스위치는 순위 규칙을 바꾼다"
    synonyms: ["query understanding"]
    questions:
      - "「강남 3만원 이하 이탈리안」에서 무엇을 필터로 옮기고 무엇을 검색어로 남기나"
      - "의도를 필터로 쓸 때와 랭킹 힌트로 쓸 때 각각 무엇을 잃나"
    contains: [query-normalization, morphological-analysis, keyword-type-classification, intent-to-filter, srch-spell-correction, srch-query-intent-classification, srch-query-entity-recognition, srch-query-segmentation, srch-language-identification, srch-query-expansion, srch-query-rewriting, srch-zero-result-recovery, srch-policy-switch, srch-morpheme-fragment-noise, srch-zero-result, srch-zero-result-rate]
    flows_to: [candidate-generation]
  - id: query-normalization
    kind: MECHANISM
    name: "정규화"
    category: ALGORITHM
    level: BEGINNER
    description: "대소문자 · 공백 · 기호 · 전각/반각을 통일한다. 색인과 질의가 같은 규칙이어야 하고, 질의 벡터 캐시의 키도 이 결과다"
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/queryvector/model/QueryNormalizer.kt, symbol: "fun normalize(raw: String)", note: "질의 벡터 캐시 키를 만드는 정규화" }
    contains: [srch-unicode-normalization]
  - id: srch-unicode-normalization
    kind: MECHANISM
    name: "유니코드 정규형"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "같은 글자의 다른 부호화(조합형 한글 · 호환 문자)를 NFC · NFKC 로 통일한다. 안 하면 눈에 같은 두 문자열이 다른 토큰이 된다"
    synonyms: ["NFC", "NFKC", "Unicode normalization"]
  - id: morphological-analysis
    kind: STAGE
    name: "형태소 분석"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "조사 · 어미를 떼고 어간을 남긴다. 「아이와」가 「아이」+「와」로 갈리는 노이즈도 여기서 난다"
    contains: [analyzer-customization-layers]
    uses: [morpheme, pos-tag]
  - id: keyword-type-classification
    kind: MECHANISM
    name: "키워드 유형 분류"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "검색어의 낱말을 유형 · 분류 · 대상 · 스톱워드로 가른다"
  - id: intent-to-filter
    kind: MECHANISM
    name: "의도 → 필터 승격"
    category: ALGORITHM
    level: ADVANCED
    description: "뜻을 검색어에서 빼 필터로 옮긴다. BM25 레그에만 걸고 벡터 레그는 원문을 받는다. 문서 쪽에 받을 신호가 없는 의도는 필터로 만들지 않는다 — 있는 결과까지 지운다"
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/query/model/QueryIntent.kt, symbol: "object QueryIntent", note: "의도어를 검색어에서 빼서 필터로 옮긴다" }
    mitigates:
      - { to: srch-morpheme-fragment-noise, reason: "의도어를 BM25 검색어에서 빼 조각이 채점되지 않게 한다" }
  - id: srch-spell-correction
    kind: MECHANISM
    name: "오타 교정"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "잘못 친 검색어를 가장 그럴듯한 의도어로 고친다. 편집 거리로 후보를 만들고 질의 로그 · 사전 빈도로 고른다. 사전만으로 고치면 고유명사를 망친다"
    synonyms: ["spell correction", "did you mean", "term suggester", "phrase suggester"]
    questions:
      - "사전 기반 교정이 고유명사를 망치는 이유와 로그 기반 교정이 그것을 푸는 방식은 무엇인가"
    contains: [cs-edit-distance, srch-query-log-correction, srch-noisy-channel-model, srch-keyboard-layout-correction]
    mitigates:
      - { to: srch-zero-result, reason: "오타로 0건이 된 질의를 고친 질의로 다시 찾는다" }
  - id: srch-query-log-correction
    kind: MECHANISM
    name: "로그 기반 교정"
    category: ALGORITHM
    level: ADVANCED
    description: "같은 세션에서 0건 · 무클릭 뒤 바로 고쳐 친 쌍(재질의)을 교정 사전으로 모은다. 사람이 고친 흔적이라 고유명사에 강하다"
    synonyms: ["query reformulation mining"]
  - id: srch-noisy-channel-model
    kind: MECHANISM
    name: "잡음 채널 모델"
    category: ALGORITHM
    level: ADVANCED
    description: "P(의도어) × P(친 글자 | 의도어)가 최대인 후보를 고른다. 언어 모델(무엇을 자주 치나)과 오류 모델(어떻게 틀리나)을 곱하는 교정의 표준 틀이다"
    synonyms: ["noisy channel"]
  - id: srch-keyboard-layout-correction
    kind: MECHANISM
    name: "한영 자판 전환 교정"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "한글 자판 상태로 친 영문(ㅎㅐㅊ → gov)이나 그 반대를 자판 배치로 되돌린다"
    synonyms: ["keyboard layout conversion"]
  - id: srch-query-intent-classification
    kind: MECHANISM
    name: "의도 분류"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "질의 전체를 내비게이션(특정 대상 찾기) · 정보 · 거래 · 대상 타입으로 가른다. 의도에 따라 검색 대상 · 랭킹 규칙 · 결과 형태가 달라진다"
    synonyms: ["query intent", "query classification"]
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/query/model/QueryIntent.kt, symbol: "val SEARCH_TYPE_INTENTS", note: "검색 대상 타입을 고르는 의도어" }
  - id: srch-query-entity-recognition
    kind: MECHANISM
    name: "엔티티 인식"
    category: ALGORITHM
    level: ADVANCED
    description: "질의 안의 지역 · 브랜드 · 분류 · 수치(가격)를 찾아 구조화한다. 사전을 손으로 쓰면 낡으므로 원천 코드표에서 유도한다"
    synonyms: ["query NER", "query tagging"]
    uses: [lexicon-from-source-codes]
  - id: srch-query-segmentation
    kind: MECHANISM
    name: "질의 분절"
    category: ALGORITHM
    level: ADVANCED
    description: "띄어쓰기 없는 질의나 여러 개념이 붙은 질의를 의미 단위 구로 나눈다(서울숲카페 → 서울숲 · 카페). 구 단위로 구문 질의 · 엔티티 매칭을 건다"
    synonyms: ["query segmentation"]
  - id: srch-language-identification
    kind: MECHANISM
    name: "언어 식별"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "질의의 언어를 판정해 분석기 · 색인 · 교차 언어 확장을 고른다. 짧은 질의에서는 틀리기 쉬워 문자 체계와 사용자 언어 설정을 함께 본다"
    synonyms: ["language detection"]
  - id: srch-query-expansion
    kind: MECHANISM
    name: "질의 확장"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "동의어 · 약어 · 로마자 · 번역을 더해 재현율을 올린다. 넓히면 정밀도가 내려가므로 확장어 가중치를 원어보다 낮게 준다"
    synonyms: ["query expansion"]
    questions:
      - "확장어에 원어와 같은 가중치를 주면 무엇이 올라오나"
    contains: [srch-transliteration, srch-cross-lingual-expansion, srch-pseudo-relevance-feedback]
    uses: [synonym-dictionary]
  - id: srch-transliteration
    kind: MECHANISM
    name: "음차 · 로마자 변환"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "외래어 표기와 로마자를 서로 옮겨 같은 것으로 잇는다(스타벅스 ↔ starbucks)"
    synonyms: ["transliteration", "romanization"]
  - id: srch-cross-lingual-expansion
    kind: MECHANISM
    name: "교차 언어 확장"
    category: ALGORITHM
    level: ADVANCED
    description: "다른 언어 질의를 언어 중립 코드나 번역으로 옮겨 다른 언어 문서까지 찾는다. 원천이 코드마다 두 언어 이름을 짝으로 주면 번역기 없이 된다"
    synonyms: ["cross-lingual retrieval"]
    uses: [lexicon-from-source-codes]
  - id: srch-pseudo-relevance-feedback
    kind: MECHANISM
    name: "의사 적합성 피드백"
    category: ALGORITHM
    level: ADVANCED
    description: "첫 검색 상위 문서를 정답으로 가정하고 그 문서들의 특징어를 질의에 더해 다시 찾는다(RM3). 상위가 틀리면 주제가 표류한다"
    synonyms: ["PRF", "RM3", "blind feedback"]
  - id: srch-query-rewriting
    kind: MECHANISM
    name: "질의 재작성"
    category: ALGORITHM
    level: ADVANCED
    description: "질의의 구조를 바꿔 다시 쓴다 — 필드 지정 · 구문화 · 불필요어 제거 · 조건 분해. 규칙 기반과 학습 기반이 있다"
    synonyms: ["query rewriting", "query relaxation"]
    contains: [srch-llm-query-rewrite]
  - id: srch-llm-query-rewrite
    kind: MECHANISM
    name: "LLM 질의 재작성"
    category: ALGORITHM
    level: ADVANCED
    description: "언어 모델로 질의를 풀어 쓰거나 가상 문서(HyDE)를 만들어 검색한다. 표현력이 크지만 지연 · 비용 · 비결정성이 붙어 캐시와 폴백이 필요하다"
    synonyms: ["HyDE", "LLM rewrite"]
  - id: srch-zero-result-recovery
    kind: MECHANISM
    name: "0건 복구"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "결과가 없을 때 정해 둔 순서로 조건을 완화해 다시 찾는다(필터 해제 → 교정 → 부분 일치). 없는 것을 없다고 답하는 것이 아무거나 내놓는 것보다 나을 때가 있어 완화 순서를 정책으로 정한다"
    synonyms: ["zero-result recovery", "null query handling"]
    mitigates:
      - { to: srch-zero-result, reason: "완화한 질의로 다시 찾는다" }
  - id: srch-policy-switch
    kind: MECHANISM
    name: "랭킹 정책 스위치"
    category: ALGORITHM
    level: ADVANCED
    description: "질의에서 읽은 의도로 필터도 검색어도 아닌 순위 규칙을 바꾼다(상업 의도면 상점 가중을 켠다)"
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/query/model/QueryIntent.kt, symbol: "commerceIntent", note: "상업 의도는 필터가 아니라 랭킹 스위치" }
  - id: srch-morpheme-fragment-noise
    kind: PROBLEM
    name: "형태소 조각 오탐"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "형태소 분석이 만든 조각(아이 · 와 · 관광)이 BM25 에서 내용어로 채점돼 엉뚱한 상호명 · 고유명사를 끌어올리는 상태. 모델을 키워도 안 없어진다 — BM25 레그의 문제다"
  - id: srch-zero-result
    kind: PROBLEM
    name: "0건"
    category: ALGORITHM
    level: BEGINNER
    description: "검색 결과가 하나도 없는 상태. 오타 · 과한 필터 · 사전 밖 어휘가 원인이고, 이탈로 바로 이어진다"
    synonyms: ["zero results", "null result"]
    measured_by:
      - { to: srch-zero-result-rate, reason: "전체 질의 중 0건 비율" }
  - id: srch-zero-result-rate
    kind: METRIC
    name: "0건율"
    category: TESTING
    level: BEGINNER
    description: "결과가 0 건인 질의의 비율. 질의 이해 · 사전 · 색인 누락을 한꺼번에 보여 주는 온라인 지표다"
    synonyms: ["zero-hit rate"]
  # 산출물 이름이지만 사전을 만들고 고치는 활동으로 STAGE 에 둔다 — 도메인 바로 아래는 STAGE·TERM 만 허용
  - id: search-lexicon
    kind: STAGE
    name: "검색 사전"
    category: DATA
    level: INTERMEDIATE
    description: "동의어 · 사용자 사전 · 스톱워드. 원천 코드표에서 유도하면 손으로 안 쓴다"
    contains: [synonym-dictionary, user-dictionary, stopword, lexicon-from-source-codes]
  - id: synonym-dictionary
    kind: MECHANISM
    name: "동의어 사전"
    category: DATA
    level: BEGINNER
    description: "다른 말을 같은 것으로 묶는다. 양방향(A, B)과 한 방향(A ⇒ B) 규칙이 있다"
  - id: stopword
    kind: MECHANISM
    name: "스톱워드"
    category: DATA
    level: BEGINNER
    description: "검색에 뜻이 없는 말을 뺀다"
    synonyms: ["불용어"]
  - id: lexicon-from-source-codes
    kind: MECHANISM
    name: "원천 코드표 유도"
    category: DATA
    level: INTERMEDIATE
    description: "원천의 분류 코드표(한 · 영 이름 쌍)에서 사전을 만든다"
  - id: query-embedding
    kind: STAGE
    name: "쿼리 임베딩"
    category: ALGORITHM
    level: ADVANCED
    description: "검색어를 벡터화한다. 같은 검색어는 다시 만들지 않는다. 질의 타워를 어디에 두느냐가 지연과 품질의 교환을 정한다"
    questions:
      - "질의 벡터를 미리 만든 사전으로 대면 미적중은 품질 사건인가 지연 사건인가"
    contains: [live-encoding, embedding-model, query-vector-ledger, srch-precomputed-query-dictionary, srch-query-instruction-prefix, srch-query-tower-placement, srch-bm25-fallback, srch-encoder-outage]
    flows_to: [candidate-generation]
  - id: live-encoding
    kind: MECHANISM
    name: "라이브 인코딩"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "요청 경로에서 임베딩 모델을 부른다. 지연 예산의 대부분을 먹고, 단건 지연은 파라미터 수보다 토큰 수가 정한다"
    causes:
      - { to: srch-encoder-outage, reason: "요청 경로가 인코더 가용성에 묶인다" }
  - id: query-vector-ledger
    kind: MECHANISM
    name: "벡터 캐시 · 원장"
    category: DATA
    level: INTERMEDIATE
    description: "만든 쿼리 벡터를 저장해 같은 검색어를 다시 인코딩하지 않는다"
    measured_by:
      - { to: cache-hit-rate, reason: "같은 질의를 다시 인코딩하지 않은 비율" }
  - id: srch-precomputed-query-dictionary
    kind: MECHANISM
    name: "질의 벡터 사전"
    category: DATA
    level: ADVANCED
    description: "예상 질의의 벡터를 서버 밖에서 미리 만들어 두고 꺼내 쓴다. 서버에 모델이 없어 모델 크기가 지연과 무관해지지만, 적중률이 곧 품질이고 반복 없는 질의 분포에서는 상한이 낮다"
    synonyms: ["query vector dictionary"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/queryvector/service/QueryVectorService.kt, symbol: "private fun recordMiss(", note: "사전 미적중 질의를 기록해 다음 채움의 입력으로 쓴다" }
    alternative_to:
      - { to: live-encoding, reason: "큰 모델 + 적중률 상한 대 작은 모델 + 모든 질의에 벡터" }
  - id: srch-query-instruction-prefix
    kind: MECHANISM
    name: "질의 지시문 접두어"
    category: ALGORITHM
    level: ADVANCED
    description: "모델이 요구하는 질의 앞 지시문(query: · Instruct: …). 학습 때와 같아야 하는 계약이고, 짧은 검색어에 긴 지시문이 붙으면 토큰 수가 늘어 지연이 몇 배가 된다"
    synonyms: ["instruction prefix", "query prefix"]
  - id: srch-query-tower-placement
    kind: MECHANISM
    name: "질의 타워 배치"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "질의 인코더를 어디서 돌릴지 고른다 — 검색 파드 옆 사이드카 · 별도 추론 서버 · 검색 엔진 안 · 외부 API. 지연 · 자원 · 장애 격리를 맞바꾼다"
    contains: [srch-embedding-sidecar, srch-inference-server, srch-in-engine-inference, srch-external-embedding-api]
  - id: srch-embedding-sidecar
    kind: MECHANISM
    name: "임베딩 사이드카"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "검색 파드 안에 인코더 컨테이너를 붙여 로컬 호출로 질의를 인코딩한다. 파드 수는 그대로지만 CPU 를 검색과 나눠 쓴다"
    synonyms: ["sidecar encoder"]
    code:
      - { path: search/embed/server.py, symbol: "def encode(", note: "질의 한 건을 인코딩하는 사이드카 서버" }
    contains: [sentence-transformers]
  - id: sentence-transformers
    kind: TECHNOLOGY
    name: "sentence-transformers"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "문장 임베딩 모델을 불러 인코딩하는 파이썬 라이브러리. 임베딩 사이드카와 오프라인 문서 인코딩이 쓴다"
    implements:
      - { to: live-encoding, reason: "사이드카가 SentenceTransformer 로 질의를 인코딩한다" }
      - { to: srch-embedding-sidecar, reason: "search/embed 이미지의 추론 런타임" }
  - id: srch-inference-server
    kind: MECHANISM
    name: "추론 서버"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "인코더를 별도 서비스(GPU 가능)로 두고 여러 호출자가 네트워크로 부른다. 배치 · 확장이 자유롭지만 홉과 장애 지점이 하나 는다"
    synonyms: ["inference server", "embedding service"]
  - id: srch-in-engine-inference
    kind: MECHANISM
    name: "엔진 내장 추론"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "검색 엔진 플러그인이 모델을 올려 질의 · 문서를 직접 인코딩한다. 호출이 간단하지만 검색 노드의 메모리 · CPU 를 모델과 나눠 쓴다"
    synonyms: ["ML Commons", "neural search"]
  - id: srch-external-embedding-api
    kind: MECHANISM
    name: "외부 임베딩 API"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "모델 제공자 API 로 인코딩한다. 운영이 없지만 호출당 비용 · 외부 지연 · 모델 교체 통보 없음을 떠안는다"
  - id: srch-bm25-fallback
    kind: MECHANISM
    name: "BM25 폴백"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "질의 벡터를 못 얻으면 벡터 레그를 빼고 BM25 로만 답한다. 검색은 계속되고 품질만 한 단계 내려간다"
    synonyms: ["graceful degradation", "vector leg fallback"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/attraction/service/SearchAttractionService.kt, symbol: "if (vector == null) bm25Counter.increment()", note: "벡터가 없으면 BM25 경로로 세고 넘어간다" }
    mitigates:
      - { to: srch-encoder-outage, reason: "인코더가 죽어도 검색이 끊기지 않는다" }
    measured_by:
      - { to: fallback-rate, reason: "BM25 만 나간 비율" }
  - id: srch-encoder-outage
    kind: PROBLEM
    name: "인코더 장애"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "질의 인코더가 죽거나 응답이 비어 벡터 레그가 꺼진 상태. 오류 없이 BM25 만 나가 장애로 안 보인다"
  - id: srch-query-dsl
    kind: STAGE
    name: "질의 작성"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "읽어 낸 조건을 엔진의 질의 트리로 조립한다. 무엇이 점수를 매기고(질의 문맥) 무엇이 거르기만 하는지(필터 문맥)를 가르는 것이 첫 결정이다"
    synonyms: ["Query DSL"]
    questions:
      - "같은 조건을 must 에 두는 것과 filter 에 두는 것은 무엇이 다른가"
      - "term 과 match 는 분석기 관점에서 어떻게 다른가"
    contains: [srch-query-filter-context, srch-term-level-query, srch-full-text-query, srch-bool-query, srch-multi-term-query, srch-join-query, srch-terms-lookup, srch-more-like-this, srch-percolation, srch-geo-query, srch-search-template, srch-expensive-query]
  - id: srch-query-filter-context
    kind: MECHANISM
    name: "질의 문맥 · 필터 문맥"
    category: ALGORITHM
    level: BEGINNER
    description: "질의 문맥의 절은 얼마나 맞는지 점수를 매기고, 필터 문맥의 절은 맞는지만 본다. 필터는 점수 계산이 없고 비트셋으로 캐시돼 빠르다"
    synonyms: ["query context", "filter context"]
    uses: [srch-filter-cache]
  - id: srch-term-level-query
    kind: MECHANISM
    name: "텀 수준 질의"
    category: ALGORITHM
    level: BEGINNER
    description: "분석기를 거치지 않고 색인된 텀과 정확히 비교한다 — term · terms · range · exists · ids. keyword · 숫자 · 날짜 필드용이다"
    synonyms: ["term", "terms", "range", "exists"]
  - id: srch-full-text-query
    kind: MECHANISM
    name: "전문 질의"
    category: ALGORITHM
    level: BEGINNER
    description: "질의 문자열을 필드의 분석기로 토큰화한 뒤 토큰마다 찾고 점수를 합친다(match). 가장 일반적인 검색 질의다"
    synonyms: ["match", "full-text query"]
    contains: [srch-multi-match-types, srch-phrase-query, srch-proximity-query, srch-query-string-syntax]
    uses: [bm25]
  - id: srch-multi-match-types
    kind: MECHANISM
    name: "다중 필드 매칭 방식"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "여러 필드를 한 번에 찾을 때 점수 합치는 법 — 가장 잘 맞는 필드(best_fields) · 합(most_fields) · 필드를 한 덩어리로(cross_fields). 이름이 여러 필드에 흩어진 경우 cross_fields 가 맞다"
    synonyms: ["multi_match", "best_fields", "cross_fields", "most_fields"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/UnifiedSearchAdapter.kt, symbol: "multiMatch", note: "통합 검색의 다중 필드 질의" }
  - id: srch-phrase-query
    kind: MECHANISM
    name: "구문 질의"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "토큰이 같은 순서로 붙어 있어야 맞는다. slop 만큼 위치가 벌어지는 것을 허용한다. 위치 정보가 색인돼 있어야 한다"
    synonyms: ["match_phrase", "slop"]
    uses: [srch-positions-offsets]
  - id: srch-proximity-query
    kind: MECHANISM
    name: "근접 · 구간 질의"
    category: ALGORITHM
    level: ADVANCED
    description: "「X 와 Y 가 5 단어 안」「문서 앞 10 단어 안」 같은 위치 조건을 조합한다. 법률 · 특허 · 표절 검색에서 쓴다"
    synonyms: ["span queries", "intervals", "span_near"]
    uses: [srch-positions-offsets]
  - id: srch-query-string-syntax
    kind: MECHANISM
    name: "질의 문자열 구문"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "사용자가 친 AND · OR · 따옴표 · 필드: 문법을 엔진이 해석한다. 문법 오류에 약해 일반 사용자 입력에는 관대한 버전(simple)을 쓴다"
    synonyms: ["query_string", "simple_query_string", "Lucene query syntax"]
  - id: srch-bool-query
    kind: MECHANISM
    name: "불리언 조합 질의"
    category: ALGORITHM
    level: BEGINNER
    description: "must(맞아야 하고 점수) · should(맞으면 가점) · filter(맞아야 하고 점수 없음) · must_not(제외)로 절을 조합한다. 대부분의 실제 질의가 이 모양이다"
    synonyms: ["bool query", "must", "should", "filter", "must_not"]
    contains: [srch-dis-max, srch-minimum-should-match]
  - id: srch-dis-max
    kind: MECHANISM
    name: "최대 점수 조합 (dis_max)"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "여러 절 중 가장 높은 점수를 쓰고 나머지는 tie_breaker 비율만 더한다. 같은 말이 여러 필드에 맞았다고 점수가 부풀지 않게 한다"
    synonyms: ["dis_max", "tie_breaker"]
  - id: srch-minimum-should-match
    kind: MECHANISM
    name: "최소 일치 수"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "should 절이나 질의 토큰 중 최소 몇 개(또는 몇 %)가 맞아야 하는지 정한다. 긴 질의에서 정밀도와 재현율 사이를 조절하는 손잡이다"
    synonyms: ["minimum_should_match"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/AttractionSearchAdapter.kt, symbol: "b.minimumShouldMatch(\"1\")", note: "자동완성 신호 셋 중 하나만 맞아도 되게" }
  - id: srch-multi-term-query
    kind: MECHANISM
    name: "다중 텀 질의"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "prefix · wildcard · regexp · fuzzy 는 질의 때 텀 사전에서 맞는 텀을 모두 찾아 펼친다. 패턴이 넓을수록 펼칠 텀이 폭증한다"
    synonyms: ["prefix", "wildcard", "regexp"]
    contains: [srch-fuzzy-query]
    causes:
      - { to: srch-expensive-query, reason: "선행 와일드카드는 텀 사전 전체를 훑는다" }
  - id: srch-fuzzy-query
    kind: MECHANISM
    name: "퍼지 질의"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "편집 거리 1~2 안의 텀까지 찾는다. 짧은 단어에서 과하게 맞으므로 거리를 길이에 따라 자동으로 준다(AUTO)"
    synonyms: ["fuzzy", "fuzziness"]
    uses: [cs-edit-distance]
  - id: srch-join-query
    kind: MECHANISM
    name: "조인 질의"
    category: ALGORITHM
    level: ADVANCED
    description: "nested 필드 안 조건(nested)과 부모-자식 관계(has_child · has_parent)를 찾는다. 일반 질의보다 무겁다"
    synonyms: ["nested query", "has_child", "has_parent"]
    uses: [srch-nested-field, srch-parent-child-join]
  - id: srch-terms-lookup
    kind: MECHANISM
    name: "텀 조회 질의"
    category: ALGORITHM
    level: ADVANCED
    description: "다른 문서에 저장된 값 목록(내 팔로우 목록 등)을 가져와 terms 필터로 쓴다. 목록이 수만 개를 넘으면 느리고 상한에 걸린다"
    synonyms: ["terms lookup"]
  - id: srch-more-like-this
    kind: MECHANISM
    name: "유사 문서 질의"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "주어진 문서의 특징어(tf-idf 상위)를 뽑아 그것으로 다시 찾는다. 학습 없이 「관련 상품」을 만드는 가장 단순한 방법이다"
    synonyms: ["more_like_this", "MLT"]
    uses: [srch-tf-idf, srch-term-vectors]
  - id: srch-percolation
    kind: MECHANISM
    name: "역검색 (저장 질의 매칭)"
    category: ALGORITHM
    level: ADVANCED
    description: "질의를 문서처럼 색인해 두고, 새 문서가 들어오면 그 문서에 맞는 저장 질의를 찾는다. 알림 · 저장 검색 · 실시간 분류에 쓴다"
    synonyms: ["percolate", "percolator", "reverse search"]
  - id: srch-geo-query
    kind: MECHANISM
    name: "지리 질의"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "좌표 · 도형 필드를 공간 조건으로 거르고 거리로 정렬한다"
    contains: [srch-geo-distance-query, srch-geo-bounding-box, srch-geo-shape-query]
    uses: [srch-geo-field, srch-points-bkd]
  - id: srch-geo-distance-query
    kind: MECHANISM
    name: "반경 질의"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "한 점에서 거리 d 안의 문서를 찾는다. 근처 검색 · 거리순 정렬의 기본이다"
    synonyms: ["geo_distance"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/AttractionSearchAdapter.kt, symbol: "f.geoDistance { g ->", note: "관광지 근처 검색 필터" }
  - id: srch-geo-bounding-box
    kind: MECHANISM
    name: "박스 질의"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "위경도 사각형 안의 문서를 찾는다. 지도 화면 영역 검색에 쓴다"
    synonyms: ["geo_bounding_box"]
  - id: srch-geo-shape-query
    kind: MECHANISM
    name: "도형 질의"
    category: ALGORITHM
    level: ADVANCED
    description: "다각형 · 선과의 공간 관계(교차 · 포함 · 분리)로 찾는다. 행정 구역 안 검색 같은 경우다"
    synonyms: ["geo_shape"]
  - id: srch-search-template
    kind: MECHANISM
    name: "검색 템플릿"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "질의 모양을 서버에 템플릿으로 저장하고 호출자는 파라미터만 넘긴다. 질의 튜닝을 클라이언트 배포 없이 한다"
    synonyms: ["search template", "Mustache"]
  - id: srch-expensive-query
    kind: PROBLEM
    name: "비싼 질의"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "선행 와일드카드 · 정규식 · 스크립트 · 조인처럼 텀 사전이나 문서를 통째로 훑는 질의. 한 건이 노드 CPU 를 잡아 다른 질의를 느리게 한다"
    synonyms: ["expensive queries", "leading wildcard"]
  - id: candidate-generation
    kind: STAGE
    name: "후보 생성"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "스파스와 덴스, 두 레그가 각자 상위 후보를 낸다. 1단계가 놓친 문서는 2단계가 되살릴 수 없어서 리랭킹보다 1단계 재현율이 먼저다"
    synonyms: ["retrieval", "리트리벌", "first-stage retrieval"]
    questions:
      - "글자를 맞추는 방식과 뜻을 맞추는 방식은 각각 어떤 질의에서 지나"
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/AttractionSearchAdapter.kt, symbol: "private fun hybridQuery(", note: "키워드 레그와 벡터 레그를 한 하이브리드 질의로 묶는다" }
    contains: [srch-boolean-retrieval, srch-tf-idf, bm25, srch-learned-sparse, ann-search, srch-late-interaction, srch-similarity-module, opensearch, srch-post-filter-recall-loss, srch-ann-recall]
    flows_to: [rank-fusion]
    measured_by:
      - { to: recall-precision, reason: "후보 단계는 놓친 정답(재현율)을 잰다" }
      - { to: latency-percentile, reason: "레그별 P99 로 후보 생성이 지연 예산 안인지 본다" }
      - { to: srch-recall-at-k, reason: "정답이 상위 k 후보 안에 들어왔는지" }
  - id: srch-boolean-retrieval
    kind: MECHANISM
    name: "불리언 검색"
    category: ALGORITHM
    level: BEGINNER
    description: "조건에 맞느냐 아니냐만 가르고 순위를 매기지 않는다. 필터와 매칭 단계의 바탕이다"
    synonyms: ["boolean model"]
  - id: srch-tf-idf
    kind: MECHANISM
    name: "TF-IDF"
    category: ALGORITHM
    level: BEGINNER
    description: "문서에 자주 나오는 말은 올리고(TF) 모든 문서에 흔한 말은 깎는다(IDF). 빈도가 선형으로 커지고 문서 길이를 제대로 못 다뤄 BM25 로 대체됐다"
    synonyms: ["TF-IDF", "vector space model"]
    uses: [srch-term-frequency, srch-inverse-document-frequency]
  - id: bm25
    kind: MECHANISM
    name: "스파스 · BM25"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "글자가 맞는 것을 찾는다. 빈도 포화(k1)와 문서 길이 정규화(b)를 더한 TF-IDF 계열로, 렉시컬 검색의 기본값이다. 고유명사 · 정확 일치 · 희귀어에 강하다"
    synonyms: ["BM25", "Okapi BM25", "sparse retrieval", "lexical retrieval"]
    questions:
      - "BM25 가 문서 길이로 점수를 나누는 이유는 무엇인가"
      - "동의어 사전 없이 BM25 만 쓰면 무엇을 놓치나"
    contains: [srch-bm25-k1, srch-bm25-b, srch-bm25f]
    uses: [srch-term-frequency, srch-inverse-document-frequency, inverse-index]
    alternative_to:
      - { to: ann-search, reason: "글자가 맞는 것 대 뜻이 가까운 것 — 둘 다 쓰고 순위로 섞는다" }
      - { to: srch-tf-idf, reason: "빈도 포화와 길이 정규화로 TF-IDF 의 약점을 고친 후속" }
  - id: srch-bm25-k1
    kind: MECHANISM
    name: "k1 (빈도 포화)"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "같은 말이 여러 번 나올 때 점수가 얼마나 빨리 포화되는지 정한다(기본 1.2). 작으면 한 번만 나와도 거의 최대, 크면 반복이 계속 가점이 된다"
    synonyms: ["k1", "term frequency saturation"]
  - id: srch-bm25-b
    kind: MECHANISM
    name: "b (길이 정규화)"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "긴 문서의 빈도를 평균 길이 대비로 얼마나 깎을지(0~1, 기본 0.75). 제목처럼 짧고 고른 필드는 낮춘다"
    synonyms: ["b", "length normalization"]
    uses: [srch-norms]
  - id: srch-bm25f
    kind: MECHANISM
    name: "BM25F (필드 가중)"
    category: ALGORITHM
    level: ADVANCED
    description: "여러 필드를 가중치를 주고 한 가상 필드로 합친 뒤 BM25 를 한 번 계산한다. 필드마다 따로 채점해 더할 때의 IDF 왜곡이 없다"
    synonyms: ["BM25F", "combined_fields"]
  - id: srch-learned-sparse
    kind: MECHANISM
    name: "학습형 스파스"
    category: ALGORITHM
    level: ADVANCED
    description: "모델이 문서 · 질의를 어휘 차원의 희소 가중치로 바꾼다. 원문에 없던 관련어까지 가중을 받으면서 역색인 인프라를 그대로 쓴다. 학습 데이터가 필요하고 색인이 커진다"
    synonyms: ["learned sparse retrieval", "neural sparse", "ELSER"]
    questions:
      - "학습형 스파스가 덴스 벡터 대신 역색인을 유지해서 얻는 것은 무엇인가"
    contains: [srch-splade, srch-doc-expansion, srch-two-phase-sparse]
    uses: [srch-sparse-vector-field]
    alternative_to:
      - { to: bm25, reason: "통계 가중 대 학습 가중 — 같은 역색인 위에서" }
  - id: srch-splade
    kind: MECHANISM
    name: "SPLADE"
    category: ALGORITHM
    level: ADVANCED
    description: "언어 모델의 마스크 예측 로짓으로 어휘 전체에 가중을 매기고 희소성 규제로 대부분을 0 으로 만든다. 학습형 스파스의 대표 모델 계열이다"
    synonyms: ["SPLADE"]
  - id: srch-doc-expansion
    kind: MECHANISM
    name: "문서 확장"
    category: ALGORITHM
    level: ADVANCED
    description: "문서로부터 나올 법한 질의를 생성해 문서에 덧붙여 색인한다(doc2query). 질의 쪽 비용 없이 어휘 불일치를 줄인다"
    synonyms: ["doc2query", "document expansion"]
  - id: srch-two-phase-sparse
    kind: MECHANISM
    name: "2단계 희소 가속"
    category: ALGORITHM
    level: ADVANCED
    description: "가중치가 큰 토큰만으로 먼저 후보를 뽑고 나머지 토큰으로 다시 채점한다. 토큰이 많은 학습형 스파스 질의의 지연을 줄인다"
    synonyms: ["two-phase", "neural sparse two-phase"]
  - id: ann-search
    kind: MECHANISM
    name: "덴스 · ANN"
    category: ALGORITHM
    level: ADVANCED
    description: "뜻이 가까운 것을 벡터 근사 최근접 탐색으로 찾는다. 바꿔 말한 질의 · 다국어 · 설명형에 강하고, 모델이 못 본 고유명사 · 숫자 · 코드에 약하다"
    synonyms: ["approximate nearest neighbor", "dense retrieval", "kNN"]
    questions:
      - "필터를 knn 바깥에 걸면 좁은 지역 검색에서 결과가 왜 줄어드나"
      - "BM25 가 이미 있는데 벡터 레그를 함께 두는 이유는 무엇인가"
      - "양자화 색인에서 재채점은 무엇을 되돌리나"
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/AttractionSearchAdapter.kt, symbol: "private fun vectorLeg(", note: "필터를 knn 안에 둔 HNSW 한 레그" }
    contains: [hnsw, srch-filtered-ann]
    uses: [cosine-similarity, srch-two-tower]
    measured_by:
      - { to: fallback-rate, reason: "인코더가 죽어 벡터 레그가 꺼지고 BM25 만 나간 비율" }
      - { to: srch-ann-recall, reason: "정확 kNN 결과를 얼마나 되찾나" }
  - id: srch-filtered-ann
    kind: MECHANISM
    name: "필터 결합 kNN"
    category: ALGORITHM
    level: ADVANCED
    description: "벡터 탐색에 필터를 언제 거느냐가 결과 수와 재현율을 정한다. 필터가 좁으면(매치율 수 %) 사전 필터나 전수 탐색으로 바꾼다"
    synonyms: ["filtered kNN", "kNN with filter"]
    contains: [srch-ann-pre-filter, srch-ann-post-filter]
  - id: srch-ann-pre-filter
    kind: MECHANISM
    name: "사전 필터"
    category: ALGORITHM
    level: ADVANCED
    description: "필터를 통과한 문서만 그래프 탐색 대상으로 둔다. 결과가 k 개를 채우지만, 필터가 좁으면 그래프가 끊겨 탐색이 느려진다"
    synonyms: ["pre-filtering", "efficient filtering"]
    mitigates:
      - { to: srch-post-filter-recall-loss, reason: "필터 안에서 k 개를 찾는다" }
  - id: srch-ann-post-filter
    kind: MECHANISM
    name: "사후 필터"
    category: ALGORITHM
    level: ADVANCED
    description: "먼저 벡터로 k 개를 찾고 그중 필터를 통과한 것만 남긴다. 빠르지만 필터가 좁으면 결과가 k 보다 훨씬 적어진다"
    synonyms: ["post-filtering"]
    causes:
      - { to: srch-post-filter-recall-loss, reason: "필터에서 떨어진 몫만큼 결과가 빈다" }
  - id: srch-late-interaction
    kind: MECHANISM
    name: "늦은 상호작용 (ColBERT)"
    category: ALGORITHM
    level: ADVANCED
    description: "문서 · 질의를 토큰마다 벡터로 두고 질의 토큰별 최대 유사도를 더한다(MaxSim). 단일 벡터보다 정확하지만 저장이 토큰 수만큼 커진다"
    synonyms: ["ColBERT", "late interaction", "MaxSim"]
    alternative_to:
      - { to: ann-search, reason: "문서당 벡터 하나 대 토큰마다 벡터 — 정확도 대 저장" }
  - id: srch-similarity-module
    kind: MECHANISM
    name: "유사도 모델 교체"
    category: ALGORITHM
    level: ADVANCED
    description: "필드마다 점수 모델을 바꾼다 — BM25(기본) · 불리언(상수) · DFR · IB · 언어 모델(LM Dirichlet · Jelinek-Mercer). 짧은 필드나 특수 코퍼스에서 BM25 보다 나은 경우가 있다"
    synonyms: ["similarity", "DFR", "LM Dirichlet", "Jelinek-Mercer", "query likelihood"]
  - id: opensearch
    kind: TECHNOLOGY
    name: "OpenSearch"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "검색 엔진. BM25 역인덱스와 HNSW 벡터 색인을 한 색인에 함께 든다"
    implements:
      - { to: bm25, reason: "text 필드의 기본 유사도가 BM25 다" }
      - { to: ann-search, reason: "k-NN 플러그인이 knn_vector 필드를 HNSW 로 탐색한다" }
      - { to: srch-search-pipeline, reason: "검색 파이프라인 프로세서로 하이브리드 점수를 합친다" }
      - { to: srch-binary-quantization, reason: "lucene 엔진 knn_vector 의 sq 인코더 bits 1" }
      - { to: alias-swap, reason: "_aliases 의 remove + add 를 한 요청으로 원자 교체한다" }
  - id: srch-post-filter-recall-loss
    kind: PROBLEM
    name: "사후 필터 결과 부족"
    category: ALGORITHM
    level: ADVANCED
    description: "벡터로 뽑은 k 개 중 필터를 통과한 것만 남아 좁은 조건(작은 지역)에서 결과가 몇 건으로 줄어드는 상태"
  - id: srch-ann-recall
    kind: METRIC
    name: "ANN 재현율"
    category: TESTING
    level: ADVANCED
    description: "근사 탐색 상위 k 가 정확 kNN 상위 k 를 얼마나 되찾나. 양자화 · 그래프 파라미터 · 오버샘플의 효과를 품질 판정 없이 잰다"
    synonyms: ["recall@k vs exact", "ANN recall"]
  - id: rank-fusion
    kind: STAGE
    name: "융합"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "점수 스케일이 다른 두 후보 목록을 합친다. BM25 점수와 코사인은 단위가 달라 그대로 더하면 큰 쪽이 이긴다. 융합 전에 두 레그에 같은 필터를 건다"
    questions:
      - "BM25 점수와 코사인 유사도를 그냥 더하면 무엇이 틀리나"
    contains: [rrf, srch-weighted-score-fusion, srch-conditional-leg-selection, srch-learned-fusion, srch-fusion-depth, srch-same-filter-both-legs, srch-search-pipeline, srch-score-scale-mismatch, srch-filter-leak, srch-fusion-depth-truncation]
    flows_to: [post-ranking]
    measured_by:
      - { to: ndcg, reason: "융합 결과 상위 10 을 등급 판정으로 잰다" }
  - id: rrf
    kind: MECHANISM
    name: "RRF"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "Reciprocal Rank Fusion — 각 목록의 순위 역수 1/(k + rank)를 더해 합친다. 점수를 안 봐 스케일 · 분포에 무관하고 튜닝할 값이 k 하나(관례 60)다"
    synonyms: ["Reciprocal Rank Fusion"]
    questions:
      - "점수가 아니라 순위로 합치는 이유는 무엇인가"
      - "rank_constant 를 키우면 순위 분포가 어떻게 바뀌나"
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/HybridSearchPipelineInitializer.kt, symbol: "private const val RRF_PIPELINE", note: "rank_constant 60 인 RRF 검색 파이프라인" }
    mitigates:
      - { to: srch-score-scale-mismatch, reason: "점수 대신 순위를 쓰므로 단위가 사라진다" }
  - id: srch-weighted-score-fusion
    kind: MECHANISM
    name: "가중 점수합 (선형 융합)"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "α · norm(BM25) + (1−α) · cos 처럼 정규화한 점수를 가중합한다. 점수 크기 차이를 살리지만 질의마다 분포가 달라 α 가 흔들린다"
    synonyms: ["linear combination", "convex combination", "weighted sum"]
    contains: [srch-score-normalization]
    alternative_to:
      - { to: rrf, reason: "점수 크기를 살리느냐, 순위만 보느냐" }
  - id: srch-score-normalization
    kind: MECHANISM
    name: "점수 정규화"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "레그별 점수를 같은 범위로 옮긴다 — min-max · L2 · z-score. 결과 목록 안에서 정규화하므로 상위 한 건의 점수가 나머지 전체를 흔든다"
    synonyms: ["min-max normalization", "z-score", "normalization-processor"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/ranking/service/ThompsonReranker.kt, symbol: "private fun minMaxNormalize(", note: "랭커 점수를 0~1 로 옮긴 뒤 밴딧 표본과 섞는다" }
    mitigates:
      - { to: srch-score-scale-mismatch, reason: "레그별 점수를 같은 범위로 옮긴다" }
  - id: srch-conditional-leg-selection
    kind: MECHANISM
    name: "조건부 레그 선택"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "의도나 질의 모양에 따라 한 레그만 쓴다. 의도어를 빼고 잔여 검색어가 안 남으면 키워드 레그가 전부 맞음이 돼 임의 순서가 섞이므로 벡터 단독으로 답한다. 설명하기 쉽지만 경계에서 결과가 튄다"
    synonyms: ["query routing", "vector-only fallback"]
  - id: srch-learned-fusion
    kind: MECHANISM
    name: "학습 융합"
    category: ALGORITHM
    level: ADVANCED
    description: "레그별 점수 · 순위를 피처로 넣고 LTR 로 합치는 법을 배운다. 가장 좋지만 학습 데이터와 평가 체계가 먼저 있어야 한다"
    uses: [learning-to-rank]
  - id: srch-fusion-depth
    kind: MECHANISM
    name: "융합 깊이"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "각 레그가 융합에 내놓는 결과 수. from + size 보다 작으면 뒷 페이지가 빈다. 깊을수록 융합이 정확하지만 레그마다 더 뽑는다"
    synonyms: ["pagination_depth", "rank window size"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/AttractionSearchAdapter.kt, symbol: ".paginationDepth(", note: "요청 깊이와 k 중 큰 값으로 융합 깊이를 준다" }
    mitigates:
      - { to: srch-fusion-depth-truncation, reason: "페이지 끝까지 각 레그가 후보를 낸다" }
  - id: srch-same-filter-both-legs
    kind: MECHANISM
    name: "두 레그에 같은 필터"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "필터를 키워드 레그와 벡터 레그 양쪽(벡터는 knn 안)에 똑같이 건다"
    mitigates:
      - { to: srch-filter-leak, reason: "한쪽 레그가 필터 밖 문서를 끌어오지 못한다" }
  - id: srch-search-pipeline
    kind: MECHANISM
    name: "검색 파이프라인"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "검색 요청 · 응답 · 단계 사이에 프로세서를 끼워 넣는 엔진 측 사슬. 하이브리드 점수 정규화 · 융합 · 리랭크를 애플리케이션 밖에서 한다"
    synonyms: ["search pipeline", "search processor"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/HybridSearchPipelineInitializer.kt, symbol: "class HybridSearchPipelineInitializer(", note: "기동 시 RRF 파이프라인을 등록한다" }
  - id: srch-score-scale-mismatch
    kind: PROBLEM
    name: "점수 스케일 불일치"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "BM25(0~수십)와 코사인(−1~1)처럼 단위가 다른 점수를 그대로 더해 스케일이 큰 쪽이 순위를 독차지하는 상태"
  - id: srch-filter-leak
    kind: PROBLEM
    name: "필터 누수"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "한 레그에만 필터를 걸어 다른 레그가 조건 밖 문서를 끌어와 융합 결과에 섞이는 상태"
  - id: srch-fusion-depth-truncation
    kind: PROBLEM
    name: "융합 깊이 부족"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "레그가 융합에 내놓는 결과 수가 요청 페이지보다 얕아 2 페이지부터 비는 상태. 첫 페이지만 보면 안 보인다"
  - id: srch-relevance-tuning
    kind: STAGE
    name: "점수 조정"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "텍스트 일치 점수에 인기 · 신선도 · 거리 · 품질 같은 비즈니스 신호를 섞고 특정 문서를 올리거나 내린다. 원시 값을 그대로 곱하면 신호 하나가 순위를 지배한다"
    synonyms: ["relevance tuning", "boosting"]
    questions:
      - "인기도를 점수에 그대로 곱하면 무엇이 터지고 log1p 는 무엇을 막나"
    contains: [srch-function-score, srch-field-boosting, srch-rank-feature-boost, srch-distance-feature-boost, srch-pinned-results, srch-negative-boost, srch-constant-score, srch-static-quality-signals, srch-query-rules, srch-raw-signal-domination, srch-zero-multiply]
    flows_to: [post-ranking]
  - id: srch-function-score
    kind: MECHANISM
    name: "점수 함수 결합"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "질의 점수에 함수(필드 값 · 감쇠 · 스크립트 · 무작위) 점수를 곱하거나 더한다. 함수끼리(score_mode)와 질의와(boost_mode) 합치는 법을 따로 정한다"
    synonyms: ["function_score", "score_mode", "boost_mode"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/RankingQueryBuilder.kt, symbol: "class RankingQueryBuilder", note: "상품 검색 점수에 인기 · 신선도 함수를 얹는다" }
    contains: [srch-decay-function, srch-field-value-factor, srch-script-score]
  - id: srch-decay-function
    kind: MECHANISM
    name: "감쇠 함수"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "기준점(지금 · 현위치)에서 멀어질수록 점수를 gauss · exp · linear 곡선으로 깎는다. scale(얼마나 멀면) · decay(얼마로) · offset(여기까진 감점 없음)으로 모양을 정한다"
    synonyms: ["decay function", "gauss", "exp", "linear"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/RankingQueryBuilder.kt, symbol: "fn.gauss { g ->", note: "등록일 신선도 감쇠" }
  - id: srch-field-value-factor
    kind: MECHANISM
    name: "필드 값 인자 · modifier"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "필드 값(판매 수 · 평점)을 점수 인자로 쓰되 log1p · ln2p · sqrt 같은 포화 함수로 눌러 큰 값이 독주하지 않게 한다. 0 이 들어올 수 있는지 먼저 본다(log 는 0 에서 −∞, 곱셈이면 점수가 0)"
    synonyms: ["field_value_factor", "modifier", "log1p", "ln2p"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/RankingQueryBuilder.kt, symbol: "FieldValueFactorModifier.Log1p", note: "인기 신호를 log1p 로 눌러 섞는다" }
    mitigates:
      - { to: srch-raw-signal-domination, reason: "포화 곡선으로 큰 값의 몫을 줄인다" }
      - { to: srch-zero-multiply, reason: "+1 붙은 로그와 missing 기본값으로 0 곱을 피한다" }
  - id: srch-script-score
    kind: MECHANISM
    name: "스크립트 점수"
    category: ALGORITHM
    level: ADVANCED
    description: "문서마다 스크립트로 점수를 계산한다. 무엇이든 표현하지만 모든 후보에서 돌아 느리므로 rank_feature · 감쇠 함수로 되면 그쪽을 쓴다"
    synonyms: ["script_score", "Painless"]
  - id: srch-field-boosting
    kind: MECHANISM
    name: "필드 가중"
    category: ALGORITHM
    level: BEGINNER
    description: "제목 일치를 본문 일치보다 크게 친다(title^3). 가장 싼 조정이지만 가중이 크면 제목에 흔한 말이 든 문서가 올라온다"
    synonyms: ["field boost", "title^3"]
  - id: srch-rank-feature-boost
    kind: MECHANISM
    name: "랭크 피처 부스트"
    category: ALGORITHM
    level: ADVANCED
    description: "rank_feature 필드 값을 포화 · 로그 · 시그모이드 함수로 점수에 더한다. 스크립트 없이 빠르고 상위 k 조기 종료와 맞물린다"
    synonyms: ["rank_feature query"]
    uses: [srch-rank-feature-field]
  - id: srch-distance-feature-boost
    kind: MECHANISM
    name: "거리 · 최신성 부스트"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "기준 날짜 · 좌표에 가까울수록 가점한다. 감쇠 함수보다 싸고 조기 종료가 된다"
    synonyms: ["distance_feature"]
  - id: srch-pinned-results
    kind: MECHANISM
    name: "고정 노출"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "지정한 문서를 점수와 무관하게 맨 위에 둔다. 큐레이션 · 프로모션용이다"
    synonyms: ["pinned query", "promoted results"]
  - id: srch-negative-boost
    kind: MECHANISM
    name: "강등"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "조건에 맞는 문서를 빼지 않고 점수만 깎는다(품절 · 저품질). 제외보다 결과가 비지 않는다"
    synonyms: ["boosting query", "negative_boost", "demotion"]
  - id: srch-constant-score
    kind: MECHANISM
    name: "상수 점수"
    category: ALGORITHM
    level: BEGINNER
    description: "맞는 문서에 같은 점수를 준다. 필터를 점수 체계에 넣되 텍스트 통계를 끼우지 않을 때 쓴다"
    synonyms: ["constant_score"]
  - id: srch-static-quality-signals
    kind: MECHANISM
    name: "정적 품질 신호"
    category: DATA
    level: INTERMEDIATE
    description: "질의와 무관한 문서 값 — 인기 · 평점 · 신선도 · 완성도. 색인 때 넣어 두므로 갱신 주기가 곧 반영 지연이다"
    synonyms: ["static rank", "document prior"]
    uses: [srch-static-doc-features]
  - id: srch-query-rules
    kind: MECHANISM
    name: "질의 규칙"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "특정 질의 · 조건일 때 문서를 고정 · 제외 · 가중하는 운영 규칙을 모델 밖에 둔다. 모델을 다시 학습하지 않고 급한 조정을 한다"
    synonyms: ["query rules", "merchandising rules"]
  - id: srch-raw-signal-domination
    kind: PROBLEM
    name: "원시 신호 독주"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "판매 수 같은 긴 꼬리 분포 값을 그대로 곱해 인기 상위 몇 개가 질의와 무관하게 늘 위에 오는 상태"
  - id: srch-zero-multiply
    kind: PROBLEM
    name: "0 곱으로 점수 소멸"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "곱셈 결합에서 신호 값이 0 인 문서(신상품)의 점수가 0 이 돼 텍스트가 잘 맞아도 바닥으로 가는 상태"
  - id: post-ranking
    kind: STAGE
    name: "후처리"
    category: ALGORITHM
    level: ADVANCED
    description: "융합된 상위를 다시 채점하거나 다양성 · 비즈니스 규칙을 건다. 단계마다 후보 수와 문서당 비용이 반비례한다"
    contains: [srch-ranking-funnel, reranking, diversity-business-rules, srch-personalization, srch-train-serve-skew]
  - id: srch-ranking-funnel
    kind: MECHANISM
    name: "랭킹 퍼널 (캐스케이드)"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "매칭(전체 → 필터) → 경량 점수(수천) → 리랭킹(수백) → 정책(최종 k)으로 좁힌다. 싼 것으로 많이 거르고 비싼 것은 적게 쓴다 — 앞단이 놓친 문서는 뒷단이 못 살린다"
    synonyms: ["cascade ranking", "multi-stage retrieval", "two-stage retrieval"]
    questions:
      - "리랭커를 좋게 만드는 것보다 1단계 재현율이 먼저인 이유는 무엇인가"
  - id: reranking
    kind: MECHANISM
    name: "리랭킹"
    category: ALGORITHM
    level: ADVANCED
    description: "상위 후보만 무거운 모델로 다시 채점한다. 신경망 리랭커는 GPU 없이는 성립하기 어렵고, 트리 모델 LTR 은 CPU 로 된다"
    synonyms: ["reranker", "re-ranking"]
    contains: [learning-to-rank, srch-cross-encoder, srch-llm-reranker, srch-query-rescore]
    measured_by:
      - { to: ndcg, reason: "리랭크 전후 상위 10 의 등급 순서를 비교한다" }
  - id: srch-cross-encoder
    kind: MECHANISM
    name: "크로스 인코더"
    category: ALGORITHM
    level: ADVANCED
    description: "질의와 문서를 한 입력으로 함께 읽고 관련도를 낸다. 토큰끼리 직접 상호작용해 가장 정확하지만 후보마다 순전파가 필요해 상위 수십~수백 건에만 쓴다"
    synonyms: ["cross-encoder", "text_similarity_reranker"]
    questions:
      - "크로스 인코더를 전체 색인 검색에 쓸 수 없는 이유는 무엇인가"
    alternative_to:
      - { to: srch-two-tower, reason: "함께 읽어 정확하지만 비싸다 대 따로 인코딩해 싸지만 거칠다" }
    affects:
      - { to: latency-percentile, reason: "지연이 후보 수 × 모델 추론에 비례한다" }
  - id: srch-llm-reranker
    kind: MECHANISM
    name: "LLM 리랭커"
    category: ALGORITHM
    level: ADVANCED
    description: "언어 모델에게 후보 목록 순서를 매기게 한다(포인트 · 페어 · 리스트 방식). 도메인 적응이 쉽지만 가장 비싸고 느리다"
    synonyms: ["LLM ranker", "listwise LLM reranking"]
  - id: srch-query-rescore
    kind: MECHANISM
    name: "재채점 윈도우"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "샤드마다 상위 N 건(윈도우)만 더 비싼 질의(구문 근접 · 스크립트 · LTR 모델)로 다시 채점한다. 엔진 안에서 하는 2 단계 랭킹이다"
    synonyms: ["rescore", "window_size"]
  - id: learning-to-rank
    kind: MECHANISM
    name: "Learning to Rank"
    category: ALGORITHM
    level: ADVANCED
    description: "(쿼리, 문서, 등급) 라벨로 재정렬 함수를 배운다. 트리 모델은 GPU 없이 상위 N 을 몇 ms 에 다시 채점한다. 토큰이 어긋난 문서는 여기까지 오지 않는다"
    synonyms: ["LTR"]
    questions:
      - "LTR 학습 피처와 서빙 피처가 어긋나면 어떤 증상이 나나"
    contains: [query-level-cross-validation, srch-lambdamart, srch-feature-logging]
    uses: [ranking-features, ltr-loss-families]
  - id: srch-lambdamart
    kind: MECHANISM
    name: "LambdaMART"
    category: ALGORITHM
    level: ADVANCED
    description: "문서 쌍을 바꿨을 때의 nDCG 변화량을 그래디언트(λ)로 삼아 그래디언트 부스팅 트리를 학습한다. LTR 의 산업 표준이다"
    synonyms: ["LambdaMART", "LambdaRank", "GBDT ranker"]
  - id: srch-feature-logging
    kind: MECHANISM
    name: "피처 로깅"
    category: DATA
    level: ADVANCED
    description: "서빙 때 계산한 피처 값을 노출과 함께 그대로 남겨 학습 데이터로 쓴다. 학습 때 피처를 다시 계산하면 그 사이 바뀐 값이 섞인다"
    synonyms: ["feature logging"]
    mitigates:
      - { to: srch-train-serve-skew, reason: "학습과 서빙이 같은 값을 본다" }
  - id: query-level-cross-validation
    kind: MECHANISM
    name: "쿼리 단위 교차검증"
    category: TESTING
    level: INTERMEDIATE
    description: "쿼리 단위로 fold 를 나누는 교차검증. 같은 쿼리의 문서가 학습·검증에 갈라지면 점수가 새어 과대평가된다"
    mitigates:
      - { to: srch-query-leakage, reason: "같은 쿼리가 학습과 검증 양쪽에 들어가지 않는다" }
  - id: diversity-business-rules
    kind: MECHANISM
    name: "다양성 · 비즈니스 규칙"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "같은 것만 몰리지 않게 하고 운영 규칙(가중치 · 제외)을 건다. 모델 점수 위에 얹는 하드 규칙이라 평가 지표와 충돌할 수 있다"
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/AttractionSearchAdapter.kt, symbol: "private fun withCategoryWeights(", note: "의도에 따라 분류별 가중을 얹는다" }
    contains: [srch-mmr, srch-field-collapsing, srch-result-dedup]
  - id: srch-mmr
    kind: MECHANISM
    name: "MMR (최대 한계 적합성)"
    category: ALGORITHM
    level: ADVANCED
    description: "다음 결과를 고를 때 관련도에서 이미 고른 결과와의 유사도를 뺀 값이 가장 큰 것을 고른다. λ 로 관련도와 다양성을 맞바꾼다"
    synonyms: ["MMR", "Maximal Marginal Relevance"]
    mitigates:
      - { to: srch-diversity-collapse, reason: "비슷한 결과가 연달아 오지 않게 한다" }
  - id: srch-field-collapsing
    kind: MECHANISM
    name: "필드 접기"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "같은 필드 값(판매자 · 상품군)의 결과를 하나로 접고 그룹 안 상위 몇 건만 곁들인다. 한 판매자가 첫 화면을 채우는 것을 막는다"
    synonyms: ["collapse", "inner_hits", "group by"]
  - id: srch-result-dedup
    kind: MECHANISM
    name: "중복 제거"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "같은 대상의 다른 사본(언어판 · 재게시 · 거의 같은 문서)을 하나만 남긴다. 해시 · 대표 키 · 유사도 문턱으로 가른다"
    synonyms: ["deduplication", "near-duplicate detection"]
  - id: srch-personalization
    kind: MECHANISM
    name: "개인화"
    category: ALGORITHM
    level: ADVANCED
    description: "사용자 이력 · 문맥(기기 · 시간 · 지역)을 피처로 넣어 같은 질의에도 사람마다 순위를 바꾼다. 개인 식별과의 선을 어디 긋는지가 정책 문제다"
    synonyms: ["personalized search"]
    uses: [srch-contextual-features, srch-behavioral-features]
  - id: srch-train-serve-skew
    kind: PROBLEM
    name: "학습-서빙 불일치"
    category: DATA
    level: ADVANCED
    description: "학습 때 본 피처와 서빙 때 계산한 피처가 달라 오프라인 성적이 온라인에서 재현되지 않는 상태. 서빙에서 못 얻는 값은 학습에서도 뺀다"
    synonyms: ["training-serving skew"]
  - id: srch-autocomplete
    kind: STAGE
    name: "자동완성"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "입력 중인 접두로 후보를 키 입력마다 낸다. 지연 예산이 수십 ms 라 본 검색과 다른 색인(접두 최적화)을 쓰는 것이 보통이다"
    synonyms: ["autocomplete", "typeahead", "query suggestion"]
    questions:
      - "자동완성에 n-gram 이 아니라 edge n-gram 을 쓰는 이유는 무엇인가"
      - "한국어 자동완성에서 자모 분리가 필요한 이유는 무엇인가"
    contains: [srch-edge-ngram, srch-search-as-you-type, srch-completion-suggester, srch-match-bool-prefix, srch-prefix-term-enumeration, srch-popular-query-suggestion, srch-jamo-decomposition, srch-chosung-search, srch-ngram-index-bloat]
  - id: srch-search-as-you-type
    kind: MECHANISM
    name: "입력 중 검색 필드"
    category: DATA
    level: INTERMEDIATE
    description: "edge n-gram 과 싱글을 자동으로 붙인 하위 필드를 만들어 접두 · 중간 단어 일치를 한 필드로 푼다"
    synonyms: ["search_as_you_type"]
  - id: srch-completion-suggester
    kind: MECHANISM
    name: "완성 제안기"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "제안어를 가중치와 함께 메모리 FST 에 올려 접두 조회를 1 ms 안팎에 한다. 가장 빠르지만 중간 단어 일치 · 필터가 약하고 제안어를 따로 관리한다"
    synonyms: ["completion suggester"]
    contains: [srch-context-suggester]
    uses: [srch-fst]
    alternative_to:
      - { to: srch-edge-ngram, reason: "메모리 FST 로 가장 빠르게 대 색인 토큰으로 유연하게" }
  - id: srch-context-suggester
    kind: MECHANISM
    name: "문맥 제안"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "카테고리 · 위치 같은 문맥 값으로 완성 제안을 거르거나 가중한다"
    synonyms: ["context suggester"]
  - id: srch-match-bool-prefix
    kind: MECHANISM
    name: "마지막 토큰 접두 질의"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "앞 토큰은 일반 텀으로, 마지막 토큰만 접두로 찾는다. 별도 매핑 없이 쓰는 가벼운 자동완성이다"
    synonyms: ["match_bool_prefix", "match_phrase_prefix"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/opensearch/AttractionSearchAdapter.kt, symbol: "matchBoolPrefix", note: "관광지 · 지역 자동완성" }
  - id: srch-prefix-term-enumeration
    kind: MECHANISM
    name: "텀 사전 접두 열거"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "keyword 필드의 텀 사전에서 접두가 맞는 값을 바로 열거한다. 문서 검색 없이 필드 값 자동완성을 만든다"
    synonyms: ["_terms_enum"]
    uses: [srch-term-dictionary]
  - id: srch-popular-query-suggestion
    kind: MECHANISM
    name: "인기 질의 제안"
    category: DATA
    level: INTERMEDIATE
    description: "문서가 아니라 과거 질의 로그에서 접두가 맞는 인기 질의를 제안한다. 사전순이 아니라 빈도 · 성공률로 정렬하고 0 건 질의는 뺀다"
    synonyms: ["query log suggestion"]
  - id: srch-jamo-decomposition
    kind: MECHANISM
    name: "자모 분리"
    category: DATA
    level: INTERMEDIATE
    description: "한글을 자모로 풀어 색인 · 질의해 입력 중인 미완성 글자(서우 → 서울)도 접두로 맞게 한다"
    synonyms: ["jamo", "Hangul decomposition", "ICU NFD"]
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"jamo_edge_ngram\"", note: "자모 단위 edge n-gram 토크나이저" }
  - id: srch-chosung-search
    kind: MECHANISM
    name: "초성 검색"
    category: DATA
    level: INTERMEDIATE
    description: "초성만 친 입력(ㅅㅇ → 서울)을 초성 필드로 찾는다. 색인 때 초성열을 따로 만든다"
    synonyms: ["chosung", "initial consonant search"]
  - id: srch-ngram-index-bloat
    kind: PROBLEM
    name: "n-gram 색인 비대"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "min_gram · max_gram 폭만큼 토큰이 늘어 색인이 몇 배로 커지고 우연한 부분 일치가 결과에 섞이는 상태"
  - id: srch-aggregation
    kind: STAGE
    name: "집계 · 패싯"
    category: DATA
    level: INTERMEDIATE
    description: "검색 결과를 버킷으로 묶고 통계를 낸다. 패싯 필터 · 카운트 · 대시보드가 이것으로 만들어지고 doc values 를 읽는다"
    synonyms: ["aggregations", "facets"]
    questions:
      - "샤드가 여러 개일 때 terms 집계 상위 10 이 틀릴 수 있는 이유는 무엇인가"
    contains: [srch-bucket-aggregation, srch-metric-aggregation, srch-pipeline-aggregation, srch-faceted-navigation, srch-terms-agg-inaccuracy]
  - id: srch-bucket-aggregation
    kind: MECHANISM
    name: "버킷 집계"
    category: DATA
    level: INTERMEDIATE
    description: "문서를 값 · 구간 · 날짜 · 필터로 묶는다(terms · histogram · date_histogram · range · filters). 버킷 안에 다시 집계를 중첩한다"
    synonyms: ["bucket aggregation", "terms aggregation", "date_histogram"]
    contains: [srch-composite-aggregation, srch-significant-terms, srch-geo-grid-aggregation]
    uses: [srch-doc-values, srch-global-ordinals]
  - id: srch-composite-aggregation
    kind: MECHANISM
    name: "컴포지트 집계"
    category: DATA
    level: ADVANCED
    description: "여러 키 조합의 버킷을 after_key 로 페이지 넘기며 전부 가져온다. 버킷이 수백만 개인 GROUP BY 를 메모리 폭발 없이 한다"
    synonyms: ["composite", "after_key"]
  - id: srch-significant-terms
    kind: MECHANISM
    name: "유의 텀"
    category: ALGORITHM
    level: ADVANCED
    description: "전체 대비 결과 집합에서 유난히 자주 나오는 텀을 찾는다(흔하지 않게 흔한 것). 트렌드 · 이상 탐지 · 연관어에 쓴다"
    synonyms: ["significant_terms", "significant_text"]
  - id: srch-geo-grid-aggregation
    kind: MECHANISM
    name: "지리 격자 집계"
    category: DATA
    level: INTERMEDIATE
    description: "좌표를 geohash · 타일 · 육각 격자 칸으로 묶어 지도 클러스터를 만든다"
    synonyms: ["geohash_grid", "geotile_grid", "geohex_grid"]
    uses: [srch-geohash]
  - id: srch-metric-aggregation
    kind: MECHANISM
    name: "지표 집계"
    category: DATA
    level: INTERMEDIATE
    description: "버킷 안 값의 합 · 평균 · 최댓값 · 고유 수 · 백분위를 낸다. 고유 수와 백분위는 근사 자료구조로 계산한다"
    synonyms: ["metric aggregation", "stats"]
    contains: [srch-cardinality-hll, srch-percentiles-tdigest, srch-top-hits]
  - id: srch-cardinality-hll
    kind: MECHANISM
    name: "고유 수 근사 (HyperLogLog++)"
    category: ALGORITHM
    level: ADVANCED
    description: "해시 값의 선행 0 개수로 고유 원소 수를 몇 KB 에 근사한다. 샤드 결과를 합칠 수 있고, 정밀도 문턱 아래에서는 정확하다"
    synonyms: ["cardinality", "HyperLogLog", "HLL"]
    uses: [cs-hash-function]
  - id: srch-percentiles-tdigest
    kind: MECHANISM
    name: "백분위 근사 (TDigest · HDR)"
    category: ALGORITHM
    level: ADVANCED
    description: "값 분포를 중심점 묶음(TDigest)이나 로그 버킷(HDR)으로 요약해 P50 · P99 를 근사한다. 꼬리 백분위일수록 정확하게 설계됐다"
    synonyms: ["percentiles", "TDigest", "HdrHistogram"]
  - id: srch-top-hits
    kind: MECHANISM
    name: "그룹별 상위 문서"
    category: DATA
    level: INTERMEDIATE
    description: "버킷마다 대표 문서 몇 건을 함께 돌려준다(판매자별 대표 상품 3개)"
    synonyms: ["top_hits", "top_metrics"]
  - id: srch-pipeline-aggregation
    kind: MECHANISM
    name: "파이프라인 집계"
    category: DATA
    level: ADVANCED
    description: "다른 집계의 결과를 입력으로 다시 계산한다 — 버킷 간 미분 · 누적합 · 이동 평균 · 버킷 거르기 · 정렬"
    synonyms: ["pipeline aggregation", "derivative", "cumulative_sum", "bucket_selector"]
  - id: srch-faceted-navigation
    kind: MECHANISM
    name: "패싯 내비게이션"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "결과 옆에 속성별 값과 개수를 보여 주고 고르면 필터가 된다. 고른 패싯의 다른 값 개수가 사라지지 않게 결과 필터와 집계 필터를 따로 건다(post_filter)"
    synonyms: ["faceted search", "post_filter", "drill-down"]
  - id: srch-terms-agg-inaccuracy
    kind: PROBLEM
    name: "분산 terms 집계 오차"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "샤드마다 상위 N 개만 코디네이터로 보내 합치므로, 샤드별로는 순위 밖이던 값이 전체로는 상위인데 빠지거나 개수가 작게 나오는 상태. 샤드별 후보 수를 늘려 줄인다"
    synonyms: ["shard_size", "doc_count_error_upper_bound"]
  - id: srch-result-presentation
    kind: STAGE
    name: "결과 구성"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "순위가 정해진 결과를 사람이 읽을 모양으로 만든다 — 일치 부분 강조 · 묶기 · 생성형 답변"
    contains: [srch-highlighting, srch-field-collapsing, srch-rag]
  - id: srch-highlighting
    kind: MECHANISM
    name: "하이라이팅"
    category: DATA
    level: INTERMEDIATE
    description: "질의와 맞은 부분을 원문에서 찾아 표시한 조각(스니펫)을 만든다. 긴 필드는 오프셋 · 텀 벡터를 색인해 두면 다시 분석하지 않아 빠르다"
    synonyms: ["highlight", "snippet", "unified highlighter", "fvh"]
    uses: [srch-positions-offsets]
  - id: srch-rag
    kind: MECHANISM
    name: "RAG (검색 증강 생성)"
    category: ARCHITECTURE
    level: ADVANCED
    description: "검색한 상위 문서를 언어 모델 입력에 넣어 답을 생성한다. 생성 품질의 상한은 검색 재현율이 정하고, 출처를 함께 보여야 검증된다"
    synonyms: ["RAG", "Retrieval-Augmented Generation", "conversational search"]

  # ─────────────────────────── 평가 ───────────────────────────
  - id: search-evaluation
    kind: DOMAIN
    name: "검색 평가"
    category: TESTING
    level: INTERMEDIATE
    description: "오프라인은 판정 세트가, 온라인은 트래픽이 필요하다. 어느 한쪽만 보면 각각의 맹점에 빠진다"
    contains: [judgment-set-building, offline-evaluation, online-evaluation, srch-relevance-debugging, search-ops-monitoring]
  - id: judgment-set-building
    kind: STAGE
    name: "판정 세트 구축"
    category: TESTING
    level: INTERMEDIATE
    description: "쿼리마다 후보를 모아 사람이 등급을 매겨 판정 세트를 만든다. 풀링으로 후보를 모으고 커버리지로 빈틈을 잰다. 판정 세트는 그것을 만든 시스템에만 공정하다"
    questions:
      - "새 모델이 판정 세트에서 BM25 보다 낮게 나왔을 때 먼저 확인할 것은 무엇인가"
    contains: [pooling, judgment-coverage, click-weak-labels, position-bias, srch-llm-judgment, srch-inter-annotator-agreement, srch-pooling-bias, srch-small-query-set]
    flows_to: [offline-evaluation]
    uses: [graded-relevance]
  - id: pooling
    kind: MECHANISM
    name: "풀링"
    category: TESTING
    level: ADVANCED
    description: "여러 시스템의 상위를 모아 판정한다. 만든 시스템에만 공정한 편향을 줄인다. 후보 시스템을 추가하면 풀링부터 다시 한다"
    mitigates:
      - { to: srch-pooling-bias, reason: "새 후보의 상위 문서를 풀에 병합해 판정한다" }
  - id: judgment-coverage
    kind: METRIC
    name: "커버리지"
    category: TESTING
    level: INTERMEDIATE
    description: "결과 중 판정된 비율. 낮으면 비교가 거짓이다"
  - id: click-weak-labels
    kind: MECHANISM
    name: "클릭 약지도 라벨"
    category: DATA
    level: INTERMEDIATE
    description: "노출 · 클릭 · 체류 · 담기 · 구매 원장에서 0~4 관련도 라벨을 만든다. 사람 판정보다 싸지만 위치 편향이 섞여 있어 그대로 쓰면 1위를 1위라서 배운다"
    synonyms: ["weak supervision", "implicit feedback"]
  - id: position-bias
    kind: PROBLEM
    name: "위치 편향"
    category: TESTING
    level: INTERMEDIATE
    description: "위에 있는 결과가 맞아서가 아니라 위에 있어서 눌린다. 클릭을 라벨이나 보상으로 쓰려면 노출 성향으로 나눠야 한다"
    synonyms: ["position bias"]
    causes:
      - { to: srch-feedback-loop, reason: "위라서 받은 클릭을 학습하면 그 문서가 계속 위에 남는다" }
  - id: srch-llm-judgment
    kind: MECHANISM
    name: "LLM 판정 초안"
    category: TESTING
    level: ADVANCED
    description: "LLM 이 등급 초안을 매기고 사람이 경계 사례를 확인한다. 행마다 판정 출처(사람 · LLM)를 남겨 「이 nDCG 는 무엇 기준인가」에 답할 수 있게 한다"
    synonyms: ["LLM-as-a-judge"]
  - id: srch-inter-annotator-agreement
    kind: MECHANISM
    name: "판정 일관성 검사"
    category: TESTING
    level: ADVANCED
    description: "같은 쌍을 여러 사람(또는 사람과 LLM)이 매겨 일치도(코헨 카파 등)를 잰다. 판정이 주관적이라는 의심을 수치로 푼다"
    synonyms: ["inter-annotator agreement", "Cohen's kappa"]
  - id: srch-pooling-bias
    kind: PROBLEM
    name: "풀링 편향"
    category: TESTING
    level: ADVANCED
    description: "판정 세트를 만들 때 참여하지 않은 시스템이 찾아온 미판정 문서가 0 점으로 계산돼 그 시스템이 과소평가되는 상태"
    synonyms: ["pooling bias", "unjudged documents"]
    measured_by:
      - { to: judgment-coverage, reason: "시스템별 상위 k 커버리지가 100% 인지 본다" }
    causes:
      - { to: test-false-green, reason: "판정 세트를 만든 시스템만 좋게 나온다" }
  - id: srch-small-query-set
    kind: PROBLEM
    name: "질의 수 부족"
    category: TESTING
    level: INTERMEDIATE
    description: "질의가 적어 질의 하나가 평균을 크게 흔드는 상태(6 개면 한 질의가 17%). 20 개 밑이면 모델을 가르는 데 쓰지 않는다"
  # 옛 offline-metrics(지표 묶음)를 평가 활동으로 바꾼 새 개념 — 옛 행은 관리 해제 뒤 어드민 삭제
  - id: offline-evaluation
    kind: STAGE
    name: "오프라인 평가"
    category: TESTING
    level: INTERMEDIATE
    description: "판정 세트로 순위를 채점한다 — nDCG·재현율을 트래픽 없이 잰다. 빠르게 반복하는 대리 지표이고, 확정은 온라인이 한다"
    questions:
      - "MRR 과 nDCG 는 각각 어떤 질의에 맞나"
      - "평균 nDCG 가 올랐는데 질의별 델타를 봐야 하는 이유는 무엇인가"
    code:
      - { path: search/batch/src/main/kotlin/com/kgd/search/infrastructure/job/SearchEvaluationJobConfig.kt, symbol: "class SearchEvaluationJobConfig(", note: "판정 세트로 지표를 계산하는 배치" }
    contains: [ndcg, recall-precision, srch-precision-at-k, srch-recall-at-k, srch-f1-score, srch-mrr, srch-map, srch-dcg, srch-idcg, srch-err, srch-intra-list-diversity, srch-per-query-delta-analysis, srch-query-leakage, srch-offline-online-gap, srch-popularity-overfitting, srch-diversity-collapse]
    flows_to: [online-evaluation]
    uses: [judgment-set]
  - id: ndcg
    kind: METRIC
    name: "nDCG"
    category: TESTING
    level: INTERMEDIATE
    description: "순위 위치를 할인해 더한 이득(DCG)을 이상적 순위의 값(IDCG)으로 나눈 값. 등급이 여러 단계일 때의 기본 지표다"
    synonyms: ["Normalized Discounted Cumulative Gain", "nDCG@10"]
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/eval/RankingMetrics.kt, symbol: "fun ndcgAtK(", note: "nDCG@k" }
  - id: recall-precision
    kind: METRIC
    name: "재현율 · 정밀도"
    category: TESTING
    level: BEGINNER
    description: "찾아야 할 것 중 찾은 비율과 찾은 것 중 맞는 비율. 둘은 맞바꾸는 관계라 한쪽만 보면 속는다"
    synonyms: ["recall", "precision"]
  - id: srch-precision-at-k
    kind: METRIC
    name: "Precision@k"
    category: TESTING
    level: BEGINNER
    description: "상위 k 중 정답 비율. 순서를 안 보고 이진 판정만 쓴다"
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/eval/RankingMetrics.kt, symbol: "fun precisionAtK(", note: "P@k" }
  - id: srch-recall-at-k
    kind: METRIC
    name: "Recall@k"
    category: TESTING
    level: BEGINNER
    description: "정답 중 상위 k 에 든 비율. 리랭킹 전 후보 생성 단계를 재는 지표다"
    code:
      - { path: recommendation-ml/train_two_tower.py, symbol: "def recall_at_k(model, test_set, user_id_to_idx, item_idx_to_id, k_values):", note: "Two-Tower 검증" }
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/eval/RankingMetrics.kt, symbol: "fun recallAtK(", note: "R@k" }
  - id: srch-f1-score
    kind: METRIC
    name: "F1"
    category: TESTING
    level: BEGINNER
    description: "정밀도와 재현율의 조화 평균. 한쪽이 0 이면 0 이 된다"
    synonyms: ["F-measure"]
  - id: srch-mrr
    kind: METRIC
    name: "MRR"
    category: TESTING
    level: INTERMEDIATE
    description: "첫 정답의 역순위(1/rank) 평균. 정답이 하나인 내비게이션 질의에 맞다"
    synonyms: ["Mean Reciprocal Rank"]
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/eval/RankingMetrics.kt, symbol: "fun mrr(", note: "MRR" }
  - id: srch-map
    kind: METRIC
    name: "MAP"
    category: TESTING
    level: INTERMEDIATE
    description: "정답이 나올 때마다의 정밀도를 평균한 AP 를 질의 전체로 평균한다. 이진 판정 · 정답 여러 개일 때 쓴다"
    synonyms: ["Mean Average Precision", "AP"]
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/eval/RankingMetrics.kt, symbol: "fun mapAtK(", note: "MAP@k" }
  - id: srch-dcg
    kind: METRIC
    name: "DCG"
    category: TESTING
    level: INTERMEDIATE
    description: "등급 이득을 log2(순위 + 1)로 나눠 더한 값. 아래로 갈수록 할인한다. 질의마다 최댓값이 달라 그대로는 비교하지 못한다"
    synonyms: ["Discounted Cumulative Gain"]
    code:
      - { path: search/domain/src/main/kotlin/com/kgd/search/domain/eval/RankingMetrics.kt, symbol: "fun dcgAtK(", note: "DCG@k" }
  - id: srch-idcg
    kind: METRIC
    name: "IDCG"
    category: TESTING
    level: INTERMEDIATE
    description: "판정된 문서를 등급 내림차순으로 놓았을 때의 DCG. nDCG 의 분모라, 판정이 빈약하면 이 값이 작아져 nDCG 가 부풀려진다"
    synonyms: ["Ideal DCG"]
  - id: srch-err
    kind: METRIC
    name: "ERR (기대 역순위)"
    category: TESTING
    level: ADVANCED
    description: "사용자가 위에서부터 보다가 만족하면 멈춘다는 캐스케이드 가정으로 멈출 위치의 역순위 기댓값을 잰다. 위에 좋은 결과가 있으면 아래의 가치를 깎는다"
    synonyms: ["Expected Reciprocal Rank"]
  - id: srch-intra-list-diversity
    kind: METRIC
    name: "목록 내 다양성"
    category: TESTING
    level: ADVANCED
    description: "한 결과 목록 안 항목끼리의 평균 비유사도. nDCG 가 좋아도 비슷한 것만 몰리는 붕괴를 잡는다(α-nDCG · ERR-IA 는 주제 단위 변형)"
    synonyms: ["ILD", "alpha-nDCG"]
  - id: srch-per-query-delta-analysis
    kind: MECHANISM
    name: "질의별 델타 분석"
    category: TESTING
    level: INTERMEDIATE
    description: "평균이 아니라 질의마다 전후 차이를 정렬해 본다. 뜻으로 묻는 질의가 크게 오르고 이름 질의가 깎이는 식의 방향 갈림은 평균에 묻힌다"
    measured_by:
      - { to: ndcg, reason: "질의별 nDCG 차이를 정렬한다" }
  - id: srch-query-leakage
    kind: PROBLEM
    name: "쿼리 누수"
    category: TESTING
    level: ADVANCED
    description: "같은 쿼리의 문서가 학습과 검증에 갈라져 들어가 검증 점수가 비현실적으로 높게 나오는 상태(nDCG 0.95 류)"
    synonyms: ["train/test leakage"]
  - id: srch-offline-online-gap
    kind: PROBLEM
    name: "오프라인-온라인 괴리"
    category: TESTING
    level: ADVANCED
    description: "nDCG 가 올랐는데 CTR · 전환이 안 오르는 상태. 판정 기준이 사용자 기준과 다르거나 UI · 위치 효과가 오프라인에 없다"
  - id: srch-popularity-overfitting
    kind: PROBLEM
    name: "인기 편향 과적합"
    category: TESTING
    level: ADVANCED
    description: "LTR 이 인기 피처에 기대 오프라인 점수를 올리고 롱테일 · 신상품이 사라지는 상태"
    causes:
      - { to: srch-exposure-bias, reason: "인기 문서만 노출돼 다른 문서의 신호가 쌓이지 않는다" }
  - id: srch-diversity-collapse
    kind: PROBLEM
    name: "다양성 붕괴"
    category: TESTING
    level: ADVANCED
    description: "관련도 지표만 최적화해 첫 화면이 거의 같은 결과로 채워지는 상태"
    measured_by:
      - { to: srch-intra-list-diversity, reason: "목록 안 비유사도가 떨어진다" }
  - id: online-evaluation
    kind: STAGE
    name: "온라인 평가"
    category: TESTING
    level: ADVANCED
    description: "실제 트래픽으로 두 시스템을 비교한다. 오프라인 → 섀도 → 인터리빙 · A/B → 단계적 확대 순으로 위험을 줄인다"
    questions:
      - "A/B 대신 인터리빙을 쓰면 무엇을 얻고 무엇을 못 재나"
      - "클릭 로그만으로 새 랭커를 평가할 때 무엇을 먼저 기록해 둬야 하나"
    contains: [interleaving, ab-test, impression-click-ledger, propensity-logging, off-policy-evaluation, bandit-exploration, srch-north-star-guardrail, infra-shadow-traffic, srch-ramp-up, srch-ab-sample-size, srch-click-models, srch-propensity-estimation, srch-random-exploration, ctr, srch-conversion-rate, srch-requery-rate, srch-dwell-time, srch-abandonment-rate, srch-regret, srch-exposure-bias, srch-feedback-loop, srch-peeking-problem, srch-sample-ratio-mismatch, srch-ranking-flicker]
  - id: interleaving
    kind: MECHANISM
    name: "인터리빙"
    category: TESTING
    level: ADVANCED
    description: "두 시스템의 결과를 섞어 보여주고 클릭으로 가른다. A/B 보다 10~100 배 적은 트래픽으로 판정한다"
    contains: [team-draft-interleaving]
    alternative_to:
      - { to: ab-test, reason: "인터리빙은 한 목록 안에서 비교해 A/B 보다 적은 트래픽으로 판정한다" }
  - id: team-draft-interleaving
    kind: MECHANISM
    name: "팀 드래프트 인터리빙"
    category: TESTING
    level: ADVANCED
    description: "두 랭커가 번갈아 상위 문서를 뽑아 한 목록으로 섞고, 클릭이 어느 팀 문서에 갔는지로 승자를 가른다. A/B 보다 적은 트래픽으로 판정한다"
    synonyms: ["team draft"]
  - id: ab-test
    kind: MECHANISM
    name: "A/B 테스트"
    category: TESTING
    level: INTERMEDIATE
    description: "사용자를 무작위로 나눠 두 시스템에 보내고 지표를 비교한다. 비즈니스 지표를 직접 재는 유일한 방법이지만 트래픽과 기간이 든다"
    synonyms: ["A/B test", "controlled experiment"]
    measured_by:
      - { to: ctr, reason: "군 사이 CTR 차이" }
      - { to: srch-conversion-rate, reason: "군 사이 전환율 차이" }
  - id: impression-click-ledger
    kind: MECHANISM
    name: "노출 · 클릭 원장"
    category: DATA
    level: INTERMEDIATE
    description: "대상 × 동작 두 축(entity_type · action)과 계층 위치(screen · section · item_index)로 남긴 노출과 클릭. 온라인 학습과 CTR 지표의 유일한 원천"
    flows_to: [propensity-logging]
  - id: propensity-logging
    kind: MECHANISM
    name: "탐색 · 성향 로깅"
    category: DATA
    level: ADVANCED
    description: "노출 순서를 정한 정책과 그 선택 확률을 원장에 같이 남긴다. 가끔(ε) 순서를 섞어야 다른 정책의 결과를 나중에 추정할 수 있다. 트래픽이 오기 전에 깔아야 한다"
    synonyms: ["propensity"]
    flows_to: [off-policy-evaluation]
    uses: [srch-propensity-score]
    mitigates:
      - { to: position-bias, reason: "노출 확률을 함께 적어 두면 위치 때문에 받은 클릭을 역가중할 수 있다" }
  - id: off-policy-evaluation
    kind: MECHANISM
    name: "오프폴리시 평가"
    category: TESTING
    level: ADVANCED
    description: "로그를 남긴 정책과 다른 정책을 냈으면 지표가 얼마였을지 성향 역수 가중(IPS · SNIPS)으로 추정한다. 배포 없이 새 랭커를 온라인 지표로 잰다"
    synonyms: ["counterfactual evaluation", "OPE"]
    contains: [inverse-propensity-scoring, srch-doubly-robust]
    flows_to: [bandit-exploration]
  - id: inverse-propensity-scoring
    kind: MECHANISM
    name: "성향 역수 가중"
    category: ALGORITHM
    level: ADVANCED
    description: "로그 정책이 그 노출을 고를 확률(성향)의 역수로 가중해 다른 정책의 지표를 추정한다(IPS). 성향이 작으면 가중이 폭발해 하한으로 자른다(clipping)"
    synonyms: ["IPS", "IPW", "propensity clipping"]
    contains: [srch-snips]
    mitigates:
      - { to: position-bias, reason: "성향의 역수로 가중해 윗자리 클릭의 과대 몫을 되돌린다" }
  - id: srch-snips
    kind: MECHANISM
    name: "SNIPS (자기 정규화 IPS)"
    category: ALGORITHM
    level: ADVANCED
    description: "IPS 추정을 가중치 합으로 나눠 분산을 줄인다. 약간의 편향을 받고 안정성을 얻는다"
    synonyms: ["SNIPS", "self-normalized IPS"]
  - id: srch-doubly-robust
    kind: MECHANISM
    name: "이중 강건 추정"
    category: ALGORITHM
    level: ADVANCED
    description: "보상 모델 예측(direct method)에 IPS 로 잔차를 보정한다. 둘 중 하나만 맞아도 편향이 없다"
    synonyms: ["Doubly Robust", "DR estimator"]
  - id: bandit-exploration
    kind: MECHANISM
    name: "밴딧 · 탐색"
    category: ALGORITHM
    level: ADVANCED
    description: "팔(노출 후보)마다 보상 분포를 갖고 확실한 팔을 쓰면서 불확실한 팔을 시험한다. 보상이 즉시 오는 1단계 문제라 강화학습 본체는 쓰지 않는다. 고정 기간 A/B 대신 트래픽을 이기는 쪽으로 옮겨 간다"
    synonyms: ["multi-armed bandit", "MAB"]
    questions:
      - "A/B 테스트 대신 밴딧을 쓰면 무엇을 얻고 무엇을 잃나"
    contains: [srch-thompson-sampling, srch-epsilon-greedy, srch-ucb1, contextual-bandit, srch-empirical-bayes-prior, srch-temporal-decay, srch-hybrid-bandit-score, srch-impression-threshold, srch-sample-session-cache, srch-bandit-state-store, srch-prior-only-degradation, srch-slate-bandit]
    uses: [exploration-exploitation, beta-bernoulli-conjugate, srch-bandit-arm]
    alternative_to:
      - { to: ab-test, reason: "고정 배분으로 검정하느냐, 이기는 팔로 트래픽을 옮기며 후회를 줄이느냐" }
    mitigates:
      - { to: srch-exposure-bias, reason: "불확실한 팔에 노출을 나눠 신호가 쌓이게 한다" }
    measured_by:
      - { to: srch-regret, reason: "최선의 팔만 골랐을 때 대비 잃은 보상" }
  - id: srch-thompson-sampling
    kind: MECHANISM
    name: "Thompson Sampling"
    category: ALGORITHM
    level: ADVANCED
    description: "팔마다 사후 분포(베타)에서 표본을 하나씩 뽑아 가장 큰 팔을 고른다. 불확실한 팔은 분포가 넓어 가끔 크게 뽑히므로 탐색이 자동으로 생긴다"
    synonyms: ["Thompson Sampling", "posterior sampling"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/ranking/service/ThompsonReranker.kt, symbol: "class ThompsonReranker(", note: "상품 검색 상위를 베타 표본으로 다시 정렬한다" }
    uses: [beta-bernoulli-conjugate, srch-bayesian-update]
    causes:
      - { to: srch-ranking-flicker, reason: "요청마다 표본을 새로 뽑아 순서가 바뀐다" }
  - id: srch-epsilon-greedy
    kind: MECHANISM
    name: "ε-greedy"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "확률 ε 로 무작위 팔을, 나머지는 지금까지 최고 팔을 고른다. 가장 단순하지만 탐색이 불확실성과 무관하게 균등해 낭비가 크다"
    synonyms: ["epsilon-greedy"]
    alternative_to:
      - { to: srch-thompson-sampling, reason: "균등 무작위 탐색 대 불확실성 비례 탐색" }
  - id: srch-ucb1
    kind: MECHANISM
    name: "UCB1"
    category: ALGORITHM
    level: ADVANCED
    description: "평균에 불확실성 보너스(√(2 ln t / n))를 더한 상한이 가장 큰 팔을 결정적으로 고른다. 재현 가능하지만 같은 요청에 늘 같은 팔을 준다"
    synonyms: ["Upper Confidence Bound"]
    alternative_to:
      - { to: srch-thompson-sampling, reason: "결정적 상한 대 확률적 표본" }
  - id: contextual-bandit
    kind: MECHANISM
    name: "컨텍스추얼 밴딧"
    category: ALGORITHM
    level: ADVANCED
    description: "팔의 보상을 문맥(시간대 · 기기 · 이전 클릭)의 함수로 배운다. 팔당 노출이 수백 건은 쌓인 뒤의 일이다"
    synonyms: ["contextual bandit"]
    contains: [srch-linucb, srch-neural-bandit]
  - id: srch-linucb
    kind: MECHANISM
    name: "LinUCB"
    category: ALGORITHM
    level: ADVANCED
    description: "보상을 문맥 피처의 선형 함수로 두고 계수의 신뢰 구간 상한으로 팔을 고른다. 컨텍스추얼 밴딧의 기본형이다"
    synonyms: ["LinUCB"]
  - id: srch-neural-bandit
    kind: MECHANISM
    name: "뉴럴 밴딧"
    category: ALGORITHM
    level: ADVANCED
    description: "보상 모델을 신경망으로 두고 불확실성을 근사(NeuralUCB · 드롭아웃 표본)한다. 표현력이 크지만 불확실성 추정이 거칠다"
    synonyms: ["NeuralUCB", "neural bandit"]
  - id: srch-empirical-bayes-prior
    kind: MECHANISM
    name: "경험적 베이즈 사전"
    category: ALGORITHM
    level: ADVANCED
    description: "같은 카테고리 · 지역의 평균 CTR 로 새 팔의 사전 분포(α, β)를 정한다. 클릭 0 인 신상품이 0 도 1 도 아닌 그럴듯한 값에서 출발한다"
    synonyms: ["empirical Bayes", "prior"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/ranking/config/BanditProperties.kt, symbol: "val priorAlpha", note: "베타 사전 α · β" }
  - id: srch-temporal-decay
    kind: MECHANISM
    name: "시간 감쇠"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "오래된 노출 · 클릭의 가중을 exp(−λ · 나이)로 줄여 최근 선호를 따라가게 한다"
    synonyms: ["time decay", "exponential decay"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/ranking/config/BanditProperties.kt, symbol: "val decayLambdaPerDay", note: "하루당 감쇠율 λ" }
  - id: srch-hybrid-bandit-score
    kind: MECHANISM
    name: "랭커 점수 × 밴딧 표본 결합"
    category: ALGORITHM
    level: ADVANCED
    description: "w · 정규화한 랭커 점수 + (1 − w) · 표본으로 섞는다. 텍스트 관련도를 버리지 않고 탐색을 얹는다"
    synonyms: ["hybrid score"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/ranking/service/MultiScopeBanditBlender.kt, symbol: "fun blend(", note: "여러 범위의 밴딧 표본을 섞는다" }
    uses: [srch-score-normalization]
  - id: srch-impression-threshold
    kind: MECHANISM
    name: "노출 문턱"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "노출이 N 건 미만인 팔은 관측 대신 사전만 쓴다. 몇 건의 우연한 클릭이 순위를 흔들지 않게 한다"
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/ranking/config/BanditProperties.kt, symbol: "val impressionThreshold", note: "사전만 쓰는 노출 문턱" }
  - id: srch-sample-session-cache
    kind: MECHANISM
    name: "표본 세션 고정"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "(사용자, 질의) 마다 뽑은 표본을 몇 초 동안 재사용한다. 새로 고침마다 순서가 바뀌는 깜빡임을 막는다"
    synonyms: ["flicker prevention"]
    mitigates:
      - { to: srch-ranking-flicker, reason: "같은 세션에서 같은 표본을 쓴다" }
  - id: srch-bandit-state-store
    kind: MECHANISM
    name: "팔 상태 저장"
    category: DATA
    level: INTERMEDIATE
    description: "팔 키((카테고리, 상품) 등)마다 노출 · 클릭 누적을 저장한다. 분포 자체가 아니라 α · β 두 수만 두면 된다"
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/infrastructure/bandit/BanditStateRedisAdapter.kt, symbol: "class BanditStateRedisAdapter(", note: "팔 상태를 Redis 해시에 둔다" }
    uses: [redis]
  - id: srch-prior-only-degradation
    kind: MECHANISM
    name: "사전만으로 강등"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "상태 저장소가 죽으면 관측 없이 사전 분포만으로 표본을 뽑는다. 순위 품질이 조금 내려갈 뿐 검색은 계속된다"
    synonyms: ["graceful degradation"]
  - id: srch-slate-bandit
    kind: MECHANISM
    name: "슬레이트 · 캐스케이드 밴딧"
    category: ALGORITHM
    level: ADVANCED
    description: "팔 하나가 아니라 상위 k 목록 전체를 한 행동으로 보고, 사용자가 위에서부터 훑다 멈추는 모델로 보상을 배분한다"
    synonyms: ["slate bandit", "cascading bandit"]
  - id: srch-north-star-guardrail
    kind: MECHANISM
    name: "노스스타 · 가드레일 지표"
    category: TESTING
    level: INTERMEDIATE
    description: "실험마다 판정 지표 하나(전환 등)와 깨지면 안 되는 가드레일 2~3 개(지연 · 0건율 · 이탈)를 미리 정한다. 지표를 골라 보는 사후 해석을 막는다"
    synonyms: ["north star metric", "guardrail metrics", "OEC"]
  - id: srch-ramp-up
    kind: MECHANISM
    name: "단계적 확대"
    category: TESTING
    level: INTERMEDIATE
    description: "1% → 10% → 50% → 100% 로 트래픽을 늘리고 단계마다 가드레일이 깨지면 자동으로 되돌린다"
    synonyms: ["ramp-up", "progressive rollout"]
  - id: srch-ab-sample-size
    kind: MECHANISM
    name: "표본 크기 · 유의성 검정"
    category: TESTING
    level: ADVANCED
    description: "검출할 차이 δ 와 분산 σ 로 필요한 표본을 미리 계산하고(n ≈ 16σ²/δ²), 끝난 뒤 Welch t · 카이제곱으로 검정한다. 미리 정한 표본 전에 멈추지 않는다"
    synonyms: ["power analysis", "Welch t-test", "chi-square test"]
    contains: [srch-sequential-testing]
  - id: srch-sequential-testing
    kind: MECHANISM
    name: "순차 검정"
    category: TESTING
    level: ADVANCED
    description: "중간에 여러 번 봐도 오류율이 유지되도록 경계를 조정한 검정(SPRT · 항상 유효한 p 값). 일찍 멈춰도 된다"
    synonyms: ["SPRT", "sequential testing"]
    mitigates:
      - { to: srch-peeking-problem, reason: "중간 확인을 전제로 오류율을 맞춘다" }
  - id: srch-click-models
    kind: MECHANISM
    name: "클릭 모델"
    category: ALGORITHM
    level: ADVANCED
    description: "사용자가 결과를 어떻게 훑고 클릭하는지 확률 모델로 둬 클릭에서 위치 효과와 관련도를 분리한다"
    synonyms: ["click models"]
    contains: [srch-position-based-model, srch-cascade-model, srch-dbn-click-model]
    mitigates:
      - { to: position-bias, reason: "클릭 = 봤음 × 끌렸음 으로 나눠 관련도만 남긴다" }
  - id: srch-position-based-model
    kind: MECHANISM
    name: "위치 기반 모델 (PBM)"
    category: ALGORITHM
    level: ADVANCED
    description: "클릭 확률 = 그 위치를 볼 확률 × 문서에 끌릴 확률. 위치별 조회 확률이 곧 성향이다"
    synonyms: ["PBM", "position-based model"]
  - id: srch-cascade-model
    kind: MECHANISM
    name: "캐스케이드 모델"
    category: ALGORITHM
    level: ADVANCED
    description: "위에서부터 차례로 보다가 끌리는 문서를 클릭하고 멈춘다고 본다. 클릭 위 문서는 봤는데 안 끌린 것이다"
    synonyms: ["cascade model"]
  - id: srch-dbn-click-model
    kind: MECHANISM
    name: "DBN 클릭 모델"
    category: ALGORITHM
    level: ADVANCED
    description: "클릭 뒤 만족 여부까지 넣은 동적 베이즈망 모델. 클릭하고도 계속 보는 경우를 설명한다"
    synonyms: ["DBN", "Dynamic Bayesian Network click model", "UBM"]
  - id: srch-propensity-estimation
    kind: MECHANISM
    name: "성향 추정"
    category: ALGORITHM
    level: ADVANCED
    description: "위치별 조회 확률을 추정한다 — 순서를 무작위로 바꿔 보는 실험(random swap) · EM · 클릭 모델 적합. 추정이 틀리면 IPS 보정도 틀린다"
    synonyms: ["propensity estimation", "randomization experiment"]
    uses: [srch-click-models]
  - id: srch-random-exploration
    kind: MECHANISM
    name: "무작위 탐색 트래픽"
    category: TESTING
    level: ADVANCED
    description: "트래픽 일부(수 %)의 순서를 무작위로 섞어 모델이 한 번도 안 보여 준 문서의 신호를 얻는다. 되먹임 고리를 끊는 대가로 그 몫의 품질을 낸다"
    synonyms: ["random exploration", "epsilon slot"]
    mitigates:
      - { to: srch-feedback-loop, reason: "모델과 무관한 노출로 새 신호를 넣는다" }
      - { to: srch-exposure-bias, reason: "안 보이던 문서가 노출된다" }
  - id: srch-conversion-rate
    kind: METRIC
    name: "전환율"
    category: TESTING
    level: BEGINNER
    description: "검색 세션 중 구매 · 예약 같은 목표 행동으로 이어진 비율. 사업 가치에 가장 가깝지만 신호가 드물어 표본이 많이 든다"
    synonyms: ["CVR", "conversion rate"]
  - id: srch-requery-rate
    kind: METRIC
    name: "재질의율"
    category: TESTING
    level: INTERMEDIATE
    description: "결과를 본 뒤 곧바로 질의를 고쳐 다시 친 비율. 결과가 의도를 못 맞췄다는 신호다"
    synonyms: ["reformulation rate", "re-search rate"]
  - id: srch-dwell-time
    kind: METRIC
    name: "체류 시간"
    category: TESTING
    level: INTERMEDIATE
    description: "클릭한 결과에 머문 시간. 짧게 돌아오면(pogo-sticking) 클릭이 만족이 아니었다는 뜻이다"
    synonyms: ["dwell time", "long click"]
  - id: srch-abandonment-rate
    kind: METRIC
    name: "이탈률"
    category: TESTING
    level: INTERMEDIATE
    description: "결과를 보고 아무 클릭 없이 떠난 세션 비율. 답이 스니펫에 있어 떠난 좋은 이탈과 구분이 필요하다"
    synonyms: ["abandonment", "bounce rate"]
  - id: srch-regret
    kind: METRIC
    name: "후회 (regret)"
    category: ALGORITHM
    level: ADVANCED
    description: "매번 최선의 팔을 골랐을 때 대비 누적으로 잃은 보상. 좋은 밴딧 알고리즘은 시간에 로그로 늘고, 탐색 없는 선택은 선형으로 는다"
    synonyms: ["regret"]
  - id: srch-exposure-bias
    kind: PROBLEM
    name: "노출 편향"
    category: TESTING
    level: ADVANCED
    description: "노출되지 않은 문서는 클릭도 없어 학습 데이터에서 아예 빠지는 상태. 신상품 · 롱테일이 나쁜 게 아니라 보인 적이 없다"
    synonyms: ["exposure bias", "selection bias"]
    causes:
      - { to: srch-feedback-loop, reason: "보인 것만 배우고 배운 것만 보인다" }
  - id: srch-feedback-loop
    kind: PROBLEM
    name: "되먹임 고리"
    category: TESTING
    level: ADVANCED
    description: "모델이 올린 문서만 클릭을 받고 그 클릭으로 다시 학습해 같은 문서가 계속 위에 남는 자기 강화 순환"
    synonyms: ["feedback loop", "rich-get-richer"]
  - id: srch-peeking-problem
    kind: PROBLEM
    name: "중간 엿보기"
    category: TESTING
    level: ADVANCED
    description: "고정 표본 검정을 중간에 여러 번 보고 유의해지는 순간 멈춰 거짓 양성률이 크게 오르는 상태"
    synonyms: ["peeking", "optional stopping"]
  - id: srch-sample-ratio-mismatch
    kind: PROBLEM
    name: "표본 비율 불일치 (SRM)"
    category: TESTING
    level: ADVANCED
    description: "50:50 으로 나눴는데 실제 군 크기가 유의하게 다른 상태. 배정 · 로깅 버그 신호라 결과를 믿지 않는다"
    synonyms: ["SRM", "sample ratio mismatch"]
  - id: srch-ranking-flicker
    kind: PROBLEM
    name: "순위 깜빡임"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "확률적 랭킹이 새로 고침마다 순서를 바꿔 사용자가 방금 본 결과를 다시 못 찾는 상태"
    synonyms: ["flicker"]
  - id: srch-relevance-debugging
    kind: STAGE
    name: "적합도 디버깅"
    category: TESTING
    level: INTERMEDIATE
    description: "「왜 이 문서가 여기 있나」를 토큰 → 매칭 → 점수 → 비용 순으로 따라간다"
    questions:
      - "기대한 문서가 안 나올 때 분석 · explain · profile 을 어떤 순서로 보나"
    contains: [srch-analyze-api, srch-score-explain, srch-query-profiling]
  - id: srch-analyze-api
    kind: MECHANISM
    name: "분석 결과 확인"
    category: TESTING
    level: BEGINNER
    description: "문자열이 필드의 분석기에서 어떤 토큰 · 위치 · 품사로 갈리는지 본다. 매칭 문제의 첫 확인이다"
    synonyms: ["_analyze"]
    flows_to: [srch-score-explain]
  - id: srch-score-explain
    kind: MECHANISM
    name: "점수 설명"
    category: TESTING
    level: INTERMEDIATE
    description: "한 문서의 점수가 어떤 절 · tf · idf · 길이 정규화 · 함수로 합쳐졌는지 트리로 받는다"
    synonyms: ["explain", "_explain"]
    code:
      - { path: search/app/src/main/kotlin/com/kgd/search/application/debug/usecase/DebugSearchUseCase.kt, symbol: "functionScore", note: "검색 디버그 화면에 점수 구성을 내보인다" }
    flows_to: [srch-query-profiling]
  - id: srch-query-profiling
    kind: MECHANISM
    name: "질의 프로파일링"
    category: TESTING
    level: INTERMEDIATE
    description: "샤드마다 질의 절 · 집계의 실행 시간을 나눠 받는다. 느린 절을 찾지만 자체 오버헤드가 있어 운영 전체 트래픽에는 켜지 않는다"
    synonyms: ["profile API"]
  # 옛 search-ops-metrics(지표 묶음)를 관측 활동으로 바꾼 새 개념 — 옛 행은 관리 해제 뒤 어드민 삭제
  - id: search-ops-monitoring
    kind: STAGE
    name: "운영 관측"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "운영 중 검색이 느려지거나 벡터 레그가 꺼지는지, 노드 메모리가 한도에 닿는지 지표로 지켜본다"
    contains: [latency-percentile, fallback-rate, cache-hit-rate, impression-click-ledger, search-node-memory, page-cache-eviction, srch-vector-memory-footprint, srch-qps, srch-slow-log]
  - id: latency-percentile
    kind: METRIC
    name: "지연 · P99"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "상위 백분위 지연. 평균은 꼬리를 숨긴다"
  - id: fallback-rate
    kind: METRIC
    name: "폴백률"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "벡터 레그가 꺼져 BM25 만 돈 비율"
  - id: cache-hit-rate
    kind: METRIC
    name: "캐시 적중률"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "캐시 조회 중 캐시에서 바로 답한 비율. 낮으면 캐시가 비용만 더한다"
    synonyms: ["cache hit ratio", "hit rate"]
  - id: search-node-memory
    kind: METRIC
    name: "검색 노드 메모리"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "한도 = JVM 힙 + 힙 밖 네이티브(~1 GB) + 색인 한 벌의 페이지 캐시. 캐시가 0 이 되면 벡터 파일이 질의마다 디스크에서 올라와 kNN 만 100초대가 된다"
    evidence:
      - { kind: RECORD, ref: msa-opensearch-memory-and-quantization-record, note: "한도 1536Mi → 2560Mi 전후 실측" }
  - id: page-cache-eviction
    kind: PROBLEM
    name: "페이지 캐시 밀림"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "힙 밖 익명 메모리가 컨테이너 한도를 채워 색인 파일의 페이지 캐시가 밀리는 상태. 벡터 탐색이 매 질의 디스크를 읽어 수십 초로 느려진다"
  - id: srch-vector-memory-footprint
    kind: METRIC
    name: "벡터 상주량"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "HNSW 벡터 색인이 메모리에 올라가야 하는 크기. 대략 1.1 × (차원 × 비트 / 8 + 8 × m) × 문서 수 바이트다"
    synonyms: ["vector memory estimate"]
  - id: srch-qps
    kind: METRIC
    name: "처리량 (QPS)"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "초당 처리한 검색 요청 수. 지연과 함께 봐야 포화를 안다"
    synonyms: ["QPS", "throughput"]

  # ─────────────────────────── 서빙 · 운영 ───────────────────────────
  - id: search-serving
    kind: DOMAIN
    name: "검색 서빙 · 운영"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "색인을 샤드로 나눠 여러 노드에 두고, 질의를 흩뿌려 모으고, 캐시와 지연 예산으로 꼬리를 누르고, 수명 주기 · 백업으로 운영한다"
    contains: [srch-cluster-topology, srch-query-execution, srch-search-caching, srch-latency-budgeting, srch-cluster-operations]
  - id: srch-cluster-topology
    kind: STAGE
    name: "클러스터 구성"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "노드 역할을 나누고 색인을 몇 샤드 · 몇 레플리카로 둘지, 어느 노드에 놓을지 정한다. 기본 샤드 수는 나중에 못 바꾼다"
    questions:
      - "데이터가 작은데 샤드를 많이 나누면 무엇을 잃나"
      - "레플리카 수는 가용성과 처리량 중 무엇으로 정하나"
    contains: [srch-node-roles, srch-shard, srch-replica, srch-shard-sizing, srch-custom-routing, srch-shard-allocation, srch-shard-split-shrink, srch-master-quorum, srch-cross-cluster-search, srch-cross-cluster-replication, srch-oversharding, srch-hot-shard]
  - id: srch-node-roles
    kind: MECHANISM
    name: "노드 역할"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "마스터(클러스터 상태) · 데이터(샤드 보관 · 질의 실행) · 코디네이팅(요청 분배 · 결과 병합) · 인제스트(색인 전 가공)를 노드별로 나눈다. 작은 클러스터는 겸하고 커지면 가른다"
    synonyms: ["master node", "data node", "coordinating node", "ingest node", "cluster manager"]
  - id: srch-shard
    kind: MECHANISM
    name: "샤드"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "색인을 쪼갠 단위이자 독립된 Lucene 색인 하나. 샤드가 많으면 병렬이 늘고 조정 비용도 는다. 문서는 라우팅 값의 해시로 샤드가 정해져 기본 샤드 수를 나중에 못 바꾼다"
    synonyms: ["primary shard", "number_of_shards"]
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"number_of_shards\": 1", note: "단일 노드라 샤드 하나" }
    uses: [sharding]
    causes:
      - { to: srch-shard-local-idf-skew, reason: "IDF 가 샤드 안 통계로 계산된다" }
  - id: srch-replica
    kind: MECHANISM
    name: "레플리카"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "샤드의 사본. 노드 장애 때 승격돼 가용성을 지키고, 읽기를 나눠 받아 처리량을 늘린다. 색인 비용은 사본 수만큼 는다"
    synonyms: ["replica shard", "number_of_replicas"]
    code:
      - { path: search/batch/src/main/resources/opensearch/attractions-index.json, symbol: "\"number_of_replicas\": 0", note: "단일 노드라 레플리카 없음" }
    uses: [replication]
  - id: srch-shard-sizing
    kind: MECHANISM
    name: "샤드 크기 산정"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "샤드당 수십 GB · 노드 힙 GB 당 샤드 수 상한 같은 기준으로 샤드 수를 정한다. 데이터 증가 · 재배치 시간 · 질의 병렬을 함께 본다"
    synonyms: ["shard sizing"]
    mitigates:
      - { to: srch-oversharding, reason: "데이터 크기에서 샤드 수를 거꾸로 계산한다" }
  - id: srch-custom-routing
    kind: MECHANISM
    name: "커스텀 라우팅"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "문서 id 대신 지정한 값(사용자 · 테넌트)으로 샤드를 정해, 그 값으로 거르는 질의가 샤드 하나만 치게 한다. 값이 치우치면 샤드가 치우친다"
    synonyms: ["_routing", "routing"]
    causes:
      - { to: srch-hot-shard, reason: "큰 테넌트가 한 샤드에 몰린다" }
  - id: srch-shard-allocation
    kind: MECHANISM
    name: "샤드 할당 · 인지"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "샤드를 어느 노드에 둘지의 규칙. 프라이머리와 레플리카를 다른 존에 두는 인지(awareness)와 특정 노드로 제한하는 필터가 있다. 디스크 워터마크도 할당을 막는다"
    synonyms: ["allocation awareness", "allocation filtering"]
  - id: srch-shard-split-shrink
    kind: MECHANISM
    name: "샤드 수 변경"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "색인을 새 색인으로 복제하며 샤드 수를 배수로 늘리거나(split) 약수로 줄인다(shrink). 재색인보다 싸지만 쓰기를 막아야 한다"
    synonyms: ["_split", "_shrink", "_clone"]
  - id: srch-master-quorum
    kind: MECHANISM
    name: "마스터 선출 · 쿼럼"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "마스터 후보 과반이 동의해야 클러스터 상태를 바꾼다. 후보는 홀수(3)로 두고, 과반을 잃으면 쓰기가 멈춘다"
    synonyms: ["master election", "voting configuration"]
    uses: [leader-election, dist-quorum]
  - id: srch-cross-cluster-search
    kind: MECHANISM
    name: "교차 클러스터 검색"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "원격 클러스터의 색인을 한 질의로 함께 찾는다. 지역 · 조직별로 나뉜 클러스터를 합쳐 보되 원격 지연이 전체 지연이 된다"
    synonyms: ["CCS", "cross-cluster search", "federated search"]
  - id: srch-cross-cluster-replication
    kind: MECHANISM
    name: "교차 클러스터 복제"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "리더 클러스터의 색인을 팔로워 클러스터로 한 방향 복제한다. 재해 복구와 지역 가까운 읽기에 쓴다"
    synonyms: ["CCR", "cross-cluster replication"]
  - id: srch-oversharding
    kind: PROBLEM
    name: "샤드 과다"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "작은 샤드가 너무 많아 샤드마다의 고정 비용(힙 · 파일 · 조정)이 쌓이고 질의가 모든 샤드로 흩어지는 상태"
    synonyms: ["oversharding"]
  - id: srch-hot-shard
    kind: PROBLEM
    name: "핫 샤드"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "라우팅 치우침으로 한 샤드에 데이터나 질의가 몰려 그 노드만 포화되는 상태"
    synonyms: ["hot spot", "routing skew"]
  - id: srch-query-execution
    kind: STAGE
    name: "분산 질의 실행"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "코디네이터가 질의를 모든 관련 샤드에 흩뿌리고 각 샤드의 상위 k 를 모아 병합한 뒤 필요한 문서만 가져온다. 깊은 페이지일수록 모으는 비용이 커진다"
    questions:
      - "from 10000 size 10 요청이 샤드마다 몇 건을 모으게 하나"
    contains: [srch-scatter-gather, srch-dfs-query-then-fetch, srch-adaptive-replica-selection, srch-deep-paging, srch-async-search, srch-multi-search-batching, srch-search-timeout-partial, srch-shard-local-idf-skew, srch-deep-paging-cost, srch-tail-latency]
  - id: srch-scatter-gather
    kind: MECHANISM
    name: "스캐터-개더 (query then fetch)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "질의 단계에서 샤드마다 상위 문서 id · 점수만 받아 병합하고, 가져오기 단계에서 최종 상위 문서의 원문만 읽는다"
    synonyms: ["scatter-gather", "query then fetch", "fan-out"]
    causes:
      - { to: srch-tail-latency, reason: "가장 느린 샤드 하나가 전체 응답을 정한다" }
  - id: srch-dfs-query-then-fetch
    kind: MECHANISM
    name: "전역 통계 보정 (DFS)"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "질의 전에 샤드들의 텀 통계를 모아 전역 IDF 로 채점한다. 왕복이 하나 늘어 느리므로 문서가 적어 샤드별 통계가 흔들릴 때만 쓴다"
    synonyms: ["dfs_query_then_fetch"]
    mitigates:
      - { to: srch-shard-local-idf-skew, reason: "모든 샤드가 같은 IDF 로 채점한다" }
  - id: srch-adaptive-replica-selection
    kind: MECHANISM
    name: "적응형 레플리카 선택"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "응답 시간 · 대기열이 짧은 사본으로 질의를 보낸다. 느린 노드 하나가 꼬리 지연을 끌어올리는 것을 줄인다"
    synonyms: ["adaptive replica selection"]
    mitigates:
      - { to: srch-tail-latency, reason: "느린 사본을 피한다" }
  - id: srch-deep-paging
    kind: MECHANISM
    name: "딥 페이징"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "뒤쪽 페이지를 가져오는 방법들. 오프셋 방식은 샤드마다 앞 페이지 전부를 모아 깊을수록 비싸고, 커서 방식은 이전 페이지의 마지막 정렬 값에서 이어 간다"
    synonyms: ["deep pagination"]
    contains: [srch-from-size, srch-search-after, srch-point-in-time, srch-scroll]
  - id: srch-from-size
    kind: MECHANISM
    name: "오프셋 페이징 (from + size)"
    category: DISTRIBUTED_SYSTEM
    level: BEGINNER
    description: "from 건을 건너뛰고 size 건을 가져온다. 샤드마다 from + size 건을 모아 정렬하므로 상한(max_result_window)을 둔다"
    synonyms: ["from", "size", "max_result_window"]
    causes:
      - { to: srch-deep-paging-cost, reason: "깊을수록 모아서 버리는 문서가 는다" }
  - id: srch-search-after
    kind: MECHANISM
    name: "커서 페이징 (search_after)"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "이전 페이지 마지막 문서의 정렬 값(+ 동점 깨기 필드)부터 이어서 가져온다. 깊이와 무관하게 싸지만 임의 페이지로 건너뛰지 못한다"
    synonyms: ["search_after", "keyset pagination"]
    uses: [srch-point-in-time]
    mitigates:
      - { to: srch-deep-paging-cost, reason: "앞 페이지를 다시 모으지 않는다" }
    alternative_to:
      - { to: srch-from-size, reason: "임의 페이지 이동 대 깊이와 무관한 비용" }
  - id: srch-point-in-time
    kind: MECHANISM
    name: "시점 고정 (PIT)"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "검색 시점의 세그먼트 집합을 붙잡아 페이지를 넘기는 동안 색인이 바뀌어도 일관된 결과를 준다. 열어 둔 동안 병합된 옛 세그먼트가 지워지지 않는다"
    synonyms: ["PIT", "point in time"]
  - id: srch-scroll
    kind: MECHANISM
    name: "스크롤"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "스냅숏을 서버에 붙잡고 배치로 끝까지 훑는 옛 방식. 전량 내보내기용이었고 지금은 PIT + search_after 로 대체한다"
    synonyms: ["scroll API"]
    alternative_to:
      - { to: srch-search-after, reason: "서버 상태를 오래 잡는 옛 방식 대 가벼운 커서" }
  - id: srch-async-search
    kind: MECHANISM
    name: "비동기 검색"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "오래 걸리는 검색 · 집계를 제출하고 id 로 부분 결과와 완료를 나중에 받는다. 요청 타임아웃에 묶이지 않는다"
    synonyms: ["async search"]
  - id: srch-multi-search-batching
    kind: MECHANISM
    name: "다중 검색 묶음"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "여러 검색을 한 요청으로 묶어 왕복을 줄인다. 묶음 안 가장 무거운 질의가 응답 시간을 정한다"
    synonyms: ["_msearch", "multi-search"]
  - id: srch-search-timeout-partial
    kind: MECHANISM
    name: "타임아웃 · 부분 결과"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "샤드 응답에 시간 상한을 두고 늦은 샤드는 빼고 모인 결과만 돌려준다(timed_out · 실패 샤드 수 표시). 완전성보다 응답을 택한다"
    synonyms: ["timeout", "partial results", "allow_partial_search_results"]
  - id: srch-shard-local-idf-skew
    kind: PROBLEM
    name: "샤드별 IDF 편차"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "문서 수가 적거나 샤드마다 분포가 달라 같은 텀의 IDF 가 샤드별로 달라지고, 같은 문서가 어느 샤드에 있느냐로 점수가 바뀌는 상태"
  - id: srch-deep-paging-cost
    kind: PROBLEM
    name: "딥 페이징 비용"
    category: DISTRIBUTED_SYSTEM
    level: INTERMEDIATE
    description: "샤드 수 × (from + size) 만큼 모아 정렬하고 버려 깊은 페이지 요청이 메모리 · CPU 를 크게 쓰는 상태"
  - id: srch-tail-latency
    kind: PROBLEM
    name: "꼬리 지연"
    category: DISTRIBUTED_SYSTEM
    level: ADVANCED
    description: "흩뿌린 샤드 중 가장 느린 하나가 응답을 정해, 샤드가 많을수록 P99 가 평균보다 훨씬 커지는 상태"
    synonyms: ["tail latency", "fan-out amplification"]
    measured_by:
      - { to: latency-percentile, reason: "P99 가 꼬리를 드러낸다" }
  - id: srch-search-caching
    kind: STAGE
    name: "캐시 계층"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "OS 페이지 캐시 · 필터 비트셋 캐시 · 요청 결과 캐시가 층을 이룬다. 색인 파일은 mmap 이라 OS 캐시가 실질 성능을 정하고, 힙 캐시는 filter 절 · 집계만 돕는다"
    questions:
      - "검색 노드의 힙을 크게 잡을수록 빨라지지 않는 이유는 무엇인가"
    contains: [data-page-cache, srch-filter-cache, srch-request-cache, query-vector-ledger, page-cache-eviction, cache-hit-rate]
    uses: [caching]
  - id: srch-filter-cache
    kind: MECHANISM
    name: "필터 캐시"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "자주 쓰는 필터 절의 결과를 세그먼트별 비트셋으로 캐시한다. 세그먼트가 불변이라 무효화가 필요 없고, 병합되면 함께 사라진다"
    synonyms: ["query cache", "node query cache", "bitset cache"]
  - id: srch-request-cache
    kind: MECHANISM
    name: "요청 결과 캐시"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "샤드 단위로 요청 전체의 결과(주로 size 0 집계)를 캐시한다. 리프레시마다 무효화돼 자주 바뀌는 색인에서는 적중하지 않는다"
    synonyms: ["shard request cache"]
  - id: srch-latency-budgeting
    kind: STAGE
    name: "지연 예산"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "단계마다 지연 상한과 타임아웃을 나눠 적는다. 예산은 잴 수 있는 숫자(서버측 · 적중/미적중 분리)로 정의하고, 한 레그가 느려질 때 전체를 죽이지 않고 그 레그만 뺀다"
    questions:
      - "종단 지연 예산을 서버 안 계측으로 판정하면 무엇이 어긋나나"
    contains: [srch-per-stage-latency-budget, srch-bm25-fallback, latency-percentile, srch-tail-latency]
  - id: srch-per-stage-latency-budget
    kind: MECHANISM
    name: "단계별 지연 예산"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "질의 이해 · 인코딩 · 레그별 검색 · 리랭크에 각각 상한을 주고 합이 전체 예산 안에 들게 한다. 초과한 단계는 건너뛰거나 강등한다"
    synonyms: ["latency budget", "timeout budget"]
    measured_by:
      - { to: latency-percentile, reason: "단계별 P99 가 예산 안인지" }
    uses:
      - { to: obs-latency-budget, reason: "단계마다 지연 예산을 나눈다" }
  - id: srch-cluster-operations
    kind: STAGE
    name: "클러스터 운영"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "상태 색 · 디스크 · 스레드 풀을 지켜보고, 색인 수명 주기와 백업 · 복구를 돌린다. 스냅숏은 복구 훈련을 해야 백업이다"
    questions:
      - "클러스터가 yellow 일 때와 red 일 때 각각 무엇을 잃었나"
    contains: [srch-cluster-health, srch-disk-watermark, srch-hot-threads, srch-slow-log, srch-memory-circuit-breaker, srch-snapshot-restore, srch-index-lifecycle, srch-time-series-indexing, srch-update-by-query, srch-task-management, srch-disk-flood-stage, srch-thread-pool-rejection]
  - id: srch-cluster-health
    kind: MECHANISM
    name: "클러스터 상태 색"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "green(모든 샤드 할당) · yellow(레플리카 일부 미할당) · red(프라이머리 미할당 — 일부 데이터 검색 불가). 미할당 이유는 할당 설명 API 로 본다"
    synonyms: ["cluster health", "green", "yellow", "red", "allocation explain"]
  - id: srch-disk-watermark
    kind: MECHANISM
    name: "디스크 워터마크"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "디스크 사용률 세 문턱 — low(새 샤드 할당 중단) · high(샤드 이동) · flood stage(색인 읽기 전용). 문턱 전에 알림을 건다"
    synonyms: ["disk watermark", "flood_stage"]
    mitigates:
      - { to: srch-disk-flood-stage, reason: "앞 문턱에서 할당을 멈추고 샤드를 옮긴다" }
  - id: srch-hot-threads
    kind: MECHANISM
    name: "핫 스레드 진단"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "노드에서 CPU 를 가장 많이 쓰는 스레드의 스택을 표본으로 뜬다. 병합 · 특정 질의 · GC 중 무엇이 CPU 를 먹는지 가른다"
    synonyms: ["hot_threads"]
  - id: srch-slow-log
    kind: MECHANISM
    name: "슬로 로그"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "문턱을 넘은 질의 · 색인 요청을 샤드 단위로 기록한다. 끄면 느린 질의의 원본을 사후에 못 찾는다"
    synonyms: ["slow log", "search slow log"]
  - id: srch-memory-circuit-breaker
    kind: MECHANISM
    name: "메모리 서킷 브레이커"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "요청이 쓸 힙을 미리 추정해 한도를 넘으면 실행 전에 거부한다. 노드가 OOM 으로 죽는 대신 요청 하나가 실패한다"
    synonyms: ["circuit breaker", "parent breaker", "fielddata breaker"]
    mitigates:
      - { to: srch-heap-pressure, reason: "큰 집계 · fielddata 적재를 실행 전에 끊는다" }
  - id: srch-snapshot-restore
    kind: MECHANISM
    name: "스냅숏 · 복구"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "세그먼트 파일을 외부 저장소로 증분 백업하고 되살린다. 정기 스케줄 · 보관 정책(SLM)과 복구 훈련을 함께 둔다"
    synonyms: ["snapshot", "restore", "SLM"]
    contains: [srch-searchable-snapshot]
  - id: srch-searchable-snapshot
    kind: MECHANISM
    name: "검색 가능 스냅숏"
    category: INFRASTRUCTURE
    level: ADVANCED
    description: "스냅숏을 로컬에 전부 복원하지 않고 마운트해 필요한 부분만 읽으며 검색한다. 오래된 데이터를 싼 저장소에 두는 frozen 계층의 바탕이다"
    synonyms: ["searchable snapshots", "frozen tier"]
  - id: srch-index-lifecycle
    kind: MECHANISM
    name: "인덱스 수명 관리"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "나이 · 크기 조건으로 색인을 단계별로 옮긴다 — 롤오버 → 읽기 전용 · 강제 병합 → 싼 노드 → 삭제"
    synonyms: ["ILM", "ISM", "index lifecycle management"]
    contains: [srch-rollover, srch-hot-warm-cold]
  - id: srch-rollover
    kind: MECHANISM
    name: "롤오버"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "쓰기 별칭이 가리키는 색인이 크기 · 나이 · 문서 수 조건을 넘으면 새 색인을 만들고 쓰기를 넘긴다. 시계열 색인이 한없이 커지는 것을 막는다"
    synonyms: ["rollover", "write alias"]
  - id: srch-hot-warm-cold
    kind: MECHANISM
    name: "핫 · 웜 · 콜드 계층"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "새 데이터는 빠른 노드(hot), 덜 읽는 데이터는 싼 노드(warm · cold), 거의 안 읽는 것은 스냅숏(frozen)에 둔다"
    synonyms: ["hot-warm-cold", "data tiers"]
  - id: srch-time-series-indexing
    kind: MECHANISM
    name: "시계열 색인"
    category: DATA
    level: ADVANCED
    description: "추가만 되는 로그 · 지표를 시간으로 나뉜 뒷단 색인 묶음으로 다룬다. 오래된 구간은 더 거칠게 요약해 저장을 줄인다"
    synonyms: ["time series index"]
    contains: [srch-data-stream, srch-downsampling, srch-entity-transform]
  - id: srch-data-stream
    kind: MECHANISM
    name: "데이터 스트림"
    category: DATA
    level: ADVANCED
    description: "쓰기는 최신 뒷단 색인 하나로, 읽기는 전체로 가는 이름 하나. 롤오버와 수명 정책이 붙은 추가 전용 시계열 추상이다"
    synonyms: ["data stream", "TSDS"]
  - id: srch-downsampling
    kind: MECHANISM
    name: "다운샘플링"
    category: DATA
    level: ADVANCED
    description: "초 단위 지표를 오래되면 분 · 시간 단위 요약(최소 · 최대 · 합 · 개수)으로 바꿔 저장한다. 원본 해상도는 되살릴 수 없다"
    synonyms: ["downsampling", "rollup", "aggregate_metric_double"]
  - id: srch-entity-transform
    kind: MECHANISM
    name: "엔티티 피벗 변환"
    category: DATA
    level: ADVANCED
    description: "이벤트 색인을 주기적으로 집계해 엔티티별 요약 색인(사용자별 최근 30일 합계)을 만든다. 질의 때 매번 집계하지 않는 구체화 뷰다"
    synonyms: ["transform", "pivot", "materialized view"]
  - id: srch-update-by-query
    kind: MECHANISM
    name: "질의 기반 일괄 갱신 · 삭제"
    category: DATA
    level: INTERMEDIATE
    description: "질의에 맞는 문서를 스크립트로 일괄 갱신하거나 지운다. 스냅숏 위에서 돌아 도중 바뀐 문서와 충돌하고, 대량이면 비동기 작업으로 돌리고 속도를 제한한다"
    synonyms: ["_update_by_query", "_delete_by_query"]
  - id: srch-task-management
    kind: MECHANISM
    name: "장기 작업 관리"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "재색인 · 일괄 갱신 같은 오래 도는 작업을 작업 id 로 조회 · 취소한다. 폭주하는 작업을 멈추는 유일한 손잡이다"
    synonyms: ["_tasks", "task cancel"]
  - id: srch-disk-flood-stage
    kind: PROBLEM
    name: "디스크 가득 (읽기 전용 전환)"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "flood stage 문턱을 넘어 색인이 읽기 전용이 되고 색인 요청이 전부 거부되는 상태. 공간을 비운 뒤 차단을 풀어야 한다"
  - id: srch-thread-pool-rejection
    kind: PROBLEM
    name: "스레드 풀 거부"
    category: INFRASTRUCTURE
    level: INTERMEDIATE
    description: "검색 · 쓰기 대기열이 차서 요청이 429 로 거부되는 상태. 컨테이너는 살아 있어 장애로 안 보이고 벌크 일부가 조용히 빠진다"
    synonyms: ["429", "es_rejected_execution_exception"]

  # ─────────────────────────── 용어 사전 ───────────────────────────
  - id: search-glossary
    kind: TERM
    name: "검색 용어 사전"
    category: BASICS
    level: BEGINNER
    description: "검색 계층을 읽는 데 필요한 말. 단계·장치가 아니라 그것을 설명하는 용어를 모은다. 용어는 쓰이는 장치에서 USES 로 잇는다"
    synonyms: ["glossary", "용어집"]
    contains: [srch-two-time-axes, srch-search-workload-types, glossary-scoring, glossary-index, glossary-morphology, glossary-vector, glossary-learning, srch-geohash]
  - id: srch-two-time-axes
    kind: TERM
    name: "색인 타임 · 질의 타임"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "검색의 거의 모든 설계 결정은 「이 일을 색인 때 하나, 질의 때 하나」로 환원된다. 색인 때 하면 한 번 계산해 여러 번 쓰고, 질의 때 하면 최신이지만 매 요청이 값을 치른다(동의어 · 임베딩 · 점수 피처 · 필터 값)"
    synonyms: ["index time vs query time"]
  - id: srch-search-workload-types
    kind: TERM
    name: "검색 · 조회 · 분석 워크로드"
    category: ARCHITECTURE
    level: BEGINNER
    description: "관련도 순위가 필요한 검색, 키로 정확히 찾는 조회, 전체를 훑어 집계하는 분석은 맞는 저장소가 다르다. 검색 엔진은 첫째에 최적화돼 있다"
  - id: srch-geohash
    kind: TERM
    name: "지오해시"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "위경도를 격자 칸으로 나눠 문자열로 부호화한 것. 앞자리가 같으면 가까운 칸이라 접두 길이가 곧 격자 크기다"
    synonyms: ["geohash", "geotile", "H3"]
  - id: glossary-scoring
    kind: TERM
    name: "점수 용어"
    category: BASICS
    level: BEGINNER
    description: "텍스트 관련도 점수를 읽는 말"
    contains: [srch-relevance-score, srch-term-frequency, srch-inverse-document-frequency]
  - id: srch-relevance-score
    kind: TERM
    name: "관련도 점수 (_score)"
    category: BASICS
    level: BEGINNER
    description: "질의와 문서가 얼마나 맞는지의 상대값. 같은 질의 안에서만 비교할 수 있고, 질의가 다르면 절대값에 뜻이 없다"
    synonyms: ["_score", "relevance score"]
  - id: srch-term-frequency
    kind: TERM
    name: "텀 빈도 (TF)"
    category: BASICS
    level: BEGINNER
    description: "한 문서에 그 텀이 나온 횟수. 많을수록 그 문서가 그 말에 관한 것일 가능성이 크지만 BM25 는 곧 포화시킨다"
    synonyms: ["TF", "term frequency"]
  - id: srch-inverse-document-frequency
    kind: TERM
    name: "역문서 빈도 (IDF)"
    category: BASICS
    level: BEGINNER
    description: "그 텀이 든 문서가 적을수록 커지는 값(log(N / df) 계열). 흔한 말의 몫을 깎고 희귀어를 올린다. 문서 빈도(df)는 샤드 안 통계다"
    synonyms: ["IDF", "document frequency", "df"]
  - id: glossary-index
    kind: TERM
    name: "색인 용어"
    category: BASICS
    level: BEGINNER
    description: "색인 내부 구조를 읽는 말"
    contains: [srch-doc-id, srch-near-real-time, srch-meta-fields]
  - id: srch-doc-id
    kind: TERM
    name: "내부 문서 번호 (doc id)"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "세그먼트 안에서만 유효한 0 부터의 정수 번호. 포스팅 · doc values 가 이 번호로 이어지고, 병합되면 바뀐다. 외부 _id 와 다르다"
    synonyms: ["doc id", "Lucene docID"]
  - id: srch-near-real-time
    kind: TERM
    name: "준실시간 (NRT)"
    category: BASICS
    level: INTERMEDIATE
    description: "쓴 문서가 즉시가 아니라 다음 리프레시(기본 1초) 뒤에 검색된다는 성질. 검색 엔진은 쓰기 직후 읽기를 보장하지 않는다"
    synonyms: ["NRT", "near real-time"]
  - id: srch-meta-fields
    kind: TERM
    name: "메타 필드"
    category: DATA
    level: INTERMEDIATE
    description: "엔진이 문서마다 붙이는 시스템 필드 — _id · _source · _index · _routing · _version. 원문(_source)을 끄면 재색인 · 부분 갱신이 불가능해진다"
    synonyms: ["_id", "_source", "_routing", "_version"]
  - id: glossary-morphology
    kind: TERM
    name: "형태소 분석 용어"
    category: BASICS
    level: BEGINNER
    description: "한국어 형태소 분석기(nori · MeCab 계열)가 단어를 자르는 원리와 사전 형식의 말"
    contains: [morpheme, surface-form, pos-tag, lattice, word-cost, connection-cost, context-id]
  - id: morpheme
    kind: TERM
    name: "형태소"
    category: BASICS
    level: BEGINNER
    description: "뜻을 가진 가장 작은 단위. 「먹었다」= 먹 + 었 + 다. 형태소 분석은 문장을 이 단위와 품사로 가른다"
  - id: surface-form
    kind: TERM
    name: "표층형"
    category: BASICS
    level: BEGINNER
    description: "문장에 실제로 나타난 글자열. 사전은 표층형으로 찾고, 활용형은 기본형과 다를 수 있다. 사용자 사전 항목은 표층형이 맞을 때만 걸린다"
    synonyms: ["surface form"]
  - id: pos-tag
    kind: TERM
    name: "품사 태그"
    category: DATA
    level: BEGINNER
    description: "한국어 분석기는 세종 품사 체계를 쓴다 — NNG 일반명사 · NNP 고유명사 · NR 수사 · MAG 일반부사 · VV 동사 … 품사 필터와 동의어 규칙이 이 태그를 본다. 같은 글자도 문맥 비용에 따라 다른 태그를 받는다"
    synonyms: ["POS tag", "세종 품사"]
  - id: lattice
    kind: TERM
    name: "격자"
    category: DATA_STRUCTURE
    level: INTERMEDIATE
    description: "글자 경계마다 노드를 두고 사전에 있는 후보 단어를 간선으로 깐 그래프. 형태소 분석의 탐색 공간이고, 사전에 없는 단어는 간선 자체가 없다"
    synonyms: ["lattice"]
    flows_to: [word-cost]
  - id: word-cost
    kind: TERM
    name: "단어 비용"
    category: DATA
    level: INTERMEDIATE
    description: "사전 항목마다 붙은 비용. 낮을수록 그 분해를 선호한다. 사용자 사전 항목은 −100000 으로 고정돼 경쟁 없이 이긴다"
    flows_to: [connection-cost]
  - id: connection-cost
    kind: TERM
    name: "연접 비용"
    category: DATA
    level: INTERMEDIATE
    description: "앞 단어의 우 문맥 ID 와 뒤 단어의 좌 문맥 ID 로 행렬(matrix.def)에서 찾는 이음 비용. 「명사 뒤에 조사」 같은 품사 연쇄의 자연스러움을 값으로 갖는다"
    synonyms: ["matrix.def"]
  - id: context-id
    kind: TERM
    name: "문맥 ID"
    category: DATA
    level: INTERMEDIATE
    description: "사전 항목의 좌·우 문맥 ID. 품사 계열과 받침 유무로 정해지며(left-id.def · right-id.def) 연접 비용표의 행·열 키다"
    synonyms: ["left-id · right-id"]
  - id: glossary-vector
    kind: TERM
    name: "벡터 검색 용어"
    category: BASICS
    level: BEGINNER
    description: "임베딩과 근사 최근접 탐색의 말"
    contains: [srch-embedding-vector, srch-vector-dimension, cosine-similarity, srch-dot-product, srch-euclidean-distance, srch-hamming-distance, srch-codebook]
  - id: srch-embedding-vector
    kind: TERM
    name: "임베딩"
    category: BASICS
    level: BEGINNER
    description: "텍스트 · 이미지를 뜻이 가까우면 가깝게 놓이도록 만든 고정 길이 실수 벡터. 같은 모델로 만든 벡터끼리만 비교할 수 있다"
    synonyms: ["embedding", "dense vector"]
  - id: srch-vector-dimension
    kind: TERM
    name: "차원"
    category: BASICS
    level: BEGINNER
    description: "벡터의 실수 개수(384 · 640 · 1024 …). 모델이 정하고, 상주 메모리와 거리 계산 비용이 이것에 비례한다"
    synonyms: ["dimension", "dims"]
  - id: cosine-similarity
    kind: TERM
    name: "코사인 유사도"
    category: ALGORITHM
    level: BEGINNER
    description: "두 벡터의 각도로 재는 유사도(내적 ÷ 크기의 곱). 정규화된 벡터에선 내적과 같다. 텍스트 벡터 검색의 기본 거리"
    synonyms: ["cosine", "cosinesimil"]
  - id: srch-dot-product
    kind: TERM
    name: "내적"
    category: ALGORITHM
    level: BEGINNER
    description: "좌표끼리 곱해 더한 값. 벡터 길이가 뜻(인기 · 확신)을 담을 때 쓰고(MIPS), 정규화된 벡터에서는 코사인과 같다"
    synonyms: ["dot product", "inner product", "MIPS"]
  - id: srch-euclidean-distance
    kind: TERM
    name: "유클리드 거리 (L2)"
    category: ALGORITHM
    level: BEGINNER
    description: "좌표 차이 제곱합의 제곱근. 좌표 · 이미지 특징처럼 절대 위치가 뜻인 벡터에 쓴다. 색인과 질의가 같은 척도여야 한다"
    synonyms: ["L2 distance", "euclidean"]
  - id: srch-hamming-distance
    kind: TERM
    name: "해밍 거리"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "두 비트열에서 다른 비트의 개수. XOR 뒤 popcount 한 번이라 매우 싸고, 이진 양자화 벡터의 근사 거리로 쓴다"
    synonyms: ["Hamming distance", "popcount"]
  - id: srch-codebook
    kind: TERM
    name: "코드북"
    category: DATA_STRUCTURE
    level: ADVANCED
    description: "양자화에서 쓰는 대표 벡터(중심점) 목록. 벡터 조각을 가장 가까운 중심점 번호로 바꾸고, 거리는 중심점 사이 거리표로 근사한다"
    synonyms: ["codebook", "centroids"]
  - id: glossary-learning
    kind: TERM
    name: "학습 · 평가 용어"
    category: BASICS
    level: BEGINNER
    description: "랭킹 학습 · 온라인 학습 · 오프폴리시 평가의 말"
    contains: [ltr-loss-families, exploration-exploitation, beta-bernoulli-conjugate, srch-bayesian-update, srch-bandit-arm, srch-propensity-score, judgment-set, graded-relevance, ranking-features, srch-eval-2x2]
  - id: ltr-loss-families
    kind: TERM
    name: "랭킹 손실 세 갈래"
    category: ALGORITHM
    level: ADVANCED
    description: "포인트와이즈(문서 하나의 점수) · 페어와이즈(두 문서의 순서) · 리스트와이즈(목록 전체 지표). LambdaMART 는 nDCG 변화량을 그래디언트에 넣는 리스트와이즈 계열"
    synonyms: ["listwise", "pairwise", "pointwise"]
  - id: exploration-exploitation
    kind: TERM
    name: "탐색 · 활용"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "확실히 좋은 팔을 쓰는 것(활용)과 불확실한 팔을 시험하는 것(탐색)의 균형. 탐색이 0 이면 새 후보는 영영 못 올라온다"
    synonyms: ["explore-exploit"]
  - id: beta-bernoulli-conjugate
    kind: TERM
    name: "베타-베르누이 켤레"
    category: ALGORITHM
    level: ADVANCED
    description: "클릭/노출 같은 성공·실패 관측에 베타 분포 사전을 두면 사후도 베타 분포다(α = 클릭 + α₀, β = 비클릭 + β₀). Thompson Sampling 이 팔마다 여기서 표본을 뽑아 순서를 정한다"
    synonyms: ["Beta-Bernoulli"]
  - id: srch-bayesian-update
    kind: TERM
    name: "베이즈 갱신"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "사전 믿음에 관측의 가능도를 곱해 사후 믿음을 얻는다. 관측이 쌓일수록 사전의 몫이 줄어든다"
    synonyms: ["Bayesian update", "posterior"]
  - id: srch-bandit-arm
    kind: TERM
    name: "팔 (arm)"
    category: ALGORITHM
    level: INTERMEDIATE
    description: "밴딧이 고르는 선택지 하나(노출 후보 · 변형). 팔을 무엇으로 묶느냐(상품 · 카테고리 × 상품)가 데이터 희소성을 정한다"
    synonyms: ["arm"]
  - id: srch-propensity-score
    kind: TERM
    name: "성향 (노출 확률)"
    category: ALGORITHM
    level: ADVANCED
    description: "로그 정책이 그 문서를 그 위치에 보여 줄 확률, 또는 사용자가 그 위치를 볼 확률. 역수가 IPS 가중치다"
    synonyms: ["propensity", "examination probability"]
  # 산출물(정답지)은 TERM, 만드는 활동은 judgment-set-building(STAGE)
  - id: judgment-set
    kind: TERM
    name: "판정 세트"
    category: TESTING
    level: INTERMEDIATE
    description: "쿼리마다 어떤 문서가 얼마나 맞는지 적은 정답지"
    synonyms: ["judgment list", "qrels"]
  - id: graded-relevance
    kind: TERM
    name: "등급 척도"
    category: TESTING
    level: INTERMEDIATE
    description: "0–3 등급으로 매긴다. 이진 척도와 교차 확인한다"
  - id: srch-eval-2x2
    kind: TERM
    name: "평가 2×2 (단계 × 환경)"
    category: TESTING
    level: INTERMEDIATE
    description: "무엇을 재나(후보 생성 · 랭킹)와 어디서 재나(오프라인 · 온라인)의 네 칸. nDCG 는 오프라인 전용이 아니고, 후보 단계는 재현율로 잰다"
  - id: ranking-features
    kind: TERM
    name: "랭킹 피처"
    category: DATA
    level: INTERMEDIATE
    description: "리랭커가 보는 값 — 융합 점수 · 제목 일치 · 의도 일치 · 문서 완성도. 학습 피처와 서빙 피처가 같아야 한다. 서빙에서 못 얻는 값은 학습에서도 뺀다"
    contains: [srch-query-doc-features, srch-static-doc-features, srch-behavioral-features, srch-contextual-features]
  - id: srch-query-doc-features
    kind: TERM
    name: "질의-문서 일치 피처"
    category: DATA
    level: INTERMEDIATE
    description: "BM25 점수 · 필드별 일치 · 구문 근접도 · 벡터 유사도. 앞 단계에서 쓴 값을 다시 쓰면 편향이 겹친다"
  - id: srch-static-doc-features
    kind: TERM
    name: "문서 정적 피처"
    category: DATA
    level: INTERMEDIATE
    description: "인기 · 평점 · 신선도 · 품질 · 완성도처럼 질의와 무관한 문서 값. 색인 때 넣는다"
  - id: srch-behavioral-features
    kind: TERM
    name: "행동 피처"
    category: DATA
    level: INTERMEDIATE
    description: "노출 대비 클릭률 · 체류 · 전환. 위에 있어서 눌린 것을 품질로 오인하지 않게 위치 편향을 보정해 쓴다"
  - id: srch-contextual-features
    kind: TERM
    name: "문맥 피처"
    category: DATA
    level: INTERMEDIATE
    description: "기기 · 시간 · 지역 · 세션 이력처럼 요청마다 달라지는 값. 개인 식별과 선을 어디 긋는지가 정책 문제다"
