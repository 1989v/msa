# 소프트웨어 아키텍처 온톨로지 — 원본은 이 파일이다 (ADR-0100, docs/specs/2026-09-24-concept-atlas).
# 바꾸면 manifest.yaml 의 revision 을 올린다. 간선은 from 개념에만 적는다.
domain: architecture
root: arch-software-architecture
concepts:
  - id: arch-software-architecture
    kind: DOMAIN
    name: "소프트웨어 아키텍처"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "요구와 품질 속성을 정하고, 도메인 경계를 긋고, 배포 단위와 통합 방식을 고르고, 서비스 안의 계층과 객체 협력을 설계하는 일이다. 원칙 → 객체 → 계층 → 경계 → 분해 → 통합 → 시스템 설계 → 결정 기록 순으로 넓혀 읽는다"
    synonyms: ["software architecture"]
    contains: [arch-design-principles, arch-object-design, arch-enterprise-patterns, arch-layer-design, arch-boundary-design, arch-system-decomposition, arch-integration-design, arch-system-design, arch-architecture-governance, arch-glossary]

  # ── 설계 원칙 ─────────────────────────────────────────────
  - id: arch-design-principles
    kind: STAGE
    name: "설계 원칙 적용"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "클래스·패키지·모듈의 책임과 의존을 나눌 때 기준이 되는 원칙을 고른다. 원칙은 서로 부딪치므로(DRY 대 잘못된 추상화) 언제 멈출지까지 함께 정한다"
    questions: ["DRY 를 지키려다 오히려 결합이 늘어나는 경우는 언제인가", "SOLID 다섯 원칙 중 의존성 역전이 클린 아키텍처의 뼈대인 이유는 무엇인가"]
    contains: [arch-solid, arch-dry, arch-kiss, arch-yagni, arch-rule-of-three, arch-law-of-demeter, arch-composition-over-inheritance, arch-separation-of-concerns, arch-tell-dont-ask, arch-cqs, arch-grasp, arch-package-principles, arch-god-class, arch-shotgun-surgery, arch-wrong-abstraction, arch-afferent-coupling, arch-efferent-coupling, arch-instability, arch-abstractness, arch-main-sequence-distance, arch-lcom, arch-cyclomatic-complexity]
    flows_to: [arch-object-design]
    measured_by: [arch-coupling, arch-cohesion]
  - id: arch-solid
    kind: MECHANISM
    name: "SOLID"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "단일 책임·개방 폐쇄·리스코프 치환·인터페이스 분리·의존성 역전 다섯 원칙의 묶음이다. 변경 이유를 한 곳에 모으고 구체 구현 대신 추상에 기대게 한다"
    synonyms: ["SOLID principles"]
    questions: ["SOLID 의 다섯 글자가 각각 막으려는 변경 비용은 무엇인가"]
    contains: [arch-srp, arch-ocp, arch-lsp, arch-isp, arch-dip]
    affects: [arch-coupling, arch-cohesion]
  - id: arch-srp
    kind: MECHANISM
    name: "단일 책임 원칙"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "모듈은 한 액터(변경을 요구하는 한 집단)에 대해서만 책임진다. 변경 이유가 둘인 클래스는 둘로 나눈다"
    synonyms: ["SRP", "Single Responsibility Principle"]
    mitigates: [arch-god-class]
    affects: [arch-cohesion]
  - id: arch-ocp
    kind: MECHANISM
    name: "개방 폐쇄 원칙"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "기존 코드를 고치지 않고 새 구현을 더해 동작을 넓힐 수 있게 한다. 바뀌는 지점을 인터페이스 뒤로 숨기고 다형성으로 확장한다"
    synonyms: ["OCP", "Open-Closed Principle"]
    uses: [polymorphism, abstraction, strategy-pattern]
    mitigates: [arch-shotgun-surgery]
  - id: arch-lsp
    kind: MECHANISM
    name: "리스코프 치환 원칙"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "하위 타입은 상위 타입의 계약(사전 조건·사후 조건·불변식)을 깨지 않고 그 자리를 대신할 수 있어야 한다. 정사각형이 직사각형을 상속하면 깨지는 원칙이다"
    synonyms: ["LSP", "Liskov Substitution Principle"]
    uses: [inheritance]
    mitigates: [lang-fragile-base-class]
  - id: arch-isp
    kind: MECHANISM
    name: "인터페이스 분리 원칙"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "클라이언트가 쓰지 않는 메서드에 의존하지 않도록 큰 인터페이스를 역할별로 나눈다. 이 레포가 유스케이스마다 인터페이스를 따로 두는 것이 그 적용이다"
    synonyms: ["ISP", "Interface Segregation Principle"]
    uses: [interface]
    affects: [arch-coupling]
  - id: arch-dip
    kind: MECHANISM
    name: "의존성 역전 원칙"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "상위 정책이 하위 구현에 의존하지 않고 둘 다 추상에 의존한다. 추상(포트)은 상위 정책 쪽에 두어 소스 의존 방향을 제어 흐름과 반대로 뒤집는다"
    synonyms: ["DIP", "Dependency Inversion Principle"]
    questions: ["포트 인터페이스를 infrastructure 가 아니라 application 에 두는 이유는 무엇인가"]
    uses: [arch-dependency-rule, interface, arch-outbound-port]
    mitigates: [arch-framework-coupling]
  - id: arch-dry
    kind: MECHANISM
    name: "DRY"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "같은 지식(업무 규칙)은 시스템 안에 한 곳에만 둔다. 겉모양이 비슷할 뿐인 코드를 합치는 것은 DRY 가 아니며, 그렇게 합치면 잘못된 추상화가 생긴다"
    synonyms: ["Don't Repeat Yourself"]
    causes:
      - { to: arch-wrong-abstraction, reason: "지식이 아니라 모양이 같은 코드를 합치면 변경 이유가 다른 둘이 한 추상에 묶인다" }
  - id: arch-kiss
    kind: MECHANISM
    name: "KISS"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "동작하는 가장 단순한 구조를 먼저 고른다. 복잡한 구조는 측정된 필요가 생겼을 때 들인다"
    synonyms: ["Keep It Simple, Stupid"]
    mitigates: [arch-wrong-abstraction]
  - id: arch-yagni
    kind: MECHANISM
    name: "YAGNI"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "지금 요구에 없는 기능·설정·확장 지점을 미리 만들지 않는다. 구현이 하나뿐인 인터페이스와 쓰지 않는 팩토리가 대표적인 위반이다"
    synonyms: ["You Aren't Gonna Need It"]
    alternative_to:
      - { to: arch-ocp, reason: "확장 지점을 미리 여느냐, 변경이 실제로 올 때 여느냐의 긴장" }
    mitigates: [arch-wrong-abstraction]
  - id: arch-rule-of-three
    kind: MECHANISM
    name: "세 번의 법칙"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "같은 코드가 세 번째로 나올 때 추상화한다. 두 번까지는 중복을 참아 공통점과 차이점이 드러날 때까지 기다린다"
    synonyms: ["Rule of Three"]
    mitigates: [arch-wrong-abstraction]
  - id: arch-law-of-demeter
    kind: MECHANISM
    name: "디미터 법칙"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "객체는 직접 아는 협력자에게만 말한다. a.b().c().d() 처럼 남의 내부 구조를 따라 들어가는 호출 사슬을 만들지 않는다"
    synonyms: ["Law of Demeter", "LoD", "최소 지식 원칙"]
    uses: [encapsulation]
    affects: [arch-coupling]
  - id: arch-composition-over-inheritance
    kind: MECHANISM
    name: "상속보다 조합"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "기능을 상속 계층으로 넓히지 않고 작은 객체를 품어 위임한다. 상위 클래스 변경이 하위를 깨뜨리는 문제를 피하고 런타임에 부품을 바꿀 수 있다"
    synonyms: ["composition over inheritance"]
    uses: [delegation]
    alternative_to:
      - { to: inheritance, reason: "같은 재사용을 is-a 대신 has-a 로 푼다" }
    mitigates: [lang-fragile-base-class, arch-class-explosion]
  - id: arch-separation-of-concerns
    kind: MECHANISM
    name: "관심사 분리"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "서로 다른 이유로 바뀌는 코드(업무 규칙·저장·표현)를 서로 다른 단위에 둔다. 계층 구조와 모듈 경계가 모두 이 원칙의 적용이다"
    synonyms: ["SoC", "Separation of Concerns"]
    affects: [arch-cohesion]
  - id: arch-tell-dont-ask
    kind: MECHANISM
    name: "묻지 말고 시켜라"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "객체의 상태를 꺼내 밖에서 판단하지 않고, 판단까지 그 객체에게 시킨다. 규칙이 데이터 옆에 모여 풍부한 도메인 모델이 된다"
    synonyms: ["Tell, Don't Ask"]
    uses: [encapsulation]
    mitigates: [arch-anemic-domain-model]
  - id: arch-cqs
    kind: MECHANISM
    name: "명령-조회 분리"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "메서드는 상태를 바꾸는 명령이거나 값을 돌려주는 조회 둘 중 하나만 한다. 이 원칙을 모델·저장소 수준으로 넓힌 것이 CQRS 다"
    synonyms: ["CQS", "Command-Query Separation"]
  - id: arch-grasp
    kind: MECHANISM
    name: "GRASP"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "정보 전문가·생성자·낮은 결합·높은 응집·컨트롤러·다형성·순수 가공물·간접·변화 보호 아홉 가지로 책임을 어느 객체에 줄지 정하는 지침이다"
    synonyms: ["General Responsibility Assignment Software Patterns", "정보 전문가"]
    affects: [arch-coupling, arch-cohesion]
  - id: arch-package-principles
    kind: MECHANISM
    name: "패키지·컴포넌트 원칙"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "클래스를 어떤 모듈로 묶을지(응집 원칙 셋)와 모듈 사이 의존을 어떻게 둘지(결합 원칙 셋)를 정하는 원칙이다"
    synonyms: ["component principles", "package principles"]
    contains: [arch-reuse-release-equivalence, arch-common-closure, arch-common-reuse, arch-acyclic-dependencies, arch-stable-dependencies, arch-stable-abstractions]
  - id: arch-reuse-release-equivalence
    kind: MECHANISM
    name: "재사용·릴리스 등가 원칙"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "재사용 단위는 릴리스 단위와 같다. 함께 재사용되는 클래스는 한 버전 번호로 함께 릴리스한다"
    synonyms: ["REP", "Reuse/Release Equivalence Principle"]
  - id: arch-common-closure
    kind: MECHANISM
    name: "공통 폐쇄 원칙"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "같은 이유로 같은 시점에 바뀌는 클래스를 한 모듈에 모은다. 모듈 수준의 단일 책임 원칙이다"
    synonyms: ["CCP", "Common Closure Principle"]
    affects: [arch-cohesion]
  - id: arch-common-reuse
    kind: MECHANISM
    name: "공통 재사용 원칙"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "함께 쓰이지 않는 클래스를 한 모듈에 두지 않는다. 쓰지 않는 클래스 때문에 재배포·재컴파일되는 일을 막는다. 모듈 수준의 인터페이스 분리 원칙이다"
    synonyms: ["CRP", "Common Reuse Principle"]
  - id: arch-acyclic-dependencies
    kind: MECHANISM
    name: "비순환 의존 원칙"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "모듈 의존 그래프에 순환이 없어야 한다. 순환이 생기면 인터페이스를 끼워 의존성 역전으로 끊거나 공통 부분을 새 모듈로 뺀다"
    synonyms: ["ADP", "Acyclic Dependencies Principle"]
    mitigates: [cs-dependency-cycle]
  - id: arch-stable-dependencies
    kind: MECHANISM
    name: "안정 의존 원칙"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "의존은 더 안정된(바꾸기 어려운) 모듈 쪽으로 향한다. 자주 바뀌는 모듈에 많은 모듈이 기대면 한 변경이 넓게 번진다"
    synonyms: ["SDP", "Stable Dependencies Principle"]
    measured_by: [arch-instability]
  - id: arch-stable-abstractions
    kind: MECHANISM
    name: "안정 추상 원칙"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "안정된 모듈일수록 추상적이어야 확장이 막히지 않는다. 안정도와 추상도의 균형은 주계열 거리로 잰다"
    synonyms: ["SAP", "Stable Abstractions Principle"]
    measured_by: [arch-abstractness, arch-main-sequence-distance]
  - id: arch-god-class
    kind: PROBLEM
    name: "갓 클래스"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "한 클래스가 여러 액터의 규칙과 상태를 몰아 갖는 상태. 어느 변경이든 이 클래스를 건드리고 테스트가 거대해진다"
    synonyms: ["God Object", "God Class", "blob"]
    measured_by: [arch-lcom]
  - id: arch-shotgun-surgery
    kind: PROBLEM
    name: "산탄총 수술"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "변경 하나를 하려면 여러 모듈을 조금씩 함께 고쳐야 하는 상태. 한 지식이 여러 곳에 흩어졌다는 신호다"
    synonyms: ["shotgun surgery"]
    measured_by: [arch-coupling]
  - id: arch-wrong-abstraction
    kind: PROBLEM
    name: "잘못된 추상화"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "변경 이유가 다른 코드를 성급히 하나로 묶어, 이후 요구마다 분기와 매개변수가 늘어나는 상태. 중복보다 되돌리기 비싸다"
    synonyms: ["wrong abstraction", "premature abstraction"]
  - id: arch-afferent-coupling
    kind: METRIC
    name: "구심 결합도"
    category: ARCHITECTURE
    level: ADVANCED
    description: "이 모듈에 의존하는 바깥 모듈의 수. 높을수록 이 모듈을 바꿀 때 영향받는 곳이 많다"
    synonyms: ["Ca", "afferent coupling", "fan-in"]
  - id: arch-efferent-coupling
    kind: METRIC
    name: "원심 결합도"
    category: ARCHITECTURE
    level: ADVANCED
    description: "이 모듈이 의존하는 바깥 모듈의 수. 높을수록 남의 변경에 흔들린다"
    synonyms: ["Ce", "efferent coupling", "fan-out"]
  - id: arch-instability
    kind: METRIC
    name: "불안정도"
    category: ARCHITECTURE
    level: ADVANCED
    description: "I = Ce / (Ca + Ce). 0 이면 남들이 기대기만 하는 안정 모듈, 1 이면 남에게 기대기만 하는 불안정 모듈이다"
    synonyms: ["instability", "I"]
  - id: arch-abstractness
    kind: METRIC
    name: "추상도"
    category: ARCHITECTURE
    level: ADVANCED
    description: "모듈 안 타입 중 인터페이스·추상 클래스의 비율(A). 안정도와 함께 모듈의 위치를 정한다"
    synonyms: ["abstractness", "A"]
  - id: arch-main-sequence-distance
    kind: METRIC
    name: "주계열 거리"
    category: ARCHITECTURE
    level: ADVANCED
    description: "D = |A + I - 1|. 0 에 가까울수록 안정도와 추상도가 균형을 이룬다. 안정하면서 구체적이면 고통의 영역, 불안정하면서 추상적이면 쓸모없는 영역이다"
    synonyms: ["distance from the main sequence", "D"]
  - id: arch-lcom
    kind: METRIC
    name: "LCOM"
    category: ARCHITECTURE
    level: ADVANCED
    description: "클래스의 메서드들이 같은 필드를 얼마나 공유하지 않는지 세는 응집 결여 지표. 높으면 클래스가 여러 책임으로 쪼개질 수 있다"
    synonyms: ["Lack of Cohesion in Methods"]
  - id: arch-cyclomatic-complexity
    kind: METRIC
    name: "순환 복잡도"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "코드의 독립 실행 경로 수(분기 수 + 1). 테스트가 덮어야 할 경로 수의 하한이고 유지보수성의 대리 지표다"
    synonyms: ["cyclomatic complexity", "McCabe"]

  # ── 객체 설계 (GoF) ───────────────────────────────────────
  - id: arch-object-design
    kind: STAGE
    name: "객체 설계"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "계층 안에서 객체를 어떻게 만들고, 어떻게 조합하고, 책임을 어떻게 나눌지 정한다. GoF 디자인 패턴 23개는 생성·구조·행위 세 질문에 대한 이름 붙은 답이다"
    synonyms: ["GoF design patterns", "디자인 패턴"]
    questions: ["GoF 패턴을 생성·구조·행위로 나누는 기준은 무엇인가"]
    contains: [arch-creational-design, arch-structural-design, arch-behavioral-design]
    flows_to: [arch-enterprise-patterns]
    measured_by: [arch-cohesion]
  - id: arch-creational-design
    kind: STAGE
    name: "객체 생성 설계"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "생성 규칙과 구체 타입 선택을 호출부에서 떼어 낸다. 생성자에 검증·기본값이 몰리거나 구현체를 바꿔 끼워야 할 때 쓴다"
    contains: [factory-pattern, abstract-factory, builder-pattern, prototype-pattern, singleton-pattern]
    flows_to: [arch-structural-design]
  - id: factory-pattern
    kind: MECHANISM
    name: "팩토리 메서드 패턴"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "객체 생성을 이름 있는 생성 함수나 하위 클래스가 재정의하는 생성 메서드에 맡긴다. 생성자를 숨기고 create·restore 처럼 목적별 진입점을 두면 잘못된 초기 상태를 만들 수 없다"
    synonyms: ["factory method", "정적 팩토리 메서드", "팩토리 패턴"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/model/Inventory.kt, symbol: "fun create(productId: Long, warehouseId: Long, initialQty: Int): Inventory {", note: "private 생성자 + 동반 객체의 생성 함수" }
      - { path: common/src/main/kotlin/com/kgd/common/webclient/WebClientBuilderFactory.kt, symbol: "fun create(baseUrl: String): WebClient =", note: "공통 정책이 적용된 WebClient 를 찍어 내는 팩토리" }
    uses: [companion-object]
  - id: abstract-factory
    kind: MECHANISM
    name: "추상 팩토리"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "서로 어울려야 하는 객체 묶음(예: 같은 테마의 버튼·창)을 만드는 인터페이스를 두고, 구현 팩토리를 바꿔 묶음 전체를 교체한다"
    synonyms: ["abstract factory"]
    uses: [factory-pattern]
  - id: builder-pattern
    kind: MECHANISM
    name: "빌더 패턴"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "선택 인자가 많은 객체를 단계별 설정 후 build() 로 만든다. Kotlin 에서는 이름 있는 인자와 기본값이 많은 경우를 대신하고, 외부 라이브러리 빌더를 다룰 때 주로 만난다"
    synonyms: ["builder"]
    code:
      - { path: common/src/main/kotlin/com/kgd/common/webclient/WebClientBuilderFactory.kt, symbol: "fun builder(baseUrl: String? = null): WebClient.Builder {", note: "원본 빌더를 복제해 서비스별 설정을 이어 붙인다" }
    uses: [scope-function]
  - id: prototype-pattern
    kind: MECHANISM
    name: "프로토타입 패턴"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "기존 객체를 복제해 새 객체를 만든다. 생성 비용이 크거나 구체 타입을 몰라도 복사본이 필요할 때 쓰며, Kotlin 의 data class copy 가 불변 객체용 프로토타입 역할을 한다"
    synonyms: ["prototype", "clone"]
    code:
      - { path: recommendation/feature/src/main/kotlin/com/kgd/recommendation/application/recommendation/service/PersonalizedService.kt, symbol: "rec.copy(items = rec.items.map", note: "추천 결과를 복제하며 출처 표기만 바꾼다" }
    uses: [data-class]
  - id: singleton-pattern
    kind: MECHANISM
    name: "싱글톤 패턴"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "인스턴스를 하나만 두고 전역에서 같은 것을 쓴다. Kotlin 은 object 선언으로 언어가 보장하고, Spring 빈도 기본 스코프가 싱글톤이다. 가변 상태를 두면 동시성 문제가 된다"
    synonyms: ["singleton"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/service/WarehouseSelector.kt, symbol: "object WarehouseSelector {", note: "상태 없는 도메인 정책을 object 로 둔다" }
  - id: arch-structural-design
    kind: STAGE
    name: "구조 조합 설계"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "이미 있는 객체를 감싸거나 이어 붙여 인터페이스를 맞추고 기능을 더한다. 원본을 고치지 않고 바깥에서 조합한다"
    contains: [adapter-pattern, bridge-pattern, composite-pattern, decorator-pattern, facade-pattern, flyweight-pattern, proxy-pattern, arch-class-explosion]
    flows_to: [arch-behavioral-design]
  - id: adapter-pattern
    kind: MECHANISM
    name: "어댑터 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "호환되지 않는 인터페이스를 가운데서 변환해 함께 쓰게 한다. 포트-어댑터 구조의 어댑터가 이 패턴으로 JPA·외부 API 를 포트 모양에 맞춘다"
    synonyms: ["adapter", "wrapper"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/persistence/inventory/adapter/InventoryRepositoryAdapter.kt, symbol: "class InventoryRepositoryAdapter(", note: "JPA 리포지토리를 도메인 포트 모양으로 바꾼다" }
  - id: bridge-pattern
    kind: MECHANISM
    name: "브리지 패턴"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "추상(무엇을 하나)과 구현(어떻게 하나)을 별도 계층으로 나누고 추상이 구현을 참조로 품는다. 두 축이 따로 늘어날 때 상속 조합 폭발을 막는다"
    synonyms: ["bridge"]
    mitigates: [arch-class-explosion]
  - id: composite-pattern
    kind: MECHANISM
    name: "컴포지트 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "개별 객체와 객체 묶음을 같은 인터페이스로 다뤄 트리 구조를 재귀적으로 처리한다. 카테고리 트리·메뉴·조건식 트리가 전형이다"
    synonyms: ["composite", "part-whole hierarchy"]
    uses: [recursion]
  - id: decorator-pattern
    kind: MECHANISM
    name: "데코레이터 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "같은 인터페이스를 구현하면서 원본을 안에 품고 앞뒤에 기능을 덧붙인다. 상속 없이 기능을 겹겹이 쌓을 수 있다"
    synonyms: ["decorator", "wrapper"]
    code:
      - { path: quant/feature/src/main/kotlin/com/kgd/quant/infrastructure/chart/PriceStreamRedisFanout.kt, symbol: ") : PriceStreamPort by store {", note: "인메모리 스트림을 감싸 Redis 팬아웃을 덧붙이고 나머지는 위임한다" }
    uses: [delegation]
    alternative_to: [proxy-pattern]
    mitigates: [arch-class-explosion]
  - id: facade-pattern
    kind: MECHANISM
    name: "퍼사드 패턴"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "복잡한 하위 시스템 앞에 단순한 진입 인터페이스 하나를 둔다. 호출자는 내부 협력 순서를 몰라도 되고, 하위 시스템을 바꿔도 호출자가 흔들리지 않는다"
    synonyms: ["facade"]
    affects: [arch-coupling]
  - id: flyweight-pattern
    kind: MECHANISM
    name: "플라이웨이트 패턴"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "공유 가능한 불변 상태(내재 상태)를 한 인스턴스로 두고 여러 곳이 나눠 쓴다. 대량의 작은 객체가 메모리를 채울 때 쓰며, 문자열 인터닝·작은 정수 캐시가 예다"
    synonyms: ["flyweight"]
    uses: [immutability]
  - id: proxy-pattern
    kind: MECHANISM
    name: "프록시 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "진짜 객체 앞에 같은 인터페이스의 대리 객체를 두고 접근을 가로챈다. Spring 의 @Transactional·@Cacheable 이 프록시로 동작해서 같은 클래스 안의 내부 호출에는 적용되지 않는다"
    synonyms: ["proxy", "AOP proxy"]
    questions: ["같은 빈 안에서 @Transactional 메서드를 호출하면 왜 트랜잭션이 안 걸리나"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/inventory/service/InventoryService.kt, symbol: "@Transactional", note: "스프링이 이 빈을 트랜잭션 프록시로 감싼다" }
    uses:
      - { to: spring-aop, reason: "스프링이 트랜잭션 · 캐시를 프록시로 끼운다" }
  - id: arch-class-explosion
    kind: PROBLEM
    name: "클래스 폭발"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "변하는 축 둘 이상을 상속으로만 조합해 축의 곱만큼 하위 클래스가 생기는 상태. 기능 하나를 더할 때마다 클래스가 배로 는다"
    synonyms: ["class explosion", "subclass explosion"]
  - id: arch-behavioral-design
    kind: STAGE
    name: "행위 분배 설계"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "알고리즘과 요청 처리 책임을 객체 사이에 나누고, 무엇이 바뀔 수 있는지를 인터페이스 뒤로 숨긴다"
    contains: [strategy-pattern, template-method, observer-pattern, command-pattern, chain-of-responsibility, mediator-pattern, state-pattern, iterator-pattern, visitor-pattern, memento-pattern, interpreter-pattern, specification-pattern, arch-null-object]
  - id: strategy-pattern
    kind: MECHANISM
    name: "전략 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "바뀌는 알고리즘을 인터페이스로 빼고 구현체를 주입해 런타임에 교체한다. 같은 매매 엔진이 백테스트·모의·실거래 거래소를 갈아 끼우는 식이다"
    synonyms: ["strategy", "policy"]
    questions: ["전략 패턴과 when 분기 중 무엇을 고를지 가르는 기준은 무엇인가"]
    code:
      - { path: quant/feature/src/main/kotlin/com/kgd/quant/application/backtest/StrategyEngineLoop.kt, symbol: "private val exchange: ExchangeAdapter,", note: "엔진은 거래소 인터페이스만 알고 구현은 주입받는다" }
    uses: [polymorphism, interface]
  - id: template-method
    kind: MECHANISM
    name: "템플릿 메서드"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "상위 클래스가 처리 순서(골격)를 고정하고 바뀌는 단계만 하위 클래스가 재정의한다. 상속으로 묶이므로 단계가 많아지면 전략 패턴의 조합이 낫다"
    synonyms: ["template method"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/admission/AdmissionControlFilter.kt, symbol: "override fun doFilterInternal(", note: "OncePerRequestFilter 가 골격을 갖고 이 단계만 재정의한다" }
    uses: [inheritance]
    alternative_to:
      - { to: strategy-pattern, reason: "같은 변동점을 상속으로 푸느냐 조합으로 푸느냐의 차이" }
  - id: observer-pattern
    kind: MECHANISM
    name: "옵저버 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "주체가 구독자 목록을 들고 상태가 바뀌면 전부에게 알린다. 주체는 구독자의 구체 타입을 모른다. 프로세스 밖으로 넓히면 pub/sub 가 된다"
    synonyms: ["observer", "pub/sub", "listener"]
    code:
      - { path: quant/feature/src/main/kotlin/com/kgd/quant/infrastructure/chart/InMemorySsePriceStreamAdapter.kt, symbol: "override fun subscribe(", note: "시세 구독자를 등록하고 publish 때 전부에게 보낸다" }
    alternative_to: [mediator-pattern]
  - id: command-pattern
    kind: MECHANISM
    name: "커맨드 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "요청을 값 객체로 만들어 보내고, 큐에 쌓고, 다시 실행할 수 있게 한다. 메시지로 보내는 「재고 예약」 명령이 그 예다"
    synonyms: ["command"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/messaging/InventoryCommandConsumer.kt, symbol: "data class InventoryCommandMessage(", note: "재고 명령을 직렬화 가능한 객체로 주고받는다" }
    uses: [data-class]
  - id: chain-of-responsibility
    kind: MECHANISM
    name: "책임 연쇄"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "처리기들을 사슬로 잇고 각자 처리하거나 다음으로 넘긴다. 서블릿 필터·게이트웨이 필터·인터셉터가 이 구조다"
    synonyms: ["chain of responsibility", "filter chain"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/admission/AdmissionControlFilter.kt, symbol: "filterChain.doFilter(request, response)", note: "통과시킬 요청만 다음 필터로 넘긴다" }
  - id: mediator-pattern
    kind: MECHANISM
    name: "중재자 패턴"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "여러 객체가 서로 직접 부르지 않고 중재자 하나를 통해서만 소통하게 한다. 다대다 참조를 일대다로 줄이는 대신 중재자가 비대해지기 쉽다"
    synonyms: ["mediator"]
    causes:
      - { to: arch-god-class, reason: "모든 협력 규칙이 중재자 한 곳에 쌓인다" }
  - id: state-pattern
    kind: MECHANISM
    name: "상태 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "상태마다 허용 동작과 다음 상태를 상태 객체(또는 enum 상수)가 갖게 해 거대한 if·when 분기를 없앤다. 주문·판매자처럼 전이 규칙이 있는 모델에 쓴다"
    synonyms: ["state", "state machine"]
    questions: ["상태 전이 규칙을 서비스의 if 문이 아니라 상태 타입 안에 두면 무엇이 좋아지나"]
    code:
      - { path: seller/domain/src/main/kotlin/com/kgd/seller/domain/seller/model/SellerStatus.kt, symbol: "fun canTransitionTo(target: SellerStatus): Boolean", note: "상태마다 허용되는 다음 상태를 enum 이 직접 답한다" }
    uses: [enum, lang-exhaustive-when]
    alternative_to:
      - { to: strategy-pattern, reason: "구조는 같지만 상태 패턴은 객체가 스스로 다음 구현으로 바뀐다" }
  - id: iterator-pattern
    kind: MECHANISM
    name: "이터레이터 패턴"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "컬렉션의 내부 구조를 드러내지 않고 원소를 차례로 꺼내는 방법을 제공한다. Kotlin 의 Iterable·Sequence 와 for 루프가 언어 수준의 이터레이터다"
    synonyms: ["iterator", "cursor"]
    uses: [encapsulation]
  - id: visitor-pattern
    kind: MECHANISM
    name: "비지터 패턴"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "객체 구조는 그대로 두고 그 위에서 도는 연산을 방문자 객체로 뺀다(이중 디스패치). 타입은 고정이고 연산이 자주 늘 때 맞으며, Kotlin 에서는 sealed 계층 + when 이 흔히 대신한다"
    synonyms: ["visitor", "double dispatch"]
    alternative_to:
      - { to: lang-exhaustive-when, reason: "sealed 타입이면 when 의 완전성 검사가 방문자 없이 같은 보장을 준다" }
  - id: memento-pattern
    kind: MECHANISM
    name: "메멘토 패턴"
    category: DESIGN_PATTERN
    level: INTERMEDIATE
    description: "객체의 내부 상태를 캡슐화를 깨지 않고 스냅숏으로 떠 두었다가 나중에 되돌린다. 실행 취소·체크포인트에 쓴다"
    synonyms: ["memento", "snapshot"]
    uses: [encapsulation, immutability]
  - id: interpreter-pattern
    kind: MECHANISM
    name: "인터프리터 패턴"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "작은 언어의 문법 규칙을 클래스 계층으로 표현하고 구문 트리를 재귀적으로 평가한다. 규칙 엔진·검색 질의식·조건식 DSL 이 예다"
    synonyms: ["interpreter"]
    uses: [composite-pattern, dsl]
  - id: specification-pattern
    kind: MECHANISM
    name: "스펙 패턴"
    category: DESIGN_PATTERN
    level: ADVANCED
    description: "「이 조건을 만족하나」라는 업무 규칙을 isSatisfiedBy 를 가진 객체로 만든다. 조건을 이름 붙여 재사용하고 and·or 로 조합할 수 있다. GoF 가 아니라 DDD 에서 나온 패턴이다"
    synonyms: ["specification"]
    code:
      - { path: quant/domain/src/main/kotlin/com/kgd/quant/domain/strategy/PriceCondition.kt, symbol: "fun isSatisfiedBy(currentPrice: Price): Boolean", note: "진입 조건을 봉인 계층 객체로 표현한다" }
    uses: [sealed-class, composite-pattern]
  - id: arch-null-object
    kind: MECHANISM
    name: "널 객체 패턴"
    category: DESIGN_PATTERN
    level: BEGINNER
    description: "없음을 null 대신 아무 일도 하지 않는 구현 객체로 표현해 호출부의 null 검사를 없앤다. Fowler 의 특수 사례(Special Case) 패턴과 같은 생각이다"
    synonyms: ["Null Object", "Special Case"]
    alternative_to: [null-safety]

  # ── 엔터프라이즈 애플리케이션 패턴 ───────────────────────
  - id: arch-enterprise-patterns
    kind: STAGE
    name: "엔터프라이즈 애플리케이션 패턴"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "업무 로직을 어디에 어떤 모양으로 둘지, 객체와 테이블을 어떻게 잇는지 정한다. Fowler 의 PoEAA 가 이름을 붙인 패턴들이며 JPA·Spring 이 그 대부분을 구현해 두었다"
    synonyms: ["PoEAA", "Patterns of Enterprise Application Architecture"]
    questions: ["트랜잭션 스크립트에서 도메인 모델로 옮겨야 하는 신호는 무엇인가", "액티브 레코드와 데이터 매퍼는 무엇이 도메인 객체를 DB 에 묶는가"]
    contains: [arch-transaction-script, arch-table-module, arch-service-layer, arch-repository-pattern, arch-data-mapper, arch-active-record, arch-table-data-gateway, arch-row-data-gateway, arch-unit-of-work, arch-identity-map, arch-gateway-pattern, arch-impedance-mismatch]
    flows_to: [arch-layer-design]
  - id: arch-transaction-script
    kind: MECHANISM
    name: "트랜잭션 스크립트"
    category: ARCHITECTURE
    level: BEGINNER
    description: "요청 하나를 처리하는 절차를 한 메서드에 순서대로 적는다. 규칙이 단순할 때는 가장 빠르지만, 규칙이 늘면 같은 검사가 스크립트마다 복제된다"
    synonyms: ["Transaction Script"]
    alternative_to:
      - { to: arch-rich-domain-model, reason: "규칙을 절차에 두느냐 객체에 두느냐" }
    causes:
      - { to: arch-anemic-domain-model, reason: "엔티티는 데이터만 갖고 규칙은 스크립트에 산다" }
  - id: arch-table-module
    kind: MECHANISM
    name: "테이블 모듈"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "테이블 하나에 대응하는 클래스 하나가 그 테이블 전체 행에 대한 업무 로직을 갖는다. 레코드셋 중심 플랫폼에서 쓰였고 도메인 모델과 트랜잭션 스크립트의 중간이다"
    synonyms: ["Table Module"]
    alternative_to: [arch-transaction-script]
  - id: arch-service-layer
    kind: MECHANISM
    name: "서비스 계층"
    category: ARCHITECTURE
    level: BEGINNER
    description: "애플리케이션의 경계에서 유스케이스 단위로 트랜잭션을 열고 도메인 객체를 조율한다. 규칙은 도메인에 위임하고 흐름만 가진다"
    synonyms: ["Service Layer", "application service"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/inventory/service/InventoryService.kt, symbol: "class InventoryService(", note: "유스케이스 인터페이스를 구현하고 트랜잭션 경계를 연다" }
    uses: [arch-usecase, arch-application-service]
  - id: arch-repository-pattern
    kind: MECHANISM
    name: "리포지토리 패턴"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "애그리거트를 메모리의 컬렉션처럼 넣고 꺼내는 인터페이스를 도메인 쪽에 두고, 저장 기술은 그 뒤에 숨긴다. 애그리거트 루트 하나당 리포지토리 하나를 둔다"
    synonyms: ["Repository"]
    questions: ["Spring Data JpaRepository 를 도메인 리포지토리로 바로 쓰면 무엇이 새는가"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/inventory/port/InventoryRepositoryPort.kt, symbol: "interface InventoryRepositoryPort {", note: "애그리거트 단위로 저장·조회하는 포트" }
    uses: [aggregate, arch-data-mapper]
  - id: arch-data-mapper
    kind: MECHANISM
    name: "데이터 매퍼"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "도메인 객체와 테이블 행 사이 변환을 별도 매퍼가 맡아 도메인 객체는 DB 를 모르게 한다. 이 레포는 JPA 엔티티를 따로 두고 toDomain·fromDomain 으로 옮긴다"
    synonyms: ["Data Mapper"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/persistence/inventory/entity/InventoryJpaEntity.kt, symbol: "fun toDomain(): Inventory = Inventory.restore(", note: "JPA 엔티티를 순수 도메인 객체로 되살린다" }
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/persistence/inventory/entity/InventoryJpaEntity.kt, symbol: "fun fromDomain(inv: Inventory): InventoryJpaEntity", note: "도메인 객체를 행 모양으로 옮긴다" }
    uses: [orm]
    mitigates: [arch-impedance-mismatch, arch-framework-coupling]
  - id: arch-active-record
    kind: MECHANISM
    name: "액티브 레코드"
    category: ARCHITECTURE
    level: BEGINNER
    description: "행 하나를 감싼 객체가 자기 데이터와 save·delete 같은 DB 접근을 함께 갖는다. 단순 CRUD 에 빠르지만 도메인 객체가 스키마에 묶인다"
    synonyms: ["Active Record"]
    alternative_to:
      - { to: arch-data-mapper, reason: "DB 접근을 객체 안에 두느냐 밖의 매퍼에 두느냐" }
    causes: [arch-framework-coupling]
  - id: arch-table-data-gateway
    kind: MECHANISM
    name: "테이블 데이터 게이트웨이"
    category: ARCHITECTURE
    level: BEGINNER
    description: "테이블 하나에 대한 SQL 을 모두 한 객체에 모으고 결과는 레코드셋으로 돌려준다. MyBatis 매퍼·DAO 가 이 모양이다"
    synonyms: ["Table Data Gateway", "DAO"]
    alternative_to: [arch-row-data-gateway]
  - id: arch-row-data-gateway
    kind: MECHANISM
    name: "로우 데이터 게이트웨이"
    category: ARCHITECTURE
    level: BEGINNER
    description: "행 하나당 객체 하나가 그 행의 필드와 저장 메서드를 갖되 업무 로직은 갖지 않는다. 로직을 더하면 액티브 레코드가 된다"
    synonyms: ["Row Data Gateway"]
  - id: arch-unit-of-work
    kind: MECHANISM
    name: "작업 단위"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 비즈니스 트랜잭션 동안 새로 생긴·바뀐·지운 객체를 추적해 두었다가 커밋 때 한꺼번에 반영한다. JPA 영속성 컨텍스트의 변경 감지와 flush 가 이것이다"
    synonyms: ["Unit of Work", "dirty checking"]
    questions: ["JPA 에서 save 를 부르지 않았는데 UPDATE 가 나가는 이유는 무엇인가"]
    uses: [data-persistence-context, arch-identity-map]
  - id: arch-identity-map
    kind: MECHANISM
    name: "아이덴티티 맵"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 세션 안에서 같은 ID 의 행은 같은 객체 하나로만 적재되게 맵으로 기억한다. 같은 행을 두 번 읽어 두 객체가 서로 다른 값을 갖는 일을 막고 1차 캐시 역할도 한다"
    synonyms: ["Identity Map", "1차 캐시"]
    uses: [hash-map]
  - id: arch-gateway-pattern
    kind: MECHANISM
    name: "게이트웨이 패턴"
    category: ARCHITECTURE
    level: BEGINNER
    description: "외부 시스템·API 접근을 그 시스템 모양 그대로 감싼 객체 하나로 모은다. 호출부는 HTTP·인증 세부를 모르고, 테스트에서는 이 객체만 바꾸면 된다"
    synonyms: ["Gateway", "API client wrapper"]
    uses: [arch-outbound-port]
  - id: arch-impedance-mismatch
    kind: PROBLEM
    name: "객체-관계 임피던스 불일치"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "객체의 상속·연관·식별과 테이블의 행·외래키·기본키가 1:1 로 맞지 않아 생기는 변환 비용. 모델을 테이블 모양에 맞추면 도메인이 비틀리고, 반대면 매핑이 복잡해진다"
    synonyms: ["object-relational impedance mismatch"]

  # ── 계층 설계 ─────────────────────────────────────────────
  - id: arch-layer-design
    kind: STAGE
    name: "계층 설계"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 서비스 안에서 도메인·유스케이스·어댑터를 나누고 의존 방향을 정한다. 이 레포는 UseCase 인터페이스 + Outbound Port + Adapter 구조를 표준으로 둔다(ADR-0083)"
    questions: ["application 계층이 infrastructure 를 import 하면 무엇이 깨지나", "레이어드·헥사고날·어니언·클린은 무엇이 같고 무엇이 다른가"]
    contains: [layered-architecture, clean-architecture, hexagonal-architecture, arch-onion-architecture, arch-vertical-slice, arch-package-by-feature, arch-package-by-layer, arch-mvc, arch-layer-dependency-gate, arch-layer-violation, arch-framework-coupling]
    flows_to: [arch-boundary-design]
    measured_by: [arch-coupling]
  - id: layered-architecture
    kind: MECHANISM
    name: "레이어드 아키텍처"
    category: ARCHITECTURE
    level: BEGINNER
    description: "표현 → 비즈니스 → 데이터 접근 순으로 계층을 쌓고 위에서 아래로만 호출한다. 단순하지만 비즈니스 계층이 데이터 접근 기술에 의존하게 된다"
    synonyms: ["layered architecture", "n-tier"]
    uses: [arch-separation-of-concerns]
    causes:
      - { to: arch-framework-coupling, reason: "비즈니스 계층이 아래의 JPA 리포지토리에 직접 의존한다" }
  - id: clean-architecture
    kind: MECHANISM
    name: "클린 아키텍처"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "엔티티·유스케이스를 가운데 두고 모든 의존이 안쪽으로만 향하게 한다. 안쪽 계층은 프레임워크를 모르므로 DB·웹 기술을 바꿔도 규칙 코드가 남는다"
    synonyms: ["clean architecture"]
    code:
      - { path: inventory/domain/build.gradle.kts, symbol: "Pure domain module — no Spring/JPA annotations in source.", note: "도메인 모듈은 Spring·JPA 의존 없이 common 만 받는다" }
    uses: [arch-dependency-rule, arch-usecase, arch-dip]
    alternative_to: [layered-architecture]
    mitigates: [arch-layer-violation, arch-framework-coupling]
  - id: hexagonal-architecture
    kind: MECHANISM
    name: "헥사고날 아키텍처"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "애플리케이션 코어를 포트로 감싸고 웹·DB·메시징을 모두 바깥의 어댑터로 붙인다. 들어오는 쪽(inbound)과 나가는 쪽(outbound)을 대칭으로 다룬다"
    synonyms: ["hexagonal architecture", "ports and adapters"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/inventory/usecase/ReserveStockUseCase.kt, symbol: "interface ReserveStockUseCase {", note: "inbound 포트 — 컨트롤러와 컨슈머가 이 인터페이스로 들어온다" }
    contains: [port-adapter]
    alternative_to: [layered-architecture]
    mitigates: [arch-framework-coupling]
  - id: port-adapter
    kind: MECHANISM
    name: "포트-어댑터"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "코어가 필요한 외부 기능을 인터페이스(포트)로 선언하고 infrastructure 가 그 구현(어댑터)을 제공한다. 코어는 포트만 알고 JPA·Redis 를 모른다"
    synonyms: ["port and adapter"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/inventory/port/InventoryRepositoryPort.kt, symbol: "interface InventoryRepositoryPort {", note: "application 계층이 선언한 outbound 포트" }
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/persistence/inventory/adapter/InventoryRepositoryAdapter.kt, symbol: ") : InventoryRepositoryPort {", note: "infrastructure 가 JPA 로 포트를 구현한다" }
    uses: [adapter-pattern, interface, polymorphism, arch-inbound-port, arch-outbound-port]
  - id: arch-onion-architecture
    kind: MECHANISM
    name: "어니언 아키텍처"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "도메인 모델을 중심에 두고 도메인 서비스 → 애플리케이션 서비스 → 인프라·UI 를 동심원으로 둘러싼다. 의존은 바깥에서 안쪽으로만 향하며 클린 아키텍처의 직접적인 선행 형태다"
    synonyms: ["onion architecture"]
    uses: [arch-dependency-rule]
    alternative_to: [layered-architecture]
  - id: arch-vertical-slice
    kind: MECHANISM
    name: "버티컬 슬라이스 아키텍처"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "계층이 아니라 기능(요청 하나) 단위로 코드를 세로로 자른다. 한 기능의 변경이 한 폴더 안에서 끝나는 대신 기능 사이 중복을 허용한다"
    synonyms: ["vertical slice architecture"]
    alternative_to: [layered-architecture]
  - id: arch-package-by-feature
    kind: MECHANISM
    name: "기능별 패키지"
    category: ARCHITECTURE
    level: BEGINNER
    description: "최상위 패키지를 기능·엔티티로 나누고 그 안에서 계층을 나눈다. 이 레포는 application/{entity}/usecase·port·service 처럼 엔티티 아래에 계층을 둔다"
    synonyms: ["package by feature", "feature-first"]
    alternative_to: [arch-package-by-layer]
    affects: [arch-cohesion]
  - id: arch-package-by-layer
    kind: MECHANISM
    name: "계층별 패키지"
    category: ARCHITECTURE
    level: BEGINNER
    description: "controller·service·repository 처럼 계층 이름으로 최상위 패키지를 나눈다. 익숙하지만 한 기능의 코드가 여러 패키지에 흩어진다"
    synonyms: ["package by layer"]
    causes: [arch-shotgun-surgery]
  - id: arch-mvc
    kind: MECHANISM
    name: "MVC"
    category: ARCHITECTURE
    level: BEGINNER
    description: "입력을 받는 컨트롤러, 상태와 규칙을 가진 모델, 표현을 맡는 뷰를 나눈다. 백엔드에서는 컨트롤러가 요청 DTO 를 유스케이스 입력으로 바꾸고 응답 DTO 를 돌려주는 표현 계층의 틀이다"
    synonyms: ["Model-View-Controller"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/presentation/inventory/controller/InventoryController.kt, symbol: "class InventoryController(", note: "요청을 유스케이스 호출로만 넘기는 컨트롤러" }
    uses: [arch-presentation-layer, arch-dto]
  - id: arch-layer-dependency-gate
    kind: MECHANISM
    name: "계층 의존 빌드 게이트"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "소스의 import 를 빌드 단계에서 검사해 application 이 infrastructure 를 참조하면 빌드를 실패시킨다. 리뷰에 기대지 않고 규칙을 기계로 지킨다"
    code:
      - { path: build.gradle.kts, symbol: "val verifyLayerDependencies by tasks.registering {", note: "check 에 물린 계층 의존 검사 태스크" }
    uses: [arch-dependency-rule]
    mitigates: [arch-layer-violation]
  - id: arch-layer-violation
    kind: PROBLEM
    name: "계층 침범"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "안쪽 계층이 바깥 계층 타입을 직접 참조하는 상태. 서비스에 JpaRepository 를 바로 주입하는 식이며, 한 번 들어오면 테스트와 교체가 함께 어려워진다"
    synonyms: ["layer violation"]
  - id: arch-framework-coupling
    kind: PROBLEM
    name: "프레임워크 종속"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "업무 규칙이 ORM 엔티티·웹 애너테이션에 섞여 프레임워크 없이 테스트하거나 옮길 수 없는 상태"
    synonyms: ["framework lock-in"]

  # ── 경계 설계 (DDD) ───────────────────────────────────────
  - id: arch-boundary-design
    kind: STAGE
    name: "도메인 경계 설계"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "업무 언어가 바뀌는 곳을 찾아 모델의 경계를 긋고, 경계 안의 규칙을 애그리거트로 담는다. 경계가 틀리면 뒤의 서비스 분리와 계층 설계가 전부 그 오류를 물려받는다"
    questions: ["같은 「상품」이라는 말이 주문과 재고에서 다른 뜻이면 모델을 어떻게 나누나"]
    contains: [ddd, arch-rich-domain-model, arch-reference-by-id, arch-anemic-domain-model, arch-oversized-aggregate, arch-cohesion]
    flows_to: [arch-system-decomposition]
    measured_by: [arch-cohesion]
  - id: ddd
    kind: MECHANISM
    name: "도메인 주도 설계"
    category: ARCHITECTURE
    level: ADVANCED
    description: "업무 전문가와 같은 말(유비쿼터스 언어)로 모델을 만들고, 그 모델이 통하는 경계(바운디드 컨텍스트) 안에서 애그리거트·값 객체로 규칙을 담는 설계 방법론이다. 전략 설계와 전술 설계 두 층으로 나뉘며 업무 규칙이 복잡할 때 값어치가 있다"
    synonyms: ["DDD", "Domain-Driven Design"]
    questions: ["바운디드 컨텍스트와 애그리거트는 각각 무엇의 경계인가", "DDD 가 단순 CRUD 서비스에 과한 이유는 무엇인가"]
    contains: [arch-strategic-design, arch-tactical-design]
    uses: [bounded-context, aggregate, value-object, arch-entity, arch-domain-event, arch-ubiquitous-language]
    mitigates:
      - { to: arch-anemic-domain-model, reason: "규칙을 애그리거트 안에 두게 해 서비스 계층으로 새지 않게 한다" }
  - id: arch-strategic-design
    kind: MECHANISM
    name: "전략 설계"
    category: ARCHITECTURE
    level: ADVANCED
    description: "도메인을 하위 도메인으로 나눠 핵심에 투자를 몰고, 바운디드 컨텍스트를 긋고, 컨텍스트 사이 관계를 컨텍스트 맵으로 정한다. 서비스 경계와 팀 경계의 근거가 된다"
    synonyms: ["strategic design", "strategic DDD"]
    questions: ["핵심 도메인과 일반 하위 도메인에 들이는 노력은 어떻게 달라야 하나"]
    contains: [arch-event-storming, arch-context-mapping]
    uses: [bounded-context, arch-subdomain, arch-core-domain, arch-supporting-subdomain, arch-generic-subdomain, arch-context-map, arch-ubiquitous-language]
  - id: arch-event-storming
    kind: MECHANISM
    name: "이벤트 스토밍"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "업무 전문가와 개발자가 한 벽에 도메인 이벤트를 시간 순으로 붙이고 명령·정책·애그리거트를 찾아 가는 워크숍이다. 이벤트가 몰리는 곳과 용어가 갈리는 곳이 경계 후보가 된다"
    synonyms: ["Event Storming"]
    uses: [arch-domain-event, arch-ubiquitous-language]
  - id: arch-context-mapping
    kind: MECHANISM
    name: "컨텍스트 매핑"
    category: ARCHITECTURE
    level: ADVANCED
    description: "두 바운디드 컨텍스트가 어떤 힘의 관계로 모델을 주고받는지 패턴으로 정한다. 상류·하류 중 누가 모델을 정하는지, 번역을 누가 맡는지가 핵심 질문이다"
    synonyms: ["context mapping", "context map patterns"]
    questions: ["하류가 상류 모델을 그대로 따르는 것(준수자)과 번역층을 두는 것(ACL)은 언제 갈리나"]
    contains: [arch-partnership, arch-shared-kernel, arch-customer-supplier, arch-conformist, arch-anti-corruption-layer, arch-open-host-service, arch-published-language, arch-separate-ways]
    uses: [arch-context-map, arch-upstream-downstream]
  - id: arch-partnership
    kind: MECHANISM
    name: "파트너십"
    category: ARCHITECTURE
    level: ADVANCED
    description: "두 컨텍스트 팀이 성공과 실패를 함께 지고 인터페이스 변경을 같이 계획한다. 일정이 강하게 묶이므로 두 팀이 가까울 때만 맞다"
    synonyms: ["Partnership"]
  - id: arch-shared-kernel
    kind: MECHANISM
    name: "공유 커널"
    category: ARCHITECTURE
    level: ADVANCED
    description: "두 컨텍스트가 모델의 작은 부분(코드·스키마)을 함께 소유한다. 번역 비용이 없는 대신 공유 부분을 바꿀 때 양쪽 합의가 필요하다. 이 레포의 common 모듈이 이 성격이다"
    synonyms: ["Shared Kernel"]
    affects: [arch-coupling]
  - id: arch-customer-supplier
    kind: MECHANISM
    name: "고객-공급자"
    category: ARCHITECTURE
    level: ADVANCED
    description: "상류(공급자)가 하류(고객)의 요구를 계획에 반영하고, 하류는 요구를 계약 테스트 등으로 상류에 전한다. 상류가 협조할 의지가 있을 때의 관계다"
    synonyms: ["Customer-Supplier", "Customer/Supplier Development"]
  - id: arch-conformist
    kind: MECHANISM
    name: "준수자"
    category: ARCHITECTURE
    level: ADVANCED
    description: "하류가 상류 모델을 번역 없이 그대로 따른다. 상류가 협조하지 않고 상류 모델이 쓸 만할 때 번역 비용을 아끼는 선택이다"
    synonyms: ["Conformist"]
    alternative_to: [arch-anti-corruption-layer]
  - id: arch-anti-corruption-layer
    kind: MECHANISM
    name: "부패 방지 계층"
    category: ARCHITECTURE
    level: ADVANCED
    description: "외부·레거시 모델이 내 도메인 모델을 오염시키지 않도록 경계에 번역층을 둔다. 외부 API 응답을 내 도메인 타입으로 바꾸는 어댑터가 그 자리다"
    synonyms: ["ACL", "Anti-Corruption Layer"]
    questions: ["외부 거래소 API 가 필드 이름을 바꾸면 ACL 이 있을 때와 없을 때 무엇이 달라지나"]
    code:
      - { path: quant/feature/src/main/kotlin/com/kgd/quant/infrastructure/exchange/BinanceMarketAdapter.kt, symbol: "class BinanceMarketAdapter(", note: "거래소 REST 응답을 도메인의 MarketAdapter 모양으로 번역한다" }
    uses: [adapter-pattern, arch-gateway-pattern]
  - id: arch-open-host-service
    kind: MECHANISM
    name: "공개 호스트 서비스"
    category: ARCHITECTURE
    level: ADVANCED
    description: "상류가 여러 하류를 위해 잘 정의된 공개 프로토콜(API)을 연다. 하류마다 맞춤 통합을 만들지 않고 하나의 서비스 인터페이스로 모두를 받는다"
    synonyms: ["OHS", "Open Host Service"]
    uses: [arch-published-language]
  - id: arch-published-language
    kind: MECHANISM
    name: "공표된 언어"
    category: ARCHITECTURE
    level: ADVANCED
    description: "컨텍스트 사이 교환 형식을 문서화된 공용 스키마(이벤트 스키마·API 계약)로 정한다. 내부 모델이 바뀌어도 교환 형식은 버전으로 관리된다"
    synonyms: ["PL", "Published Language"]
    uses:
      - { to: msg-schema-registry, reason: "공개 언어를 스키마로 등록해 계약으로 삼는다" }
  - id: arch-separate-ways
    kind: MECHANISM
    name: "각자의 길"
    category: ARCHITECTURE
    level: ADVANCED
    description: "통합으로 얻는 것이 비용보다 작으면 두 컨텍스트를 잇지 않고 각자 필요한 것을 따로 만든다"
    synonyms: ["Separate Ways"]
  - id: arch-tactical-design
    kind: MECHANISM
    name: "전술 설계"
    category: ARCHITECTURE
    level: ADVANCED
    description: "한 바운디드 컨텍스트 안에서 엔티티·값 객체·애그리거트·도메인 이벤트·리포지토리·도메인 서비스·팩토리로 모델을 코드로 옮긴다. 불변식을 애그리거트 경계 안에서 지키는 것이 목적이다"
    synonyms: ["tactical design", "DDD building blocks"]
    questions: ["애그리거트 하나를 한 트랜잭션으로만 바꾸라는 규칙은 무엇을 지키려는가"]
    uses: [arch-entity, value-object, aggregate, arch-domain-event, arch-domain-service, arch-domain-factory, arch-invariant, arch-ddd-module, arch-repository-pattern, specification-pattern]
  - id: arch-rich-domain-model
    kind: MECHANISM
    name: "풍부한 도메인 모델"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "상태를 바꾸는 규칙을 엔티티 메서드 안에 두고 상태 필드는 밖에서 직접 못 바꾸게 한다. 재고 예약처럼 불변식이 있는 모델에 쓴다(Fowler 의 Domain Model 패턴)"
    synonyms: ["rich domain model", "Domain Model"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/model/Inventory.kt, symbol: "fun reserve(qty: Int) {", note: "가용 수량 검사와 차감을 엔티티가 직접 한다" }
    uses:
      - encapsulation
      - aggregate
      - arch-invariant
      - { to: optimistic-lock, reason: "애그리거트의 버전 필드가 동시 수정을 막는다" }
    mitigates: [arch-anemic-domain-model]
  - id: arch-reference-by-id
    kind: MECHANISM
    name: "ID 로 참조"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "다른 애그리거트를 객체 연관이 아니라 식별자 값으로만 가리킨다. 트랜잭션·로딩 경계가 애그리거트마다 끊기고, 나중에 서비스를 나눠도 참조가 깨지지 않는다(이 레포의 FK-as-ID 규칙)"
    synonyms: ["reference by identity", "FK-as-ID"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/model/Inventory.kt, symbol: "val productId: Long,", note: "상품 애그리거트를 객체가 아니라 ID 로만 안다" }
    uses: [aggregate]
    mitigates: [arch-oversized-aggregate]
  - id: arch-anemic-domain-model
    kind: PROBLEM
    name: "빈약한 도메인 모델"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "엔티티가 getter·setter 만 갖고 규칙은 서비스 계층에 흩어진 상태. 같은 검사가 여러 서비스에 복제되고 하나를 빠뜨리면 불변식이 깨진다"
    synonyms: ["anemic domain model"]
  - id: arch-oversized-aggregate
    kind: PROBLEM
    name: "거대 애그리거트"
    category: ARCHITECTURE
    level: ADVANCED
    description: "애그리거트가 연관 객체를 너무 많이 품어, 작은 수정에도 큰 그래프를 읽고 한 행에 락이 몰리는 상태. 동시 수정 충돌과 로딩 비용이 함께 커진다"
    synonyms: ["large aggregate"]
    causes: [conc-lock-contention]

  # ── 시스템 분해 ───────────────────────────────────────────
  - id: arch-system-decomposition
    kind: STAGE
    name: "시스템 분해"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "도메인 경계를 몇 개의 배포 단위와 프로세스로 옮길지, 어떤 아키텍처 스타일로 묶을지 정한다. 코드 경계와 배포 경계를 따로 고를 수 있다는 점이 핵심이다"
    questions: ["모듈 경계를 지키면서 하나의 JVM 으로 배포하면 무엇을 얻고 무엇을 잃나", "서비스를 더 쪼개야 할 신호와 합쳐야 할 신호는 각각 무엇인가"]
    contains: [monolith, arch-modular-monolith, arch-service-based, soa, msa, event-driven-architecture, arch-pipe-and-filter, arch-microkernel, arch-space-based, arch-serverless, arch-decompose-by-capability, arch-decompose-by-subdomain, arch-service-granularity, arch-database-per-service, arch-shared-database, arch-workload-tiering, arch-inverse-conway-maneuver, arch-distributed-monolith, arch-over-decomposition, arch-big-ball-of-mud, arch-coupling, spring-boot]
    flows_to: [arch-integration-design]
    measured_by: [arch-coupling]
  - id: monolith
    kind: MECHANISM
    name: "모놀리스"
    category: ARCHITECTURE
    level: BEGINNER
    description: "모든 기능을 하나의 배포 단위로 묶는다. 호출이 함수 호출이라 빠르고 트랜잭션이 단순하지만, 한 부분의 변경도 전체 재배포가 된다"
    synonyms: ["monolith", "monolithic architecture"]
    alternative_to: [msa]
    causes:
      - { to: arch-big-ball-of-mud, reason: "모듈 경계를 강제하지 않으면 내부 참조가 사방으로 퍼진다" }
  - id: arch-modular-monolith
    kind: MECHANISM
    name: "모듈러 모놀리스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "도메인마다 모듈 경계와 스키마를 따로 두되 한 프로세스로 띄운다. 이 레포는 order·inventory 같은 도메인을 :feature 라이브러리로 만들어 commerce 호스트 하나에 접는다(ADR-0058·0093)"
    synonyms: ["modular monolith", "폴드 호스트"]
    questions: ["같은 JVM 안의 모듈끼리도 Kafka 로 이벤트를 주고받는 이유는 무엇인가"]
    code:
      - { path: commerce/app/src/main/kotlin/com/kgd/commerce/CommerceApplication.kt, symbol: "@SpringBootApplication(scanBasePackages", note: "여러 도메인 패키지를 한 앱이 스캔해 한 JVM 에 접는다" }
      - { path: build.gradle.kts, symbol: "val verifyPodTopology by tasks.registering {", note: "새 :app(파드)을 승인 목록 없이 못 만들게 막는 빌드 게이트" }
    uses: [arch-database-per-service, arch-composition-root]
    alternative_to:
      - { to: msa, reason: "도메인 경계는 유지하고 파드 수와 네트워크 호출만 줄인다" }
    affects: [arch-coupling]
    mitigates: [arch-over-decomposition, arch-big-ball-of-mud]
  - id: arch-service-based
    kind: MECHANISM
    name: "서비스 기반 아키텍처"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "4~12 개 정도의 굵은 도메인 서비스를 따로 배포하되 데이터베이스는 하나를 함께 쓴다. 마이크로서비스보다 분산 비용이 적은 실용적 중간 지점이다"
    synonyms: ["service-based architecture"]
    uses: [arch-shared-database]
    alternative_to: [msa]
  - id: soa
    kind: MECHANISM
    name: "서비스 지향 아키텍처"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "재사용할 업무 기능을 서비스로 떼어 공용 버스(ESB) 같은 중앙 통합 계층으로 엮는다. 중앙 계층이 규칙을 갖게 되는 점이 MSA 와 갈린다"
    synonyms: ["SOA", "Service-Oriented Architecture", "ESB"]
    uses: [arch-orchestration]
  - id: msa
    kind: MECHANISM
    name: "마이크로서비스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "바운디드 컨텍스트마다 독립 배포 단위와 자기 DB 를 두고 API·이벤트로만 통신한다. 팀과 배포를 독립시키는 대신 네트워크 실패와 분산 트랜잭션을 떠안는다"
    synonyms: ["MSA", "microservices"]
    questions: ["서비스 간 DB 공유를 금지하는 이유는 무엇인가", "MSA 가 분산 모놀리스로 변하는 신호는 무엇인가"]
    alternative_to: [soa]
    causes:
      - { to: arch-distributed-monolith, reason: "경계를 잘못 나누면 서비스가 동기 호출로 줄줄이 묶인다" }
      - { to: dist-cascading-failure, reason: "호출이 네트워크를 건너면 한 서비스의 지연이 호출자로 번진다" }
      - { to: arch-over-decomposition, reason: "경계보다 잘게 자르면 파드와 호출만 는다" }
    affects: [arch-coupling]
    uses:
      - { to: api-gateway, reason: "바깥 요청이 들어오는 단일 진입점" }
      - { to: service-discovery, reason: "서비스 주소를 이름으로 찾는다 — 여기서는 K8s DNS" }
      - { to: arch-database-per-service, reason: "서비스가 자기 데이터만 소유한다" }
      - { to: saga-pattern, reason: "서비스를 가로지르는 업무는 로컬 트랜잭션 사슬로 푼다" }
  - id: event-driven-architecture
    kind: MECHANISM
    name: "이벤트 기반 아키텍처"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "상태 변화를 이벤트로 발행하고 관심 있는 서비스가 구독해 반응한다. 발행자는 구독자를 모르므로 서비스를 늘려도 발행 쪽 코드가 바뀌지 않는다. 브로커형과 중재자형 두 토폴로지가 있다"
    synonyms: ["EDA", "event-driven architecture"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/messaging/InventoryCommandConsumer.kt, symbol: "@KafkaListener(topics = [RESERVE]", note: "주문 쪽이 보낸 재고 명령을 토픽으로 받아 처리한다" }
    contains: [arch-eda-broker-topology, arch-eda-mediator-topology]
    uses:
      - arch-domain-event
      - arch-integration-event
      - observer-pattern
      - { to: outbox-pattern, reason: "DB 커밋과 이벤트 발행을 한 트랜잭션처럼 묶는다" }
      - { to: kafka, reason: "이 레포에서 도메인 이벤트를 나르는 브로커" }
    mitigates:
      - { to: arch-distributed-monolith, reason: "동기 호출 사슬을 비동기 이벤트로 끊는다" }
      - arch-temporal-coupling
    affects: [arch-coupling]
  - id: arch-eda-broker-topology
    kind: MECHANISM
    name: "브로커 토폴로지"
    category: ARCHITECTURE
    level: ADVANCED
    description: "중앙 조정자 없이 각 처리기가 이벤트를 받아 일하고 다음 이벤트를 발행하는 사슬로 흐른다. 확장과 결합에 유리하지만 전체 흐름과 오류 처리가 어디에도 모여 있지 않다"
    synonyms: ["broker topology"]
    uses: [arch-choreography]
    alternative_to: [arch-eda-mediator-topology]
  - id: arch-eda-mediator-topology
    kind: MECHANISM
    name: "중재자 토폴로지"
    category: ARCHITECTURE
    level: ADVANCED
    description: "이벤트 중재자가 처리 단계를 순서대로 지시하고 결과를 모은다. 흐름과 오류 처리가 한 곳에 보이지만 중재자가 병목·결합점이 된다"
    synonyms: ["mediator topology"]
    uses: [arch-orchestration]
  - id: arch-pipe-and-filter
    kind: MECHANISM
    name: "파이프-필터"
    category: ARCHITECTURE
    level: BEGINNER
    description: "입력을 받아 변환해 넘기는 독립 필터를 파이프로 잇는다. 필터는 서로 모르고 순서만 바꿔 조립할 수 있어 ETL·색인 파이프라인·유닉스 셸이 이 모양이다"
    synonyms: ["pipeline architecture", "pipes and filters"]
  - id: arch-microkernel
    kind: MECHANISM
    name: "마이크로커널"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "최소 기능의 코어 시스템에 플러그인을 꽂아 기능을 넓힌다. 코어는 플러그인 계약만 알고, IDE·브라우저·규칙 엔진처럼 사용자별 확장이 많은 제품에 맞다"
    synonyms: ["microkernel", "plug-in architecture"]
    uses: [interface]
  - id: arch-space-based
    kind: MECHANISM
    name: "공간 기반 아키텍처"
    category: ARCHITECTURE
    level: ADVANCED
    description: "처리 단위마다 데이터를 메모리 그리드로 복제해 두고 DB 는 비동기로만 쓴다. 중앙 DB 병목을 없애 폭주 트래픽(티켓 오픈 등)을 받지만 정합성과 비용이 어렵다"
    synonyms: ["space-based architecture", "tuple space"]
    uses: [replication]
  - id: arch-serverless
    kind: MECHANISM
    name: "서버리스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "요청·이벤트마다 함수가 뜨고 끝나면 사라지는 실행 모델(FaaS)과 관리형 백엔드(BaaS)로 서버 운영을 없앤다. 유휴 비용이 0 인 대신 콜드 스타트와 실행 시간 제한을 떠안는다"
    synonyms: ["serverless", "FaaS", "Function as a Service"]
    alternative_to: [arch-workload-tiering]
  - id: arch-decompose-by-capability
    kind: MECHANISM
    name: "비즈니스 역량별 분해"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "조직이 하는 일(주문 관리·재고 관리·배송)의 목록을 서비스 경계로 삼는다. 역량은 기술보다 오래 안정적이라 경계가 덜 흔들린다"
    synonyms: ["decompose by business capability"]
    alternative_to: [arch-decompose-by-subdomain]
  - id: arch-decompose-by-subdomain
    kind: MECHANISM
    name: "하위 도메인별 분해"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "DDD 의 하위 도메인과 바운디드 컨텍스트를 서비스 경계로 삼는다. 모델과 용어가 바뀌는 곳에서 자르므로 서비스 사이 번역이 명시적이 된다"
    synonyms: ["decompose by subdomain"]
    uses: [bounded-context, arch-subdomain]
  - id: arch-service-granularity
    kind: MECHANISM
    name: "서비스 입도 결정"
    category: ARCHITECTURE
    level: ADVANCED
    description: "서비스를 쪼갤 힘(변경 빈도·확장 요구·장애 격리·보안)과 합칠 힘(트랜잭션·데이터 관계·워크플로)을 함께 따져 크기를 정한다. 쪼갤 이유만 보면 과분할이 된다"
    synonyms: ["service granularity", "granularity disintegrators and integrators"]
    mitigates: [arch-over-decomposition, arch-distributed-monolith]
  - id: arch-database-per-service
    kind: MECHANISM
    name: "서비스별 데이터베이스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "서비스마다 자기 스키마를 두고 다른 서비스 테이블에 직접 접근하지 않는다. 같은 JVM 에 접힌 도메인도 datasource·트랜잭션 매니저를 따로 둔다"
    synonyms: ["database per service", "schema per service"]
    code:
      - { path: order/feature/src/main/kotlin/com/kgd/order/infrastructure/config/OrderDataSourceConfig.kt, symbol: "class OrderDataSourceConfig {", note: "commerce 호스트 안에서도 주문 도메인만의 datasource·EMF·TM 을 둔다" }
    alternative_to: [arch-shared-database]
    mitigates: [arch-distributed-monolith]
  - id: arch-shared-database
    kind: MECHANISM
    name: "공유 데이터베이스"
    category: ARCHITECTURE
    level: BEGINNER
    description: "여러 서비스가 한 스키마의 테이블을 직접 읽고 쓴다. 조인과 트랜잭션이 쉬운 대신 스키마 변경이 모든 서비스를 함께 묶는다"
    synonyms: ["shared database", "integration database"]
    causes: [arch-distributed-monolith]
  - id: arch-workload-tiering
    kind: MECHANISM
    name: "워크로드 티어링"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "배포 단위를 동기/비동기가 아니라 무게로 나눈다 — 온라인 요청(API 상주)·무거운 비동기(Worker 상주)·끝나면 사라지는 배치(Job/CronJob). 가벼운 비동기는 API 프로세스에 함께 둔다(ADR-0058)"
    synonyms: ["workload tiering", "API/Worker/Batch"]
    code:
      - { path: k8s/base/retention/cronjob.yaml, symbol: "kind: CronJob", note: "배치 티어는 상주 Deployment 없이 CronJob 으로만 돈다" }
    uses: [container]
  - id: arch-inverse-conway-maneuver
    kind: MECHANISM
    name: "역콘웨이 전략"
    category: ARCHITECTURE
    level: ADVANCED
    description: "원하는 아키텍처 모양에 맞춰 팀 구조를 먼저 바꾼다. 시스템 구조가 조직의 소통 구조를 닮는다는 콘웨이 법칙을 거꾸로 쓰는 것이다"
    synonyms: ["Inverse Conway Maneuver"]
    uses: [arch-conways-law]
  - id: arch-distributed-monolith
    kind: PROBLEM
    name: "분산 모놀리스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "서비스는 나눠 배포하지만 서로의 동기 호출·공유 DB 에 묶여 함께 배포하고 함께 장애 나는 상태. 모놀리스의 결합과 분산의 비용을 둘 다 진다"
    synonyms: ["distributed monolith"]
    measured_by: [arch-coupling]
  - id: arch-over-decomposition
    kind: PROBLEM
    name: "과분할"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "서비스를 업무 경계보다 잘게 나눠 파드·JVM 고정비와 네트워크 호출만 늘어난 상태. 이 레포는 ADR-0058 에서 이것을 모듈러 모놀리스 폴드로 되돌렸다"
    synonyms: ["nanoservices", "over-splitting"]
    causes: [arch-distributed-monolith]
  - id: arch-big-ball-of-mud
    kind: PROBLEM
    name: "큰 진흙 공"
    category: ARCHITECTURE
    level: BEGINNER
    description: "눈에 보이는 구조 없이 모든 것이 모든 것을 참조하는 시스템. 경계가 없으니 어느 변경이 어디로 번질지 알 수 없다"
    synonyms: ["Big Ball of Mud", "spaghetti architecture"]
    measured_by: [arch-coupling]

  # ── 통합 설계 ─────────────────────────────────────────────
  - id: arch-integration-design
    kind: STAGE
    name: "서비스 통합 설계"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "나눈 서비스와 외부 시스템을 어떤 방식으로 잇는지 정한다 — 동기 호출이냐 메시지냐, 흐름을 중앙이 지휘하냐 각자 반응하냐, 클라이언트와 레거시 앞에 무엇을 세우냐"
    questions: ["조회는 동기 호출, 상태 변경은 이벤트로 나누는 이유는 무엇인가", "오케스트레이션과 코레오그래피는 가시성과 결합에서 무엇을 맞바꾸나"]
    contains: [arch-sync-integration, arch-async-integration, arch-orchestration, arch-choreography, arch-api-composition, arch-bff, arch-strangler-fig, arch-shared-library, arch-temporal-coupling, arch-chatty-communication]
    flows_to: [arch-system-design]
    measured_by: [arch-coupling]
  - id: arch-sync-integration
    kind: MECHANISM
    name: "동기 호출 통합"
    category: ARCHITECTURE
    level: BEGINNER
    description: "호출자가 응답을 받을 때까지 기다리는 요청-응답(REST·gRPC)으로 서비스를 잇는다. 즉시 일관된 답을 얻지만 호출 대상이 느리거나 죽으면 호출자도 함께 멈춘다"
    synonyms: ["synchronous integration", "request-response"]
    uses: [rest, grpc, circuit-breaker]
    causes: [arch-temporal-coupling, dist-cascading-failure]
  - id: arch-async-integration
    kind: MECHANISM
    name: "비동기 메시지 통합"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "메시지·이벤트를 브로커에 맡기고 호출자는 기다리지 않는다. 수신자가 잠시 죽어도 메시지는 남지만 결과는 최종 일관성으로만 맞는다"
    synonyms: ["asynchronous messaging", "messaging integration"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/infrastructure/messaging/InventoryCommandConsumer.kt, symbol: "data class InventoryCommandMessage(", note: "주문과 재고가 같은 JVM 에 있어도 Kafka 메시지로만 주고받는다" }
    uses:
      - outbox-pattern
      - idempotency
      - eventual-consistency
      - { to: kafka, reason: "비동기 통합의 메시지 운반체" }
    alternative_to: [arch-sync-integration]
    mitigates: [arch-temporal-coupling]
  - id: arch-orchestration
    kind: MECHANISM
    name: "오케스트레이션"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "중앙 조정자가 참여 서비스에 순서대로 명령하고 응답에 따라 다음 단계와 보상을 정한다. 흐름이 한 곳에 보여 추적·변경이 쉽지만 조정자가 결합점이 된다"
    synonyms: ["orchestration", "saga orchestration"]
    uses: [command-pattern, saga-pattern]
    alternative_to: [arch-choreography]
  - id: arch-choreography
    kind: MECHANISM
    name: "코레오그래피"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "중앙 조정자 없이 각 서비스가 이벤트를 듣고 자기 일을 한 뒤 다음 이벤트를 발행한다. 결합이 낮지만 전체 흐름이 코드 어디에도 한 번에 보이지 않는다. 이 레포의 주문-재고 사가가 이 방식이다"
    synonyms: ["choreography", "saga choreography"]
    uses:
      - arch-domain-event
      - saga-pattern
      - { to: kafka, reason: "서비스들이 이벤트를 주고받는 통로" }
  - id: arch-api-composition
    kind: MECHANISM
    name: "API 조합"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "여러 서비스의 데이터를 합쳐야 하는 조회를 조합기(게이트웨이·BFF·서비스)가 각 서비스를 불러 메모리에서 합친다. 단순하지만 호출 수와 부분 실패가 늘어난다"
    synonyms: ["API composition", "aggregator"]
    alternative_to:
      - { to: cqrs, reason: "매 조회마다 합치느냐, 합친 읽기 모델을 미리 만들어 두느냐" }
    causes: [arch-chatty-communication]
  - id: arch-bff
    kind: MECHANISM
    name: "BFF"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "웹·모바일 같은 클라이언트 종류마다 전용 백엔드를 두고 그 화면에 맞게 API 를 조합·가공한다. 범용 API 하나에 모든 클라이언트 요구를 쌓지 않는다"
    synonyms: ["Backend for Frontend"]
    uses: [arch-api-composition]
    alternative_to:
      - { to: api-gateway, reason: "범용 진입점 하나 대신 클라이언트별 진입점을 둔다" }
    mitigates: [arch-chatty-communication, net-over-fetching]
  - id: arch-strangler-fig
    kind: MECHANISM
    name: "스트랭글러 피그"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "레거시 앞에 라우팅 계층을 두고 기능을 하나씩 새 시스템으로 옮기며 경로를 돌린다. 빅뱅 재작성 없이 언제든 멈추거나 되돌릴 수 있다"
    synonyms: ["Strangler Fig", "strangler pattern"]
    questions: ["빅뱅 재작성 대신 스트랭글러로 옮길 때 라우팅 계층은 무엇을 해야 하나"]
    uses: [reverse-proxy, api-gateway, arch-anti-corruption-layer]
  - id: arch-shared-library
    kind: MECHANISM
    name: "공통 라이브러리"
    category: ARCHITECTURE
    level: BEGINNER
    description: "여러 서비스가 쓰는 기술 기능(보안·웹 클라이언트·응답 포맷)을 라이브러리로 나눠 배포한다. 업무 규칙까지 넣으면 모든 서비스가 한 버전에 묶인다. 이 레포는 필요한 기능만 켜는 auto-configuration 으로 둔다"
    synonyms: ["shared library", "common module"]
    code:
      - { path: common/src/main/kotlin/com/kgd/common/webclient/CommonWebClientAutoConfiguration.kt, symbol: "class CommonWebClientAutoConfiguration {", note: "kgd.common.* 설정으로 켜는 공통 기능" }
    uses: [arch-shared-kernel]
    affects: [arch-coupling]
  - id: arch-temporal-coupling
    kind: PROBLEM
    name: "시간적 결합"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "두 서비스가 같은 시각에 함께 살아 있어야만 일이 끝나는 상태. 동기 호출 사슬이 길수록 가용성은 각 서비스 가용성의 곱으로 떨어진다"
    synonyms: ["temporal coupling"]
    measured_by: [obs-availability]
  - id: arch-chatty-communication
    kind: PROBLEM
    name: "수다스러운 통신"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "화면 하나를 그리려고 서비스 사이를 수십 번 오가는 상태. 호출마다 네트워크 왕복이 더해져 지연이 쌓이고 부분 실패 경우의 수가 늘어난다"
    synonyms: ["chatty API", "chatty I/O"]
    measured_by:
      - { to: latency-percentile, reason: "호출 수만큼 꼬리 지연이 쌓인다" }

  # ── 시스템 설계 ───────────────────────────────────────────
  - id: arch-system-design
    kind: STAGE
    name: "시스템 설계"
    category: ARCHITECTURE
    level: ADVANCED
    description: "모호한 요구를 숫자로 좁히고, 빌딩 블록으로 큰 그림을 그리고, 병목과 장애를 파고드는 설계 절차다. 질문 → 숫자 → 그림 → 데이터 → 병목 순으로 간다"
    synonyms: ["system design"]
    questions: ["DAU 가 10배로 늘면 병목은 어디서 어디로 옮겨 가나"]
    contains: [arch-requirements-clarification, arch-capacity-estimation, arch-high-level-design, arch-deep-dive]
    flows_to: [arch-architecture-governance]
  - id: arch-requirements-clarification
    kind: STAGE
    name: "요구사항 명확화"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "기능 요구·비기능 요구·규모·범위 밖을 먼저 정한다. 비기능 요구(지연·가용성·일관성·내구성)가 아키텍처를 가장 크게 가른다"
    questions: ["결제와 조회의 가용성·일관성 목표를 다르게 잡는 이유는 무엇인가"]
    contains: [arch-nfr-tiering, obs-availability, arch-durability]
    flows_to: [arch-capacity-estimation]
  - id: arch-nfr-tiering
    kind: MECHANISM
    name: "서비스 등급별 비기능 요구"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "결제·로그인(Tier 1)·조회(Tier 2)·분석(Tier 3)처럼 등급을 나눠 가용성·P99 지연·일관성 목표를 다르게 준다. 모든 기능에 최고 목표를 주면 비용이 폭발한다(ADR-0025)"
    synonyms: ["NFR tiering", "service tier"]
    uses:
      - arch-nfr
      - arch-quality-attribute-scenario
      - { to: obs-latency-budget, reason: "등급마다 지연 예산을 나눠 준다" }
    measured_by: [obs-availability]
  - id: arch-durability
    kind: METRIC
    name: "내구성"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 번 저장 확인된 데이터가 잃어버려지지 않을 확률. 금전 데이터와 이벤트 로그는 허용 손실이 다르며 복제·백업 설계를 가른다"
    synonyms: ["durability"]
  - id: arch-capacity-estimation
    kind: STAGE
    name: "용량 산정"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "DAU·요청 수·데이터 크기로 QPS·저장량·대역폭·캐시 크기를 어림한다. 숫자가 있어야 캐시·샤딩·큐가 필요한지 판단할 수 있다"
    questions: ["DAU 1000만, 사용자당 하루 10회 조회면 피크 QPS 는 대략 얼마인가"]
    contains: [arch-back-of-envelope, arch-peak-qps, arch-read-write-ratio]
    flows_to: [arch-high-level-design]
  - id: arch-back-of-envelope
    kind: MECHANISM
    name: "봉투 뒷면 계산"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "하루 ≈ 10^5 초, 피크 = 평균 × 3~5 같은 어림값으로 자릿수를 빠르게 잡는다. 정밀도보다 식을 함께 말해 가정을 드러내는 것이 목적이다"
    synonyms: ["back-of-the-envelope estimation", "Fermi estimation"]
    measured_by: [arch-peak-qps, arch-read-write-ratio]
  - id: arch-peak-qps
    kind: METRIC
    name: "피크 QPS"
    category: ARCHITECTURE
    level: BEGINNER
    description: "가장 붐비는 시간대의 초당 요청 수. (DAU × 사용자당 일 요청) ÷ 86,400 × 피크 배수로 어림하고, 서버 수와 DB 한계를 가르는 기준이 된다"
    synonyms: ["peak QPS", "queries per second"]
  - id: arch-read-write-ratio
    kind: METRIC
    name: "읽기·쓰기 비율"
    category: ARCHITECTURE
    level: BEGINNER
    description: "읽기 요청과 쓰기 요청의 비. 읽기 우세면 캐시·CDN·복제본, 쓰기 우세면 큐·배치·샤딩으로 설계 무게가 옮겨 간다"
    synonyms: ["read/write ratio", "read-heavy", "write-heavy"]
  - id: arch-high-level-design
    kind: STAGE
    name: "상위 수준 설계"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "클라이언트 → 엣지 → 로드 밸런서 → 게이트웨이 → 무상태 앱 → 캐시·DB·큐·검색 으로 빌딩 블록을 배치하고, 읽기 경로와 쓰기 경로를 따로 그린다"
    questions: ["앱 서버를 무상태로 두어야 수평 확장이 되는 이유는 무엇인가"]
    contains: [arch-stateless-service, arch-horizontal-scaling, arch-vertical-scaling, arch-redundancy, arch-read-path-scaling, arch-write-path-scaling, dist-fanout-on-write, dist-fanout-on-read, arch-multi-tenancy, arch-single-point-of-failure]
    flows_to: [arch-deep-dive]
  - id: arch-stateless-service
    kind: MECHANISM
    name: "무상태 서비스"
    category: ARCHITECTURE
    level: BEGINNER
    description: "요청 사이에 기억할 상태(세션 등)를 서버 메모리에 두지 않고 토큰·외부 저장소로 뺀다. 아무 인스턴스가 아무 요청을 받아도 되므로 늘리고 줄이기가 자유롭다"
    synonyms: ["stateless service", "shared-nothing"]
    uses: [jwt, redis]
  - id: arch-horizontal-scaling
    kind: MECHANISM
    name: "수평 확장"
    category: ARCHITECTURE
    level: BEGINNER
    description: "같은 인스턴스를 더 띄우고 부하를 나눠 처리량을 늘린다. 상한이 사실상 없지만 상태 공유와 데이터 분할 문제가 따라온다"
    synonyms: ["scale-out", "horizontal scaling"]
    uses: [arch-stateless-service, load-balancer, auto-scaler]
    alternative_to: [arch-vertical-scaling]
    mitigates: [arch-single-point-of-failure]
  - id: arch-vertical-scaling
    kind: MECHANISM
    name: "수직 확장"
    category: ARCHITECTURE
    level: BEGINNER
    description: "한 서버의 CPU·메모리를 키운다. 코드 변경이 없지만 한 장비의 상한과 단일 장애점이 남는다"
    synonyms: ["scale-up", "vertical scaling"]
  - id: arch-redundancy
    kind: MECHANISM
    name: "이중화"
    category: ARCHITECTURE
    level: BEGINNER
    description: "같은 역할의 구성 요소를 둘 이상 두어 하나가 죽어도 나머지가 받는다. N+1 여유와 장애 감지·전환이 함께 있어야 가용성이 오른다"
    synonyms: ["redundancy", "N+1"]
    uses:
      - health-check
      - replication
      - { to: cloud-multi-az, reason: "장애 영역을 나눠 중복을 둔다" }
    mitigates: [arch-single-point-of-failure]
  - id: arch-read-path-scaling
    kind: MECHANISM
    name: "읽기 경로 확장"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "읽기 우세 시스템에서 CDN → 캐시 → 읽기 복제본 순으로 원본 DB 앞에 층을 쌓아 원본까지 오는 읽기를 줄인다. 대가는 오래된 데이터를 볼 수 있다는 것이다"
    synonyms: ["read scaling", "read-heavy design"]
    uses:
      - caching
      - data-read-replica-routing
      - replication
      - { to: cloud-cdn, reason: "읽기를 엣지에서 끝낸다" }
  - id: arch-write-path-scaling
    kind: MECHANISM
    name: "쓰기 경로 확장"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "쓰기 우세 시스템에서 큐로 폭주를 흡수하고 워커가 일정 속도로 처리하며, 한 DB 로 모자라면 샤딩으로 쓰기를 나눈다. 재시도가 생기므로 멱등이 전제다"
    synonyms: ["write scaling", "write-heavy design", "queue-based load leveling"]
    uses:
      - queue
      - sharding
      - idempotency
      - backpressure
      - { to: kafka, reason: "쓰기를 큐에 받아 두고 소비자가 나중에 처리한다" }
      - { to: msg-point-to-point-queue, reason: "쓰기 작업을 큐로 흘려 보낸다" }
  - id: arch-multi-tenancy
    kind: MECHANISM
    name: "멀티 테넌시"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 시스템으로 여러 고객(테넌트)을 섬긴다. 공유 스키마 + 테넌트 컬럼·테넌트별 스키마·테넌트별 DB 중에서 격리 수준과 비용을 맞바꾼다"
    synonyms: ["multi-tenancy", "tenant isolation"]
  - id: arch-single-point-of-failure
    kind: PROBLEM
    name: "단일 장애점"
    category: ARCHITECTURE
    level: BEGINNER
    description: "그것 하나가 죽으면 시스템 전체가 멈추는 구성 요소. 단일 DB·단일 노드·단일 게이트웨이가 흔한 예다"
    synonyms: ["SPOF", "single point of failure"]
    measured_by: [obs-availability]
  - id: arch-deep-dive
    kind: STAGE
    name: "병목 심화와 트레이드오프"
    category: ARCHITECTURE
    level: ADVANCED
    description: "큰 그림에서 가장 위험한 두세 곳(핫 키·멱등·일관성·장애)을 골라 깊이 파고, 고른 안이 무엇을 포기했는지까지 말한다"
    questions: ["트레이드오프를 말할 때 「무엇을 골랐나」 말고 무엇을 함께 말해야 하나"]
    contains: [arch-tradeoff-analysis, arch-failure-mode-analysis, arch-scaling-path]
  - id: arch-tradeoff-analysis
    kind: MECHANISM
    name: "트레이드오프 분석"
    category: ARCHITECTURE
    level: ADVANCED
    description: "후보 설계를 품질 속성 시나리오에 대어 보고 한 속성을 올리면 어느 속성이 내려가는지(민감점·절충점)를 드러낸다. ATAM 이 이를 절차로 만든 방법이다"
    synonyms: ["trade-off analysis", "ATAM", "Architecture Tradeoff Analysis Method"]
    uses: [arch-quality-attribute-scenario, cap-theorem]
  - id: arch-failure-mode-analysis
    kind: MECHANISM
    name: "장애 모드 분석"
    category: ARCHITECTURE
    level: ADVANCED
    description: "DB 주 노드·캐시·브로커·외부 PG·리전이 각각 죽을 때 무엇이 멈추고 무엇으로 버티는지 1차·2차 방어를 표로 정한다"
    synonyms: ["failure mode analysis", "FMEA"]
    uses: [circuit-breaker, bulkhead-pattern, arch-redundancy]
    mitigates: [arch-single-point-of-failure]
  - id: arch-scaling-path
    kind: MECHANISM
    name: "단계별 확장 경로"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "단일 인스턴스 → 캐시·복제 → 클러스터·샤딩 → 다중 리전 순으로 규모 단계마다 무엇을 더할지 미리 적는다. 지금 규모에 맞는 가장 단순한 구성에서 시작한다"
    synonyms: ["scaling path", "evolutionary scaling"]
    uses: [arch-kiss, arch-horizontal-scaling]

  # ── 결정·거버넌스 ─────────────────────────────────────────
  - id: arch-architecture-governance
    kind: STAGE
    name: "아키텍처 결정과 거버넌스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "구조 결정을 기록하고, 구조를 그림으로 전하고, 합의한 구조가 코드에서 무너지지 않게 기계로 지킨다"
    questions: ["ADR 에 「고르지 않은 대안」을 적어 두는 이유는 무엇인가", "리뷰 대신 빌드 게이트로 구조 규칙을 지키면 무엇이 달라지나"]
    contains: [arch-adr, arch-c4-model, arch-4plus1-view, arch-fitness-function, arch-evolutionary-architecture, arch-architecture-erosion, arch-technical-debt]
  - id: arch-adr
    kind: MECHANISM
    name: "아키텍처 결정 기록"
    category: ARCHITECTURE
    level: BEGINNER
    description: "구조 결정 하나를 맥락·결정·대안·결과로 짧게 적고 번호를 붙여 레포에 남긴다. 결정은 지우지 않고 새 ADR 로 대체해 왜 바뀌었는지까지 남긴다"
    synonyms: ["ADR", "Architecture Decision Record"]
    code:
      - { path: docs/adr/ADR-0083-layer-structure-standard-and-gate.md, symbol: "## 결정", note: "계층 표준을 맥락·결정·대안·결과 형식으로 남긴 ADR" }
    mitigates: [arch-architecture-erosion]
  - id: arch-c4-model
    kind: MECHANISM
    name: "C4 모델"
    category: ARCHITECTURE
    level: BEGINNER
    description: "시스템 컨텍스트 → 컨테이너 → 컴포넌트 → 코드 네 수준으로 확대하며 구조를 그린다. 독자마다 필요한 확대 수준이 다르다는 전제의 표기법이다"
    synonyms: ["C4 model"]
    uses: [arch-c4-system-context, arch-c4-container, arch-c4-component, arch-c4-code]
    alternative_to: [arch-4plus1-view]
  - id: arch-4plus1-view
    kind: MECHANISM
    name: "4+1 뷰 모델"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "논리·개발·프로세스·물리 네 뷰를 시나리오(유스케이스) 하나로 묶어 검증한다. 이해관계자마다 다른 관점을 한 문서에 담는 고전적 틀이다"
    synonyms: ["4+1 architectural view model", "Kruchten"]
  - id: arch-fitness-function
    kind: MECHANISM
    name: "피트니스 함수"
    category: ARCHITECTURE
    level: ADVANCED
    description: "아키텍처 특성(계층 의존·파드 수·순환 없음)을 자동 검사로 만들어 빌드·CI 에서 매번 돌린다. 규칙을 문서가 아니라 실패하는 빌드로 지킨다"
    synonyms: ["architecture fitness function", "architecture test"]
    code:
      - { path: build.gradle.kts, symbol: "val verifyArchitecture by tasks.registering {", note: "구조 게이트를 묶어 pre-push·CI 가 이 태스크 하나만 부른다" }
    contains: [arch-layer-dependency-gate, arch-pod-topology-gate]
    mitigates: [arch-architecture-erosion, arch-layer-violation]
  - id: arch-pod-topology-gate
    kind: MECHANISM
    name: "파드 토폴로지 게이트"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "승인 목록에 없는 새 기동 앱(:app)이 생기면 빌드를 실패시킨다. 새 도메인은 기존 호스트에 :feature 로 접어야 한다는 규칙(ADR-0093)을 기계로 지킨다"
    code:
      - { path: build.gradle.kts, symbol: "val verifyPodTopology by tasks.registering {", note: "승인된 파드 목록과 실제 :app 모듈을 대조한다" }
    mitigates: [arch-over-decomposition]
  - id: arch-evolutionary-architecture
    kind: MECHANISM
    name: "진화적 아키텍처"
    category: ARCHITECTURE
    level: ADVANCED
    description: "처음부터 최종 구조를 정하지 않고 피트니스 함수로 지킬 특성만 고정한 채 작은 단계로 구조를 바꿔 간다. 되돌릴 수 있는 결정은 늦게 내리고 되돌리기 쉽게 만든다"
    synonyms: ["evolutionary architecture"]
    uses: [arch-fitness-function, arch-strangler-fig]
  - id: arch-architecture-erosion
    kind: PROBLEM
    name: "아키텍처 침식"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "합의한 구조와 실제 코드가 조금씩 어긋나, 문서의 그림이 더는 시스템을 설명하지 못하는 상태. 리뷰로만 지키는 규칙에서 흔하다"
    synonyms: ["architecture erosion", "architecture drift"]
    causes: [arch-big-ball-of-mud]
  - id: arch-technical-debt
    kind: PROBLEM
    name: "기술 부채"
    category: ARCHITECTURE
    level: BEGINNER
    description: "빨리 가려고 고른 차선의 설계가 이후 변경마다 이자처럼 추가 비용을 받는 상태. 의도한 부채는 기록하고 갚을 시점을 정해야 부채로 남는다"
    synonyms: ["technical debt"]
    causes: [arch-architecture-erosion]

  # ── 지표 ─────────────────────────────────────────────────
  - id: arch-coupling
    kind: METRIC
    name: "결합도"
    category: ARCHITECTURE
    level: BEGINNER
    description: "한 모듈을 바꿀 때 함께 바꿔야 하는 다른 모듈의 수와 강도. 낮을수록 독립 변경·배포가 쉽다"
    synonyms: ["coupling"]
  - id: arch-cohesion
    kind: METRIC
    name: "응집도"
    category: ARCHITECTURE
    level: BEGINNER
    description: "한 모듈 안의 요소가 같은 목적을 위해 모여 있는 정도. 높을수록 변경 이유가 하나로 모인다"
    synonyms: ["cohesion"]

  # ── 용어 사전 ─────────────────────────────────────────────
  - id: arch-glossary
    kind: TERM
    name: "아키텍처 용어 사전"
    category: ARCHITECTURE
    level: BEGINNER
    description: "경계·계층·품질·문서화를 읽는 데 필요한 말. 단계·장치가 아니라 그것을 설명하는 용어를 모은다"
    synonyms: ["glossary", "용어집"]
    contains: [arch-glossary-ddd, arch-glossary-layer, arch-glossary-quality, arch-glossary-coupling, arch-glossary-doc, arch-conways-law]
  - id: arch-conways-law
    kind: TERM
    name: "콘웨이 법칙"
    category: ARCHITECTURE
    level: BEGINNER
    description: "시스템 구조는 그것을 만든 조직의 소통 구조를 닮는다는 관찰. 서비스 경계와 팀 경계가 어긋나면 결국 한쪽이 다른 쪽을 따라간다"
    synonyms: ["Conway's Law"]

  - id: arch-glossary-ddd
    kind: TERM
    name: "DDD 용어"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "전략 설계와 전술 설계에서 쓰는 말"
    contains: [arch-ubiquitous-language, arch-subdomain, arch-core-domain, arch-supporting-subdomain, arch-generic-subdomain, bounded-context, arch-context-map, arch-upstream-downstream, arch-entity, value-object, aggregate, arch-invariant, arch-domain-event, arch-integration-event, arch-domain-service, arch-domain-factory, arch-ddd-module]
  - id: arch-ubiquitous-language
    kind: TERM
    name: "유비쿼터스 언어"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 바운디드 컨텍스트 안에서 업무 전문가와 개발자가 코드·문서·대화에 똑같이 쓰는 말"
    synonyms: ["Ubiquitous Language"]
  - id: arch-subdomain
    kind: TERM
    name: "하위 도메인"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "전체 업무 영역을 나눈 한 부분(주문·재고·배송). 문제 공간의 구분이고, 바운디드 컨텍스트는 그 문제를 푸는 해법 공간의 경계다"
    synonyms: ["Subdomain"]
  - id: arch-core-domain
    kind: TERM
    name: "핵심 도메인"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "회사를 경쟁자와 다르게 만드는 하위 도메인. 가장 좋은 사람과 가장 많은 설계 노력을 여기에 들이고 직접 만든다"
    synonyms: ["Core Domain"]
  - id: arch-supporting-subdomain
    kind: TERM
    name: "지원 하위 도메인"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "핵심은 아니지만 업무에 맞춰 직접 만들어야 하는 하위 도메인. 단순한 설계로 충분하다"
    synonyms: ["Supporting Subdomain"]
  - id: arch-generic-subdomain
    kind: TERM
    name: "일반 하위 도메인"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "어느 회사에나 같은 문제(인증·결제 대행·메일 발송)라 사서 쓰거나 외부 서비스로 대신하는 하위 도메인"
    synonyms: ["Generic Subdomain"]
  - id: bounded-context
    kind: TERM
    name: "바운디드 컨텍스트"
    category: ARCHITECTURE
    level: ADVANCED
    description: "하나의 도메인 모델과 그 용어가 같은 뜻으로 통하는 경계. 경계 밖에서는 같은 단어도 다른 모델이 되며, 서비스·모듈을 나누는 기준선이 된다"
    synonyms: ["Bounded Context", "BC"]
  - id: arch-context-map
    kind: TERM
    name: "컨텍스트 맵"
    category: ARCHITECTURE
    level: ADVANCED
    description: "바운디드 컨텍스트들과 그 사이 관계(공유 커널·고객-공급자·ACL 등)를 한 장에 그린 지도. 통합 비용과 팀 의존이 어디 있는지 보여 준다"
    synonyms: ["Context Map"]
  - id: arch-upstream-downstream
    kind: TERM
    name: "상류·하류"
    category: ARCHITECTURE
    level: ADVANCED
    description: "두 컨텍스트 중 모델 변경이 흘러나가는 쪽이 상류, 그 영향을 받는 쪽이 하류다. 컨텍스트 매핑 패턴은 이 힘의 방향을 기준으로 고른다"
    synonyms: ["upstream", "downstream", "U/D"]
  - id: arch-entity
    kind: TERM
    name: "엔티티"
    category: ARCHITECTURE
    level: BEGINNER
    description: "속성이 바뀌어도 식별자로 같은 것임이 유지되는 도메인 객체. 동등성을 ID 로 판단한다"
    synonyms: ["Entity"]
  - id: value-object
    kind: TERM
    name: "값 객체"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "식별자 없이 속성 값으로만 같음을 판단하는 불변 객체. 금액·ID 처럼 원시 타입에 의미와 검증을 입힐 때 쓴다"
    synonyms: ["Value Object", "VO"]
    code:
      - { path: quant/domain/src/main/kotlin/com/kgd/quant/domain/common/StrategyId.kt, symbol: "value class StrategyId(val value: UUID) {", note: "UUID 를 감싼 값 클래스로 다른 ID 와 섞이지 않게 한다" }
  - id: aggregate
    kind: TERM
    name: "애그리거트"
    category: ARCHITECTURE
    level: ADVANCED
    description: "한 트랜잭션에서 함께 일관성을 지켜야 하는 엔티티·값 객체 묶음. 바깥에서는 루트 엔티티를 통해서만 바꾸고, 다른 애그리거트는 ID 로만 참조한다"
    synonyms: ["Aggregate", "aggregate root"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/model/Inventory.kt, symbol: "class Inventory private constructor(", note: "수량 필드를 private 으로 두고 예약·해제·확정 메서드로만 바꾸는 루트" }
  - id: arch-invariant
    kind: TERM
    name: "불변식"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "모델이 어느 순간에도 참이어야 하는 규칙(가용 수량 ≥ 0, 예약 합 ≤ 재고). 애그리거트 경계는 한 트랜잭션 안에서 지켜야 하는 불변식을 기준으로 긋는다"
    synonyms: ["Invariant", "business invariant"]
  - id: arch-domain-event
    kind: TERM
    name: "도메인 이벤트"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "도메인에서 일어난 의미 있는 사실을 과거형 이름의 객체로 남긴 것(StockReserved 등). 다른 애그리거트·서비스가 이것에 반응한다"
    synonyms: ["Domain Event"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/event/InventoryEvent.kt, symbol: "sealed class InventoryEvent {", note: "재고 도메인 이벤트를 봉인 계층으로 묶는다" }
  - id: arch-integration-event
    kind: TERM
    name: "통합 이벤트"
    category: ARCHITECTURE
    level: ADVANCED
    description: "컨텍스트 경계를 넘어 다른 서비스로 보내는 이벤트. 도메인 이벤트와 달리 공개 계약이라 필드를 함부로 바꿀 수 없고 버전으로 관리한다"
    synonyms: ["Integration Event", "public event"]
  - id: arch-domain-service
    kind: TERM
    name: "도메인 서비스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "어느 한 엔티티에 두기 어색한 도메인 규칙(여러 애그리거트를 보는 계산)을 담는 상태 없는 객체. 트랜잭션·저장 같은 흐름은 갖지 않는다는 점에서 애플리케이션 서비스와 다르다"
    synonyms: ["Domain Service"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/service/WarehouseSelector.kt, symbol: "object WarehouseSelector {", note: "여러 창고 재고를 보고 출고 창고를 고르는 상태 없는 도메인 규칙" }
  - id: arch-domain-factory
    kind: TERM
    name: "도메인 팩토리"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "복잡한 애그리거트를 불변식을 만족하는 상태로만 태어나게 하는 생성 책임. 새로 만들기(create)와 저장소에서 되살리기(restore)를 다른 진입점으로 가른다"
    synonyms: ["DDD Factory"]
    code:
      - { path: inventory/domain/src/main/kotlin/com/kgd/inventory/domain/inventory/model/Inventory.kt, symbol: "fun create(productId: Long, warehouseId: Long, initialQty: Int): Inventory {", note: "초기 수량 검증을 거쳐야만 재고 애그리거트가 생긴다" }
  - id: arch-ddd-module
    kind: TERM
    name: "모듈 (DDD)"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 컨텍스트 안에서 관련 개념을 묶는 패키지. 기술 계층이 아니라 도메인 개념 이름으로 나눠 코드 구조가 유비쿼터스 언어를 따르게 한다"
    synonyms: ["Module", "DDD module"]

  - id: arch-glossary-layer
    kind: TERM
    name: "계층 용어"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "클린·헥사고날 계층 구조를 읽는 데 필요한 말"
    contains: [arch-domain-layer, arch-application-layer, arch-infrastructure-layer, arch-presentation-layer, arch-usecase, arch-application-service, arch-inbound-port, arch-outbound-port, arch-dto, arch-composition-root, arch-dependency-rule]
  - id: arch-domain-layer
    kind: TERM
    name: "도메인 계층"
    category: ARCHITECTURE
    level: BEGINNER
    description: "엔티티·값 객체·도메인 이벤트·정책이 사는 가장 안쪽 계층. 이 레포는 별도 Gradle 모듈로 떼어 Spring·JPA 의존을 컴파일 단계에서 막는다"
    synonyms: ["domain layer"]
  - id: arch-application-layer
    kind: TERM
    name: "애플리케이션 계층"
    category: ARCHITECTURE
    level: BEGINNER
    description: "유스케이스 인터페이스·서비스·포트를 두고 트랜잭션과 흐름을 조율하는 계층. 규칙은 도메인에 위임하고 기술 세부는 포트 뒤로 숨긴다"
    synonyms: ["application layer"]
  - id: arch-infrastructure-layer
    kind: TERM
    name: "인프라 계층"
    category: ARCHITECTURE
    level: BEGINNER
    description: "DB·외부 API·메시징·캐시를 다루는 어댑터가 사는 계층. 포트를 구현하고 기술 예외를 도메인·애플리케이션 예외로 바꾼다"
    synonyms: ["infrastructure layer"]
  - id: arch-presentation-layer
    kind: TERM
    name: "표현 계층"
    category: ARCHITECTURE
    level: BEGINNER
    description: "HTTP 요청·응답과 입력 검증을 맡는 계층. 컨트롤러는 유스케이스만 부르고 업무 로직과 DB 접근을 갖지 않는다"
    synonyms: ["presentation layer", "web layer"]
  - id: arch-usecase
    kind: TERM
    name: "유스케이스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "사용자가 시스템으로 이루려는 한 가지 목적과 그 처리 흐름. 이 레포는 유스케이스마다 인터페이스를 두고 입력·출력을 안쪽 data class 로 정한다"
    synonyms: ["Use Case", "interactor"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/application/inventory/usecase/ReserveStockUseCase.kt, symbol: "data class Command(val orderId: Long", note: "유스케이스 입력을 인터페이스 안의 Command 로 정한다" }
  - id: arch-application-service
    kind: TERM
    name: "애플리케이션 서비스"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "유스케이스 인터페이스를 구현해 도메인 객체를 불러오고 시키고 저장하는 조율자. 업무 규칙을 직접 갖지 않는다"
    synonyms: ["Application Service"]
  - id: arch-inbound-port
    kind: TERM
    name: "인바운드 포트"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "바깥(컨트롤러·컨슈머)이 코어를 부르는 입구 인터페이스. 이 레포에서는 유스케이스 인터페이스가 그 역할이다"
    synonyms: ["inbound port", "driving port", "primary port"]
  - id: arch-outbound-port
    kind: TERM
    name: "아웃바운드 포트"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "코어가 바깥 기능(저장·외부 호출·발행)을 부르는 출구 인터페이스. application/{entity}/port 에 두고 infrastructure 가 구현한다"
    synonyms: ["outbound port", "driven port", "secondary port"]
  - id: arch-dto
    kind: TERM
    name: "DTO"
    category: ARCHITECTURE
    level: BEGINNER
    description: "계층·프로세스 경계를 넘을 때 데이터만 담아 옮기는 객체. 도메인 객체를 API 응답으로 바로 내보내지 않게 해 내부 모델 변경이 외부 계약을 깨지 않게 한다"
    synonyms: ["Data Transfer Object", "request/response DTO"]
    code:
      - { path: inventory/feature/src/main/kotlin/com/kgd/inventory/presentation/inventory/dto/InventoryRequestDtos.kt, symbol: "data class ReserveRequest(", note: "표현 계층 전용 요청 DTO" }
  - id: arch-composition-root
    kind: TERM
    name: "합성 루트"
    category: ARCHITECTURE
    level: ADVANCED
    description: "모든 모듈의 구현을 조립해 객체 그래프를 완성하는 단 하나의 진입점. 폴드 호스트 앱이 그 자리라서 도메인 사이 교차 참조가 허용되는 유일한 곳이다"
    synonyms: ["Composition Root"]
    code:
      - { path: commerce/app/src/main/kotlin/com/kgd/commerce/CommerceApplication.kt, symbol: "@SpringBootApplication(scanBasePackages", note: "commerce 호스트가 도메인 feature 들을 한 컨텍스트로 조립한다" }
  - id: arch-dependency-rule
    kind: TERM
    name: "의존성 규칙"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "소스 코드 의존은 항상 바깥에서 안쪽(도메인)으로만 향한다는 규칙. 안쪽이 바깥 기능이 필요하면 인터페이스를 안쪽에 두고 바깥이 구현한다(의존성 역전)"
    synonyms: ["Dependency Rule", "의존성 역전"]

  - id: arch-glossary-quality
    kind: TERM
    name: "품질 속성 용어"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "아키텍처가 기능 말고 무엇을 보장해야 하는지 말하는 용어. 품질 속성끼리는 서로 부딪쳐 트레이드오프가 된다"
    synonyms: ["quality attributes", "architecture characteristics", "-ilities"]
    contains: [arch-functional-requirement, arch-nfr, arch-quality-attribute-scenario, arch-scalability, arch-elasticity, arch-reliability, arch-fault-tolerance, arch-performance, arch-maintainability, arch-testability, arch-deployability, arch-interoperability, arch-portability]
  - id: arch-functional-requirement
    kind: TERM
    name: "기능 요구사항"
    category: ARCHITECTURE
    level: BEGINNER
    description: "시스템이 무엇을 해야 하는지(주문 생성·조회)에 대한 요구. 같은 기능 요구도 비기능 요구에 따라 전혀 다른 구조가 된다"
    synonyms: ["functional requirement", "FR"]
  - id: arch-nfr
    kind: TERM
    name: "비기능 요구사항"
    category: ARCHITECTURE
    level: BEGINNER
    description: "시스템이 얼마나 잘 해야 하는지(지연·가용성·일관성·보안·비용)에 대한 요구. 아키텍처 결정을 실제로 가르는 쪽은 대개 이것이다"
    synonyms: ["non-functional requirement", "NFR"]
  - id: arch-quality-attribute-scenario
    kind: TERM
    name: "품질 속성 시나리오"
    category: ARCHITECTURE
    level: ADVANCED
    description: "자극원·자극·환경·대상·응답·응답 측정 여섯 칸으로 품질 요구를 시험 가능한 문장으로 적은 것(「피크 시 주문 API 가 P99 100ms 안에 응답한다」)"
    synonyms: ["quality attribute scenario"]
  - id: arch-scalability
    kind: TERM
    name: "확장성"
    category: ARCHITECTURE
    level: BEGINNER
    description: "부하가 늘 때 자원을 더해 성능을 비례에 가깝게 유지하는 능력. 수평·수직 확장 중 무엇이 가능한지가 구조를 가른다"
    synonyms: ["scalability"]
  - id: arch-elasticity
    kind: TERM
    name: "탄력성"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "순간 부하에 맞춰 자원을 자동으로 늘렸다 줄이는 능력. 확장성이 「늘릴 수 있나」라면 탄력성은 「빨리, 자동으로」다"
    synonyms: ["elasticity"]
  - id: arch-reliability
    kind: TERM
    name: "신뢰성"
    category: ARCHITECTURE
    level: BEGINNER
    description: "정해진 조건에서 정해진 기간 동안 올바르게 동작하는 능력. 가용성(켜져 있음)과 달리 결과가 맞는지까지 본다"
    synonyms: ["reliability"]
  - id: arch-fault-tolerance
    kind: TERM
    name: "내결함성"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "구성 요소 일부가 고장 나도 시스템이 계속 (저하된 상태로라도) 동작하는 능력. 이중화·격리·재시도가 수단이다"
    synonyms: ["fault tolerance", "resilience"]
  - id: arch-performance
    kind: TERM
    name: "성능"
    category: ARCHITECTURE
    level: BEGINNER
    description: "주어진 자원으로 얼마나 빨리(지연) 얼마나 많이(처리량) 처리하는가. 확장성과 달리 규모를 고정한 채 본다"
    synonyms: ["performance", "performance efficiency"]
  - id: arch-maintainability
    kind: TERM
    name: "유지보수성"
    category: ARCHITECTURE
    level: BEGINNER
    description: "변경을 얼마나 빠르고 안전하게 할 수 있는가. 모듈성·분석 용이성·수정 용이성으로 나뉘며 결합도·응집도·복잡도로 대신 잰다"
    synonyms: ["maintainability", "modifiability"]
  - id: arch-testability
    kind: TERM
    name: "테스트 용이성"
    category: ARCHITECTURE
    level: BEGINNER
    description: "구성 요소를 격리해 결과를 관찰·검증하기 쉬운 정도. 프레임워크 없는 도메인과 포트 뒤의 의존이 이것을 올린다"
    synonyms: ["testability"]
  - id: arch-deployability
    kind: TERM
    name: "배포 용이성"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "변경을 얼마나 자주·작게·위험 없이 운영에 내보낼 수 있는가. 배포 단위의 크기와 서비스 사이 결합이 좌우한다"
    synonyms: ["deployability"]
  - id: arch-interoperability
    kind: TERM
    name: "상호 운용성"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "다른 시스템과 정해진 형식·프로토콜로 정보를 주고받아 함께 동작하는 능력. 공표된 언어와 표준 프로토콜이 수단이다"
    synonyms: ["interoperability"]
  - id: arch-portability
    kind: TERM
    name: "이식성"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "다른 환경(클라우드·CPU 아키텍처·DB)으로 옮겨 돌리기 쉬운 정도. 컨테이너와 포트-어댑터가 이것을 올린다"
    synonyms: ["portability"]

  - id: arch-glossary-coupling
    kind: TERM
    name: "결합·응집 용어"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "결합과 응집의 종류와 강도를 말하는 용어"
    contains: [arch-connascence, arch-coupling-kinds, arch-cohesion-kinds]
  - id: arch-connascence
    kind: TERM
    name: "코나센스"
    category: ARCHITECTURE
    level: ADVANCED
    description: "한 요소를 바꾸면 다른 요소도 바꿔야 하는 관계를 이름·타입·의미·위치·알고리즘(정적)과 실행 순서·시점·값·정체(동적)로 나눠 강도를 매긴 결합 분류. 강한 코나센스일수록 가까이 두어야 한다"
    synonyms: ["connascence"]
  - id: arch-coupling-kinds
    kind: TERM
    name: "결합 종류"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "모듈이 서로에게 기대는 방식을 나쁜 것(내용 결합)부터 좋은 것(자료 결합)까지 줄 세운 분류"
    synonyms: ["types of coupling"]
    contains: [arch-content-coupling, arch-common-coupling, arch-control-coupling, arch-stamp-coupling, arch-data-coupling]
  - id: arch-content-coupling
    kind: TERM
    name: "내용 결합"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 모듈이 다른 모듈의 내부 데이터나 코드를 직접 건드리는 가장 강한 결합. 남의 테이블을 직접 읽는 서비스가 예다"
    synonyms: ["content coupling"]
  - id: arch-common-coupling
    kind: TERM
    name: "공통 결합"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "여러 모듈이 같은 전역 데이터(전역 변수·공유 테이블)를 함께 읽고 쓰는 결합"
    synonyms: ["common coupling", "global coupling"]
  - id: arch-control-coupling
    kind: TERM
    name: "제어 결합"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "호출자가 플래그를 넘겨 피호출자의 내부 분기를 정하는 결합. 호출자가 상대 내부 논리를 알아야 한다"
    synonyms: ["control coupling"]
  - id: arch-stamp-coupling
    kind: TERM
    name: "스탬프 결합"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "필요한 것은 일부인데 큰 자료 구조 전체를 넘기는 결합. 쓰지 않는 필드의 변경에도 영향을 받는다"
    synonyms: ["stamp coupling", "data-structured coupling"]
  - id: arch-data-coupling
    kind: TERM
    name: "자료 결합"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "필요한 값만 인자로 주고받는 가장 약한 결합"
    synonyms: ["data coupling"]
  - id: arch-cohesion-kinds
    kind: TERM
    name: "응집 종류"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "모듈 안 요소가 묶인 이유를 좋은 것(기능 응집)부터 나쁜 것(우연 응집)까지 줄 세운 분류"
    synonyms: ["types of cohesion"]
    contains: [arch-functional-cohesion, arch-sequential-cohesion, arch-communicational-cohesion, arch-procedural-cohesion, arch-temporal-cohesion, arch-logical-cohesion, arch-coincidental-cohesion]
  - id: arch-functional-cohesion
    kind: TERM
    name: "기능 응집"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "모든 요소가 하나의 잘 정의된 일을 위해 모인 가장 강한 응집"
    synonyms: ["functional cohesion"]
  - id: arch-sequential-cohesion
    kind: TERM
    name: "순차 응집"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "한 요소의 출력이 다음 요소의 입력이 되는 순서로 묶인 응집"
    synonyms: ["sequential cohesion"]
  - id: arch-communicational-cohesion
    kind: TERM
    name: "통신 응집"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "같은 입력 데이터를 쓰거나 같은 출력을 만든다는 이유로 묶인 응집"
    synonyms: ["communicational cohesion"]
  - id: arch-procedural-cohesion
    kind: TERM
    name: "절차 응집"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "정해진 실행 순서를 따른다는 이유만으로 묶였고 데이터는 주고받지 않는 응집"
    synonyms: ["procedural cohesion"]
  - id: arch-temporal-cohesion
    kind: TERM
    name: "시간 응집"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "같은 시점(기동 시·종료 시)에 실행된다는 이유로 묶인 응집. 초기화 모듈이 전형이다"
    synonyms: ["temporal cohesion"]
  - id: arch-logical-cohesion
    kind: TERM
    name: "논리 응집"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "비슷한 부류의 일이라는 이유로 묶이고 호출 시 플래그로 하나를 고르는 응집. utils 클래스가 흔한 예다"
    synonyms: ["logical cohesion"]
  - id: arch-coincidental-cohesion
    kind: TERM
    name: "우연 응집"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "아무 관계 없는 요소가 우연히 한 모듈에 들어간 가장 약한 응집"
    synonyms: ["coincidental cohesion"]

  - id: arch-glossary-doc
    kind: TERM
    name: "아키텍처 문서화 용어"
    category: ARCHITECTURE
    level: BEGINNER
    description: "구조를 그림과 문서로 전할 때 쓰는 말"
    contains: [arch-c4-system-context, arch-c4-container, arch-c4-component, arch-c4-code]
  - id: arch-c4-system-context
    kind: TERM
    name: "시스템 컨텍스트 다이어그램"
    category: ARCHITECTURE
    level: BEGINNER
    description: "C4 1단계. 시스템 하나를 상자로 두고 그 시스템을 쓰는 사람과 주고받는 외부 시스템만 그린다"
    synonyms: ["C4 Level 1", "System Context diagram"]
  - id: arch-c4-container
    kind: TERM
    name: "컨테이너 다이어그램"
    category: ARCHITECTURE
    level: BEGINNER
    description: "C4 2단계. 따로 배포·실행되는 단위(웹 앱·API·DB·브로커)와 그 사이 통신을 그린다. 도커 컨테이너와는 다른 뜻이다"
    synonyms: ["C4 Level 2", "Container diagram"]
  - id: arch-c4-component
    kind: TERM
    name: "컴포넌트 다이어그램"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "C4 3단계. 컨테이너 하나 안의 주요 구성 요소(컨트롤러·유스케이스·어댑터)와 책임을 그린다"
    synonyms: ["C4 Level 3", "Component diagram"]
  - id: arch-c4-code
    kind: TERM
    name: "코드 다이어그램"
    category: ARCHITECTURE
    level: INTERMEDIATE
    description: "C4 4단계. 컴포넌트 안의 클래스·인터페이스 관계(UML 클래스도)다. 코드에서 자동 생성하거나 생략한다"
    synonyms: ["C4 Level 4", "Code diagram"]

  # ── 구현체 ───────────────────────────────────────────────
  - id: spring-boot
    kind: TECHNOLOGY
    name: "Spring Boot"
    category: INFRASTRUCTURE
    level: BEGINNER
    description: "자동 구성과 내장 서버로 Spring 애플리케이션을 바로 띄우는 프레임워크. 이 레포의 모든 JVM 서비스와 폴드 호스트가 이것으로 기동한다"
    synonyms: ["Spring", "스프링 부트"]
    code:
      - { path: commerce/app/src/main/kotlin/com/kgd/commerce/CommerceApplication.kt, symbol: "@SpringBootApplication", note: "commerce 폴드 호스트의 진입점" }
    implements:
      - { to: arch-modular-monolith, reason: "scanBasePackages 로 여러 도메인 :feature 를 한 컨텍스트에 싣는다" }
      - { to: proxy-pattern, reason: "@Transactional 등 AOP 를 프록시 빈으로 건다" }
      - { to: singleton-pattern, reason: "빈 기본 스코프가 싱글톤이다" }
      - { to: arch-shared-library, reason: "auto-configuration 으로 공통 기능을 설정 한 줄로 켠다" }
      - { to: spring-auto-configuration, reason: "Boot 가 자동 구성을 제공한다" }
      - { to: spring-conditional-bean, reason: "조건부 빈 등록" }
      - { to: spring-externalized-config, reason: "외부 설정 바인딩" }
      - { to: spring-profile, reason: "프로파일별 설정" }
      - { to: spring-graceful-shutdown, reason: "server.shutdown=graceful" }
