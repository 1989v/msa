    uses: [backpressure]
    mitigates: [conc-unbounded-buffer]
  - id: conc-reactor-coroutine-bridge
    kind: MECHANISM
    name: "Reactor ↔ 코루틴 연결"
    category: CONCURRENCY
    level: ADVANCED
    description: "Mono 를 awaitSingle 로 suspend 결과로, Flux 를 asFlow 로 Flow 로 바꾸고 반대로 mono{}·asFlux 로 감싼다. WebClient 같은 리액티브 API 를 코루틴 코드에서 순차 모양으로 쓴다"
    synonyms: ["kotlinx-coroutines-reactor", "awaitSingle", "asFlow", "mono {}"]
    code:
      - { path: quant/feature/src/main/kotlin/com/kgd/quant/infrastructure/exchange/BithumbMarketAdapter.kt, symbol: ".awaitSingle()", note: "WebClient 응답 Mono 를 suspend 결과로 받는다" }
    uses: [coroutine, reactive-streams]
  - id: conc-unbounded-buffer
    kind: PROBLEM
    name: "무한 버퍼"
    category: CONCURRENCY
    level: ADVANCED
    description: "소비가 느린데 넘침 전략 없이 버퍼를 무한으로 두거나 request(Long.MAX) 로 구독해 쌓인 값이 힙을 채우는 상태. 배압이 끊긴 자리가 OOM 의 자리다"
    synonyms: ["unbounded buffer", "onBackpressureBuffer 무한"]
    causes: [rt-oom-heap-space]
  - id: conc-unsubscribed-publisher
    kind: PROBLEM
    name: "구독 누락"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "Mono·Flux 를 만들기만 하고 반환하거나 subscribe 하지 않아 아무 동작도 일어나지 않는 상태. 조립 시점과 구독 시점을 헷갈릴 때 생긴다"
    synonyms: ["nothing happens until you subscribe"]

  # ── 실행 문맥 전달 ──
  - id: conc-context-propagation
    kind: STAGE
    name: "실행 문맥 전달"
    category: CONCURRENCY
    level: ADVANCED
    description: "요청 id·인증·트랜잭션·로그 MDC 처럼 요청을 따라가야 하는 값을 실행 단위에 싣는다. 스레드가 바뀌는 비동기·코루틴·리액티브에서는 스레드에 붙인 값이 끊기므로 운반 수단을 고른다"
    questions: ["스레드 풀에서 ThreadLocal 을 remove 하지 않으면 무슨 일이 생기나", "코루틴에서 MDC 가 사라지는 이유는 무엇인가"]
    contains: [conc-thread-local, conc-inheritable-thread-local, conc-scoped-value, conc-mdc-propagation, conc-reactor-context, conc-thread-context-element, conc-threadlocal-leak]
    flows_to: [conc-io-model]
  - id: conc-thread-local
    kind: MECHANISM
    name: "ThreadLocal"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "스레드마다 따로 값을 두는 변수. 각 스레드의 ThreadLocalMap 에 약한 키로 저장된다. 요청 문맥·스레드 비안전 객체 재사용에 쓰고, 풀 스레드에서는 끝날 때 remove 해야 한다"
    synonyms: ["ThreadLocal", "ThreadLocalMap"]
    questions: ["ThreadLocalMap 의 키만 약한 참조인 것이 왜 누수를 막지 못하나"]
    causes:
      - conc-threadlocal-leak
      - { to: spring-reactor-context-loss, reason: "스레드가 바뀌면 ThreadLocal 값이 사라진다" }
  - id: conc-inheritable-thread-local
    kind: MECHANISM
    name: "InheritableThreadLocal"
    category: CONCURRENCY
    level: ADVANCED
    description: "자식 스레드를 만들 때 부모의 값을 복사한다. 스레드 풀은 스레드를 재사용하므로 처음 만든 요청의 값이 그대로 남아 다른 요청에 샌다"
    synonyms: ["InheritableThreadLocal"]
    causes: [conc-threadlocal-leak]
  - id: conc-scoped-value
    kind: MECHANISM
    name: "ScopedValue"
    category: CONCURRENCY
    level: ADVANCED
    description: "정해진 호출 범위 안에서만 읽히는 불변 문맥 값(JEP 446). 범위가 끝나면 자동으로 사라지고 구조화된 동시성의 하위 작업에 복사 없이 물려준다. 가상 스레드 수백만 개에서도 싸다"
    synonyms: ["ScopedValue", "JEP 446", "JEP 464"]
    alternative_to:
      - { to: conc-thread-local, reason: "변경 불가·범위 한정이라 remove 누락 누수가 없고 가상 스레드에 싸다" }
  - id: conc-mdc-propagation
    kind: MECHANISM
    name: "MDC 전파"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "로그의 traceId 같은 MDC 값은 ThreadLocal 이라 스레드가 바뀌면 사라진다. 실행기를 감싸 제출 시점 값을 복사하거나, 코루틴 MDCContext·Reactor Context 브리지로 옮겨 싣는다"
    synonyms: ["MDC", "MDCContext", "TaskDecorator"]
    uses: [conc-thread-local, conc-thread-context-element]
    mitigates:
      - { to: spring-reactor-context-loss, reason: "MDC 를 스레드 전환 너머로 옮긴다" }
  - id: conc-reactor-context
    kind: MECHANISM
    name: "Reactor Context"
    category: CONCURRENCY
    level: ADVANCED
    description: "구독 경로를 따라 아래에서 위로 전달되는 불변 키-값 저장소. 연산자가 스레드를 옮겨도 값이 따라가므로 WebFlux 에서 ThreadLocal 대신 인증·추적 값을 싣는다"
    synonyms: ["Reactor Context", "contextWrite", "ContextView"]
    alternative_to:
      - { to: conc-thread-local, reason: "스레드가 아니라 구독에 붙어 스케줄러를 건너도 끊기지 않는다" }
    mitigates: [spring-reactor-context-loss]
  - id: conc-thread-context-element
    kind: MECHANISM
    name: "ThreadContextElement"
    category: CONCURRENCY
    level: ADVANCED
    description: "코루틴이 재개될 때마다 ThreadLocal 값을 설정하고 중단될 때 되돌리는 코루틴 문맥 원소. ThreadLocal.asContextElement() 와 MDCContext 가 이것이다"
    synonyms: ["asContextElement", "ThreadContextElement"]
    uses: [conc-coroutine-context]
  - id: conc-threadlocal-leak
    kind: PROBLEM
    name: "ThreadLocal 누수"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "풀 스레드에 남은 ThreadLocal 값이 다음 요청에 섞이거나(교차 오염), 값이 클래스로더를 붙잡아 재배포 때 Metaspace 가 새는 상태"
    synonyms: ["ThreadLocal leak", "cross-request leak"]
    causes: [rt-classloader-leak]

  # ── IO 모델 ──
  - id: conc-io-model
    kind: STAGE
    name: "IO 모델 선택"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "연결을 어떻게 기다릴지 정한다 — 연결마다 스레드가 막혀 기다릴지, 한 스레드가 여러 소켓의 준비를 감시할지(다중화), 커널이 끝낸 결과를 받을지(비동기 IO)"
    questions: ["IO 다중화는 동기인가 비동기인가", "epoll 이 select 보다 빠른 이유는 무엇인가"]
    contains: [conc-thread-per-connection, conc-blocking-io, conc-nonblocking-io, conc-io-multiplexing, conc-async-io, conc-java-nio, conc-zero-copy, conc-c10k]
    flows_to: [conc-event-driven-server]
    uses: [conc-io-two-phases, conc-sync-async, conc-blocking-nonblocking]
  - id: conc-thread-per-connection
    kind: MECHANISM
    name: "연결당 스레드"
    category: CONCURRENCY
    level: BEGINNER
    description: "연결(요청) 하나에 스레드 하나를 붙여 블로킹 IO 로 처리한다. 코드가 단순하지만 동시 연결 수가 스레드 수에 묶이고, 스레드마다 스택과 전환 비용이 든다. 서블릿·Tomcat 의 기본 모델이다"
    synonyms: ["thread-per-connection", "thread-per-request"]
    uses: [conc-blocking-io, thread-pool]
    causes: [conc-c10k]
  - id: conc-blocking-io
    kind: MECHANISM
    name: "블로킹 IO"
    category: CONCURRENCY
    level: BEGINNER
    description: "read 가 데이터가 준비되고 사용자 버퍼로 복사될 때까지 호출한 스레드를 재운다. 두 단계(준비 대기·복사) 모두에서 막힌다"
    synonyms: ["blocking IO", "BIO"]
  - id: conc-nonblocking-io
    kind: MECHANISM
    name: "논블로킹 IO"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "소켓을 O_NONBLOCK 으로 두면 준비가 안 됐을 때 read 가 EAGAIN 으로 곧바로 돌아온다. 혼자 쓰면 계속 다시 묻는 바쁜 대기가 되어 다중화와 함께 쓴다"
    synonyms: ["non-blocking IO", "O_NONBLOCK", "EAGAIN"]
  - id: conc-io-multiplexing
    kind: MECHANISM
    name: "IO 다중화"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "한 스레드가 여러 fd 중 준비된 것을 커널에 물어 한꺼번에 받는다. 준비 대기만 공유하고 복사는 여전히 호출 스레드가 하므로 동기 IO 로 분류된다"
    synonyms: ["IO multiplexing", "event demultiplexer"]
    contains: [conc-select, conc-poll, conc-epoll, conc-kqueue]
    uses: [conc-nonblocking-io, conc-edge-level-trigger]
    mitigates: [conc-c10k]
  - id: conc-select
    kind: MECHANISM
    name: "select"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "감시할 fd 를 비트맵으로 넘기고 준비된 것을 비트맵으로 돌려받는 가장 오래된 다중화(1983, BSD). fd 1024 개 상한이 있고, 호출마다 전체를 복사·순회해 O(n) 이다"
    synonyms: ["select", "FD_SETSIZE"]
  - id: conc-poll
    kind: MECHANISM
    name: "poll"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "fd 를 배열로 넘겨 1024 상한을 없앤 다중화. 여전히 호출마다 목록 전체를 커널에 복사하고 전부 훑는다"
    synonyms: ["poll"]
    alternative_to:
      - { to: conc-select, reason: "fd 수 상한 없이 같은 방식으로 감시한다" }
  - id: conc-epoll
    kind: MECHANISM
    name: "epoll"
    category: CONCURRENCY
    level: ADVANCED
    description: "커널에 감시 목록을 한 번 등록해 두고(epoll_ctl) 준비된 fd 만 돌려받는(epoll_wait) 리눅스 다중화. 연결 수와 무관하게 준비된 수만큼만 일한다. Netty·nginx·Node 의 바탕이다"
    synonyms: ["epoll", "epoll_wait", "epoll_ctl"]
    questions: ["엣지 트리거에서 데이터를 끝까지 읽지 않으면 무슨 일이 생기나"]
    alternative_to:
      - { to: conc-poll, reason: "목록을 커널에 두고 준비된 것만 받아 fd 1만 개에서도 O(준비 수)다" }
  - id: conc-kqueue
    kind: MECHANISM
    name: "kqueue"
    category: CONCURRENCY
    level: ADVANCED
    description: "BSD·macOS 의 이벤트 통지 장치. 소켓뿐 아니라 파일 변경·시그널·타이머도 한 큐로 받는다. 자바 NIO Selector 가 macOS 에서 이것을 쓴다"
    synonyms: ["kqueue", "kevent"]
    alternative_to:
      - { to: conc-epoll, reason: "BSD 계열에서 같은 준비 통지를 더 일반화된 이벤트 필터로 준다" }
  - id: conc-async-io
    kind: MECHANISM
    name: "비동기 IO"
    category: CONCURRENCY
    level: ADVANCED
    description: "요청만 커널에 넘기고 돌아온 뒤, 데이터 복사까지 끝났다는 완료 통지를 받는다. 두 단계 모두 호출자가 막히지 않는다"
    synonyms: ["asynchronous IO", "AIO", "completion-based IO"]
    contains: [conc-iocp, conc-posix-aio, conc-io-uring]
    uses: [conc-io-two-phases]
  - id: conc-iocp
    kind: MECHANISM
    name: "IOCP"
    category: CONCURRENCY
    level: ADVANCED
    description: "윈도우의 완료 포트. 겹친(overlapped) IO 를 걸어 두면 커널이 끝난 작업을 포트 큐에 넣고 워커 스레드가 꺼내 처리한다. 프로액터 패턴의 대표 구현이다"
    synonyms: ["IO Completion Port", "IOCP"]
  - id: conc-posix-aio
    kind: MECHANISM
    name: "POSIX AIO"
    category: CONCURRENCY
    level: ADVANCED
    description: "aio_read 등 POSIX 비동기 IO. 리눅스에서는 glibc 가 스레드로 흉내 내거나(libaio 는 O_DIRECT 파일만) 제약이 커서 DB 의 직접 IO 말고는 거의 쓰이지 않았다"
    synonyms: ["POSIX AIO", "libaio"]
  - id: conc-io-uring
    kind: MECHANISM
    name: "io_uring"
    category: CONCURRENCY
    level: ADVANCED
    description: "사용자와 커널이 공유하는 제출 링(SQE)·완료 링(CQE)으로 IO 를 주고받는 리눅스 5.1+ 인터페이스. 여러 요청을 시스템 콜 한 번에 넣고, SQPOLL 이면 시스템 콜 없이도 된다. 보안 이슈로 막아 둔 환경이 많다"
    synonyms: ["io_uring", "SQE", "CQE", "SQPOLL"]
    alternative_to:
      - { to: conc-epoll, reason: "준비 통지가 아니라 완료 통지를 받고 시스템 콜 수를 묶어서 줄인다" }
  - id: conc-java-nio
    kind: MECHANISM
    name: "Java NIO"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "Channel·Buffer·Selector 세 추상으로 논블로킹 IO 를 쓰는 JDK 1.4 API. Selector 가 운영체제의 epoll·kqueue 를 감싼다"
    synonyms: ["NIO", "java.nio"]
    contains: [conc-nio-selector, conc-nio-channel, conc-byte-buffer, conc-nio2-async-channel]
  - id: conc-nio-selector
    kind: MECHANISM
    name: "Selector"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "여러 채널을 등록해 두고 select() 로 준비된 SelectionKey 들을 받는다. 처리한 키를 selectedKeys 에서 직접 지워야 다음에 다시 안 나온다"
    synonyms: ["Selector", "SelectionKey"]
    uses: [conc-epoll, conc-kqueue]
  - id: conc-nio-channel
    kind: MECHANISM
    name: "Channel"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "fd 를 감싼 양방향 IO 통로. SocketChannel·ServerSocketChannel·FileChannel 이 있고, configureBlocking(false) 로 논블로킹이 된다"
    synonyms: ["SocketChannel", "FileChannel", "ServerSocketChannel"]
  - id: conc-byte-buffer
    kind: MECHANISM
    name: "ByteBuffer"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "position·limit·capacity·mark 네 포인터로 읽기·쓰기 모드를 오가는 바이트 버퍼. 쓰고 나서 flip 해야 읽힌다. 힙 버퍼와 힙 밖 다이렉트 버퍼가 있다"
    synonyms: ["ByteBuffer", "flip", "heap buffer", "direct buffer"]
    uses: [rt-direct-memory]
  - id: conc-nio2-async-channel
    kind: MECHANISM
    name: "AsynchronousChannel"
    category: CONCURRENCY
    level: ADVANCED
    description: "JDK 7 NIO.2 의 완료 기반 채널. CompletionHandler 나 Future 로 결과를 받는다. 리눅스에서는 내부적으로 epoll + 스레드 풀로 흉내 내 이점이 작아 널리 쓰이지 않았다"
    synonyms: ["NIO.2", "AsynchronousSocketChannel", "CompletionHandler"]
    uses: [conc-async-io]
  - id: conc-zero-copy
    kind: MECHANISM
    name: "제로 카피"
    category: CONCURRENCY
    level: ADVANCED
    description: "파일을 소켓으로 보낼 때 사용자 공간을 거치지 않고 커널 안에서 넘겨 복사와 모드 전환을 줄인다. Kafka 가 로그 세그먼트를 컨슈머에 보내는 방식이다"
    synonyms: ["zero-copy"]
    contains: [conc-sendfile]
    uses: [data-page-cache, rt-mmap]
  - id: conc-sendfile
    kind: MECHANISM
    name: "sendfile · transferTo"
    category: CONCURRENCY
    level: ADVANCED
    description: "페이지 캐시의 파일 내용을 소켓 버퍼로 커널 안에서 바로 넘기는 시스템 콜. 자바에서는 FileChannel.transferTo 가 이것을 부른다. splice 는 파이프를 거치는 변형이다"
    synonyms: ["sendfile", "FileChannel.transferTo", "splice"]
  - id: conc-c10k
    kind: PROBLEM
    name: "C10K 문제"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "동시 연결 1만 개를 연결당 스레드로 받으면 스택 메모리·컨텍스트 스위치·커널 자료구조·락 경합이 한꺼번에 한계에 닿는 문제(1999). 다중화와 이벤트 루프가 그 답이었다"
    synonyms: ["C10K", "C10M"]

  # ── 이벤트 루프 서버 ──
  - id: conc-event-driven-server
    kind: STAGE
    name: "이벤트 루프 서버 구성"
    category: CONCURRENCY
    level: ADVANCED
    description: "적은 수의 이벤트 루프 스레드가 다중화로 받은 준비 이벤트를 핸들러로 돌린다. 루프를 몇 개 두고, 연결 수락과 처리를 나눌지, 블로킹 작업을 어디로 뺄지 정한다"
    questions: ["Netty EventLoop 가 스레드 하나인 이유는 무엇인가", "리액터와 프로액터는 무엇이 다른가"]
    contains: [conc-event-loop, conc-reactor-pattern, conc-proactor-pattern, conc-netty-event-loop-group, conc-channel-pipeline, conc-netty-bytebuf, conc-fast-thread-local, conc-hashed-wheel-timer, reactor-netty, conc-event-loop-blocking, conc-bytebuf-leak]
    flows_to: [conc-diagnosis]
  - id: conc-event-loop
    kind: MECHANISM
    name: "이벤트 루프"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "스레드 하나가 준비된 이벤트를 기다렸다 핸들러를 차례로 부르는 무한 루프. 한 연결은 항상 같은 루프에서 처리되어 동기화가 필요 없고, 대신 핸들러가 막히면 루프 전체가 멈춘다"
    synonyms: ["event loop"]
    uses: [conc-io-multiplexing, conc-thread-confinement]
    causes: [conc-event-loop-blocking]
  - id: conc-reactor-pattern
    kind: MECHANISM
    name: "리액터 패턴"
    category: CONCURRENCY
    level: ADVANCED
    description: "다중화기가 '읽을 준비가 됐다'는 이벤트를 알려 주면 디스패처가 등록된 핸들러를 불러 직접 읽고 처리한다. 준비 통지 모델이라 리눅스 epoll 과 맞는다"
    synonyms: ["Reactor pattern", "Doug Lea Scalable IO"]
    contains: [conc-multi-reactor]
    uses: [conc-io-multiplexing]
  - id: conc-multi-reactor
    kind: MECHANISM
    name: "멀티 리액터"
    category: CONCURRENCY
    level: ADVANCED
    description: "연결 수락만 하는 메인 리액터와 수락된 연결의 읽기·쓰기를 나눠 맡는 서브 리액터 여럿으로 나눈다(Doug Lea 의 변형 3·4). 필요하면 뒤에 업무 처리용 워커 풀을 둔다"
    synonyms: ["main-sub reactor", "master-worker reactor"]
  - id: conc-proactor-pattern
    kind: MECHANISM
    name: "프로액터 패턴"
    category: CONCURRENCY
    level: ADVANCED
    description: "IO 를 커널에 맡겨 두고 '다 읽었다'는 완료 이벤트가 오면 핸들러가 결과만 처리한다. 완료 통지 모델이라 IOCP·io_uring 과 맞는다"
    synonyms: ["Proactor pattern"]
    uses: [conc-async-io]
    alternative_to:
      - { to: conc-reactor-pattern, reason: "준비 통지 대신 완료 통지를 받아 읽기 자체를 커널이 끝낸다" }
  - id: conc-netty-event-loop-group
    kind: MECHANISM
    name: "EventLoopGroup"
    category: CONCURRENCY
    level: ADVANCED
    description: "Netty 의 이벤트 루프 묶음. boss 그룹이 연결을 수락해 worker 그룹의 루프 하나에 채널을 평생 배정한다. 네이티브 epoll·kqueue·io_uring 전송을 고를 수 있다"
    synonyms: ["EventLoopGroup", "boss/worker", "NioEventLoop", "EpollEventLoop"]
    uses: [conc-event-loop, conc-multi-reactor]
  - id: conc-channel-pipeline
    kind: MECHANISM
    name: "ChannelPipeline"
    category: CONCURRENCY
    level: ADVANCED
    description: "채널마다 달린 핸들러 사슬. 들어오는 이벤트는 머리에서 꼬리로 인바운드 핸들러를, 나가는 쓰기는 꼬리에서 머리로 아웃바운드 핸들러를 지난다. 코덱·TLS·업무 핸들러를 이 순서로 끼운다"
    synonyms: ["ChannelPipeline", "ChannelHandler", "ChannelHandlerContext", "inbound/outbound"]
    uses: [chain-of-responsibility]
  - id: conc-netty-bytebuf
    kind: MECHANISM
    name: "ByteBuf"
    category: CONCURRENCY
    level: ADVANCED
    description: "읽기·쓰기 인덱스를 따로 둔 Netty 버퍼. 다이렉트 메모리를 풀링(jemalloc 방식)해 재사용하고 참조 카운트(refCnt)로 반납 시점을 정한다. 마지막 사용자가 release 해야 한다"
    synonyms: ["ByteBuf", "PooledByteBufAllocator", "refCnt", "CompositeByteBuf"]
    uses: [rt-direct-memory]
    causes: [conc-bytebuf-leak]
  - id: conc-fast-thread-local
    kind: MECHANISM
    name: "FastThreadLocal"
    category: CONCURRENCY
    level: ADVANCED
    description: "Netty 전용 스레드에서 해시 조회 대신 배열 인덱스로 값을 찾는 ThreadLocal 대체. 이벤트 루프처럼 조회가 아주 잦은 곳에서 쓴다"
    synonyms: ["FastThreadLocal"]
    alternative_to:
      - { to: conc-thread-local, reason: "해시 충돌 탐색 없이 고정 인덱스로 찾는다" }
  - id: conc-hashed-wheel-timer
    kind: MECHANISM
    name: "해시 휠 타이머"
    category: CONCURRENCY
    level: ADVANCED
    description: "시간을 칸으로 나눈 바퀴에 타임아웃을 넣고 틱마다 한 칸만 본다. 연결마다 걸린 수십만 개 타임아웃을 우선순위 큐보다 싸게 다룬다"
    synonyms: ["HashedWheelTimer", "timing wheel"]
  - id: reactor-netty
    kind: TECHNOLOGY
    name: "Reactor Netty"
    category: NETWORK
    level: ADVANCED
    description: "Netty 위에 Reactor 의 Mono·Flux 로 HTTP·TCP·웹소켓 서버와 클라이언트를 여는 라이브러리. WebFlux 의 기본 서버이자 WebClient 의 기본 전송이고, 이 레포는 거래소 웹소켓 구독에 직접 쓴다"
    synonyms: ["reactor-netty", "Netty"]
    code:
      - { path: quant/feature/src/main/kotlin/com/kgd/quant/infrastructure/stream/BithumbWebSocketSubscriber.kt, symbol: "import reactor.netty.http.client.HttpClient", note: "빗썸 시세 웹소켓을 Reactor Netty 클라이언트로 연다" }
    implements:
      - { to: conc-event-loop, reason: "Netty 이벤트 루프 위에서 연결을 처리한다" }
      - { to: conc-netty-event-loop-group, reason: "LoopResources 로 boss·worker 루프를 만든다" }
      - { to: conc-channel-pipeline, reason: "HTTP 코덱과 사용자 핸들러를 파이프라인에 끼운다" }
  - id: conc-event-loop-blocking
    kind: PROBLEM
    name: "이벤트 루프 블로킹"
    category: CONCURRENCY
    level: ADVANCED
    description: "소수의 이벤트 루프 스레드에서 JDBC·파일 IO·Thread.sleep·block() 같은 블로킹 호출을 해 그 스레드가 맡은 모든 연결이 함께 멈추는 상태"
    synonyms: ["blocking the event loop", "BlockHound"]
  - id: conc-bytebuf-leak
    kind: PROBLEM
    name: "ByteBuf 누수"
    category: CONCURRENCY
    level: ADVANCED
    description: "release 하지 않은 풀링 버퍼가 다이렉트 메모리를 계속 붙잡는 상태. GC 가 힙 객체만 치워도 버퍼는 반납되지 않아 결국 다이렉트 메모리 OOM 이 난다. ResourceLeakDetector 가 샘플링해 알린다"
    synonyms: ["ByteBuf leak", "ResourceLeakDetector"]
    causes: [rt-oom-direct-buffer]

  # ── 진단 ──
  - id: conc-diagnosis
    kind: STAGE
    name: "동시성 문제 진단"
    category: CONCURRENCY
    level: ADVANCED
    description: "멈춤·느려짐·간헐 오류가 교착·경합·풀 고갈·피닝 중 무엇인지 가른다. 스레드 덤프를 여러 번 떠 비교하고, 락 대기를 프로파일러로 재고, 경쟁 상태는 스트레스 테스트로 재현한다"
    questions: ["스레드 덤프 한 장으로 판단하면 안 되는 이유는 무엇인가", "BLOCKED 스레드가 많을 때 누가 막고 있는지 어떻게 찾나"]
    contains: [conc-deadlock-detection, conc-lock-profiling, conc-pinning-trace, conc-coroutine-debugging, conc-concurrency-stress-test]
    measured_by: [conc-lock-wait-time]
  - id: conc-deadlock-detection
    kind: MECHANISM
    name: "교착 탐지"
    category: CONCURRENCY
    level: ADVANCED
    description: "스레드 덤프의 'waiting to lock <주소>'와 'locked <주소>'를 이어 대기 그래프를 만들고 순환을 찾는다. jstack·jcmd Thread.print 는 모니터 교착을 끝에 'Found one Java-level deadlock'으로 직접 알려 준다"
    synonyms: ["deadlock detection", "Thread.print", "ThreadMXBean.findDeadlockedThreads"]
    uses: [rt-thread-dump]
  - id: conc-lock-profiling
    kind: MECHANISM
    name: "락 프로파일링"
    category: CONCURRENCY
    level: ADVANCED
    description: "어느 락에서 누가 얼마나 기다렸는지 스택별로 모은다. async-profiler 의 lock 모드나 JFR 의 모니터·park 이벤트를 쓰고, 부하가 걸린 상태에서 떠야 의미가 있다"
    synonyms: ["lock profiling", "async-profiler -e lock", "jdk.JavaMonitorEnter"]
    uses: [rt-async-profiler, rt-jfr]
  - id: conc-pinning-trace
    kind: MECHANISM
    name: "피닝 추적"
    category: CONCURRENCY
    level: ADVANCED
    description: "-Djdk.tracePinnedThreads=full 이나 JFR 의 jdk.VirtualThreadPinned 이벤트로 가상 스레드가 캐리어에 묶인 스택을 찾는다"
    synonyms: ["jdk.tracePinnedThreads", "jdk.VirtualThreadPinned"]
    uses: [rt-jfr]
  - id: conc-coroutine-debugging
    kind: MECHANISM
    name: "코루틴 디버깅"
    category: CONCURRENCY
    level: ADVANCED
    description: "kotlinx-coroutines-debug 의 DebugProbes 로 떠 있는 코루틴과 그 중단 지점·생성 스택을 덤프한다. 스레드 덤프에는 중단된 코루틴이 보이지 않아서 따로 떠야 한다"
    synonyms: ["kotlinx-coroutines-debug", "DebugProbes", "-Dkotlinx.coroutines.debug"]
  - id: conc-concurrency-stress-test
    kind: MECHANISM
    name: "동시성 스트레스 테스트"
    category: TESTING
    level: ADVANCED
    description: "같은 연산을 여러 스레드로 수백만 번 겹쳐 돌려 드물게 나는 결과(재배치·가시성·원자성 위반)를 모은다. jcstress 가 JMM 수준의 허용·금지 결과를 판정한다"
    synonyms: ["jcstress", "stress test"]
    mitigates: [race-condition, conc-visibility-failure]

  # ── 용어 ──
  - id: concurrency-glossary
    kind: TERM
    name: "동시성 용어 사전"
    category: BASICS
    level: BEGINNER
    description: "동시성을 읽는 데 필요한 말. 장치가 아니라 장치를 설명하는 용어를 스레드·메모리·동기화·비동기 넷으로 나눠 모은다"
    synonyms: ["glossary", "용어집"]
    contains: [conc-glossary-thread, conc-glossary-memory, conc-glossary-sync, conc-glossary-async]
  - id: conc-glossary-thread
    kind: TERM
    name: "스레드 용어"
    category: BASICS
    level: BEGINNER
    description: "실행 단위의 상태와 구성 요소를 가리키는 말"
    contains: [conc-thread-state, conc-daemon-thread, conc-context-switch, conc-carrier-thread, conc-continuation, conc-work-queue, conc-recursive-task]
  - id: conc-thread-state
    kind: TERM
    name: "스레드 상태"
    category: CONCURRENCY
    level: BEGINNER
    description: "NEW·RUNNABLE·BLOCKED(모니터 대기)·WAITING(무기한 대기)·TIMED_WAITING(시한 대기)·TERMINATED 여섯 가지. IO 에서 막힌 스레드도 자바에서는 RUNNABLE 로 보인다"
    synonyms: ["Thread.State", "BLOCKED", "WAITING", "TIMED_WAITING"]
  - id: conc-daemon-thread
    kind: TERM
    name: "데몬 스레드"
    category: CONCURRENCY
    level: BEGINNER
    description: "남은 스레드가 데몬뿐이면 JVM 이 기다리지 않고 종료하는 보조 스레드. 종료 시 finally 가 실행되지 않을 수 있다"
    synonyms: ["daemon thread"]
  - id: conc-context-switch
    kind: TERM
    name: "컨텍스트 스위칭"
    category: CONCURRENCY
    level: BEGINNER
    description: "CPU 가 실행 중인 스레드의 레지스터·스택 상태를 저장하고 다른 스레드 상태로 바꾸는 일. 수 마이크로초가 들고 캐시가 식는다. 스레드가 많을수록 이 비용이 커진다"
    synonyms: ["context switch"]
  - id: conc-carrier-thread
    kind: TERM
    name: "캐리어 스레드"
    category: CONCURRENCY
    level: ADVANCED
    description: "가상 스레드를 실제로 실행하는 플랫폼 스레드. 기본으로 코어 수만큼의 ForkJoinPool 이고, 가상 스레드가 중단될 때마다 다른 가상 스레드를 태운다"
    synonyms: ["carrier thread"]
  - id: conc-continuation
    kind: TERM
    name: "Continuation"
    category: CONCURRENCY
    level: ADVANCED
    description: "멈춘 지점 이후의 실행을 담은 값. 가상 스레드는 JVM 내부 Continuation 으로 스택을 힙에 떼어 두고, 코틀린 코루틴은 컴파일러가 만든 Continuation 객체에 지역 변수와 재개 위치를 담는다"
    synonyms: ["continuation"]
  - id: conc-work-queue
    kind: TERM
    name: "작업 큐"
    category: CONCURRENCY
    level: BEGINNER
    description: "실행기에 제출된 작업이 스레드를 기다리는 대기열. 크기 제한이 없으면 과부하가 지연과 메모리로 번진다"
    synonyms: ["work queue", "task queue"]
  - id: conc-recursive-task
    kind: TERM
    name: "RecursiveTask · RecursiveAction"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "ForkJoinPool 에 올리는 분할 정복 작업 단위. 결과가 있으면 RecursiveTask, 없으면 RecursiveAction 이고, compute 안에서 fork·join 으로 쪼갠다"
    synonyms: ["RecursiveTask", "RecursiveAction", "ForkJoinTask"]
  - id: conc-glossary-memory
    kind: TERM
    name: "메모리 모델 용어"
    category: BASICS
    level: ADVANCED
    description: "스레드 사이의 쓰기가 언제·어떤 순서로 보이는지 말하는 용어"
    contains: [conc-memory-visibility, conc-happens-before, conc-synchronizes-with, conc-reordering, conc-acquire-release, conc-as-if-serial, conc-hardware-memory-model]
  - id: conc-memory-visibility
    kind: TERM
    name: "메모리 가시성"
    category: CONCURRENCY
    level: ADVANCED
    description: "한 스레드가 쓴 값이 다른 스레드에 언제 보이는지의 문제. CPU 캐시·재배치 때문에 happens-before 관계가 없으면 보장되지 않는다"
    synonyms: ["memory visibility"]
  - id: conc-happens-before
    kind: TERM
    name: "happens-before"
    category: CONCURRENCY
    level: ADVANCED
    description: "A 가 B 보다 먼저 일어났다고 JMM 이 보장하는 관계. A 의 쓰기가 B 에서 보인다는 뜻이다. 프로그램 순서·모니터 해제→획득·volatile 쓰기→읽기·스레드 start/join·전이성 규칙으로 생긴다"
    synonyms: ["happens-before", "HB"]
  - id: conc-synchronizes-with
    kind: TERM
    name: "synchronizes-with"
    category: CONCURRENCY
    level: ADVANCED
    description: "서로 다른 스레드의 두 동작을 잇는 동기화 간선 — 모니터 해제와 그다음 획득, volatile 쓰기와 그 값을 본 읽기. happens-before 가 스레드를 건너는 유일한 길이다"
    synonyms: ["synchronizes-with"]
  - id: conc-reordering
    kind: TERM
    name: "명령 재배치"
    category: CONCURRENCY
    level: ADVANCED
    description: "컴파일러·JIT·CPU 가 한 스레드 결과가 같다는 전제로 메모리 연산 순서를 바꾸는 것. 다른 스레드에서는 바뀐 순서가 보여 초기화 전 값을 읽게 된다"
    synonyms: ["reordering", "instruction reordering"]
  - id: conc-acquire-release
    kind: TERM
    name: "acquire · release"
    category: CONCURRENCY
    level: ADVANCED
    description: "release 쓰기 앞의 연산은 뒤로 못 가고, acquire 읽기 뒤의 연산은 앞으로 못 온다는 한 방향 순서 보장. 락 획득·해제와 volatile 읽기·쓰기의 하드웨어 의미다"
    synonyms: ["acquire semantics", "release semantics"]
  - id: conc-as-if-serial
    kind: TERM
    name: "as-if-serial"
    category: CONCURRENCY
    level: ADVANCED
    description: "한 스레드 안에서는 재배치를 해도 순서대로 실행한 것과 결과가 같아야 한다는 규칙. 다른 스레드에서 보이는 순서는 약속하지 않는다"
    synonyms: ["as-if-serial"]
  - id: conc-hardware-memory-model
    kind: TERM
    name: "하드웨어 메모리 모델"
    category: CONCURRENCY
    level: ADVANCED
    description: "CPU 마다 허용하는 재배치가 다르다 — x86 은 Store→Load 만 바뀌는 TSO 로 강하고, ARM 은 대부분을 바꾸는 약한 모델이다. x86 에서 우연히 돌던 경쟁 코드가 ARM 서버에서 깨진다"
    synonyms: ["TSO", "weak memory model", "x86 vs ARM"]
  - id: conc-glossary-sync
    kind: TERM
    name: "동기화 용어"
    category: BASICS
    level: BEGINNER
    description: "잠금과 안전성을 말하는 용어"
    contains: [conc-critical-section, conc-monitor, conc-reentrancy, conc-thread-safety, conc-check-then-act, conc-coffman-conditions, conc-weakly-consistent-iteration]
  - id: conc-critical-section
    kind: TERM
    name: "임계 구역"
    category: CONCURRENCY
    level: BEGINNER
    description: "공유 자원을 만지는 코드 구간. 동시에 하나(또는 정해진 수)만 들어가야 결과가 맞는다. 짧게 잡을수록 경합이 준다"
    synonyms: ["critical section"]
  - id: conc-monitor
    kind: TERM
    name: "모니터"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "상호 배제 잠금 하나와 조건 대기 집합 하나를 묶은 동기화 단위. 자바는 모든 객체가 모니터를 하나씩 갖고, synchronized·wait·notify 가 그것을 쓴다"
    synonyms: ["monitor", "ObjectMonitor"]
  - id: conc-reentrancy
    kind: TERM
    name: "재진입성"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "이미 락을 쥔 스레드가 같은 락을 다시 잡아도 막히지 않는 성질. 보유 횟수를 세어 그만큼 풀어야 해제된다"
    synonyms: ["reentrancy", "reentrant"]
  - id: conc-thread-safety
    kind: TERM
    name: "스레드 안전"
    category: CONCURRENCY
    level: BEGINNER
    description: "여러 스레드가 어떤 순서로 불러도 추가 동기화 없이 명세대로 동작하는 성질. 불변·한정·동기화 셋 중 하나로 얻는다"
    synonyms: ["thread safety", "thread-safe"]
  - id: conc-check-then-act
    kind: TERM
    name: "check-then-act"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "조건을 확인하고 그 결과로 행동하는 두 단계 사이에 다른 스레드가 끼어들 수 있는 모양. 지연 초기화·'없으면 넣기'가 대표이고 한 원자 연산(putIfAbsent)으로 합쳐야 한다"
    synonyms: ["check-then-act", "read-modify-write"]
  - id: conc-coffman-conditions
    kind: TERM
    name: "교착 네 조건"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "상호 배제·점유 대기·비선점·순환 대기. 넷이 동시에 성립해야 교착이 생기므로 하나만 깨면 된다"
    synonyms: ["Coffman conditions"]
  - id: conc-glossary-async
    kind: TERM
    name: "비동기 용어"
    category: BASICS
    level: INTERMEDIATE
    description: "기다림을 다루는 방식과 스트림의 성질을 말하는 용어"
    contains: [conc-blocking-nonblocking, conc-sync-async, conc-io-two-phases, conc-edge-level-trigger, conc-suspend-function, conc-structured-concurrency, conc-coroutine-context, conc-job, conc-function-coloring, conc-hot-cold-stream, conc-reactive-signals, conc-assembly-subscription]
  - id: conc-blocking-nonblocking
    kind: TERM
    name: "블로킹 · 논블로킹"
    category: CONCURRENCY
    level: BEGINNER
    description: "호출이 결과가 나올 때까지 실행 단위를 붙잡으면 블로킹, 곧바로 돌아오고 결과는 나중에 받으면 논블로킹이다. 호출한 쪽이 제어권을 돌려받느냐의 축이다"
    synonyms: ["blocking", "non-blocking"]
  - id: conc-sync-async
    kind: TERM
    name: "동기 · 비동기"
    category: CONCURRENCY
    level: BEGINNER
    description: "결과를 호출한 쪽이 직접 챙기면 동기, 완료를 통지·콜백으로 받으면 비동기다. 블로킹 여부와는 다른 축이라 네 분면이 생긴다"
    synonyms: ["synchronous", "asynchronous", "4분면"]
  - id: conc-io-two-phases
    kind: TERM
    name: "IO 의 두 단계"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "데이터가 커널 버퍼에 준비되기를 기다리는 단계와 커널에서 사용자 버퍼로 복사하는 단계. 어느 단계에서 막히느냐로 블로킹·다중화·비동기 IO 가 갈린다"
    synonyms: ["wait for data", "copy to user"]
  - id: conc-edge-level-trigger
    kind: TERM
    name: "엣지 · 레벨 트리거"
    category: CONCURRENCY
    level: ADVANCED
    description: "레벨 트리거는 읽을 데이터가 남아 있는 동안 계속 알리고, 엣지 트리거는 상태가 바뀐 순간 한 번만 알린다. 엣지면 EAGAIN 이 날 때까지 다 읽어야 한다"
    synonyms: ["edge-triggered", "level-triggered", "EPOLLET"]
  - id: conc-suspend-function
    kind: TERM
    name: "suspend 함수"
    category: LANGUAGE_FEATURE
    level: INTERMEDIATE
    description: "코틀린에서 실행 중 멈췄다가 이어질 수 있는 함수. 컴파일러가 이어서 실행할 지점(continuation)을 인자로 넘기는 모양으로 바꾼다"
    synonyms: ["suspend fun", "suspending function"]
  - id: conc-structured-concurrency
    kind: TERM
    name: "구조화된 동시성"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "자식 작업의 수명이 그것을 연 스코프 안에 갇힌다는 원칙. 스코프는 자식이 모두 끝나야 끝나고, 하나가 실패하면 형제를 취소한다"
    synonyms: ["structured concurrency"]
  - id: conc-coroutine-context
    kind: TERM
    name: "CoroutineContext"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "코루틴에 붙은 원소 묶음 — Job·디스패처·이름·예외 처리기·ThreadContextElement. + 로 합치고 자식은 부모 문맥을 물려받아 일부만 덮어쓴다"
    synonyms: ["CoroutineContext", "CoroutineName"]
  - id: conc-job
    kind: TERM
    name: "Job"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "코루틴 하나의 수명 손잡이. New·Active·Completing·Cancelling·Cancelled·Completed 상태를 거치고, 부모-자식 트리로 취소와 실패가 전파된다"
    synonyms: ["Job", "Deferred"]
  - id: conc-function-coloring
    kind: TERM
    name: "함수 색칠"
    category: CONCURRENCY
    level: ADVANCED
    description: "suspend·async 함수는 같은 종류 안에서만 부를 수 있어 호출 사슬 전체가 비동기로 물드는 현상. 가상 스레드는 일반 함수 그대로라 이 문제가 없다"
    synonyms: ["function coloring", "What color is your function"]
  - id: conc-hot-cold-stream
    kind: TERM
    name: "핫 · 콜드 스트림"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "콜드는 구독할 때마다 처음부터 새로 만든다(Flow·기본 Flux). 핫은 구독과 무관하게 이미 흐르고 있어 늦게 온 구독자는 지난 값을 놓친다(SharedFlow·Sinks·share)"
    synonyms: ["hot publisher", "cold publisher"]
  - id: conc-reactive-signals
    kind: TERM
    name: "리액티브 신호"
    category: CONCURRENCY
    level: ADVANCED
    description: "onSubscribe 로 Subscription 을 받고, request(n) 만큼 onNext 가 오며, onError 나 onComplete 로 한 번 끝난다. 이 순서 규약이 리액티브 스트림 명세다"
    synonyms: ["onSubscribe", "onNext", "onError", "onComplete", "request(n)"]
  - id: conc-assembly-subscription
    kind: TERM
    name: "조립 시점 · 구독 시점"
    category: CONCURRENCY
    level: ADVANCED
    description: "연산자 체인을 만드는 조립 시점에는 아무 일도 없고, subscribe 하는 구독 시점에 위로 거슬러 올라가며 실행이 시작된다. 부수 효과를 조립 시점에 두면 한 번만 돈다"
    synonyms: ["assembly time", "subscription time", "defer"]
  - id: conc-weakly-consistent-iteration
    kind: TERM
    name: "약한 일관성 순회"
    category: CONCURRENCY
    level: INTERMEDIATE
    description: "동시 컬렉션의 반복자는 예외를 던지지 않고, 순회 시작 뒤의 변경은 보일 수도 안 보일 수도 있다. size()·isEmpty() 도 순간값의 어림이다"
    synonyms: ["weakly consistent iterator", "fail-safe iterator"]
