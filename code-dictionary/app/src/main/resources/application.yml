spring:
  application:
    name: code-dictionary-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    master:
      jdbc-url: jdbc:mysql://localhost:3338/code_dictionary_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
      username: ${MYSQL_USER:code_dictionary_user}
      password: ${MYSQL_PASSWORD:code_dictionary_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
    replica:
      jdbc-url: jdbc:mysql://localhost:3338/code_dictionary_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
      username: ${MYSQL_USER:code_dictionary_user}
      password: ${MYSQL_PASSWORD:code_dictionary_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  # #23 아케이드 흡수 — 리더보드 ZSET / 세션 / 리플레이 저장소 (k3s-lite 는 오버레이가 standalone 주입)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://localhost:3338/code_dictionary_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
    user: ${MYSQL_USER:code_dictionary_user}
    password: ${MYSQL_PASSWORD:code_dictionary_password}

server:
  port: 8089
  shutdown: graceful

opensearch:
  uris: ${OPENSEARCH_URIS:http://localhost:9200}
  index-name: concept-index
  retention: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# auth 가 발급한 JWT 를 검증한다 — **auth·gateway 와 같은 키여야 한다**.
# 이 빈은 아래 `kgd.common.security.enabled` 스위치가 켜져야 생긴다.
jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-32-chars-long!}

kgd:
  common:
    security:
      enabled: true
      # AesUtil 은 쓰는 쪽이 직접 만든다 — 자동설정이 하나 더 만들 이유가 없다
      aes-enabled: false

