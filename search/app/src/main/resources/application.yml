spring:
  application:
    name: search-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/search_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:search_user}
    password: ${MYSQL_PASSWORD:search_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # ADR-0025 §4 가 Tier 1 경로에 요구하는 것. 이게 없으면 prometheus 가
      # count/sum/max 만 내보내 **P99 를 계산할 수 없다** — SLA 를 적어 두고도 못 잰다.
      percentiles-histogram:
        http.server.requests: true
      # 예산 경계에 버킷을 둔다 (conventions/latency-budget.md Tier 1 검색).
      slo:
        http.server.requests: 150ms,500ms

opensearch:
  uris: ${OPENSEARCH_URIS:http://localhost:9200}

search:
  # ADR-0065 P2 — 관광지 분류 가중치. 음식·쇼핑이 적재량의 62% 라 관광 의도의 질의에서
  # 상점·식당이 관광지를 밀어낸다. 지우지 않고 내린다 (근처 검색에서는 여전히 유효한 결과).
  # 둘 다 1.0 이면 function_score 자체를 감싸지 않는다 = 이전 동작.
  attraction-ranking:
    sight-weight: 3.0
    commerce-weight: 0.35
  # ADR-0090 — 질의 사전. **비어 있으면 사전을 쓰지 않는다**(첫 채움 전 정상 상태).
  # 값은 search:batch 의 `search.embedding.model-ref` 와 한 글자도 달라선 안 된다 —
  # 다르면 사전이 적중해도 문서 벡터의 스탬프가 달라 벡터 레그가 꺼진다.
  # ADR-0090 D4 — 하이브리드. **기본은 꺼짐**: 사전과 문서 벡터가 다 찬 뒤에 켠다.
  # 융합 방식은 미확정(D5-1) — P0 실측에서 질의마다 방향이 갈렸다(야시장 +0.513 / 한옥 -0.270).
  # `fusion` 을 바꾸면 그 이름의 파이프라인을 쓴다(rrf 만 앱이 만들고, 나머지는 운영이 만든 것을 쓴다).
  attraction-hybrid:
    enabled: ${SEARCH_ATTRACTION_HYBRID_ENABLED:false}
    k: 100
    fusion: rrf
  query-vector:
    model-ref: ${SEARCH_EMBEDDING_MODEL_REF:}
    cache-max-size: 10000
    cache-ttl-minutes: 10
  query-encoder:
    base-url: ${SEARCH_ENCODER_URL:http://localhost:8099}
    connect-timeout-ms: 200
    read-timeout-ms: 400
  ranking:
    popularity-weight: 10.0
    ctr-weight: 5.0
    # ADR-0050 Phase 1/2 — 모두 default 0 (점진 활성화)
    cvr-weight: 0.0
    gmv7d-weight: 0.0
    gmv30d-weight: 0.0
    freshness:
      weight: 0.0          # 0 이면 gauss decay 함수 미적용
      origin: now
      scale: 14d
      offset: 0d
      decay: 0.5
  # ADR-0050 Phase 4 — variant 별 RankingProperties (A/B 비교용)
  # 예시 (활성화 시):
  # ranking-variants:
  #   variants:
  #     experiment_a:
  #       popularity-weight: 10.0
  #       ctr-weight: 8.0
  #       cvr-weight: 3.0
  #       freshness: { weight: 1.0, scale: 14d, decay: 0.5 }
  #     experiment_b:
  #       popularity-weight: 5.0
  #       ctr-weight: 10.0
  #       gmv7d-weight: 2.0
  ranking-variants:
    variants: {}
  # 온라인 A/B — experiment 서비스 bucket assignment 로 variant 할당.
  # 활성화: experiment 서비스에 실험 등록 후 enabled=true + id 지정.
  # variant 키는 ranking-variants.variants 키와 일치해야 하며, 미정의 키(control)는 기본 ranking.
  experiment:
    enabled: false
    id: 0
    url: http://experiment:8091
  # ADR-0043 — Bandit / Thompson Sampling rerank
  bandit:
    enabled: true
    top-n: 100
    prior-alpha: 1.0
    prior-beta: 9.0
    decay-lambda-per-day: 0.02
    hybrid-weight: 0.8
    impression-threshold: 50
    session-cache-seconds: 60
    # category-priors:
    #   "fashion-women": "5.0,45.0"
    # ADR-0050 Phase 3 — 다중 scope blend. 비어 있으면 category 단일 scope (legacy 동일).
    # 예시 (활성화 시): brand 신호 추가 + category 와 7:3 가중치
    # scopes:
    #   - name: category
    #     weight: 0.7
    #     prior-alpha: 1.0
    #     prior-beta: 9.0
    #   - name: brand
    #     weight: 0.3
    #     prior-alpha: 1.0
    #     prior-beta: 9.0
  # ADR-0050 Phase 3 — Seller diversity rerank (default off)
  diversity:
    enabled: false
    max-per-seller: 3
    top-k: 20
    seller-key: category
