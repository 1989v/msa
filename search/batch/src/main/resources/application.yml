spring:
  application:
    name: search-batch
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:h2:mem:batch-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

opensearch:
  uris: ${OPENSEARCH_URIS:http://localhost:9200}

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

place:
  service:
    url: ${PLACE_SERVICE_URL:http://localhost:8096}

search:
  index:
    alias: products
    attraction-alias: attractions
    region-alias: regions
  batch:
    page-size: 100
  embedding:
    # 문서 벡터 스탬프 (ADR-0090). **비어 있으면 벡터를 싣지 않는다** — 첫 채움 전에는 이것이 정상이다.
    # 값은 search:app 의 같은 설정과 한 글자도 다르지 않아야 한다. 다르면 질의 경로가 벡터 레그를 끈다.
    model-ref: ${SEARCH_EMBEDDING_MODEL_REF:}

server:
  port: 8092
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,batch
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# 색인 소스 선택: api(기본) | db | seed
# api: Product REST API를 통해 소싱 (서비스 경계 준수, 운영 중 사용)
# db: mysql-product-replica 직접 리드 (ADR-0009 예외, 초기 색인/DR 복구)
# seed: tools/seed/products 정규화 JSONL 을 product Create API(/bulk)로 적재 (ADR-0056 오픈데이터 시드)
reindex:
  source: ${REINDEX_SOURCE:api}

# 오픈데이터 상품 시드 (reindex.source=seed 전용)
seed:
  path: ${SEED_PATH:/seed/products.jsonl}
  chunk-size: ${SEED_CHUNK_SIZE:500}
