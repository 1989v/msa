    phase: post-P1
    status: open
    q: "사용자 투표 축(P3) — 표가 적을 때 순위가 요동친다. 베이지안 평균 등 사전분포가 필요한지,
        아니면 '표 N개 이상' 게이트로 충분한지. 데이터가 생긴 뒤 판단."
