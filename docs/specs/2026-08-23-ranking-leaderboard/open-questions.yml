    status: closed
    q: "KATEC → WGS84 변환 위치 — **닫힘**. 수집기(Python)에서 pyproj 없이 직접 편다.
        기대값은 PROJ 로 뽑아 골든 테스트로 박았다(전 국토 7점, 차이 4cm 이하).
        오퍼레이션에 따라 위경도로 오기도 해서, 형태를 판정해 **한 번만** 변환한다."
