> Phase: pre-impl / post-P1
questions:
  - id: OQ-1
    phase: pre-impl
    status: open
    owner: user
    q: "공공데이터포털에서 한국석유공사 오픈 API 5종 **활용신청** (지역코드·지역별 최저가 TOP20·
        반경 내 주유소·주유소 상세정보·전국 평균가격). 키는 기존 DATA_GO_KR_KEY 재사용이라
        새로 만들 것이 없다. 개발단계 자동승인 / 운영단계 심의승인.
        신청 후 화면의 End Point 를 OIL_API_BASE 로 넣는다.
        그 전에는 stations.sample.jsonl 로 수집기 E2E 를 태운다."
  - id: OQ-2
    phase: pre-impl
    status: closed
    q: "길찾기 키 — **불요(2026-08-23)**. 경로 계산을 구글맵 링크(Maps URLs)로 대체했다.
        조립 링크라 키도 쿼터도 없고, 상시 파드의 외부 egress 도 원복했다 (ADR-0081 §6 개정)."
  - id: OQ-3
    phase: pre-impl
    status: open
    q: "오피넷 무료 API 일일 호출 한도가 공개 문서에 없다. 전국 수집이 한도 안에 들어가는지
        키 발급 직후 실측한다. 초과하면 시도별 분할 순회(하루 N개 시도)로 전환 — 가격이 일 단위
        갱신이라 전국이 하루 늦어도 화면은 성립한다."
  - id: OQ-4
    phase: pre-impl
    status: closed
    q: "전국 전량 수집 경로 — **닫힘(2026-08-23)**. 포털에는 지역 단위 전량+가격 오퍼레이션이
        없고 가격을 주는 지역 단위 경로는 최저가 TOP20 뿐이다. 시군구 × 유종 ≈ 500콜/일로
        전국 약 5,000곳(싼 곳 위주)을 받는다. 전량이 필요해지면 오피넷 직접 신청의
        '주유소 판매가격정보(지역별)' 을 얹는다 — 오퍼레이션 맵 한 곳만 바뀐다."
  - id: OQ-12
    phase: pre-impl
    status: open
    owner: user
    q: "이용허락범위 확인 — 대장(data-sources.md §8)에 '공공누리(출처표시)'로 적어뒀지만
        이는 레포의 다른 공공데이터 관례를 따른 값이고 신청 화면의 `이용허락범위` 필드를
        직접 확인한 것이 아니다. 실제 값으로 대장을 고쳐야 한다 — 틀린 값이 대장에 있으면
        화면 출처 표기 판단도 같이 틀어진다."
  - id: OQ-13
    phase: pre-impl
    status: open
    owner: user
    q: "End Point 호스트 확인 — apis.data.go.kr 이면 포털 serviceKey 로 끝(예상).
        www.opinet.co.kr 이면 오피넷 키가 따로 필요하고, 그때는 opinet.py 의 인증 파라미터명을
        serviceKey → code 로 바꾼다(원래 그렇게 짰다가 포털용으로 옮긴 코드다)."
  - id: OQ-11
    phase: pre-impl
    status: open
    q: "포털 오퍼레이션의 실제 경로·파라미터·응답 필드명 — 활용신청 후 받는 명세서가 원본이다.
        UNI_ID(주유소 고유 id)가 TOP20 응답에 있는지 반드시 확인할 것. 없으면 등락 계산의
        키가 없어져 매일 전 항목이 NEW 로 보인다 (수집기는 id 없는 줄을 버린다)."
