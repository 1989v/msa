    q: "Google Cloud Console → Routes API 사용 설정 + 서버용 API 키(IP 제한).
        Maps JS 키(리퍼러 제한)와 반드시 분리 — 한 키에 둘을 담으면 어느 제한을 걸어도 한쪽이 죽는다
        (YouTube·Places 키 분리와 같은 이유). 키 이름 후보 GOOGLE_ROUTES_API_KEY."
  - id: OQ-3
    phase: pre-impl
    status: open
    q: "오피넷 무료 API 일일 호출 한도가 공개 문서에 없다. 전국 수집이 한도 안에 들어가는지
        키 발급 직후 실측한다. 초과하면 시도별 분할 순회(하루 N개 시도)로 전환 — 가격이 일 단위
        갱신이라 전국이 하루 늦어도 화면은 성립한다."
  - id: OQ-4
    phase: pre-impl
    status: open
    q: "전국 전량 수집 경로 — '주유소 기본정보(지역별)' 만으로 전량이 되는가, 아니면
        '반경 내 주유소 검색' 격자 순회가 필요한가. 지역별이 되면 호출 수가 한 자릿수로 떨어진다.
        키 발급 후 시도 1개로 판정하고 그 결과가 수집기 구조를 정한다."
  - id: OQ-5
    phase: pre-impl
    status: open
    q: "경로 이탈 시간 추정 방식. Routes API 재호출(경유지 포함)은 정확하지만 후보 1건당 1콜이라
        월 10,000 무료를 즉시 태운다. P1 은 폴리라인 최근접점까지의 직선거리 기반 근사로 두고
        '약 N분'으로 표기한다. 근사 오차 허용폭을 화면 문구가 감당하는지 확인 필요."
