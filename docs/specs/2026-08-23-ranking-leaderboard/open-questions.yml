> Phase: pre-impl / post-P1
questions:
  - id: OQ-1
    phase: pre-impl
    status: open
    owner: user
    q: "오피넷(opinet.co.kr) 회원가입 → **무료 API 이용신청** → 키 발급.
        공공데이터포털은 쓸 수 없다 — 한국석유공사 항목이 `API 유형: LINK` 라 중계하지 않고
        바로가기만 걸어둔 것이어서 포털 인증키가 발급되지 않는다.
        발급 전에는 stations.sample.jsonl 로 수집기 E2E 를 태운다."
  - id: OQ-2
    phase: pre-impl
    status: closed
    q: "길찾기 키 — **불요(2026-08-23)**. 경로 계산을 구글맵 링크(Maps URLs)로 대체했다.
        조립 링크라 키도 쿼터도 없고, 상시 파드의 외부 egress 도 원복했다 (ADR-0081 §6 개정)."
  - id: OQ-3
    phase: pre-impl
    status: open
    q: "오피넷 무료 API 일일 호출 한도가 공개 문서에 없다. 전국 수집이 한도 안에 들어가는지
        키 발급 직후 실측한다. 초과하면 시도별 분할 순회(하루 N개 시도)로 전환 — 가격이 일 단위
        갱신이라 전국이 하루 늦어도 화면은 성립한다."
  - id: OQ-4
    phase: pre-impl
    status: closed
    q: "전국 전량 수집 경로 — **닫힘(2026-08-23)**. 포털에는 지역 단위 전량+가격 오퍼레이션이
        없고 가격을 주는 지역 단위 경로는 최저가 TOP20 뿐이다. 시군구 × 유종 ≈ 500콜/일로
        전국 약 5,000곳(싼 곳 위주)을 받는다. 전량이 필요해지면 오피넷 직접 신청의
        '주유소 판매가격정보(지역별)' 을 얹는다 — 오퍼레이션 맵 한 곳만 바뀐다."
  - id: OQ-12
    phase: pre-impl
    status: closed
    q: "이용허락범위 — **닫힘(2026-08-24)**: '이용허락범위 제한 없음'. 추정으로 적었던
        '공공누리(출처표시)'는 틀렸고 대장을 고쳤다. 출처 표기는 의무가 아니라 선택이다."
  - id: OQ-13
    phase: pre-impl
    status: closed
    q: "End Point — **닫힘(2026-08-24)**: 포털 항목이 LINK 유형이라 오피넷 직접이다.
        base=https://www.opinet.co.kr/api, 인증 파라미터 `code`, 오퍼레이션은 `.do` 로 되돌렸다.
        판별 기준은 상세 페이지의 `API 유형` 한 줄 — REST/SOAP 면 포털 중계, LINK 면 제공기관 직접."
  - id: OQ-14
    phase: pre-impl
    status: open
    owner: user
    q: "개발가이드에 `주유소 판매가격정보(지역별)`(지역 전량+가격)이 있는지. 있으면 수집을
        최저가 TOP20 에서 전량으로 바꾼다 — 오퍼레이션 맵 한 곳만 고치면 되고, 화면의
        '상위 20곳' 범위 고지도 걷어낼 수 있다(전국 약 11,000곳)."
  - id: OQ-11
    phase: pre-impl
    status: open
    q: "포털 오퍼레이션의 실제 경로·파라미터·응답 필드명 — 활용신청 후 받는 명세서가 원본이다.
        UNI_ID(주유소 고유 id)가 TOP20 응답에 있는지 반드시 확인할 것. 없으면 등락 계산의
        키가 없어져 매일 전 항목이 NEW 로 보인다 (수집기는 id 없는 줄을 버린다)."
  - id: OQ-5
    phase: pre-impl
    status: closed
    q: "경로 이탈 시간 추정 — **무효(2026-08-23)**. 경로 탐색 자체를 걷어내 추정할 것이 없어졌다."
  - id: OQ-6
    phase: pre-impl
    status: open
    q: "유종 코드 확정 — 휘발유 B027 · 경유 D047 은 확인됨. 고급휘발유·LPG 코드는 활용신청 후
        명세서에서 확인. 코드는 도메인 enum 으로 못 박는다."
  - id: OQ-7
    phase: pre-impl
    status: closed
    q: "KATEC → WGS84 변환 위치 — **닫힘**. 수집기(Python)에서 pyproj 없이 직접 편다.
        기대값은 PROJ 로 뽑아 골든 테스트로 박았다(전 국토 7점, 차이 4cm 이하).
        오퍼레이션에 따라 위경도로 오기도 해서, 형태를 판정해 **한 번만** 변환한다."
