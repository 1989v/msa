    phase: pre-impl
    status: assumed
    q: 로블록스판 이름·위치
    a: "`roblox/amp-arena/`, 표시명 「AMP ARENA」 — 궁수 키우기 선례처럼 사용자 대면 이름을 따른다. 상용 게임 이름은 쓰지 않는다. 사용자가 다른 이름을 원하면 폴더·타이틀만 바꾼다"
