    phase: pre-impl
    status: assumed
    q: 리그
    a: "R6 강제 + 절차 포즈(Transform). 사용자가 R15 아바타를 원하면 Game Settings 만 바꾸면 Poser 가 R15 관절로 매핑한다(생김새는 미검증)"
