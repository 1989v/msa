questions:
  - id: map_fidelity
    stage: pre-map-implementation
    status: evidence_pending
    question: 블로그 SE판과 영상판의 전체 지도 및 진행 구조 대조가 필요하다.
    default: 원본 지도 확인 전 world.md의 임의 배치를 구현하지 않는다.
    resolution: 사용자가 원본 지도 확인 후 맵 구현을 선택했다. 이후 지도 사이즈와 규모는 더 커도 된다고 명시했다. 원본의 연결·진행 구조를 먼저 확인하고 확대 설계한다.
    evidence: planning/original-map-findings.md
  - id: gameplay_numbers
    stage: tuning
    status: proposed
    question: 가격과 초반/전체 플레이시간은 원작 추출값이 아니다.
    default: gameplay.md v0.1을 시작값으로 쓰고 실제 플레이에 따라 근거와 함께 조정한다.
  - id: coop_count
    stage: design
    status: proposed
    question: 협동 인원수가 지정되지 않았다.
    default: 기존 인프라로 2인 기본판, 4인은 다음 버전.
  - id: harvest_interpretation
    stage: tuning
    status: proposed
    question: 채집속도 비교 문장의 비교대상이 모호하다.
    default: 목수는 사냥에 추가되는 자동수입, 3~4명은 초반 사냥수입에 필적하도록 튜닝.
  - id: new_art
    stage: design-review
    status: proposed
    question: 새 3종 디자인보드는 검토용이다.
    default: 기존 approved-tone은 미술기준, 실제sprite제작전 새로운역할실루엣을 확인한다.
