    status: closed
    question: "settlement 는 발행 토픽이 없어 outbox 없음(SR-10 문구) · 역분개 진입점 API 없음 · 플랫폼 판매자 1 에도 모의 지급 · PG 입금 뒤 환불은 PG 미수금 음수 · 정산서 기간 표기보다 앞선 이월·지각 항목 포함"
    answer: "스펙 문구 정정, 역분개 어드민 API, 플랫폼 판매자 PLATFORM_RETAINED(지급 없음), 정산서 실제 포함 기간 표기 (W2)"
