    answer: "재고·이행은 상품 판매자 또는 어드민, 창고는 어드민 전용 — 운영 소유 검사 403/200 확인 (W1)"
  - id: Q21
    phase: post-impl
    status: closed
    question: "배송비 정산은 판매자 마지막 ACTIVE 라인 확정 시 — 경계에서 line:null(CLAIM_CLOSED) 이벤트가 생긴다. 「첫 확정 라인」으로 바꾸면 경계 건이 사라짐 · 클레임은 판매자당 1건, 주문당 진행 1건(나머지 QUEUED) · 클레임 STUCK 재개 API 없음(TG15)"
