questions:
  - id: Q1
    phase: post-impl
    status: open
    question: 토스페이먼츠 어댑터를 oci-arm 운영에서 켤 것인가 — commerce 상시 파드 egress 금지(ADR-0031/0070)와 충돌. 켜려면 egress 예외 ADR + NetworkPolicy + ExternalApiProvider 쿼터
    default: 어댑터·테스트(MockWebServer)만 두고 운영은 모의 PG
  - id: Q2
    phase: pre-impl
    status: closed
    question: 새 도메인 4개(payment·seller·promotion·settlement)의 전용 DB 가 commerce 1200Mi 한도 안에 들어가나
    answer: Hikari 풀을 도메인당 max 3 로 두고, 단계마다 배포 후 컨테이너 메모리 실측. 넘으면 한도 조정이 아니라 풀·스레드 축소(무료 티어 제약)
  - id: Q3
    phase: post-impl
    status: open
    question: ProductExceptionHandler·OrderExceptionHandler 가 범위 없는 HIGHEST_PRECEDENCE 전역 advice — commerce 전 컨트롤러의 BusinessException 을 서로 가로챈다(기존 결함, TG2 는 양쪽에 401/403 매핑만)
  - id: Q4
    phase: post-impl
    status: open
    question: admin FE 가 부르는 DELETE /api/v1/products/{id} · PATCH /api/v1/orders/{id}/status 백엔드 부재(기존 결함)
  - id: Q5
    phase: post-impl
    status: open
    question: quant LiveOrderController 도 /api/v1/orders 사용 — 게이트웨이는 commerce 로만 보냄(이름 충돌)
  - id: Q6
    phase: post-impl
    status: open
    question: 기존 도메인(inventory·order·warehouse·fulfillment)의 hikari.maximum-pool-size 가 적용되지 않고 런타임 10 — DataSourceBuilder 바인딩 구조 결함(기존). 메모리 예산(Q2) 영향. seller 는 3 적용됨
  - id: Q7
    phase: post-impl
    status: open
    question: 게이트웨이 hasRequiredRole 이 ROLE_ADMIN 을 모든 역할 상위로 통과 — /api/v1/seller/** 는 게이트웨이에서 ROLE_SELLER 전용이 불가, 판매자 행 없는 어드민은 서비스가 403
  - id: Q8
    phase: post-impl
    status: open
    question: 반려 판매자 파기 시 상호(businessName)는 이력용으로 남김 — 개인사업자 상호의 개인정보 여부 확인
  - id: Q9
    phase: post-impl
    status: open
    question: auth 가 이벤트 시각을 저장하지 않아 재시도로 늦게 온 approved 가 suspended 뒤에 ROLE_SELLER 를 다시 붙일 수 있다 — 쓰기 권한은 product ACTIVE 행이 막으므로 토큰에 역할만 남음. 필요 시 회원별 마지막 반영 시각
  - id: Q10
    phase: post-impl
    status: open
    question: ACTIVE 판매자 행이 있는 어드민의 상품 등록은 그 판매자 소유 — 어드민은 항상 플랫폼 1 로 할지
  - id: Q11
    phase: post-impl
    status: open
    question: 주문내역 `.shop-badge-completed` 도 헤리티지 라이트에서 --ko-accent-secondary 라 1.46:1 추정(기존) — P4 주문 상태 인장 개편 때 같이
  - id: Q12
    phase: post-impl
    status: open
    question: 상품 목록 API 는 ACTIVE 만 — 판매 중지된 내 상품이 판매자 화면에 안 보임. 판매자 전용 전체 상태 목록 필요 여부 · ProductQueryRepository 가 pageable 정렬 미적용(기존)
  - id: Q13
    phase: post-impl
    status: open
    question: 토스는 confirm 에서 자동 매입 — 사가의 AUTHORIZED→CAPTURED 계약과 PG 실제 상태가 어긋남. 토스 웹훅은 HMAC 이 없고 임의 헤더를 못 붙여 공유 비밀 헤더 방식은 프록시 필요. Q1(토스 운영 활성화)과 묶어 결정
  - id: Q14
    phase: post-impl
    status: open
    question: 대사 날짜 경계 — KST 자정 근처 매입은 결제 행과 모의 PG 원장이 ms 차로 다른 날이 되어 가짜 불일치 가능 · mock_pg_transaction 이 payment_db 에 있음(모의 PG 원장)
