<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>척준경 — 애니메이션 시트</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#07090c;display:flex;justify-content:flex-start}
#sheet{image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor;display:block}
</style></head>
<body>
<canvas id="sheet"></canvas>
<script>
// ===== v2 목표 화면과 동일한 38색 팔레트 · 동일 픽셀 규칙(정수 격자, AA 없음) =====
const P={
 v0:'#05070b',v1:'#080d14',v2:'#0d151f',v3:'#12202e',v4:'#1a2c3d',v5:'#24394c',v6:'#31485c',v7:'#42596d',
 j0:'#071410',j1:'#0c2019',j2:'#123026',j3:'#1a4534',j4:'#255c43',j5:'#358f5f',
 st0:'#131a20',st1:'#1e2830',st2:'#2b3742',st3:'#3b4a56',st4:'#51626e',st5:'#6d7e88',st6:'#8f9ea5',
 e0:'#2b201a',e1:'#4a3527',e2:'#6f5038',e3:'#8a6a50',e4:'#b38b6d',
 h0:'#7d8380',h1:'#a9ada4',h2:'#d8d9cf',h3:'#f9f8f2',
 r0:'#4a0f0d',r1:'#7d1a15',r2:'#a2231d',r3:'#c8402f',r4:'#e8705a',
 g0:'#6b4c18',g1:'#8a6321',g2:'#D9A441',g3:'#f2d488',
 c0:'#12474f',c1:'#1d6f75',c2:'#2fa39b',c3:'#63d3c0',c4:'#b6f2e2',
 s0:'#3c5060',s1:'#5b7384',s2:'#8fa3b0',s3:'#cfd8de',s4:'#eef3f6'
};
const O=P.v0;
// ===== 시트 규격 =====
const CELL=54,LABEL=13,PITCH=CELL+LABEL,GUT=96,COLS=6,SCALE=3;
const ROWS=[
 ['hero','idle',4,'대기'],['hero','run',6,'달리기'],
 ['hero','jump',2,'점프'],['hero','fall',1,'낙하'],['hero','land',1,'착지'],
 ['hero','climb',4,'밧줄 오르기'],
 ['hero','atk1',3,'공격 1단'],['hero','atk2',3,'공격 2단'],['hero','atk3',4,'공격 3단'],
 ['hero','hurt',1,'피격'],['hero','crouch',1,'웅크림'],['hero','throw',2,'부적 던지기'],['hero','down',2,'쓰러짐'],
 ['club','walk',4,'도깨비(방망이) 걷기'],['club','wind',2,'치켜듦(예고)'],['club','swing',2,'휘두름'],
 ['club','hurt',1,'피격'],['club','down',1,'쓰러짐'],
 ['rock','walk',4,'도깨비(돌) 걷기'],['rock','wind',2,'웅크림(예고)'],['rock','throw',1,'던지기'],
 ['gh','float',4,'원귀 부유'],['gh','scream',2,'비명(예고)'],['gh','dash',1,'돌진'],
 ['gh','seal',1,'봉인'],['gh','vanish',2,'소멸']
];
const HEADERS={0:'척준경 — 26px',13:'도깨비(방망이) — 22px',18:'도깨비(돌) — 22px',21:'원귀 — 24px'};
let HEADH=0;const rowY=[];
(function(){let y=30;ROWS.forEach((r,i)=>{if(HEADERS[i])y+=22;rowY.push(y);y+=PITCH+4});HEADH=y+10})();
const SW=GUT+COLS*CELL+14,SH=HEADH;
const c=document.getElementById('sheet'),x=c.getContext('2d');
c.width=SW;c.height=SH;c.style.width=SW*SCALE+'px';c.style.height=SH*SCALE+'px';
x.imageSmoothingEnabled=false;
const R=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h))};
function dith(a,b,w,h,col,m){x.fillStyle=col;a=Math.round(a);b=Math.round(b);for(let j=0;j<h;j++)for(let i=0;i<w;i++){const q=((i+a)+((j+b)*2))%4,s=(i+a+j+b)&1;const on=m===2?s===0:m===3?q===0:((i+a)%2===0&&(j+b)%2===0);if(on)x.fillRect(a+i,b+j,1,1)}}
let seed=42117;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
const off=document.createElement('canvas'),ox=off.getContext('2d');
function ptext(str,px,py,size,col,align){
 off.width=Math.max(8,str.length*size*2|0);off.height=size*2.4|0;
 ox.clearRect(0,0,off.width,off.height);ox.fillStyle='#fff';
 ox.font=size+'px "Do Hyeon", monospace';ox.textBaseline='top';ox.fillText(str,1,1);
 const d=ox.getImageData(0,0,off.width,off.height).data;
 let mnX=1e9,mxX=-1,mnY=1e9,mxY=-1;
 for(let j=0;j<off.height;j++)for(let i=0;i<off.width;i++){if(d[(j*off.width+i)*4+3]>=128){if(i<mnX)mnX=i;if(i>mxX)mxX=i;if(j<mnY)mnY=j;if(j>mxY)mxY=j}}
 if(mxX<0)return 0;const w=mxX-mnX+1,sx=align==='right'?px-w:align==='center'?px-(w>>1):px;
 x.fillStyle=col;
 for(let j=mnY;j<=mxY;j++)for(let i=mnX;i<=mxX;i++){if(d[(j*off.width+i)*4+3]>=128)x.fillRect(sx+i-mnX,py+j-mnY,1,1)}
 return w;
}
function glow(gx,gy,r,cols){gx=Math.round(gx);gy=Math.round(gy);
 for(let k=cols.length-1;k>=0;k--){const rr=r*(k+1)/cols.length,ri=r*k/cols.length;
  for(let j=-rr;j<=rr;j++)for(let i=-rr;i<=rr;i++){const d2=i*i+j*j;if(d2>rr*rr||(k>0&&d2<ri*ri))continue;
   if(k>0&&((i+gx+j+gy)&1)!==0)continue;if(k>1&&((i*j+k)%3!==0))continue;R(gx+i,gy+j,1,1,cols[k])}}}
function arc(cx,cy,r0,r1,a0,a1){cx=Math.round(cx);cy=Math.round(cy);
 for(let j=-r1;j<=r1;j++)for(let i=-r1;i<=r1;i++){const r=Math.sqrt(i*i+j*j);if(r<r0||r>r1)continue;
  const ang=Math.atan2(-j,i)*180/Math.PI;if(ang<a0||ang>a1)continue;
  const t=(r-r0)/(r1-r0);if(t>0.5&&(((i+cx)+(j+cy))&1)!==0)continue;
  R(cx+i,cy+j,1,1,t<0.3?P.g3:(t<0.65?P.g2:P.g1))}}
function pline(ax,ay,bx,by,th,col,edge){ // 정수 격자 픽셀 선
 const n=Math.max(1,Math.round(Math.max(Math.abs(bx-ax),Math.abs(by-ay))));
 for(let k=0;k<=n;k++){const px=Math.round(ax+(bx-ax)*k/n),py=Math.round(ay+(by-ay)*k/n);
  R(px-(th>>1),py-(th>>1),th,th,col);if(edge)R(px-(th>>1)-1,py-(th>>1),1,th,edge)}}

// ==================================================================
// 척준경 — 26px. 앵커: (cx, fy) = 발 바닥 중앙, 모든 프레임에서 고정.
// 실루엣 표식: 정수리 붉은 술 · 양손 장검 · 등에 멘 갈고리 밧줄
// ==================================================================
function hLegs(cx,hy,fy,v){
 const L=(px,py,w,h)=>{R(px,py,w,h,P.s0);R(px,py,1,h,P.s1);R(px+w-1,py,1,h,P.v2);R(px-1,py,1,h,O);R(px+w,py,1,h,O)};
 const B=(px,py,w)=>{R(px,py,w,2,P.v2);R(px,py,w,1,P.s0);R(px-1,py,1,2,O);R(px+w,py,1,2,O);R(px,py+2,w,1,O)};
 switch(v){
 case'stand':L(cx-5,hy,4,fy-hy-2);L(cx+2,hy,4,fy-hy-2);B(cx-6,fy-2,5);B(cx+2,fy-2,5);break;
 case'brace':L(cx-6,hy,4,fy-hy-2);L(cx+2,hy+1,4,fy-hy-3);B(cx-8,fy-2,6);B(cx+2,fy-2,6);break;
 case'runA':L(cx-6,hy,4,5);L(cx-8,hy+5,4,fy-hy-7);B(cx-10,fy-2,6);
            L(cx+1,hy,4,4);L(cx+4,hy+4,4,fy-hy-6);B(cx+4,fy-2,6);break;
 case'runB':L(cx-5,hy,4,fy-hy-3);B(cx-7,fy-3,6);L(cx+2,hy,4,4);L(cx+3,hy+4,4,fy-hy-6);B(cx+3,fy-2,5);break;
 case'runAir':L(cx-7,hy,4,4);L(cx-10,hy+4,5,3);B(cx-12,hy+7,6);
              L(cx+2,hy,4,4);L(cx+4,hy+4,4,3);B(cx+4,hy+7,6);break;
 case'runAir2':L(cx+3,hy,4,4);L(cx+6,hy+4,5,3);B(cx+6,hy+7,6);
              L(cx-6,hy,4,4);L(cx-8,hy+4,4,3);B(cx-10,hy+7,6);break;
 case'runC':L(cx+2,hy,4,5);L(cx+4,hy+5,4,fy-hy-7);B(cx+4,fy-2,6);
            L(cx-5,hy,4,4);L(cx-7,hy+4,4,fy-hy-6);B(cx-9,fy-2,6);break;
 case'runD':L(cx+1,hy,4,fy-hy-3);B(cx+1,fy-3,6);L(cx-5,hy,4,4);L(cx-6,hy+4,4,fy-hy-6);B(cx-8,fy-2,5);break;
 case'tuck':L(cx-6,hy,4,4);L(cx-8,hy+4,5,3);B(cx-10,hy+7,6);
            L(cx+2,hy,4,3);L(cx+3,hy+3,5,3);B(cx+3,hy+6,6);break;
 case'apex':L(cx-6,hy,4,5);L(cx-8,hy+5,4,3);B(cx-10,hy+8,6);
            L(cx+2,hy,4,6);L(cx+5,hy+6,3,3);B(cx+5,hy+9,6);break;
 case'trail':L(cx-5,hy,4,6);L(cx-7,hy+6,4,4);B(cx-9,hy+10,6);
             L(cx+2,hy,4,7);L(cx+3,hy+7,4,4);B(cx+3,hy+11,6);break;
 case'land':L(cx-8,hy,5,3);L(cx-10,hy+3,5,fy-hy-5);B(cx-12,fy-2,7);
            L(cx+3,hy,5,3);L(cx+5,hy+3,5,fy-hy-5);B(cx+5,fy-2,7);break;
 case'crouch':L(cx-8,hy,5,3);L(cx-9,hy+3,4,fy-hy-5);B(cx-11,fy-2,6);
              L(cx+3,hy,5,3);L(cx+5,hy+3,4,fy-hy-5);B(cx+5,fy-2,6);break;
 case'hurt':L(cx-4,hy,4,5);L(cx-3,hy+5,4,fy-hy-7);B(cx-4,fy-2,5);
            L(cx+2,hy,4,4);L(cx+5,hy+4,4,fy-hy-6);B(cx+5,fy-2,6);break;
 case'climbA':L(cx-5,hy,4,4);L(cx-8,hy+4,5,4);B(cx-10,hy+8,6);L(cx+1,hy,4,6);L(cx+2,hy+6,4,3);B(cx+2,hy+9,5);break;
 case'climbB':L(cx-5,hy,4,6);L(cx-7,hy+6,4,3);B(cx-9,hy+9,6);L(cx+1,hy,4,4);L(cx+3,hy+4,4,4);B(cx+3,hy+8,5);break;
 }
}
function hSword(hx,hy,ang,len,tip){ // 양손 장검
 const rad=ang*Math.PI/180;
 R(hx-3,hy,5,3,P.e4);R(hx-3,hy+3,5,1,P.v2);R(hx-4,hy,1,3,O); // 손
 R(hx+1,hy-2,3,6,P.v2);R(hx+2,hy-1,1,4,P.g2); // 코등이
 for(let k=0;k<len;k++){const px=Math.round(hx+3+Math.cos(rad)*k),py=Math.round(hy+1-Math.sin(rad)*k);
  R(px,py,2,2,P.s3);R(px,py+2,2,1,P.s1);R(px,py-1,1,1,P.s4)}
 if(tip!==false){const px=Math.round(hx+3+Math.cos(rad)*len),py=Math.round(hy+1-Math.sin(rad)*len);R(px,py-1,3,3,P.s4)}
}
function hRope(cx,t){ // 등에 멘 갈고리 밧줄 (표식)
 for(let j=0;j<9;j++)R(cx-8-((j%3===0)?1:0),t+8+j,1,1,P.e4);
 R(cx-10,t+16,3,2,P.e3);R(cx-11,t+15,2,2,P.s2);
}
function hHead(cx,t,tsx){ // t = 정수리
 const rows=[5,8,9,10,10];
 rows.forEach((w,j)=>{const px=cx-(w>>1);R(px,t+j,w,1,j<1?P.s2:P.s1);R(px-1,t+j,1,1,O);R(px+w,t+j,1,1,O)});
 R(cx-5,t+5,11,1,P.g2);R(cx-5,t+6,11,1,P.s0);R(cx-6,t+5,1,2,O);R(cx+6,t+5,1,2,O);
 // 붉은 술 (표식) — 프레임마다 흔들림
 R(cx+tsx,t-4,2,4,P.r2);R(cx+tsx,t-5,2,1,P.r3);R(cx-1+tsx,t-2,4,1,P.r3);
 R(cx-3,t+6,7,5,P.e4);R(cx-3,t+6,7,1,P.e3);R(cx-3,t+11,7,1,O);
 R(cx-2,t+8,1,2,O);R(cx+1,t+8,1,2,O);R(cx-2,t+10,4,1,P.e1);
 R(cx-5,t+6,2,5,P.s0);R(cx+4,t+6,2,5,P.s0);R(cx-5,t+11,2,1,O);R(cx+4,t+11,2,1,O);
}
function hTorso(cx,t,skirt){
 for(let j=0;j<7;j++){const w=(j<2?9:10),px=cx-(w>>1);R(px,t+7+j,w,1,P.s1);R(px-1,t+7+j,1,1,O);R(px+w,t+7+j,1,1,O)}
 for(let j=t+7;j<t+14;j+=2)for(let i=cx-4;i<cx+5;i+=2)R(i,j,1,1,P.s0);
 R(cx-2,t+9,5,3,P.g1);R(cx-1,t+10,3,1,P.g2);
 R(cx-5,t+12,11,2,P.r2);R(cx-5,t+12,11,1,P.r3);R(cx-6,t+12,1,2,O);R(cx+6,t+12,1,2,O);
 if(skirt!==false)for(let j=0;j<6;j++){const w=11+j,px=cx-(w>>1);R(px,t+13+j,w,1,j<2?P.s2:P.s1);R(px-1,t+13+j,1,1,O);R(px+w,t+13+j,1,1,O)}
 if(skirt!==false){R(cx-6,t+18,12,1,P.v2);for(let i=-4;i<=4;i+=3)R(cx+i,t+15,1,3,P.s0)}
 R(cx-8,t+6,5,4,P.s2);R(cx-9,t+6,1,4,O);R(cx-8,t+5,5,1,O);R(cx-8,t+10,5,1,P.s0);
 R(cx+4,t+6,5,4,P.s2);R(cx+9,t+6,1,4,O);R(cx+4,t+5,5,1,O);R(cx+4,t+10,5,1,P.s0);
}
function hArms(cx,t,hx,hy){ // 양손 그립까지 이어지는 두 팔
 pline(cx+4,t+9,hx-2,hy+1,3,P.s1,null);
 pline(cx-1,t+11,hx-2,hy+2,3,P.s0,null);
}
function hero(anim,n,cx,fy){
 n=n||0;const P0={cx:cx,fy:fy};
 const A={
  idle:[[0,0,'stand'],[0,1,'stand'],[1,1,'stand'],[1,0,'stand']],
  run:[[0,0,'runA'],[1,0,'runB'],[-6,1,'runAir'],[0,0,'runC'],[1,0,'runD'],[-6,-1,'runAir2']],
  jump:[[-2,1,'tuck'],[-3,1,'apex']],fall:[[-1,0,'trail']],land:[[3,0,'land']],
  crouch:[[4,0,'crouch']],hurt:[[1,-1,'hurt']]
 };
 const g=(A[anim]&&A[anim][n])||null;
 if(anim==='down')return heroDown(n,cx,fy);
 if(anim==='climb')return heroClimb(n,cx,fy);
 if(anim==='atk1'||anim==='atk2'||anim==='atk3')return heroAtk(anim,n,cx,fy);
 if(anim==='throw')return heroThrow(n,cx,fy);
 const dy=g?g[0]:0,tsx=g?g[1]:0,lv=g?g[2]:'stand';
 const t=fy-26+dy,hy=t+17;
 hLegs(cx,hy,fy,lv);
 hRope(cx,t);hTorso(cx,t);hHead(cx,t,tsx);
 // 양손 장검 — 이동/피격 중엔 몸 앞에 낮게 든다
 let hx=cx+9,hs=t+9,ang=26,len=15;
 if(anim==='run'){hx=cx+8+(n%3===2?1:0);hs=t+8;ang=30}
 if(anim==='jump'){hx=cx+9;hs=t+6;ang=52}
 if(anim==='fall'){hx=cx+9;hs=t+10;ang=8}
 if(anim==='land'){hx=cx+8;hs=t+11;ang=-14}
 if(anim==='crouch'){hx=cx+8;hs=t+12;ang=4}
 if(anim==='hurt'){hx=cx+7;hs=t+11;ang=64}
 hArms(cx,t,hx,hs);hSword(hx,hs,ang,len);
 if(anim==='land'){dith(cx-13,fy-3,27,4,P.st4,2);R(cx-16,fy-4,4,1,P.st5);R(cx+13,fy-4,4,1,P.st5)}
 if(anim==='run'&&(n===0||n===3))dith(cx-9,fy-3,18,3,P.st3,2);
 if(anim==='hurt'){ // 피격 — 흰 플래시 림 + 튀는 혼
  R(cx-9,t+4,1,16,P.s4);R(cx+9,t+4,1,16,P.s4);R(cx-4,t-6,9,1,P.s4);
  for(let k=0;k<5;k++){const a=rnd()*6.28,rr=9+rnd()*7;R(cx+Math.cos(a)*rr,t+10+Math.sin(a)*rr,2,2,rnd()>.5?P.r3:P.h2)}}
 return P0;
}
function heroClimb(n,cx,fy){
 const t=fy-26,hy=t+17;
 for(let j=0;j<40;j++){const o=(j%6<3)?0:1;R(cx+2+o,fy-34+j,2,1,(j%6<3)?P.e3:P.e2)} // 밧줄
 hLegs(cx,hy,fy,n%2?'climbB':'climbA');
 hRope(cx,t);hTorso(cx,t);hHead(cx,t,n<2?0:1);
 // 한 손은 밧줄, 다른 손은 검 — 양손 장검 표식 유지(검을 겨드랑이에 낀 형태)
 const up=[[-6,-3],[-3,-6],[-6,-3],[-9,-1]][n];
 pline(cx+3,t+9,cx+3,t+up[1]+6,3,P.s1,null);R(cx+2,t+up[1]+4,5,3,P.e4);
 pline(cx-2,t+11,cx+6,t+14,3,P.s0,null);
 hSword(cx+6,t+13,-38,14);
 return{cx,fy};
}
function heroAtk(anim,n,cx,fy){
 const spec={
  atk1:[[0,'brace',cx+6,-22,96,14],[1,'brace',cx+11,-2,-6,17],[0,'stand',cx+9,4,16,16]],
  atk2:[[0,'brace',cx+8,2,-40,15],[1,'brace',cx+11,-4,36,17],[0,'brace',cx+9,0,58,16]],
  atk3:[[0,'brace',cx+5,-24,124,14],[1,'brace',cx+8,-18,80,16],[2,'brace',cx+10,-6,20,17],[1,'brace',cx+9,2,-30,17]]
 }[anim][n];
 const dy=spec[0],t=fy-26+dy,hy=t+17;
 hLegs(cx,hy,fy,spec[1]);
 hRope(cx,t);hTorso(cx,t);hHead(cx,t,dy>0?1:0);
 const hx=spec[2],hs=t+9+(spec[3]>40?-3:1),ang=spec[4],len=spec[5];
 hArms(cx,t,hx,hs);
 // 잔상: 휘두르는 프레임엔 얇은 궤적
 if(anim==='atk1'&&n===1){arc(hx+2,hs+2,13,17,-24,48)}
 if(anim==='atk2'&&n===1){arc(hx+2,hs+2,13,17,10,80)}
 if(anim==='atk3'&&n===2){arc(hx+2,hs+2,14,18,0,72)}
 hSword(hx,hs,ang,len);
 if(anim==='atk3'&&n===3){ // 3단 마무리 — 검기 초승
  arc(hx+1,hs+2,14,21,-50,44);
  glow(hx+14,hs-2,6,[P.g3,P.g1]);
  for(let k=0;k<7;k++){const a=rnd()*6.28,rr=12+rnd()*8;R(hx+3+Math.cos(a)*rr,hs+2+Math.sin(a)*rr,2,2,rnd()>.5?P.g2:P.h2)}
 }
 if(anim==='atk1'&&n===0||anim==='atk3'&&n===0)dith(cx-8,fy-3,17,3,P.st3,2);
 return{cx,fy};
}
function heroThrow(n,cx,fy){
