function glow(gx,gy,r,cols){gx=Math.round(gx);gy=Math.round(gy);

function arcBand(cx,cy,r0,r1,a0,a1,cols){cx=Math.round(cx);cy=Math.round(cy);

   const chunk=(px,py,cw,ch)=>{R(px,py,cw,ch,P.st2);R(px,py,cw,1,P.st4);R(px,py+ch,cw,1,O);R(px-1,py,1,ch,O);R(px+cw,py,1,ch,O)};
   chunk(tx+9,ty+5,7,5);chunk(tx+Math.round(bw*0.42),ty+11,6,4);chunk(tx+Math.round(bw*0.66),ty+7,8,5);
