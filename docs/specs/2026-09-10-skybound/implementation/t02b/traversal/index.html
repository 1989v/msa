<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나루 · 이동 연결 진단</title><link rel="stylesheet" href="./viewer.bundle.css"></head>
<body><main><header><h1>나루의 첫걸음</h1><p>이동 연결 진단</p></header>
<div class="game-stage"><canvas id="viewer" tabindex="0" aria-label="나루 이동 화면. 키보드 또는 왼쪽 스틱으로 이동하고 오른쪽 화면 드래그로 시야를 돌립니다."></canvas>
<div class="touch-controls" aria-label="터치 조작">
  <div id="touch-move" role="group" aria-label="이동 스틱"><span class="stick-knob" aria-hidden="true"></span><span class="stick-label">이동</span></div>
  <span class="look-hint">오른쪽 화면 드래그 · 시야</span>
  <div class="touch-actions"><button id="touch-sprint" aria-pressed="false">달리기<br><small>누르고 유지</small></button><button id="touch-jump">점프</button></div>
</div></div>
<div class="toolbar"><button id="start" disabled>시작</button><button id="reset" disabled>출발점으로</button><p>W A S D 이동 · Shift 달리기 · Space 점프/돛 · 우클릭 드래그 시야 · 휠 확대</p></div>
<p id="status" role="status">지형과 캐릭터를 읽고 있습니다…</p><p class="note">앞쪽 금빛 원에서 돛을 펼쳐 오른쪽 첫 착지대, 이어서 더 낮은 두 번째 착지대로 날아가 보세요. 풀밭과 길의 높이만 반영하며, 나무·바위·유적의 충돌은 아직 없습니다.</p>
</main><script type="module" src="./viewer.bundle.js"></script></body></html>
