<!-- @dsCard group="사태 — 캐릭터" viewport="1600x900" name="01 · 병과 다섯" subtitle="조선 갑사 복식 · 홍팀 · 300px" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>01 · 병과 다섯</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F9F8F2;font-family:'Nanum Myeongjo',serif;color:#1D1D1F}
.paper{position:relative;min-height:100vh;padding:56px 64px 40px}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(29,29,31,.045) 0 1px,transparent 1px 5px)}
.head{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid #1D1D1F;padding-bottom:14px;position:relative}
h1{font-size:34px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{font-size:15px;color:#8A6A50}
.meta{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8A6A50;letter-spacing:.04em}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:40px;position:relative}
.cell{display:flex;flex-direction:column;align-items:center;gap:0}
.art{height:480px;display:flex;align-items:flex-end;justify-content:center}
.base{width:210px;border-top:2px solid #1D1D1F;margin-top:6px}
.nm{font-size:30px;font-weight:800;letter-spacing:.16em;padding-top:14px}
.tag{font-size:13px;color:#8A6A50;padding-top:2px;letter-spacing:.02em}
</style></head>
<body><div class="paper">
<div class="head"><h1>사태 沙汰 — 병과 다섯</h1><span class="sub">2.2등신 · 조선 갑사(전립+두정갑) · 홍팀</span>
<span class="meta">CHAR BOX 200×300 · H=300px</span></div>
<div class="row">
<div class="cell"><div class="art" data-unit="archer"></div><div class="base"></div><div class="nm">궁수</div><div class="tag">각궁의 곡선 · 당겨 조준</div></div>
<div class="cell"><div class="art" data-unit="gunner"></div><div class="base"></div><div class="nm">포수</div><div class="tag">포신의 굵은 사선 · 화승</div></div>
<div class="cell"><div class="art" data-unit="sword"></div><div class="base"></div><div class="nm">검사</div><div class="tag">머리 위 검의 사선</div></div>
<div class="cell"><div class="art" data-unit="spear"></div><div class="base"></div><div class="nm">창병</div><div class="tag">키 1.5배 수직선 · 찌르기</div></div>
<div class="cell"><div class="art" data-unit="shield"></div><div class="base"></div><div class="nm">방패병</div><div class="tag">몸 절반을 가리는 원</div></div>
</div>
</div>
<script src="characters.js"></script>
</body></html>
