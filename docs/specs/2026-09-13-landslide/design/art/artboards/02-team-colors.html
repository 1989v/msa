<!-- @dsCard group="사태 — 캐릭터" viewport="1200x860" name="02 · 팀색" subtitle="궁수 홍/청 — 깃발·허리띠만 다르다" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>02 · 팀색</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F9F8F2;font-family:'Nanum Myeongjo',serif;color:#1D1D1F}
.paper{position:relative;min-height:100vh;padding:56px 64px}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(29,29,31,.045) 0 1px,transparent 1px 5px)}
.head{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid #1D1D1F;padding-bottom:14px;position:relative}
h1{font-size:34px;font-weight:800;margin:0}
.sub{font-size:15px;color:#8A6A50}
.meta{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8A6A50}
.row{display:flex;justify-content:center;gap:120px;margin-top:44px;position:relative}
.cell{display:flex;flex-direction:column;align-items:center}
.art{height:480px;display:flex;align-items:flex-end}
.base{width:230px;border-top:2px solid #1D1D1F;margin-top:6px}
.nm{font-size:26px;font-weight:800;letter-spacing:.14em;padding-top:14px}
.sw{display:flex;align-items:center;gap:10px;padding-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8A6A50}
.chip{width:22px;height:22px;border:2px solid #1D1D1F}
.note{position:relative;margin-top:34px;border-top:1px solid rgba(29,29,31,.25);padding-top:14px;font-size:14px;color:#8A6A50;max-width:760px;line-height:1.7}
</style></head>
<body><div class="paper">
<div class="head"><h1>팀 구분 — 등깃발 + 허리띠에만</h1><span class="sub">갑옷·피부·무기는 팀과 무관</span>
<span class="meta">A 홍팀 #A2231D · B 청팀 #2B4B63</span></div>
<div class="row">
<div class="cell"><div class="art" data-unit="archer" data-team="red"></div><div class="base"></div><div class="nm">홍팀 궁수</div>
<div class="sw"><span class="chip" style="background:#A2231D"></span>연지 #A2231D</div></div>
<div class="cell"><div class="art" data-unit="archer" data-team="blue"></div><div class="base"></div><div class="nm">청팀 궁수</div>
<div class="sw"><span class="chip" style="background:#2B4B63"></span>청자 #2B4B63</div></div>
</div>
<p class="note">두 그림의 차이는 등깃발(배기)의 천과 허리띠 두 면뿐이다. 두정갑·전립·각궁·전통·상모는 동일하다 — 36px 에서도 팀은 등 뒤 깃발의 색면 하나로 읽힌다.</p>
</div>
<script src="characters.js"></script>
</body></html>
