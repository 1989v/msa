<!-- @dsCard group="사태 — 캐릭터" viewport="1400x860" name="04 · 표정 네 컷" subtitle="대기 · 피격 · 매몰 · 승리" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>04 · 표정</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F9F8F2;font-family:'Nanum Myeongjo',serif;color:#1D1D1F}
.paper{position:relative;min-height:100vh;padding:52px 60px}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(29,29,31,.045) 0 1px,transparent 1px 5px)}
.head{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid #1D1D1F;padding-bottom:14px;position:relative}
h1{font-size:34px;font-weight:800;margin:0}
.sub{font-size:15px;color:#8A6A50}
.meta{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8A6A50}
.row{display:flex;justify-content:space-between;gap:20px;margin-top:40px;position:relative}
.cell{display:flex;flex-direction:column;align-items:center}
.art{height:440px;display:flex;align-items:flex-end;justify-content:center}
.base{width:220px;border-top:2px solid #1D1D1F;margin-top:4px}
.nm{font-size:24px;font-weight:800;letter-spacing:.14em;padding-top:12px}
.tag{font-size:13px;color:#8A6A50;padding-top:3px}
</style></head>
<body><div class="paper">
<div class="head"><h1>궁수 — 상태 네 컷</h1><span class="sub">같은 도형, 눈·기울기·묻힘만 바뀐다</span>
<span class="meta">IDLE · HIT · BURIED · WIN</span></div>
<div class="row">
<div class="cell"><div class="art" data-unit="archer" data-h="275"></div><div class="base"></div><div class="nm">대기</div><div class="tag">점 눈 · 조준 자세 유지</div></div>
<div class="cell"><div class="art" data-unit="archer" data-h="275" data-expr="hit"></div><div class="base"></div><div class="nm">피격</div><div class="tag">눈 X · 뒤로 13° 기움</div></div>
<div class="cell"><div class="art" data-unit="archer" data-h="275" data-expr="buried"></div><div class="base"></div><div class="nm">매몰</div><div class="tag">가슴까지 화산재 · 팔만 위로</div></div>
<div class="cell"><div class="art" data-unit="archer" data-h="275" data-expr="win"></div><div class="base"></div><div class="nm">승리</div><div class="tag">활 들어 올림 · 웃는 눈</div></div>
</div>
</div>
<script src="characters.js"></script>
</body></html>
