    body { margin: 0; background: #0A0A0A; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #F9F8F2; }

    .label { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #B38B6D; }
    .display { font-family: 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif; font-weight: 800; letter-spacing: -0.02em; }
    .slab { background: #1D1D1F; border: 1px solid rgba(179,139,109,0.28); border-radius: 0 8px 0 8px; color: #F9F8F2; }
    .chip { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; border: 1px solid rgba(179,139,109,0.4); border-radius: 4px; color: #F9F8F2; font-size: 13px; gap: 8px; background: rgba(29,29,31,0.92); }

    .chip .cost { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B38B6D; }
    .chip.on .cost { color: #F9F8F2; }
    .bar { height: 4px; background: rgba(249,248,242,0.14); border-radius: 2px; overflow: hidden; }
    .bar > div { height: 100%; }
  </style>
