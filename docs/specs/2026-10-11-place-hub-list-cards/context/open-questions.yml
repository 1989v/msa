# answered-default = 인터뷰 없이 권고 기본값으로 스펙에 반영했고 사용자 확인 대기(2026-10-11).
# 뒤집히면 해당 SR 과 tasks.md 를 먼저 고친다.
questions:
  - id: Q1
    stage: pre-impl
    status: answered-default
    question: 허브 카드에서 주소 줄을 빼고 지역 라벨(시도 시군구)로 대신할지
    answer: 뺀다(SR-3.1). 리포트 §3.2 가 개요 자리를 「시군구 라벨 + 상태 배지 + 거리 + 사실 한 줄」로 바꾸라고 했고, 배지 줄이 한 줄 늘어도 카드 높이가 늘지 않으려면 주소 줄이 빠져야 한다. 주소는 상세·데스크톱 사이드 패널에 그대로 있고 길찾기는 좌표·place_id 를 쓴다. 영문 사용자 반응이 나쁘면 en 만 주소를 되살리는 안을 후속으로 둔다
  - id: Q2
    stage: pre-impl
    status: answered-default
    question: 리포트 #5 의 「순위 번호」를 붙일지
    answer: 붙이지 않는다(SR-2.6). 허브는 relevance·distance·eventStart 만 보내고(PlacePage.tsx:502) 관련도·거리 순서의 번호는 인기 순위로 읽혀 가짜 평가 신호가 된다. API 는 saved·clicked 정렬을 받지만(SearchAttractionUseCase.kt:23) 표본이 작아(리포트 §3.2 「운영 7일 92건」) 지금 순위로 쓰면 소음이다. 「많이 찜한 순」 정렬을 허브에 열 때 그 정렬에서만 번호를 붙이는 것을 후속으로 둔다
  - id: Q3
    stage: post-impl
    status: answered-default
    question: 지역 페이지(RegionPage) 카드도 같은 내용으로 바꿀지
    answer: 이번엔 허브만(SR-3.5). 사용자 지적은 허브 목록이고, 판정은 순수 함수 cardFacts 하나라 지역 페이지가 따라오는 데 드는 비용은 마크업뿐이다. 허브 배포 실측이 끝난 뒤 같은 함수로 옮기는 후속 스펙으로 한다
  - id: Q4
    stage: post-impl
    status: answered-default
    question: 거리 앞에 「내 위치에서」 같은 기준점 문구를 붙일지
    answer: 붙이지 않는다(SR-2.4). 허브 geo 는 내 주변·지도 영역(이 지역 검색)·제안 선택 셋에서 오고(PlacePage.tsx:1432-1467) GeoState 가 출처를 들고 있지 않다. 출처를 상태에 더하면 허브 상태 복원(placeHubState)까지 바뀐다. 표기만 서버 렌더와 같은 distanceLabel 로 맞춘다
  - id: Q5
    stage: post-impl
    status: answered-default
    question: 절 이동 줄에 현재 절 강조(스크롤 스파이)를 넣을지
    answer: 넣지 않는다(SR-5.4, YAGNI). 이동 기능만으로 리포트 #10 을 채운다. 이동 링크 클릭 원장(SECTION_JUMP)을 보고 쓰임이 확인되면 후속으로 한다
  - id: Q6
    stage: post-impl
    status: answered-default
    question: 허브·지역 프리렌더 목록에도 지역 라벨을 넣을지
    answer: 이번엔 넣지 않는다(SR-7.3). 프리렌더 목록은 카드가 아니라 크롤용 제목 링크이고, 휴무 배지는 오늘 기준이라 빌드 시점에 굳힐 수 없다. 지역 라벨은 정적이라 넣을 수 있지만 색인 가치 판단이 따로 필요하다
  - id: Q7
    stage: pre-impl
    status: answered-default
    question: 하단 행동 바·이동 줄을 켜는 폭 — 640px 이하인가, 허브 모바일 기준 899px 이하인가
    answer: 640px 이하(SR-4.1). 상세 머리띠가 sticky 로 바뀌는 폭이 640 이고(PlacePage.css:872-886) 그 위 폭은 행동 줄이 사이드 열과 함께 보여 바가 덜 필요하다. 641–899 태블릿 실측에서 길찾기가 자주 화면 밖이면 넓힌다
  - id: Q8
    stage: pre-impl
    status: answered-default
    question: 행동 바 클릭을 새 섹션(ACTION_BAR_*)으로 낼지, 기존 섹션 + payload 위치 키로 낼지
    answer: 기존 섹션 + payload.source 'action_bar'(SR-6.2, 키 이름은 Q17). 새 섹션을 행동마다 만들면 인기 집계 제외 목록이 행동 수만큼 늘고, 섹션 하나(ACTION_BAR)로 묶으면 중복 키가 같아 같은 view 의 두 번째 행동이 버려진다. 대가는 같은 view 에서 행동 줄과 바의 같은 행동이 하나로 접히는 것이고, SHARE 채널과 같은 「view 당 첫 위치」 규칙으로 읽는다. 전화·절 이동은 기존 섹션이 없어 PHONE·SECTION_JUMP 를 새로 만들고 집계에서 뺀다(SR-6.3·6.4)
# 아래 Q9~Q20 은 리뷰 심판(context/review-verdict.md 「사용자 판단 목록」 1~11, + U-7) 권고 기본값이다(2026-10-11).
  - id: Q9
    stage: post-impl
    status: answered-default
    source: review-verdict 사용자 판단 11 (A3·D-4·보안 참고)
    question: 인기 집계 제외를 거부 목록(POST_SELECTION_SECTIONS)으로 둘지, 허용 목록(목록 선택 섹션만 센다)으로 바꿀지
    answer: 이번 범위는 거부 목록을 유지하고 PHONE·SECTION_JUMP 만 더한다(SR-6.4). 집계가 화면 종류로 거르지 않아 상세에 섹션이 생길 때마다 같은 추가가 필요하고 테스트 리터럴도 다섯 곳씩 바뀐다 — 허용 목록 전환 검토를 ADR-0095 같은 줄과 여기에 기록만 하고, 다음에 상세 섹션을 더할 때 판단한다
  - id: Q10
    stage: pre-impl
    status: answered-default
    source: review-verdict 사용자 판단 1 (D-1, BLOCK)
    question: 카드에 붙는 배지 목록의 이름
    answer: 「카드 상태 배지」. search/glossary.md:94 의 「배지 줄」은 상세 방문 요약 뒤 visit-badges 라 같은 이름을 쓰면 충돌한다. spec·tasks·k-heritage 견본·DESIGN.md 표는 새 이름을 쓰고 CSS 클래스 .place-card-badges 는 유지한다. glossary 항목 추가는 TG5.3
  - id: Q11
    stage: pre-impl
    status: answered-default
    source: review-verdict 사용자 판단 2 (D-2, BLOCK)
    question: 무장애 배지를 어느 코드에서 붙일지
    answer: 목록 필터와 같은 정밀 3종(WHEELCHAIR·ELEVATOR·RESTROOM) 중 하나 이상일 때만(SR-2.3). 판정은 placeAttributes.ts 의 BARRIER_FREE_CHIPS 코드로 하고 사본을 만들지 않는다. 문구 ko 「무장애 시설」, en 「Accessible facilities」(영문 원천은 0 이라 실제로는 안 나온다). 회귀 주입 R4b 로 「아무 코드」 되돌림을 잡는다
  - id: Q12
    stage: pre-impl
    status: answered-default
    source: review-verdict 사용자 판단 3 (U-3)
    question: 오늘 정기휴무 배지 문구
    answer: 「오늘은 정기휴무일 / Regular closing day today」, 접근성 이름에 「매주 {요일} 휴무 규칙 기준」을 붙인다(SR-2.3). 요일 규칙만 보고 명절 휴무를 모르므로 단정하지 않는다
  - id: Q13
    stage: post-impl
    status: answered-default
    source: review-verdict 사용자 판단 4 (U-1)
    question: 「눈에 띄게 바뀌었다」의 완료 조건
    answer: ko·en 각각 고정 질의 첫 10장에서 카드 상태 배지·지역 라벨·찜이 붙은 카드 수를 잰다. 같은 관광지 id 8장의 배포 전·후 캡처를 남긴다(SR-8.2, TG1.1·6.4). en 배지 카드가 3/10 미만이면 사용자에게 다시 묻는다
  - id: Q14
    stage: pre-impl
    status: answered-default
    source: review-verdict 사용자 판단 5 (U-2)
    question: 상한 3 안의 배지 순서
    answer: 휴무 → 무료 → 반려 → 무장애 → 주차(SR-2.3). 주차를 맨 뒤로 내려 사용자 스토리 2(반려·휠체어 동반)의 조건이 먼저 잘리지 않게 한다. 켠 칩과 같은 배지를 앞당기는 연동은 하지 않는다(YAGNI). TG1.3 축별 채움률로 무엇이 잘리는지 본다
  - id: Q15
    stage: pre-impl
    status: answered-default
    source: review-verdict 사용자 판단 6 (I6.1)
    question: 절 이동 줄 위치
    answer: 스펙대로 .place-detail-first 뒤(SR-5.1). 요약·가는 법은 그 안에 있어 위로 거슬러 가는 이동임을 명시하고 수용한다. 행동 줄 바로 뒤로 옮기는 안은 폴드 재측정이 따라와서 택하지 않는다
  - id: Q16
    stage: pre-impl
    status: answered-default
    source: review-verdict 사용자 판단 7 (I1·U-7)
    question: 바 공유 칸을 어떻게 맞출지
    answer: (a)안 — 공용 SharePanel 은 고치지 않고 바 범위 CSS(.place-action-bar .share-panel__btn)로만 덮는다. SharePanel 의 role=group 중첩은 허용한다. 칸 글자는 SharePanel 그대로(share 「공유」, copy 「링크 복사」). 대비·포커스 링은 SR-8.3 에서 잰다
  - id: Q17
    stage: pre-impl
    status: answered-default
    source: review-verdict 사용자 판단 8 (A2·D-3)
    question: 행동 바 위치를 나르는 payload 키 이름
    answer: 기존 어휘 payload.source 'action_bar'(카드 source 'card'·지도 source 'map' 과 같은 키). placement 는 광고 지면(AdSlot placement)·common Placement 와 이름이 겹쳐 쓰지 않는다
  - id: Q18
    stage: post-impl
    status: answered-default
    source: review-verdict 사용자 판단 9 (U-4)
    question: 지역 라벨을 meta 줄에 둘지 주소 줄 자리로 옮길지
    answer: meta 줄에 유지하고 390 지역 라벨 clientWidth ≥ 48px 을 완료 조건에 넣는다(SR-3.2·8.2). 미달이면 주소 줄 자리로 옮긴다
  - id: Q19
    stage: pre-impl
    status: answered-default
    source: review-verdict 사용자 판단 10 (I8.2)
    question: 넘친 배지를 어떻게 다룰지, 계측 badges 의 뜻
    answer: 상한 3 유지(SR-3.3). 계측 payload.badges 는 「cardFacts 가 낸 배지」로 정의한다(SR-6.1) — 폭 때문에 화면에서 숨은 것도 포함
  - id: Q20
    stage: post-impl
    status: answered-default
    source: review-verdict U-7 (찜 수 신선도)
    question: 카드 찜 수에 기준일을 표기할지
    answer: 표기하지 않는다(SR-2.5). 검색 응답 시점 값이고 색인 갱신 주기 안의 차이라 카드 한 줄을 늘릴 이득이 없다
