questions:
  - id: course-expansion-short-landscape-inset
    category: test-discovery
    status: closed
    question: "844×390 화면에서는 native 빨리감기 아래쪽(52 CSS px)이 미니맵 배경 시작점(43.9 CSS px)과 겹친다. 렌더 레이아웃에서 어떻게 여백을 확보할 것인가?"
    decision: "실제 캔버스 스케일로 필요한 상단 여백을 계산해 미니맵의 표시 영역을 조정하고, 전체 코스 매핑과 하단 경계를 유지한다. 물리/결과는 바꾸지 않는다."
    evidence: "2026-10-13 fresh review: main.js top+8/44px, art.js logical panel start y=162; short-landscape regression test and local screenshot pending"
    resolution: "후속 사용자 지시가 FF 제어 자체를 제거하므로 이 FF 겹침 발견은 superseded. 수정 완료를 주장하지 않는다. 최종 메뉴/HUD/미니맵 겹침은 새 UI 요구와 로컬 검증에서 확인한다."
  - id: course-expansion-menu-canvas-width
    category: test-discovery
    status: closed
    question: "844×390에서는 캔버스 폭이 292px인데 열린 메뉴 최대 폭은 iframe 기준 360px이라 긴 이름 명단에서 미니맵을 덮을 수 있다."
    decision: "캔버스의 실제 미니맵 왼쪽 경계와 여백을 기준으로 메뉴 최대 폭을 제한한다. 긴 이름 12명으로 메뉴를 열고 실제 경계 및 아래쪽 조작의 도달 가능성을 확인한다. 물리와 코스는 유지한다."
    evidence: "verifications/course-expansion-ui/replay-measure.json: 844×390, canvas292px, 12 distinct 12-character names, opened menu right538.36px < minimap left546.37px; participant-edit action bottom329px < menu bottom346px. Native max-width/height assertions also pass."
    resolution: "fit() restricts width to actual canvas area before minimap, with an 8px gap; bounded scrolling keeps all menu actions reachable. No physics/map changes."

  - id: entrance-cascade-start-x
    category: test-discovery
    status: closed
    question: "새 폭포 분기 입구의30시드 출발-x/등수 표본rho=-0.2667이 기존 조사선abs0.20을 넘는다. 60시드에서도 지속되는가?"
    decision: "다른 완료된 검증을 반복하지 않고 폭포만60시드 표본을 조사한다. 지속되면 승인된 대칭 분기 입구의 치수를 조정하고 영향받는 폭포 완주/재현/스케줄/geometry만 다시 확인한다. 물리/spawn/downstream/기준값 변경 없음."
    resolution: "세 초기 시안과 B1의 조사선 초과 후 튜닝 중단. 부모 승인으로 폭포 원본 hopper 보존; 최종60시드 rho=-0.06060092406529045는 원본 baseline과 동일. 최종 geometry/완주/재현/스케줄 통과."
    evidence: "verifications/entrance-cascade-investigation.json, entrance-cascade-baseline.json, entrance-cascade-matrix.json; entrance-variation.md"
