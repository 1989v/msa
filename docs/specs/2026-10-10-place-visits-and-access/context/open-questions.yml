questions:
  - id: Q1
    stage: post-impl
    status: open
    owner: user
    question: 관광지 단위 방문량 원천 — 한국관광 데이터랩 관광지별 내비게이션 검색 건수(T맵)의 공개 API 유무·이용 조건 확인, 필요하면 활용신청
    answer: 확인 전에는 SR-8 을 하지 않는다. 집중률(관광지별 자기 최대=100)·연관(순위만)으로 대신 만들지 않는다(권고)
  - id: Q2
    stage: post-impl
    status: open
    owner: user
    question: 관광공사 지역별 관광 수요 강도(15151868) 활용신청 여부
    answer: 이번 범위 밖. 지수라 「방문량」 이름과 맞지 않는다(권고 — 보류)
  - id: Q3
    stage: pre-impl
    status: open
    question: 두 원천 파일을 로그인 없이 고정 주소로 받을 수 있나, 갱신 때 주소가 바뀌나
    answer: TG0.2 실측. 바뀌면 env 두 줄을 연 1회 사람이 고친다. 로그인이 필요하면 사용자가 받아 Object Storage(PAR 읽기 전용)에 올리고 잡이 거기서 받는다(권고)
