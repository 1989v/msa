    recommended_default: 이번 슬라이스 밖으로 미룬다. 구현 뒤 등록 여부를 묻는다
    applied_in: 없음(보류)
    status: answered-default
  - id: J10
    stage: pre-impl
    source: review-verdict T-3
    question: k8s 매니페스트 단언 테스트를 레포에 커밋할지
    recommended_default: 커밋한다(선례 datagokr_test.py). place/ingest/tests/crawl_stats_k8s_test.py
