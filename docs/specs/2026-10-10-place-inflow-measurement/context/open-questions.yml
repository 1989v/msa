  - id: J8
    stage: pre-impl
    source: review-verdict U-1
    question: 검색 유입과 커뮤니티 유입을 나눌지
    recommended_default: 채택. search_*·community_* 로 나누고 리터럴 호스트 표로 검증한다(T-5)
    applied_in: spec.md SR-9, tasks.md 8.7
