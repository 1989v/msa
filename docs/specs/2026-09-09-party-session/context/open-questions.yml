# hns:spec-evolution 분류. pre-impl = 구현 전에 답이 필요한 것
spec: 2026-09-09-party-session
revised: 2026-09-09   # 6차원 리뷰로 넷이 닫혔다

closed:
  - id: OQ-1
    q: "판 사이 대기가 릴레이 유휴 종료(90초)에 안 걸리는가"
    a: "걸리지 않는다. 클라이언트가 25초마다 ping 하고(echo-duel/index.html:409) 서버는 모든 메시지에서
        lastSeenMs 를 갱신한다(GameRelayRegistry.kt:137). 판 사이를 끊는 것은 유휴가 아니라
        로비 30초 강제 시작이었다 — 위험의 실체가 초판이 적어 둔 곳과 달랐다"
    by: implementation·architecture 리뷰
  - id: OQ-4
    q: "명부 규약을 확장할 때 버전을 어떻게 올리나"
    a: "**올리지 않는다.** 초판은 「v1 파서가 알 수 없는 키를 무시하니 새 필드는 조용히 버려진다」로
        닫았는데 **그것이 반대였다** — party.js:33 과 party.ts:49 가 `p.v !== 1` 이면 인계를 통째로
        null 로 버린다. v 를 2로 올리면 새 필드가 무시되는 게 아니라 배포된 게임에서 인계가 죽어
        **참가자 이름을 다시 입력하는 화면**이 뜬다. 확장은 `v:1` 유지 + 선택 필드 가법 추가뿐이다(SR-8.2)"
    by: implementation·domain 리뷰 (초판의 오답을 정정)
  - id: OQ-5
    q: "결정적 재생이 브라우저 사이에서도 같은가"
    a: "같지 않다. physics.js:172,193 의 Math.sin/cos 는 ECMAScript 가 정밀도를 규정하지 않아
        JSC·V8 이 마지막 비트에서 갈리고, 그 값이 로터·시소 충돌 기하로 초당 240스텝 들어간다.
        세 코스 전부 해당한다. **사용자 결정(D11): 호출부 2곳을 정수 양자화 룩업으로 교체.**
        post-impl 관측으로 미뤘다면 되돌리는 비용이 가장 큰 지점에서 터졌을 것이다"
    by: implementation 리뷰 + 사용자
  - id: OQ-6
    q: "참여형을 새 장르로 만드나"
    a: "아니다. Genre.kt:4-5 가 「다중 성격은 tags 가 담당하고 genre 는 항상 단일이다」로 못박아 뒀다.
        장르로 만들면 기존 결정자 장르와 배타가 되어 [게임 픽] 의 합집합이 깨진다. **태그 축으로 간다**"
    by: architecture·domain 리뷰

  - id: OQ-8
    q: "회원 탈퇴를 game_db 가 아는 채널을 무엇으로 하나"
    a: "**member 가 game 의 내부 API 를 동기 호출한다** + 보존 스윕이 그물. Kafka 를 안 쓴 이유는
        member 에 outbox·브로커 배선이 없어서고, 소비자가 늘면 그때 옮긴다.
        **실패해도 탈퇴는 성립하고 그 보장은 서비스에 있다** — 어댑터도 삼키지만 그건 그 구현의
        규율일 뿐이라 다른 어댑터를 끼우면 탈퇴가 남의 서비스 가용성에 묶인다(검사가 잡았다)"
    by: TG3 구현

questions:
  - id: OQ-2
    stage: pre-impl
    q: "원그리기 정확도의 채점식을 무엇으로 정하나"
    why: "서버 채점이라 식이 서버에 있어야 한다. 후보 — 중심 추정 후 반지름 표준편차 / 목표 원과의
          최대 이탈 / 면적 대칭차. **선정 기준에 「위조 궤적이 그 식에서 만점을 받는가」를 넣는다**
          (보안 리뷰) — 개연성 검사와 식이 서로를 보완해야 한다"
    blocks: SR-7.4
  - id: OQ-3
    stage: pre-impl
    q: "걸리는 인원 수와 비율을 결정자 3종이 각각 어떻게 실현하나"
    why: "지금은 카드 뽑기만 「여러 명 뽑기」가 있고, 구슬의 rank 는 등수 지목이지 인원 수가 아니며,
          사다리는 입력 자체가 없다. 비율은 구슬=구슬 개수·카드=장수가 자연스럽지만 사다리는
          한 사람이 여러 줄을 갖는 형태가 되어 **화면에 이름이 여러 번 나온다** — 그것이 받아들일 만한지"
    blocks: SR-3.6, SR-3.7
  - id: OQ-7
    stage: pre-impl
    q: "관전자를 릴레이에 어떻게 담나"
    why: "지금 join 은 예외 없이 좌석을 주고 시작 신호는 좌석 전체를 참가자로 내보낸다.
          관전자가 12석을 채우면 참가자가 못 들어온다. 좌석 배열 밖의 별도 목록인가, 좌석 −1 인가 —
          어느 쪽이든 시작 신호의 참가자 목록에서 빠져야 한다"
    blocks: SR-4.6
  - id: OQ-9
    stage: pre-impl
    q: "참여형 2종을 정수 결정적 코어(game:sim) 위에 지을 것인가"
    why: "game:sim 은 jvm + js 타깃을 갖고 Tier B 재실행 검증이 이미 붙어 있다. 참여형은 서버 채점이라
          결정적 재생이 필요 없지만, 코어 위에 지으면 채점이 Tier B 로 자연스럽게 붙는다.
          안 쓰면 채점 산식이 서버·클라이언트 두 벌이 된다. **js 소비는 아직 배선 전이라 그 비용을
          알고 골라야 한다**"
    blocks: SR-7.2
