# Kotlin 컴파일 데몬 힙.
#
# 이 값이 없으면 48개 모듈을 기본 힙으로 컴파일하다 GC 가 시간의 대부분을 쓰고
# `OutOfMemoryError: GC overhead limit exceeded` 로 끝난다. 힙이 꽉 차서 죽는 게 아니라
# 경계에 걸쳐 있어서, 같은 성격의 커밋인데 어떤 건 통과하고 어떤 건 죽었다.
# 컴파일러가 에러 밑에 직접 지목한 값이다("Try to increase it via 'gradle.properties'").
kotlin.daemon.jvmargs=-Xmx3g

# Gradle 데몬 힙. CI 는 --no-daemon 이라 매번 새 JVM 이 뜨고, ArchUnit 구조 검증
# (verifyArchitecture)이 전 모듈 바이트코드를 읽어 기본 힙으로는 빠듯하다.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
