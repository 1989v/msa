# ADR-0056 로컬 검색 파이프라인 검증용 경량 인프라 (k3d 대신).
# k8s/infra/local 의 MySQL/Kafka/OpenSearch(nori)/Redis 설정을 호스트 bootRun 용으로 정렬.
#   docker compose -f tools/local-infra/docker-compose.yml up -d
name: msa-geo-infra
services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3316:3306"   # product master
      - "3317:3306"   # product replica (동일 인스턴스)
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnamilegacy/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka

  opensearch:
    image: opensearchproject/opensearch:3.3.0
    command:
      - bash
      - -c
      - |
        if ! /usr/share/opensearch/bin/opensearch-plugin list | grep -q analysis-nori; then
          /usr/share/opensearch/bin/opensearch-plugin install --batch analysis-nori
        fi
        exec /usr/share/opensearch/opensearch-docker-entrypoint.sh opensearch
    environment:
      discovery.type: "single-node"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
      cluster.name: "commerce-local"
    ports:
      - "9200:9200"
    volumes:
      - os-data:/usr/share/opensearch/data

volumes:
  mysql-data:
  kafka-data:
  os-data:
